闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股收跌，但存储芯片股走高，闪迪收涨近9%，芯片指数重返牛市，光通信股Coherent涨近8%；中东风险推动原油盘中涨3%；30年期美债收益率创2007年来新高；离岸人民币盘中涨破6.74、创三年多新高。\n\n特朗普：不着急结束伊朗战争，不寻求延长美伊谅解备忘录，伊方“不会达成我认为必要的那种协议”，若阿曼阻碍谈判、将“狠狠轰炸”。\n\n6月中日领衔海外抛售美国国债，中日英三大“债主”均减持，中国持债创2008年来新低。\n\n李强：及时谋划出台务实管用的增量政策，破除各种堵点卡点，推动经济持续向新向优向好发展。\n\n中国7月规上工业增加值同比增速放缓至4.5%；7月社零同比增速放缓至0.6%；1-7月城镇固定资产投资同比降6.7%；1-7月房地产开发投资同比降19.2%，新建商品房销售额降13.1%。\n\n两部门发布“十五五”油气规划：2030年国内油气供应量将达4.4亿吨油当量；研究完善成品油消费税制度，完善成品油定价机制。\n\n国家发改委部署加快推进2026年新型政策性金融工具投放工作，加大对民间投资项目支持力度。\n\n投资大佬德鲁肯米勒两年来首次买入中概股，大举加仓亚马逊、新进AMD，清仓博通、英特尔、美光。\n\n英伟达OpenAI数据中心担保上限为1050亿美元，较原方案缩水过半。\n\n报道：Anthropic 7月年化营收超650亿美元，较去年底增超7倍；内部预计2028年营收高达2000","tags":[],"cluster_size":2,"ts":"2026-08-17T23:10:41"},{"id":20491,"title":"年内289只基金提前结束募集，同比增长逾17%","url":"https://wallstreetcn.com/livenews/3150722","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月17日，在农银沪深300质量ETF、宝盈裕安增利6个月持有期债券等多只基金公告发行提前收官后，今年以来宣布提前结束募集的基金数量已达289只，同比增长逾17%。在受访人士看来，这一由权益类基金与含权类债券基金主导的“抢跑”现象，折射出资金借道公募产品加速流入权益市场的信号。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:47:34"},{"id":20492,"title":"A股中期分红热度攀升，千亿元真金白银回馈投资者","url":"https://wallstreetcn.com/livenews/3150721","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月17日17时，A股共有124家上市公司发布现金分红的2026年半年度利润分配方案，合计拟派发现金红利1018.85亿元（含税）。其中，中国移动以拟派现544.26亿元（含税）的金额高居榜首，宁德时代、海康威视紧随其后，拟派现金额均超50亿元（含税）。从行业看，化工板块最为踊跃，机械设备、电子等紧随其后。整体看，上市公司回报股东意愿显著增强，现金分红意愿较强。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:45:14"},{"id":20493,"title":"提振投资者信心，多家券商权益分派实施中","url":"https://wallstreetcn.com/livenews/3150720","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月份，上市券商2025年年度权益分派实施进入尾期。截至8月17日发稿时，8月以来包括东吴证券、申万宏源、中金公司在内的8家上市券商（含券商母公司）发布分红相关公告，已完成2025年年度权益分派或明确实施日期，金额合计98.09亿元。在业内人士看来，在经营业绩稳健增长与监管层持续强化回报导向的双重驱动下，证券公司正积极践行“以投资者为本”理念，通过提高分红频率、优化分红预案等方式，切实将经营成果转化为股东可获得的实际回报，进一步增强投资者的持有信心与获得感。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:44:09"},{"id":20494,"title":"PCB产业链半年报亮眼，高端产品供需偏紧或延续至2028年","url":"https://wallstreetcn.com/livenews/3150716","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，多家PCB产业链企业披露2026年半年报，大多数公司营收、净利润实现较快增长。梳理发现，AI算力需求增长、产品结构升级及产能释放等成为推动企业业绩增长的重要因素。与此同时，当前PCB行业仍处于结构性涨价过程中，高阶HDI、高多层PCB等高端产品持续处于供需偏紧状态。展望后市，有行业人士表示，AI服务器持续迭代、ASIC加速器加快放量将继续支撑高端PCB需求，而高端产能释放仍需要时间，预计高端PCB供需偏紧格局或延续至2028年。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:26:41"},{"id":20495,"title":"主动退出与被动处置并行，今年以来多家中小券商股权被摆上“货架”","url":"https://wallstreetcn.com/livenews/3150714","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，开源证券的一笔股权转让引发关注。开源证券的中小股东西安曲江文化金融控股（集团）有限公司，将其持有的开源证券股份（4784.60万股）全部挂牌转让，转让底价2.10亿元。据统计，今年以来，东海证券、大通证券等多家中小券商股权被摆上转让“货架”。中小券商股权流转的背后，是主动退出与被动处置两条主线并行。主动退出方面，股东财务状况是驱动因素之一。被动处置方面，股东债务触发司法拍卖的案例持续增加。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:21:10"},{"id":20496,"title":"权益类公募仓位再抬升，电子行业获增持幅度最大","url":"https://wallstreetcn.com/livenews/3150711","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期A股市场震荡分化，权益类公募基金在保持较高仓位的同时，行业配置进一步调整。数据显示，截至8月14日，公募权益类基金整体仓位升至94.42%，较前一周提高0.08个百分点，保持历史中位偏高水平。从行业变化来看，电子成为当周主动增持幅度最大的行业，而通信、电力设备、建筑材料等板块受到不同程度的主动减持。","tags":[],"cluster_size":1,"ts":"2026-08-17T22:17:29"},{"id":20497,"title":"嘉吉年度收益上升，市场波动利好交易业务","url":"https://wallstreetcn.com/livenews/3150706","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美国最大的私营企业嘉吉公司（Cargill）报告年度调整后收益上升，这家粮食贸易商在地缘政治动荡引发的市场波动中获益。经审计年度账目显示，这家总部位于明尼阿波利斯的公司报告，截至5月31日的财年中，调整后营业利润同比增长10%至38亿美元。由于资产减值和重组费用等一次性项目，净利润出现下滑。该公司还将支付给股东的股息缩减至8.65亿美元，而去年曾创下近15亿美元的历史最高分红纪录。营收同比增长6.5%至1640亿美元。（彭博）","tags":[],"cluster_size":1,"ts":"2026-08-17T22:05:39"},{"id":20498,"title":"纳斯达克生物科技指数收涨超1.4%，时隔多日再创历史新高。\n\n成分股4D Molecular涨19.44%，Argenx ADR涨16.04%，OmniAb涨1","url":"https://wallstreetcn.com/livenews/3150702","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克生物科技指数收涨超1.4%，时隔多日再创历史新高。\n\n成分股4D Molecular涨19.44%，Argenx ADR涨16.04%，OmniAb涨13.02%，ARS Pharmaceuticals涨10.44%，Kyverna Therapeutics涨9.55%。\n\nEvolus收跌4.72%，Neumora Therapeutics跌5%，W :06"},{"id":20797,"title":"Groq 再出发：转型 Neocloud，以 35 亿美元估值完成 3.5 亿美元 A 轮融资","url":"https://www.ithome.com/0/990/912.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c399\"\u003eIT之家 8 月 18 日消息，初创企业 Groq 去年 12 月与 NVIDIA（英伟达）签署了一份价值 200 亿美元的非独家技术许可协议，向芯片巨头提供 LPU 推理加速 ASIC 授权\u003cstrong\u003e。Groq 此后从 AI 芯片开发者转型为新兴 AI 云服务供应商\u003c/strong\u003e，也就是俗称的 \"Neocloud\"。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"b89b\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/51460cdb-7e10-4e9c-b188-59bdbe4ff10f.png?x-bce-process=image/format,f_auto\" w=\"960\" h=\"240\" data-weibo=\"0\" data-vmark=\"03b5\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"5b08\"\u003e而在美国当地时间 8 月 17 日，Groq 宣布以 35 亿美元\u003cspan class=\"exch-money-value\"\u003e（IT之家注：现汇率约合 236.36 亿元人民币）\u003c/span\u003e估值完成 3.5 亿美元 A 轮融资。本轮融资由 Disruptive 领投，","tags":[],"cluster_size":1,"ts":"2026-08-18T01:19:02"},{"id":20798,"title":"OpenAI 前高管：相信 AI 能治愈所有疾病，但光靠大模型远远不够","url":"https://www.ithome.com/0/990/910.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c90e\"\u003eIT之家 8 月 18 日消息，曾任 OpenAI 高管、同时也是生物医药初创公司 ChronicleBio 联合创始人的 Fidji Simo 表示，她相信人工智能最终能够治愈所有疾病，但仅仅让 AI 模型变得更加智能，并不足以实现这一目标。\u003c/p\u003e\u003cp data-vmark=\"c815\"\u003eSimo 当地时间周一在 X 上回应了 Anthropic CEO Dario Amodei 此前的言论。Amodei 周末表示，AI 企业需要真正取得具体的突破，才能赢得对这项技术持怀疑态度的公众的认可。\u003c/p\u003e\u003cp data-vmark=\"c54d\"\u003eSimo 写道：“我在很多事情上都不同意 Dario 的观点，但这句话完全正确：‘现阶段，说 AI 将治愈癌症，与其说令人振奋，不如说已经变成了一句陈词滥调，而且大多数人认为这种说法具有欺骗性。真正有效的方式，是实际治愈癌症。’”她引用了 Amodei 的原话。\u003c/p\u003e\u003cp data-vmark=\"2e37\"\u003eAmodei 的这番言论，是他为 Anthropic 对 AI 未来发展的判断进行辩护的一部分。上周六，他反驳了外界关于自己过于悲观看待 AI 潜在收益的说法。他表示，AI 行业之所以遭到公众质疑，是因为企业过去做出了许多宏大的承诺，却没有兑现。\u003c/p\u003e\u003cp data-vmark=\"5a26\"\u003e","tags":[],"cluster_size":1,"ts":"2026-08-18T01:09:19"},{"id":20799,"title":"8月18日国际晨讯丨Anthropic“年化营收”超650亿美元 纳斯达克拟于12月启动“23小时交易” - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPbTFGS FBVV95cUxNZHNKOUgxdWVzWHJMay13Q1JSSXFVbzVnNWhJUjJvUUpSZl9CZEpVcWEtUWcyUTVyUWtWWkdVMEpjdjE3OXJFSlJwOGJqalhJR3pibmpRUFR3TFhjVU4yWFZVX21jVFVSZzR5Y003WW1ITG5DR2Y2UXRpeXpIZ3hfRFFyaVhfaWU1Tk1aSTl3X1hpbnNXb2g3dk5EUzdYczJ2WlNfS3V6VF8tb3ZxbTBYOXpRZ1lodw?oc=5\" target=\"_blank\"\u003eLG targets Q1 2027 launch for humanoid robot based on Nvidia Isaac GR00T\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTelecompaper\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-17T05:36:40"},{"id":20670,"title":"Ensuring Safe Physical AI in Urban Mobility via Hazard-Informed Synthesized Envelopes","url":"https://arxiv.org/abs/2608.14481","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14481v1 Announce Type: new \nAbstract: As heterogeneous robotic systems deploy across diverse urban zones, maintaining safety amid complex human-robot interactions remains a critical challenge. We present a unified framework that bridges systematic hazard analysis and runtime enforcement using hazard-informed safety envelopes. Rather than treating safety as a static constraint isolated within individual software modules, we introduce a cross-layer safety transformation process spanning symbolic, spatial, and dynamic world models. We show how this representation naturally interfaces w","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20669,"title":"Expected Free Energy-based Informative Path Planning for Robotic Mars Exploration","url":"https://arxiv.org/abs/2608.14466","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14466v1 Announce Type: new \nAbstract: An autonomous robot efficiently exploring an unknown environment, such as looking for water sources on Mars, faces two simultaneous demands: building an accurate information map while quickly finding the regions of greatest value, and paying for every meter of travel and the cost of every measurement it takes. Classical information-seeking and reward-seeking criteria address only one of these objectives at a time. Here, we propose Expected Free Energy (EFE), the principled action-selection objective from active inference, as a unifying criterion","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20668,"title":"THRIVE: Therapeutic Humanoid Robot In Virtual Environment","url":"https://arxiv.org/abs/2608.14462","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14462v1 Announce Type: new \nAbstract: This paper presents THRIVE (Therapeutic Humanoid Robot In Virtual Environment), an at-home rehabilitation platform that integrates a suite of virtual-reality upper-body rehabilitation games, a real-time camera-based motion-tracking system, and a socially interactive robot therapist. The system is designed for therapy and intervention in children with upper-limb motor impairments, which can be improved through consistent, task-specific practice. THRIVE features a set of newly designed, engaging games that target functional reaching, grasping, and","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20667,"title":"Effect of Twisted-Yarn Architecture on Pressure and Proximity Sensing Characteristics of Textile Capacitive Sensors for Robotic Skin","url":"https://arxiv.org/abs/2608.14406","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14406v1 Announce Type: new \nAbstract: Textile-integrated capacitive sensors offer flexible and conformable tactile sensing for wearable electronics and human-robot interaction; however, the influence of yarn-level architecture on capacitive transduction characteristics remains insufficiently quantified. This work presents a textile capacitive sensing platform based on silver-coated yarns coated with polydimethylsiloxane and assembled into one-, two-, and four-layer twisted configurations. The influence of effective electrode overlap area and inter-fiber separation on the capacitive","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20666,"title":"Reflex: Enabling Fast and Predictive Vision-Language-Action Models for Reaction-Critical Manipulation","url":"https://arxiv.org/abs/2608.14379","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14379v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have recently achieved promising performance in robotic manipulation. However, existing benchmarks mainly evaluate generalization on static manipulation tasks and largely overlook dynamic interaction scenarios. To address this gap, we present ReflexBench, a benchmark for reaction-critical manipulation. ReflexBench contains six dynamic tasks and introduces an evaluation framework that decouples simulator stepping from robot control while supporting configurable latency under synchronous and asynchronous inferen","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20665,"title":"PRM-as-a-Judge 1.5: A Toolkit for Robot Process Assessment","url":"https://arxiv.org/abs/2608.14284","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14284v1 Announce Type: new \nAbstract: Fine-grained robotic evaluation matters for understanding embodied models, going beyond binary success rates and rule-based process scores. We present PRM-as-a-Judge 1.5, a toolkit for robot process assessment that turns rollout videos into dense progress curves and derives multiple fine metrics. PRM-as-a-Judge 1.5 introduces three metrics, building on version 1.0, that characterize failure-side progress, post-drawdown recovery, and success-side execution quality, helping users understand embodied model capability. Based on the rollout videos fr","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20664,"title":"Vibration Suppression in Collaborative Flexible Payload Manipulation Using Passive Force Control","url":"https://arxiv.org/abs/2608.14244","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14244v1 Announce Type: new \nAbstract: In large and heavy structures, vibrations arise during motion, posing significant challenges for precise manipulation. To accomplish the desired motion, control algorithms must effectively suppress these structural vibrations. In cutting edge projects, such as remote maintenance of future fusion energy reactors (tokamaks), the manipulation of this type of structure is defined as a crucial task. This paper presents a control strategy to suppress transverse vibrations in flexible payloads during motion using a collaborative payload manipulation ap","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20663,"title":"FlatLab: A Unified Methodology Framework and Simulation-Based Benchmark for Robotic Manipulation of Flat Objects","url":"https://arxiv.org/abs/2608.14049","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14049v1 Announce Type: new \nAbstract: Robotic manipulation of flat objects is challenging due to the ungraspable configurations and strong variations in object geometry and material. Existing methods rely on heuristic pre-manipulation and are often evaluated in closed settings with limited generalization. We propose a unified framework that decouples the manipulation into a strategy generator and an action execution module. The strategy generator predicts appropriate manipulation strategies from object point clouds by learning strategy-centric, object-invariant representations via s","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20662,"title":"Evolve Vision-Language-Action Model into an Agent with On-the-fly Tool-use","url":"https://arxiv.org/abs/2608.14047","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14047v1 Announce Type: new \nAbstract: This paper integrates end-to-end Visual-Language-Action (VLA) models with agentic tool-use to propose Agentic Robot with Tool-use (ART). ART is a tool-injection framework that tunes any VLA model to leverage off-the-shelf tool modules for low-level vision, high-level affordance, and embodiment enhancement. Compared to vanilla VLA models with a whole continuous action solution space, ART reduces the complexity of the action solution space through tool-use, which not only improves generalizability across different tasks but also reduces data depen","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20661,"title":"Demonstration of Space Robot Teleoperation over a Lossy and Delayed Network using ATMOS","url":"https://arxiv.org/abs/2608.14031","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14031v1 Announce Type: new \nAbstract: We present a demonstration showcasing the Autonomy Testbed for Multi-purpose Orbiting Systems (ATMOS), a planar spacecraft-analog robot designed for hardware-in-the-loop evaluation of guidance and control strategies in microgravity-like conditions. Using ATMOS as the physical test platform, we investigate the design, analysis, and performance evaluation of control architectures for remotely operated spacecraft under round-trip communication delays. In this work, we develop and experimentally validate a control strategy that combines state predic","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20660,"title":"AdvDex: Learning Dexterous Manipulation from Human Demonstrations via Joint-Aligned Actions and Adversarial Learning","url":"https://arxiv.org/abs/2608.14028","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14028v1 Announce Type: new \nAbstract: Dexterous manipulation is a fundamental capability for embodied intelligence, but scaling it remains difficult because robot demonstrations are expensive to collect and action spaces vary across embodiments. Policies trained on heterogeneous data can also entangle task-relevant visual cues with embodiment-specific appearance, limiting cross-embodiment generalization. We present AdvDex, a unified Vision-Language-Action framework for learning dexterous manipulation from human and robot demonstrations. First, we introduce OmniShare, a large-scale m","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20659,"title":"BICPO-VLA: Behavior-Identified Continuation Preference Optimization for Smooth Asynchronous Vision-Language-Action Control","url":"https://arxiv.org/abs/2608.13924","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.13924v1 Announce Type: new \nAbstract: The request-to-handoff gap has three coupled sources: ambiguity about the behavior intended at request time, physical-state drift accumulated during action generation, and residual incompatibility when the new action finally assumes control. BICPO-VLA addresses them in sequence. First, an instruction-aware causal history encoder identifies the behavior supported by the command and current task progress. Second, sequential Haar subspace generation decomposes each action chunk into complementary pairwise scaffold and residual coefficients, enablin","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20658,"title":"Communication in modular robotic motor control: Bilateral controllers under realistic constraints","url":"https://arxiv.org/abs/2608.13904","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.13904v1 Announce Type: new \nAbstract: Robotic motor control in musculoskeletal systems requires fast, accurate movement and robust postural stabilization under signal-dependent noise (where motor command variance scales with command magnitude) and energetic cost. Modular controllers can distribute these competing demands across interacting submodules, but it remains unclear whether they outperform monolithic architectures under realistic constraints, and how inter-module communication shapes the resulting strategy. Inspired by the bilateral hemispheric organization of the brain, we","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20657,"title":"hint$^2$: Hierarchical World Models for Inference-Time Temporal Logic Guidance","url":"https://arxiv.org/abs/2608.13678","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.13678v1 Announce Type: new \nAbstract: A central goal of robot learning is to enable robots to execute rich instructions specified at runtime. Large-scale language-conditioned policies have made substantial progress toward this goal, yet still struggle with temporal structure and safety constraints. Linear Temporal Logic (LTL) provides a powerful language to express complex, non-Markovian instructions. However, guiding learned manipulation policies toward LTL satisfaction remains challenging because modern policies generate short-horizon action chunks and replan in closed loop, while","tags":[],"cluster_size":1,"ts":"2026-08-17T04:00:00"},{"id":20671,"title":"杨德龙：人形机器人是AI世界的物理载体 是长坡厚雪的产业投资机会 - 新浪网","url":"https://news.google.com/rss/articles/CBMinwJBVV95cUxOMHpxUG4yUUc3VlRFenNPaVA4VmF2bnJCMlN2bjRlMTUzQTNtdnNSemc5ZEs5U2ltVGNOaDZVTDcwVE9jT2hvSm5DeWlTT2QwbldYbGhWVGk0ZGVqeXI1QzNQcHBEUWJXRnFFSGJjaXJLdkk4aGZLZnBKRW9NV1NLZHRUQ2VGQ0lSdzNPaGctTHFaNmdEZ1hTejJQVWZOTTJuLXZmc0RaRlZmVl9ISmNldVRoSmJnQWQwbG00aGw1bmZhWUh4dnpaSTBTZ3JnTGVjRjNOZ3E0SF9odGVGbGhiNXVHbmlSYmFfc2NacC16bEtOcTQzcy1DZDRUaXZVMGIyY0VmRVprNlUzS1RndkN5eWtyMUlpX2VaWUs1UnNzQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMinwJBVV95cUxOMHpxUG4yUUc3VlRFenNPaVA4VmF2bnJCMlN2bjRlMTUzQTNtdnNSemc5ZEs5U2ltVGNOaDZVTDcwVE9jT2hvSm5DeWlTT2QwbldYbGhWVGk0ZGVqeXI1QzNQcHBEUWJXRnFFSGJjaXJLdkk4aGZLZnBKRW9NV1NLZHRUQ2VGQ0lSdzNPaGctTHFaNmdEZ1hTejJQVWZOTTJuLXZmc0RaRlZmVl9ISmNldVRoSmJnQWQwbG00aGw1bmZhWUh4dnpaSTBTZ3JnTGVjRjNOZ3E0SF9odGVGbGhiNXVHbmlSYmFfc2NacC16bEtOcTQzcy1DZDRUaXZVMGIyY0VmRVprNlUzS1RndkN5eWtyMUlpX2VaWUs1UnNzQQ?oc=5\" target=\"_blank\"\u003e杨德龙：人形机器人是AI世界的物理载体 是长坡厚雪的产业投资机会\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"202 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
