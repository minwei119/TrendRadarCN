FoYnVPWWt2U0llaTdfbTFjbW5NU2hfWFFWYmNtbnlZX3JmTzJDeXVyd0VHUnFWTlpMRk1Belk5ak1oZHZlcnBzYWVvNEs5Q2VOU2hBWGhYRVFMcE","tags":[],"cluster_size":1,"ts":"2026-08-29T08:16:00"},{"id":24211,"title":"美移民与海关执法局将采购机器狗用于执法","url":"https://wallstreetcn.com/livenews/3157258","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"8月28日，据美国方面消息，美国移民与海关执法局计划斥资200万美元购买机器狗，用于执法行动。据悉，美国移民与海关执法局计划购买的机器狗将协助执法人员开展边境防卫以及基础设施安保工作。美国联邦政府采购公告称，这批设备具备远程操控能力，在可能对人员构成危险的环境中，可进行检查以及危险评估等工作。这种机器狗无法像普通警犬那样发起攻击，但配备有可伸缩机械臂，具备开门能力。美国特勤人员及多地警察局此前已配备这种设备。（央视新闻）","tags":[],"cluster_size":1,"ts":"2026-08-29T08:04:46"},{"id":23939,"title":"山西焦煤：目前公司矿井基本全部恢复正常生产","url":"https://wallstreetcn.com/livenews/3157239","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"山西焦煤在业绩说明会表示，近期公司主要停产矿井有西曲矿、马兰矿、镇城底矿和西铭矿。其中，西曲矿于7月23日停产，7月30日复产，8月5日因事故再次停产，截至8月26日已复产；马兰矿在7月27日停产，7月30日复产；镇城底矿和西铭矿分别于7月27日和7月30日停产，此次停产是由于证照手续到期办理，停产约一个月时间。停产矿井对产量影响有限。目前，公司矿井基本全部恢复正常生产。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:58:05"},{"id":23940,"title":"公司是否有资产注入计划？山西焦煤回应","url":"https://wallstreetcn.com/livenews/3157235","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"关于“公司是否有资产注入计划”的问题，山西焦煤在业绩说明会表示，公司持续关注集团内部及省内外优质的煤炭资源，在标的资产满足上市公司筛选标准的前提下，将适时推进优质资产的并购工作，以切实为全体股东创造价值。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:36:56"},{"id":23941,"title":"股价月内翻倍后高位回调，百花医药回应：公司创新药CRO占比很小","url":"https://wallstreetcn.com/livenews/3157234","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月28日，百花医药盘中触及跌停。Wind数据显示，截至8月28日收盘，公司股价报15.44元/股，收盘跌幅为7.43%。不过，8月以来公司累计涨幅仍达到119.63%。\n\n对于百花医药股价大跌，百花医药方面回应记者，股价受多重因素影响。公司主要做仿制药CRO，创新药CRO占比很小。相比仿制药，创新药投入大、回报不及预期的风险也大。公司属于药厂的上游环节，CRO业务对接药厂。按照仿制的难度不一样，订单的总价也有区别，订单一般不会少于1年，一般是2—3年。仿制药CRO行业竞争加剧，属于买方市场，公司需要主动去找业务，订单单价不如往年高。（中证金牛座）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:36:23"},{"id":23942,"title":"中国移动：维护基站 力保畅通 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNWWZtY1pkZ0ZHZGhVeXZTR2FGT1c0ZmV1SkhFSzBFT3pHcGtoM2tCNkVraThkalNTdHBCbXUzclB1eGR 会上表示，从存款期限结构看，定期化趋势仍然没有明显的改变，存款的增量中大部分还是来自于定期存款。周万阜同时强调，交通银行今年的活期存款已实现同比多增，带动了整个存款成本下降。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:11:07"},{"id":23946,"title":"工行副行长赵桂德：累计落地大模型场景600多个","url":"https://wallstreetcn.com/livenews/3157225","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中国工商银行28日举行了2026年上半年业绩发布会。工行副行长赵桂德在回答记者提问时，介绍了工行利用AI技术赋能业务转型与降本增效的成效。赵桂德表示，工行累计落地大模型场景600多个，推动全行服务实体经济更精准、经营管理更高效、风险防控更主动。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:10:29"},{"id":23947,"title":"CSR周刊：腾讯、安踏、比亚迪、小米、双汇、阿里巴巴等多家企业紧急驰援西藏吉隆等灾区 - 新浪网","url":"https://news.google.com/rss/articles/CBMickFVX3lxTE4tblhLQjZyb3hwU09WYkhNV3JQSjZuYmxWZHBVUnE2OHppTjF0SEFTYUJqcXVJZmwxMUFYcGg1LS00VUFWS3E4VS16OFh2VWdoVlhITDAyQ0lQZVhlNDhpSnBKcVdmNmZqMllrNjZpbUdGZw?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMickFVX3lxTE4tblhLQjZyb3hwU09WYkhNV3JQSjZuYmxWZHBVUnE2OHppTjF0SEFTYUJqcXVJZmwxMUFYcGg1LS00VUFWS3E4VS16OFh2VWdoVlhITDAyQ0lQZVhlNDhpSnBKcVdmNmZqMllrNjZpbUdGZw?oc=5\" target=\"_blank\"\u003eCSR周刊：腾讯、安踏、比亚迪、小米、双汇、阿里巴巴等多家企业紧急驰援西藏吉隆等灾区\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-29T04:56:55"},{"id":23948,"title":"MBSA严打“阿里巴巴”模式 或提高罚款逾2倍调至1000令吉 - mediaselangor.com","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTFBJcjQ4OXBJbHZ6M2FYd3JuM3BLZjFQR0NYWHN0Q0hMekVpSmw5WEZMYzEtMk5CUEVvLUJyNS0yajNxMUJtc3A5eVlRUHh0S0Zqbjg5anJR?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTFBJcjQ4OXBJbHZ6M2FYd3JuM3BLZjFQR0NYWHN0Q0hMekVpSmw5WEZMYzEtMk5CUEVvLUJyNS0yajNxMUJtc3A5eVlRUHh0S0Zqbjg5anJR?oc=5\" target=\"_blank\"\u003eMBSA严打“阿里巴巴”模式 或提高罚款逾2倍调至1000令吉\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003emediaselangor.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-29T04:37:18"},{"id":23949,"title":"中国移动：融资净买入1115.8万元，融资余额15.26亿元 - 东方财富","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE50TkZEYlg5YjUxalhQQThLOXJEbEV3LXdVTWJSdk1mY2pzMFlZMlhLQWJrc1E3V01lQmEzZ0FOdHFXb29CSVBaOEo1b1kwTm1iTXpwN2xsUkFiRmVYQ0Q4YQ?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE50TkZEYlg5YjUxalhQQThLOXJEbEV3LXdVTWJSdk1mY2pzMFlZMlhLQWJrc1E3V01lQmEzZ0FOdHFXb29CSVBaOEo1b1kwTm1iTXpwN2xsUkFiRmVYQ0Q4YQ?oc=5\" target=\"_blank\"\u003e中国移动：融资净买入1115.8万元，融资余额15.26亿元\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e东方财富\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-29T03:22:04"},{"id":23950,"title":"晶澳科技：光伏未来几年大幅增长大概率不会出现，但光储结合更紧密","url":"https://wallstreetcn.com/livenews/3157200","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"晶澳科技8月28日在业绩说明会表示，光伏过去十年增速太快，未来几年进入小幅稳定增长过程，大幅增长大概率不会出现，但光储结合更紧密。AI算力和数据中心是未来5年光储融合最快增长赛道，特高压线路、分布式变压器容量取消等打开通路。海外市场延续稳定增长轨道，储能增长更快，驱动因素包括能源安全、AIDC快速增长、欧美高电价下光储经济性进入平价加套利双重驱动，欧洲负电价和消纳压力反向创造储能刚需。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T02:14:16"},{"id":23951,"title":"晶澳科技：持续关注贱金属替代技术，研发储备多条路线","url":"https://wallstreetcn.com/livenews/3157198","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"晶澳科技8月28日在业绩说明会表示，公司持续关注贱金属替代技术，研发储备多条路线。银包铜路线目前控制在量产中试阶段，是基于内部测算显示，以当前的银价，银包铜技术经济性优势不明显，更因为该技术路线可靠性待验证。当前公司保持持续关注和长期投入，后续根据银价趋势和技术成熟度进行导入。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T02:09:01"},{"id":23952,"title":"晶澳科技：今年公司出货目标有所下修，计划到全年出货在50GW左右","url":"https://wallstreetcn.com/livenews/3157197","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"晶澳科技8月28日在业绩说明会表示，基于量价平衡考虑，今年公司出货目标有所下修，计划到全年出货在50GW左右。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T02:08:37"},{"id":23953,"title":"顺丰控股：加快推进智能装备和AI应用场景落地","url":"https://wallstreetcn.com/livenews/3157189","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"顺丰控股8月28日在业绩说明会表示，展望2026下半年，国内端，公司将继续深挖消费多元细分场景，深度服务B端企业转型升级，持续加深经营护城河；国际端，公司会紧抓中国企业品牌和产能出海机遇，加快发展第二增长曲线业务；同时，加快推进智能装备和AI应用场景落地，将技术优势转化为长期经营效益。综合来看，下半年外部环境仍存在油价等多重不确定性，公司将保持经营策略定力，持续精益管理，致力于交付稳健的营收和利润结果。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T01:28:29"},{"id":23954,"title":"顺丰控股：展望2027年，AI在增收、降本各个维度都将有较大的增量空间","url":"https://wallstreetcn.com/livenews/3157188","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"顺丰控股8月28日在业绩说明会表示，顺丰会继续引领前沿科技在物流行业的应用，持续加大AI技术应用的投入。展望2027年，AI在增收、降本各个维度都将有较大的增量空间。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T01:28:02"},{"id":23955,"title":"9月港股通标的调整进入倒计时，警惕爆炒“入通”概念股","url":"https://wallstreetcn.com/livenews/3157179","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"9月港股通标的调整进入倒计时，新一轮标的纳入名单也成为市场关注焦点。业内专家提醒，随着港股通调整生效节点临近，投资者需要高度警惕“入通闪崩”的投资风险。尤其要留意那些基本面偏弱、股权高度集中的个股；同时南向资金以及被动型基金产品，也应当做好相应的风险防控。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T00:49:57"},{"id":23956,"title":"年内配售逼近2000亿港元 港股再融资“变奏”凸显三大变化 - 新浪网","url":"https://news.google.com/rss/articles/CBMiggFBVV95cUxNVkg3M0tGdGY1VTZmcy1DS2wwRE1UMW43cld1WTVjT0Nlb3ZjWlpPMlNXSVBndDdjRXZYRTduUW45ai1kUVZVV2h3dUo5SnpfeHJSU29RSXhFd0JjcURSWGN0V05Nb3JuY004MUlmMWFDNmZlRmJ6a0xoUm82T19Lajhn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴","华尔街见闻 · 港股快讯"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiggFBVV95cUxNVkg3M0tGdGY1VTZmcy1DS2wwRE1UMW43cld1WTVjT0Nlb3ZjWlpPMlNXSVBndDdjRXZYRTduUW45ai1kUVZVV2h3dUo5SnpfeHJSU29RSXhFd0JjcURSWGN0V05Nb3JuY004MUlmMWFDNmZlRmJ6a0xoUm82T19Lajhn?oc=5\" target=\"_blank\"\u003e年内配售逼近2000亿港元 港股再融资“变奏”凸显三大变化\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":3,"ts":"2026-08-28T23:30:23"},{"id":23957,"title":"“先买后付”巨头Affirm CEO称高油价正在冲击美国消费者","url":"https://wallstreetcn.com/livenews/3157160","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"Affirm Holdings股价周五收盘几乎持平。此前，这家”先买后付”公司公布了第四财季业绩，CEO马克斯·列夫琴表示高油价正在拖累消费者。“美国消费者无疑感受到了更高的油价，所以不能、不能忽视这一点，”列夫琴表示。“他们也在向我们寻求帮助，以应对各个通胀压力点带来的价格问题。”（CNBC）","tags":[],"cluster_size":1,"ts":"2026-08-28T23:09:2 mg\"\u003e\u003c/p\u003e\u003cp data-vmark=\"5c94\"\u003e本周早些时候，《GTA 6》开发团队在接受 Kinda Funny Games 采访时确认，这款备受期待的开放世界大作将避开这两种可能引发争议的做法。这意味着游戏在发售后的几个月里，至少不会因为这两个话题引发玩家的争议。\u003c/p\u003e\u003cp data-vmark=\"9fce\"\u003eKinda Funny 主持人 Andy Cortez 表示，他在《GTA 6》“Extended Look”特别节目播出前的一场试玩活动中，曾向 Rockstar 询问玩家能否使用现实货币购买游戏内物品。他随后透露，Rockstar 给出的回答","tags":[],"cluster_size":1,"ts":"2026-08-30T06:54:39"},{"id":24306,"title":"日均峰值 11.3 起：报告称 2026 年已记录 1664 起 AI 失控事件，7 月环比增 93.76%","url":"https://www.ithome.com/0/996/124.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"af90\"\u003eIT之家 8 月 30 日消息，英国长期韧性中心（CLTR）于 8 月 28 日发布报告，\u003cstrong\u003e称其“失控观察站”在 2026 年 7 月共记录 306 起 AI 安全事件，比 6 月（158 起）增涨 93.67%。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"16d4\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/91324e07-710d-42d0-8d35-e79afa06d964.png\" w=\"821\" h=\"419\" data-weibo=\"0\" data-vmark=\"71d7\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"ee41\"\u003e“失控观察站”成立于 2026 年 2 月，获英国人工智能安全研究所资助，借助开源情报追踪 AI 系统违背操作者意图的案例。\u003c/p\u003e\u003cp data-vmark=\"c654\"\u003e报告列举的案例包括：智能体在对话中插入伪造用户消息以模拟同意、仿照用户写作风格编造删除源代码目录的指令、伪造“人工必须批准”规则下的授权信息并执行任务。\u003c/p\u003e\u003cp data-vmark=\"4b22\"\u003eCLTR 表示，多数记录事件尚未导致重大伤害，但","tags":[],"cluster_size":1,"ts":"2026-08-30T06:01:18"},{"id":24307,"title":"消息称百度智能云分拆平台产品事业部：MaaS 划入基础设施、Agent 独立成军","url":"https://www.ithome.com/0/996/123.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"0d3b\"\u003eIT之家 8 月 30 日消息，据《晚点 LatePost》8 月 29 日报道，百度智能云近日完成一轮产研组织调整。原平台产品事业部更名为\u003cstrong\u003e智能体事业部\u003c/strong\u003e，其下 MaaS 业务、千帆品牌及与 MaaS 相关的产品体系转入\u003cstrong\u003e基础设施事业部\u003c/strong\u003e，数据平台部更名为数据智能部，转入由原应用产品事业部更名而来的\u003cstrong\u003e智能应用事业部\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"2e78\"\u003e调整后，百度智能云的三个事业部分别由侯震宇、殷大伟和阮瑜负责：侯震宇负责基础设施事业部，管理 AI Infra 和 Agent Infra；殷大伟负责智能体事业部，聚焦 Agent 产品如百度搭子、秒哒和伐谋；阮瑜负责智能应用事业部，管理百度一见、Hogee、胜算以及交通、金融等行业应用。\u003c/p\u003e\u003cp data-vmark=\"cf96\"\u003e报道称，三人均直接向百度集团执行副总裁、智能云事业群总裁沈抖汇报。\u003c/p\u003e\u003cp data-vmark=\"74a2\"\u003eIT之家注意到，百度本月发布 2026 年第二季度财报，季度总营收 313 亿元；百度一般性业务收入 252 亿元，\u003cstrong\u003e其中 AI 业务收入占比 50%，已连续两季占比过半\u003c/strong\u003e。本季度，AI 云基础设施中 GPU","tags":[],"cluster_size":1,"ts":"2026-08-30T05:57:38"},{"id":24308,"title":"小鹏第二代VLA大模型首次重大升级 AI从理解空间走向理解时空 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQRi03TXUtUTl6QUtsYVM5enFDQTNQcklyRFM2YlZFQWdBOHhmdEVkNmhCVFdkQTZPZVpiYjR0RjRtUkF0aHpQQWVYTE9rbHRQelVNd0JRZjhOTDlxZGx4OWJWYjJ6ZEpraklrS3R4ajJfN2l1ZmdRVm5UQlNWeGREMG82ZWZNejNk?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQRi03TXUtUTl6QUtsYVM5enFDQTNQcklyRFM2YlZFQWdBOHhmdEVkNmhCVFdkQTZPZVpiYjR0RjRtUkF0aHpQQWVYTE9rbHRQelVNd0JRZjhOTDlxZGx4OWJWYjJ6ZEpraklrS3R4ajJfN2l1ZmdRVm5UQlNWeGREMG82ZWZNejNk?oc=5\" target=\"_blank\"\u003e小鹏第二代VLA大模型首次重大升级 AI从理解空间走向理解时空\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-30T05:54:10"},{"id":24309,"title":"预估为GPT-6模型：OpenAI推进Astra测试，首批演示样本流出 - 凤凰网科技","url":"https://news.google.com/rss/articles/CBMiTEFVX3lxTE8tSVZfWnozVjgtMkRDd3N2b2hxWWd2NG1xQVI3VWpTWExRX1k0ZWdfbGh1UHZYWTdVTWQwa0xPbWtOX3YzU2g2VVNLRUE?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTEFVX3lxTE8tSVZfWnozVjgtMkRDd3N2b2hxWWd2NG1xQVI3VWpTWExRX1k0ZWdfbGh1UHZYWTdVTWQwa0xPbWtOX3YzU2g2VVNLRUE?oc=5\" target=\"_blank\"\u003e预估为GPT-6模型：OpenAI推进Astra测试，首批演示样本流出\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e凤凰网科技\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-30T05:48:08"},{"id":24310,"title":"累计服务超80万人次，仁济泌尿智能体打造专科AI诊疗的“仁济样本” - 新浪网","url":"https://news.google.com/rss/articles/CBMigAFBVV95cUxQREpyWHdDb3N0cGpMYTY4eHJDblBNZ204SFpGS1ZyTGpQeGxKRHM0dVNXdUpIY3BRaWIzNE9UZ 就是外界所称的 GPT-6，或至少是 GPT-6 的候选名称之一，参数规模可能会达到 10 万亿。\u003c/p\u003e\u003cp data-vmark=\"c2df\"\u003e根据网友分享的测试内容，Astra 模型重点提升代码编写和可视化软件创建，仅 1 次对话交互，就成功就制作出了类似《侠盗猎车手 2》（GTA 2）的游戏","tags":[],"cluster_size":1,"ts":"2026-08-30T05:25:15"},{"id":24313,"title":"国家数据局局长刘烈宏：要围绕国民经济重大场景，研究探索词元增值订阅、按效付费等商业模式","url":"https://www.ithome.com/0/996/119.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"7ea6\"\u003eIT之家 8 月 30 日消息，据央视新闻今日报道，在 2026 中国国际大数据产业博览会上，一批数据领域最新政策举措陆续发布，涵盖了词元、数据标注、数字人才培养等多个领域。国家数据局局长刘烈宏表示，要围绕国民经济重大场景，\u003cstrong\u003e研究探索词元增值订阅、按效付费等商业模式\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"8347\"\u003e词元，为人工智能服务的计量、定价、交易和结算提供了重要标尺。国家数据局负责人表示，将探索适配产业实际的词元商业模式。\u003c/p\u003e\u003cp data-vmark=\"6f62\"\u003e数据标注，\u003cstrong\u003e相当于给原始数据打标签\u003c/strong\u003e，标注好的数据可用来训练人工智能。国家数据局将在 32 个城市布局新一批数据标注先行先试，深入工业制造、医疗健康、交通运输等领域，破解数据标注产业发展瓶颈。\u003c/p\u003e\u003cp data-vmark=\"a7d9\"\u003e报道称，在数字人才培养上，多部门将加强协同，推动建立健全数据要素相关学科专业本硕博贯通衔接的人才培养机制，完善数据要素相关学科专业布局。此外，截至 29 日下午，2026 数博会已举办超 20 场行业交流活动，“数据集市”“数据之夜”等特色活动陆续进行，促进数据产品和应用场景供需对接。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vm","tags":[],"cluster_size":1,"ts":"2026-08-30T05:24:46"},{"id":24314,"title":"AI文明涌现！OpenAI智能体自建「三代帝国」，暗网越狱反向接管母公司|Hugging Face|Agent|人类|系统|考官_手机新浪网 - 新浪财经","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxOaUpGRzZXcVBMVHpRTWdqWHM1MHBEOV9Vck9WVnFnOG85YWk5ZkFCMGw3ai1pZl81R1pLbGJQZ0x3UEFtdVhfVzdSczZ3ckNmNENJeHBhU2xIZDNmZHQ1d3JjNEotYjhLN21FNG9OQW03ckFPY1FJZV9BT1pMWUFZY1F2aE14ZHlpNWpITWNxWTVmNDhuQmR6OXltVTVKSlRSSDhJSWI1MUxTR1o4SlRCOFZ3?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxOaUpGRzZXcVBMVHpRTWdqWHM1MHBEOV9Vck9WVnFnOG85YWk5ZkFCMGw3ai1pZl81R1pLbGJQZ0x3UEFtdVhfVzdSczZ3ckNmNENJeHBhU2xIZDNmZHQ1d3JjNEotYjhLN21FNG9OQW03ckFPY1FJZV9BT1pMWUFZY1F2aE14ZHlpNWpITWNxWTVmNDhuQmR6OXltVTVKSlRSSDhJSWI1MUxTR1o4SlRCOFZ3?oc=5\" target=\"_blank\"\u003eAI文明涌现！OpenAI智能体自建「三代帝国」，暗网越狱反向接管母公司 enter;\" data-vmark=\"23af\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/f3cdbb79-5e82-4f24-b4d6-0f25231fd703.jpg?x-bce-pro","tags":[],"cluster_size":1,"ts":"2026-08-30T04:21:59"},{"id":24325,"title":"启境轩伟谈 L3 级自动驾驶架构：车主导、人放松，正常行驶不需要时刻紧绷接管","url":"https://www.ithome.com/0/996/108.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ceed\"\u003eIT之家 8 月 30 日消息，启境汽车产品总经理轩伟今日发文，谈及了汽车智能辅助驾驶的底层架构相关话题，并介绍了 L3 级自动驾驶架构。\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"88ff\"\u003e在这里我先要为大家讲一下 L2 和 L3 的本质区别，其实核心就在于谁主导、谁负责。传统 L2 级辅助驾驶，始终是人为主导，开车全程需要我们紧盯路况、随时待命，车辆遇到特殊情况会立刻退出，把操控交还给人。\u003cstrong\u003e但 L3 级自动驾驶架构完全不一样，是车主导、人放松，正常行驶不需要时刻紧绷接管\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"ec32\"\u003e所以 L3 级自动驾驶架构对安全的要求完全不在一个层级 —— \u003cstrong\u003e车辆绝对不能在部件异常时直接掉线、突然退出智能辅助驾驶\u003c/strong\u003e。而这也正是我们为什么要大费周章，给 GT7 做这套 L3 级自动驾驶冗余架构的原因。道理其实很好理解，就像人有双眼、双手、双耳，天生自带双重备份。\u003c/p\u003e\u003cp data-vmark=\"6827\"\u003e为了保障车辆的行驶安全，供电、算力、感知、定位、通信、转向、制动、交互八大系统，这些关键领域绝不能出问题。因为国家 L3 的相关制度规定，\u003cstrong\u003e当 L3 被激活时，任何零部件失效或者遇到特殊情况，系统都要能够保持在线\u003c","tags":[],"cluster_size":1,"ts":"2026-08-30T04:07:50"},{"id":24326,"title":"OpenAI终止向SpaceX提供模型服务，马斯克回应 - t.cj.sina.cn","url":"https://news.google.com/rss/articles/CBMickFVX3lxTE5SeFVGenNabzJTNzZuVUlxb1F1S2dPTjZxcDVQdS1EZF9hU0RJa2x1clZ6TGROWFgxT0VZdmF5VFZyOS1MTnFMQ3FLT2FJYlBhaC01QUhGQjUtb1NSWC1SbFBmODhkYnFvVU5TX3ZUZ0M0dw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMickFVX3lxTE5SeFVGenNabzJTNzZuVUlxb1F1S2dPTjZxcDVQdS1EZF9hU0RJa2x1clZ6TGROWFgxT0VZdmF5VFZyOS1MTnFMQ3FLT2FJYlBhaC01QUhGQjUtb1NSWC1SbFBmODhkYnFvVU5TX3ZUZ0M0dw?oc=5\" target=\"_blank\"\u003eOpenAI终止向SpaceX提供模型服务，马斯克回应\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003et.cj.sina.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-30T04:05:00"},{"id":24327,"title":"约 94% 准确率：手机配件 SweepLED 问世，成本不到 7 美元、5 秒内找出针孔摄像头","url":"https HdaT2hteV9IUkV1NHVMXzVqUGI1QlNoeFFibFUzVnR2bXV5WmFQYzFYb2RaX1N3RWVQVTJsYmFMdlQ1c2daSTVkejk5bG5nYWxkQ0k2OWxsc3ZXTGpyaXNaclNuLXF6RkZCbWV3SWZ3dFNsQWUyQ3lkdURQdkVVZXNz?oc=5\" target=\"_blank\"\u003eChina can build kung fu-fighting robots. But it can’t get them to do factory work\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eReuters\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-27T05:00:00"},{"id":23668,"title":"PRISM: Projection-Integrated Sampling-Based MPC with Bayesian Cost Tuning for Bimanual Manipulation","url":"https://arxiv.org/abs/2608.25666","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25666v1 Announce Type: new \nAbstract: Bimanual manipulation in cluttered, contact-rich environments remains challenging because it requires coordinated motion generation, interaction-aware planning, and reliable execution under tight kinematic constraints. We present PRISM, a projection-integrated sampling-based Model Predictive Control (MPC) framework that uses a GPU-accelerated physics simulator as an online world model for complex dual-arm manipulation.\n  The main algorithmic contribution is a QP-guided control sampling strategy that decouples trajectory exploration from kinemati","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23667,"title":"GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation","url":"https://arxiv.org/abs/2608.25659","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25659v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) policies have advanced language-conditioned robotic manipulation, yet action-imitation objectives provide only weak supervision for metric 3D structure and short-horizon physical evolution. Geometry-enhanced policies mainly improve current-scene grounding, whereas predictive policies often model future dynamics in RGB or latent spaces and may incur substantial deployment cost. GaussianDream demonstrates that training-time current Gaussian reconstruction and future Gaussian prediction provide effective 3D supervision,","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23666,"title":"EgoNav: Bridging Learned Waypoints and Geometry-Aware Local Control for Robust Indoor Navigation","url":"https://arxiv.org/abs/2608.25642","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25642v1 Announce Type: new \nAbstract: Image-goal navigation using lightweight topological maps is a practical paradigm for indoor robot deployment: the map requires only geotagged images, and localization relies on visual matching rather than precise pose estimation. However, learned waypoint predictors can produce targets that violate geometric constraints or deviate from the global path. Executing these waypoints safely further requires a local planner capable of collision avoidance, yet existing systems either lack one or rely on fixed parameters that cannot adapt to confined spa","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23665,"title":"Advantage-Driven Explicit Memory for Social Navigation","url":"https://arxiv.org/abs/2608.25610","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25610v1 Announce Type: new \nAbstract: Robot policies are predominantly learned with classical parametric variants of imitation learning or RL, where training stores the agent's behavior exclusively in the policy's network parameters, putting a heavy burden on the representation learning algorithm. We propose a new navigation agent equipped with non-parametric memory which explicitly indexes prior steps leading to critical events. The advantages are twofold: first, it allows the policy to outsource some of its behavior into an explicit memory; second, it encourages a form of continua","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23664,"title":"RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation","url":"https://arxiv.org/abs/2608.25585","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25585v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models provide a versatile foundation for general robotic manipulation, yet they exhibit significant brittleness when confronted with novel task distributions. While In-Context Imitation Learning (ICIL) offers a training-free alternative, existing frameworks suffer from an adaptation bottleneck that hinders the effective translation of expert context to executable actions. This failure originates from superficial retrieval mechanisms and an inherent behavioral inertia that anchors the policy to its pre-trained priors","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23663,"title":"ConfAL-WM: Confidence-Guided Active Learning for Action-Conditioned World Models","url":"https://arxiv.org/abs/2608.25572","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25572v1 Announce Type: new \nAbstract: Action-conditioned world models have become an important foundation for embodied prediction, planning, and synthetic data generation, but their errors under new task and scene distributions are often concentrated in localized spatiotemporal regions such as robot arms, manipulated objects, contact areas, and occluded objects. This paper presents ConfAL-WM, a confidence-guided active learning framework for post-training embodied world models. Built upon EVAC, we attach a lightweight confidence probe to UNet decoder features and predict dense confi","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23662,"title":"A Tendon-Driven Five-Fingered Hand with Distributed Tactile Perception for Dexterous Manipulation","url":"https://arxiv.org/abs/2608.25547","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25547v1 Announce Type: new \nAbstract: To apply the techniques of embodied artificial intelligence to human-oid robots for complex manipulations, dexterous robotic hands are indispensable, which are restricted by the dexterity and tactile perception capability. In this work, we proposed a novel design of tendon-driven five-fingered hand with dis-tributed tactile perception. With a soft-rigid-hybrid structure employed, both compliance and operational force are endowed to the hand. Dual-modality tactile sensing elements are distributed on the distal and middle phalanges of all five fin","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23661,"title":"Dynamic Modeling of a Welding Torch Umbilical and Its Impact on Robot Dynamics","url":"https://arxiv.org/abs/2608.25509","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25509v1 Announce Type: new \nAbstract: Robotic welding is widely used in industrial manufacturing, where the welding torch is often connected to the generator through an external umbilical. With the increasing deployment of lightweight and collaborative robots, the dynamic influence of this umbilical can significantly affect the robot motion and the actuation forces. This paper proposes a constrained multibody dynamic model of a welding umbilical, represented as a serial chain of rigid bodies interconnected by passive joints with elastic and dissipative effects. Prescribed motions at","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23660,"title":"Towards safe and optimal flight: Viability Kernel MPC for Fully Actuated Multirotor","url":"https://arxiv.org/abs/2608.25459","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25459v1 Announce Type: new \nAbstract: Industrial aerial robotics demands safety guarantees for navigation in unstructured environments while optimizing performance and computational efficiency. This paper presents a method for generating safe pose trajectories for fully actuated multirotors within a Model Predictive Control (MPC) framework, leveraging both viability theory and data-driven methods. Obstacle avoidance is enforced through dynamically computed axis-aligned bounding boxes, providing formal safety guarantees without exhaustive offline reachability analysis. Numerical simu","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
