articles/CBMimAFBVV95cUxQQkNjUWhmclNodG41UTctU2wySm0wNTNJbVRpUDBnNnpuSDdGTGRGUjg2UFV4bVpyUF9jakVuSEJxOVVDSWdvZHhvRE04RXhrZl9naUxVbjUxRS1ocVNiT2hDN1JtQVhCREVmUHNpMzE4TVd4ZWd3LVQ2eTRta0FBNk80cElRekdSczNnZkc4Nk9GeGVYcHBmVg?oc=5\" target=\"_blank\"\u003e阿里巴巴、茉莉奶白、腾讯等多家企业宣布捐赠驰援西藏吉隆\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-26T23:26:15"},{"id":23122,"title":"安踏集团上半年营收435亿元增近13%，可隆等多品牌收入增超四成","url":"https://wallstreetcn.com/livenews/3155611","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月26日午间，安踏体育用品有限公司发布2026年上半年业绩公告。上半年安踏集团业绩超市场预期，收入435.1亿元，同比增长12.9%；经营利润达117.6亿元，同比提升16.1%；不包括与“联营公司投资”相关的一次性利得，股东应占溢利同比提升12.9%至79.4亿元。经调整股东应占溢利72.3亿元，同比增长9.6%。据梳理计算，今年上半年，安踏集团业绩创历史新高，近五年来收入增速保持稳定；半年度净利增速近四年来虽然逐年放缓，但依旧保持两位数增长。（澎湃新闻）","tags":[],"cluster_size":1,"ts":"2026-08-26T23:24:39"},{"id":23123,"title":"新思科技分析师电话会议","url":"https://wallstreetcn.com/livenews/3155605","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、核心业绩与指引调高。\n\n1、第三季度超预期：Q3实现营收24.77亿美元（同比增长42%，包含Ansys贡献的7.11亿美元），Non-GAAP营业利润率达41.6%，Non-GAAP每股收益（EPS）为3.91美元，各项指标均超出此前指引的高端。\n\n2、上调全年初步指引：\n\n全年营收：从此前指引中点上调5,000万美元，达到96.9亿-97.4亿美元（其中包含Ansys约29.8亿美元的贡献）。\n\nNon-GAAP EPS：上调至15.04-15.10美元（中点较原指引提高0.31美元）。\n\n3、现金流：将运营现金流指引大幅上调5亿美元至28亿美元，自由现金流（FCF）指引调至26亿美元（增加6亿美元）。\n\n未完成订单/订单积压（Backlog）：保持在109亿美元的强劲水平。","tags":[],"cluster_size":1,"ts":"2026-08-26T23:04:05"},{"id":23124,"title":"西部陆海新通道智慧水运大模型正式发布 中国移动助力广西水运迈入“AI领航”时代 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxPZ0VvX2VtVUFOOW1KdlRCcWl4MWQ0dXJqaTBDRTI0SnlTd1RuV29MMUVWRGctQTBqdGZWbUJmYnpaS200VlAzOVBlc21Ud01fOHdsZGJOLUVIWnRsQ3ZtcDdzV0p6bDBnWGM4WDBDN0d6UHZNWXVFNzV6UE9oMVQzd0xnUmFrOGxRejhQcEJNUWUzeVlXX3d1Q0pYU0tib1NLUkdHZHhQUTNEaFd3MUhEVVNR?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxPZ0VvX2VtVUFOOW1KdlRCcWl4MWQ0dXJqaT 近期，创新药、CXO（医药研发生产外包）板块行情持续演绎。板块反弹带动一批医药主题基金净值加速回血，近三个月以来，多只医药行业基金大幅反弹，净值增长率超过30%。在机构投资者看来，医药行情正迎来逻辑切换，从估值修复逐步转向对临床数据、BD交易（商务拓展）兑现和订单增长的交叉验证。判断后市行情能否持续，需要紧盯临床数据、资金博弈、产业政策等多重变量。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-26T22:36:50"},{"id":23131,"title":"投资“放大器”效应显现，多家上市险企上半年利润高增长","url":"https://wallstreetcn.com/livenews/3155594","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月26日，A股和港股已有5家上市险企披露2026年上半年“成绩单”。报告期内，受益于权益市场上行，这些上市险企归母净利润普遍高增长。在市场人士看来，上半年相关上市险企业绩高增长背后，投资收益大幅增长是主要贡献因素。自新会计准则实行以来，保险公司投资资产更多被分类为FVTPL（以公允价值计量且其变动计入当期损益）资产，尤其是大部分科技股被纳入FVTPL，其股价波动显著影响了险企利润。不过，也有业内人士认为，FVTPL分类其实是一把“双刃剑”，当权益市场大幅上涨时会增厚险企业绩，资本市场调整时则会对险企业绩形成拖累。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-26T22:30:23"},{"id":23132,"title":"寻找科技外“第二曲线”，基金经理多维度挖掘阿尔法","url":"https://wallstreetcn.com/livenews/3155593","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"当前，不少公募基金经理的关注重点已不局限于科技赛道，而是将目光投向科技之外，积极挖掘具备估值修复逻辑与业绩确定性的“第二曲线”。与此同时，基金公司通过增聘基金经理、新发产品来实现分散配置、多元配置的目标。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-26T22:28:25"},{"id":23133,"title":"公募基金中报首度披露近1年盈利投资者数量占比","url":"https://wallstreetcn.com/livenews/3155589","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着公募基金信息披露新规的全面落地，主动管理股票型和混合型产品首次在基金2026年中期报告中披露近1年盈利投资者数量占比情况，该数据能直观反映投资者真实获得感。根据已披露的基金中期报告，多只产品近1年盈利投资者数量占比超过90%。例如，截至6月末，田瑀管理的中泰开阳价值优选混合A近1年净值增长率为36.87%，同期盈利投资者数量占比为96.18%。从基金净值走势看，近1年盈利投资者数量占比较高的基金，在净值回撤控制上做得较好。部分基金虽然近1年实现净值正增长，但是盈利投资者数量占比并不高，主要是因为大量资金在高点入场。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-26T22:20:41"},{"id":23134,"title":"英伟达分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3155587","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、核心财务业绩亮点（Q2 FY2027）。\n\n1、营收再创新高：单季度总营收达到960亿美元，同比翻倍以上（增长加速连续四个季度）。\n\n2、数据中心业务（Data Center）：数据中心营收达890亿美元，季环比增长18%。\n\n3、超大规模客户（Hyperscale）：贡献490亿美元（季环比增长13%），Blackwell 持续强劲出货。\n\n4、非超大型客户（ACIE-云服务/企业/主权AI）：贡献400亿美元（季环比增长25%，同比大增138%），占数据中心整体约一半。\n\n5、其他业务亮点：\n\n网络业务（Networking）：营收季环比增长18%，Spectrum-X乙太网同比增长2.6倍。\n\nGrace / Vera CPU：过去12个月CPU收入突破50亿美元；预计2028财年CPU收入将实现翻倍以上。\n\n股东回报：单季度通过股票回购（200亿美元）和股息（60亿美元）向股东回报了创纪录的260亿美元。","tags":[],"cluster_size":1,"ts":"2026-08-26T22:15:58"},{"id":23135,"title":"英伟达CEO黄仁勋：我们此前从未提前一年发布业绩指引。\n\n如果不受供应限制，2028财年业绩展望会“高得多”。","url":"https://wallstreetcn.com/livenews/3155572","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"英伟达CEO黄仁勋：我们此前从未提前一年发布业绩指引。\n\n如果不受供应限制，2028财年业绩展望会“高得多”。","tags":[],"cluster_size":1,"ts":"2026-08-26T21:36:10"},{"id":23136,"title":"英伟达所给业绩指引“碾压”市场预期，股价盘后涨超4%","url":"https://wallstreetcn.com/livenews/3155553","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"英伟达在电话会上表示，亚马逊将额外部署200万块GPUs。\n\n（CFO称）需求加速，收入将在2028财年增长大约70%——分析师料增45%。\n\n即便面临供应短缺、也会出现那样的增长速度。\n\n客户预期表明，增速将翻倍。\n\n从中长期来看，营收分成模式可创造数十亿美元收入。\n\n英伟达盘后涨4.41%。","tags":[],"cluster_size":1,"ts":"2026-08-26T21:06:14"},{"id":23137,"title":"周三（8月26日）纽约尾盘，标普500股指期货最终涨0.24%，道指期货涨0.19%，纳斯达克100股指期货涨0.52%。\n\n罗素2000股指期货跌0.02%。","url":"https://wallstreetcn.com/livenews/3155551","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（8月26日）纽约尾盘，标普500股指期货最终涨0.24%，道指期货涨0.19%，纳斯达克100股指期货涨0.52%。\n\n罗素2000股指期货跌0.02%。","tags":[],"cluster_size":1,"ts":"2026-08-26T21:03:30"},{"id":23138,"title":"阿里巴巴期权聚焦：8月26日成交10.73万张，未平仓合约250.52万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxQZ0M3NDZkU08xY29ib3c4MG9xMXlXblMxcDFLcXdDWTlJdEVTOWtYVWMxZy1FQ0tmU2Foek9iNGlDSW9NeW5tWF9SdjUtZHNhdW16SHZxRnptQTFueVRyazFQUjJIcGhMbW8tMGVNWF82WmdQSC1aZFpNZ3Bnajl5NENNc2pUY29tSG5HQ1Q4bjZ2MmlFLU9mUmtGSjZ1T3BmVUMtQnFn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxQZ0M3NDZkU08xY29ib3c4MG9xMXlXblMxcDFLcXdDWTlJdEVTOWtYVWMxZy1FQ0tmU2Foek9iNGlDSW9NeW5tWF9SdjUtZHNhdW16SHZxRnptQTFueVRyazFQUjJIcGhMbW8tMGVNWF82WmdQSC1aZFpNZ3Bnajl5NENNc2pUY29tSG5HQ1Q4bjZ2MmlFLU9mUmtGSjZ1T3BmVUMtQnFn?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：8月26日成交10.73万张，未平仓合约250.52万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003c //www.ithome.com/0/994/802.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"762b\"\u003eIT之家 8 月 27 日消息，今天（8 月 27 日）在美国圣地亚哥举办的高通全球 6G 分析师与媒体日上，高通执行副总裁、边缘解决方案与数据中心业务总经理马德嘉（Durga Malladi）接受了包括IT之家在内的媒体专访，详细阐述了高通的 6G 战略与数据中心布局。\u003c/p\u003e\u003cp data-vmark=\"f127\"\u003e随着全球通信技术向 6G 时代加速迭代，通信、人工智能与算力产业的边界正快速消融，行业迎来技术范式与商业模式的双重变革。\u003c/p\u003e\u003cp data-vmark=\"4d29\"\u003e相较于 5G 时代聚焦移动宽带普及的发展路径，预定 2029 年商用落地的 6G，以 AI 原生、通感一体、全域算力协同为核心特质，重构终端形态、网络架构与产业生态，成为全球科技巨头角逐的核心赛道。\u003c/p\u003e\u003cp data-vmark=\"9661\"\u003e在终端形态上，马德嘉认为 6G 时代将催生一批全新的设备类别，\u003cstrong\u003e他称之为“智能体 AI 设备”，并指出这一趋势在中国已经出现。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"bdbc\"\u003e在他看来，这种全新的 AI 设备不限于智能手机，还包括传感器、可穿戴设备等各种连接设备，甚至可能没有显示屏。\u003c/p\u003e\u003cp data-vmark=\"3266\"\u003e三星、苹果、荣耀、小米、vivo 等厂商也在研发智能","tags":[],"cluster_size":1,"ts":"2026-08-26T23:46:08"},{"id":23388,"title":"DeepSeek调价之后，谁走出了斩杀线？ - 投资界","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1pTVQ0dkR5Z1hQVmR6NWRVSzhBQUYyRzA3MlR1eVowZlpmamd1OE9nMkdQVmVKNDg2eXNvcXpUYXRrYUx2ajJXMS1CakpPYUM2cDNpSHlB?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1pTVQ0dkR5Z1hQVmR6NWRVSzhBQUYyRzA3MlR1eVowZlpmamd1OE9nMkdQVmVKNDg2eXNvcXpUYXRrYUx2ajJXMS1CakpPYUM2cDNpSHlB?oc=5\" target=\"_blank\"\u003eDeepSeek调价之后，谁走出了斩杀线？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e投资界\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-26T23:35:00"},{"id":23389,"title":"Anthropic豪掷450亿美元向Nscale租赁AI算力 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNSFNnTmRnRGg1b0tCRzVmRjRyU1pKOHlKX0pIeEFsUHRWNjJmYlBMTkN4THFUQVdSMFMzVDB2bm0tWW5YcGZyNm1aVmhTTHZvbU44ZmZRN183NUpGSEhrc0lsNm5tMjV1S2JwMTB4aTdxYzZJd21MNFhKb211Q1NNTndjMDd5T1dsNlRpXw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxNSFNnTmRnRGg1b0tCRzVmRjRyU1pKOHl on-capture accuracy. We introduce a fiber optic sensing glove for full hand pose tracking that targets these failure modes, using multi-core shape-sensing fibers that capture each fiber's full 3D shape rather than curvature alone. A novel pipeline registers each reconstructed fiber shape to a com","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23222,"title":"A Durable Vision-Based Tactile Fingertip for Robotic Manipulation","url":"https://arxiv.org/abs/2608.24242","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24242v1 Announce Type: new \nAbstract: Currently available commercial vision-based tactile sensors provide rich contact information but remain vulnerable to abrasion and repeated concentrated loading, limiting their use in demanding robotic applications. This work presents a durable tactile fingertip comprising a soft silicone gel with a nonpigmented, textured, thin thermoplastic-polyurethane protective film and a replaceable sensing cartridge. Durability was evaluated using two accelerated laboratory procedures: a rotating-drum sanding test and a repetitive probe test applying 39.2","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23221,"title":"CARO: Contact-Agnostic Residual Observation for Zero-Shot Robust Quadruped Locomotion","url":"https://arxiv.org/abs/2608.24217","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24217v1 Announce Type: new \nAbstract: We propose CARO, a contact-agnostic residual observation framework for policy adaptation. CARO embeds a fixed-base Euler--Lagrange model into the reinforcement learning control loop and constructs a torque-level residual observation without requiring torque sensors, explicit contact estimation, or vision-based measurements of the floating-base position and linear velocity. A disturbance observer extracts a structured signal representing dynamics mismatch, while the policy learns to exploit this feedback for online adaptation. CARO is trained und","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23220,"title":"NVIDIA Cosmos-H-Dreams: Real-Time Generative Physics Simulation for Surgical Robotics","url":"https://arxiv.org/abs/2608.24199","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24199v1 Announce Type: new \nAbstract: Generative simulation for surgical robotics still lacks real-time interaction. Physical-robot experiments, often involving animal or cadaver labs, are time-consuming, costly, and difficult to reproduce, while classical simulators struggle to capture photorealistic appearance and deformable-tissue dynamics. We address this gap with Cosmos-H-Dreams, an integrated real-time surgical world-model system combining an action-conditioned generative model, a teacher-to-student distillation recipe, and a deployment stack built on the NVIDIA FlashDreams st","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23219,"title":"Robust Slip Detection and Material Classification via Spatiotemporal Transformers on a Uniformly-Illuminated Visuo-Tactile Sensor","url":"https://arxiv.org/abs/2608.24162","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24162v1 Announce Type: new \nAbstract: Tactile sensing is central to robotic manipulation, among which slip detection stands out as a quintessential and critical task. However, existing slip datasets are predominantly limited to binary classification, lacking fine-grained directional perception. To address this limitation, we propose a visuo-tactile sensor featuring customized uniform RGB illumination, alongside a unified perception framework. At the hardware level, the sensor achieves high-precision, sub-millimeter depth reconstruction. Based on this capability, we collect a multi-t","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23218,"title":"Coverage Planning for Robotic Tooth Preparation in Densely Constrained Environments","url":"https://arxiv.org/abs/2608.24155","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24155v1 Announce Type: new \nAbstract: Tooth preparation refers to the controlled removal of tooth structure to create an optimal substrate for fixed restorations and is a core procedure in restorative dentistry. Automating this task is particularly challenging for robots because the dental bur must operate within a densely constrained intraoral workspace, where even sub-millimeter deviations can compromise outcomes or damage adjacent structures. This paper presents a novel robotic system for autonomous full-crown tooth preparation. The proposed framework includes: 1) an anatomy-awar","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23217,"title":"PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control","url":"https://arxiv.org/abs/2608.24115","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24115v1 Announce Type: new \nAbstract: Multimodal large language models (MLLMs) can integrate long visual histories, reason under partial observability, and infer behavior from a few examples. Yet vision-language-action (VLA) models generally inherit pretrained representations without using this contextual capacity as episode memory. Memory-dependent policies address this gap through purpose-built history mechanisms. PonderPounce instead reuses an MLLM's native causal context as robot memory. Ponder, a System2 MLLM, accumulates episode observations, demonstrations, and prior cognitio","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23216,"title":"Trajectory-Level Continuous Action Representation for Robotic Manipulation","url":"https://arxiv.org/abs/2608.24111","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24111v1 Announce Type: new \nAbstract: We propose CAT, a trajectory-level continuous action representation framework for robotic manipulation. Existing visuomotor systems often entangle action representation with control frequency or rely on fixed temporal parameterizations. This leads to representational redundancy at high sampling rates and limits the modeling of critical motion. CAT instead encodes action trajectories within a fixed real-time interval into a set of continuous latent tokens. To ensure temporal consistency across varying control frequencies, we further incorporate a","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23215,"title":"TrAct: Bridging Robot Control and Visual Prediction with Visual Tracks","url":"https://arxiv.org/abs/2608.24101","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24101v1 Announce Type: new \nAbstract: Robot actions are inherently embodiment-specific and only weakly aligned with image-space visual changes, limiting their effectiveness as conditioning signals for robot world models. In contrast, visual tracks provide an embodiment-agnostic representation of how task-relevant points move through a scene, offering dense image-space guidance for accurate and spatially precise future video prediction. Building on this observation, we propose TrAct, a world-model-based robot decision-making framework that uses visual tracks as an intermediate interf","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23214,"title":"Hierarchical Skill Retrieval for Data-Efficient Adaptation of Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.24042","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24042v1 Announce Type: new \nAbstract: While Vision-Language-Action (VLA) models pretrained on large-scale robot datasets provide a strong foundation for robot manipulation, their performance can degrade when adapted to new tasks with limited task-specific demonstrations. Retrieval offers a practical way to reuse existing demonstrations for data-efficient adaptation, but existing methods often rely on visual similarity, state-action representations, or task-level language matching. These approaches may overlook the hierarchical structure of long-horizon manipulation tasks, where comp","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23213,"title":"NeurRAFT: Robot Motion Planning via Anchor-Level Flow Matching with Clearance-Aware Preference Tuning","url":"https://arxiv.org/abs/2608.24026","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.24026v1 Announce Type: new \nAbstract: Recent end-to-end neural motion planners generate trajectories from raw sensor observations, avoiding the privileged geometric models required by classical planners. However, collision-free planning in cluttered environments remains challenging. We present NeurRAFT, a generative planning framework based on anchor-level flow matching and clearance-aware preference tuning. Unlike prior neural planners that model dense waypoint sequences and spend capacity on redundant local details and smoothness, NeurRAFT operates on compact anchor waypoints. We","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23212,"title":"Bridging Teacher Expectations and Robot Learning via Coupling Dynamics","url":"https://arxiv.org/abs/2608.23994","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23994v1 Announce Type: new \nAbstract: Human-robot teaching focuses on enabling nontechnical experts to customize robots according to their needs after deployment. With recent advances in machine learning, human-robot teaching is no longer confined to offline learning where the data gathering step from a human teacher is separated from when the robot learns. Instead, more recent approaches for human-robot teaching focus on coupling human teaching with robot learning. This coupling impacts the structure, timing, and content of the teaching and learning interaction. However, it is curr","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23211,"title":"Sensorless damage-safe grasping","url":"https://arxiv.org/abs/2608.23983","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23983v1 Announce Type: new \nAbstract: Robotic fruit harvesting must hold produce securely without bruising it, yet compression stiffness varies several-fold with ripeness within a single species, so no fixed grip force spans the range. Rather than tune force, we bound deformation: a controller closes the gripper until the object's estimated compression strain reaches a user-specified limit $\\varepsilon$, using only the encoder position and motor-effort signal on every servo gripper---no tactile or force-torque sensor. Dividing an effort-based contact force by a lower bound on object","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23210,"title":"Safety-aware Model Predictive Path Integral Control with Signal Temporal Logic","url":"https://arxiv.org/abs/2608.23972","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23972v1 Announce Type: new \nAbstract: Safety-aware motion planning remains a challenge in robotics, especially when missions are time-critical and are under complex specifications. In this paper, we propose safety-aware-stl-mppi, a computationally efficient sampling-based receding-horizon planning framework designed to promote satisfaction of constraints expressed in Signal Temporal Logic (STL). Our approach encodes discrete-time STL formulas into candidate time-varying control barrier functions (CBF), which are integrated into a model predictive path integral (MPPI) controller. Our","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23209,"title":"Interpreting Control Latents for System Identification via Conditional Flow Matching","url":"https://arxiv.org/abs/2608.23887","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23887v1 Announce Type: new \nAbstract: Latent-conditioned adaptive policies can control robots across changing dynamics, but their learned latents remain internal representations of the policy rather than physical models that can be inspected, rolled out, or used by other control modules. This limits closed-loop analysis, diagnosis, and further improvement of a fixed policy. A direct mapping from latent to physical parameters is also under-specified, because multiple systems can induce similar closed-loop behavior. We therefore decode each operational latent into a distribution of qu","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23208,"title":"DreamLedger: Execution-Settled Credit Files for World-Model Imagination in Robot Decision Loops","url":"https://arxiv.org/abs/2608.23863","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23863v1 Announce Type: new \nAbstract: Robots are beginning to act on world-model predictions, yet reliability is still expressed through instantaneous, model-internal signals. DreamLedger instead treats reliability as a persistent deployment object: an execution-settled credit file recording how often consumed predictions are borne out, indexed by operating condition, region, and prediction horizon, and consulted before each use. Each consumed prediction is registered as a claim; attributable outcomes are settled against arriving reality at zero labeling cost, an attribution stage e","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23207,"title":"Resilience Matters for Embodied Agents System: New Metrics, Systematic Evaluation, and Optimization","url":"https://arxiv.org/abs/2608.23839","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23839v1 Announce Type: new \nAbstract: Embodied Agents System (EAS) are increasingly deployed in open-world physical domains, where reliability directly dictates deployment quality and human-agent trust. However, existing evaluations rely on outcome-centric metrics as success rate or safety scores that collapse diverse execution trajectories into coarse scores, obscuring the dynamic processes underlying agent behavior. Therefore, they ignore a critical property of EAS -- which we define as the Resilience -- that reflects how EASs recover, stabilize, and extend under perturbations and","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23206,"title":"Learning to Act While Waiting: RL Finetuning of Generalist Robot Policies Under Inference Latency","url":"https://arxiv.org/abs/2608.23831","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23831v1 Announce Type: new \nAbstract: While reinforcement learning (RL) allows generalist robot policies to continually improve during deployment, the large model size of modern generalist policies, such as VLAs, poses a fundamental obstacle to effective RL improvement. In particular, their severe inference latency---which can lead to pauses or jerky movements---can alter the effective environment dynamics and, if not correctly accounted for, break the Markov assumption that RL relies on, causing standard RL algorithms to fail completely. In this work, we introduce a latency-aware f","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23205,"title":"Concept-Guided Exploration: Building Persistent, Actionable Scene Graphs","url":"https://arxiv.org/abs/2608.23650","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23650v1 Announce Type: new \nAbstract: The perception of 3D space by mobile robots is rapidly moving from flat metric grid representations to hybrid metric-semantic graphs built from human-interpretable concepts. While most approaches first build metric maps and then add semantic layers, we explore an alternative, concept-first architecture in which spatial understanding emerges from asynchronous concept agents that directly instantiate and manage semantic entities. Our robot employs two spatial concepts (room and door), implemented as autonomous processes within a cognitive distribu","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23204,"title":"Macro-Operator Generation and Predicate Selection for TAMP Operator Learning","url":"https://arxiv.org/abs/2608.23629","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.23629v1 Announce Type: new \nAbstract: Creating symbolic operators by hand is one of the main bottlenecks in deploying Task and Motion Planning systems (TAMP). Recent works show that these operators can instead be learned directly from demonstration data. Existing methods, however, typically learn each action in isolation and cannot capture the recurring multi-step structure of manipulation tasks, so the search becomes intractable on long sequential tasks. A further inefficiency arises in the symbolic state: every provided predicate is evaluated at every search node, even when it nev","tags":[],"cluster_size":1,"ts":"2026-08-26T04:00:00"},{"id":23224,"title":"马斯克：人形机器人是特斯拉有史以来量产难度最大的产品 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMikwRBVV95cUxQM2YzZi0ya2xWdDNkLXlacVppczI4cGstUndxM1Z4eTN1X0lRNkp4R0pPcFFESXFOb1VQRGVGRTFRZ3ZZaFk5VGJpb3BtTmFtM3JXLWdCLU5zNVVTR1VFQUlQZHFrWFVyaFFOSVNoaURlVDNtNEdYWkVwUDhWSjBnS2hYVUFRTURkZDc3SWZUT0dPbGkzWHcxSnRhVy00bXZKQnlCMmM2M3J5VFVVN0xvTDc2OFZGdkdFSGlwR1FuNUw3c1k5blpsLTlORGZfcUloU2JVQWphUDZQVlpwMzV3TGZick9SSmF5U3h6M2tYbWZ4TG9VU1dpVjFWVUFxQW1xRnNaYjZNVVhaSWxzUVFZLURRWGE3akFrQlN0QXV3UG9obk1HdnVNczR2Z003dVV0aFdOVDNVV3RxcXBiQ1VWdERkQlF0eGpLZWpiM1ZJOThmZHV3Z1J1VmVfeFlOdG1qbTFmeDAzX2xnTl9XSFVWbk5yelA4dmJRUnJMQjJfVFB6UWxFYUJkRFJHcFptUlk0NEhybkF5dEVVOHFXdWN2dkRMT21YbnkxczktRzIzaTFFV0NPUG1MblJtQ2ZMV3JmbDBmSEh2cTkyaUlQVWtwaEtRT3RsWE5HeTBOVE42azM5RXdKWWRmVm1OYWxZZ1JSdTRkTnFULXRwQlJxQjlGbjFkakVVbFBKUEdsbUktTkJQNjg?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMikwRBVV95cUxQM2YzZi0ya2xWdDNkLXlacVppczI4cGstUndxM1Z4eTN1X0lRNkp4R0pPcFFESXFOb1VQRGVGRTFRZ3ZZaFk5VGJpb3BtTmFtM3JXLWdCLU5zNVVTR1VFQUlQZHFrWFVyaFFOSVNoaURlVDNtNEdYWkVwUDhWSjBnS2hYVUFRTURkZDc3SWZUT // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
