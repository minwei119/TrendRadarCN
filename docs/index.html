银浆是太阳能电池制造的核心辅材，白银在该环节的成本占比超过90%。近期走访多家实体企业了解到，部分头部光伏银浆企业及上游供应商，已着手组建专业的期货期权交易团队，一方面通过套期保值对生产经营环节的白银价格敞口进行管理，另一方面参与期货交割锁定白银实物的远期货源。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-02T22:26:22"},{"id":7169,"title":"上半年公募参与定增“成绩单”曝光：锚定新质生产力，逾八成实现浮盈","url":"https://wallstreetcn.com/livenews/3128256","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，在波动加剧的市场环境中，定向增发正成为公募机构获取超额收益的重要抓手，新质生产力方向成为公募扎堆的热土。公募排排网统计数据显示，截至2026年6月25日，今年以来共有23家公募机构合计参与了69只A股定增，合计获配金额达336.23亿元，较去年同期的109.17亿元大增207.99%。23家公募中有19家实现浮盈，占比达82.61%。按6月25日收盘价统计，今年以来公募参与定增合计浮盈82.61亿元，浮盈比例达到24.57%。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-02T22:24:26"},{"id":7170,"title":"上半年300余家公司拟回购逾千亿元，A股回购市场呈现三大新趋势","url":"https://wallstreetcn.com/livenews/3128255","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，A股上市公司密集披露回购计划。Wind数据显示，上半年共有307家上市公司披露回购计划，拟回购金额上限1105.09亿元，同比微降5.84%。尽管整体规模略有回调，但透过数据表象，A股回购市场正呈现出三大鲜明的结构性趋势：一是注销式回购占比大幅提升，直接增厚股东回报；二是地方国企控股上市公司回购积极性全面释放，发挥“压舱石”作用；三是食品饮料等消费板块回购规模大幅攀升，凸显管理层对公司价值的认可。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-02T22:21:17"},{"id":7171,"title":"美司法部重拳出擊 阿里巴巴遭罰6億天價和解金 - 新唐人電視台","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1LeXNDWEo4WlpMdHo5OGJKZlp0Rjl4TWZBVTdjS3VYeU9JT1h0eXhqWGZDY3ZTUEdmcnJSV2hrYVJuVWFnZnd5S2o5Z1JBb2VzZnUwdXJwZTJCdm5CUXczNNIBZkFVX3lxTE1udTE3M05fX1hHRG1jWVk3YXVhZFkwRGJIWDJCVnNKN2ZQQ3BnTXVKNlJVSDlmVlVrSURibU1aem40VkpxZUg0Ym9BR1RvdGc1WVNIZHpJVVpiTEQ1M3FpQy1vWncyUQ?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1LeXNDWEo4WlpMdHo5OGJKZlp0Rjl4TWZBVTdjS3VYeU9JT1h0eXhqWGZDY3ZTUEdmcnJSV2hrYVJuVWFnZnd5S2o5Z1JBb2VzZnUwdXJwZTJCdm5CUXczNNIBZkFVX3lxTE1udTE3M05fX1hHRG1jWVk3YXVhZFkwRGJIWDJCVnNKN2ZQQ3BnTXVKNlJVSDlmVlVrSURibU1aem40VkpxZUg0Ym9BR1RvdGc1WVNIZHpJVVpiTEQ1M3FpQy1vWncyUQ?oc=5\" target=\"_blank\"\u003e美司法部重拳出擊 阿里巴巴遭罰6億天價和解金\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新唐人電視台\u003c/font\u003e","tags c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e天脉网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T04:48:22"},{"id":7327,"title":"为量产铺路，马斯克晒特斯拉Optimus擎天柱机器人生产团队合照 - 新浪网","url":"https://news.google.com/rss/articles/CBMifkFVX3lxTE1wNU9aUGI4UU9LUHVnb1F0ZVpJN0FoLUpCdk5RSFlDNmhNUzFzNG8zcmhtRmhhNVJxVTNxQzJ3QmZRTG8yNWE4d1V1TlhnQmZjVjRKdXV6cUtEQzNPWEY2MkhrdDVlaUp5TzE4b0ktaXlBSllGZkQ2X3h1dGZHQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMifkFVX3lxTE1wNU9aUGI4UU9LUHVnb1F0ZVpJN0FoLUpCdk5RSFlDNmhNUzFzNG8zcmhtRmhhNVJxVTNxQzJ3QmZRTG8yNWE4d1V1TlhnQmZjVjRKdXV6cUtEQzNPWEY2MkhrdDVlaUp5TzE4b0ktaXlBSllGZkQ2X3h1dGZHQQ?oc=5\" target=\"_blank\"\u003e为量产铺路，马斯克晒特斯拉Optimus擎天柱机器人生产团队合照\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T04:19:29"},{"id":7344,"title":"Unleashing More Actions via Action Compositional Training for VLA Models","url":"https://arxiv.org/abs/2607.00351","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00351v1 Announce Type: new \nAbstract: Vision-Language-Action models excel at robotic manipulation, driven by the scale and diversity of demonstration data. However, standard training paradigms often cause VLA models to severely overfit to specific behavioral patterns, rendering them unable to generalize to out-of-distribution scenarios even when those scenarios merely require novel combinations of identical sub-skills. While expanding datasets can mitigate this overfitting, acquiring high-quality robot data remains notoriously labor-intensive and cost-prohibitive. To resolve this im","tags":[],"cluster_size":1,"ts":"2026-07-02T04:00:00"},{"id":7343,"title":"NeHMO: Neural Hamilton-Jacobi Reachability Learning for Decentralized Safe Multi-Arm Motion Planning","url":"https://arxiv.org/abs/2607.00326","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00326v1 Announce Type: new \nAbstract: Safe multi-arm motion planning is a challenging problem in robotics due to its high dimensionality, coupled configuration space, and complex collision constraints. Centralized planners are capable of coordinating all arms but often face scalability limitations, restricting applicability in real-time settings. On the other hand, decentralized methods are scalable and recent deep learning-based approaches have shown promising results. However, these depend on accurate behavior prediction or coordination protocols and may fail when other arms act u","tags":[],"cluster_size":1,"ts":"2026-07-02T04:00:00"},{"id":7342,"title":"ASPIRE: Agentic /Skills Discovery for Robotics","url":"https://arxiv.org/abs/2607.00272","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00272v1 Announce Type: new \nAbstract: Traditional robot programming is challenging: it requires orchestrating multimodal perception, managing physical contact dynamics, and handling diverse configurations and execution failures. We introduce ASPIRE (Agentic Skill Programming through Iterative Robot Exploration), a continual learning system that autonomously writes and refines robot control programs in a code-as-policy paradigm while compounding experience into a reusable skill library. ASPIRE discovers skills that persist across tasks, simulation and real-world settings, and embodim","tags":[],"cluster_size":1,"ts":"2026-07-02T04:00:00"},{"id":7341,"title":"HydraCollab: Adaptive Collaborative-Perception for Distributed Autonomous Systems","url":"https://arxiv.org/abs/2607.00191","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00191v1 Announce Type: new \nAbstract: Collaborative-perception enables multi-robot systems to enhance situational awareness by sharing perceptual information. Existing collaborative-perception systems face an inherent trade-off between communication bandwidth requirements and perception accuracy, where methods that exchange more information achieve better perception results at the cost of increased communication overhead. However, real-world communication networks impose bandwidth constraints that require minimizing communication overhead without sacrificing perception performance.","tags":[],"cluster_size":1,"ts":"2026-07-02T04:00:00"},{"id":7340,"title":"Distributed Multi Robot Lunar Cargo Transportation via Phase Decomposed Reinforcement Learning","url":"https://arxiv.org/abs/2607.00160","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00160v1 Announce Type: new \nAbstract: Modular reconfigurable robotic systems provide a scalable solution for cooperative surface operations in future lunar missions. However, cooperative cargo transportation remains challenging due to morphology-dependent topology changes, strong payload-induced coupling, long-horizon decision making, and safety constraints. This paper proposes a phase-decomposed reinforcement learning framework for cooperative cargo transport with distributed robotic units. The task is decomposed into lifting, transportation, and placement, each optimized with a de","tags":[],"cluster_size":1,"ts":"2026-07-02T04:00:00"},{"id":7339,"title":"3D Point World Models: Point Completion Enables More Accurate Dynamics Learning","url":"https://arxiv.org/abs/2607.00148","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.00148v1 Announce Type: new \nAbstract: Learning predictive models of the world enables robotic control through planning, potentially allowing robots to improvise solutions on new tasks. However, large video-based dynamics models lack explicit 3D spatial structure and suffer from geometrically inconsistent long-term rollouts with compounding errors. Emerging 3D dynamics models based on partial point clouds improve geometric consistency but remain sensitive to occlusions and accumulated prediction drift. To address these challenges, we // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
