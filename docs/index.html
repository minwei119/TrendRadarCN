500、纳指跌超1%，SpaceX首度收跌，芯片指数逆市收涨，黄金下挫。\n\n美联储继续按兵不动但暗示鹰派倾向，强调通胀承诺，半数决策者料年内加息。\n\n美联储主席沃什首秀：坚守2%通胀目标，成立五个特别工作组，个人未提交点阵图。\n\n特朗普：美联储按兵不动也还行，加息难以置信但可能发生，相信沃什。\n\n美官员称特朗普亲自提前签署美伊谅解备忘录，伊外交部称双方已签。\n\n美国原油库存下降超预期，最大商业原油储存枢纽库存跌至十年最低，已达警戒线。\n\n美国5月零售销售环比0.9%，创逾三年新高，加油站消费大幅增加。\n\n潘功胜陆家嘴论坛讲话：完善短端利率调控机制，创设境外央行回购工具。\n\n吴清陆家嘴论坛讲话：扩大第五套标准适用范围至AI领域，支持港股公司境内上市。\n\n丁向群陆家嘴论坛讲话：健全具有硬约束的金融风险早期纠正机制。\n\n整治外卖平台“内卷”！市监总局：不得以长期、大额补贴扰乱市场秩序。国家规范外卖平台补贴行为，美团、淘宝闪购、京东外卖：坚决拥护。\n\n六部门联合发文：上海离岸金融行动方案出炉，首批试点六大业务，布局数字人民币离岸应用。\n\n苹果放风涨价，二代iPhone Air或明年春面世，iPhone发布节奏迎重大调整。\n\n成本高企倒逼转向，微软考虑以DeepSeek替换昂贵的美国AI模型。\n\n“Fable5下架”引发AI监管“武器化”猜测：OpenA","tags":[],"cluster_size":2,"ts":"2026-06-17T23:30:23"},{"id":3152,"title":"纳斯达克100指数期货涨幅扩大至1%。","url":"https://wallstreetcn.com/livenews/3121301","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"纳斯达克100指数期货涨幅扩大至1%。","tags":[],"cluster_size":1,"ts":"2026-06-17T23:28:58"},{"id":3153,"title":"标普500指数期货上涨0.5%，从美联储发布决议后的跌势中反弹。","url":"https://wallstreetcn.com/livenews/3121300","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"标普500指数期货上涨0.5%，从美联储发布决议后的跌势中反弹。","tags":[],"cluster_size":1,"ts":"2026-06-17T23:15:23"},{"id":3154,"title":"行业分化，中小公募差异化突围","url":"https://wallstreetcn.com/livenews/3121294","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"广发基金6月16日公告，聘任徐瀚为广发亚太中高收益债券（QDII）的基金经理。近年来，广发基金已招募了多位绩优基金经理，包括刘兴旺、李崟、吴承根、周智硕等。易方达基金、富国基金、中欧基金等头部机构同样积极招兵买马。与头部基金公司持续补强投研实力相比，一些中小基金公司却陷入生存困境，管理规模不足百亿元，长期没有新产品发行，一些中小基金公司还需要靠股东增资进行“救济”。业内人士表示，中小基金公司有属于自己的发展机会，必然有一些市场细分方向是头部机构没有覆盖的，中小基金管理人可以尝试差异化、精品化的产品布局来实现业务发展。（中证报）","tags":[],"cluster_size":1,"ts":"2026-06-17T22:52:29"},{"id":3155,"title":"下半年投资亮点纷呈，公募策略会看好AI投资范式生变","url":"https://wallstreetcn.com/livenews/3121289","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，光大保德信基金、平安基金、富国基金、国泰基金等多家公募机构举行了策略会，多位基金经理围绕科技、高端制造等投资者关切的热门赛道展开讨论，展望下半年市场的投资机遇。业内人士表示，当前A股正从“估值驱动”向“盈利换估值”阶段切换，权益资产配置价值突出，结构重于总量。在宏观层面，全球经济正经历从地产基建向AI投资与装备制造的范式切换，中国的中游制造领域或迎来“战略跃升期”，有望成为未来一到三年的核心景气主线；在微观层面，AI产业从“奖励资本开支”转向“验证真实回报”，产能成为选股的首要标准，光通信、半导体设备材料等方向确定性强。（中证报）","tags":[],"cluster_size":1,"ts":"2026-06-17T22:40:05"},{"id":3156,"title":"分散化配置底层逻辑仍然有效，多资产组合急需“动态校准”","url":"https://wallstreetcn.com/livenews/3121287","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，科技主导单边行情。无论是价值风格还是黄金等商品资产，在外部扰动因素不断的情况下都表现不尽如人意，这给多资产投资带来了一定冲击。今年以来就有不少采取多资产策略的FOF产品回报率为负，FOF扎堆重仓的底层基金，比如黄金、红利、港股通互联网等主题ETF，普遍表现不及预期。","tags":[],"cluster_size":1,"ts":"2026-06-17T22:38:26"},{"id":3157,"title":"央地多措并举，城市更新按下“快进键”","url":"https://wallstreetcn.com/livenews/3121284","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，城市更新领域的第一部国家级专项规划——《城市更新“十五五”规划》落地。并且，2026年度中央财政支持实施城市更新行动评选结果公示，长春、无锡、宁波、深圳、银川等15个城市新晋入选。至此，2024年至2026年累计50座城市获得中央财政支持城市更新。专家表示，多方助力推动下，城市更新将拉动数万亿级投资，这将给相关公司带来机遇。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-17T22:30:22"},{"id":3158,"title":"科创板第五套标准扩围至大模型企业，智谱、MiniMax“回A”有望提速","url":"https://wallstreetcn.com/livenews/3121281","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"科创板第五套上市标准迎来新的适用对象——人工智能大模型企业。正在筹备“回A”的智谱和MiniMax，因此获得了制度层面的更多确定性。在业内看来，两家公司若在科创板“会师”，境内投资者将获得直接定价大模型核心资产的入口，产业资源也会加速向头部玩家集中，国产大模型的本土资本链与供应链有望就此形成共振。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-17T22:24:11"},{"id":3159,"title":"投资中国从“可选”变“首选”，嘉宾热议中国资本市场功能完善路径","url":"https://wallstreetcn.com/livenews/3121278","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"从科创板“1+6”改革落地见效，到银行系资本成为股权市场“不容忽视的力量”，再到全球投资者将中国科技创新视为“首选”……在6月17日举行的2026陆家嘴论坛“全体大会三：建立健全功能完善的资本市场”上，多位与会嘉宾表示，中国资本市场正经历投融资结构的转变，全球投资者对中国的兴趣从“可选”转向“首选”，但低配格局仍是待解之题。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-17T22:18:18"},{"id":3160,"title":"周三（6月17日）纽约尾盘，标普500股指期货最终跌0.95%，道指期货跌0.77%，纳斯达克100股指期货跌0.49%。\n\n罗素2000股指期货跌0.32%。","url":"https://wallstreetcn.com/livenews/3121264","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（6月17日）纽约尾盘，标普500股指期货最终跌0.95%，道指期货跌0.77%，纳斯达克100股指期货跌0.49%。\n\n罗素2000股指期货跌0.32%。","tags":[],"cluster_size":1,"ts":"2026-06-17T21:10:38"},{"id":3161,"title":"6月18日热门中概股多 ult to distinguish grounded embodied reasoning from shortcut-driven visual or linguistic pattern matching. We present ERQA-Plus, a diagnostic benchmark for rea","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3228,"title":"MuseVLA: An Adaptive Multimodal Sensing Vision-Language-Action Model for Robotic Manipulation","url":"https://arxiv.org/abs/2606.17598","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17598v1 Announce Type: new \nAbstract: Humans naturally leverage diverse sensing modalities to interact with the physical world, while most Vision-Language-Action (VLA) models for robotics rely solely on RGB observations. This limits their ability to perceive physical properties that are difficult or impossible to infer from RGB cameras, such as temperature, sound, or radar response. We present MuseVLA, an adaptive multimodal sensing VLA model that integrates novel sensors as on-demand tools for robotic manipulation. Given a task instruction and visual context, MuseVLA first generate","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3227,"title":"GASE: Gaussian Splatting-Based Automated System for Reconstructing Embodied-Simulation Environments","url":"https://arxiv.org/abs/2606.17520","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17520v1 Announce Type: new \nAbstract: Training embodied agents in the real world requires skilled operators and expensive hardware. Simulation environments offer a compelling alternative by enabling large-scale, cost-effective data augmentation. Consequently, rapidly constructing high-fidelity simulation scenes with a minimal sim-to-real gap has become a critical objective in robot learning. While reconstruction-based methods provide superior visual quality, current workflows are hindered by inefficient data acquisition and subpar foreground object extraction. We thus propose GASE,","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3226,"title":"MagicSim: A Unified Infrastructure for Executable Embodied Interaction","url":"https://arxiv.org/abs/2606.17511","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17511v1 Announce Type: new \nAbstract: Robot learning and embodied agents now require simulation to serve as a shared execution substrate linking control, skills, and planning, not only as a renderer, controller testbed, or fixed task environment. Existing pipelines split these layers with \"magic\" actions, disconnected training environments, or forward-only renders that cannot reproduce, evaluate, and annotate the same episode. We present MagicSim, an embodied interaction infrastructure built around one deterministic batched runtime and a shared Markov decision process (MDP). From YA","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3225,"title":"When Robots Sleep: Offline Skill Consolidation for Shared-Policy Robot Learning","url":"https://arxiv.org/abs/2606.17493","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17493v1 Announce Type: new \nAbstract: Robots that learn over long deployments must add new skills without losing the shared policy structure that makes earlier skills reusable. We study sequential robot skill learning, where previous trajectories and task losses may be unavailable, and the deployed policy must remain a single shared controller without task-specific heads, routing, or adapters. We identify skill-coupling collapse, a failure mode in which individual skill success remains non-trivial while reliability among related skills deteriorates. We propose Sleeping Robots, a wak","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3224,"title":"AnnotateAnything: Automatic Annotation of 3D Assets for Robot Manipulation","url":"https://arxiv.org/abs/2606.17446","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17446v1 Announce Type: new \nAbstract: Simulation enables scalable robot data collection, but raw 3D assets provide only geometry, lacking the semantic, interactive, and physical knowledge needed to specify where and how robots should act. In this work, we present AnnotateAnything, a general automatic annotation framework that converts passive 3D assets into manipulation-ready assets with structured, diverse, and executable manipulation labels. AnnotateAnything is built around two complementary pipelines. First, a unified visual-language annotation pipeline using vision-language reas","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3223,"title":"DexLink Hand: A Compact, Affordable, 16-DOF Linkage-Driven Hand with Human-Like Dexterity","url":"https://arxiv.org/abs/2606.17418","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17418v1 Announce Type: new \nAbstract: Dexterous robotic hands face a longstanding trade-off among dexterity, compactness, and affordability. Particularly, high-degree-of-freedom designs typically demand complex actuation and transmission, hindering integration into human-scale forms. To address these challenges, this work presents a compact, low-cost linkage-driven anthropomorphic hand that achieves high dexterity, structural integration, and human-hand-like functionality. The hand integrates 20 joints driven by 16 independent actuators, with all actuation, sensing, and transmission","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3222,"title":"Where Should Action Generation Begin? A Learnable Source Prior for Generative Robot Policies","url":"https://arxiv.org/abs/2606.17408","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17408v1 Announce Type: new \nAbstract: Generative robot policies typically begin action generation from an observation-independent standard Gaussian distribution, leaving the choice of source distribution underexplored. This work asks a simple question: where should action generation begin? We propose LeaP, a Learnable source Prior that replaces the standard Gaussian with a proprioception-conditioned diagonal Gaussian over action chunks. Parameterized by a lightweight MLP, LeaP jointly predicts the mean and state-adaptive variance of the source distribution, while keeping the downstr","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3221,"title":"Damage Adaptation in Seconds for Architected Materials","url":"https://arxiv.org/abs/2606.17394","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17394v1 Announce Type: new \nAbstract: Adaptation to damages and in-situ physical repairs is essential for long-term robot autonomy, yet challenging outside of narrowly defined and well-anticipated bounds. In this work we proprioceptively adapt to catastrophic damage in soft-actuated systems in under one minute. Architected materials are well equipped for adaptation: actuator failure occurs gradually rather than acutely, and damage can be described in a low-dimensional, discrete coordinate space. Surprisingly, latent damage representations plus a simple yet robust ensemble method is","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3220,"title":"EgoInfinity: A Web-Scale 4D Hand-Object Interaction Data Engine for Any-View Robot Retargeting and Video-to-Action Robot Learning","url":"https://arxiv.org/abs/2606.17385","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17385v1 Announce Type: new \nAbstract: Internet videos constitute the largest reservoir of embodied human manipulation knowledge, yet converting arbitrary RGB footage into actionable robot training data remains a major bottleneck. Existing lab- or factory-collected datasets are narrow in scale and diversity, limiting open-world robot learning. Instead of proposing a static dataset, we introduce EgoInfinity, a universal 4D hand-object interaction data engine that enables web-scale data generation for robot retargeting and learning. EgoInfinity is a modular engine integrating perceptio","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3219,"title":"Contactless Respiratory Monitoring on Heterogeneous Mobile Robots: A Multimodal Edge-Computing Framework","url":"https://arxiv.org/abs/2606.17376","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17376v1 Announce Type: new \nAbstract: Respiratory-rate (RR) monitoring is a critical component of remote triage and victim assessment in emergency response, disaster recovery, and infectious-disease scenarios, where minimizing physical contact can reduce responder risk and improve operational safety. However, field deployment of contactless RR monitoring remains challenging due to variable illumination, posture changes, platform heterogeneity, and the impracticality of wearable sensors in hazardous environments. In this paper, we present a modality-adaptive contactless RR monitoring","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3218,"title":"Transformer-Based Warm-Starting for Feasible and Optimal Terminal Approach to Tumbling Objects with Space Manipulators","url":"https://arxiv.org/abs/2606.17317","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17317v1 Announce Type: new \nAbstract: Real-time trajectory generation for on-orbit robotic servicing is challenging due to the nonlinear coupling between spacecraft bus motion, manipulator dynamics, visibility cone, and trajectory-level safety constraints. This paper studies learning-based warm-starting for sequential convex programming (SCP) in the terminal approach of a space manipulator toward a tumbling target. The proposed framework decomposes the problem into a system center-of-mass translational planning stage and a coupled attitude--manipulator torque-allocation stage, and a","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3217,"title":"Abstention-Aware Personalized Object Rearrangement via Uncertainty-Guided LLM Assistance","url":"https://arxiv.org/abs/2606.17309","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17309v1 Announce Type: new \nAbstract: Robotic assistance in household environments requires not only predicting where objects should be placed, but also reasoning about when objects should not be placed at all. Existing approaches to personalized object rearrangement primarily focus on placement decisions under the assumption of clean observations and complete actionability, limiting their applicability in realistic, cluttered, and partially erroneous settings. In this paper, we introduce APOLLO, a hybrid framework for abstention-aware personalized object rearrangement that combines","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3216,"title":"Contrastive Action-Image Pre-training for Visuomotor Control","url":"https://arxiv.org/abs/2606.17256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17256v1 Announce Type: new \nAbstract: Existing vision encoders for robotics face a fundamental bottleneck: robotic datasets lack the scale necessary for large-scale pre-training. Prior work circumvents this data scarcity by turning to internet-scale image and language data or egocentric human video. While these models show promise, neither paradigm learns from paired vision and action data, which downstream visuomotor control policies require. However, robot trajectories, the most direct source of this paired signal, are not available at pre-training scale, motivating us to extract","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3215,"title":"ACE-Ego-0: Unifying Egocentric Human and Robotic Data for VLA Pretraining","url":"https://arxiv.org/abs/2606.17200","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17200v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models benefit from large-scale and diverse embodied data, yet scaling robot trajectory collection is costly and labor-intensive. Recent advances show that large-scale egocentric human videos provide complementary real-world supervision in pretraining. However, joint training on human and robot data remains challenging due to divergences in action spaces, embodiment structures, temporal dynamics, and supervision quality. We introduce ACE-EGO-0, a unified VLA pretraining framework jointly leveraging heterogeneous data","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3214,"title":"Extracting Semantics: LLM-Guided Automatic Population of Robot Ontology from URDF","url":"https://arxiv.org/abs/2606.17073","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17073v1 Announce Type: new \nAbstract: While commonsense knowledge may suffice for virtual agents, embodied robots interacting with humans require grounded and semantically rich representations of both their environment and their own physical embodiment. In cognitive robotics, ontologies are effective for integrating such heterogeneous knowledge to enable explainable reasoning, even during continuous knowledge updates. Yet, their manual construction remains a bottleneck. We present a preliminary approach for the automatic generation of robot semantic abstractions by transforming Unif","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":2701,"title":"Eno humanoid robot debuts as general-purpose worker for industries - Interesting Engineering","url":"https://news.google.com/rss/articles/CBMiqAFBVV95cUxPS3RNLWFlcEFGNk5XZGd5cEJyVXkxd19lUGc0b1Naa2lLUkU1WEJCMkZXOXJLTDJxYk45cXFfY1JaMWRQeDJHdkJnNTBxTV9ZcVVMZVVnSW1QWjd5OG5XeGFIRUF3ZEFXeGEyU2ZRTzVIbFcwRjhWeVZBNXJXYlVnVUp4Snc5LTFOMzlRVmk3MnNYNGxzZFAwdEFid3dzNjR4TVh3cGs3cjA?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiqAFBVV95cUxPS3RNLWFlcEFGNk5XZGd5cEJyVXkxd19lUGc0b1Naa2lLUkU1WEJCMkZXOXJLTDJxYk45cXFfY1JaMWRQeDJHdkJnNTBxTV9ZcVVMZVVnSW1QWjd5OG5XeGFIRUF3ZEFXeGEyU2ZRTzVIbFcwRjhWeVZBNXJXYlVnVUp4Snc5LTFOMzlRVmk // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
