5\" target=\"_blank\"\u003e阿里巴巴2027财年Q1营收2689.5亿元，归母净利润105.4亿元\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-20T22:40:00"},{"id":21748,"title":"险资7月以来“摸底”上市公司超千家次，硬科技是关注重点","url":"https://wallstreetcn.com/livenews/3152623","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"7月以来已有超百家保险及保险资管公司合计调研A股上市公司超1200家次。从行业来看，电子元件、通信设备、集成电路、工业机械、电子设备和仪器等行业备受险资关注。从被调研个股来看，中际旭创、新易盛、京东方A、源杰科技、天孚通信等上市公司获保险及保险资管公司扎堆调研。业内人士认为，保险资管作为长期资金的重要管理者，应坚持长期投资、价值投资，守住风险底线，以耐心资本助力高质量发展。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-20T22:36:39"},{"id":21749,"title":"阿里巴巴：2027财年第一季度营收2689.5亿元 同比增长9% - 东方财富","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE5HUXQ4MDFPX04xdGF2RVJZRWJ5Z3p2dUNzUHdUcEFteTZYOFBYTkFSTEJubF9aZ2ZwcWRWaVBUT1p1ZktmZWJrRTJWOWt3M01ybU5xR1pqTmJTekg4RUJneQ?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE5HUXQ4MDFPX04xdGF2RVJZRWJ5Z3p2dUNzUHdUcEFteTZYOFBYTkFSTEJubF9aZ2ZwcWRWaVBUT1p1ZktmZWJrRTJWOWt3M01ybU5xR1pqTmJTekg4RUJneQ?oc=5\" target=\"_blank\"\u003e阿里巴巴：2027财年第一季度营收2689.5亿元 同比增长9%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e东方财富\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-20T22:19:30"},{"id":21750,"title":"热点城市楼市迎结构性回暖","url":"https://wallstreetcn.com/livenews/3152614","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"进入2026年下半年，随着各地楼市政策发力，热点城市房地产市场走出稳步修复行情。调研发现，当前热点城市楼市已告别普涨式回暖，迎来真实居住需求主导下的结构性修复，购房者决策更趋审慎理性，卖旧买新的置换需求持续升温。房地产行业已迈入供需关系持续优化、发展质量优先的新周期。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-20T22:15:16"},{"id":21751,"title":"美股收盘：贝森特“救市”有效期仅持续一天 阿里巴巴绩后低开高走 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMibkFVX3lxTFB3N3hvU3paUGRDekhJN2dHWXhkNm9kUHg1OWVVa0Rzb21oYkVEblVEU0xVUHJvNXFlOTFwQVJTSDRIaEJidVFwMlNMTVN6WnJtLXViVG1URVhFd2dyN0hRTWR4UGlrbndDR3hvYllB?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMibkFVX3lxTFB3N3hvU3paUGRDekhJN2dHWXhkNm9kUHg1OWVVa0Rzb21oYkVEblVEU0xVUHJvNXFlOTFwQVJTSDRIaEJidVFwMlNMTVN6WnJtLXViVG1URVhFd2dyN0hRTWR4UGlrbndDR3hvYllB?oc=5\" target=\"_blank\"\u003e美股收盘：贝森特“救市”有效期仅持续一天 阿里巴巴绩后低开高走\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-20T21:43:25"},{"id":21752,"title":"牛津经济研究院分析师约翰·卡纳万（John Canavan）认为：本周四周和八周美国国库券拍卖均受到强烈追捧。财政部宣布增加长端曲线回购，可能会导致国库券发行量","url":"https://wallstreetcn.com/livenews/3152611","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"牛津经济研究院分析师约翰·卡纳万（John Canavan）认为：本周四周和八周美国国库券拍卖均受到强烈追捧。财政部宣布增加长端曲线回购，可能会导致国库券发行量小幅对冲性增加，但不足以显著削弱需求。\n\n与此同时，美联储加息预期的下降以及货币市场基金资产的高位水平——加上其久期不断缩短——仍是短期国库券的利好因素。","tags":[],"cluster_size":1,"ts":"2026-08-20T21:41:00"},{"id":21753,"title":"德意志银行策略师估计，日本在4月和5月的第一轮干预消耗了其超过一半的国库券持有量，并假设6月份国库券的减少是由于日本在外国逆回购资金池中重建美元存款。\n\n依赖美","url":"https://wallstreetcn.com/livenews/3152610","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"德意志银行策略师估计，日本在4月和5月的第一轮干预消耗了其超过一半的国库券持有量，并假设6月份国库券的减少是由于日本在外国逆回购资金池中重建美元存款。\n\n依赖美元存款和到期国库券的收益在经济上更为合理，因为存放在美联储外国逆回购资金池中的美元和短期国库券的收益率均低于从FIMA（外国和国际货币当局回购机制）借款的成本。","tags":[],"cluster_size":1,"ts":"2026-08-20T21:40:24"},{"id":21754,"title":"美联储外国逆回购资金池使用量升至10月以来最高","url":"https://wallstreetcn.com/livenews/3152609","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"外国央行及其他货币当局使用的一项关键美联储流动性工具的余额连续第二周上升，表明各国官员仍在继续增加现金储备。\n\n截至8月19日的数据显示，这些货币官员在美联储的逆回购协议（RRP）资金池中存放了3730亿美元，高于一周前的3570亿美元。自8月5日以来，使用量增加了约560亿美元，为2022年10月以来最大的两周增幅。市场参与者正密切关注外国逆回购资金池的使用情况，以寻找日本在上月干预以捍卫日元后正在重建现金储备的迹象。","tags":[],"cluster_size":1,"ts":"2026-08-20T21:39:54"},{"id":21755,"title":"阿里巴巴分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3152606","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"一、架构调整：四大业务板块重新梳理。\n\nCFO徐宏（Toby Xu）宣布，为了更好地发挥电商业务协同效应并强化全栈AI能力，阿里对财务报告分部进行了重大调整：\n\n阿里巴巴电商集团（Alibaba E-commerce Group）：整合了中国电商（淘天）、即时零售（盒马、淘宝小时达）、国际数字商业（AliExpress等）及全球批发（1688、Alibaba.com）。\n\nAI云与计算服务（AI Cloud and Compute Services）：由阿里云（Cloud Intelligence Group）与平头哥（T-Head）芯片业务合并而成。\n\nAI实验室与应用（AI Labs and Applications）：涵盖AI模型实验室、通义C端应用（Qwen App）及企业级Productivity协同工具（QwenWork）。\n\n所有其他（All Others）。","tags":[],"cluster_size":1,"ts":"2026-08-20T21:29:38"},{"id":21756,"title":"周四（8月20日）纽约尾盘，标普500股指期货最终跌0.77%，道指期货跌1.23%，纳斯达克100股指期货跌0.70%。\n\n罗素2000股指期货跌1.33%。","url":"https://wallstreetcn.com/livenews/3152601","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四（8月20日）纽约尾盘，标普500股指期货最终跌0.77%，道指期货跌1.23%，纳斯达克100股指期货跌0.70%。\n\n罗素2000股指期货跌1.33%。","tags":[],"cluster_size":1,"ts":"2026-08-20T21:08:58"},{"id":21757,"title":"阿里巴巴期权聚焦：8月20日成交36.27万张，未平仓合约242.21万张 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMimgFBVV95cUxNbUxQRXVZQlhhMElzSVc2TkJDLV9jQ3BLakU5bWEzSThUX1hVNFh3Y1lVVmEycGs2WjJCSExMSllPX2NsVGZ6TGRnTnh4QVVYM09Ka0pNRkswck9uZ1g4SEJqUklGWVpvQm1FNlp0eldTMU1yUEV1cW1yNFF1YU5DYmRwWE5hY1ppU2NrLUhNQU5nWWhYbkl5WEpn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMimgFBVV95cUxNbUxQRXVZQlhhMElzSVc2TkJDLV9jQ3BLakU5bWEzSThUX1hVNFh3Y1lVVmEycGs2WjJCSExMSllPX2NsVGZ6TGRnTnh4QVVYM09Ka0pNRkswck9uZ1g4SEJqUklGWVpvQm1FNlp0eldTMU1yUEV1cW1yNFF1YU5DYmRwWE5hY1ppU2NrLUhNQU5nWWhYbkl5WEpn?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：8月20日成交36.27万张，未平仓合约242.21万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-20T20:50:18"},{"id":21759,"title":"阿里巴巴：2027财年第一季度资本支出为676.78亿元 同比增长75% - 东方财富","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE0tWVlSYkwxUHJOZ3JEQTN5WmRUYzNrUWVLSF9neGJSdzd5NXF5NFlqQkJrb0VhVmJGMlBIdXU3SUVrUHh0cUV0ZWFBOEVlY0FwdGRzZ0tTM3ZqUnktOGJueA?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE0tWVlSYkwxUHJOZ3JEQTN5WmRUYzNrUWVLSF9neGJSdzd5NX 3e阿里称算力投资3年内回本 Anthropic剑指史上最大IPO | 环球市场\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-20T23:52:19"},{"id":21961,"title":"Mac 版 ChatGPT 可控制“信息”应用，古尔曼称恐触及苹果 Siri AI 的设备优势","url":"https://www.ithome.com/0/992/426.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"2ba7\"\u003eIT之家 8 月 21 日消息，OpenAI 昨日（8 月 20 日）在 X 平台发布推文，宣布升级 macOS 版 ChatGPT 应用程序，添加控制苹果“信息”（Apple Messages）能力，\u003cstrong\u003e可以读取、撰写、发送短信，并支持搜索消息以及生成对话摘要。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"ee57\" style=\"text-align: center;\"\u003e\u003ciframe src=\"https://player.bilibili.com/player.html?bvid=bv1Bb8T6hEJ3\u0026amp;autoplay=0\u0026amp;page=1\" class=\"ithome_video bilibili\" frameborder=\"no\" width=\"100%\" allowfullscreen=\"true\"\u003e\u003c/iframe\u003e\u003c/p\u003e\u003cp data-vmark=\"ba78\"\u003eOpenAI 公司表示在征得用户授权后，ChatGPT 可以读取、撰写和发送短信，也能搜索消息，获取对话摘要及其他信息。官方明确表示该功能不会基于用户的全部消息建立索引，且需要用户明确同意。\u003c/p\u003e\u003cp data-vmark=\"f371\" style=\"text-align: center;\"\u003e\u003cimg src=\"https:","tags":[],"cluster_size":1,"ts":"2026-08-20T23:46:37"},{"id":21962,"title":"韩国企业首次：消息称 SK 海力士拟在日本建设存储芯片工厂，投资规模预计达数十万亿韩元","url":"https://www.ithome.com/0/992/425.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"7269\"\u003eIT之家 8 月 21 日消息，据韩民族日报消息，SK 海力士正在推进一项方案，\u003cstrong\u003e计划斥资数十万亿韩元在日本东北部的宫城县建设存储芯片工厂\u003c/strong\u003e。韩国半导体企业在日本大规模投资设立本地生产基地，此举尚属首例。\u003c/p\u003e\u003cp data-vmark=\"2b74\"\u003e一位商界知情人士透露：“据了解，SK 集团会长崔泰源近期已亲自视察了该地区。”目前，宫城县正与九州、北海道一同被日本政府列为重点扶持的半导体产业三大核心基地。\u003c/p\u003e\u003cp data-vmark=\"fef5\"\u003eIT之家从报道获悉，业内预计该项目的投资规模将在数十万亿韩元级别。相较于韩国本土龙仁及湖南半导体产业集群数百万亿韩元的投资体量，\u003cstrong\u003e日本项目属于相对较小规模的生产基地建设\u003c/strong\u003e。外界分析认为，面对全球存储芯片持续面临的供需紧张局势，此举意在通过前瞻性投资进一步扩充产能。\u003c/p\u003e\u003cp data-vmark=\"cca4\"\u003e若该计划顺利落地，SK 海力士将成为继美光和台积电之后，第三家在日本设立半导体制造工厂的海外企业。相比之下，三星电子目前仅在日本横滨设有一处下一代半导体封装研发中心。\u003c/p\u003e\u003cp data-vmark=\"ec42\"\u003e\u003cstrong\u003e相关阅读：\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"small-size list-","tags":[],"cluster_size":1,"ts":"2026-08-20T23:43:56"},{"id":21963,"title":"【深圳特区报】智能体“调度” 无人机“送餐” 机器人“指路” 一大批前沿科技应用场景落地城市公共空间 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTFA2SjVsZmNuSUpxc3ZRXzNKY2llU0JDVGwzZ21EX25QZTQwaTRWazVhTTFROW9Sa2gtWHFJdjdsV3ROQTNnNE5yQ1A4RHcxM2t0cldoQjNB?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTFA2SjVsZmNuSUpxc3ZRXzNKY2llU0JDVGwzZ21EX25QZTQwaTRWazVhTTFROW9Sa2gtWHFJdjdsV3ROQTNnNE5yQ1A4RHcxM2t0cldoQjNB?oc=5\" target=\"_blank\"\u003e【深圳特区报】智能体“调度” 无人机“送餐” 机器人“指路” 一大批前沿科技应用场景落地城市公共空间\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-20T23:30:00"},{"id":21964,"title":"Omdia：2026 年非洲智能手机市场预计下滑 26%，结束连续三年增长态势","url":"https://www.ithome.com/0/992/421.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ba6f\"\u003eIT之家 8 月 21 日消息，根据 Omdia 最新研究，非洲智能手机市场正在进入调整期，Omdia 预计 2026 年市场将\u003cstrong\u003e下降 26%\u003c/strong\u003e，结束连续三年的增长态势。\u003c/p\u003e\u003cp data-vmark=\"35f2\"\u003eIT之家从报告获悉，2026 年第二季度，非洲智能手机市场三年来首次出现同比下滑，\u003cstrong\u003e出货量下降 7%\u003c/strong\u003e。随着设备价格持续上涨，整个非洲市场的消费者购买力承受更大的压力。其中，100 美元\u003cspan class=\"exch-money-value\"\u003e（IT之家注：现汇率约合 674.6 元人民币）\u003c/span\u003e以下的入门级市场尤为明显。长期以来，该价格区间一直是非洲新兴中产阶级实现数字连接的重要入口，但其出货量同比下降 34%，\u003cstrong\u003e减少近 300 万部\u003c/strong\u003e。不断上涨的存储器成本以及 AI 需求推动的供应链调整，进一步加剧了入门级智能手机的供应和价格压力。\u003c/p\u003e\u003cp data-vmark=\"994a\"\u003eOmdia 首席分析师 Manish Pravinkumar 表示：“我们正在见证非洲智能手机市场被迫向更高价格区间转移。\u003cspan class=\"wx_text_underline\"\u003e厂商已经无法以可盈利的方式生产售价 75 美元\u003cspan","tags":[],"cluster_size":1,"ts":"2026-08-20T23:25:25"},{"id":21965,"title":"史上最大IPO？Anthropic或超越SpaceX，估值剑指2万亿美元 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPRWJzbmtvUmtJOXdKd2Q4US16OHloTTFmclFZUH size":1,"ts":"2026-08-20T04:55:00"},{"id":21625,"title":"Unitree CEO predicts AI breakthrough for humanoid robots - The Jerusalem Post","url":"https://news.google.com/rss/articles/CBMiX0FVX3lxTE12WHB1dThTNU01RVljSlVLWjFhalNwS3FxN0txdFZ2bXE3RnBISzJpY2ZaZTdrZUJxdk9LU3RNa1VNTDA3TmpIcjlleGFqcVp6UHRxX1ItVDBOQWZSdGpV?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiX0FVX3lxTE12WHB1dThTNU01RVljSlVLWjFhalNwS3FxN0txdFZ2bXE3RnBISzJpY2ZaZTdrZUJxdk9LU3RNa1VNTDA3TmpIcjlleGFqcVp6UHRxX1ItVDBOQWZSdGpV?oc=5\" target=\"_blank\"\u003eUnitree CEO predicts AI breakthrough for humanoid robots\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eThe Jerusalem Post\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-20T04:32:52"},{"id":21644,"title":"LT-Mem: Volatility-Aware Spatio-Temporal Memory for Lifelong Scene Understanding","url":"https://arxiv.org/abs/2608.19059","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.19059v1 Announce Type: new \nAbstract: Long-term robot operation in evolving environments requires object-level understanding that persists across repeated revisits. Existing systems either overwrite history to maintain an up-to-date map or store semantic snapshots without consistent cross-session object identity, resulting in temporal amnesia: the systematic loss of object history that prevents answering queries such as \"Where has the green chair been across all sessions?\" We propose LT-Mem, a volatility-aware memory evolution framework that unifies spatially aligned instance-level","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21643,"title":"RoboEdit: Turning Human Manipulation Videos into Scalable Robot Experience","url":"https://arxiv.org/abs/2608.18948","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18948v1 Announce Type: new \nAbstract: Collecting robot hand-object interaction data is costly and embodiment-specific, yet abundant human-object videos remain unusable for robot training. We present RoboEdit, a human-to-robot video editing suite that transforms human manipulation videos into action-consistent, physically plausible robot videos with aligned 3D hand states. To enable scalable supervision, we introduce RoboEdit-ADC, an automatic pipeline that reconstructs and retargets 3D interactions from RGB videos across embodiments. This pipeline generates RoboEdit-14M, a large-sca","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21642,"title":"Beyond Placement and Articulation: Usage-Driven Code Scenes for Embodied Interaction","url":"https://arxiv.org/abs/2608.18840","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18840v1 Announce Type: new \nAbstract: Indoor scene synthesis provides essential environments for embodied AI, robotic manipulation, and simulation-based policy learning. Recent code-based scene generation methods produce editable and extensible environments, yet they remain focused on visual construction and object-level articulation, leaving the functional usage of scenes largely unmodeled. To address this problem, we present RoomWright, an agentic usage-driven framework for generating 3D scenes represented entirely as code for embodied interaction. RoomWright performs usage-driven","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21641,"title":"Dream2Reward: Transition-Alignment Reward Models from Positive Demonstrations for Robotic Manipulation","url":"https://arxiv.org/abs/2608.18787","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18787v1 Announce Type: new \nAbstract: Learning robotic policies requires dense rewards that remain informative when behavior departs from successful demonstrations. Progress-based rewards estimate how far an observation has advanced along a nominal successful trajectory, but may remain high after an incorrect transition. We introduce Dream2Reward, which learns a language-conditioned successful latent transition field from positive demonstrations. Given the visual history up to a transition start, the model predicts the latent displacement associated with successful execution and sco","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21640,"title":"SoftVTBench: A Deformation-Aware Visuo-Tactile Dataset and Benchmark for Deformable-Object Manipulation","url":"https://arxiv.org/abs/2608.18701","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18701v1 Announce Type: new \nAbstract: Physical interaction quality is central to deformable-object manipulation, yet most benchmarks evaluate task success alone. A policy may complete the task while allowing slip or causing excessive compression. A primary bottleneck is the absence of visuo-tactile datasets that pair policy-visible contact observations with independent physical ground truth over complete tasks. We introduce SoftVTBench, a visuo-tactile dataset for physical-interaction-aware deformable-object manipulation. It contains 4,000 expert demonstrations and more than 50 asse","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21639,"title":"Orienteering Problem with Uncertain Time-Varying Rewards: Framework and Benchmark for Everyday Service Robotics","url":"https://arxiv.org/abs/2608.18672","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18672v1 Announce Type: new \nAbstract: We present the orienteering problem with uncertain time-varying rewards (OP-UTVR), a novel variant of the orienteering problem (OP). While most existing OP formulations assume rewards to be known in advance, practical applications involve uncertain and time-varying rewards, as with shifting customer demand for delivery agents. OP-UTVR relaxes this assumption by allowing agents to estimate reward dynamics from observations and forecast future rewards. This enables informed routing decisions despite stochastic reward changes and inevitable predict","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21638,"title":"LabDex: A Hierarchical Benchmark for Dexterous Manipulation in Laboratories","url":"https://arxiv.org/abs/2608.18618","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18618v1 Announce Type: new \nAbstract: Autonomous laboratories hold great promise for accelerating scientific discovery. To achieve this vision, robots are supposed to dexterously manipulate diverse labware and instruments and execute long-horizon, state-dependent experimental procedures. Yet existing benchmarks do not jointly capture dexterous hand use, real-world laboratory interactions, and multi-stage experimental procedures, limiting systematic training and evaluation. To bridge this gap, we introduce LabDex, a large-scale real-world dataset and benchmark for dexterous manipulat","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21637,"title":"Real-Time Control-Constrained DDP for Underactuated Balancing of Legged Robots","url":"https://arxiv.org/abs/2608.18552","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18552v1 Announce Type: new \nAbstract: This paper presents a real-time control-constrained Differential Dynamic Programming (DDP) framework for underactuated legged robots. To address the limitation of classical DDP in handling control constraints, we propose an Accelerated Projected Gradient (APG)-based control-constrained DDP (ABC-DDP), which efficiently computes constrained solutions and identifies active sets without repeated Karush-Kuhn-Tucker (KKT) inversions. A virtual constraint is introduced to integrate control constraints within a feasibility-driven multiple-shooting frame","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21636,"title":"An Experimental Study of Downwash Effects on a Continuum Manipulator Integrated with a Multirotor UAV","url":"https://arxiv.org/abs/2608.18507","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18507v1 Announce Type: new \nAbstract: Continuum arm aerial manipulation systems leverage soft-manipulator compliance and dexterity for tasks in confined or hazardous environments, but propeller downwash can degrade performance, particularly near walls and the ground. This effect remains uncharacterized for continuum manipulators. This letter experimentally studies downwash-induced kinematic deviations of a tendon-driven continuum manipulator integrated with a multirotor platform. Under still-air conditions, the CM is compared with a constant-curvature (CC) model. Downwash- induced e","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21635,"title":"DevGRU: Depth-guided Visual Navigation using a Collision-aware Recurrent Model","url":"https://arxiv.org/abs/2608.18470","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18470v1 Announce Type: new \nAbstract: Existing visual navigation models often aim to develop foundation models that can generalize robot navigation across diverse platforms. However, many of these models are prone to collisions when deployed in complex indoor environments, particularly in structured layouts and narrow passages. To address this problem, we propose a depth image- and point-goal-conditioned navigation system, DevGRU. The proposed system employs an action predictor (AP) that generates collision-aware future trajectories, enabling effective avoidance of immediate obstacl","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21634,"title":"Backward Layout Search for Sequence-Constrained Robotic Assembly","url":"https://arxiv.org/abs/2608.18454","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18454v1 Announce Type: new \nAbstract: Robotic assembly layout planning must determine the assembly site and the initial pose of each part while ensuring collision-free execution of a prescribed assembly sequence. This problem is challenging because the obstacle environment changes after each assembly step, and unassembled parts re maining in the workspace may block robot motions. We observe that the feasibility of each assembly step depends only on the initial poses of the current and later-assembled parts. Based on this dependency, we propose Backward Layout Search (BLS), which ass","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21633,"title":"HarvestPoint-ACT: Explicit Target Selection and Harvest-Point Conditioning for Robotic Fruit Harvesting under Occlusion","url":"https://arxiv.org/abs/2608.18446","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18446v1 Announce Type: new \nAbstract: End-to-end imitation learning avoids hand-made robot motion for approaching and grasping, but the policy must still decide which fruit to pick and where to close the gripper. Occlusion can make the policy lose the selected fruit during harvesting, and the correct closing point is difficult to infer from pixels alone. This paper presents HarvestPoint-ACT, which makes both decisions explicit in perception and provides them to the policy. An instance segmentation front end with a keypoint branch predicts a mask and a harvest point for each visible","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21632,"title":"The Embodiment Gap in Robot Foundation Models","url":"https://arxiv.org/abs/2608.18433","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18433v1 Announce Type: new \nAbstract: Robot foundation models (RFMs), including vision-language-action (VLA) policies, are often discussed through a scaling view: more data, larger models, and broader benchmarks should improve generalization. In robotics, however, a model can generalize while work still remains before it can run on a robot with a particular body. The work required differs across methods and target robots, and those differences affect practical deployment. We call the gap between reusable models, representations, or data and their use in execution on the target robot","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21631,"title":"A Task-Agnostic Control Strategy for Dynamic Assistance with Pneumatically Actuated Soft Exosuits","url":"https://arxiv.org/abs/2608.18364","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18364v1 Announce Type: new \nAbstract: Pneumatic artificial muscles have provided new opportunities to develop upper-extremity soft exosuits for reha- bilitation, augmentation, and assisted daily living. However, the complex dynamics and limited bandwidth of these actuators has made providing responsive assistance based on user intention a longstanding challenge. In this work, we present an inverse-plant control strategy for pneumatically actuated soft exosuits that only relies on kinematic sensing for task-agnostic and dynamic assistance during daily living. We model the human-robot","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21630,"title":"GuideFetch: A Task Coordination Framework for Concurrent Navigation and Object Retrieval in Assistive Robot Dogs","url":"https://arxiv.org/abs/2608.18292","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18292v1 Announce Type: new \nAbstract: Consider a robot guide dog escorting a blind user to an available seat while a second assistive robot dog concurrently retrieves a cup of coffee and delivers it to the same seat. This setting motivates concurrent execution because navigation and object retrieval can overlap. A syntactically valid Large Language Model (LLM) plan may still violate embodiment constraints, and successful-looking controller motion does not by itself establish task completion. We introduce \\textsc{GuideFetch}, a coordination framework for concurrent navigation and obj","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"},{"id":21629,"title":"Transferable Tool-Tissue Contact Detection from Stereo Depth in Robot-Assisted Surgery","url":"https://arxiv.org/abs/2608.18270","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.18270v1 Announce Type: new \nAbstract: Reliable tool--tissue contact detection can support interaction-aware control and downstream force estimation in robot-assisted surgery. Most existing methods learn a contact classifier from RGB appearance, which is hard to generalize. In this work, we use the depth image generated from a stereo pair to give more information about tool--tissue contact. For each depth frame, we localize a spatially supported minimum-distance patch around the tool boundary and reduce it to a single scalar, $-\\log_{10}|d|$; this signal rises and falls in step with","tags":[],"cluster_size":1,"ts":"2026-08-20T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
