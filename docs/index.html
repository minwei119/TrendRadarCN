。拟议发行及上市仍须待有关监管审核及／或批准、市场状况及其他因素而定，并可能进行或可能不会进行。本公司将于适当时就任何重大进展刊发进一步公告，股东及潜在投资者于买卖本公司证券时务请审慎行事。","tags":[],"cluster_size":1,"ts":"2026-06-29T00:24:11"},{"id":5871,"title":"本周公开市场7天逆回购到期规模逼近2.3万亿元，创去年10月来最大单周到期量","url":"https://wallstreetcn.com/livenews/3125748","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"本周中国央行公开市场将有22655亿元逆回购到期，其中周一至周五分别到期4765亿元、5245亿元、6625亿元、3705亿元、2315亿元。","tags":[],"cluster_size":1,"ts":"2026-06-29T00:10:06"},{"id":5872,"title":"6月份A股公司密集分红，派现总额近5700亿元","url":"https://wallstreetcn.com/livenews/3125734","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至6月28日，以除权除息日为基准，6月份已实施和即将实施2025年度分红方案的上市公司超过1700家，累计派发现金红利总额达5690亿元。业内人士认为，A股公司近期集中兑现对股东的回报，分红节奏之密集、规模之可观，折射出上市公司整体经营回稳、现金流充裕的积极态势。数据显示，6月29日至7月3日，超200家公司即将实施2025年度分红方案，预计合计派现金额超800亿元，投资者有望在二季度收官之际收获一份实实在在的“现金礼包”。（中证报）","tags":[],"cluster_size":1,"ts":"2026-06-28T23:32:20"},{"id":5873,"title":"华尔街见闻早餐 | 2026年6月29日","url":"https://wallstreetcn.com/livenews/3125730","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美伊互袭危及停火，原油反弹，周一亚太盘初布油涨近2%。\n\n美官员称，美伊将“暂停”敌对行动，计划30日在卡塔尔首都举行会谈。此前美军周五周六空袭伊朗南部，伊军方周日威胁对美军基地发起“地狱”式打击。\n\n周五黎以美达成三方框架协议，以总理：黎真主党解除武装前，以军将驻留黎南部“安全区”。黎媒称达成框架协议后以军周六再袭黎南部。黎真主党称三方框架协议无效。\n\n美联储今年票委卡什卡利由鸽转鹰：通胀高企，预计今年加息一次。\n\n中国5月规上工业企业利润同比增21.1%，计算机、通信和其他电子设备制造业利润前五个月大增103.9%。\n\n环球时报：中欧正密集举行贸易磋商，欧盟缺乏诚意或引发中欧经贸摩擦急剧上升。\n\n报道：三星和SK海力士周一可能宣布规模达万亿美元的新投资。\n\n英媒：苹果寻求获准从长鑫存储购买内存芯片。\n\n纳斯达克：SpaceX将于7月7日被纳入纳斯达克100指数。\n\nOpenAI推迟IPO消息重创软银，650亿美元敞口面临流动性大考，股价暴跌13%创两年最大。","tags":[],"cluster_size":1,"ts":"2026-06-28T23:10:25"},{"id":5874,"title":"告别“重首发，轻持营”，公募基金加码“二次首发”","url":"https://wallstreetcn.com/livenews/3125726","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，多家公募加码优势产品的“二次首发”，部分产品管理规模近乎翻倍。在政策导向与费率改革的推动下，行业过往“重首发，轻持营”的利益逻辑正在改变，深耕存量的良性行业生态加速形成。所谓“二次首发”，是指基金公司对存量基金进行特殊的持续营销，通过渠道集中资源专项运作，营销力度、客户触达强度远高于分散、常态化的持续营销，资金吸纳与客户留存程度往往更好。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-28T22:56:21"},{"id":5875,"title":"“买券商等于买一篮子打折科技股”交易逻辑发酵，券商股上演价值重估行情","url":"https://wallstreetcn.com/livenews/3125725","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，A股券商板块告别前期沉寂，盘面异动频发，资金关注度持续攀升。盘面最关键的变化在于，打破了过往“券商拉升，科技回调”的存量资金跷跷板效应，证券与硬科技双线共振走强。“买券商等于买一篮子打折科技股”的交易逻辑在市场上快速发酵。长久以来，券商仅以“牛市旗手”的行情弹性被资金关注，如今却凭借投行跟投、股权直投手握大量硬科技企业股权，叠加自身板块估值处于历史低位，科创底色逐步被资金挖掘，一场全新的价值重估行情正在上演。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-28T22:49:56"},{"id":5876,"title":"全球科技股同步回调，券商研报：AI主线地位不改但再平衡需求上升","url":"https://wallstreetcn.com/livenews/3125724","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周全球市场科技产业链同步震荡，海外相关赛道估值下行对A股构成传导压力，A股呈现“冲高回落，极致分化”格局。综合本周券商策略研报来看，美联储加息预期反复、科技板块交易拥挤度抬升，以及AI产业面消息扰动共同压制了科技板块风险偏好。在中期维度上，AI产业上行趋势尚未出现实质性拐点，各细分赛道景气度持续兑现，行情延续的基础仍存。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-28T22:42:32"},{"id":5877,"title":"万亿发债潮叠加评级上调，券商大力融资谋转型","url":"https://wallstreetcn.com/livenews/3125723","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，券商融资节奏持续提速，债券发行规模实现大幅跃升。Choice数据显示，截至6月26日，年内已有61家券商累计发行521只债券，总发行规模超过1.22万亿元，较去年同期的5274.98亿元同比增长超过131%。另外，行业龙头发债体量达到千亿级。与此同时，多家券商大额发债批复密集落地。6月以来，证券行业迎来罕见的债券信用评级集中上调。中金财富、东北证券、长城证券、华安证券、浙商证券等多家券商密集公告评级调整，旗下多款次级债信用等级成功从AA+跃升至AAA，行业总体信用资质实现质的提升。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-28T22:41:14"},{"id":5878,"title":"阿加迪尔1-1兹马姆拉，Baba Bello Ilou打破僵局，拉赫蒂米扳平比分 - 懂球帝","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9YdHVqYzF3QXl3dzVVbkV6Nm5WaWRLbjgxbGVqYmtQNHBnR19jOWlmczdDX2ZyalpNdG4xSFBDampXNlpWMGYtVGpfa09WYW9EYks5UzNxaw?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9YdHVqYzF3QXl3dzVVbkV6Nm5WaWRLbjgxbGVqYmtQNHBnR19jOWlmczdDX2ZyalpNdG4xSFBDampXNlpWMGYtVGpfa09WYW9EYks5UzNxaw?oc=5\" target=\"_blank\"\u003e阿加迪尔1-1兹马姆拉，Baba Bello Ilou打破僵局，拉赫蒂米扳平比分\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e懂球帝\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-28T19:24:14"},{"id":5879,"title":"伊拉克在反腐行动中拘留的官员包括负责分销事务的副石油部长，美以发动伊朗战争后曾制裁该官员" #6f6f6f\"\u003evideo.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T00:06:48"},{"id":5995,"title":"我国开源生态版图持续扩容，新增具身智能等方向","url":"https://www.ithome.com/0/969/742.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"321d\"\u003eIT之家 6 月 29 日消息，据央视财经报道，当前，我国正持续推进开源生态建设。开源，简单来说就是将底层源代码开放，让用户可以自由使用、修改和分享软件或相关技术，有利于技术的普惠发展。记者 6 月 26 日从业内获悉，我国开源生态版图进一步扩容，新增了涵盖\u003cstrong\u003e人工智能、具身智能\u003c/strong\u003e等领域的 7 个项目。\u003c/p\u003e\u003cp data-vmark=\"54a5\"\u003e开放原子开源基金会副秘书长李博介绍，2026 年，在前沿技术布局上引入人工智能、具身智能还有指令集这些项目，抢占大模型和 RISC-V 等新架构的先机，以开放的基座来打破技术垄断。\u003cstrong\u003e2025 年，国内的活跃开源项目数已经突破了 425 万个\u003c/strong\u003e，活跃的开源开发者规模达到了 263 万多人。\u003c/p\u003e\u003cp data-vmark=\"fcb5\"\u003e工业和信息化部相关负责人介绍，当前我国开源参与者数量、增长速度均位居世界前列，未来将加快推进开源体系建设。\u003c/p\u003e\u003cp data-vmark=\"a29b\"\u003e工业和信息化部副部长熊继军表示，提升开源供给能力，\u003cstrong\u003e加大对基础软件、工业软件、人工智能等领域开源发展的牵引力度\u003c/strong\u003e。支持优秀开源产品落地应用，支持全球顶尖的开源项目和开发者来华发展。\u003c/p\u003e\u003cp style=\"text-al","tags":[],"cluster_size":1,"ts":"2026-06-29T00:02:04"},{"id":5996,"title":"法拉第未来机器人 3-6 月出货 242 台超预期，贾跃亭再次上调全年目标至 2000 台","url":"https://www.ithome.com/0/969/741.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bb45\"\u003eIT之家 6 月 29 日消息，贾跃亭今日发布视频，汇报了法拉第未来机器人的销售情况。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"c9e0\"\u003e\u003ca class=\"ithome_super_player\" contenteditable=\"false\" target=\"_blank\" href=\"https://weibo.com/1999607273/R6jrfnBJa\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/9049bf9c-0d22-4c77-89f1-b7a98eef965e.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"810\" data-weibo=\"0\"\u003e\u003c/a\u003e\u003c/p\u003e\u003cp data-vmark=\"9ed1\"\u003e据介绍，6 月，FF EAI 机器人的销售、出货及交付量达到 105 台，\u003cstrong\u003e3-6 月累计 242 台\u003c/strong\u003e，超额完成原定的 220 台目标。\u003c/p\u003e\u003cp data-vmark=\"9450\"\u003e贾跃亭宣布，\u003cstrong\u003e法拉第未来决定将全年出货目标提升至 2000 台\u003c/strong\u003e，这也是继 4 月份将 1000","tags":[],"cluster_size 03e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eCrypto Briefing\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-24T06:48:12"},{"id":5473,"title":"Enabling Robust Cloth Manipulation via Inference-Time Simulator-in-the-Loop Refinement","url":"https://arxiv.org/abs/2606.24552","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24552v1 Announce Type: new \nAbstract: Simulator-in-the-loop optimization offers a promising inference-time mechanism for robot manipulation. It uses a physical simulator as a backend rollout engine to evaluate candidate trajectories in parallel and refine nominal actions online, a paradigm proven effective in rigid-body manipulation where state and contact are relatively tractable. We bring this paradigm to real-world cloth manipulation from a single RGB input through three pillars. (i) We design a scalable synthetic-data generation and inference-time rollout pipeline built on FLASH","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5472,"title":"Decentralized Pose Graph Riemannian Optimization for Object-based Multi-Robot SLAM","url":"https://arxiv.org/abs/2606.24489","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24489v1 Announce Type: new \nAbstract: Pose graph optimization (PGO) is a key back-end component for state estimation in networked multi-robot simultaneous localization and mapping (SLAM). In object-based multi-robot SLAM, the problem becomes more tightly coupled because robots must jointly estimate both their trajectories and the poses of persistent objects observed by multiple agents. Existing decentralized solutions often assume that the communication graph closely matches the physical interaction topology, which is restrictive in realistic deployments where communication is spars","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5471,"title":"G$^3$VLA: Geometric inductive bias for Vision-Language-Action Models","url":"https://arxiv.org/abs/2606.24472","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24472v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have made rapid progress in generalist robot manipulation by harnessing semantic knowledge from pretrained vision-language backbones, but their visual tokens remain grounded in 2D image coordinates rather than the calibrated geometry of the robot's cameras -- a mismatch especially pronounced in multi-camera setups, where views are coupled by known intrinsics and extrinsics yet processed as independent images. We propose G$^3$VLA, a camera-aware geometric module that injects calibrated structure into the visual","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5470,"title":"FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation","url":"https://arxiv.org/abs/2606.24466","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24466v1 Announce Type: new \nAbstract: Legged manipulators combine the mobility of legged platforms with the manipulation capability of robotic arms. However, arm-induced Center-of-Mass shifts and dynamic disturbances make the system more prone to instability under actuator failures, potentially leading to falls, task failures, or safety risks. Existing fault-tolerant control methods mainly focus on locomotion alone, leaving the coupled problem of whole-body stability and arm reachability in fault-tolerant loco-manipulation largely unaddressed. To bridge this gap, we propose FT-WBC,","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5469,"title":"Varying Bundle Size Reactive Multi-Task Assignment using Selective Cost Estimation for Multi-Agent Systems","url":"https://arxiv.org/abs/2606.24462","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24462v1 Announce Type: new \nAbstract: This paper presents a scalable framework for multi-robot task allocation in complex environments where estimating task execution costs is computationally expensive. While combinatorial auction-based approaches offer reliable solutions, the exponential complexity of bundle generation typically renders them intractable for real-time reactive applications, particularly when accurate path planning is required for cost validation. We address this through a distributed, two-stage multi-fidelity bundle generation approach. Agents utilize a local search","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5468,"title":"NoContactNoWorries: Estimating Contact through Vision and Proprioception for In-Hand Dexterous Manipulation","url":"https://arxiv.org/abs/2606.24450","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24450v1 Announce Type: new \nAbstract: Perceiving physical contact is fundamental to dexterous manipulation. While robots often rely on dedicated hardware tactile sensors, humans exhibit a remarkable ability to infer contact by integrating visual information with an innate sense of their body's pose and movement. Inspired by this embodied perceptual skill, we investigate whether a robot can learn to infer contact from vision, an approach that also offers a scalable alternative to tactile hardware specifically for binary contact estimation, which faces practical challenges in cost, fr","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5467,"title":"Supervise What Survives: Geometry-Guided VLA Adaptation from Synthetic Robot Videos","url":"https://arxiv.org/abs/2606.24448","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24448v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models require large-scale video-action pairs, yet real teleoperation remains scarce. While generated robot videos offer a scalable alternative, existing methods treat them as real robot data by recovering pseudo-actions from synthesized pixels. We argue that deriving low-level control from generated visuals is a mismatched abstraction. A video captures only \\emph{geometry}: the spatial trajectory representing the \\emph{where} of a task. A real demonstration captures \\emph{control}: the exact motor commands represent","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5466,"title":"Legible and Intuitive Multi-modal Robot State and Intent Communication Validated in Online and Real-world Studies","url":"https://arxiv.org/abs/2606.24445","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24445v1 Announce Type: new \nAbstract: Effective robot-to-human communication can increase transparency and trust, reduce uncertainty, and contribute to safer collaboration in shared workspaces. Designing and validating an effective robot communication strategy is challenging due to the varying and often limited communication modalities across robots, differences in how diverse recipients interpret messages, and the underexplored virtual-to-real gap in studies of communication legibility. We present a systematic, large-scale comparative validation of existing communication strategies","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5465,"title":"RE4: Transformation-aware Imitation of Object Interactions Using Manipulation Modes","url":"https://arxiv.org/abs/2606.24403","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24403v1 Announce Type: new \nAbstract: Object interaction tasks have been a focus of advances in imitation learning. End-to-end methods, dominated by diffusion and flow-based variants have shown leaps in performance while sacrificing interpretability. Object-centric and pose-informed variants have had a role in learning from demonstration in manipulation tasks. In this paper, we revisit a few modern imitation learning benchmarks for object interactions, with the aim of composing a framework that repurposes principled theories of manipulation, preserving both performance and interpret","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5464,"title":"PDS Joint: A Parametric Double-Spiral Joint Tailored for Dexterous Hands","url":"https://arxiv.org/abs/2606.24377","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24377v1 Announce Type: new \nAbstract: Compliant joints can embed safety and adaptability into dexterous hands, but achieving large-stroke anthropomorphic motion while maintaining joint-specific, directiondependent stiffness and reliable proprioception remains challenging. This paper presents the PDS joint, a parametric doublespiral (PDS) compliant joint that enables systematic shaping of directional stiffness across multiple deformation modes, including flexion/extension, abduction/adduction, and pronation/supination. We instantiate the joint using Archimedean and logarithmic spiral","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5463,"title":"SlipSense: Multimodal Sensing for Online Slip Detection in Legged Robots","url":"https://arxiv.org/abs/2606.24350","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24350v1 Announce Type: new \nAbstract: Legged robots rely on accurate ground interaction awareness to traverse variable terrains, such as slippery surfaces. Existing slip detection methods often rely on kinematics and proprioception, which lack the sensitivity to detect early-stage slips that occur prior to catastrophic instability. Thus, this paper presents SlipSense, a novel framework for online force-based slip detection using a custom lightweight sensorized foot for quadrupeds to detect slip. The framework integrates a multimodal sensor design with a LSTM-based model to infer gro","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5462,"title":"RoBoSR: Structured Scene Representations for Embodied Robotic Reasoning","url":"https://arxiv.org/abs/2606.24338","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24338v1 Announce Type: new \nAbstract: Despite rapid progress, embodied reasoning under real-world variability remains challenging. Existing approaches rely on demonstration-driven sequential biases, limiting flexibility in open-ended and long-horizon tasks that require structured reasoning over evolving states.\n  We introduce RoBoSR, an intermediate structural representation that formulates manipulation as step-wise state transitions over semantically grounded, object-centric scene graphs. By modeling object states and their spatial relations at the perception-action interface, RoBo","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5461,"title":"Grounding Generative Policies in Physics: Optimization-Guided Diffusion for Robot Control","url":"https://arxiv.org/abs/2606.24208","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24208v1 Announce Type: new \nAbstract: Diffusion models sample effectively from high-dimensional, multimodal distributions, but their outputs may violate deployment constraints. For task-space robot policies, generated grasps, waypoints, or trajectories can be distributionally valid yet infeasible, violating reachability, collision-avoidance, or closed-loop executability requirements. This embodiment gap limits zero-shot deployment across robots, even when the task-space behavior itself is transferable.\n  We propose an inference-time optimization framework that couples the behavior g","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
