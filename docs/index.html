其更长期的资本支出指引。”","tags":[],"cluster_size":1,"ts":"2026-07-25T12:48:35"},{"id":14118,"title":"威尔逊资产管理公司（Wilson Asset Management）对冲基金经理Matthew Haupt：韩国综合股价指数波幅指数（KOSPI VIX）依然非","url":"https://wallstreetcn.com/livenews/3139754","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"威尔逊资产管理公司（Wilson Asset Management）对冲基金经理Matthew Haupt：韩国综合股价指数波幅指数（KOSPI VIX）依然非常高，市场正在等待杠杆仓位清算完毕。\n\n目前有比韩国更稳定的市场来进行主题交易。","tags":[],"cluster_size":1,"ts":"2026-07-25T12:46:12"},{"id":14119,"title":"亚洲大型股票基金转向落后股，来规避AI波动风险","url":"https://wallstreetcn.com/livenews/3139752","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"亚洲投资者正在抢购从印尼银行、中国电商巨头到印度科技公司在内的股票，削减对波动日益加剧的热门人工智能（AI）交易的下注。富达国际和法国BNP巴黎资产管理公司等机构正在减少对韩国股票和半导体的敞口，M\u0026G投资公司减持了台股，而Eastspring Investments则轮动进入包括印度在内的落后板块。\n\n受此影响，东南亚股市正迎来最近24年来相对于亚洲同行的最佳单月表现，印尼成为7月全球表现最好的市场之一。与此同时，印度成为本月吸引外国资金流入最多的区域市场之一。","tags":[],"cluster_size":1,"ts":"2026-07-25T12:42:53"},{"id":14120,"title":"中国移动新型家宽边缘算力设备并网案例获评算力网络+AI创新应用案例 - 新华网浙江","url":"https://news.google.com/rss/articles/CBMiggFBVV95cUxOMmdSUnRyRTU1Ni1tVzZtUjdOUHBMRERBbXVwdmhPMHBiOTY4VHB1OEZsRk5RU1E1LUVuR0FrUkVMUlNwLUFIdXVkU1l2M0ptb1BhbUkxSGtTakcwNUxBcldVUC04V01wczE3UV9NdkZJMk5IR2sxUGhYbkkyU3NVOTRB?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiggFBVV95cUxOMmdSUnRyRTU1Ni1tVzZtUjdOUHBMRERBbXVwdmhPMHBiOTY4VHB1OEZsRk5RU1E1LUVuR0FrUkVMUlNwLUFIdXVkU1l2M0ptb1BhbUkxSGtTakcwNUxBcldVUC04V01wczE3UV9NdkZJMk5IR2sxUGhYbkkyU3NVOTRB?oc=5\" target=\"_blank\"\u003e中国移动新型家宽边缘算力设备并网案例获评算力网络+AI创新应用案例\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新华网浙江\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T09:51:27"},{"id":14121,"title":"刘强东杀疯了，京东拿下第一，超越阿里巴巴 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNbFFlR1NDc2duNDNTU0NZR0hWWDB0WFpCUmVVeDJjLXBYdmlpTmQ4X3AtVXJpc3ZQYkxPT3FIcnpHaEdncFNJdFd1b2E1U1lSUHhudHJ0YTRtb2RVSnBrRmVYb3NFdkZKd1dUZzFQdWtHWTc0TGN5b2tMX0NKMUdkODBBTzBXe 度实现了稳健的财务表现，营收达90亿美元（环比增长3%），扣除非经常性损益后每股收益（EPS）为0.55美元。尽管中东业务受到严重地缘政治和安全冲突干扰（收入环比下降13%至16.6 亿美元），但国际深水业务（拉美、欧洲/非洲、亚洲）的全面增长和北美陆上业务的反弹成功抵消了这一不利影响。事业部亮点：\n\n生产系统：营收环比增长7%至38亿美元，调整后EBITDA利润率重回20%以上，主要得益于深水活动及生产采收设备/化学品强劲需求的推动。\n\n数字业务：营收环比增长9%至6.97亿美元，调整后EBITDA利润率达约35%，年度经常性收入（ARR）同比增长15%。\n\n数据中心解决方案（Data Center Solutions）：增长迅猛，营收环比增33%、同比增80%，与Meta等客户达成深层次设计集成合作，并宣布新增超大规模客户。\n\n现金流与股东回报：二季度产生自由现金流（FCF）为7.16 亿美元，股票回购6.48亿美元。全年资本投资计划维持在25亿美元左右，全年预计通过股息和回购向股东回报超40亿美元。","tags":[],"cluster_size":1,"ts":"2026-07-24T23:08:03"},{"id":13921,"title":"美股大类资产类ETF涨跌各异，新兴市场ETF收跌将近2%","url":"https://wallstreetcn.com/livenews/3139670","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周五（7月24日），新兴市场ETF收跌1.97%，巴克莱美国可转债ETF跌1.64%，美国布伦特油价基金跌1.63%，纳指100 ETF跌1.12%，罗素2000指数ETF、欧元做多至多跌0.32%。\n\n农产品基金收平，日元做多、做多美元指数、黄金ETF、美国国债20+年ETF至多涨0.10%，道指ETF涨0.48%，大豆基金涨0.73%，美国房地产ETF涨2.15%。","tags":[],"cluster_size":1,"ts":"2026-07-24T22:17:58"},{"id":14123,"title":"画廊 Foster + Partners 新作：阿里巴巴上海园区 - 7 - ArchDaily","url":"https://news.google.com/rss/articles/CBMi_wFBVV95cUxPOFJIRU5XdklqM0luaHRZMklMRVNXTnU0NUJCM3A1Q3Rwc2RWOEpxU2J4OG9rMEhiUHRZNjdIZzFINmZpUVlaOExGUzA0aTNlbndpaURrZHdYZ25qamJOdmxObDRQbzlhSDM4ZWE1NzlxdXV4a3VnYmF6YjlQaG1ta3RSYTd3XzFVU21MWXhBYjV0MjFIUDBDU3ZQNVRxYnpTTGt3VUxEMEpDM3dMNHJyZmo2dkpOZkZEX1hFWjM2aVpDVFdHLTBDWjJjTDZGb1Jlc05qZmR4Z3AyZUN5dzJPbnR5elhkcjNrRDlrVVItank2QzVuOHdlLVNwbVhFSUE?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMi_wFBVV95cUxPOFJIRU5XdklqM0luaHRZMklMRVNXTnU0NUJCM3A1Q3Rwc2RWOEpxU2J4OG9rMEhiUHRZNjdIZzFINmZpUVlaOExGUzA0aTNlbndpaURrZHdYZ25qamJOdmxObDRQbzlhSDM4ZWE1NzlxdXV4a3VnYmF6YjlQaG1ta3RSYTd3XzFVU21MWXhBYjV0MjFIUDBDU3ZQNVRxYnpTTGt3VUxEMEpDM3dMNHJyZmo2dkpOZkZEX1hFWjM2aVpDVFdHLTBDWjJjTDZGb1Jlc05qZmR4Z3AyZUN5dzJPbnR5elhkcjNrRDlrVVItank2QzVuOHdlLVNwbVhFSUE?oc=5\" target=\"_blank\"\u003e画廊 Foster + Partners 新作：阿里巴巴上海园区 - 7\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eA 频，画面中一些人在河道附近，现场有警戒线等元素，并配文“大雨过后河道水面瞬间暴涨，淹死了几个”。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"b765\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/c8320f97-3a19-47d9-bae3-7def49501843.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"804\" data-weibo=\"0\" data-vmark=\"68ca\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"e7c0\"\u003e经警方调查核实，孙某某为博取关注、吸粉引流，是故意编造并发布“大雨过后河道水面瞬间暴涨，淹死了几个”的谣言，而此次降雨天气未造成潜山市人员伤亡。目前，\u003cstrong\u003e孙某某已被公安机关依法予以行政处罚\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"4a19\"\u003e潜山市公安局城关派出所四级警长储阮征也对视频内容进行了说明：孙某某所发布视频","tags":[],"cluster_size":1,"ts":"2026-07-25T23:39:51"},{"id":14291,"title":"IT早报 0726：携程公布 19 项整改措施；库克推长鑫与长存加入果链遭美光反对；曝国内 TOP6 手机厂商已有多家抵制内存涨价；高通宣布 9 月起芯片涨价...","url":"https://www.ithome.com/0/981/613.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"778d\"\u003e“IT早报”时间，大家好，现在是 2026 年 7 月 26 日星期日，今天的重要科技资讯有：\u003c/p\u003e\u003ch2 data-vmark=\"6a5d\"\u003e1、携程集团就市场监管总局行政处罚决定公布 19 项整改措施：停止独家合作行为，保障酒店经营者自主经营权\u003c/h2\u003e\u003cp data-vmark=\"15ad\"\u003e“携程黑板报”7 月 25 日下午的公告说，本次处罚对携程是一次深刻的警醒和教育。在国家市场监督管理总局的指导和监督下，携程将切实履行平台主体责任，主动回应各方关切，目前已制定相关整改方案，自觉接受社会监督。\u0026gt;\u0026gt; \u003ca href=\"https://www.ithome.com/0/981/515.htm\" target=\"_blank\"\u003e查看详情\u003c/a\u003e\u003c/p\u003e\u003ch2 data-vmark=\"79c4\"\u003e2、库克力推长鑫、长存加入苹果供应链遭美光强烈反对，特朗普夹在中间犯愁\u003c/h2\u003e\u003cp data-vmark=\"365e\"\u003e苹果为应对成本上涨和芯片短缺，积极游说美国政府，希望在美国以外销售的设备中使用长鑫和长江存储芯片。此举遭到主要供应商美光科技的强烈反对，认为会摧毁美国本土产业。这场游说之争使特朗普政府在其降低消费价格和提升本土芯片产量的两大目标间陷入两难。\u0026gt;\u0026gt; \u003ca href=\"https://www.ithome.","tags":[],"cluster_size":1,"ts":"2026-07-25T23:32:53"},{"id":14292,"title":"Debian 项目发起议案，讨论是否允许 AI 大模型参与开发","url":"https://www.ithome.com/0/981/612.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"8ee5\"\u003eIT之家 7 月 26 日消息，Debian 项目开发者本周（7 月 24 日）发起议案，讨论未来是否允许 AI 大语言模型（LLM）开发 Debian。\u003c/p\u003e\u003cp data-vmark=\"ea7d\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/9fb5a541-44f5-469a-b6f4-e6a15fe7e7ef.jpg\" w=\"1131\" h=\"1061\" data-weibo=\"0\" data-mpos=\"2,2\"  data-vmark=\"53cb\"\u003e\u003c/p\u003e\u003cp data-vmark=\"0476\"\u003e据悉，本次议案共有三个选项：完全禁止大语言模型或其他 AI 工具、允许项目贡献者使用 AI 辅助工作、尽可能拒绝大语言模型和生成式 AI。\u003c/p\u003e\u003cp data-vmark=\"33fa\"\u003eIT之家附三项提案详情如下：\u003c/p\u003e\u003ch2 data-vmark=\"317c\"\u003e提案 A：完全禁止使用大语言模型提交官方软件代码、文档、公告\u003c/h2\u003e\u003cp data-vmark=\"7402\"\u003e该提案主张完全禁用大语言模型和生成式 AI 工具，即使是 AI 修改、开发者人工确认也不可行。提案认为，LLM 输出的代码无法确认版权归","tags":[],"cluster_size":1,"ts":"2026-07-25T23:29:36"},{"id":14293,"title":"2026 暑期档电影票房破 55 亿，《八仙！》票房破 6 亿成档期黑马","url":"https://www.ithome.com/0/981/609.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"6722\"\u003eIT之家 7 月 26 日消息，据央视新闻报道，\u003cstrong\u003e2026 年暑期档电影总票房（含预售）已突破 55 亿元\u003c/strong\u003e。同时，2026 年度电影总票房（含预售）突破 212 亿元。\u003c/p\u003e\u003cp data-vmark=\"355f\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/01195de5-3df2-4ec5-bd28-8f9b295f5b14.jpg?x-bce-process=image/watermark,text_QUnnlJ_miJA,type_RlpMYW5UaW5nSGVpU0JHQg==,size_28,color_ffffffdd,skw_1,skc_00000051,g_7,blr_50,bls_50,x_11,y_11/format,f_auto\" w=\"1440\" h=\"1080\" data-weibo=\"0\" data-vmark=\"af9c\" data-ai=\"1\" data-mpos=\"1,2\" data-marks=\"1931fd9d012eb6d1dafa21c91fe8b63101ab84905d2e7cd0e3dea5143e2bdad4291148872149","tags":[],"cluster_size":1,"ts":"2026-07-25T23:07:14"},{"id":14294,"title":"高通芯片涨价冲击 VR 市场，Valve Steam Frame 头显售价或超 1000 美元","url":"https://www.ithome.com/0/981/608.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3825\"\u003eIT之家 7 月 26 日消息，围绕 Valve 新一代 VR 头显的期待正持续升温，公司近期已开始接收疑似与该设备相关的货物。不过，消费者仍在等待 Steam Frame 的正式售价和发布日期。而高通近期上调骁龙芯片价格，可能会给这款产品的上市计划带来新的变数。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"c0eb\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/092b1493-ab5c-4bbd-b48e-b529dd3fcd3a.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"1080\" data-weibo=\"0\" data-vmark=\"29e8\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"2951\"\u003e彭博社于 6 月 24 日报道称，高通计划将旗下芯片价格上调两位数百分比，新价格将于 9 月 1 日起生效，这一时间点可能恰好晚于 Steam Frame 的发售。不过，Valve 爆料人士 Brad Lynch 认为，高通此次涨价将对整个 VR 头显市场产生影响。\u003c/p\u003e\u003cp style=\"text-align: center;\"","tags":[],"cluster_size":1,"ts":"2026-07-25T22:58:34"},{"id":14295,"title":"申通快递发布快递行业首个智能体平台“SClaw” - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTE1udFFnclc4WGJmR1RMd1RMemVJWGZOVU42TUl4N2NlVU50X2U4YzAxd1lZMTJDbWZsMnVndVdoVjlTdkgxZFV1ZGpOSEx2ZndJbDBEZlV2VjRTSHp5c3RCbFcyQkRYMC1WT3BYazlocE13bkZzTzBGYw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTE1udFFnclc4WGJmR1RMd1RMemVJWGZOVU42TUl4N2NlVU50X2U4YzAxd1lZMTJDbWZsMnVndVdoVjlTdkgxZFV1ZGpOSEx2ZndJbDBEZlV2VjRTSHp5c3RCbFcyQkRYMC1WT3BYazlocE13bkZzTzBGYw?oc=5\" target=\"_blank\"\u003e申通快递发布快递行业首个智能体平台“SClaw”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T20:48:13"},{"id":14296,"title":"deepseek|梁文锋|暂停融资|泄露对话_新浪新闻 - 新浪网","url":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE1mNGt4LVZPTWoxSDhIM1R0aXBYMUJTbTV6X3AyVEdWVGwwWmhndWlKcldxVkh5cWZuQVNubHQtcU5XRnZ1cF9sUXdRN1pDMWVyXzBOcHhWX1BzVzcxaDh6elhybw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiY0FVX3lxTE1mNGt4LVZPTWoxSDhIM1R0aXBYMUJTbTV6X3AyVEdWVGwwWmhndWlKcldxVkh5cWZuQVNubHQtcU5XRnZ1cF9sUXdRN1pDMWVyXzBOcHhWX1BzVzcxaDh6elhybw?oc=5\" target=\"_blank\"\u003edeepseek|梁文锋|暂停融资|泄露对话_新浪新闻\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T16:43:00"},{"id":14297,"title":"25家巨头高举开源大旗 OpenAI与Anthropic为何沉默？ - finance.sina.com.cn","url":"https://n // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
