ce":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中国央行公开市场开展630亿元7天期逆回购操作，操作利率1.40%，持平上次。同时，开展3000亿元隔夜逆回购操作。今日9255亿元逆回购到期。","tags":[],"cluster_size":1,"ts":"2026-08-03T01:21:01"},{"id":16473,"title":"花旗：云厂商强劲开支利好中国光模块公司 半年报披露或为买入时机","url":"https://wallstreetcn.com/livenews/3143788","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"花旗称，美国四大云厂商二季度资本开支同比强劲增长79%并小幅上调全年指引，表明需求可见度已明确延伸至2028年，这为AI基础设施供应链公司提供了结构性利好。中国光通信板块的布局机会或出现在2026年上半年业绩发布前后，近期催化剂包括9月的CIOE（中国光博会）、云栖大会、ECOC（欧洲光通信展）。","tags":[],"cluster_size":1,"ts":"2026-08-03T00:34:02"},{"id":16474,"title":"华泰证券：A股现阶段更接近“交易底初现”","url":"https://wallstreetcn.com/livenews/3143767","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"华泰证券研报指出，当前科技行情的核心矛盾在于其交易底是否构筑完成，华泰证券认为现阶段更接近“交易底初现”，判断的支撑主要来自于：1.调整空间已较充分，主线回撤达到典型高弹性方向的超跌区间；2.境内外杠杆交易型资金已完成一定出清，杠杆资金回吐二季度全部增量，美股对冲基金和韩股杠杆资金也已从极端位置收缩；3.但市场近期卖盘抛压仍偏强，尚未形成主要增量。趋势性反弹的关键窗口在8月下旬，届时中报、英伟达财报以及反弹过程中的赎回压力将共同决定科技能否形成新一轮主升。配置上，红利继续承担底仓，科技反弹优先围绕原主线中业绩确定性较高的半导体设备等展开，非主线则关注中报改善的方向，如券商、创新药等。","tags":[],"cluster_size":1,"ts":"2026-08-02T23:52:14"},{"id":16475,"title":"本周中国央行公开市场将有18420亿元短期逆回购到期","url":"https://wallstreetcn.com/livenews/3143765","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"其中，周一至周五分别到期9255亿元、3055亿元、2065亿元、2705亿元、1340亿元。此外，周三还将有3000亿元3个月期买断式逆回购到期。中国央行此前公布，周一将开展3000亿元隔夜逆回购操作。","tags":[],"cluster_size":1,"ts":"2026-08-02T23:49:59"},{"id":16476,"title":"业内预计可转债全年发行规模有望突破千亿元","url":"https://wallstreetcn.com/livenews/3143764","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着2026年再融资新规优化落地，叠加存量可转债集中退出形成的市场供给缺口，A股可转债市场迎来密集发行窗口期，一级市场供给节奏明显加快。数据显示，以发行公告日为统计口径，截至8月2日，2026年以来已有48只可转债公开发行，累计募资规模达573.32亿元，同比显著增长。","tags":[],"cluster_size":1,"ts":"2026-08-02T23:47:54"},{"id":16477,"title":"华尔街见闻早餐 | 2026年8月3日","url":"https://wallstreetcn.com/livenews/3143758","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"上周五美股收涨，纳指涨1%，亚马逊大涨15%，苹果大跌7%；布油期货周一亚市开盘大跌6.7%。\n\nTACO！特朗普“取消对伊朗打击”，并称美伊3日将举行谈判。沙特王储曾致电美方“敦促缓和局势”。伊朗外长：伊朗与阿曼谈判接近完成。\n\n部署下半年八大重点！中国央行定调：适时调整、加力扩内需。\n\n被“忽略”的市场大事：美日韩联合干预，美国财政部“罕见”下场。\n\n单日7.2万亿韩元，外资周五净买入创纪录！华尔街：韩股资金面逆风已经消退。\n\n长鑫LPDDR6迎来关键突破。\n\nOpenAI确认下一代模型Astra存在，以2000美元算力成本破解十项数学未解难题，正向监管层展示。\n\n500亿美元投资都完成，亚马逊持股OpenAI 5%，此前已投Anthropic。\n\n韩国存储调研：三星长协“限制跌幅、不限涨幅”，现货价格在四季度旺季前持续反弹。\n\n提醒：周一将公布中国7月RatingDog制造业PMI、美国7月ISM制造业指数。","tags":[],"cluster_size":1,"ts":"2026-08-02T23:10:30"},{"id":16478,"title":"实探深圳华强北：显卡价格快速上涨","url":"https://wallstreetcn.com/livenews/3143751","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"继内存、硬盘价格上涨后，电脑硬件市场又迎来新一轮价格波动。近日，记者走访深圳华强北市场发现，7月底以来，消费级显卡价格快速上涨，部分热门型号数日内涨价数百元，高端型号涨幅达到千元级别。多位受访商家及券商分析师认为，此轮显卡涨价主要由显存等上游核心物料成本上升所致。与此同时，部分AIC厂商暂停批量出货，渠道现货供应趋紧，进一步加剧了显卡价格波动。此外，经历此前内存涨价带来的库存压力后，华强北商家普遍采取订单驱动的采购方式，不愿贸然囤货。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-02T22:41:50"},{"id":16479,"title":"今年上半年分红险保费同比增长94.4%","url":"https://wallstreetcn.com/livenews/3143745","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"今年上半年保险业原保险保费收入同比增长3.3%，其中，外资保险公司同比增长12.4%，分红险同比增长94.4%，财险公司健康险同比增长15.2%……中国保险行业协会在7月31日召开的新闻发布会上用这组数字勾勒出行业“保费稳增，结构在变”的转型图景。申万宏源在研报中分析称，上半年A股上市险企合计归母净利润同比增长70.6%至3040.73亿元。中国保险行业协会预计，下半年保险市场将延续稳中有进的运行态势。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-02T22:15:51"},{"id":16480,"title":"提醒：周一（8月3日），Palantir、安森美半导体等将发布业绩报告；\n\n周二，SpaceX、AMD、卡特彼勒等将发布业绩报告；\n\n周三，诺和诺德、闪迪、西部","url":"https://wallstreetcn.com/livenews/3143737","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"提醒：周一（8月3日），Palantir、安森美半导体等将发布业绩报告；\n\n周二，SpaceX、AMD、卡特彼勒等将发布业绩报告；\n\n周三，诺和诺德、闪迪、西部数据、迪士尼等发布业绩报告。","tags":[],"cluster_size":1,"ts":"2026-08-02T19:44:44"},{"id":16481,"title":"报道：普睿司曼即将收购美国电气设备制造商安科","url":"https://wallstreetcn.com/livenews/3143735","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"据知情人士透露，意大利普睿司曼（Prysmian）正就收购安科公司（Atkore Inc.）进行深入谈判。这笔针对安科的全现金交易可能在未来几天内宣布；尽管谈判已进入最后阶段，但仍有可能被推迟或告吹。\n\n安科股价今年在纽约市场上涨了约15%，使其市值达到约25亿美元。普睿司曼的股价今年上涨了逾三分之一，市值约为363亿欧元（418亿美元）。安科总部位于伊利诺伊州哈维市（Harvey），主要生产用于布线和保护电气线路的各类产品与系统。（彭博）","tags":[],"cluster ”","url":"https://www.ithome.com/0/984/867.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3a8f\"\u003eIT之家 8 月 3 日消息，今日京东外卖官宣推出 AI 智能头盔，将于近期陆续上岗，首批将免费发放给京东全职骑手，后续逐步向全体骑手开放。该头盔搭载 AI 语音助手，内置“单王路线”，会自动解析订单备注，在送达前主动提醒骑手。\u003c/p\u003e\u003cp data-vmark=\"6d1f\"\u003eIT之家附官方详细介绍如下：\u003c/p\u003e\u003cp data-vmark=\"5c5c\"\u003e\u003cstrong\u003e恶劣天气送餐，AI 全流程语音解放双手\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"f53c\"\u003e广州跑了四年外卖的骑手老赵：“广州下雨比较多，一到下雨天，视线就差，沾了水的手划拉半天，手机屏幕都没反应。”\u003c/p\u003e\u003cp data-vmark=\"5ee1\"\u003e这个困扰骑手的问题，AI 智能头盔有了更好的解法。往后遇上暴雨天，老赵戴上 AI 智能头盔，只需动动嘴，就能完成接单、给用户打电话等一系列操作。当他能稳稳穿行在雨幕中时，用户收到的每一份餐，也多了一份妥帖与安心。\u003c/p\u003e\u003cp data-vmark=\"0d5f\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/84cff17a-5c15-477f-a652-a5930139ac20.jpg\" w=\"1","tags":[],"cluster_size":1,"ts":"2026-08-03T01:21:24"},{"id":16601,"title":"小鹏 G9L 大五座 SUV 官宣，号称“30 万级科技标杆”","url":"https://www.ithome.com/0/984/865.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ce7d\"\u003eIT之家 8 月 3 日消息，小鹏汽车今日官宣 G9L 大五座 SUV，号称“全球大五座科技旗舰，30 万级科技标杆”。\u003c/p\u003e\u003cp data-vmark=\"367d\"\u003e据介绍，这款新车继承 GX 旗舰安全能力，标配航空级安全冗余设计，全球四大权威机构五星安全标准开发；\u003cstrong\u003e首发全体型 AI 主动贴合座椅技术\u003c/strong\u003e，适配全球各种体型；创造了同级别最快的麋鹿测试成绩，底盘和操控都堪称强悍；将搭载小鹏第二代 VLA 的首次重大升级版本；800 伏超快充，\u003cstrong\u003e9 分钟就能充 450 公里\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"7094\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/4f4f4a2f-aac3-47ba-80bb-0847f9b4a8db.png\" w=\"638\" h=\"758\" data-snap-from=\"%7B%22from%22%3A%22weibo%22%2C%22url%22%3A%22https%3A%2F%2Fweibo.com%2Fu%2F5710264970%22%2C%22link%22%3A%22https%3A%2F%2Fweibo","tags":[],"cluster_size":1,"ts":"2026-08-03T01:17:54"},{"id":16602,"title":"王慧文家族办公室押注的AI版图：从大模型到AI Agent - 多知网","url":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5ZSzlVRGVGT3A2TXlIVjRlanhHVlM0ZFdsSHZnX0pqRjc0aC1vNVBtWTRqY1R1M1I0dU0 运行 Doom”的作品相比有不少特别之处。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"9c21\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/ccb3874c-f162-4901-90f4-4e17e21d0b68.jpg?x-bce-process=image/format,f_auto\" w=\"970\" h=\"546\" data-weibo=\"0\" data-vmark=\"87a2\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"c891\"\u003e首先，DoomPaint 的开发者正是微软 Azure CTO 马克 · 鲁西诺维奇。其次，它并不是简单地把游戏画面模拟到某个平台上，而是真正运行原版《毁灭战士》试玩版，并将微软画图（MS Paint）当作游戏画面的显示窗口。更令人惊讶的是，这一切依靠的是一种基于 Windows OLE 剪贴板机制的技巧，作者表示，游戏最高可以达到 35","tags":[],"cluster_size":1,"ts":"2026-08-02T23:38:18"},{"id":16624,"title":"经济学家汉克：AI 成本极高，难以大规模取代人力","url":"https://www.ithome.com/0/984/835.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"b054\"\u003eIT之家 8 月 3 日消息，美国约翰斯 · 霍普金斯大学应用经济学教授史蒂夫 · 汉克（Steve Hanke）表示，认为人工智能最终会免费、提供服务几乎没有成本，这种想法既脱离现实，也站不住脚。\u003c/p\u003e\u003cp data-vmark=\"1ffd\"\u003e汉克在接受 Business Insider 邮件采访时表示：“这种观点建立在对现实的误判之上，同时也夹杂着一套相当荒谬的经济学逻辑。”\u003c/p\u003e\u003cp data-vmark=\"ea2c\"\u003e他指出，人工智能的成本实际上非常高，是一种资源消耗极大的技术。\u003c/p\u003e\u003cp data-vmark=\"0029\"\u003e“AI 需要消耗大量的水、电以及物理资本，例如图形处理芯片（GPU）等硬件设备。”他说。\u003c/p\u003e\u003cp data-vmark=\"2e39\"\u003e为了建设支撑下一代 AI 模型运行的数据中心，微软、Alphabet、亚马逊和 Meta 预计今年的资本支出总额将达到约 7000 亿美元（IT之家注：现汇率约合 4.74 万亿元人民币），并计划在 2027 年进一步增加至约 1 万亿美元（现汇率约合 6.77 万亿元人民币）。\u003c/p\u003e\u003cp data-vmark=\"7548\"\u003e曾担任美国前总统罗纳德 · 里根经济顾问委员会成员的汉克，也回应了外界普遍担忧 AI 将大规模取代人类工作的观点。\u003c/p\u003e\u003cp data-vma","tags":[],"cluster_size":1,"ts":"2026-08-02T23:28:16"},{"id":16625,"title":"微星尊爵 14 Flip AI+ 梵高限定版 2026 轻薄本发售：融入名画元素，15999 元","url":"https://www.ithome.com/0/984/832.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"051e\"\u003eIT之家 8 月 3 日消息，微星旗下尊爵 Prestige 14 Flip AI+ 梵高限定版 2026 轻薄笔记本电脑将于今天 10 点发售。\u003cstrong\u003e系列产品定价 15999 元\u003c/strong\u003e，部分地区国家补贴后低至 14499 元。消费者参与微星 40 周年暑促晒单有礼活动，还可获价值 899 元微星 USB-C 立式拓展坞。\u003c/p\u003e\u003cdir\u003e\u003ca contenteditable=\"false\" href=\"https://u.jd.com  the solution space, while successful execution demands rapid responses to force feedback. However, standard diffusion policies use a fixed inference frequency and sampling steps throughout the episode, forcing a fundamental compromise: low-frequency, multi-step","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16318,"title":"X-NavDP: Generalizing Navigation Diffusion Policy to Novel Behavior and Embodiments with Group Q-score Reweighted Matching","url":"https://arxiv.org/abs/2607.28560","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28560v1 Announce Type: new \nAbstract: Pretraining navigation diffusion policies rely on large-scale expert demonstrations. These data are typically generated by a fully-informed oracle planner suited to a single nominal robot. This limits the policy's generalization to diverse embodiments and challenging scenarios (e.g., escaping dead ends or detouring long obstacles) that demand diverse local reactive behaviors with only onboard local observations. Post-training the policy with reinforcement learning (RL) offers a principled remedy. However, previous RL for diffusion approaches lea","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16317,"title":"TEA-AgriVLN: Traversability Estimation Alarm for Agricultural Vision-and-Language Navigation","url":"https://arxiv.org/abs/2607.28474","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28474v1 Announce Type: new \nAbstract: Vision-and-Language Navigation in Continuous Environments (VLN-CE) requires an agent to follow a natural language instruction, predicting a sequence of low-level actions to navigate a robot from a starting point to a target location. The A2A benchmark and the AgriVLN method pioneeringly extended VLN-CE from indoor scenes to agricultural scenes, while we observed a challenging distinction: In indoor scenes, whether a zone is traversable tends to be clear to classify, such as wood floors are traversable but concrete walls are not. In agricultural","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16316,"title":"One Future, Every Robot: Label-Efficient Collective-State Prediction with Decentralized JEPA","url":"https://arxiv.org/abs/2607.28443","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28443v1 Announce Type: new \nAbstract: Can every robot in a swarm predict the same future collective state from only local observations and bandwidth-limited messages? We formulate this as decentralized shared-state prediction and introduce Collective-State JEPA (CS-JEPA), a recurrent joint-embedding predictive architecture whose output at every robot represents one common future token field. At deployment, each robot uses a 16-frame local history and one 64-float recurrent message per directed edge; there is no global pooling, target encoder, episode clock, or recorded future action","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16315,"title":"FasTac: A Curved Multispectral Vision-Based Tactile Sensor for High-Speed High-Precision 3D Shape and Force Perception","url":"https://arxiv.org/abs/2607.28416","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28416v1 Announce Type: new \nAbstract: Curved tactile fingertips for dexterous manipulation must resolve fine contact geometry, distinguish normal and tangential loads, and capture transient signals. Existing curved vision-based tactile sensors struggle to combine accurate 3D reconstruction, three-axis force estimation, and high-speed processing in a compact form. This article presents FasTac, a curved vision-based tactile sensor integrating multispectral photometric stereo, dynamic-convolution force estimation, and hardware acceleration on a field-programmable gate array (FPGA). Sin","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16314,"title":"TacWAM: Anchor-Guided World Action Model with Mechanics-Aware Tactile Prediction","url":"https://arxiv.org/abs/2607.28391","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28391v1 Announce Type: new \nAbstract: World Action Models (WAMs) combine future-state prediction with robot action generation, but existing approaches largely rely on visual futures. Visual prediction captures scene structure and object motion, yet provides limited supervision for force, deformation, shear, and slip during contact-rich manipulation. This creates two design requirements: tactile futures should carry meaningful physical information, and they should not become privileged cues for action generation. We present TacWAM, a mechanics-aware tactile WAM that addresses this ch","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16313,"title":"SemAnCorr: Semantic Anchored Correspondence for Zero-Shot Manipulation Skill Transfer","url":"https://arxiv.org/abs/2607.28382","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28382v1 Announce Type: new \nAbstract: Transferring manipulation skills across object instances that share functionality but differ in geometry remains a fundamental challenge in robot learning. While recent correspondence methods leverage dense visual descriptors and 3D feature fields, nearest-neighbor feature matching often produces spatially incoherent correspondences that fail to recover the local geometric frames required for reliable skill transfer. We introduce SemAnCorr, a training-free framework that establishes dense correspondence by selecting semantically consistent ancho","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16312,"title":"When Robots Exchange Meaning: A Demo of Goal-Oriented Semantic Communications for Collaborative Robotics","url":"https://arxiv.org/abs/2607.28256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28256v1 Announce Type: new \nAbstract: Collaborative robotics is a representative task-oriented 6G use-case, where communication quality should be reflected in mission execution, environment understanding, and closed-loop operation rather than packet delivery alone. This demo paper presents a robot-edge semantic communication (SemCom) testbed integrating robot-side visual compression, edge-side semantic mapping, and dashboard-based mission interaction. A mobile robot equipped with RGB-D sensing and LiDAR runs ROS 2, while a Jetson Orin edge node performs reconstruction, RTAB-Map mapp","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16311,"title":"UniCross: Unified Cross-Skill Dexterous Manipulation Synthesis","url":"https://arxiv.org/abs/2607.28198","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28198v1 Announce Type: new \nAbstract: Many dexterous manipulation tasks require the object to remain securely held throughout the interaction. From the perspective of hand-object relational motion, such manipulation comprises four canonical skills: grasping, relocation, in-hand rotation, and in-hand translation. Human hands flexibly compose these skills to accomplish complex tasks. Existing approaches, however, model these skills separately with skill-specific action constraints, objectives, or even dedicated hand morphologies, which breaks the compatibility and continuity required","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16310,"title":"Learning Social Robot Navigation By Sensing Human Legs","url":"https://arxiv.org/abs/2607.27922","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27922v1 Announce Type: new \nAbstract: Robots navigating among pedestrians typically sense their surroundings with a 2D LiDAR mounted close to the ground. At that height, the sensor mostly sees moving legs rather than whole people, yet most learning-based navigation methods still treat pedestrians as simple shapes like circles. This paper addresses that gap with CALF (Convolutional Attention for Leg Features), an end-to-end neural architecture that combines convolutional layers, attention, and MLP to interpret leg motion directly from LiDAR scans and produce safe navigation commands.","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16309,"title":"Static In, Dynamic Out: Counterfactual Action Augmentation for Moving Object Manipulation","url":"https://arxiv.org/abs/2607.27890","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27890v1 Announce Type: new \nAbstract: Visuomotor policies have advanced on manipulation tasks where the target object stays static during execution, but real deployments break this assumption: parts drift on conveyors and fruits sway in the wind. We introduce Static In, Dynamic Out (SIDO), a counterfactual action augmentation that enables a policy trained only on static object demonstrations to adapt to unseen object motion at test time. Our key idea is to factorize moving object manipulation into two sub-problems: predicting where the object will be, and reaching that predicted pos","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16308,"title":"RoboBRIDGE: A Modular Framework for Bridging Policies to Robust Real-World Robotic Agents","url":"https://arxiv.org/abs/2607.27881","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27881v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have attracted growing interest as a scalable approach to robotic manipulation. While these models are effective action predictors, deploying them as robotic agents exposes critical gaps: no mechanism for failure recovery, inconsistent execution over long horizons, and limited robustness to shifts in observations, tasks, or embodiments. Existing solutions address these limitations individually through model retraining or environment-specific modules, yet what is needed is a general framework that systematicall","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16307,"title":"DexDirect: Direct Kinesthetic Arm Guidance for Efficient Dexterous Demonstration Collection","url":"https://arxiv.org/abs/2607.27784","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27784v1 Announce Type: new \nAbstract: Scalable collection of dexterous manipulation demonstrations remains a major bottleneck for robot learning. High-fidelity interfaces often require costly hardware and extensive setup, while low-setup, low cost alternatives tend to provide less precise control and impose greater cognitive workload on operators. We present DexDirect, a direct kinesthetic arm guidance for efficient dexterous demonstration collection. The operator drags a 6-DoF gravity-compensated robot arm directly by a handle, while a single webcam retargets operator's other hand","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16306,"title":"RedFlow: Redirect Failure into Action-Level Corrections for Flow-matching VLA Policy","url":"https://arxiv.org/abs/2607.27782","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27782v1 Announce Type: new \nAbstract: Flow-matching Vision-Language-Action (VLA) policies have shown strong potential for robotic manipulation but often suffer from compounding errors caused by distribution shifts during deployment. While offline reinforcement learning (RL) provides a practical way to improve deployed policies using rollout data, existing methods either ignore failure data or exploit it only at the trajectory level, resulting in low learning efficiency and persistent errors. We propose **RedFlow**, a fine-grained offline RL framework that redirects failure experienc","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16305,"title":"Write-Safe Flow Field Mapping under Ambiguous Onboard Sensing and Localization Drift","url":"https://arxiv.org/abs/2607.27713","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27713v1 Announce Type: new \nAbstract: Mobile robots can infer local flow structure from onboard sensing, but a locally plausible estimate is not always safe to write into a global map. Similar flow structures may produce ambiguous observations, while localization drift causes predicted patches to be written at incorrect locations. Repeated misregistered updates then accumulate into persistent ghost structures. We address this failure mode with a map-reference-aware conservative fusion framework. The model predicts a local velocity patch and a learned write-safety score that continuo","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16304,"title":"LabEvolver: Training-Free Experience Evolution for Safe and Grounded Wet-Lab Agents","url":"https://arxiv.org/abs/2607.27690","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27690v1 Announce Type: new \nAbstract: We introduce LabEvolver, a training-free framework that equips safe and grounded wet-lab agents with episodic memory from execution experience. LabEvolver couples a state-grounded inner trial loop for adaptive perception, online planning, and safety validation with an outer evolution loop that distills completed trajectories into reusable skill, strategy, and safety experience. On robotic solution-preparation tasks, LabEvolver demonstrates real-world feasibility, reducing pH-regulation completion time and safety-gate intercepts by 48.2% and 60.0","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16303,"title":"Arm2Air: Cross-Embodiment Skeleton Transfer for 3D Relay Formation","url":"https://arxiv.org/abs/2607.27627","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27627v1 Announce Type: new \nAbstract: Unmanned aerial vehicle (UAV) relay networks can restore connectivity after communication infrastructure is damaged. Urban relay placement is difficult because line-of-sight blockage, communication range, altitude, and three-dimensional obstacles must be considered jointly. Arm2Air transfers obstacle-avoidance skeletons from robot arms to UAV relay placement through cross-embodiment transfer. Source-domain robot-arm motions from a pretrained Neural MP model are converted into ordered skeletons that pretrain a transformer-based transfer platform,","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16302,"title":"Cross-Embodiment Transfer via Behavior-Aligned Representations","url":"https://arxiv.org/abs/2607.27549","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27549v1 Announce Type: new \nAbstract: Recent progress in large-scale imitation learning for robot manipulation has been driven by leveraging datasets across a wide range of robot embodiments. However, achieving significant cross-embodiment transfer is often still challenging. In this work, we study the role of using behavior-aligned representations (e.g., object bounding boxes, language motions, end-effector traces of robot motion) in vision-language-action (VLA) models to promote cross-embodiment transfer. We hypothesize that by possessing invariances across embodiments while being","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
