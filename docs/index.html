w=\"940\" h=\"627\" data-weibo=\"0\" data-vmark=\"53db\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cfigcaption\u003e图源：Pexels\u003c/figcaption\u003e\u003cp data-vmark=\"63c4\"\u003e谈及 AI 时代教育，马斯克建议广泛学习，兼顾人文艺术、科学与工程，夯实通识基础。\u003c/p\u003e\u003cp data-vmark=\"6a25\"\u003e他","tags":[],"cluster_size":1,"ts":"2026-09-23T05:37:33"},{"id":29718,"title":"马斯克预测十年内至少有 10 亿台人形机器人，未来会诞生大量“一人公司”","url":"https://www.ithome.com/1/006/217.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"edfc\"\u003eIT之家 9 月 23 日消息，特斯拉 CEO 埃隆 · 马斯克今日接受了央视财经专访。\u003c/p\u003e\u003cp data-vmark=\"1c42\"\u003e谈及机器人，马斯克展望未来美好图景：每个人都能拥有专属机器人，它们可以照料年迈的父母，看护孩童，还能担任孩子的一对一私教，承担各类工作。“\u003cstrong\u003e我的预测是十年内至少有 10 亿台人形机器人\u003c/strong\u003e；未来 15 年或许达到 100 亿台；20 年后可能达到 1000 亿台。”\u003c/p\u003e\u003cp data-vmark=\"293c\"\u003e马斯克称，\u003cstrong\u003e未来会诞生大量“一人公司”\u003c/strong\u003e，因为一个人可能操控成百上千甚至上万台实体机器人和数字智能体，人的生产力将被极大放大。马斯克还预测，未来会实现全民高收入，甚至到那时，\u003cstrong\u003e金钱的意义都会淡化\u003c/strong\u003e。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"8251\"\u003e\u003ca class=\"ithome_super_player\" contenteditable=\"false\" target=\"_blank\" href=\"https://weibo.com/2258727970/RjpRN7lqD\"\u003e\u003cimg src=\"https://img.ithome.com/newsup","tags":[],"cluster_size":1,"ts":"2026-09-23T05:32:00"},{"id":29719,"title":"高通发布两款第六代骁龙8旗舰平台 多产品组合适配智能体AI时代需求 - 新浪财经","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTFBacmx6Q0FlLS01b2RwR3VBdG9MN3FLeFdfZmYtWklNU1c0OVdBYWxOMkxsTGNPOGNFNUV6Qm9LbjhKZnU5YUZtdzltYlZiTnVFdDhCWGExaVR1dno4TUNhM1pudW5nZGVLRlRsME5aM19DdWZxQVl5bA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTFBacmx6Q0FlLS01b2RwR3VBdG9MN3FLeFdfZmYtWklNU1c0OVdBYWxOMkxsTGNPOGNFNUV6Qm9LbjhKZnU5YUZtdzltYlZiTnVFdDhCWGExaVR1dno4TUNhM1pudW5nZGVLRlRsME5aM19DdWZxQVl5bA?oc=5\" target=\"_blank\"\u003e高通发布两款第六代骁龙8旗舰平台 多产品组合适配智能体AI时代需求\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财 ionally returns the raw final iterate. This couples two design choices: the learning-rate schedule that generates the parameter trajectory and the estimator that constructs the deployed model (e.g. the raw final iterate or a checkpoint average). A schedule that promotes optimization progress may differ from one that minimizes variation in the raw final iterate. Separating these choices creates an opportunity to maintain progress late in training while reducing variation in the returned model. To this","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29617,"title":"A Practical Recipe for Semi-Supervised Federated ASR: Online Pseudo-Labels with Server Update Stabilization","url":"https://arxiv.org/abs/2609.25471","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25471v1 Announce Type: new \nAbstract: Semi-supervised federated learning (SSFL) trains models on clients' unlabeled data using a teacher to generate pseudo-labels, with a small labeled seed dataset on the server. Automatic Speech Recognition (ASR) is particularly fragile here: pseudo-label errors compound across the output sequence and across training rounds into divergence, leaving a large gap to fully-supervised FL. We show that closing this gap turns on two coupled design axes -- the teacher (which model generates the pseudo-labels) and the anchor (the server-side updates on labe","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29616,"title":"Mean Velocity Matching: Rethinking Generative Dynamics in Diffusion Models","url":"https://arxiv.org/abs/2609.25444","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25444v1 Announce Type: new \nAbstract: This work studies prediction parameterization for stochastic generative dynamics in diffusion models. Existing velocity-based generative models provide the simplicity of learning a single transport field, but their standard formulation is deterministic, whereas stochastic extensions generally require additional score information or an intermediate velocity-to-score reconstruction. To retain single-field prediction while directly supporting stochastic reverse dynamics, this paper introduces Mean Velocity Matching (MVM). MVM constructs a Gaussian","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29615,"title":"PermuFormer: Multi-Task Pretraining for Permutation Representation in Algebraic Combinatorics","url":"https://arxiv.org/abs/2609.25438","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25438v1 Announce Type: new \nAbstract: Diverse pretraining has been shown to be an effective method for learning reusable, domain-aware representations that provide a starting point for fine-tuning on downstream tasks. While much of the excitement in AI for math has been concentrated in the use of frontier reasoning models to solve well-specified problems through the medium of language, narrow, specialized models remain an important component of the AI for math ecosystem. In contrast to large language models, specialized models are usually trained directly on the mathematical objects","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29614,"title":"Lightweight Ranking Heads: Accelerating Multi-Task Experimentation in Production Recommender Systems","url":"https://arxiv.org/abs/2609.25433","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25433v1 Announce Type: new \nAbstract: Modern production-scale recommender systems rely on complex, multi-task ranking models. Introducing new prediction tasks into these massive systems often causes bottlenecks - it risks negative task conflicts with existing tasks, and can lead to long development and experimentation cycles due to the expensive retraining of backbone models and downstream models or tuning of reward combination formulas. To address the critical challenge of slow experimentation velocity, we introduce the Lightweight Ranking Heads (Light Heads) framework. Designed fo","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29613,"title":"Predictive Uncertainty for Neural CAE Surrogates","url":"https://arxiv.org/abs/2609.25430","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25430v1 Announce Type: new \nAbstract: Neural surrogates can substantially accelerate computer-aided engineering (CAE) workflows, but their use in design requires uncertainty estimates that remain meaningful across varying geometries, spatial prediction fields, and engineering quantities of interest. We investigate how established uncertainty quantification (UQ) approaches behave when adapted to geometry-conditioned neural surrogates. We compare one closed-form and two sampling-based approaches-a Gaussian process (GP)-based method, concrete Monte Carlo (MC) dropout, and deep ensemble","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29612,"title":"Deep Reinforcement Learning on Item-Compatibility Graphs for One-Dimensional Bin Packing","url":"https://arxiv.org/abs/2609.25397","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25397v1 Announce Type: new \nAbstract: The one-dimensional bin packing problem (1D-BPP) is a classical NP-hard combinatorial optimization problem with applications ranging from logistics and manufacturing to cloud resource management. Although deep reinforcement learning (DRL) has become a competitive paradigm for data-driven optimization, most learned packing methods target 2D and 3D variants, and intelligent learned solvers for 1D-BPP remain scarce. In this paper, we present a novel end-to-end, size-agnostic graph reinforcement learning framework for 1D-BPP. We formulate the packin","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29611,"title":"Extending FunctionGemma for Practical On-Device Mobile Function Calling","url":"https://arxiv.org/abs/2609.25373","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25373v1 Announce Type: new \nAbstract: On-device assistants require function-calling models that map natural language to local system actions, but existing resources emphasize web APIs or narrow mobile-action catalogs. We extend FunctionGemma 270M-it to practical Android workflows by introducing MOBILEACTIONSEXTENDED, a synthetic, schema-validated dataset of ~9,500 conversations covering fifteen device-control categories, including messaging, phone calls, camera/screenshot, brightness control, device-status queries, flashlight control, and application management. We fine-tune the 270","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29610,"title":"Concept Drift from a Causal Perspective","url":"https://arxiv.org/abs/2609.25340","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25340v1 Announce Type: new \nAbstract: Concept drift is a common phenomenon in real-world data streams, in which changes in the data-generating distribution can degrade predictive model performance. Most existing definitions characterize drift as changes in the joint distribution $P(\\mathbf{x}, y)$, without distinguishing which component of the data-generating process has changed. In this work, we introduce a causal perspective on concept drift based on Structural Causal Models (SCMs). We propose a taxonomy that categorizes drift events by their causal origin, including changes in ex","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29609,"title":"Spatiotemporal Kronecker Covariance Neural Networks","url":"https://arxiv.org/abs/2609.25326","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25326v1 Announce Type: new \nAbstract: Multivariate time series contain complex patterns that span across both space and time. While covariance-based statistical tools like spatiotemporal Principal Component Analysis (ST-PCA) help identify these patterns, they are limited to linear operations and prone to estimation errors with limited data. Recent covariance-based spatiotemporal neural networks offer more stable, non-linear alternatives, but they ignore correlations across different time steps. To solve this, we introduce the Kronecker coVariance Neural Network (KVNN), a temporal gr","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29608,"title":"Correcting Within-Group Self-Selection Bias in Prioritized Replay","url":"https://arxiv.org/abs/2609.25297","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25297v1 Announce Type: new \nAbstract: Prioritized experience replay (PER) improves sample efficiency by replaying high-priority transitions, usually according to absolute temporal-difference error. In stochastic environments, PER can distort the distribution of realized outcomes replayed from transitions with the same state-action pair. We call this within-group self-selection. We quantify the resulting changes in within-group outcome frequencies and mean Bellman targets. We decompose PER into between-group allocation and conditional sibling selection, and derive fixed-buffer correc","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29607,"title":"Trains but Doesn't Learn: A Post-Training Delivery Benchmark for LLM Agents as Forward-Deployed Engineers","url":"https://arxiv.org/abs/2609.25237","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25237v1 Announce Type: new \nAbstract: Post-training is becoming a service (PTaaS): a customer hands an operator data and a goal, and a forward-deployed engineer (FDE) returns a fine-tuned, evaluated, and deployed model under a budget, a human-approval gate, and reproducibility requirements. Seating an LLM agent in the FDE seat raises a question existing benchmarks cannot answer: not whether an agent can raise a metric, but whether it can be trusted to deliver. We answer it on a governed delivery plane, where an agent drives ten stages and an oracle scores each stage from platform-re","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29606,"title":"Multi-Term Fourier Graph Neural Network with Sample Relationship Learning for Enhanced Remaining Useful Life Prediction","url":"https://arxiv.org/abs/2609.25179","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25179v1 Announce Type: new \nAbstract: Predicting the remaining useful life (RUL) is essential for effective predictive maintenance. Spatio-Temporal Graph Neural Networks (ST-GNNs), which can model both temporal and spatial relationships by representing time series data as a sequence of graphs, have shown exceptional performance in RUL prediction. However, current ST-GNNs face several drawbacks. First, they require domain expertise or significant computational power to establish graph structures prior to deploying GNNs. Second, the models are restricted to capture temporal dependenci","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29605,"title":"Mitigating Sequential Reappearance in Diffusion Data-Point Unlearning","url":"https://arxiv.org/abs/2609.25166","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25166v1 Announce Type: new \nAbstract: Diffusion data-point unlearning is typically evaluated immediately after each deletion, even though subsequent requests may repeatedly update the same model. We identify sequential reappearance, a failure mode in which an instance that is initially judged to be forgotten later returns to the memorized regime without reuse of the deleted data or adversarial fine-tuning. To capture this behavior, we introduce a target-level evaluation protocol that tracks whether each target is forgotten immediately, remains forgotten at the end of the sequence, o","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29604,"title":"Learning Neural Feedback Linearization for Data-driven Systems via Augmented Lagrangian","url":"https://arxiv.org/abs/2609.25163","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25163v1 Announce Type: new \nAbstract: The paper proposes a novel data-driven framework for designing and training a feedback linearizing controller by explicitly incorporating relative degree based conditions into the learning process. This enables the conventional feedback controller components to be replaced by neural Lie derivatives, thereby facilitating a fully data-driven feedback linearization framework. Furthermore, practical closed-loop stability is established by deriving sufficient conditions under which bounded identification errors lead to bounded tracking errors. The de","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29603,"title":"Exposing Blind Spots in Deep Imbalanced Regression Evaluation","url":"https://arxiv.org/abs/2609.25152","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25152v1 Announce Type: new \nAbstract: Deep Imbalanced Regression (DIR) addresses a common failure mode of regression models: target distributions are highly non-uniform, causing models to perform best in densely populated target regions even when reliable performance is required across the full target range. Despite rapid methodological progress, DIR evaluation remains constrained by three blind spots: it is dominated by image-based benchmarks, its standard many-/medium-/few-shot protocol is diagnostic but not decision-complete, and tail-region stability across random seeds has not","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29602,"title":"Dual-GNN Multilevel Coarsening for Maximum Independent Set","url":"https://arxiv.org/abs/2609.25149","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25149v1 Announce Type: new \nAbstract: Solving large-scale instances of the Traveling Salesman Problem (TSP) exactly is computationally expensive. Researchers often employ graph sparsification methods to improve computational efficiency. Traditional sparsification methods typically rely on fixed heuristics and fail to fully exploit instance-specific structural information. In this paper, we propose Graph Edge Sparsification (GES), a learning-based sparsification approach for Euclidean TSP. By incorporating geometric structural information and combinatorial optimization technology, ou","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29601,"title":"Brain-Inspired Hierarchical Modularity for General Continual Learning","url":"https://arxiv.org/abs/2609.25146","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25146v1 Announce Type: new \nAbstract: Continual learning, the ability to learn from sequential experience while retaining and adapting prior knowledge, is central to intelligent systems operating in changing environments. However, conventional continual learning is typically studied with offline task-wise training and clear task boundaries, leaving a substantial gap from general continual learning under online, uncertain, and evolving data streams. In this regime, intelligent systems must separate conflicting experience to reduce interference while integrating compatible experience","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29600,"title":"Stable Unsupervised Continual Chunking with Sheaf SyncMap","url":"https://arxiv.org/abs/2609.25143","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25143v1 Announce Type: new \nAbstract: Unsupervised Continual chunking is a fundamental problem in machine learning and neuroscience, where the goal is to identify groups of states that frequently co-occur in temporal sequences. A key challenge is to form accurate chunks while maintaining their stability over time. In this work, we propose sheaf regularization to reduce local inconsistencies in Decentralized SyncMap, a self-organizing system, and thereby stabilize its chunking dynamics. We introduce a radial sheaf structure that penalizes distance-dependent radial motion between pair","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29599,"title":"The Probabilistic Structure of Large Language Models","url":"https://arxiv.org/abs/2609.25134","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25134v1 Announce Type: new \nAbstract: This paper presents a probabilistic perspective on large language models (LLMs), developed with the aim of bringing together, in a single self-contained account, tools that are usually treated separately across the literature. LLMs are described through probability measures on the set of sequences of tokens, specified via their autoregressive conditional distributions. Training is formulated as a maximum-likelihood estimation problem, addressed by stochastic gradient methods, while text generation is viewed as the sequential simulation of the re","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29598,"title":"Federating Quantum and Classical Computing: A Privacy-Preserving Hybrid Approach","url":"https://arxiv.org/abs/2609.25082","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25082v1 Announce Type: new \nAbstract: Quantum machine learning (QML) is increasingly recognized as one of the most promising near-term applications of quantum computing, viewed as a next-frontier candidate beyond purely classical approaches. Hybrid quantum-classical models operationalize this potential by embedding a parameterized quantum circuit within a model where all other components remain classical-a design already applied to chemistry simulation, financial modeling, and image classification. However, their deployment in privacy-sensitive, multi-party settings is constrained b","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29597,"title":"\"As a Language Model...\": Chat Template Switches LLM Self-Referential Voice and Activation Steering Reproduces It","url":"https://arxiv.org/abs/2609.25021","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.25021v1 Announce Type: new \nAbstract: Large Language Models (LLMs) tend to add disclaimers like \"I'm just an AI\" when asked about something related to themselves. The self-reports from such responses are used in debates about AI safety or self-knowledge of the models, yet what drives them is not well understood. Are the models telling us about themselves or rather how they are deployed? In this work, we show that the chat template works like a switch - when present, it turns this disclaimer voice up and experiential voice like \"I feel\" down, across 8 popular open-source instruct mod","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29596,"title":"Passes Alone, Fails Together: Benchmarking Semantic Coordination in Parallel LLM-Agent Development","url":"https://arxiv.org/abs/2609.25396","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25396v1 Announce Type: new \nAbstract: Parallel coding agents can produce patches that work alone but fail when merged. This happens when one agent changes an interface or rule that another agent still relies on. We study these failures with stale, a benchmark for semantic coordination. Our evaluation runs the same tests on each patch alone and on their combination, counting only failures introduced by combining the patches. We use three tiers: synthetic tasks with controlled interface changes, pairs of merged pull requests, and constructed tasks that use real Django helpers. Among 8","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29595,"title":"TelecomGPT-R1: Unified Post-Training for Reasoning Across Heterogeneous Telecom Tasks","url":"https://arxiv.org/abs/2609.25356","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25356v1 Announce Type: new \nAbstract: Large language models (LLMs) offer great potential to automate a broad range of telecom engineering tasks by reasoning over standards, network configurations, mathematical models, source code, and operational logs. However, existing telecom LLMs struggle to reliably reason across these diverse tasks and data types. General-purpose LLMs often lack reliable grounding in telecom-specific knowledge, while telecom-specialized models are typically developed for narrower task families and exhibit limited multi-task performance. To fill this gap, we int","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29594,"title":"FineWeb-CLaR: Culture, Language, and Region Annotations for Benchmark-Aligned Corpus Auditing","url":"https://arxiv.org/abs/2609.25298","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25298v1 Announce Type: new \nAbstract: Cultural evaluation coverage and robustness in language models are difficult to diagnose because pretraining corpora and cultural benchmarks are rarely indexed with comparable metadata. Benchmarks increasingly target culturally situated phenomena at the level of languages, regions, and locale-specific practices, while web-scale corpora are usually organized only by language. A shared culture-language-region layer makes these resources comparable, enabling audits of whether a target cultural phenomenon is represented in pretraining data, evaluate","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29593,"title":"FinFIRST: Benchmarking Search Agents for Financial Information Retrieval, Sourcing and Traceability","url":"https://arxiv.org/abs/2609.25192","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25192v1 Announce Type: new \nAbstract: Financial search is a highly demanding task for LLM agents, requiring not only a correct final answer but also temporally valid information retrieval, authoritative source selection, entity and period alignment, unit and definition consistency, and verifiable evidence for all conclusions. Existing benchmarks predominantly evaluate only the final answer, making it difficult to localize errors or assess whether an answer is well-founded. To address this gap, we introduce FinFIRST (Financial Information Retrieval, Sourcing and Traceability), the fi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29592,"title":"Impact Is Not Invalidation: Ask About the Claim, Not the Diff","url":"https://arxiv.org/abs/2609.25130","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25130v1 Announce Type: new \nAbstract: Memory systems for coding agents must decide, when a repository changes, which of their stored claims have become false. Content anchoring invalidates a claim whenever the artifact it came from changes, which fires constantly. Semantic-equivalence classification asks whether a diff preserves behavior, a question about the diff rather than about any stored claim. We show the second signal fails for a reason unrelated to model capability: asked whether a commit preserves behavior, five models spanning a 40x price range fire on 59-72% of real commi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29591,"title":"ufakzeka-1: Building and Evaluating a 151M-Parameter Turkish Language Model from Scratch","url":"https://arxiv.org/abs/2609.25081","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.25081v1 Announce Type: new \nAbstract: We describe ufakzeka-1, a 151M-parameter (182M with embeddings) decoder-only Turkish language model pretrained from scratch on 13.5B tokens of openly licensed text and instruction-tuned for chat, at a total cost of about \\$286 in cloud GPU, API and notebook time. The contribution is not the model's capability, which is what a model this size can be expected to have, but the record of building and measuring it: a Turkish byte-level tokenizer at 1.77 tokens per word, a three-stage pretraining schedule, a post-training mixture of openly licensed an","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#db2777","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":29541,"title":"A Deployable Four-Finger Payload for Teleoperated Free-Flying Manipulation with Astrobee","url":"https://arxiv.org/abs/2609.25614","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25614v1 Announce Type: new \nAbstract: This article presents a bimanual teleoperation pipeline and conceptual design of a deployable four-finger payload for intra-vehicular free-flyers. Future habitats in low-Earth orbit (LEO) will require systems to perform mundane tasks like cargo handling and maintenance during crewed and uncrewed periods. The gripper payload provides 17 manipulation degrees-of-freedom (DoF) through four independently actuated fingers on a linear rail system. To control it, a virtual reality (VR) device interface maps the human ground operator's hand motions to th","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29540,"title":"CableVLA: Simulation-Privileged Global-Local Representation Learning for Cable Routing","url":"https://arxiv.org/abs/2609.25606","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25606v1 Announce Type: new \nAbstract: Cable routing requires coordinated control of global cable topology and changing local contacts. We present CableVLA, an end-to-end multimodal vision-language-action framework that converts simulation-privileged supervision into deployable cable-topology and tactile representations. TopoHead distills node-level physics and current and future cable-topology information into causal visual context for the action expert. TacSense uses complementary frame and taxel branches to learn contact dynamics from resistive arrays, with simulator-derived kinem","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29539,"title":"Recording Hand-Held Laparoscopic Instrument Motion in the Operating Room: Magnetometer-Free Fusion of Inertial, Range and Visual Sensing","url":"https://arxiv.org/abs/2609.25577","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25577v1 Announce Type: new \nAbstract: Most minimally invasive procedures are still performed with hand-held laparoscopic instruments, yet only the endoscopic video is retained; the instrument motion that expresses surgical skill, and that could support skill assessment and robot learning, is lost. Pose from video alone remains millimeters to centimeters off, and an instrument-mounted inertial measurement unit (IMU) cannot rely on its magnetometer, whose field changed with tool pose and between sessions in our measurements. We present a surgical instrument-state logger that clips ont","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29538,"title":"IndustrialVLA-Bench: A Traceable Multi-Axis Evaluation of Open Robot Policy Models","url":"https://arxiv.org/abs/2609.25562","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25562v1 Announce Type: new \nAbstract: Open robot policies increasingly follow two paradigms: vision-language-action models (VLAs) directly map observations and instructions to actions, whereas world-action models (WAMs) incorporate learned video or world dynamics into policy learning or action generation. Although both target the same manipulation tasks and represent alternative design choices, they are commonly reported under different evaluation protocols, leaving their capability, robustness, language sensitivity, and deployment-cost trade-offs unclear. We present IndustrialVLA-B","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29537,"title":"HABILIS Brain 0: Geometry-Change Supervision for Vision-Language-Action and Residual Flow Recovery","url":"https://arxiv.org/abs/2609.25558","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25558v1 Announce Type: new \nAbstract: Vision-language-action policies benefit from geometric supervision, but current-frame geometry alone does not explicitly describe the changes associated with manipulation. This design is motivated by the goal of learning an embodiment-agnostic visual interface that can be pretrained across robot and egocentric video before robot-specific action alignment. We introduce Geometry-Change VLA (GC-VLA), which learns to predict multiview future-current geometry-change tokens from current observations. Offline frame pairs define a nominal 0.5-second pre","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29536,"title":"Digital Twin-Driven VR Teleoperation with Multi-View Spatial Perception for Surgical Robots","url":"https://arxiv.org/abs/2609.25527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25527v1 Announce Type: new \nAbstract: Current robot-assisted minimally-invasive surgery (RMIS) platforms provide a fixed console for the surgeon to view stereo endoscopic images and teleoperate instruments inside the patient. Several researchers have proposed the use of a head-mounted display (HMD) as a portable console, with video pass-through rendering of the endoscope images which, like the fixed console, restricts the operator to a single endoscopic viewpoint and limits depth perception. We present a digital twin-driven virtual reality (VR) teleoperation platform, where the digi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29535,"title":"RoboMP-DINOv2: Prompts, Not Filters for Robust Robot Manipulation","url":"https://arxiv.org/abs/2609.25506","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25506v1 Announce Type: new \nAbstract: Robot manipulation policies must generalize across visual shifts while preserving scene context relevant to action. General-purpose vision encoders are not tailored to visuomotor control, while object-centric approaches often use segmentation masks as hard filters that discard potentially useful context. We propose RoboMP-DINOv2 (Robotics Mask-Prompted DINOv2), a full-scene vision encoder that treats masks as spatial prompts rather than visibility filters. It extracts dense DINOv2 features from the full observation, injects learned region-specif","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29534,"title":"Brace Yourself: Task-Conditioned Environmental Bracing for Forceful Humanoid Manipulation","url":"https://arxiv.org/abs/2609.25486","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25486v1 Announce Type: new \nAbstract: Forceful manipulation is challenging for humanoid robots because interaction forces can disturb whole-body balance. We introduce the Supporting Hand Strategy (SHS), which enables a humanoid to brace against the environment with one hand while performing forceful manipulation with the other. SHS optimises a task-conditioned support configuration that guides two synchronous reinforcement-learning policies, without human motion data or online whole-body trajectory planning. On a Unitree G1, SHS achieved usable contact forces up to 60 N, compared wi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29533,"title":"REDACT: Robust Perceptive Locomotion under Unseen Visual Corruption","url":"https://arxiv.org/abs/2609.25450","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25450v1 Announce Type: new \nAbstract: Depth-conditioned locomotion policies have demonstrated impressive agile maneuvers, but can be steered to unpredictable actions when observations are outside their training distribution. Occlusion, invalid returns, sensor noise, and visual distractors can shift deployment observations away from nominal simulated depth. While synthetic sensor augmentation targets specified degradations, it does not by itself define behavior under corruption families omitted from training. To address gaps in training-time coverage, we present REDACT (Retaining Evi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29532,"title":"Norm2Tex: Augmenting Visuo-Tactile Simulations with Texture","url":"https://arxiv.org/abs/2609.25398","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25398v1 Announce Type: new \nAbstract: Large-scale datasets are essential for training generalist robot control policies. Collecting real-world tactile data is costly and time-consuming, motivating the use of tactile simulations. However, current tactile simulators capture only overall contact geometry and miss fine details like texture. This results in a significant domain shift between simulated and real tactile data. To address this gap, we introduce Norm2Tex, a plug-in method that augments simulations of vision-based tactile sensors with high-frequency surface details from normal","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29531,"title":"VLAQuantBench: Closed-Loop Evaluation of Post-Training Quantization for Vision-Language-Action Models","url":"https://arxiv.org/abs/2609.25376","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25376v1 Announce Type: new \nAbstract: Post-training quantization reduces the memory requirements of vision-language-action (VLA) models, but precision selection must account for the interaction between layer scope, numerical format, and calibration. We introduce \\textbf{VLAQuantBench}, a controlled evaluation with 409 runs and 94,574 simulation episodes: four models on LIBERO, with X-VLA additionally evaluated on three simulation benchmark families. Under uncalibrated W4A4 round-to-nearest quantization, expanding a $\\pi_{0.5}$ action-head subset from 126 to 167 layers raises success","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29530,"title":"Angular momentum analysis on Karate roundhouse kicks: a longitudinal case study","url":"https://arxiv.org/abs/2609.25374","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25374v1 Announce Type: new \nAbstract: Human gait in reality extends beyond straight-line walking, with some situations even requiring drastic back-and-forth rotations. A smooth and stable execution may seem intuitive, but the underlying mechanics remains unknown. The Karate roundhouse kick may be an extreme case of exhibiting dynamic back-and-forth rotations, but investigating the angular momentum (AM) management can potentially inform stability analysis in dynamic human motions and smoother gait in robots and exoskeletons. This paper introduces two new AM-based measures and analyze","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29529,"title":"Capability-Aware Arbitration for Semantic Intent-Based Shared Control","url":"https://arxiv.org/abs/2609.25369","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25369v1 Announce Type: new \nAbstract: Shared control often allocates robot authority based on confidence in inferred human intent, assuming reliable autonomous execution. When this assumption fails, high intent confidence can cause over-helping. We present a capability-aware shared-control framework in which a vision-language model (VLM) infers human intent and provides semantic-intent confidence, while a vision-language-action (VLA) policy generates autonomous actions. VLA capability confidence is estimated online from the dispersion and local instability of stochastic action traje","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29528,"title":"HOTICE: Whole-Body Humanoid Object Transportation in Cluttered Environments","url":"https://arxiv.org/abs/2609.25363","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25363v1 Announce Type: new \nAbstract: Object transportation is a fundamental capability for humanoid robots operating in real-world, human-centric environments, yet existing methods struggle when clutter constrains free space around both the robot and its carried payload. We present HOTICE, a whole-body humanoid learning framework for transporting objects through such cluttered environments. First, we introduce Humanoid-Object Decoupled Potential Fields, which jointly encode collision-avoidance guidance for the robot and the carried object, enabling coordinated, obstacle-aware motio","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29527,"title":"Learning from Humans for Proactive Assistance in Human-Robot Collaborative Transport","url":"https://arxiv.org/abs/2609.25351","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25351v1 Announce Type: new \nAbstract: We focus on human-robot collaborative transport, a challenging task of broad relevance spanning logistics, manufacturing, and the home, in which a user and a robot work together to relocate a large or heavy object. To act as an effective partner, the robot should reduce the user's effort by contributing to efficient relocation of the object while remaining physically responsive to them. Prior work often addresses these capabilities separately, producing robots that may move the object efficiently but resist user input, or accommodate the user bu","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29526,"title":"JAMB: Joint Action-Motion Diffusion for Bimanual Manipulation","url":"https://arxiv.org/abs/2609.25322","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25322v1 Announce Type: new \nAbstract: Coordinated bimanual manipulation is challenging because the motion of either arm can alter the shared 3D scene and thereby affect the other arm. Yet most diffusion policies generate actions without explicitly modeling these future geometric consequences, while predictive variants typically use future state only as auxiliary supervision or fixed conditioning. We address this limitation by proposing JAMB, a diffusion policy that jointly denoises bimanual actions and future 3D point tracks. By allowing action and track hypotheses to evolve togethe","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29525,"title":"Learning to Plan in Human-Robot Collaboration: Multimodal Reinforcement Learning for Adaptive Interaction","url":"https://arxiv.org/abs/2609.25274","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25274v1 Announce Type: new \nAbstract: Robot assistants for older adults and people with disabilities need to perform collaborative tasks with users effectively. The core component of these systems is an interaction manager whose job is to observe and assess the task and infer the state of the human and their intent for the robot to choose the best course of action. Due to the sparseness of the data in this domain, the policy for such multimodal systems is often crafted by hand; as the complexity of interactions grows, this process is not scalable. This paper proposes a reinforcement","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29524,"title":"Cosserat Modeling of Trimmed Helicoid Soft Arms with a Separated-Section Constitutive Law","url":"https://arxiv.org/abs/2609.25264","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25264v1 Announce Type: new \nAbstract: Cosserat rod models for soft robots usually construct sectional stiffness by summing material properties over a common cross-section. This assumption becomes inaccurate for trimmed helicoid arms, where load-bearing helix domains are separated and connected only through sparse fused crossings. This paper formulates a separated-section constitutive law that evaluates each helix domain in its local frame and pulls its constitutive response back to the backbone, yielding an effective backbone stiffness. Sparse-fusion mechanics captures the additiona","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29523,"title":"Towards Adaptive Interaction Strategies for Human Companion Robot via Deep Reinforcement Learning","url":"https://arxiv.org/abs/2609.25031","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25031v1 Announce Type: new \nAbstract: In the field of Human-Robot Interaction (HRI), achieving flexibility in human-accompanying within real-world environments holds great potential for various applications but also poses significant challenges. Traditional methods typically restrict robots to fixed positions relative to humans, such as tracking from behind, in front, or side-by-side, which limits robot adaptability in dynamic workspaces. This study introduces a novel human-companioning strategy that uses Reinforcement Learning (DRL) to enable mobile robots to dynamically adjust the","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29542,"title":"机器人混在人群里难分辨|马斯克|特斯拉|optimus_新浪新闻 - 手机新浪网","url":"https://news.google.com/rss/articles/CBMiY0FVX3lxTE1jOC1WbzlUdTljS1d5Y2FQck5aMDYwX2Y1THZ4ZlVUbTZ0a2xfNHF4UzhEdVNSQjhlVzNyLS1LZXZsZzJaTDlUNElVLUpObUpJU29IN194cGY3Qkh0MUpRVzNvcw?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiY0FVX3lxTE1jOC1WbzlUdTljS1d5Y2FQck5aMDYwX2Y1THZ4ZlVUbTZ0a2xfNHF4UzhEdVNSQjhlVzNyLS1LZXZsZzJaTDlUNElVLUpObUpJU29IN194cGY3Qkh0MUpRVzNvcw?oc=5\" target=\"_blank\"\u003e机器人混在人群里难分辨|马斯克|特斯拉|optimus_新浪新闻\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-23T02:24:00"},{"id":29543,"title":"特斯拉机器人团队审厂3家供应链企业 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxON3JJYlFPdW9xOHZfVWQ2QXB1bGZxdGRVNmZleEEzaUREVlJxRDdKc2VReXcxak5fUTU3RFdpNllqcTlZUWJ4cmZtN0hCTUN5QjcxMkJUdk1QZlE4RWlJYmx4Q0tQNl85MGc2WGRQWXp6MnRrOVJFaEloTFJnS1lQSnpkV1VMbWdvOEh4dXJtNGxPN1dSTzVfSTA4VVpZV2NGdlVVRmRlRQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxON3JJYlFPdW9xOHZfVWQ2QXB1bGZxdGRVNmZleEEzaUREVlJxRDdKc2VReXcxak5fUTU3RFdpNllqcTlZUWJ4cmZtN0hCTUN5QjcxMkJUdk1QZlE4RWlJYmx4Q0tQNl85MGc2WGRQWXp6MnRrOVJFaElo // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
