,"tags":[],"cluster_size":1,"ts":"2026-07-08T22:28:26"},{"id":9171,"title":"赚钱效应明显，多路资金抢筹基石投资","url":"https://wallstreetcn.com/livenews/3130916","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"智谱涨逾10倍、深演智能涨逾6倍、兆易创新H股涨近4倍……年内上市的港股新股表现亮眼，吸引外资机构、保险资金、银行理财子公司、公募基金及产业资本等竞相通过基石投资布局。据Choice数据统计，截至7月8日，年内91家港股IPO公司中，引入基石投资者的占了81.32%，较往年进一步提升。参与港股打新的基石投资者多达502家，大部分IPO引入5家及以上基石投资者。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-08T22:22:05"},{"id":9172,"title":"上证报：理性看待市场短期波动，多重逻辑支撑A股中长期配置价值","url":"https://wallstreetcn.com/livenews/3130915","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，A股市场出现阶段性调整。面对市场波动，业内人士表示，应理性看待短期调整。资本市场运行受到宏观环境、流动性、企业盈利和投资者预期等多重因素影响，阶段性波动是市场机制发挥作用的正常表现。从中长期看，随着中国经济基本面持续修复、政策环境不断优化、产业升级加速推进以及流动性保持合理充裕，A股市场仍具备较好的配置基础。","tags":[],"cluster_size":1,"ts":"2026-07-08T22:21:08"},{"id":9173,"title":"周三（7月8日）纽约尾盘，标普500股指期货最终跌0.48%，道指期货跌1.24%，纳斯达克100股指期货跌0.01%。\n\n罗素2000股指期货跌1.10%。","url":"https://wallstreetcn.com/livenews/3130898","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（7月8日）纽约尾盘，标普500股指期货最终跌0.48%，道指期货跌1.24%，纳斯达克100股指期货跌0.01%。\n\n罗素2000股指期货跌1.10%。","tags":[],"cluster_size":1,"ts":"2026-07-08T21:08:11"},{"id":9174,"title":"阿里巴巴期权聚焦：7月8日成交36.23万张，未平仓合约230.48万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxOaXpwNGFTMjVKTmdQczlJYV9qYjZfTW1NOXphaTUzeW12cDZRekRKaTVoVnVxbG9LVlZOS3JxaDRMa0lacEo4S0RILW91eUN3WVRqUGxXSldJb2tYQmFOQlA4UTBjekE4MV8xNldUbHV2RmJzVDUzRjFYNEJfdEUybFRaQW42NEd6S0c0LS1VMDFQT0hIczJUZkdtZnB3Y1hYYUE?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiogFBVV95cUxOaXpwNGFTMjVKTmdQczlJYV9qYjZfTW1NOXphaTUzeW12cDZRekRKaTVoVnVxbG9LVlZOS3JxaDRMa0lacEo4S0RILW91eUN3WVRqUGxXSldJb2tYQmFOQlA4UTBjekE4MV8xNldUbHV2RmJzVDUzRjFYNEJfdEUybFRaQW42NEd6S0c0LS1VMDFQT0hIczJUZkdtZnB3Y1hYYUE?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月8日成交36.23万张，未平仓合约230.48万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoo  昨日（7 月 8 日）发布博文，报道称微软承认经典版 Outlook 存在 Bug，用户使用 Alt + I 快捷方式调用 AI 功能后导致应用崩溃，不过微软在收到用户反馈后已迅速修复该 Bug。\u003c/p\u003e\u003cp data-vmark=\"0b4f\"\u003e根据 Microsoft 365 更新记录，用户在 Windows Server 2019 RDS 环境中使用经典版 Outlook 应用程序，按下 Alt + I 快捷方式调用 Draft with Copilot，或点击邮件正文中的 Copilot 铅笔图标输入提示词后，\u003cstrong\u003e界面会显示“Writing your email”，蓝色进度条开始从左向右移动，随后界面卡死，Outlook 崩溃并关闭。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"e9c2\"\u003eIT之家援引博文介绍，根据用户反馈，崩溃后并非每次都完全中断会话，部分情况下 Outlook 会自动重新打开。此外该问题仅限于经典版 Outlook，用户反馈在 Word 和 Excel 中均能正常使用 Copilot 功能。\u003c/p\u003e\u003cp data-vmark=\"98ee\"\u003e微软在收到用户反馈后，迅速修复该 Bug，并修正了高对比度模式下“Help me write”按钮显","tags":[],"cluster_size":1,"ts":"2026-07-09T01:26:46"},{"id":9319,"title":"又一家大模型公司拟进军终端：阶跃星辰即将推出⾸款AI智能体⼿机 - mrjjxw.com","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE9jNEZfYkN6ZXpnM09WU2tqaXlmaV9FRVlhWkFHVmtkbVRrczJmQlRVeFhjQmdWczhPbGhYcS1Ya3JiNGZMMHJLVjRra1ZseER4Y1BtOXFQV3o2aTZuOHB5VG9meDV0UQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE9jNEZfYkN6ZXpnM09WU2tqaXlmaV9FRVlhWkFHVmtkbVRrczJmQlRVeFhjQmdWczhPbGhYcS1Ya3JiNGZMMHJLVjRra1ZseER4Y1BtOXFQV3o2aTZuOHB5VG9meDV0UQ?oc=5\" target=\"_blank\"\u003e又一家大模型公司拟进军终端：阶跃星辰即将推出⾸款AI智能体⼿机\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003emrjjxw.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-09T01:22:00"},{"id":9320,"title":"OpenAI宣布本周全面开放 GPT-5.6全系模型 - 品玩","url":"https://news.google.com/rss/articles/CBMiSEFVX3lxTE9xT2p4N3gyTUdhbTBCSnBuY3R6amNyS0F4X2pfYXE0OVlEVGMxMnBRQnNiOFRYQzkzRWt4Wmp2NmxGT0hfTlk4Qw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE9xT2p4N3gyTUdhbTBCSnBuY3R6amNyS0F4X2pfYXE0OVlEVGMxMnBRQnNiOFRYQzkzRWt4Wmp2NmxGT0hfTlk4Qw?oc=5\" target=\"_blank\"\u003eOpenAI宣布本周全面开放 GPT-5.6全系模型\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e品玩\u003c/font\u003e" _size":1,"ts":"2026-07-09T00:49:36"},{"id":9328,"title":"九部门：禁止平台经营者强制或变相强制商户承担补贴、参与促销活动，向商户转嫁促销成本","url":"https://www.ithome.com/0/974/306.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c6c8\"\u003eIT之家 7 月 9 日消息，商务部等 9 部门印发了关于加快零售业创新发展的意见，并于 7 月 9 日（今天）对外发布。\u003c/p\u003e\u003cp data-vmark=\"822d\"\u003eIT之家获悉，意见提出“加强价格治理”：支持品牌商构建合理价格体系，通过完善定价策略缩小线上线下价差。落实《互联网平台价格行为规则》《网络交易平台规则监督管理办法》，引导平台经营者自觉规范价格和补贴行为。重点整治虚假宣传、虚假促销、虚假打折和不公平定价行为。\u003cstrong\u003e推动落实明码标价，公示促销活动规则、期限、适用范围\u003c/strong\u003e，禁止平台经营者强制或变相强制商户承担补贴、参与促销活动，向商户转嫁促销成本，以及“0 元购”等行为。\u003c/p\u003e\u003cp data-vmark=\"0f43\"\u003e意见还提出“促进公平竞争”：落实《中华人民共和国反不正当竞争法》，\u003cstrong\u003e线上线下零售一视同仁\u003c/strong\u003e。推动平台经营者遵循合法、公平、诚信原则合理收费，降低平台内经营者成本。强化平台领域经营者集中反垄断审查，维护公平竞争秩序。推动平台经营者依法向监管部门开放算法必要数据，促进算法推荐、流量分配公平透明。推动平台经营者建立多元化算法推荐指标体系，不得仅以商品价格作为算法推荐核心参数。鼓励同品同款商品线上线下“同标同质”。\u003c/p\u003e\u003cp data-vmark=\"d631\" s","tags":[],"cluster_size":1,"ts":"2026-07-09T00:48:19"},{"id":9329,"title":"打造“真人感”对话！OpenAI推出GPT-Live语音模型 支持同时聆听和说话 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQRUVQMTFKd00xN2lGT3BrRVN6cTdpb0dyWUp4NGNMUm1zaXh6RldRN3QwUEgxUGs2UzQ5S3UxclZ6WXQ5NXRWa2ZEVFdQRWRmN3FPY3lYUnR6cGZrY1VOZy16T2hBX0ZIbTY0S0lMM3dRdXFHQnNDMWU2LWxUZUQ1NUg0dDVNQ0dH?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQRUVQMTFKd00xN2lGT3BrRVN6cTdpb0dyWUp4NGNMUm1zaXh6RldRN3QwUEgxUGs2UzQ5S3UxclZ6WXQ5NXRWa2ZEVFdQRWRmN3FPY3lYUnR6cGZrY1VOZy16T2hBX0ZIbTY0S0lMM3dRdXFHQnNDMWU2LWxUZUQ1NUg0dDVNQ0dH?oc=5\" target=\"_blank\"\u003e打造“真人感”对话！OpenAI推出GPT-Live语音模型 支持同时聆听和说话\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-09T00:46:00"},{"id":9330,"title":"前瞻全球产业早报：OpenAI前研究员加入腾讯_产经 - 前瞻网","url":"https://news.google.com/rss/articles/CBMiakFVX3lxTE9wRTBNdlRPS29aVVdNakpXQlI1T0k0Q05tcmRJX2NvLS1JSlhBWjBRRmszWThHdXZSZ3N1QnJ1dkx5bFJhWG15MWVnRlhRWlFS umanoid Robots Stuck Behind \"Three Mountains\": Unitree Exec Says AI Models Aren't Ready, UBTECH Fights for Survival Amid Controversy\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.biggo.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-08T05:06:00"},{"id":9063,"title":"NVIDIA Brings Isaac GR00T 1.7 to LeRobot - Let's Data Science","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPMTZtYWxhZzdWNkJoRExpd243clVrSDR2akNqdGlJUWZITmtXSkZDUFRrOHp1SVhWaFZvb19LSmFaU0hacmlQcm03TnNaT3o2d1B6UkEwdnRyYnNlZjRlZUtLSTF0NnhoNzBxTWhYeVpfalpTd2lwV3JfMnQxaDA3R1BkYzNaMjNw?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPMTZtYWxhZzdWNkJoRExpd243clVrSDR2akNqdGlJUWZITmtXSkZDUFRrOHp1SVhWaFZvb19LSmFaU0hacmlQcm03TnNaT3o2d1B6UkEwdnRyYnNlZjRlZUtLSTF0NnhoNzBxTWhYeVpfalpTd2lwV3JfMnQxaDA3R1BkYzNaMjNw?oc=5\" target=\"_blank\"\u003eNVIDIA Brings Isaac GR00T 1.7 to LeRobot\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eLet's Data Science\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-08T04:52:45"},{"id":8958,"title":"Optimal Transport Q-Learning for Flow Policy Steering and Acceleration","url":"https://arxiv.org/abs/2607.06262","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06262v1 Announce Type: new \nAbstract: Diffusion and flow policies have recently demonstrated remarkable performance in robotic applications by accurately capturing multimodal robot trajectory distributions, especially in the context of vision language action (VLA) models. However, high quality policy performance also requires fast inference and high quality demonstrations, which are often hard to get. Lack of these leads to suboptimal policy behaviors and failure under distribution shifts. In this work we address the problem of fine-tuning and accelerating suboptimal flow-based poli","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8957,"title":"Diagnosing Semantic Handoff Failures in Agent-Orchestrated Vision-Language-Action Skill Composition","url":"https://arxiv.org/abs/2607.06256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06256v1 Announce Type: new \nAbstract: Long-horizon household tasks require robots to compose many language-conditioned skills, yet the boundary between consecutive skills is rarely explicit. A skill may satisfy its own postcondition while leaving the robot, objects, or camera views in a state from which the next skill cannot reliably start. We study this semantic handoff problem in BEHAVIOR-1K through an agent-orchestrated vision-language-action execution harness. The harness invokes $\\pi_{0.5}$-based skill checkpoints trained from cleaned BEHAVIOR-1K demonstrations, assigns each sk","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8956,"title":"RoboVAST: Automated Scenario-Based Validation of Robots at Scale","url":"https://arxiv.org/abs/2607.06248","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06248v1 Announce Type: new \nAbstract: Validation of robotic systems critically depends on the operating conditions under which they are assessed. Scenario selection and variation are often manual, experience-driven, and difficult to scale, which harms reproducibility and weakens validation conclusions. We propose a scenario-based methodology that models scenarios compositionally and formalizes how these dimensions are varied, instantiated, executed, and interpreted. Building on this, we introduce RoboVAST, a framework that realizes declarative campaign specifications, plugin-based s","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8955,"title":"Calf-Integrated Arms for Bimanual Quadruped Loco-Manipulation","url":"https://arxiv.org/abs/2607.06186","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06186v1 Announce Type: new \nAbstract: Most quadruped loco-manipulation designs trade manipulation capability against stance. A trunk-mounted arm sits high and usually carries a single arm; using the legs as manipulators lifts the manipulating leg off the ground; and even leg-mounted grippers reach two-handed tasks only by rearing onto the hind legs. This paper integrates a manipulator with a prismatic slider, two revolute joints, and a gripper into each front calf of a Unitree Go2. The two arms grasp objects at ground level and manipulate with both hands while all four feet stay pla","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8954,"title":"EAGOR: Embodied Reasoning in Omni-direction","url":"https://arxiv.org/abs/2607.06165","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06165v1 Announce Type: new \nAbstract: Omni-directional (360{\\deg}) cameras provide embodied agents with a holistic view of their surroundings, making them suited for directional reasoning in tasks such as navigation and object search. Existing Vision Language Models (VLMs) project 360{\\deg} observations to 2D equirectangular projection (ERP) images and process them using architectures designed for perspective images. However, they ignore the spherical nature of 360{\\deg} observations, where each pixel represents a viewing direction relative to the agent. Consequently, their directio","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8953,"title":"ThorArena: Benchmarking Humanoid Physical Interaction with Human Motion-Force Demonstrations","url":"https://arxiv.org/abs/2607.06052","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06052v1 Announce Type: new \nAbstract: Humanoid robots are increasingly expected to perform contact-rich tasks that require not only accurate whole-body motion but also robust physical interaction with surrounding objects and humans. Although recent advances in humanoid motion imitation and whole-body control have achieved remarkable tracking performance, existing datasets and benchmarks primarily focus on kinematic motion while largely overlooking synchronized interaction forces. As a result, current evaluations fail to capture how external interaction forces affect tracking accurac","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8952,"title":"RoboTALES: Learning Reasoning-Guided Robot Policies via Task-Aligned Simulated Futures","url":"https://arxiv.org/abs/2607.06018","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06018v1 Announce Type: new \nAbstract: Pretrained video generative models are promising backbones for visuomotor control, but their imagined futures often drift from task intent and are not reliably action-conditional. As a result, these models can be difficult to use for planning or policy extraction. To address these limitations, we propose RoboTALES, a single-stage framework that learns task-aligned simulated futures and uses them to train robot policies. Our approach introduces two key innovations: (1) a hierarchical LLM-based planner that breaks complex tasks into a sequence of","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8951,"title":"DexTele: A Dual-Arm Dexterous Teleoperation System Based on Motion Retargeting and Adaptive Force Control","url":"https://arxiv.org/abs/2607.05883","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05883v1 Announce Type: new \nAbstract: In dual-arm dexterous teleoperation, cross-platform generalization of motion retargeting and interactivity of grasping are crucial. However, the heterogeneity of robotic architectures and the wide variety of grasping objects pose significant challenges to achieving precise motion retargeting and compliant grasping in dual-arm dexterous teleoperation. To address these challenges, a dual-arm dexterous teleoperation system (DexTele) is proposed based on motion retargeting and adaptive force control. First, a vision-based motion retargeting module i","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8950,"title":"GraspIT: A Dataset Bridging the Sim-to-Real gap and back for Validated Grasping SE(3) Pose Generation","url":"https://arxiv.org/abs/2607.05869","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05869v1 Announce Type: new \nAbstract: Robust robotic grasping of novel objects requires datasets that simultaneously provide photorealistic RGB-D observations, physically validated grasp quality annotations, and a principled bridge between simulation and the real world, which existing datasets lack to provide jointly. \\textbf{GraspIT} addresses this gap: tabletop scenes in NVIDIA Isaac Sim are annotated via a four-stage physical slip-test on parallel Franka Panda instances, producing trajectory-reachability checks and continuous quality scores beyond force-closure.Of ${\\sim}$2.3M ca","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8949,"title":"FORGE: Towards Functional Tool-Use Generalization via Keypoint Trajectory Reasoning","url":"https://arxiv.org/abs/2607.05780","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05780v1 Announce Type: new \nAbstract: While humans readily repurpose a book, a stone, or a shoe to drive a nail, robots trained on specific tools fail to transfer the same function to novel ones -- a gap we formalize as functional generalization. Such tools share a common functional intent that is visually recognizable, yet this perceptual similarity does not carry over to action space, where each tool demands an entirely different motor pattern. To bridge this gap, we explore intermediate representations including affordance images, human video prompts, and 2D keypoint trajectories","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8948,"title":"Co-STAR: Cognitive Stimulation Therapy by an Autonomous Robot for Dementia -- A One-Week In-Home Study","url":"https://arxiv.org/abs/2607.05709","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05709v1 Announce Type: new \nAbstract: Cognitive therapies have been shown to enhance the quality of life and well-being of people living with dementia (PwDs). However, their use remains limited due to a shortage of trained professionals and the significant time and training required of informal caregivers. To address this gap, we developed and deployed a social robot capable of autonomously delivering cognitive stimulation therapy (CST) in the home. Nine PwDs participated in a one-week ($7$ days) study that involved daily robot-led sessions. Participants engaged positively with the","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8947,"title":"Efficient Transfer Learning of Robot Dynamic Models Using Morphological Similarity","url":"https://arxiv.org/abs/2607.05665","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05665v1 Announce Type: new \nAbstract: This study proposes a neural network-based transfer learning framework for modeling the dynamics of soft, fin-actuated underwater robots. We focus on morphologically similar robots that differ in scale and hydrodynamic properties. A model trained on data from a larger robot (source domain) is adapted to a smaller one (target domain) with limited labeled data. To enable label-efficient transfer, we develop an autoencoder-based domain adaptation approach that learns a shared latent representation aligning the dynamics of both robots. Experiments o","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8946,"title":"Dynamic Evaluation of Classical and Control-Aware Optimal Trajectory Planning in Robot Manipulators","url":"https://arxiv.org/abs/2607.05544","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05544v1 Announce Type: new \nAbstract: Trajectory planning strongly influences tracking accuracy, actuator demand, and overall execution behavior in robotic manipulators. Classical planners such as cubic, quintic, and trapezoidal profiles are widely used for their simplicity and smoothness, yet they remain purely kinematic and ignore system dynamics and control effort during trajectory generation. As a result, nominally smooth trajectories can lead to inefficient nonlinear execution and increased corrective control action. This paper presents a control-aware optimal trajectory planni","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8945,"title":"GEM-Occ: From Visual Geometry Evidence to Embodied Semantic Occupancy Memory","url":"https://arxiv.org/abs/2607.05543","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05543v1 Announce Type: new \nAbstract: Semantic occupancy provides a structured spatial memory for embodied indoor agents by jointly representing occupied regions, observed free space, unknown areas, and object semantics. However, existing indoor occupancy benchmarks and methods mainly focus on single-view prediction or room-level online perception, leaving long-horizon semantic mapping across connected indoor spaces underexplored. We introduce HIOcc, a hierarchical indoor occupancy benchmark that unifies ScanNet, ScanNet++, and Matterport3D under a common sparse semantic occupancy f","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8944,"title":"Learning 4D Geometric Priors for Inference-Efficient World Action Models","url":"https://arxiv.org/abs/2607.05468","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05468v1 Announce Type: new \nAbstract: World Action Models (WAMs) have shown strong potential for robotic manipulation by jointly modeling visual future dynamics and executable action sequences. However, existing video-action co-training methods primarily optimize appearance-oriented video latents, which may insufficiently capture the temporally evolving geometry required for precise manipulation. We propose MECo-WAM, a Multi-Expert Co-Training World Action Model that injects action-relevant 4D geometric priors into video-action representations while preserving the original lightweig","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8959,"title":"Robotaxi只是开胃菜，FSD与AI驱动的Optimus才是特斯拉的真正核弹 - 汽车之家","url":"https://news.google.com/rss/articles/CBMiW0FVX3lxTE5ka0RLZWhNZEVkdFctclJSM3NEbnZZYzkxcENlcVVLaUxUT2k2TzZSeHloV3RicC1mYXl3RlVsenhGME5RZ1ZqU0hpTngwbGFJbC1ORUFMeVBmV0U?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiW0FVX3lxTE5ka0RLZWhNZEVkdFctclJSM3NEbnZZYzkxcENlcVVLaUxUT2k2TzZSeHloV3RicC1mYXl3RlVsenhGME5RZ1ZqU0hpTngwbGFJbC1ORUFMeVBmV0U?oc=5\" target=\"_blank\"\u003eRobotaxi只是开胃菜，FSD与AI驱动的Optimus才是特斯拉的真正核弹\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e汽车之家\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-08T02:07:16"},{"id":8960,"title":"前Tesla Optimus开发者在巴黎创立UMA，接洽约50家潜在客户 - 디지털투데이","url":"https://news.google.com/rss/articles/CBMiygFBVV95cUxNYVJsVGpnREl3aDQtaWp4LW0yWlFtbWEzZWRJN2pNX0k3RnpEdWkwTENnRXQwSjFtZ1BKTjY2WXpXRGhIWkUzSVVRUFFxRjAzUE96OUNtTEpjYi16dzl6cDdKdFM2VUF0ZjNZdGdqeldhaUg2RUtMMDM0VGxXeC1HUndlc1pFT3BwNTBfZjVLQ00xdFN6bktIOGdma3NvS2hfMzJMT0U3NVZfOVVaTXNROVRXUWx4Qm81QWJ3VFQ2THZ5dVNKZlpxMUR3?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiygFBVV95cUxNYVJsVGpnREl3aDQtaWp4LW0yWlFtbWEzZWRJN2pNX0k3RnpEdWkwTENnRXQwSjFtZ1BKTjY2WXpXRGhIWkUzSVVRUFFxRjAzUE96OUNtTEpjYi16dzl6cDdKdFM2VUF0ZjNZdGdqeldhaUg2RUtMMDM0VGxXeC1HUndlc1pFT3BwNTBfZjVLQ00xdFN6bktIOGdma3NvS2hfMzJMT0U3NVZfOVVaTXNROVRXUWx4Qm81QWJ3VFQ2THZ5dVNKZlpxMUR3?oc=5\" target=\"_blank\"\u003e前Tesla Optimus开发者在巴黎创立UMA，接洽约50家潜在客户\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e디지털투데이\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-08T01:43:49"},{"id":9064,"title":"特斯拉Optimus机器人永久解放家务时间 - 新浪网","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTE9TOFZPNFZnY2F // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
