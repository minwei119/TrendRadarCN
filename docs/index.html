5-a6a9-4def-944b-afd6bb62d1bb.jpg?x-bce-process=image/watermark,text_QUnnlJ_miJA,type_RlpMYW5UaW5nSGVpU0JHQg==,size_28,color_ffffffdd,skw_1,skc_00000051,g_7,blr_50,bls_50,x_11,y_11/format,f_auto\" w=\"1440\" h=\"1440\"  data-ai=\"2\" data-weibo=\"0\" data-vmark=\"2ead\"\u003e\u003c/p\u003e\u003cp data-vmark=\"3ebc\"\u003e很多时候，就连业内人士也很难记清所有黑客组织的名称。部分原因在于，不同公司采用了不同的命名方式。因此，才会出现一些资料库，试图","tags":[],"cluster_size":1,"ts":"2026-08-08T22:59:50"},{"id":18305,"title":"OpenAI 收购 AI 演示文稿初创公司 NextSlide","url":"https://www.ithome.com/0/987/455.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"40a7\"\u003eIT之家 8 月 9 日消息，NextSlide 近日宣布加入 OpenAI，其团队成员现已投身于 ChatGPT 的开发工作。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"1798\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/256b6d04-6772-4770-bc43-539d5c669d08.png?x-bce-process=image/format,f_auto\" w=\"715\" h=\"286\" data-weibo=\"0\" data-vmark=\"b7f9\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"93e5\"\u003eNextSlide 官网目前展示了一份由创始人 Ahmed Beshry 发布的说明。Beshry 在其中介绍称，NextSlide 的产品可以“将提示词、笔记、文档或研究资料转化为精美且可编辑的演示文稿”。\u003c/p\u003e\u003cp data-vmark=\"6d38\"\u003eBeshry 表示，公司的最终目标是“让视觉化沟通变得更加普及，让更多人能够清晰地表达自己的想法”。加入 OpenAI 后，NextSlide 团队将“继续追求同样的使命：打造能够帮助人们创作、沟通，并将想法转化为有","tags":[],"cluster_size":1,"ts":"2026-08-08T22:54:22"},{"id":18307,"title":"X 平台将于 9 月 8 日推出全新“原创内容奖励计划”，要求至少拥有 500 名经过认证的粉丝才可参与","url":"https://www.ithome.com/0/987/451.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"a2bf\"\u003eIT之家 8 月 9 日消息，SpaceX AI 旗下负责创作者产品的高级产品经理 Allegra Jacchia 在 X 平台发文，宣布 X 平台将于 9 月 8 日推出全新的“原创内容奖励计划”（Original Content Rewards）。\u003c/p\u003e\u003cp data-vmark=\"9c15\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/76dcdfe2-cd51-401c-8d82-aea690b22f32.png\" w=\"868\" h=\"872\" data-weibo=\"0\" class=\"not-source\" data-vmark=\"21df\"\u003e\u003c/p\u003e\u003cp data-vmark=\"8eb5\"\u003e根据新计划，创作者需要满足一定条 .com/0/987/438.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"9baf\"\u003eIT之家 8 月 8 日消息，Cloudflare 在 2026 年第二季度财报电话会议上披露，AI 机器人等来源的非人类流量已于 2026 年 5 月正式超过人类流量，比 CEO 马修 · 普林斯（Matthew Prince）此前预测的 2027 年底大幅提前。\u003c/p\u003e\u003cp data-vmark=\"95de\"\u003eCloudflare 进一步预测，若当前趋势延续，五年后非人类流量将达到人类流量的 1000 倍。马修 · 普林斯表示，届时人类在互联网上的存在将变得微不足道。\u003c/p\u003e\u003cp data-vmark=\"b295\"\u003e“换句话说，人类将成为互联网上四舍五入的误差，不是因为人类流量在下降，而是因为非人类流量的增长速度实在太快。”\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"f971\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/d5077ae4-43d7-45a9-a457-d588110de791.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"504\" data-weibo=\"0\" data-vmark=\"ca78\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp","tags":[],"cluster_size":1,"ts":"2026-08-08T13:38:40"},{"id":18321,"title":"尘封26年落选名单被扒，里面竟藏着Anthropic CEO！ - 新浪财经","url":"https://news.google.com/rss/articles/CBMifEFVX3lxTE9yYW83QXdWRkZwM0hGczl3cUF5RDAzWTVpRUV0cXVKUFp1OExkR1dNdzRDX3luRWJxNnpRbEhOeXRVSTZqUWNhVjh2RXppeXFCblJNZC1OOWdnc3lMR1kyX0poZEctLXg3SElRZG9RY213Yk9zRlJaYm5KajA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMifEFVX3lxTE9yYW83QXdWRkZwM0hGczl3cUF5RDAzWTVpRUV0cXVKUFp1OExkR1dNdzRDX3luRWJxNnpRbEhOeXRVSTZqUWNhVjh2RXppeXFCblJNZC1OOWdnc3lMR1kyX0poZEctLXg3SElRZG9RY213Yk9zRlJaYm5KajA?oc=5\" target=\"_blank\"\u003e尘封26年落选名单被扒，里面竟藏着Anthropic CEO！\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-08T13:15:00"},{"id":18322,"title":"拯救悲剧股神后又当新娘！Anthropic幕僚长自述：在AI前沿寻找上帝 - sohu.com","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQMWtRdEg2RTk5QzFPQ3BYdVR4MGVaWEJaLTRWSWpxT1luS3cza0VYbUI5UzRwX3d0S1l5LWV5NllOR3A4MHNHREd3a19DTzYzTnQwOUZ0VmgzSy1nV1dTV1k1dFhlOGpnV1V6dUZ3a1BhQUtWQ1MweG9LYmFEYWlUMTAtRzNHb3hJ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca M1I5bWtPczR4Rl95RUVZV25ta29NT1BZdWZ0SEg?oc=5\" target=\"_blank\"\u003eHumanoid robots fuel growth of related industries\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ePeople's Daily Online\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-06T05:12:00"},{"id":17978,"title":"Mimir: A Neuro-Symbolic Memory System with Dynamic Grounding for Embodied Agents in Interactive Environments","url":"https://arxiv.org/abs/2608.04933","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04933v1 Announce Type: new \nAbstract: Long-horizon embodied task requires agents to act under partial observability while preserving both scene belief and execution progress. Flat histories or implicit policy states may contain past observations, but they do not provide an explicit interface for deciding which world facts support the currently active goal. We introduce Mimir, a neuro-symbolic memory that separates world memory from task memory and dynamically grounds them before each action. World memory maintains object locations, object states, and perceptual evidence, while task","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17977,"title":"RORA: Realistic Object Reconstruction with Articulation","url":"https://arxiv.org/abs/2608.04842","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04842v1 Announce Type: new \nAbstract: Replicating real-world environments into simulation by realistic visual representation like NeRF and 3D Gaussian Splatting (3DGS) has emerged as an effective strategy to reduce the sim-to-real gap in robot learning. However, implementing object articulation during the real-to-sim process is still a challenging task. Existing motion tracking or learning based articulation methods shows low success rates on complex kinematic structures having multiple joints. Furthermore, those methods require scan of dynamic motion of objects, which makes reconst","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17976,"title":"From Transparent Labware Segmentation to Collision Avoidance: A Real-Time Edge-Aware Perception Pipeline","url":"https://arxiv.org/abs/2608.04769","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04769v1 Announce Type: new \nAbstract: This paper presents an edge-aware instance segmentation framework that enables real-time robotic collision avoidance with transparent laboratory glassware using purely visual perception. Transparent vessels defy conventional segmentation due to refraction, specular reflection, and the absence of stable interior texture, yet their boundary contours remain comparatively reliable visual cues. Exploiting this observation, we augment a one-stage real-time instance segmentation backbone with a lightweight edge-detection branch, edge-guided attention f","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17975,"title":"Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.04765","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04765v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models provide a unified paradigm for connecting visual perception, language understanding, and robotic control. However, existing VLA models still face major challenges in long-horizon tasks: sparse expert demonstrations constrain cross-task compositional generalization; the non-Markovian nature of long-horizon tasks makes it difficult for policies conditioned only on current observations to maintain temporal consistency; limited closed-loop error correction allows execution errors to accumulate; and end-to-end acti","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17974,"title":"Enabling Urgency-aware Robot Swarm Intralogistics using Smart IoT Tags","url":"https://arxiv.org/abs/2608.04721","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04721v1 Announce Type: new \nAbstract: Warehouse items differ in how urgently they must be moved: perishable goods, pharmaceutical shipments, and just-in-time production materials must be delivered sooner than the rest of the stock. Decentralised robot swarms suit warehouses that cannot justify fixed automation infrastructure, but current swarm controllers treat all items alike or rely on an external scheduler to set priorities, so urgent items wait as long as ordinary ones. This paper presents a swarm logistics system in which each warehouse carrier holds an ultra-low-power Internet","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17973,"title":"Suppression Sticks, Locality Is Fragile: A Closed-Loop Target-and-Control Audit of Task-Vector Negation in VLA Policies","url":"https://arxiv.org/abs/2608.04692","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04692v1 Announce Type: new \nAbstract: Task-vector arithmetic offers a closed-form way to modify a model, yet its behavioral locality remains unclear in closed-loop robot control. We present a target-and-control audit of per-skill task-vector subtraction from multitask vision-language-action (VLA) policies. Across all ten LIBERO-Goal skills, subtraction produces three qualitatively different regimes: target-control separation for five skills, resistance for three, and global collapse for two. On held-out initial states, the five suppressible targets remain at 0% success; however, mea","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17972,"title":"Mind-VLA: Instruction-Aware Spatial Representation Alignment for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.04633","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04633v1 Announce Type: new \nAbstract: Recent Vision-Language-Action (VLA) methods improve generalization by aligning their representations with 3D scene geometry. However, these methods are fundamentally instruction-agnostic: the representations align the entire scene uniformly, neglecting the 3D geometry of the specific target object designated by the language instruction. This causes failures on fine-grained manipulation and target occlusion tasks, where success depends on accurate 3D understanding of the target object rather than the entire scene. To address this, we present Mind","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17971,"title":"Static Timing Orchestration for Tree-Structured Robot Control Firmware","url":"https://arxiv.org/abs/2608.04600","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04600v1 Announce Type: new \nAbstract: As robotic systems become increasingly complex, generating control firmware from structural description files has emerged as a promising paradigm for reducing development complexity and improving maintainability. Existing robot description formats naturally represent robotic systems as hierarchical tree structures, where devices are recursively composed into functional subsystems and eventually into the complete robot. However, such tree-structured organization also introduces structured data dependencies that affect perception-to-decision laten","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17970,"title":"Retrieve in Time, Correct in Frequency","url":"https://arxiv.org/abs/2608.04527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04527v1 Announce Type: new \nAbstract: Frozen vision-language-action (VLA) policies generate temporally extended action chunks, but long-horizon manipulation remains vulnerable to accumulated execution error and visual aliasing across task stages. Successful rollouts provide useful corrective evidence, yet current frame retrieval can return progress-misaligned actions,while direct replay or time-domain fusion can overwrite the reactive structure of the policy proposal. We introduce Retrieve in Time, Correct in Frequency (RTCF), a training-free source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04420v1 Announce Type: new \nAbstract: Safe navigation with a body-mounted limited-field-of-view sensor requires the complete robot-inflated volume of an intended motion to be observed and verified free before execution. We formulate this requirement as online safety-volume certification in an unknown voxel map and construct a certified graph whose vertices correspond exactly to positions with fully known-free safety volumes. Based on this representation, we propose SCOPE (Safety Certification through Observation Planning and Execution), a planning framework that decouples optimistic","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17966,"title":"Approximate Multi-Objective Search Under Rulebooks","url":"https://arxiv.org/abs/2608.04398","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04398v1 Announce Type: new \nAbstract: Robotic planning often involves multiple objectives with complex priority relationships, such as safety, efficiency, and regulatory compliance. Rulebooks formalize these relationships, allowing partial ordering of objectives that generalizes both Pareto and lexicographic dominance. Computing the full set of rulebook-optimal solutions, however, is computationally expensive. To address this challenge, we introduce the concept of epsilon-rule-dominance, a principled notion of approximate dominance under rulebooks, and propose RA*pex, a best-first s","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
