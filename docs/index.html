易时段后），透过场外大宗交易方式向若干买方出售合共272,947,700股本公司B类股份，该等买方为若干独立第三方且与本公司及其关连人士并无关连。出售事项完成后，腾讯持股比例将由约15.68%下降至9.37%，并不再为本公司主要股东。腾讯表示，其对本集团长远发展前景拥有信心，双方亦会继续维持共赢关系，包括延续双方的战略合作。本公司预期出售事项将不会对本集团营运产生任何重大不利影响。","tags":[],"cluster_size":1,"ts":"2026-07-06T23:05:19"},{"id":8424,"title":"资本市场“应退尽退”生态日趋成熟，年内22家公司已摘牌或锁定退市","url":"https://wallstreetcn.com/livenews/3129599","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月6日，上海创兴资源开发股份有限公司摘牌退市。至此，今年以来，已有16家公司摘牌退市，退市类型覆盖财务类退市、重大违法强制退市、交易类退市、主动退市等情形。梳理上市公司公告发现，还有6家公司已锁定退市。其中，5家A股公司触及财务类退市指标，将于7月份集中摘牌退市；B股公司瓦房店轴承股份有限公司私有化退市正在流程中。综合来看，年内已摘牌退市和锁定退市公司的数量达到22家。此外，还有多家公司因涉嫌严重财务造假、未按期披露定期报告等原因面临退市风险。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-07-06T22:56:51"},{"id":8425,"title":"三星电子将于7月30日发布二季度业绩报告（最终数据）。","url":"https://wallstreetcn.com/livenews/3129598","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"三星电子将于7月30日发布二季度业绩报告（最终数据）。","tags":[],"cluster_size":1,"ts":"2026-07-06T22:55:04"},{"id":8426,"title":"中报预增公司占比走高，新兴产业助力业绩增长","url":"https://wallstreetcn.com/livenews/3129596","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至7月6日17时，A股共有72家上市公司对外披露2026年半年度业绩预告，64家预增，预增比例约为88.89%。已披露业绩预告的上市公司整体保持了较好的盈利能力。从发布业绩预告的上市公司所属行业看，生物医药、化工、半导体等行业上市公司大幅预增数量较多。部分公司在业绩预告中表示，通过AI赋能业务转型，提升了运营效率，带动业绩提升。不少上市公司发布业绩预告后，获机构密集调研。机构普遍对上市公司业绩未来的增长点、下半年业绩展望等内容较为关注。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-06T22:43:11"},{"id":8427,"title":"低估值遇上高分红，银行板块估值修复窗口正在打开","url":"https://wallstreetcn.com/livenews/3129592","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，A股银行板块维持“低估值、高分红”特征，截至7月6日收盘，申万银行指数跌超9%，42家上市银行全部“破净”，仅9家银行股价上涨。与二级市场走势形成反差的是，银行股分红保持稳健，多家上市银行的动态股息率超过5%。这引发了市场对于银行股配置价值的讨论。业内人士认为，低利率环境下，银行股类固收属性凸显，板块估值修复窗口正在打开。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-06T22:35:14"},{"id":8428,"title":"新版交易规则施行首日，ST板块表现分化","url":"https://wallstreetcn.com/livenews/3129587","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月6日，沪深北交易所新版交易规则正式施行。其中，最受市场关注的变化之一，是沪深市主板风险警示股票（ST、*ST）涨跌幅限制从5%放宽至10%，与主板其他股票实现统一。新规实施首日，ST板块（包括ST、*ST股）表现分化。截至当日收盘，东财编制的ST板块指数收跌1.31%，ST星农、ST海王、ST瑞茂等个股收获10%涨停。记者注意到，新规落地前，ST板块已经历了一轮“先抑后扬”的走势：板块指数自4月底持续回调，6月29日触及近一年新低，随后开启反弹，最近5个交易日累计涨幅超过5%。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-06T22:23:36"},{"id":8429,"title":"A股市场重要股东减持渠道“一降两升”","url":"https://wallstreetcn.com/livenews/3129586","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"基于最新统计分析发现，A股市场重要股东减持渠道呈现“一降两升”态势：曾经作为主要退出路径的协议转让交易规模大幅萎缩，而市场化与透明度更佳的大宗交易和询价转让渠道快速崛起。据统计，截至2026年6月30日，A股市场年内重要股东累计减持金额为4894.47亿元。与上年同期相比：协议转让交易规模占比由51.56%降至24.45%；大宗交易占比由17.79%升至20.63%，同比增长51.35%；询价转让占比由5%升至11.83%，同比增长209%。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-06T22:14:00"},{"id":8430,"title":"Shareholder Tencent Holdings Sold 272.95M Kuaishou Shares to Independent Third Parties - Moomoo","url":"https://news.google.com/rss/articles/CBMiuwFBVV95cUxQWlZFaklGWDQySWdtcXZjd1BoQTZSTldRckdORG91UXRfREU5b200djgzeGt0WFJCUGZSTjcxRFNuMkpqUTlsQXJ2S01qQnR1SFBnYm1PY3Z0ZlJZY3BOd2EyRzRVUGQ0TEJUOHM5TmM5Q0I5U3B6TGowNzA4cThLS0ktdUVuVFVibm5tcTN6blJBckpBMmtpcThFeV9EdlBsc2stX3RmT2ZWdzZPQnFiSnJMaEFOSVc3OTQ0?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiuwFBVV95cUxQWlZFaklGWDQySWdtcXZjd1BoQTZSTldRckdORG91UXRfREU5b200djgzeGt0WFJCUGZSTjcxRFNuMkpqUTlsQXJ2S01qQnR1SFBnYm1PY3Z0ZlJZY3BOd2EyRzRVUGQ0TEJUOHM5TmM5Q0I5U3B6TGowNzA4cThLS0ktdUVuVFVibm5tcTN6blJBckpBMmtpcThFeV9EdlBsc2stX3RmT2ZWdzZPQnFiSnJMaEFOSVc3OTQ0?oc=5\" target=\"_blank\"\u003eShareholder Tencent Holdings Sold 272.95M Kuaishou Shares to Independent Third Parties\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-06T21:59:00"},{"id":8431,"title":"Tencent Hunyuan发布Hy3正式版：改用Apache 2.0许可证 - 디지털투데이","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxQQVMxN1kxcm5uVFBhaFVYamJCZGtoVGR1ckFHY2lqSzYtcUNyQWNleU1tV3diZjNMSVRVczFKTktiZjhVb2haNWw5X0toMTM0WEdzblZoNWFWTjZYc1picFR2QVV4Nm5IVFVkVy11M2hMN2 尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"恒生指数主连夜盘收涨0.11%，报23571点。\n\n恒生科技指数主连夜盘收跌0.37%，报4520点。","tags":[],"cluster_size":1,"ts":"2026-07-06T19:00:26"}]},{"key":"ai-cn","name":"AI 前沿 (中文)","description":"国内 AI 媒体 (机器之心 / 36氪 / 量子位 / 极客公园 / 智东西 / 新智元) + AI 关键词大盘。","color":"#0891b2","tags":["大模型","AI芯片","Agent","商业","融资","公司","监管","研究"],"articles":[{"id":8582,"title":"英特尔为追赶台积电三星被曝拟推 14A“魔改”工艺 14A2，引入“双面供电”技术应对 21nm M0 互连挑战","url":"https://www.ithome.com/0/973/348.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"7c48\"\u003eIT之家 7 月 7 日消息，Wccftech 及韩国媒体 ETNews 昨日报道称，英特尔正在评估为下一代 14A 工艺推出特殊的“魔改”工艺 14A2 并进行架构调整。\u003c/p\u003e\u003cp data-vmark=\"9492\"\u003e英特尔正考虑在原定背部供电（BSPDN，Backside Power Delivery）的基础上，同时保留部分前部供电，形成前后双侧供电（Dual Side）方案，以应对更先进制程下互连尺寸进一步缩小带来的技术挑战。\u003c/p\u003e\u003cp data-vmark=\"56aa\"\u003e报道称，英特尔原计划在 14A 工艺中采用名为 PowerDirect 的背部供电技术，将供电网络转移至晶圆背面，为晶体管所在的正面释放更多布线空间，从而提升晶体管密度、降低电压损耗，并改善芯片性能。\u003c/p\u003e\u003cp data-vmark=\"a4be\"\u003e在作为半节点升级版本的 14A2 工艺上，英特尔计划进一步缩小最低金属互连层（M0）间距，从 14A 的约 28nm 压缩至约 21nm，以提升晶体管密度，并提高 High-NA EUV 光刻设备的经济性。\u003c/p\u003e\u003cp data-vmark=\"9857\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/","tags":[],"cluster_size":1,"ts":"2026-07-07T01:25:19"},{"id":8583,"title":"全省首个市级政务专属大模型在武威上线 - 新浪财经","url":"https://news.google.com/rss/articles/CBMirwFBVV95cUxPSzRfNTZRd0o3Y0JYMi1qbzlOcVNLeDVMRnFlRzFYRkRtVVRoNUFZeHpqQkJIY2M2WmN5cktPc1g5U2ZSdXVHV21Xb3A5LWhUNTFkN3ZvTUN1eXR4OGdKMEQ2ME4yU3pPTmk5WlY4LUx5dHVMMlNkZndjRnkwRlhIWTljSFJTa3AxNDE0UDNZdC1oYVN6LXZjejN6d3dYMlJ6UDdueFV1RWR0UXQ4akVF?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMirwFBVV95cUxPSzRfNTZRd0o3Y0JYMi1qbzlOcVNLeDVMRnFlRzFYRkRtVVRoNUFZeHpqQkJIY2M2WmN5cktPc1g5U2ZSdXVHV21Xb3A5LWhUNTFkN3ZvTUN1eXR4OGdKMEQ2ME4yU3pPTmk5WlY4LUx5dHVMMlNkZndjRnkwRlhIWTljSFJTa3AxNDE0UDNZdC1oYVN6LXZjejN6d3dYMlJ6UDdueFV1RWR0UXQ4akVF?oc=5\" target 企业 TeraWulf 美国当地时间 7 月 6 日宣布，\u003cstrong\u003e已同明星人工智能初创企业 Anthropic 签署一项为期 20 年的租赁协议\u003c/strong\u003e，预计这笔交易将为 TeraWulf 创造 190 亿美元（IT之家注：现汇率约合 1292.34 亿元人民币）的全周期收入。\u003c/p\u003e\u003cp data-vmark=\"2569\"\u003eTeraWulf 将在美国肯塔基州 Hawesville 的 Justified Data 站点为 Anthropic 建设一个专门 AI 数据中心园区。该园区\u003cstrong\u003e可容纳约 401MW 的关键 IT 负载\u003c/strong\u003e，将分阶段开发，预计 2027H2 初步投用、2028 年初达到最大装机容量。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"c249\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/c16a82ab-cbe5-4e3e-9ad7-d7607de8b46c.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"768\" data-weibo=\"0\" data-vmark=\"","tags":[],"cluster_size":1,"ts":"2026-07-07T01:15:11"},{"id":8587,"title":"国内量产装车首款，比亚迪半导体 BMS AFE 芯片出货破亿颗","url":"https://www.ithome.com/0/973/345.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4be7\"\u003eIT之家 7 月 7 日消息，@小迪快报 微博今天（7 日）发文宣布，比亚迪半导体 BMS AFE 芯片出货量突破 1 亿颗！2021 年，比亚迪 BF8915A-1 诞生，该芯片也是\u003cstrong\u003e国内首款量产装车的车规级 BMS AFE\u003c/strong\u003e（电池管理模拟前端）\u003cstrong\u003e芯片\u003c/strong\u003e。随后，该系列芯片取得国产车规级 BMS AFE 芯片出货量、装车量双第一，累计出货量突破 1 亿颗。\u003c/p\u003e\u003cp data-vmark=\"db69\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/4bc751a7-e01c-46e6-945d-6a65cd8051a4.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"613\" data-weibo=\"0\" data-vmark=\"768c\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"e0ec\"\u003eIT之家查询比亚迪半导体官网获悉，BF891X 系列（含 BF8915A-1、BF8915B-1、BF8916A 等型号，涵盖 16 和 18 通道两种规格）自 2021 年量产以来","tags":[],"cluster_size":1,"ts":"2026-07-07T01:14:02"},{"id":8588,"title":"苹果 iOS 27 新增提示：AI 生图等任务会发送数据给谷歌云","url":"https://www.ithome.com/0/973/344.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"b1c0\"\u003eIT之家 7 月 7 日消息，科技媒体 9to5Mac 今天（7 月 7 日）发布博文，报道称在 iOS 27 最新 Beta 3 开发者预览版，以及部分 iOS \u003cspan class=\"link-text-start-with-http\"\u003e26.x\u003c/span\u003e 系统上，\u003cstrong\u003e用户在 iWork 等应用中使用图形生成等功能，会跳出弹窗，告知用户相关数据会发送到谷歌云（Google Cloud）上。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"b095\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/bc29ee10-e9cc-4b66-911d-b1209a9b223c.jpg\" w=\"1440\" h=\"720\" data-weibo=\"0\" data-vmark=\"7763\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"158a\"\u003e根据该媒体报道，用户在 Pages 文稿、Numbers 表格、Keynote 讲演等 iWork 生产力套件，以及更新 Apple 创作坊（Apple Creator Studio）后，用户在使用过程中可能会遇到弹窗通知，告知其相关数","tags":[],"cluster_size":1,"ts":"2026-07-07T01:11:11"},{"id":8590,"title":"前华为“天才少年”李博杰公开吐槽DeepSeek面试 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNRG9lUVlrVFpmaFgzUFJ4bjJ4cGJDaU5TYjlna00zV094UUtaSzlnLXFkdmR1Y2VCbklpTTB1U1NQV0FxZXVNQ2NISjNaaHZPeThGX0RsTTZsUzg1U3BaY0kxZUg4dFpnQ3BkUE9IcXAxNWV2bXJpQkNXaVpld3ZYTjNnci05OUF6?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNRG9lUVlrVFpmaFgzUFJ4bjJ4cGJDaU5TYjlna00zV094UUtaSzlnLXFkdmR1Y2VCbklpTTB1U1NQV0FxZXVNQ2NISjNaaHZPeThGX0RsTTZsUzg1U3BaY0kxZUg4dFpnQ3BkUE9IcXAxNWV2bXJpQkNXaVpld3ZYTjNnci05OUF6?oc=5\" target=\"_blank\"\u003e前华为“天才少年”李博杰公开吐槽DeepSeek面试\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-07T01:08:54"},{"id":8589,"title":"前华为“天才少年”李博杰公开吐槽 DeepSeek 面试：流程拖沓、被面试官质疑抄代码","url":"https://www.ithome.com/0/973/343.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"82e7\"\u003eIT之家 7 月 7 日消息，前华为“天才少年”李博杰 7 月 6 日在社交平台公开吐槽 DeepSeek 的面试流程，\u003cstrong\u003e提及流程较慢且繁琐，面试官存在态度问题\u003c/strong\u003e，质疑他抄袭，他感到“被严重冒犯”。\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"64f7\"\u003e吐槽下 DeepSeek 的面试流程\u003c/p\u003e\u003cp data-vmark=\"7598\"\u003e首先，笔试通过后半个月不安排面试，其他公司 offer 都已经下来了，经过反复催促才安排面试。我去其他公司面试都不需要代码面，但 DeepSeek 仍然需要笔试，前两轮面试都是代码面试。在二面过程中，面试官迟到不说，评价我的工作时态度轻佻，认为我介绍的问题都是研究问题，对我介绍的问题毫无感知，总是在让我讲有什么工程挑战。代码面试中我有两个屏幕，面试官说我不断在瞟左边的屏幕，说我在抄代码，让我停止抄代码，并说如果我不能证明我没有在抄代码，面试就无法继续下去了。我已经解释了我有两个屏幕，面试官仍然坚信我在抄代码，并用终止面试来威胁我。我感到被严重冒犯，立即决定终止面试。从面试官的表现来看，跟我想象中的 DeepSeek 完全不同。我已经决定终止 DeepSeek 面试流程，并在社交网络上予以曝光。请周知，欢迎转发。\u003c/p\u003e\u003c/blockquote\u003e\u003cp data-","tags":[],"cluster_size":1,"ts":"2026-07-07T01:08:54"},{"id":8591,"title":"用AI“复刻”人类细胞、预判药效，「华源智因」获千万级人民币种子轮融资｜36氪首发 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1RQUxPMzRvWllKNnVVVlNfQkNIbGtSMlhIOWpRbnk4VFY4OG5QOGFlT05kQldiSmtKNUtpb1JqVDZGQWdmZS1OYjJDT3RacmZh?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1RQUxPMzRvWllKNnVVVlNfQkNIbGtSMlhIOWpRbnk4VFY4OG5QOGFlT05kQldiSmtKNUtpb1JqVDZGQWdmZS1OYjJDT3RacmZh?oc=5\" target=\"_blank\"\u003e用AI“复刻”人类细胞、预判药效，「华源智因」获千万级人民币种子轮融资｜36氪首发\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-07T01:08:15"},{"id":8592,"title":"国产算力利用率突破65% AIGCode L3级大模型的全栈突围- AI - 亿邦动力网","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTFBjTGswU1Y1SWpuTnhGcHdJaDU3cWZpeUZRYnM5VE9mRzE4OWhWSDRLcjJfYVpVd1UtV0gzTFViZ1drS05RWTRxWFpoX2lZMnZYOENfZTVB?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTFBjTGswU1Y1SWpuTnhGcHdJaDU3cWZpeUZRYnM5VE9mRzE4OWhWSDRLcjJfYVpVd1UtV0gzTFViZ1drS05RWTRxWFpoX2lZMnZYOENfZTVB?oc=5\" target=\"_blank\"\u003e国产算力利用率突破65% AIGCode L3级大模型的全栈突围- AI\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e亿邦动力网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-07T01:05:37"},{"id":8593,"title":"最“单薄”Mac 芯片系列：消息称苹果 M6 仅规划基础版，跳过 Mac mini 等多数产品线","url":"https://www.ithome.com/0/973/342.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"436e\"\u003eIT之家 7 月 7 日消息，科技媒体 9to5Mac 昨日（7 月 6 日）发布博文，报道称苹果 M6 系列可能成为 Apple Silicon 芯片产品线最“单薄”的系列，\u003cstrong\u003e仅有 M6 标准版一款，且不会扩展覆盖多数 Mac 产品线。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"0171\"\u003e在定位方面，根据彭博社马克 · 古尔曼爆料，\u003ca href=\"https://www.ithome.com/0/968/729.htm\" target=\"_blank\"\u003eM6 系列属于过渡系列\u003c/a\u003e，苹果公司目前将更多的研发重心放在 M7 系列上，因此 M6 系列仅有标准版，后续预估不会推出 M6 Pro 和 M6 Max 两款芯片。\u003c/p\u003e\u003cp data-vmark=\"7b5b\"\u003e性能方面，M6 标准版采用 12 核 GPU（M5 标准版为 10 核）设计，预估在人工智能、图形等任务时具备更强表现，内存带宽将提高到 200GB/s（M5 标准版为 153 GB/s）。\u003c/p\u003e\u003cp data-vmark=\"b235\"\u003e而在产品线方面，搭载 M6 芯片的 Mac 产品较少，预估不会大幅扩展到现有 Mac 产品线中，IT之家援引博文介绍，附上 2 款可能搭载该芯片的产品如下：\u003c/p\u003e\u003cul class=\"medium-size","tags":[],"cluster_size":1,"ts":"2026-07-07T00:58:00"},{"id":8594,"title":"AI资本开支已超“历史纪录”，百亿私募反思繁荣叙事下的估值困局 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE00WDB2ekZtZGJpcXdpVzJXWWVEMVBHLVliV0VXWURrQU5weTZaUmVNcEtieG1DSEJOQVA1aTJYdkYzN24tcDlfbkE5dHpoNDVU?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE00WDB2ekZtZGJpcXdpVzJXWWVEMVBHLVliV0VXWURrQU5weTZaUmVNcEtieG1DSEJOQVA1aTJYdkYzN24tcDlfbkE5dHpoNDVU?oc=5\" target=\"_blank\"\u003eAI资本开支已超“历史纪录”，百亿私募反思繁荣叙事下的估值困局\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-07T00:53:20"},{"id":8595,"title":"AMD 宣布锐龙 AI Halo 开发者平台（395 版）现已发售，定价 3999 美元","url":"https://www.ithome.com/0/973/339.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"cebe\"\u003eIT之家 7 月 7 日消息，AMD 当地时间本月 6 日宣布，\u003cstrong\u003e搭载锐龙 AI Max+ 395 处理器的锐龙 AI Halo 开发者平台现已通过合作伙伴 Micro Center 发售\u003c/strong\u003e，提供预装 Windows 11 Pro 或 Linux 操作系统的变体，售价均为 3999 美元（IT之家注：现汇率约合 27200 元人民币）。\u003c/p\u003e\u003cp data-vmark=\"64a7\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/5/aff14ea0-f36b-4212-b3a4-5859041ad36a.jpg?x-bce-process=image/format,f_auto\" w=\"1200\" h=\"675\" data-weibo=\"0\" data-vmark=\"d806\"\u003e\u003c/p\u003e\u003cp data-vmark=\"2330\"\u003eA I 概念新股热情高涨，推动香港新股融资规模升至五年高位。仅上周二，就有 9 家公司启动招股，其中多家来自科技行业，合计拟募资 60 亿美元。\u003c/p\u003e\u003cp data-vmark=\"302c\"\u003e立讯精密承担 iPhone 和 AirPods 等产品的组装业务，过去一年在深市累计上涨逾 80%，市值达到 710 亿美元（现汇率约合 4829.27","tags":[],"cluster_size":1,"ts":"2026-07-07T00:28:35"},{"id":8602,"title":"即日起，安卓备份数据将占用谷歌账号存储空间","url":"https://www.ithome.com/0/973/330.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp class=\"PDq2pG_selectionAnchorContainer\" data-vmark=\"7810\"\u003eIT之家 7 月 7 日消息，据外媒 Engadget 报道，自 7 月 7 日起，谷歌将调整账号存储空间的计算规则：安卓系统备份中的全部数据都会占用谷歌账号存储空间。\u003c/p\u003e\u003cp class=\"PDq2pG_selectionAnchorContainer\" data-vmark=\"0a70\"\u003e此前，只有\u003cstrong\u003e上传至 Google 相册的媒体文件、彩信中的照片和视频\u003c/strong\u003e会计入容量上限。新用户将立即适配新规，现有用户则会在未来几个月分批收到更新。\u003cspan class=\"PDq2pG_selectionAnchor\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cp data-vmark=\"4c50\"\u003e谷歌发言人回应称，系统备份可以把手机数据保存到谷歌账号，方便恢复数据或设置新设备。政策更新后，所有备份数据都会计入谷歌账号存储空间，\u003cstrong\u003e预计平均仅增加 40MB\u003c/strong\u003e。用户还将获得更清晰的存储信息和新的管理选项，可以自行决定备份哪些数据和应用。\u003c/p\u003e\u003cp data-vmark=\"3ba5\"\u003e新的管理选项将出现在设备备份菜单中。除了选择是否备份各应用数据，用户还可以关闭设备设置、通话记录、短信和彩信的备份。\u003c/p\u003e\u003cp data-vmar","tags":[],"cluster_size":1,"ts":"2026-07-07T00:15:20"},{"id":8603,"title":"15个推理模型集体翻车，详解输出背后的思考链潜藏风险- 产业链 - 光通信Pro","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1qMF8xamJoUE81Zjk5dGdZRkpJeHJqcjZBdXBDTGI0TG1Pc1kwVjFxSEhQWG9aaGcxbkFTMFl0QndCcEVldkdFXzBsYUVhTjFKY0RlNnFB?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1qMF8xamJoUE81Zjk5dGdZRkpJeHJqcjZBdXBDTGI0TG1Pc1kwVjFxSEhQWG9aaGcxbkFTMFl0QndCcEVldkdFXzBsYUVhTjFKY0RlNnFB?oc=5\" target=\"_blank\"\u003e15个推理模型集体翻车，详解输出背后的思考链潜藏风险- 产业链\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e光通信Pro\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-07T00:04:51"},{"id":8604,"title":"填补国内空白：我国建成首套高精度圆度基准装置，圆度测量不确定度从 20nm 降至 6nm","url":"https://www.ithome.com/0/973/328.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"8bfd\"\u003eIT之家 7 月 7 日消息，据央视新闻昨日报道，我国首套高精度圆度基准装置正式建成。\u003c/p\u003e\u003cp data-vmark=\"3c70\"\u003e据介绍，该装置由中国计量科学研究院研制完成，其建成标志着我国在高精度圆度测量领域实现了跨越式发展，整体技术能力跻身国际先进行列。\u003c/p\u003e\u003cp data-vmark=\"a76c\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/140f840d-21c1-44e3-b9fd-6c912f61cb8b.png\" w=\"1440\" h=\"810\" data-weibo=\"0\" data-vmark=\"4797\"\u003e\u003c/p\u003e\u003cp data-vmark=\"37ee\"\u003eIT之家注：圆度是几何量形位公差体系中的核心基础参数之一，其测量精度直接关系到精密主轴、先进光学元件、半导体芯片等高端制造产品的性能表现和装配质量。\u003c/p\u003e\u003cp data-vmark=\"d522\"\u003e长期以来，我国虽已建立平面度等几何量计量基准，但圆度量值始终缺乏国家级溯源源头，成为制约高端装备自主可控和产业高质量发展的“卡脖子”难题之一。\u003c/p\u003e\u003cp data-vmark=\"a0e2\"\u003e此次建成的圆度基准装置填补了这一空白，将为我国航空航","tags":[],"cluster_size":1,"ts":"2026-07-06T23:59:45"},{"id":8605,"title":"苹果迄今最大更新：iOS 27 引入 Core Image RAW 9 图像处理引擎","url":"https://www.ithome.com/0/973/327.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ce95\"\u003eIT之家 7 月 7 日消息，科技媒体 9to5Mac 今天（7 月 7 日）发布博文，报道称在 iOS 27 Beta 3 更新中，\u003cstrong\u003e苹果引入 RAW 9 原始图像处理引擎，并称是“迄今为止最大的更新”。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"75ba\"\u003eIT之家注：RAW 是一种保存相机传感器原始采样数据的图像格式，通常保留比 JPEG 更完整的曝光、色彩和白平衡信息。\u003c/p\u003e\u003cp data-vmark=\"8927\"\u003e摄影师与图像应用可据此在后期阶段调整亮度、色温、色调与阴影细节，常见于专业摄影、移动影像编辑和档案级图像保留场景。\u003c/p\u003e\u003cp data-vmark=\"4d1d\"\u003e在今年全球开发者大会（WWDC26）活动中，负责苹果 Core Image（苹果用于图像处理的系统级框架）的工程师 David Hayward 在演讲中表示：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"ee0c\"\u003e[RAW 9] 显著提升了 RAW 文件的渲染效果，基于分块 CoreML 模型构建，结合去马赛克和降噪，能实现最佳画质。此外，该模型在设备上使用 Apple 神经网络引擎核心运行，从而获得最佳性能。\u003c/p\u003e\u003c/blockquote\u003e\u003cp data-vmark=\"f51e\"\u003e苹果公司通过 Core Ima","tags":[],"cluster_size":1,"ts":"2026-07-06T23:57:38"},{"id":8606,"title":"刚刚！DeepSeek不认华为天才少年 - 新浪网","url":"https://news.google.com/rss/articles/CBMickFVX3lxTE4zUkpfbGNyeWUwU3VnYkoxTklUWUJ0SElUa0tQZGlmZHlxX0dKc2lkcFQwZHNmcTJSd0FVNnRXMmJ3cGZ0cS1YR1JpTkxadGRWOWg3d216TmNZc0YxcWdyZVhNdWJDZ203bi1xUURMNUpCZw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMickFVX3lxTE4zUkpfbGNyeWUwU3VnYkoxTklUWUJ0SElUa0tQZGlmZHlxX0dKc2lkcFQwZHNmcTJSd0FVNnRXMmJ3cGZ0cS1YR1JpTkxadGRWOWg3d216TmNZc0YxcWdyZVhNdWJDZ203bi1xUURMNUpCZw?oc=5\" target=\"_blank\"\u003e刚刚！DeepSeek不认华为天才少年\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-06T23:52:01"},{"id":8607,"title":"别担心被AI抢饭碗了，老板算完账可能发现你更划算 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9Wb294dXZOWVB2RU8tTEFVcV9JTE9wTDlIZTJ0SWlqdnNEb25KUGhzUHlQLUFVWHdnd3BDZGc2b2lHblRNMnI1S3VDOTZ5cFE?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9Wb294dXZOWVB2RU8tTEFVcV9JTE9wTDlIZTJ0SWlqdnNEb25KUGhzUHlQLUFVWHdnd3BDZGc2b2lHblRNMnI1S3VDOTZ5cFE?oc=5\" target=\"_blank\"\u003e别担心被AI抢饭碗了，老板算完账可能发现你更划算\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-06T23:38:09"},{"id":8608,"title":"李在明下令加速推进韩国芯片与 AI 重大项目：速度是唯一重要因素","url":"https://www.ithome.com/0/973/325.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"d01b\"\u003eIT之家 7 月 7 日消息，据路透社报道，当地时间 6 日，韩国总统李在明下令政府加快推进上周公布的芯片和 AI 重大项目。\u003c/p\u003e\u003cp data-vmark=\"03e0\"\u003e李在明警告，项目审批、征地以及电力和供水设施建设如果出现拖延，韩国争夺先进产业全球领先地位的计划可能受到影响。\u003c/p\u003e\u003cp data-vmark=\"8209\"\u003e李在明在政府会议上提出，当前竞争的胜负取决于\u003cstrong\u003e谁行动更快、谁能抢先占据优势\u003c/strong\u003e。“速度是唯一重要的因素。”\u003c/p\u003e\u003cp data-vmark=\"2c2c\"\u003e龙仁产业园区从选址获批到开工用了六年，而这一速度已经算相对较快。\u003c/p\u003e\u003cp data-vmark=\"90c7\"\u003e李在明还要求，政府在条件允许的情况下简化环境评估等审批流程。同时，把原本依次办理的程序改为并行推进，并提前落实电力和供水基础设施。他强调，\u003cstrong\u003e稳定的电力供应是芯片项目能否顺利推进的关键\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"43be\"\u003e李在明表示，可再生能源规模虽然不断扩大，但企业仍担心基荷电力供应不足，政府必须\u003cstrong\u003e提前消除这些顾虑\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"6f90\"\u003e韩国上周公布总额超过 5760 亿美元（IT之家注：现汇率约合 3.91 万亿","tags":[],"cluster_size":1,"ts":"2026-07-06T23:37:51"},{"id":8609,"title":"苹果 iOS / iPadOS 27 Beta 3 更新汇总：增强 Siri AI，优化液态玻璃视觉","url":"https://www.ithome.com/0/973/323.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bc83\"\u003eIT之家 7 月 7 日消息，\u003ca href=\"https://www.ithome.com/0/973/306.htm\" target=\"_blank\"\u003e\u003cstrong\u003e苹果公司今天（7 月 7 日）推送 iOS / iPadOS 27 Beta 3 更新\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e，版本号为 24A5380h，\u003c/strong\u003eIT之家查询苹果官方更新日志和用户反馈，简要汇总本次更新内容如下。\u003c/p\u003e\u003ch3 data-vmark=\"68f1\"\u003e一、深耕 Siri AI\u003c/h3\u003e\u003cp data-vmark=\"7d0a\"\u003e在 iOS 27 Beta 3 更新中，苹果进一步完善 Siri AI 表现，已启用 Siri 语速与表现力独立调节功能。用户可以打开设置应用，在 Siri \u0026gt; Voice 路径下，通过滑块，微调上述两种表现。\u003c/p\u003e\u003cp data-vmark=\"5ea2\" style=\"text-align: center;\"\u003e\u003ca class=\"ithome_super_player\" contenteditable=\"false\" target=\"_blank\" href=\"https://weibo.com/tv/show/1034:5317941990719493?mid=5317942107441418\"\u003e","tags":[],"cluster_size":1,"ts":"2026-07-06T23:33:16"},{"id":8610,"title":"AI Agent 不缺掌声，缺的是订单 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE5GbkVnd21pNXdkZXZfNHBKY002N3RRSVNmT0NZNWdpUWVwVU5OWTI0SnUzeEJrQldYVzZLZE9lWFh2VGJWZ0poZWZzTUQ1SlFU?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE5GbkVnd21pNXdkZXZfNHBKY002N3RRSVNmT0NZNWdpUWVwVU5OWTI0SnUzeEJrQldYVzZLZE9lWFh2VGJWZ0poZWZzTUQ1SlFU?oc=5\" target=\"_blank\"\u003eAI Agent 不缺掌声，缺的是订单\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-06T23:28:15"},{"id":8611,"title":"钠电刚杀到算力储能门口，就踢到了铁板上 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1NSGlueUZ4VWxjbkdveTJ4SnlGSm1YR2NveGtMR0JUY2o1WWN0cjd6VzRaTFRoZ2tXd1NK // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
