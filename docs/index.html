GI4Z3VTLVEwTllqVmpZMjQ4NThhR3VDNkVReU83RTVCUEtxcElVekxKZ2xMRQ?oc=5","source":"GNews · AI Research","sources":["GNews · AI Research"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMimwFBVV95cUxNdy04ZTYtRGR5bkVJSFluUXJfaWNmV1dCMmgycDJOSEZhLVZ6eEx3OUE1bFE2WGcwamhFZTI1NjhBQ0xfak9zRGw3RlJCcXpqUnpSbFdfWnZtTjltVkpoRlhZVW9xMU13TzJQYkdqTGI4Z3VTLVEwTllqVmpZMjQ4NThhR3VDNkVReU83RTVCUEtxcElVekxKZ2xMRQ?oc=5\" target=\"_blank\"\u003eAnthropic shines a light into the Claude AI black hole\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ecio.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-08T04:27:11"},{"id":8797,"title":"LLM-Driven Neural Network Generation with Same-Family Architecture Guidance: Disentangling Transfer and Adaptation","url":"https://arxiv.org/abs/2607.05704","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05704v1 Announce Type: new \nAbstract: Large language models (LLMs) can generate neural-network modifications, but unrestricted generation is often invalid or harmful. This paper studies a narrower setting: improving a weak target model using a stronger same-family source model from a neural-network database. We propose a source-guided candidate-generation protocol with non-source controls, source-conditioned candidates, and a no-LLM hp_copy ablation under equal evaluation budgets. The protocol reports validity separately from accuracy and selects the best valid candidate only when i","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8796,"title":"Deep Reinforcement Learning for Dynamic Battery Management of Autonomous Order Pickers","url":"https://arxiv.org/abs/2607.05683","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05683v1 Announce Type: new \nAbstract: Battery charging of Autonomous Mobile Robots (AMRs) in warehouses is a critical operational challenge that heavily impacts both order processing times and throughput. In this study, we address the dynamic AMR charging problem under stochastic order arrivals, where robots must learn optimal charging decisions. Traditional fixed-rule heuristics often prove suboptimal in dynamic environments and fail to account for multi-AMR coordination, leading to severe resource inefficiencies. To overcome these limitations, we propose a Proximal Policy Optimiza","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8795,"title":"Orthogonal Dendritic Intrinsic Networks: An Architecture for Significance-Ordered, Orthogonal Latent Spaces","url":"https://arxiv.org/abs/2607.05653","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05653v1 Announce Type: new \nAbstract: Principal Component Analysis or PCA-like properties (orthogonality, variance ranking) are seldom realized in deep autoencoder architectures. In this work, we present ODIN (Orthogonal Dendritic Intrinsic Network), a novel autoencoder architecture that recovers PCA-like latent structure in a fully non-linear regime. By incorporating a set of geometric constraints directly into the training objective, ODIN encourages latent dimensions to be mutually orthogonal and ordered by explained variance, mirroring the interpretable decomposition of PCA while","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8794,"title":"Domain-Adaptive Climate Downscaling Under Temporal Distribution Shift","url":"https://arxiv.org/abs/2607.05645","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05645v1 Announce Type: new \nAbstract: Deep-learning-based climate downscaling aims to learn relationships from historical low-resolution (LR) and high-resolution (HR) climate data to generate HR climate projections. However, this setting faces a temporal out-of-distribution (OOD) challenge: models trained on historical data are commonly applied to future projections whose distributions may differ substantially from the training period. This study investigates temporal OOD shift for daily temperature downscaling over the Continental United States using paired LR-HR model simulations.","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8793,"title":"Intuitionistic Fuzzy Graph Embedded Random Vector Functional Link with Multiview Learning","url":"https://arxiv.org/abs/2607.05635","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05635v1 Announce Type: new \nAbstract: Random Vector Functional Link (RVFL) networks are popular due to their fast training and universal approximation capabilities. However, RVFL models face challenges in preserving geometric relationships and utilizing multiple feature views effectively. To address these limitations we propose the Intuitionistic Fuzzy Graph Embedded Random Vector Functional Link with Multiview Learning (IFGRVFL-MV) model. The proposed approach comprises three key components: intuitionistic fuzzy sets for uncertainty handling, graph embedding to capture intrinsic ge","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8792,"title":"Safe Bayesian Optimization with Counterfactual Policies","url":"https://arxiv.org/abs/2607.05620","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05620v1 Announce Type: new \nAbstract: In many decision-making settings, new interventions are acceptable only if they do not reduce outcomes below some established threshold. For example, in clinical medicine, new treatments are often acceptable only if they do not worsen outcomes relative to an established standard of care. Safe Bayesian optimization maximizes an objective subject to safety constraints. In the setting that we consider here, safety is defined relative to a known baseline policy whose outcomes are counterfactual and therefore unobserved. Thus, the counterfactual outc","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8791,"title":"A Coin Flip Per Token: Bernoulli Sparse Steering of Large Language Models","url":"https://arxiv.org/abs/2607.05615","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05615v1 Announce Type: new \nAbstract: Activation steering via sparse autoencoders (SAEs) enables behavioral control of large language models without task-specific fine-tuning, but standard methods apply the steering signal at every generated token, incurring constant per-token perturbation that risks degrading fluency. We ask: is dense intervention necessary? We introduce Stochastic Token Steering (STS), which gates each token independently with probability $p$, and Stochastic Block Steering (SBS), which gates a leading window once per sequence; neither requires a reward model or le","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8790,"title":"SafeImpute: Reliable Clinical Data Imputation via Conformal Selection","url":"https://arxiv.org/abs/2607.05613","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05613v1 Announce Type: new \nAbstract: Clinical care often relies on key laboratory indicators, yet real-world patient visits are sparse and tests are ordered irregularly, leading to pervasive missingness. While many imputation methods improve average accuracy, they provide limited guidance on which imputed values are reliable enough for high-stakes downstream use. In this work, we study reliable clinical imputation, aiming to produce accurate imputations while selectively releasing the reliable results, with statistical control over clinically unacceptable errors. To achieve this go","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8789,"title":"Federated Physics-Grounded Reinforcement Learning for Distributed Stability Control in Smart Grids","url":"https://arxiv.org/abs/2607.05553","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05553v1 Announce Type: new \nAbstract: Transient stability control in smart grids requires rapid post-fault damping of generator frequency and rotor angle deviations to prevent cascading failures. This paper proposes FedPPO-PG, a Federated Multi-Agent Proximal Policy Optimization framework with Physics-Grounded neighborhoods, which reformulates transient stability control as a cooperative multi-agent reinforcement learning problem optimized directly against closed-loop stability objectives. Each generator hosts an independent local actor augmented with the frequency deviations of its","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8788,"title":"Self-Review Reinforcement Learning (SRRL) with Cross-Episode Memory and Policy Distillation","url":"https://arxiv.org/abs/2607.05541","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05541v1 Announce Type: new \nAbstract: Reinforcement Learning is commonly used to train large language models using environmental feedback. In applied settings, the environment usually provides sparse or delayed feedback. This makes it difficult for the model to pinpoint which actions in its reasoning led to success or failure. So, learning effectively from these signals is hard because the model must determine how each failure should inform meaningful behavioral corrections in subsequent iterations. We introduce a training framework, Self-Review Reinforcement Learning, that embeds a","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8787,"title":"$\\mathbf{\\lambda}$-VAE: Variance Equalization for Posterior Collapse","url":"https://arxiv.org/abs/2607.05531","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05531v1 Announce Type: new \nAbstract: Variational Autoencoders (VAEs) frequently suffer from posterior collapse, a failure mode in which the approximate posterior converges to the prior, rendering the latent code uninformative. Despite extensive research, a unified account of why collapse occurs has remained an open question. We identify and formalize two logically independent but coupled causes. \\emph{Gradient imbalance} occurs when the decoder's reconstruction signal vanishes faster than the $\\mathbb{KL}$ regularization pressure as the posterior widens. \\emph{Information gap} occu","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8786,"title":"PatchOptic for Shared-State LLM Workflows with Projected Views and Verified Structured Updates","url":"https://arxiv.org/abs/2607.05483","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05483v1 Announce Type: new \nAbstract: Agentic workflows often operate over shared, structured state. Because LLM context windows are limited, each model invocation is typically shown only the state fragment needed for the current workflow step, a pattern commonly known as progressive disclosure. Modern systems construct such model-facing views using grep-like keyword search, retrieval-augmented generation (RAG), abstract-syntax-tree (AST) queries, and task-specific agent skills. These methods make the read side manageable, but they do not define when a locally proposed rewrite is va","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8785,"title":"InvWeaver: Deductive Feedback for Invariant Synthesis in Interacting-Loop Programs","url":"https://arxiv.org/abs/2607.05478","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05478v1 Announce Type: new \nAbstract: Loop invariant inference is a fundamental yet challenging problem in program verification. Recent LLM-aided guess-and-check techniques have shown strong performance on single-loop programs, but they often struggle with programs containing multiple interacting loops. This paper presents InvWeaver, a neuro-symbolic framework for synthesizing invariants for such programs. The key idea is to expose inter-loop dependencies and propagate proof obligations through a combination of loop-level abstraction, obligation-guided inference, and weakest-precond","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8784,"title":"Parameter-Free Encoders Remain Viable for RDB Foundation Models","url":"https://arxiv.org/abs/2607.05476","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05476v1 Announce Type: new \nAbstract: Given a relational database (RDB) storing heterogeneous tabular information, how can we predict missing (or future) values in some target column of interest? As the space of potential targets is vast across enterprise settings, it is preferable to avoid learning a new model from scratch each time there is a new prediction task. Frozen foundation models based on RDB-specific encoders provide a viable solution, but ideal design remains an open question. On the one hand, it has recently been argued that certain parameter-free subgraph encoders comb","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8783,"title":"Breaking Structural Isolation: Scalable Graph Clustering via Community-Aware Sampling and Structural Entropy","url":"https://arxiv.org/abs/2607.05469","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05469v1 Announce Type: new \nAbstract: Unsupervised graph clustering is a fundamental technique for uncovering underlying semantic patterns in large-scale networks. Although Graph Contrastive Learning has demonstrated promising performance, existing methods often suffer from the \"structural isolation\" issue during mini-batch training, making it challenging to capture cohesive community structures that characterize the global topological distribution. To address these challenges, we propose SCISE, a Scalable unsupervised graph Clustering framework that preserves structural Integrity b","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8782,"title":"AdaStop: Cost-Aware Early Stopping for DNN Test Selection","url":"https://arxiv.org/abs/2607.05461","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05461v1 Announce Type: new \nAbstract: Existing methods for testing deep neural networks (DNNs) primarily prioritize test inputs likely to reveal model faults under a fixed labeling budget. In practice, choosing that budget is difficult: too little testing misses failures, while too much incurs unnecessary labeling costs. This work studies the stopping problem in DNN testing. We formulate testing as a cost--benefit decision process in which labeling an input incurs cost $c$ and discovering a fault yields value $v$. Based on this formulation, we introduce \\textit{AdaStop}, a framework","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8781,"title":"Learning to Control LLM Agent Harnesses with Offline Reinforcement Learning","url":"https://arxiv.org/abs/2607.05458","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05458v1 Announce Type: new \nAbstract: Large language model (LLM) agents are usually improved by changing prompts, models, or hand-written workflows, while the execution harness around the model is treated as fixed infrastructure. We argue that this harness is itself a learnable control layer. We formalize harness operation as a finite-horizon Harness MDP, where a lightweight controller selects structural execution actions while the LLM executor remains frozen. The controller is trained from offline rollouts using advantage-weighted regression with only terminal task-rubric rewards.","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8780,"title":"Empirical Minimal-Realisation Compression of Deep Neural Networks via Controllability-Observability Tests","url":"https://arxiv.org/abs/2607.05457","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05457v1 Announce Type: new \nAbstract: Deep neural networks often contain substantial hidden-state redundancy, but most compression methods operate directly on weights, neurons, or quantised representations without explicitly characterising the dynamical role of internal states. This paper proposes a controllability-observability framework for empirical state-order reduction of deep neural networks. By viewing a trained network as a depth-indexed nonlinear dynamical system, we construct data-driven reachability, observability, and balanced Gramians from hidden-state snapshots and out","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8779,"title":"Exogenous Dropout: A Simple, Strong Baseline for Corruption-Robust Time Series Forecasting with Covariates","url":"https://arxiv.org/abs/2607.05452","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05452v1 Announce Type: new \nAbstract: Time series forecasters that use exogenous covariates are fragile in deployment: when those covariates are noised, temporally misaligned, or missing, strong exogenous-fusion and exogenous-adapted models can degrade far above the endogenous-only floor. We study whether such robustness requires specialized architectures, or whether it can be obtained through a simple training intervention. We propose exogenous dropout, a model-agnostic method that randomly zeros whole exogenous channels during training. Across electricity-price forecasting, reserv","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8778,"title":"The Granularity Paradox: How Temporal Disaggregation Inflates In-Sample Fit and Compounds Out-of-Sample Error","url":"https://arxiv.org/abs/2607.05450","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05450v1 Announce Type: new \nAbstract: This paper explores the \"Granularity Paradox\" in time-series forecasting, wherein finer temporal disaggregation (e.g., Monthly to Weekly/Daily) improves in-sample diagnostics and dataset size (N), but degrades out-of-sample accuracy due to recursive error compounding over longer horizons (H). Conversely, coarse aggregation (Annual) eliminates recursive error propagation but reduces data available to estimators. We formalize this trade-off and benchmark 10 models - spanning na\\\"ive, statistical, machine learning, and deep learning architectures -","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8777,"title":"Geometry-Aware Infrastructure-Anchored Denoiser for UWB Sensing and Work-Zone Reconstruction","url":"https://arxiv.org/abs/2607.05449","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05449v1 Announce Type: new \nAbstract: Accurate work-zone geometry perception is critical for intelligent transportation systems, and ultra-wideband sensing offers a low-cost approach for infrastructure-aided reconstruction. However, outdoor UWB ranging is often degraded by non-line-of-sight propagation, burst noise, and long-tail errors, which can distort downstream spatial reconstruction. We present GAIA, a geometry-aware, infrastructure-anchored learning framework that couples temporal range modeling with latent anchor-layout estimation and deterministic distance projection. GAIA","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8776,"title":"Design-CP: Context Parallelism for Design of Protein Nanoparticles","url":"https://arxiv.org/abs/2607.05439","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05439v1 Announce Type: new \nAbstract: Many all-atom generative protein models can in principle design large multimeric complexes by jointly modelling all chains, but their quadratic token- and atom-pair representations quickly exceed single-GPU memory as the number of chains and residues modelled grows. We introduce Design-CP, two context-parallel (CP) inference strategies for RFdiffusion 3 (1D row-sharding and 2D grid sharding with ring attention) that distribute the quadratic activations across a multi-GPU mesh while preserving pretrained weights. We characterise their scaling whe","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8775,"title":"Statistically Meaningful Geometry and Gauge Symmetry Breaking: A Geometric Foundation for Scientific Discovery and Intelligence Emergence","url":"https://arxiv.org/abs/2607.05436","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.05436v1 Announce Type: new \nAbstract: The rapid scaling of over-parameterized machine learning architectures, particularly LLMs, raises a profound crisis: do these systems exhibit genuine intelligence, or are they merely sophisticated statistical pattern matchers? Classical flat Euclidean statistics cannot differentiate continuous interpolation from the autonomous discovery of novel causal laws. To resolve this, we introduce Statistically Meaningful Geometry (SMG), a framework modeling over-parameterized learning systems as infinite-dimensional non-parametric Orlicz fiber bundles. W","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8774,"title":"MemDefrag: Latent Memory Defragmentation for Large Language Models","url":"https://arxiv.org/abs/2607.05969","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.05969v1 Announce Type: new \nAbstract: Latent memory, which stores past knowledge fragments as per-layer hidden states, has emerged as a promising paradigm (e.g., MemoryLLM and M+) for long-term memory in large language models (LLMs). However, the paradigm suffers from significant performance degradation during memory updates, due to positional encoding misalignment and the absence of any tracing mechanism to distinguish target memory fragments from irrelevant ones. To discover such a tracing mechanism, we probe the layer-wise attention density over stored memory fragments, and find","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8773,"title":"InfluMatch: Frontier-Quality KOL Search at 4B-Model Cost","url":"https://arxiv.org/abs/2607.05968","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.05968v1 Announce Type: new \nAbstract: Matching influencers (KOLs) to free-form, multi-part Thai marketing criteria is today served either by keyword search over structured profiles, which misses semantic fit, or by prompting frontier LLMs over every candidate, which is accurate but slow and expensive. We present InfluMatch, a low-cost three-stage cascade -- retrieval $\\rightarrow$ rerank $\\rightarrow$ reason -- built entirely from small open-weight models: dense retrieval returns 50 candidates, a 4B pointwise reranker scores each by the log-probability of a single Yes token and keep","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8772,"title":"Umm... With Transformers? Insights from Filled Pause Use across Four Slavic Parliaments","url":"https://arxiv.org/abs/2607.05964","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.05964v1 Announce Type: new \nAbstract: Filled pauses (FPs) are a universal feature of spontaneous speech, yet most studies rely on small, single-language corpora, limiting the generalisability of their findings. We analyse ~4,000 hours of parliamentary speech across four related Slavic languages (Croatian, Czech, Polish, Serbian). FP occurrence is obtained via transformer-based automatic detection, while FP rate is modelled using Generalised Estimating Equations (GEE) with Mundlak correction to distinguish within- from between- speaker effects. We replicate a negative association of","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8771,"title":"Is Domain Adaptation Always Helpful? A Frozen-Backbone Study of Cross-Domain Sentiment Transfer","url":"https://arxiv.org/abs/2607.05937","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.05937v1 Announce Type: new \nAbstract: Sentiment analysis with frozen pre-trained language model (PLM) backbones has become a common paradigm, yet the practical benefit of explicit domain adaptation remains unclear, particularly when backbones encode varying degrees of target-domain knowledge. We present a preliminary case study evaluating a controlled family of frozen embedding backbones (Qwen3-Embedding 0.6B, 4B, 8B), alongside RoBERTa-base and FinBERT. We train a lightweight MLP adapter on consumer reviews using Domain-Adversarial Neural Networks (DANN), Maximum Mean Discrepancy (","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8770,"title":"Mitigating Factual Hallucination in Large Reasoning Models via Mixed-Mode Advantage Regularization","url":"https://arxiv.org/abs/2607.05861","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.05861v1 Announce Type: new \nAbstract: Large reasoning models (LRMs) improve language model capabilities by generating explicit thinking traces before final answers. In factuality-oriented question answering (QA), such thinking often improves overall performance by helping the model recover relevant knowledge and refine its answers. However, we find that this benefit is not uniform at the instance level: explicit thinking can also overturn correct non-thinking answers and lead to factual drift. We refer to this failure mode as \\emph{thinking-induced hallucination}. To explain this ph","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#0891b2","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":8958,"title":"Optimal Transport Q-Learning for Flow Policy Steering and Acceleration","url":"https://arxiv.org/abs/2607.06262","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06262v1 Announce Type: new \nAbstract: Diffusion and flow policies have recently demonstrated remarkable performance in robotic applications by accurately capturing multimodal robot trajectory distributions, especially in the context of vision language action (VLA) models. However, high quality policy performance also requires fast inference and high quality demonstrations, which are often hard to get. Lack of these leads to suboptimal policy behaviors and failure under distribution shifts. In this work we address the problem of fine-tuning and accelerating suboptimal flow-based poli","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8957,"title":"Diagnosing Semantic Handoff Failures in Agent-Orchestrated Vision-Language-Action Skill Composition","url":"https://arxiv.org/abs/2607.06256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06256v1 Announce Type: new \nAbstract: Long-horizon household tasks require robots to compose many language-conditioned skills, yet the boundary between consecutive skills is rarely explicit. A skill may satisfy its own postcondition while leaving the robot, objects, or camera views in a state from which the next skill cannot reliably start. We study this semantic handoff problem in BEHAVIOR-1K through an agent-orchestrated vision-language-action execution harness. The harness invokes $\\pi_{0.5}$-based skill checkpoints trained from cleaned BEHAVIOR-1K demonstrations, assigns each sk","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8956,"title":"RoboVAST: Automated Scenario-Based Validation of Robots at Scale","url":"https://arxiv.org/abs/2607.06248","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06248v1 Announce Type: new \nAbstract: Validation of robotic systems critically depends on the operating conditions under which they are assessed. Scenario selection and variation are often manual, experience-driven, and difficult to scale, which harms reproducibility and weakens validation conclusions. We propose a scenario-based methodology that models scenarios compositionally and formalizes how these dimensions are varied, instantiated, executed, and interpreted. Building on this, we introduce RoboVAST, a framework that realizes declarative campaign specifications, plugin-based s","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8955,"title":"Calf-Integrated Arms for Bimanual Quadruped Loco-Manipulation","url":"https://arxiv.org/abs/2607.06186","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06186v1 Announce Type: new \nAbstract: Most quadruped loco-manipulation designs trade manipulation capability against stance. A trunk-mounted arm sits high and usually carries a single arm; using the legs as manipulators lifts the manipulating leg off the ground; and even leg-mounted grippers reach two-handed tasks only by rearing onto the hind legs. This paper integrates a manipulator with a prismatic slider, two revolute joints, and a gripper into each front calf of a Unitree Go2. The two arms grasp objects at ground level and manipulate with both hands while all four feet stay pla","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8954,"title":"EAGOR: Embodied Reasoning in Omni-direction","url":"https://arxiv.org/abs/2607.06165","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06165v1 Announce Type: new \nAbstract: Omni-directional (360{\\deg}) cameras provide embodied agents with a holistic view of their surroundings, making them suited for directional reasoning in tasks such as navigation and object search. Existing Vision Language Models (VLMs) project 360{\\deg} observations to 2D equirectangular projection (ERP) images and process them using architectures designed for perspective images. However, they ignore the spherical nature of 360{\\deg} observations, where each pixel represents a viewing direction relative to the agent. Consequently, their directio","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8953,"title":"ThorArena: Benchmarking Humanoid Physical Interaction with Human Motion-Force Demonstrations","url":"https://arxiv.org/abs/2607.06052","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06052v1 Announce Type: new \nAbstract: Humanoid robots are increasingly expected to perform contact-rich tasks that require not only accurate whole-body motion but also robust physical interaction with surrounding objects and humans. Although recent advances in humanoid motion imitation and whole-body control have achieved remarkable tracking performance, existing datasets and benchmarks primarily focus on kinematic motion while largely overlooking synchronized interaction forces. As a result, current evaluations fail to capture how external interaction forces affect tracking accurac","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8952,"title":"RoboTALES: Learning Reasoning-Guided Robot Policies via Task-Aligned Simulated Futures","url":"https://arxiv.org/abs/2607.06018","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.06018v1 Announce Type: new \nAbstract: Pretrained video generative models are promising backbones for visuomotor control, but their imagined futures often drift from task intent and are not reliably action-conditional. As a result, these models can be difficult to use for planning or policy extraction. To address these limitations, we propose RoboTALES, a single-stage framework that learns task-aligned simulated futures and uses them to train robot policies. Our approach introduces two key innovations: (1) a hierarchical LLM-based planner that breaks complex tasks into a sequence of","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8951,"title":"DexTele: A Dual-Arm Dexterous Teleoperation System Based on Motion Retargeting and Adaptive Force Control","url":"https://arxiv.org/abs/2607.05883","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05883v1 Announce Type: new \nAbstract: In dual-arm dexterous teleoperation, cross-platform generalization of motion retargeting and interactivity of grasping are crucial. However, the heterogeneity of robotic architectures and the wide variety of grasping objects pose significant challenges to achieving precise motion retargeting and compliant grasping in dual-arm dexterous teleoperation. To address these challenges, a dual-arm dexterous teleoperation system (DexTele) is proposed based on motion retargeting and adaptive force control. First, a vision-based motion retargeting module i","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8950,"title":"GraspIT: A Dataset Bridging the Sim-to-Real gap and back for Validated Grasping SE(3) Pose Generation","url":"https://arxiv.org/abs/2607.05869","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05869v1 Announce Type: new \nAbstract: Robust robotic grasping of novel objects requires datasets that simultaneously provide photorealistic RGB-D observations, physically validated grasp quality annotations, and a principled bridge between simulation and the real world, which existing datasets lack to provide jointly. \\textbf{GraspIT} addresses this gap: tabletop scenes in NVIDIA Isaac Sim are annotated via a four-stage physical slip-test on parallel Franka Panda instances, producing trajectory-reachability checks and continuous quality scores beyond force-closure.Of ${\\sim}$2.3M ca","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8949,"title":"FORGE: Towards Functional Tool-Use Generalization via Keypoint Trajectory Reasoning","url":"https://arxiv.org/abs/2607.05780","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05780v1 Announce Type: new \nAbstract: While humans readily repurpose a book, a stone, or a shoe to drive a nail, robots trained on specific tools fail to transfer the same function to novel ones -- a gap we formalize as functional generalization. Such tools share a common functional intent that is visually recognizable, yet this perceptual similarity does not carry over to action space, where each tool demands an entirely different motor pattern. To bridge this gap, we explore intermediate representations including affordance images, human video prompts, and 2D keypoint trajectories","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8948,"title":"Co-STAR: Cognitive Stimulation Therapy by an Autonomous Robot for Dementia -- A One-Week In-Home Study","url":"https://arxiv.org/abs/2607.05709","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05709v1 Announce Type: new \nAbstract: Cognitive therapies have been shown to enhance the quality of life and well-being of people living with dementia (PwDs). However, their use remains limited due to a shortage of trained professionals and the significant time and training required of informal caregivers. To address this gap, we developed and deployed a social robot capable of autonomously delivering cognitive stimulation therapy (CST) in the home. Nine PwDs participated in a one-week ($7$ days) study that involved daily robot-led sessions. Participants engaged positively with the","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8947,"title":"Efficient Transfer Learning of Robot Dynamic Models Using Morphological Similarity","url":"https://arxiv.org/abs/2607.05665","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05665v1 Announce Type: new \nAbstract: This study proposes a neural network-based transfer learning framework for modeling the dynamics of soft, fin-actuated underwater robots. We focus on morphologically similar robots that differ in scale and hydrodynamic properties. A model trained on data from a larger robot (source domain) is adapted to a smaller one (target domain) with limited labeled data. To enable label-efficient transfer, we develop an autoencoder-based domain adaptation approach that learns a shared latent representation aligning the dynamics of both robots. Experiments o","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8946,"title":"Dynamic Evaluation of Classical and Control-Aware Optimal Trajectory Planning in Robot Manipulators","url":"https://arxiv.org/abs/2607.05544","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05544v1 Announce Type: new \nAbstract: Trajectory planning strongly influences tracking accuracy, actuator demand, and overall execution behavior in robotic manipulators. Classical planners such as cubic, quintic, and trapezoidal profiles are widely used for their simplicity and smoothness, yet they remain purely kinematic and ignore system dynamics and control effort during trajectory generation. As a result, nominally smooth trajectories can lead to inefficient nonlinear execution and increased corrective control action. This paper presents a control-aware optimal trajectory planni","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8945,"title":"GEM-Occ: From Visual Geometry Evidence to Embodied Semantic Occupancy Memory","url":"https://arxiv.org/abs/2607.05543","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05543v1 Announce Type: new \nAbstract: Semantic occupancy provides a structured spatial memory for embodied indoor agents by jointly representing occupied regions, observed free space, unknown areas, and object semantics. However, existing indoor occupancy benchmarks and methods mainly focus on single-view prediction or room-level online perception, leaving long-horizon semantic mapping across connected indoor spaces underexplored. We introduce HIOcc, a hierarchical indoor occupancy benchmark that unifies ScanNet, ScanNet++, and Matterport3D under a common sparse semantic occupancy f","tags":[],"cluster_size":1,"ts":"2026-07-08T04:00:00"},{"id":8944,"title":"Learning 4D Geometric Priors for Inference-Efficient World Action Models","url":"https://arxiv.org/abs/2607.05468","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.05468v1 Announce Type: new \nAbstract: World Action Models (WAMs) have shown strong potential for robotic manipulation by jointly modeling visual future dynamics and executable action sequences. However, existing video-action co-training methods primarily optimize appearance-oriented video latents, which may insufficiently capture the temporally evolving geometry required for precise manipulation. W function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
