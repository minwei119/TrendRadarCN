22:45"},{"id":19051,"title":"中国央行公开市场7天期逆回购操作量为零。今日50亿元逆回购到期。","url":"https://wallstreetcn.com/livenews/3148326","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中国央行公开市场7天期逆回购操作量为零。今日50亿元逆回购到期。","tags":[],"cluster_size":2,"ts":"2026-08-12T01:22:19"},{"id":19052,"title":"香港恒生指数开盘跌0.6%，恒生科技指数跌0.8%。","url":"https://wallstreetcn.com/livenews/3148325","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"香港恒生指数开盘跌0.6%，恒生科技指数跌0.8%。","tags":[],"cluster_size":1,"ts":"2026-08-12T01:21:46"},{"id":19053,"title":"打破惯例，北交所新股战配比例触及30%上限","url":"https://wallstreetcn.com/livenews/3148291","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，北交所2只新股信胜科技、双英集团均公告称，在IPO发行过程中，战略投资者的配售比例均为30%。这一安排，打破了北交所一段时间以来新股默认为10%的战配比例。分析称，这主要是基于当前市场情况的考虑，更多的战配比例有望助力新股表现，减少破发。“当然，30%的比例大概率不会常态化，这更像是一种临时性的安排。因为在打新收益强劲之下，战配比例越大越容易出现寻租的可能。”资深投资人士周运南说。","tags":[],"cluster_size":1,"ts":"2026-08-11T23:26:47"},{"id":19054,"title":"华尔街见闻早餐 | 2026年8月12日","url":"https://wallstreetcn.com/livenews/3148290","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股收跌，纳指跌0.6%，市场关注周三将公布的美国CPI数据；中东僵局再撑油价，WTI原油期货四连涨；金价从两个月高位回落。\n\n巴基斯坦称美伊就霍尔木兹海峡问题接近达成协议，但伊朗表示在诉求获得满足前将继续关闭海峡。\n\n周三美国CPI有“鸽派惊喜”？高盛称通胀或低于普遍预期，汇丰则押注“温和”数据。\n\n日元兑美元逼近160关口，干预风险上升。\n\n恒生科技指数将迎大修订：30只扩容至50只，AI升独立主题，增设收入增长组，向高增长中小公司开门。\n\nAI服务器需求持续释放，工业富联上半年净利润同比增长96%。\n\n美参议员桑德斯致信OpenAI、Anthropic和Meta：暂停AI开发，否则国会将介入。\n\nNemotron 3.5才落地已瞄准万亿参数！英伟达被曝正开发全球顶尖开源模型。\n\nAI光通信需求强劲，Lumentum上季营收翻倍，本季指引更超预期，债务重组致超70亿巨亏。\n\nCoreWeave盘后大涨16%！Q2营收翻倍超预期，积压订单达1040亿美元。\n\n存储见顶担忧升温，韩国多家券商下调三星、SK海力士目标价，最深下调超30%。\n\n提醒：腾讯周三将公布财报，关注WorkBuddy相关数据。","tags":[],"cluster_size":3,"ts":"2026-08-11T23:25:36"},{"id":19055,"title":"港股通重塑AI资产估值中枢，大模型从价格战迈向价值战","url":"https://wallstreetcn.com/livenews/3148287","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"8月以来，港股AI板块迎来一轮明显的估值重塑行情。随着多家AI大模型公司相继纳入港股通标的，南向资金配置中国AI核心资产的通道进一步打开。Wind数据显示，6月26日以来，恒生科技指数累计上涨9.50%。分析人士认为，港股通资金通道扩容、头部大模型释放提价信号等多重信号叠加，标志着国产AI大模型正从低价抢份额的粗放竞争迈入价值变现的新阶段，港股AI板块估值逻辑正经历系统性重塑。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-11T23:09:08"},{"id":19056,"title":"下半年A股投资图谱浮现：科技为矛、改善为盾，两大核心主线成机构共识","url":"https://wallstreetcn.com/livenews/3148284","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"进入下半年，A股市场在震荡磨底中加快寻找新的运行主线。多方调研获悉，多家一线机构已形成明确共识：机构资金可依托基本面研究适度左侧布局，普通投资者在右侧信号出现时可进一步提高风险偏好；在配置方向上，应由单一赛道抱团转向科技成长、基本面改善与高股息资产的均衡组合。AI产业趋势延续、政策支持持续加码以及资本市场双向开放提速，将为下半年结构性行情提供支撑，但海外货币政策、地缘局势等不确定因素仍需警惕。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-11T22:59:42"},{"id":19057,"title":"两大龙头中报披露在即，机构研判港股后市或转入震荡整固期","url":"https://wallstreetcn.com/livenews/3148280","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在经历一个多月的持续反弹后，近几个交易日港股市场涨势放缓，主要股指呈现区间震荡态势。本周，腾讯控股、京东集团-SW等行业龙头将披露的2026年中报是市场关注的重点，对于整个港股市场而言，中报季的盈利确定性将成为行情的主导变量。在业内人士看来，港股8月或转入震荡整固期，随着中报披露进入高峰期，市场定价逻辑正从情绪修复与资金轮动切换至基本面验证与结构性再平衡，市场整体或仍以结构性行情为主。在具体配置上，在继续将高股息红利资产作为投资组合“稳定器”的同时，建议可适当增加对港股高弹性方向的关注。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-11T22:51:14"},{"id":19058,"title":"数量创近五年新高，单只平均规模缩水，今年新发基金“细分赛道”撬动大市场","url":"https://wallstreetcn.com/livenews/3148276","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月以来，公募基金发行市场热度不减。本周（8月10日至14日），49只基金进入发行期，被动指数型产品占比超四成，硬科技与红利策略成为主线。一方面是指数型产品聚焦细分赛道，另一方面是FOF产品显著升温。将时间轴拉长至今年年内，新基金成立数量创近五年新高，但单只平均募集规模却呈现下滑态势。已成立产品的业绩出现明显分化，同一赛道的基金，因成立时点不同，收益差距较大。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-11T22:42:20"},{"id":19059,"title":"险资二季度持仓净增1.83亿股，近期积极调研AI算力、医药与硬科技","url":"https://wallstreetcn.com/livenews/3148270","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"二季度，保险资金整体呈现净增持态势，持仓数量净增加约1.83亿股。下半年以来，保险机构与理财公司都在积极调研上市公司，高度关注AI算力、光通信、医药、硬科技等板块。受访人士认为，出于提升长期投资回报考虑，两类资金下半年有望继续加大权益资产配置力度。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-11T22:21:39"},{"id":19060,"title":"周二（8月11日）纽约尾盘，标普500股指期货最终跌0.29%，道指期货跌0.34%，纳斯达克100股指期货跌0.28%。\n\n罗素2000股指期货涨0.35%。","url":"https://wallstreetcn.com/livenews/3148257","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周二（8月11日）纽约尾盘，标普500股指期货最终跌0.29%，道指期货跌0.34%，纳斯达克10 003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/0bfdc52c-8a62-4458-b5d8-1b37a6e25f57.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"809\" data-weibo=\"0\" data-mpos=\"2,0\"  data-vmark=\"faa5\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"6e90\"\u003e据业内人士消息，苹果从今年第二季度开始，将显示面板的库存持有周期从原来的 4 周延长至 6 周。\u003c/p\u003e\u003cp data-vmark=\"234a\"\u003e一名知情人士表示：“近期原材料价格快速上涨，同时存储芯片价格飙升也导致其他零部件面","tags":[],"cluster_size":1,"ts":"2026-08-12T01:25:20"},{"id":19253,"title":"AI 扮演所有员工角色：NEC 成立企业人工智能与劳动力部门","url":"https://www.ithome.com/0/988/591.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"8c53\"\u003eIT之家 8 月 12 日消息，NEC（日本电气）当地时间 10 日宣布，其已于本月初正式成立了\u003cstrong\u003e所有员工角色均由 AI 扮演\u003c/strong\u003e的“企业人工智能与劳动力部门”。这一机构旨在验证人类与 AI 的交互方式，此前已经历了为期一个月的内部测试。\u003c/p\u003e\u003cp data-vmark=\"0963\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/7621a4f6-6b31-4e40-8585-67d284281b80.jpg\" w=\"1067\" h=\"800\" data-weibo=\"0\" data-vmark=\"273a\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"bbf1\"\u003eNEC“企业人工智能与劳动力部门”包括部门主管、委员会、经理、一般员工 4 个层级。在该系统中，\u003cstrong\u003eAI 自主处理从任务定义到执行和自我进化的所有环节\u003c/strong\u003e，真人则负责控制质量和管理。\u003c/p\u003e\u003cp data-vmark=\"5735\"\u003e有意思的是，\u003cstrong\u003e生成的 AI 员工也需要接受入职培训\u003c/strong\u003e，学习 NEC 的价值观准则、宗旨、行为准则、内部规章制度。\u003c","tags":[],"cluster_size":1,"ts":"2026-08-12T01:21:23"},{"id":19255,"title":"天使++轮融资5亿，前华为生成式大模型负责人把家务机器人折进40厘米 - AgeClub","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE1ISlNndllhOWRfek55dG5TSGt1OThrU3RVTlVuWEVhekJGbTlFYzhYeTVEX0p3Mm53VF96dkd2NVd2clFxaW41bE9JYXhYczVWRlJub0Vwcw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiV0FVX3lxTE1ISlNndllhOWRfek55dG5TSGt1OThrU3RVTlVuWEVhekJGbTlFYzhYeTVEX0p3Mm53VF96dkd2NVd2clFxaW41bE9JYXhYczVWRlJub0Vwcw?oc=5\" target=\"_blank\"\u003e天使++轮融资5亿，前华为生成式大模型负责人把家务机器人折进40厘米\u003c/a\ //arxiv.org/abs/2608.08053","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.08053v1 Announce Type: new \nAbstract: Simulation-ready 3D assets are central to robotics and embodied AI. Generating them from a single image is usually framed as a vision-language model that emits a serialized asset for a decoder to turn into geometry and physical fields, leaving the image-to-3D reasoning implicit. We argue the limiting factor is this output-centric view: part placement and local shape are entangled in one global-coordinate token stream, and the intermediate physical states are never exposed for supervision, conditioning, or verification. PhysX-CoT instead casts si","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19124,"title":"Compiling and Benchmarking Task-State Horizons for Embodied Agents","url":"https://arxiv.org/abs/2608.08036","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.08036v1 Announce Type: new \nAbstract: Frontier agentic models are increasingly deployed as high-level planners for long-horizon embodied tasks. Existing robotic benchmarks have advanced long-horizon evaluation, but primarily characterize difficulty through action-sequence length and subtask complexity, overlooking a distinct challenge: agents must track evolving task-relevant world states induced by both their exploration and environmental dynamics. We define the span of task-relevant state transitions that an agent must track as task-state horizon (TSH). To evaluate how agent perfo","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19123,"title":"4D-WAM: Infusing Spatiotemporal Awareness into World Action Models through Trajectory Fields","url":"https://arxiv.org/abs/2608.08023","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.08023v1 Announce Type: new \nAbstract: Building on recent advances in world models, World Action Models (WAMs) jointly model video prediction and action generation. However, they typically represent videos in 2D pixel space, creating a representation gap with 3D space in which robotic actions are executed. Recent 3D approaches introduce 3D information, but fail to fully exploit the dynamics of 3D structures. In this work, we propose 4D-WAM, a model-agnostic training strategy that injects spatiotemporal knowledge from 3D trajectory fields into WAMs through representation alignment. To","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19122,"title":"Auditing Instruction-Trajectory Mismatches in Multimodal Robot Demonstrations","url":"https://arxiv.org/abs/2608.07895","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07895v1 Announce Type: new \nAbstract: Robot demonstration datasets used to train vision-language-action policies can contain a subtle but harmful failure mode: trajectories that are behaviorally correct but paired with the wrong language instruction. We study post-hoc auditing of these Instruction-Trajectory Mismatches (ITMs). Unlike failed rollouts, ITMs often look plausible, and can corrupt the language-behavior mapping learned by the policy. We propose Multimodal Probabilistic Fusion (MMPF), a training-free auditing framework that treats each modality as an expert, estimates a ta","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19121,"title":"A Mixed-Stiffness Anthropomimetic Fingertip Broadens the Operating Range for Coin Grasping","url":"https://arxiv.org/abs/2608.07887","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07887v1 Announce Type: new \nAbstract: Robotic grasping of thin, flat objects such as coins on hard surfaces remains challenging because conventional methods require reorienting the object, accessing its underside, or adding a dedicated nail mechanism. We previously showed that a rigid nail arrests soft-pad deformation and thereby forms a geometric constraint that improves precision grasping. Here we asked whether an additional constraint-forming boundary, created within the pad by material choice rather than by anatomy, could extend the conditions under which that constraint holds.","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19120,"title":"CoCoNav: Conformal Control for Safe Robot Navigation in Crowds","url":"https://arxiv.org/abs/2608.07751","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07751v1 Announce Type: new \nAbstract: Safe and efficient robot navigation in crowds requires anticipating pedestrian motion despite uncertain and potentially shifting prediction errors. Existing reactive methods can produce oscillatory behavior, while predictive planners often treat forecasts as exact or rely on restrictive error models. Incorporating conservative uncertainty sets as hard constraints can also render model predictive control (MPC) infeasible. We propose \\textit{CoCoNav}, a crowd-navigation framework that combines online conformal calibration with runtime-certified pl","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19119,"title":"Complete, Scalable, and Robust Prioritized Planning for Multi-Robot Ordered Storage and Retrieval at Maximum Capacity","url":"https://arxiv.org/abs/2608.07734","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07734v1 Announce Type: new \nAbstract: Automated warehouses face a fundamental trade-off between maximizing storage density and achieving high retrieval throughput. While puzzle-based storage (PBS) architectures increase capacity by eliminating aisles, coordinating multiple robots in these high-density spaces is computationally challenging due to the potential for deadlocks. This paper introduces a novel multi-robot formulation for the ``ordered storage and retrieval problem at maximum capacity''. The focus is on rectangular grids accessible from a single boundary, where loads need t","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19118,"title":"H\\\"older Signed Distance: A Differentiable, Signed, Parallelizable Metric for Robotics","url":"https://arxiv.org/abs/2608.07707","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07707v1 Announce Type: new \nAbstract: Computing distances between sets is essential in robotic motion planning and control, where differentiable gradients enable real-time optimization. The Euclidean Signed Distance Function (SDF), however, is not differentiable everywhere, and existing alternatives often sacrifice differentiability, sign information, or computational efficiency. In this letter, we introduce a novel differentiable signed distance between convex polyhedra. To this end, we first propose differentiable versions of the minimum and maximum operators, termed the H\\\"older","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19117,"title":"A Reconfigurable Tracked Robot for Enhanced Obstacle Traversal Through Movable Articulation Point and Internal Mass Relocation","url":"https://arxiv.org/abs/2608.07624","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07624v1 Announce Type: new \nAbstract: Tracked robots are widely used in unstructured environments; however, their obstacle traversal capability is fundamentally limited by a tradeoff between front-end reachability and locomotion stability. This study presents TRASER (Tracked Robot with Articulated Spine for Extended Reach), a reconfigurable tracked robot capable of relocating both its articulation point and internal mass. TRASER employs a tape-spring mechanism that localizes compliance to the bending region while maintaining high stiffness in the remaining body, thereby improving bo","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19116,"title":"GWM-VLA: Geometry-Aware Latent World Modeling for Vision-Language-Action Learning","url":"https://arxiv.org/abs/2608.07619","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07619v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models achieve strong robotic manipulation performance but often degrade under visual and environmental shifts. Latent world modeling offers a promising approach to improving robustness, yet existing methods commonly encode camera views independently and predict holistic scene dynamics without explicitly modeling their geometric relationships. We propose GWM-VLA, a geometry-aware latent world modeling framework for VLA learning. GWM-VLA combines geometry-aware multi-view state encoding, global context-conditioned tar","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19115,"title":"AdaDexGrasp: Adaptive Dexterous Grasping via 3D Visuo-Tactile Representation Fusion","url":"https://arxiv.org/abs/2608.07600","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07600v1 Announce Type: new \nAbstract: Humans achieve stable and adaptive grasps by seamlessly integrating visual perception and tactile feedback, a capability that remains challenging to replicate in robotic systems. Existing robotic grasping approaches predominantly rely on visual inputs and lack mechanisms for tactile-guided adaptation after contact, limiting robustness and generalization. To address this challenge, we propose a unified visuo-tactile-fusion grasping framework that integrates grasp generation, feasibility prediction, and adaptive refinement. At its core, our method","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19114,"title":"LIRA: Local Cross-Layer Information Routing for Vision-Language-Action Decoding","url":"https://arxiv.org/abs/2608.07596","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07596v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models transform representations from pretrained vision-language models (VLMs) into robot actions, yet the interface that routes intermediate VLM features into action decoders remains underexplored. Existing designs either expose only a narrow part of the representation hierarchy or rigidly match each decoder block to one VLM layer, restricting access to complementary task evidence across depths. We introduce LIRA, a local cross-layer action-conditioning mechanism that formulates VLM-to-action conditioning as depth-a","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19113,"title":"Reconfigurable Structural Robotic Assembly: Interlocking 3D Aggregations with Self-Aligning Compound Nested Lattice Modules","url":"https://arxiv.org/abs/2608.07576","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07576v1 Announce Type: new \nAbstract: Robotic construction systems often treat the material system and the robot as separate design problems, locating intelligence primarily in hardware, sensing, motion planning, and control. This project instead investigates how geometric intelligence can be encoded within architected material systems to simultaneously address requirements for robotic grasping, self-alignment, reversible connection, structural performance, and three-dimensional aggregation. We introduce a self-aligning compound nested lattice module composed of conjoined cuboctahed","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19112,"title":"Projection-Retraction MPPI: Exact Constraint-Manifold Control for Manipulators","url":"https://arxiv.org/abs/2608.07573","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07573v1 Announce Type: new \nAbstract: Model Predictive Path Integral (MPPI) control is widely used in manipulation for its gradient-free, parallel handling of non-convex costs. Manipulation tasks, however, often impose constraints that hold throughout the motion: a closed kinematic chain that two grasping arms keep exactly, or joint limits and obstacle clearances that are never crossed. MPPI handles such constraints only through the cost, as soft penalties that hold approximately and fail under a strong task cost. To address this, we propose Projection-Retraction MPPI (PR-MPPI), whi","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19111,"title":"Learning Physical Interaction: A Survey of Tactile- and Force-aware Robot Learning","url":"https://arxiv.org/abs/2608.07558","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07558v1 Announce Type: new \nAbstract: Physically grounded robot intelligence requires robots to perceive, reason about, and regulate their interactions with the physical world. This capability is particularly critical in contact-sensitive manipulation, where successful task execution depends not only on visual perception and motion generation, but also on force regulation and adaptive control. In this context, recent robot learning methods have made substantial progress by integrating force, tactile, vision, language, and proprioceptive sensing into learned manipulation policies. In","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19110,"title":"You Don't Need To Stay in The Loop: An Agentic Robotics Loop for Robot-Policy Improvement","url":"https://arxiv.org/abs/2608.07555","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07555v1 Announce Type: new \nAbstract: Coding agents such as Claude Code and Codex close the software loop: a main agent manages the loop, subagents analyze and execute, tools do the work. We port this architecture to robot-policy improvement, where one difference dominates the design: robotic tools---trained policies, training pipelines, data collection---fail routinely, so a tool's quality must be measured, recorded at every call, and expired when the artifact behind it changes. AgenticRobotics is a backend-independent control plane in which an LLM controller drives disposable work","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19109,"title":"Self Supervised Learning from Automatically Generated Demonstrations for Visual Robotic Manipulation","url":"https://arxiv.org/abs/2608.07553","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07553v1 Announce Type: new \nAbstract: Robotic manipulation often requires object specific programming, manual data annotation, or calibrated perception pipelines, which limits rapid deployment in practical settings. Learning from demonstration offers a more direct alternative, but collecting demonstrations can still demand human teleoperation or kinesthetic teaching. This paper presents a self supervised visual manipulation method in which a robot automatically generates demonstrations around a target pose and learns relative pose corrections directly from wrist mounted RGB images.","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":19108,"title":"Generalizing deep reinforcement learning across cable-driven parallel robot configurations with actuator-level policies","url":"https://arxiv.org/abs/2608.07546","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07546v1 Announce Type: new \nAbstract: Cable-driven parallel robots (CDPRs) present diverse configurations and complex control challenges, which can be addressed by deep reinforcement learning (DRL) by learning their nonlinear dynamics. However, DRL methods often require extensive training time, and the resulting policies do not generalize well to different robot configurations or varying numbers of actuators. In this article, we introduce a novel DRL approach for controlling CDPRs that does not depend on the specific robot configuration. Our method trains an actuator-level policy th","tags":[],"cluster_size":1,"ts":"2026-08-11T04:00:00"},{"id":18853,"title":"Chinese robot maker Unitree set to become China's first humanoid robot storck | DW News - Modern Ghana","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE1oVEtPR3h2eGxvTG1ZTVdTODdQa2NGb21PZWxEUFozdGVFeGtIVUhnNHRWbEJtZF9fSTgwR2tUa2NLMmhLdDRjWlcwd2Q3Y29QQk94Y3Z5MjlONVR0cEHSAVxBVV95cUxPYVRLNFF4VmpJMGJlRTNTVXR // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
