力基础设施市场需求持续旺盛，公司算力业务尤其是服务器销售业务实现爆发式增长，成为驱动营业收入、净利润大幅改善、实现扭亏为盈的核心动力；V客户、VB客户、VC客户等头部客户对存量已签订单协商上调租赁价格，上述三个客户首批交付部署的服务器集群自8月起正式起租并确认租赁收入，算力租赁业务运营规模持续攀升，收入实现放量；公司及子公司已向金融及非金融机构申请授信总额215.44亿元，已签署融资及授信合同总额65.89亿元，为订单交付提供资金保障，带动整体经营业绩扭亏为盈；报告期内开展2026年第一期股权激励计划需摊销激励费用约5800万元，计入当期损益，相应扣减当期利润。","tags":[],"cluster_size":1,"ts":"2026-10-08T11:42:51"},{"id":32295,"title":"君逸数码：控股股东、实际控制人的一致行动人曾海涛拟减持不超过公司总股本的3.00%，减持期间为2026年10月30日至2027年1月29日，原因为个人资金需求。","url":"https://wallstreetcn.com/livenews/3175591","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"君逸数码：控股股东、实际控制人的一致行动人曾海涛拟减持不超过公司总股本的3.00%，减持期间为2026年10月30日至2027年1月29日，原因为个人资金需求。","tags":[],"cluster_size":1,"ts":"2026-10-08T11:26:30"},{"id":32296,"title":"铂力特：拟约10亿元投建金属增材高端制造产业基地项目","url":"https://wallstreetcn.com/livenews/3175590","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"铂力特公告，公司拟与江苏省太仓高新技术产业开发区管理委员会签署《投资意向书》，在江苏省太仓高新区注册成立全资子公司，由该全资子公司购买土地使用权投资建设金属增材高端制造产业基地项目，建设地点为江苏省太仓市高新区威海路北、连新路西地块，购置土地约100亩，建设金属增材制造装备制造车间、高精度金属增材产品打印车间、后处理车间及配套办公楼等，总建筑面积约10.4万平方米，投资金额约10亿元。","tags":[],"cluster_size":1,"ts":"2026-10-08T11:26:24"},{"id":32297,"title":"龙星科技：持股13.77%的股东渤海国际信托股份有限公司（代表“冀兴三号单一资金信托”）拟减持不超过公司总股本的3%，减持期间为2026年11月2日至2027年","url":"https://wallstreetcn.com/livenews/3175587","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"龙星科技：持股13.77%的股东渤海国际信托股份有限公司（代表“冀兴三号单一资金信托”）拟减持不超过公司总股本的3%，减持期间为2026年11月2日至2027年1月30日，原因为受托处置信托财产。","tags":[],"cluster_size":1,"ts":"2026-10-08T11:25:30"},{"id":32298,"title":"矩子科技：截至2026年9月30日，公司以集中竞价交易方式累计回购364.33万股，占总股本1.28%，最高成交价23.92元/股，最低成交价15.25元/股，","url":"https://wallstreetcn.com/livenews/3175577","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"矩子科技：截至2026年9月30日，公司以集中竞价交易方式累计回购364.33万股，占总股本1.28%，最高成交价23.92元/股，最低成交价15.25元/股，成交金额8256.16万元。（不含交易费用）","tags":[],"cluster_size":1,"ts":"2026-10-08T11:05:11"},{"id":32299,"title":"满坤科技：截至2026年9月30日，公司以集中竞价交易方式累计回购股份57.51万股，占总股本0.3884%，最高成交价48.40元/股，最低成交价42.20元","url":"https://wallstreetcn.com/livenews/3175576 文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxOdV82SExxek9VZXJDWW9Nd21YeHlGUDlUMTRLQk5mNVppVENhYW1XcW5vVk9rNXVDeGhhelVvQWpqQlFwUnNWUmFwQVozZ3I5cGhqOWJoN2RtNTdCSnZRczJVTXpxamxfaUtPNl9hcXQ1NEV4ZEdQMnJFWTgxYm1qUk9lZVJuVmJDSFE3VQ?oc=5\" target=\"_blank\"\u003e机构：Optimus产能快速爬坡，国产链宇树、小鹏等催化，看好人形机器人确定性行情\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-08T07:31:00"},{"id":32270,"title":"Evaluating the Transfer of Co-Evolved Communication from 2D to 3D Simulation","url":"https://arxiv.org/abs/2610.09280","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09280v1 Announce Type: new \nAbstract: This work examines the transfer of a co-evolved communication mechanism between two robotic agents from a discrete two-dimensional (2D) simulator to a three-dimensional simulator with real physics (3D). The study focuses on whether a communication mechanism co-evolved in a 2D environment retains its functional role after transfer to a 3D physics-based simulator. To support this analysis, the effects of the episode time budget, the social cue, and the asymmetry between the two co-evolved roles were examined. The results indicate that the success","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32269,"title":"RoboRender: Robot-Oriented Video Generation for Visual Sim-to-Real Transfer","url":"https://arxiv.org/abs/2610.09254","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09254v1 Announce Type: new \nAbstract: Simulation enables large-scale, low-cost robot data generation, but policies trained in simulation often fail to transfer to the real world due to the sim-to-real visual discrepancies. Existing approaches often rely on intermediate representations, which can discard rich semantic information or require additional perception modules at deployment. We address this visual sim-to-real gap with RoboRender, a framework that converts simulated trajectories into photorealistic RGB videos for policy learning. RoboRender trains a robot-oriented video gene","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32268,"title":"Co-Evolving Robot Orchestrators and Policies through Deployment","url":"https://arxiv.org/abs/2610.09228","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09228v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies trained on large datasets are capable within their training domains, yet they still fail to generalize to the variety of situations a robot meets in real-world deployment. Agentic robot systems complement the policy with a vision-language model (VLM) orchestrator that learns when to call the policy, how to instruct it, and when to use scripted skills instead. However, because the harness is built around a frozen policy that has limited language steerability, the orchestrator can avoid the policy's failures b","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32267,"title":"Fast Planning for Multi-object Multi-target Throwing","url":"https://arxiv.org/abs/2610.09224","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09224v1 Announce Type: new \nAbstract: Robot throwing has emerged as a promising technique for improving efficiency in logistics and warehouse automation, by enlarging the workspace and speeding up the process. To significantly increase the throwing system's throughput, we develop strategies for throwing multiple objects in one swipe. Such multi-object multi-target throwing (MOMT) leverages the large degrees of freedom of anthropomorphic hands. The key is to quickly generate fast and feasible throwing motions, which involves a complex trade-off between short trajectory duration and s","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32266,"title":"Embedded Evaluation of Task Admission Coalescing in Decentralized Multi-Robot Systems","url":"https://arxiv.org/abs/2610.09187","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09187v1 Announce Type: new \nAbstract: Multi-robot task allocators in dynamic missions commonly admit newly released tasks immediately, potentially invoking allocation for each new arrival. We evaluate task-admission coalescing as a mechanism for controlling allocator processor work while accounting for target-service latency, using CBAA, ACBBA, PI, and HIPC as a representative MRTA suite. The study comprises a 3,000-mission AGX Orin campaign with measured computation delay, 3,000 paired zero-compute missions, and a 96-mission Pololu 3pi+ RP2040 allocator hardware-in-the-loop campaig","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32265,"title":"CAP: Codebook-Aligned Prediction for Tokenized Robot Policies","url":"https://arxiv.org/abs/2610.09178","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09178v1 Announce Type: new \nAbstract: Action tokenization converts continuous robot actions into discrete symbols that can be modeled autoregressively. However, existing tokenizer-based policies typically ignore the tokenizer's learned latent code structure: after tokenization, the policy treats tokens as unrelated class indices and learns a new classifier from scratch. We show that this discarded structure is valuable. We introduce Codebook-Aligned Prediction (CAP), a method that directly reuses the tokenizer's code vectors as policy class prototypes while leaving the tokenizer and","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32264,"title":"Beyond Reconstruction: What Matters in Action Tokenization for Robot Policies?","url":"https://arxiv.org/abs/2610.09170","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09170v1 Announce Type: new \nAbstract: Autoregressive action-token policies such as vision-language-action models require action tokenizers to translate discrete token sequences into precise control actions in continuous space. Many action tokenizers learn the mapping between tokens and actions via a reconstruction objective. However, as we show through extensive analysis, sufficiently accurate action reconstruction is only one part of what makes a downstream robot policy successful. It is also critical that the policy is able to predict the right tokens for new observations, and tha","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32263,"title":"geodex: A Library for Motion Planning on Riemannian Manifolds","url":"https://arxiv.org/abs/2610.09165","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09165v1 Announce Type: new \nAbstract: Planning motions that respect the intrinsic geometry of a robot's configuration space, including its curvature and a configuration-dependent notion of cost, yields shorter, lower-energy, and more natural trajectories than planning under the ambient flat metric. Existing libraries for optimization on manifolds provide rich geometric primitives but do not plan around obstacles. While general-purpose motion planning libraries support many state spaces and custom distance functions, they do not yet treat a configuration-dependent Riemannian metric a","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32262,"title":"World Models Dream of Success: Diagnosing and Repairing Failure Insensitivity in Robot World Models","url":"https://arxiv.org/abs/2610.09134","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09134v1 Announce Type: new \nAbstract: Robot world models support policy evaluation, planning, and synthetic data generation, but these applications require predictions that distinguish successful actions from failures. Across four released checkpoints from two architecture families, we observe weak sensitivity to action changes and success-like predictions on verified failures. Although recent work incorporates failures into model training, which data can repair released checkpoints without changing their architecture or training objective still remains underexplored. To this end, w","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32261,"title":"FlashNeRD: Performance-First Contact-Rich Neural Robot Dynamics","url":"https://arxiv.org/abs/2610.09130","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09130v1 Announce Type: new \nAbstract: Compared with analytical physics, learned dynamics models promise robot simulation that is faster, inherently differentiable, and easily adaptable to real data. Neural Robot Dynamics (NeRD) pursues this by keeping collision detection analytical and replacing a simulator's numerical dynamics for the robot with a learned model. Three limitations remain. NeRD offers little speedup over the simulator it learned from, accepts contact only at predefined points, and has no two-way coupling with objects it manipulates. FlashNeRD removes all three with a","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32260,"title":"Workhorse: Learning Robust Whole-Body Humanoid Loco-Manipulation from Human Data","url":"https://arxiv.org/abs/2610.09117","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09117v1 Announce Type: new \nAbstract: Humanoid robots still struggle to plan contact-rich whole-body manipulation from egocentric RGB and proprioception. Workhorse learns such manipulation from robot-free human demonstrations. A visual planner predicts five-link targets: the poses of the torso, both wrists, and both feet. A reinforcement-learning whole-body tracker follows them on the robot. Both policies train separately on the same recorded human poses, without retargeting. We augment the training data of each policy to imitate the errors that the other makes at deployment. On a r","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32259,"title":"MimicX: Policy-in-the-Loop Supervision Refinement for Video-Driven Humanoid Motion Tracking","url":"https://arxiv.org/abs/2610.09055","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09055v1 Announce Type: new \nAbstract: Human videos provide rich motion targets for humanoid learning, yet visually plausible references can still produce persistent failures under physics-based execution. These failures reveal where training supervision should change. We present MimicX, a policy-in-the-loop framework that uses execution feedback to refine video-driven humanoid motion tracking. Starting from reconstructed and retargeted motion, MimicX localizes difficult transitions and affected body regions, then jointly adapts tracking objectives and the reset curriculum for policy","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32258,"title":"PhysEvo: Astra Can Act, Let It","url":"https://arxiv.org/abs/2610.08995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08995v1 Announce Type: new \nAbstract: Astra can act, yet reliable manipulation depends on the system through which it observes and controls the world. We introduce PhysEvo, a framework for physical recursive self-improvement (RSI) around a single frozen model. A task agent executes robot tasks; a meta-agent uses the resulting trajectories to diagnose failures, revise tools and skills, and test corrections. The meta-agent can also improve its own diagnostic tools, so retained revisions support both later action and later self-improvement. This process develops joint-level control, ev","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32257,"title":"HULK: Learning Whole-Body Forceful Loco-Manipulation for Humanoids","url":"https://arxiv.org/abs/2610.08970","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08970v1 Announce Type: new \nAbstract: Humanoid loco-manipulation of large, heavy objects demands forceful interaction across the entire body. However, such payloads shift a humanoid's center of mass and impose sustained loads across the upper body, challenging balance and command tracking. We present HULK, a whole-body control framework for forceful loco-manipulation. Using model predictive control (MPC) to guide reinforcement learning with predictions of the loaded dynamics, we train two teachers: one tracks arm motions under wrist forces, and the other locomotes while holding larg","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32256,"title":"Toward Evidence-Driven Human-Agent-Robot Teaming for Earth-Independent Anomaly Triage","url":"https://arxiv.org/abs/2610.08933","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08933v1 Announce Type: new \nAbstract: Deep-space crews cannot rely on real-time ground support for urgent off-nominal events. Initial alerts may underdetermine cause, while discriminating evidence may reside in crew observations or at locations that are unsafe, costly, or unavailable for crew inspection. We present an evidence-driven architecture for human-agent-robot teaming in Earth-independent anomaly triage. Agentic AI is treated as a stateful coordinator over bounded, inspectable services rather than as a fully autonomous vehicle controller. A triage state manager maintains hyp","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32255,"title":"From Wearable Interfaces to Dexterous Policies: Contact Shifts and Tactile Representations","url":"https://arxiv.org/abs/2610.08870","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08870v1 Announce Type: new \nAbstract: Unlike conventional teleoperation, wearable interfaces allow operators to collect dexterous demonstrations through their own hand motions while directly interacting with task objects. This direct interaction reduces dependence on the target robot during collection, but it also makes the collection hardware part of the physical process that generates each demonstration. Interface geometry can influence both how a task is performed and what tactile observations are recorded for learning. We study two versions of a DexUMI-family exoskeleton that sh","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32254,"title":"CIRRA: Dual-Level Continual Instruction Reconciliation with Ongoing Execution for Embodied Robot Agents in Interactive Household Tasks","url":"https://arxiv.org/abs/2610.08862","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08862v1 Announce Type: new \nAbstract: Household robots must accommodate new user instructions while executing ongoing tasks. Existing agents often regenerate or extensively revise the remaining task sequence, introducing plan ambiguity, logical inconsistency, and redundant execution. We formulate continual instruction reconciliation and propose CIRRA (Continual Instruction Reconciliation for Robot Agents), a dual-level framework combining LLM-based semantic reasoning with rule-constrained structural integration. CIRRA first grounds incoming instructions to unique executable skills a","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32253,"title":"Autonomous Droplet Navigation via Model-Based Reinforcement Learning: Zero-Shot Transfer and Emergent Dynamics","url":"https://arxiv.org/abs/2610.08852","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08852v1 Announce Type: new \nAbstract: Self-driving laboratories (SDLs) are transforming chemical and materials discovery through closed-loop automation, yet automated infrastructure for physical manipulation of soft, deformable matter remains beyond current robotic platforms. A critical instance is autonomous droplet transport on an open surface, where contact-angle hysteresis, capillary pinning, and surface heterogeneity produce partially observable dynamics that pose significant challenges for classical model-based controllers. We introduce the first robotic platform for closed-lo","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32252,"title":"Taming an End-to-End Autonomous Driving Policy for Urban Navigation of Quadruped Robots","url":"https://arxiv.org/abs/2610.08812","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08812v1 Announce Type: new \nAbstract: We present Go2-DrivoR, a goal-conditioned adaptation of the end-to-end autonomous driving trajectory planning framework DrivoR for urban navigation with quadrupedal robots. By conditioning trajectory generation on a local-frame subgoal through a goal token and adapting the vehicle-centric scoring formulation, the method extends DrivoR to short-horizon goal-conditioned local planning without redesigning its core decoders. Specifically, we redefine drivable-area compliance for sidewalk-oriented navigation and reformulate the original ego progress","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32251,"title":"Context-Aware Adaptive Pesticide Spraying for Agricultural Robots under Changing Weather and Terrain Using Vision-Language Models","url":"https://arxiv.org/abs/2610.08807","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08807v1 Announce Type: new \nAbstract: Precision pesticide spraying is essential for optimizing application efficiency and ensuring uniform chemical distribution. Spraying performance is influenced by multiple factors, including environmental conditions such as temperature and wind speed, pesticide type, and the robot's capability to accurately perceive crops and target spray locations. Existing approaches predominantly emphasize crop detection and rely on predefined spraying parameters, whereas human operators dynamically adjust their spraying strategies by considering environmental","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32250,"title":"SAFE: Unified Slip and Fracture Detection with Low-Cost Acoustic Sensing in Robotic Grasping","url":"https://arxiv.org/abs/2610.08802","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08802v1 Announce Type: new \nAbstract: Manipulating fragile objects remains challenging as robots must understand the state of what they grasp, such as slip or fracture, to respond appropriately, especially when material properties are unknown. In this paper, we present SAFE: a low-cost, general-purpose sensing approach that detects both slip and fracture in real time using two passive polyvinylidene fluoride (PVDF) acoustic sensors and motor proprioception, without relying on vision or prior material knowledge. The sensors are mounted on a compliant Fin Ray gripper, and a unified Hi","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32249,"title":"A Review Of Robotic World Models For Dynamic Environments Based On Factor And Scene Graphs","url":"https://arxiv.org/abs/2610.08800","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.08800v1 Announce Type: new \nAbstract: Models based on graphs have emerged in robotics as a powerful foundation for internal world representations, where factor and scene graphs are among the most prominent model types found in the related literature and in successful robotic solutions. Initially, many of these models were assuming static environments as a simplification. Herein, factor graphs mainly provide uncertainty-aware geometric estimations while scene graphs enable a structured semantic abstraction. However, real-world robotic environments are often dynamic, posing severe cha","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32271,"title":"特斯拉Optimus前AI负责人创业研发工业机器人|ChatGPT|机器人赛道|强化学习|AI人才|离职 - 新浪新闻","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTE5ydEtXZHdFc0JzM25uTG5YZUtjNGZmd1NRQ1pPS3V6MTBYZkZrcWFlQVZ4V0phR1Rha3J3a0d1WDZnYVFsWGVYaVdfY00tLVN0Nm16QXFDMHl2bWJvUndpOG5yaEJJZDNmNmJxRkdOOF9HRE1KUTJpMmFSVkUxV00?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMif0 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
