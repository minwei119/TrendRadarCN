题\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003esohu.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-04T00:08:00"},{"id":17005,"title":"95 后投资者利用 AI 批量生成虚假消息趁机交易牟利，被罚 48.5 万元","url":"https://www.ithome.com/0/985/294.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ef1a\"\u003eIT之家 8 月 4 日消息，四川证监局昨日公布的一则行政处罚决定书，“95 后”个人投资者孙某因利用 AI 工具批量编造传播某上市公司纯碱生产锅炉故障的虚假信息并趁机交易获利，被没收违法所得 8.5 万元，并处罚款 40 万元，合计罚没约 48.5 万元。\u003c/p\u003e\u003cp data-vmark=\"d384\"\u003eIT之家参考通报获悉，孙某控制着一个名为“帝侃”的百度百家账号，2023 年 11 月，他利用 AI 在两天连发 17 篇关于纯碱生产的虚假信息，相应文章发布后阅读量较大、传播范围较广。\u003c/p\u003e\u003cp data-vmark=\"75ba\"\u003e后续，A 公司委托律师事务所向孙某出具《律师函》，称自 2023 年起，孙某以名为“帝侃”的百度百家账号先后在百度百家编造发布图文、视频虚假信息，要求孙某立即停止捏造传播虚假信息。孙某编造、传播上述虚假信息的行为对投资者具有明显误导性，扰乱了期货市场。而且，孙某在编造并传播虚假信息期间存在交易纯碱期货合约的行为，\u003cstrong\u003e扣除手续费交易实际获利约 8.5 万元\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"5172\"\u003e四川证监局认为，孙某存在未经核实的情况下编造并公开传播多篇含有虚假信息的文章的行为，其编造并传播虚假信息的主观故意明显，客观上也破坏了期货市场正常信息传播秩序。\u003c/p\u003e\u003cp d","tags":[],"cluster_size":1,"ts":"2026-08-04T00:06:54"},{"id":17006,"title":"又一国产模型重磅开源，有声视频编辑全球第一，16家芯片及平台首日适配 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE5PYjkyZWZDZDNZTFNEQUtKaldQQXM4aWc2RXBvaHhPTU1jWEw5TE56M09oc2Nmd2VaNVIyNTNJeW1PYWw2VDhyZUprc1Y2clk?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE5PYjkyZWZDZDNZTFNEQUtKaldQQXM4aWc2RXBvaHhPTU1jWEw5TE56M09oc2Nmd2VaNVIyNTNJeW1PYWw2VDhyZUprc1Y2clk?oc=5\" target=\"_blank\"\u003e又一国产模型重磅开源，有声视频编辑全球第一，16家芯片及平台首日适配\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-03T23:57:14"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#7c3aed","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles": ential for collision-free robotic motion planning, yet most existing methods rely on predefined reference paths, which bias corridor geometry and implicitly limit the homotopy classes that can be explored. We propose a reference-path-free corridor generation framework on graphs of convex sets (GCS) that constructs corridors directly as sequences of convex sets, allowing corridor structure to emerge from the free-space representation rather than from a guiding path. To reason about similarity among corridors, we ex","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16695,"title":"Tri-Space Operational Control of Redundant Multilink and Hybrid Cable-Driven Parallel Robots Using an Iterative-Learning based Reactive Approach","url":"https://arxiv.org/abs/2607.29500","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29500v1 Announce Type: new \nAbstract: Cable-Driven Parallel Robots (CDPRs) are a type of parallel mechanism in which cables are used as actuators. Due to the two levels of redundancy and numerous constraints within the CDPR actuation, joint and operational spaces (together known as the tri-space), tracking a given trajectory in the operational space while satisfying constraints in tri-space simultaneously is challenging. To the best of the authors' knowledge, there does not exist any tri-space control framework, which is robust, effective, and directly applicable to several architec","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16694,"title":"Temporal Policy: History-Initialized Action Generation for Robotic Learning from Demonstration","url":"https://arxiv.org/abs/2607.29482","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29482v1 Announce Type: new \nAbstract: By relying on independent couplings from uninformative Gaussian priors, standard diffusion and flow matching models are forced to learn complex, high-cost vector fields to reach the physical action space. Generative models excel at capturing multimodal behaviors for robotic Learning from Demonstration (LfD), but often suffer from high inference cost. This paper introduces Temporal Policy, a generative framework based on stochastic interpolants that formulates action generation as a temporally coupled transport problem. By initializing the genera","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16693,"title":"Automated Straight-line Sewing of Stretchable Fabrics with Different Lengths","url":"https://arxiv.org/abs/2607.29464","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29464v1 Announce Type: new \nAbstract: Different Length Alignment Sewing (DLAS), which involves stretching the shorter fabric to match the longer one and sewing them together in a straight line, is a challenging task that needs to satisfy several requirements when automating the sewing process. To address the challenges, this research proposes a novel robotic sewing system, Different Length Robotic Sewing System (DLRoSS), which consists of a roller type end-effector, attached to a 6-DoF manipulator. The end-effector composed of active shorter and longer fabric rollers, and a passive","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16692,"title":"AquaJEPA: Action-Conditioned Multimodal Predictive Representations for Underwater Robot Dynamics","url":"https://arxiv.org/abs/2607.29393","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29393v1 Announce Type: new \nAbstract: Underwater robots combine complementary sensors whose reliability changes abruptly with water visibility, viewpoint, and vehicle motion. We introduce AquaJEPA, an action-conditioned joint-embedding predictive model that fuses an RGB camera, forward-looking sonar, and proprioception with explicit sensor validity. It predicts a future latent target conditioned on eight-thruster commands and supplies velocity and sonar-profile predictions to a shared receding-horizon planner. We study the method in Stonefish against reactive, state-only, ordinary m","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16691,"title":"BWM: A Low-Cost High-Fidelity World Simulator for Robot Learning","url":"https://arxiv.org/abs/2607.29302","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29302v1 Announce Type: new \nAbstract: Reliable robot learning requires a world simulator that can predict action consequences before execution on physical hardware, including risky and failure-prone outcomes. Existing physics simulators require substantial asset construction and calibration and still face a sim-to-real gap, while video generators often lack precise control over their responses to fine-grained robot actions. In this paper, we present the Boundless World Model (BWM), an open-source, low-cost, high-fidelity world simulator for robot manipulation. BWM is an action-condi","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16690,"title":"TRACT: Temporally Routed Action Chunks with Chronological Phase Authority for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2607.29285","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29285v1 Announce Type: new \nAbstract: Action chunking shortens the effective decision horizon of robot imitation learning by predicting multiple future actions, while conventional phase conditioning describes the current control instant. When a predicted horizon crosses a procedural boundary, assigning the current phase to the entire chunk creates a structural temporal mismatch. We present TRACT, which factorizes phase-structured action chunking into an accepted current phase and a single CURRENT-to-NEXT boundary inside the future horizon. A task-local graph constrains chronological","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16689,"title":"FBFM: A Training-Free Asynchronous Feedback Mechanism for Flow-Matching in World-Action Models Execution","url":"https://arxiv.org/abs/2607.29235","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29235v1 Announce Type: new \nAbstract: Although world-action models (WAMs) enhance long-horizon robot control by predicting visual evolution before acting, long-horizon reliability demands repeated re-grounding in real observations--not recursive rollout. Existing WAMs address this by refreshing history or KV cache with ground-truth data between chunks. However, such chunk-wise feedback operates at a coarse temporal granularity and thus fails to correct prediction errors at the individual time-step level. To address this, we propose Feedback Flow Matching (FBFM), a training-free infe","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16688,"title":"TacPrint: A Wearable Fingertip Tactile Sensor for Human-to-Robot Contact Reproduction","url":"https://arxiv.org/abs/2607.29231","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29231v1 Announce Type: new \nAbstract: Human-centric data collection is emerging as a significant paradigm for robot skill acquisition, but seamlessly integrating low-cost, scalable tactile sensing systems that capture fine-grained fingertip interactions without compromising natural operation remains a key challenge. This reduces the reliability of human-to-robot transfer in contact-rich tasks. In this work, we present TacPrint, a wearable fingertip tactile sensor, where protrusions on the inner surface of the silicone skin are aligned one-to-one with 24 capacitive taxels to enable l","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16687,"title":"Event-Based Upper-Body Humanoid Teleoperation Under Challenging Illumination","url":"https://arxiv.org/abs/2607.29227","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29227v1 Announce Type: new \nAbstract: We present a real-time upper-body human-to-humanoid motion imitation framework driven by neuromorphic event-based vision. This work addresses practical perceptual bottlenecks of conventional frame-based RGB sensors, specifically their difficulty in high dynamic range (HDR) scenes and rapid motions due to fixed integration times. By leveraging the Prophesee EVK4 event camera, which operates asynchronously with high temporal resolution and a dynamic range exceeding 120 dB, our system supports stable tracking in conditions where standard vision pip","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16686,"title":"MROPE: A Multi-Robot Safe Cooperative Strategy via combined Predictive Safety Filters and Ellipse-based Constraint Compression","url":"https://arxiv.org/abs/2607.29203","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29203v1 Announce Type: new \nAbstract: Deploying drone swarms to track a dynamic target in cluttered environments presents severe computational and safety challenges. We propose MROPE, a hierarchical strategy that decouples the cooperative monitoring mission from strict local safety requirements. To overcome the computational bottlenecks typical of dense spaces, our approach dynamically aggregates complex obstacle geometries into a single safe bounding ellipse for each drone. Methodologically, this architecture is realized by combining distributed aggregative optimization for high-le","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16685,"title":"CLIFT: Turning Gemini Robotics On-Device into Humanoid Specialists via Non-Invasive Closed-Loop Iterative Fine-Tuning","url":"https://arxiv.org/abs/2607.29172","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29172v1 Announce Type: new \nAbstract: While robot foundation models are growing increasingly capable, the strongest models are typically trained on proprietary data and remain closed-source, limiting downstream users' ability to adapt them to new tasks, embodiments, and deployment settings. Following the LLM community, an emerging access paradigm for closed-weight robot foundation models is the managed supervised fine-tuning (SFT) API, where users submit training data and receive a tuned policy without access to model weights, gradients, or training internals. While such APIs let do","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16684,"title":"ActFovea: Runtime Safeguarding for VLA Policies via Spatiotemporal Visual-Action Consistency","url":"https://arxiv.org/abs/2607.29169","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29169v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies achieve strong performance in robotic manipulation but remain vulnerable to runtime disturbances that break the temporal alignment among visual observations, robot states, and executed actions. We introduce ActFovea, a plug-and-play safeguarding framework that detects and mitigates such failures without retraining or modifying the underlying VLA policy. ActFovea uses robot kinematics, proprioceptive states, and recent actions to construct action-conditioned foveated regions that retain contact-relevant areas","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16683,"title":"D-VLC: Decentralized Vision-Language Collaboration for Heterogeneous Embodied Multi-Robot Systems in Unknown Environments","url":"https://arxiv.org/abs/2607.29009","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.29009v1 Announce Type: new \nAbstract: Multi-robot systems, particularly heterogeneous robot swarms, can improve the efficiency of complex task execution through parallel collaboration and complementary capabilities. However, conventional rule-based methods rely on predefined task models and specialized decision making programs, making it difficult to understand complex semantic instructions and coordinate heterogeneous robots. LLMs introduce strong language understanding and task reasoning capabilities, allowing multi-robot systems to interpret instructions, decompose tasks, and ass","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16682,"title":"Receding-Horizon Next-Best-View Planner for Autonomous Leaf Surface Reconstruction","url":"https://arxiv.org/abs/2607.28995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28995v1 Announce Type: new \nAbstract: Accurate plant leaf modeling is fundamental to downstream tasks such as plant growth monitoring, and phenotyping for yield estimation. Autonomous robotic reconstruction for large-scale field deployment must address limitations on robot planning budget and computation resources while optimizing viewpoint utility for leaf surface reconstruction. Existing approaches either focus on rigid objects, point-cloud coverage or plant reconstruction without fully addressing the system limitations or exploiting task-driven point cloud utility. In this work,","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16681,"title":"ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts","url":"https://arxiv.org/abs/2607.28993","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28993v1 Announce Type: new \nAbstract: World Action Models (WAMs) have emerged as a promising paradigm by jointly modeling robot actions and future visual dynamics. However, their reliance on pixel-generative future supervision can entangle action-relevant state transitions with task-irrelevant visual content, limiting robustness under visual distribution shifts. We identify Training-Distribution Hallucination, a recurring phenomenon in which futures conditioned on visually shifted observations hallucinate training-domain content rather than remain faithful to the current scene. A co","tags":[],"cluster_size":1,"ts":"2026-08-03T04:00:00"},{"id":16680,"title":"Advances, challenges, and opportunities for legged robots","url":"https://arxiv.org/abs/2607.28952","source":"arxiv · cs.RO","sources" // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
