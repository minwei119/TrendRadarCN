）","tags":[],"cluster_size":1,"ts":"2026-07-20T22:39:07"},{"id":12286,"title":"四大险企发声看好资本市场，部分险资逆势加仓","url":"https://wallstreetcn.com/livenews/3137120","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在A股市场剧烈波动下，作为长期资金的险资依旧看好后市投资机会，并且部分险资已逆势加仓。“近期市场回调过快，我们有加仓，而且加仓了科技股。”上海一家万亿级险资机构的权益投资相关负责人说，后续市场回调还会继续寻找合适机会加仓。一家养老险公司投资部总经理告诉记者：“当前我们依旧保持着较高的权益仓位，只是在持仓板块内部做了一些结构性调整。”就具体的超额收益投资机会来看，大部分险资机构依旧看好科技股投资机会。","tags":[],"cluster_size":1,"ts":"2026-07-20T22:31:50"},{"id":12287,"title":"伊朗军方发射多枚导弹，打击科威特境内目标Camp Arifjan（阿里夫坚军营）。（伊朗官方媒体IRIB）","url":"https://wallstreetcn.com/livenews/3137118","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"伊朗军方发射多枚导弹，打击科威特境内目标Camp Arifjan（阿里夫坚军营）。（伊朗官方媒体IRIB）","tags":[],"cluster_size":1,"ts":"2026-07-20T22:26:00"},{"id":12288,"title":"接力回购+理性发声，券商多管齐下提振市场信心","url":"https://wallstreetcn.com/livenews/3137115","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，A股市场持续震荡调整，市场情绪阶段性走弱。面对市场短期波动，各大券商不仅拿出真金白银回购股份，还端出研究“干货”，多管齐下稳定市场预期。7月18日至20日，华安证券、国联民生、红塔证券、中泰证券先后披露回购相关公告，加上此前已进入实施阶段的国金证券，年内上市券商回购阵营持续扩容。下一步该怎么做？不恐慌“割肉”，也不盲目抄底，是券商趋于一致的回答。对于市场调整后的操作策略，多家券商建议投资者控制仓位、均衡配置、审视持仓逻辑。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-20T22:22:05"},{"id":12289,"title":"多只宽基ETF成交放量，增量资金积极布局A股市场","url":"https://wallstreetcn.com/livenews/3137113","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"资金持续借道股票型ETF入市。7月20日，多只宽基ETF尾盘放量，成交额创下2024年10月中旬以来的新高。从资金流向看，7月以来，股票型ETF净流入超3200亿元，宽基ETF成为资金配置的重要方向。与此同时，中国诚通和中国国新均公告大举增持A股，基金公司也公告自购计划。从基金经理最新观点看，当前积极看多科技主线，同时关注低估值传统行业公司。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-20T22:19:50"},{"id":12290,"title":"央企领衔，一日百余家公司公告回购增持新动作","url":"https://wallstreetcn.com/livenews/3137111","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月20日，全天逾百家上市公司密集披露股份回购、股东增持计划及最新实施进展。此外，中国平安、中国人保、中国太保、新华保险也相继公告称，将加大投资力度，坚定支持资本市场发展。Wind数据显示：今年7月以来，A股市场约103家公司披露回购计划，金额上限超过160亿元；新增58家公司的增持计划，金额上限超过100亿元。尤其是央企控股上市公司，在本轮回购增持热潮中投入真金白银，为市场注入信心与活力。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-20T22:18:07"},{"id":12291,"title":"上证报头版文章：三季度货币政策宽松空间或进一步打开","url":"https://wallstreetcn.com/livenews/3137109","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"行至年中，中国人民银行在货币政策委员会2026年第二季度例会上明确了下半年货币政策总体思路。中国人民银行副行长邹澜近日在国新办新闻发布会上表示，下半年，货币政策将根据国内外经济金融形势和金融市场运行情况，强化逆周期和跨周期调节。分析人士认为，物价走势、经济基本面、海外主要经济体货币政策，将成为影响下一阶段我国货币政策操作的关键因素。随着三季度政府债券发行提速，货币政策宽松空间或进一步打开，以协同财政政策发力、托举宏观经济向好。","tags":[],"cluster_size":1,"ts":"2026-07-20T22:13:01"},{"id":12292,"title":"每日跳空缺口排名星期一：BABA、HDB、LITE等 - Moomoo","url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxOWm9mcWI2RmNLV2VXMGZMaUxKQ3NJcVpiVWt0WkI1cF95TVFoeVYxSkxJOEpzUkwxTGpLWEtscE9IUFBhclVnYXcwOVlWcmRaMlJJNFdtRzdIeXhYYVl3THJLM2xBbVhGSGJydmhsaU90STRUamJPM19LYzU1dy1HcWF5MGplZlNUQVBiamxXR0k0ejN1UkxN?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMilwFBVV95cUxOWm9mcWI2RmNLV2VXMGZMaUxKQ3NJcVpiVWt0WkI1cF95TVFoeVYxSkxJOEpzUkwxTGpLWEtscE9IUFBhclVnYXcwOVlWcmRaMlJJNFdtRzdIeXhYYVl3THJLM2xBbVhGSGJydmhsaU90STRUamJPM19LYzU1dy1HcWF5MGplZlNUQVBiamxXR0k0ejN1UkxN?oc=5\" target=\"_blank\"\u003e每日跳空缺口排名星期一：BABA、HDB、LITE等\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-20T22:06:43"},{"id":12293,"title":"智赋新质，全域焕新。中国移动就是这样发力的 - 手机网易网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9QZ3lMNTNLMlQtTXo1aXNvcHdudU9pV2ZpUXpUaHB1elh6c0hNQjZWNU9GNXQ5TEhwMklfdDBRX0luTmNDOVBEMS1adWJDZUw1cDVyMXVVd05aYkVrWUVWLXRB?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9QZ3lMNTNLMlQtTXo1aXNvcHdudU9pV2ZpUXpUaHB1elh6c0hNQjZWNU9GNXQ5TEhwMklfdDBRX0luTmNDOVBEMS1adWJDZUw1cDVyMXVVd05aYkVrWUVWLXRB?oc=5\" target=\"_blank\"\u003e智赋新质，全域焕新。中国移动就是这样发力的\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-20T21:25:45"},{"id":12294,"title" db9\" style=\"text-align: justify;\"\u003e北京时间 7 月 21 日，据彭博社报道，智谱已经完成了一座大型数据中心的建设，该数据中心\u003cstrong\u003e全部采用中国国产芯片\u003c/strong\u003e。这是中国在未来 AI 发展中替代受限的英伟达芯片所采取的重要一步。\u003c/p\u003e\u003cp data-vmark=\"6d88\"\u003e据知情人士透露，\u003cstrong\u003e智谱已开始部分运营这座 1 吉瓦的数据中心\u003c/strong\u003e，该中心旨在帮助这家中国公司开发其前沿的 GLM 平台。1 吉瓦的电力足以在任何时刻为约 75 万户家庭供电。该人士表示，智谱现已建成或运营多个计算集群，每个集群均配备超过 1 万块芯片。\u003c/p\u003e\u003cp data-vmark=\"cfbc\"\u003e按照这一规模，\u003cstrong\u003e智谱的数据中心将成为中国 AI 公司所建设的最大规模服务器枢纽之一\u003c/strong\u003e。目前，阿里巴巴和中国电信等云服务提供商被公认为计算基础设施的最大建设方，因为这不仅需要投入数十亿美元用于批量采购高端服务器，还需要确保稳定的电力和水供应。\u003c/p\u003e\u003cp data-vmark=\"8b24\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/ce827083-b","tags":[],"cluster_size":1,"ts":"2026-07-21T01:00:37"},{"id":12601,"title":"WAIC不止有大模型和机器人，还有拿着简历的年轻人 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNLXdHeVcyd09EOEwwMUNHWWtaTDhtcnd6TDlPWHJBd1hFcTVCdElxcFB2bl94VnFiS2FxNWk1TVVhX2RtaGc5bWNwNF8wcjJONVBuNHFLZlJsd3BVbVQ5YVI2OEI4N1FPZ1Jkc0RLUVVkQlQ3STNxby1oRWV4VFNJczIwcUJPejlQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNLXdHeVcyd09EOEwwMUNHWWtaTDhtcnd6TDlPWHJBd1hFcTVCdElxcFB2bl94VnFiS2FxNWk1TVVhX2RtaGc5bWNwNF8wcjJONVBuNHFLZlJsd3BVbVQ5YVI2OEI4N1FPZ1Jkc0RLUVVkQlQ3STNxby1oRWV4VFNJczIwcUJPejlQ?oc=5\" target=\"_blank\"\u003eWAIC不止有大模型和机器人，还有拿着简历的年轻人\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-21T00:59:15"},{"id":12602,"title":"OpenAI场外交易再度火热，估值溢价10%成交 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNendjU2JHUG1vYmRZS2JqcWtReG1FcHdmMmpRYUNTek5oR1ZRU1Q0M004S0dpQW1yS1RUSWdXY2dJWG5WSTRUbHVfQ1UxNk04OHowU3Jia1Vsd2dRMTVFSkQ5MFh2TU02Vzlldk9lZjF1ZXJQWUNwY3hWRk5NYTU3RG1HNmVzVGtMeklFSA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBM 经铺设完成但尚未启用的光纤线路，用户可以租用或购买这些线路，并根据自身需求部署传输设备。与直接购买运营","tags":[],"cluster_size":1,"ts":"2026-07-21T00:08:25"},{"id":12618,"title":"2026年二季度AI应用价值榜发布：头部大模型下载量下滑，AI购物成新增长极 - 证券时报","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE04N0pPaVdPN0RHMkgzclBETENINVZvN3NFSjNnVk1wcjR3RGhIYVFNSWlLY2c5dXpvc1dQVVEzM1BjUXA2MFZOUHVpYUtlWmZHRlY5S25KbkxCekRN?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXEFVX3lxTE04N0pPaVdPN0RHMkgzclBETENINVZvN3NFSjNnVk1wcjR3RGhIYVFNSWlLY2c5dXpvc1dQVVEzM1BjUXA2MFZOUHVpYUtlWmZHRlY5S25KbkxCekRN?oc=5\" target=\"_blank\"\u003e2026年二季度AI应用价值榜发布：头部大模型下载量下滑，AI购物成新增长极\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券时报\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-21T00:07:00"},{"id":12619,"title":"上任仅 3 个月，美国 AI 测试机构负责人克里斯 · 福尔宣布辞职","url":"https://www.ithome.com/0/979/288.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"019a\"\u003eIT之家 7 月 21 日消息，据路透社 21 日（今天）报道，美国商务部下属 AI 测试机构 —— 美国人工智能标准与创新中心再次出现人事变动，中心主任克里斯 · 福尔上任仅 3 个月便宣布辞职。\u003c/p\u003e\u003cp data-vmark=\"51af\"\u003e美国商务部发言人表示，负责管理中心的商务部办公室负责人、前普渡大学工程学院院长阿尔温德 · 拉曼将暂时接替福尔。\u003c/p\u003e\u003cp data-vmark=\"7d82\"\u003e福尔离任反映出美国政府的 AI 政策仍在不断转向。特朗普 2025 年再次就任美国总统时曾提出，联邦政府应尽量减少对科技行业的干预。此后，美国政府开始\u003cstrong\u003e更加主动地监管 AI\u003c/strong\u003e，然而特朗普的公开言论和政策方向\u003cstrong\u003e几乎每周都可能发生变化\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"262b\"\u003e美国人工智能标准与创新中心负责与 Anthropic、谷歌 DeepMind 和 OpenAI 等领先 AI 实验室合作，在模型正式发布前测试安全漏洞。中心官网显示，科学家和工程师主要\u003cstrong\u003e负责评估先进 AI 模型带来的“可证明风险”\u003c/strong\u003e，防止美国对手利用 AI 开发化学或生物武器，或破坏美国 AI 模型使用的训练数据。\u003c/p\u003e\u003cp data-vmark=\"7958\"\u003e据IT之","tags":[],"cluster_size":1,"ts":"2026-07-20T23:58:47"},{"id":12620,"title":"华强北内存条价格回落：16GB DDR5 降至 1080~1200 元，较高点下跌近三成但较去年同期仍高出五六倍","url":"https://www.ithome.com/0/979/285.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"9d75\"\u003eIT之家 7 月 21 日消息，进入 7 月以来，全球存储芯片板块经历了一轮剧烈回调。美股与韩国股市中的存储芯片龙头股集体下挫，二级市场的剧烈波动正在向终端传导。\u003c/p\u003e\u003cp data-vmark=\"67c3\"\u003e深圳商报记者 7 月 17 日走访深圳华强北电脑硬件交易市场发现，自 2025 年下半年以来持续攀升的内存及电脑硬件价格，近期终于出现松动迹象。不过，今年暑期装机成本仍处于近年来的高位。\u003c/p\u003e\u003cp data-vmark=\"c48b\"\u003e一位在华强北经营电脑组装生意长达 20 年的商户告诉记者，今年暑假是他从业以来经历的“最贵组装电脑季”。“跟去年暑假相比，除了主机外壳没有涨价，其他都涨了，其中内存涨了约五倍，”“往年暑假学生来组装一台电脑，两千多元就可以搞定，现在最少要 4000 元，价格涨了约一倍。比较好的游戏电脑，现在要 1 万元起步。”“除了学生客户就是企业客户，现在只有刚需才会来买电脑”。\u003c/p\u003e\u003cp data-vmark=\"03d2\"\u003e品牌电脑方面同样承受了涨价压力。自 6 月 25 日起，苹果 MacBook 涨价 900 元至 3000 元；从 7 月 1 日起，联想多款笔记本涨价 1000 元，荣耀 MagicBook Pro 涨价 500 元。华强北一家品牌电脑门店店员告诉记者：“7 月初品牌电脑又涨价一轮，涨价之","tags":[],"cluster_size":1,"ts":"2026-07-20T23:50:29"},{"id":12621,"title":"“Apple Store 之父”罗恩 · 约翰逊：乔布斯之所以出色，是因为他懂得放权","url":"https://www.ithome.com/0/979/283.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"6180\"\u003eIT之家 7 月 21 日消息，据《商业内幕》20 日报道，曾参与打造 Apple Store 零售店和 Genius Bar 天才吧、后来担任 JCPenney 首席执行官的苹果前高管罗恩 · 约翰逊表示，没有人喜欢事事插手的管理者。苹果联合创始人史蒂夫 · 乔布斯能够成为出色的领导者，\u003cstrong\u003e恰恰是因为他懂得放权\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"cd30\"\u003e约翰逊希望，自己将于 9 月出版的新书《非同凡“购”：零售如何展现苹果的天才之处（Shop Different: How Retail Revealed Apple's Genius）》能够纠正外界对乔布斯领导方式的误解。部分人以为乔布斯“痴迷”于每个细节，事实并非如此。“他确实重视细节，但我从未遇到过\u003cstrong\u003e比他更善于授权的领导者\u003c/strong\u003e。”\u003c/p\u003e\u003cp data-vmark=\"942a\"\u003e约翰逊早在 20 世纪 90 年代便已在零售业打响名气。当时，他与设计师迈克尔 · 格雷夫斯帮助塔吉特推出大型设计师联名项目，让塔吉特迅速获得市场关注。约翰逊表示，成功案例\u003cstrong\u003e引起了乔布斯的注意\u003c/strong\u003e，当时苹果正准备建立自有零售体系。\u003c/p\u003e\u003cp data-vmark=\"4820\"\u003eIT之家从报道中获悉，2000 年加入苹","tags":[],"cluster_size":1,"ts":"2026-07-20T23:41:06"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#059669","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":12397,"title":"llama.cpp b10075 Packs Four Local AI Runtime Upgrades - techi.com","url":"https://news h spatial resolution, establishing a pr","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12390,"title":"A Task-Space Receding Horizon Controller for Fast Collision Avoidance","url":"https://arxiv.org/abs/2607.15733","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15733v1 Announce Type: new \nAbstract: Real-time collision avoidance for robotic manipulators requires fast reactions to unexpected obstacle motion and lookahead to avoid becoming trapped by near-future constraints. Full model predictive control can provide this foresight, but its online cost may grow quickly with horizon length, model fidelity, and the number of active geometric constraints. Conversely, horizon-free reactive methods are computationally efficient but can be short-sighted in dynamic clutter. We present a task-space receding-horizon controller that uses a short contact","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12389,"title":"AC-VLA: Robust Out-of-Distribution Action Execution via Compositional Learning","url":"https://arxiv.org/abs/2607.15714","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15714v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models excel at end-to-end robotic manipulation but struggle with out-of-distribution (OOD) generalization when familiar sub-tasks are recombined in unseen configurations. We identify two mutually reinforcing failure modes: \\emph{trajectory overfitting}, where models overfit to holistic trajectory patterns rather than compositional sub-skill semantics; and \\emph{perceptual shortcut}, where action tokens over-rely on wrist-view textures at the expense of global spatial grounding. To address both, we introduce \\textbf{","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12388,"title":"Implicit Virtual Leader: Decentralized Vision-Only Relative Pose Estimation for Multi-Robot Formations","url":"https://arxiv.org/abs/2607.15708","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15708v1 Announce Type: new \nAbstract: Classical leader-follower formation control suffers from single points of failure and error propagation, and relies on absolute localization sensors that are ill-suited for GPS-denied environments. We address these limitations by introducing a fully decentralized, vision-only relative pose estimation framework based on Graph Neural Networks (GNNs). The key idea is the implicit virtual leader (IVL): a non-physical formation reference frame that is not tied to any individual robot but is implicitly learned within the GNN using only monocular image","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12387,"title":"RAVEN: Reinforcement-Adaptive Visibility-Graph Planning for Robust Humanoid Navigation with Collision-Free MPC","url":"https://arxiv.org/abs/2607.15701","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15701v1 Announce Type: new \nAbstract: Humanoid navigation in dynamic environments requires long-horizon planning while respecting short-horizon dynamic and safety constraints. Classical visibility-graph planners combined with model predictive control (MPC) can efficiently generate collision-free trajectories, but their performance depends on manually tuned parameters and accurate system modeling. In real robotic systems, control delays, state-estimation noise, and locomotion uncertainties can cause overshoot and constraint violations even when the nominal path is geometrically optim","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12386,"title":"A Generative Partially Specified Finite State Machine Approach to Complex Behaviour Planning","url":"https://arxiv.org/abs/2607.15674","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15674v1 Announce Type: new \nAbstract: Autonomous robots operating in dynamic environments require behaviour planning systems that combine reactivity, interpretability, and adaptability. While Large Language Models have been successfully integrated with Behaviour Trees for dynamic replanning, Finite State Machines, despite their widespread adoption and computational efficiency, remain unexplored for generative approaches. We propose a Generative Partially Specified Finite State Machine (GPSFSM) neurosymbolic architecture that utilises the symbolic and semantic structure of FSMs, incl","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12385,"title":"Continuously Stable Structure through Plastic Deformation","url":"https://arxiv.org/abs/2607.15659","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15659v1 Announce Type: new \nAbstract: Soft robots have seen widespread adoption in interactive tasks due to their inherent compliance and adaptability. However, these advantages often come at the cost of stability, posing challenges in a dynamic environment. This limitation is especially critical in soft grippers, where instability under acceleration or external disturbances can result in grasp failure. In this study, we present a continuously stable structure through plastic deformation (CSSPD), integrated into a soft gripper. By leveraging the mechanism of plastic deformation, the","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12384,"title":"IMBench: A Benchmark for Intuitive Robotic Manipulation","url":"https://arxiv.org/abs/2607.15641","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15641v1 Announce Type: new \nAbstract: Humans combine reasoning and motor control to solve complex manipulation tasks under diverse constraints. They build an understanding of the physical world that helps them convert reasoning into actions and quickly adapt to new scenes, tasks, and rules. We refer to this capability as intuitive manipulation. Existing benchmarks fail to capture this integration: they evaluate physical reasoning in isolation from execution, or measure policy performance without requiring explicit reasoning. We introduce IMBENCH, a benchmark designed to evaluate int","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12383,"title":"Scalable Open-Source Visuotactile Sensor for 6-Axis Contact Wrench Estimation in Tensegrity Robots","url":"https://arxiv.org/abs/2607.15633","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15633v1 Announce Type: new \nAbstract: This paper presents a scalable, open-source visuotactile sensing system for tensegrity robots that enables six-axis wrench estimation and contact detection. The proposed endcap sensor integrates an elastomeric shell, a 3D-printed thermoplastic polyurethane (TPU) interface, and a rigid base housing an embedded camera and LED illumination ring. A novel gyroid-infill bonding technique is introduced to form a durable elastomer-TPU interface without adhesives, yielding a lightweight and modular design compatible with large-scale tensegrity structures","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"},{"id":12382,"title":"AEGIS: Assay-Aware Protocol Validation and Runtime Monitoring for Open-Source Liquid Handling Robots","url":"https://arxiv.org/abs/2607.15620","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.15620v1 Announce Type: new \nAbstract: Self-driving laboratories increasingly rely on low-cost liquid handlers such as the Opentrons OT-2, which ship without the pressure-based aspiration monitoring of Hamilton or Tecan systems and are typically run open-loop. Two failure modes go undetected: protocols that are syntactically valid but violate assay-specific invariants (e.g., tip reuse between a PCR template and a no-template control), and physical execution failures (partial dispense, air bubbles, missing tips) at runtime. We present AEGIS, a two-layer guardian for both. Layer 1 pair","tags":[],"cluster_size":1,"ts":"2026-07-20T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
