JMMDhUMUQySXN0THJWTlZoaHpkdVduMkhKam9OelZzejFINFp1eTZrWTBfMllDblk3dUo1WWpvRDdCWFRlRFcwQU5CdGFzdHB2WGdiZGJXVE1xb0dDZ1JldlZaUGk?oc=5\" target=\"_blank\"\u003eCognizant expands Google Cloud partnership amid internal","tags":[],"cluster_size":1,"ts":"2026-10-22T04:04:16"},{"id":35706,"title":"RL-IF: Tracking Non-local Training Data Influence for Online Reinforcement Learning","url":"https://arxiv.org/abs/2610.28883","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28883v1 Announce Type: new \nAbstract: Online reinforcement learning (RL) has achieved significant success in decision-making tasks, but modern online RL remains highly sensitive to the quality of training experience. Understanding the contribution of individual training instances is therefore central to data-centric RL, with applications ranging from experience selection to policy interpretation. Existing data attribution methods for online RL primarily focus on local influence within a single training round, overlooking the non-local data influence across multiple training rounds.","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35705,"title":"LEAN: Loss-Engineered Modulation of the Model Weight-Sensitivity Distribution for Efficient, Error-Tolerant Neural Networks","url":"https://arxiv.org/abs/2610.28872","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28872v1 Announce Type: new \nAbstract: The weights of a trained network do not have uniform sensitivity to model accuracy: the 1% most sensitive weights carry about a fifth of the damage a bit flip can do. This distribution decides the bit-flip tolerance of a model, the fraction of weights a code must cover and the bits each weight needs; existing schemes work with the distribution training leaves. We show that we can systematically modulate or alter the weight sensitivity distribution of a trained model, thereby shifting weights from one sensitivity bin to another. The sensitivity o","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35704,"title":"How Much Gradient Does Truncated Backprop Lose in Looped Transformers?","url":"https://arxiv.org/abs/2610.28871","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28871v1 Announce Type: new \nAbstract: Looped transformers reuse one block of layers many times and are often trained by backpropagating through only the last k loops. We measure how much of the weight gradient this throws away, exactly and for every k from one backward pass, on nine looped language models, and report three findings. First, on a trained model this lost gradient is set near the output: once the loop count is well above k, it barely changes with the loop count (within about 0.03 from 32 to 64 loops on the three models we tested, as a pre-registered test predicted for P","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35703,"title":"A General Topological Symmetry Index for Critical Orbits In Neural Network Loss Landscapes","url":"https://arxiv.org/abs/2610.28864","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28864v1 Announce Type: new \nAbstract: A systematic understanding of the global structure of neural-network loss landscapes remains challenging due to their high dimensionality. Symmetries arising from network architectures and learning objectives provide a way to investigate aspects of this structure. Although a growing number of studies have drawn attention to these symmetries, a systematic characterization of them, as well as of the critical orbits they give rise to, remains incomplete. To address this gap, in this work we establish a topological symmetry index, based on the metho","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35702,"title":"When Do Gaussian Priors Fail? A Latent Geometry Investigation of RL Fine-Tuning","url":"https://arxiv.org/abs/2610.28849","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28849v1 Announce Type: new \nAbstract: Latent diffusion models almost universally place a Gaussian prior on the VAE latent space. For base generation this default is unproblematic; under reinforcement-learning fine-tuning, however, it carries a structural limitation. The standard VAE's KL term does not merely ignore mode structure - it actively taxes separation and tightness. When data are multimodal, the ELBO optimum compresses distinct modes into an overlapping latent. RL fine-tuning amplifies this overlap: the score network is under-resolved on the saddle region between modes, dyn","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35701,"title":"A Mechanistic Study of Automated Failure Attribution in LLM-based Agentic Systems","url":"https://arxiv.org/abs/2610.28811","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28811v1 Announce Type: new \nAbstract: Agentic systems have demonstrated strong capabilities on complex tasks by enabling multiple interacting large language model (LLM)-based agents to collaborate and execute subtasks in parallel. However, this collaborative structure introduces new challenges for reliably evaluating and diagnosing system failures, particularly failure attribution: tracing a system's execution to identify the agent step responsible for an incorrect final outcome. Because manually performing this task is time- and labor-intensive, recent work has turned to LLMs as ju","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35700,"title":"Towards Realistic Models of Change: A Causal Perspective on Decision-Making and Dynamical Systems","url":"https://arxiv.org/abs/2610.28803","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28803v1 Announce Type: new \nAbstract: While statistical learning has made remarkable progress in recent decades, driven by large datasets and data-driven protocols that have transformed scientific practice, it still faces a key limitation: it struggles to generalize beyond the data it has seen, often failing under distribution shift. Causality offers a promising solution: causal models focus on the underlying mechanisms of change rather than surface-level associations, enabling robust reasoning under external interventions. This allows systems not only to learn from data, but also t","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35699,"title":"An Explicit Feedback Contract for Iterative ML-Agent Harnesses","url":"https://arxiv.org/abs/2610.28798","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28798v1 Announce Type: new \nAbstract: Iterative ML agents develop models by editing code, running experiments, reading a validation score, and choosing what to try next. In current harnesses this loop is served by an exact validation score returned after every attempt, which leaves the validation split open to adaptive selection. In this work, we introduce an explicit feedback contract for ML-agent harnesses, which specifies what an agent may observe, when iteration should stop, and when the test split may be touched. The contract releases a validation score only when a submission c","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35698,"title":"CALLIOPE: Private Insights into AI Use, Without Embeddings","url":"https://arxiv.org/abs/2610.28797","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28797v1 Announce Type: new \nAbstract: We introduce CALLIOPE, a top-down framework for discovering topic hierarchies in large corpora of unstructured data (e.g., LLM conversations), while supporting differential privacy (DP). Unlike traditional and even recent LLM-augmented approaches that ultimately rely on clustering vector embeddings, our framework leverages LLM capabilities directly for the entire pipeline. Experiments demonstrate that this approach provides better utility over existing (embedding-based) methods in the DP setting, especially in the high privacy regime. We evaluat","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35697,"title":"ArcFlow: Training Flow Policies for Multiple Solver Budgets","url":"https://arxiv.org/abs/2610.28788","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28788v1 Announce Type: new \nAbstract: Flow-matching policies adjust inference cost through the number of solver steps, but reinforcement learning at a single fixed solver budget can hide degradation at cheaper deployment budgets and even erase useful one-step behavior present in a pretrained policy. We introduce Action-Ratio-Clip Flow (ArcFlow), a deployment-aware algorithm for training one flow policy across a specified range of solver budgets. ArcFlow combines action-aligned supervision, budget exposure, and worst-budget checkpoint selection. For reconstruction objectives, its bri","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35696,"title":"Measure First, Then Allocate: Calibrated Rollout Budgets for MCP Agents in Reinforcement Learning","url":"https://arxiv.org/abs/2610.28785","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28785v1 Announce Type: new \nAbstract: Training tool-using language models requires costly interaction, yet identical rewards within a rollout group provide no group-relative learning signal. We use reward disagreement to guide harness evaluation and the allocation of rollouts for policy training in Model Context Protocol (MCP) environments. We first introduce Discord, which tests harness edits using exact paired inference and decision-preserving early stopping: only disagreeing paired outcomes favor one harness over another. This insight motivates prospective allocation in BRACE (Ba","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35695,"title":"Extreme Low-State Quantized Transformer for Electricity-Load Forecasting","url":"https://arxiv.org/abs/2610.28784","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28784v1 Announce Type: new \nAbstract: Aggressive low-state weight quantization can substantially reduce neural-network representational flexibility, making predictive performance difficult to preserve when only a few discrete weight states are available. We investigate this regime for Transformer-based electricity-load forecasting using 3-, 5-, 7-, and 16-state weight quantization across feed-forward-only and attention-plus-feed-forward quantization. Two tasks predict either the next hour or the next 24 hours from the preceding 48 hours across two co-primary electricity-consumption","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35694,"title":"Second Thoughts: Exploring and Planning through Comparative Imagination in World Models","url":"https://arxiv.org/abs/2610.28779","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28779v1 Announce Type: new \nAbstract: World models let agents compare imagined outcomes before acting, but an agent must still decide which alternatives to explore and when a proposed plan should replace its learned policy. We introduce SDI (Sibling Disagreement in Imagination), which connects these decisions through a shared actor-based reference. SDI compares action sequences imagined from the same model state, using repeated rollouts of the actor's own sequence to measure variation under fixed behavior. This reference scales both the spread across candidate returns, which provide","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35693,"title":"Building a Nested LADDER for LLM Unstructured Post-Training Pruning","url":"https://arxiv.org/abs/2610.28773","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28773v1 Announce Type: new \nAbstract: Non-uniform allocation can improve post-training pruning of large language models, yet quality can still degrade sharply at high sparsity. To control degradation as sparsity increases, we introduce LADDER (Layer-Wise Allocation via Damage-Driven Evaluation and Refinement), which allocates sparsity incrementally. At each step, it evaluates pruning an additional fraction of weights from each eligible layer and commits the layer update that causes the least end-to-end degradation per removed parameter. This process produces non-uniform sparsity pro","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35692,"title":"Motion Equivariant Convolutional LSTM: When Motion Becomes a Gauge Symmetry","url":"https://arxiv.org/abs/2610.28771","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28771v1 Announce Type: new \nAbstract: Objects move, cameras pan, and weather drifts with the wind: much of what changes in sequential data is motion. Motion changes where things are, not what they are, and is therefore a symmetry of the data. Yet standard recurrent networks are not equivariant to it: their memory stays put while the input moves on. Flow equivariant recurrent networks first brought this symmetry into sequence models, for motions of constant velocity, or flows, by enumerating a bank of velocities. We extend this idea in three directions: from simple recurrent networks","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35691,"title":"ReAPO: Retry-Aware Policy Optimization for Efficient Exploration in LLM Reasoning","url":"https://arxiv.org/abs/2610.28770","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28770v1 Announce Type: new \nAbstract: RLVR improves language-model reasoning, but commonly relies on independent stochastic rollouts for exploration, which can repeatedly sample similar failed strategies. Prior work has seen success with approaches that guide exploration by introducing dependence into the sampling process by including incorrect solutions in the context for subsequent attempts. Still, these methods introduce the additional question of how to assign credit to each attempt. We propose to view the credit assignment through the lens of Stochastic Shortest Paths, a framew","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35690,"title":"Offline Apprenticeship Learning for Human-Centric Environments","url":"https://arxiv.org/abs/2610.28716","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28716v1 Announce Type: new \nAbstract: Effective decision-making in human-centric environments such as Intelligent Tutoring Systems (ITSs) and clinical healthcare requires policies that are adaptive, data-efficient, and ethically deployable. Apprenticeship Learning (AL) infers policies directly from expert demonstrations by recovering the underlying reward structure, enabling strictly offline learning without environment interaction. This dissertation develops a progression of offline AL frameworks organized around two challenges: reward modeling and demonstration quality. For reward","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35689,"title":"Big Claims, Small Margins: Do Reported GraphLLM Gains Survive Simple Baselines?","url":"https://arxiv.org/abs/2610.28714","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28714v1 Announce Type: new \nAbstract: LLM-based methods for node classification on text-attributed graphs (TAGs) routinely report state-of-the-art accuracy. We ask how these results compare with inexpensive baselines run on the same splits. On the splits of three recent studies, we tune four baseline representatives with validation-only selection and compare them with the highest mean that each paper reports for an LLM-based method in the matched setting. Correct \u0026 Smooth on TF-IDF features trails this reference by a median of 2.3 percentage points, and an MLP on frozen e5-large-v2","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35688,"title":"STAR-XPC: Set Transformer for Estimating X-ray Transmission in Polymer Composites","url":"https://arxiv.org/abs/2610.28709","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28709v1 Announce Type: new \nAbstract: Evaluating the energy transmission ratio of an X-ray beam through a polymer composite is a challenging task in radiation shielding studies. The reference solution with Monte Carlo transport simulation is highly accurate but computationally expensive: each of our reference simulations is capped at $4\\times10^9$ photon histories and a 20,000 s (over 5 hours) time limit, while closed-form analytical methods fail to represent such complex scenarios. We present an artificial neural network model that maps the unordered multi-set of molecular constitu","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35687,"title":"SimHack: Predicting the onset of detectable reward hacking before RL training","url":"https://arxiv.org/abs/2610.28707","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28707v1 Announce Type: new \nAbstract: When training LLMs to code with reinforcement learning, reward hacking is often detectable but difficult to prevent, since (a) environment hardening is increasingly difficult as training environments grow more complex; and (b) training-time interventions incentivize models to obfuscate hacking behavior to bypass detection.\n  We instead study whether we can predict when detectable reward hacking becomes dominant before executing an RL run, enabling us to select lower-risk recipes in advance. We find that the initial hacking rate alone does not de","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35686,"title":"Scalable Stress-Constrained Topology Optimization: A Super-resolution and Simultaneous Approach Based on Machine Learning","url":"https://arxiv.org/abs/2610.28703","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28703v1 Announce Type: new \nAbstract: Large-scale topology optimization (TO) remains computationally demanding, especially for stress-constrained problems. To address this challenge, we propose the simultaneous neural topology optimization (SNTO) framework where we represent state, adjoint, and design variables with custom neural networks (NNs) whose parameters are jointly optimized within a single optimization loop that leverages continuous adjoint analysis and automatic differentiation. This optimization minimizes a multi-component loss function that combines the design objective,","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35685,"title":"Reinforcement learning for hardware acceleration and system-level optimization on FPGA and integrated-circuit platforms: A survey","url":"https://arxiv.org/abs/2610.28699","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28699v1 Announce Type: new \nAbstract: Reinforcement learning (RL) enables adaptive and autonomous decision-making in embedded, edge, and heterogeneous computing systems. Field-programmable gate arrays (FPGAs) and integrated circuits (ICs) offer low latency, energy efficiency, and architectural flexibility for RL deployment, while introducing challenges in resource constraints, implementation complexity, and hardware-algorithm co-design. This review surveys more than 100 studies on RL implementations across FPGA and IC platforms, emphasizing architectures, implementation strategies,","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35684,"title":"Interaction-Gated Time-Frequency Learning for Parameter-Efficient PPG-Based Heart Rate Estimation","url":"https://arxiv.org/abs/2610.28693","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.28693v1 Announce Type: new \nAbstract: Photoplethysmography (PPG) enables low-cost and non-invasive heart rate (HR) monitoring but remains sensitive to waveform distortion, physiological variability, and measurement interference. Temporal waveform characteristics and frequency-domain periodicity provide complementary information for HR estimation; however, effectively exploring and integrating these representations within a compact model remains challenging. This paper proposes TF-IG, a parameter-efficient interaction-gated time-frequency learning framework for PPG-based HR estimatio","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#dc2626","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":35600,"title":"马斯克：人形机器人数量将超过人类 整个赛道都将成全球最大产业 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMimgFBVV95cUxQQXVHcjRRM0pBLXpmNkZ0LUVKMUxldUxIdktaODEtZjhHZEVpNE1zcTEwOE1mZVI3Q0drNWl3TEg3Z0U1NDUwTjJfNkVjRVdsR0ZGR0dBUU9MTmt2a3JBLUlLcjZUMDJLc0JrVzBPYzlpQzkwaGpVSDNVUGRsVzNNQXg0NVZpWVhtVjVNd0VUdzNuVmZ1UzV3MUZn?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMimgFBVV95cUxQQXVHcjRRM0pBLXpmNkZ0LUVKMUxldUxIdktaODEtZjhHZEVpNE1zcTEwOE1mZVI3Q0drNWl3TEg3Z0U1NDUwTjJfNkVjRVdsR0ZGR0dBUU9MTmt2a3JBLUlLcjZUMDJLc0JrVzBPYzlpQzkwaGpVSDNVUGRsVzNNQXg0NVZpWVhtVjVNd0VUdzNuVmZ1UzV3MUZn?oc=5\" target=\"_blank\"\u003e马斯克：人形机器人数量将超过人类 整个赛道都将成全球最大产业\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-22T05:48:45"},{"id":35601,"title":"特斯拉Optimus规划年产100万台，周产2万需一年 - 汽车之家","url":"https://news.google.com/rss/articles/CBMiW0FVX3lxTE9jRkhUWFlFejZuN1NKenQ1SnpKa3NfclVkY25jcktBRTN1U0gtdjlRSTd5eHM4MTdnTk1acFducDVxSWNFWjNua3F0eXh1ZUVFaFVIYzUwTjdzd2c?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiW0FVX3lxTE9jRkhUWFlFejZuN1NKenQ1SnpKa3NfclVkY25jcktBRTN1U0gtdjlRSTd5eHM4MTdnTk1acFducDVxSWNFWjNua3F0eXh1ZUVFaFVIYzUwTjdzd2c?oc=5\" target=\"_blank\"\u003e特斯拉Optimus规划年产100万台，周产2万需一年\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e汽车之家\u003c/font\u003e","tags":[],"cluster_size": "],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMidkFVX3lxTFB6Ynl6RGZ2SVNPR0c4TVJQVlB4N2NqOFlPUEVnS2w0bk9OUjhpUXk2RU1yemxqR1JaSXo1anpIVndFY0tQbmd1ZkFMYnRCRlA4dXROLWl0UXNfQ2kxYUVQMEdRTnFYS0s2dXJ1R29WNG5DUUFZNnc?oc=5\" target=\"_blank\"\u003eUnitree's G1 Humanoid Robot Tops Nearly 20,000 Units Produced; Wang Xingxing Says Physical AI Showing Signs of \"Being Broken Through\"\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eBigGo Finance\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-22T04:05:00"},{"id":35623,"title":"Training in Deployment: Human-in-the-loop Online Post-Training for Robot Manipulation","url":"https://arxiv.org/abs/2610.29264","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29264v1 Announce Type: new \nAbstract: Large pretrained robot foundation models provide strong priors for manipulation, yet adapting them to target tasks with offline teleoperated demonstrations often fails to cover the contact-rich, recovery, and precision-critical states encountered during deployment. Existing methods mitigate this issue by augmenting offline demonstrations with human-in-the-loop data or online reinforcement learning. Despite this, offline post-training adapts slowly because it cannot immediately absorb deployment experience, while online RL typically relies on val","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35622,"title":"DepState-JEPA: Learning Depth-Grounded State Representation for Visual Perception and Manipulation","url":"https://arxiv.org/abs/2610.29246","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29246v1 Announce Type: new \nAbstract: Predictive representations for robot manipulation should connect scene geometry with the state changes induced by actions. Our intuition is that understanding what an action will change starts with understanding where things are: complementary RGB and depth observations ground a common scene representation from which to infer those changes. Guided by this intuition, we introduce \\textbf{DepState-JEPA}, a dual-stream RGB--Depth joint-embedding predictive architecture that connects spatial understanding with action-conditioned prediction through a","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35621,"title":"NavBind: Diagnosing Instruction-Action Binding at Route Forks in Navigation VLAs","url":"https://arxiv.org/abs/2610.29203","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29203v1 Announce Type: new \nAbstract: Vision-language-action (VLA) navigation models translate visual observations and instructions into actions. Navigation success assesses whether an agent reaches the goal. However, reaching the goal successfully does not establish whether the model genuinely follows the instructions or relies on visual cues or navigation history. We introduce NavBind to diagnose instruction-action binding: whether changing the instruction influences the probabilistic distribution of the actions, with the navigation context fixed. We construct 3,252 route-fork con","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35620,"title":"SMR: Learning streaming motion retargeting for humanoids from human semantic","url":"https://arxiv.org/abs/2610.29169","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29169v1 Announce Type: new \nAbstract: Retargeting human motion to humanoids requires preserving motion semantics while accounting for the robot's physical constraints. Kinematic pipelines prescribe a robot trajectory through geometric matching, without establishing whether it can be executed under the robot's dynamics. Prior physics-supervised neural methods train bidirectional full-sequence models on physics-refined kinematic trajectories, remaining tied to prescribed kinematic solutions and requiring noncausal context. We propose SMR, a streaming neural motion retargeter learned f","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35619,"title":"SimPT: An Automated Simulation Framework for Intervention-Based VLA Post-Training","url":"https://arxiv.org/abs/2610.29161","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29161v1 Announce Type: new \nAbstract: Human-in-the-loop (HIL) post-training improves vision-language-action (VLA) policies through expert corrections, but costly human supervision and repeated real-robot evaluation limit algorithm exploration and development. We introduce SimPT (Simulation-based Post-Training), a simulation framework that automates intervention-based VLA post-training by integrating policy rollouts, corrective data collection, policy training, and standalone evaluation. To automatically determine intervention timing and recovery strategies, we develop an Agent-Compi","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35618,"title":"State-Dependent Objective Coordination for End-to-End Balance and Navigation","url":"https://arxiv.org/abs/2610.29142","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29142v1 Announce Type: new \nAbstract: Traditional robotic navigation systems separate mapping, planning, and low-level control through cascaded modules, introducing computational overhead and accumulated latency. End-to-end reinforcement learning offers a compact unified policy that maps onboard observations directly to control actions. However, on inherently unstable platforms such as two-wheeled inverted-pendulum robots, navigation progress and obstacle avoidance can conflict with attitude stabilization in a strongly state-dependent manner. We propose a lightweight state-dependent","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35617,"title":"PHD-Hand: A Printable Humanoid Dexterous Hand with Linkage-Driven 3-DOA Digits","url":"https://arxiv.org/abs/2610.29030","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.29030v1 Announce Type: new \nAbstract: Currently, dexterous humanoid robot hands are widely considered the final hardware bottleneck that hampers generalist robots from physically assisting people at home and work. As conventional tendon-driven designs suffer from high cost, demanding maintenance, poor reliability, and short durability, alternative linkage-driven designs have increasingly gained attention. Despite their potential to avoid the weaknesses of tendon-driven hands, integrating multiple degrees of actuation (DOA) in a single digit with linkage drivetrains is a challenge fo","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35616,"title":"SLoSa: Small, Low-Power, and Safe Foundation Models for Robotic Task Planning","url":"https://arxiv.org/abs/2610.28955","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28955v1 Announce Type: new \nAbstract: Safe robotic task planning requires planners that can reliably achieve task goals while satisfying safety constraints. Classical planners search over explicit symbolic task representations and can provide formal guarantees with respect to encoded safety constraints, but require rigid input formats. Their computational cost also increases rapidly with the search space. In contrast, large language models (LLMs) offer flexible task interfaces and strong generalization capabilities, but they are large, power-hungry, and pre-trained with little robot","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35615,"title":"GGraph: A GPU-Accelerated Library for Graph-Based Robot Deployment and Learning","url":"https://arxiv.org/abs/2610.28953","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28953v1 Announce Type: new \nAbstract: Autonomous mobile robots require spatial representations that capture geometry and semantics while staying sparse enough for planning in large, unknown environments. Graphs provide a natural representation for this purpose and underpin both classical planning methods and a growing class of reinforcement-learning (RL) policies. However, RL training needs hundreds to thousands of parallel environments, each constructing and updating its own graph. Existing graph libraries are typically designed for either single-robot deployment or fixed graphs, a","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35614,"title":"COWBOY: A Scalable Sim-to-Real Framework for Learning Contextual Whole-Body Manipulation","url":"https://arxiv.org/abs/2610.28948","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28948v1 Announce Type: new \nAbstract: Mobile manipulators must adapt not only to objects, but also to the spatial context in which they appear: where to position the base, how to manipulate, and where to look while navigating surrounding scene geometry. To address this, we present COWBOY, a scalable sim-to-real framework for learning such contextual whole-body manipulation. On whole-body dexterous grasping, COWBOY transfers zero-shot to hundreds of objects and diverse in-the-wild scenes, spanning cluttered tabletops, shelves, drawers, and other unstructured settings. Rather than lea","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35613,"title":"One Policy, Many Styles: Where to Aggregate Preferences for Steerable Humanoid Control?","url":"https://arxiv.org/abs/2610.28925","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28925v1 Announce Type: new \nAbstract: Modern robotic agents are increasingly expected to support steerable control, where a single policy can adjust its behavioral style at runtime under changing user preferences. Preference-conditioned reinforcement learning provides this interface, but conditioning alone does not ensure that a requested behavior change is strong, does not leak into unrelated behaviors, and does not compromise task performance. Our evaluation combines Preference Reward Responsiveness (PRR) with coverage and utility metrics. We use these measures to compare reward-l","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35612,"title":"Navigation Explainability for Object Avoidance with LLMs for Assistive Robots","url":"https://arxiv.org/abs/2610.28920","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28920v1 Announce Type: new \nAbstract: Blind and visually impaired individuals face uncertainty when navigating unfamiliar areas. Whether a cane or a guide dog is used for navigation, this may prove to be challenging. To mitigate this challenge, we present the Context-Aware Navigation Explanation framework that explains guide dog movements for obstacle avoidance and navigation using a large language model. This system integrates perceptual context with planned future trajectories to generate natural-language explanations of robot movement. We deploy the system on a Unitree Go2 platfo","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35611,"title":"Flexible Language-Guided Representation Editing for Adaptive Robot Behavior","url":"https://arxiv.org/abs/2610.28893","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28893v1 Announce Type: new \nAbstract: Trajectory demonstrations show robots how to behave but not why, leaving them to guess which features of the task actually matter. Incorrect guesses produce misaligned internal representations and lead to incorrect robot behaviors. Because task features are often semantically defined, we argue that natural language is better suited for specifying features rather than relying on demonstrations. Although existing representation editing methods have proposed using language to specify new features, only allowing additive edits produces feature sets","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35610,"title":"inr2action: Encoding Robot Episodes as Neural Implicit Representations for Recall and Action","url":"https://arxiv.org/abs/2610.28882","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28882v1 Announce Type: new \nAbstract: Long-horizon robotic operation requires memory that scales with essential information rather than execution time. We present a parameter-space memory framework where each episode is stored as a separable object. A neural implicit representation is fitted to episode video from a shared, meta-learned initialization; the resulting weight delta constitutes the memory. Crucially, this delta remains a fixed size regardless of whether the episode spans a hundred or a hundred thousand frames. A learned projector maps the weight delta into token embeddin","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35609,"title":"Real2Sem2Real: 3D Semantic Augmentations for Robot Learning from a Single Human RGB Demonstration","url":"https://arxiv.org/abs/2610.28880","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28880v1 Announce Type: new \nAbstract: Human video scales easily and does not need robot hardware, but existing methods require depth sensing, overlay the robot onto 2D video, or generate data only for the demonstrated objects. We present Real2Sem2Real (R2Sem2R), a real-to-semantic-to-real pipeline that turns one monocular RGB video of a human demonstration into thousands of robot demonstrations across the semantic object instances of a category. R2Sem2R tracks the SE(3) pose of each object with DINOv3-distilled Gaussian splats, outperforming existing methods and FoundationPose with","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35608,"title":"T-WLA: Bridging Slow Vision and Fast Touch","url":"https://arxiv.org/abs/2610.28814","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28814v1 Announce Type: new \nAbstract: In contact-rich manipulation, contact conditions can change before a visual policy updates its action plan. Recomputing the plan through the visual policy adds latency, while tactile feedback alone does not specify how the ongoing motion should be revised for the task. We introduce T-WLA, a world-language-action architecture that uses shared visual memory to guide both action generation and tactile correction. At each visual update, the visual branch integrates the current image, task instruction, and retrieved history into a visual memory that","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35607,"title":"Learning-Enhanced Observer for Sensorless Task-Null-Space Compliant Control","url":"https://arxiv.org/abs/2610.28769","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28769v1 Announce Type: new \nAbstract: This paper presents a novel framework integrating a robust wrench observer with a hybrid pose and force controller for physical Human-Robot Interaction (pHRI). In pHRI tasks, robots are expected to perform task-space motions robustly while remaining compliance with human disturbance, which proposes distinct control objectives. Most existing approaches focus mainly on either robustness or compliance and rely on force sensors for real-time tracking. To address these limitations, we propose a novel framework with the following key contributions. Fi","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35606,"title":"Human-Robot Interaction via Meta-Learning Based Mode Recognition and Adaptive Control","url":"https://arxiv.org/abs/2610.28761","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28761v1 Announce Type: new \nAbstract: In human-robot interaction (HRI) tasks, humans may interact with the robot in either an active guiding or passive following state, resulting in distinct control objectives for each interaction mode. Most existing approaches rely on predefined switching thresholds to distinguish interaction modes, but their performance can be sensitive to measurement noise. To address this limitation, we propose a novel framework with the following key contributions. First, a neural network (NN) trained via meta-learning is developed to recognize human intention","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35605,"title":"Warping the Workspace: Expanding Visual Access with Adjustable Reach Mapping for Humanoid Teleoperation","url":"https://arxiv.org/abs/2610.28712","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.28712v1 Announce Type: new \nAbstract: First-person humanoid teleoperation ties access to side and rear targets to operator rotation. We present coupled visual--motor remapping, pairing a panoramic azimuth warp with its inverse upper-limb yaw transform. A working prototype implements Global Zoom (GZ) and Focus+Context (F+C). In a within-subject study (N=8); 72 trials), GZ had the largest completion count (23/24; Fixed: 20/24; F+C: 21/24), whereas F+C was preferred by 6/8 participants. Therefore, completion and preference favored different mappings in this sample.","tags":[],"cluster_size":1,"ts":"2026-10-22T04:00:00"},{"id":35624,"title":"人形机器人板块逆势大涨！特斯拉Optimus量产传来新消息，王兴兴称物理AI已经看到被击穿的苗头 - 搜狐","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQUzNuX3p4MW5jTkhrMHE0Qklvc0haR0dSMHZfaU1UTlFQQ1N2LXUyMU5nYW9kblNRaEptUWxIeUNoZG4wNVlWV1BuZGRxd1lqYllwTGZaemQ1XzB5eXc4blRaTndoODJFMXN6eWZTeVBCVjVHT1k4djUxNVowbWg0QW04V0RUU2Uz?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQUzNuX3p4MW5jTkhrMHE0Qklvc0haR0dSMHZfaU1UTlFQQ1N2LXUyMU5nYW9kblNRaEptUWxIeUNoZG4wNVlWV1BuZGRxd1lqYllwTGZaemQ1XzB5eXc4blRaTndoODJFMXN6eWZTeVBCVjVHT1k4djUxNVowbWg0QW04V0RUU2Uz?oc=5\" target=\"_blank\"\u003e人形机器人板块逆势大涨！特斯拉Optimus量产传来新消息，王兴兴称物理AI已经看到被击穿的苗头\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-22T03:27:10"},{"id":35625,"title":"A股异动丨人形机器人概念逆势上涨，浙江荣泰逼近涨停，马斯克预告Optimus明年外售 - 新浪财经","url":"https://news.google.com/rss/articles/CBMigAFBVV95cUxPemRBOVlHVFd // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
