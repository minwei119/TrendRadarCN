2,"ts":"2026-10-19T23:20:27"},{"id":34673,"title":"134家A股公司前三季度业绩预告预喜","url":"https://wallstreetcn.com/livenews/3181465","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至10月19日发稿，已有161家A股公司发布2026年前三季度业绩预告，其中134家公司业绩预喜（含121家预计净利润同比增长、13家预计净利润同比扭亏为盈）。储能、信息技术、医药等行业的多家业绩预喜公司公告显示，海外业务成为业绩增长的重要引擎。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:46:47"},{"id":34674,"title":"多家民营银行加强个人存款属地化管理","url":"https://wallstreetcn.com/livenews/3181464","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，多家民营银行密集发布公告，推进个人存款业务属地化整改，暂停向异地客户新增销售个人存款产品、收紧线上异地存款购买通道。异地揽储整治步入集中落地、存量加速出清阶段，行业属地化经营规则进一步统一。梳理公开信息发现，全国19家民营银行中，目前已有至少10家落地个人存款属地化整改措施，行业规范化整改全面铺开。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:45:42"},{"id":34675,"title":"畅通跨境投资渠道，60/40结构ETF密集上市","url":"https://wallstreetcn.com/livenews/3181451","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在资本市场高水平对外开放持续推进的背景下，一种新的基金品类正成为港股ETF市场的亮点。9月，合计17只60/40结构ETF密集上市，涉及韩国、马来西亚、美国等多个资本市场。\n\n在业内人士看来，60/40结构ETF集中上市的背后，是ETF互联互通规则调整、内地与香港互联互通持续深化共同作用的结果。作为跨市场投资工具，60/40结构ETF被视为打开港股ETF市场发展空间，乃至推动跨境资本流动的重要抓手。此类基金持续发展，有望进一步疏通连接中国优质资产与国际资本的渠道。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:22:00"},{"id":34676,"title":"全球配置需求升温，公募竞逐QDII业务","url":"https://wallstreetcn.com/livenews/3181449","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着居民财富管理格局持续演进，投资者资产配置的视野投向全球市场，跨境多元配置需求有所升温。顺应这一趋势，境内公募持续深耕QDII（合格境内机构投资者）赛道，产品谱系不断丰富，投资版图向全球多地延伸。\n\nChoice数据显示，截至10月19日，QDII基金共有311只，其中19只成立于2026年。QDII产品类型从早期以海外权益为主，逐步扩展至境外债券，以及涵盖商品（黄金、原油）和海外REITs的另类投资；投资范围也从最初以美国市场等为主，延伸至德国、英国、法国、日本、印度、越南、沙特、巴西等市场。\n\n业内人士认为，随着QDII业务规模稳步增长，夯实全球投研能力将成为基金公司构筑“护城河”的核心抓手。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:18:19"},{"id":34677,"title":"光纤行业高景气度将持续，产能约束致供需缺口扩大","url":"https://wallstreetcn.com/livenews/3181447","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"10月19日，2026全球光纤光缆大会在武汉开幕。会上发布的行业预测显示，受AI数据中心需求爆发驱动，2027年全球光纤供需缺口将扩大到1.5亿芯公里至2亿芯公里，且因光棒扩产周期长达18个月至24个月，供给紧张格局在2027年难以通过价格信号快速缓解。尽管产业迎来量价齐升，但多家公司提出，希望建立产能协同机制，以防2028年集中扩产兑现后的周期反转。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:15:54"},{"id":34678,"title":"A股半导体三季报业绩大面积预增，PCB与存储芯片“你追我赶”","url":"https://wallstreetcn.com/livenews/3181446","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"从目前已披露三季报或前三季度业绩预告来看，半导体板块前三季度业绩大面积预增，显示高景气度持续，尤其是存储芯片公司显示出惊人的盈利能力，PCB则成为业绩“最具确定性”板块。有市场人士表示，展望2027年，在AI需求推动下，全球半导体产业高景气度将延续。随着本轮市场调整带动估值回落，科技板块拥挤度有所消化，这些景气度依然坚挺的板块，以及盈利能力迎来修复的公司，有望重新获得市场和资金青睐。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:14:43"},{"id":34679,"title":"掘金细分龙头，长线资金最新持仓曝光","url":"https://wallstreetcn.com/livenews/3181445","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"据Choice不完全统计，截至10月19日，在已披露2026年三季报的A股公司中，共有42家公司的前十大流通股股东中出现社保基金、养老金、QFI等长线资金身影。从布局逻辑看，在今年三季度以来的震荡行情中，长线资金更加看重上市公司基本面。它们青睐业绩亮眼的细分龙头，看重企业盈利韧性，同时积极挖掘中小市值特色标的。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-19T22:12:16"},{"id":34680,"title":"纳斯达克金龙中国指数收跌0.27%，报5680.44点。\n\n中概股里，智能充电收跌33.21%，碳博士控股跌25.11%，绿专资本跌13.34%，盛丰物流跌9.","url":"https://wallstreetcn.com/livenews/3181422","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"纳斯达克金龙中国指数收跌0.27%，报5680.44点。\n\n中概股里，智能充电收跌33.21%，碳博士控股跌25.11%，绿专资本跌13.34%，盛丰物流跌9.3%，\n\n万国数据跌2.64%，阿特斯太阳能跌2.45%，大全新能源、蔚来、亚朵、晶科能源、携程、世纪互联至少跌1.02%，美团ADR跌1.45%，比亚迪ADR跌0.97%，腾讯控股ADR跌0.87%，网易、新东方、中通快递至多跌0.64%，小米集团ADR跌0.65%，阿里巴巴跌0.49%，百度、理想、B站、百胜中国、小鹏至多跌0.45%。\n\n霸王茶姬收涨0.33%，PDD涨0.52%，腾讯音乐、名创优品、汽车之家、金山云至多涨0.71%，小马智行、文远知行至多涨2.94%，网易有道涨3.25%，日月光半导体涨3.21%，再鼎医药涨3.75%，禾赛涨4.03%，脑再生科技涨4.8%，即亮集团涨7%，中阳金融集团涨9.31%，海川证券涨14%，苏轩堂涨70.77%。\n\nETF中，中概互联网指数ETF（KWEB）收跌0.53%，中国科技指数ETF（CQQQ）收跌0.24%。\n\nMSCI新兴市场ex中国ETF（EMXC）收涨1.13%，XtrackersHarvest中证50（ASHS）收涨0.88%，德银嘉实沪深300指数ETF（ASHR）收涨0.51%。","tags":[],"cluster_size":1,"ts":"2026-10-19T20:44:32"},{"id":34681,"title":"标普500指数收涨31.29点，涨幅0.41%，报7690.73点。标普500相等权重指数跌0.40%，报8674.08点，跳空高开之后持续高位震荡。\n\n道琼斯","url":"https://wallstreetcn.com/livenews/3181418","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"标普500指数收涨31.29点，涨幅0.41%，报7690.73 . Existing methods typically rely on human-defined symbol sets or symbols derived from language supervision, without asking what makes a symbol computationally useful. In this paper, we take an inference-algorithm--centric view to define usefulness: a good symbol should expose the discrete commitments that simpli","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34820,"title":"Robotic Spatiotemporal Editing: A Unified Interface for Controllable Action Generation via Masked Action Reconstruction","url":"https://arxiv.org/abs/2610.23002","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23002v1 Announce Type: new \nAbstract: Generative policies can synthesize robot behaviors, yet controlling and editing them through diverse spatiotemporal references remains challenging. In the real world, human intent requires robot behaviors that satisfy constraints on where, when, and how actions are executed. Our key insight is that spatiotemporal control references, such as keypoints, flows, orientations, and keyposes, can be viewed as partial specifications of the same temporal Cartesian action space. We introduce the MAP (Masked Action Space) interface to unify these action re","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34819,"title":"GR-VIP: Geometric representation conditioning for precise visuomotor policy","url":"https://arxiv.org/abs/2610.22997","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22997v1 Announce Type: new \nAbstract: Achieving precise terminal position and heading alignment remains a significant challenge for learning-based mobile robot control. Recent vision-based learning methods have shown promise for precise target-relative control and generalization to unseen environments with pretrained visual encoders, but general-purpose visual representations are not specifically designed to capture the fine-grained spatial differences between current and goal views required for precise control, and real-world demonstrations combining millimeter-scale terminal accur","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34818,"title":"MambaAct: Efficient Mamba Action Experts for Flow-Matching Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.22951","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22951v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have shown strong promise for generalist robotic manipulation, but their inference cost remains a major bottleneck for real-time control. This limitation is especially pronounced in flow-matching VLAs such as $\\pi_{0.5}$, where the action expert is evaluated repeatedly during iterative denoising. We introduce MambaAct, an efficient Mamba action expert for flow-matching VLA policies. MambaAct retains the pretrained visual-language prefix encoder of $\\pi_{0.5}$, while replacing its transformer-based action exper","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34817,"title":"Ego2Contact: Predicting Touch from Egocentric Human Video for Contact-Rich Robot Manipulation","url":"https://arxiv.org/abs/2610.22932","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22932v1 Announce Type: new \nAbstract: Contact locations and interaction forces are critical for contact-rich robot manipulation but are often ambiguous from vision alone. Measuring them on robots requires specialized tactile hardware and platform-specific data collection, which keeps robot tactile data scarce. Human egocentric video is far easier to scale but lacks touch. Recent predictors trained on egocentric recordings paired with tactile-glove measurements can predict this missing signal from video alone. These predictors, however, remain confined to human hands, which differ fr","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34816,"title":"SenseSwarm: Swarm Exploration via Neural Structure Estimation with Shared World-Anticipation for Rapid Mapping","url":"https://arxiv.org/abs/2610.22905","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22905v1 Announce Type: new \nAbstract: A robot swarm covers a building faster with more robots, but the map is only as complete as the space the robots have physically visited. We target the amount of an unknown building a decentralized swarm knows at each instant, ahead of physical coverage. SenseSwarm serves a lightweight learned map predictor on the swarm's shared occupancy map and folds the predicted structure back into a stigmergic guidance field. Its 709K-parameter predictor is fine-tuned on the swarm's own multi-front observations, which we show is necessary: a single-robot pr","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34815,"title":"Structured Perception Representations for Off-road Dynamics Learning","url":"https://arxiv.org/abs/2610.22900","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22900v1 Announce Type: new \nAbstract: Autonomously navigating off-road terrain at high speed demands accurate control, which often relies on dynamics models that capture complex interactions between the robot and terrain. In off-road regimes, terrain interaction is a major component of the vehicle's dynamics. Prior work attempts to capture this effect by training learned models of the vehicle's dynamics, conditioned on its perception of the local environment. However, said conditioning is often overly simplistic, ignoring the spatial structure of the dynamics problem. Our approach,","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34814,"title":"Sample-Efficient Reinforcement Learning for Policy Improvement via Flow-Reversed Action Anchors","url":"https://arxiv.org/abs/2610.22852","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22852v1 Announce Type: new \nAbstract: Generalist robot policies offer strong behavioral priors, but achieving deployment-level reliability and throughput remains difficult. Reinforcement learning (RL) can improve these policies, yet its effectiveness is constrained by the cost of online interaction. Existing methods adapt frozen flow-matching policies by treating noise space as a continuous action space. We show that this behaviorally unstructured space makes exploration inefficient, often preventing these methods from extracting meaningful learning signals on challenging tasks. We","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34813,"title":"DefFlow: Goal-Conditioned Deformable Object Manipulation using 3D Point Flows","url":"https://arxiv.org/abs/2610.22827","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22827v1 Announce Type: new \nAbstract: Manipulating deformable objects toward desired 3D configurations is a fundamental capability for robots operating in unstructured physical environments. However, as the range of possible initial and target configurations grows, goal-conditioned deformable manipulation requires a robot to infer increasingly diverse manipulation behaviors in addition to precise continuous actions. We introduce DefFlow, a framework for goal-conditioned manipulation of deformable objects toward a broad range of 3D configurations. DefFlow learns from demonstrations b","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34812,"title":"Simultaneous Force and Motion Control in Generalised Coordinates","url":"https://arxiv.org/abs/2610.22813","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22813v1 Announce Type: new \nAbstract: Robot manipulators often come into contact with rigid objects when performing work. This imposes physical constraints on their motion. Simultaneous force \u0026 motion control was developed to regulate contact forces commensurate with these constraints, whilst projecting motion control in to the orthogonal, unconstrained directions. This is typically formulated in the task coordinates, i.e. operational space, then mapped to joint torques to command the robot. However, most constraints on the robot control, such as joint limits, collision avoidance, s","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34811,"title":"PASS-VLN: Passability-Aware Local-Command Vision-and-Language Navigation","url":"https://arxiv.org/abs/2610.22812","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22812v1 Announce Type: new \nAbstract: Reliable vision-and-language navigation (VLN) requires not only understanding instructions but also determining whether and how a robot can physically execute them. However, existing VLN benchmarks typically assume executable instructions and focus on long-horizon tasks. This leaves body-dependent local execution, including passability and collision-free execution, largely unexamined. Evaluating these factors within long-horizon tasks would entangle local physical execution with task planning and long-term spatial memory, making navigation failu","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34810,"title":"Pedicel-Targeted Strawberry Harvesting via Imitation Learning on a Low-Cost Teleoperated Robotic Arm","url":"https://arxiv.org/abs/2610.22765","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22765v1 Announce Type: new \nAbstract: Precise pedicel-targeted grasping in strawberry harvesting remains a critical bottleneck due to the pedicel's small diameter (1.3-3 mm), color similarity with surrounding foliage, and precise force control required for clean abscission zone detachment. As a market-grade crop, strawberry aesthetic value makes bruise-free pedicel detachment essential over direct fruit grasping. Classical approaches struggle to unify vision models, motion planning, and contact manipulation into a robust framework, particularly in occluded canopy environments. There","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34809,"title":"Shape-Aware Neural Time Fields for Rigid-Body Motion and Manipulation Planning","url":"https://arxiv.org/abs/2610.22762","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22762v1 Announce Type: new \nAbstract: Rigid-body motion planning is fundamental to robotic transport and manipulation, where both object position and orientation determine whether a body can move through cluttered environments. This coupling makes planning chal- lenging because translation and rotation can be constrained very differently by surrounding geometry. We propose Shape- Aware Neural Time Fields, a physics-informed neural motion planning framework that learns a reusable travel-time, or cost- to-go, representation for rigid-body motion while explicitly accounting for these d","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34808,"title":"Spatial Memory by Agents, for Agents","url":"https://arxiv.org/abs/2610.22736","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22736v1 Announce Type: new \nAbstract: Spatial memory enables robots to reuse past observations for localization, navigation, and question answering. Designing such memory involves jointly deciding what to retain and how to retrieve it for diverse semantic, metric, and temporal needs. We investigate whether coding agents can automate this design process through iterative implementation and evaluation. Under a fixed development budget, a Designer Agent writes and revises code for memory construction and retrieval using feedback from a fixed Query Agent. The resulting implementations a","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34807,"title":"Task Structure and Scalability in Multi-Robot Authoring","url":"https://arxiv.org/abs/2610.22670","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22670v1 Announce Type: new \nAbstract: Multi-robot authoring can reduce completion time by distributing drawing work, but the resulting speedup depends on task structure and the allocation-routing pipeline. We investigate these relationships by representing drawings as geometric stroke graphs and comparing component-level (single-token) allocation with shared-token (decomposed) allocation, which permits multiple robots to work within a connected component. A simulation study of 385 drawings and teams of one to eight robots shows diminishing speedup gains under single-token allocation","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34806,"title":"FCTS: Failure-Guided Curriculum Tree Search Over Generated Terrain for Legged Parkour","url":"https://arxiv.org/abs/2610.22619","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22619v1 Announce Type: new \nAbstract: Quadruped parkour policies handle canonical obstacles well, but their training curricula often miss the irregular, compound geometry of industrial and disaster-response sites, where agile locomotion matters most. Such environments pose a hard generalization problem: even training directly on reconstructed geometry from the target site does not reliably yield policies that traverse it. Hand-designed curricula span only a few terrain families, and recent LLM-generated curricula offer little control over which policy weaknesses they target. We prop","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34805,"title":"Embodiment-Classifier Guidance: Transferring Frozen VLAs Across Robot Dynamics without Demonstrations","url":"https://arxiv.org/abs/2610.22576","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22576v1 Announce Type: new \nAbstract: Flow-based policies such as $\\pi_0$ are trained on a fixed set of embodiments, and transferring them to new ones is an open problem. To adapt a frozen $\\pi_0$ to a new embodiment without additional demonstrations or parameter updates, we train a lightweight embodiment classifier to distinguish successful action chunks on the source body from those on the target body, using a few calibration tasks. On transfer tasks that $\\pi_0$ saw on its source body but the classifier was never trained on, we nudge each denoising step of $\\pi_0$ with the classi","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34804,"title":"Micro-Localization: High-Precision Mobile Robot Localization Using Microscopic Ground Texture","url":"https://arxiv.org/abs/2610.22563","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22563v1 Announce Type: new \nAbstract: We demonstrate high-precision global localization using natural ground texture viewed through microscope optics, achieving localization in the tens-of-micrometers regime. For the planar ground texture localization problem considered here, we relate optical magnification and image-space localization uncertainty to physical localization precision. Leveraging this relationship, we then develop a microscope-based localization system that addresses the calibration, camera-modeling, and focus challenges introduced by high-magnification imaging. We eva","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34803,"title":"When Plans Change, Remember: Replanning-Guided Visual Memory for Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.22556","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22556v1 Announce Type: new \nAbstract: Long-horizon, multi-stage Vision-Language-Action (VLA) policies often require visual information that is no longer present in the current observation. Retaining the complete observation history is computationally expensive and highly redundant, motivating selective visual memory. We introduce RePlanMem-VLA (Replanning-Guided Keyframe Memory for VLA), which turns a policy's own plan revisions into an online memory-write signal. Under receding-horizon execution, consecutive action chunks predict some of the same future actions. RePlanMem-VLA treat","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34802,"title":"RTISSLAM-3D: Full 6-DoF SLAM With an In-Air 3D Imaging Sonar","url":"https://arxiv.org/abs/2610.22552","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22552v1 Announce Type: new \nAbstract: Echolocating bats navigate dense forests using sonar alone, and in-air 3D imaging sonars now capture the entire frontal hemisphere with every pulse. Sonar SLAM, however, has so far been planar: current systems estimate a 2D trajectory and discard the elevation information in the sonar images, an assumption that does not hold on rough and sloped terrain such as a forest floor. In this paper, we introduce RTISSLAM-3D, a novel 6-DoF SLAM system for a wheeled robot that carries an in-air 3D imaging sonar, an IMU and wheel encoders. A CFAR detector o","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"},{"id":34801,"title":"Scaling Online Exploration for Robot Agents","url":"https://arxiv.org/abs/2610.22496","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.22496v1 Announce Type: new \nAbstract: Robot learning has advanced by scaling demonstration datasets and model capacity; however, deploying a new robot embodiment or task typically necessitates a dedicated teleoperation corpus. The resulting policies remain bounded by their imitation distributions, limiting generalization and continual self-improvement. We introduce RAX (Robot Agent eXploration), an open-source framework for robot agents centered on scaling exploration: enabling agents to improve by acquiring online experience and synthesizing executable programs. In RAX, a general-p","tags":[],"cluster_size":1,"ts":"2026-10-19T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
