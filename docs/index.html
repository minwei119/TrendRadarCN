r_size":1,"ts":"2026-08-20T00:01:02"},{"id":21253,"title":"华尔街见闻早餐| 2026年8月20日","url":"https://wallstreetcn.com/livenews/3151965","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美国财政部“救市”，三大美股指扭转三连跌，盘中30年期美债收益率跳水10个基点，现货黄金一度大反弹超4%；加密货币拉升，以太坊盘中涨超10%；离岸人民币三年来首次盘中涨破6.73。\n\n美财政部宣布，将长债回购上限提高至少一倍至单次操作40亿美元，长期美债收益率应声跳水。\n\n美联储会议纪要偏鹰：7月加息阵营不止三人，多人认为若通胀不降需行动，部分料AI推升通胀，工作人员通胀预期有偏上行风险，沃什提议减少FOMC会议至一年六次。\n\n特朗普才过一天就改口：也许“某个时候”恢复与伊朗谈判。英媒：若美国升级战事，伊朗考虑打击美驻欧洲军事目标。\n\n美国联邦政府债务史上首次突破40万亿美元，十年翻一倍多。\n\n中国司法部：欧盟外国补贴调查相关做法构成不当域外管辖，将坚决依法反制。\n\n重大突破：中国首次实现火箭陆地回收，专家称中国航天发射成本有望降低70%以上。\n\nmRNA癌症疗法重大突破：Moderna黑色素瘤mRNA疫苗三期试验成功，股价收涨近180%。\n\nSK海力士拟回购注销40万亿韩元股份、承诺将至少50%现金流回馈股东。\n\nOpenAI“暴雷”？据称二季度收入仅增18%，远低于Anthropic。\n\nAI需求挤压产能，三星据称7月上调芯片制造价格，最高涨幅15%。\n\n宇树科技上市首日收涨460%，公司市值3400亿元，中一签赚近50万元；创始人王兴兴成90后新首富。\n\n长江存储IPO辅导状","tags":[],"cluster_size":3,"ts":"2026-08-19T23:30:42"},{"id":21254,"title":"“固收+”产品业绩急刹车，上半年绩优品种回撤明显","url":"https://wallstreetcn.com/livenews/3151957","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"经历了上半年的规模与业绩双丰收后，“固收+”产品7月以来遭遇明显回撤。截至8月18日，上半年回报率超1%的产品里已有50只年内回报转负，上半年回报率超过20%的29只产品7月以来全部出现负回报。本轮回撤主要源于权益部分科技板块大幅下跌，债券部分收益较薄，无法形成有效对冲。部分产品二季度大幅抬升股票仓位，且持仓集中于AI产业链，这一布局导致在科技板块回调阶段进一步放大了净值波动。业内人士认为，下半年市场风格有望趋于均衡，“固收+”产品的基金管理人应更加重视仓位与风险等级的匹配及跨资产配置能力。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-19T22:45:35"},{"id":21255,"title":"8月19日300现金流ETF华宝基金份额减少200万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1RSjF5U2NDcWhXbnFQcGI1cFJSVnkxcEItdEsyTUlCQXNaeVhxa1U2VDlsRDZNUTA5T1pmaGVuelpzSDFRQmRYLWEtVWxiTkxYdWJXcGVwWW5uUVVzTzFYOHl3?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1RSjF5U2NDcWhXbnFQcGI1cFJSVnkxcEItdEsyTUlCQXNaeVhxa1U2VDlsRDZNUTA5T1pmaGVuelpzSDFRQmRYLWEtVWxiTkxYdWJXcGVwWW5uUVVzTzFYOHl3?oc=5\" target=\"_blank\"\u003e8月19日300现金流ETF华宝基金份额减少200万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\ dRVjl3Zjdv?oc=5\" target=\"_blank\"\u003eUnitree IPO Soars 600% on Day One: Why Is the Humanoid Robot Concept Igniting Capital Markets?\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eodaily.news\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-19T09:52:57"},{"id":21390,"title":"Nomura Securities Research Report Analysis: Unitree Robotics, the No. 1 Humanoid Robot Company in Global Shipments, Cos… - 深潮TechFlow","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE12LWF5NGR6MVNfeXo1akUwNGF5ZXVpZ2lmRzNxaU82M1EwemxFQ3lDTkZVdG1FZXFCdWFEQnZOSW5FVmRMcEpSakVMR0EyRzZNaS1hQ1J1bHVpRnNR?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXEFVX3lxTE12LWF5NGR6MVNfeXo1akUwNGF5ZXVpZ2lmRzNxaU82M1EwemxFQ3lDTkZVdG1FZXFCdWFEQnZOSW5FVmRMcEpSakVMR0EyRzZNaS1hQ1J1bHVpRnNR?oc=5\" target=\"_blank\"\u003eNomura Securities Research Report Analysis: Unitree Robotics, the No. 1 Humanoid Robot Company in Global Shipments, Cos…\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e深潮TechFlow\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-19T07:33:15"},{"id":21392,"title":"Chinese robotics giant Unitree soars in stock market debut - BBC","url":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE1LYTVEOXBXWHBjaDFwT01UNVhCTk41WkxqUXFfeVhFcEd6NUJKaWN3dE5jM3pnbThJTDRzTTR3ekotSGlmQmFWb2xORVBtejRHZXBHNHpLc09YUQ?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiWkFVX3lxTE1LYTVEOXBXWHBjaDFwT01UNVhCTk41WkxqUXFfeVhFcEd6NUJKaWN3dE5jM3pnbThJTDRzTTR3ekotSGlmQmFWb2xORVBtejRHZXBHNHpLc09YUQ?oc=5\" target=\"_blank\"\u003eChinese robotics giant Unitree soars in stock market debut\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eBBC\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-19T07:19:30"},{"id":21413,"title":"Collective Ranking of Environmental Signals through Gaussian Belief Propagation in a Patrolling Robot Swarm","url":"https://arxiv.org/abs/2608.17690","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17690v1 Announce Type: new \nAbstract: Multi-robot patrolling requires a team to visit all areas of an environment at regular intervals, typically minimising idleness. A practical extension, motivated by security and environmental monitoring, is to additionally form a collective ranking of all patrol locations by some measured signal, a generalisation of the best-of-n problem to the many-option, continuous-valued regime. We observe that the patrol graph admits a natural dual interpretation: it is simultaneously the topology that dictates agent movement and a factor graph over which s","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21412,"title":"OVIP-SG: Open-Vocabulary Instance-Preserving Scene Graphs for Mapping and Retrieval of Small, Fine-Grained Objects","url":"https://arxiv.org/abs/2608.17633","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17633v1 Announce Type: new \nAbstract: Integrating open-vocabulary perception into object-level 3D scene graphs is a double-edged sword. While vision-language detectors recover long-tail categories and small, fine-grained objects overlooked by closed-set models, they also tend to fragment large surfaces and merge small objects into larger neighboring objects, compromising instance-level consistency and undermining mapping fidelity. Moreover, existing methods struggle to retrieve previously unmapped targets or determine whether a queried object is absent, hindering robust embodied ope","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21411,"title":"Iterative Grasp Pose Refinement: A Deep Reinforcement Learning Approach for 2D Vision","url":"https://arxiv.org/abs/2608.17628","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17628v1 Announce Type: new \nAbstract: Developing robots capable of understanding and manipulating objects requires compact, interpretable, and generalizable representations. This work proposes a reinforcement learning-based framework for robotic grasp refinement, integrating keypoint-based object representations with a Deep Q-Network (DQN). Using 2D overhead images captured in a simulated environment, a geometric-based algorithm generates initial grasp candidates, which are iteratively refined by the proposed framework, transforming failed grasps into successful ones. Experiments co","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21410,"title":"LIBERO-VIFO: Benchmarking the Capability and Safety of Visual Cue Following in Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.17600","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17600v1 Announce Type: new \nAbstract: Visual cues are increasingly adopted to guide robot learning, but whether Vision-Language-Action (VLA) models can reliably follow authorized cues while disregarding unauthorized ones remains unclear. Existing work covers only a narrow range of cue forms and focuses on final task success, providing only a coarse assessment of cue-following capability. Treating all visual cues as authorized also leaves safety risks of unauthorized following unexplored. To address these gaps, we introduce LIBERO-VIFO, a benchmark to evaluate both the capability and","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21409,"title":"tinyDSM: A Framework for Skill Modeling and Development for Resource-Constrained Millirobots","url":"https://arxiv.org/abs/2608.17596","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17596v1 Announce Type: new \nAbstract: In this study, we investigate developmental mechanisms that enable small, resource-constrained systems such as cm-sized millirobots to autonomously explore, learn, and adapt their capabilities throughout their lifespan. Reinforcement learning algorithms guide the agent's skill acquisition and adaptation through the interplay of our proposed tinyDSM, which integrates intrinsic motivation and fitness-based assessment. We strive for minimal, hard-wired skills while encouraging the open-ended development of new skills. A key emphasis in our approach","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21408,"title":"HODAgent: Towards On-Demand, Responsive Humanoids for Physical World Human Interaction","url":"https://arxiv.org/abs/2608.17584","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17584v1 Announce Type: new \nAbstract: We propose HODAgent, a System-2 embodied agent for humanoid robots in service settings, addressing situated intent, responsive execution, task revision, and outcome verification. Its semi-duplex architecture integrates an Env-Interactor, Planner, Executor, and hierarchical Memory to maintain coherent interaction, planning, and task state during service episodes. This allows handling new requests during motion, retaining progress, revising actions, and grounding closure in execution outcomes. A shared interface connects simulation and physical ro","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21407,"title":"Scalix: Uncertainty-Aware Scale-Consistent Monocular SLAM","url":"https://arxiv.org/abs/2608.17553","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17553v1 Announce Type: new \nAbstract: Cameras are ubiquitous sensors in robotics due to their compact form factor and the perceptual richness captured through visual information. Monocular SLAM enables robots to understand the environment with a minimum setup, however, it inherently suffers from scale ambiguity. A common solution is to provide multi-modal sensor configurations, such as visual-inertial systems, where scale is observable unless the robot navigates under a constant-velocity motion, a common scenario in mobile robotics. With the advent of deep-learning, geometric founda","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21406,"title":"Embodied-Navigator: Point, Think, Memorize, and Align for Efficient Navigation","url":"https://arxiv.org/abs/2608.17512","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17512v1 Announce Type: new \nAbstract: Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting.","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21405,"title":"Calibrated Predictive Safety for Heterogeneous Robots: An Action-Conditioned JEPA Framework with Model-Based Safety Shields","url":"https://arxiv.org/abs/2608.17496","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17496v1 Announce Type: new \nAbstract: Vision-language-action policies generalize broadly but provide no execution-time guarantees; classical model-based planners respect kinematic and geometric constraints but generalize poorly. We study whether an action-conditioned Joint-Embedding Predictive Architecture (JEPA) world model can predict, before execution, both task progress and physical risk for candidate action chunks, and whether coupling these predictions to an embodiment-specific model-based safety shield yields a deployable pipeline for heterogeneous robots.\n  We propose a rece","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21404,"title":"Reuse Before You Retrieve: Diagnosing Headroom and Complementarity for Test-Time Augmentation of Embodied Multimodal Policies","url":"https://arxiv.org/abs/2608.17484","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17484v1 Announce Type: new \nAbstract: Frozen vision-language-action (VLA) policies are increasingly improved at test time by sampling additional policy behaviors or introducing external demonstrations. Yet there is little guidance for deciding which intervention a deployed policy actually needs. Additional sampling is useful only when better behavior already exists within the policy's stochastic rollouts and can be identified, whereas retrieval is most useful when the relevant action prior is not reliably represented by the policy. We study this decision through two measurable facto","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21403,"title":"EATR-Stereo: Embodiment-Aware Routing of Paired Stereo Evidence for Humanoid Vision-Language-Action Control","url":"https://arxiv.org/abs/2608.17453","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17453v1 Announce Type: new \nAbstract: Long-horizon humanoid vision--language--action (VLA) control with head-mounted stereo cameras requires visual interfaces that can exploit complementary views while maintaining compatibility with pretrained representations. Existing interfaces often discard complementary stereo evidence or fuse additional observations without preserving the native primary-view pathway and adapting auxiliary information to robot embodiment. We present EATR-Stereo, an embodiment-aware token-routing framework that retains primary-view tokens and constructs primary-a","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21402,"title":"Prism-GRPO: Faster VLA Policy Optimization via Splitting Same-outcome Groups","url":"https://arxiv.org/abs/2608.17423","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17423v1 Announce Type: new \nAbstract: GRPO is increasingly used for reinforcement learning of vision-language-action (VLA) policies because, unlike PPO, it does not require training a critic. This simplification comes with a sampling cost: group-relative advantages require multiple rollouts from each scene. Under binary success rewards, groups whose rollouts all succeed or all fail have zero advantage and are discarded by dynamic sampling. These groups are especially common early in training, when most rollouts fail, wasting much of the expensive robotic rollout budget. We introduce","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21401,"title":"Bi-Layer Ant Colony Optimization for Multi-Robot Task Allocation and Routing in Delivery Applications","url":"https://arxiv.org/abs/2608.17416","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17416v1 Announce Type: new \nAbstract: This paper addresses the multi-robot task allocation (MRTA) problem, which is essential for delivery and logistics applications. Our approach first defines a new cost function that transforms the MRTA into a unified optimization problem capturing both task assignment and routing. A bi-layer ant colony optimization (ACO) algorithm is then introduced, integrating two interdependent decision layers within a single colony process to solve the problem. This hierarchical framework enables simultaneous optimization of task allocation and route planning","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21400,"title":"MANIGUARD: A Benchmark and Data Suite for Specification-Grounded Safety Evaluation and Improvement of Robotic Manipulation","url":"https://arxiv.org/abs/2608.17386","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17386v1 Announce Type: new \nAbstract: Foundation-model policies for robotic manipulation are advancing rapidly on task success, but rigorous evaluation of whether they succeed safely is still lacking. We introduce ManiGuard, a specification-grounded framework for evaluating and improving the safety of foundation-model manipulation, comprising the ManiGuard-Bench task suite and a paired safety-annotated trajectory-generation pipeline. ManiGuard-Bench organizes six contact-rich household task families into 200 locked base tasks along a skill $\\times$ constraint taxonomy, with safety s","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"},{"id":21399,"title":"Reconfiguration-Complete Motion Primitives with Constructive Planning for Deformable Planar Modular Robots","url":"https://arxiv.org/abs/2608.17324","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.17324v1 Announce Type: new \nAbstract: The continuously deformable geometry of modular robots makes it difficult to define a fixed representation for reconfiguration planning and analysis. This letter introduces a square-cell abstraction that maps deformable rhombus modules to fixed-size grid cells while retaining physically interpretable local motions through two primitives, pivoting and shearing. Under this abstraction, we prove that every non-straight edge-connected configuration with $N \\geq 7$ can be transformed to a fixed canonical staircase using only admissible primitive moti","tags":[],"cluster_size":1,"ts":"2026-08-19T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
