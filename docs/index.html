ic Mythos，旗舰3.5 Pro仍难产。\n\nOpenAI紧急叫停GPT-6，该顶级模型在内部测试中悄然”越狱”。\n\nAMD AI大会前英伟达秀亮CPU“战果”，Vera Rubin全面量产，超300合作伙伴部署。","tags":[],"cluster_size":2,"ts":"2026-07-21T23:30:11"},{"id":12684,"title":"港股市场年内配售募资计划已超2100亿港元","url":"https://wallstreetcn.com/livenews/3137790","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"以公告日期为统计口径，截至7月21日，年内已有241家港股公司（包括H股公司）披露配售股份再融资计划，募资总额合计达2138亿港元；而去年同期有204家，计划募资总额合计达1698亿港元。在上述年内计划配售股份再融资的241家港股公司中，10家公司计划配售融资规模超过50亿港元，去年同期仅有3家。从募集资金总额来看，位居第一名和第二名的分别是宁德时代新能源科技股份有限公司和北京智谱华章科技股份有限公司，募资总额分别为391.9亿港元和314.1亿港元。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-07-21T23:03:20"},{"id":12685,"title":"分析人士：ETF资金大举加仓叠加上市公司积极回购，A股上行行情支撑坚实","url":"https://wallstreetcn.com/livenews/3137786","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，在A股市场震荡下，借道ETF的资金大举入市，持续加仓，同时上市公司加大回购力度。Wind数据显示，截至7月20日，7月以来股票型ETF资金净流入超3850亿元，7月以来的14个交易日中有13个交易日出现净流入；上周，股票型ETF合计净流入超2030亿元，创单周净流入纪录。上市公司也积极回购，300家上市公司合计回购金额超150亿元，显著超过6月同期；7月20日，东山精密、中国建筑、华友钴业等逾30家上市公司披露回购或增持计划。分析人士认为，宽基ETF大额流入为市场企稳提供支撑，上市公司密集推进增持回购，A股市场具有坚实韧性，积极因素有助于提振信心。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-21T22:48:26"},{"id":12686,"title":"公募二季度盈利近2万亿元，多只产品首次披露长期业绩","url":"https://wallstreetcn.com/livenews/3137784","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"天相投顾数据显示，2026年二季度公募基金合计盈利19390.35亿元，一举扭转一季度亏损2029.42亿元的局面，权益类产品在其中起到了关键作用。不仅如此，成立期限满足相关要求的基金在2026年二季报中首度披露过去7年、10年的长期业绩。在业内人士看来，此举有助于强化长期投资、价值投资理念，从而有效提升投资者获得感。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-21T22:39:43"},{"id":12687,"title":"外资机构密集发声看好中国股市","url":"https://wallstreetcn.com/livenews/3137782","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，花旗集团、渣打银行、瑞银等多家国际知名投行密集更新A股市场研报，纷纷上调市场评级与盈利预期，看多中国股市的共识持续强化。　看多中国资产的同时，外资入市布局也在加快。截至2026年二季度末，北向资金持股数量合计超过1078亿股，环比增加超过40亿股。按照二季度末收盘价计算，北向资金持股市值超过3万亿元，达到3.13万亿元，创互联互通机制开通以来季度新高。从持仓结构来看，外资偏好硬科技资产的特征明显。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-21T22:37:48"},{"id":12688,"title":"特朗普提名电信律师执掌司法部反垄断部门","url":"https://wallstreetcn.com/livenews/3137768","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"白宫发布公告，美国总统特朗普提名联邦通信委员会（FCC）总法律顾问Adam Candeub出任美国司法部助理司法部长。该公告并未具体说明特朗普的职责，但白宫官员Saurabh Sharma在社交平台X上发帖称，他将负责领导司法部的反垄断执法工作。Candeub的提名需要美国参议院的确认，这可能需要几个月的时间。","tags":[],"cluster_size":1,"ts":"2026-07-21T21:29:48"},{"id":12689,"title":"英特尔确认将进一步裁员，股价大涨近9%","url":"https://wallstreetcn.com/livenews/3137765","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"英特尔股价周二大涨，此前该公司确认将进一步裁员，以削减成本并调整其关键的数据中心部门。\n\n英特尔股价上涨8.6%，这家科技公司表示将在数据中心部门(DCG)裁员，但未披露具体人数。这延续了该股今年以来的涨势，有迹象显示在首席执行官陈立武的领导下，英特尔在扭转颓势方面取得进展。\n\n英特尔在声明中表示：“作为公司打造更专注、更高效企业整体战略的一部分，DCG正调整组织架构，确保具备适当的岗位设置和技能配置，为业务的长期成功奠定基础。”","tags":[],"cluster_size":1,"ts":"2026-07-21T21:16:37"},{"id":12690,"title":"周二（7月21日）纽约尾盘，标普500股指期货最终涨0.82%，道指期货涨0.73%，纳斯达克100股指期货涨1.75%。\n\n罗素2000股指期货涨1.36%。","url":"https://wallstreetcn.com/livenews/3137762","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周二（7月21日）纽约尾盘，标普500股指期货最终涨0.82%，道指期货涨0.73%，纳斯达克100股指期货涨1.75%。\n\n罗素2000股指期货涨1.36%。","tags":[],"cluster_size":1,"ts":"2026-07-21T21:11:37"},{"id":12691,"title":"7月22日热门中概股涨跌不一 台积电涨5.50%，阿里巴巴跌1.98% - 新浪网","url":"https://news.google.com/rss/articles/CBMijwJBVV95cUxNdGJ6ZjkxVFBwWWlQOVRtamwzTXRRN2kwYW02U0xIRWpxcE12VC00b3U4S3pqLXZ2Ri1EenJqclpVZ2ZSQ1F3ODJ1WHhjRDFHTVVENlhjWjcyVjNWazQyNFI0R2EwSGFFYXlRQ2FrMHFOWGRnM0NyUTljOUZxZkhZWjZnTTF3N1o2VXpEd1NzOG1sYV9MNUU2UUk3cWpxaUxSVFpHeGUxaHRwQTJJZ25aUkUybHd2LVdHUEFYeENvbmZmS1pCaGJPa09wMVdUdENWd3JLQkl6aGRZOFdidXlQUzZhbEJnX1l2a2JTX3RQRFhzS0JDTDJadEhWVW5EUlpvT0F3dk5yUUd0TGtybG5V?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijwJBVV95cUxNdGJ6ZjkxVFBwWWlQOVRtamwzTXRRN2kwYW02U0xIRWpxcE12VC00b3U4S3pqLXZ2Ri1EenJqclpVZ2ZSQ1F3ODJ1WHhjRDFHTVVENlhjWjcyVjNWazQyNFI0R2EwSGFFYXlRQ2FrMHFOWGRnM0NyUTljOUZxZkhZWjZnTTF3N1o2VXpEd1NzOG1sYV9MNUU2UUk3cWpxaUxSVFpHeGUxaHRwQTJJZ25aUkUybHd2LVdHUEFYeENvbmZmS1pCaGJPa09wMVdUdENWd3JLQkl6aGRZOFdidXlQUzZhbEJnX1l2a2JTX3R AND 产能给英伟达，三星加速 V9、V10 闪存布局","url":"https://www.ithome.com/0/979/856.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"d298\"\u003eIT之家 7 月 22 日消息，韩媒 sedaily 于 7 月 20 日发布博文，报道称在 NAND Flash 闪存供应方面，三星正扩大和英伟达的合作，\u003cstrong\u003e向后者供应超过 60% 的 V-NAND（垂直 NAND）产能。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"8acf\"\u003eIT之家注：V-NAND 是一种通过纵向堆叠存储单元提升容量与密度的闪存架构。与平面 NAND 相比，它可在相同芯片面积内容纳更多存储层，常用于企业级 SSD、数据中心存储和高容量移动存储产品。\u003c/p\u003e\u003cp data-vmark=\"dd08\"\u003e报道指出伴随着 AI 服务器规模扩大，临时上下文数据（Key-Value cache，也称 KV 缓存）规模持续扩大，已开始形成数据瓶颈。英伟达希望通过 Context Memory Storage（上下文内存存储，CMX）缓解这一限制，三星已成为相关 NAND 供应方。\u003c/p\u003e\u003cp data-vmark=\"e9c6\"\u003e英伟达目前用于 AI 服务器的 CMX 搭载 576 块 SSD，总存储容量达到 9600TB。业内预计，CMX 所需的 NAND 需求 2026 年为 3500 万 TB，而 2027 年将激增到 1 亿 TB 以上。\u003c/p\u003e\u003cp data-vmark=\"a9de\"\u003e鉴于三星今年的 N","tags":[],"cluster_size":1,"ts":"2026-07-22T01:26:33"},{"id":12952,"title":"雷蛇推出魔音海妖 V3 幻彩版 32 位 DSP 麦克风，支持 AI 音频处理","url":"https://www.ithome.com/0/979/855.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"93c0\"\u003eIT之家 7 月 22 日消息，Razer 雷蛇昨日宣布推出魔音海妖 V3 幻彩版 32 位 DSP (Seiren V3 Chroma 32-Bit DSP)。这一超心形拾音 USB 麦克风采用 32 位音频数字信号处理，\u003cstrong\u003e提供更显著的动态余量\u003c/strong\u003e，\u003cstrong\u003e可呈现更干净的人声\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"bfe6\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/fb1c112a-95be-4872-9386-cafb7929047b.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"810\" data-weibo=\"0\" data-vmark=\"72b2\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"d0e1\"\u003e此款麦克风具备 AI 驱动的智能音频处理，内置降噪、自动均衡、压缩、限幅功能；\u003cstrong\u003e支持 120dB 最大声压级\u003c/strong\u003e、\u003cstrong\u003e112dB 信噪比\u003c/strong\u003e；具备由雷蛇 Chroma 技术支持的直播与游戏响应式灯光效果；提供轻触","tags":[],"cluster_size":1,"ts":"2026-07-22T01:25:23"},{"id":12953,"title":"OpenAI智能体用户突破1000万，ChatGPT Work发布后需求翻倍 - 手机网易网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1WNjhD  Caplight 称，甚至有部分买家试图以接近 600 亿美元估值的价格购买 Neuralink 股份。由于 Neuralink 是一家私营公司，投资者通过二级市场购买由员工或早期投资者出售的股份，这些估值是基于市场需求的估算，而非公开市场的连续交易价格。\u003c/p\u003e\u003cp data-vmark=\"c9ff\"\u003eNeuralink 二级市场估值的飙升，反映出投资者对马斯克旗下 AI 与机器人领域资产的浓厚兴趣。今年 6 月，SpaceX 完成上市，目前公开市场估值约 1.6 万亿美元。私人投资者愈发愿意支付高额溢价，以获得投资马斯克旗下其余未上市公司的机会。一位风险投资人表示，其多位有限合伙人一直在要求“以任何价格”购买 Neuralink 的股份。\u003c/p\u003e\u003cp data-vmark=\"5728\"\u003eNeuralink 成立于 2016 年，致力于开发脑","tags":[],"cluster_size":1,"ts":"2026-07-22T01:05:13"},{"id":12962,"title":"苹果已修复“隐藏电子邮件”漏洞，7 月 7 日前创建地址仍存泄露风险","url":"https://www.ithome.com/0/979/847.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"65e2\"\u003eIT之家 7 月 22 日消息，科技媒体 404Media 昨日（7 月 21 日）发布博文，刊发来自苹果公司的官方声明，指出该公司已经于 7 月 3 日部署补丁，\u003cstrong\u003e修复了“隐藏电子邮件”（Hide My Email）功能漏洞。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"f5b8\"\u003eIT之家注：Hide My Email 是苹果在 iCloud+ 中提供的隐私功能，可生成随机匿名邮箱，供用户注册网站、服务或对外收发邮件。其目的在于减少真实邮箱地址直接暴露给第三方，降低跨服务关联和信息泄露风险。\u003c/p\u003e\u003cp data-vmark=\"5717\"\u003e消息称该漏洞最早由 EasyOptOuts 公司发现，在 2025 年 6 月报告给苹果公司后，一直没有后续动作。苹果公司曾于 2026 年 3 月回复称已修复，但 EasyOptOuts 联合创始人 Tyler Murphy 表示问题依然存在。\u003c/p\u003e\u003cp data-vmark=\"bfbe\"\u003eMurphy 随后联系 404Media 媒体，对外披露了该漏洞，才倒逼苹果公司尽快修复。\u003c/p\u003e\u003cp data-vmark=\"182e\"\u003e该媒体于 7 月 1 日发布博文，披露指出 Hide My Email 存在漏洞，攻击者可以将匿名生成的转发地址逆向关联至用户的真实 Apple I","tags":[],"cluster_size":1,"ts":"2026-07-22T01:05:13"},{"id":12964,"title":"北京通用人工智能研究院院长朱松纯：AI 行业少不了文科生","url":"https://www.ithome.com/0/979/845.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c5b5\"\u003eIT之家 7 月 22 日消息，据央视财经 20 日报道，北京通用人工智能研究院院长、北京大学智能学院院长朱松纯表示，做人工智能少不了文科生，AI 时代需要文理工跨界通才。\u003c/p\u003e\u003cp data-vmark=\"a24f\"\u003e他认为，通用人工智能本质就是“造人”，而搞懂“什么是人”，恰恰是人文社科的长项。朱松纯教授寄语青年与家长：未来的 AI 时代，\u003cstrong\u003e我们需要的是穿透文理工跨界的“通才\u003c/strong\u003e”。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"e5b3\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/af5217df-a196-41ad-8b75-50aa6d 件，遭田纳西大学研究基金会起诉 - Sohu","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxORURhZGpkQ1F6WEVJdUNmMWlhbHNaclFVNFJuQmNUY1hGTW1maDhGX19CVDhJeVFXMXB1UEZlVWlsQk1VYjYxTC0wU2dkeFFybk9KMHczNk5RaW8zTlJpc1hnRGhHTmlUMUdlX1djQzhQZkE5dzItbTBMa3lXeFBDdWxYbTBCaG9m?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词","IT之家"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxORURhZGpkQ1F6WEVJdUNmMWlhbHNaclFVNFJuQmNUY1hGTW1maDhGX19CVDhJeVFXMXB1UEZlVWlsQk1VYjYxTC0wU2dkeFFybk9KMHczNk5RaW8zTlJpc1hnRGhHTmlUMUdlX1djQzhQZkE5dzItbTBMa3lXeFBDdWxYbTBCaG9m?oc=5\" target=\"_blank\"\u003eAnthropic首次面临专利侵权案件，遭田纳西大学研究基金会起诉\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eSohu\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-22T00:59:58"},{"id":12969,"title":"耳听为虚：AI 冒充亲友、伪造名人声音、散布虚假言论，国家安全部警示 AI 语音深度合成三大风险","url":"https://www.ithome.com/0/979/841.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"649d\"\u003eIT之家 7 月 22 日消息，国家安全部今日发文，对于当前 AI 语音克隆技术可能存在的风险进行了警示。\u003c/p\u003e\u003cp data-vmark=\"ac11\"\u003e得益于 AI 技术的快速发展，AI 已能在极短时间内完成对真实人声的高仿真复刻，但相关滥用行为正严重扰乱社会秩序、侵害群众财产安全。国家安全部分析了 AI 语音克隆技术的三个主要特征。\u003c/p\u003e\u003cul class=\" list-paddingleft-2\"\u003e\u003cli\u003e\u003cp data-vmark=\"9252\"\u003e其一，采样速度极快，主流商业平台所需的最短训练样本时长已从几十分钟压缩至 3 到 5 秒。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data-vmark=\"2ee4\"\u003e其二，合成语音极为逼真，研究显示在无提示情况下普通人识别高质量合成语音的准确率不足 50%。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data-vmark=\"d8d5\"\u003e其三，操作极为简便，大批在线平台向公众开放“声音克隆”功能，普通用户上传样本即可一键生成。\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"text-align: center;\" data-vmark=\"90c3\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/fb11de2d-261e-4d66-8799-1","tags":[],"cluster_size":1,"ts":"2026-07-22T00:58:47"},{"id":12970,"title":"OpenAI未发布模型在测试中逃出沙箱 - 华尔街见闻","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBuaElyV1d3VmxDdjhHeVUwMVVVRk15ZkJBQnVlckdGOVE5ZktJOFdVbUZNcG9SUTZGdGZWeWdTa have become increasingly popular in applications such as social interaction, education, and service roles, which drives the need for more natural and efficient human-robot interactions. However, currently available humanoid heads often face limitations, including high costs, mechanical complexity, and limited adaptability across diverse environments. To address these challenges, we present an articulated humanoid robot head designed for a receptionist role, integrating a mechanical structure with 21 degrees of freedom (DoF), incl","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12825,"title":"ADMM-Based Safety-Critical Distributed NMPC for Cooperative Transportation by Quadrupedal Robots","url":"https://arxiv.org/abs/2607.17007","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.17007v1 Announce Type: new \nAbstract: This paper presents a safety-critical distributed nonlinear model predictive control (DNMPC) framework for cooperative payload transportation by teams of quadrupedal robots. The proposed approach models the robotic team and the shared payload as a dynamically coupled networked system with rigid holonomic coupling constraints arising from cooperative transportation. To enable distributed real-time optimization, the centralized finite-horizon optimal control problem is decomposed into parallel local NMPC subproblems coordinated through the alterna","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12824,"title":"User-Driven Learning from Demonstration: A Trajectory and Impedance Learning Method","url":"https://arxiv.org/abs/2607.16998","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16998v1 Announce Type: new \nAbstract: This paper presents a method for user-driven robot Learning from Demonstration (LfD) that reduces user effort while ensuring compliant and precise reproduction. The method eliminates repeated teaching for the same task and enables real-time learning from a single demonstration. Demonstrated motions are reproduced with high precision, while impedance variations are learned in real time to provide both compliance and robustness against perturbations. This mitigates potential safety issues in Human-Robot Interaction (HRI) that arise from convention","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12823,"title":"G2-Nav: Grounded and Guarded Vision-Language Costmaps for Robot Social Navigation","url":"https://arxiv.org/abs/2607.16956","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16956v1 Announce Type: new \nAbstract: Social navigation requires the robot to reason and respond in complex real-world environments. While recent works attempt to incorporate human-level intelligence into robot planning using large Vision-Language Models (VLMs), end-to-end frameworks often create an unpredictable black-box, and existing instruction-following methods are not designed for full autonomy. To bridge this gap, we present G2-Nav, a novel framework that grounds abstract social reasoning and guards safe real-world deployment. Instead of asking the VLM for direct planning dec","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12822,"title":"PREFAIL: Identifying Precursors to Failures in Robotic Lift-and-Place Tasks to Improve Task Execution Performance","url":"https://arxiv.org/abs/2607.16921","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16921v1 Announce Type: new \nAbstract: Non-prehensile manipulation enables flexible material handling with part carriers, but friction-based support makes high-speed motions failure-prone, while slower operation increases cycle time. Proactive failure prediction is therefore essential for efficient and reliable performance, yet existing approaches remain limited by key constraints, including sensitivity to dynamic actions and high dependence on known policy structures. Furthermore, existing methods and datasets lack a precise characterization of the latest intervention time, leaving","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12821,"title":"A BIM-enabled, Agent-based Discrete-event Simulation Platform for Robotic Studies: A Method based on Graph Theory","url":"https://arxiv.org/abs/2607.16920","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16920v1 Announce Type: new \nAbstract: Indoor robots are increasingly employed for facility management tasks such as cleaning and inspection. These applications primarily rely on navigation and can be effectively supported by predefined routes or perception-driven Simultaneous Localization and Mapping (SLAM) techniques. However, more complex tasks, such as locating and repairing leaking pipes, require not only navigation but also access to building information, including the location, geometry, material, and operational attributes of components. Existing navigation approaches provide","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12820,"title":"GLidE-SLAM: GL-Accelerated Indirect-Direct Embedded SLAM","url":"https://arxiv.org/abs/2607.16897","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16897v1 Announce Type: new \nAbstract: With the growing demand for robotics, autonomous drones, and wearable extended reality systems, the deployment of Visual SLAM on embedded devices remains challenging. Tracking must sustain high frame rates while preserving compute resources for map extension and maintenance. This paper presents GLidE-SLAM, a monocular hybrid indirect-direct framework that addresses this by architectural separation: the system performs GPU-accelerated direct tracking on intermediate frames, while reserving the full indirect pipeline for map extension and global c","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12819,"title":"PhyAgentOS: A Self-Evolving Operating System for Embodied Agents with Decoupled Cognitive Planning and Physical Execution","url":"https://arxiv.org/abs/2607.16636","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16636v1 Announce Type: new \nAbstract: Vision-language-action models, world models, and agentic planners each advance physical intelligence, yet their composition lacks a common execution abstraction, shared state, semantic verification, and persistent experience across heterogeneous embodiments. We present PhyAgentOS, a runtime foundation delivering scheduling, verification, memory, benchmarking, and safety as system-level services. Its Session-Centered Runtime treats a session, not an action, as the minimum unit of scheduling, compatibility preflight, supervised execution, evidence","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12818,"title":"AI-Augmented Model Predictive Control for Safe and Adaptive Rendezvous and Proximity Operations","url":"https://arxiv.org/abs/2607.16630","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16630v1 Announce Type: new \nAbstract: Autonomous rendezvous and proximity operations (RPO) in adversarial orbital environments require guidance architectures balancing target pursuit, safety preservation, and real-time adaptability under dynamically evolving interaction conditions. Although learning-based approaches show promise, their application to safety-critical orbital robotics remains limited by concerns regarding interpretability, robustness, and constraint awareness. This work presents an adaptive Model Predictive Control (MPC) framework for autonomous spacecraft RPO in mult","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12817,"title":"SAGE: A Socially-Aware Generative Engine for Heterogeneous Multi-Agent Navigation","url":"https://arxiv.org/abs/2607.16619","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16619v1 Announce Type: new \nAbstract: Safe and socially compliant navigation in open human-robot environments requires robots to reason about heterogeneous participants with different dynamics, autonomy levels, and social roles. Existing trajectory prediction and planning methods often rely on homogeneous interaction assumptions or enforce only geometric collision constraints, making it difficult to jointly model asymmetric interactions, coupled prediction-planning, and soft social norms. This paper proposes SAGE, a socially-aware generative engine for heterogeneous multi-agent navi","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12816,"title":"Autonomous VR-Based Risk Detection for Situational Awareness in Dangerous Settings","url":"https://arxiv.org/abs/2607.16582","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16582v1 Announce Type: new \nAbstract: In high-risk environments such as disaster response, situational awareness depends not only on detecting hazards but also on communicating them clearly to human operators. Vision Language Models (VLMs) have shown strong potential for scene understanding in safety-critical settings, yet their value as part of human-facing robotic systems remains underexplored. We present a VR-based Human Robot Interaction framework for studying how VLM-assisted robots can support situational awareness in simulated hazardous environments. In our system, a robot ex","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12815,"title":"Differentiable Reinforcement Learning for Path Tracking by an Agile Fish-Like Robot","url":"https://arxiv.org/abs/2607.16508","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16508v1 Announce Type: new \nAbstract: Fish-like swimming has inspired the design of several dozens if not hundreds of bioinspired robots in the last few decades. But the control and motion planning of such robots has been challenging due to the poorly modeled fluid-structure interaction and the nonlinear underactuated dynamics of such robots. While reinforcement learning has allowed significant advances in the context of ground and aerial robots, the lack of a suitable simulation environment with appropriate computational speed and accuracy have prevented similar progress for fish-l","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12814,"title":"Foresight Residual RL for Long-Horizon Robot Manipulation with Vision-Language-Action Models","url":"https://arxiv.org/abs/2607.16506","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16506v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) policies offer strong general-purpose manipulation priors, but often fail on tight-tolerance, contact-rich assembly due to long-horizon credit assignment and subtask coupling: a state that is geometrically successful for the current skill can be brittle for downstream skills. We show this failure mode in residual reinforcement learning (RL) over a frozen VLA base policy: constant sparse success rewards improve each subtask in isolation yet yield little or no gain when skills are chained, because terminal state qualit","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12813,"title":"Certifiable Safe Model-Based Reinforcement Learning with Control-Affine Dynamics Approximation","url":"https://arxiv.org/abs/2607.16501","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16501v1 Announce Type: new \nAbstract: Safe model-based reinforcement learning (RL) often bridges control-theoretic analysis and RL for robots to safely explore (partially) unknown system dynamics while deriving control actions for task efficiency. The control performance and safety assurance typically rely on prior knowledge of partially modeled nominal system dynamics and the data-driven models that compensate for residual model uncertainties. However, existing methods often overlook the structure of residual model uncertainties (e.g., components affine in control), which could lea","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12812,"title":"Back to the museum: Investigation of the acceptance of Android Andrea with and without emotion simulation in a museum","url":"https://arxiv.org/abs/2607.16428","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16428v1 Announce Type: new \nAbstract: For a second time, the android robot Andrea was set up at a public museum in Germany for six consecutive days to have conversations with visitors, fully autonomously. Building on previously gathered qualitative results, the robot was now capable of engaging in multi-lingual conversation with the visitors about the museum context. The robot was prepared with context information about the museum in general and its surrounding exhibits this time. The robot featured a slightly artificial sounding voice that was previously evaluated as congruent with","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12811,"title":"PRISM: Multimodal Terrain Mapping for Rover Navigation in Unstructured Environments","url":"https://arxiv.org/abs/2607.16366","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16366v1 Announce Type: new \nAbstract: Robotic navigation in unstructured environments requires robust situational awareness to safely traverse hazards such as steep slopes and rocky terrain. To address this challenge, perception systems increasingly rely on multimodal sensor fusion. Specifically, integrating thermal imagery with standard optical and depth sensors enhances terrain differentiation, directly improving the reliability of mapping algorithms. This paper presents PRISM, a multimodal perception system for terrain mapping in unstructured settings. PRISM leverages a custom se","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12810,"title":"S.E.A.G.R: A Socially and Emotionally Aware Greeting Robot Framework with Dual-Layer Cultural and Affective Modulation","url":"https://arxiv.org/abs/2607.16341","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16341v1 Announce Type: new \nAbstract: This paper presents SEAGR (Socially and Emotionally Aware Greeting Robot), a robotic greeting framework designed for human-robot interaction environments involving users from diverse cultural backgrounds and different emotional states. Since greeting behaviour strongly influences first impressions, user comfort, and trust, robots operating in public spaces must be able to interact in a socially appropriate and adaptive manner. However, many existing systems still rely on static greeting routines that do not account for cultural variation, emotio","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12809,"title":"Real-Time sEMG-Based Telecontrol of an Assistive Robotic Arm Using a 1D Convolutional Neural Network","url":"https://arxiv.org/abs/2607.16310","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16310v1 Announce Type: new \nAbstract: Motor impairments affecting the upper limb significantly reduce autonomy in daily activities, particularly for tasks involving object manipulation. Assistive robotic arms offer a promising solution, provided they can be controlled in an intuitive, reliable, and responsive manner. Among human--machine interface approaches, surface electromyography (sEMG) enables non-invasive access to muscle activity and thus to the user's motor intentions. This work proposes a real-time sEMG-based interface for the teleoperation of an assistive robotic arm. The","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12808,"title":"Control Design for a Rideable Animatronic Two-Wheeled Robot with Quadruped Form","url":"https://arxiv.org/abs/2607.16302","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16302v1 Announce Type: new \nAbstract: In recent years, motorcycle popularity has been declining, particularly among the younger generations. To rekindle interest in motorcycles among this demographic, we developed a rideable two-wheeled robot equipped with four limbs as a future partner mobility concept and intended for use in public events. The character reproduced by this robot carries the protagonist on its back and exhibits a dynamic quadrupedal gait. To maximize the riding experience, we aimed to match the robot's weight and size to the character's specifications while ensuring","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12807,"title":"HyperDCM: Dynamic Cluster Memory Replay in Hyperbolic Space for Continual Robotic Navigation Across Scenes","url":"https://arxiv.org/abs/2607.16267","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.16267v1 Announce Type: new \nAbstract: Continual learning in visual navigation remains challenging due to catastrophic forgetting and the difficulties associated with adapting to diverse and evolving environments. To address these issues, we propose Hyperbolic Dynamic Cluster Memory (HyperDCM), a structure-aware memory mechanism that enhances diffusion policy-based navigation through scene graph modeling and principled memory replay. HyperDCM extracts semantic scene triples from RGB observations using large vision-language models, encodes them into scene graph embeddings via a Relati","tags":[],"cluster_size":1,"ts":"2026-07-21T04:00:00"},{"id":12827,"title":"特斯拉机器人进军银发护理，马斯克称将替代传统养老院 - AgeClub","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE5RbWtfNVlYMkVxLV9XakVZRDhzcVlzbVpuM3Jta3RyemtTd3FLdXFHNTZYVmlKc2p3dkgyTURURVRSY1djNTE1MU9kOVFGN1Iyd3oyQmd3?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE5RbWtfNVlYMkVxLV9XakVZRDhzcVlzbVpuM3Jta3RyemtTd3FLdXFHNTZYVmlKc2p3dkgyTURURVRSY1djNTE1MU9kOVFGN1Iyd3oyQmd3?oc=5\" target=\"_blank\"\u003e特斯拉机器人进军银发护理，马斯克称将替代传统养老院\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eAgeClub\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-21T00:41:25"},{"id":12828 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
