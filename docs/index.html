8?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMinwFBVV95cUxPYlZxeS04MVJuRE9RdFU0Qm1nYlNYaW5ucnZKWDNhUm1xaFdHdzZ2a2duWndHaXpHLXJlb2hiTzZBMzN2bk4wTERBbzRXY3lXcHpPX1pfVFQtb1M1RXcxcGRoZ3U1a05nVk54dU5WMkc4NEFKY3l4SjFBNEJXN1Naemp0aF90UXFHa0I1Z0VEcVpLcy1INElaMWVqSGFUem8?oc=5\" target=\"_blank\"\u003e市场传闻：阿里巴巴与Honor将深化AI设备合作\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-15T01:16:24"},{"id":10564,"title":"巴林再次拉响防空警报","url":"https://wallstreetcn.com/livenews/3133963","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"巴林内政部15日凌晨在社交媒体上说，巴林再次拉响防空警报。14日深夜，伊朗伊斯兰革命卫队表示，伊朗武装部队对美军位于巴林的谢赫伊萨空军基地和位于科威特的阿里·萨利姆空军基地发动了导弹和无人机袭击，摧毁了数架MQ-9“死神”无人机以及武器和零部件仓库。（央视新闻）","tags":[],"cluster_size":1,"ts":"2026-07-15T00:52:50"},{"id":10565,"title":"华尔街见闻早餐 | 2026年7月15日","url":"https://wallstreetcn.com/livenews/3133937","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美国6月通胀降温，美债和金银盘中拉升，期金一度涨近3%；芯片股力挺美股反弹，SK海力士美股涨27%，英伟达涨超4%；华尔街大行财报稳健，高盛涨9%、摩根大通涨2.5%；离岸人民币近一个月来首次盘中涨破6.77。\n\n美国通胀超预期降温：6月CPI六年来首次环比下降，核心CPI环比意外零增长。\n\n沃什国会听证首秀：美联储对持续高通胀“零容忍”，即使特朗普批评也会按数据行动，6月CPI降温不代表通胀“任务完成”。\n\n特朗普才一天就改口：放弃霍尔木兹海峡货运收费20%，以海湾国家与美国达成贸易投资协议取代，美油盘中“闪跌”。\n\nAI投资热潮驱动，中国6月出口同比大增27%远超预期，创逾四年最高增速，上半年出口同比增长17.6%；6月原油进口同比降41%，大豆进口创13个月新高，铝出口创历史新高，上半年算力硬件进出口增长55.6%。\n\n长鑫科技IPO发行价为8.66元，7月16日进行申购。\n\n全美首个州级“刹车令”：纽约州暂停新建大型AI数据中心，一年内不再发放新许可。\n\nIBM Q2初步营收不及预期，客户需求转向，CEO承认“执行不到位”，股价跌25%创纪录。\n\n高盛Q2营收创新高，股票交易收入连续三个季度刷新华尔街纪录，SpaceX上市推动股票承销收入飙升130%。\n\n摩根大通Q2净利润增长41%，股票交易收入飙升86%，戴蒙警告深层风险正在积聚。\n\n美国银行Q2营收大超预期，股票交易暴","tags":[],"cluster_size":2,"ts":"2026-07-14T23:45:36"},{"id":10566,"title":"今年以来券商境内发债规模同比增长近一倍，与业绩改善形成正反馈","url":"https://wallstreetcn.com/livenews/3133926","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，多家上市券商获证监会批准发行大额公司债，部分券商已发债券还迎来一波评级上调。截至7月14日发稿时，今年以来券商境内发债规模已超1.35万亿元，与去年同期6869.19亿元相比，规模接近翻倍。同时，多家券商预告上半年业绩将创同期历史新高，中信证券、国泰海通、招商证券等预计上半年归母净利润超百亿元。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T23:02:21"},{"id":10567,"title":"资金借道股票型ETF流入市场，宽基产品获大举增持","url":"https://wallstreetcn.com/livenews/3133925","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月13日A股大幅回调之际，近600亿元抄底资金借道股票型ETF流入市场，资金规模创下2025年4月8日以来的单日新高，中证1000、沪深300、中证500等宽基ETF获大举增持。业内机构提示，前期科技成长赛道持续走强，积累了较大规模的融资盘，随着市场波动加剧，部分杠杆资金开始主动或被动撤离。中期视角来看，支撑A股市场向上的核心逻辑并未因本轮杠杆出清而发生改变，当前调整更多是交易结构的修正，市场正处于由极致结构性行情向风格再平衡过渡的阶段。AI产业趋势未被证伪，三季度或转向“选细分、验业绩”阶段。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T23:01:03"},{"id":10568,"title":"中证报：剑指财务造假顽疾，资本市场持续释放严监管信号","url":"https://wallstreetcn.com/livenews/3133924","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"天际股份因涉嫌信息披露违法违规，于7月13日收到行政处罚事先告知书；ST荃银、倍轻松7月11日公告，因信息披露违法违规收到行政处罚决定书……这是监管部门从严打击财务造假等信息披露违法违规行为的最新案例。市场人士认为，随着打击和防范上市公司财务造假专项行动深入推进，监管部门依法从严从快、全链条追诉，行政、民事、刑事多重惩戒同步发力，央地协同持续走深走实，防假打假的合力正在凝聚，“不敢造假、不能造假、不想造假”的市场生态加速形成。","tags":[],"cluster_size":1,"ts":"2026-07-14T22:57:47"},{"id":10569,"title":"行业景气度与下游需求共振，十余家科创板公司上半年业绩预喜","url":"https://wallstreetcn.com/livenews/3133921","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至7月14日18时，科创板共有17家公司披露2026年上半年业绩预告。总的来看，17家公司业绩全线向好，有13家预计净利润同比增长，4家预计扭亏为盈。其中，南亚新材、复旦微电、生益电子等9家公司预计上半年净利润实现倍增（以预告净利润同比增长上限计算）。从行业角度来看，这些“打头阵”公司分布于半导体、电子元件、通信设备等多个领域。行业景气度攀升、AI需求高企、产品量价齐升，是这些公司业绩增势喜人的主要原因。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:51:50"},{"id":10570,"title":"主营产品量价齐升，上市矿企上半年业绩扎堆大增","url":"https://wallstreetcn.com/livenews/3133919","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"紫金矿业预计上半年盈利391亿元，洛阳钼业预计净赚155亿元至165亿元，盛达资源、西部黄金、株冶集团、西部矿业等预计业绩增幅下限均超过100%……近期，上半年业绩预喜成为A股上市矿企关键词。支撑矿企业绩大增的，是主营矿产品量价齐升。A股某矿产公司人士认为，中长期来看，有色金属作为能源转型、数字经济的核心战略金属，供需长期错配格局未改变，拥有优质自有矿山、持续扩产的头部企业，有望充分享受行业长期高景气周期。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:45:54"},{"id":10571,"title":"景气度攀升，覆铜板领涨产业链，PCB行业盈利能力大增","url":"https://wallstreetcn.com/livenews/3133918","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"半年度业绩预告强制披露已近尾声，A股PCB产业链上市公司盈利能力大幅提升已经展露无遗，行业整体盈利中枢持续抬升。审视PCB产业链上市公司业绩增长的背后，AI算力需求是最大推手，产品涨价则直接增厚业绩，上游覆铜板（CCL）企业盈利弹性显著高于中游PCB制造厂商。展望下半年，多位业内人士认为，随着AI算力基础设施建设浪潮持续，上游覆铜板、电子布供应紧张短期难以缓解，PCB产业链整体量价齐升依然是大趋势。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:42:34"},{"id":10572,"title":"评级调整牵动债市定价，多家机构排查信用债持仓情况","url":"https://wallstreetcn.com/livenews/3133916","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"信用债市场正在经历从“评级标签”到“真实资质”的再定价，并对资管行业产生影响。从业内获悉，近期基金、银行、保险等机构开始排查信用债持仓，重点关注评级调整可能带来的估值波动和出库（指将资产卖出或转出账户）压力。业内人士认为，随着评级监管趋严、终止评级和无评级发行增多，部分外部评级较高但基本面存在瑕疵的主体，或面临更明显的估值压力和流动性考验。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:36:22"},{"id":10573,"title":"绩优基金二季报密集披露：更加聚焦硬科技，锚定产业发展趋势","url":"https://wallstreetcn.com/livenews/3133915","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"绩优基金2026年二季报密集披露，多只绩优基金二季度规模大幅增长。从持仓变动情况看，多只绩优基金对持仓结构进行了调整，更加聚焦硬科技。多位基金经理表示，后续将紧密跟踪产业发展趋势，关注上市公司基本面。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:34:27"},{"id":10574,"title":"头部公募掀起南下“举牌潮”，港股创新药开启估值修复行情","url":"https://wallstreetcn.com/livenews/3133910","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"近日，港股创新药板块掀起一轮公募基金“举牌潮”。易方达、富国、汇添富等头部公募基金在一个月内增持多只港股创新药标的，并触及举牌线。与此同时，南向资金对迈威生物、科济药业等个股的持股数6月以来也出现大幅提升。机构认为，在AI主线进入休整、资金寻求高低切换的背景下，估值处于历史低位、BD出海持续放量且政策红利加速释放的创新药板块，正迎来多重逻辑共振的估值修复窗口。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-14T22:16:14"},{"id":10575,"title":"法国男子从中国带回空调给母亲使用，中国移动分体式空调在法国市场受青睐 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQTU8zMGlNMUQ4R0V5eTR2OERhaWQ3ZzlyekV1VzFWanpZdzVjMGlZMHZQa0pUX1hWcnVWcWlSc3dNTDBha0NEdjg1UGQzR1owc3RHRHJCQkdxVVZyRldwRlVJclFESEQ3U1IxT00zeEp3OS1nbDNVS01oM08tZVF0UjlVb1FlZkxZWDZv?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQTU8zMGlNMUQ4R0V5eTR2OERhaWQ3ZzlyekV1VzFWanpZdzVjMGlZMHZQa0pUX1hWcnVWcWlSc3dNTDBha0NEdjg1UGQzR1owc3RHRHJCQkdxVVZyRldwRlVJclFESEQ3U1IxT00zeEp3OS1nbDNVS01oM08tZVF0UjlVb1FlZkxZWDZv?oc=5\" target=\"_blank\"\u003e法国男子从中国带回空调给母亲使用，中国移动分体式空调在法国市场受青睐\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T21:57:16"},{"id":10576,"title":"美国通胀降温缓解美联储加息预期，拉美资产集体走高","url":"https://wallstreetcn.com/livenews/3133897","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周二，大多数拉美资产出现上涨。低于预期的美国通胀报告令美元承压，而大宗商品价格的走高则为这一资源富集地区的市场提供了支撑。\n\n拉美货币是新兴市场中收益率最高的货币之一，由于利差保持宽幅，它们受益于套息交易的需求。然而，巴西和墨西哥等主要经济体的央行近期一直在从历史高位下调贷款利率。\n\n巴西雷亚尔涨幅最大，上涨1.3%，升至近一个月来的最高水平。该地区最大经济体的股市上涨了0.4%，其中矿业巨头淡水河谷（Vale）股价上涨了1.7%。\n\n智利和墨西哥的货币分别升值了0.8%和0.5%。智利股市上涨0.4%，跟随铜价创下三周新高的走势。\n\n墨西哥基准股指涨幅最大，上涨0.9%，因为铜价走高提振了墨西哥集团（Grupo Mexico）股价上涨4%。\n\n哥伦比亚比索表现异常，贬值0.3%，其股市下跌0.5%。\n\n更广泛的MSCI拉美货币指数上涨了0.7%，其股票指数则上涨了1.3%。","tags":[],"cluster_size":1,"ts":"2026-07-14T21:34:23"},{"id":10577,"title":"周二（7月14日）纽约尾盘，标普500股指期货最终涨0.41%，道指期货涨0.10%，纳斯达克100股指期货涨1.12%。\n\n罗素2000股指期货涨0.44%。","url":"https://wallstreetcn.com/livenews/3133887","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周二（7月14日）纽约尾盘，标普500股指期货最终涨0.41%，道指期货涨0.10%，纳斯达克100股指期货涨1.12%。\n\n罗素2000股指期货涨0.44%。","tags":[],"cluster_size":1,"ts":"2026-07-14T21:07:38"},{"id":10578,"title":"阿里巴巴期权聚焦：7月14日成交8.66万张，未平仓合约234.57万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxQTmFqMWZHZW1zTHpvTjBwWTVxQjBBWGFXZEpKMjFYd0xzR3A1ZmVzdnhUZXdob0pXUmNGNWxiTEU5QjhELTVycmpUeUQ1c2t1VG0yUG1mbnhweWtPVDJzRjR5NTlBWjcweFFZc3RnMS1aZzlfZ0FSdmtCUnpiRGw0aTYzNi1zNVl3dnlTbkZabzVMQjgwRlBhQmlqdXNZZ3otX3pZT2h0WQ?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxQTmFqMWZHZW1zTHpvTjBwWTVxQjBBWGFXZEpKMjFYd0xzR3A1ZmVzdnhUZXdob0pXUmNGNWxiTEU5QjhELTVycmpUeUQ1c2t1VG0yUG1mbnhweWtPVDJzRjR5NTlBWjcweFFZc3RnMS1aZzlfZ0FSdmtCUnpiRGw0aTYzNi1zNVl3dnlTbkZabzVMQjgwRlBhQmlqdXNZZ3otX3pZT2h0WQ?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月14日成交8.66万张，未平仓合约234.57万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
