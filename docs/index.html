60197","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股两连涨，标普500指数创一个月最大涨幅，日元急升2%，黄金大涨。\n\n美联储理事沃勒暗示倾向于按兵不动，市场下调9月升息预估。\n\n隔夜日元兑美元大涨，市场加大对日本加息的押注，并高度警惕日本当局再度入市干预。\n\n中国商务部：中欧磋商应平等解决彼此关切，不能单方面提要价、动辄以关闭市场相要挟。\n\n中国工信部等十部门发文促进中小企业发展，设立国家中小企业发展基金二期，带动社会资本投早投小投长期投硬科技，聚焦新能源、新材料、机器人及量子科技、脑机接口、具身智能等产业。\n\n美国7月贸易逆差创2025年初以来最高，8月ISM服务业指数创六个月新高。\n\n韩国紧急回应美国半导体关税计划：竭尽全力确保不损害韩企利益。\n\n默茨下周将会见欧洲央行官员，拉加德接班人之争升温。\n\n英伟达同意以129.3亿美元收购AI开源平台Hugging Face。\n\nOpenAI发布GPT-6 Astra，宣称以10万GPU训练，网络安全能力首次达到公司”关键”级，可识别未知软件漏洞并开发利用方式，但最强功能暂不全面开放。\n\nChatGPT、Claude、Grok一度集体宕机！持续近4小时，目前均已恢复。\n\n阿贝尔接棒后首次详谈伯克希尔投资：100亿美元加仓Alphabet，96岁巴菲特仍参与决策，五大商社拟持有数十年。\n\n提醒：周五将公布美国8月非农就业报告。","tags":[],"cluster_size":3,"ts":"2026-09-03T23:20:20"},{"id":25632,"title":"生物医药公司扎堆“赶考”港交所，“A+H”上市模式受青睐","url":"https://wallstreetcn.com/livenews/3160185","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"2026年至今，港交所共有17家生物医药公司上市，占当期新股总数量105家的16.19%，合计募资185.01亿港元；同时，年内已有110家生物医药公司递表港交所，覆盖肿瘤、CGT（细胞与基因治疗）、核药、眼科药物、医疗器械等热门赛道。此轮上市热潮中两大趋势尤为明显：一是多家A股药企跑步入场，争相构建“A+H”双资本平台；二是不少企业反复递表，甚至“四闯港交所”，高比例重复申报。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-03T22:28:39"},{"id":25633,"title":"创新药项目报价“水涨船高”，CRO行业下半年或加速回暖","url":"https://wallstreetcn.com/livenews/3160183","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"创新药行业景气度提升，正加速传导至CRO（医药研发外包组织）产业链。近日采访了解到，随着创新药BD（商务拓展）交易持续活跃，药企研发资金趋于充裕，为抢占创新药研发窗口、保障项目进度，药企对外部研发服务的付费意愿提升，CRO企业在手订单呈“量价齐升”态势。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-03T22:22:47"},{"id":25634,"title":"港股年内回购逾千亿元，三板块获重要股东增持","url":"https://wallstreetcn.com/livenews/3160181","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"2026年，港股市场在流动性博弈中走出震荡行情。截至9月3日，恒生指数年内微跌1.63%。在市场波动中，以AI、创新药、地产链为代表的三大赛道正在掀起重要股东增持的一波浪潮。同时，港股公司年内累计回购金额突破1000亿港元，回购股数为82.4亿股，回购股数同比增长55.4%。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-03T22:19:06"},{"id":25635,"title":"腾讯音乐拟发行10亿美元票据定价","url":"https://wallstreetcn.com/livenews/3160172","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"腾讯音乐 eIn modern automated manufacturing, six-axis articulated robots perform high-speed, multidirectional maneuvers under demanding operational cycles. However, as robot arms swivel, rotate, and extend, the electrical cables, fiber optics, and pneumatic hoses","tags":[],"cluster_size":1,"ts":"2026-09-03T12:18:21"},{"id":25677,"title":"The Best Way to Explore Lunar Craters Is a Giant Robot Ball","url":"https://spectrum.ieee.org/moon-ball-robot","source":"IEEE Spectrum · Robotics","sources":["IEEE Spectrum · Robotics"],"summary":"\u003cimg src=\"https://spectrum.ieee.org/media-library/a-gif-of-a-spherical-robot-rolling-over-a-bumpy-path.gif?id=67701776\u0026width=1245\u0026height=700\u0026coordinates=0%2C0%2C0%2C0\"/\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cp\u003eOn a good day, the rock quarry in central Texas is about 370,000 kilometers (230,000 miles) from the moon. But last February, when Rishi Jangale watched his 1.8-meter-wide, 150-kilogram inflatable robot roll effortlessly over rocks, gravel, and wet clay, his imagination turned the quarry into the lunar surface instead.\u003c/p\u003e\u003cp\u003eJangale is an upbeat mechanical engineer nearing the end of his Ph.D at Texas A\u0026M Universit","tags":[],"cluster_size":1,"ts":"2026-09-03T12:00:01"},{"id":25695,"title":"Advancing Accessible Underwater Robotics: The Mini-Girona I-AUV at RAMI 2025","url":"https://arxiv.org/abs/2609.02605","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02605v1 Announce Type: new \nAbstract: The Mini-Girona Intervention Autonomous Underwater Vehicle (I-AUV) represents an advancement in accessible underwater robotics, designed to bridge the gap between costly, specialized research AUVs and basic Remotely Operated Vehicles (ROVs). Developed with a focus on affordability and usability, the Mini-Girona, priced at approximately $50,000, integrates advanced components such as a 5-DOF manipulator arm, stereo vision, and AI-driven processing for autonomous navigation and intervention tasks. This paper presents the design and development of","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25694,"title":"ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation","url":"https://arxiv.org/abs/2609.02546","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02546v1 Announce Type: new \nAbstract: Zero-shot generalization to unseen embodiments is important for generalizable vision-language-action (VLA) models as robot hardware evolves and task-specific data collection remains costly. However, a systematic understanding of this problem remains limited, in part because the literature lacks a unified zero-shot transfer definition and controlled evaluation settings that isolate embodiment changes from differences in tasks, scenes, or protocols. To address this gap, we first distinguish strict zero-shot transfer, where the target embodiment is","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25693,"title":"World-Model-Augmented Visual Locomotion for Humanoids on Foothold-Constrained Terrain","url":"https://arxiv.org/abs/2609.02542","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02542v1 Announce Type: new \nAbstract: Foothold-constrained terrain is characterized by sparse, discontinuous, or geometrically restricted feasible foot contacts, as encountered on stepping stones, across gaps, and on narrow stair treads. On such terrain, a single misstep often leaves little room to recover, so policies that base foot-placement decisions primarily on the immediately visible terrain are prone to failure. We ask whether a learned predictive summary of near-future observations and rewards can provide the anticipatory information required in such settings. We present Wor","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25692,"title":"MS-MEM: Multi-Skill Manipulation-Enhanced Mapping via Uncertainty- and Disturbance-Aware Action Selection","url":"https://arxiv.org/abs/2609.02493","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02493v1 Announce Type: new \nAbstract: Accurate scene understanding in confined, cluttered spaces such as shelves is essential for service robots, as many everyday tasks require them to locate and retrieve objects reliably. Yet, it remains challenging due to severe occlusions, restricted accessibility, and the need to avoid excessive scene changes. In this paper, we propose Multi-Skill Manipulation-Enhanced Mapping (MS-MEM), an evidential framework for uncertainty-aware mapping that integrates active viewpoint selection, object pushing, and grasping. MS-MEM combines scene-level metri","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25691,"title":"An Adaptive Control Architecture for Slope and Terrain Compensation in Autonomous Navigation in Mediterranean Greenhouses","url":"https://arxiv.org/abs/2609.02487","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02487v1 Announce Type: new \nAbstract: The ability to move stably over terrain with varying slopes and textures is essential for mobile agricultural robots operating in complex and dynamic environments such as greenhouses, where small terrain irregularities can lead to significant navigation errors. This article presents a novel terrain-adaptation strategy based on the carried payload, ensuring accurate and robust trajectory tracking. The proposed approach is based on: (i) the experimental characterization of the most common types of greenhouse soil, concrete, compacted sand, and gra","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25690,"title":"A Physics-Consistent Benchmark for Contact-Rich Human-Robot Interaction in Assistive Care","url":"https://arxiv.org/abs/2609.02402","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02402v1 Announce Type: new \nAbstract: Conventional task-level evaluation asks whether a robot policy completes a specified action, but can miss failures that emerge only during physical human contact. This limitation is critical in contact-rich assistive tasks, where meaningful evaluation requires a physically responsive human, interaction-quality assessment beyond task success, and a leak-free observer-scorer protocol. We introduce a physics-consistent benchmark for contact-rich human-robot interaction, instantiated in robot-assisted bathing. The benchmark combines a deformable, pa","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25689,"title":"Humanoid Safe Stop via Learned Stoppability Value","url":"https://arxiv.org/abs/2609.02358","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02358v1 Announce Type: new \nAbstract: Humanoid robots responding to emergency stop commands typically execute a fixed maneuver, without reasoning about whether a safe stop is actually feasible from the current state. We cast emergency stopping as a reach-avoid problem and propose Safe-Stop, a task-agnostic framework that pairs a learned stop policy with learned stoppability estimators. The estimators are complementary: a stop-probability estimator supervised by the actual outcomes of the fixed stop policy, and a reach-avoidance estimator supervised by a Hamilton-Jacobi backup over p","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25688,"title":"Contact-Constrained Lower-Limb Joint-Offset Calibration for Humanoid Robots","url":"https://arxiv.org/abs/2609.02306","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02306v1 Announce Type: new \nAbstract: Accurate joint encoder offsets are essential for kinematic consistency in humanoid lower limbs, yet existing calibration methods typically require external motion-capture systems or fiducial targets. We present a self-contained calibration framework exploiting only onboard joint encoders and a pelvis-mounted IMU during static double-support contact. The inter-foot transform from forward kinematics must stay constant when both feet are fixed; minimizing its posture-dependent dispersion yields a nonlinear least-squares problem over the 12-dimensio","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25687,"title":"FOCUS: Foot Observation Confidence for Robust Humanoid Proprioceptive Odometry","url":"https://arxiv.org/abs/2609.02222","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02222v1 Announce Type: new \nAbstract: Foot forward kinematics (FK) is widely used to improve proprioceptive legged odometry by providing reliable velocity constraints during foot support. Existing contact-aided estimators generally rely on binary contact decisions to determine whether the FK measurements of an entire foot should be trusted. However, contact does not necessarily imply FK reliability. Dynamic locomotion often involves partial support, toe dragging, and foot slip, causing binary contact decisions to accumulate significant drift over long trajectories. To address this l","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25686,"title":"Hardware-Accelerated Instance Segmentation for Resource-Constrained Space Robotics with Criticality Analysis","url":"https://arxiv.org/abs/2609.02219","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02219v1 Announce Type: new \nAbstract: Autonomous lunar missions require real-time per- ception under three coupled constraints: extreme low-light conditions, limited onboard compute, and radiation-induced hardware faults that can silently corrupt inference. We present a deployment-oriented instance segmentation framework for resource-constrained lunar robotics that jointly addresses quan- tization calibration and system-level fault exposure under strict compute constraints. First, we introduce Activation Variance Informative Sampling (AVIS), a label-free calibration strategy that de","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25685,"title":"Towards Effective Physical Reservoir Computing with a Pneumatic Soft Robot","url":"https://arxiv.org/abs/2609.02157","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02157v1 Announce Type: new \nAbstract: Physical reservoir computing (PRC) refers to the use of a physical dynamical system as a computational resource for tasks such as state estimation and control, but there has been a lack of formal study of design rules towards more effective design of such physical reservoirs. Using a pneumatic soft arm with a five-pouch sensing column, this work studies how the pouch interconnection topology, robot stiffness, and the number of instrumented sensors affect bending-angle estimation performance. Across 36 matched trials spanning waveform, baseline p","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25684,"title":"Unified Motion Retargeting for Humanoids with Learned Point Cloud Correspondence","url":"https://arxiv.org/abs/2609.02134","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02134v1 Announce Type: new \nAbstract: Humanoid learning increasingly relies on transforming vast and diverse human motion data into high-quality robot reference trajectories. However, retargeting human motion to humanoid robots is challenging due to substantial differences in morphology, degrees of freedom, joint ranges, and kinematic constraints between humans and robots. Existing retargeting methods typically address these differences by defining human-robot correspondence through hand-crafted sparse keypoints or body-part pairs. As a result, retargeting quality depends heavily on","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25683,"title":"Modeling What Changes: Sparse, Residual World Models for Object-Centric Manipulation","url":"https://arxiv.org/abs/2609.02046","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02046v1 Announce Type: new \nAbstract: Monolithic world models predict the entire next state at every step, spending capacity re-predicting the static majority of a scene and injecting error into it. We ask whether explicitly modeling change (a per-object change gate plus a residual delta head that perturbs only the objects the gate flags) is a more effective and interpretable bias for physical prediction and control. On a MuJoCo tabletop pushing benchmark scaling from 3 to 8 objects, the sparse/residual model predicts next-state poses 2.5 to 4.6 times more accurately than a dense mu","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25682,"title":"Real-Time Dynamics-Based Torque-Sampling MPPI for Compliant and Force Aware Manipulation","url":"https://arxiv.org/abs/2609.02020","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02020v1 Announce Type: new \nAbstract: This study proposes a novel Model Predictive Path Integral (MPPI)-based task-space control framework. The proposed framework explicitly solves rigid-body dynamics within a real-time MPC formulation and enforces safety constraints, enabling accurate motion and force control that yields compliant behaviors for safe and effective physical interaction of robotic manipulators in unstructured environments. By leveraging MPPI, the proposed framework efficiently handles nonlinear dynamics that are difficult to solve with conventional MPC approaches in r","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25681,"title":"MACAW: Reliable And Efficient Surgical Debridement Using Monocular Adaptive Compact Attention Windows","url":"https://arxiv.org/abs/2609.01961","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.01961v1 Announce Type: new \nAbstract: Augmenting the dexterity of human surgeons has the potential to free them from tedious subtasks. We consider debridement (removal of diseased or dead tissue fragments), which is challenging due to imprecision in spatial perception and cable actuation. We develop an augmented dexterity system for surgical debridement that uses visual servoing to align the cable-driven gripper with the target position in the image plane, and then introduces a novel approach to depth control, MACAW: Monocular Adaptive Compact Attention Windows. Across 100 physical","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25680,"title":"One Demonstration, Many Objects: Generalizing Manipulation via Local Contact Geometry","url":"https://arxiv.org/abs/2609.01938","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.01938v2 Announce Type: new \nAbstract: Dexterous manipulation with multi-fingered robot hands promises human-level dexterity, but collecting large-scale dexterous robot hand data remains difficult. Learning from human demonstrations has emerged as a scalable alternative to robot teleoperation, providing strong priors on object interaction and contact strategies. Recent sim-to-real RL methods incorporate such priors, but often (i) omit rewards that explicitly incentivize precise contact, yielding weak real-world performance, and/or (ii) generalize poorly to unseen object instances. We","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25679,"title":"TriSAR: Task Coordination and Collision Avoidance for Aerial Robot Teams in Disaster Response","url":"https://arxiv.org/abs/2609.01731","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.01731v1 Announce Type: new \nAbstract: Multi-Unmanned Aerial Vehicle (UAV) disaster-response systems require coordinated task assignment and local trajectory control, yet the individual and combined contributions of these coordination layers to mission efficiency and operational safety remain insufficiently characterised under controlled experimental conditions. TriSAR is evaluated as a five-UAV coordination system operating in a physics-based Gazebo simulation of an earthquake-damaged urban environment. A 2 x 2 factorial design compares two task-allocation strategies (Genetic Algori","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25678,"title":"Not All Agreement Counts as Corroboration: Provenance-Conserving Multi-View Fusion for Typed Action Admission in Human-Robot Collaboration","url":"https://arxiv.org/abs/2609.01662","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.01662v1 Announce Type: new \nAbstract: For embodied systems, predictive agreement alone does not determine whether evidence warrants action; evidential origin matters. Repeated inference over one observation can multiply agreement without adding evidence, while source-local values do not reveal whether outputs have separately countable origins. PACT treats evidence countability as a relational variable for provenance-conserving fusion and typed action admission. A supplied provenance partition defines countable units. PACT retains coordinatewise support shared within each unit, accum","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25696,"title":"NC AI Joins LG Electronics-Led Humanoid Project to Turn Human Motion Into Robot Intelligence - Korea IT Times","url":"https://news.google.com/rss/articles/CBMicEFVX3lxTE9NNDJoUkJiODBkYkQxRDBmRGhpZDZmWTJMR3QxN1BUNVlKNDdfb0ZCbmtxR3h6Nk13a05pZG1LaXh2SWpGdlpxcEtEa1g1QXNmSnJNNzViYzFwZF9EVTVjUVNiT1JyUnZ5M2k5Y1hQbno?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMicEFVX3lxTE9NNDJoUkJiODBkYkQxRDBmRGhpZDZmWTJMR3QxN1BUNVlKNDdfb0ZCbmtxR3h6Nk13a05pZG1LaXh2SWpGdlpxcEtEa1g1QXNmSnJNNzViYzFwZF9EVTVjUVNiT1JyUnZ5M2k5Y1hQbno?oc=5\" target=\"_blank\"\u003eNC AI Joins LG Electronics-Led Humanoid Project to Turn Human Motion Into Robot Intelligence\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eKorea IT Times\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-03T02:32:47"},{"id":25297,"title":"UBTECH first-half revenue doubles to 1.27 billion yua // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
