tals remain constrained by institution-specific data and modeling environments, while direct cross-hospital collaboration is restricted by the sensitivity of patient-level EHR data. Although federated learning (FL) provides a natural foundation for privacy-preserving collaboration, existing approaches remain predominantly model-centric, limi","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24554,"title":"Actionable CBFI: Integrating Structural Decomposition and Causal Counterfactual Recourse for Tabular Machine Learning","url":"https://arxiv.org/abs/2608.27821","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27821v1 Announce Type: new \nAbstract: Explainable artificial intelligence (XAI) increasingly calls for actionable counterfactual recourse, yet current methodologies face challenges related to causal invalidity, excessive cognitive burden, and predictive failure. Exhaustive causal search algorithms often require modifications to multiple attributes, whereas additive attribution-guided methods, such as SHAP, ignore higher-order feature synergies, leading to suboptimal predictive momentum and diffuse intervention effort in complex nonlinear models, such as XGBoost. To bridge this gap,","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24553,"title":"Node-wise Feature Encoding for Neural Performance Prediction","url":"https://arxiv.org/abs/2608.27794","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27794v1 Announce Type: new \nAbstract: As neural networks are increasingly deployed on resource constrained edge devices, accurate prediction of latency and energy is critical for efficient neural architecture search. Existing GNN and transformer based predictors achieve strong results but largely ignore node-level computational cost, limiting their ability to model performance critical operations. To address this, we introduce FeatureFormer, a neural performance predictor that incorporates explicit node-wise encodings of FLOPs, parameter counts, and memory proxies within a gated gra","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24552,"title":"Initialization Is Critical: Advancing Federated Short-Term Load Forecasting under Load Heterogeneity via Model Initialization","url":"https://arxiv.org/abs/2608.27791","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27791v1 Announce Type: new \nAbstract: Short-term load forecasting (STLF) provides essential information for numerous applications in modern power systems. However, accurate STLF often relies on fine-grained smart-meter data from distributed users, raising increasing concerns about data privacy. Federated learning (FL) has therefore emerged as a promising privacy-preserving paradigm for STLF. Nevertheless, this paper reveals structured heterogeneity in clients' load data. Specifically, clients exhibit different responses to exogenous factors and distinct temporal load profiles, which","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24551,"title":"Fast Weight Attention for Continual Learning","url":"https://arxiv.org/abs/2608.27763","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27763v1 Announce Type: new \nAbstract: Recurrent fast-weight memories and selective state-space models compress an expanding context into a fixed-size recurrent state, making the state transition an online learning rule. We study this rule under read-after-write autoregressive semantics. For the prefix-prediction objective considered here, the local fast-memory example revealed at step $t$ is the prefix-aligned pair $(\\mathbf{x}_t,\\mathbf{y}_t)=(\\phi(\\mathbf{k}_{t-1}),\\mathbf{v}_t)$. The common same-step association $(\\phi(\\mathbf{k}_t),\\mathbf{v}_t)$ remains causal, but optimizes a","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24550,"title":"Beyond Search-Imitation: Prior-Directed Exploration for Searchless Chess","url":"https://arxiv.org/abs/2608.27757","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27757v1 Announce Type: new \nAbstract: Searchless chess networks reach human master strength from a single forward pass by imitating a stronger teacher: the strongest, Leela Chess Zero's (Lc0) released Chessformer, distills the visit counts of an AlphaZero-style Monte Carlo Tree Search (MCTS). Imitating a search is a poor proxy for playing without one, so we fine-tune for single-pass strength with self-play reinforcement learning (RL). Its exploration is usually supplied by an entropy bonus, the reverse Kullback-Leibler (KL) divergence to uniform. We replace it with a forward, mass-c","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24549,"title":"The Calls are Coming from Inside the Model: Investigating Probe-based Detection of Tool-Calling Errors in LLMs","url":"https://arxiv.org/abs/2608.27750","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27750v1 Announce Type: new \nAbstract: The hidden states of large language models (LLMs) are known to capture rich information relating to model knowledge and behavior that can be hard to extract from examination of input and output alone. As LLM-based systems increasingly interface with the external world, one area of concern is detecting incorrect or improper use of tools. Motivated by this, we study the effectiveness of using linear probes to detect incorrect tool-calls, measuring probe efficacy across 18 tool-calling LLMs evaluated on the Berkeley Function Calling Leaderboard. Ov","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24548,"title":"Diffusion Distillation for Efficient Weather Ensembles","url":"https://arxiv.org/abs/2608.27728","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27728v1 Announce Type: new \nAbstract: Diffusion models generate skillful weather ensembles but require costly iterative sampling. We introduce a supervised energy-distance distillation method that compresses a multi-step diffusion teacher into a single-step student by aligning student forecasts with teacher samples and ground-truth observations. Experiments on global forecasting and typhoon-track prediction show that our student outperforms existing distillation methods and preserves skill for extreme events. It matches or surpasses the teacher across key metrics using only one neur","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24547,"title":"Leveraging a Foundation Model for the EEG-Based Diagnosis of Alzheimer's Disease","url":"https://arxiv.org/abs/2608.27719","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27719v1 Announce Type: new \nAbstract: Biological heterogeneity in Alzheimer's Disease (AD) poses a critical diagnostic challenge, particularly for traditional linear methods that fail to capture non-linear neural dynamics. To address this, we propose a diagnostic framework utilizing the Large Brain Model (LaBraM), pretrained on over 2,500 hours of EEG data. By integrating these high-dimensional latent embeddings with a non-linear Random Forest classifier, our approach effectively isolates robust disease markers. Under a rigorous subject-independent 5-fold cross-validation protocol,","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24546,"title":"Beyond Non-IID: Learner--Client Distribution Mismatch in Federated Learning","url":"https://arxiv.org/abs/2608.27715","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27715v1 Announce Type: new \nAbstract: Federated learning systems are increasingly deployed to facilitate collaborative model training across a heterogeneous client population. Existing practice mostly implicitly assumes that the aggregated client data distribution is representative of the learner's target distribution or that learning from all available clients is uniformly beneficial for the learner distribution. However, such an assumption often does not hold in reality. Traditional client selection strategies in FL literature largely overlook such misalignment, while most existin","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24545,"title":"DART-FL: Burst-Aware Multitask Federated Learning under Dynamic Inference Demand at the Edge","url":"https://arxiv.org/abs/2608.27713","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27713v1 Announce Type: new \nAbstract: Edge intelligence systems increasingly require model training and online inference to coexist on resource-constrained devices, while inference demand can vary substantially across tasks over time. This creates two coupled challenges: sufficient computation must be reserved for inference to maintain service-level objectives (SLOs), while the remaining training capacity should adapt to task-specific demand so that frequently requested tasks can improve earlier during training.\n  We propose an SLO-aware, demand-driven multitask federated learning f","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24544,"title":"RiskBlend: A Multi-Signal Framework for Test Input Prioritization in Machine Learning Regression Testing","url":"https://arxiv.org/abs/2608.27704","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27704v1 Announce Type: new \nAbstract: When machine learning classifiers are retrained, inputs correctly classified by the previous model version may be misclassified by the updated version, creating regression faults that are costly to detect because verifying predictions against ground truth may require human annotation, expert review, or expensive simulation rather than inexpensive model inference. Test input prioritization addresses this problem by ranking inputs so that a limited verification budget reveals as many regression faults as possible. Existing approaches rely predomin","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24543,"title":"SegBench-GC: Testing Segmentation Invariance in Multi-Step Offline Goal-Conditioned Reinforcement Learning","url":"https://arxiv.org/abs/2608.27678","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27678v1 Announce Type: new \nAbstract: Offline goal-conditioned reinforcement learning (GCRL) often uses trajectory structure for future-goal sampling and multi-step targets, yet logged trajectories may be partitioned for administrative reasons that do not correspond to termination. We introduce SegBench-GC, a controlled stress test of segmentation invariance that holds transitions, source trajectories, goal sampling, optimization settings, and evaluation fixed while varying only artificial backup boundaries and whether those boundaries retain continuation value. Continuation-valid t","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24542,"title":"Unsupervised Continual Learning with Growing Self-Organizing Maps and Synthetic Replay","url":"https://arxiv.org/abs/2608.27662","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27662v1 Announce Type: new \nAbstract: This work presents a generative continual learning framework based on growing self-organizing maps (GSOMs) that are augmented with learned distributional statistics as well as encoder-decoder models for class-incremental learning. The proposed approach enables exemplar-free replay using distributional statistical memory, which eliminates the need to store raw data. Each GSOM unit maintains its own mean, variance, and covariance estimates, which are subsequently used to generate synthetic samples for replay; in encoder-decoder configurations, the","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24541,"title":"More Data Cannot Break a Symmetry: Identifiability by Design","url":"https://arxiv.org/abs/2608.27651","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27651v1 Announce Type: new \nAbstract: Unsupervised representational alignment recovers a stimulus-by-stimulus correspondence from geometry alone, but the automorphism group of the stimulus geometry bounds what any such alignment can identify, before data exist. The obvious diagnostic for this degeneracy, the cheapest non-identity relabelling, ranks two published designs in the wrong order, because dense sampling creates near-duplicates whose transposition is nearly free. We turn this known invariance (Demetci et al., 2024) into a design-time diagnostic and intervention. In colour, w","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24540,"title":"Self-Explainable Multi-Label Graph Neural Network for Correlated Evidence Attribution","url":"https://arxiv.org/abs/2608.27574","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27574v1 Announce Type: new \nAbstract: Multi-label graph learning intends to capture the intrinsic complexity of real-world applications, where one sample is often related to multiple groups or consists of multiple objects. To date, a handful of multi-label graph learning methods exist, but none of them integrate training-time interpretation capability. While post-hoc graph explainers have been developed, they do not explicitly model label-dependent evidence sharing in multi-label graph learners, especially when label pairs are weakly or negatively associated. As a result, post-hoc a","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24539,"title":"Dandelion: A Spherical Flower for Neural Simulation of Planetary Dynamics","url":"https://arxiv.org/abs/2608.27521","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27521v1 Announce Type: new \nAbstract: Many dynamical processes unfold on the sphere but the default scientific machine learning architectures are Euclidean. Applying these architectures on a regular lat-lon grid causes problems: Cartesian convolutions become distorted at high latitude; 2D FFTs in Fourier neural operators incorrectly assume double periodicity; Cartesian positional encodings in ViTs distort spherical geodesic distances. Recent work moves towards natively spherical primitives, including spherical convolutions (e.g., DeepSphere or DISCO), Spherical Fourier Neural Operat","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24538,"title":"When Muon Meets Task Interference: A Spectral Perspective on Continual Learning and Model Merging","url":"https://arxiv.org/abs/2608.27518","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27518v1 Announce Type: new \nAbstract: Continual learning (CL) and model merging (MM) both aim to obtain a single model that performs well across multiple tasks, challenged respectively by catastrophic forgetting and weight-disentanglement error. In the literature, these difficulties are merely treated separately and mitigated through a variety of solutions, while the geometry induced by the base optimizer is treated as an implementation detail. In this work, we show that the two difficulties are in fact two instances of the same phenomenon: a parameter update useful for one task shi","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24537,"title":"A Deeper Analysis of Block-Sparse Featurizers","url":"https://arxiv.org/abs/2608.27515","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27515v1 Announce Type: new \nAbstract: The recently introduced block-sparse featurizer (BSF; Fel et al., 2026) is similar to a sparse autoencoder (SAE), but its atomic unit is a small subspace (a block of directions) rather than a single direction. It is designed for features that live on low-dimensional manifolds, which are especially frequent in vision. This work studies the BSF's strengths and weaknesses, finding how it still somewhat suffers from classic SAE failure modes, like feature splitting and composition. We propose several architectural changes to the BSF, including a Tou","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24536,"title":"DAMP: Decay-Aware Mixed-Precision Recurrent-State Quantization","url":"https://arxiv.org/abs/2608.27513","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27513v1 Announce Type: new \nAbstract: Softmax attention stores key and value vectors for every preceding token, causing inference memory to grow with sequence length. Recent language models incorporating Gated DeltaNet (GDN) or Kimi Delta Attention (KDA) reduce this cost by replacing the KV cache in most layers with fixed-size recurrent states. However, these recurrent states are commonly stored in FP32 and consume substantial GPU memory; their updates are memory-bandwidth bound and contribute significantly to decoding latency. To our knowledge, we are the first to study post-traini","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24535,"title":"Quantization-Triggered Backdoors in Language Models: Cross-Quantizer Transferability and the Validation--Deployment Gap","url":"https://arxiv.org/abs/2608.27512","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27512v1 Announce Type: new \nAbstract: Post-training quantization is often treated as a semantically neutral optimization for edge deployment of Large Language Models. When a full-precision source checkpoint is evaluated and quantization is applied downstream without equivalent re-evaluation, this workflow creates a structural validation--deployment gap: because quantization is a many-to-one mapping over parameter space, source-precision certification does not guarantee behavioral equivalence in the deployed configuration. We formalize this gap through Quantization Behavioral Equival","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24534,"title":"Marginal Coverage Credit Reduces Redundant Exploration in Parallel State-Entropy Optimization","url":"https://arxiv.org/abs/2608.27507","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2608.27507v1 Announce Type: new \nAbstract: Policy Gradient for Parallel State Entropy maximization (PGPSE) expands state-space coverage by training independently parameterized policies in replicated copies of the same environment. However, its pooled team-entropy score measures only collective exploration and cannot identify policies that contribute non-redundant coverage. We introduce Marginal Coverage Credit for PGPSE (MCC-PGPSE), which combines leave-one-policy-out coverage with state-owner specialization to estimate policy-specific credit. MCC-PGPSE preserves PGPSE's pooled objective","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24533,"title":"OpenStamp: A Watermark for Open-Source Language Models","url":"https://arxiv.org/abs/2608.27899","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27899v1 Announce Type: new \nAbstract: With the growing prevalence of large language model (LLM) generated content, watermarking is considered a promising approach for attributing text to LLMs and distinguishing it from human-written content. A prominent class of techniques embeds subtle but detectable signals in generated text by modifying token sampling probabilities. However, such methods are unsuitable for open-source models, where users have white-box access and can easily disable watermarking during inference. In this work, we introduce OpenStamp, a watermarking technique that","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24532,"title":"AI Writers Have a Consistent Stylometric Footprint, but AI Editors Do Not","url":"https://arxiv.org/abs/2608.27855","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27855v1 Announce Type: new \nAbstract: Text generated by large language models (LLMs) has been shown to be stylometrically distinct from human-written text \\citep{andreDetectingAIAuthorship2023, shahDetectingUnmaskingAIGenerated2023, oparaStyloAIDistinguishingAIGenerated2024, soto2024fewshot, liLinguisticDifferencesAI2025, selviogluFeatureExtractionAnalysis2025}. But LLMs are increasingly used not only to generate text but also to edit human writing, and it is unclear whether the two leave the same trace. We show that AI generation leaves a consistent ``stylometric footprint'': a sma","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24531,"title":"EvoHarmBench: Breaking Content Moderation with Iterative Human-Like Evasion","url":"https://arxiv.org/abs/2608.27844","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27844v1 Announce Type: new \nAbstract: Existing evaluations of harmful content detection rely predominantly on static benchmarks, which struggle to reflect the interactive adversarial ecosystem of real-world content platforms where users continuously revise their expressions in response to moderation feedback. This mismatch creates a significant performance gap between offline benchmark scores and online deployment effectiveness. To the best of our knowledge, we present EvoHarmBench, the first dynamic adversarial evaluation framework for content moderation systems. The framework empl","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24530,"title":"Synthetic Linguistic Agency: How an Embodied Mortal Agent Learns Linguistic Affordances through Consequential Social Experience","url":"https://arxiv.org/abs/2608.27843","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27843v1 Announce Type: new \nAbstract: Contemporary language models can converse fluently and influence human decisions, yet their exchanges do not enter a continuing, vulnerable life of their own. Linguistic-agency theory identifies this missing connection as linguistic agency and characterizes it through embodiment, linguistic participation, and precariousness: a body that acts and bears consequences, interaction that changes both agent and partner, and a future that can be sustained or lost. Two coordinated studies examine how this organization can appear in artificial systems. Fi","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24529,"title":"PersonaEdit: Representative Sample Selection for Personalized Model Editing","url":"https://arxiv.org/abs/2608.27816","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27816v1 Announce Type: new \nAbstract: Personalization has attracted growing interest in LLM applications, yet existing retrieval-based approaches depend heavily on retrieval quality and degrade in long-term interactions. Model editing, which directly modifies internal model parameters to incorporate new knowledge, has demonstrated effective knowledge modification capabilities in factual knowledge editing tasks and may provide a potential solution for personalization. However, scaling model editing to personalization is non-trivial. Editing large amounts of user data increases comput","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24528,"title":"Representation of syntax in LLMs through the lens of linear distance and similarity-aware entropy","url":"https://arxiv.org/abs/2608.27813","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27813v1 Announce Type: new \nAbstract: Structural probes were introduced by Hewitt and Manning to reconstruct syntactic trees from a neural language model's latent representations. They are evaluated by calculating the proportion of syntactic tree edges correctly reconstructed over an annotated corpus (as measured by undirected unlabeled attachment score). Here, we disaggregate this measure, considering undirected attachment score by label (UASL), which assesses the reconstruction accuracy of each syntactic relation separately, establishing important differences among relations that","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24527,"title":"Compositional Failure in Audio-Visual LLMs: Late-Layer Prior Dominance Under Cross-modal Conflict","url":"https://arxiv.org/abs/2608.27785","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2608.27785v1 Announce Type: new \nAbstract: We study audio-visual conflict as a compositional generalization test for AV-LLMs: the model must combine synchronized but semantically incompatible audio and video evidence and decide whether the pair matches. On VideoLLaMA 2-7B-AV, three alignment configurations remain nearchance on the scored exact-string Yes/No subset of AVHBench, even though their output priors shift substantially. Similarly, off-the-shelf InternVideo2 experienced a 32.3% accuracy decrease specifically under cross-modal conflict, accompanied by a 17.3% instruction-following","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#0891b2","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":24503,"title":"ChainSplat: A Physics-Inspired Screw-Theoretic Model for Learning Deformable Linear Object Dynamics from Multi-View RGB Videos","url":"https://arxiv.org/abs/2608.28570","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28570v1 Announce Type: new \nAbstract: Identifying the underlying dynamics and 3D geometry of deformable linear objects (DLOs), such as cables, ropes, and hoses, is essential for accurate robotic manipulation, but remains challenging due to their high-dimensional configuration spaces and diverse behaviors arising from varying material properties. Existing methods often rely on multi-stage pipelines and auxiliary depth inputs, which are prone to errors under dynamic interactions, while their high-dimensional state representations make model-based control computationally expensive. In","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24502,"title":"Linear Temporal Logic Translation via Human-Inspired Self-Constrained Reasoning for Robot Task Specification","url":"https://arxiv.org/abs/2608.28435","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28435v1 Announce Type: new \nAbstract: Many robotic tasks are temporally extended and demand precise specifications of subgoals, constraints, and their temporal ordering. Yet human operators typically communicate such tasks in natural language, which is inherently ambiguous, underspecified, and context dependent. Translating human instructions into formal task specifications, such as Linear Temporal Logic (LTL), is therefore essential for verifiable and safe robotic execution. Existing LLM-based translators attempt to bridge this gap through open-ended reasoning or post-hoc constrain","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24501,"title":"Cooperative Risk-Aware Exploration in Heterogeneous Multi-Robot Systems Using Algorithmic Altruism","url":"https://arxiv.org/abs/2608.28409","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28409v1 Announce Type: new \nAbstract: Multi-robot systems are well-positioned for exploration in hazardous environments, but effective deployment requires deciding not only where robots should gather information, but also how risk should be distributed across heterogeneous team members. This paper develops a game-theoretic framework for cooperative risk-aware exploration based on ecologically inspired altruistic behavior. Each robot selects a finite-horizon trajectory to maximize information gain while penalizing redundant exploration and expected hazard exposure. Heterogeneity is i","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24500,"title":"PanelShield: Verifiable Closed-Loop Safe Planning for Robotic Industrial Panel Operation","url":"https://arxiv.org/abs/2608.28305","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28305v1 Announce Type: new \nAbstract: Industrial panel operation is knowledge-intensive and safety-critical. Beyond control recognition and action generation, execution must satisfy constraints in operation manuals and safety regulations. While foundation-model-based planners show strong semantic capability, they typically lack computable, localizable, and reproducible mechanisms for violation detection and repair. To address this, we propose PanelShield, a verifiable closed-loop safety planning framework for manual-guided industrial panel operation. The framework generates paramete","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24499,"title":"MaCoPlanner: LLM-Assisted Manual-Compiled Task Planning with Proactive Safety Verification for Robotic Industrial Panel Operation","url":"https://arxiv.org/abs/2608.28300","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28300v1 Announce Type: new \nAbstract: Robotic industrial panel operation requires not only accurate control localization but also compliance with operating procedures, safety rules, and device-state constraints distributed across heterogeneous manuals. This study presents MaCoPlanner, a task-planning framework built on knowledge compiled from equipment manuals that converts equipment manuals into a typed intermediate representation, retrieves task- and state-relevant evidence, and uses it to support plan generation. Before actuation, candidate plans are symbolically rolled out and c","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24498,"title":"CoCoBench: A Cooperative Coordination Benchmark for Embodied Multi-Agent Task Planning","url":"https://arxiv.org/abs/2608.28266","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28266v1 Announce Type: new \nAbstract: Agent systems powered by multimodal large language models (MLLMs) have advanced rapidly in recent years, yet existing embodied-agent benchmarks still lack fine-grained diagnostics for multi-agent coordination. Most benchmarks either focus on single-agent task completion or summarize multi-agent behavior with overall task success rates, which can obscure coordination failures such as duplicated work, violations of ordering constraints, resource contention, and desynchronized handoffs. In this paper, we introduce CoCoBench, a construct-level bench","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24497,"title":"Training-free Suction Grasp Detection for Deformed Aseptic Cartons Using Vision-Language Models and Geometric Surface Scoring","url":"https://arxiv.org/abs/2608.28246","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28246v1 Announce Type: new \nAbstract: Robotic sorting of recyclable waste is challenging due to the deformable and geometrically inconsistent nature of target objects. We present a training-free suction grasping system for sorting deformed aseptic beverage cartons, decoupling target identification from grasp-point selection. An open-vocabulary vision-language model detects cartons from a text prompt, SAM2 refines each detection into an instance mask, and a geometric scoring method selects the suction point by combining surface flatness with normal alignment. Three geometric methods","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24496,"title":"Probabilistic Multi-Robot Gas Source Localization with Uncalibrated Sensors: A Distributed Estimation Approach","url":"https://arxiv.org/abs/2608.28214","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28214v1 Announce Type: new \nAbstract: Estimating environmental states with multi-robot systems becomes particularly challenging when robots are equipped with uncalibrated and therefore heterogeneous sensors, whose nonlinear and inconsistent responses prevent reliable information fusion. In this paper, we propose a distributed probabilistic framework for source localization tasks that enables calibration-free estimation in the presence of sensor heterogeneity. The key idea is that each robot independently estimates a local belief using a rank-based feature that captures the relative","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24495,"title":"PAMoR: Parameterized Affective Motion Generation in Real Time for Humanoid Robots","url":"https://arxiv.org/abs/2608.28213","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28213v1 Announce Type: new \nAbstract: People read a humanoid robot's motion in social settings not only for the action performed but for the affect conveyed. Motion carrying that affect has so far been generated for human avatars, where style is taken from a reference clip or an emotion word, neither of which can be quantitatively parameterized. We present PAMoR, which turns affect into a measured control parameter: a valence-arousal (V-A) coordinate computed natively on robot kinematics. It is obtained in closed form from postural expansion and movement energy, and these measuremen","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24494,"title":"From Small Talk to Rapport: Exploring Robot Self-Disclosure in Collaborative Tasks","url":"https://arxiv.org/abs/2608.28154","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28154v1 Announce Type: new \nAbstract: People naturally chat while collaborating and share personal information (i.e., self-disclose) to build rapport and maintain social connections. As robots are increasingly developed to work with people, the effective use of these social behaviors to enhance engagement and support teamwork becomes ever more important. While prior work has shown that robot-initiated small talk can benefit human-robot collaboration, less is known about how best to design such small talk. In this work, we explore how self-disclosure may be designed to support small","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24493,"title":"Contact-Guided Exploration for Non-Prehensile Locomanipulation with Multi-Critic RL","url":"https://arxiv.org/abs/2608.28140","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28140v1 Announce Type: new \nAbstract: Non-prehensile manipulation offers versatile skills for moving and rearranging heavy or bulky objects, particularly when combined with a mobile manipulation platform. However, both model-based and model-free approaches struggle with the complex hybrid dynamics and the sparsity of the contact in these tasks. To address these challenges, we propose a contact-guided exploration strategy implemented within a Multi-Critic Reinforcement Learning (RL) framework. A dedicated exploration critic is trained with a dense contact-seeking reward that guides t","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24492,"title":"DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA","url":"https://arxiv.org/abs/2608.28108","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28108v1 Announce Type: new \nAbstract: Vision-Language-Action models (VLAs) allow users to specify manipulation tasks in natural language, but distinguishing a target or placement goal among objects of the same category or similar appearance requires detailed expressions that VLAs may not use reliably. We propose DeicticVLA, which canonicalizes Language Instruction (LI), Vision-Language Instruction (VLI), and Visual Instruction (VI) into a text prompt and deictic masks through text-prompt completion and deictic gesture grounding, enabling a single pretrained VLA to handle all three i","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24491,"title":"Stay Seated: Learning Omnidirectional Humanoid Locomotion on a Passive Mobile Chair with Casters","url":"https://arxiv.org/abs/2608.28090","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28090v1 Announce Type: new \nAbstract: Humanoid robots with quasi-direct-drive actuators continuously generate joint torque while standing, whereas seated humans delegate weight support to chairs during desk work. As a first step toward seated loco-manipulation, we study omnidirectional seated locomotion on a passive mobile chair, requiring unfixed pelvis-seat contact and intermittent foot-floor propulsion of the robot-chair system. We extend a standard standing velocity-tracking environment with a passive-chair model, seated-state rewards, critic-only chair observations, and task-ta","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24490,"title":"Plan Along the Way: Event-Triggered Foundation-Model Planning for TAMP Execution in Partially Observable Manipulation","url":"https://arxiv.org/abs/2608.28075","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28075v1 Announce Type: new \nAbstract: Manipulation in partially observable environments requires planning under incomplete scene information. In such settings, an initially valid plan may execute successfully yet remain insufficient for task completion. Existing foundation-model-guided task and motion planning (TAMP) systems can generate useful long-horizon task decompositions, subgoals, or constraints, but they often assume having access to a fully specified scene state or invoke model-level replanning after a subgoal, refinement, or execution attempt fails. We present ROBUST TAMP,","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24489,"title":"Coordinated Motion Planning for Multi-Arm Systems via Iterative LQ Games","url":"https://arxiv.org/abs/2608.27726","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27726v1 Announce Type: new \nAbstract: Multi-agent motion planning for high-degree-of-freedom robotics manipulators in shared workspaces remains a fundamental yet challenging problem. Centralized planners often suffer from poor scalability, while decentralized approaches face robustness and safety concerns. Game-theoretic formulations offer a promising approach for modeling agent interactions, potentially overcoming these limitations. However, their application to articulated multi-arm systems remains limited. This paper presents an iterative Linear Quadratic (LQ) game framework for","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24488,"title":"One year in a forest: Analyzing the challenges of autonomous navigation in subarctic environments","url":"https://arxiv.org/abs/2608.27628","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27628v1 Announce Type: new \nAbstract: Subarctic regions have the potential to see increased deployment of autonomous robots in applications including forestry, mining, and environmental monitoring. In these conditions, an autonomous system's reliance on GNSS or cloud computing is precarious due to dense tree canopies and atmospheric attenuation, necessitating onboard sensing and data processing. However, established exteroceptive modalities, including cameras, lidars, and radars, are typically evaluated in structured urban settings or in environments that lack significant seasonal v","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24487,"title":"PHR-VLA: Planning Horizon Reasoning for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.27609","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27609v1 Announce Type: new \nAbstract: Vision-language-action models (VLAs) have shown strong promise for general-purpose robotic manipulation by mapping language instructions and vision observations directly to actions. However, most VLAs primarily condition action prediction on current observations and lack an explicit mechanism for reasoning over future task dynamics, which is particularly important for fine-grained, contact-rich manipulation. We present PHR-VLA, a framework that enables planning-horizon reasoning in VLAs through privileged latent representations of future dynamic","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24486,"title":"Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.27550","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27550v1 Announce Type: new \nAbstract: Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodi","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24485,"title":"Remote Human and Robot Interaction for Greenhouse Gardening Using Virtual Reality","url":"https://arxiv.org/abs/2608.27545","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27545v1 Announce Type: new \nAbstract: This study evaluates the effectiveness of remote human-robot interaction using virtual reality for leaf inspection and soil moisture assessment in a greenhouse environment. The robotic system comprised an unmanned ground vehicle and a robotic manipulator equipped with cameras, governed by kinematic models for navigation and manipulator control. Fourteen distinct plants were inspected across two experiments utilizing VR teleoperation, guided by a set of pre-specified research questions and hypotheses. In the leaf inspection experiments, cycle com","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24484,"title":"Beyond Relative Geometry: Metric-Aware Geometry Perception for Robotics","url":"https://arxiv.org/abs/2608.27497","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27497v1 Announce Type: new \nAbstract: Recent embodied models increasingly leverage geometric representations to improve spatial reasoning and robotic manipulation. However, existing reconstruction methods only reconstruct relative geometry with arbitrary scales, causing predicted object dimensions and spatial distances to vary across scenes, viewpoints, and input configurations. This inconsistency prevents geometric perception from being directly aligned with robotic actions defined on the real-world scale. To address this limitation, we propose Metric-Aware Geometry Perception (MAG","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24504,"title":"Seeds | 玄创机器人完成数千万元A1轮融资 - 第一电动网","url":"https://news.google.com/rss/articles/CBMiTkFVX3lxTFBxbWFxd2R6Y01vQ2Fkd09fZ0NsZHBHVmF3Q1ZEenEteGVwUmo4UVVSUmRKNV9RS2NPaUNzbF9sQzdfeDR4Nm0tSlpKamNrdw?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTkFVX3lxTFBxbWFxd2R6Y01vQ2Fkd09fZ0NsZHBHVmF3Q1ZEenEteGVwUmo4UVVSUmRKNV9RS2NPaUNzbF9sQzdfeDR4Nm0tSlpKamNrdw?oc=5\" target=\"_blank\"\u003eSeeds | 玄创机器人完成数千万元A1轮融资\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e第一电动网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-31T03:30:00"},{"id":24505,"title":"The U.S. is building barriers around drones and robots, but China has scale to get around them","url":"https://techcrunch.com/2026/08/30/the-u-s-is-building-barriers-around-drones-and-robots-china-still-has-scale/","source":"TechCrunch · Robotics","sources":["TechCrunch · Robotics"],"summary":"The U.S. is shutting out more foreign-made drones and robots. China’s scale means the global competition may simply move elsewhere.","tags":[],"cluster_size":1,"ts":"2026-08-31T02:34:00"},{"id":24506,"title":"At your service: Hong Kong welcomes first humanoid robot-run convenience stores - South China Morning Post","url":"https://news.google.com/rss/articles/CBMi3gFBVV95cUxQN3F4TExJeFpvMm5LM3NrUzlvODhPYy1zVmZMcE4yUXNBTjZOUk53UmJDQUVXaWZ3QTd0Ylh4aXg1dmdIZy1NT // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
