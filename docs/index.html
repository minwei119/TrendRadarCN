"id":36570,"title":"华福证券陈兴：A股估值已充分消化谨慎预期，权益资产配置价值逐步凸显","url":"https://wallstreetcn.com/livenews/3185157","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"华福证券宏观首席分析师陈兴表示，当前A股核心资产估值已较充分反映市场谨慎预期，权益市场配置价值逐步凸显，后续只要盈利端边际企稳、流动性预期温和修复，权益资产便具备向上修复弹性。他建议投资者规避短期情绪干扰，避免恐慌式离场，聚焦业绩与估值匹配度较好的优质标的，保持理性、耐心布局。从估值角度看，陈兴认为，经历本轮调整后，多个宽基及赛道指数回落至历史偏低分位，部分成长板块估值已处于近一年极低区间，金融、周期等价值板块估值同样处在历史底部区域。前期压制估值的负面因素已较大程度反映在股价之中，下行空间有限，盈亏比明显改善。当前估值水平已较充分定价外部扰动与短期情绪影响，业绩确定性强、估值合理的优质标的，有望迎来比较好的配置窗口。（中证金牛座）","tags":[],"cluster_size":1,"ts":"2026-10-24T13:54:03"},{"id":36571,"title":"推动人工智能技术走出实验室，中国移动发布时空智能系列模型能力及标杆场景 - 第一财经","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE5VbTNiUWRhdURsbDUxWjh5cTZJNWhwTVc4Wm9fZnJHZVcxTHhYdFY5VWlRX09jVlNYbE1Nal9UcjJTc25hYllDNXlzNVBkWjR6aFRj?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE5VbTNiUWRhdURsbDUxWjh5cTZJNWhwTVc4Wm9fZnJHZVcxTHhYdFY5VWlRX09jVlNYbE1Nal9UcjJTc25hYllDNXlzNVBkWjR6aFRj?oc=5\" target=\"_blank\"\u003e推动人工智能技术走出实验室，中国移动发布时空智能系列模型能力及标杆场景\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e第一财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-24T12:44:55"},{"id":36572,"title":"亿纬锂能：公司大圆柱电池已量产工厂均处于满产状态","url":"https://wallstreetcn.com/livenews/3185135","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"亿纬锂能10月23日在电话会议中表示，公司大圆柱电池已量产的工厂均处于满产状态。国际客户需求远超预期，国内客户也陆续实现交付。此外，公司高度重视消费税和出口退税调整对经营业绩的影响，自2026年上半年起即提前与客户开展沟通，与绝大多数客户已达成共识，确定方案。","tags":[],"cluster_size":1,"ts":"2026-10-24T11:06:00"},{"id":36573,"title":"中国移动携手主流车企发布业内首个汽车行业AI基座，让车企无需自建即可按需取用 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPUWJodzQ3ZkZWVFB6N0RGb1ZfTkRORlZ0MTZ1djA0cHpFc1lCMmExRmZqSmd2X1F3ZThIeWtoYW5zWDZDNTdTdEM2RFQxYmlSV3NlVDlxVVBaNThmS1Y0WjgxRGNMSlhNRTJ1N2QyMDB1YjlrWnRJaEd6NFdiNXV1eXdRQ2doNndZNnVxSg?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFB ，\u003cstrong\u003e却始终没能解决游戏设计上的难题\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"e371\"\u003e经过多年的传闻和预热，《特工》于 2009 年 E3 游戏展正式亮相。R 星此后一直没有正式宣布取消开发，最终却\u003cstrong\u003e放弃了游戏商标，悄然终止了项目\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"a7a4\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/10/11757fea-d5d7-4d5f-888f-d2f236e8d7e2.png\" w=\"1200\" h=\"675\" data-weibo=\"0\" data-vmark=\"8102\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"26db\"\u003e豪瑟在接受 IGN 采访时回忆道","tags":[],"cluster_size":1,"ts":"2026-10-25T03:43:46"},{"id":36722,"title":"三名被解雇的OpenAI安全研究员否认泄密，怀疑因推动AI透明度被针对 - 手机新浪网","url":"https://news.google.com/rss/articles/CBMifkFVX3lxTFBnS2ZGalFqbXVzWC1OVnJ2WHBQakdXd2VYRDh1X2xMRzVnZFdtV0EzTlR6T1VBXzdIMlF3Sld2MWVfdnRSdmttSWNRSy1admsxbnhqZXRTQXh3SGZHOGg0a2R3VnJtOE5lWU92ZEJjNDlkN0xDSWZkenVvQXU2UQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词","IT之家"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMifkFVX3lxTFBnS2ZGalFqbXVzWC1OVnJ2WHBQakdXd2VYRDh1X2xMRzVnZFdtV0EzTlR6T1VBXzdIMlF3Sld2MWVfdnRSdmttSWNRSy1admsxbnhqZXRTQXh3SGZHOGg0a2R3VnJtOE5lWU92ZEJjNDlkN0xDSWZkenVvQXU2UQ?oc=5\" target=\"_blank\"\u003e三名被解雇的OpenAI安全研究员否认泄密，怀疑因推动AI透明度被针对\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机新浪网\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-10-25T03:43:00"},{"id":36723,"title":"三名OpenAI安全研究员被解雇，质疑泄密指控与透明度争议 - DoNews","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE90cGdRVDB0N0JNcW9DdURaQXZrc18zMF96V05pRURhXzV5Uk1JNnItal9EbkkwR1Q2dlhHRDZKdHY0Q1JjX0RkRTgzZnlnanV0SlhaVGF2WHk3dEhHWHc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE90cGdRVDB0N0JNcW9DdURaQXZrc18zMF96V05pRURhXzV5Uk1JNnItal9EbkkwR1Q2dlhHRDZKdHY0Q1JjX0RkRTgzZnlnanV0SlhaVGF2WHk3dEhHWHc?oc=5\" target=\"_blank\"\u003e三名OpenAI安全研究员被解雇，质疑泄密指控与透明度争议\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont col  teleoperation adapts readily to contact-rich and semantically ambiguous situations but depends on a stable communication link. Local autonomy is executed without continuous human intervention, but may fail under semantic ambiguity, long-horizon drift, and unforeseen contingencies. These two control sou","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36355,"title":"Robot Motion Transition with Human Motion Prior","url":"https://arxiv.org/abs/2610.30817","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30817v1 Announce Type: new \nAbstract: Humanoid motion-tracking policies can reproduce diverse behaviors, yet connecting independently acquired motions into a continuous sequence remains challenging. Interpolation connects boundary poses without considering whether their relative position, heading, and timing provide suitable conditions for a transition. A generative motion prior can produce richer motion, but poorly arranged boundaries may cause it to generate excessive locomotion, turning, or another unintended action. We present Spatio-Temporal Alignment with a Motion Prior (STAMP","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36354,"title":"Adaptive Aerial Loco-Manipulation Policy Learning via LLM-Assisted Proactive Task Generation","url":"https://arxiv.org/abs/2610.30810","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30810v1 Announce Type: new \nAbstract: Loco-manipulation extends the workspace of conventional manipulation by combining mobility with physical interaction, while aerial loco-manipulation further expands this capability into three-dimensional space, enabling robots to reach environments inaccessible to ground-based systems. Moving to an aerial platform, however, gives rise to a demanding control problem, since the vehicle must track trajectories accurately in three dimensions while the motion of the arm and its interaction with the environment continuously shift the center of mass, a","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36353,"title":"When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies","url":"https://arxiv.org/abs/2610.30735","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30735v1 Announce Type: new \nAbstract: Flow matching is now the dominant approach for vision-language action (VLA) robot policies, thanks to its expressiveness and simple training objective. However, inference for standard flow matching requires iteratively solving an ODE, limiting the control frequency at deployment. While several works have proposed novel methods to allow for single-shot action generation, we ask whether such additional objectives are actually necessary. We find that across six flow matching VLAs, one-step action generation largely matches multi-step sampling at sc","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36352,"title":"Live Thread Reconstruction for Autonomous Manipulation","url":"https://arxiv.org/abs/2610.30694","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30694v1 Announce Type: new \nAbstract: Autonomous robotic surgery has drawn increased attention in recent years due to its potential to relieve surgeons of time-consuming, mentally straining, and tedious tasks, particularly during prolonged operations. One suitable task for automation is suturing, which involves tracking the thread as it deforms during needle retrieval, de-tangling, knot tightening, and other tasks. Unlike rigid-object manipulation, deformable thread manipulation has no fixed pose to track and effectively infinite degrees of freedom, making its configuration difficul","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36351,"title":"Co^2Gen: Collaboratively Generating Task Plans for Decentralized Multi-Robot and Human Collaboration","url":"https://arxiv.org/abs/2610.30671","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30671v1 Announce Type: new \nAbstract: Visual Language Action (VLA) models are designed to be generalist robot models that can be implemented across embodiments, tasks and environments. However, their ability to collaborate with other robots and humans remains underexplored. In this work, we propose a framework to automate the generation of multi-robot collaborative data for decentralized VLA training without requiring human teleoperation. Our framework first utilizes a decentralized collaborative planning approach to generate multi-robot collaborative robot plans in the form of an e","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36350,"title":"Continuous-Time Motion Planning and Steering with Global Convergence","url":"https://arxiv.org/abs/2610.30607","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30607v1 Announce Type: new \nAbstract: Motion planning is central to robotics, and it is increasingly used to correct the motions proposed by learned planners and policies. In both uses, constraints must hold at every instant of the motion, not only at sampled times. To our knowledge, no algorithm provably converges to a globally optimal motion once a smoothness cost is combined with such constraints. We cast planning and steering as a single continuous-time program: robots avoid one another and static or moving obstacles, and a learned proposal is steered by keeping the motion close","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36349,"title":"PATH: Preference-Aware Traversability Estimation for Robotic Teleoperation in Off-Road Navigation","url":"https://arxiv.org/abs/2610.30605","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30605v1 Announce Type: new \nAbstract: Traversability estimation is critical for ground vehicle teleoperation, yet existing methods often neglect the human operator's preferences for speed and risk tolerance. To address this gap, we propose PATH-Net, a Preference-Aware Traversability estimation Hierarchical Network that adaptively generates preference-conditioned traversability cost maps and speed profiles for off-road teleoperation. Our framework integrates visual and geometric bird's-eye-view features with short-term historical vehicle states through a multi-head shared-backbone ar","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36348,"title":"OASIS: Online Anchor-centric Scene Inference System for Open-Vocabulary Retrieval and Navigation in Dynamic Environments","url":"https://arxiv.org/abs/2610.30589","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30589v1 Announce Type: new \nAbstract: Reliable robotic mapping in dynamic real-world environments is essential for embodied intelligence and long-term autonomy. However, existing methods often involve a trade-off: lightweight online mapping is efficient but captures limited semantic context, while dense mapping provides richer semantics at higher computational cost and is more vulnerable to distractors. They also struggle to relocalize objects after scene changes. To address these challenges, we propose the Online Anchor-centric Scene Inference System (OASIS), a unified system for o","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36347,"title":"Know When to Escalate: Critic-Guided Adaptive Execution for Cloud-Local Embodied Agents","url":"https://arxiv.org/abs/2610.30587","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30587v1 Announce Type: new \nAbstract: Recent advances in foundation-model agents have enabled increasingly capable embodied systems for long-horizon planning and interaction. However, embodied agents require fast, closed-loop decisions as they continuously perceive and act on a changing environment. Deploying strong cloud agents leaves the platform idle for seconds between consecutive actions, while lightweight local models respond quickly but are more vulnerable to errors. Existing hierarchical architectures typically assign models fixed roles, whereas conventional model routers ma","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36346,"title":"Motion Retargeting with Spatiotemporal Preferences for Humanoid Loco-Manipulation","url":"https://arxiv.org/abs/2610.30540","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30540v1 Announce Type: new \nAbstract: Human motion retargeting bridges the embodiment gap between humans and humanoid robots by converting human demonstrations into reference trajectories for whole-body control and loco-manipulation. For object-interaction tasks, successful execution depends on accurately preserving body--object relations at critical stages. However, uniform per-frame iteration budgets do not account for these localized accuracy requirements, limiting the computational efficiency of retargeting. To address this limitation, we present Spatiotemporal Retargeting (STR)","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36345,"title":"Externalise the Memory: A Pre-Registered Study of Where an Embodied Agent's Experience Should Live","url":"https://arxiv.org/abs/2610.30478","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30478v1 Announce Type: new \nAbstract: Should an embodied agent's experience be baked into its policy weights, or kept external and retrieved at inference? A memory-augmented teacher (a VLM that retrieves lessons, with their episode images, from its own past attempts) produces trajectories on a vision-conditioned reach task; from the same trajectories we distil LoRA student policies and evaluate them under matched protocols, including one that re-attaches the teacher's frozen retrieval buffer to a fixed set of student weights. We pre-registered the hypotheses, arms, tests, and analys","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
