意到，人工智能行业飞速发展，算力需求同步激增，各类性能瓶颈随之暴露，这倒逼 DRAM 与 NAND 闪存厂商跳出固有思维、探索突破性技术路线。\u003c/p\u003e\u003cp data-vmark=\"a93d\"\u003e过去，芯片厂商只需推出全新存储技术就能满足需求，彼时 DRAM 是核心存储器件。但如今研发成本攀升、工艺良率存在短板、芯片功耗持续走高，行业不得不转向其他可行技术方案。高带宽内存（HBM）此前一直稳步迭代，可受产能短缺影响，其自身也迅速演变为新的性能瓶颈。\u003c/p\u003e\u003cp data-v","tags":[],"cluster_size":1,"ts":"2026-06-22T01:25:48"},{"id":4510,"title":"亚马逊 AI 主管：已就向外部出售实体 Trainium 芯片进行商谈","url":"https://www.ithome.com/0/966/774.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bd1b\"\u003eIT之家 6 月 22 日消息，据彭博社消息，Amazon（亚马逊）AI 主管 Peter DeSantis 在法国巴黎接受采访时表示，\u003cstrong\u003e已就向外部企业出售其自研 AI ASIC 的实体芯片展开讨论\u003c/strong\u003e。此前第三方均仅以云服务的形式访问 AWS 的 Trainium 系列芯片。\u003c/p\u003e\u003cp data-vmark=\"7d8b\"\u003ePeter DeSantis 表示：“我们认为 AI 基础设施正在迅速发展。而且我们一直在探索如何触达更多客户。”\u003c/p\u003e\u003cp data-vmark=\"3d49\"\u003eIT之家注意到，亚马逊首席执行官 Andy Jassy 在\u003ca target=\"_blank\" href=\"https://www.ithome.com/0/937/566.htm\"\u003e今年 4 月的致股东信\u003c/a\u003e中曾表示，对 Trainium 芯片的云端需求正在激增，“我们芯片的需求量如此之大，以至于未来很有可能将整批芯片出售给第三方”。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"be7d\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/80b435ad-2b89-4a9d-9c43-dc7944afc9b6.jp","tags":[],"cluster_size":1,"ts":"2026-06-22T01:23:14"},{"id":4511,"title":"特斯拉申请 Megapod 商标，暗示将推出模块化 AI 数据中心硬件系统","url":"https://www.ithome.com/0/966/771.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"65a1\"\u003eIT之家 6 月 22 日消息，据 Electrek 报道，特斯拉一份全新商标申请文件显示，公司计划推出一款名为“Megapod”的模块化人工智能数据中心硬件产品。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"618d\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/31f99905-7181-42b7-8d58-798cad9328a7.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"788\" data-weibo=\"0\" data-vmark=\"13db\"\u003e\u003c/p\u003e\u003cp data-vmark=\"c2dc\"\u003eIT之家注意到，这份商标文件描述了一套完整、独立运行的人工智能算力计算系统；而距离特斯拉关停旗下唯一自研 AI 训练超算 Dojo，这份申请递交时间还不足一年。\u003c/p\u003e\u003cp data-vmark=\"02a9\"\u003e本月，特斯拉委托长期合作的知识产权律师，向美国专利商标局提交了“Megapod”商标申请（申请序列号：99893717）。该申请属于意图使用型商标申请，意味着特斯拉仅为一款尚未发布的产品预留该名称。\u003c/p\u003e\u003cp data-vmark=\"ebe6\"\u003e这份商标文件对商","tags":[],"cluster_size":1,"ts":"2026-06-22T01:14:06"},{"id":4512,"title":"2026年，1806个DeepSeek跟我一起守护艾泽拉斯：AI填满的艾泽拉斯 - 中华网","url":"https://news.google.com/rss/articles/CBMicEFVX3lxTE9pTnRsb0xlU0hsY3JTY3I3N2l4QTRpTzNrcllRSUwxYUdCaTdzdlVvS2dEMDdDc2VWTDFHU1J3LXdZbEktMkduLVA0aEdmaWszM29TcWZIcmlYUnhPY3JZQ21fZDlPZUxuQzA2WW00bEY?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMicEFVX3lxTE9pTnRsb0xlU0hsY3JTY3I3N2l4QTRpTzNrcllRSUwxYUdCaTdzdlVvS2dEMDdDc2VWTDFHU1J3LXdZbEktMkduLVA0aEdmaWszM29TcWZIcmlYUnhPY3JZQ21fZDlPZUxuQzA2WW00bEY?oc=5\" target=\"_blank\"\u003e2026年，1806个DeepSeek跟我一起守护艾泽拉斯：AI填满的艾泽拉斯\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e中华网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-22T01:04:20"},{"id":4513,"title":"消息称三星 Galaxy S27 Pro 新开 6.47 英寸中屏，同步测试防窥功能","url":"https://www.ithome.com/0/966/767.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"dbba\"\u003eIT之家 6 月 22 日消息，博主 @数码闲聊站 今日爆料称，三星 Galaxy S27 Pro 新开 6.47 英寸中屏，同步测试防窥功能。\u003c/p\u003e\u003cp data-vmark=\"9afd\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/afa72f76-c430-430e-98b9-45a6d27abbe4.png\" w=\"750\" h=\"193\" data-snap-from=\"%7B%22from%22%3A%22weibo%22%2C%22url%22%3A%22https%3A%2F%2Fm.weibo.cn%2Fdetail%2F5312530349033098%22%7D\" data-weibo=\"0\" data-mpos=\"2,0\"  data-vmark=\"6314\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"a3af\"\u003eIT之家注意到，三星今年预计将推出四款旗舰直板手机，分别是\u003cstrong\u003e Galaxy S27、Galaxy S27+、Galaxy S27 Pro 和 Galaxy S27 Ultra\u003c/strong\u003e。作为参考，\u003cspan class=\"hot","tags":[],"cluster_size":1,"ts":"2026-06-22T01:02:11"},{"id":4515,"title":"AgentRL: Scaling Agentic Reinforcement Learning with a Multi-Turn, Multi-Task Framework - 智源社区","url": ticles/CBMimAFBVV95cUxNMzVVM2QtdWdCOTVHamFEUXd2YnVZVnNrdGVkMlM5ZkZNcmhrTUE1T3dnYm5SdVg3dG8yd1pRbk1UNDF6RWtpSV9LM3lHYkVvZ3k3Wm50WVhka0JZX21BSmpxcFIweThiMmdoRklrTDZQLS1XaU56VDMxMmV2aHpKWWdLTktuLVluT0U1OWpMaVdGVzFYS2U2VQ?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMimAFBVV95cUxNMzVVM2QtdWdCOTVHamFEUXd2YnVZVnNrdGVkMlM5ZkZNcmhrTUE1T3dnYm5SdVg3dG8yd1pRbk1UNDF6RWtpSV9LM3lHYkVvZ3k3Wm50WVhka0JZX21BSmpxcFIweThiMmdoRklrTDZQLS1XaU56VDMxMmV2aHpKWWdLTktuLVluT0U1OWpMaVdGVzFYS2U2VQ?oc=5\" target=\"_blank\"\u003eHumanoid Robots Show Narrow Skills, Not Multitasking\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eLet's Data Science\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-19T06:23:00"},{"id":3908,"title":"Temporal Self-Imitation Learning","url":"https://arxiv.org/abs/2606.19752","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19752v1 Announce Type: new \nAbstract: Long-horizon robot manipulation policies trained with reward shaping can still exploit dense rewards through inefficient interaction, while rare efficient behaviors may be forgotten during training. We argue that temporal efficiency itself provides a powerful and underutilized source of self-supervision for reinforcement learning. We introduce Temporal Self-Imitation Learning (TSIL), a reinforcement learning framework that mines temporally efficient successful trajectories generated during learning and converts them into reusable supervision for","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3907,"title":"VOiLA: Vectorized Online Planning with Learned Diffusion Model for POMDP Agents","url":"https://arxiv.org/abs/2606.19729","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19729v1 Announce Type: new \nAbstract: Planning under uncertainty is an essential capability for autonomous robots. The Partially Observable Markov Decision Process (POMDP) provides a powerful framework for such a capability. Although POMDP-based planning has advanced significantly, its application to real-world problems is often limited by the difficulty of obtaining faithful POMDP models. We present Vectorized Online planning wIth Learned diffusion model for POMDP Agents (VOiLA), a framework that learns task-agnostic POMDP models for online planning under uncertainty. VOiLA learns","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3906,"title":"Bidirectional Tutoring for Developmental Motor Learning in Robots: Co-Developed Interaction Dynamics Support Stable Learning","url":"https://arxiv.org/abs/2606.19728","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19728v1 Announce Type: new \nAbstract: Infants are well known to develop their motor skills through dense interaction with caregivers. Although such social interaction is crucial for human development, motor-skill learning in robots is often treated as a unidirectional process in which robots passively receive demonstrations from tutors. This overlooks a key property of social interaction: it is inherently bidirectional, with tutor and learner dynamically adapting to each other. In such interactions, the robot's past experiences may function as prior constraints that shape the dynami","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3905,"title":"Comparative Study on Agility, Efficiency, and Impact Absorption of Bipedal Robots with Active Toes","url":"https://arxiv.org/abs/2606.19699","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19699v1 Announce Type: new \nAbstract: Human legs exhibit high efficiency, agility, and impact absorption, with toes playing a crucial role in these capabilities. While many attempts have been made to implement human-like toes in robots, they have not fully replicated human characteristics nor rigorously validated their benefits. We propose a 14-DOF biped robot emulating human toes' lightweight, high-torque, robust nature. To quantitatively analyze the effectiveness of the active toes in terms of agility, efficiency, and impact absorption, we developed a high-fidelity simulation trai","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3904,"title":"ForEnt: A Multi-Modal Dataset for Characterizing Quadruped Robot Entrapments in Forest Environments","url":"https://arxiv.org/abs/2606.19675","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19675v1 Announce Type: new \nAbstract: Legged robots are increasingly deployed in forests for ecological surveying and monitoring, yet their autonomy is often interrupted consequent to the challenges posed in traversing forest environments. Forest entrapments, for example, when a robot's legs are ensnared in vines or other vegetation, result in loss of stability and toppling. Such events not only disrupt the mission and require manual intervention, but also risk damage to the robot hardware. To address the absence of a dedicated dataset to investigate these failure modes in forest en","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3903,"title":"Safe Local Navigation for Ackermann-Steered Robots in Unmapped Environments","url":"https://arxiv.org/abs/2606.19672","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19672v1 Announce Type: new \nAbstract: A control framework is proposed for safe local navigation of mobile robots equipped with Ackermann steering in unmapped environments where a global goal is absent. Based on local obstacle detections, the safest heading angle is determined along the direction of the largest open space ahead of the vehicle. Guided by this direction, bounding lines are constructed on the left and right sides of the vehicle to achieve obstacle separation. These bounding lines are obtained by solving a convex quadratic optimization that maximizes vehicle-to-obstacle","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3902,"title":"DF-ExpEnse: Diffusion Filtered Exploration for Sample Efficient Finetuning","url":"https://arxiv.org/abs/2606.19656","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19656v1 Announce Type: new \nAbstract: A natural recipe for intelligent robotic decision-making is initializing from pretrained generative control policies, which have summarized offline experience, and adapting them to self-collected online experience. We present DF-ExpEnse, an exploration technique that improves the quality of online experience collection, thus increasing finetuning sample-efficiency. DF-ExpEnse leverages the multimodal modeling capabilities of the generative control policy to create an expressive and tractably evaluatable candidate set. It then utilizes an ensembl","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3901,"title":"CTS-MoE: Implicit Terrain Adaptation via Mixture-of-Experts for Perceptive Locomotion","url":"https://arxiv.org/abs/2606.19633","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19633v1 Announce Type: new \nAbstract: Perceptive legged locomotion over discontinuous terrain (e.g., stairs, gaps, and obstacles) requires adaptive behavior, as a single conservative gait cannot produce the anticipatory maneuvers needed for abrupt topology changes. Cast as multi-task reinforcement learning, this problem introduces a tension between sharing and separation. Tasks use a common locomotion base but have conflicting rewards, so a policy must share behavior while avoiding value interference. Prior work addresses only one side, with monolithic policies sacrificing specializ","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3900,"title":"Formal Verification of Learned Multi-Agent Communication Policies via Decision Tree Distillation","url":"https://arxiv.org/abs/2606.19632","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19632v1 Announce Type: new \nAbstract: Multi-agent reinforcement learning (MARL) enables agents to develop coordination strategies through emergent communication, but neural policies lack the formal safety guarantees required for safety-critical robotic deployment in drone swarms and autonomous vehicle fleets. We present the first end-to-end framework for safety verification of learned multi-agent communication policies through policy abstraction: neural policies are distilled into interpretable decision trees, then formally verified, with empirical validation confirming that verifie","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3899,"title":"Fail-RAG : A Retrieval Augmented Generation Informed Framework for Robot Failure Identification","url":"https://arxiv.org/abs/2606.19598","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19598v1 Announce Type: new \nAbstract: Industry automation is witnessing an evolution in robotics driven by both technological breakthroughs and societal changes: progress towards generalist robots, embodied and physical artificial intelligence (AI), and increasing labor shortage in manufacturing.An intelligent autonomous robot needs to not only act according to planned motions but also react to any unexpected events. In this study, we focus on such unexpected events in warehouses where robots are used for material handling. Specifically, we refer to any unexpected events as failures","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3898,"title":"One Demo is Worth a Thousand Trajectories: Action-View Augmentation for Visuomotor Policies","url":"https://arxiv.org/abs/2606.19586","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19586v1 Announce Type: new \nAbstract: Visuomotor policies for manipulation have demonstrated remarkable potential in modeling complex robotic behaviors, yet minor alterations in the robot's initial configuration and unseen obstacles easily lead to out-of-distribution observations. Without extensive data collection effort, these result in catastrophic execution failures. In this work, we introduce an effective data augmentation framework that generates visually realistic fisheye image sequences and corresponding physically feasible action trajectories from real-world eye-in-hand demo","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3897,"title":"pdSTL: Probabilistic Differentiable Signal Temporal Logic for Stochastic Systems","url":"https://arxiv.org/abs/2606.19561","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19561v1 Announce Type: new \nAbstract: Autonomous robots operating in uncertain environments must satisfy complex temporal and safety specifications despite stochastic dynamics and sensing noise. While Signal Temporal Logic (STL) offers robustness measures for gradient-based optimization, existing extensions either lack differentiability or ignore belief-space uncertainty. We introduce pdSTL (probabilistic differentiable Signal Temporal Logic), a framework that unifies probabilistic semantics with differentiable robustness over belief trajectories. pdSTL employs interval-valued proba","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3896,"title":"SCAN-Planner: Spatial Collision-Aware Local Planning for Route-Guided Long-Range Quadruped Navigation","url":"https://arxiv.org/abs/2606.19555","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19555v1 Announce Type: new \nAbstract: Quadruped robots are increasingly expected to navigate through narrow passages, cluttered indoor scenes, and large-scale 3D unstructured environments. Existing local planners commonly approximate the robot using isotropic geometric inflation or rely on planar and elevation-map representations, leading to conservative motion in tight spaces and limited reasoning about overhanging structures. This letter presents SCAN-Planner, a spatial collision-aware local planning framework for long-range quadruped navigation. A yaw-aware twin-cylinder footprin","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3895,"title":"A Categorial and Sheaf-Theoretic Semantics for Autonomic Component Ensembles","url":"https://arxiv.org/abs/2606.19525","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19525v1 Announce Type: new \nAbstract: The proliferation of large-scale, decentralized systems of autonomous agents, such as swarms of robots and networked cyber-physical systems, presents a formidable challenge to traditional formal methods. The Software Component Ensemble Language (SCEL) offers a formal model for such systems, but its operational semantics is not ideal for reasoning about global, structural, and emergent properties. This report proposes a new, multi-layered mathematical model for SCEL using category theory and sheaf theory. We argue that a society of robots describ","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3894,"title":"Proprioceptive Invariant State Estimation for Humanoid Robots on Non-Inertial Ground","url":"https://arxiv.org/abs/2606.19512","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19512v1 Announce Type: new \nAbstract: This paper presents an invariant extended Kalman filtering (InEKF) approach for real-time state estimation of humanoid robots operating on non-inertial ground using only onboard proprioceptive sensing. The proposed approach estimates the robot's base position and velocity relative to the moving ground frame without requiring direct measurements of ground motion or externally mounted sensors. By exploiting kinematic constraints at the stance foot through foot-mounted IMUs, the filter accounts for ground-induced nonlinearities in the process and m","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3893,"title":"Simulating Robotic Locomotion in Sand: Resistive Force Theory in an Open-Source Physics Engine","url":"https://arxiv.org/abs/2606.19504","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19504v1 Announce Type: new \nAbstract: Recent advancements in Resistive Force Theory (RFT) enable approximation of ground reaction forces for locomotion in sand without the computational expense of modeling interactions with individual grains. However, these tools have been absent in 3D physics engines commonly used for robot simulation. We explore if resistive force approximations are sufficient, when integrated with standard dynamics calculations, to provide a stable substrate for a freely walking robot. To determine this, we implement 3D Granular Resistive Force Theory (3D RFT) in","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3892,"title":"Playful Agentic Robot Learning","url":"https://arxiv.org/abs/2606.19419","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19419v1 Announce Type: new \nAbstract: Current agentic robot systems can write executable Code-as-Policy programs, observe feedback, and revise behavior across multiple attempts, but they remain largely task-driven: reusable skills are acquired only after explicit instructions. We study Playful Agentic Robot Learning, where an embodied coding agent uses self-directed play as a continual skill-learning stage before downstream tasks arrive. We introduce RATs, Robotics Agent Teams designed for play-time skill acquisition. During play, RATs proposes novel yet learnable exploratory tasks,","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3891,"title":"DiffusionVS: A Generative Framework for Robust Visual Servoing Based on Diffusion Policy","url":"https://arxiv.org/abs/2606.19397","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19397v1 Announce Type: new \nAbstract: Visual servoing is a fundamental technique in robotic manipulation and navigation. Regression-based visual servoing frequently experiences trajectory jitter as a result of noise-sensitive single-step mappings and the accumulation of errors during distribution shifts. In contrast, Diffusion Policy maintains temporal consistency by predicting action sequences and improves robustness through implicit data augmentation.\n  This paper presents a novel diffusion-based servoing method. Based on Diffusion Policy, the proposed approach uses normalized ima","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3890,"title":"3D Scene Graphs: Open Challenges and Future Directions","url":"https://arxiv.org/abs/2606.19383","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19383v1 Announce Type: new \nAbstract: 3D Scene Graphs (3DSGs) have emerged as a powerful representation for spatial AI by combining geometric grounding with semantic and relational abstractions of the environment. Their expressiveness has made them relevant to a broad range of problems in robotics and computer vision, including manipulation, navigation, task planning, scene understanding, and many others. However, the field remains fragmented: different communities adopt distinct formulations, construction pipelines, and evaluation protocols, making it difficult to compare methods,","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3889,"title":"WorkBenchMark: A LEGO-Based Assembly Benchmark with an Assembly-by-Disassembly Baseline for the Smart Manufacturing League","url":"https://arxiv.org/abs/2606.19358","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19358v1 Announce Type: new \nAbstract: We introduceWorkBenchMark, a LEGO Duplo-based robotic assembly benchmark motivated by the RoboCup Smart Manufacturing League. Robotic assembly couples low-level manipulation with task-level symbolic reasoning under physical constraints, a combination that current end-to-end learning methods do not yet solve reliably. The benchmark provides 400 tasks across four complexity tiers. We provide an open-vocabulary perception, Assembly-by-Disassembly baseline solution. Our planning-based pipeline outperforms a modern vision-language-action approach acr","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"},{"id":3888,"title":"Physical Atari: A Robust and Accessible Platform for Real-time Reinforcement Learning on Robots","url":"https://arxiv.org/abs/2606.19357","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.19357v1 Announce Type: new \nAbstract: We built a robot called the Robotroller that actuates an Atari CX40+ controller and a device called the Atari Devbox that renders the game frame and the reward signal from the Arcade Learning Environment on a screen. The Robotroller and the Atari Devbox, together with an off-the-shelf camera and a desktop computer, constitute a system that can be used to study reinforcement learning algorithms in the physical world. We call the full system Physical Atari. In this paper, we detail the key decisions that make Physical Atari a robust and accessible","tags":[],"cluster_size":1,"ts":"2026-06-19T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
