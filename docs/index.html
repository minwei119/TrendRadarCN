-align: center;\" data-vmark=\"0460\"\u003e\u003cimg src=\"https://i","tags":[],"cluster_size":1,"ts":"2026-10-24T00:14:26"},{"id":36494,"title":"国产“造芯”智能体在武汉发布 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE51QjVMVFRISi1FVGJCb1ZkYmZjcTAwQ1RwNFp2b2dkdHZIc1hVTDRyVEtvWDBpSDNWWlNialozeTNtUTRaREpORUwtdnRRdFZzOUpxLUVYTjZYbjRxaHBjYw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE51QjVMVFRISi1FVGJCb1ZkYmZjcTAwQ1RwNFp2b2dkdHZIc1hVTDRyVEtvWDBpSDNWWlNialozeTNtUTRaREpORUwtdnRRdFZzOUpxLUVYTjZYbjRxaHBjYw?oc=5\" target=\"_blank\"\u003e国产“造芯”智能体在武汉发布\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-24T00:12:23"},{"id":36495,"title":"扎克伯格的 AI 新版图：买下 Sundial 让数据分析变成“聊天”那么简单","url":"https://www.ithome.com/1/017/294.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"a7b7\"\u003eIT之家 10 月 24 日消息，科技媒体 axios 昨日（10 月 23 日）发布博文，报道称马克 · 扎克伯格的 Meta Platforms 公司已收购 AI 数据分析平台 Sundial，而该平台由两名前 Meta 员工创立。\u003c/p\u003e\u003cp data-vmark=\"9069\"\u003e值得注意的是，Sundial 的两位联合创始人均是 Meta（前 Facebook）的资深旧部：首席执行官 Julie Zhuo 曾任 Meta 产品设计副总裁，Chandra Narayanan 则曾担任 Instagram 及红杉资本的数据分析主管。\u003c/p\u003e\u003cp data-vmark=\"c262\"\u003eSundial 的核心能力，是让企业通过聊天机器人插件，用自然语言向复杂数据提问，并快速获得可执行的分析结论。对于业务团队而言，无需长期等待集中式数据部门支持，即可自行完成数据洞察，从而加快产品迭代、运营决策和 AI 系统监测。\u003c/p\u003e\u003cp data-vmark=\"d21d\"\u003eMeta 近年来持续加码数据与 AI 基础设施。今年 7 月，公司任命前营销负责人 Alex Schultz 为首任首席数据官，并组建了名为“Data Analytics Tooling \u0026amp; Agents”（DATA）的新部门，负责描述性分析、实验测试、AI 产品改进以及关键 AI","tags":[],"cluster_size":1,"ts":"2026-10-24T00:08:21"},{"id":36496,"title":"国产大模型上新！月之暗面推出Kimi K3.1 Pro - 大河财立方","url":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5OV293a3dJMUY4Tm9wQTFFUWhNbjRoTnNtb2huTlM2ZFkyMW8tTnpHSHF1RFZKMFQ3SHRNREI3dG1icEsyeDVxdDdOZG51ZEVaWl9uS1h3THJGX3JoU1FxT0otSmJxTFVmLWc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"]," 1/017/284.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"eaf7\"\u003eIT之家 10 月 24 日消息，今天（24 日）凌晨，月之暗面 Kimi 宣布正式推出 Kimi K3.1 系列的第一个模型 ——K3.1 Pro，也是公司\u003cstrong\u003e迄今能力最强的 3 万亿级参数模型\u003c/strong\u003e，支持 100 万上下文。\u003c/p\u003e\u003cp data-vmark=\"23f0\"\u003e高速版模型 Kimi K3.1 Pro Highspeed 同步推出，同等智能，\u003cstrong\u003e输出速度约 2~3 倍\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"b078\"\u003e即日起，用户可通过 \u003cspan class=\"link-text-start-with-http\"\u003ekimi.com\u003c/span\u003e、Kimi App、Kimi Work、Kimi Code 和 Kimi API (\u003cspan class=\"link-text-start-with-http\"\u003eplatform.kimi.com\u003c/span\u003e)，使用 Kimi K3.1 Pro 和 Kimi K3.1 Pro Highspeed 模型。完整模型权重将于 11 月 4 日前发布。\u003c/p\u003e\u003cp data-vmark=\"1f68\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuplo","tags":[],"cluster_size":1,"ts":"2026-10-23T23:08:43"},{"id":36509,"title":"Anthropic联合创始人：中国AI落后西方半年 他们的模型太蠢了 - 驱动之家","url":"https://news.google.com/rss/articles/CBMiWEFVX3lxTE15RVU2TWtySkFEQnJXYWJGZGQycmpsYXFnNm1UX05aaXpjYTY2YUtvdTA1dEJEQTJhWG9iZkZlRklwMjdNbC1kMS14MUE3V19pM2lyTHBlTmE?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiWEFVX3lxTE15RVU2TWtySkFEQnJXYWJGZGQycmpsYXFnNm1UX05aaXpjYTY2YUtvdTA1dEJEQTJhWG9iZkZlRklwMjdNbC1kMS14MUE3V19pM2lyTHBlTmE?oc=5\" target=\"_blank\"\u003eAnthropic联合创始人：中国AI落后西方半年 他们的模型太蠢了\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e驱动之家\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-23T23:06:00"},{"id":36510,"title":"长城证券10月23日回应AI大模型话题：投行打造智能撰写助手辅助申报文件撰写_公司新闻 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE43VFlYNkp5U2kzOXNkSEZuRk5kMW9hSEdsMmw4S2R1eGlULWlicmg4WHJlNnJQb0V6RlRwdU90OHZMU3ZYdzFpakk3TzV6R3E5RWVaOVFobDZHOUZmTmd1OA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE43VFlYNkp5U2kzOXNkSEZuRk5kMW9hSEds cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30817v1 Announce Type: new \nAbstract: Humanoid motion-tracking policies can reproduce diverse behaviors, yet connecting independently acquired motions into a continuous sequence remains challenging. Interpolation connects boundary poses without considering whether their relative position, heading, and timing provide suitable conditions for a transition. A generative motion prior can produce richer motion, but poorly arranged boundaries may cause it to generate excessive locomotion, turning, or another unintended action. We present Spatio-Temporal Alignment with a Motion Prior (STAMP","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36354,"title":"Adaptive Aerial Loco-Manipulation Policy Learning via LLM-Assisted Proactive Task Generation","url":"https://arxiv.org/abs/2610.30810","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30810v1 Announce Type: new \nAbstract: Loco-manipulation extends the workspace of conventional manipulation by combining mobility with physical interaction, while aerial loco-manipulation further expands this capability into three-dimensional space, enabling robots to reach environments inaccessible to ground-based systems. Moving to an aerial platform, however, gives rise to a demanding control problem, since the vehicle must track trajectories accurately in three dimensions while the motion of the arm and its interaction with the environment continuously shift the center of mass, a","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36353,"title":"When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies","url":"https://arxiv.org/abs/2610.30735","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30735v1 Announce Type: new \nAbstract: Flow matching is now the dominant approach for vision-language action (VLA) robot policies, thanks to its expressiveness and simple training objective. However, inference for standard flow matching requires iteratively solving an ODE, limiting the control frequency at deployment. While several works have proposed novel methods to allow for single-shot action generation, we ask whether such additional objectives are actually necessary. We find that across six flow matching VLAs, one-step action generation largely matches multi-step sampling at sc","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36352,"title":"Live Thread Reconstruction for Autonomous Manipulation","url":"https://arxiv.org/abs/2610.30694","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30694v1 Announce Type: new \nAbstract: Autonomous robotic surgery has drawn increased attention in recent years due to its potential to relieve surgeons of time-consuming, mentally straining, and tedious tasks, particularly during prolonged operations. One suitable task for automation is suturing, which involves tracking the thread as it deforms during needle retrieval, de-tangling, knot tightening, and other tasks. Unlike rigid-object manipulation, deformable thread manipulation has no fixed pose to track and effectively infinite degrees of freedom, making its configuration difficul","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36351,"title":"Co^2Gen: Collaboratively Generating Task Plans for Decentralized Multi-Robot and Human Collaboration","url":"https://arxiv.org/abs/2610.30671","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30671v1 Announce Type: new \nAbstract: Visual Language Action (VLA) models are designed to be generalist robot models that can be implemented across embodiments, tasks and environments. However, their ability to collaborate with other robots and humans remains underexplored. In this work, we propose a framework to automate the generation of multi-robot collaborative data for decentralized VLA training without requiring human teleoperation. Our framework first utilizes a decentralized collaborative planning approach to generate multi-robot collaborative robot plans in the form of an e","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36350,"title":"Continuous-Time Motion Planning and Steering with Global Convergence","url":"https://arxiv.org/abs/2610.30607","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30607v1 Announce Type: new \nAbstract: Motion planning is central to robotics, and it is increasingly used to correct the motions proposed by learned planners and policies. In both uses, constraints must hold at every instant of the motion, not only at sampled times. To our knowledge, no algorithm provably converges to a globally optimal motion once a smoothness cost is combined with such constraints. We cast planning and steering as a single continuous-time program: robots avoid one another and static or moving obstacles, and a learned proposal is steered by keeping the motion close","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36349,"title":"PATH: Preference-Aware Traversability Estimation for Robotic Teleoperation in Off-Road Navigation","url":"https://arxiv.org/abs/2610.30605","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30605v1 Announce Type: new \nAbstract: Traversability estimation is critical for ground vehicle teleoperation, yet existing methods often neglect the human operator's preferences for speed and risk tolerance. To address this gap, we propose PATH-Net, a Preference-Aware Traversability estimation Hierarchical Network that adaptively generates preference-conditioned traversability cost maps and speed profiles for off-road teleoperation. Our framework integrates visual and geometric bird's-eye-view features with short-term historical vehicle states through a multi-head shared-backbone ar","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36348,"title":"OASIS: Online Anchor-centric Scene Inference System for Open-Vocabulary Retrieval and Navigation in Dynamic Environments","url":"https://arxiv.org/abs/2610.30589","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30589v1 Announce Type: new \nAbstract: Reliable robotic mapping in dynamic real-world environments is essential for embodied intelligence and long-term autonomy. However, existing methods often involve a trade-off: lightweight online mapping is efficient but captures limited semantic context, while dense mapping provides richer semantics at higher computational cost and is more vulnerable to distractors. They also struggle to relocalize objects after scene changes. To address these challenges, we propose the Online Anchor-centric Scene Inference System (OASIS), a unified system for o","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36347,"title":"Know When to Escalate: Critic-Guided Adaptive Execution for Cloud-Local Embodied Agents","url":"https://arxiv.org/abs/2610.30587","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30587v1 Announce Type: new \nAbstract: Recent advances in foundation-model agents have enabled increasingly capable embodied systems for long-horizon planning and interaction. However, embodied agents require fast, closed-loop decisions as they continuously perceive and act on a changing environment. Deploying strong cloud agents leaves the platform idle for seconds between consecutive actions, while lightweight local models respond quickly but are more vulnerable to errors. Existing hierarchical architectures typically assign models fixed roles, whereas conventional model routers ma","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36346,"title":"Motion Retargeting with Spatiotemporal Preferences for Humanoid Loco-Manipulation","url":"https://arxiv.org/abs/2610.30540","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30540v1 Announce Type: new \nAbstract: Human motion retargeting bridges the embodiment gap between humans and humanoid robots by converting human demonstrations into reference trajectories for whole-body control and loco-manipulation. For object-interaction tasks, successful execution depends on accurately preserving body--object relations at critical stages. However, uniform per-frame iteration budgets do not account for these localized accuracy requirements, limiting the computational efficiency of retargeting. To address this limitation, we present Spatiotemporal Retargeting (STR)","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36345,"title":"Externalise the Memory: A Pre-Registered Study of Where an Embodied Agent's Experience Should Live","url":"https://arxiv.org/abs/2610.30478","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30478v1 Announce Type: new \nAbstract: Should an embodied agent's experience be baked into its policy weights, or kept external and retrieved at inference? A memory-augmented teacher (a VLM that retrieves lessons, with their episode images, from its own past attempts) produces trajectories on a vision-conditioned reach task; from the same trajectories we distil LoRA student policies and evaluate them under matched protocols, including one that re-attaches the teacher's frozen retrieval buffer to a fixed set of student weights. We pre-registered the hypotheses, arms, tests, and analys","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36344,"title":"Integrated Respiratory Sensing and Gated Control for Autonomous Needle Insertion Via CT Bore Robotic Arm","url":"https://arxiv.org/abs/2610.30452","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30452v1 Announce Type: new \nAbstract: Currently, CT-guided lung biopsy is a highly manual procedure requiring patient breath-holding, iterative manual needle insertions, and repeated CT confirmation scans to accurately target a tumor. Automating this process within the CT bore--without relying on manual needle placement or patient breath-holding--has the potential to reduce procedure time, patient discomfort, and radiation exposure. In this work, we present an integrated sensing and control system capable of performing a gated needle insertion within the CT bore. The experiments dem","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36343,"title":"Tactile-Based Robotic Manipulation: From Mechanics-Driven to Data-Driven Perspectives","url":"https://arxiv.org/abs/2610.30438","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30438v1 Announce Type: new \nAbstract: Tactile sensing provides robots with direct access to physical interactions at the contact interface, making it a critical modality for robust and dexterous manipulation. Over the past several decades, tactile-based manipulation research has evolved from mechanics-driven approaches, which explicitly interpret tactile signals through contact mechanics and task-specific reasoning, to data-driven approaches that learn tactile representations and manipulation policies directly from data. This paper reviews the development of tactile-based manipulati","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36342,"title":"MPBRS: Multi-Potential-Based Reward Shaping for Unified Reward Configuration in Humanoid Locomotion","url":"https://arxiv.org/abs/2610.30334","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30334v1 Announce Type: new \nAbstract: Designing and tuning reward functions remains one of the main challenges in building effective reinforcement learning (RL) pipelines for humanoid locomotion. While shaping rewards can accelerate learning, naively formulated terms often conflict with the desired behavior, overfit to a specific robot, or become unstable under small weight changes. Potential-Based Reward Shaping (PBRS) offers an alternative solution: shaping the reward via differences of a potential function to guide exploration without changing the optimal policy. In this paper, w","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36341,"title":"Self-Distilling Future Video Representations for World Action Models","url":"https://arxiv.org/abs/2610.30320","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30320v1 Announce Type: new \nAbstract: World Action Models (WAMs) have emerged as a promising approach to learning generalist robot policies using rich spatiotemporal priors from pre-trained video diffusion models. A recent line of WAMs improves inference efficiency by conditioning a separate action decoder on intermediate future video representations extracted from a single denoising step, avoiding costly iterative denoising required for video generation. This design makes action prediction depend directly on the quality of these future representations. In this paper, we introduce F","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36340,"title":"Alpha: Systematic Fault Injection and Robustness Evaluation for LLM-Driven Embodied Manipulation","url":"https://arxiv.org/abs/2610.30197","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30197v1 Announce Type: new \nAbstract: Large language models (LLMs) are increasingly integrated into embodied robotic planning, yet standard benchmarks primarily evaluate end-to-end task completion in nominal environments, obscuring failure origins across the execution stack. We present Alpha, a systematic fault-injection and robustness-evaluation framework for LLM-driven manipulation in simulation. Alpha injects calibrated faults across perception (sensor lag), actuation (grip slip), kinematics (unreachable targets), and planning (planner-output corruption), alongside concurrent con","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36357,"title":"A股异动丨人形机器人概念逆势上涨，浙江荣泰逼近涨停，马斯克预告Optimus明年外售 - 新浪网","url":"https://news.google.com/rss/articles/CBMigwFBVV95cUxOVG14WVVVMmdkNnhRUjlIWG1qQm1YRjctZTRJ // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
