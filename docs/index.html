]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#475569","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":9585,"title":"James Corden challenges the audience to a game of 'Mama, Obama Or Llama?' - FOX Sports","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBUQU0tR0F4d3E4Z1oyODFwUTdSRlA4NWxsTS1KOE1RbENTeFUtYTZxcFhJYXhTSFpTZXY4Q3JhanpOUnVVYWtTY3p4Q3FNN0hMZ2lPT1BwdE1tSmg4QVJhOXV3?oc=5","source":"GNews · AI Research","sources":["GNews · AI Research"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBUQU0tR0F4d3E4Z1oyODFwUTdSRlA4NWxsTS1KOE1RbENTeFUtYTZxcFhJYXhTSFpTZXY4Q3JhanpOUnVVYWtTY3p4Q3FNN0hMZ2lPT1BwdE1tSmg4QVJhOXV3?oc=5\" target=\"_blank\"\u003eJames Corden challenges the audience to a game of 'Mama, Obama Or Llama?'\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eFOX Sports\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-10T04:12:35"},{"id":9634,"title":"Physics-Informed Machine Learning Under Small-Data Constraints: Lessons from Abrasive Waterjet Milling","url":"https://arxiv.org/abs/2607.07863","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07863v1 Announce Type: new \nAbstract: In physically dominated machining processes, experimental datasets are small, expensive, and material-specific; in this regime, data curation, evaluation design, and the form of physics integration can matter as much as the learning algorithm. Using an abrasive waterjet milling dataset ($n{=}155$, Inconel\\,718), we make three methodological contributions. First, we separate physics-based data \\emph{cleaning} from statistical \\emph{curation} and treat the latter as competing modelling hypotheses rather than silent preprocessing. Second, we find t","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9633,"title":"NFTR: From Provable Mode-Averaging to Geodesic Subgoal Selection in Offline Goal-Conditioned RL","url":"https://arxiv.org/abs/2607.07855","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07855v1 Announce Type: new \nAbstract: Hierarchical Implicit Q-Learning (HIQL), an offline goal-conditioned RL method, selects subgoals by value-function advantages alone. This rule has two coupled failure modes. Optimistic bias treats lucky stochastic outcomes as skillful choices, and mode collapse reduces a multi-modal subgoal distribution to a single Gaussian mean that often falls in unreachable regions. We propose NFTR (Normalizing Flows subgoal policies with Triangle-slack Reweighting). A conditional Normalizing Flow replaces the Gaussian policy, and a closed-form mode-averaging","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9632,"title":"When Does Continual Learning Require Learning","url":"https://arxiv.org/abs/2607.07847","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07847v1 Announce Type: new \nAbstract: As large language models (LLMs) become increasingly capable, the next question is how can we enable models to continually learn? Today, the field largely frames this as a problem of context management and mitigating forgetting. We argue this framing is incomplete: continual learning is fundamentally about increasing model competence as the world changes. We disentangle this change along two axes -- space, where the model encounters new domains, and time, where the underlying data drifts under a fixed task. This framing lets us study continual le","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9631,"title":"Explaining Near-Zero Hessian Eigenvalues Through Approximate Symmetries in Neural Networks","url":"https://arxiv.org/abs/2607.07845","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07845v1 Announce Type: new \nAbstract: The Hessian of the training loss governs the local geometry of the loss landscape, yet despite existing explanations for its largest eigenvalues, the origin of the vast multitude of vanishingly small eigenvalues remains elusive. We argue that the bulk consists of the weakly lifted pseudo-Goldstone modes of the continuous symmetries of the network parametrization. In deep linear networks these symmetries are exact: they generate flat directions and hence exact zero modes, whose eigenvectors we construct explicitly. Introducing a ReLU nonlinearity","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9630,"title":"Predicting Pseudo-nitzschia harmful algal blooms along the Portuguese Coast using satellite-derived predictors","url":"https://arxiv.org/abs/2607.07834","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07834v1 Announce Type: new \nAbstract: Pseudo-nitzschia diatoms pose recurrent risks to coastal ecosystems and shellfish harvesting along the Portuguese Atlantic coast. Here we develop and evaluate a spatio-temporal machine-learning framework to predict harmful algal bloom (HAB) occurrence using exclusively satellite-derived predictors under realistic forecasting constraints. We characterised environmental and biological variability across shellfish production zones (L1-L9) using 5,882 observations, providing system-wide context. Predictive models were developed for zones L1-L2, a ho","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9629,"title":"A law of robustness for two-layer neural networks with arbitrary weights","url":"https://arxiv.org/abs/2607.07778","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07778v1 Announce Type: new \nAbstract: Bubeck, Li and Nagaraj conjectured that, for generic data, any two-layer neural network with $m$ neurons that fits $n$ noisy labels must have Lipschitz constant at least of order $\\sqrt{n/m}$, with no restriction on the size of the weights. Bubeck and Sellke proved a universal version of this law for Lipschitz-parameterized classes, but under a polynomial bound on the parameters; at depth three that boundedness hypothesis is genuinely necessary. The two-layer unbounded-weight case requires a different argument. We prove the conjectured law, up t","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9628,"title":"Graph-Regularized Deep Learning for EEG-Based Emotion Recognition with Psychologically-Grounded Label Structure","url":"https://arxiv.org/abs/2607.07773","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07773v1 Announce Type: new \nAbstract: EEG-based emotion recognition is critical for mental health monitoring and affective brain-computer interfaces, yet existing deep learning approaches often treat emotion classes as isolated labels, ignoring their psychological interdependencies. We propose a graph-regularized learning framework that conceptualizes emotions as nodes in a graph where edges encode proximity based on dimensional emotion theories. We adapt three complementary regularization strategies--Graph Label Smoothing (intuitive soft labeling), Commuting distance on graph via G","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9627,"title":"Principled Analysis of Deep Reinforcement Learning Evaluation and Design Paradigms","url":"https://arxiv.org/abs/2607.07769","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07769v1 Announce Type: new \nAbstract: Starting from the utilization of deep neural networks to approximate the state-action value function that led to winning one of the most challenging games, to algorithmic advancements that allowed solving problems without even explicitly stating the rules of the challenge at hand, reinforcement learning research has been the center of remarkable scientific progress for the past decade. In this paper, we focus on the key ingredients of this research progress and we analyze the canonical evaluation and design paradigms in reinforcement learning. W","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9626,"title":"Unlocking Temporal Generalization in Hamiltonian Video Dynamics Models","url":"https://arxiv.org/abs/2607.07763","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07763v1 Announce Type: new \nAbstract: World models are typically trained to predict discrete-time physical dynamics with a fixed step size baked into the model weights, preventing prediction at variable temporal resolutions. This matters for hierarchical planning, sim-to-real transfer, and scientific or game-engine applications that must query the same dynamics at multiple timescales. Hamiltonian Generative Networks (HGN) offer a principled path forward, grounding predictions in a continuous-time energy function that is, in principle, independent of the observation frame rate. In pr","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9625,"title":"Trustworthy Machine Learning through the Lens of Combinatorial Optimization: Survey and Research Perspectives","url":"https://arxiv.org/abs/2607.07762","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07762v1 Announce Type: new \nAbstract: Modern machine learning (ML) increasingly relies on complex models whose behavior is difficult to characterize beyond empirical performance metrics. Across a wide range of tasks, including prediction, generation, and decision-making, models with similar empirical performance can exhibit markedly different properties in terms of their transparency, interpretability, robustness, fairness, privacy, and certifiability. This survey highlights how optimization- and certification-oriented reasoning can provide a useful framework for reasoning about suc","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9624,"title":"Scalable and Trustworthy Earth Observation Foundation Models","url":"https://arxiv.org/abs/2607.07758","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07758v1 Announce Type: new \nAbstract: Foundation models (FMs) have transformed machine learning from isolated task-specific model development toward general-purpose models pretrained on broad data and adapted to multiple downstream tasks. Earth observation (EO) is an important domain for this paradigm because satellite and airborne archives are large, high-revisit, and increasingly multimodal, while reliable field labels are often sparse. Remote sensing foundation models (RSFMs) cannot be transferred reliably/optimally without domain-specific adaptation. This is because EO data are","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9623,"title":"The Importance of Encoder Choice:A Tabular-Image Study","url":"https://arxiv.org/abs/2607.07756","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07756v1 Announce Type: new \nAbstract: Multimodal learning usually requires a dedicated encoder per modality. When a tabular modality is involved, prior work has been mostly using a \\emph{plain MLP} as the encoder. Yet if it were a strong encoder, the tabular domain would not be ``the last unconquered castle for deep learning''. This study evaluates state-of-the-art tabular models as encoders in the image-tabular setting for the first time. An obstacle stands out. In-Context Learning models, among the best performing methods in the tabular domain, require labels to process instances,","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9622,"title":"Image classification via a quantum-inspired strategy involving a mixture of experts","url":"https://arxiv.org/abs/2607.07754","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07754v1 Announce Type: new \nAbstract: Pattern recognition problems arise in a variety of physical image processing situations, and convolutional neural networks are a popular scheme for the required feature extraction and classification tasks. The classical networks use diffusion-based smearing and block-wise pooling to downsample the image data and capture important structural features. In this work, we propose and demonstrate a more efficient quantum-inspired strategy involving a mixture of experts. It is a hybrid classical-quantum framework. The quantum part consists of amplitude","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9621,"title":"A Transdiagnostic Space of Disorder Like Phenotypes in Reinforcement Learning Agents","url":"https://arxiv.org/abs/2607.07753","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07753v1 Announce Type: new \nAbstract: Modelling psychological disorders in artificial agents offers both a testbed for computational psychiatry and a lens on the failure modes of affective control. Prior work induces one or two disorders in a reinforcement learning (RL) agent by hand-tuned reward shaping, labels the behaviour post hoc, and reports single runs. We recast disorder modelling as dose-controllable manipulation of cognitive appraisal signals in an appraisal-guided PPO agent, expressing seven disorders (anxiety, mania, obsessive-compulsive checking, depression, impulsivity","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9620,"title":"Selective Left-Shift: Turning Test-Time Compute and Difficulty-based Curation into Training Data for Low-Resource Code Generation","url":"https://arxiv.org/abs/2607.07748","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07748v1 Announce Type: new \nAbstract: Large Language Models achieve strong code generation for high resource languages like Python and Java but suffer sharp performance drops on Low-Resource Programming Languages~(LRPLs) such as Julia. Improving Small Language Models~(SLMs) for these languages faces a trilemma: Supervised Fine-Tuning~(SFT) is bottlenecked by data scarcity, inference-time scaling is too expensive for deployment, and Reinforcement Learning from scratch yields near zero advantages. We propose a three-phase pipeline that resolves this trilemma by decoupling syntax acqui","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9619,"title":"LiST: Lipschitz Scaling Training for Robust and Calibrated Neural Networks","url":"https://arxiv.org/abs/2607.07745","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07745v1 Announce Type: new \nAbstract: While accuracy, robustness, and calibration are all essential for reliable neural networks, they are often studied separately; developing models that satisfy all three simultaneously remains a central challenge. Lipschitz-constrained models guarantee robustness by design, yet the manual selection of the Lipschitz constraint L governs the resulting accuracy-robustness trade-off, and their calibration properties remain largely underexplored. In this work, we highlight a theoretical and empirical link between the enforced Lipschitz constraint and T","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9618,"title":"Architecture Generalization with MetaNCA","url":"https://arxiv.org/abs/2607.07743","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07743v1 Announce Type: new \nAbstract: Self-organization is an emergent property of life, driven by the collective behavior of individual components acting on local information. Biological neurons, through local interactions transmitted through synapses, are able to learn efficiently and can adapt their connections over an organism's lifespan. Motivated by these desirable properties of adaptability and local interaction, neural cellular automata (NCA) models have been successful at learning morphogenesis solely through local update rules, demonstrating stability over many updates and","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9617,"title":"Jet-Long: Efficient Long-Context Extension with Dynamic Bifocal RoPE","url":"https://arxiv.org/abs/2607.07740","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07740v1 Announce Type: new \nAbstract: Modern LLMs are increasingly deployed in long-context applications such as retrieval-augmented generation, repository-level coding, and agentic workflows whose accumulated reasoning and tool traces routinely push the input an order of magnitude past the pretraining window, making zero-shot context extension the dominant deployment path for open-weight checkpoints. Most existing zero-shot methods fix a single rescaling factor up front, so an aggressive factor sacrifices short-context fidelity while a conservative one breaks down at long contexts.","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9616,"title":"SHIFT: Survival Prediction from Incomplete and Heterogeneous Genomic Data","url":"https://arxiv.org/abs/2607.07725","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07725v1 Announce Type: new \nAbstract: Genomic prediction models often fail to transfer across institutions because sequencing panels differ across sites, creating structural feature missingness at deployment. Existing approaches to this challenge typically restrict analysis to genes shared across cohorts, exclude patients with incomplete profiles, or rely on test-time imputation, all of which can reduce robustness and limit the use of multi-center data. We propose Survival prediction Handling Incomplete Features using Transformer (SHIFT), a missingness-aware survival model that dire","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9615,"title":"Uncertainty-gated selection for block-sparse attention","url":"https://arxiv.org/abs/2607.07724","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07724v1 Announce Type: new \nAbstract: Block-sparse attention scales long-context language models by replacing the O(N^2) softmax with a per-query top-k selection over key blocks. This cutoff is myopic: when the k-th and (k+1)-th blocks are nearly tied in score, the selector commits without spending extra budget, and a dropped block carrying answer evidence is unrecoverable downstream. We propose a value-of-information router that measures, for each query, how decisively the top-k cut was made, and doubles the kept set for the queries where that gap is smallest; the rule is backbone-","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9614,"title":"Omni-Sleep: A Sleep Foundation Model via Hierarchical Contrastive Learning of CNS--ANS Dynamic","url":"https://arxiv.org/abs/2607.07720","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07720v1 Announce Type: new \nAbstract: Sleep physiology arises from the coordinated dynamics of the central nervous system (CNS) and autonomic nervous system (ANS), as reflected by multimodal polysomnography signals including EEG, EOG, EMG, ECG, and respiration. However, existing sleep foundation models often fuse heterogeneous biosignals in a topology-agnostic manner, overlooking their physiological organization. We introduce Omni-Sleep, a sleep foundation model that uses the CNS/ANS partition as a physiological prior for topology-constrained representation learning. Omni-Sleep lear","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9613,"title":"ReCoLoRA: Spectrum-Aware Recursive Consolidation for Continual LLM Fine-Tuning","url":"https://arxiv.org/abs/2607.07719","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07719v1 Announce Type: new \nAbstract: Parameter-efficient fine-tuning adapts a large language model to one task cheaply, but across a task sequence LoRA-style methods keep stacking low-rank updates on the same frozen weight, so each new task tends to overwrite the previous ones. We present ReCoLoRA (Recursive Consolidation of Low-Rank Adapters), a spectrum-aware framework for continual fine-tuning: adapters are initialized from a randomized SVD of the pretrained weight, per-layer effective ranks are selected by an elbow criterion, and the principal subspace is adapted before residua","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9612,"title":"LLT: Local Linear Transformer for PDE Operator Learning","url":"https://arxiv.org/abs/2607.07718","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07718v1 Announce Type: new \nAbstract: Neural operators have become a common approach for learning PDE solution maps and accelerating numerical simulations. Transformer-based neural operators are of particular interest, since attention can learn long-range dependencies in the computational domain. However, standard attention has two major limitations when applied to PDEs: it scales quadratically with the number of computational nodes, and it lacks an explicit bias toward local interactions. To address these issues, we introduce Local Linear Transformer (LLT) for PDE operator learning","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9611,"title":"Who Gets Missed in the Tail? Thresholded Subgroup Underdiagnosis in Long-Tailed Chest X-ray Classification","url":"https://arxiv.org/abs/2607.07717","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07717v1 Announce Type: new \nAbstract: In chest X-ray (CXR) classification, acceptable ranking performance can still leave rare-positive patients below threshold, especially within subgroups. We study this pre-deployment fairness problem as an audit question: after a long-tailed multi-label CXR model is converted from scores into decisions, who is missed? Across VinDr-CXR and MIMIC-CXR/CXR-LT, we use a diagnostic ladder to separate class-level long-tail losses, subgroup-aware weighting, group robustness, and threshold selection. On VinDr-CXR, group-tail weighting followed by tail-awa","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9610,"title":"Towards the Explainability of Temporal Graph Networks via Memory Backtracking and Topological Attribution","url":"https://arxiv.org/abs/2607.07716","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2607.07716v1 Announce Type: new \nAbstract: Temporal graphs are ubiquitous in real-world applications and Temporal Graph Networks (TGNs) have achieved superior predictive accuracy. Understanding which historical events drive model predictions can enhance trustworthiness of TGNs. Existing explanation methods overlook the memory module, the core component that records and updates node histories, leaving the influence of past events unexplored. To address this, we attribute TGNs predictions through the topology attribution tree and memory backtracking tree. The topology attribution tree capt","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9609,"title":"Hidden Decoding at Scale: Latent Computation Scaling for Large Language Models","url":"https://arxiv.org/abs/2607.08186","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.08186v1 Announce Type: new \nAbstract: Scaling Large Language Models (LLMs) has been driven mainly by enlarging the Transformer backbone, but for an already-strong model this requires another round of costly pretraining. We study whether an existing backbone can keep improving by allocating more computation to each token while leaving the Transformer backbone fixed. Depth-recurrent (looped) Transformers pursue this goal but are hard to scale, because looped computation does not fit naturally with the pipeline parallelism used to train the largest models. We add computation along the","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9608,"title":"SQuaD-SQL: Efficient Text-to-SQL with Small Language Models via LLM-Guided Knowledge Distillation","url":"https://arxiv.org/abs/2607.08161","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.08161v1 Announce Type: new \nAbstract: Text-to-SQL is a fundamental task in natural language processing that enables users to interact with structured databases using natural language. While large language models (LLMs) have demonstrated remarkable performance on this task, their substantial computational requirements hinder deployment in resource-constrained settings. In this paper, we introduce SQuaD-SQL (Small-Qualified and Distilled for SQL), a novel approach that empowers small language models (SLMs) to approach the performance of LLMs on the Text-to-SQL task while significantly","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9607,"title":"LEXIC: Lightweight Eye-tracking eXtension via Injected Complexity","url":"https://arxiv.org/abs/2607.08152","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.08152v1 Announce Type: new \nAbstract: On the recent EyeBench benchmark, predicting reading comprehension from eye movements exposes a stark gap: text-aware models using pretrained language models reach 56--63% AUROC, while gaze-only models operate at chance. We ask how far a gaze-only model can be pushed by lightweight, language-model-free conditioning. Building on the EyeBench AhnCNN baseline, LEXIC-Base, we propose two mechanisms to inject three precomputed word-level difficulty signals, GPT-2 surprisal, word frequency, and word length, into the per-fixation input: direct concaten","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9606,"title":"ICDAR 2026 HIPE-OCRepair Competition on LLM-Assisted OCR Post-Correction for Historical Documents","url":"https://arxiv.org/abs/2607.08143","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.08143v1 Announce Type: new \nAbstract: We present the results of HIPE-OCRepair-2026, an ICDAR competition on LLM-assisted OCR post-correction of historical documents. OCR post-correction remains a long-standing challenge in digital heritage: large-scale collections of digitized documents are affected by legacy OCR errors, while re-digitization at scale remains impractical. Large language models (LLMs) offers a major opportunity to revisit this challenge, yet their effectiveness across languages, document types, and noise conditions - and their tendency to hallucinate - remains insuff","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#7c3aed","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":9570,"title":"ContactMimic: Humanoid Object Interaction via Contact Control","url":"https://arxiv.org/abs/2607.08742","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08742v1 Announce Type: new \nAbstract: Keypoint tracking alone is insufficient for object interaction tasks such as sitting on a chair, wiping a board, or pushing furniture, where the robot can reach the correct pose without making meaningful physical contact with the object. We present CONTACTMIMIC, a learning framework that tracks explicit partlevel binary contact commands alongside keypoint trajectories. CONTACTMIMIC is made possible through the use of contact-following rewards and a trajectory augmentation scheme aimed at breaking the correlations between keypoint trajectories an","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9569,"title":"Learning Adaptive Solvers for Distributed Factor Graph Optimization on Matrix Lie Groups","url":"https://arxiv.org/abs/2607.08735","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08735v1 Announce Type: new \nAbstract: Modern robotic perception increasingly involves large-scale geometric optimization problems distributed across multiple robots or sessions. However, existing distributed solvers often depend on brittle hand tuning and primarily target rigid body pose graphs. To address this, we present DeepCORD, a learning-augmented framework for distributed factor graph optimization on general matrix Lie groups. By unfolding a parallel and accelerated Riemannian optimizer into differentiable iterations, DeepCORD learns a self-supervised feedback policy that dyn","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9568,"title":"Native Video-Action Pretraining for Generalizable Robot Control","url":"https://arxiv.org/abs/2607.08639","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08639v1 Announce Type: new \nAbstract: The advent of video-action models offers a promising path for robot control. Nevertheless, we argue that repurposing video generative models designed for digital content creation is inherently inadequate for physical environments. To bridge this gap, we present LingBot-VA 2.0, a video-action foundation model built from the ground up for embodiment. Four core design principles showcase its evolution from LingBot-VA. (1) Departing from traditional reconstruction-focused VAEs, we introduce a semantic visual-action tokenizer, which aligns visual rep","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9567,"title":"A New Human-Likeness and Comfort Index for Robot Movements Along Prescribed Paths","url":"https://arxiv.org/abs/2607.08620","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08620v1 Announce Type: new \nAbstract: As human-robot interaction rapidly spreads in numerous fields, the subject of robot acceptance gains increasing importance. Visual similarity to the human body, as occurs for humanoids, is generally not enough to ensure acceptance in physical interaction, as acceptance directly links to comfort and ergonomics, which are measured in terms of the quality of the robot movement perceived by the human. This paper discusses the connection between comfort and similarity of the robot movement to the human one. By considering the kinematic characterizati","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9566,"title":"FabriVLA: A Lightweight Vision-Language-Action Model for Precise Multi-Task Manipulation","url":"https://arxiv.org/abs/2607.08575","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08575v1 Announce Type: new \nAbstract: We present FabriVLA, a lightweight Vision-Language-Action model for Precise Multi-Task Manipulation. FabriVLA combines an InternVL3.5 vision-language backbone with a flow-matching action head featuring gated self-attention across action tokens and shallow VLM layer fusion for enriched spatial context. The model is trained via single stage joint optimization from a pretrained VLM and randomly initialized action head. On the Meta-World MT50 benchmark spanning 50 diverse manipulation tasks, FabriVLA achieves a tier-average success rate of 90.0%, de","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9565,"title":"Harness VLA: Steering Frozen VLAs into Reliable Manipulation Primitives via Memory-Guided Agents","url":"https://arxiv.org/abs/2607.08448","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08448v1 Announce Type: new \nAbstract: Language-conditioned manipulation requires both precise contact-rich control and robust reasoning over language, scenes, and long horizons. End-to-end Vision-Language-Action (VLA) models provide strong local visuomotor skills, but they are trained on in-distribution task trajectories and often fail under deployment perturbations such as semantic retargeting, goal re-binding, spatial-layout shifts, and unstable local contacts. LLM coding agents provide complementary semantic and compositional reasoning, but purely analytic primitives struggle wit","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9564,"title":"EgoWAM: World Action Models Beyond Pixels with In-the-Wild Egocentric Human Data","url":"https://arxiv.org/abs/2607.08436","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08436v1 Announce Type: new \nAbstract: Egocentric human data offers scalable supervision for robot manipulation. However, behavior cloning entangles transferable content like objects, scenes, and task semantics, with non-transferable factors like human morphology, head motion, and behavioral style. We study whether World Action Models (WAMs) provide a better training signal by requiring policies to predict not only actions, but also how the scene evolves. The central question is what world representation best enables human-to-robot transfer. We hypothesize that an effective world tar","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9563,"title":"SkillPlug: Unsupervised Skill Mining for Few-Shot Adaptation in Robotic Manipulation","url":"https://arxiv.org/abs/2607.08354","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08354v1 Announce Type: new \nAbstract: Learning transferable visuomotor imitation policies that generalize across diverse manipulation tasks and adapt rapidly to new tasks from only a handful of demonstrations remains challenging. Most modern policies are trained end-to-end to map observations directly to low-level actions, offering little explicit structure for reusing and recombining behaviors across tasks and making transfer data-inefficient under limited supervision. We propose SkillPlug, a plug-in framework that augments an existing visuomotor policy with a skill-conditioning mo","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9562,"title":"AnyDexRT: Calibration-Free Dexterous Hand Retargeting with Few-Shot Human Guidance","url":"https://arxiv.org/abs/2607.08341","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08341v1 Announce Type: new \nAbstract: Teleoperation is a key interface for controlling dexterous robotic hands and collecting demonstrations for imitation learning. Its effectiveness largely depends on kinematic retargeting, which maps operator hand motions to feasible and intuitive robot hand motions. Existing methods often require hand-crafted objectives, precise calibration, or global shape matching between human and robot hand spaces, making them sensitive to hand-specific tuning and less reliable across different dexterous hands. We propose AnyDexRT, a calibration-free retarget","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9561,"title":"TFP: Temporally Conditioned Memory-Fusion Policies for Visuomotor Learning","url":"https://arxiv.org/abs/2607.08283","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08283v1 Announce Type: new \nAbstract: Vision--Language--Action (VLA) policies such as $\\pi_{0.5}$ and OpenVLA perform well on many manipulation tasks, but they are often reactive: the next action is predicted from the current observation, instruction, and proprioceptive state. This assumption breaks down in stage-dependent manipulation, where visually similar states may require different actions depending on latent task progress and previous interaction outcomes. We argue that such tasks require not only memory, but dynamics-aware belief updates: the policy should preserve task prog","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9560,"title":"X-ACTA: eXtended Analytic Center Tension distribution Algorithm for fixed and mobile cable-driven-parallel-robot","url":"https://arxiv.org/abs/2607.08265","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08265v1 Announce Type: new \nAbstract: Steering Cable-Driven Parallel Robots (CDPRs) beyond their Wrench-Feasible Workspace (WFW) augments their capabilities in challenging scenarios such as during aggressive maneuvers or following a cable failure. In this context, although the determination of cable tensions is a well-studied topic, only a few approaches address these scenarios. Therefore, this paper introduces an extended version of the Analytic Center method as a criterion for selecting cable tensions outside the WFW while maintaining differentiability and including non-linear con","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9559,"title":"Factors Influencing Conversational Engagement in Robot-Delivered Individual Cognitive Stimulation Therapy (iCST) for Dementia in Home Settings","url":"https://arxiv.org/abs/2607.07998","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07998v1 Announce Type: new \nAbstract: Social robots offer a promising means of supporting cognitive therapies for dementia care by guiding structured conversation and therapeutic activities. However, little is known about the conversational dynamics that emerge during robot-delivered cognitive stimulation therapy (CST) sessions. This study analysed the interaction patterns from robot-delivered individual CST (iCST) sessions conducted with people living with dementia in home settings. Our Co-STAR (Cognitive Stimulation Therapy by an Autonomous Robot) system was deployed in the homes","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9558,"title":"D-CLIPSE: Distributed Consensus-based Localization with Passive Listening on Shared State Exchange","url":"https://arxiv.org/abs/2607.07995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07995v1 Announce Type: new \nAbstract: Multi-robot localization that is accurate and consistent is imperative for downstream tasks such as planning and control. Centralized filtering approaches optimally fuse all available sensor measurements of the team. However, a centralized solution is rarely implementable due to hardware, communication, and computational constraints. Distributed approaches deploy a filter on each robot to estimate their own state and neighbours' states using inter-robot communication. This paper proposes a consistent, communication-efficient, and consensus-based","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9557,"title":"In vivo feasibility study of humanoid robots in surgery","url":"https://arxiv.org/abs/2607.07972","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07972v1 Announce Type: new \nAbstract: Recent advances in actuation, control and learning have rapidly pushed humanoid robots from a distant vision towards near-term real-world deployment. Healthcare is a particularly pressing domain, in which staffing shortages and increasing care demand are widening the gap between clinical workload and available skilled labour. Although current automation has largely focused on digital and logistical tasks, much hospital work remains embodied, requiring mobility, manipulation and safe interaction in human-designed environments. Humanoid form facto","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9556,"title":"Soft Robotic Exogloves for Dexterous Mobility -- Towards Personalized Rehabilitation","url":"https://arxiv.org/abs/2607.07968","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07968v1 Announce Type: new \nAbstract: Soft robotic exogloves can provide hand rehabilitation and assistance. Fitting these gloves often relies on standardized measurements not tailored to the individual, limiting their effectiveness, especially for fine articulation necessary for dexterous manipulation. We present the design, fabrication, modeling, and testing of a personalized pneumatically-actuated soft robotic exoglove. The glove was fit to a user's hand with topological scans and fabricated with silicone mold casting. Finite element analysis (FEA) was performed to evaluate actua","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9555,"title":"Towards Soft Robotic Exogloves for Musculoskeletal Manipulation to Reduce Pain and Spasticity","url":"https://arxiv.org/abs/2607.07958","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07958v1 Announce Type: new \nAbstract: Hand spasticity and resulting pain affect 12 million people worldwide, including stroke survivors, arthritis patients, and those with other muscle and nerve deficiencies. Soft robotic exogloves are being introduced to help patients enhance mobility or manage pain; however, there are no current solutions that address both pain and mobility. We present preliminary development of a soft robotic exoglove that both aids in mobility and administers massage-like compression to relax spastic muscles. The glove consists of soft pneumatic actuators that a","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9554,"title":"Monocular Vision Based Control Framework for Grasping","url":"https://arxiv.org/abs/2607.07897","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07897v1 Announce Type: new \nAbstract: Grasping in unstructured environments requires handling objects with widely different mechanical properties, from soft and deformable items to rigid everyday objects. Most existing approaches address these categories separately and often rely on tactile sensing, object-specific models, or specialized grippers. In this paper, we present a unified monocular vision-based grasping framework that targets both soft and rigid objects within a single control pipeline, using only RGB input and a position-controlled gripper. The proposed system combines o","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9553,"title":"Time-to-Collision Based Dynamic Obstacle Avoidance Using Pretrained Vision Models for Robots in Unstructured Environments","url":"https://arxiv.org/abs/2607.07885","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07885v1 Announce Type: new \nAbstract: Dynamic obstacle avoidance in unstructured outdoor environments remains a critical challenge for autonomous mobile robots, particularly when large-scale robot-specific training data and simulation-based policies are impractical. We present a data-efficient, interpretable method for vision-based dynamic obstacle avoidance that operates entirely on real-world data, avoiding the sim-to-real transfer problem inherent in simulation-trained policies. Our approach leverages UniDepth, a large pretrained monocular depth estimation model, to produce dense","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9552,"title":"STEMbot: A Compliant Robot for Under-Canopy Plant Navigation","url":"https://arxiv.org/abs/2607.07873","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07873v1 Announce Type: new \nAbstract: The scalability of organic agriculture is partially limited by the labor costs associated with monitoring for pests. While drones and rovers are well-suited for agricultural monitoring from above or next to plants, many pests live on the underside of leaves or on plant stems, making them detectable only after they have caused significant damage. To enable early pest detection we present STEMbot, a miniature climbing robot system designed for autonomous navigation under plant canopies. Unlike existing climbing platforms that lack on-board percept","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9551,"title":"Physics-Guided Biomechanical Gait Adaptation for Humanoid Locomotion on Extreme Sloped Terrains","url":"https://arxiv.org/abs/2607.07830","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07830v1 Announce Type: new \nAbstract: Model-free reinforcement learning has enabled impressive humanoid locomotion; however, control on steep slopes remains largely unexplored. Unlike flat or discrete terrains, sloped terrains impose a persistent gravitational bias that demands simultaneous stability and posture control. Consequently, under generic reward formulations, policies can converge to slow, conservative low-center-of-mass (CoM) crouched gaits.\n  In this work, we propose a novel two-stage physics-guided framework, dubbed HumoSlope, dedicated to robust humanoid locomotion on","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9571,"title":"特斯拉下发Optimus零件采购指引！机器人产业链大幅走强 - 新浪财经","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5hVjVXeWRXRnBrblV6Snp0bEc4MTA4MFBZOGtlU2d5dzZfQWhpZnVDemdkdU5IVi1xVjJvT1l // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
