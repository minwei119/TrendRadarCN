026-09-18T09:40:00"},{"id":28077,"title":"我国拟出台规定规范向未成年人提供网络服务，明确不得设置诱导未成年人用户情感依赖、沉迷及过度消费等的算法模型","url":"https://www.ithome.com/1/004/262.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"45c3\"\u003eIT之家 9 月 18 日消息，为了加强未成年人网络保护，营造有利于未成年人身心健康的网络环境，保障未成年人合法权益，根据《中华人民共和国未成年人保护法》《中华人民共和国网络安全法》《中华人民共和国个人信息保护法》等法律，\u003cstrong\u003e国家互联网信息办公室组织起草了《国务院关于保障未成年人健康安全使用网络的规定（征求意见稿）》\u003c/strong\u003e，现向社会公开征求意见。\u003c/p\u003e\u003cul class=\"medium-size list-paddingleft-2\"\u003e\u003cli\u003e\u003cp data-vmark=\"70a6\"\u003e\u003cstrong\u003e规范向未成年人提供网络服务。\u003c/strong\u003e明确网络服务提供者不得向未成年人提供陌生人网络社交服务、虚拟亲属和虚拟伴侣等虚拟亲密关系服务等，并规定了相关例外情形。提出网络服务提供者向未满十六周岁的未成年人提供网络音视频服务、网络直播发布服务以外的其他网络直播服务、网络游戏服务和网络社交服务等，应当通过未成年人模式提供。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data-vmark=\"a955\"\u003e\u003cstrong\u003e规定未成年人用户识别和信息内容规范制度。\u003c/strong\u003e要求网络服务提供者具备未成年人用户识别能力，并采取必要措施保障未成年人个人信息安全；对经实名认证或者识别为未成年人用户的，网络服务提供者应当采取相应的措施。明确国","tags":[],"cluster_size":1,"ts":"2026-09-18T09:37:51"},{"id":28078,"title":"Anthropic职位最高华人，年仅20+ - Sohu","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPNHJIZlFwenpRb0hHXzdBZ3R4M1ZzdGpIVUU1Mnd5ZWpuMjlXWk1qek9hZFBxZkZ1Mjk3Z0p0c05LREVZNHBwMjlGUXBuTGdDSERGbUwyYzB4UUhDdVZxUXAySml2Z0k1RFNfWVB5OTF3NzUybV9pUTY5dS16eVFjbndpZW5JMUFwcXBiVQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxPNHJIZlFwenpRb0hHXzdBZ3R4M1ZzdGpIVUU1Mnd5ZWpuMjlXWk1qek9hZFBxZkZ1Mjk3Z0p0c05LREVZNHBwMjlGUXBuTGdDSERGbUwyYzB4UUhDdVZxUXAySml2Z0k1RFNfWVB5OTF3NzUybV9pUTY5dS16eVFjbndpZW5JMUFwcXBiVQ?oc=5\" target=\"_blank\"\u003eAnthropic职位最高华人，年仅20+\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eSohu\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-18T09:37:00"},{"id":28079,"title":"OpenAI在做啥：突发支持人民币结算 天才程序员狂喜 - 驱动之家","url":"https://news.google.com/rss/articles/CBMiWEFVX3lxTFBpZUMtdUJKa1ZobHlWbUE3NDdFVVFiZjg1dU1CNjU4bWViYUdmalJ3WkRPaWVNRC04ZWthYkt4ZH ww.ithome.com/1/004/209.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"fb2f\"\u003eIT之家 9 月 18 日消息，据路透社消息，三位知情人士透露，长鑫存储正计划进军需求激增的闪存（flash memory）市场。\u003c/p\u003e\u003cp data-vmark=\"cfba\"\u003e知情人士透露，长鑫存储计划在其位于北京的新工厂建设一条用于 NAND 闪存研发生产线。该公司还在北京设立了研发机构，相关研发项目包含了 NAND 技术的开发。\u003c/p\u003e\u003cp data-vmark=\"988d\"\u003e此外，长鑫存储已就其 NAND 业务规划与客户展开接洽，其中包含一家新成立的初创企业。该企业计划采购长鑫存储的 NAND 芯片，用于人工智能系统及超级计算机的存储产品研发与部署。\u003c/p\u003e\u003cp data-vmark=\"5e4d\"\u003eIT之家注意到，TrendForce 集邦咨询数据显示，按营收口径计算，三星电子以 29.3% 的市场份额在 2026 年第二季度位居全球闪存市场榜首，SK 海力士位列次席，美光紧随其后。\u003c/p\u003e\u003cp data-vmark=\"98bc\"\u003e长鑫存储 DRAM 内存营收则在 2026 年第 2 季度达到 146.24 亿美元\u003cspan class=\"exch-money-value \"\u003e（现汇率约合 983 亿元人民币）\u003c/span\u003e，\u003cstrong\u003e环比增幅达到 99.3%\u003c/strong\u003e，\u003cstrong\u003e市占则从 2026Q1 的 7","tags":[],"cluster_size":1,"ts":"2026-09-18T08:43:37"},{"id":28093,"title":"中国一汽徐宝军：从功能堆叠到主动协同，AI 定义汽车时代的整车多域智能体实践 - gasgoo.com","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE4wV0J0aHc5VHg1S04zc2hkaWstdDhkNTNwamhVMnlWdy16RXJkQTg1TGh3VjI0Z0hkaUF4SGtiWFgwSkI0NUxBQVdmLUNZNjgz?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE4wV0J0aHc5VHg1S04zc2hkaWstdDhkNTNwamhVMnlWdy16RXJkQTg1TGh3VjI0Z0hkaUF4SGtiWFgwSkI0NUxBQVdmLUNZNjgz?oc=5\" target=\"_blank\"\u003e中国一汽徐宝军：从功能堆叠到主动协同，AI 定义汽车时代的整车多域智能体实践\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003egasgoo.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-18T08:42:20"},{"id":28094,"title":"AI正自主制造下一代AI？Anthropic披露AI主导26%的研发，年初该占比不足1% - 手机新浪网","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTFAtMmpTcHZkZ1lLbHhCandWOFIydEd2YXRJaTEza3p3dzVEM3ljazhWWjkyUGJuSU9Wc25yRFdhYnl3REdCN0lVTlhucmZyZS1tek9pRWdaTmUwR1UwdnNqejJONkloOUhRVmh6amRaQUVSQk9kY0pOYVlRdko3TEE?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMif0FVX3lxTFAtMmpTcHZkZ1lLbHhCandWOFIydEd2YXRJaTEza3p3dzVEM3ljazhWWjkyUGJuSU9Wc25yRFdhYnl3REdCN0lVTlhucmZyZS1tek9pRWdaTmUwR1UwdnNqejJONkloOUhRVmh6amRaQUVSQk9kY0pOYVlRdko3TEE?oc=5\" target=\"_blank\"\u003eAI正自主制造下一代AI？Anthropic披露AI主导26%的研发，年初该占比不足1%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-18T08:34:02"},{"id":28095,"title":"亚马逊：AI 模型必须经过严格测试，确认足够安全才能发布","url":"https://www.ithome.com/1/004/200.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"e827\"\u003eIT之家 9 月 18 日消息，据彭博社今天（18 日）凌晨报道，亚马逊认为，AI 模型必须\u003cstrong\u003e经过严格测试，确认具备足够的安全保障\u003c/strong\u003e后才能发布。\u003c/p\u003e\u003cp data-vmark=\"0b99\"\u003e此前，多家顶尖 AI 实验室因安全问题呼吁放缓 AI 研发速度，亚马逊也由此加入了这场围绕 AI 发展节奏的讨论。\u003c/p\u003e\u003cp data-vmark=\"f39c\"\u003e亚马逊发言人汤姆 · 帕内尔在邮件中指出：“\u003cstrong\u003e我们不认为进步与安全只能二选一\u003c/strong\u003e。模型只有在准备充分、能够安全使用时才应该发布，而这离不开严格测试和强有力的安全保障。如果整个行业不能共同做到这一点，就会产生风险。我们相信，整个行业会与政府合作，制定适当的保护措施。”\u003c/p\u003e\u003cp data-vmark=\"988f\"\u003e帕内尔坦言，当下的 AI 已能为客户创造实实在在的价值，因此把“这件事”做好非常重要。\u003c/p\u003e\u003cp data-vmark=\"c22b\"\u003e亚马逊既是 OpenAI、Anthropic 等领先 AI 企业的合作伙伴，也是投资者。据IT之家了解，OpenAI 和 Anthropic 的高管此前都曾主张适度放慢尖端 AI 研发速度，以便评估技术安全性。\u003c/p\u003e\u003cp data-vmark=\"97b0\"\u003e亚马逊也在开发自己的大语言模型","tags":[],"cluster_size":1,"ts":"2026-09-18T08:29:30"},{"id":28096,"title":"离谱，OpenAI被Opus 5黑了！ - Sohu","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNVEpqWlJ4V0tEVjhFMThjU0diaTg0blJieEtTTUp0Nk1RNmJMa1puRWpuc2JGTXpteVNfT2ZQMndJTjluX3Qtajh2MlJ2UVFrYlJWR1ZsNEgxMm52WElHN3NESWtlcmZLRlJzMEU4dnBBMnZ4blNYMzkycHFEMmpUMlVfZVN4azFX?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNVEpqWlJ4V0tEVjhFMThjU0diaTg0blJieEtTTUp0Nk1RNmJMa1puRWpuc2JGTXpteVNfT2ZQMndJTjluX3Qtajh2MlJ2UVFrYlJWR1ZsNEgxMm52WElHN3NESWtlcmZLRlJzMEU4dnBBMnZ4blNYMzkycHFEMmpUMlVfZVN4azFX?oc=5\" target=\"_blank\"\u003e离谱，OpenAI被Opus 5黑了！\u003c/a\ flapping-wing flight","url":"https://arxiv.org/abs/2609.19480","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19480v1 Announce Type: new \nAbstract: The muscles that power insect flight fall into one of two categories: 1) synchronous muscles that contract under direct control from the nervous system, and 2) asynchronous muscles which have an intrinsic stretch activation response that spontaneously generates wingbeats without the need for signaling from the brain. It is thought that the emergent nature of asynchronous wingbeats provides both adaptive and responsive capabilities for flight control. To date, most flying robots use synchronous actuation. In this paper we develop the first flight","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27763,"title":"FASA: Feedback-Aware Sampling Adaptation for Efficient Diffusion-Based VLA Models","url":"https://arxiv.org/abs/2609.19475","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19475v1 Announce Type: new \nAbstract: Diffusion-based Vision-Language-Action (VLA) models achieve strong performance in embodied tasks, but their iterative sampling imposes heavy computational and memory-access cost, blocking real-time deployment on edge platforms. Existing acceleration methods either require expensive training (e.g., distillation, flow matching) or degrade perception via statically scheduled pruning and caching, ignoring the dynamic workload variance of robotic interactions. This paper presents FASA (Feedback-Aware Sampling Adaptation), a training-free runtime fram","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27762,"title":"Pose-aware Legged Robot Semantic Exploration with Omnidirectional Perception in Confined Unknown Environments","url":"https://arxiv.org/abs/2609.19460","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19460v1 Announce Type: new \nAbstract: Semantic exploration in confined environments requires both environment mapping and detailed observation of target objects. For ground robots, limited sensor vertical fields of view and restricted standoff distances can leave upper object surfaces unobserved from planar viewpoints. Body tilting can improve coverage, but additional observations and posture transitions increase mission time. To address this trade-off, we present POSE, a pose-aware semantic exploration system that exploits a legged robot's intrinsic body pitch and roll with omnidir","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27761,"title":"GLAMDRING: Gait Learning And Morphology co-Design via Reinforcement LearnING of CPGs","url":"https://arxiv.org/abs/2609.19452","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19452v1 Announce Type: new \nAbstract: Robots are moving out of the structured factory floor and into unstructured environments such as disaster sites, planetary surfaces, and agricultural fields, for which the right robot often does not yet exist. We present GLAMDRING, a framework that synthesizes the optimal robot for a locomotion task and, jointly, learns the controller that drives it. For the given specifications of forward-velocity bounds, a per-actuator power budget, an actuator library, and a payload requirement, GLAMDRING returns a matched quadruped morphology (link geometry","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27760,"title":"Winning a Won Game: Strict Reach-Avoid-Stay Control Barrier Functions for High-Dimensional Black-Box Systems","url":"https://arxiv.org/abs/2609.19449","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19449v1 Announce Type: new \nAbstract: Robots must complete their tasks and maintain the achieved outcomes while avoiding safety failures at all times. Strict reach-avoid-stay (sRAS) formalizes this requirement: safely reaching a target and remaining there indefinitely after first entry. We propose an sRAS Q-control barrier function (CBF) safety filter for high-dimensional black-box systems under bounded uncertainty. Our construction combines a stay value encoding safe permanent residence in a target subset with a reach-avoid value encoding safe reachability of this subset while avoi","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27759,"title":"From Wizard-of-Oz Human-Robot Dialogue Collection to a Taxonomy of Robot Response Decisions: A Retrospective Analysis of Assistive Pilot Interactions","url":"https://arxiv.org/abs/2609.19447","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19447v1 Announce Type: new \nAbstract: Robots that follow natural-language instructions in everyday indoor environments must act on incomplete human utterances. Instructions often omit essential information, such as the identity of an out-of-view object, an intended destination, or the user's goal. Existing datasets contain little real-world situated dialogue and provide few practice-grounded criteria for deciding when a robot should act, confirm, clarify, or refuse. We retrospectively analyze a pilot Wizard-of-Oz study in which five participants performed everyday indoor tasks, incl","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27758,"title":"From Rollout to Reset: A Graph-Based Harness for Autonomous Long-Horizon Manipulation Evaluation","url":"https://arxiv.org/abs/2609.19413","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19413v1 Announce Type: new \nAbstract: Robot manipulation policies are improving quickly, and real-robot evaluation remains the standard evidence for that progress. It still relies on a human to reset the scene between rollouts, which consumes operator time and leaves the initial state distribution unspecified, so results reproduce poorly. A recent system, AutoEval, automates both reset and scoring, but only for single-step tasks, because a long-horizon rollout can terminate in combinatorially many configurations that no single learned reset policy covers. We present HALTER, a Harnes","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27757,"title":"Enhancing the Perception of Safety and Comfort during Physical Human-Robot Handshake Interactions by Integrating Flexible Elements into a Robotic Arm","url":"https://arxiv.org/abs/2609.19375","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19375v1 Announce Type: new \nAbstract: Safety and comfort in human-robot physical in-teractions are essential aspects in the development of social technologies, where natural gestures, such as handshakes, represent a challenge due to their direct physical contact. The implementation of series elastic actuators (SEA) to absorb impacts is proposed as a design strategy that favors safer interactions. This paper presents an experimental study aimed at evaluating how the incorporation of SEAs in robotic arms influences perceived safety and the interaction experience dur-ing handshaking. T","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27756,"title":"Design and Experimental Validation of a 3D Printed Torsional Series Elastic Actuator for Safe Human Robot Interaction","url":"https://arxiv.org/abs/2609.19367","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19367v1 Announce Type: new \nAbstract: Ensuring intrinsic safety in physical human robot interaction (pHRI) is a critical requirement for social and service robots. While Series Elastic Actuators (SEAs) offer hardware based compliance, traditional metallic designs often require complex, multi part assemblies. This paper presents the design, finite element analysis (FEA), and experimental validation of a low stiffness, torsional spring for SEAs, manufactured via 3D printed thermoplastic polyurethane (TPU). The compliant element exhibits a highly linear torque deformation response (Ks","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27755,"title":"Kinematics-Grounded Agentic AI for Robotic Additive Manufacturing Process Planning","url":"https://arxiv.org/abs/2609.19347","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19347v1 Announce Type: new \nAbstract: Robotic additive manufacturing (AM) extends material-extrusion printing beyond gantry kinematics but makes process planning robot-dependent. A slicer-generated plan that appears favorable in part coordinates can become infeasible or robotically unfavorable on a manipulator because slicer-process decisions and part orientation determine the generated path, while part orientation and workspace placement affect its kinematic realization. Existing AM tools, large language model (LLM)-based decision-support methods, and digital-shadow systems do not","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27754,"title":"ViLoMan: Learning Visual-Proprioceptive Whole-Body Loco-Manipulation Skills for Humanoid Robots","url":"https://arxiv.org/abs/2609.19340","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19340v1 Announce Type: new \nAbstract: Humanoid loco-manipulation requires adaptive whole-body coordination to seamlessly integrate locomotion and physical interaction. Despite recent advances, learning autonomous loco-manipulation remains challenging due to the scarcity of diverse, physically executable robot-object interaction data and the difficulty of learning unified whole-body control directly from onboard observations. We present ViLoMan, a scalable framework for autonomous humanoid loco-manipulation. ViLoMan first transforms partial kinematic demonstrations of human-object in","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27753,"title":"SemSafe-3DGS: Semantic Risk-Aware Active Navigation in Uncertain 3D Gaussian Splatting Maps","url":"https://arxiv.org/abs/2609.19330","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19330v1 Announce Type: new \nAbstract: Autonomous robots operating in partially observed environments must navigate safely while acquiring observations that improve future planning. Existing safety formulations generally reason primarily about geometry. Consequently, geometrically similar scene elements may induce comparable control responses despite having different semantic consequences. We present a semantic risk aware safe-active perception framework for navigation in attributed 3D Gaussian maps. Semantic attributes modulate an Average Value-at-Risk collision clearance model thro","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27752,"title":"A Morphing Aerial Robot With Thruster-Integrated Flexible Continuum Links for Shape Adaptive Aerial Manipulation","url":"https://arxiv.org/abs/2609.19328","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19328v1 Announce Type: new \nAbstract: In recent years, aerial manipulation has attracted increasing attention as a key to expand the application of aerial robots. In this work, we focus on two major research directions for achieving versatile aerial manipulation: (i) acquiring high environmental adaptability using soft manipulators, and (ii) expanding the feasible wrench space by distributing thrusters along the manipulator. However, no aerial robot has simultaneously satisfied these two requirements. Therefore, in this paper, we propose a morphing rotor-distributed aerial robot wit","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27751,"title":"GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM Task Planning","url":"https://arxiv.org/abs/2609.19315","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19315v1 Announce Type: new \nAbstract: Large language models (LLMs) provide a flexible interface for long-horizon robot planning, but generated plans often fail to respect embodiment constraints, recover from planning errors, or reason effectively under partial observability. We present GAVEL, a framework for verifying and repairing long-horizon LLM planning built around an explicit graph world model. The graph represents relevant object-relations, action pre-conditions and effects, and probabilistic beliefs over unobserved object locations. This model can predict the consequences of","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27750,"title":"OHRID-Retail: An Open Multimodal Dataset of Human Activity in Retail Environments","url":"https://arxiv.org/abs/2609.19302","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19302v1 Announce Type: new \nAbstract: Open datasets describing human behavior in environments shared with mobile robots remain limited, particularly for retail activities that combine locomotion, reaching, object handling, and robot guided movement. This paper introduces OHRID Retail, an open, human centered multimodal dataset collected from 16 healthy adults performing a simulated shelf picking task under three within participant conditions: no robot, low speed robot guidance, and high speed robot guidance. Each participant completed two trials per condition. Whole body kinematics","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27749,"title":"Learning Safe Humanoid Navigation from Reduced Order Models","url":"https://arxiv.org/abs/2609.19272","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19272v1 Announce Type: new \nAbstract: Research in humanoid robotics has achieved rapid progress in locomotion, and recent results have pushed the boundary on autonomous navigation. We demonstrate that a standard single-stage RL navigation pipeline struggles to scale to multi-level and multi-story terrain, limited by the difficulty of complex humanoid terrain interactions such as stairs. To overcome this challenge, we decompose the navigation problem into two pieces. First, we train a policy operating on the reduced order dynamics but with full 3D LiDAR observations to navigate compl","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27748,"title":"Grasping by interconnection: robust closing motions from coarse object templates","url":"https://arxiv.org/abs/2609.19228","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19228v1 Announce Type: new \nAbstract: Dexterous robot hands must often grasp objects whose shape, size, and pose are known only approximately. Grasp planners typically require accurate object models or correct errors with feedback, but how much inaccuracy a closing motion can tolerate on its own remains unclear. To address this question, we designed a motion planner based on four principles: a coarse template of the object, human grasp types, an object-centric interaction, and compliant, sliding contacts instead of prescribed contact points. This paper presents the planner, implemen","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27747,"title":"REACT: A Fully Spiking State-Space Model for Real-Time Event-Driven Temporal Perception","url":"https://arxiv.org/abs/2609.19204","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19204v1 Announce Type: new \nAbstract: Robotic systems operating in dynamic environments require visual perception that evolves continuously with the incoming sensory stream. Event cameras provide microsecond temporal resolution and asynchronous sensing, but most learning-based methods accumulate events into frames or temporal bins, introducing an integration delay that can limit fast reaction. Here we propose REACT, a fully spiking state-space model for event-driven temporal perception that processes raw events one by one, without temporal accumulation. REACT uses a complex-valued s","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27746,"title":"ULOHA: An Underwater Bimanual Robot System for Robot Learning","url":"https://arxiv.org/abs/2609.19200","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19200v1 Announce Type: new \nAbstract: Underwater visuomotor policy learning has focused primarily on single manipulators, while bimanual imitation learning has been studied largely in air. We present ULOHA, an underwater bimanual robot learning platform that combines custom-designed leader--follower hardware with software extensions to LeRobot, integrating teleoperation, multi-view sensing, demonstration collection, policy training, and autonomous deployment. Real-robot experiments demonstrate a range of coordinated underwater bimanual behaviors, including inter-arm transfer, shared","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27745,"title":"DITTO: Dexterous Interface for Transparent TeleOperation","url":"https://arxiv.org/abs/2609.19196","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19196v1 Announce Type: new \nAbstract: Collecting data for manipulation with high-DOF hands is challenging, as interfaces must capture rich hand motion while rendering the contact interactions essential for precise manipulation. Existing data collection approaches face a trade-off: teleoperation ensures deployment consistency but lacks force feedback, while handheld (in-the-wild) systems provide natural force transparency but introduce a visual embodiment gap at deployment. We present DITTO, a Dexterous Interface for Transparent TeleOperation, which resolves this through the anatomic","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27744,"title":"AthenaZero: A low-inertia, bimanual robot for dynamic manipulation","url":"https://arxiv.org/abs/2609.19194","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19194v1 Announce Type: new \nAbstract: AthenaZero is a bimanual manipulator designed to minimize inertia without compromising control authority. By utilizing quasi-direct drive actuation and transmission remotization techniques, the system achieves an effective endpoint mass comparable to that of a human---about an order of magnitude less than conventional robot manipulators. This characteristic, combined with its inherent torque transparency, makes AthenaZero exceptionally well-suited for dynamic manipulation. We describe the methodology} that led to this design and demonstrate the","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27765,"title":"特斯拉Optimus来华审厂人形机器人产业化提速多只超跌标的获融资客关注(名单)_股市聚焦_市场 - 中金在线","url":"https://news.google.com/rss/articles/CBMibkFVX3lxTE5UWjZmSkVCc0ZnSTYzZkZXNHpHVzdKUUk2cE1wSDAwbEV1MzV3ZFVETlZwUlBKYmtVa3IzWjVzdHZMMENiV2pybXUtaVF4dHN1VnIzbUp1anF5c3cxb2xwX2xyLU1wMWJsMVEtN3p3?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMibkFVX3lxTE5UWjZmSkVCc0ZnSTYzZkZXNHpHVzdKUUk2cE1wSDAwbEV1MzV3ZFVETlZwUlBKYmtVa3IzWjVzdHZMMENiV2pybXUtaVF4dHN1VnIzbUp1anF5c3cxb2xwX2xyLU1wMWJsMVEtN3p3?oc=5\" target=\"_blank\"\u003e特斯拉Optimus来华审厂人形机器人产业化提速多只超跌标的获融资客关注(名单)_股市聚焦_市场\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e中金在线\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-18T01:20:08"},{"id":27766,"title":"热点追击丨特斯拉机器人量产加速 启动新一轮中国供应链审厂 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTE1NNEM1Z09pZFBFU0ZtQ2dWYVp5RXFYclM5UE9VWHRkencydjlrOEluUFVkVWxOZEEtUzdubl9vY0VzdG8ycXl6VlItS1hYUWs1TXR6MmhSTWtGYnE2RXBpSF9FYjZoTTczZm1KRWw2TnUxVmRJdUg1Xw?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTE1NNEM1Z09pZFBFU0ZtQ2dWYVp5RXFYclM5UE9VWHRkencydjlrOEluUFVkVWxOZEEtUzdubl9vY0VzdG8ycXl6VlItS1hYUWs1TXR6MmhSTWtGYnE2RXBpSF9FYjZoTTczZm1KRWw2TnUxVmRJdUg1Xw?oc=5\" target=\"_blank\"\u003e热点追击丨特斯拉机器人量产加速 启动新一轮中国供应链审厂\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-18T00:54:00"},{"id":27767,"title":"Figure’s Helix 2.5 Goes to Work in 30 Homes It Has Never Entere // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
