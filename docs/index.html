003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-13T01:16:02"},{"id":9981,"title":"高盛：香港软件科技股表现可能将趋于改善 下半年仍维持超配A股","url":"https://wallstreetcn.com/livenews/3132502","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"高盛称，该行模型显示H股软件股的表现可能在未来几个月趋于改善，并有望在基本面、估值及流动性等多个维度上缩小与A股硬科技板块之间的差距。总体而言不认同中国AI股票整体存在泡沫的观点，但也观察到AI投资领域内部出现局部过热迹象，主要集中在半导体板块，以及部分A股“硬科技”代表性标的。对于下半年，维持超配A股，主要因其在周期维度上更具优势的盈利动能，以及对国际投资者而言尚未被充分重视的分散化配置价值；也建议开始逐步增持部分港股大型互联网公司股票。","tags":[],"cluster_size":1,"ts":"2026-07-13T01:00:17"},{"id":9982,"title":"中际旭创：二季度业绩严重不及预期的传言没有任何依据，公司不存在故意压制股价、收入延迟等情况","url":"https://wallstreetcn.com/livenews/3132484","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中际旭创7月12日披露投资者关系活动记录表称，近期市场针对公司及行业的小作文较多，主要澄清如下：\n1、关于二季度业绩严重不及预期的传言：该传言没有任何依据，给投资者带来恐慌。公司目前还没有发布业绩预告和半年报，但公司对2026年半年度经营情况和行业需求都非常有信心。\n2、关于公司故意压制股价的传言：公司不存在故意压制股价、收入延迟等情况，也不会刻意调整业绩。公司一贯注重资本市场形象和保护投资者利益，此类传言是对公司极大误解。","tags":[],"cluster_size":1,"ts":"2026-07-13T00:00:57"},{"id":9983,"title":"AI算力需求爆发，光纤量价齐升，多家企业启动扩产计划","url":"https://wallstreetcn.com/livenews/3132477","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"AI算力需求的爆发式增长，将光纤行业推入了价格上行通道。近日，杭电股份、永鼎股份等上市公司上半年业绩预告纷纷录得大幅增长，行业高景气度持续得到验证。光纤价格的大幅上涨以及行业供需缺口的存在，正推动多家企业启动光棒及光纤扩产计划。7月10日晚，烽火通信和领益智造均发布公告。前者拟定增募资不超过29.13亿元用于光纤智能制造等项目，后者拟参与重整富通嘉善，切入光纤通信赛道。不过，光纤行业扩产潮也引发市场对“周期魔咒”重演的忧虑。多位业内受访人士表示，新增产能落地仍需翻越多重门槛。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-07-12T23:52:21"},{"id":9984,"title":"本周中国央行公开市场共620亿元7天期逆回购到期","url":"https://wallstreetcn.com/livenews/3132476","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"其中，周一至周五逆回购分别到期70亿元、100亿元、150亿元、100亿元、200亿元。此外，周三将有9000亿元181天期买断式逆回购到期，周五将有1200亿元国库现金定存到期。","tags":[],"cluster_size":1,"ts":"2026-07-12T23:51:53"},{"id":9985,"title":"产能满产+订单充足 多家铝企上半年业绩倍增","url":"https://wallstreetcn.com/livenews/3132471","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"今年上半年，在电解铝价格高位运行、成本端氧化铝价格走低的背景下，铝产业链景气度持续攀升。多家上市铝企披露的半年度业绩预告显示，行业盈利普遍大幅提升，其中天山铝业、神火股份、中孚实业、焦作万方等公司上半年业绩同比实现倍增。与此同时，上市铝企正积极向高附加值的铝箔赛道延伸，相关新能源铝箔产能布局提速推进，产业链呈现“上游高景气，中游忙扩产”的态势。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-12T23:43:03"},{"id":9986,"title":"15个交易日逾千亿元，A股半导体主题ETF“吸金”","url":"https://wallstreetcn.com/livenews/3132466","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"半导体板块近期成为资金进击的重点。从半导体主题ETF最新情况看，过去15个交易日合计净流入资金超过千亿元，成交额和基金份额均创历史新高。从半导体相关个股的走势看，在前期大涨之后，近期震荡明显加剧，后续行情能否持续走强，备受市场关注。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-12T23:11:43"},{"id":9987,"title":"券商另类子三年投资科创逾200亿元，中证协发文建言拓宽发展空间","url":"https://wallstreetcn.com/livenews/3132457","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在“科创券商”叙事的发酵下，证券公司另类投资子公司的行业价值愈发受到市场关注。近期，中证协最新一期内部刊物《传导》发布了《证券公司另类投资子公司高质量发展研究》一文。文章指出，另类子已成长为具备“百亿级”造血能力的重要子公司，近三年50余家另类子直接投资于非上市非挂牌的科技型企业金额合计达200多亿元。针对行业现存发展堵点，文章提出“科创债”置换、试点放宽“先投后保”限制等多项举措。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-12T22:33:28"},{"id":9988,"title":"巨力索具澄清：公司并非“网系回收”及“航天级特种索具”唯一供应商","url":"https://wallstreetcn.com/livenews/3132453","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"巨力索具公告，近期，公司关注到互联网平台、财经自媒体及股吧社区出现关于公司为“国内唯一：网系回收索具的‘独家玩家’”、“中国的网系回收索具，只有巨力索具一家能供”、“根据航天科技集团的认定，巨力索具被认定为‘航天级特种索具唯一供应商’，国内市占率达到100%”、“与航天科技集团签订5年战略合作协议，锁定长十系列、朱雀三号等火箭回收系统订单，金额超20亿元”、“2026年商业航天业务收入预计达3—5亿元”等不实传闻。","tags":[],"cluster_size":1,"ts":"2026-07-12T22:24:13"},{"id":9989,"title":"布伦特原油期货周一亚市早盘高开3%，美股期货小幅走低，纳斯达克100指数期货跌0.2%。此前美伊冲突升级。","url":"https://wallstreetcn.com/livenews/3132438","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"布伦特原油期货周一亚市早盘高开3%，美股期货小幅走低，纳斯达克100指数期货跌0.2%。此前美伊冲突升级。","tags":[],"cluster_size":1,"ts":"2026-07-12T22:02:01"},{"id":9990,"title":"饿了么后，阿里巴巴再将刀砍向菜鸟驿站 - 网易新闻客户端","url":"https://news.google.com/rss/articles/CBMiggFBVV95cUxPR01vb3R2MUpWbGd6ZE4wVXprdVpWbFZoRC1kVzNkVjF2ZHUxbjJ6bzFzaFU1YVNwR3JRcVp2Q21tTkRJeVc3T2pzU0haQkxWbHFpZWJoNi1jWGQtdEhkVldxZjg3OW9rYWlZNzBlb3RkRTlVZkNlOEgySHRaUFo1SXZn?oc=5","source":"GNews · 阿里巴巴","sources": tags":[],"cluster_size":1,"ts":"2026-07-10T06:03:00"},{"id":9886,"title":"Optimus发布量产指引\u0026中国供应链出海扩张！机器人执行器等核心零部件领涨 - 新浪财经","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTFBCaUNvQTVvQXMwTG9zZXVuc2hMT2tya1BtSnZrWVVUZ2V3S2tkNTF4bTV5Sno1S1BJOUg3eGUyUXVxZ3hSdkNWU0pWdExGTW12aXU3eFc1ZHJ2UXpkejBobGpYejJJbmJNWEV0cUR6QQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMib0FVX3lxTFBCaUNvQTVvQXMwTG9zZXVuc2hMT2tya1BtSnZrWVVUZ2V3S2tkNTF4bTV5Sno1S1BJOUg3eGUyUXVxZ3hSdkNWU0pWdExGTW12aXU3eFc1ZHJ2UXpkejBobGpYejJJbmJNWEV0cUR6QQ?oc=5\" target=\"_blank\"\u003eOptimus发布量产指引\u0026中国供应链出海扩张！机器人执行器等核心零部件领涨\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-10T05:18:31"},{"id":9570,"title":"ContactMimic: Humanoid Object Interaction via Contact Control","url":"https://arxiv.org/abs/2607.08742","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08742v1 Announce Type: new \nAbstract: Keypoint tracking alone is insufficient for object interaction tasks such as sitting on a chair, wiping a board, or pushing furniture, where the robot can reach the correct pose without making meaningful physical contact with the object. We present CONTACTMIMIC, a learning framework that tracks explicit partlevel binary contact commands alongside keypoint trajectories. CONTACTMIMIC is made possible through the use of contact-following rewards and a trajectory augmentation scheme aimed at breaking the correlations between keypoint trajectories an","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9569,"title":"Learning Adaptive Solvers for Distributed Factor Graph Optimization on Matrix Lie Groups","url":"https://arxiv.org/abs/2607.08735","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08735v1 Announce Type: new \nAbstract: Modern robotic perception increasingly involves large-scale geometric optimization problems distributed across multiple robots or sessions. However, existing distributed solvers often depend on brittle hand tuning and primarily target rigid body pose graphs. To address this, we present DeepCORD, a learning-augmented framework for distributed factor graph optimization on general matrix Lie groups. By unfolding a parallel and accelerated Riemannian optimizer into differentiable iterations, DeepCORD learns a self-supervised feedback policy that dyn","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9568,"title":"Native Video-Action Pretraining for Generalizable Robot Control","url":"https://arxiv.org/abs/2607.08639","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08639v1 Announce Type: new \nAbstract: The advent of video-action models offers a promising path for robot control. Nevertheless, we argue that repurposing video generative models designed for digital content creation is inherently inadequate for physical environments. To bridge this gap, we present LingBot-VA 2.0, a video-action foundation model built from the ground up for embodiment. Four core design principles showcase its evolution from LingBot-VA. (1) Departing from traditional reconstruction-focused VAEs, we introduce a semantic visual-action tokenizer, which aligns visual rep","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9567,"title":"A New Human-Likeness and Comfort Index for Robot Movements Along Prescribed Paths","url":"https://arxiv.org/abs/2607.08620","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08620v1 Announce Type: new \nAbstract: As human-robot interaction rapidly spreads in numerous fields, the subject of robot acceptance gains increasing importance. Visual similarity to the human body, as occurs for humanoids, is generally not enough to ensure acceptance in physical interaction, as acceptance directly links to comfort and ergonomics, which are measured in terms of the quality of the robot movement perceived by the human. This paper discusses the connection between comfort and similarity of the robot movement to the human one. By considering the kinematic characterizati","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9566,"title":"FabriVLA: A Lightweight Vision-Language-Action Model for Precise Multi-Task Manipulation","url":"https://arxiv.org/abs/2607.08575","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08575v1 Announce Type: new \nAbstract: We present FabriVLA, a lightweight Vision-Language-Action model for Precise Multi-Task Manipulation. FabriVLA combines an InternVL3.5 vision-language backbone with a flow-matching action head featuring gated self-attention across action tokens and shallow VLM layer fusion for enriched spatial context. The model is trained via single stage joint optimization from a pretrained VLM and randomly initialized action head. On the Meta-World MT50 benchmark spanning 50 diverse manipulation tasks, FabriVLA achieves a tier-average success rate of 90.0%, de","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9565,"title":"Harness VLA: Steering Frozen VLAs into Reliable Manipulation Primitives via Memory-Guided Agents","url":"https://arxiv.org/abs/2607.08448","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08448v1 Announce Type: new \nAbstract: Language-conditioned manipulation requires both precise contact-rich control and robust reasoning over language, scenes, and long horizons. End-to-end Vision-Language-Action (VLA) models provide strong local visuomotor skills, but they are trained on in-distribution task trajectories and often fail under deployment perturbations such as semantic retargeting, goal re-binding, spatial-layout shifts, and unstable local contacts. LLM coding agents provide complementary semantic and compositional reasoning, but purely analytic primitives struggle wit","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9564,"title":"EgoWAM: World Action Models Beyond Pixels with In-the-Wild Egocentric Human Data","url":"https://arxiv.org/abs/2607.08436","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08436v1 Announce Type: new \nAbstract: Egocentric human data offers scalable supervision for robot manipulation. However, behavior cloning entangles transferable content like objects, scenes, and task semantics, with non-transferable factors like human morphology, head motion, and behavioral style. We study whether World Action Models (WAMs) provide a better training signal by requiring policies to predict not only actions, but also how the scene evolves. The central question is what world representation best enables human-to-robot transfer. We hypothesize that an effective world tar","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9563,"title":"SkillPlug: Unsupervised Skill Mining for Few-Shot Adaptation in Robotic Manipulation","url":"https://arxiv.org/abs/2607.08354","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08354v1 Announce Type: new \nAbstract: Learning transferable visuomotor imitation policies that generalize across diverse manipulation tasks and adapt rapidly to new tasks from only a handful of demonstrations remains challenging. Most modern policies are trained end-to-end to map observations directly to low-level actions, offering little explicit structure for reusing and recombining behaviors across tasks and making transfer data-inefficient under limited supervision. We propose SkillPlug, a plug-in framework that augments an existing visuomotor policy with a skill-conditioning mo","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9562,"title":"AnyDexRT: Calibration-Free Dexterous Hand Retargeting with Few-Shot Human Guidance","url":"https://arxiv.org/abs/2607.08341","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08341v1 Announce Type: new \nAbstract: Teleoperation is a key interface for controlling dexterous robotic hands and collecting demonstrations for imitation learning. Its effectiveness largely depends on kinematic retargeting, which maps operator hand motions to feasible and intuitive robot hand motions. Existing methods often require hand-crafted objectives, precise calibration, or global shape matching between human and robot hand spaces, making them sensitive to hand-specific tuning and less reliable across different dexterous hands. We propose AnyDexRT, a calibration-free retarget","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9561,"title":"TFP: Temporally Conditioned Memory-Fusion Policies for Visuomotor Learning","url":"https://arxiv.org/abs/2607.08283","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08283v1 Announce Type: new \nAbstract: Vision--Language--Action (VLA) policies such as $\\pi_{0.5}$ and OpenVLA perform well on many manipulation tasks, but they are often reactive: the next action is predicted from the current observation, instruction, and proprioceptive state. This assumption breaks down in stage-dependent manipulation, where visually similar states may require different actions depending on latent task progress and previous interaction outcomes. We argue that such tasks require not only memory, but dynamics-aware belief updates: the policy should preserve task prog","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9560,"title":"X-ACTA: eXtended Analytic Center Tension distribution Algorithm for fixed and mobile cable-driven-parallel-robot","url":"https://arxiv.org/abs/2607.08265","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08265v1 Announce Type: new \nAbstract: Steering Cable-Driven Parallel Robots (CDPRs) beyond their Wrench-Feasible Workspace (WFW) augments their capabilities in challenging scenarios such as during aggressive maneuvers or following a cable failure. In this context, although the determination of cable tensions is a well-studied topic, only a few approaches address these scenarios. Therefore, this paper introduces an extended version of the Analytic Center method as a criterion for selecting cable tensions outside the WFW while maintaining differentiability and including non-linear con","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"},{"id":9559,"title":"Factors Influencing Conversational Engagement in Robot-Delivered Individual Cognitive Stimulation Therapy (iCST) for Dementia in Home Settings","url":"https://arxiv.org/abs/2607.07998","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.07998v1 Announce Type: new \nAbstract: Social robots offer a promising means of supporting cognitive therapies for dementia care by guiding structured conversation and therapeutic activities. However, little is known about the conversational dynamics that emerge during robot-delivered cognitive stimulation therapy (CST) sessions. This study analysed the interaction patterns from robot-delivered individual CST (iCST) sessions conducted with people living with dementia in home settings. Our Co-STAR (Cognitive Stimulation Therapy by an Autonomous Robot) system was deployed in the homes","tags":[],"cluster_size":1,"ts":"2026-07-10T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
