:"8月12日，4只REITs产品在同一天进行场内分红除息，分红比例均超过99%。据统计，按照除息日（场内）口径，今年已有超过70只REITs开启分红，其中七成以上的单次分红规模占可分配利润比重超过99%。从二级市场表现来看，截至8月12日收盘，全市场88只已上市REITs中，约八成今年以来收跌，部分REITs跌幅甚至超过40%。即便是今年有过分红的产品，收跌的产品数量比例也超过80%。","tags":[],"cluster_size":1,"ts":"2026-08-12T22:52:38"},{"id":19461,"title":"市场变化考验公募定增策略，“折价拿货”并非稳赚不赔","url":"https://wallstreetcn.com/livenews/3148782","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"定增策略历来是公募基金增厚收益的有效方式之一，公募机构以“折扣价”买入，往往能帮助基金组合赚取确定性相对较高的收益。然而，近期A股行情极致切换，定增策略的有效性遭遇挑战。江波龙、路维光电、思泉新材等一批科技公司恰逢6月启动定增，多家公募机构参与获配，随后7月科技板块行情大幅回调，定增发行价高于二级市场现价，即倒挂的情况接连出现，甚至部分个股定增价格倒挂幅度超过28%，公募机构出现浮亏。业内机构认为，应从赛道逻辑转向基本面逻辑，重视仓位分散和交易规则。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-12T22:43:35"},{"id":19462,"title":"分红、回购、增持常态化推进，A股公司以实际行动稳市场强信心","url":"https://wallstreetcn.com/livenews/3148781","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"时值A股上市公司半年报披露窗口期，上市公司公告中期利润分配方案的案例渐次增多；同时，从回购、增持动作密集的情况看，上市公司回馈投资者意识显著增强。分析人士认为，中期分红落地数量扩容、注销式回购规模扩大、大手笔增持传递发展信心，叠加相关配套政策工具落地，上市公司正以实际行动提振市场信心。随着分红回购增持制度化、常态化深入推进，资本市场内生稳定机制有望进一步筑牢，助力A股长期健康发展。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-12T22:41:56"},{"id":19463,"title":"从“不敢保”到“主动保”，保险补齐脑机接口产业化关键一环","url":"https://wallstreetcn.com/livenews/3148780","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"脑机接口产业链保障再落一子。据人保财险官微8月12日消息，该公司近日为浙江大学医学院附属第二医院承保全国首单侵入式脑机接口手术意外险。当前，人保财险、国寿财险、太保产险等头部险企均入局脑机接口产业，脑机接口产业链保障覆盖正从单点突破走向多环节延展。受访人士分析称，政策层面密集部署科技保险创新，保险正从“不敢保”走向“主动保”，补齐脑机接口产业化风险保障这一关键环节。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-12T22:34:58"},{"id":19464,"title":"发力资管业务，券商、外资机构锚定公募股权","url":"https://wallstreetcn.com/livenews/3148779","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在资产管理行业蓬勃发展的背景下，公募基金公司股权吸引多方竞逐。从近期公募基金公司股权变更情况看：券商持续加码相关业务，旨在完善大资管业务版图；外资机构加大布局力度，彰显对中国资产管理行业长期价值的认可。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-12T22:34:02"},{"id":19465,"title":"中国移动江苏公司：“AI+工作台”为墟沟街道治理提质增效 - finance.sina.cn","url":"https://news.google.com/rss/articles/CBMimAFBVV95cUxPNTR6d1FhOXcyd042M1hOd25WU  · cs.RO"],"summary":"arXiv:2608.10860v1 Announce Type: new \nAbstract: World-action models (WAMs) predict the future to act better, but nearly all of them predict only RGB latents, trained purely for pixel reconstruction, with no explicit signal for the 3D geometry or object semantics manipulation needs. We find a surprising free lunch: the same frozen video-generation VAE that encodes RGB also encodes 3D pointmaps almost losslessly, with no pointmap-specific training at all. This lets us supervise Flex-$\\pi$, a 6B-parameter WAM, on 3D geometry and object-centric DINO semantics alongside RGB, at no cost in new sens","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19348,"title":"Enabling Scalable Kinesthetic Teaching via Observer-based Hand-guiding with Active Support","url":"https://arxiv.org/abs/2608.10847","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10847v1 Announce Type: new \nAbstract: Kinesthetic teaching through robot hand-guiding provides a natural interface for collecting demonstrations in imitation learning and programming-by-demonstration. However, extended sessions cause operator fatigue, reducing demonstration quality and limiting scalability. Current industrial hand-guiding approaches typically provide no active assistance, and alternatives require costly wrist-mounted force-torque sensors or rely on learned motion priors unavailable for new tasks. We propose RHOAS, a hand-guiding scheme that actively supports operato","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19347,"title":"Neural Introspection Gating for Adaptive KV-Cache Reuse in Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.10824","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10824v1 Announce Type: new \nAbstract: Vision-Language-Action(VLA) models map camera images and language instructions directly to motor commands through a single autoregressive transformer. In real-time control, they still spend substantial compute recomputing key-value(KV) representations for visual tokens that barely change across neighboring frames. Recent work such as VLA-Cache reduces that cost by reusing KV states for visually static patches, but its policy relies only on observation-space heuristics and does not account for the model's own uncertainty. We propose Gated VLA-Cac","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19346,"title":"AECNav: Active Evidence Consolidation for Efficient Zero-Shot Open-Vocabulary Object Navigation","url":"https://arxiv.org/abs/2608.10817","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10817v1 Announce Type: new \nAbstract: Zero-shot object-goal navigation (ZSON) in open-vocabulary scenarios is challenging, as it requires a robot to locate an arbitrarily specified object in an unseen environment without task-specific training. Currently, the task still suffers from high latency and limited accuracy due to redundant perception pipelines and insufficient evidence for reliable target confirmation. In this letter, we reframe ZSON as an evidence-driven perception-to-decision problem and present AECNav, a training-free pipeline built on three components: i) Evidence-gate","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19345,"title":"JEPA-WAM: Stage-Level Joint-Embedding Prediction for World-Action Models in Robot Manipulation","url":"https://arxiv.org/abs/2608.10780","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10780v1 Announce Type: new \nAbstract: Generalist robot policies aim to map multimodal observations and linguistic task instructions to actions across diverse tasks. However, existing methods typically represent the future as a fixed, short video-action chunk. This short-term future captures local scene evolution for action execution, but it does not explicitly describe the stage-level future that specifies how a task should progress from its current stage to the next. We therefore distinguish two complementary futures for robot manipulation: a short-term physical future to capture l","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19344,"title":"Embodied Multimodal Grounding for Open-Vocabulary Mobile Manipulation via Semantic 3D Gaussian Splatting","url":"https://arxiv.org/abs/2608.10756","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10756v1 Announce Type: new \nAbstract: Embodied mobile manipulation requires language, visual observations, three-dimensional scene structure, and action feasibility to be aligned before execution. We study open-vocabulary target grounding with few-shot manipulation in local household workspaces and present an embodied multimodal grounding framework that integrates active multi-view Semantic 3D Gaussian Splatting (Semantic-3DGS), reachability-aware base positioning, and a diffusion-based vision-language-action policy. A task-driven local Semantic-3DGS serves as a shared interface acr","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19343,"title":"TCAM for Autonomous Deformable Manipulation: The RMC2 Champion System for WBCD 2026 Track 4","url":"https://arxiv.org/abs/2608.10718","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10718v1 Announce Type: new \nAbstract: This technical report describes the RMC2 Team's champion solution for the WBCD 2026 Track 4: Deformable Manipulation Challenge. The task requires a robot to pick a single T-shirt from a stack, load it onto a printing pallet, align the collar with a target area, and smooth the printing region, a sequence that involves single-layer separation, deformable transport, precise placement, and contact-rich surface adjustment. The competition strongly incentivizes fully autonomous execution, motivating the development of an autonomous solution. We built","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19342,"title":"OAA: Three Phases of Vocal Guidance in Human-Drone Teleoperation","url":"https://arxiv.org/abs/2608.10651","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10651v1 Announce Type: new \nAbstract: Voice-guided teleoperation requires systems that adapt to the evolving dynamics of human guidance. Yet most voice-controlled robot systems treat spoken commands as a stationary stream, ignoring how the guide's communicative behavior changes as the task progresses. Using motion capture and speech data from two experimental configurations, humanhuman guidance (finger pointing, N =10 dyads) and humandrone teleoperation (gamepad control, N =29 dyads), we show that spontaneous vocal guidance consistently organizes into three kinematically and linguis","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19341,"title":"When Your State Estimator Has Lost The Plot: Detecting Estimator Failures Via Spectral Analysis","url":"https://arxiv.org/abs/2608.10623","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10623v1 Announce Type: new \nAbstract: Reliable onboard state estimation is essential for safe robotic operation, yet unmodeled disturbances, such as sensor aliasing or out-of-distribution noise, still cause estimators to degrade or fail completely. While many methods aim to improve estimator robustness, only a few provide introspective mechanisms to assess estimate quality. Existing uncertainty measures, such as covariances, rely on idealized assumptions and tend to be overconfident, and more recent data-driven approaches are typically tied to their training data distributions.\n  We","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19340,"title":"Toward the Cognitive--Physical Limits of Embodied Intelligence through a World-Model-Centric Autonomous Racing Agent","url":"https://arxiv.org/abs/2608.10618","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10618v1 Announce Type: new \nAbstract: Embodied artificial intelligence aims to develop agents that perceive, reason, and act through continuous interaction with the physical world. However, most embodied systems are still evaluated within conservative safety margins or moderate interaction regimes, leaving their capability boundaries under extreme conditions insufficiently understood. Autonomous racing provides a stringent testbed by combining high-frequency localization and perception, adversarial interaction, near-saturated vehicle dynamics, and strict safety constraints. Existing","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19339,"title":"BooST: Bridging Semantics and Motions for Efficient Skill Transfer","url":"https://arxiv.org/abs/2608.10600","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10600v1 Announce Type: new \nAbstract: Skill abstraction---the process of learning reusable and temporally extended behaviors---has emerged as a key paradigm for improving sample efficiency and generalization in robot learning. For efficient skill transfer to real robots, learned skills must generalize across tasks and domains, remain robust to visual and dynamic perturbations, and be efficient enough for practical deployment. However, existing methods typically satisfy only a subset of these properties, as they capture either high-level semantic intent (what) or low-level motion dyn","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19338,"title":"Lost in Reconstruction: Aligning Action Representations with Language in Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.10484","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10484v1 Announce Type: new \nAbstract: Action verbs describe not only the physical outcomes of actions, but also how those actions are performed. Yet action representations in vision-language-action models (VLAs) are typically optimized for reconstruction under L1/L2 losses in raw action space, where numerical proximity need not reflect linguistically meaningful distinctions. On BridgeV2, we show that action trajectories contain verb-grounding information beyond visual state changes, and that reconstruction-only discrete tokenization systematically erodes this information. To address","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19337,"title":"PBD-AG: Persistent Baseline-Delta Active Graphs with Uncertainty-Aware Inspection for Long-Horizon Service Robots","url":"https://arxiv.org/abs/2608.10449","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10449v2 Announce Type: new \nAbstract: Long-horizon service robots require persistent world models that can be built autonomously in unseen environments and revised as task-relevant objects change. Existing methods rely on online mapping, which accumulates localization and observation errors, static scene representations that cannot capture persistent object changes, or holistic vision-language predictions that lack verifiable 3D geometric evidence. We present PBD-AG, a persistent baseline-delta active graph framework that decouples robot-verified stable fixtures from revisable dynam","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19336,"title":"Real-World Cooperative Bimanual Dexterous Grasp of Large Objects from Single-View Observations","url":"https://arxiv.org/abs/2608.10383","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10383v1 Announce Type: new \nAbstract: Bimanual dexterous grasping of large objects is a critical challenge in robotic manipulation. However, most existing studies focus on sequential manipulation rather than cooperative grasping, and methods addressing such bimanual tasks have largely been limited to simulation. These limitations stem from the difficulty of acquiring full 3D object models and generating physically plausible grasping actions. To fill this gap, we propose a real-world bimanual grasping framework that includes: a multimodal dataset capturing joint angles, visual observ","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19335,"title":"Whole-Body Planning for Humanoids Navigating Confined Spaces via Self-Collision Avoidance References","url":"https://arxiv.org/abs/2608.10220","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10220v1 Announce Type: new \nAbstract: Humanoid locomotion in highly confined environments requires navigating dense environmental obstacles and complex self-collision bounds while maintaining multi-contact dynamic feasibility. Traditional trajectory optimizers frequently struggle in these restricted spaces, as navigating the large collision space with splines on particle abstractions is insufficient and leads to poor local minima. To address this, we propose a three-stage whole-body planning framework that formulates kinematic path planning directly over kinematically reachable rigi","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19350,"title":"Six Months, $74.1 Million: Westlake University Professor's Embodied AI Startup Secures Four Funding Rounds - finance.biggo.com","url":"https://news.google.com/rss/articles/CBMidkFVX3lxTE5kSm5lLTczQTE2eDNNdWZpQmppanBMYUNJSVlPOTlRUW1lbHNjSjh1UzI3UnBsQldXQnRhYS05YnVZbWZXbkF2MXNzMmZubW0wVDJwS19kYXA2SDdWTjZrR1ByZVpUN3NjMjlBZ1FGWFMwQ0J6dmc?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMidkFVX3lxTE5kSm5lLTczQTE2eDNNdWZpQmppanBMYUNJSVlPOTlRUW1lbHNjSjh1UzI3UnBsQldXQnRhYS05YnVZbWZXbkF2MXNzMmZubW0wVDJwS19kYXA2SDdWTjZrR1ByZVpUN3NjMjlBZ1FGWFMwQ0J6dmc?oc=5\" target=\"_blank\"\u003eSix Months, $74.1 Million: Westlake University Professor's Embodied AI Startup Secures Four Funding Rounds\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.biggo.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-12T02:56:00"},{"id":19351,"title":"小米推出新款机器人吸尘器‘小米机器人吸尘器6系列’ - 亚洲日报","url":"h // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
