会表示，公司持续关注集团内部及省内外优质的煤炭资源，在标的资产满足上市公司筛选标准的前提下，将适时推进优质资产的并购工作，以切实为全体股东创造价值。（证券时报）","tags":["财报"],"cluster_size":1,"ts":"2026-08-29T05:36:56"},{"id":24013,"title":"股价月内翻倍后高位回调，百花医药回应：公司创新药CRO占比很小","url":"https://wallstreetcn.com/livenews/3157234","source":"华尔街见闻 · 全球快讯","sources":["华尔街见闻 · 全球快讯"],"summary":"8月28日，百花医药盘中触及跌停。Wind数据显示，截至8月28日收盘，公司股价报15.44元/股，收盘跌幅为7.43%。不过，8月以来公司累计涨幅仍达到119.63%。\n\n对于百花医药股价大跌，百花医药方面回应记者，股价受多重因素影响。公司主要做仿制药CRO，创新药CRO占比很小。相比仿制药，创新药投入大、回报不及预期的风险也大。公司属于药厂的上游环节，CRO业务对接药厂。按照仿制的难度不一样，订单的总价也有区别，订单一般不会少于1年，一般是2—3年。仿制药CRO行业竞争加剧，属于买方市场，公司需要主动去找业务，订单单价不如往年高。（中证金牛座）","tags":[],"cluster_size":1,"ts":"2026-08-29T05:36:23"},{"id":24014,"title":"李家超：预留五千万港元作为紧急赈灾项目之用","url":"https://wallstreetcn.com/livenews/3157233","source":"华尔街见闻 · 全球快讯","sources":["华尔街见闻 · 全球快讯"],"summary":"因尼泊尔一侧发生泥石流灾害，造成西藏日喀则市吉隆县吉隆口岸重大人员伤亡、失联，令人无比难过。香港特区行政长官李家超表示，已从赈灾基金预留了五千万港元，作为紧急赈灾项目之用。赈灾基金咨询委员会将迅速处理拨款申请。（大湾区之声）","tags":["港股"],"cluster_size":1,"ts":"2026-08-29T05:27:44"},{"id":24015,"title":"美股讯号 | 美联储主席沃什讲话引发加息预期上升，市场关注9月数据 ｜#美股资讯# #美联储# #市场动态# - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQck5BSTVqM09kT3gtZjhGeV9NSlVpZVp6RDhZMHNta1NBNXRRWGViNC1QNHpseU9TVXROOWZwOVpHWmljQkkzUE5EZktJQkU4OFI4cDhVbjB3b1FmSUYxZHQ4cG5qTm91VHhBTDlWNVhPcXhTTDlRNHNJMnFOLWdEckIwc2FTWEhaYUw4eg?oc=5","source":"GNews · A股政策","sources":["GNews · A股政策"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQck5BSTVqM09kT3gtZjhGeV9NSlVpZVp6RDhZMHNta1NBNXRRWGViNC1QNHpseU9TVXROOWZwOVpHWmljQkkzUE5EZktJQkU4OFI4cDhVbjB3b1FmSUYxZHQ4cG5qTm91VHhBTDlWNVhPcXhTTDlRNHNJMnFOLWdEckIwc2FTWEhaYUw4eg?oc=5\" target=\"_blank\"\u003e美股讯号 | 美联储主席沃什讲话引发加息预期上升，市场关注9月数据 ｜#美股资讯# #美联储# #市场动态#\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":["宏观","美股"],"cluster_size":1,"ts":"2026-08-29T05:24:17"},{"id":24016,"title":"美股讯号 | 美联储主席沃什鹰派讲话，9月加息概率上升 ｜#美股资讯# #美联储# #市场动态# - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPRVlOZ25YeU9HUm tle":"顺丰控股：加快推进智能装备和AI应用场景落地","url":"https://wallstreetcn.com/livenews/3157189","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"顺丰控股8月28日在业绩说明会表示，展望2026下半年，国内端，公司将继续深挖消费多元细分场景，深度服务B端企业转型升级，持续加深经营护城河；国际端，公司会紧抓中国企业品牌和产能出海机遇，加快发展第二增长曲线业务；同时，加快推进智能装备和AI应用场景落地，将技术优势转化为长期经营效益。综合来看，下半年外部环境仍存在油价等多重不确定性，公司将保持经营策略定力，持续精益管理，致力于交付稳健的营收和利润结果。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T01:28:29"},{"id":23954,"title":"顺丰控股：展望2027年，AI在增收、降本各个维度都将有较大的增量空间","url":"https://wallstreetcn.com/livenews/3157188","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"顺丰控股8月28日在业绩说明会表示，顺丰会继续引领前沿科技在物流行业的应用，持续加大AI技术应用的投入。展望2027年，AI在增收、降本各个维度都将有较大的增量空间。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T01:28:02"},{"id":23955,"title":"9月港股通标的调整进入倒计时，警惕爆炒“入通”概念股","url":"https://wallstreetcn.com/livenews/3157179","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"9月港股通标的调整进入倒计时，新一轮标的纳入名单也成为市场关注焦点。业内专家提醒，随着港股通调整生效节点临近，投资者需要高度警惕“入通闪崩”的投资风险。尤其要留意那些基本面偏弱、股权高度集中的个股；同时南向资金以及被动型基金产品，也应当做好相应的风险防控。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-29T00:49:57"},{"id":23956,"title":"年内配售逼近2000亿港元 港股再融资“变奏”凸显三大变化 - 新浪网","url":"https://news.google.com/rss/articles/CBMiggFBVV95cUxNVkg3M0tGdGY1VTZmcy1DS2wwRE1UMW43cld1WTVjT0Nlb3ZjWlpPMlNXSVBndDdjRXZYRTduUW45ai1kUVZVV2h3dUo5SnpfeHJSU29RSXhFd0JjcURSWGN0V05Nb3JuY004MUlmMWFDNmZlRmJ6a0xoUm82T19Lajhn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴","华尔街见闻 · 港股快讯"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiggFBVV95cUxNVkg3M0tGdGY1VTZmcy1DS2wwRE1UMW43cld1WTVjT0Nlb3ZjWlpPMlNXSVBndDdjRXZYRTduUW45ai1kUVZVV2h3dUo5SnpfeHJSU29RSXhFd0JjcURSWGN0V05Nb3JuY004MUlmMWFDNmZlRmJ6a0xoUm82T19Lajhn?oc=5\" target=\"_blank\"\u003e年内配售逼近2000亿港元 港股再融资“变奏”凸显三大变化\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":3,"ts":"2026-08-28T23:30:23"},{"id":23957,"title":"“先买后付”巨头Affirm CEO称高油价正在冲击美国消费者","url":"https://wallstreetcn.com/livenews/3157160","source":"华尔街见闻 的精准对接。\u003c/p\u003e","tags":[],"cluster_size":1,"ts":"2026-08-29T03:59:25"},{"id":24107,"title":"OpenAI高管：ChatGPT与Codex合体，终局是个人AGI - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOZERCa2xpTGJEMG5hSWFNTDNCZ2FEeHZjNU92VTBBM0lhc3RsSi1NcC15NlRiQ21zTWNoVkhVRVM4V1loeTJwdXJEekFJbHpMOUFTek5vcHIyVlFvUHFEY3R0Q0xEcWdIcHpTd1NLTkFta2tmUzB1a2p0OVNoWXpRZ3NWY2xlNUJm?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOZERCa2xpTGJEMG5hSWFNTDNCZ2FEeHZjNU92VTBBM0lhc3RsSi1NcC15NlRiQ21zTWNoVkhVRVM4V1loeTJwdXJEekFJbHpMOUFTek5vcHIyVlFvUHFEY3R0Q0xEcWdIcHpTd1NLTkFta2tmUzB1a2p0OVNoWXpRZ3NWY2xlNUJm?oc=5\" target=\"_blank\"\u003eOpenAI高管：ChatGPT与Codex合体，终局是个人AGI\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-29T03:57:44"},{"id":24109,"title":"AI 算力拉动铜需求激增，2026 年 AI 服务器专用高端铜箔需求预计增 260%","url":"https://www.ithome.com/0/995/891.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"8cf3\"\u003eIT之家 8 月 29 日消息，据央视新闻今日报道，AI 与铜的距离看起来很远。一边是发生在“云端”的前沿算法，一边是深埋地下的传统金属。可当 AI“跑”起来，它们就被紧紧连在了一起。服务器的高速运算，需要更强的供电、更快的数据传输和更高效的散热，在这些环节中，铜至关重要。据市场测算，2026 年 AI 服务器专用高端铜箔需求约 2.4 万吨，\u003cstrong\u003e同比增长约 260%\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"c09a\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/a45c8bb9-1726-4444-85db-9a0fb18ee052.png\" w=\"724\" h=\"849\" data-weibo=\"0\" data-vmark=\"d0b7\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"e75b\"\u003eIT之家从报道获悉，一台普通服务器通常只需要几公斤铜，而用于人工智能训练的高性能服务器，单台用铜量可以达到 15 至 30 公斤，\u003cstrong\u003e是普通服务器的 3 倍至 6 倍\u003c/strong\u003e。随着液冷加快应用，导热性能较好的铜被更多用于液冷板等散热部件。\u003c/p\u003e","tags":[],"cluster_size":1,"ts":"2026-08-29T03:40:50"},{"id":24110,"title":"Anthropic最新RSI实验：Claude击败人类研究员，训练效率超1.5万倍 - 麻省理工科技评论","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE1EV3VzQ09oOGNsTU5mYy0zd09BZXNyT d policies mainly improve current-scene grounding, whereas predictive policies often model future dynamics in RGB or latent spaces and may incur substantial deployment cost. GaussianDream demonstrates that training-time current Gaussian reconstruction and future Gaussian prediction provide effective 3D supervision,","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23666,"title":"EgoNav: Bridging Learned Waypoints and Geometry-Aware Local Control for Robust Indoor Navigation","url":"https://arxiv.org/abs/2608.25642","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25642v1 Announce Type: new \nAbstract: Image-goal navigation using lightweight topological maps is a practical paradigm for indoor robot deployment: the map requires only geotagged images, and localization relies on visual matching rather than precise pose estimation. However, learned waypoint predictors can produce targets that violate geometric constraints or deviate from the global path. Executing these waypoints safely further requires a local planner capable of collision avoidance, yet existing systems either lack one or rely on fixed parameters that cannot adapt to confined spa","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23665,"title":"Advantage-Driven Explicit Memory for Social Navigation","url":"https://arxiv.org/abs/2608.25610","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25610v1 Announce Type: new \nAbstract: Robot policies are predominantly learned with classical parametric variants of imitation learning or RL, where training stores the agent's behavior exclusively in the policy's network parameters, putting a heavy burden on the representation learning algorithm. We propose a new navigation agent equipped with non-parametric memory which explicitly indexes prior steps leading to critical events. The advantages are twofold: first, it allows the policy to outsource some of its behavior into an explicit memory; second, it encourages a form of continua","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23664,"title":"RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation","url":"https://arxiv.org/abs/2608.25585","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25585v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models provide a versatile foundation for general robotic manipulation, yet they exhibit significant brittleness when confronted with novel task distributions. While In-Context Imitation Learning (ICIL) offers a training-free alternative, existing frameworks suffer from an adaptation bottleneck that hinders the effective translation of expert context to executable actions. This failure originates from superficial retrieval mechanisms and an inherent behavioral inertia that anchors the policy to its pre-trained priors","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23663,"title":"ConfAL-WM: Confidence-Guided Active Learning for Action-Conditioned World Models","url":"https://arxiv.org/abs/2608.25572","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.25572v1 Announce Type: new \nAbstract: Action-conditioned world models have become an important foundation for embodied prediction, planning, and synthetic data generation, but their errors under new task and scene distributions are often concentrated in localized spatiotemporal regions such as robot arms, manipulated objects, contact areas, and occluded objects. This paper presents ConfAL-WM, a confidence-guided active learning framework for post-training embodied world models. Built upon EVAC, we attach a lightweight confidence probe to UNet decoder features and predict dense confi","tags":[],"cluster_size":1,"ts":"2026-08-27T04:00:00"},{"id":23662,"title":"A Tendon-Driven Five-Fingered Hand with Distributed Tactile Perception for Dexterous Manipulation","url":"https://arxiv.org/abs/2608.25547","source":"arxiv · cs.RO","sources":[ // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
