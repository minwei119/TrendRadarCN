jpg?x-bce-process=image/watermark,text_QUnnlJ_miJA,type_RlpMYW5UaW5nSGVpU0JHQg==,size_28,color_ffffffdd,skw_1,skc_00000051,g_7,blr_50,bls_50,x_11,y_11/format,f_auto\" w=\"1440\" h=\"960\" data-ai=\"1\" data-mpos=\"2,0\" data-weibo=\"0\"  data-vmark=\"0cd8\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp","tags":[],"cluster_size":1,"ts":"2026-09-16T06:51:20"},{"id":27659,"title":"因有人将关键 Hypervisor 漏洞报告给索尼，PS5 Linux 项目核心开发者宣布放弃开发","url":"https://www.ithome.com/1/003/068.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"51ce\"\u003eIT之家 9 月 16 日消息，PS5 Linux 核心开发者 Andy Nguyen 今天在 X 平台宣布停止项目开发，并退出 PS5 破解圈。\u003c/p\u003e\u003cp data-vmark=\"c0e2\"\u003e这名开发者情绪激动地表示：“以前破解圈子都是一群才华横溢的研究员，如今全是只会用大语言模型的菜鸟，写出他们根本不懂的破解程序。\u003cstrong\u003e这些‘脚本小子’发现了 PS5 Pro 仅剩的 Hypervisor 漏洞\u003c/strong\u003e，\u003cstrong\u003e然后将其报告给索尼\u003c/strong\u003e。”\u003c/p\u003e\u003cp data-vmark=\"0659\"\u003e他继续说道：“我要求他们至少等到《GTA6》上市再提报，这样人们就有机会合法购买游戏，还能在 PS5 享受 Linux。他们最开始同意等待，但一天都没过去，他们就决定把这个机会浪费掉。我将退出 PS5 破解圈，并停止所有 PS5 Linux 适配工作。我倾注了数月时间，其中还包括计划 2027 年推出的 PS5 Pro 支持，但现在这一切全都白费了。”\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"8421\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/6ed3517a-abf1-4139-a545-","tags":[],"cluster_size":1,"ts":"2026-09-16T06:51:03"},{"id":27660,"title":"新款吉利银河 E5 被曝 9 月 23 日上市：新增激光雷达，动力提升至 245kW","url":"https://www.ithome.com/1/003/064.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"cf27\"\u003eIT之家 9 月 16 日消息，据汽车之家今日报道，新款吉利银河 E5 将于 9 月 23 日上市。新车有望搭载吉利 AI 智充技术和新一代神盾短刀电池，并新增激光雷达。\u003c/p\u003e\u003cp data-vmark=\"7c3f\"\u003e这款新车已通过工信部申报，外观延续现款设计并优化，前包围强化，加入新装饰元素和主动式进气格栅。车顶新增激光雷达，翼子板新增摄像头，第二排车窗配备隐私玻璃。\u003c/p\u003e\u003cp data-vmark=\"c9a2\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/787e8c4d-1a10-40b5-9fdf-1519d0230d46.jpg\" w=\"1440\" h=\"1080\" data-weibo=\"0\" data-vmark=\"47cd\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data- 3ff3\"\u003eIT之家注：上游支持是指由原始开发社区直接支持，也就是功能已经进入主项目的正式开发流程，相比“临时移植”或“社区私改版”，上游支持通常更稳定、后续维护也更容易。\u003c/p\u003e\u003cp data-vmark=\"78b1\"\u003e功能方面，本次更新为所有 Apple Silicon 芯片添加硬件加速的 H.264 和 VP9 解码功能，以及为 M3 系统提供 AV1 专属解码功能。不过本次 Beta 版本尚未针对 M3 系列 Mac 适配 3D GPU 加速，团队称相关驱动将通过未来的 Mesa 更新提供。\u003c/p\u003e\u003cp data-vmark=\"9330\"\u003e对于现有用户，Fedora Asahi Remix 43 和 44 可使用","tags":[],"cluster_size":1,"ts":"2026-09-16T05:49:26"},{"id":27675,"title":"联想 YOGA Pro 15 RTX Spark 预热：搭载 RTX Spark N1X 超级芯片","url":"https://www.ithome.com/1/003/027.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"a40f\"\u003eIT之家 9 月 16 日消息，联想今年 9 月 3 日在 IFA 2026 上正式推出了其基于英伟达 RTX Spark 超级芯片的笔记本电脑产品，即 15 英寸 Yoga Pro 9n 和 16 英寸二合一翻转本 Yoga 9n 2-in-1。\u003c/p\u003e\u003cp data-vmark=\"ce8f\"\u003e今日，联想 YOGA Pro 15 RTX Spark 国行版本也已开启预热，有望在近期揭晓更多信息。\u003c/p\u003e\u003cp data-vmark=\"bf10\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/19d27df6-f63d-451c-93cf-36c90ac9ca5e.jpg?x-bce-process=image/format,f_auto\" w=\"1080\" h=\"1920\" data-weibo=\"0\" data-vmark=\"1ca6\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"24ce\"\u003eIT之家整理参数如下：\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr class=\"firstRow\"\u003e\u003ctd\u003e\u003cbr\u003e\u003c/td\u003e\u003ctd\u003eYoga Pro 9n\u003c/td\u003e\u003ctd\u003eYoga 9n 二合一\u003c","tags":[],"cluster_size":1,"ts":"2026-09-16T05:47:18"},{"id":27676,"title":"传神语联与海光信息达成合作：国产大模型×国产算力，一次自主与安全的战略筑基 - 京报网","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE4zcjJva2dCV2h1VTdYdmZ4VC0xZE50NExTQUZSQXNncUZtdVFUN0lFRU5ZSHkteVNHVmhTLTNmV1lYd2JhTGI3Uy1Pb1pvOFduVmJ0eHkxeFlreGd0RUE?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE4zcjJva2dCV2h1VTdYdmZ4VC0xZE50NExTQUZSQXNncUZtdVFUN0lFRU5ZSHkteVNHVmhTLTNmV1lYd2JhTGI3Uy1Pb1pvOFduVmJ0eHkxeFlreGd0RUE?oc=5\" target=\"_blank\"\u003e传神语联与海光信息达成合作：国产大模型×国产算力 earning aims to remove specific knowledge from a trained large language model (LLM) without retraining from scratch. Existing methods modify model weights via gradient ascent and its advances. While effective on certain benchmarks, these weight-based approaches exhibit a sharp forget-utility trade-off, where stronger forgetting of target knowledge can degrade model utility, and unlearned knowledge may reappear under post-unlearning fine-tuning or prompt attacks. We propose ARIA (autoencoder-gated inference-time unlearning), a test-tim","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27593,"title":"How I learned to stop worrying and love StopGrads: Stationarity, Convergence, and a case study on Flow Map Learning","url":"https://arxiv.org/abs/2609.16222","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16222v1 Announce Type: new \nAbstract: Stopgrads are widely used in training machine learning models, but stopgrads can alter the gradient, stationary points and convergence guarantees of the original objective, which can make stopgrad training theoretically ungrounded. We introduce a stopgrad regression principle, which identifies a general template for stopgrad objectives with a closed-form characterization of stationary points and their uniqueness, unifying stopgrad objectives for flow maps, reinforcement learning, and diffusion samplers. We provide theoretical grounding for optim","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27592,"title":"Decoy Direction Optimization: A Post-Hoc Defense Against LLM Abliteration","url":"https://arxiv.org/abs/2609.16204","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16204v1 Announce Type: new \nAbstract: Safety guardrails in open-weight language models can be readily bypassed using Refusal Feature Ablation (RFA), a technique that identifies and projects out a linear refusal direction from the residual stream, often achieving a high attack success rate (ASR) while preserving model capability. Defending against these attacks typically requires computationally expensive safety finetuning for every new checkpoint. We introduce Decoy Direction Optimization (DDO), a fast, post-hoc weight-editing defense that requires no base-model finetuning. Our appr","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27591,"title":"Anatomy of Associative Recall in Fixed-State Recurrences: A Matched-State Decomposition, an Interference Wall, and a Curriculum That Breaks It","url":"https://arxiv.org/abs/2609.16183","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16183v1 Announce Type: new \nAbstract: Fixed-state recurrences--linear attention and state-space models--are reported to lag behind attention on associative recall, but whole-architecture comparisons cannot say which ingredient is responsible. We decompose masked multi-query recall at a fixed state budget along three single-knob axes: a short causal convolution, the transition structure (rank-1 delta rule vs. diagonal), and decay. The convolution dominates (~+0.5 recall in both families under matched training): comparisons that pit convolution-free cells against a convolution-equippe","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27590,"title":"Z-Loss Backward Geometry in Dense Output Heads and Sparse Routers","url":"https://arxiv.org/abs/2609.16179","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16179v1 Announce Type: new \nAbstract: Z-loss has been widely applied to the logits of language-model output heads and sparse mixture-of-experts routers. Z-loss constrains the softmax log-normalizers of these output heads and routers, thereby limiting large-logit excursions, reducing finite-precision roundoff exposure, and avoiding training-loss divergence. These use cases arise in modern Transformer settings where large-vocabulary softmax heads, top-$k$ routing, fused losses, and mixed-precision optimizers interact. Z-loss has typically been understood only as a scalar penalty on th","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27589,"title":"Skeletal Prototypes on Iterative Nerve Expansions","url":"https://arxiv.org/abs/2609.16170","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16170v1 Announce Type: new \nAbstract: Prototype reduction replaces a training set with a smaller representation, and the established methods return a finite set of points. We propose Skeletal Prototypes on Iterative Nerve Expansions (SPINE). The model for each class is an embedded 1-complex rather than a point set. Its initial edge set is a class-conditional Mapper graph, so the data decide which localized clusters are joined. Later phases fit the vertices under a classification objective, and an observation is assigned to the class whose complex is nearest. The segments therefore e","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27588,"title":"LLM Inference in a Flash!","url":"https://arxiv.org/abs/2609.16161","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16161v1 Announce Type: new \nAbstract: Large Language Models (LLMs) have shown impressive capabilities across a range of natural language processing tasks, and LLM inference has emerged as a critical workload for enabling downstream applications. The demands of serving LLM inference are becoming increasingly challenging as requests shift toward longer sequences and heavier inference, driven by retrieval-augmented generation, inference-time compute scaling, and long-context applications. Additionally, these challenges are compounded by hardware trends, as memory capacity and communica","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27587,"title":"LLMs as Master Forgers: Generating Synthetic Time Series Data for Manufacturing","url":"https://arxiv.org/abs/2609.16155","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16155v1 Announce Type: new \nAbstract: This paper presents a novel framework leveraging Large Language Models (LLMs) to generate synthetic time series data for manufacturing processes. Motivated by the scarcity of labeled time-series data in real-world manufacturing settings, which hinders the development of robust machine learning models, we explore the potential of LLMs to learn complex temporal dependencies and generate realistic synthetic data. Our approach involves fine-tuning pre-trained LLMs on manufacturing process instructions and employing a Retrieval Augmented Generation (","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27586,"title":"A Decision-Support Audit Protocol for Supervision Drift in Proxy-Labeled Credit-Risk Prediction","url":"https://arxiv.org/abs/2609.16102","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16102v1 Announce Type: new \nAbstract: Credit-risk models are trained on proxy labels and deployed under temporal and segment change, yet no single transfer metric separates base-rate shift, probability-scale shift, and feature-label relationship change. We contribute a design-science artifact: a locked, multi-signal audit protocol for supervision drift in proxy-labeled credit-risk prediction. Five layers (transfer performance, an oracle-gap probe, a calibration diagnostic, feature-label stability, and a synthetic positive control), thresholds, and decision rules were locked before i","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27585,"title":"SWB-DM: A Calibrated Sliced-Wasserstein-Barycenter Aggregator with Delayed-Momentum Caching for Byzantine-Robust Federated Learning under Partial Participation","url":"https://arxiv.org/abs/2609.16099","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16099v1 Announce Type: new \nAbstract: Robust aggregation methods for federated learning quietly rest on a fragile assumption: that whoever shows up in a given round is a fair sample of the full population. In practice, they rarely are. When only a handful of clients participate per round, even a modest fraction of adversaries can dominate that sample and silently invalidate the finite-sample guarantees that coordinate-wise median, Krum, Bulyan, and trimmed mean all depend on.\n  We introduce SWB-DM to address this directly. SWB treats each slice of a client update as a one-dimensiona","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27584,"title":"Evaluating Open-Weight E-Commerce Agents with Environment-Grounded Verification","url":"https://arxiv.org/abs/2609.16093","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16093v1 Announce Type: new \nAbstract: A shopping conversation has many routes to the same cart, and a task-success rate reduces all of them to one score. We build a deterministic and reproducible e-commerce environment that precommits each trial's customer and trajectory parameters, including the persona, difficulty, target cart, and an item reveal schedule. A simulated consumer attempts to buy a target cart from the environment with assistance from the evaluated model. The environment guides the simulator's actions and records every assistant action alongside the environment state","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27583,"title":"Distilling Foundation Models for Agentic What-If Reasoning:Cost, Latency, and Governance in a Hybrid LLM+SLM Architecture","url":"https://arxiv.org/abs/2609.16091","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16091v1 Announce Type: new \nAbstract: Tabular foundation models deliver strong zero-training predictive performance via in-context learning, but their high inference latency makes them impractical as hot-path decision backends in interactive agentic loops. We distill a TabPFN teacher into a compact feed-forward student across a business-decision simulation on UCI Adult and five OpenML benchmarks: the classification head compresses 53.2M parameters to 8,546 (6,220x); the deployed two-head loan pipeline compresses 111.4M parameters to 17,059 (6,532x). The student retains 95.4-100.5% a","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27582,"title":"Pseudo-Label Augmentation for Affect Sensing in Small Collaborative Groups","url":"https://arxiv.org/abs/2609.16077","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16077v1 Announce Type: new \nAbstract: Physiological affect sensing in naturalistic group interaction is often limited by sparse labels rather than sensor data: wearable devices produce many time windows, while self-reports are collected only a few times per session. Using GroupAffect-4, a four-person collaborative dataset with wearable physiology, eye tracking, Big Five personality, and post-task VAD labels, we study pseudo-label augmentation for affect sensing under sparse supervision. We compare no augmentation, Gaussian Process pseudo-labelling, personality-aware trust weighting,","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27581,"title":"Schema-Adaptive Action-Conditioned JEPA for Cross-Machine CNC Transfer under Partial Sensor Overlap","url":"https://arxiv.org/abs/2609.16071","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16071v1 Announce Type: new \nAbstract: Cross-machine deployment of industrial world models requires transfer across changes in dynamics, sensing interfaces, sampling regimes, and control units. We study a schema-adaptive action-conditioned Joint-Embedding Predictive Architecture (SAAC-JEPA) for CNC dynamics, where the source machine has 17 canonical sensor channels and the target shares only 10. Evaluation uses group-disjoint source splits, source-only normalization, held-out self-supervised validation, unit audits, and a sealed target test after model locking. Across five seeds, JEP","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27580,"title":"Beyond Distribution Matching: Semantics-Consistent Tabular Diffusion with Weak Semantic Priors","url":"https://arxiv.org/abs/2609.16069","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16069v1 Announce Type: new \nAbstract: Synthetic tabular data can match real data distributions while still violating the semantic constraints that govern valid tabular rows. This reveals a key limitation of existing tabular generators: they mainly optimize distributional fidelity, but do not explicitly model weak semantic priors encoded in tabular schema and textual descriptions. In this paper, we propose \\ours, a semantics-consistent tabular diffusion framework for high-fidelity synthetic data generation under weakly specified semantic priors. \\ours\\ first constructs two types of p","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27579,"title":"A panoramic aerodynamic performance prediction method for turbomachinery cascades using transformer-enhanced neural operator","url":"https://arxiv.org/abs/2609.16066","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16066v1 Announce Type: new \nAbstract: To enable flexible and rapid aerodynamic performance evaluation in turbomachinery design, this paper proposes a panoramic performance prediction framework. Unlike most previous prediction models that directly predict the objective functions of interest, our approach first predicts the basic parameters of the Navier-Stokes equations, such as temperature, pressure, and density. Utilizing these basic physical quantities, it subsequently predicts key performance parameters of the turbine stage meridian plane. By adopting this methodology, our propos","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27578,"title":"You Don't Need To Train: Agentic Heuristic Learning Studio for Executable Human Activity Recognition","url":"https://arxiv.org/abs/2609.16065","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16065v1 Announce Type: new \nAbstract: Human activity recognition (HAR) is usually framed as gradient-based training of neural networks. Agentic Heuristic Learning (AHL) Studio explores a complementary view inspired by human cognitive learning: people learn activities by remembering examples, forming rules, and repairing mistakes, not by backpropagating. This proposed tool implements AHL for HAR: a learning-time agent reasons over sensor protocols, proposes executable heuristic policies, records repair traces, and exports an LLM-free policy for edge deployment. We focus on the HAR be","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27577,"title":"Signed p-adic Residual Encodings of Finite-Domain All-Different Systems with a Sudoku Case Study","url":"https://arxiv.org/abs/2609.16063","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16063v1 Announce Type: new \nAbstract: We study signed, weighted affine $p$-adic residual objectives as native encodings of finite-domain constraints. For primes that separate the finite alphabet, sufficiently weighted positive unary rows pin each coefficient to its allowed set, while negative rows reward unequal endpoints or clause satisfaction. A coordinatewise domination theorem places every global minimiser in the finite domain; there the loss is, up to an additive constant, the all-different conflict count or the negative number of satisfied CNF clauses. Standard Sudoku provides","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27576,"title":"POSPAN: Position-Constrained Span Masking for Language Model Pre-training","url":"https://arxiv.org/abs/2609.16061","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16061v1 Announce Type: new \nAbstract: Span-level masked language modeling (MLM) has shown to be advantageous to pre-trained language models over the original single-token MLM, as entities/phrases and their dependencies are critical to language understanding. Previous works only consider span length with some discrete distributions, while the dependencies among spans are ignored, i.e., assuming that the positions of masked spans are uniformly distributed. In this paper, we present POSPAN, a general framework to allow diverse position-constrained span masking strategies via the combin","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27575,"title":"HintMiner: Automatic Question Hints Mining From Q\u0026A Web Posts with Language Model via Self-Supervised Learning","url":"https://arxiv.org/abs/2609.16060","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16060v1 Announce Type: new \nAbstract: Users often need ask questions and seek answers online. The Question - Answering (QA) forums such as Stack Overflow cannot always respond to the questions timely and properly. In this paper, we propose HintMiner, a novel automatic question hints mining tool for users to help them find answers. HintMiner leverages the machine comprehension and sequence generation techniques to automatically generate hints for users' questions. It firstly retrieve many web Q\\\u0026A posts and then extract some hints from the posts using MiningNet that is built via a la","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27574,"title":"Driver Behavior Estimation at Signalized Intersections Using a Physics-Constrained Decision-Conditioned Autoregressive Transformer","url":"https://arxiv.org/abs/2609.16058","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.16058v1 Announce Type: new \nAbstract: Red-light violations and harsh braking at signalized intersections are major contributors to traffic accidents. This paper analyzes and predicts human driver decision-making and longitudinal trajectory behavior during traffic light signal transitions. We collected a diverse real-world dataset comprising 449 approach runs under varying speed and distance conditions. Vehicle motion was recorded using RTK-corrected GNSS with centimeter-level accuracy, and driver heart rate and multi-level comfort ratings were monitored. Spatial and temporal calibra","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#7c3aed","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":27534,"title":"World Models for Embodied Intelligence: From Plausible to Controllable to Actionable","url":"https://arxiv.org/abs/2609.16697","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16697v1 Announce Type: new \nAbstract: World models connect perception and decision-making in embodied intelligence by maintaining hidden state, anticipating consequences, comparing interventions, and adapting when execution departs from expectations. Although progress is often measured by visual fidelity, their value lies in improving behavior. Before reaching for a cup, a person anticipates its weight and resistance to grasping, shaping the hand before contact. Such anticipation is coarse and rarely pictorial, yet it guides action. This raises a central question: which predictive c","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27533,"title":"Differentiable Mesh State Estimation via Factor Graph Inference for Deformable Object Reconstruction","url":"https://arxiv.org/abs/2609.16686","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16686v1 Announce Type: new \nAbstract: Estimating deformable object states remains a fundamental challenge in robotics and simulation. We propose a novel factor graph-based framework for probabilistic mesh state estimation of deformable objects. The method directly updates a tetrahedral mesh, a rich and physically-grounded representation of an environment, by combining physics priors, noisy sensor measurements, and temporal smoothness constraints within a unified probabilistic formulation. The estimation problem is posed as a nonlinear least-squares optimization and solved using Leve","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27532,"title":"Weave: Learning Whole-Body Dexterous Loco-Manipulation from Human-Object Interactions","url":"https://arxiv.org/abs/2609.16683","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16683v1 Announce Type: new \nAbstract: Learning humanoid-object interaction requires coordinating whole-body balance, locomotion, and dexterous hand contact to control both robot and object motion. Human demonstrations provide examples of coordinated interaction, but transferring these behaviors to humanoid robots requires learning how to establish and maintain effective contacts under different embodiments and dynamics. We present Weave, a unified framework for learning whole-body dexterous humanoid-object interaction from captured human demonstrations. Weave first converts captured","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27531,"title":"WholeBodyWAM: Generalizing Pre-trained World-Action Priors to Humanoid Loco-Manipulation via WBC-Grounded Coordination","url":"https://arxiv.org/abs/2609.16644","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16644v1 Announce Type: new \nAbstract: World Action Models (WAMs) offer a promising approach to general-purpose robot manipulation by jointly modeling visual dynamics and actions. However, most WAM studies focus on tabletop or arm-centric manipulation, while humanoid loco-manipulation remains less explored. To address this gap, we introduce WholeBodyWAM, which jointly predicts future visual dynamics, manipulation actions, and whole-body control intents for generalizable humanoid loco-manipulation. It preserves pre-trained world-action priors while grounding heterogeneous whole-body c","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27530,"title":"SAVLA: Symmetry-Aware Vision-Language-Action Models for Robotic Manipulation","url":"https://arxiv.org/abs/2609.16641","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16641v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have become the dominant paradigm for language-conditioned robot manipulation. However, although images and language instructions inherently encode geometric information, VLAs acquire their spatial competence purely from demonstrations. As a result, they are reliable only within the range of scene poses that the demonstrations cover. We propose SAVLA, an end-to-end symmetry-aware VLA model for robust and data-efficient policy learning. Our approach keeps the pretrained vision-language backbone entirely frozen","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27529,"title":"ProxiDex: Learning Dynamics-Guided Proximity Policy for Dexterous Manipulation","url":"https://arxiv.org/abs/2609.16586","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16586v1 Announce Type: new \nAbstract: Multi-finger dexterous manipulation relies on stable hand-object interactions, yet these interactions are partially observable in practice. Visual observations are often occluded by the hand, tactile sensors introduce hardware-specific modalities and calibration burdens, and existing policies rarely model how these cues evolve under actions, making them brittle under contact uncertainty. To address these, we present ProxiDex, a dynamics-guided proximity policy framework that treats hand-object proximity as an interaction state for dexterous mani","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27528,"title":"UniDex-ViTac: Learning Unified Visuo-Tactile Dexterous Manipulation Policy from Human Video Data","url":"https://arxiv.org/abs/2609.16504","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16504v1 Announce Type: new \nAbstract: Human videos provide demonstrations of dexterous manipulation but lack robot-executable actions and tactile measurements. We present UniDex-ViTac, a framework that uses human-video-guided simulation to generate robot demonstrations paired with fingertip contact observations for training a deployable visuo-tactile policy. Object-specific residual reinforcement learning specialists adapt annotated human-object interaction references to a robotic arm-hand system. Their successful rollouts pair final robot action targets with robot-side fingertip co","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27527,"title":"Dense to MoE Adaptation for Compact Vision Language Action Policies","url":"https://arxiv.org/abs/2609.16503","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16503v1 Announce Type: new \nAbstract: Vision language action (VLA) policies continue to grow in parameter count, making deployment on resource-constrained robot platforms difficult. The central goal is to reduce the number of LLM-side parameters retained in the deployed policy while preserving downstream task performance. Our approach, AdaDE, adapts selected dense feed forward blocks into mixture of experts (MoE) layers and derives expert retention masks from router statistics during fine tuning. The Dense2MoE conversion preserves the original dense FFN function at initialization, s","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27526,"title":"The Neverwhere Visual Parkour Benchmark Suite","url":"https://arxiv.org/abs/2609.16443","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16443v1 Announce Type: new \nAbstract: State-of-the-art visual locomotion controllers are increasingly capable at handling complex visual environments, making evaluating their real-world performance before deployment increasingly difficult. This work intends to narrow this train/evaluation gap by developing a collection of hyper-photo-realistic, closed-loop evaluation environments - The Neverwhere Benchmark Suite - comprised of over sixty 3D Gaussian Splatting reconstructions of urban indoor and outdoor scenes. Our goal is to encourage large-scale and reproducible robot evaluation by","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27525,"title":"XRoboToolKit-T: Teleoperation with High Stability and Precision with Tactile Sensing for Contact-rich Manipulation","url":"https://arxiv.org/abs/2609.16437","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16437v1 Announce Type: new \nAbstract: Collecting high-quality robot data for contact-rich manipulation tasks is essential for enabling robots to acquire real-world skills. However, existing data collection solutions often lack the capability to obtain stable and high-frequency tactile feedback, limiting their effectiveness in contact-rich manipulation scenarios. In this work, we propose a versatile teleoperation system with tactile-driven assistance to enable high-frequency and stable contact-rich manipulation. The proposed XRoboToolKit-T teleoperation system incorporates a tactile-","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27524,"title":"Collision-Aware Humanoid Whole-Body Control under Imperfect Tracking Targets","url":"https://arxiv.org/abs/2609.16405","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16405v1 Announce Type: new \nAbstract: Humanoid robots often execute motion commands through whole-body controllers (WBCs) that track targets while maintaining balance and stability. However, most WBCs are blind to scene geometry, which can lead to collisions from imperfect target motions that are geometrically unsafe due to perception, planning, or teleoperation errors. We propose RECAL, a Robot--Environment Cross-Attention Layer that wraps a blind WBC to trade off target tracking against collision avoidance using external scene geometry. RECAL supports collision-aware tracking of f","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27523,"title":"Auto-HSI: Personalized human control of a robot swarm on demand by using LLMs for online automatic code generation","url":"https://arxiv.org/abs/2609.16346","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16346v1 Announce Type: new \nAbstract: This paper presents Auto-HSI, a method for generating personalized human-swarm interaction (HSI) interfaces on demand. The objective is to enable untrained operators to use natural language descriptions and gesture demonstrations to explain how they want the robots to collectively behave in response to their gestures. Based on these inputs, the code should automatically be generated for personalized state machines that will control the robots as desired, in response to the desired gesture inputs. In the developed Auto-HSI prototype, the generate","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27522,"title":"ManiSkillFormer: Demonstration-Free Compositional Manipulation via Task-Conditioned Geometric Contracts","url":"https://arxiv.org/abs/2609.16331","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16331v1 Announce Type: new \nAbstract: We present ManiSkillFormer, a neuro-symbolic framework for demonstration-free and compositional robotic manipulation. Instead of learning end-to-end visuomotor policies, ManiSkillFormer introduces task-conditioned geometric contracts that explicitly structure the interface between perception and action. Each manipulation skill declares the semantic geometric primitives required for execution, such as object keypoints and surface normals. Building on human-defined skill structures, LLM agents generate these contracts and corresponding motion temp","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27521,"title":"ConGraspXL: Controllable Constraint-Conditioned Dexterous Grasping Motion Synthesis","url":"https://arxiv.org/abs/2609.16319","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16319v1 Announce Type: new \nAbstract: Dexterous grasping is usually conducted for specific tasks, leading to heterogeneous constraints such as specific approach directions, desired contact regions, specified wrist trajectories, and functional hand poses. Our previous work, GraspXL, achieves scalable grasping motion synthesis for diverse objects and hand morphologies, while lacking controllability for synthesis under such various task-driven constraints. In this paper, we propose ConGraspXL, which extends GraspXL with controllable constraint-conditioned grasp motion synthesis that ac","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27520,"title":"Tendon-Driven Continuum Robot with Modular Stiffness and In-Situ Self Pose Estimation","url":"https://arxiv.org/abs/2609.16256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16256v1 Announce Type: new \nAbstract: Continuum robots enable smooth shape morphing and safe interaction in confined environments. However, most existing systems are task-specific and depend on external sensing infrastructure, limiting their adaptability and real-world deployment. This paper presents a self-contained modular continuum robotic platform that combines mechanical reconfigurability with onboard pose estimation. The robot is constructed from interchangeable continuum joints with analytically precomputed stiffness, allowing rapid assembly and direct programming of the robo","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27519,"title":"Occupancy Network-Guided Autonomous Robotic Partial Nephrectomy","url":"https://arxiv.org/abs/2609.16186","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16186v1 Announce Type: new \nAbstract: Autonomous soft-tissue cancer surgery has been limited to interventions on organ surfaces, because current systems cannot perceive and adapt to anatomy once it deforms or is cut. We introduce the first vision-guided autonomous system capable of performing complete tumor resections for partial nephrectomy. Our system integrates conditional occupancy networks, trained entirely in a physics-based simulation, that infer full 3-D anatomy (tumor, margin tissue, and kidney) from single-view partial point clouds. These occupancy networks maintain intrao","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27518,"title":"Structure-Preserving Quantum Circuit Architectures for Robot Kinematics","url":"https://arxiv.org/abs/2609.16089","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16089v1 Announce Type: new \nAbstract: Structured spatial data require quantum encodings that preserve geometric relations, expose measurable observables, and remain implementable on finite-depth hardware. This work introduces a quantum representation and circuit architecture for rigid-body transformations and specializes it to Denavit--Hartenberg kinematics of serial open-chain manipulators. Each translational contribution is factorized into a classical metric magnitude and a signed unit direction encoded by a single-qubit Bloch vector, while parameterized rotations reproduce the or","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27517,"title":"AssemblyGrid v1: A Benchmark for Multi-Robot Production with Temporary Coalitions, Local Information, and Geometric Constraints","url":"https://arxiv.org/abs/2609.16075","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16075v1 Announce Type: new \nAbstract: Flexible robotic production requires joint decisions on process progression, material routing, resource assignment, temporary cooperation, and simultaneous execution, since each decision can affect the feasibility of the others. The challenge is greater under decentralized control, where each robot acts from bounded local information while system progress depends on collective decisions, shared resources, material state, and workspace compatibility. These properties closely match cooperative multi-agent decision making under partial observabilit","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27516,"title":"World-Action Models for Robot Learning and Control: A Survey","url":"https://arxiv.org/abs/2609.16074","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16074v1 Announce Type: new \nAbstract: Robots operating in open environments act under partial observability, physical constraints, and dynamic task contexts. Beyond mapping observations and language instructions to actions, they must anticipate how candidate actions may affect future states and task-relevant outcomes. Recent advances in world models, video generation, and Vision-Language-Action (VLA) policies have motivated the development of World-Action Models (WAMs), which couple future world prediction with executable action generation. This survey provides a robotics-oriented r","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27515,"title":"MR-GLi: Mixed Reality-Based Gripper-Linked Overlays for Underwater Robot Arm Teleoperation via Bilateral Control","url":"https://arxiv.org/abs/2609.16041","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16041v1 Announce Type: new \nAbstract: Visual torque feedback supports underwater bilateral teleoperation, but the benefit of mixed reality (MR) over conventional monitor presentation remains unclear. We present MR-GLi, an MR interface that spatially registers a reaction torque indicator and wrist-camera image to the robot gripper. Twenty participants performed lift and pick-and-place tasks with rigid and compliant objects in a counterbalanced within-subject comparison with a 2D monitor, using identical visual-feedback content and four-channel bilateral control. MR-GLi provided gripp","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27514,"title":"Bi-MoDe: Bilateral Control-based Imitation Learning via Modifier-Conditioned Decoding for Modulation of Execution Speed and Contact Intensity","url":"https://arxiv.org/abs/2609.16040","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.16040v1 Announce Type: new \nAbstract: Bilateral control-based imitation learning captures both position and force information, making it well suited to contact-rich manipulation. However, existing approaches provide limited means for an operator to specify how a learned task should be executed at inference time, such as slowly or quickly, gently or firmly. We propose Bi-MoDe, a modifier-conditioned decoding framework that injects a constrained latent into every layer of the Transformer action decoder via adaLN-Zero, allowing behavioral directives to directly influence action-chunk g","tags":[],"cluster_size":1,"ts":"2026-09-16T04:00:00"},{"id":27535,"title":"Digit 5 May Be the First Humanoid Robot Worker That’s Truly Safe","url":"https://spectrum.ieee.org/humanoid-robot-safety","source":"IEEE Spectrum · Robotics","sources":["IEEE Spectrum · Robotics"],"summary":"\u003cimg src=\"https://spectrum.ieee.org/media-library/a-front-and-an-angled-view-of-a-teal-colored-humanoid-robot-with-arms-bent-at-the-elbow.jpg?id=67776740\u0026width=1245\u0026height=700\u0026coordinates=0%2C187%2C0%2C188\"/\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cp\u003e\u003cspan\u003eDespite the recent deluge of videos of humanoid robots doing backflips and kung-fu, the actual pace of progress towards humanoids that can do economically viable jobs at scale has at times seemed a bit plodding. There are \u003c/span\u003e\u003ca href=\"https://spectrum.ieee.org/humanoid-robot-scaling\" target=\"_self\"\u003esome good reasons for this\u003c/a\u003e\u003cspan\u003e: a humanoid robot needs to be pow","tags":[],"cluster_size":1,"ts":"2026-09-15T15:22:30"},{"id":27536,"title":"One humanoid every 10 minutes: China unveils next-generation robot factory - RBC-Ukraine","url":"https://news.google.com/rss/articles/CBMilgFBVV95cUxQQXA1eUVsOGNjSTZwbjBMRXM1b2xVWTRDOGRsR0hZdXg4YnN0UWp2b1ZjVGhOVnNmZjFSVFFYT1pMelZwU0wyY1NoRDJMaDd3M1VjY284UHJKRzNyU2Y5S1RvMkFLbFM3QndpWE82NVg3a2ZQaWhQZkFTUWNtRHRWdXBVNDd2dzVKU2lfdExYeHFUb0VDWXc?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMilgFBVV95cUxQQXA1eUVsOGNjSTZwbjBMRXM1b2xVWTRDOGRsR0hZdXg4YnN0UWp2b1ZjVGhOVnNmZjFSVFFYT1pMelZwU0wyY1NoRDJMaDd3M1VjY284UHJKRzNyU2Y5S1RvMkFLbFM3QndpWE82NVg3a2ZQaWhQZkFTUWNtRHRWdXBVNDd2dzVKU2lfdExYeHFUb0VDWXc?oc=5\" target=\"_blank\"\u003eOne humanoid every 10 minutes: China unveils next-generation robot factory\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eRBC-Ukraine\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-15T13:27:07"},{"id":27537,"title":"Agility Robotics unveils humanoid robot Digit 5 in the United States - UA.NEWS","url":"https://news.google.com/rss/articles/CBMinAFBVV95cUxNZkNlZlNMclVmMlBJWXozcW5idjFXdDY3OVBCaVI5OE5GcEpoc21FSGp6Qk1EUngxUzRHNjBVSGVDWG5FbGJ4dkF1VnZhdm5JalBNTC1MeGpWSFFVcldpUHBYdkhpMW9lMUZlNEZ4T1BUcl9RdVo1bkdhc2YzMFJ6d0lmd0lVVW44a1NWUm1mWEVFYVNMcGZlcnRoUUY?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMinAFBVV95cUxNZkNlZlNMclVmMlBJWXozcW5idjFXdDY3OVBCaVI5OE5GcEpoc21FSGp6Qk1EUngxUzRHNjBVSGVDWG5FbGJ4dkF1VnZhdm5JalBNTC1MeGpWSFFVcldpUHBYdkhpMW9lMUZlNEZ4T1BUcl9RdVo1bkdhc2YzMFJ6d0lmd0lVVW44a1NWUm1mWEVFYVNMcGZlcnRoUUY?oc=5\" target=\"_blank\"\u003eAgility Robotics unveils humanoid robot Digit 5 in the United States\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eUA.NEWS\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-15T11:27:09"},{"id":27538,"title":"Unitree launches upgraded G1+ humanoid robot with six major upgrades - TechNode","url":"https://news.google.com/rss/articles/CBMicEFVX3lxTE5IWV9MdnNTNUNBWWtNSWcwRUkzRmhZRXRselpxWDBaTU5ocFlibFU2SnFQOVNOV2Nid0ZkSElwVWU4bUZ2dWp5Q200NnFqbUxvVXZvMGxTM25UVnhnajQxcnM4NVFWcXlKVHd1c1k5eU0?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMicEFVX3lxTE5IWV9MdnNTNUNBWWtNSWcwRUkzRmhZRXRselpxWDBaTU5ocFlibFU2SnFQOVNOV2Nid0ZkSElwVWU4bUZ2dWp5Q200NnFqbUxvVXZvMGxTM25UVnhnajQxcnM4NVFWcXlKVHd1c1k5eU0?oc=5\" target=\"_blank\"\u003eUnitree launches upgraded G1+ humanoid robot with six major upgrades\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTechNode\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-15T06:55:43"},{"id":27362,"title":"How to Better Train VLAs: Lessons Learned From the REAL-I Challenge at ICRA 2026","url":"https://arxiv.org/abs/2609.13679","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.13679v1 Announce Type: new \nAbstract: How can robot policies learn more effectively from a fixed demonstration budget? The first Real-world Embodied AI Learning (REAL-I) Challenge at ICRA 2026 examined this question through simulation, real-robot evaluation, and an on-site final on a shared dual-arm humanoid platform. We describe the challenge tasks, data and deployment interfaces, and competition results, then compare the approaches contributed by NUS-CLEAR, RCL-Lab, and Deeptouch.ai. Their systems combined pretrained vision-language-action models and task-specific imitation polici","tags":[],"cluster_size":1,"ts":"2026-09-15T04:00:00"},{"id":27361,"title":"Compositional Shift Algebra: Extrapolating Mixed Robot Shifts Without Mixed Finetuning","url":"https://arxiv.org/abs/2609.13651","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.13651v1 Announce Type: new \nAbstract: Robot deployments rarely change one mechanism at a time: cameras, action interfaces, and physical dynamics often shift together. Prior adaptation recipes either finetune a new model for every mix or attempt to select which module to update. We instead learn shift operators on a modular stack z{=}E(o), a{=}g(z,u), z'{=}f(z,a) and compose them. Compositional Shift Algebra (CSA) fits single-factor observation, policy, and dynamics operators from exact-reset probes, then extrapolates held-out mixed shifts by operator composition---without mixed-shif","tags":[],"cluster_size":1,"ts":"2026-09-15T04:00:00"},{"id":27360,"title":"How Well Do Pseudo-Rigid Body Models Capture Real Plants? In-Field Validation of Simulated Blueberry Canes","url":"https://arxiv.org/abs/2609.13627","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.13627v1 Announce Type: new \nAbstract: Many labor-intensive tasks in fruit production such as pruning require physically interacting with the plant (e.g., pushing, pulling, bending limbs, etc.). Due to increasing labor shortages, there is widespread interest in the adoption of robotics in this area. When the robot must physically interact with the system, a deformable model of the plant is beneficial. Coupled, spring-loaded beams have been used in prior work to build deformable plant models in simulation for learning, planning, and control, but this approach has rarely been validated","tags":[],"cluster_size":1,"ts":"2026-09-15T04:00:00"},{"id":27359,"title":"From Vision to Harvest: Benchmarking Vision-Language Models for Multi-Arm Robotic Fruit Harvesting","url":"https://arxiv.org/abs/2609.13606","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.13606v1 Announce Type: new \nAbstract: Multi-arm robotic harvesting offers a promising path to improve harvesting efficiency and reduce reliance on manual labor. However, practical deployment remains challenging because the system must generalize across diverse environments while efficiently coordinating multiple arms in a shared workspace. Existing methods often require substantial data collection in target environments or rely on simplifying assumptions that limit planning quality. In this work, we introduce the first comprehensive benchmark for evaluating pretrained Vision-Languag","tags":[],"cluster_size":1,"ts":"2026-09-15T04:00:00"},{"id":27358,"title":"An MRI-Guided Robotic System to Improve Hippocampal Access for Epilepsy Interventions","url":"https://arxiv.org/abs/2609.13572","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.13572v1 Announce Type: new \nAbstract: This paper presents an MRI-guided robotic system that improves hippocampal access by delivering a curved needle-like laser ablator through the foramen ovale, a natural opening in the base of the skull. Both the delivery path and the curved nature of the needle improve upon current clinical straight-line laser interstitial thermal therapy (LITT) as measured by hippocampal cannulation percentage. We describe the design of the robotic system which includes positioning, aiming, and curved needle deployment stages, followed by experimental results as","tags":[],"cluster_size":1,"ts":"2026-09-15T04:00:00"}]}]};

  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
