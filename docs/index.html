nt\u003e","tags":[],"cluster_size":1,"ts":"2026-06-24T22:36:39"},{"id":5381,"title":"Natera股价上涨，日本批准其癌症检测产品","url":"https://wallstreetcn.com/livenews/3124270","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"癌症检测制造商Natera宣布，其Signatera检测产品已获得日本监管批准后，Natera股价收涨10.74%，创2025年8月以来最大单日涨幅。\n\n日本药品和医疗器械管理局（PMDA）的批准，支持将Signatera用于结直肠癌（CRC）患者的辅助治疗。\n\nLeerink Partners分析师Puneet Souda认为，日本PMDA的批准对NTRA是“一个增量利好，因为日本的临床实践指南已经支持经过临床验证的ctDNA MRD（分子残留病灶）检测”。“我们仍认为这一批准扩大了其潜在市场规模（TAM），且未来可能会有包括肌层浸润性膀胱癌（MIBC）在内的更多适应症获批。”\n\nRBC Capital Markets分析师Dan Leonard表示，PMDA的批准符合预期，并进一步巩固了日本市场作为重要增量机会的地位，“尽管我们预计该市场达到有意义的规模还需要一段时间”。\n\nPiper Sandler分析师David Westenberg说：“我们认为这是一个对 Natera 具有重大意义的催化剂，尤其是考虑到日本市场的有利环境。尽管从历史上看，专业诊断领域的国际市场机会有限，但日本具备某些因素，可能使其成为独特且高度契合的市场。”","tags":[],"cluster_size":1,"ts":"2026-06-24T22:32:08"},{"id":5382,"title":"纳指期货亚太盘初涨2.2%，美光科技给出的业绩展望强劲","url":"https://wallstreetcn.com/livenews/3124259","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四亚太盘初，纳斯达克100股指期货涨2.2%，标普股指期货涨0.7%，道指期货涨0.2%，罗素2000股指期货涨0.3%。\n\n个股中，高通美股盘后涨13.49%，美光科技涨13.49%，闪迪涨10.4%，西部数据涨10.1%，希捷科技涨9.6%，英特尔涨4.6%，台积电涨3.1%。","tags":[],"cluster_size":1,"ts":"2026-06-24T22:01:44"},{"id":5383,"title":"纳斯达克生物科技指数收涨超1.52%，成分股Absci涨35.96%，Silence Therapeutics涨26.00%，\n\nAardvark Therap","url":"https://wallstreetcn.com/livenews/3124256","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克生物科技指数收涨超1.52%，成分股Absci涨35.96%，Silence Therapeutics涨26.00%，\n\nAardvark Therapeutics、Definium Therapeutics、Black Diamond、Personalis、Adaptive Biotechnologies涨17.73%-12.25%。\n\nAbivax ADR则收跌5.98%，QuantumSi跌6.00%，First Tracks Biotherapeutics跌6.13%，Neumora Therapeutics跌9.32%，Spyre Therapeutics跌11.14%。","tags":[],"cluster_size":1,"ts":"2026-06-24T21:37:36"},{"id":5384,"title":"周三（6月24日）纽约尾盘，标普500股指期货最终涨0.58%，道指期货涨0.59%，纳斯达克100股指期货涨1.49%。\n\n罗素2000股指期货涨0.79%。","url":"https://wallstreetcn.com/livenews/3124243","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（6月24日）纽约尾盘，标普500股指期货最终涨0.58%，道指期 CBMifEFVX3lxTE9vdjRfZE9CRDl2REZqSG9NUEg5T1hyR2hEcG83Rmk4Z3QtWnU0RDBOVFJfVVpHUV9ScC1vejBQMGdXRFNMc2ZucjYyLURkQkMyc2plOTUtQS1pMGZuX05hd1c4ZmJiLXNyTnNhZ2tiLWF3bEsyYjhvenQxVVo?oc=5\" target=\"_blank\"\u003eMorgan Stanley doubles China humanoid robot shipment forecast to 50,000 units\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eCrypto Briefing\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-24T06:48:12"},{"id":5473,"title":"Enabling Robust Cloth Manipulation via Inference-Time Simulator-in-the-Loop Refinement","url":"https://arxiv.org/abs/2606.24552","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24552v1 Announce Type: new \nAbstract: Simulator-in-the-loop optimization offers a promising inference-time mechanism for robot manipulation. It uses a physical simulator as a backend rollout engine to evaluate candidate trajectories in parallel and refine nominal actions online, a paradigm proven effective in rigid-body manipulation where state and contact are relatively tractable. We bring this paradigm to real-world cloth manipulation from a single RGB input through three pillars. (i) We design a scalable synthetic-data generation and inference-time rollout pipeline built on FLASH","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5472,"title":"Decentralized Pose Graph Riemannian Optimization for Object-based Multi-Robot SLAM","url":"https://arxiv.org/abs/2606.24489","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24489v1 Announce Type: new \nAbstract: Pose graph optimization (PGO) is a key back-end component for state estimation in networked multi-robot simultaneous localization and mapping (SLAM). In object-based multi-robot SLAM, the problem becomes more tightly coupled because robots must jointly estimate both their trajectories and the poses of persistent objects observed by multiple agents. Existing decentralized solutions often assume that the communication graph closely matches the physical interaction topology, which is restrictive in realistic deployments where communication is spars","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5471,"title":"G$^3$VLA: Geometric inductive bias for Vision-Language-Action Models","url":"https://arxiv.org/abs/2606.24472","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24472v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have made rapid progress in generalist robot manipulation by harnessing semantic knowledge from pretrained vision-language backbones, but their visual tokens remain grounded in 2D image coordinates rather than the calibrated geometry of the robot's cameras -- a mismatch especially pronounced in multi-camera setups, where views are coupled by known intrinsics and extrinsics yet processed as independent images. We propose G$^3$VLA, a camera-aware geometric module that injects calibrated structure into the visual","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5470,"title":"FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation","url":"https://arxiv.org/abs/2606.24466","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24466v1 Announce Type: new \nAbstract: Legged manipulators combine the mobility of legged platforms with the manipulation capability of robotic arms. However, arm-induced Center-of-Mass shifts and dynamic disturbances make the system more prone to instability under actuator failures, potentially leading to falls, task failures, or safety risks. Existing fault-tolerant control methods mainly focus on locomotion alone, leaving the coupled problem of whole-body stability and arm reachability in fault-tolerant loco-manipulation largely unaddressed. To bridge this gap, we propose FT-WBC,","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5469,"title":"Varying Bundle Size Reactive Multi-Task Assignment using Selective Cost Estimation for Multi-Agent Systems","url":"https://arxiv.org/abs/2606.24462","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24462v1 Announce Type: new \nAbstract: This paper presents a scalable framework for multi-robot task allocation in complex environments where estimating task execution costs is computationally expensive. While combinatorial auction-based approaches offer reliable solutions, the exponential complexity of bundle generation typically renders them intractable for real-time reactive applications, particularly when accurate path planning is required for cost validation. We address this through a distributed, two-stage multi-fidelity bundle generation approach. Agents utilize a local search","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5468,"title":"NoContactNoWorries: Estimating Contact through Vision and Proprioception for In-Hand Dexterous Manipulation","url":"https://arxiv.org/abs/2606.24450","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24450v1 Announce Type: new \nAbstract: Perceiving physical contact is fundamental to dexterous manipulation. While robots often rely on dedicated hardware tactile sensors, humans exhibit a remarkable ability to infer contact by integrating visual information with an innate sense of their body's pose and movement. Inspired by this embodied perceptual skill, we investigate whether a robot can learn to infer contact from vision, an approach that also offers a scalable alternative to tactile hardware specifically for binary contact estimation, which faces practical challenges in cost, fr","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5467,"title":"Supervise What Survives: Geometry-Guided VLA Adaptation from Synthetic Robot Videos","url":"https://arxiv.org/abs/2606.24448","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24448v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models require large-scale video-action pairs, yet real teleoperation remains scarce. While generated robot videos offer a scalable alternative, existing methods treat them as real robot data by recovering pseudo-actions from synthesized pixels. We argue that deriving low-level control from generated visuals is a mismatched abstraction. A video captures only \\emph{geometry}: the spatial trajectory representing the \\emph{where} of a task. A real demonstration captures \\emph{control}: the exact motor commands represent","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5466,"title":"Legible and Intuitive Multi-modal Robot State and Intent Communication Validated in Online and Real-world Studies","url":"https://arxiv.org/abs/2606.24445","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24445v1 Announce Type: new \nAbstract: Effective robot-to-human communication can increase transparency and trust, reduce uncertainty, and contribute to safer collaboration in shared workspaces. Designing and validating an effective robot communication strategy is challenging due to the varying and often limited communication modalities across robots, differences in how diverse recipients interpret messages, and the underexplored virtual-to-real gap in studies of communication legibility. We present a systematic, large-scale comparative validation of existing communication strategies","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5465,"title":"RE4: Transformation-aware Imitation of Object Interactions Using Manipulation Modes","url":"https://arxiv.org/abs/2606.24403","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24403v1 Announce Type: new \nAbstract: Object interaction tasks have been a focus of advances in imitation learning. End-to-end methods, dominated by diffusion and flow-based variants have shown leaps in performance while sacrificing interpretability. Object-centric and pose-informed variants have had a role in learning from demonstration in manipulation tasks. In this paper, we revisit a few modern imitation learning benchmarks for object interactions, with the aim of composing a framework that repurposes principled theories of manipulation, preserving both performance and interpret","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5464,"title":"PDS Joint: A Parametric Double-Spiral Joint Tailored for Dexterous Hands","url":"https://arxiv.org/abs/2606.24377","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24377v1 Announce Type: new \nAbstract: Compliant joints can embed safety and adaptability into dexterous hands, but achieving large-stroke anthropomorphic motion while maintaining joint-specific, directiondependent stiffness and reliable proprioception remains challenging. This paper presents the PDS joint, a parametric doublespiral (PDS) compliant joint that enables systematic shaping of directional stiffness across multiple deformation modes, including flexion/extension, abduction/adduction, and pronation/supination. We instantiate the joint using Archimedean and logarithmic spiral","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5463,"title":"SlipSense: Multimodal Sensing for Online Slip Detection in Legged Robots","url":"https://arxiv.org/abs/2606.24350","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24350v1 Announce Type: new \nAbstract: Legged robots rely on accurate ground interaction awareness to traverse variable terrains, such as slippery surfaces. Existing slip detection methods often rely on kinematics and proprioception, which lack the sensitivity to detect early-stage slips that occur prior to catastrophic instability. Thus, this paper presents SlipSense, a novel framework for online force-based slip detection using a custom lightweight sensorized foot for quadrupeds to detect slip. The framework integrates a multimodal sensor design with a LSTM-based model to infer gro","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5462,"title":"RoBoSR: Structured Scene Representations for Embodied Robotic Reasoning","url":"https://arxiv.org/abs/2606.24338","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24338v1 Announce Type: new \nAbstract: Despite rapid progress, embodied reasoning under real-world variability remains challenging. Existing approaches rely on demonstration-driven sequential biases, limiting flexibility in open-ended and long-horizon tasks that require structured reasoning over evolving states.\n  We introduce RoBoSR, an intermediate structural representation that formulates manipulation as step-wise state transitions over semantically grounded, object-centric scene graphs. By modeling object states and their spatial relations at the perception-action interface, RoBo","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5461,"title":"Grounding Generative Policies in Physics: Optimization-Guided Diffusion for Robot Control","url":"https://arxiv.org/abs/2606.24208","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24208v1 Announce Type: new \nAbstract: Diffusion models sample effectively from high-dimensional, multimodal distributions, but their outputs may violate deployment constraints. For task-space robot policies, generated grasps, waypoints, or trajectories can be distributionally valid yet infeasible, violating reachability, collision-avoidance, or closed-loop executability requirements. This embodiment gap limits zero-shot deployment across robots, even when the task-space behavior itself is transferable.\n  We propose an inference-time optimization framework that couples the behavior g","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5460,"title":"The Evaluation Cost of Task Specialization in Evolutionary Multi-Robot Systems","url":"https://arxiv.org/abs/2606.24191","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24191v1 Announce Type: new \nAbstract: Task specialization can improve the efficiency of multi-robot systems (MRSs). Previous works have investigated the emergence of task-specialist robot controllers through evolutionary optimization and have argued that task specialization is more likely to evolve when subtask behaviors are readily available as building blocks. However, the available evaluation budget must be distributed across all subtasks, whereas a single generalist behavior can exploit the entire budget for its own optimization. We present a cost-benefit analysis of evolving ta","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5459,"title":"DynaWM: Dynamics-Aware Distillation with World Model and Momentum Targets for Smooth Locomotion over Continuous Stairs","url":"https://arxiv.org/abs/2606.24089","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24089v1 Announce Type: new \nAbstract: Recent advances in control have enabled bipedal-wheeled robots to traverse slopes and single-step obstacles, yet long staircase traversal remains challenging as current teacher-student frameworks suffer from weakened dynamics-aware representations and incomplete terrain geometry encoding. To bridge this gap, we propose DynaWM, a dynamics-aware representation learning framework. To enhance terrain encoding capability and enable transparent assessment, we introduce a world model as a regularizer to enforce forward-dynamics awareness, preserving co","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5458,"title":"MinInter: Minimizing Trajectory Interpolation During Data Augmentation for Imitation Learning","url":"https://arxiv.org/abs/2606.24078","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24078v1 Announce Type: new \nAbstract: Imitation learning enables robots to acquire complex manipulation skills from demonstrations, but its effectiveness is limited by the cost of collecting high-quality data. Trajectory-level data augmentation methods alleviate this challenge by recombining expert demonstrations under varied initial states. However, such methods typically insert interpolations or other non-expert transition segments between disjoint parts, and such non-expert segments could reduce the quality of the generated data. This paper introduces Minimizing Interpolation (Mi","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5457,"title":"SPACE: Enabling Learning from Cross-Robot Data Toward Generalist Policies","url":"https://arxiv.org/abs/2606.24049","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24049v1 Announce Type: new \nAbstract: In robot learning, scaling training datasets across diverse embodiments and environments has become a dominant paradigm for learning generalizable robot policies. These policies are commonly trained via behavior cloning to imitate actions from pre-collected demonstrations. However, since robot actions are tied to the dynamics of the data collection robot, different robots may require different actions to achieve the same motion. This discrepancy hinders both policy training and deployment across diverse robots. To address this, we propose using","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5456,"title":"TurboMPC: Fast, Scalable, and Differentiable Model Predictive Control on the GPU","url":"https://arxiv.org/abs/2606.24039","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24039v1 Announce Type: new \nAbstract: Robotics increasingly relies on GPUs for parallel simulation, large-scale learning, and neural-network inference. For model predictive control (MPC) to scale with this paradigm, solvers must run efficiently on this hardware while remaining fast, differentiable, and compatible with expressive MPC formulations used in robotics. We present TurboMPC, a differentiable MPC solver that runs entirely on the GPU and supports state and control inequality constraints, implicit integrators, cross-time-coupled costs, and slack variables. TurboMPC combines se","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5455,"title":"Sim-to-Real Betting on the E-Process: Bringing \"simulators\" to anytime-valid confidence sequences","url":"https://arxiv.org/abs/2606.24038","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.24038v1 Announce Type: new \nAbstract: This note describes an integration of the sim-to-real performance estimate with betting (from Chen et al.) and the safe anytime-valid inference (from Ramdas et al.). Using the scaled simulators. The method produces efficient, reliable certificates for the mean estimate, an approach that is especially valuable in robot performance testing. This note gives a primary, self-contained account of the construction; preliminaries of the respective methods are kept at a minimum, and one shall refer to the original works for full detail. Some synthetic ex","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5454,"title":"Topological Online Learning for Displacement-based Formation Control","url":"https://arxiv.org/abs/2606.23901","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.23901v1 Announce Type: new \nAbstract: This paper addresses the problem of robust formation control by introducing Topological Online Learning for Displacement-based (TOLD) formation control, a real-time edge-level adaptation framework. Unlike conventional node-level robust controllers that regulate individual robot inputs without modifying the interaction topology, TOLD updates the interaction topology weights online to directly minimize formation distortion. Two strategies are proposed under the TOLD formation control framework: Online Gradient Flow (OGF) with unconstrained weights","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5453,"title":"Enforcing Human-like Kinematics in Dexterous Piano Playing via Adversarial Posture Regularization","url":"https://arxiv.org/abs/2606.23848","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.23848v1 Announce Type: new \nAbstract: Reinforcement learning can train bimanual dexterous hands to play piano in physics simulation with high note accuracy, but for high-DoF dexterous hands, relying solely on task rewards or IK inversion often leads to unnatural postures and joint overextension. We propose \\textit{Adversarial Posture Regularization (APR)}. It avoids expensive, song-aligned expert demonstration data and instead uses a small amount of casual human playing data. By matching the distribution of the posture of the policy with the human prior through an adversarial object","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5452,"title":"Engineering Reliable Autonomous Systems: Challenges and Solutions","url":"https://arxiv.org/abs/2606.23760","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.23760v1 Announce Type: new \nAbstract: Engineering reliable autonomous systems is an important and growing topic in computer science. As autonomous systems become more prevalent, easy-to-use techniques for building them reliably are increasingly important.\n  This workshop report captures and expands on the discussions at the Lorentz Center Workshop \"Engineering Reliable Autonomous Systems\" (ERAS), held from 10 to 14 June 2024. The workshop was co-organised by the organisers of the Workshop on Formal Methods for Autonomous Systems (FMAS) and the Workshop on Agents and Robots for relia","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5451,"title":"Verifiable Foundation Models for Robot Safety","url":"https://arxiv.org/abs/2606.23754","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.23754v1 Announce Type: new \nAbstract: Deploying foundation models for robot control raises a central challenge: the expressive power that enables rich, multimodal perception also makes these models opaque and difficult to analyze formally, rendering them intractable for existing verification tools. In this paper, we present FEARL (Foundation-Enabled Assured Robot Learning), a framework that addresses this tension through a modular architectural decomposition. FEARL separates the policy into a large Controller (C) responsible for high-dimensional perception and task reasoning, and a","tags":[],"cluster_size":1,"ts":"2026-06-24T04:00:00"},{"id":5051,"title":"消息称特斯拉Optimus3人形机器人量产计划加速，联合多家供应链厂商备货 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPLVA3ZUNFcHpfY2hNOWoxdmRGX2VNcWZYMlJ1Z3hORXB4Um9feVcxUkNVX1BjQWlpT1FEN3p3SVNUQlZ0MGxGeGJDRVM2azRJT0pDaF9IaWtCV01jV0laR2VURm1xc2h5cVgwRzk4LTlGNkE5UUF6VC1xWVZXeHkyUGJhYzVSbmE5?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPLVA3ZUNFcHpfY2hNOWoxdmRGX2VNcWZYMlJ1Z3hORXB4Um9feVcxUkNVX1BjQWlpT1FEN3p3SVNUQlZ0MGxGeGJDRVM2azRJT0pDaF9IaWtCV01jV0laR2VURm1xc2h5cVgwRzk4LTlGNkE5UUF6VC1xWVZXeHkyUGJhYzVSbmE5?oc=5\" target=\"_blank\"\u003e消息称特斯拉Optimus3人形机器人量产计划加速，联合多家供应链厂商备货\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-24T01:32:03"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
