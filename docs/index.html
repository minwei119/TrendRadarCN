oken工厂”新模式","url":"https://wallstreetcn.com/livenews/3142710","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"最新公告显示，行云科技此前签订的算力服务大单不仅迎来加单与提价，还迎来收费模式的变革——新增了“Token（词元）收入相关的固定服务费”。梳理发现，今年以来，已有润建股份、弘信电子、行云科技、超讯科技、南威软件等10多家上市公司宣布探索“Token工厂”业务。","tags":[],"cluster_size":1,"ts":"2026-07-30T23:30:30"},{"id":15740,"title":"A股上市券商百亿分红陆续兑现，回购计划增强投资者信心","url":"https://wallstreetcn.com/livenews/3142709","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"据统计，目前共有30家上市券商宣布，已经或在7月31日前完成2025年度现金红利的发放，还有10家的年度利润分配方案已经公布，但尚未明确实施日期。Wind数据显示，2025年，40家上市券商累计分红金额（已宣告）超过了700亿元，创历史新高。与此同时，年内还有多家上市券商正在推动股票回购计划，或注销过往回购的股权，以求提升公司股票的每股收益水平，增强投资者对公司的信心。","tags":[],"cluster_size":1,"ts":"2026-07-30T23:30:25"},{"id":15741,"title":"华尔街见闻早餐 | 2026年7月31日","url":"https://wallstreetcn.com/livenews/3142703","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"纳指收涨2.8%，芯片指数暴涨8%；微软飙升16%，市值单日大增4500亿美元，创个股历史之最；日本再干预，日元兑美元盘中暴涨超3%。\n\n中共中央政治局7月30日召开会议，会议分析研究当前经济形势，部署下半年经济工作。政治局会议九大信号：宏观政策要发力提效，务实管用的增量政策可期。\n\n何立峰与美国财政部长贝森特、贸易代表格里尔举行视频通话。\n\n中国商务部介绍近期中欧密集磋商进展：就“稳定、平衡的中欧关键贸易伙伴”新定位达成共识。\n\n美国二季度GDP年化增长1.5%不及预期，PCE物价指数上涨3.4%。美国6月PCE物价指数六年来首次环比下降，-0.1%，同比涨幅显著收窄。\n\n英国央行如期维持利率3.75%不变，但警惕通胀持续升温风险。\n\n报道：韩国监管层拟重启卖空禁令、缩小30%涨跌停板限制。\n\n苹果上季iPhone收入增22%略超预期，但服务和中国市场业绩逊色，示警供应短缺伤害。苹果电话会料供应限制拖累营收、本季最高增11%，低于分析师预期，股价盘后一度跌超8%。\n\n亚马逊Q2云业务增长超预期，但Q3指引不及预期、自由现金流转负、资本开支上调。电话会：服务器三年回本，在手订单近5000亿美元，“AWS有望年营破万亿美元”。股价盘后一度涨9%。\n\n宇树科技启动科创板IPO招股，拟发行4045万股，定于8月10日申购。\n\n提醒：日本央行周五将公布利率决议，中国周五将公布7月官方PMI","tags":[],"cluster_size":4,"ts":"2026-07-30T23:25:15"},{"id":15742,"title":"Monolithic Power业绩强劲且指引超预期，股价盘后大涨","url":"https://wallstreetcn.com/livenews/3142700","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"在半导体设备公司公布了超预期的第二季度业绩，并给出高于分析师共识的营收预测后，芯源系统（Monolithic Power Systems）股价在盘后交易中上涨10%。\n\n该公司第二季度调整后每股收益（EPS）为6.50美元，同比增长，分析师预期5.87美元。\n\n二季度营收9.806亿美元，同比增长48%，分析师预期9.033亿美元。\n\n二季度调整后毛利率55.6%（去年同期为55.5%），分析师预期55.6%。\n\n二季度调整后营业费用1.776亿美元，同比增长29%，分析师预期1.69亿美元。\n\n二季度调整后税前利润3.766亿美元，同比增长58%，分析师预期 3.405亿美元。\n\n预计第三季度营收11.4亿-11.6亿美元，分析师预期9.864亿美元。\n\n预计三季度调整后毛利率55.4%-56%，分析师预期55.7%。\n\n预计三季度调整后营业费用2.012亿-2.052亿美元，分析师预期1.793亿美元。\n\n公司董事会已批准额外增加5亿美元的股票回购计划。","tags":[],"cluster_size":1,"ts":"2026-07-30T23:10:47"},{"id":15743,"title":"多地中小银行调降存款利率，部分银行将中短期存款作为营销重点","url":"https://wallstreetcn.com/livenews/3142690","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，浙江、云南、贵州等地城商行、农商行以及村镇银行密集发布存款利率调整公告，五年期定期存款利率步入“1”字头，部分银行出现利率倒挂（期限越长，利率反而越低）现象。与此同时，记者调研发现，一些银行开始将一年期等中短期存款产品作为营销重点。“现在银行的存贷息差普遍较薄，若还要卷存款成本，那么只会拖累盈利情况。”浙江省内一家城商行人士说。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-30T22:48:16"},{"id":15744,"title":"银行补血利器遇阻，转债转股止步估值洼地","url":"https://wallstreetcn.com/livenews/3142688","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月27日，浦发银行发布公告称，国家金融监督管理总局已同意该行注册资本增加至333.06亿元。值得注意的是，浦发银行此次股本变动是因浦发转债转股。该行于2019年发行面值总额500亿元A股可转债，截至到期日，累计转股39.54亿股。几天前，紫银转债也到期摘牌，不同于浦发转债，该债券未转股比例99.98%，发行人最终以真金白银完成兑付。可转债曾被视为中小银行的资本补充利器，今年以来银行转债发行市场低迷，存量可转债规模萎缩，转股比例不理想，部分银行资本补充面临挑战。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-30T22:46:51"},{"id":15745,"title":"7月30日恒生中国企业ETF易方达基金份额增加2400万份，重仓股腾讯控股、建设银行、阿里巴巴 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE5QUW1KVXN4bkpkSkppYUc3dnZ1S1ZaZkV2Z1NXRUlGY3VsRDFrY0VkbFo0OTZFMFBSMkszb0N2RjFJbnJUUC1ld1hMNVZoRkszQzZGekswZ2dWdmg5cnd1TGFn?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE5QUW1KVXN4bkpkSkppYUc3dnZ1S1ZaZkV2Z1NXRUlGY3VsRDFrY0VkbFo0OTZFMFBSMkszb0N2RjFJbnJUUC1ld1hMNVZoRkszQzZGekswZ2dWdmg5cnd1TGFn?oc=5\" target=\"_blank\"\u003e7月30日恒生中国企业ETF易方达基金份额增加2400万份，重仓股腾讯控股、建设银行、阿里巴巴\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-30T22:31:45"},{"id":15746,"title":"极智嘉港交所公告，美国业务运营维持全面运作。","url":"https://wallstreetcn.com/livenews/3142675","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"极智嘉港交所公告，美国业务运营维持全面运作。","tags":[],"cluster_size":1,"ts":"2026-07-30T22:12:09"},{"id":15747,"title":"Fortescue预计全财年铁矿石发运量为1.97亿-2.07亿吨","url":"https://wallstreetcn.com/livenews/3142761","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"Fortescue公司2026财年四季度铁矿石发运量5270万吨。\n\n第四财季资本支出及投资11亿美元，铁矿石开采量6490万吨，皮尔巴拉赤铁矿C1现金成本每湿吨19.37美元。\n\n2026财年全年铁矿石发运量2.013亿吨，同比增长1.5%。\n\n全财年赤铁矿C1现金成本 每湿吨18.74美元，同比增长4.2%。\n\n预计2027财年全年铁矿石发运量为1.97亿-2.07亿吨。\n\n预计金属业务资本支出37亿-47亿美元，能源业务净运营支出约3亿美元，皮尔巴拉赤铁矿C1现金成本每湿吨20.50-21.75美元。\n\n公司继续与中国矿产资源集团（China Mineral Resources Group）保持沟通与合作。\n\n预计将计提约5.25亿美元的减值费用，该费用与铁桥（Iron Bridge）项目相关。\n\n在考量了Iron Bridge项目修订后的产能爬坡计划及一系列生产场景（包括2200万吨/年的设计产能）后，Fortescue预计将在2026财年业绩中确认约5.25亿美元的税后非现金减值费用。","tags":[],"cluster_size":1,"ts":"2026-07-30T22:08:35"},{"id":15748,"title":"周五亚太盘初，纳指期货涨超0.5%，标普股指期货、道指期货涨超0.1%。\n\n苹果目前（美股盘后）跌超6.5%，该公司电话会已经结束；微软跌0.7%，台积电、AM","url":"https://wallstreetcn.com/livenews/3142674","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周五亚太盘初，纳指期货涨超0.5%，标普股指期货、道指期货涨超0.1%。\n\n苹果目前（美股盘后）跌超6.5%，该公司电话会已经结束；微软跌0.7%，台积电、AMD、希捷科技、英特尔、西部数据、闪迪涨1.34%-5.07%，发布了业绩报告的亚马逊涨9.3%。","tags":[],"cluster_size":1,"ts":"2026-07-30T22:03:14"},{"id":15749,"title":"淡水河谷二季度净营收105亿美元，分析师预期104.3亿美元。\n\n二季度净利润13.8亿美元，分析师预期19.7亿美元。\n\n二季度资本开支11.3亿美元，同比增","url":"https://wallstreetcn.com/livenews/3142671","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"淡水河谷二季度净营收105亿美元，分析师预期104.3亿美元。\n\n二季度净利润13.8亿美元，分析师预期19.7亿美元。\n\n二季度资本开支11.3亿美元，同比增长7.1%。\n\n二季度形式上（Pro Forma）EBITDA为40.7亿美元，分析师预期38.1亿美元。\n\n（公司董事会）批准向股东派息每股2.03巴西雷亚尔。","tags":[],"cluster_size":1,"ts":"2026-07-30T21:47:10"},{"id":15750,"title":"周四（7月30日）纽约尾盘，标普500股指期货最终涨1.73%，道指期货涨1.30%，纳斯达克100股指期货涨3.71%。\n\n罗素2000股指期货涨1.40%。","url":"https://wallstreetcn.com/livenews/3142664","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四（7月30日）纽约尾盘，标普500股指期货最终涨1.73%，道指期货涨1.30%，纳斯达克100股指期货涨3.71%。\n\n罗素2000股指期货涨1.40%。","tags":[],"cluster_size":1,"ts":"2026-07-30T21:27:29"},{"id":15751,"title":"库克称苹果Q2在中国大陆等新兴市场和部分发达市场打破纪录，公司股价盘后跌幅仍然扩大至5%","url":"https://wallstreetcn.com/livenews/3142654","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"苹果公司CEO库克表示，尽管面临供应链限制和汇率逆风，苹果依然取得了响应的业绩。\n\n尽管面临逆风，6月当季仍创下纪录。他正在大力推介公司的最新产品。他表示，苹果“全面”表现强劲，在印度、中国大陆、日本和东南亚均创下历史新高。同时，在部分发达市场和新兴市场也打破了纪录。\n\n库克正在谈论Siri AI，表示开发者和公众测试版的反馈非常强烈。他表示收到的评价“极为出色”，这些成果“印证”了公司的AI战略。\n\n库克引用IDC数据称，iPhone在当季市场份额有所提升。\n\n苹果美股盘后跌幅扩大至5%。","tags":[],"cluster_size":1,"ts":"2026-07-30T21:05:58"},{"id":15752,"title":"阿里巴巴期权聚焦：7月30日成交8.34万张，未平仓合约225.75万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxQdU44eTBNOGQxYzVCNDZyRFlPM0plTU9GcWU1WnZ6cThFZ0RST2tqdE8xYU8tNEQzTWFBMFNZa2dBTnhuRzcwbXlaNHZrODlrMXY2NTRiWU4yVFU4NmpWWjB6SFFfZldVck94STdtd3NlQ3lha253bGJ6aGZ5STc0V1pWV0otbHZHLXV0eVpTSnJUS1N5dnp6UFBTejNGd2lOVnVvcldYMA?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxQdU44eTBNOGQxYzVCNDZyRFlPM0plTU9GcWU1WnZ6cThFZ0RST2tqdE8xYU8tNEQzTWFBMFNZa2dBTnhuRzcwbXlaNHZrODlrMXY2NTRiWU4yVFU4NmpWWjB6SFFfZldVck94STdtd3NlQ3lha253bGJ6aGZ5STc0V1pWV0otbHZHLXV0eVpTSnJUS1N5dnp6UFBTejNGd2lOVnVvcldYMA?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月30日成交8.34万张，未平仓合约225.75万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-30T20:30:00"},{"id":15753,"title":"马云与17位合伙人创立了阿里巴巴，如今他们怎样了？ - 163.com","url":"https://news.google.com/rss/articles/CBMiVEFVX3lxTE1UdzROb2luNVdRWGFjUlREd0h4dHlrcmVCb3Z6Vk1rSGY1emRsR1M5S28yaFdsMGJMZEhsQmVYR2pscTAzWUhTZHlKUWU4RnQ3Qjg1aA?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVEFVX3lxTE1UdzROb2luNVdRWGFjUlREd0h4dHlrcmVCb3Z6Vk1rSGY1emRsR1M5S28yaFdsMGJMZEhsQmVYR2pscTAzWUhTZHlKUWU4RnQ3Qjg1aA?oc=5\" target=\"_blank\"\u003e马云与17位合伙人创立了阿里巴巴，如今他们怎样了？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e163.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-30 家 7 月 31 日消息，特斯拉中国今日公布了 \u003cstrong\u003e2026.14.13 版本\u003c/strong\u003e的车机软件更新，覆盖 Model 3、Model Y、Model S、Model X 车型。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"261e\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/59545f80-d793-4c7f-ad16-fc34a3f424c2.jpg?x-bce-process=image/format,f_auto\" w=\"576\" h=\"406\" data-weibo=\"0\" data-mpos=\"2,0\"  data-vmark=\"95ac\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"0001\"\u003e2026 年 07 月 31 日已开始分批次推送，IT之家附本次软件更新主要升级内容如下：\u003c/p\u003e\u003cul class=\" list-paddingleft-2\"\u003e\u003cli\u003e\u003cp data-vmark=\"96d4\"\u003e\u003cstrong\u003e安全改进\u003c/strong\u003e：修复内存越界访问、CAN 总线缓冲区溢出和符号链接条件竞争的漏洞。\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data","tags":[],"cluster_size":1,"ts":"2026-07-31T01:18:16"},{"id":15955,"title":"库克：苹果已获准在中国推出首批“Apple 智能”功能，未来的 Siri AI 还处于起步阶段","url":"https://www.ithome.com/0/983/944.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"6ac9\"\u003eIT之家 7 月 31 日消息，苹果现任 CEO 蒂姆 · 库克（Tim Cook）今天在 2026 财年第三季度电话会议中确认，苹果公司已在中国获准推出首批“Apple 智能”（Apple Intelligence）功能。\u003c/p\u003e\u003cp data-vmark=\"5a8f\"\u003e问答环节中，摩根大通分析师萨米克 · 查特吉（Samik Chatterjee）问库克：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"6ff5\"\u003e我的第一个问题想回到 WWDC。当时你们宣传 Siri AI 时提到，你们可能不会在中国大陆和欧洲率先推出 Siri AI。我现在想问问这方面的最新进展，以及如果要在这些地区推出 Siri AI，还需要跨越何种障碍？\u003c/p\u003e\u003c/blockquote\u003e\u003cp data-vmark=\"11ce\"\u003e库克对此回答道：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"50fe\"\u003e感谢你的提问，我将分别回答两个地区的问题。\u003c/p\u003e\u003cp data-vmark=\"583b\"\u003e如果先看欧盟，我们正在和欧盟委员会密切合作。显然我们希望的情况是能够在全球所有地区同步推出所有功能，这一直是我们的理念。\u003c/p\u003e\u003cp data-vmark=\"e7e5\"\u003e但目前我们还无法在欧盟推出 Siri AI。但我们正在与他们紧密合作，努力寻求","tags":[],"cluster_size":1,"ts":"2026-07-31T01:17:45"},{"id":15956,"title":"人形机器人“拐点”已至：产量只是下限，模型决定天花板 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9qOVJWTkJ0N29mOUdWY3MwUHRFb3RGVnh1OVpOUkliellrNm9lMmtQT2NQUGE3YjVrSEtUN \"\u003e这项研究追踪了 321 种职业的工资和就业数据。结果显示，AI 暴露度最高的岗位自 2023 年起，实际工资增速平均下降 6.7%。而这一时间点，大致与 ChatGPT 开始迅速走红相吻合。\u003c/p\u003e\u003cp data-vmark=\"a25b\"\u003e阿波罗分析师萨尼娅 · 埃德利希和首席经济学家托尔斯滕 · 斯洛克在报告中写道，研究尚未发现 AI 对整体就业产生“可检测”的影响。\u003c/p\u003e\u003cp data-vmark=\"27ce\"\u003eIT之家从数据中获悉，低收入劳动者受到的工资冲击最为明显。自 2023 年以来，服务业劳动者的收入\u003cstrong\u003e增速平均下降 24.3%\u003c/strong\u003e，收入位于后 25% 的劳动者工资下降 10.7%。收入最高的劳动者群体则没有受到“显著影响”。\u003c/p\u003e\u003cp class=\"isSelectedEnd\" data-vmark=\"5e51\"\u003e研究人员还采用了 Anthropic 经济指数，根据各职业任务中实际使用 Anthropic AI 工具完成的比例评估 AI 暴露度。\u003c/p\u003e\u003cp da","tags":[],"cluster_size":1,"ts":"2026-07-31T00:31:31"},{"id":15969,"title":"暂未上线测试的 5 项苹果 iOS 27 功能汇总：接入更多 AI、升级健康应用等","url":"https://www.ithome.com/0/983/927.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3086\"\u003eIT之家 7 月 31 日消息，科技媒体 9to5Mac 昨日（7 月 30 日）发布博文，梳理彭博社马克 · 古尔曼（Mark Gurman）等消息源此前爆料内容，\u003cstrong\u003e指出目前苹果正测试的 iOS 27 系统中，仍有 5 项传闻功能尚未现身。\u003c/strong\u003e\u003c/p\u003e\u003ch3 data-vmark=\"865c\"\u003e一、接入更多聊天机器人，以及扩展 Siri 体验\u003c/h3\u003e\u003cp data-vmark=\"4d55\"\u003eiOS 27 的搜索（Search）和询问（Ask）界面已提供入口，可以切换调用的 AI 模型，不过现阶段除了 Siri 之外，用户只能选择 OpenAI 的 ChatGPT 聊天机器人。\u003c/p\u003e\u003cp data-vmark=\"7c5e\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/23afdae6-017a-4ad5-a507-3f2890801af6.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"720\" data-weibo=\"0\" data-vmark=\"2feb\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=","tags":[],"cluster_size":1,"ts":"2026-07-31T00:17:03"},{"id":15970,"title":"OpenAI大幅降价！GPT-5.6 Luna下调80%：性价比超DeepSeek V4 Pro - 驱动之家","url":"https://news.google.com/rss/articles/CBMiWEFVX3lxTE9sQXY1TXkwQl9UeVUzZDdyZ0tKdmo1OUNoaFRaZVdWWmE4VjhvdVZHS014Tl9uSmxudmctekF3c1VZU2xsOUxEa2lQZU4yTWN2SXFZVVNqX1Q?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiWEFVX3lxTE9sQXY1TXkwQl9UeVUzZDdyZ0tKdmo1OUNoaFRaZVd arxiv.org/abs/2607.26985","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26985v1 Announce Type: new \nAbstract: Deep reinforcement policy learning directly in physical robots (on-robot learning) remains bottlenecked by slow wall-clock training times. We present SymmGrid, a trajectory level augmentation framework inspired by parallelized symmetries that super-scales group transformations to significantly accelerate on-robot learning in both egocentric and exocentric visual setups. We model a Markov Decision Process (MDP) under a symmetry tree, in which state-action pairs have admissible parallelized invariant transformations that yield a geometric grid str","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15926,"title":"BioVLN: A Simulation Platform for Visual Language Navigation in Biomedical Laboratories","url":"https://arxiv.org/abs/2607.26914","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26914v1 Announce Type: new \nAbstract: Biomedical laboratory robots must navigate to instruments before performing experimental procedures. Existing embodied navigation platforms are designed for household environments and treat a target as an object center or an arbitrary nearby position. This representation is inadequate for laboratory instruments, which must be approached from their operating side while maintaining safe clearance from surrounding equipment. We introduce BioVLN, a simulation platform for developing and evaluating visual-language navigation agents in biomedical labo","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15925,"title":"NeoRacer: An Open, Standardized 1:12 Scale Autonomous Race Car for Benchmarking and Education","url":"https://arxiv.org/abs/2607.26855","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26855v1 Announce Type: new \nAbstract: Many scientific fields rely on standard benchmarks and shared platforms to improve review and reproducibility, but autonomous systems research still lacks widely accepted open hardware. Where standardization has emerged, progress has accelerated. This is especially evident in autonomous racing, where teams often build custom systems or buy niche, expensive vehicles, making control and robotics research and education hard to compare and reproduce. High costs also limit access outside well-funded labs, while affordable educational robots are often","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15924,"title":"Practice Makes Policies: Bootstrapping and Consolidating Robotic Capabilities from Zero Human Demonstrations","url":"https://arxiv.org/abs/2607.26809","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26809v1 Announce Type: new \nAbstract: General-purpose robotic manipulation requires robots to perform diverse tasks in open-world environments while improving their skills over time. Despite recent progress in robotic manipulation, existing systems still primarily acquire manipulation skills in a static manner, where capabilities are learned for specific tasks or settings rather than adaptively evolving through physical interaction. Resembling how repeated practice enables humans to develop muscle memory, advanced manipulation proficiency requires an autonomous capability evolution","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15923,"title":"Route by Kinematics, Act by Observation: Kinematics-Supervised Expert Routing in MoE-Augmented VLA","url":"https://arxiv.org/abs/2607.26807","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26807v1 Announce Type: new \nAbstract: While MoE augments VLA via expert specialization, router suffers from ineffective expert routing owing to the kinematic heterogeneity of actions across manipulation tasks and, even worse, the unavailability of the kinematic signals at inference time. In this work, we first observe that most semantically distinct manipulation tasks reduce to multiple kinematic archetypes. Motivated by this finding, we propose Kinematics-supervised explicit routing (KinRT), a new paradigm that shifts from implicit, observation-driven expert routing to explicit, ki","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15922,"title":"CheckVLA: Execution-Time Verification with Action-Conditioned World Model for Long-Horizon Mobile Manipulation","url":"https://arxiv.org/abs/2607.26789","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26789v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies commonly execute long-horizon mobile manipulation through open-loop action chunks, issuing multiple actions without receiving new high-level visual input. A committed chunk therefore implies how observations should evolve, but accidental deviations can violate this expectation while the remaining actions continue to propagate the error: commit-time policy confidence cannot react to a deviation that occurs after dispatch, and observation-only anomaly scores lack an action-conditioned reference for separating","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15921,"title":"Vision-TL-Action: Neuro-Symbolic Trajectory Generation from Visual Observations and Temporal Logic","url":"https://arxiv.org/abs/2607.26770","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26770v1 Announce Type: new \nAbstract: Temporal logic (TL) provides a compositional language for the formulation of long horizon robotic tasks, but existing TL-conditioned trajectory generators can sidestep perception-to-symbol binding by encoding exact object geometry in the task graph. We introduce \\emph{Vision-TL-Action}, which generates action trajectories from multi-view images, a coordinate-free TL syntax graph, and the robot initial state. TL-node tokens and spatial visual tokens are fused through bidirectional cross-attention, and the resulting representation conditions a flo","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15920,"title":"Enfold: Folding World-Generator Computation into Predictive Representations for Efficient Embodied Control","url":"https://arxiv.org/abs/2607.26657","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26657v1 Announce Type: new \nAbstract: World generative models are typically used through what they produce: a rendered future, a video-conditioned action, or latent context computed by a costly generative branch. We argue that their more reusable asset is the computation that constructs a future. As a generator transforms a corrupted future into a coherent trajectory, its intermediate states organize appearance, spatial layout, and interaction across levels of abstraction. Can this future-generative computation be internalized in a representation inferred from the present alone? We","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15919,"title":"ContactFlow: A video action conditioning that transfers across embodiments","url":"https://arxiv.org/abs/2607.26579","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26579v1 Announce Type: new \nAbstract: World models offer a promising route toward robot planning by enabling agents to imagine and verify the consequences of actions before execution. However, current video-based world models often struggle to capture the physical constraints that govern manipulation, particularly contact. Further, their action conditioning is often constrained to specific embodiments such as parallel grippers. We propose \\emph{Contact Flow}, an embodiment-agnostic action representation that encodes manipulation through the trajectory of 3D contact points between an","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15918,"title":"Speech2Grasp: Data-Efficient Transfer of Text-Conditioned Grasp Detection to Speech in Humanoid Robots","url":"https://arxiv.org/abs/2607.26567","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26567v1 Announce Type: new \nAbstract: Humanoid robots increasingly require multi-modal understanding for natural interaction with humans. Despite the prominence of vision-language models, they generally assume textual rather than the more natural speech inputs. In this paper, we investigate whether a well-established text-conditioned model can be transferred to speech in a data-efficient manner. Using ALBEF as a case study, we conduct diagnostic analyses showing that a lightweight MLP-based projector effectively adapts it to speech, while preserving semantic discrimination and robus","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15917,"title":"Explicit Kinematic Guidance from Analytic Concepts for Vision-Language-Action Models","url":"https://arxiv.org/abs/2607.26513","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26513v1 Announce Type: new \nAbstract: Current Vision-Language-Action (VLA) models rely mainly on 2D inputs, neglecting the rich object structural information and commonsense knowledge inherent in the 3D physical world. This deficiency restricts their spatial awareness and adaptability for complex, high-precision manipulation. To bridge this crucial gap, we construct a Concept Expert module for VLA to build executable Analytic Concepts that represent objects as explicit, programmatic blueprints. Our mechanism operates in two synergistic phases: First, prior to VLA inference, the Conc","tags":[],"cluster_size":1,"ts":"2026-07-30T04:00:00"},{"id":15916,"title":"RLMM-Flow: A Flow-based Mobile Manipulation Framework with Latent-Space Reinforcement Learning","url":"https://arxiv.org/abs/2607.26460","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.26460v1 Announce Type: new \nAbstract: Mobile manipulation requires generating whole-body action chunks that jointly satisfy goal reaching, collision avoidance, base kinematic constraints, manipulator // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
