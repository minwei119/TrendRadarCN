],"summary":"一、高管演示与陈述环节。\n\n1、交付创纪录与全自动驾驶（FSD）需求强劲。\n\n特斯拉实现创纪录的第二季度交付量，Model Y刷新全球销量纪录。在FSD获批地区，消费者购买意愿极高，FSD选装已成为最核心的需求驱动因素。随着全球多国审批推进，未来需求将持续激增。","tags":[],"cluster_size":1,"ts":"2026-07-22T23:01:27"},{"id":13114,"title":"多家上市银行成立市值管理小组","url":"https://wallstreetcn.com/livenews/3138466","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"又一家上市银行成立市值管理小组。7月20日，光大银行在“上证e互动”平台回答投资者提问时表示，在市值管理方面，该行坚定看好中国资本市场发展前景，已成立“市值管理小组”，全面统筹市值管理工作，积极维护公司价值和股东权益。此前，中信银行、招商银行均已宣布成立市值管理小组。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-07-22T23:00:24"},{"id":13115,"title":"理财公司集体发声：短期波动不改长期逻辑，多措应对“固收+”净值回撤","url":"https://wallstreetcn.com/livenews/3138465","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月22日，浙银理财发布《短期市场有波动，静待价值再修复——理性看待近期市场调整》的文章。截至目前，已有工银理财、农银理财、中银理财、兴银理财、信银理财、光大理财、平安理财等多家理财公司相继针对本轮A股市场调整发布研判观点。","tags":[],"cluster_size":1,"ts":"2026-07-22T22:57:08"},{"id":13116,"title":"私募掀起自购热潮，“均衡配置”应对市场波动","url":"https://wallstreetcn.com/livenews/3138464","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期A股经历一轮快速回调，前期拥挤度较高的科技板块持续承压。本周上半周，市场迎来反弹。多家私募表示，本轮调整属于拥挤交易出清，市场进一步下行空间有限。与此同时，7月私募自购队伍持续扩容，头部、中型私募持续掀起“自购潮”，成为市场情绪修复的重要支撑因素，并传递出积极的信号。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:55:28"},{"id":13117,"title":"“防守一波”还是“放手一搏”，基金经理积极把握布局节奏","url":"https://wallstreetcn.com/livenews/3138463","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"汹涌的AI科技行情过后，是出手进攻？还是专注防守？即便身为专业投资者，主动基金经理们也普遍持观望态度。二季度最新披露的股票持仓情况，折射出了他们的纠结与分歧。一方面，部分均衡派“选手”出手重仓科技股，比如朱少醒管理的富国天惠精选成长首度重仓中际旭创，周蔚文和冯炉丹共同管理的中欧新蓝筹首度重仓沪电股份，范妍管理的富国稳健增长首度重仓新易盛。另一方面，此前已经“上车”科技板块的选手开始寻求“安全感”，比如傅鹏博和朱璘共同管理的睿远成长价值大举减持中际旭创、东山精密，谢治宇管理的兴全合润也明显减持中际旭创以及华海清科。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:53:35"},{"id":13118,"title":"硬科技企业密集登陆，港股IPO市场活力持续释放","url":"https://wallstreetcn.com/livenews/3138462","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，港股IPO市场持续升温、活力迸发。Wind数据显示，截至7月22日，今年以来港股上市新股数量突破百家，硬科技企业稳居上市主力阵营，“A+H”双向上市通道持续升温。记者获悉，港交所筹备数月的上市机制优化方案预计不久将正式对外公布。业内人士认为，在制度改革持续深化、国际资本配置信心增强等因素驱动下，港股作为中国硬科技出海与全球资产配置核心平台的枢纽地位愈发稳固，2026年全年港股IPO市场延续高景气度值得期待。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:51:24"},{"id":13119,"title":"中国移动辽宁公司深耕“信号升格”服务高质量发展（附图片） - 新浪财经","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTE9XVm41Q0xhTU5GVlBNdkxueXhWbzIzNkpyWGdzQ3JyR2thQXhKd3hsMkYwMnllTk91dEFXMnFqT2ZSbUFLcXkxRFZXZ0czaWpPRzlwRkE3NTNHYVVHcHFWbjl3cV9Db0Q1bWRvaV84ZmdkTjdYRzVtRw?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTE9XVm41Q0xhTU5GVlBNdkxueXhWbzIzNkpyWGdzQ3JyR2thQXhKd3hsMkYwMnllTk91dEFXMnFqT2ZSbUFLcXkxRFZXZ0czaWpPRzlwRkE3NTNHYVVHcHFWbjl3cV9Db0Q1bWRvaV84ZmdkTjdYRzVtRw?oc=5\" target=\"_blank\"\u003e中国移动辽宁公司深耕“信号升格”服务高质量发展（附图片）\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-22T22:51:00"},{"id":13120,"title":"又一批沪市公司推出回购增持计划","url":"https://wallstreetcn.com/livenews/3138460","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月21日至22日，沪市公司回购、增持热度不减，以真金白银传递对公司长期投资价值的信心。据统计，近两日共新增17家公司披露回购计划，合计拟回购金额上限达21.96亿元，回购用途涵盖股权激励、员工持股和维护公司价值及股东权益等多个方向；新增3家公司披露重要股东增持计划，合计拟增持金额上限为2.4亿元；另有9家公司披露回购及增持相关进展公告。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:47:00"},{"id":13121,"title":"预定利率研究值二度上调，年内或难见保险产品集中调价","url":"https://wallstreetcn.com/livenews/3138459","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日获悉，中国保险行业协会组织召开人身保险业利率研究专家咨询委员会2026年二季度例会，保险业专家研究了人身保险产品预定利率研究值，提出当前普通型人身保险产品预定利率研究值为1.94%，较上季度微升，为连续2个季度上调。在业内人士看来，预定利率研究值再度上调，意味着在市场利率平稳的环境下，年内预定利率动态调整机制或不会被触发，保险产品预定利率和定价不太可能集中调整。对于消费者而言，无需过度担忧保险产品集中涨价。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:45:32"},{"id":13122,"title":"7月22日沪港深500ETF易方达基金份额增加300万份，重仓股腾讯控股、汇丰控股、阿里巴巴-W - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFA2eS1DSXVxSVhTV3hva0ZzYUdRdFVMSVlYWUNteWI4d014U3RkdFFwOVpNcVppODZRRzZDRmFyMTNLSGI1bklwc3ZMNDllWFZDd3p6WnM0cUtaXzU3TmFUVFl3?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFA2eS1DSXVxSVhTV3hva0ZzYUdRdFVMSVlYWUNteWI4d014U3RkdFFwOVpNcVppODZRRzZDRmFyMTNLSGI1bklwc3ZMNDllWFZDd3p6WnM0cUtaXzU3TmFUVFl3?oc=5\" target=\"_blank\"\u003e7月22日沪港深500ETF易方达基金份额增加300万份，重仓股腾讯控股、汇丰控股、阿里巴巴-W\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-22T22:38:56"},{"id":13124,"title":"境外发行人态度积极，熊猫债累计发行量突破1.3万亿元","url":"https://wallstreetcn.com/livenews/3138456","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，法国农业信贷银行在中国银行间债券市场完成2026年“首单”熊猫债发行，并实现多项突破：外资金融机构单笔最大发行规模、首次采用“3年+5年+7年”三期限组合，以及首发7年期品种，填补了长期限金融熊猫债的发行空白。中国人民银行数据显示：2026年上半年，熊猫债发行超过1600亿元，同比增长69%；截至6月末，熊猫债累计发行量超过1.3万亿元。业内人士认为，熊猫债市场正经历结构性增长，其吸引力不再局限于融资成本优势，功能也从简单的融资工具，升级为境外机构战略性配置人民币资产的重要通道。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-22T22:37:46"},{"id":13126,"title":"分析师：电话会进一步证实，特斯拉仍处于“建设模式”，可能会继续如此","url":"https://wallstreetcn.com/livenews/3138453","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"Karobaar Capital首席投资官Haris Khurshid表示，此次电话会议进一步证实，特斯拉仍处于“建设模式（build mode）”，且这种状态可能会持续下去。\n\n“部分投资者原本指望其投资周期已接近见顶，但管理层释放的信号却是：最沉重的资本支出仍是其核心战略，且回报周期将长达数年。\n\n“马斯克在电话会上几乎没有为当季业绩辩护，而是将几乎所有时间都用于解释其资本配置逻辑。他实际上是在要求投资者：将今天的支出视为未来业务的基石，而不是对当前盈利的拖累。”\n\n“这次电话会后的核心争论，不再是特斯拉本季度是否花钱太多，而是投资者是否相信这种基础设施建设是‘超前于需求’，还是‘超前于现实’。这最终将决定这一轮资本支出周期究竟能创造巨大的价值，还是仅仅沦为一场昂贵的弯路。”","tags":[],"cluster_size":1,"ts":"2026-07-22T22:30:29"},{"id":13127,"title":"Evercore ISI分析师Amit Daryanani在IBM财报发布后表示，（针对全年营收指引的）这一降幅“好于市场担忧”。\n\n在IBM上周发布初步业绩（","url":"https://wallstreetcn.com/livenews/3138451","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"Evercore ISI分析师Amit Daryanani在IBM财报发布后表示，（针对全年营收指引的）这一降幅“好于市场担忧”。\n\n在IBM上周发布初步业绩（显示基础设施及相关软件销售疲软）后，华尔街许多人士已预期该公司会下调指引。","tags":[],"cluster_size":1,"ts":"2026-07-22T22:29:48"},{"id":13128,"title":"周四亚太盘初，纳指期货跌0.3%，谷歌A与特斯拉掀开美国科技股业绩报告序幕。","url":"https://wallstreetcn.com/livenews/3138440","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周四亚太盘初，纳指期货跌0.3%，谷歌A与特斯拉掀开美国科技股业绩报告序幕。","tags":[],"cluster_size":1,"ts":"2026-07-22T22:03:32"},{"id":13129,"title":"中国移动以数智之笔，为传统产业绘就新活力 - 手机网易网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFAzLXRGV1huY3NNREtfaVRMMjBQcGZJVWxrRU9Ma25GUWFkMkJ0aHc1M1hTakpLSUExU3hHQlNBUXpJa1JvekVKYW5COXJRMzE1c0pkNjBiMHd3OEFfMWZkcU93?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFAzLXRGV1huY3NNREtfaVRMMjBQcGZJVWxrRU9Ma25GUWFkMkJ0aHc1M1hTakpLSUExU3hHQlNBUXpJa1JvekVKYW5COXJRMzE1c0pkNjBiMHd3OEFfMWZkcU93?oc=5\" target=\"_blank\"\u003e中国移动以数智之笔，为传统产业绘就新活力\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-22T21:51:39"},{"id":13130,"title":"GE Vernova股价下挫：上调营收指引难掩市场对AI的过高预期","url":"https://wallstreetcn.com/livenews/3138437","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"GE Vernova上调全年营收指引后股价依然大跌，表明向数据中心出售设备的企业正面临越来越大的压力，难以满足市场极高的预期。\n\n公司目前预计全年营收为455亿至465亿美元（上调10亿美元），并维持调整后息税折旧摊销前利润（EBITDA）利润率预测不变。\n\n该股在纽约下跌8.7%，创去年12月以来最大单日跌幅。财报前投资者预期过高，加上营收指引上调幅度“相对温和”且利润率预测未变，短期内可能限制股价上涨空间。","tags":[],"cluster_size":1,"ts":"2026-07-22T21:51:17"},{"id":13131,"title":"AI基础设施概念股盘后大涨，谷歌母公司在电话会上谈及产能扩张","url":"https://wallstreetcn.com/livenews/3138424","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三美股盘后，与人工智能（AI）基础设施相关的公司股票集体走高。此前，谷歌母公司Alphabet在财报电话会议上表示，公司计划在第三季度扩大对第三方算力容量的使用。\n\n在算力租赁商（Neoclouds）方面，CoreWeave上涨3.7%，Nebius上涨5.4%。\n\n存储芯片股方面，闪迪涨3%，美光涨2.9%，西部数据涨2%，SK海力士（SK Hynix）ADR涨3.7%。\n\n半导体板块方面，iShares半导体ETF涨0.9%。\n\n光通信股方面，Lumentum上涨3.4%，Applied Optoelectronics上涨4%。\n\nAlphabet业绩报告显示，公司云业务积压订单（Backlog）增至5140亿美元，较上一季度的约4600亿美元显著增长。强劲的业绩“主要由对AI基础设施和AI解决方案的强劲需求驱动”。","tags":[],"cluster_size":1,"ts":"2026-07-22T21:24:40"},{"id":13132,"title":"特斯拉二季度利润远逊预期，成本攀升拖累业绩","url":"https://wallstreetcn.com/livenews/3138412","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"特斯拉第二季度调整后每股收益（EPS）为33美分，远低于华尔街预期。公司录得两年多来首个负自由现金流季度，单季烧掉10.9亿美元，资本支出高达58亿美元。特斯拉当季营收为282亿美元，超出市场预期，但利润受到车辆平均售价走低及运营成本激增47%（至43.5亿美元）的严重挤压。\n\n尽管汽车销量表现强劲，特斯拉仍未能达到华尔街的利润预期。对于这家正致力于在机器人、自动驾驶和人工智能（AI）领域拓展新业务的电动汽车制造商而言，这无疑是一次挫折。","tags":[],"cluster_size":1,"ts":"2026-07-22T20:56:11"},{"id":13133,"title":"美股大类资产类ETF多数收跌，小盘股指ETF跌超0.9%，大豆、黄金、布油基金涨超1%","url":"https://wallstreetcn.com/livenews/3138406","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（7月22日），罗素2000指数ETF收跌0.93%，新兴市场ETF跌0.54%，纳指100 ETF、美国房地产ETF、美国国债20+年ETF、标普500 ETF、做多美元指数、道指ETF至多跌0.51%。\n\n日元做多则涨0.02%，欧元做多涨0.10%，农产品基金、巴克莱美国可转债ETF至多涨0.30%，大豆基金涨1.01%，黄金ETF涨1.15%，美国布伦特油价基金涨1.70%。","tags":[],"cluster_size":1,"ts":"2026-07-22T20:50:08"},{"id":13134,"title":"周三（7月22日），美股行业ETF多数收跌，网络股指数ETF、全球航空业ETF、生物科技指数ETF至多跌1.86%，半导体ETF涨0.48%，能源业ETF涨1.","url":"https://wallstreetcn.com/livenews/3138400","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（7月22日），美股行业ETF多数收跌，网络股指数ETF、全球航空业ETF、生物科技指数ETF至多跌1.86%，半导体ETF涨0.48%，能源业ETF涨1.20%。\n\n标普500指数的11个板块中，电信板块收跌1.29%，可选消费板块跌0.84%，信息技术/科技板块涨0.01%，能源板块涨1.19%，原材料板块涨1.45%，公用事业板块涨2.29%。","tags":[],"cluster_size":1,"ts":"2026-07-22T20:33:16"},{"id":13135,"title":"阿里巴巴期权聚焦：7月22日成交9.84万张，未平仓合约223.43万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxPTFhZaTFVZmpDZXZSaVdIS2lmMzlCRlA1M0c5czVNMERVQzZMVzNkMjUyYXQzNGx1c0RZMExJaHdOWDM0V1Rrc3RLdnFlOVJSZG1iVWtoQmt3QndheWQ1TlRJTjBhUjdPbVlFMFdJd3MtZTdKRU82dGhiTlJsRTE1U0VtdElaNGhTOTNWZmVGTTdERFFuSU5DSWpfLUMtaFBLSjNOV01FVQ?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxPTFhZaTFVZmpDZXZSaVdIS2lmMzlCRlA1M0c5czVNMERVQzZMVzNkMjUyYXQzNGx1c0RZMExJaHdOWDM0V1Rrc3RLdnFlOVJSZG1iVWtoQmt3QndheWQ1TlRJTjBhUjdPbVlFMFdJd3MtZTdKRU82dGhiTlJsRTE1U0VtdElaNGhTOTNWZmVGTTdERFFuSU5DSWpfLUMtaFBLSjNOV01FVQ?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月22日成交9.84万张，未平仓合约223.43万张\u003c/a\u003e\u0026nbsp AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUkFVX3lxTFBLMXhLVjdYRHpzUjY0QmpXYmNUbTctRU9iZmc4SkZPOUh2M0p0WjNNYlN0ZEttWE9EWmxUYlhIbG56VWFNbW1uRS1YbzhDQ29mZFE?oc=5\" target=\"_blank\"\u003eAMD向Anthropic注资50亿美元，部署2吉瓦AI GPU算力\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eicloudnews.net\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-23T01:07:00"},{"id":13328,"title":"Acrab 发布边缘 AI 终端 SoC GΞLIX 1，支持 100B 模型本地运行","url":"https://www.ithome.com/0/980/380.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"08b6\"\u003eIT之家 7 月 23 日消息，初创企业 Acrab 昨日正式发布了其首款芯片：面向边缘 AI 终端设备的 GΞLIX 1 SoC。这一芯片基于 5nm 制程工艺，\u003cstrong\u003e支持 100B 参数规模模型本地运行\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"3a5d\"\u003eGΞLIX 1 采用异构设计，提供了 20 核 Arm CPU、3TFLOPS GPU、NPU 和其它一系列音视频引擎，\u003cstrong\u003eAI 算力 650TOPS\u003c/strong\u003e。其拥有 8MB 的大型 L1 缓存，共享 L2 缓存带宽 768GB/s，此外还拥有 256-bit 8533T/s 的 LPDDR5X 共享内存。\u003c/p\u003e\u003cp data-vmark=\"0fe0\"\u003eAcrab 表示其在 GΞLIX 1 上通过矢量硬件加速了注意力机制，并通过针对预填充的优化降低了首 Token（词元）用时：在配备 40k KV 缓存和 10k Token 输入的 Gemma 26B A4B 配置下，\u003cstrong\u003eGΞLIX 1 可实现 1416.8 Token/s 的预填充速率\u003c/strong\u003e，是苹果 M4 Pro Mac Mini 的 7.5 倍。\u003c/p\u003e\u003cp data-vmark=\"6314\" style=\"text-align: center;\"\u003e\u003cimg","tags":[],"cluster_size":1,"ts":"2026-07-23T01:05:36"},{"id":13329,"title":"亚马逊 AGI 部门启动裁员，此前已有多名高管陆续出走","url":"https://www.ithome.com/0/980/379.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"37ab\"\u003eIT之家 7 月 23 日消息，据路透社报道，当地时间周三（22 日），亚马逊宣布在通用人工智能（AGI）部门启动裁员。继 1 月大规模削减人手后，亚马逊近期又进行了多轮规模较小的裁员。\u003c/p\u003e\u003cp data-vmark=\"95a7\"\u003e通用人工智能目前仍是一种设想中的 AI 系统，目标是让 AI 拥有超越人类的智能，并能自主学习、成长和运行。多家头部 AI 企业都在开发类似技术，希望借此解决高度复杂的问题。\u003c/p\u003e\u003cp data-vmark=\"4ba0\"\u003e亚马逊发言人在回应路透社询问时表示：“我们已经开发大型 AI 模型多年，这项工作仍是亚马逊最重要的任务之一。我们正在把资源\u003cstrong\u003e进一步集中到对客户最重要的项目上\u003c/strong\u003e，以更快推进真正关键的工作。聚焦重点也意味着必须作出艰难决定，包括取消 AGI 部门部 能性。\u003c/p\u003e\u003cp data-vmark=\"1e8c\"\u003e梁文锋认为，产品并不是 DeepSeek 当前的主线，而是通往 AGI 路上的阶段性成果。他表示，\u003cstrong\u003e企业不需要投入过多资源做 C 端、B 端产品\u003c/strong\u003e，“站在一个技术高位上做相对低一级别的技术，是降维打击”。\u003c/p\u003e\u003cp data-vmark=\"647e\"\u003e对于业务方向，梁文锋称，DeepSeek 不会重点投入 3D 生成、视频生成以及世界模型等方向。他认为，多模态能力对于产品和普通用户很重要，但只是 AI 系统中的一个组件，并非智能发展的核心路线。\u003c/p\u003e\u003cp data-vmark=\"c","tags":[],"cluster_size":1,"ts":"2026-07-23T00:12:29"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#db2777","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":13179,"title":"Judge Approves a $1.5B Anthropic Settlement Over Books Used to Train Claude - Broadband Breakfast","url":"https://news.google.com/rss/articles/CBMiqgFBVV95cUxNekpJT19YUHV3OGYxbTZ3SDZXSmdOcmhMbTk5aXBPMHkwc3FhV0dmY05WQ2JIcjNmWnRpbG5vbWlUWl9WRnI5NGRhd3NPNXFRQU93WUNMV1Q0bGVFSF94TlBOS2g1eXB3LXo1MU5xSkkyc2ZnaFVydlh1bFNuc2NqZzBrRzVOVVN5Y0ZPSVhoU3lTMUduM0ZMaXpjOVdNd1dGaEhKRjloTkJzUQ?oc=5","source":"GNews · AI Research","sources":["GNews · AI Research"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiqgFBVV95cUxNekpJT19YUHV3OGYxbTZ3SDZXSmdOcmhMbTk5aXBPMHkwc3FhV0dmY05WQ2JIcjNmWnRpbG5vbWlUWl9WRnI5NGRhd3NPNXFRQU93WUNMV1Q0bGVFSF94TlBOS2g1eXB3LXo1MU5xSkkyc2ZnaFVydlh1bFNuc2NqZzBrRzVOVVN5Y0ZPSVhoU3lTMUduM0ZMaXpjOVdNd1dGaEhKRjloTkJzUQ?oc=5\" target=\"_blank\"\u003eJudge Approves a $1.5B Anthropic Settlement Over Books Used to Train Claude\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eBroadband Breakfast\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-23T00:24:21"},{"id":13180,"title":"Gemini Horoscope Today: July 23, 2026 - Vogue India","url":"https://news.google.com/rss/articles/CBMickFVX3lxTE9mLUU3Z1Q3alJkeHkwTXo5RDJONG1DODl5SU5yS0VqZmVaZUotWjVvYjNyazhzbU0tYlFZTnRORWNROGgtelppNXdfbVA4ckJtUDVaSHVmVFl4cUd4Q0o2WUhIQnQzS2lYdUhuVUt3dTdjQQ?oc=5", bot Revolution: From Labs to Factory Floors\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eIntelligent Living\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-22T04:47:58"},{"id":13316,"title":"Design and stability analysis of an underactuated hand with passively rotating fingers","url":"https://arxiv.org/abs/2607.18950","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18950v1 Announce Type: new \nAbstract: This paper presents an innovative design and stability analysis of an underactuated robotic finger with spatial mobility, designed to enhance gripping dexterity in robotic hands. The finger architecture incorporates a revolute joint at its base, enabling passive spatial rotation that facilitates both cylindrical and spherical grasping. With only two phalanges per finger, the design simplifies kinematic complexity while supporting precision and enveloping grasps. Stability criteria, based on the moment at the finger base joint induced by contact","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13315,"title":"The Twist Decomposition of Serial Robots Under Lower-Mobility Tasks","url":"https://arxiv.org/abs/2607.18940","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18940v1 Announce Type: new \nAbstract: This paper introduces a twist decomposition framework for serial manipulators performing lower mobility tasks. Rather than relying on Jacobian null-space projections, the method separates the end-effector twist into task and redundant components using geometrically defined twist projectors. This formulation provides a direct and intuitive distinction between task-relevant and task-irrelevant motions in operational space, enabling a compact inverse kinematics scheme that naturally handles both manipulator and task redundancy.","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13314,"title":"WorldScape Policy 2.0: Empowering Steerable World Action Modeling with Reasoning-Augmented Memory","url":"https://arxiv.org/abs/2607.18840","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18840v1 Announce Type: new \nAbstract: World Action Models (WAMs) offer a promising paradigm for robotic manipulation by jointly modeling visual state transitions and robot actions. However, existing WAMs are constrained by limited temporal context, coarse episode-level language supervision, and predominantly text-only conditioning, which hinder task-progress tracking and fine-grained language-video-action grounding while limiting visual-context reasoning and cross-embodiment transfer. In this paper, we introduce WorldScape Policy 2.0, a controllable WAM with reasoning-augmented long","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13313,"title":"Koopman DCM: Unstable Eigenfunctions as Data-driven Representations for Legged Balancing","url":"https://arxiv.org/abs/2607.18760","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18760v1 Announce Type: new \nAbstract: In legged locomotion, divergent components of motion (DCMs) have emerged as characteristic states for balance control. They isolate the unstable mode of the dynamics but, in existing formulations, apply only to reduced models such as the linear inverted pendulum. In this study, we show how DCMs can be more generally formulated as Koopman eigenfunctions. Whereas Koopman analysis typically targets eigenvalues near zero, which capture conserved or slowly varying quantities, our investigation leads us to deliberately search for unstable eigenpairs w","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13312,"title":"Motion Primitive Discovery in a Humanoid Robot via Self-Organising Maps for Phase Recognition","url":"https://arxiv.org/abs/2607.18737","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18737v1 Announce Type: new \nAbstract: Understanding the computational basis of action recognition is a central challenge in social cognition as well as in human-robot interaction. Inspired by the Mirror Neuron System (MNS), we propose a two-level architecture for motor primitive discovery and online phase recognition applied to the NICO humanoid robot. At the first level, two Self-Organising Maps (SOMs) learn topographic representations of arm kinematics (A-SOM) and hand kinematics (H-SOM) from simulated trials covering seven motor actions. The maps are trained on non-redundant feat","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13311,"title":"Correct-by-Construction Behavior Tree Synthesis from Signal Temporal Logic Specifications with Application to Robotic Missions","url":"https://arxiv.org/abs/2607.18731","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18731v1 Announce Type: new \nAbstract: Behavior Trees (BTs) are widely adopted for complex task execution in robotics, providing modular, reactive control but lacking formal guarantees. However, existing correct-by-construction synthesis from Linear Temporal Logic (LTL) cannot express quantitative timing constraints. This letter synthesizes correct-by-construction BTs from Signal Temporal Logic (STL) specifications. The workspace is modeled as a timed transition system and abstracted into a zone graph, and an augmented state space tracking both logical progress and timing constraints","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13310,"title":"RoboInter1.5: A Holistic Intermediate Representation Suite for Embodied World Modeling and Robotic Manipulation","url":"https://arxiv.org/abs/2607.18709","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18709v1 Announce Type: new \nAbstract: Existing robot datasets remain expensive to curate, embodiment-specific, and insufficiently annotated with the fine-grained structure required for generalizable reasoning, execution, or long-horizon environment dynamics simulation. Building on our prior work, RoboInter1.0, we present RoboInter1.5, an extended and holistic suite of intermediate representations for both robotic manipulation and embodied world modeling. RoboInter1.5 provides a unified resource of data, benchmarks, and models centered on dense manipulation-oriented intermediate repr","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13309,"title":"MVP-Tac: A Miniaturized Dual-Modal Vision and Photoelastic Tactile Sensor for Robot-Assisted Minimally Invasive Surgery","url":"https://arxiv.org/abs/2607.18660","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18660v1 Announce Type: new \nAbstract: Robot-assisted minimally invasive surgery (RMIS) offers major benefits over open and conventional laparoscopic procedures, yet it still lacks tactile feedback for palpation while operating under strict requirements to preserve reliable vision for navigation and safety. In practice, visual feedback is indispensable, and tactile solutions that cannot coexist with vision are difficult to translate into RMIS tools. To address both needs, we introduce MVP-Tac, a compact, vision-based tactile sensor that provides co-located vision and tactile sensing.","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13308,"title":"Fabric Pneumatic Artificial Muscles Based on the Drawstring Principle","url":"https://arxiv.org/abs/2607.18641","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18641v1 Announce Type: new \nAbstract: Pneumatic artificial muscles have wide applications in robotics and industrial fields. Conventional pneumatic artificial muscles generate extra radial deformation during axial contraction, which severely wastes available working space. Inspired by the widely adopted drawstring principle in textile products, this paper proposes a novel drawstring fabric pneumatic artificial muscle (DPAM). Unlike traditional counterparts, the proposed DPAM produces no extra radial deformation during contraction, greatly improving structural compactness. The DPAM e","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13307,"title":"On the Limits of Sampling-Based Reachability: Geometry, Dynamics, and Sample Complexity","url":"https://arxiv.org/abs/2607.18606","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18606v1 Announce Type: new \nAbstract: Reachability analysis is central to safety-critical control, robotics, and neural network verification, but classical computational methods, such as Hamilton--Jacobi reachability and set propagation, scale poorly with state dimension. Sampling-based methods have emerged as a promising alternative, often providing finite-sample guarantees that bound the probability-mass left uncovered. However, an explicit account of how the geometry of the initial set, the dynamics, and the sampling law affect the accuracy of the estimator is not fully available","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13306,"title":"STeP: Signal Temporal Logic for Precise Specifications for Action Generation with Vision Language Models","url":"https://arxiv.org/abs/2607.18580","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18580v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have shown impressive generalization, but often lack interpretability and can struggle to follow precise natural language instructions that encode spatial, temporal, and logical requirements. We propose a hierarchical framework that uses Signal Temporal Logic (STL) as a shared representation connecting high-level language understanding with low-level robot execution. A high-level policy leverages a VLM to decompose language instructions into high-level subtasks, generate STL specifications for each subtask, an","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13305,"title":"DASH Robot: Minimalistic Design and Optimal Aerial-Terrestrial Locomotion via Contact-Implicit Control","url":"https://arxiv.org/abs/2607.18527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18527v1 Announce Type: new \nAbstract: We present a novel and minimalistic design of an aerial-terrestrial robot DASH: Ducted Aerial Spring Hopper. The goal is to enable both aerial and ground locomotion capabilities on a unified mobile robot that is mechanically-minimalistic, locomotion-versatile, and energy-efficient. We propose an organic integration of ducted fan co-axial body with a springy leg at the bottom for realization. The ducted fan module provides thrust-vectoring as the main actuation for agile flying; when it is combined with the light-weight spring leg, the robot real","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13304,"title":"Beyond Fixed Goal Delivery: Online POMDP Planning for Target Interception in Crowds","url":"https://arxiv.org/abs/2607.18517","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18517v1 Announce Type: new \nAbstract: Target interception in crowded environments requires reaching a moving objective while navigating among multiple uncertain human agents. Since human navigation intent is not directly observable, the robot must reason over multiple possible future interaction outcomes. We formulate interception in crowds as a partially observable Markov decision process and solve it online using tree search under a fixed computational budget. In this setting, the action-space structure directly shapes the search tree and how computational effort is allocated. We","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13303,"title":"The Open Ant: A Robot Platform for Reinforcement Learning Research","url":"https://arxiv.org/abs/2607.18488","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18488v1 Announce Type: new \nAbstract: Reinforcement learning (RL) research has demonstrated success in both physical and simulated domains; however, the predominant methodology remains rooted in simulations. The predominance of simulations makes translating research to physical reality uncertain for both algorithms and researchers. We propose a physical platform that is designed to simplify the transition. In this paper, we present the Open Ant: a physical variant of the commonly used Gymnasium Ant environment, along with a simulation. We demonstrate that competent walking policies","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13302,"title":"Towards Torque-Driven Reinforcement Learning for Quadruped Locomotion","url":"https://arxiv.org/abs/2607.18365","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18365v1 Announce Type: new \nAbstract: Reinforcement learning (RL) for legged robots is advancing locomotion, demonstrating its ability to adapt to new and challenging terrain. Traditionally, these RL locomotion frameworks are position-based, making the policy less adaptable to terrain types and requiring state estimation techniques in the observation space, i.e., linear velocity. Moreover, these RL frameworks often use small, lightweight quadrupeds that are limited in their viability for high-complexity tasks due to hardware constraints. This work explores an RL torque control frame","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13301,"title":"FARO: Feasibility-Aware Robot Motion Optimization","url":"https://arxiv.org/abs/2607.18362","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.18362v1 Announce Type: new \nAbstract: Fast planning of novel behaviors in unseen scenarios remains a fundamental challenge in robotics. The high-dimensional, hybrid, and underactuated nature of humanoid loco-manipulation continues to hinder the realization of this goal. In this paper, we address this challenge by proposing a nested kino-dynamic framework for rapid feasibility checking and dynamically consistent trajectory generation given a candidate contact sequence. By integrating this module with a feasibility-guided tree search and a Large Language Model (LLM)-based contact plan","tags":[],"cluster_size":1,"ts":"2026-07-22T04:00:00"},{"id":13317,"title":"特斯拉Optimus最新进展：首批制造机器人将用于数据训练与功能开发 - 东方财富","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1ISmVNT2FiLTBYalBMSGlCVjlHOHIxbU9ZNWVISXo1Mmc4MXdzUl9OMnBDeU1PTzBLRUVVblpYdnBCOUJHdmR1cHNIRTZZV2JkSFp4eDduNURrNENyV0JQUQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE1ISmVNT2FiLTBYalBMSGlCVjlHOHIxbU9ZNWVISXo1Mmc4MXdzUl9OMnBDeU1PTzBLRUVVblpYdnBCOUJHdmR1cHNIRTZZV2JkSFp4eDduNURrNENyV0JQUQ?oc=5\" target=\"_blank\"\u003e特斯拉Optimus最新进展：首批制造机器人将用于数据训练与功能开发\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e东方财富\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-22T00:19:04"},{"id":12801,"title":"Gene.01, Generative Bionics’ humanoid robot for industry - Startupbusiness.it","url":"https://news.google.com/rss/articles/CBMinAFBVV95cUxNMlVIanFlcXVpMmp5RFhzZEg0VTI0VUNQdFBoUHlQOC1FcUJWQjBtdnRCRXBpRGFNOU1scjRLOGxKZlJ4UU5TMXJZdm1OWWRJOHdhSGVvV0FnV29EVkpVaFFLYWVnTUJjLWFOUlJ4b2V0UWZDMUhKdTh2STI4NlVvZWlpY29zQmJVRXpwbC1Hd3g4Q1Vld2JHYlFMZk4?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMinAFBVV95cUxNMlVIanFlcXVpMmp5RFhzZEg0VTI0VUNQdFBoUHlQOC1FcUJWQjBtdnRCRXBpRGFNOU1scjRLOGxKZlJ4UU5TMXJZdm1OWWRJOHdhSGVvV0FnV29EVkpVaFFLYWVnTUJjLWFOUlJ4b2V0UWZDMUhKdTh2STI4NlVvZWlpY29zQmJVRXpwbC1Hd3g4Q1Vld2JHYlFMZk4?oc=5\" target=\"_blank\"\u003eGene.01, Generative Bionics’ humanoid robot for industry\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eStartupbusiness.it\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-21T22:15:02"},{"id":12803,"title":"Unitree's new omni model lets humanoid robots work through interruptions - Interesting Engineering","url":"https://news.google.com/rss/articles/CBMi // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
