rce":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"分析人士认为，尽管半导体板块短期震荡加剧，但产业高景气度正持续得到全球产业链数据验证。AI算力需求持续高增背景下，海外行业龙头业绩与资本开支双双超预期上调，产业上行周期确定性不断强化；国内厂商受益于国产化率提升加速，中报业绩兑现能力突出，自主可控产业逻辑持续深化。本轮调整更多源于前期涨幅累积后的获利盘集中了结与交易情绪扰动，产业核心成长逻辑并未发生实质性逆转。经过快速回调后，板块估值风险得到充分释放，具备核心技术壁垒与业绩确定性的细分赛道标的配置价值逐步凸显。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-23T22:49:55"},{"id":13529,"title":"A股科技板块持续调整，机构关注资源品与红利低位股","url":"https://wallstreetcn.com/livenews/3139106","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，A股科技板块明显调整，市场风险偏好有所回落。Wind数据显示，截至7月23日的近3个交易日，有色金属、电气设备、石油石化等板块率先获得资金回流，消费、红利和金融板块则呈现结构性机会。机构认为，本轮调整更多是外部扰动、交易拥挤和估值压力集中释放的结果，市场中长期运行逻辑并未发生根本变化。在半年报密集披露的窗口期，资金正由前期高弹性、高估值的方向，逐步转向业绩确定性更强、估值更具安全边际的板块。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-23T22:46:18"},{"id":13530,"title":"7月以来机构调研近540家上市公司，多只绩优标的成“心头好”","url":"https://wallstreetcn.com/livenews/3139104","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来已有近540家上市公司接待机构调研，其中超110家公司预计上半年净利润同比增长，部分业绩高增标的获得机构密集关注。近期A股进入调整阶段，对于后市走势，业内人士认为，在政策支持以及科技产业趋势仍在发展的背景下，未来市场情绪或逐步修复。对于科技板块，需要在波浪式前进中把握投资节奏，消费板块开始逐步具备配置价值，此外进入“击球区”的黄金也值得关注。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-23T22:45:29"},{"id":13531,"title":"新加坡主权财富基金GIC（政府投资公司）集团首席投资官杨博文（Bryan Yeo）：如果基金经理能为我们带来良好的回报，我们很乐意支付业绩报酬。\n\n承认世界上几","url":"https://wallstreetcn.com/livenews/3139100","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"新加坡主权财富基金GIC（政府投资公司）集团首席投资官杨博文（Bryan Yeo）：如果基金经理能为我们带来良好的回报，我们很乐意支付业绩报酬。\n\n承认世界上几家最优秀的对冲基金已不对新资金开放。\n\n我们能够与他们合作，利用他们的专业技能和专长来推出新策略，并对其进行孵化以促其成长。（彭博）","tags":[],"cluster_size":1,"ts":"2026-07-23T22:39:47"},{"id":13532,"title":"7月23日300现金流ETF华宝基金份额增加600万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1Zc0RlSFNlYmdyc3VfRW91T2JGcE5fdXBITkNPXzN0RzV5N1ZSMFBMZnBGaFAxNU9EZHk5R3FjamN6U2NSR1hhVmhRNGxqVEZzUmlnMVRpdi1XRENlRTd5Sldn?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1Zc0RlSFNlYmdyc3VfRW91T2JGcE5fdXBITkNPXzN0RzV5N1ZSMFBMZnBGaFAxNU9EZHk5R3FjamN6U2NSR1hhVmhRNGxqVEZzUmlnMVRpdi1XRENlRTd5Sldn?oc=5\" target=\"_blank\"\u003e7月23日300现金流ETF华宝基金份额增加600万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-23T22:38:38"},{"id":13533,"title":"上半年量价承压，光伏产业链反转拐点或临近","url":"https://wallstreetcn.com/livenews/3139093","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"2026年上半年，光伏行业进入调整阶段，主产业链各环节产量普遍下行，产品价格震荡走弱，新增装机规模明显回落。7月23日，在中国光伏行业协会主办的光伏行业2026年上半年发展回顾与下半年形势展望研讨会上，多位专家剖析了行业当下遭遇的多重挑战。业内专家认为，伴随强制性国家标准落地，低效产能加速出清，行业竞争逻辑正发生转变，逐步由以往“比拼价格，扩张规模”，转向以技术、品质、差异化优势为核心的价值竞争赛道。乐观预期下，头部企业经营状况有望在下半年迎来拐点。此外，随着数据中心与AI算力用电需求快速增长，算电协同正成为光伏业极具发展潜力的新兴赛道。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-23T22:21:13"},{"id":13534,"title":"周五亚太盘初，纳指期货涨0.3%。\n\n目前（美股盘后），科技股英特尔涨4.5%，甲骨文涨2%，AMD涨1.4%，特斯拉反弹1.1%，美光跌0.4%。","url":"https://wallstreetcn.com/livenews/3139086","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周五亚太盘初，纳指期货涨0.3%。\n\n目前（美股盘后），科技股英特尔涨4.5%，甲骨文涨2%，AMD涨1.4%，特斯拉反弹1.1%，美光跌0.4%。","tags":[],"cluster_size":1,"ts":"2026-07-23T22:01:21"},{"id":13535,"title":"周四（7月23日）纽约尾盘，标普500股指期货最终跌1.11%，道指期货跌0.98%，纳斯达克100股指期货跌1.49%。\n\n罗素2000股指期货跌0.69%。","url":"https://wallstreetcn.com/livenews/3139074","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四（7月23日）纽约尾盘，标普500股指期货最终跌1.11%，道指期货跌0.98%，纳斯达克100股指期货跌1.49%。\n\n罗素2000股指期货跌0.69%。","tags":[],"cluster_size":1,"ts":"2026-07-23T21:06:43"},{"id":13536,"title":"美国公布新关税措施，24日生效","url":"https://wallstreetcn.com/livenews/3139070","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"据新华社报道，美国贸易代表办公室（USTR）23日发布公告，宣布依据《1974年贸易法》第301条，以所谓“强迫劳动”为名对数十个国家和地区加征10%至12.5%的关税，以替代即将到期的全球进口关税。新关税将于美国东部时间24日生效。\n\n据了解，本次加征关税时，石油、天然气、化肥、食品得到豁免。美国贸易办公室（USTR）宣称，本次将对60个经济体征税。","tags":[],"cluster_size":1,"ts":"2026-07-23T20:58:47"},{"id":13537,"title":"欧盟为什么罚了阿里巴巴速卖通42.5亿 - 手机网易网","url":"https://news.goo kFVX3lxTE52ZlhhR3RFQ2g0bzVsVUxhRkIzaS1UaEVzd0QzUXUyNFZCaFFwT1g2Yk85aU9na21uM2tQSGZZc1hfR2pBSno3VjBzeXZDWVFUTVE?oc=5\" target=\"_blank\"\u003e市场在deepseek上错了一次，现在kimi上又要再错一次\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e华尔街见闻\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-24T01:21:55"},{"id":13710,"title":"始终可见：微软 Win10/Win11 经典版 Outlook 下月将增 Copilot AI 统一入口","url":"https://www.ithome.com/0/980/924.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"81f6\"\u003eIT之家 7 月 24 日消息，科技媒体 Windows Latest 今天（7 月 24 日）发布博文，报道称\u003cstrong\u003e微软计划下月（2026 年 8 月）升级 Windows 10、Windows 11 平台经典版 Outlook，新增 Copilot 入口，并希望“始终可见”。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"6228\"\u003e根据微软官方公布的 Microsoft 365 路线图，微软计划 8 月新增“在经典版 Outlook 中新增上 Copilot 入口”选项。\u003c/p\u003e\u003cp data-vmark=\"c0b1\"\u003eIT之家翻译相关条目介绍如下：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"267f\"\u003e我们 [指微软] 正统一多款应用中的 Copilot 体验，引入跨应用的一致入口，在用户日常工作流程中，能让 AI 理解上下文使用情境。\u003c/p\u003e\u003cp data-vmark=\"b6ae\"\u003eCopilot 的入口不再分散在整个界面中，升级定位为横跨 Microsoft 365 生态的统一入口，能为用户提供最贴切的操作推荐，让用户的工作流更加顺畅。\u003c/p\u003e\u003cp data-vmark=\"012c\"\u003e新版 Copilot 入口已在 Word、Excel、PowerPoint 以及其他平台 Outlook 中上","tags":[],"cluster_size":1,"ts":"2026-07-24T01:20:47"},{"id":13711,"title":"北京发布新政加快智能体引领发展 - 手机网易网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE8yV2FoNXE1MWtzcnQyMk1EMkRJbU5yMGsxcV91OEwtLWRHNF9uckNKa0RvdXlUZm00a3Mtd1RKVktlR0hfa2M4Y0JLbU5WYnJEZHdreDdwZ2RKS0N1em5ySVdR?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE8yV2FoNXE1MWtzcnQyMk1EMkRJbU5yMGsxcV91OEwtLWRHNF9uckNKa0RvdXlUZm00a3Mtd1RKVktlR0hfa2M4Y0JLbU5WYnJEZHdreDdwZ2RKS0N1em5ySVdR?oc=5\" target=\"_blank\"\u003e北京发布新政加快智能体引领发展\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-24T01:15:19"},{"id":13712,"title":"丘成桐：王虹和邓煜双双获得菲尔兹奖标志着中国数学界的整体走向成熟，一直诚挚邀请他们回来任教","url":"https://www.ithome.com/0/980/921.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"1d2d\"\u003eIT之家 7 月 24 日消息，2026 年国际数学家大会当地时间 7 月 23 日上午在美国费城开幕，现场揭晓 2026 年菲尔兹奖得主，\u003ca href=\"https://www.ithome.com/0/980/846.htm\" target=\"_blank\"\u003e中国青年数学家王虹、邓煜获奖\u003c/a\u003e，这也是中国数学家首次在同一届菲尔兹奖中获得两枚奖章。\u003c/p\u003e\u003cp data-vmark=\"bf43\"\u003e据澎湃新闻当日报道，著名数学家、菲尔兹奖首位华人得主、清华大学丘成桐数学科学中心主任、求真书院院长丘成桐对此表示：“我感到非常高兴。对于中国数学界而言，这是几十年来我们一直期盼实现的愿望。”\u003c/p\u003e\u003cp data-vmark=\"e3f1\"\u003e丘成桐认为，\u003cstrong\u003e王虹和邓煜双双获得菲尔兹奖标志着中国数学界的整体走向成熟\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"bbd1\"\u003e他认为，早期中国留学生的研究工作主要集中在具体问题上。新一代留学生开始成熟，能够驾驭更先进的数学思想，这批学者主要是在海外接受训练的。\u003c/p\u003e\u003cp data-vmark=\"4345\"\u003e“如今王虹和邓煜的成就，让我们看到了新的希望：我们可以期望最终的关键一步，即由在中国本土培养的学者，在本土做出最顶尖的成果。”丘成桐说，纵观历史，意大利、法国、英国、德国、美","tags":[],"cluster_size":1,"ts":"2026-07-24T01:12:22"},{"id":13713,"title":"陈立武：英特尔 14A 节点计划 2027 下半年风险试产，2028 年全面量产","url":"https://www.ithome.com/0/980/920.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bbd4\"\u003eIT之家 7 月 24 日消息，英特尔今日发布了最新财报，2026 财年第二季度实现营收 161 亿美元（现汇率约合 1092.07 亿元人民币）同比增长 25%，这也是英特尔过去 15 年以来最高的营收同比增速。\u003c/p\u003e\u003cp data-vmark=\"bd91\"\u003e英特尔 CEO 陈立武在财报电话会议上确认，旗下 Intel 14A 工艺将提前至 2027 年下半年开启风险试产，大规模量产定于 2028 年，较此前“2028 年风险试产、2029 年量产”的规划有所提前。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"d10e\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/06f42d89-5cec-4d05-9b13-8463d07999fe.jpg?x-bce-process=image/auto-orient,o_1\" w=\"600\" h=\"338\" data-weibo=\"0\" data-vmark=\"6ece\"\u003e\u003c/p\u003e\u003cp data-vmark=\"d7fd\"\u003e值得一提的是，风险试产（Risk Production）是指在新制程工艺尚未完全成熟时，提前启动小规模试产，以便及早发现并解决量产阶段可能遇到的问题，是芯片从研发","tags":[],"cluster_size":1,"ts":"2026-07-24T01:07:42"},{"id":13714,"title":"国内智能体互联标准发布，上半年证券印花税激增97% | 财经日日评 - 新浪财经","url":"https://news.google.com/rss/articles/CBMimAFBVV95cUxPYmEwWjhGZ1l6d1o2NjU0N0V0Z2pWRXV pHcVo4WVE?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUkFVX3lxTE51Wmg5RUJKZ01rTVhHVmp5dUlQZC1iUmp4dWdPdk0yNW9JU0tUVXZZbGg0bGtSRU5KYVB4Rm0yQ0dmcjJJWVNDNXJ2a0pHcVo4WVE?oc=5\" target=\"_blank\"\u003e特斯拉人形机器人产线双线推进，马斯克称“量产爬坡史上最难”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-23T04:54:00"},{"id":13413,"title":"特斯拉：预计美国Fremont工厂的人形机器人Optimus将于今年稍晚投产 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMiUkFVX3lxTE5VNE1FTERhSUlIVVFqMU1zdHlHM2YxNmVOR3JyaXhoa2xnN2RWMEY0WjFIcWVJN0lKOWxlN2sybGhZbHpSVlBmcWE5Zk5CbGhRbEE?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUkFVX3lxTE5VNE1FTERhSUlIVVFqMU1zdHlHM2YxNmVOR3JyaXhoa2xnN2RWMEY0WjFIcWVJN0lKOWxlN2sybGhZbHpSVlBmcWE5Zk5CbGhRbEE?oc=5\" target=\"_blank\"\u003e特斯拉：预计美国Fremont工厂的人形机器人Optimus将于今年稍晚投产\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-23T04:02:19"},{"id":13433,"title":"Courteous Anticipation: Improving Long-Lived Task Planning in Persistent Shared Environments","url":"https://arxiv.org/abs/2607.20289","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.20289v1 Announce Type: new \nAbstract: We consider a task planning scenario in which robots sharing a persistent environment are assigned tasks one at a time from a held-out sequence. Standard task planners, lacking foresight of future tasks and inconsiderate of others' constraints, solve each task in isolation, leaving terminal states that increase future cost for all, side effects that compound over lengthy task sequences. To reduce cost over the sequence, a robot must anticipate how its actions now may impact performance on future tasks for all robots sharing the environment. Ther","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13432,"title":"SeededGrasp: Language-Guided Grasping in Complex Scenes with Multiple Embodiments","url":"https://arxiv.org/abs/2607.20207","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.20207v1 Announce Type: new \nAbstract: Practical robotic grasping in complex scenes requires both 3D spatial reasoning and alignment with task-specific requirements. Vision-language models (VLMs) offer a natural way to specify these requirements using language, but existing approaches either use a VLM to predict the grasp directly with limited spatial awareness, or train the VLM together with the grasping model, which requires significantly more data and compute. These limitations impede performance and have prevented scaling to multiple embodiments in complex scenes. We address this","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13431,"title":"Extreme-RGMT: Continual Learning of Highly Dynamic Skills for Robust Generalist Humanoid Control","url":"https://arxiv.org/abs/2607.20110","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.20110v1 Announce Type: new \nAbstract: Humans can progressively acquire highly dynamic motor skills while preserving reliable everyday motor abilities. In contrast, existing humanoid controllers face a trade-off between generalist and specialist capabilities: generalist motion tracking policies struggle to reliably execute rare highly dynamic motions, whereas specialist training can degrade previously acquired behaviors. We introduce Extreme-RGMT, a two-stage continual learning framework for robust generalist humanoid control. The method first learns a generalist motion-tracking base","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13430,"title":"ReferTrack: Referring Then Tracking for Embodied Visual Tracking","url":"https://arxiv.org/abs/2607.20061","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.20061v1 Announce Type: new \nAbstract: Embodied visual tracking (EVT) requires a mobile agent to continuously follow a specific target described in natural language using only onboard vision. While recent vision-language-action (VLA) policies unify target identification and trajectory planning, their chain-of-thought (CoT) reasoning often operates in abstract spatial latents that are difficult to supervise and weakly aligned with explicit image-space detections. To address this, we introduce ReferTrack, a referring-then-tracking paradigm that grounds EVT using a single forward-facing","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13429,"title":"Robots Acquire Manipulation Skills in Seconds from a Single Human Video","url":"https://arxiv.org/abs/2607.20033","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.20033v1 Announce Type: new \nAbstract: The ability to acquire skills rapidly and effortlessly while retaining those already mastered is essential for robots. However, current methods still rely on a cumbersome training-time loop that is costly and slow, while eroding skills already mastered. In this paper, we introduce HOST (Human-to-robot One-Shot Skill AcquisiTion), a framework that enables a robot to acquire skills in seconds from a single human video while retaining previously mastered skills. HOST resolves skill acquisition through a cascade of self-grounded prediction. It first","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13428,"title":"Unified Prediction and Planning via Conflict-Aware Disjoint Parameter Training","url":"https://arxiv.org/abs/2607.19971","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19971v1 Announce Type: new \nAbstract: Accurate motion prediction of surrounding agents and safe motion planning are two closely coupled key tasks for social robot navigation in crowded environments. Deploying these systems on resource-constrained edge devices necessitates compact, unified models that can perform both tasks simultaneously. However, within these compact shared encoders, recent unified models often overlook severe representational conflicts that arise from the distinct objectives of predicting neighbor behaviors versus ego-centric safety planning. To address this issue","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13427,"title":"Diffusion ReRoll: Revisable Denoising for Robotic Sequential Prediction","url":"https://arxiv.org/abs/2607.19919","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19919v1 Announce Type: new \nAbstract: We propose Diffusion ReRoll, a diffusion-based framework for robotic sequential prediction that enables revisable denoising over horizons. Existing diffusion-based sequence predictors typically perform a single monotonic denoising process. In contrast, Diffusion ReRoll selectively re-noises regions that have become locally stable while the remaining regions continue denoising, so the re-noised regions can be refined again using context from the rest of the horizon. This structured re-noising enables iterative cross-horizon revision, allowing ear","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13426,"title":"What Matters in Humanoid General Motion Tracking? An Empirical Study","url":"https://arxiv.org/abs/2607.19903","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19903v1 Announce Type: new \nAbstract: Humanoid general motion tracking requires policies that can follow diverse whole-body references while maintaining balance. Building such policies involves many practical design choices, and their individual effects are often hard to assess. We address this issue with an empirical study of common modeling and training factors used in recent humanoid motion-imitation pipelines. To make the study controlled and reproducible, we developed YAHMP, an open-source modular framework for training, evaluating, and deploying whole-body motion tracking poli","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13425,"title":"EA-Nav: Learning Safe Visual Navigation Policies with Embodiment Awareness","url":"https://arxiv.org/abs/2607.19880","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19880v1 Announce Type: new \nAbstract: Cross-embodiment navigation is a key challenge in embodied intelligence. Due to differences in embodiment, the same visual observation may imply different actions for different agents, making prediction ambiguous when relying solely on vision. Existing studies mainly rely on reinforcement learning, which requires large-scale interaction and careful reward design, making it difficult to support scalable pretraining and real-world adaptation. In contrast, imitation-learning-based approaches remain limited. To address these challenges, we propose a","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13424,"title":"KineBench: Benchmarking Embodied World Models via IDM-Free Kinematic Grounding","url":"https://arxiv.org/abs/2607.19876","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19876v1 Announce Type: new \nAbstract: Evaluating the physical consistency of embodied world models(EWMs) is a critical open challenge. While closed-loop evaluation via simulator rollouts offers a more faithful assessment of physical plausibility than open-loop alternatives, existing frameworks almost exclusively rely on Inverse Dynamics Models(IDMs) for action extraction. Due to the intricate mapping from 2D pixel space to 3D kinematic space, the learned IDMs can be brittle to data outside their training distribution, resulting in unreliable action extraction from the generated vide","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13423,"title":"SOPD-SocialNav: Selective On-Policy Distillation for Vision-Language Social Navigation","url":"https://arxiv.org/abs/2607.19850","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19850v1 Announce Type: new \nAbstract: Vision-language models have shown strong potential for social robot navigation by leveraging rich semantic understanding of complex environments and human behaviors. However, large scale VLMs are difficult to deploy on resource-constrained robotic platforms, while lightweight VLMs often lack sufficient social reasoning capability. To address this problem, we propose SOPD-SocialNav, a selective on-policy distillation (SOPD) method that transfers social navigation knowledge from a large teacher VLM to a lightweight student VLM. SOPD introduces an","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13422,"title":"Clinical Pathways as Safety Specifications for Physical AI in Hospital Wards","url":"https://arxiv.org/abs/2607.19827","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19827v1 Announce Type: new \nAbstract: Ensuring safety in Physical AI systems operating in real-world environments is a critical challenge, particularly in hospital wards where vulnerable patients, clinical staff, medical devices, and assistive robots coexist. In this paper, we reinterpret Clinical Pathways as explicit runtime safety specifications for embodied medical AI. We propose a conceptual robotic architecture that integrates wearable sensors, smart medical devices, and assistive robotic components into a unified framework for real-time safety monitoring. At its core, a Runtim","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13421,"title":"V2F: Vision-Informed Grasp Force Prediction for Damage-Aware Robotic Handling of Date Fruits","url":"https://arxiv.org/abs/2607.19804","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19804v1 Announce Type: new \nAbstract: This paper presents a vision-informed grasp force prediction framework for robotic handling of date fruits. Addressing the dual challenge of high detachment forces and low bruise thresholds, we first conduct mechanical characterization on date samples to define a safe grasping envelope and quantify the relationship between fruit geometry and bioyield stress. In this work, we develop a Vision-to-Force (V2F) pipeline that combines computer vision-based segmentation, active-contour refinement, and geometric feature extraction with a physics-informe","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13420,"title":"EgoRecovery: Acquiring Failure Recovery Ability Through Human Recovery Demonstration","url":"https://arxiv.org/abs/2607.19745","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19745v1 Announce Type: new \nAbstract: Robust embodied robots should be able to recover from failures and retry tasks in order to operate reliably in unstructured and noisy real-world environments. Achieving this capability requires training policies on data that captures recovery behaviors. However, collecting such data through robot teleoperation is difficult to scale, as it is time-consuming to induce diverse failure states, perform corrective actions, and reset the environment. This challenge is further exacerbated by the high diversity of failure modes, which demands substantial","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"},{"id":13419,"title":"Morphing MILR: Design and control of a cable-driven limbless robot with rolling joints for maneuvering in complex environments","url":"https://arxiv.org/abs/2607.19714","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.19714v1 Announce Type: new \nAbstract: Limbless robots offer exceptional mobility in confined and cluttered environments due to their slender bodies and their ability to exploit body-terrain interactions. Recent designs incorporating compliance demonstrate robust locomotion without complex sensing or control; however, these systems typically rely on fixed body configurations, with each morphology specialized for a single locomotion mode or environment. This raises a key challenge: how can a single limbless robot achieve versatile locomotion while preserving the robustness of complian","tags":[],"cluster_size":1,"ts":"2026-07-23T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
