股快讯"],"summary":"恒指高开0.23%，报23404.61点；恒生科技指数涨0.55%。中芯国际涨2.9%，华虹宏力涨2.2%。","tags":[],"cluster_size":1,"ts":"2026-07-06T01:22:47"},{"id":8146,"title":"国有大行再现5年期个人大额存单","url":"https://wallstreetcn.com/livenews/3129051","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"近日，中国银行发布公告称，于7月1日发售2026年第一期个人大额存单，引发市场关注。公告显示，本期发售人民币标准类固定利率大额存单，包括1个月、3个月、6个月、1年、2年、3年、5年共计七个期限。产品类型分为常规产品、1号产品、3号产品三种，其中，常规产品5年期年化利率为1.6%；3号产品5年期年化利率为1.55%，起点金额均为20万元。目前，该行整存整取5年期定期存款年化利率为1.30%。对比之下，大额存单利率确实更有优势，收益较高。","tags":[],"cluster_size":1,"ts":"2026-07-06T00:12:17"},{"id":8147,"title":"字节跳动与阿里巴巴暂停拟人化AI代理功能应对新规落地- 字节跳动ByteDance - cnBeta.COM","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTFBLRTF6WWt5TU9FWTlNdXI1Q01ia2JvUUFMcGppcHRFNmtGYWxNZ1ZKTXI3ZHpDVENpR1lUcUpjdkhBX1NkZFBhS1g3TGNtVTdKdUtTNjlIUVFSVGdqRmJoZg?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTFBLRTF6WWt5TU9FWTlNdXI1Q01ia2JvUUFMcGppcHRFNmtGYWxNZ1ZKTXI3ZHpDVENpR1lUcUpjdkhBX1NkZFBhS1g3TGNtVTdKdUtTNjlIUVFSVGdqRmJoZg?oc=5\" target=\"_blank\"\u003e字节跳动与阿里巴巴暂停拟人化AI代理功能应对新规落地- 字节跳动ByteDance\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ecnBeta.COM\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-05T23:46:00"},{"id":8148,"title":"中国央行公开市场本周有6785亿元逆回购到期","url":"https://wallstreetcn.com/livenews/3129046","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"其中，周一至周五分别到期1575亿元、695亿元、1000亿元、2885亿元、630亿元。此外，周一有8000亿元89天期买断式逆回购到期，中国央行周一将开展1万亿元买断式逆回购操作，期限为3个月（91天）。","tags":[],"cluster_size":1,"ts":"2026-07-05T23:45:19"},{"id":8149,"title":"特朗普对哈梅内伊葬礼感到“震惊”","url":"https://wallstreetcn.com/livenews/3129042","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"据半岛电视台报道，美国总统特朗普7月4日接受采访时表示，伊朗民众对已故最高领袖阿里·哈梅内伊哀悼的景象让他感到“震惊”，“我还以为伊朗人不喜欢他”。特朗普还声称，（哈梅内伊葬礼上）伊朗的高层都在一起，一次攻击就能全部干掉他们，但他不会这么做，因为全部干掉就没人可以谈判。（参考消息）","tags":[],"cluster_size":1,"ts":"2026-07-05T23:28:46"},{"id":8150,"title":"科技基金交易拥挤风险增加 洼地资产有望逐步成为公募布局方向","url":"https://wallstreetcn.com/livenews/3129039","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年上半年，全市场200多只科技主题基金净值翻倍，这在历史上极为少见。在科技基金交易拥挤风险增加之际，资金止盈兑现与赎回的压力开始增大。在此背景下，公募赛道切换节奏也顺势加速。随着二季度结束、三季度开启，公募基金的季度调仓窗口期来临，公募资金开始自高位拥挤的AI赛道向外分流，消费、医药等前期超跌板块与被公募减持的港股成为新的承接方向。多家基金公司也提示，科技板块短期波动风险加大，低估的洼地资产有望逐步成为公募布局的重要方向。","tags":[],"cluster_size":1,"ts":"2026-07-05T23:15:18"},{"id":8151,"title":"华尔街见闻早餐 | 2026年7月5日","url":"https://wallstreetcn.com/livenews/3129038","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股上周五休市，泛欧股指收创新高，芯片股ASML收涨3.6%、Aixtron涨6%；现货黄金盘中涨近2%，全周扭转四周连跌；周一亚市盘初，纳斯达克100指数期货涨逾1%。\n\nOPEC+同意8月上调配额18.8万桶/日，美伊战争爆发以来累计上调已近百万桶。\n\n与特朗普通话85分钟，普京称“俄军正全线进攻”，此前威胁夺乌克兰更多土地建安全区。俄乌互相发动大规模袭击。\n\n特朗普：哈梅内伊葬礼上一次攻击就能全部干掉伊朗高层，但不会这么做，这样就没人谈判了。沙特媒体：美伊新一轮会谈11日将在巴基斯坦举行。\n\n韩国政府：拟使用半导体税收红利设立“未来应对基金”，规模最高100万亿韩元。\n\nSK海力士料于周五登陆纳斯达克，有望成为有史以来最大外国公司赴美上市案。\n\nOpenAI计划于7月7日发布GPT-5.6，精准卡点Claude Fable 5限额方案失效日。\n\nHBM竞赛升级！美光日本90亿美元扩建项目开工，预计2028年出货。\n\n鸿海二季度营收同比增长近40%，AI业务驱动三季度有望持续高增长。\n\n中际旭创：“公司上游物料炫光片被封锁”的市场传言不符合事实。","tags":[],"cluster_size":1,"ts":"2026-07-05T23:05:16"},{"id":8152,"title":"三季度公募基金调查显示：科技成长仍是“心头好”，极致分化后打法生变","url":"https://wallstreetcn.com/livenews/3129034","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，上证报联合天天基金进行了三季度公募基金调查，南方、鹏华等多家基金公司的基金经理参与，从调查结果中可以一窥公募基金配置偏好与调仓思路。调查显示，高景气、科技成长赛道仍是三季度公募基金最为看好的方向，获票数超过七成，远超其他板块。排名第二的为低估值蓝筹、高股息类价值资产，关注度较上次调查显著提升，占比近三成。具体而言，算力、CPO、机器人板块关注度显著领先，但非银金融等方向也获得了较大关注。黄金、油气资源等板块关注度较低。","tags":[],"cluster_size":1,"ts":"2026-07-05T22:49:51"},{"id":8153,"title":"注销式回购引关注，上市公司打出“组合拳”","url":"https://wallstreetcn.com/livenews/3129033","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至7月5日19时，剔除定向回购影响，今年以来A股共有297家上市公司对外披露回购方案，拟回购金额约为1113.97亿元。从回购目的看，约六成公司用于实施股权激励或员工持股计划，其余公司基本用于市值管理、维护公司价值及股东权益。不少上市公司近期将回购用途更改为注销。除了回购外，不少上市公司重要股东出手增持，引发市场关注。","tags":[],"cluster_size":1,"ts":"2026-07-05T22:45:06"},{"id":8154,"title":"一批ST公司“摘帽”，年报问询紧盯新增业务可持续性","url":"https://wallstreetcn.com/livenews/3129032","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"数据显示，今年以来，已有61家A股公司成功撤销退市风险警示或其他风险警示，其中6月以来就有35家公司顺利“摘帽”。记者发现，从“摘帽”基本条件来看，大部分公司系“组合类”财务指标达标，尤其是借助营业收入指标“过线”而“脱险”，但此类公司净利润基本仍处于亏损状态，交易所年报问询也对其后续盈利能力、持续经营能力予以重点关注。目前，不少公司已启动资本运作，或借力并购谋求业务转型，或筹划易主注入发展新动能。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-05T22:43:47"},{"id":8155,"title":"A股交易新规今起施行，券商配套更新风险揭示书","url":"https://wallstreetcn.com/livenews/3129031","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"沪深北交易所新版交易规则今日正式施行。为匹配新版交易规则，券商发布公告，同步修订风险揭示书，新版文件7月6日正式启用。公告明确，存量已开通对应板块权限的投资者无须重新签署，新开通权限投资者必须签署新版文件方可参与交易。多家券商提醒投资者，在参与股票投资前，仔细阅读交易所规则、券商新版风险揭示书，合理调整交易策略，规避因规则不熟悉引发的操作风险与投资亏损。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-05T22:42:25"},{"id":8156,"title":"上周逾百亿资金回流股票ETF，硬科技板块热度居高不下","url":"https://wallstreetcn.com/livenews/3129030","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在A股近期的震荡调整行情中，资金借道ETF逆势布局。上周股票型ETF获得资金净流入超过110亿元。从资金流向看，资金大举加仓以半导体为代表的硬科技板块，同时部分资金减持了消费电子等赛道。在业内人士看来，近期科技板块成交热度持续攀升，交易拥挤度较高，资金正在从“泛科技”向“AI业绩兑现”集中。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-05T22:41:52"},{"id":8157,"title":"纳指期货周一亚市盘初涨逾1%","url":"https://wallstreetcn.com/livenews/3129020","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股期货亚市盘初走高，标普500指数期货涨0.4%，纳斯达克100指数期货涨1.2%。","tags":[],"cluster_size":1,"ts":"2026-07-05T22:05:07"},{"id":8158,"title":"招商证券：短期冲击后关注科技修复与中报业绩双主线","url":"https://wallstreetcn.com/livenews/3129017","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"招商证券发布研报称，短期冲击后关注科技修复与中报业绩双主线。Meta出售算力导致的市场大幅调整，但这并非算力过剩的信号，而是高资本开支阶段提升资产回报率的必然选择。行业当前从单纯的Capex扩张进入ROIC验证阶段，而非进入算力过剩阶段。而市场目前的调整，主要由于短期泛算力板块涨幅较大，叠加杠杆资金放大波动，悲观叙事容易引起市场短期的资金负反馈，此前多次的AI泡沫论与苹果涨价，都是相同的剧情。","tags":[],"cluster_size":1,"ts":"2026-07-05T14:00:16"},{"id":8159,"title":"卫网君：太空算力“三连击”：中国移动2520颗卫星+北京创新中心揭牌+天算星座全国组网；蓝色起源公布复飞路径，混合构型替代重建发射台 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxORUktV3dhVmpnVld3MjF2OEFzZXRyQkRJX1gxU2c3aU15b3NDM0FUVG1wT05tVlJwcHg3X090WndZeF9HN0kwX3BOQ0s 何训练自己换个角度思考问题\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-05T23:22:59"},{"id":8276,"title":"HBM 之父金正浩：AI 的本质是内存，GPU 真正工作的时间只有 10%-30%","url":"https://www.ithome.com/0/972/872.htm","source":"IT之家","sources":["IT之家","GNews · 国内AI媒体"],"summary":"\u003cp data-vmark=\"49ec\"\u003eIT之家 7 月 6 日消息，被誉为“HBM 之父”的韩国科学技术院（KAIST）电气系教授金正浩近日接受《东亚日报》采访时表示，AI 的核心竞争力正在从 GPU 转向内存。\u003c/p\u003e\u003cp data-vmark=\"8575\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/de43aa1e-59c1-4a26-abed-8b93571fee9a.png\" w=\"1440\" h=\"884\" data-weibo=\"0\" data-vmark=\"1f38\"\u003e\u003c/p\u003e\u003cp data-vmark=\"796c\"\u003e金正浩认为 AI 的本质是内存，GPU 在 AI 推理中的利用率远低于理论水平。AI 每次输出结果，都必须先从 HBM 读取数据、传到 GPU 进行计算，再将结果写回内存。就算部署 100 万块 GPU，真正用于计算的时间也只有 10%-30%。\u003c/p\u003e\u003cp data-vmark=\"8905\"\u003e并且过去的 AI 主要集中在训练阶段，因此 GPU 是决定性能的核心。而着眼现在和未来，AI 将进入推理时代，此时真正能决定性能的，是一次能处理多少数据、能以多快速度处理数据，因此内存能力将直接决定 AI 性能。\u003c/p\u003e\u003cp data-","tags":[],"cluster_size":2,"ts":"2026-07-05T23:22:04"},{"id":8277,"title":"人工智能模型正在迎来属于它们的“iPhone时刻”，接下来会发生什么？ - 36 Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1ndG1mOEF3VER2aV9NM2xhUnRPeGFnMlcyRzJweUZsYWRLWmZuMTJyN2lHWUtITDJOVFU4WjBpdHdyYkdKRVpCcjFiZ1lTbjdh?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1ndG1mOEF3VER2aV9NM2xhUnRPeGFnMlcyRzJweUZsYWRLWmZuMTJyN2lHWUtITDJOVFU4WjBpdHdyYkdKRVpCcjFiZ1lTbjdh?oc=5\" target=\"_blank\"\u003e人工智能模型正在迎来属于它们的“iPhone时刻”，接下来会发生什么？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-05T23:07:58"},{"id":8278,"title":"美国部分富人放弃传统学校，年费 7.5 万美元送孩子上 AI 私塾","url":"https://www.ithome.com/0/972/868.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"a307\"\u003eIT之家 7 月 6 日消息，大多数美国人并不信任人工智能，人们甚至不愿听 AI 生成 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
