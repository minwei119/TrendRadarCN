A股辅导协议，正式启动“回A”进程。值得注意的是，该公司于今年5月底登陆港交所，仅三个多月便筹划“回A”，开启“A+H”两地上市战略布局。梳理发现，截至9月7日，年内已有15家港股上市公司披露“回A”相关进展。整体来看，这批企业普遍具备高研发投入、高技术壁垒、高成长预期的“三高”特征。从行业分布来看，医疗保健和信息技术企业是本轮“回A”主力，其中，AI（人工智能）赛道相关企业正成为“回A”队伍中新的增长极。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-09-07T22:53:11"},{"id":26610,"title":"Alibaba Stock Has Fallen 41% From Its High. Is the AI Spend Creating a Bargain or a Trap? - TIKR.com","url":"https://news.google.com/rss/articles/CBMitwFBVV95cUxOMlkwR1pTNHZfOUVGaGQ3SHBjczdNNkl5QUpkS3h1Ql9lbG1YNTdRak1yZ2N6bkkxWmFlVjhOdTZlT1FwVDRjSEI1N204anJ1X0F5ZG1Qbl9sRVhkTHFGWWRtUElLR0lxc1p4SnVJM1VFY2tKZUZubTJGWW5KY3d2QjNXYWplSDgzYTI3b2o2YlRLOXZTa205NGRPLS0talFMcHJSQXZNRzB0M0Mta3pWbDFFMl9uQjQ?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMitwFBVV95cUxOMlkwR1pTNHZfOUVGaGQ3SHBjczdNNkl5QUpkS3h1Ql9lbG1YNTdRak1yZ2N6bkkxWmFlVjhOdTZlT1FwVDRjSEI1N204anJ1X0F5ZG1Qbl9sRVhkTHFGWWRtUElLR0lxc1p4SnVJM1VFY2tKZUZubTJGWW5KY3d2QjNXYWplSDgzYTI3b2o2YlRLOXZTa205NGRPLS0talFMcHJSQXZNRzB0M0Mta3pWbDFFMl9uQjQ?oc=5\" target=\"_blank\"\u003eAlibaba Stock Has Fallen 41% From Its High. Is the AI Spend Creating a Bargain or a Trap?\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTIKR.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-07T22:49:30"},{"id":26611,"title":"熟悉的味道。皮肤怕是要收费吧。$腾讯控股(00700)$ - 雪球","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1tblg1dVpwZGZmWmlGTW9ob0tkZjFfaXV3elRwNE1YU05SYVJrbzRSQnhPa3FWclkzYklmX2pqeXlmQU9QTG9YTUZmVlFqZFlF?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1tblg1dVpwZGZmWmlGTW9ob0tkZjFfaXV3elRwNE1YU05SYVJrbzRSQnhPa3FWclkzYklmX2pqeXlmQU9QTG9YTUZmVlFqZFlF?oc=5\" target=\"_blank\"\u003e熟悉的味道。皮肤怕是要收费吧。$腾讯控股(00700)$\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e雪球\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-07T22:31:00"},{"id":26612,"title": NzNFZmJtUXlTM1NHVGVKVVZOS0pIODR1dk5RbnBYV1ZZZ0dhVmZGazlleFM2bFJpR3E1RWRHRWxLSEZpZ1kyMjkxRXc?oc=5\" target=\"_blank\"\u003eFrom dance floor to war: China readies humanoid robots for combat\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eReuters\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-07T06:04:00"},{"id":26753,"title":"Human-Human \u0026 Human-Robot Interaction Transformer (H2INT) for Robot Navigation in Dense and Uncertain Crowds","url":"https://arxiv.org/abs/2609.05300","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05300v1 Announce Type: new \nAbstract: Safe robot navigation in dense crowds requires reasoning about pedestrian motion and how it may change in response to a robot. However, many learning-based approaches generate pedestrian motion independently of the robot or assume uniform reciprocity, omitting an important source of interaction uncertainty. This paper presents a Human-Human \u0026 Human-Robot Interaction Transformer (H2INT), a reinforcement learning framework that retains robot-conditioned changes in pedestrian motion during policy learning while allowing responsiveness to vary acros","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26752,"title":"Temporal Tactile Encoding and Compliance for Intent-Aware Robot-to-Human Bimanual Handover","url":"https://arxiv.org/abs/2609.05282","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05282v1 Announce Type: new \nAbstract: Reliable robot-to-human handover requires the robot to infer when the person is ready to receive the object, and release it safely, comfortably, and at the right time. This is challenging because visual observations alone may not disambiguate clear taking intent from accidental contact, weak grasping, wrong-direction forces, or transient interactions. In this work we treat human-robot handover as an intrinsically multimodal problem. Our approach couples a VLA model with a compliance controller that reduces interaction forces during object transf","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26751,"title":"TacPAC: Tactile Prediction and Real-Time Action Correction in World-Action Models for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2609.05266","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05266v1 Announce Type: new \nAbstract: World-action models guide action generation with predicted future observations, but vision-centric predictions miss the local contact cues that decide contact-rich manipulation. However, naively predicting future tactile observations as additional views recovers only a third of the achievable gain in our experiments. This gap reflects a timing mismatch: predictions precede execution, while tactile feedback arrives during it. We introduce TacPAC, which turns tactile prediction into real-time action correction. Once the base model has planned an a","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26750,"title":"One Word, Different Action: A Real-Robot Benchmark for Language-Conditioned Embodied Reasoning","url":"https://arxiv.org/abs/2609.05260","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05260v1 Announce Type: new \nAbstract: Natural-language instruction changes can directly alter robot behavior. A reliable embodied system should preserve its action when the task is unchanged and update it correctly when the task itself changes. We introduce One Word, Different Action, a real-robot benchmark built on physical decision states and executable actions, using task-preserving and task-changing instruction pairs to jointly evaluate Decision Invariance and Decision Sensitivity, with further evaluation under multi-constraint reasoning and real-RGB grounding. Experiments show","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26749,"title":"Morphology and actuation as inductive biases in robotic hand manipulation","url":"https://arxiv.org/abs/2609.05206","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05206v1 Announce Type: new \nAbstract: Robotic hands vary widely in anatomical fidelity and mechanical complexity, and these structural choices influence the coordination of joint motions and the difficulty of controlling the system. A unified framework is presented in which the kinematic and actuation stages are analysed separately and in composition, through the conditioning of the task Jacobian, the actuation matrix, and their product. It is applied to two hands representing opposing design philosophies, the Shadow Dexterous Hand and the Anatomically Correct, Biomechatronic Hand,","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26748,"title":"LIBERO-RECOVER: Beyond Task Success Towards Failure Recovery in Robotic Manipulation Models","url":"https://arxiv.org/abs/2609.05178","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05178v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) or World Action (WAM) models have recently demonstrated remarkable performance in robotic manipulation. On LIBERO, SOTA method have achieved nearly 100\\% success rates, seemingly suggesting that the models are ready for deployment in real world. However, near perfect performance on existing benchmarks can be misleading: success under ideal conditions does not imply real world robustness. Existing benchmarks primarily evaluate task completion from predefined initial states, while real world interactions inevitably inv","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26747,"title":"A Schema Bounded Language Model for Refining Robot Policies Without Destabilizing Local Learning","url":"https://arxiv.org/abs/2609.05133","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.05133v1 Announce Type: new \nAbstract: This paper addresses navigation by composite heterogeneous robots in a decentralized system when policy reasoning and local control operate at different update levels. In a NetLogo--Python implementation, three robots share motion dynamics but use different LLM backends. Each robot independently combines a large language model (LLM) policy agent, an Upper Confidence Bound (UCB) bandit, and a Double Deep Q-Network (Double DQN) controller; no central LLM generates team actions. LLM inference is confined to round-level policy generation and refinem","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26746,"title":"Reasoning Without Inference Cost: Latent Semantic Scaffolding for Robot VLA Policies","url":"https://arxiv.org/abs/2609.04893","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04893v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models are trained by imitation and capture what action to take but not why; adding causal reasoning improves manipulation, but current methods pay for it at inference time - generating reasoning tokens or rolling out predicted future states at every step, a cost that compounds over long horizons. We ask whether this benefit can instead be captured during training and discarded before deployment. We introduce Latent Semantic Scaffolding (LSS), an auxiliary loss applied during human-demonstration pretraining that alig","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26745,"title":"Coupled Control and Wireless World Models for Resilient Remote Robotic Control","url":"https://arxiv.org/abs/2609.04851","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04851v1 Announce Type: new \nAbstract: Remote robotic systems operating over wireless networks must maintain reliable control despite limited communication resources, changing channel conditions, and environmental disturbances.However, continuously transmitting high-dimensional sensory observations, such as camera images, increases communication overhead and energy consumption while reducing robustness under unreliable connectivity.To address these challenges, this paper proposes a resilient communication-aware remote robotic control framework based on coupled control and wireless Jo","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26744,"title":"HaptiNet: Networked Haptic Robots Enable Physical Co-presence in Geographically-Unconstrained Rehabilitation","url":"https://arxiv.org/abs/2609.04799","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04799v1 Announce Type: new \nAbstract: Cooperative rehabilitation enhances engagement, task performance, and social-motor interaction, yet it demands physical co-presence: users must transmit forces, coordinate movements, and infer intent through haptic contact. Telerehabilitation promises to expand access for patients constrained by distance, mobility, or clinical disparities, yet current techniques remain predominantly audiovisual while leaving users haptically and physically isolated. Here, we introduce HaptiNet, a networked haptic robotic system enabling physical co-presence for","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26743,"title":"Continuous Cognitive Coverage for Autonomous Robots via Event-Dependent Cognitive Treatment and Learning","url":"https://arxiv.org/abs/2609.04770","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04770v1 Announce Type: new \nAbstract: Autonomous robots continuously encounter objects, changes, and situations, and every event admitted into cognition should receive an appropriate cognitive treatment rather than remain untreated until an explicit task requires attention. However, existing task-driven, reactive, or fixed-reasoning approaches generally process only selected events or apply predefined reasoning procedures, making it difficult to provide continuous cognitive coverage with differentiated treatment. This paper proposes a continuous cognitive coverage framework in which","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26742,"title":"Dressing in Motion: A Human Motion-Aware Diffusion Policy for Robot-Assisted Dressing","url":"https://arxiv.org/abs/2609.04759","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04759v1 Announce Type: new \nAbstract: Robotic dressing assistance is a promising solution for supporting older adults with physical impairments in daily living. However, dressing under human motion remains challenging, as complex garment--human contact and occlusions make it difficult to generate actions aligned with arm movements. In this letter, we propose a visuomotor policy that learns dressing skills from static expert demonstrations and generalizes to dynamic user-motion scenarios. A diffusion policy tailored to garment--human interaction geometry learns from partially observe","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26741,"title":"Pack It My Way: Triadic Human-Robot Collaboration for Personalized Autonomous Packing","url":"https://arxiv.org/abs/2609.04620","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04620v1 Announce Type: new \nAbstract: Personalized autonomous packing requires robots to account for resident preferences that cannot be inferred from scene geometry alone. Expert teleoperators can interpret these preferences and translate them into feasible robot actions, but continuous expert involvement limits scalable deployment. In this paper, we investigate triadic human-robot collaboration among a resident, a correction mediator, and a robot by comparing human-expert and voice-agent mediation. We evaluate the two conditions in a user study across Protection, Compactness, andG","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26740,"title":"Open-Set 3D Scene Graphs for Field Robotics: An Outdoor Case Study","url":"https://arxiv.org/abs/2609.04607","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04607v1 Announce Type: new \nAbstract: Three-dimensional scene graphs (3DSGs) have emerged as a promising approach for building geometrically grounded, semantically informed, hierarchical general-purpose maps to support high-level robotic reasoning. However, the behavior of 3DSGs in real-world outdoor deployments remains poorly understood, particularly when combined with open-set vision-language models (VLMs). In this field report, we analyze the components common to most 3DSG representations across five outdoor robotic datasets to characterize challenges that arise in complex outdoo","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26739,"title":"SocioGesture: Real-Time and Adaptive Social Gesture Perception for Human-Robot Interaction","url":"https://arxiv.org/abs/2609.04545","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04545v1 Announce Type: new \nAbstract: Robots interacting with people must recognize not only explicit commands, but also social cues such as invitations, refusals, and unavailability. In real deployments, these cues must be inferred from noisy onboard perception under partial occlusion, changing viewpoints, and strict latency constraints. We present SocioGesture, a real-time adaptive social gesture perception system for human-robot interaction (HRI). SocioGesture uses a compact confidence-aware body-hand skeleton representation and a lightweight dual-stream model that fuses body mot","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26738,"title":"AquaBEV: Monocular Underwater BEV Occupancy with 3D Sonar Supervision","url":"https://arxiv.org/abs/2609.04411","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04411v1 Announce Type: new \nAbstract: Autonomous underwater robots are widely used for exploration, monitoring, and inspection, where safe navigation depends on understanding the surrounding free and occupied space. Bird's eye view (BEV) occupancy provides such a representation, but predicting it from a single underwater RGB image is difficult due to limited, unreliable geometric cues from appearance alone. 3D imaging sonar offers complementary geometric measurements to supervise this task.\n  We introduce AquaBEV, a monocular underwater occupancy model that predicts local BEV occupa","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26737,"title":"VLA-Precision: Asymmetric Co-Bootstrapping for Efficient Real-World Online RL of Vision-Language-Action Models","url":"https://arxiv.org/abs/2609.04355","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04355v1 Announce Type: new \nAbstract: Pretrained vision-language-action (VLA) models enable broad manipulation but remain unreliable in tasks demanding precision and repeatability. Applying real-world online reinforcement learning (RL) to VLA post-training enables autonomous trial-and-error improvement beyond demonstrations alone, but exposes two bottlenecks: 1) unreliable value signals can induce policy drift; 2) large-VLA overhead constrains throughput and sample efficiency. To address these challenges, we present VLA-Precision, an efficient real-world online RL framework featurin","tags":[],"cluster_size":1,"ts":"2026-09-07T04:00:00"},{"id":26736,"title":"FailureSpot: Label-Efficient Timestamp-Level Failure Detection for Vision-Language-Action Models","url":"https://arxiv.org/abs/2609.04277","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.04277v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies have shown strong potential for general-purpose robotic manipulation, but they can still fail unpredictably during long-horizon execution, making reliable failure detection essential for safe deployment. Existing methods either rely on visual models that typically detect failures only after erroneous actions have occurred, or use lightweight proactive detectors trained on VLA internal representations. However, these proactive methods // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
