ces":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMivwFBVV95cUxNTlk2c0UxLTBmNFhfb0FHU2hkMmVsUkV5NTJqTkFON05WMG80Rm96T3dYMWVibVZxMFVvSVdTODBoTjM2UVdtTGlNQ0tTc3VKMUZWVnJZbWpSTWZVYjFTMW9iTUpSaUV6QkM2Y2dBeVprRlFkcDVubmY4YXRXQXljNm1BTEM2Y0tfVE1pdWF2R1JUOEJCdTlxMXl2NENfM2h6enl0QU1hYXRRNG1XV2s5MnJPMDBBeVVGaGFjQS00Zw?oc=5\" target=\"_blank\"\u003eHumanoid Robots: China Ships 90% of Global Units and Now Leads AI Benchmarks\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTech Times\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-18T17:52:29"},{"id":3577,"title":"ZiMPedance: Impedance-Aware ZMP Modeling and Control for Payload Carrying with Quadruped Robots","url":"https://arxiv.org/abs/2606.18883","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18883v1 Announce Type: new \nAbstract: Load transportation with quadruped robots is strongly affected by the dynamics of the physical interface between the robot and the load. Passive spring-based arms reduce weight and complexity compared to active manipulators, but their spring-damper dynamics can introduce oscillatory forces that degrade locomotion stability. This paper derives an extended Zero Moment Point (ZMP) formulation that includes passive payload-interface dynamics, relating stiffness, damping, and payload mass to the stability margin. The analysis shows that underdamped c","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3576,"title":"HALOMI: Learning Humanoid Loco-Manipulation with Active Perception from Human Demonstrations","url":"https://arxiv.org/abs/2606.18772","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18772v1 Announce Type: new \nAbstract: Human demonstrations, which can be collected at scale and naturally capture active hand-eye coordination, are a promising data source for learning humanoid loco-manipulation. However, directly transferring human demonstrations to humanoids requires a precise world-frame tracking controller, which is often brittle under Out-of-Distribution(OOD) targets, while human-to-humanoid gaps persist in both egocentric observation and action execution. To address these challenges, we present HALOMI, a scalable framework for learning humanoid loco-manipulati","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3575,"title":"Generating Natural and Expressive Robot Gestures through Iterative Reinforcement Learning with Human Feedback using LLMs","url":"https://arxiv.org/abs/2606.18747","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18747v1 Announce Type: new \nAbstract: Expressive gestures are essential for natural and effective communication, complementing speech when verbal cues alone are insufficient (e.g., pointing). For social robots such as the humanoid Pepper, producing natural and expressive movements is critical for improving human-robot interaction (HRI) and long-term acceptance. However, generating gestures remains challenging due to reliance on expert-authored animations, resulting in rigid behaviors that are impractical for dynamic and diverse environments. Alternatively, machine learning approache","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3574,"title":"Selective Unit-Cell Actuation in Lattice Structures for Distributed Morphology in Soft Robots","url":"https://arxiv.org/abs/2606.18704","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18704v1 Announce Type: new \nAbstract: Soft lattice structures are increasingly used in robotics to tailor compliance and guide deformation; however, actuation is typically introduced at the device or module level, with actuators inserted into otherwise passive architectures. In this work, we move actuator-lattice co-design to the unit-cell scale. We present an embedded pneumatic unit cell that integrates curved-strut lattice geometry with a bidirectional bellow actuator within a single monolithic element. When tessellated, the lattice functions as a distributed actuation field in wh","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3573,"title":"Leveraging Energy Features for Surface Classification with Deep Learning: A Comparative Analysis Across Three Independent Datasets","url":"https://arxiv.org/abs/2606.18698","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18698v1 Announce Type: new \nAbstract: The energy-based method remains a comparatively underexamined approach for surface classification in mobile robotics, despite promising results in constrained environments. This study evaluated the viability of using energy-derived features as either a standalone classification modality or as supplementary input to inertial data. A comprehensive evaluation was conducted across three publicly available datasets, comparing the performance of modern deep learning architectures including recurrent neural networks, convolutional neural networks, enco","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3572,"title":"High-Degree-of-Freedom Lightweight Bioinspired Leg for Enhanced Mobility in Small Robots","url":"https://arxiv.org/abs/2606.18680","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18680v1 Announce Type: new \nAbstract: In microrobotics, enhancing locomotion capabilities by increasing the degrees of freedom (DoF) of leg mechanisms under severe spatial constraints remains a significant challenge. Inspired by insect locomotion, this paper presents a novel micro-scale parallel leg mechanism with four degrees of freedom, and systematically analyzes its mechanical design, electrical system, and kinematics. The design incorporates two spherical five-bar linkages to achieve spatial motion within a parallel four-bar configuration. Furthermore, a concentric design strat","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3571,"title":"A Scalable Embodied Intelligence Platform for Seamless Real-to-Sim-to-Real Transfer of Household Mobile Manipulation Tasks","url":"https://arxiv.org/abs/2606.18646","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18646v1 Announce Type: new \nAbstract: Mobile manipulation is a fundamental capability in embodied intelligence robotics. The growing demand for robust and generalizable manipulation in unstructured household environments has driven rapid progress in embodied intelligence platforms. However, achieving a seamless transfer across the real-to-sim-to-real cycle faces three key challenges, including costly high-fidelity simulation scenes reconstruction, the complexity of systematic strategy evaluation in simulation, and incompatible real-world deployments. To address these challenges, we","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3570,"title":"EffiNav: Fusing Depth and Vision-Language for Efficient Object Goal Navigation","url":"https://arxiv.org/abs/2606.18634","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18634v1 Announce Type: new \nAbstract: To locate a target object while exploring the unknown environment is a fundamental capability for autonomous agents, with applications ranging from search-and-rescue to field robots. A simplified version of such task is Object Goal Navigation (ObjNav). In ObjNav, successful arrival at the target object provides a basic measure of performance; however, the efficiency of the navigation trajectory is equally important, as it indicates how intelligently the agent explores and how much time remains for subsequent tasks. In unknown environments, the k","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3569,"title":"ROBOSHACKLES: A Safety Dataset for Human-Injury Prevention in Embodied Foundation Models","url":"https://arxiv.org/abs/2606.18632","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18632v1 Announce Type: new \nAbstract: Embodied Foundation Models (EFMs) integrate multimodal understanding, future-state reasoning, and executable robot actions. Yet their safety alignment for human-injury prevention remains underexplored, primarily because real-world data of robots harming humans or creating hazardous household situations cannot be safely or ethically collected. To address this challenge, we propose a safety-critical data construction pipeline for human-injury prevention in EFMs.Starting from real DROID observations, our construction pipeline proceeds through scene","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3568,"title":"Self-Supervised Mask-Aware Transformers for Fault-Tolerant FBG Force Sensing in Minimally Invasive Surgical Robotics","url":"https://arxiv.org/abs/2606.18628","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18628v1 Announce Type: new \nAbstract: In minimally invasive surgical robotics, catheter-scale Fiber Bragg Grating (FBG) sensors are promising due to their ability to estimate multi-dimensional forces by multiplexing several optical channels. However, deploying these compact multi-channel sensors introduces two critical engineering challenges: inherent nonlinear cross-axis coupling during complex deformations, and intermittent channel dropouts caused by fiber fractures in constrained workspaces. These compounding issues severely degrade force estimation. Existing fault-tolerant appro","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3567,"title":"SRL: Combining SLIP Model and Reinforcement Learning for Agile Robotic Jumping","url":"https://arxiv.org/abs/2606.18625","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18625v1 Announce Type: new \nAbstract: Robotic jumping is pivotal in applications such as search and rescue and logistics, where crossing obstacles and enhancing mobility efficiency are critical. The Spring-Loaded Inverted Pendulum (SLIP) model leverages simplified spring-mass dynamics that naturally encode biologically plausible hopping motions, yet its performance degrades on irregular terrain due to idealized assumptions regarding contact and joint dynamics. Meanwhile, Reinforcement Learning (RL) can adapt to diverse and complex environments but often requires extensive data from","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3566,"title":"SC3-Eval: Evaluating Robot Foundation Models via Self-Consistent Video Generation","url":"https://arxiv.org/abs/2606.18610","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18610v1 Announce Type: new \nAbstract: Evaluating generalist robot manipulation policies in the real world is expensive, slow, and difficult to scale. Action-conditioned video world models offer a scalable alternative by simulating policy rollouts. Autoregressive rollouts accumulate compounding errors, observations across multiple camera views must remain mutually consistent, and the evaluator must generalize to policies whose behaviors lie outside the training distribution. We address these challenges with SC3-Eval, a self-consistent video generation recipe that adapts a pre-trained","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3565,"title":"Admittance-Based Surface Alignment for Human-in-the-Loop Robotic Visual Inspection","url":"https://arxiv.org/abs/2606.18601","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18601v1 Announce Type: new \nAbstract: Precision visual inspection underpins quality assurance across aerospace, semiconductor, and medical manufacturing, where undetected surface anomalies on high-value parts translate directly into scrap, rework, and field failures. Robotic visual inspection requires precise alignment between the end-effector and local surface geometry in the presence of perception noise and surface irregularities. In industrial settings, a human operator is often kept in the loop via teleoperation or shared autonomy, introducing real-time adjustments that render p","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3564,"title":"Benchmarking Action Spaces in Reinforcement Learning for Vision-based Robotic Manipulation","url":"https://arxiv.org/abs/2606.18594","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18594v1 Announce Type: new \nAbstract: In real-world reinforcement learning (RL), the choice of action space can play a key role in shaping motion smoothness, safety, and overall task performance. In this study, we evaluate pose increment, pose velocity, joint position increment, and joint velocity across two vision-based manipulation tasks: object picking and pushing. We train policies in simulation and deploy them to the real world using sim-to-real transfer. We find that action-space representation indeed significantly affects sim-to-real performance. In particular, we find that t","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3563,"title":"DREAM-Chunk: Reactive Action Chunking with Latent World Model","url":"https://arxiv.org/abs/2606.18589","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18589v1 Announce Type: new \nAbstract: Action chunking has become a common interface for vision-language-action (VLA) models, enabling low-frequency policy inference to drive high-frequency robot execution. However, once an action chunk is committed, its open-loop execution can be brittle under stochastic dynamics, hardware execution errors, and partial observability. We propose DREAM-Chunk, a test-time scaling method that augments chunking-based policies with a lightweight latent world model, without requiring additional policy fine-tuning. At test time, DREAM-Chunk samples multiple","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3562,"title":"As You Wish: Mission Planning with Formal Verification using LLMs in Precision Agriculture","url":"https://arxiv.org/abs/2606.18519","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18519v1 Announce Type: new \nAbstract: Though robotic systems are now being commercialized and deployed in various industries, many of these systems are highly specialized and often require an advanced skill set to operate and ensure they perform as instructed. To mitigate this problem, we recently introduced a mission planner leveraging LLMs to synthesize mission plans in precision agriculture based on mission descriptions provided in natural language. While the system demonstrates impressive performance, it also suffers from the inherent ambiguities of natural language. In this pap","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3561,"title":"VEGA: Learning Navigation VLAs from In-the-Wild Egocentric Video with Geometric Trajectory Supervision","url":"https://arxiv.org/abs/2606.18426","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18426v1 Announce Type: new \nAbstract: We introduce VEGA, an approach for training navigation VisionLanguage-Action (VLA) models from unlabeled egocentric navigation videos. Internet-scale egocentric videos provide a scalable source of navigation-relevant visual observations, capturing cluttered scenes, close-range obstacles, and natural human motion through real-world spaces. However, these videos are not directly usable for policy learning because they do not provide obstacle-aware trajectories conditioned on explicit navigation goals in the robot's coordinate frame. VEGA addresses","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3560,"title":"PAIWorld: A 3D-Consistent World Foundation Model for Robotic Manipulation","url":"https://arxiv.org/abs/2606.18375","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18375v1 Announce Type: new \nAbstract: World foundation models (WFMs) are powerful simulators, yet they predominantly operate in a single-view setting and lack the multi-view 3D consistency required for robotic manipulation. While robotic systems rely on multiple cameras (egocentric, eye-to-hand, and wrist-mounted) for policy learning, current multi-view world models simply concatenate view tokens without explicit geometric reasoning. This causes cross-view object drift, depth inconsistency, and texture misalignment. We trace these failures to two deficiencies: the absence of an expl","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3559,"title":"Guava: An Effective and Universal Harness for Embodied Manipulation","url":"https://arxiv.org/abs/2606.18363","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18363v1 Announce Type: new \nAbstract: Language models trained on large-scale vision-language data have demonstrated strong potential for embodied agents. Harnessing models through embodied tools use offers a promising alternative to end-to-end vision-language-action systems by combining high-level reasoning with external modules for perception, planning, and control. However, it remains unclear what makes an effective harness for embodied manipulation, and to what extent such a harness can unlock embodied capabilities in a wide range of reasoning models. In this work, we present Gua","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3558,"title":"Recover, Discover, Plan: Learning Skills and Concepts from Robot Failures","url":"https://arxiv.org/abs/2606.18328","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.18328v1 Announce Type: new \nAbstract: Intelligent robots should not only recover from failures, but also acquire the abstract knowledge needed to avoid them in the future. While reinforcement learning (RL) can learn reactive recovery behaviors, training a separate policy for every distinct failure mode is highly inefficient. We introduce Recovery-Driven Synthesis of Relational Concepts (ReSYNC), the first approach that progressively discovers and refines state abstractions (relational predicates) from failure-recovery experience to support abstract planning. Unlike purely reactive m","tags":[],"cluster_size":1,"ts":"2026-06-18T04:00:00"},{"id":3578,"title":"Young minds meet humanoids as study trips gain momentum - China Daily - Global Edition","url":"https://news.google.com/rss/articles/CBMiggFBVV95cUxOVlMwZm5OT1VvbE9JNW51QkN6ZUpZcUFvMS1mV2FNNzFZQ3p6Q205MTBQS2I1Qzg1TEtnQnhGV21Qc3I2WWdMczg2RFJpOUVJdXN0MmNZRkp3NWRhMzNKUlJkOUJ3ck1BSlczamhZbU5VbmZPeUl3R0lOT1pGS0RscEV3?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiggFBVV95cUxOVlMwZm5OT1VvbE9JNW51QkN6ZUpZcUFvMS1mV2FNNzFZQ3p6Q205MTBQS2I1Qzg1TEtnQnhGV21Qc3I2WWdMczg2RFJpOUVJdXN0MmNZRkp3NWRhMzNKUlJkOUJ3ck1BSlczamhZbU5VbmZPeUl3R0lOT1pGS0RscEV3?oc=5\" target=\"_blank\"\u003eYoung minds meet humanoids as study trips gain momentum\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eChina Daily - Global Edition\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-18T00:27:29"},{"id":3210,"title":"The Secret to Marathon-Winning Humanoid Robots","url":"https://spectrum.ieee.org/china-humanoid-robot-marathon","source":"IEEE Spectrum · Robotics","sources":["IEEE Spectrum · Robotics"],"summary":"\u003cimg src=\"https://spectrum.ieee.org/media-library/a-red-and-black-humanoid-runs-alone-through-a-marathon-course.jpg?id=66940897\u0026width=1245\u0026height=700\u0026coordinates=0%2C66%2C0%2C66\"/\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cp\u003eOn April 19, 2026, the \u003ca href=\"https://www.cnn.com/2026/04/19/china/china-robot-half-marathon-intl-hnk\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eHonor Lightning humanoid robot ran a half-marathon in 50 minutes and 26 seconds\u003c/a\u003e, beating the human world record by 7 minutes and the best robot time from 2025 by almost two hours.\u003c/p\u003e\u003cp\u003eHow did they do it? Is there some magical technology or technique that","tags":[],"cluster_size":1,"ts":"2026-06-17T12:19:27"},{"i ://news.google.com/rss/articles/CBMiowNBVV95cUxOcUpjQm1xVmRFOWxZNzlwemdNUEdfOVpJeDZpTDk3eG5IdlF4ZzRKcE16MlNtTno0V1R6aXRELTFFT0NVTVRoSzRkcTN0OW5pM0pKMjFVaFJfa2dadmsyUFpjZXRoVUVLN3pBcTkySDBHUUhRQ0NiNWpYR3JYaUM0RzR5d2NhU1I4VTVwSi1fUXpRSVo2WDVLaFZLTjdOZl9wLTl2bjNzNWFyM2dSOHFEZTRnY3JtaG00QTNKQzlOUlZPdUh0eFJlZ3NqUTRoUVlkNmN1NHJVNGhjWXVibTJJVjQySVN1Q09nRGpndS1hZzhOaWFWdW52LThPakJoNFhQWVdQTU95Ym5wQ3dRUTBSeG1NTlB3d3FpaUs3R1lxelp4ZFg5c0xna2g3SFpGWVl2ckt6OXVTem01SkV0Y0hOV1Nya2dJZHM5aEpVQ3ZncHRhOUstS0lqcEFuMGhjNWxZbDhvcm9lQlJxNEZoVHJjWmVPQ0p1aGFHT0I4VnluTmhWQlBYQ3FINHpEeDdGcUtyQ1lJSWtWM0ZtX1","tags":[],"cluster_size":1,"ts":"2026-06-17T05:59:00"},{"id":3213,"title":"China Has So Many Humanoid Robots, It Had To Create A Unique ID System - bgr.com","url":"https://news.google.com/rss/articles/CBMidEFVX3lxTE1ZZzRKLVpVdWVzZF9CMmIxby10bmhjY3BsTFp6dThoMURHVmlXWHh2YkZCTFEzdjJTdi12ZlRicmpCVXM5Q0g3V0dXSFU4LWZNUU1lY1Q4eEZ5Qnl5RnViQU4xbTB5Q3pBa1p1RkYyNXl1dlpQ?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMidEFVX3lxTE1ZZzRKLVpVdWVzZF9CMmIxby10bmhjY3BsTFp6dThoMURHVmlXWHh2YkZCTFEzdjJTdi12ZlRicmpCVXM5Q0g3V0dXSFU4LWZNUU1lY1Q4eEZ5Qnl5RnViQU4xbTB5Q3pBa1p1RkYyNXl1dlpQ?oc=5\" target=\"_blank\"\u003eChina Has So Many Humanoid Robots, It Had To Create A Unique ID System\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ebgr.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-17T04:47:00"},{"id":3229,"title":"ERQA-Plus: A Diagnostic Benchmark for Reasoning in Embodied AI","url":"https://arxiv.org/abs/2606.17639","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17639v1 Announce Type: new \nAbstract: Generalist embodied agents require more than object recognition: they must reason about spatial relations, actions, procedures, human intentions, environmental constraints, and commonsense consequences from situated visual observations. Yet existing visual and embodied question answering benchmarks often provide limited control over the reasoning dependencies being tested, making it difficult to distinguish grounded embodied reasoning from shortcut-driven visual or linguistic pattern matching. We present ERQA-Plus, a diagnostic benchmark for rea","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3228,"title":"MuseVLA: An Adaptive Multimodal Sensing Vision-Language-Action Model for Robotic Manipulation","url":"https://arxiv.org/abs/2606.17598","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17598v1 Announce Type: new \nAbstract: Humans naturally leverage diverse sensing modalities to interact with the physical world, while most Vision-Language-Action (VLA) models for robotics rely solely on RGB observations. This limits their ability to perceive physical properties that are difficult or impossible to infer from RGB cameras, such as temperature, sound, or radar response. We present MuseVLA, an adaptive multimodal sensing VLA model that integrates novel sensors as on-demand tools for robotic manipulation. Given a task instruction and visual context, MuseVLA first generate","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3227,"title":"GASE: Gaussian Splatting-Based Automated System for Reconstructing Embodied-Simulation Environments","url":"https://arxiv.org/abs/2606.17520","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17520v1 Announce Type: new \nAbstract: Training embodied agents in the real world requires skilled operators and expensive hardware. Simulation environments offer a compelling alternative by enabling large-scale, cost-effective data augmentation. Consequently, rapidly constructing high-fidelity simulation scenes with a minimal sim-to-real gap has become a critical objective in robot learning. While reconstruction-based methods provide superior visual quality, current workflows are hindered by inefficient data acquisition and subpar foreground object extraction. We thus propose GASE,","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"},{"id":3226,"title":"MagicSim: A Unified Infrastructure for Executable Embodied Interaction","url":"https://arxiv.org/abs/2606.17511","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.17511v1 Announce Type: new \nAbstract: Robot learning and embodied agents now require simulation to serve as a shared execution substrate linking control, skills, and planning, not only as a renderer, controller testbed, or fixed task environment. Existing pipelines split these layers with \"magic\" actions, disconnected training environments, or forward-only renders that cannot reproduce, evaluate, and annotate the same episode. We present MagicSim, an embodied interaction infrastructure built around one deterministic batched runtime and a shared Markov decision process (MDP). From YA","tags":[],"cluster_size":1,"ts":"2026-06-17T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
