oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijwFBVV95cUxNOXRxZkMyUWVPQllSRW1EQ0ZsVF8xbTQtbi02MFo2aDNFSTJkRENYanVHUG1sajVhTkRJZ0s4bmdkaWFtVnNnSjBDMzUtQzNsY01DeHRBYUJiWUg1Q3J4MlBvaUV3RHhEaGVQN3NPa1BRVy0yaVFaSnIxcW5rei1MaEszeTkxV0xRMGw4UU5Saw?oc=5\" target=\"_blank\"\u003e【读财报】港股10月以来回购36.75亿港元 思摩尔国际、李宁年内首度回购\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e21财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-25T23:39:00"},{"id":36868,"title":"华尔街见闻早餐 | 2026年10月26日","url":"https://wallstreetcn.com/livenews/3185285","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"油价飙升引发通胀忧虑，上周五美股、美债承压，道指收跌1.2%，苹果市值一度超英伟达；国际油价涨超3%；金价跌至7月以来最低水平。\n\n特朗普称伊朗问题临近决断时刻，报道称伊朗准备应对美国可能发动的新一轮轰炸，不排除在整个中东地区实施报复。\n\n俄乌同意在27日起在奥列什基暂时停火。泽连斯基确认乌美俄三方会谈11月上半月举行。\n\n中国商务部回应美新版对外投资限制拟议规则：中方严重关切、坚决反对，将密切关注后续发展，保留采取相应措施的权利。\n\n中国前三季度财政支出同比增长1%。财政部：抓紧做好提前下达2027年部分新增地方政府债务有关工作。\n\n中国国常会：加快建设生育友好型社会，优化面向家庭的财税、社保、住房等支持举措，努力稳定新出生人口规模。\n\nKimi最强3万亿级模型Kimi K3.1 Pro发布即冲上测评全球第四，编程智能体性能超过GPT-6 Astra、成本仅五分之一。\n\n苹果首款折叠屏iPhone出师不利，全球多个市场报告裂屏问题，有用户称折不到20次就裂。\n\n算力需求旺盛：亚马逊AWS今明年产能被抢空、2028年预订大部分，CEO称AI业务年化收入超250亿美元，增速是AWS初期的数百倍，砸2200亿美元仍无法满足需求。\n\n台媒称英特尔、英伟达、AMD预付逾千亿台币锁定台湾高阶IC载板产能。\n\nSpaceX洽商接入8万基站，剑指全美“第四大运营商”，美国电信巨头股价齐跌。","tags":[],"cluster_size":1,"ts":"2026-10-25T23:30:00"},{"id":36869,"title":"A股超千家上市公司披露三季报，176家净利润翻倍","url":"https://wallstreetcn.com/livenews/3185278","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股上市公司三季报加速披露。Wind数据显示，截至10月25日18时，A股共有1028家上市公司披露三季报，其中548家公司归属于上市公司股东的净利润实现同比增长，占比约为53.31%。从行业角度看，半导体、化工、玻纤、电池、电子元件等行业上市公司业绩回暖明显。以长电科技为代表的部分上市公司在发布三季报的同时，宣布调增2026年投资计划。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:55:05"},{"id":36870,"title":"北交所三季报前瞻：业绩分化显现，回购增持与分红合力稳信心","url":"https://wallstreetcn.com/livenews/3185277","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着10月15日同惠电子率先披露2026年三季报，北交所正式进入业绩验证窗口。Wind统计显示，截至10月24日17时，已有22家北交所公司交出前三季度成绩单，17家实现盈利，11家公司营收与净利润实现双增。与此同时，10月以来，北交所公司回购增持持续升温，部分公司启动分红派现，产业资本与上市公司层面的真金白银，正在市场波动之外为投资者注入一重信心底色。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:54:28"},{"id":36871,"title":"ESG评级百花齐放：分歧从何而来，共识如何构建","url":"https://wallstreetcn.com/livenews/3185276","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年是A股ESG强制信息披露元年，上市公司披露的可持续发展报告数量较上年有所增长，ESG评级市场随之扩容。但国内外多家评级机构对同一家上市公司给出的评级结果时常出现分歧。专家表示，评级差异来自评价理念、指标权重选择，以及评级框架与国内监管、产业实际的适配程度之别。一边是多元评级体系共存的现实，另一边是市场对提升评级可比性、透明度的诉求，评级行业正在差异化竞争与统一基础规则之间寻找平衡点。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:52:43"},{"id":36872,"title":"SK海力士计划利用铠侠投资收益发放16万亿韩元特别股息，这相当于其出售铠侠股权收益的70%。\n\nSK海力士计划在周三的财报发布会上公布该特别股息计划。（东亚日报","url":"https://wallstreetcn.com/livenews/3185274","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"SK海力士计划利用铠侠投资收益发放16万亿韩元特别股息，这相当于其出售铠侠股权收益的70%。\n\nSK海力士计划在周三的财报发布会上公布该特别股息计划。（东亚日报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:50:52"},{"id":36873,"title":"两日净流入逾千亿元，资金借道股票型ETF入市","url":"https://wallstreetcn.com/livenews/3185272","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"资金借道ETF入市。近两个交易日，股票型ETF获得资金净流入超过一千亿元。拉长期限来看，从9月28日至10月23日，15个交易日净流入近3200亿元。从具体流向看，宽基ETF成为“吸金”主力，沪深300ETF、科创50ETF和创业板ETF等成为吸金主力。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:44:31"},{"id":36874,"title":"机构：关注三季报预期向好的超跌方向","url":"https://wallstreetcn.com/livenews/3185270","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周，A股市场探底回升，资金显著加大流入ETF力度。结合估值回落、筹码出清与情绪触底等多项指标，部分机构策略展望研报认为，当前市场底部信号密集释放，自9月下旬以来的市场流动性负反馈显著缓解，短期市场超跌反弹具备基本面与政策面的双重支撑。具体配置上，机构建议“攻守兼备”：进攻端关注三季报预期向好、产业趋势明确且基本面坚挺的超跌方向；防守端则可逢低布局红利资产以应对市场波动。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:42:52"},{"id":36875,"title":"多位券商首席最新研判：调整不改基本面，多重数据印证A股长期价值","url":"https://wallstreetcn.com/livenews/3185269","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，多位券商首席经济学家和首席分析师接受采访时表示：A股市场出现短期调整更多反映海外冲击与市场情绪波动，风险已得到较大程度释放；中长期看，中国经济基本面、企业盈利修复与产业创新，正在重构A股的估值锚。从9月经济数据来看，基建投资、制造业投资已处于初步回升过程中。10月EPMI数据超出季节性水平，显示经济改善在延续。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:42:11"},{"id":36876,"title":"富时世界国债指数中国权重升至11.9%","url":"https://wallstreetcn.com/livenews/3185265","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日从富时罗素获悉，在富时世界国债指数（WGBI）的9月指数概况中，中国按权重计占指数的11.9%，为仅次于美国的第二大国债市场。WGBI指数所涵盖的中国国债市值约4.2万亿美元。而2024年10月中国债券完成“入指”时，中国政府债券总市值为21.2万亿元人民币（约3.03万亿美元）。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:31:04"},{"id":36877,"title":"各地重大项目刷新“进度条”，四季度稳增长加力","url":"https://wallstreetcn.com/livenews/3185264","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"时至四季度，冲刺全年经济目标进入关键时期。近期，北京、陕西、云南等地密集部署重大项目推进工作，成为四季度扩投资、稳增长的重要抓手。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T22:23:36"},{"id":36878,"title":"周一亚市盘初美股期货走高，标普500指数期货涨0.4%，纳斯达克100指数期货涨0.6%。","url":"https://wallstreetcn.com/livenews/3185261","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周一亚市盘初美股期货走高，标普500指数期货涨0.4%，纳斯达克100指数期货涨0.6%。","tags":[],"cluster_size":1,"ts":"2026-10-25T22:01:18"},{"id":36879,"title":"美国总统特朗普：你们很快就会看到伊朗冲突以某种方式结束。\n\n中期选举结束后不久将发放5000美元分红。","url":"https://wallstreetcn.com/livenews/3185262","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美国总统特朗普：你们很快就会看到伊朗冲突以某种方式结束。\n\n中期选举结束后不久将发放5000美元分红。","tags":[],"cluster_size":1,"ts":"2026-10-25T20:58:00"},{"id":36880,"title":"微亿智造宣布延迟全球发售及港股主板上市，原计划10月28日挂牌","url":"https://wallstreetcn.com/livenews/3185247","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"常州微亿智造科技股份有限公司港交所公告，经考虑多项因素（包括现行市况），公司决定延迟全球发售及其拟于香港联合交易所有限公司主板上市。公司此前于10月20日刊发招股章程。公告显示，有关国际发售的国际包销协议将不会订立，因此有关香港公开发售的香港包销协议将不会成为无条件。\n\n退款安排方面，透过白表eIPO服务申请香港发售股份的申请股款（包括1.0%经纪佣金、0.0027%证监会交易征费、0.00015%会财局交易征费及0.00565%联交所交易费）将获全数退还，不计利息。","tags":[],"cluster_size":1,"ts":"2026-10-25T17:58:52"},{"id":36881,"title":"华测导航：农机导航与机器人板块前三季度实现良好增长","url":"https://wallstreetcn.com/livenews/3185222","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"华测导航日前在机构调研时表示，农机导航与机器人板块系公司未来几年的重点发展方向之一，2026年前三季度该板块实现良好增长，农机自动驾驶产品已远销海外数十个国家。该板块当前收入主要来自农机自动驾驶系统，公司不断丰富产品矩阵，推出智能喷雾系统、智能灌溉、农具导航、收获机自动对行系统等产品，市场推广效果良好，预计将逐步贡献业绩。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-10-25T13:10:13"},{"id":36882,"title":"启元机器人第5000台个人机器人下线，每2.5分钟产出一台","url":"https://wallstreetcn.com/livenews/3185218","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"10月25日，启元机器人第5000台个人机器人正式下线。此时距其9月20日发售Q1、T1两款个人机器人仅过去一个月，标志着个人机器人正加速迈向批量生产与真实用户交付。\n\n启元机器人联席总裁、中央研发部总裁高全中在下线现场表示，产线启动以来，启元机器人从0台到5000台稳定量产下线仅用时1个月，目前已实现每2.5分钟下线一台机器人，日产能从10余台提升至200余台。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-25T12:43:56"},{"id":36883,"title":"东山精密在港交所公告，发售价定为每股H股86.80港元，预期H股将于2026年10月28日上午九时正开始在联交所主板买卖。","url":"https://wallstreetcn.com/livenews/3185199","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"东山精密在港交所公告，发售价定为每股H股86.80港元，预期H股将于2026年10月28日上午九时正开始在联交所主板买卖。","tags":[],"cluster_size":1,"ts":"2026-10-25T10:46:26"},{"id":36884,"title":"画廊 阿里巴巴总部大楼 / Hassell - 1 - ArchDaily","url":"https://news.google.com/rss/articles/CBMiyAFBVV95cUxOSTJsX0hFRzNIRkpJMy16ZC1Bc3BZeTlQODY5bHJuWlRUODFCZE5vaS1IY1NVZkJfR0FPa0pNX0tmUnc3YnRHNmpTbzFmck5vUVBYd2hMMEo3VnZaTERlRHN6QnRWRTBBbnU4Q1JVeFY0TzN5UjRobGVIR1RaYmJzTWVPSmtVdmZWWDhoRkdGWG9lZVJFTE1oeEFlWkRSNlZJQkZzc3h6WXhfcTZ4WVB3akd0ZFNqTmstT2RHYzhvblV2MnVha1FiMw?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiyAFBVV95cUxOSTJsX0hFRzNIRkpJMy16ZC1Bc3BZeTlQODY5bHJuWlRUODFCZE5vaS1IY1NVZkJfR0FPa0pNX0tmUnc3YnRHNmpTbzFmck5vUVBYd2hMMEo3VnZaTERlRHN6QnRWRTBBbnU4Q1JVeFY0TzN5UjRobGVIR1RaYmJzTWVPSmtVdmZWWDhoRkdGWG9lZVJFTE1oeEFlWkRSNlZJQkZzc3h6WXhfcTZ4WVB3akd0ZFNqTmstT2RHYzhvblV2MnVha1FiMw?oc=5\" target=\"_blank\"\u003e画廊 阿里巴巴总部大楼 / Hassell - 1\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eArchDaily\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-25T10:14:33"},{"id":36885,"title":"一个县城拿下亿级无人驾驶项目，中国移动做对了什么？ - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE50Q09ZeURnNG55Q0lQM1paQzBhaURkNkhaazI1RlFh ummary":"\u003cp data-vmark=\"bbd0\"\u003eIT之家 10 月 26 日消息，据 Axios 报道，Anthropic 旗下人工智能模型 Claude \u003cstrong\u003e绕过付费墙\u003c/strong\u003e（Paywall），在未经人类授权的情况下调取了美国佐治亚州原本对公众（付费）开放的选民数据。\u003csup class=\"superscript\"\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp data-vmark=\"8836\"\u003eAnthropic 发言人表示：“在一次模型训练运行期间，Claude 抓取了佐治亚州向公众收费开放的汇总计票数据。该模型并未渗透该州的选民登记系统，亦未篡改或导出任何具体选民的投票记录。”\u003csup class=\"superscript\"\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp data-vmark=\"9e80\"\u003eIT之家注意到，Anthropic 曾在本月早些时候指出，已发现多起 Claude“通过规避限制手段，获取受访问令牌（Token）或付费门槛保护的数据”的案例，其中部分情况涉及美国联邦、州及地方各级政府机构运营的官方网站。\u003c/p\u003e\u003cp data-vmark=\"3670\"\u003e另有知情人士透露，Anthropic 早在数周前就已向佐治亚州州务卿办公室和白宫通报了该情况，且政府官员曾敦促州务卿办公室尽早对外披露，但这一提议未被采纳。\u003c/p\u003e","tags":[],"cluster_size":1,"ts":"2026-10-25T23:56:18"},{"id":36995,"title":"经济日报：DeepSeek千亿元融资展现中国AI进取心 - ThePaper.cn","url":"https://news.google.com/rss/articles/CBMiYEFVX3lxTE9EbmUyYi1Jcm5WaW1zb2d4YkJidGM4dDFHUGhJZ1dOUGNIMlM5bDJqWE8zOVNhQ2dVX2NhMkg4UlE3N3F3UnZkYW93dzE4dDRGSDY0d0xLdnFiVk4yM1FEeg?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE9EbmUyYi1Jcm5WaW1zb2d4YkJidGM4dDFHUGhJZ1dOUGNIMlM5bDJqWE8zOVNhQ2dVX2NhMkg4UlE3N3F3UnZkYW93dzE4dDRGSDY0d0xLdnFiVk4yM1FEeg?oc=5\" target=\"_blank\"\u003e经济日报：DeepSeek千亿元融资展现中国AI进取心\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eThePaper.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-25T23:53:00"},{"id":36996,"title":"DeepSeek、MiniMax完成大模型出海登记；亚马逊AWS云计算产能已售至2027年，大量2028年容量提前预订｜全球科技早参 - www.mrjjxw.com","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE5Fb3NoSTBhOUk5el9aR0J5V2FoYXlYazFVUFNUOVhzOUxtUVQ5cWNxbUExUEtsOFVac3NhSkh2Vi14Nlc0cWtSZEFCV3FCRmZheXlmX2t5UnczeDV4VXNvVEdLdmFaUQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE5Fb3NoSTBhOUk5el9aR0J5V2FoYXlYazFVUFNUOVhzOUxtUVQ5cWNxbUExUEtsOFVac3NhSk ps://www.ithome.com/1/017/726.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"48a4\"\u003eIT之家 10 月 26 日消息，据央视财经报道，在近期结束的 2026 金融街论坛年会上，\u003cstrong\u003e全国首个人工智能应用风险综合保障方案正式发布。\u003c/strong\u003e通过保险产品分别对人工智能服务给第三方造成的损失，和人工智能供应方自身费用损失进行保障，\u003cstrong\u003e填补国内 AI 保险市场空白\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"b3db\"\u003eIT之家注意到，AI 正在接管越来越多的事情：打电话、做客服、分析农产品价格、写文案剪视频。可一旦它“说错话”侵权，或者“算错账”造成损失，谁来负责？\u003c/p\u003e\u003cp data-vmark=\"f9be\"\u003e今年 9 月，最高人民法院发布《关于依法审理涉人工智能纠纷案件的意见》，明确了关键规则：\u003cstrong\u003e生成式 AI 侵权一般适用过错责任，“内容由 AI 生成”不能作为免责抗辩。\u003c/strong\u003e也就是说谁有过错谁担责，不能用一句“这是机器干的”甩锅，服务方哪怕只是提供了模型能力，如果没尽到注意义务，也可能要承担赔偿责任。\u003c/p\u003e\u003cp data-vmark=\"ae82\"\u003e据介绍，这类保险保障的是\u003cstrong\u003e被保险人在提供生成式人工智能服务过程中，因过失或疏忽导致生成的内容\u003c/strong\u003e，比如文本、图片、音频、视频等，侵犯了第三方合法权益，或对第三方造成误导，并直接导致","tags":[],"cluster_size":1,"ts":"2026-10-25T23:21:57"},{"id":37000,"title":"Kimi 就会员使用 K3.1 Pro 出现限流等问题致歉，为所有订阅会员进行重置","url":"https://www.ithome.com/1/017/723.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c376\"\u003eIT之家 10 月 26 日消息，Kimi 智能助手今日凌晨发文，就近期 K3.1 Pro 使用体验问题进行致歉，并公布了相关补偿。IT之家附官方原文如下：\u003c/p\u003e\u003cblockquote\u003e\u003cp style=\"text-align: center;\" data-vmark=\"bad3\"\u003e致用户：关于近期使用体验问题的致歉与补偿\u003c/p\u003e\u003cp data-vmark=\"4e42\"\u003e致 Kimi 用户\u003c/p\u003e\u003cp data-vmark=\"ccb5\"\u003e对于近期 Kimi 会员使用 K3.1 Pro 时出现的限流及不必要的额度消耗，我们向大家致歉。问题出在我们，我们也本应更早修复。\u003c/p\u003e\u003cp data-vmark=\"e578\"\u003e\u003cstrong\u003e今天，我们会为所有档位的订阅会员进行一次重置：所有有效期内的会员都将获得月度总额的 25% 作为补偿，相当于一周的用量\u003c/strong\u003e。如果当前用量不足月度总额的 25%，将重置为 0。用量进度条会在今天结束前显示调整结果。\u003c/p\u003e\u003cp data-vmark=\"5691\"\u003e同时，我们已调整配置，并正在减少不必要的子 Agent 调用和输出长度，让同样的额度完成更多实际任务。\u003c/p\u003e\u003cp data-vmark=\"5cab\"\u003e感谢您的理解与耐心等待。\u003c/p\u003e\u003cp data-vmark=\"eaec\"\u003eKIMI\u003c/p\u003e","tags":[],"cluster_size":1,"ts":"2026-10-25T23:10:49"},{"id":37001,"title":"科大讯飞发布星火智慧座舱3.0及星火汽车大模型 - 网通社","url":"https://news.google.com/r .30819v1 Announce Type: new \nAbstract: Reliable robotic manipulation in field-deployed settings requires more than executing a capable controller. As the execution conditions change, the system must decide, online and on the robot side, which control source should hold authority. Human teleoperation adapts readily to contact-rich and semantically ambiguous situations but depends on a stable communication link. Local autonomy is executed without continuous human intervention, but may fail under semantic ambiguity, long-horizon drift, and unforeseen contingencies. These two control sou","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36355,"title":"Robot Motion Transition with Human Motion Prior","url":"https://arxiv.org/abs/2610.30817","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30817v1 Announce Type: new \nAbstract: Humanoid motion-tracking policies can reproduce diverse behaviors, yet connecting independently acquired motions into a continuous sequence remains challenging. Interpolation connects boundary poses without considering whether their relative position, heading, and timing provide suitable conditions for a transition. A generative motion prior can produce richer motion, but poorly arranged boundaries may cause it to generate excessive locomotion, turning, or another unintended action. We present Spatio-Temporal Alignment with a Motion Prior (STAMP","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36354,"title":"Adaptive Aerial Loco-Manipulation Policy Learning via LLM-Assisted Proactive Task Generation","url":"https://arxiv.org/abs/2610.30810","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30810v1 Announce Type: new \nAbstract: Loco-manipulation extends the workspace of conventional manipulation by combining mobility with physical interaction, while aerial loco-manipulation further expands this capability into three-dimensional space, enabling robots to reach environments inaccessible to ground-based systems. Moving to an aerial platform, however, gives rise to a demanding control problem, since the vehicle must track trajectories accurately in three dimensions while the motion of the arm and its interaction with the environment continuously shift the center of mass, a","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36353,"title":"When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies","url":"https://arxiv.org/abs/2610.30735","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30735v1 Announce Type: new \nAbstract: Flow matching is now the dominant approach for vision-language action (VLA) robot policies, thanks to its expressiveness and simple training objective. However, inference for standard flow matching requires iteratively solving an ODE, limiting the control frequency at deployment. While several works have proposed novel methods to allow for single-shot action generation, we ask whether such additional objectives are actually necessary. We find that across six flow matching VLAs, one-step action generation largely matches multi-step sampling at sc","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"},{"id":36352,"title":"Live Thread Reconstruction for Autonomous Manipulation","url":"https://arxiv.org/abs/2610.30694","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30694v1 Announce Type: new \nAbstract: Autonomous robotic surgery has drawn increased attention in recent years due to its potential to relieve surgeons of time-consuming, mentally straining, and tedious tasks, particularly during prolonged operations. One suitable task for automation is suturing, which involves tracking the thread as it deforms during needle retrieval, de-tangling, knot tightening, and other tasks. Unlike rigid-object manipulation, deformable thread manipulation has no fixed pose to track and effectively infinite degrees of freedom, making its conf ,"sources":["arxiv · cs.RO"],"summary":"arXiv:2610.30605v1 Announce Type: new \nAbstract: Traversability estimation is critical for ground vehicle teleoperation, yet existing methods often neglect the human operator's preferences for speed and risk tolerance. To address this gap, we propose PATH-Net, a Preference-Aware Traversability estimation Hierarchical Network that adaptively generates preference-conditioned traversability cost maps and speed profiles for off-road teleoperation. Our framework integrates visual and geometric bird's-eye-view features with short-term historical vehicle states through a multi-head shared-backbone ar","tags":[],"cluster_size":1,"ts":"2026-10-23T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
