/3141970","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯","华尔街见闻 · 港股快讯"],"summary":"油价飙8%，道指跌超2%，纳指六连跌，半导体指数大跌超5%，30年美债收益率创2007年最高。\n\n美联储继续按兵不动、强调通胀承诺，但三票委支持加息。沃什：2%通胀目标不动摇，保持独立性，关注AI变革。\n\n特朗普一再警告“狠狠打击”伊朗，寻求对伊加征关税。美国升级对伊朗制裁，首次瞄准霍尔木兹“收费网”，油轮、航运和保险公司被拉黑。美沙联手空袭伊拉克，中东战线再扩大。\n\n韩国：将采取更多措施稳定股市，考虑限制散户购买杠杆ETF、提高交易成本。\n\n月之暗面完成超35亿美元F轮融资：估值超350亿美元，G轮或下周关闭。\n\n微软上季业绩强劲，云收入增超40%，资本支出低于预期，新增数据中心租约超1300亿，新的年度支出指引较前指引低近8%，股价盘后一度大涨9%。\n\nMeta营收超预期难掩AI投入焦虑，Q3指引逊色、自由现金流创四年新低，盘后一度跌10%。扎克伯格：开源AI模型并没有前沿模型那么强大。\n\n高通Q3财季净利润同比下滑25%，上调产品售价并给出疲软业绩指引。\n\nMLCC又迎涨价潮！报道：三星电机8月起提价30%，太阳诱电拟9月跟进。\n\nMargin Call响起！AI暴跌导致对冲基金“史诗级”亏损，高盛、摩根大通率先追保。\n\n提醒：中际旭创周四将在香港上市。","tags":[],"cluster_size":4,"ts":"2026-07-29T23:30:22"},{"id":15326,"title":"阿里巴巴Qwen团队打造AI音乐创作神器|Minimax|注意力机制|AI音频生成|旋律|训练_手机新浪网 - 新浪财经","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxNUERlYVNHekhhWTVXTXhGRHQ2dUZUdWVuS29KV3JnX3hYR1I5dlo2S1luRmRZSkhwbnU1NEoyQkFabFNqdUhfNy02eE4wTHhSTzBURUpTQS1jRF8xZkZtMlJ4MHR5SGxOelV0SDFveVRYWF9DdXFjUUVoQWhPY2xETFlVd1RIa0doZXZMbWhwenJkSGNFWjFDMGtleDBIUWtCWlZpMm5mbw?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxNUERlYVNHekhhWTVXTXhGRHQ2dUZUdWVuS29KV3JnX3hYR1I5dlo2S1luRmRZSkhwbnU1NEoyQkFabFNqdUhfNy02eE4wTHhSTzBURUpTQS1jRF8xZkZtMlJ4MHR5SGxOelV0SDFveVRYWF9DdXFjUUVoQWhPY2xETFlVd1RIa0doZXZMbWhwenJkSGNFWjFDMGtleDBIUWtCWlZpMm5mbw?oc=5\" target=\"_blank\"\u003e阿里巴巴Qwen团队打造AI音乐创作神器|Minimax|注意力机制|AI音频生成|旋律|训练_手机新浪网\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T23:23:00"},{"id":15327,"title":"证券日报头版文章：国资及时入场托底，系列稳市举措护航A股平稳向好发展","url":"https://wallstreetcn.com/livenews/3141959","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"纵观此轮稳市举措，国资始终发挥着重要支撑作用。从中国国新控股有限责任公司、中国诚通控股集团有限公司两大国有资本运营平台率先启动增持，到各地地方国资快速跟进、接续发力，国有上市公司增持行动层层铺开、形成合力。据Wind数据统计，7月20日以来，已有54家上市公司披露股东增持计划，其中，国有控股上市公司20家，包含7家中央企业和13家地方国有企业，合计占比达37.04%。值得关注的是，本轮国资稳市并非单一的增持托底，而是兼顾短期稳波动与长期提质效，构建了“短期资金托底+长期产业赋能”的全方位稳市体系。","tags":[],"cluster_size":1,"ts":"2026-07-29T23:00:49"},{"id":15328,"title":"中国移动完成无GNSS场景的手机直连卫星技术实验室验证（附图片） - 新浪财经","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTFBJT3Y3dWZBSzhUaTh3X0JZTGxYbi1ySmJjU0k0aW9HaVg0VXBzMk5Na3N3LWFvTzRibUpUZE5uMHR4TDNSS0tmdTMyd3VMd2dZY0Q0bVBYZTNiRFEwdWplVmctUFI4ZGx2YkdHVTYwc1hxcVN6d180Vg?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTFBJT3Y3dWZBSzhUaTh3X0JZTGxYbi1ySmJjU0k0aW9HaVg0VXBzMk5Na3N3LWFvTzRibUpUZE5uMHR4TDNSS0tmdTMyd3VMd2dZY0Q0bVBYZTNiRFEwdWplVmctUFI4ZGx2YkdHVTYwc1hxcVN6d180Vg?oc=5\" target=\"_blank\"\u003e中国移动完成无GNSS场景的手机直连卫星技术实验室验证（附图片）\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T22:51:00"},{"id":15329,"title":"业内人士：多重因素扰动，金价短期走势或以震荡为主","url":"https://wallstreetcn.com/livenews/3141957","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"自6月下旬以来，伦敦现货黄金价格在4000美元/盎司附近反复拉锯。与之形成鲜明反差的是，7月以来A股黄金股率先“躁动”，部分龙头黄金股涨幅超过30%，明显跑赢同期金价。业内人士认为，当前金价中长期支撑逻辑并未发生根本改变，央行购金仍可能推动金价中枢逐步上移，黄金类资产依旧具备配置价值。但短期来看，市场仍面临全球流动性、美联储政策预期、地缘局势以及市场资金流向等多重因素扰动，或以震荡走势为主。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:49:18"},{"id":15330,"title":"中小银行理财业务迁徙：自营产品加速出清，代销成转型主航道","url":"https://wallstreetcn.com/livenews/3141956","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来，多家未设立理财公司的中小银行（下称“非持牌银行”）发布新增代销理财业务合作机构的公告，通过与理财公司签约开展产品代销合作。结合非持牌银行陆续披露的2026年上半年度理财业务报告可见，此类银行自营理财规模延续收缩态势，不少机构降幅显著，部分机构已彻底清零自营存量。自营理财有序压降、代销业务加快拓量，此消彼长之下，中小银行理财业务格局迎来深度重塑，非持牌银行逐步向理财渠道服务商转型。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:45:46"},{"id":15331,"title":"拿森智能科技拟在香港IPO募资至多6.44亿港元","url":"https://wallstreetcn.com/livenews/3141955","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"香港交易所文件显示，拿森智能科技（浙江）股份有限公司计划在香港上市，发行5,760万股，招股价区间为每股10.42至11.18港元。\n\n据彭博计算，该公司最高可募资6.44亿港元（8210万美元）。\n\n股票预计于8月7日开始交易。\n\n国泰海通和中银国际担任联席保荐人。","tags":[],"cluster_size":1,"ts":"2026-07-29T22:44:38"},{"id":15332,"title":"ETF市场回暖，半导体材料设备方向显著吸金","url":"https://wallstreetcn.com/livenews/3141953","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来，全球股市科技主线普遍经历了一轮较大幅度回调，A股半导体板块的阶段性调整幅度不小。与市场调整形成鲜明对比的是，市场资金对半导体材料设备主题ETF呈现“逆势流入”的态势，这一方向成为近期资金流入最为集中的领域之一。Wind数据显示，截至7月28日，7月以来ETF市场资金净流入规模排名前十的产品中，有3只为半导体材料设备主题ETF，资金净流入规模合计达420.55亿元。","tags":[],"cluster_size":1,"ts":"2026-07-29T22:38:26"},{"id":15333,"title":"Meta分析师电话会要点总结","url":"https://wallstreetcn.com/livenews/3141950","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"1、AI基础设施的建设成本增速已超过核心业务。\n\n首席财务官苏珊·李（Susan Li）表示，法律和遣散费用扭曲了Meta第二季度的业绩表现。但经常性成本也在不断攀升。李指出，AI人才、数据中心运营、第三方云服务支出以及AI算力消耗（Token）成本均在增加。即便剔除这些一次性费用，Meta的支出增速依然快于核心业务（核心业务销售额同比跃升28%）。受此影响，Meta盘后股价下跌逾8%。","tags":[],"cluster_size":1,"ts":"2026-07-29T22:36:05"},{"id":15334,"title":"价值派基金经理坚守初心，“不会因短期压力而动摇”","url":"https://wallstreetcn.com/livenews/3141949","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来科技行情出现“逆风期”，不少坚守“老登”资产的价值派基金经理，迎来了久违的业绩反弹。数据显示，邹立虎、刘杰、焦巍、姜诚、蓝小康等一批知名价值风格基金经理，旗下均有产品本月以来的回报率突破10%。此前二季度科技板块持续上涨，让抱紧“老登”资产的基金经理们的业绩表现不尽如人意。部分价值风格基金经理在坚守能力圈的同时，显著降低股票仓位，稳健防守、等待时机。面对汹涌的科技浪潮，一批价值投资的践行者“不合时宜”地坚守着企业价值和安全边际，看好价值投资仍然长期有效。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:35:13"},{"id":15336,"title":"7月29日恒生互联网ETF华夏基金份额减少15亿份，重仓股腾讯控股、阿里巴巴-W、网易_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBmdjQyeGFJdFhGUDNmWWhqcmVtY2wxYTc2NW5EeVVqbWVjUjRnaUQwMVk0ckRlMUg2Zm1yVlN3NFUyNzhLNHFab3FfcXVvZ0ZUWWRpcVlYX0JjeEYyQ1ZicDVR?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBmdjQyeGFJdFhGUDNmWWhqcmVtY2wxYTc2NW5EeVVqbWVjUjRnaUQwMVk0ckRlMUg2Zm1yVlN3NFUyNzhLNHFab3FfcXVvZ0ZUWWRpcVlYX0JjeEYyQ1ZicDVR?oc=5\" target=\"_blank\"\u003e7月29日恒生互联网ETF华夏基金份额减少15亿份，重仓股腾讯控股、阿里巴巴-W、网易_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T22:33:27"},{"id":15337,"title":"供需格局偏紧，光通信产业链上半年业绩大面积预喜","url":"https://wallstreetcn.com/livenews/3141947","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至7月29日，A股已有24家光通信产业链上市公司披露上半年业绩预告，其中18家公司预喜（包括预增、预计扭亏），占比超七成。从上游光纤光缆、核心光芯片，到中游高速光模块、下游光器件，全产业链实现业绩共振——龙头企业净利润迎来数倍级跃升，部分企业扭亏为盈。采访了解到，全球云厂商与AI企业持续加码算力资本开支，叠加高速光通信技术迭代升级，行业供需格局持续偏紧，高端产品供不应求、核心物料供给受限，推动产业链整体盈利中枢稳步上移。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:27:46"},{"id":15338,"title":"央行护航月末资金面，流动性或将平稳跨月","url":"https://wallstreetcn.com/livenews/3141945","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"月末资金面再度成为债市关注焦点。近期大行资金融出规模边际下降，带动短端资金利率有所上行。不过，央行已提前公告将在月末及8月初开展隔夜逆回购操作，释放维护短端流动性平稳的信号。多家机构认为，7月并非季末月，政府债净缴款压力明显下降，叠加央行隔夜逆回购投放安排，资金面大幅收紧的可能性不大。短期来看，流动性有望平稳跨月，但资金面对债市进一步突破的助力或相对有限，后续仍需关注央行投放力度、银行资金融出变化及8月政府债供给扰动。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:26:26"},{"id":15339,"title":"股票型ETF7月以来“吸金”逾4100亿元","url":"https://wallstreetcn.com/livenews/3141944","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在市场震荡调整过程中，大量资金借道ETF基金入市。7月以来，股票型ETF资金净流入超过4100亿元。宽基ETF成交近日持续放量。7月27日至29日，科创50 ETF华夏分别成交76.26亿元、110亿元和130亿元，创业板ETF易方达分别成交67.41亿元、128亿元和124亿元。拉长时间看，ETF已成为资金入市的重要渠道。Choice数据显示，7月以来，截至7月28日，股票型ETF资金净流入4151.74亿元。从行业主题ETF看，半导体主题ETF热度较高。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:24:52"},{"id":15340,"title":"行权覆盖范围再扩容，投服中心首次向上市券商提名独董","url":"https://wallstreetcn.com/livenews/3141941","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月29日，中证中小投资者服务中心有限责任公司（简称“投服中心”）发布公告称，已向财达证券董事会提名独立董事候选人张成福，并就独立董事选任议案向全体股东公开征集投票权。财达证券已发布审议独立董事选任议案的股东会公告。据悉，这是投服中心开展第三方提名独立董事行权以来，首次在上市券商中推动独立董事提名。","tags":[],"cluster_size":1,"ts":"2026-07-29T22:18:36"},{"id":15341,"title":"耐心资本密集落子，央企系基金加速布局硬科技","url":"https://wallstreetcn.com/livenews/3141940","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，AI健康硬件公司Fullive.ai（福来数创）宣布完成由招商局创投领投的种子++轮融资。本轮资金将主要用于AI睡眠硬件的研发与量产推进，以及前沿技术储备。近一个月来，央企系基金在硬科技赛道的出手节奏明显加快：具身智能“独角兽”星动纪元获诚通基金10亿元领投，物理AI企业清研精准获国机产业基金战略投资，山西中电科获国新基金领投。在具身智能、半导体装备、量子计算等多个战略性新兴产业赛道，央企“耐心资本”正在加速落子。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-29T22:15:52"},{"id":15342,"title":"周三（7月29日）纽约尾盘，标普500股指期货最终跌1.60%，道指期货跌2.18%，纳斯达克100股指期货跌2.20%。\n\n罗素2000股指期货跌1.97%。","url":"https://wallstreetcn.com/livenews/3141917","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（7月29日）纽约尾盘，标普500股指期货最终跌1.60%，道指期货跌2.18%，纳斯达克100股指期货跌2.20%。\n\n罗素2000股指期货跌1.97%。","tags":[],"cluster_size":1,"ts":"2026-07-29T21:07:40"},{"id":15343,"title":"阿里巴巴期权聚焦：7月29日成交8.02万张，未平仓合约225.71万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxOMDZ3SC1iWDdqVlRIMlBHek5NLThZZlM2ZjQ2ZDJubHRaMlNVSWJOX0VRQVlFeVZWQjJ6QmpoWWFINVdlMDRPSzNfcm1PdG1aNWgxTmREQngzMk1rbEkxOW9VRE1zRXNYS2VYdXBnUVBWV1VIOExiT3dqOU9PRzlzMEQwbmNOT2ZhVy1qU3oycGdGRGxtZU9KN2ZaQlNUbHJRcC1tZzA5OA?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxOMDZ3SC1iWDdqVlRIMlBHek5NLThZZlM2ZjQ2ZDJubHRaMlNVSWJOX0VRQVlFeVZWQjJ6QmpoWWFINVdlMDRPSzNfcm1PdG1aNWgxTmREQngzMk1rbEkxOW9VRE1zRXNYS2VYdXBnUVBWV1VIOExiT3dqOU9PRzlzMEQwbmNOT2ZhVy1qU3oycGdGRGxtZU9KN2ZaQlNUbHJRcC1tZzA5OA?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月29日成交8.02万张，未平仓合约225.71万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T20:30:01"},{"id":15344,"title":"阿里巴巴-W（09988.HK）：7月29日南向资金减持614.46万股 - Sohu","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQR090NHotMzloMjNHb0JiX1NxNEczaDF6TXdkUThfNjJ4WEJ4S093NUdvMkotWklCSHpEOVFsWDVqOTZQenE1T0NvcVJIa0liUldxRkVvamphdE5oV05icEs1WXp4bW9WQ29BeElpQllpZXBJSTM3Y1BVQmRuaGVlVzBpWU1YMHRpUlFiTA?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQR090NHotMzloMjNHb0JiX1NxNEczaDF6TXdkUThfNjJ4WEJ4S093NUdvMkotWklCSHpEOVFsWDVqOTZQenE1T0NvcVJIa0liU 发现了更高效的攻击方法。其中针对 HAWK 的攻击直接导致该算法于次日被其开发者从 NIST 的标准化进程中撤回。\u003c/p\u003e\u003ch3 data-vmark=\"462b\"\u003eHAWK 算法因攻击被撤回\u003c/h3\u003e\u003cp data-vmark=\"2ef6\"\u003eHAWK 是一种为抵御未来量子计算机攻击而设计的数字签名方案，此前已通过 NIST（美国国家标准与技术研究院）的两轮评审，并在 2026 年 5 月进入第三轮候选名单。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"bd18\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/da079ae7-52a2-40a9-aa22-9cd3a08cf5c1.png?x-bce-process=image/format,f_auto\" w=\"1266\" h=\"734\" data-weibo=","tags":[],"cluster_size":1,"ts":"2026-07-30T01:03:11"},{"id":15585,"title":"分析师：航司采取动态 AI 定价，廉价机票捡漏机会或越来越少","url":"https://www.ithome.com/0/983/394.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"df14\"\u003eIT之家 7 月 30 日消息，喜欢满世界寻找廉价机票的旅客可能要失望了：在热门航班上意外捡到便宜票的机会，或许很快就会越来越少。\u003c/p\u003e\u003cp data-vmark=\"e48d\"\u003e过去，航空公司主要依靠分析师制定固定的调价规则，例如航班\u003cstrong\u003e售出四分之一座位后，票价统一上涨 20%\u003c/strong\u003e。AI 投入使用后，航空公司可以\u003cstrong\u003e实时分析数十项因素\u003c/strong\u003e，更迅速地调整每个座位的售价。航空公司因此能够获得更多营收，过去让旅客有机会买到低价票的价格落差也会逐渐缩小。\u003c/p\u003e\u003cp data-vmark=\"9e27\"\u003e据彭博社今天（30 日）报道，面对持续上涨的经营成本，达美航空、维珍航空等航空公司正\u003cstrong\u003e加快引入 AI 定价技术\u003c/strong\u003e，设法提高每趟航班的收入。繁忙航线上的低价座位可能进一步减少，因为航空公司会尽量\u003cstrong\u003e避免以低于乘客支付意愿的价格售票\u003c/strong\u003e，同时让更多航班接近满座。\u003c/p\u003e\u003cp data-vmark=\"4541\"\u003e航空票价由固定规则和电子表格决定的时代正在结束。预测模型将\u003cstrong\u003e持续判断市场需求，并随时调整价格\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"084d\"\u003e奥尔顿航空咨询公司分析师布赖恩 · 特里认为，消费者需要做好准备","tags":[],"cluster_size":1,"ts":"2026-07-30T00:58:41"},{"id":15586,"title":"这这这…翁荔光速回OpenAI上班了 - 新浪财经","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxQdE04ZUx3YVFpSTVCN09qOWJ2WmhiZmpkeTYyaHRWRjJlZTFvZFM5NXZ2U011ak1kTTFSSXZ6WFUwdjNYem1RMnBqeG5JOWkwb05Zd013TDVBVUhCX0ZFUWFEZGIwZ3kzWjhsVmFSNzBFVTNqak44UzFLUE9Wd2k3a00zNjRWQzBrUjN2TVp3a0ZoeE9UaV9vTjkyUXhrUVpxYWV6bWtMa0ZHbkYzSDNDTkZR?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.co =\"_blank\"\u003eChina’s humanoid robots have been taking over the global market. Now the US is banning them\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eCNN\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T04:51:05"},{"id":15458,"title":"Modular Robotic Catheters for Endovascular Aneurysm Repair","url":"https://arxiv.org/abs/2607.25807","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25807v1 Announce Type: new \nAbstract: Fenestrated/Branched endovascular aneurysm repair (FEVAR/BEVAR) require surgeons to navigate catheters and guidewires into various branches of the abdominal aorta, before deploying stent grafts to alleviate pressure on the aneurysm. Previous clinical studies suggests that surgeons continue to struggle with vessel access using standard commercial instruments, prolonging the procedural time and inducing further complications. In this work, we present two contributions to solving this problem: 1) A bespoke 2-segment steerable catheter, consisting o","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15457,"title":"Transformer Transformer: A Unified Model for Motion-Conditioned Robot Co-design","url":"https://arxiv.org/abs/2607.25798","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25798v1 Announce Type: new \nAbstract: An often overlooked factor of robot manipulation performance is the embodiment of the robot itself. Motivated by this problem, we study motion-conditioned robot co-design, where the goal is to generate complete robot designs that track target end-effector trajectories (from human demonstrations) while optimizing user-defined rewards. We introduce Transformer Transformer, a diffusion transformer trained on RoboTokens, a unified tokenization of robot embodiments, states, and actions. The same architecture can be used across embodiment spaces (e.g.","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15456,"title":"Tripody: An Overconstrained 3-SPR-like Parallel Robot for High-Reach Construction Tasks","url":"https://arxiv.org/abs/2607.25781","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25781v1 Announce Type: new \nAbstract: Many ceiling construction tasks still rely on heavy serial manipulators that are difficult to deploy in cluttered interiors, motivating lightweight, field-ready alternatives that reach ceiling height while maintaining millimeter-level accuracy and the stiffness demanded by overhead tool loads. We introduce Tripody, a wheeled 3-DoF parallel robot for high-reach tasks that replaces the base spherical joints of a classical 3-SPR (3 legs; S: base spherical joint; P: actuated prismatic joint; R: end-effector revolute joint) morphology with universal","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15455,"title":"Tri-Manual Visuomotor Imitation Learning of Robot Policies","url":"https://arxiv.org/abs/2607.25731","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25731v1 Announce Type: new \nAbstract: Bimanual teleoperation provides an effective way to collect robot demonstrations, but it assumes that the operator and robot have matching numbers of simultaneous control channels. This assumption breaks for tri-manual systems: the robot can coordinate three arms concurrently, whereas a single operator can continuously control only two. Pairwise mode switching may therefore record otherwise independent motions sequentially, causing behaviour cloning to reproduce delays imposed by the interface rather than required by the task. We present TriManP","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15454,"title":"When Does Legacy Data Start to Help? Emergent Transfer in Cross-Configuration Robot Learning","url":"https://arxiv.org/abs/2607.25593","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25593v1 Announce Type: new \nAbstract: Robotic hardware evolves over time, but demonstration data is often tied to a specific sensor and actuator configuration. This raises a practical and underexplored question: when does legacy data begin to benefit an upgraded robot? We study this question on a wheeled humanoid platform across two hardware generations, where both the camera and gripper are changed while the overall morphology remains fixed. Contrary to the common assumption that more cross-configuration data is always helpful, we observe a grokking-like transition: legacy data rem","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15453,"title":"P3: Probabilistic Policy Propagation for Stable VAE-Based Robot Learning","url":"https://arxiv.org/abs/2607.25541","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25541v1 Announce Type: new \nAbstract: Variational Autoencoders are widely used to encode high-dimensional and noisy observations in robotics. However, their stochastic latent creates a mismatch with Proximal Policy Optimization (PPO): an effective policy marginalizes over the latent distribution, whereas former implementations estimate its probability ratio and KL divergence using only one latent sample. We identify a fundamental but overlooked theoretical cause: naive single-sample approximations in stochastic latent space induce significant variance and bias in the surrogate loss.","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15452,"title":"A Causality-aware Infer-diagnose-refine Framework for Test-time Modality Adaptation in VLA Models","url":"https://arxiv.org/abs/2607.25516","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25516v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models predict sequential actions to execute tasks specified by language instructions, conditioned on visual observations and proprioceptive states. However, how to fuse modalities in VLA models remains an open problem, since robot manipulation involves dynamic phases, such as long-distance movements and close-range interactions, in which the importance of visual observations may vary over time. In this paper, we propose an infer-diagnose-refine (IDR) framework, a model-agnostic framework that can be integrated with","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15451,"title":"Decompose and Reorganize: Planning with Primitives and Visuomotor Policies Learned from Demonstrations","url":"https://arxiv.org/abs/2607.25397","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25397v1 Announce Type: new \nAbstract: Successfully automating dexterous, long-horizon robotic manipulation requires frameworks capable of both high-level reasoning and fine-grained execution. Traditional task and motion planning (TAMP), while excellent at symbolic planning, is often brittle in contact-rich operations. Simultaneously, imitation learning (IL), while effective in manipulation tasks with visual feedback, is limited by its low capability in spatial generalization and multi-stage operation. To reconcile their complementary strengths and limitations, we propose DR-LfD (Dec","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15450,"title":"Belief-Aware Influence and Trust (BAIT): Shaping Human Belief During Repeated Human-Robot Interaction","url":"https://arxiv.org/abs/2607.25327","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25327v1 Announce Type: new \nAbstract: Repeated human-robot interaction (HRI) requires proactively accounting for humans who continually adapt to evolving beliefs about the robot. Prior frameworks often treat encounters as isolated events, suffering cumulative task performance decay as human perception drifts, or maintain long-term influence through erratic, unpredictable behavior that erodes perceived human trust and relies on computationally unscalable formulations. To address these gaps, we introduce the Belief- Aware Influence and Trust (BAIT) controller. BAIT integrates a hierar","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15449,"title":"SONG: A Photorealistic 3D Gaussian Simulation Platform for Benchmarking Social Navigation","url":"https://arxiv.org/abs/2607.25219","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25219v1 Announce Type: new \nAbstract: Social navigation has progressed from simplified 2D environments toward a more general vision-based setting, in which a robot needs to achieve socially compliant behavior purely from onboard visual observations. Yet supporting simulation platforms have not kept pace: existing options either lack visual observations, lack moving human avatars, or fall short of real-world fidelity in appearance and pedestrian behavior, offering limited support for advancing vision-based social navigation. We introduce SONG, a SOcial Navigation platform powered by","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15448,"title":"Leveraging Semantic Maps for City-Scale Cross-View Localization","url":"https://arxiv.org/abs/2607.25215","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25215v1 Announce Type: new \nAbstract: We want robots to localize in previously untraversed environments against commonly available prior data. Rich semantic data available from OpenStreetMap can be useful in this task. However, existing methods either ignore this semantic information, directly matching panoramas and overhead imagery, or dramatically compress the semantic information, working with a small set of fixed classes. To leverage this rich semantic information, two challenges need to be overcome. First, useful semantic information needs to be extracted from the robot's egoce","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15447,"title":"Decentralized Scalable Exploration via Emergent Adaptive L\\'evy Walks on Minimal-Sensing Platforms","url":"https://arxiv.org/abs/2607.25195","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25195v1 Announce Type: new \nAbstract: Efficient autonomous exploration with palm-sized nano-UAVs remains challenging due to severe limitations in sensing, computation, and flight endurance. We present a lightweight sensor-driven L\\'evy walk (SDLW) controller for aerial robots weighing under 50 grams and equipped with sparse local sensing. The method combines discrete L\\'evy step-length sampling with a sensor-reactive heading policy using directional range measurements. Each robot independently samples its L\\'evy exponent from a uniform prior to diversify exploration without inter-ro","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15446,"title":"Input Shaping for Point-to-Point Motion with a Continuum Robot Arm","url":"https://arxiv.org/abs/2607.25071","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25071v1 Announce Type: new \nAbstract: A cable-driven continuum robot arm is an underactuated mechanism and may suffer residual vibration at the end of a rest-to-rest maneuver. In this work, a time-delay filter is applied as an input shaper to the system to eliminate the excitation of vibratory modes. A non-robust and a robust time-delay filter are designed based on a linear system model and demonstrate improved response compared to a velocity-driven pulse input. Experimental results using the continuum robot validate the application of the input shaper, with reduced overshoot and se","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15445,"title":"Motion Generation With Environmental Constraints","url":"https://arxiv.org/abs/2607.25053","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.25053v1 Announce Type: new \nAbstract: Robot motion planning faces challenges in high-dimensional spaces and uncertain environments, often constrained by the need for collision-free motions. We advocate an alternative approach, Environmental Constraint Exploitation (ECE), where deliberate contact with the environment simplifies planning by reducing dimensionality and computational complexity. By integrating ECE into motion planning algorithms, we bias exploration to task-relevant regions and leverage contact for uncertainty reduction to improve robustness during execution. We evaluat","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15444,"title":"Egocentric Station Holding of Robotic Fish in Unknown Turbulent Background Flow","url":"https://arxiv.org/abs/2607.24860","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.24860v1 Announce Type: new \nAbstract: Approaching a target position and holding station in flowing water is a fundamental and critical capability for robotic fish operating in natural aquatic environments. Despite decades of advances in enhancing swimming efficiency and maneuverability, this capability remains underdeveloped, largely owing to the insufficiently characterized, highly nonlinear fluid-structure interactions inherent to freely swimming robotic fish in flows. To bridge this gap, we propose the SWiFT framework, a Swimming With Flow Toolbox that enables the efficient explo","tags":[],"cluster_size":1,"ts":"2026-07-29T04:00:00"},{"id":15078,"title":"特斯拉人形机器人即将发布 - 新浪网","url":"https://news.google.com/rss/articles/CBMickFVX3lxTFBLY2FXWHZIeG1PYVNsZlR5OENvcDRpS3dndTJtNmtyZ0NlS3VFMEEwN1FuRlFIV3E4X0Y0UFpJdE9CUk1pU2t1RE9xcWRtX2QxVF9ObVM2T2NiY3EyOXhnSkk5bnJxRlQzeHpJanpQbXByQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMickFVX3lxTFBLY2FXWHZIeG1PYVNsZlR5OENvcDRpS3dndTJtNmtyZ0NlS3VFMEEwN1FuRlFIV3E4X0Y0UFpJdE9CUk1pU2t1RE9xcWRtX2QxVF9ObVM2T2NiY3EyOXhnSkk5bnJxRlQzeHpJanpQbXByQQ?oc=5\" target=\"_blank\"\u003e特斯拉人形机器人即将发布\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-29T01:09:00"},{"id":15079,"title":"中信证券：看好特斯拉机器人的量产和应用前景 - 新浪财经", // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
