份清醒定力。\n\n机器人女友来了！优必选重磅首发，最高售价99万元。\n\nAnthropic出性价比王牌Claude Sonnet 5，提升智能体能力，直指企业AI自动化市场。\n\n曝英伟达4芯片Rubin Ultra“发布仅三个月后就遭取消”引热议，SemiAnalysis称“英伟达份额正被侵蚀”。\n\n提醒：周三将公布中国6月RatingDog制造业PMI、美国6月ADP就业人数变动、美国6月ISM制造业指数。","tags":[],"cluster_size":1,"ts":"2026-06-30T23:25:31"},{"id":6450,"title":"6月份私募调研近1800次，电子行业热度居前","url":"https://wallstreetcn.com/livenews/3127015","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Wind数据显示，6月份共有842家私募机构参与到A股公司调研活动中，合计调研次数达1797次，涉及373家A股公司。其中，电子等行业A股公司被调研频次居于前列。今年1月份至6月份，私募机构调研次数分别为3619次、1485次、4740次、10117次、3554次、1797次。剔除春节假期所在的2月份，6月份私募机构整体调研节奏明显放缓。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-06-30T22:59:24"},{"id":6451,"title":"机构密集调研A股上市公司，人形机器人、半导体材料受追捧","url":"https://wallstreetcn.com/livenews/3127014","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"6月份，共有989家A股上市公司迎来机构调研。从调研逻辑看，硬科技赛道凭借清晰的产业升级路径、持续推进的国产替代进程以及充足的中长期成长空间，成为当前机构调研和中长期资金布局的主线。受访专家表示，当前公募、私募、外资、券商等各类机构布局风格差异化凸显，但对科技成长赛道的看多共识高度一致。其中，人形机器人、AI硬件、高端半导体材料等前沿细分领域，受益于产业迭代提速、上市公司业绩集中兑现、市场流动性持续改善三重利好共振，成为市场资金重点关注领域。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-06-30T22:57:30"},{"id":6452,"title":"6月30日港股通恒生科技ETF华安基金份额减少1550万份，重仓股腾讯控股、小米集团-W、阿里巴巴 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1Wc0x4V3NqbjloVk5VNzBOanhGaTY4UTNheDBHSnNqVXhwczVVQnJIRjN2bXZhY2RXTGpUYnZ4ZFpzZkthRkk2M2c1cVdXWUM2M2VOUmxLUjNXT25oVWJrSW1B?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1Wc0x4V3NqbjloVk5VNzBOanhGaTY4UTNheDBHSnNqVXhwczVVQnJIRjN2bXZhY2RXTGpUYnZ4ZFpzZkthRkk2M2c1cVdXWUM2M2VOUmxLUjNXT25oVWJrSW1B?oc=5\" target=\"_blank\"\u003e6月30日港股通恒生科技ETF华安基金份额减少1550万份，重仓股腾讯控股、小米集团-W、阿里巴巴\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":3,"ts":"2026-06-30T22:36:21"},{"id":6454,"title":"6月30日港股通互联网ETF广发基金份额减少50万份，重仓股腾讯控股、阿里巴巴-W、小米集团-W - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1lWXJvMVh3eGZVT3 5\" target=\"_blank\"\u003e布局太空算力！中国移动首次公布核心路线图\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-30T11:22:00"}]},{"key":"ai-cn","name":"AI 前沿 (中文)","description":"国内 AI 媒体 (机器之心 / 36氪 / 量子位 / 极客公园 / 智东西 / 新智元) + AI 关键词大盘。","color":"#0891b2","tags":["大模型","AI芯片","Agent","商业","融资","公司","监管","研究"],"articles":[{"id":6746,"title":"美光 CEO 发声“甩锅”：内存供应失衡别只怪我们，客户 2023 年曾压价到三分之一导致 AI 爆发前没能扩产","url":"https://www.ithome.com/0/970/860.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"1d45\"\u003e北京时间 7 月 1 日，据 CNBC 报道，美光科技 CEO 桑杰 · 梅赫罗特拉 (Sanjay Mehrotra) 周二表示，当前内存芯片供需失衡不应完全归咎于芯片制造商。这种失衡近期已导致智能手机、电脑及其他消费电子产品价格上涨。\u003c/p\u003e\u003cp data-vmark=\"5814\"\u003e梅赫罗特拉指出，近年来在价格谈判中“强势压价”的客户同样加剧了这种紧张局面，这也使得整个行业在人工智能需求爆发前投资不足。\u003c/p\u003e\u003cp data-vmark=\"50c6\"\u003e“某些客户把我们的行业价格压得非常低。2023 年，我们的价格跌到了原来的三分之一。”梅赫罗特拉周二在接受 CNBC《疯狂金钱》节目主持人吉姆 · 克莱默 (Jim Cramer) 采访时表示。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"398d\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/f33de64f-7b5b-438d-9f95-4cf03473f152.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"852\" data-weibo=\"0\" alt=\"美光CEO梅赫罗特拉\" data-vmark=\"541c\"\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T01:27:53"},{"id":6747,"title":"美国商务部“松手”，Anthropic 现可对外出口 Fable 及 Mythos AI 模型","url":"https://www.ithome.com/0/970/859.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"441f\"\u003eIT之家 7 月 1 日消息，据路透社报道，当地时间周二（30 日），Anthropic 宣布，美国商务部已经\u003cstrong\u003e撤销针对 Fable 和 Mythos AI 模型的出口限制\u003c/strong\u003e。不到三周前，Anthropic 曾因美国的“国家安全风险”被要求暂停开放最先进的 AI 模型。\u003c/p\u003e\u003cp data-vmark=\"00db\"\u003e随着先进 AI 模型推动 AI 热潮和大规模资本投入，美国政府加大了新模型发布前的审查力度。6 月 12 日收到出口管制令后，Anthropic 旗下 AI 模型 Mythos 5 和 Fable 5 突然宣告关闭。\u003c/p\u003e\u003cp data-vmark=\"5b90\"\u003e当地时间上周五，美国政府先允许 Anthropic 向部分“受信任”的美国机构开放 Mythos 5，随后又进一步撤销限制。\u003c/p\u003e\u003cp data-vmark=\"f48f\"\u003eAnthropic 在 X 上宣布：“我们将从明天开始恢复访问权限。”\u003c/p\u003e\u003cp data-vmark=\"34bb\"\u003e路透社援引信件消息称，美国商务部长霍华德 · 卢特尼克已通知 Anthropic，Mythos 和 Fable 的\u003cstrong\u003e出口管制正式撤销\u003c/strong\u003e，今后出口两款模型也不再需要许可证。\u003c/p\u003e\u003cp data-vmark=\"6889\"","tags":[],"cluster_size":1,"ts":"2026-07-01T01:23:18"},{"id":6748,"title":"刚刚，Fable 5解禁！Anthropic连夜发“性价比”新模型，网友：感谢中国开源严父 - 智东西","url":"https://news.google.com/rss/articles/CBMiRkFVX3lxTE9oR2ZadGk3M0ZlcEF3RUszSmU5S1BrM0I5bnhSSUtwNlRaRDh3VVg4cWZKMGJ5WVl2WDhyR1E3UnB6YXpnbmc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiRkFVX3lxTE9oR2ZadGk3M0ZlcEF3RUszSmU5S1BrM0I5bnhSSUtwNlRaRDh3VVg4cWZKMGJ5WVl2WDhyR1E3UnB6YXpnbmc?oc=5\" target=\"_blank\"\u003e刚刚，Fable 5解禁！Anthropic连夜发“性价比”新模型，网友：感谢中国开源严父\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e智东西\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T01:22:32"},{"id":6749,"title":"AI 芯片新创 Etched 完成流片：低电压提升实际算力表现，SRAM + HBM 缓存","url":"https://www.ithome.com/0/970/858.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"5342\"\u003eIT之家 7 月 1 日消息，AI 芯片初创企业 Etched 当地时间昨日宣布其推理加速器芯片完成 A0 步进流片和首批机架构建。该企业获得超 10 亿美元订单和 8 亿美元 B 轮融资，\u003cstrong\u003e首批机架产品预计 2026 年夏天出货\u003c/strong\u003e。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"2be4\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/81fedfc9-28e3-4999-bb4c-e6b83cf5c573.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"1080\" data-weibo=\"0\" data-vmark=\"3ea7\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"6c9e\"\u003eEtched 表示，现有 AI 芯片在高负载下会产生大量废热，引发频率下降，最终导致实际的推理吞吐量仅有理论峰值的一半不到。\u003c/p\u003e\u003cp data-vmark=\"03f3\"\u003e而 Etched 的台积电 N4P 制程工艺芯片采用了全新架构：得益于电路、封装、算法等多层次的整体优化设计，\u003cstrong\u003e其数学模块电压比大多数竞品低 50","tags":[],"cluster_size":1,"ts":"2026-07-01T01:21:02"},{"id":6750,"title":"重大技术突破！传OpenAI提升技术助推理成本砍半，GPU用量骤降至数百颗 - 集微网","url":"https://news.google.com/rss =\"0\" data-vmark=\"3925\"\u003e\u003c/p\u003e\u003cp data-vmark=\"7abe\"\u003e尽管早在 1999 年就出售了半导体业务，但 LG 电子一直维持着 Fabless 企业的身份，为自有产品提供 SoC 开发支持。LG 电子在芯片合同制造上的合作伙伴是台积电，上述外部 SoC 也将由台积电代工。\u003c/p\u003e\u003cp data-vmark=\"e3de\"\u003eLG 电子入局芯片设计服务可提升其既有人才与技术资源的利用效率，发挥自身作为台积电长期客户的关系优势。该企业已拥有直到 6nm 的 IP 组合，\u003cstrong\u003e目标到 2029 年延伸到 3nm 制程节点","tags":[],"cluster_size":1,"ts":"2026-07-01T00:58:36"},{"id":6756,"title":"国产AI芯片，进击3D堆叠 - Moomoo","url":"https://news.google.com/rss/articles/CBMiWkFVX3lxTFBWMXBVWXRpQmJQMjBwRE84LXNFUDZVdE9pVm5yWVdXOUpCS0R4aFUwZ054NFVXUFA0SG0zUHhkaUZFRmk5MFkyaGxnQ29tNjEzQzRwZ1ZEVnR4dw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiWkFVX3lxTFBWMXBVWXRpQmJQMjBwRE84LXNFUDZVdE9pVm5yWVdXOUpCS0R4aFUwZ054NFVXUFA0SG0zUHhkaUZFRmk5MFkyaGxnQ29tNjEzQzRwZ1ZEVnR4dw?oc=5\" target=\"_blank\"\u003e国产AI芯片，进击3D堆叠\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T00:51:54"},{"id":6757,"title":"韩国出口创 1978 年以来最大增幅首次突破千亿美元大关，6 月芯片出口额 448.2 亿美元同比飙升 199.5%","url":"https://www.ithome.com/0/970/827.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"2d98\"\u003eIT之家 7 月 1 日消息，韩国产业通商资源部今日公布的《6 月进出口动向》初步数据显示，韩国 6 月出口额达到 1022.5 亿美元（IT之家注：现汇率约合 6949.42 亿元人民币），同比增长 70.9%，不仅首次突破单月 1000 亿美元大关，也刷新韩国历史最高月度出口纪录，创下自 1978 年 10 月以来最快同比增速。此前韩国单月出口最高纪录为 2026 年 5 月的约 878 亿美元，连续两个月实现大幅刷新。\u003c/p\u003e\u003cp data-vmark=\"6e44\"\u003e韩国由此成为继德国、中国、美国之后，全球第四个实现单月出口额突破千亿美元的国家。\u003c/p\u003e\u003cp data-vmark=\"dc05\"\u003e与此同时，韩国 6 月进口额为 661 亿美元，同比增长 30.1%，当月贸易顺差由此达到 361.5 亿美元，同样创下新高，首次突破 300 亿美元。\u003c/p\u003e\u003cp data-vmark=\"d4c6\"\u003e2026 年 1 至 6 月，韩国累计出口 4967 亿美元，同比增长 48.4%，创下历史同期最高纪录；累计贸易顺差达到 1383 亿美元，较去年同期增加 1109 亿美元。\u003c/p\u003e\u003cp data-vmark=\"7017\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/","tags":[],"cluster_size":1,"ts":"2026-07-01T00:48:28"},{"id":6758,"title":"FFN不适合GPU，更需要专用AI芯片! - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE9jUTJMZTNWbEwtcENrOWhuU0hrTGhmemhEYW9YSTNONnBBUVNXSTRxU1ZaQVpkNFpMcWJkZ2I0UkM2UEp6aF9ra3RDR1B1eGtKaDhV?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE9jUTJMZTNWbEwtcENrOWhuU0hrTGhmemhEYW9YSTNONnBBUVNXSTRxU1ZaQVpkNFpMcWJkZ2I0UkM2UEp6aF9ra3RDR1B1eGtKaDhV?oc=5\" target=\"_blank\"\u003eFFN不适合GPU，更需要专用AI芯片!\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T00:47:00"},{"id":6759,"title":"影响全球超 50 亿台手机：苹果隔空投送 / 谷歌快速分享曝安全漏洞","url":"https://www.ithome.com/0/970/821.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"cfa7\"\u003eIT之家 7 月 1 日消息，CISPA 亥姆霍兹信息安全中心于 6 月 25 日发布论文，研究指出苹果隔空投送（AirDrop）和谷歌安卓快速分享（Quick Share）存在安全漏洞，\u003cstrong\u003e影响全球超过 50 亿台 iPhone 和安卓手机。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"3cab\"\u003e研究人员深入研究苹果隔空投送和谷歌快速分享，发现这两套近距离无线传输系统为保证传输流程尽量无感，会以高权限后台服务运行，在附近出现其他设备时会立即唤醒。但问题是发送方身份尚未完成验证前，相关后台进程已经暴露。\u003c/p\u003e\u003cp data-vmark=\"fd4c\"\u003e在苹果生态中，漏洞利用点位于控制 AirDrop、AirPlay、Handoff、Universal Clipboard 与 Continuity Camera 的后台守护进程。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"7326\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/b53d50da-a0f4-4c17-8b8a-8f4b7dc75744.png?x-bce-process=image/format,f_auto\" w=\"839\" h=\"490","tags":[],"cluster_size":1,"ts":"2026-07-01T00:34:36"},{"id":6760,"title":"美国政府解除大模型出口管制Anthropic：将开始恢复访问 - 凤凰网","url":"https://news.google.com/rss/articles/CBMiSEFVX3lxTFBYUlJnRFVUV3ExUHp6aHBGakg0VGYzNWw3TzJaaFlFQUVnNmZZbWNqSmZQRS11UlpwdmJZOGlIMmVrRWt1eDlteQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiSEFVX3lxTFBYUlJnRFVUV3ExUHp6aHBGakg0VGYzNWw3TzJaaFlFQUVnNmZZbWNqSmZQRS11UlpwdmJZOGlIMmVrRWt1eDlteQ?oc=5\" targ RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.29089v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models demonstrate impressive reasoning over visual, semantic, and spatial task variations by leveraging large-scale vision and language pre-training. They remain, however, largely blind to contact forces, which seldom manifest clearly in visual feedback but are central to contact-rich manipulation. Tactile sensing measures these forces directly, but integrating it into VLAs is difficult: tactile data is absent from the large-scale corpora used to pre-train VLAs, so adding it as a new input modality induces a distrib","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6614,"title":"A Unified Framework for Multi-Contact Path Planning in the Rolling Robot Systems","url":"https://arxiv.org/abs/2606.29065","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.29065v1 Announce Type: new \nAbstract: Rolling motion planning is challenging because rolling contact imposes nonholonomic constraints and the configuration evolves on a curved manifold. The problem becomes substantially harder in multi-contact settings, where multiple bodies roll without slip and the contact states are coupled. This paper presents a new framework for multi-contact path planning in spherical rolling robotics under no-slip constraints. We first derive a compact kinematic model for multi-sphere rolling using Montana's contact-coordinate formulation, where each contact","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6613,"title":"Keypose Exploration: Efficient Automatic Trajectory Labelling and Cross-Embodiment Policy Transfer","url":"https://arxiv.org/abs/2606.29028","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.29028v1 Announce Type: new \nAbstract: Keypose-based manipulation decomposes tasks into critical waypoints to simplify policy learning for long-horizon tasks, but existing approaches rely on task-specific heuristics or manual annotation to extract keyposes from demonstrations. We present an automatic trajectory labelling pipeline for grasp-related tasks. This pipeline combines vision-language models (VLMs) for semantic event detection with classical trajectory analysis for precise temporal alignment, requiring VLM inference only on one single demo among repeating ones per task. Using","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6612,"title":"HJ-SafeDMP: Hamilton-Jacobi Reachability-Guided Dynamic Movement Primitives for Provably Safe Robot Motion","url":"https://arxiv.org/abs/2606.28995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28995v1 Announce Type: new \nAbstract: Robots deployed in safety-critical environments must execute motions that are simultaneously robust to disturbances and provably safe from collisions. Dynamic Movement Primitives (DMPs) offer inherent stability, temporal flexibility, and efficient trajectory generalization from single demonstrations, but they lack formal safety certificates. Conversely, Hamilton-Jacobi (HJ) Reachability analysis provides a principled framework for computing worst-case safety margins and forward-invariant safe sets, but classical grid-based methods suffer from th","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6611,"title":"You Only Touch Once: 6-DoF Object Pose Estimation from Single Tactile Contact","url":"https://arxiv.org/abs/2606.28899","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28899v1 Announce Type: new \nAbstract: Accurate 6-DoF object pose estimation is fundamental to robotic manipulation, yet vision-based methods often fail under occlusion, poor lighting, and reflective or transparent surfaces. We present YOTO, a tactile-only pose estimation system that recovers the full 6-DoF object pose from a single pair of simultaneous contacts, without requiring contact history. YOTO represents each tactile contact as a local 3D point cloud and localizes it on the object surface through a coarse-to-fine network. The two localized contacts, together with the calibra","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6610,"title":"LNN-Fly: Continuous-Time UAV Navigation for Robust Obstacle Avoidance under Timing Mismatch","url":"https://arxiv.org/abs/2606.28827","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28827v1 Announce Type: new \nAbstract: End-to-end unmanned aerial vehicle (UAV) navigation can achieve impressive agility in simulation, yet its obstacle-avoidance behavior often degrades after deployment because the policy must tolerate simulator mismatch, sensing irregularity, and variable-rate control. These effects are especially dangerous in cluttered environments, where stale observations or short control irregularities can directly lead to collisions. We present LNN-Fly, a deployment-oriented continuous-time navigation policy for LiDAR-based UAV obstacle avoidance. The policy","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6609,"title":"Human2Any: Human-to-Robot Transfer via Constraint-Aware Compositional Planning","url":"https://arxiv.org/abs/2606.28813","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28813v1 Announce Type: new \nAbstract: Human videos are a scalable source of supervision for robot manipulation, as they are abundant and naturally capture rich object interactions. However, transferring human demonstrations to robots remains challenging due to embodiment mismatch, scene variation, and robot-specific feasibility constraints. We present Human2Any, a framework for learning reusable object-centric interaction priors from human videos without requiring real-world robot demonstrations in the target task contexts. Human2Any represents manipulation through object-object int","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6608,"title":"Physics Models for Sim-to-Real Transfer in Professional-Level Robot Table Tennis","url":"https://arxiv.org/abs/2606.28805","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28805v1 Announce Type: new \nAbstract: At competitive speeds and spins, a table tennis ball follows complex, counterintuitive trajectories that a robot must track and precisely counter within fractions of a second. Training a reinforcement learning policy capable of these skills is prohibitively expensive and dangerous in the real world, making high-fidelity simulation essential. Transferability of such policies, however, critically depends on how faithfully the simulation captures real-world dynamics--a requirement made even more stringent by the adversarial nature of the game, wher","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6607,"title":"Vision-Language Models for Deployable Social Robot Navigation: Bridging Semantic Reasoning and Low-Level Control","url":"https://arxiv.org/abs/2606.28760","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28760v1 Announce Type: new \nAbstract: Social robot navigation (SRN) requires more than geometric path planning; it demands understanding human intentions, social norms, and contextual cues to generate socially compliant behaviors. Although classical navigation methods provide reliable metric planning and collision avoidance, they often lack the semantic reasoning capabilities necessary for operation in complex human-centered environments. Recent advances in Vision-Language Models (VLMs) have opened new opportunities for SRN by enabling high-level VLM understanding, commonsense reaso","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6606,"title":"He3-Seeker: Robotic Information Planning for Lunar Helium-3 Distribution Mapping","url":"https://arxiv.org/abs/2606.28746","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28746v1 Announce Type: new \nAbstract: Lunar helium-3 is a highly valuable strategic resource, pivotal to the advancement of both deep-space exploration and space mining. Existing lunar helium-3 exploration methodologies rely primarily on indirect measurements via remote sensing, which are often characterized by limited precision, low reliability, and insufficient spatial resolution. In this paper, we introduce He3-Seeker, an active robotic exploration method for helium-3 distribution mapping. First, we provide a formal definition of the active helium-3 exploration problem. Subsequen","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6605,"title":"CubifyGS: Object-Centric 3D Gaussian Splatting for Lifelong Dynamic Scene Maintenance","url":"https://arxiv.org/abs/2606.28720","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28720v1 Announce Type: new \nAbstract: Lifelong scene mapping under rigid object rearrangement remains a fundamental challenge in robotics. While 3D Gaussian Splatting (3DGS) enables high-fidelity modeling, primitive-level updates often cause persistent ghosting and slow recovery. We propose CubifyGS, an object-level mapping framework that shifts dynamic maintenance from passive re-optimization to active asset management. CubifyGS models movable instances as reusable Gaussian assets, detects object appearance and disappearance, and updates maps through asset retrieval, rigid transfor","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6604,"title":"Embodiment Meets Environment: Toward Context-Aware, Safe Physical Caregiving Robots","url":"https://arxiv.org/abs/2606.28592","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28592v1 Announce Type: new \nAbstract: Physical caregiving robots need to assist different users with different tasks in diverse environments, and they come in many embodiments. While substantial progress has been made on individual caregiving tasks, most existing systems remain tightly coupled to specific environments and robot embodiments, and often do not explicitly model or constrain interactions around people, despite humans being special agents in the environment. This motivates a focus on adapting to context that emerges from the joint interaction between the environment and t","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6603,"title":"Robotic Arm-Based Spectral Sensing for Strawberry Positioning and Non-Destructive Sweetness Measurement","url":"https://arxiv.org/abs/2606.28555","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28555v1 Announce Type: new \nAbstract: Accurate assessment of sweetness is essential for quality control in agriculture, yet conventional methods rely on destructive sampling and are difficult to scale. This thesis presents a robotic arm-based spectral sensing system for strawberry detection, localization, approach, and non-destructive sweetness estimation.\n  The system integrates perception, calibration, and robotic control in a closed-loop pipeline. A YOLOv11s detector is adopted for real-time strawberry detection, while RGB-ToF calibration and mask-to-depth alignment are used to o","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6602,"title":"The Speedup Paradox: Rethinking Inference Speed-Quality Trade-off in Embodied Tasks","url":"https://arxiv.org/abs/2606.28529","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28529v1 Announce Type: new \nAbstract: Embodied foundation models have recently been widely used to improve robot generalization and task success rates. Previous works apply lossy efficient-inference techniques such as quantization, pruning, and asynchronous inference, accepting small action quality degradation in exchange for lower per-step computation cost and inter-action latency. However, unlike traditional static ML tasks, embodied tasks involve repeated interaction with the environment, and task-level performance is determined not only by per-step cost, but also by closed-loop","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6601,"title":"FADA: Few-Shot Domain Adaptation via Dynamics Alignment for Humanoid Control","url":"https://arxiv.org/abs/2606.28476","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28476v1 Announce Type: new \nAbstract: High-precision humanoid control is limited by target-domain dynamics mismatch, where the same control objective can induce different realized motions under changes in terrain, payload, or actuator response. Existing methods either pursue zero-shot transfer through domain randomization or in-context adaptation without target-domain specialization, or require heavy adaptation pipelines that leverage target-domain data, such as model calibration, residual learning, or policy retraining. In this paper, we present FADA (Few-Shot Domain Adaptation via","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6600,"title":"Improvement of Robot's Simultaneous Localization and Mapping Using an Effective Transformation to Achieve Linear Model","url":"https://arxiv.org/abs/2606.28475","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28475v1 Announce Type: new \nAbstract: Nowadays mobile robots have wide engineering applications. Simultaneous localization and mapping (SLAM) is an important task of these robots. The major and common algorithms used for this task are based on extended Kalman filter (EKF). One of the main problems in EKF-based SLAM is its divergence. The nonlinearity of motion and observation models and linearization error are the main reasons for the divergence. There have been some efforts to address this problem with limited success. In this paper, by applying a simple compass and using an effect","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6599,"title":"When May I Help You? On The Effect of Proactivity on Group Human-Robot Collaboration","url":"https://arxiv.org/abs/2606.28469","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28469v1 Announce Type: new \nAbstract: Robot initiative is a central challenge in multi-party human-robot collaboration. A robot that contributes without being addressed may provide timely support, but it may also disrupt coordination, divide attention, or interrupt turn-taking; a robot that waits to be addressed may preserve human control, but it may also miss opportunities to assist. We investigate this design challenge in a collaborative escape room in which pairs of participants work with a humanoid robot under either a reactive interaction model, where the robot responds only wh","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6598,"title":"RoboGaze: Evaluating Robot World Models via Structured Vision-Language Analysis","url":"https://arxiv.org/abs/2606.28385","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28385v1 Announce Type: new \nAbstract: Recent advances in robot world models enable synthetic video generation for embodied prediction and planning. However, evaluating these videos is challenging: visually realistic outputs often violate physical laws, temporal consistency, or task logic, while conventional metrics and monolithic Vision-Language Model (VLM) judges fail to generalize or provide precise diagnostic value. We present RoboGaze, a training-free, multi-agent VLM framework that provides structured, interpretable evaluation for generated robot-manipulation videos. Given a ta","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6597,"title":"Auditing LLM-Governed Social Robots with Culture-Specific Moral Gradients","url":"https://arxiv.org/abs/2606.28345","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28345v1 Announce Type: new \nAbstract: LLM-governed social robots increasingly decide who receives real-world assistance first. As prioritization norms vary across cultures by age, status, and group size, failure to calibrate pluralistically can scale into unequal access. Yet LLM moral audits remain English-centered, rarely test embodied contexts, leaving pluralistic calibration as an urgent diagnostic gap amid intensifying LLM-robot deployment. We introduce a gradient-based audit framework for multilingual evaluation of LLM moral trade-off behavior against cultural preference gradie","tags":[],"cluster_size":1,"ts":"2026-06-30T04:00:00"},{"id":6616,"title":"特斯拉Optimus V3量产在即，人形机器人产业链迎催化，科创100ETF博时(588030)震荡上行涨超2% - 新浪财经","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTFBnT0pYM05WaURNczJYRFhoZHJPSjBONmZRNlRzZjR3RWZsVG9yMTBHZ19ZSHZYU3NfMjlYRkJDUXNVQ096cmxtQ3JmR1JrX3NnTWJKMHRkTWFtdm9zam9Oc2prREF3RE50TlM1X1JvWQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMib0FVX3lxTFBnT0pYM05WaURNczJYRFhoZHJPSjBONmZRNlRzZjR3RWZsVG9yMTBHZ19ZSHZYU3NfMjlYRkJDUXNVQ096cmxtQ3JmR1JrX3NnTWJKMHRkTWFtdm9zam9Oc2prREF3RE50TlM1X1JvWQ?oc=5\" target=\"_blank\"\u003e特斯拉Optimus V3量产在即，人形机器人产业链迎催化，科创100ETF博时(588030)震荡上行涨超2%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-30T03:23:00"},{"id":6617,"title":"估值200亿，中国最像特斯拉机器人的公司浮出水面 - 36Kr","url":"https://news.google.com/rss/articles/CBMiTkFVX3lxTE1Sc0JFbXp3dkZmZzdsZF85cmxhYm93S1pkRWc1TXBYY1ZqOVkyMkwyWUdjeVdrSnFFbEk1Ymx3X0xidW95QTVMMHZNRi1XQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE1Sc0JFbXp3dkZmZzdsZF85cmxhYm93S1pkRWc1TXBYY1ZqOVkyMkwyWUdjeVdrSnFFbEk1Ymx3X0xidW95QTVMMHZNRi1XQQ?oc=5\" target=\"_blank\"\u003e估值200亿，中国最像特斯拉机器人的公司浮出水面\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T22:52:00"},{"id":6618,"title":"特斯拉Optimus机器人真能卖到2万美元吗？ - 新浪财经","url":"https://news.google.com/rss/articles/CBMifkFVX3lxTE1ZazV0QmdQTVloT3lXb2tTbW1ldUpMMjJCenh // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
