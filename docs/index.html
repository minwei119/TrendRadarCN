s://www.ithome.com/1/006/739.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"44ef\"\u003eIT之家 9 月 24 日消息，蓝鲸新闻今日援引产业链人士消息称，国内存储 SLT 系统级测试设备厂商欧康诺，将联合海光信息打造\u003cstrong\u003e一套国产化内存、存储芯片测试平台\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"d885\"\u003e据前述人士透露，该平台以海光信息 CPU 为核心；与此同时，欧康诺还在对接国内头部存储芯片厂商，由后者提供 DRAM 芯片底层测试技术，搭配欧康诺自研国产测试整机，共同搭建这套国产化测试平台。\u003c/p\u003e\u003cp data-vmark=\"1fdc\"\u003e报道称，\u003cstrong\u003e双方计划于年底正式发布该产品\u003c/strong\u003e。目前项目进入最后的联合调试阶段，预计 10 月底产品成熟并对外开放。\u003c/p\u003e\u003cp data-vmark=\"51a9\"\u003eIT之家查询公开资料获悉，欧康诺成立于 2005 年，是国内最早配套做 HDD 机械硬盘可靠性测试并实现量产的企业，从 HDD 到 SSD 拥有自主研发及迭代的技术能力，为存储器原厂、头部互联网企业、整机厂、品牌厂等国内外知名客户提供自主研发的一站式存储器测试系统和产品测试服务。\u003c/p\u003e\u003cp data-vmark=\"2042\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfile","tags":[],"cluster_size":1,"ts":"2026-09-24T06:21:13"},{"id":30070,"title":"腾讯混元宣布“腾讯 Hy 翻译”App 上线，支持 33 种语言互译","url":"https://www.ithome.com/1/006/738.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"fcdc\"\u003eIT之家 9 月 24 日消息，腾讯混元今日宣布“腾讯 Hy 翻译”App 上线，同步支持小程序、插件、PC 端体验，直接搜索“腾讯混元翻译”即可。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"9cdd\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/2d4dd80f-77fe-49de-a8d5-cc966282460d.jpg?x-bce-process=image/format,f_auto\" w=\"1080\" h=\"838\" data-weibo=\"0\" data-vmark=\"050c\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"27d8\"\u003e据介绍，它基于腾讯混元 Hy-MT2 翻译模型打造，\u003cstrong\u003e支持 33 种语言互译\u003c/strong\u003e，并覆盖 5 种中国少数民族语言及方言，提供语音翻译、拍照翻译以及离线翻译等多种体验方式。离线翻译模式下，用户通过提前将翻译模型下载至手机上，进而在没有网络或者信号不好的地方依然能稳定使用。\u003c/p\u003e\u003cp data-vmark=\"8374\"\u003e“腾讯 Hy 翻译” App 现已在 12 个国家和地区上线，包括美国、日本、韩国、新加坡、马来西亚、泰","tags":[],"cluster_size":1,"ts":"2026-09-24T06:20:36"},{"id":30071,"title":"港大与北师大用三维波模拟研究超轻暗物质，首次预测其对引力透镜成像的影响","url":"https://www.ithome.com/1/006/737.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4a9a\"\u003eIT之家 9 月 24 日消息，香港大学物理系与该校天文及天体物理研究所，联合北京师范大学主导的研究团队，提出一种更贴近物理实际的方案，用三维波模拟检验超轻暗物质对引力透镜图像的影响。\u003c/p\u003e\u003cp data-vmark=\"ac33\"\u003e这是首次直接基于超轻暗物质的三维波模拟，直接预测其对引力透镜成像的影响，为利用高分辨率引力透镜观测研究暗物质性质提供了新的方法。相关成果已发表于《天体物理学杂志快报》。\u003c/p\u003e\u003cp data-vmark=\"7bbb\"\u003e暗物质被认为占宇宙全部物质的约 85%，不发光也不吸收或反射光，目前只能通过引力效应被探测。它不在粒子物理标准模型之内。过去十年，越来越多天文证据提示，暗物质可能由超轻粒子组成（超轻暗物质也称“模糊暗物质”，指质量极低、集体行为类似波的暗物质候选者）。\u003c/p\u003e\u003cp data-vmark=\"9651\"\u003e由于质量极低，这类粒子可像波一样集体运动，形成类似海浪相遇时的复杂干涉图样。这种图样可能在星系多重像中留下痕迹。\u003c/p\u003e\u003cp data-vmark=\"2eda\"\u003e引力透镜是指大质量天体的引力弯曲并扭曲更遥远光源的光，从而形成多个图像。研究团队据此预测，若星系由超轻暗物质构成，透镜图像应具有哪些性质。\u003c/p\u003e\u003cp data-vmark=\"1afb\"\u003e此次研究中，团队利用计算机直接模拟超轻暗物质粒子相互作","tags":[],"cluster_size":1,"ts":"2026-09-24T06:16:58"},{"id":30072,"title":"Agent 时代来了，3D 生成大模型接下来比什么？|极客公园|GPT-6|ChatGPT|建模|工作流_手机新浪网 - finance.sina.cn","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxQNWRoQXV5dV96ckJWNk9xa1ItUWlkU25wQkhiaW9jNjZ5LW5lVGl0OS1tb1kwVnphaDVDQUhZa1pBUXk5WWI1dGkwUW52d3U1bUdtWjJ1WVdIS0E4U2lzXzZObWRFTm5QT0tNZlBpMEFJbkxMZkhyX0p2NDRQUDJCeF9DSGJpMzR3SFpINDBNZGtJcEVaNEVjNnlFc3NZcG02Ul9NN2k1aw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxQNWRoQXV5dV96ckJWNk9xa1ItUWlkU25wQkhiaW9jNjZ5LW5lVGl0OS1tb1kwVnphaDVDQUhZa1pBUXk5WWI1dGkwUW52d3U1bUdtWjJ1WVdIS0E4U2lzXzZObWRFTm5QT0tNZlBpMEFJbkxMZkhyX0p2NDRQUDJCeF9DSGJpMzR3SFpINDBNZGtJcEVaNEVjNnlFc3NZcG02Ul9NN2k1aw?oc=5\" target=\"_blank\"\u003eAgent 时代来了，3D 生成大模型接下来比什么？|极客公园|GPT-6|ChatGPT|建模|工作流_手机新浪网\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-24T06:14:51"},{"id":30073,"title":"三天三夜造出“数智员工军团”，佛山首批“智能体指挥官”圆满结营——“人工智能＋数智员工军团智能体指挥官”实战培训在佛山鹰创园收官 - 中国日报网","url":"https://news.google.com/rss/articles/CBMifEFVX3lxTE9TODdUZHRoVmlFWlE1LXN3dnhySHV5U0tybkFaVkpUWGl6SFBObnVyOHJzdmhKa3VXdG0welJpZU40MDhkV2RrVm5rMDFEaVNpWXBtUER2UGFZNldfZ3JIQ184dDUwOVcxcm1  Large Reasoning Models","url":"https://arxiv.org/abs/2609.27166","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27166v1 Announce Type: new \nAbstract: Capability and efficiency are two key dimensions of reasoning in large language models (LLMs). Capability refers to the ability to solve a given problem correctly, whereas efficiency refers to the ability to do so with limited resources. When LLMs use Chain-of-Thought (CoT) reasoning to solve problems of controlled hardness, both the number of problems solved correctly and the number of tokens required to reach a correct answer depend on problem hardness and model size. However, how these factors jointly shape capability and efficiency remains p","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29825,"title":"The Linear Representation Hypothesis Needs a Group Action","url":"https://arxiv.org/abs/2609.27158","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27158v1 Announce Type: new \nAbstract: To make claims about representations that generalize beyond a particular trained model, we need to specify when two representations should count as equivalent. The Linear Representation Hypothesis is often discussed without making this equivalence explicit. Different notions of equivalence preserve different structures, so metrics, probes, and interventions that appear to study the same representation may in fact correspond to different hypotheses. We therefore argue that the Linear Representation Hypothesis is not one hypothesis but a family of","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29824,"title":"Local Evidence and Geometric Readout Repair in Trained GNNs","url":"https://arxiv.org/abs/2609.27092","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27092v1 Announce Type: new \nAbstract: Many node-classification GNNs apply a linear classifier to a nonnegative mixture of local messages. An error can reflect either poor mixture weights or a reachable logit set poorly positioned for the classifier. We separate these causes with an exact-mass linear program and two learned post-hoc repairs. Every reweighted prediction has an equivalent centered logit translation, but only translations in a message-induced displacement set are realizable by reweighting. Across eight datasets, eight GNN backbones, and ten splits, mean accuracy rises f","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29823,"title":"ChipMEM: Verification-Grounded Memory for EDA Agents","url":"https://arxiv.org/abs/2609.27067","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27067v1 Announce Type: new \nAbstract: Large language model (LLM)-based agents use Electronic Design Automation (EDA) tools to generate and revise register-transfer-level (RTL) designs under synthesis and verification feedback. Recent methods learn from this feedback by distilling reusable skills from execution traces or by training on rewards derived from EDA-tools. Both methods are typically evaluated on the tasks that produced the experience. Repeated access to benchmark feedback on the same task can reward task-specific revision rather than creating reusable knowledge that transf","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29822,"title":"An open benchmark for machine learning-based polymer property prediction","url":"https://arxiv.org/abs/2609.27036","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27036v1 Announce Type: new \nAbstract: Polymer property prediction lacks open, standardized benchmarks that enable rigorous comparison of machine-learning methods, with existing resources covering only a narrow fraction of polymer architectures, such as homopolymers. We introduce Polymer Benchmark 2026 (PolyBench26), an open dataset comprising nearly 250,000 polymer-property datapoints across eight physical properties, including data from experimental measurements, density functional theory, and molecular dynamics. The benchmark supports four evaluation tasks across homopolymers and","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29821,"title":"WTF?! Simulation-Free Reinforcement Learning with Wasserstein-Tilted Flow Maps","url":"https://arxiv.org/abs/2609.27033","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27033v1 Announce Type: new \nAbstract: Reward fine-tuning aims to update a pre-trained flow-based generative model to improve the downstream reward of its generated samples. Existing methods typically formulate this problem as sampling from a reward-tilted distribution, the solution to a KL-regularized reward-maximization problem. Here, we introduce an optimal transport regularizer built directly from the pre-trained drift. Unlike KL reward tilting, the resulting objective transports individual samples toward higher reward rather than reweighting the base distribution. We show that t","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29820,"title":"GeoRVQ: Decoder-aware geometry for residual-token prediction in physiological signals","url":"https://arxiv.org/abs/2609.27018","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.27018v1 Announce Type: new \nAbstract: Residual vector quantization (RVQ) turns physiological waveforms into compact token sequences, but conventional masked modeling treats every incorrect token as equally costly. We propose GeoRVQ, a coarse-to-fine masked token model whose objective reflects the local response of a frozen waveform decoder. Decoder-induced costs define geometry-aware soft targets and expected distortion, while quantizer-causal prediction follows residual dependencies from coarse to fine levels. In a descriptive aggregate over MIMIC-IV Waveform, VitalDB, and CODE-15\\","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29819,"title":"Resource-Efficient Distributed Recursive Gaussian Processes","url":"https://arxiv.org/abs/2609.26979","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26979v1 Announce Type: new \nAbstract: Gaussian processes (GPs) provide a flexible framework for learning unknown functions from noisy measurements while quantifying predictive uncertainty, making them well suited for estimation in multi-agent systems. However, when measurements are collected by multiple agents, maintaining a unified GP model without centralized processing requires efficient distributed algorithms that can operate using local measurements and communication with neighboring agents. In this work, we develop two distributed recursive GP (RGP) algorithms for multi-output","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29818,"title":"TinyUDE: Solver-Free Universal Differential Equations on Microcontrollers via Lie-Taylor Jet Matching","url":"https://arxiv.org/abs/2609.26972","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26972v1 Announce Type: new \nAbstract: Training Universal Differential Equations (UDEs) traditionally relies on backpropagating through numerical ODE solvers, creating memory footprints far exceeding the capabilities of edge microcontrollers. We present Lie-Taylor jet matching, a solver-free training framework that fits a hybrid vector field directly to the first and second time-derivatives of observed system states. These derivatives, the truncated Lie-Taylor jet, are estimated online via Savitzky-Golay filtering, yielding fully analytic gradients without automatic differentiation s","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29817,"title":"CRISP: Scalable Importance-Stratified Coresets for Imbalanced Tabular Learning","url":"https://arxiv.org/abs/2609.26962","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26962v1 Announce Type: new \nAbstract: Large imbalanced tabular datasets make repeated gradient-boosted tree training expensive. Existing coreset methods often lose accuracy when most majority examples are removed. We present CRISP (Coreset Reduction via Importance-Stratified Pruning), a linear-time method that allocates a negative-class budget across quantile strata of a proxy-model score. Sample weights account for unequal inclusion probabilities. At 95% negative-class reduction on a production fraud dataset, CRISP trains on approximately 1.70M of 25M rows and retains 99.7% of full","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29816,"title":"Transfer Learning with Conformalized Quantile Regression for Solar PV Forecasting Under Load-Shedding-Driven Data Scarcity","url":"https://arxiv.org/abs/2609.26959","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26959v1 Announce Type: new \nAbstract: Solar photovoltaic (PV) forecasting in regions affected by load shedding is challenging because reliable historical observations are scarce. This study proposes a transfer learning framework combined with Conformalized Quantile Regression (CQR) to improve PV power forecasting and provide reliable uncertainty estimates under severe data scarcity. A source-domain PV dataset from Alice Springs, Australia, is used to pretrain a temporal forecasting model, which is then adapted to simulated Bangladesh PV data representing different levels of historic","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29815,"title":"When Post-Processing Fairness Constraints Help and When They Harm: Evidence from Eight Cross-Domain Evaluations","url":"https://arxiv.org/abs/2609.26955","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26955v1 Announce Type: new \nAbstract: Fairness audits in production ML typically occur once, at deployment, on a single domain. Both fail in practice: fairness can shift after retraining or a changing user base, and interventions validated on one dataset are rarely tested across the heterogeneous domains an organization deploys. We present FAPE (Fairness Auditing for Production Environments), a four-stage framework evaluating a single post-processing intervention, Fairlearn's ThresholdOptimizer, across eight domain evaluations: criminal justice, income prediction, legal admissions,","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29814,"title":"On Preference Coverage Collapse from Hindsight Relabeling in Multi-Objective Reinforcement Learning","url":"https://arxiv.org/abs/2609.26918","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26918v1 Announce Type: new \nAbstract: Hindsight relabeling which retroactively replacing a transition's goal with the outcome the agent actually achieved is an effective tool for improving sample-efficiency in Reinforcement Learning (RL). A natural extension to preference-conditioned multi-objective RL (MORL) relabels transitions with the preference direction the agent achieved rather than the one asked for. We show that this extension is frequently harmful: across four preference-conditioned off-policy algorithms spanning two critic backbones and two preference-sampling schemes on","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29813,"title":"CORE-STACK+: Meta-Learning for Deep Stacked Generalization","url":"https://arxiv.org/abs/2609.26905","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26905v1 Announce Type: new \nAbstract: Stacking heterogeneous vision backbones (CNNs, ViTs, and hybrids) is the de facto recipe for accuracy, calibration, and robustness, yet two coupled pathologies limit its returns. Prediction-space multicollinearity ill-conditions the meta-learner's Gram matrix, inflating weight variance and producing brittle solutions on a thin manifold. Calibration collapse compounds constituent miscalibration through naive linear stacking, so adding more models can hurt expected calibration error (ECE). Existing remedies, ridge regularization, greedy selection,","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29812,"title":"PR-Smoother: Simulator-Preserving Non-Gaussian Smoothing for Data Assimilation","url":"https://arxiv.org/abs/2609.26890","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26890v1 Announce Type: new \nAbstract: Many physical data assimilation (DA) workflows require smoothing methods that represent non-Gaussian posteriors over physical state variables, scale to high-dimensional simulators, train from observation windows alone, and remain compatible with calibration of the prescribed simulator. We introduce PR-Smoother, a simulator-preserving amortized smoother designed for this prescribed-simulator DA regime. Its key design principle is to keep the prescribed simulator explicit in both the evidence lower bound and the variational family: rather than lea","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29811,"title":"Marginally Correct Tool Caches Can Reverse Group-Normalized Policy Updates","url":"https://arxiv.org/abs/2609.26866","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26866v1 Announce Type: new \nAbstract: Tool-result caching reduces repeated execution in agent training, but also couples rollout randomness. We study a two-action model in which independent and shared execution preserve every rollout's conditional reward distribution. Despite this marginal agreement, sharing one stochastic result per group can reverse the expected group-normalized policy update. We derive an exact finite-group expression: against a constant alternative, the shared update follows the probability of winning minus the probability of losing, rather than the difference i","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29810,"title":"QUARTET: Quad-branch cross-Attention and Random-walk Traces for Enhancing Transformers on Relational Graphs","url":"https://arxiv.org/abs/2609.26855","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26855v1 Announce Type: new \nAbstract: Relational Deep Learning (RDL) models multi-table databases as heterogeneous temporal graphs, and graph transformers currently achieve state-of-the-art performance on benchmarks like RelBench. However, the current leading model, RelGT, suffers from two key limitations: its random local sampler yields loosely connected subgraphs that hinder message passing, and its global attention module relies on a single, seed-feature-based memory that ignores broader macro-level dynamics. To overcome these limitations, we introduce QUARTET, an expressive grap","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29809,"title":"COPE: Continual Personalization of LLMs under Sparse User Feedback via User Embeddings and Self-Evaluation","url":"https://arxiv.org/abs/2609.26853","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26853v1 Announce Type: new \nAbstract: While Large Language Models (LLMs) have achieved remarkable results across various benchmarks, their alignment with normative values often results in homogenized responses that fail to address diverse user preferences. Existing training-free methods often occupy valuable context windows through prompt engineering, while training-based methods typically remain static post-training, failing to support the continual optimization required in real-world settings. To address these challenges, we propose COPE (Continual Optimization with Personalized e","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29808,"title":"A Leakage-Aware Multimodal Evaluation Framework for Early Intraoperative Acute Kidney Injury Prediction","url":"https://arxiv.org/abs/2609.26848","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26848v1 Announce Type: new \nAbstract: Postoperative acute kidney injury (AKI) after major non-cardiac surgery carries substantial morbidity, yet early intraoperative risk stratification remains difficult. In this retrospective cohort study, we propose SynerT, a waveform-only hybrid temporal backbone that combines a causal dilated TCN with a hierarchy of dilated recurrent layers to encode early intraoperative physiologic trajectories for AKI risk prediction. Building on SynerT, we further design two model variants that extend the backbone with structured clinical context: SynerT-MM,","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"},{"id":29807,"title":"LWCal: Loss-Weighted Calibration for Tabular Classifiers with Noisy Calibration Labels","url":"https://arxiv.org/abs/2609.26839","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.26839v1 Announce Type: new \nAbstract: Post-hoc probability calibration is usually evaluated under an optimistic assumption: the held-out calibration labels are clean. In many AI deployment settings, however, labels come from weak annotators, historical decisions, heuristics, or distant supervision, so the same label noise that corrupts training also corrupts calibration. We study this overlooked failure mode for tabular classifiers and propose LWCal, a CPU-only post-hoc calibrator that down-weights calibration examples whose noisy labels are contradicted by the base model's held-out","tags":[],"cluster_size":1,"ts":"2026-09-24T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#2563eb","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":29945,"title":"密封关节设计，特斯拉App意外泄露第三代Optimus人形机器人 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOSXBXZ2x6Q1U4cTdmLXVLUWxkcjhqWVZuRTdOc0RTVHU1YVU4S3lEZHFaZGpKX18zRzFfZGo5cTlURHAyYTVDajRjaXlEZFBkcDFSZTJHRFFBeERIX1F1Y1o3V1htSFN0bUZPWTI2MG42akc4ODRldWdCWjlBeVJJMGZqU25jSkc1?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOSXBXZ2x6Q1U4cTdmLXVLUWxkcjhqWVZuRTdOc0RTVHU1YVU4S3lEZHFaZGpKX18zRzFfZGo5cTlURHAyYTVDa d fingers on a linear rail system. To control it, a virtual reality (VR) device interface maps the human ground operator's hand motions to th","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29540,"title":"CableVLA: Simulation-Privileged Global-Local Representation Learning for Cable Routing","url":"https://arxiv.org/abs/2609.25606","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25606v1 Announce Type: new \nAbstract: Cable routing requires coordinated control of global cable topology and changing local contacts. We present CableVLA, an end-to-end multimodal vision-language-action framework that converts simulation-privileged supervision into deployable cable-topology and tactile representations. TopoHead distills node-level physics and current and future cable-topology information into causal visual context for the action expert. TacSense uses complementary frame and taxel branches to learn contact dynamics from resistive arrays, with simulator-derived kinem","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29539,"title":"Recording Hand-Held Laparoscopic Instrument Motion in the Operating Room: Magnetometer-Free Fusion of Inertial, Range and Visual Sensing","url":"https://arxiv.org/abs/2609.25577","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25577v1 Announce Type: new \nAbstract: Most minimally invasive procedures are still performed with hand-held laparoscopic instruments, yet only the endoscopic video is retained; the instrument motion that expresses surgical skill, and that could support skill assessment and robot learning, is lost. Pose from video alone remains millimeters to centimeters off, and an instrument-mounted inertial measurement unit (IMU) cannot rely on its magnetometer, whose field changed with tool pose and between sessions in our measurements. We present a surgical instrument-state logger that clips ont","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29538,"title":"IndustrialVLA-Bench: A Traceable Multi-Axis Evaluation of Open Robot Policy Models","url":"https://arxiv.org/abs/2609.25562","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25562v1 Announce Type: new \nAbstract: Open robot policies increasingly follow two paradigms: vision-language-action models (VLAs) directly map observations and instructions to actions, whereas world-action models (WAMs) incorporate learned video or world dynamics into policy learning or action generation. Although both target the same manipulation tasks and represent alternative design choices, they are commonly reported under different evaluation protocols, leaving their capability, robustness, language sensitivity, and deployment-cost trade-offs unclear. We present IndustrialVLA-B","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29537,"title":"HABILIS Brain 0: Geometry-Change Supervision for Vision-Language-Action and Residual Flow Recovery","url":"https://arxiv.org/abs/2609.25558","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25558v1 Announce Type: new \nAbstract: Vision-language-action policies benefit from geometric supervision, but current-frame geometry alone does not explicitly describe the changes associated with manipulation. This design is motivated by the goal of learning an embodiment-agnostic visual interface that can be pretrained across robot and egocentric video before robot-specific action alignment. We introduce Geometry-Change VLA (GC-VLA), which learns to predict multiview future-current geometry-change tokens from current observations. Offline frame pairs define a nominal 0.5-second pre","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29536,"title":"Digital Twin-Driven VR Teleoperation with Multi-View Spatial Perception for Surgical Robots","url":"https://arxiv.org/abs/2609.25527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25527v1 Announce Type: new \nAbstract: Current robot-assisted minimally-invasive surgery (RMIS) platforms provide a fixed console for the surgeon to view stereo endoscopic images and teleoperate instruments inside the patient. Several researchers have proposed the use of a head-mounted display (HMD) as a portable console, with video pass-through rendering of the endoscope images which, like the fixed console, restricts the operator to a single endoscopic viewpoint and limits depth perception. We present a digital twin-driven virtual reality (VR) teleoperation platform, where the digi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29535,"title":"RoboMP-DINOv2: Prompts, Not Filters for Robust Robot Manipulation","url":"https://arxiv.org/abs/2609.25506","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25506v1 Announce Type: new \nAbstract: Robot manipulation policies must generalize across visual shifts while preserving scene context relevant to action. General-purpose vision encoders are not tailored to visuomotor control, while object-centric approaches often use segmentation masks as hard filters that discard potentially useful context. We propose RoboMP-DINOv2 (Robotics Mask-Prompted DINOv2), a full-scene vision encoder that treats masks as spatial prompts rather than visibility filters. It extracts dense DINOv2 features from the full observation, injects learned region-specif","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29534,"title":"Brace Yourself: Task-Conditioned Environmental Bracing for Forceful Humanoid Manipulation","url":"https://arxiv.org/abs/2609.25486","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25486v1 Announce Type: new \nAbstract: Forceful manipulation is challenging for humanoid robots because interaction forces can disturb whole-body balance. We introduce the Supporting Hand Strategy (SHS), which enables a humanoid to brace against the environment with one hand while performing forceful manipulation with the other. SHS optimises a task-conditioned support configuration that guides two synchronous reinforcement-learning policies, without human motion data or online whole-body trajectory planning. On a Unitree G1, SHS achieved usable contact forces up to 60 N, compared wi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29533,"title":"REDACT: Robust Perceptive Locomotion under Unseen Visual Corruption","url":"https://arxiv.org/abs/2609.25450","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25450v1 Announce Type: new \nAbstract: Depth-conditioned locomotion policies have demonstrated impressive agile maneuvers, but can be steered to unpredictable actions when observations are outside their training distribution. Occlusion, invalid returns, sensor noise, and visual distractors can shift deployment observations away from nominal simulated depth. While synthetic sensor augmentation targets specified degradations, it does not by itself define behavior under corruption families omitted from training. To address gaps in training-time coverage, we present REDACT (Retaining Evi","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29532,"title":"Norm2Tex: Augmenting Visuo-Tactile Simulations with Texture","url":"https://arxiv.org/abs/2609.25398","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25398v1 Announce Type: new \nAbstract: Large-scale datasets are essential for training generalist robot control policies. Collecting real-world tactile data is costly and time-consuming, motivating the use of tactile simulations. However, current tactile simulators capture only overall contact geometry and miss fine details like texture. This results in a significant domain shift between simulated and real tactile data. To address this gap, we introduce Norm2Tex, a plug-in method that augments simulations of vision-based tactile sensors with high-frequency surface details from normal","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29531,"title":"VLAQuantBench: Closed-Loop Evaluation of Post-Training Quantization for Vision-Language-Action Models","url":"https://arxiv.org/abs/2609.25376","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25376v1 Announce Type: new \nAbstract: Post-training quantization reduces the memory requirements of vision-language-action (VLA) models, but precision selection must account for the interaction between layer scope, numerical format, and calibration. We introduce \\textbf{VLAQuantBench}, a controlled evaluation with 409 runs and 94,574 simulation episodes: four models on LIBERO, with X-VLA additionally evaluated on three simulation benchmark families. Under uncalibrated W4A4 round-to-nearest quantization, expanding a $\\pi_{0.5}$ action-head subset from 126 to 167 layers raises success","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29530,"title":"Angular momentum analysis on Karate roundhouse kicks: a longitudinal case study","url":"https://arxiv.org/abs/2609.25374","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25374v1 Announce Type: new \nAbstract: Human gait in reality extends beyond straight-line walking, with some situations even requiring drastic back-and-forth rotations. A smooth and stable execution may seem intuitive, but the underlying mechanics remains unknown. The Karate roundhouse kick may be an extreme case of exhibiting dynamic back-and-forth rotations, but investigating the angular momentum (AM) management can potentially inform stability analysis in dynamic human motions and smoother gait in robots and exoskeletons. This paper introduces two new AM-based measures and analyze","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29529,"title":"Capability-Aware Arbitration for Semantic Intent-Based Shared Control","url":"https://arxiv.org/abs/2609.25369","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25369v1 Announce Type: new \nAbstract: Shared control often allocates robot authority based on confidence in inferred human intent, assuming reliable autonomous execution. When this assumption fails, high intent confidence can cause over-helping. We present a capability-aware shared-control framework in which a vision-language model (VLM) infers human intent and provides semantic-intent confidence, while a vision-language-action (VLA) policy generates autonomous actions. VLA capability confidence is estimated online from the dispersion and local instability of stochastic action traje","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29528,"title":"HOTICE: Whole-Body Humanoid Object Transportation in Cluttered Environments","url":"https://arxiv.org/abs/2609.25363","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25363v1 Announce Type: new \nAbstract: Object transportation is a fundamental capability for humanoid robots operating in real-world, human-centric environments, yet existing methods struggle when clutter constrains free space around both the robot and its carried payload. We present HOTICE, a whole-body humanoid learning framework for transporting objects through such cluttered environments. First, we introduce Humanoid-Object Decoupled Potential Fields, which jointly encode collision-avoidance guidance for the robot and the carried object, enabling coordinated, obstacle-aware motio","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29527,"title":"Learning from Humans for Proactive Assistance in Human-Robot Collaborative Transport","url":"https://arxiv.org/abs/2609.25351","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25351v1 Announce Type: new \nAbstract: We focus on human-robot collaborative transport, a challenging task of broad relevance spanning logistics, manufacturing, and the home, in which a user and a robot work together to relocate a large or heavy object. To act as an effective partner, the robot should reduce the user's effort by contributing to efficient relocation of the object while remaining physically responsive to them. Prior work often addresses these capabilities separately, producing robots that may move the object efficiently but resist user input, or accommodate the user bu","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29526,"title":"JAMB: Joint Action-Motion Diffusion for Bimanual Manipulation","url":"https://arxiv.org/abs/2609.25322","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25322v1 Announce Type: new \nAbstract: Coordinated bimanual manipulation is challenging because the motion of either arm can alter the shared 3D scene and thereby affect the other arm. Yet most diffusion policies generate actions without explicitly modeling these future geometric consequences, while predictive variants typically use future state only as auxiliary supervision or fixed conditioning. We address this limitation by proposing JAMB, a diffusion policy that jointly denoises bimanual actions and future 3D point tracks. By allowing action and track hypotheses to evolve togethe","tags":[],"cluster_size":1,"ts":"2026-09-23T04:00:00"},{"id":29525,"title":"Learning to Plan in Human-Robot Collaboration: Multimodal Reinforcement Learning for Adaptive Interaction","url":"https://arxiv.org/abs/2609.25274","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.25274v1 Announce Type: new \nAbstract: Robot assistants for older adults and people with disabilities need to perform collaborative tasks with users effectively. The core component of these systems is an interaction manager whose job is to observe and assess the task and infer the state of the human and their intent for the robot to choose the best course of action. Due to the sparseness of the data in this domain, the policy for such multimodal systems is often crafted by hand; as the complexity of interactions grows, // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
