026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eMoomoo\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-21T00:00:00"},{"id":35073,"title":"NextDC悉尼盘初跌44%，该公司此前因（澳大利亚墨尔本）数据中心电力（供应）推迟而下调业绩指引。","url":"https://wallstreetcn.com/livenews/3182194","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"NextDC悉尼盘初跌44%，该公司此前因（澳大利亚墨尔本）数据中心电力（供应）推迟而下调业绩指引。","tags":[],"cluster_size":1,"ts":"2026-10-20T23:01:16"},{"id":35074,"title":"中国移动三季度净利同比下降12%， 主营业务收入同比下滑5.1% - 新浪网","url":"https://news.google.com/rss/articles/CBMigwFBVV95cUxONjVCZjhTX00xSXFzdl91YjV3cDVqZHk4T3NDQjFUaG9rR2FLZWVMZ0otMVptNnZzaUd0MFcyX3dRTFlPZFJjYkJucGg2OHJOUnZXY3dneWR6VWNUdTk1b25FX1B2NGV1UjFNZVBUOFZKbTBReGpvLVFJV3NXM0xpd0hrNA?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMigwFBVV95cUxONjVCZjhTX00xSXFzdl91YjV3cDVqZHk4T3NDQjFUaG9rR2FLZWVMZ0otMVptNnZzaUd0MFcyX3dRTFlPZFJjYkJucGg2OHJOUnZXY3dneWR6VWNUdTk1b25FX1B2NGV1UjFNZVBUOFZKbTBReGpvLVFJV3NXM0xpd0hrNA?oc=5\" target=\"_blank\"\u003e中国移动三季度净利同比下降12%， 主营业务收入同比下滑5.1%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-20T22:45:00"},{"id":35075,"title":"“A+H”上市阵容持续扩大，多家公司筹划港股IPO","url":"https://wallstreetcn.com/livenews/3182190","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"“A+H”股上市阵容持续扩大。10月15日，传音控股正式登陆港交所，至此，“A+H”公司数量达到204家。此外，10月以来，包括联讯仪器、江丰电子在内的多家A股上市公司筹划递表港交所，东山精密再度递表后通过港交所上市聆讯。多位受访人士告诉记者，今年以来，香港市场迎来了内地硬科技公司以及“A+H”双重上市发行人的大规模流入，进一步优化了港股市场的结构。展望未来，随着境内外发行上市制度不断优化，从源头提升上市公司质量，港股市场新股发行有望保持活跃，以更多元、高效的方式服务创新企业。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:36:56"},{"id":35076,"title":"上市券商前三季度净利润有望继续增长，机构看好头部券商超额收益机会","url":"https://wallstreetcn.com/livenews/3182189","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"日前原东兴证券、原信达证券公布2026年第三季度报告，两家券商前三季度经营业绩表现有所分化。考虑第三季度A股交易量和市场整体表现较二季度有所走弱，业内人士认为，A股上市券商前三季度净利润有望在第三季度承压的情况下仍保持增长。\n\n就券商板块投资而言，业内人士表示，在估值及ROE（净资产收益率）错配情况下，券商板块的高性价比凸显，券商杠杆提升与分红机制完善也有望持续提升股东回报水平。在具体品种上，继续看好头部券商超额收益机会。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:32:02"},{"id":35077,"title":"千亿级红利陆续落袋，透视银行中期分红新局","url":"https://wallstreetcn.com/livenews/3182188","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"10月21日，工商银行与农业银行向A股股东派发2026年中期现金红利，合计约821亿元。Wind数据显示，截至目前已有21家A股上市银行披露2026年中期分红方案，拟派息总额超过2600亿元，其中国有大行与股份行构成绝对主力，城商行、农商行亦在加速跟进。从方案披露到实际派发，上市银行中期分红正从少数银行的“试水”动作，演变为常态化选择。这一变化背后，既有行业基本面企稳的支撑，也折射出低利率环境下，银行板块正在重塑股东回报体系。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:30:57"},{"id":35078,"title":"知名基金经理频频调仓，挖掘顺周期投资机遇","url":"https://wallstreetcn.com/livenews/3182186","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期发布的A股上市公司以及基金三季报，披露了多位知名基金经理的最新调仓动向。三季度，基金经理张明昕管理的华商均衡成长减持光华科技，陈文凯管理的华泰柏瑞质量成长减持中国巨石，冯柳执掌的高毅邻山1号远望基金减持海康威视。同时，基金经理们也在挖掘新的投资机会，例如张坤管理的易方达蓝筹精选增持川投能源，杜猛管理的摩根新兴动力新买入金田股份。\n\n在部分基金经理看来，A股AI相关板块的估值已较充分地反映了全球流动性和风险偏好的压制，与海外同类资产相比，性价比正在提升，但海外高估值科技资产的回调风险、全球流动性变化、地缘因素仍需密切跟踪。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:29:17"},{"id":35079,"title":"复盘三季度波动行情，基金重提再平衡","url":"https://wallstreetcn.com/livenews/3182184","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"历经三季度以来的市场波动之后，在最新披露的基金2026年三季报中，多位基金经理复盘三季度操作，重点反思持仓集中度与风险控制，从最新投资策略看，均衡持仓成为多数基金经理的策略选择。在基金经理们看来，市场风格有望再平衡，投资组合在进攻之余，需要寻求收益风险比更优的平衡。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:18:55"},{"id":35080,"title":"公开市场隔夜回购利率将成主要政策利率，专家：此举更适合传递货币政策立场，不宜炒作成降息","url":"https://wallstreetcn.com/livenews/3182183","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"10月19日，中国人民银行行长潘功胜在2026金融街论坛年会上表示，将研究择机把央行公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将相应成为主要政策利率。受访业内专家表示，随着隔夜逆回购利率的政策利率地位确立，政策利率“换锚”水到渠成。调整后，能够更清晰地传递货币政策立场，化解政策利率与调控目标利率之间的期限错配问题。专家还提示，此次为利率调控机制改革，不等于降息，市场不宜过度解读。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:16:43"},{"id":35081,"title":"主动ETF发行火速定档，场内投资生态迎来革新","url":"https://wallstreetcn.com/livenews/3182182","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"首批主动ETF发行进入倒计时。10月20日，易方达、华夏、汇添富、南方、富国、鹏华等18家公募同步披露发售安排，旗下主动ETF定于10月23日集中发行。按20亿元募集上限估算，18只产品合计有望引流360亿元。业内人士认为，不同于过往指数ETF、场外主动权益基金，本次落地的主动ETF将主动投研能力嵌入ETF标准化场内载体，在投资自由度、信息透明度、交易机制上重构产品逻辑，标志着公募行业被动与主动协同的新生态加速成形。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-20T22:15:28"},{"id":35082,"title":"SpaceX分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3182181","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、财务与整体业绩表现。\n\n1、营收与净利大幅增长：2026年第三季度实现营收146亿美元，同比增长161%；净利润达44亿美元（较去年同期的11亿美元净亏损实现显著改善）；调整后EBITDA为88亿美元，同比增长306%。\n\n2、资本开支与业务展望：第三季度总资本支出为19.6亿美元（主要用于超级智能（SI）算力建设、星舰基础设施和卫星生产）。预计第四季度资本开支将升至35亿-40亿美元。同时，预计2027年第一季度公司总营收将在33亿-37亿美元 之间。","tags":[],"cluster_size":1,"ts":"2026-10-20T22:04:34"},{"id":35083,"title":"纳指期货涨1%，SpaceX盘后涨6.8%，CoreWeave、英特尔至少涨4%","url":"https://wallstreetcn.com/livenews/3182180","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"周三亚太盘初，纳斯达克100股指期货涨1%。科技股中，英特尔目前（美股盘后）涨4%，CoreWeave涨4.8%，SpaceX涨6.8%，美光科技、AMD、英伟达至少涨2.2%，台积电、甲骨文、特斯拉至少涨1.5%，苹果跌0.3%，Pinterest跌1.9%，奈飞跌5.6%。","tags":[],"cluster_size":1,"ts":"2026-10-20T22:03:48"},{"id":35084,"title":"纳斯达克生物科技指数收涨3.23%，成分股Larimar Therapeutics Inc.涨15.09%领跑，Black Diamond、Contineum","url":"https://wallstreetcn.com/livenews/3182175","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克生物科技指数收涨3.23%，成分股Larimar Therapeutics Inc.涨15.09%领跑，Black Diamond、Contineum Therapeutics、First Tracks Biotherapeutics、Gossamer Bio、Caribou Biosciences、Bioage Labs、Lyell Immunopharma涨14.36%-10.45%紧随其后，天境生物ADR涨9.62%表现靠前。\n\nAbcellera Biologics则收跌1.84%，LENZ Therapeutics、Jyong Biotech至多跌3.63%，Annexon跌4.49%，Codexis跌6.82%，EyePoint Pharmaceuticals跌7.25%，AnaptysBio Inc.（ANAB）跌7.74%表现最差。","tags":[],"cluster_size":1,"ts":"2026-10-20T21:36:37"},{"id":35085,"title":"马斯克：阿斯麦等正为Terafab加速交付芯片制造设备","url":"https://wallstreetcn.com/livenews/3182169","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"埃隆·马斯克表示，荷兰阿斯麦（ASML）及其他关键芯片制造设备供应商已加快向特斯拉和SpaceX的Terafab项目供货。马斯克在SpaceX第三季度财报电话会议上表示：“这些时间表非常激进，我们非常感谢阿斯 "https://news.google.com/rss/articles/CBMiZkFVX3lxTE9XSE9OcnlTTGtwQ3dTZnhZLUhqS2wtYURBRlpEQ0pKTG83QW40d3JQV24wVzJKczlkTzl2QjNRMHVJanNhbGhoN3dvYXdBaEtibjZmSFJTcjFpUm1VckZfUzRwdzRiZw?oc=5\" target=\"_blank\"\u003e特斯拉Optimus量产提速，丰立智能人形机器人业务加速商业化\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e东方财富\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-20T07:01:03"},{"id":35049,"title":"Rollbot 2: Agile Locomotion by a Single-Actuator Spherical Robot","url":"https://arxiv.org/abs/2610.24129","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.24129v1 Announce Type: new \nAbstract: Reducing actuator count simplifies robot hardware but also removes independent inputs for maneuvering. The original Rollbot steered by modulating a quasi-stable helical orbit, but moved slowly and relied on external motion capture. Rollbot 2 preserves the single-actuator design while its redesigned mass distribution enables near-straight rolling and more direct travel toward commanded paths and beacon targets. Onboard inertial and ultra-wideband sensing support learned steering, beacon seeking, and waypoint following through one motor-velocity c","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35048,"title":"CLARO: Clutter Aware Robot Orchestrator for Open-Vocabulary Grasping using VLM Agents","url":"https://arxiv.org/abs/2610.24016","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.24016v1 Announce Type: new \nAbstract: Robots that follow natural-language instructions unlock a wide range of autonomous applications in households, warehouses, and labs. Real-world environments are diverse and often heavily cluttered, requiring robots to plan over multiple steps, act, and replan as they work toward a goal. We present CLARO (CLutter-Aware Robot Orchestrator), a VLM agent that orchestrates a set of perception and manipulation skills: open-vocabulary object detection, segmentation, 6-DoF grasping, and non-prehensile pushing to locate and retrieve a language-specified","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35047,"title":"Weakly Supervised Discovery of Motion Styles for Compositional Robot Control","url":"https://arxiv.org/abs/2610.24008","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.24008v1 Announce Type: new \nAbstract: When a robot possesses more degrees of freedom than a task requires, multiple trajectories can achieve the same objective using distinct motion styles. Compositional robot control aims to preserve a selected style while simultaneously executing an independent task command, effectively balancing these potentially competing objectives. In this paper, we present CODES, a framework for compositional robot control that discovers a coherent style repertoire from diverse recordings and composes it with independent commands. First, motion retargeting ma","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35046,"title":"REAP: Learning General Rearrangement Heuristics from Motion-Planner Feedback","url":"https://arxiv.org/abs/2610.23973","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23973v1 Announce Type: new \nAbstract: Robotic rearrangement tasks require planning sequences of actions that fulfill high-level specifications while also being geometrically feasible. Symbolic abstractions make the combinatorial structure of rearrangement tasks tractable, but they usually do not fully capture the geometric constraints that determine which actions a robot can actually realize. These constraints are hard to express in the symbolic model. We propose REAP (Rearrangement with Elicited Action Preconditions), a framework in which a relational graph neural network heuristic","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35045,"title":"ESCAPE: Egocentric Sensing for Collision Avoidance and Policy Execution","url":"https://arxiv.org/abs/2610.23943","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23943v1 Announce Type: new \nAbstract: Motion planning in unstructured environments is a bottleneck for robot deployment. Current visuomotor policies predominantly rely on external cameras, introducing perceptual blind spots and fragility due to occlusions, clutter, and calibration constraints. To overcome these limitations, we propose ESCAPE, an online egocentric sensing framework for collision-free trajectory generation. ESCAPE aggregates sparse measurements from distributed depth sensors, converting them into a structured, obstacle-aware point cloud representation. Our policy leve","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35044,"title":"UMI-WM: Interactive World Modeling for Bimanual Manipulation from Wrist Cameras","url":"https://arxiv.org/abs/2610.23913","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23913v1 Announce Type: new \nAbstract: Universal Manipulation Interface (UMI) pairs wrist-camera videos with camera trajectories and gripper openings, providing scalable, robot-free data for learning how bimanual actions change a shared scene. Existing interactive world models, however, typically rely on text or single-camera control and struggle to follow each arm's actions while maintaining consistency between the two wrist views. We introduce UMI-WM, an action-conditioned bimanual world model that jointly generates both wrist views from observation history, per-arm relative camera","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35043,"title":"Language-Forcing: Advancing Humanoid Loco-Manipulation via Semantic Alignment of Whole-Body World Action Models","url":"https://arxiv.org/abs/2610.23894","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23894v1 Announce Type: new \nAbstract: World Action Models (WAMs) jointly predict robot actions and future observations. However, their visual prediction objectives do not explicitly distinguish task-relevant transitions from incidental scene changes. For whole-body policies, this distinction matters because task progress depends on coordinated changes in body pose, contact, and object state. We introduce LANGUAGE-FORCING, a training strategy that uses language to emphasize task-relevant changes in the future visual representations of a whole-body WAM. Given paired current and ground","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35042,"title":"When to Make a Decision: Task-Sufficient Active Perception for Mobile Manipulator Robots","url":"https://arxiv.org/abs/2610.23891","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23891v1 Announce Type: new \nAbstract: A robotic agent operating in an unknown environment must gather sufficient task-relevant information before acting. However, determining when the available information is sufficient remains a challenge. We propose a conceptual hybrid neuro-symbolic framework for task-sufficient active perception in unknown environments. After interpreting a requested task, the agent generates an initial plan and iteratively reevaluates it as new information becomes available. At each iteration, it can acquire a more informative viewpoint, inspect or manipulate c","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35041,"title":"MoDex: Towards Universal Multi-Object Dexterous Grasping","url":"https://arxiv.org/abs/2610.23888","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23888v1 Announce Type: new \nAbstract: Multi-object grasping is a fundamental yet challenging problem, constrained by data collection costs, varying spatial layouts, and the need for broad generalization. To address these challenges, we propose MoDex, a data-efficient framework that provides the first unified solution for universal multi-object dexterous grasping across diverse spatial layouts. MoDex accomplishes this by formulating the task as a single-step decision problem of learning residual corrections to a reference trajectory, and introducing a spatially adaptive dual-strategy","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35040,"title":"ContactKernels: Adaptive Proposals using Geometry-COnditioned Wrenches for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2610.23887","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23887v1 Announce Type: new \nAbstract: Contact-rich insertion requires precise geometric alignment despite uncertainty in perception, geometry, and con- trol. When this uncertainty causes unintended contact, the re- sulting contact provides local information that can guide correc- tive motion. Sampling-based Model Predictive Control (SMPC) is well suited to this setting because it optimizes through forward simulation without requiring gradients through contact dynamics. However, standard SMPC methods typically use generic proposal distributions that do not exploit observed contact to","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35039,"title":"Learning Whole-Body Kinetic Coordination for Wheeled-Quadruped Long-Range Throwing","url":"https://arxiv.org/abs/2610.23883","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23883v1 Announce Type: new \nAbstract: Long-range throwing on unstructured terrain is a key capability for mobile robots in delivery and retrieval tasks, but it requires high release velocity, coordinated whole-body motion, and robustness to terrain-induced disturbances. We present a whole-body kinetic-coordination framework for a wheeled-quadruped manipulator that combines kinetic-chain arm modeling with SQP-based trajectory optimization and a reference-guided reinforcement learning policy for coordinated base motion. The manipulator is first reduced to a kinetic-chain model and opt","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35038,"title":"AutoPruner: Agentic Depth Pruning for Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.23880","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23880v1 Announce Type: new \nAbstract: Layer pruning reduces the size and inference cost of vision-language-action (VLA) models, but selecting a deployable configuration requires deciding both which layers to remove and how to recover task performance. These decisions depend on the model and task, and a failed trial can reflect either the deletion set or insufficient recovery. We present AutoPruner, an agent-driven framework that jointly searches pruning structures and recovery recipes through closed-loop experimentation. Offline layer interventions measure changes in action output t","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35037,"title":"Adaptive Rejection of Unknown Hybrid Sinusoidal Disturbances with Application to Humanoid Walking under Unknown Ground Motion","url":"https://arxiv.org/abs/2610.23879","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23879v1 Announce Type: new \nAbstract: Legged robot control is not yet practical in non-inertial environments, where the ground and surroundings accelerate in the inertial Earth frame, mainly because of the unknown, time-varying, persistent perturbations caused by environmental motion, compounded by the associated hybrid robotic dynamics. We formulate the problem of robot walking control as unknown-disturbance rejection for hybrid linear systems subject to hybrid sinusoidal disturbances (i.e., a linear combination of sinusoidal components with instantaneous phase jumps at discrete ev","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35036,"title":"Adaptive Question Generation for Ambiguous Robot Instructions Based on Information Gain and Human Cognitive Characteristics","url":"https://arxiv.org/abs/2610.23874","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23874v1 Announce Type: new \nAbstract: In this study, we propose an adaptive question generation mechanism that addresses uncertainty arising from ambiguous instructions. Natural-language instructions for service robots often contain ambiguities. In scenes with multiple similar objects, the robot must identify the target object by asking questions. However, existing question generation methods focus on probabilistic discrimination efficiency and do not sufficiently account for user ease of response. Asking questions without considering the user's ease of response may cause incorrect","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35035,"title":"DUET: Decoupled Upper- and Lower-Body Execution for Task-Agnostic Humanoid Loco-Manipulation","url":"https://arxiv.org/abs/2610.23872","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.23872v1 Announce Type: new \nAbstract: Changing a humanoid robot's manipulation policy should not require retraining the controller that maintains the robot's balance. This study introduces DUET, a decoupled execution framework that enables locomotion and manipulation controllers to operate simultaneously by combining their commands only at the robot interface. A reinforcement-learning locomotion policy controls the 12 leg joints and a waist yaw joint, tracking planar velocity, turning rate, and pelvis height from deep crouching to upright standing on a 23-degree-of-freedom Unitree G","tags":[],"cluster_size":1,"ts":"2026-10-20T04:00:00"},{"id":35050,"title":"特斯拉Optimus量产传来新消息，A股机器人概念股走强，多家企业回应 - 东方财富","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE5kUXVIb2JDalVOVzFScGc4ZklNeklHYU1qdE9nQVR6eVVhNmc4eEhJazN0eEJCcmtCc0NubzlkV3d3b0ZCeWVyWDJEcU1pZlg5dG9vdndPcVFkNm1wZFZCekRuTEw4dw?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE5kUXVIb2JDalVOVzFScGc4ZklNeklHYU1qdE9nQVR6eVVhNmc4eEhJazN0eEJCcmtCc0NubzlkV3d3b0ZCeWVyWDJEcU1pZlg5dG9vdndPcVFkNm1wZFZCekRuTEw4dw?oc=5\" tar // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
