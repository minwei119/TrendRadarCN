卖出4278.66万元_主力研究\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T00:18:34"},{"id":13919,"title":"礼来支持的Scribe Therapeutics美国IPO，首日飙升超44%","url":"https://wallstreetcn.com/livenews/3139684","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"专注于心脏病基因疗法的临床阶段开发商Scribe Therapeutics Inc.，通过扩大规模的IPO筹集1.287亿美元后，周五股价收盘飙升44.33%。\n\n文件显示，赛诺菲（Sanofi SA）的关联公司已同意以IPO价格购买约750万美元的股份，作为同步私募配售的一部分。Scribe的现有支持者之一礼来公司表示有兴趣在IPO中购买更多股份，以便在发行和配售后持有Scribe高达11%的股份。","tags":[],"cluster_size":1,"ts":"2026-07-24T23:39:38"},{"id":13920,"title":"斯伦贝谢分析师电话会要点总结","url":"https://wallstreetcn.com/livenews/3139691","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、 第二季度财务与业务表现。\n\n整体业绩：斯伦贝谢（SLB）二季度实现了稳健的财务表现，营收达90亿美元（环比增长3%），扣除非经常性损益后每股收益（EPS）为0.55美元。尽管中东业务受到严重地缘政治和安全冲突干扰（收入环比下降13%至16.6 亿美元），但国际深水业务（拉美、欧洲/非洲、亚洲）的全面增长和北美陆上业务的反弹成功抵消了这一不利影响。事业部亮点：\n\n生产系统：营收环比增长7%至38亿美元，调整后EBITDA利润率重回20%以上，主要得益于深水活动及生产采收设备/化学品强劲需求的推动。\n\n数字业务：营收环比增长9%至6.97亿美元，调整后EBITDA利润率达约35%，年度经常性收入（ARR）同比增长15%。\n\n数据中心解决方案（Data Center Solutions）：增长迅猛，营收环比增33%、同比增80%，与Meta等客户达成深层次设计集成合作，并宣布新增超大规模客户。\n\n现金流与股东回报：二季度产生自由现金流（FCF）为7.16 亿美元，股票回购6.48亿美元。全年资本投资计划维持在25亿美元左右，全年预计通过股息和回购向股东回报超40亿美元。","tags":[],"cluster_size":1,"ts":"2026-07-24T23:08:03"},{"id":13921,"title":"美股大类资产类ETF涨跌各异，新兴市场ETF收跌将近2%","url":"https://wallstreetcn.com/livenews/3139670","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周五（7月24日），新兴市场ETF收跌1.97%，巴克莱美国可转债ETF跌1.64%，美国布伦特油价基金跌1.63%，纳指100 ETF跌1.12%，罗素2000指数ETF、欧元做多至多跌0.32%。\n\n农产品基金收平，日元做多、做多美元指数、黄金ETF、美国国债20+年ETF至多涨0.10%，道指ETF涨0.48%，大豆基金涨0.73%，美国房地产ETF涨2.15%。","tags":[],"cluster_size":1,"ts":"2026-07-24T22:17:58"},{"id":13922,"title":"周五（7月24日）纽约尾盘，标普500股指期货最终涨0.02%，道指期货涨0.38%，纳斯达克100股指期货跌1.08%。\n\n罗素2000股指期货跌0.17%。","url":"https://wallstreetcn.com/livenews/3139657","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周五（7月24日）纽约尾盘，标普500股指期货最终涨0.02%，道指期货涨0.38%，纳斯达克100股指期货跌1.08%。\n\n罗素20 u003e乔纳斯表示，许多投资者预计首批股份将于下月结束禁售，部分内部人士届时可以出售持股，SpaceX 股价\u003cstrong\u003e可能因此继续跌至每股 100 美元（现汇率约合 678.2 元人民币）\u003c/strong\u003e。按照乔纳斯的判断，每股 100 美元意味着市场对 SpaceX AI 业务的\u003cstrong\u003e估值已经降至零\u003c","tags":[],"cluster_size":1,"ts":"2026-07-25T04:29:04"},{"id":14043,"title":"韩国总统李在明访美促成五年 9500 亿美元半导体合作：三星与博通签署 2000 亿美元内存协议，SK 集团与英伟达等企业达成 7500 亿美元巨单","url":"https://www.ithome.com/0/981/472.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3de3\"\u003eIT之家 7 月 25 日消息，当地时间 7 月 24 日，韩国总统李在明从美国开启了他为期 11 天的访问，首站旧金山共两天，后续还将到访巴西、智利、阿根廷、德国。\u003c/p\u003e\u003cp data-vmark=\"1572\"\u003e在旧金山，李在明先后与英伟达 CEO 黄仁勋、OpenAI CEO 奥尔特曼、Anthropic CEO 阿莫代伊、博通 CEO 陈福阳等全球 AI 行业领袖会面，还将出席旧金山 AI 峰会。\u003c/p\u003e\u003cp data-vmark=\"803d\"\u003e韩国总统府表示，以韩国总统李在明出席“旧金山 AI 峰会”为契机，韩国企业与全球科技企业公布的半导体领域合作规模累计已达到 9500 亿美元（现汇率约合 6.44 万亿元人民币）。\u003c/p\u003e\u003cp data-vmark=\"3f37\"\u003e首先，在半导体领域，三星电子与博通签署了业务合作谅解备忘录（MOU），双方将在未来 5 年围绕 2000 亿美元（现汇率约合 1.36 万亿元人民币）规模的先进存储半导体供应以及 AI 芯片生产开展晶圆代工合作。\u003c/p\u003e\u003cp data-vmark=\"7616\"\u003e其次，SK 集团将与英伟达等全球大型科技企业推进为期 5 年的先进存储半导体长期供应合作，规模达到 7500 亿美元（IT之家注：现汇率约合 5.09 万亿元人民币）。\u003c/p\u003e\u003cp data-vmark=\"e","tags":[],"cluster_size":1,"ts":"2026-07-25T04:17:10"},{"id":14044,"title":"Opus 5 反超 Fable 5，Anthropic 的定价牌局被打乱了？ - Sohu","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPU0tYdnVvLU0yQUY0ZjVlSkk0cFJleFpQSUNGaGk1eS0xNkVLZXljbENxa3VtazRHYzFhYXBLMHpZWUpFUzQwWlRmbFdyZTBPQVdoOFo4NGZ0eUk5VzhMdVpIUU9QOXlVRUdIMUVvM2hFbGxXX2tsZlVIM3pCeE01N21ydWtmTGhO?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPU0tYdnVvLU0yQUY0ZjVlSkk0cFJleFpQSUNGaGk1eS0xNkVLZXljbENxa3VtazRHYzFhYXBLMHpZWUpFUzQwWlRmbFdyZTBPQVdoOFo4NGZ0eUk5VzhMdVpIUU9QOXlVRUdIMUVvM2hFbGxXX2tsZlVIM3pCeE01N21ydWtmTGhO?oc=5\" target=\"_blank\"\u003eOpus 5 反超 Fable 5，Anthropic 的定价牌局被打乱了？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eSohu\u003c/font\u003e","tags":[],"c 将利用已预先布设但尚未启用的“暗光纤”资源为谷歌提供数据中心连接服务\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"6324\"\u003eDan Schulman 表示，\u003cstrong\u003e全球范围内的人工智能基础设施建设是他这一代人见证的最大规模资本周期之一\u003c/strong\u003e。而 Verizon 凭借其拥有的北美最广泛长途和城域光纤网络之一在周期中占据有利位置。\u003c/p\u003e\u003cp data-vmark=\"c424\"\u003eVerizon 计划在今年内再公布多项与此类似的 AI 基础设施交易。\u003cstrong\u003e这\u003c/strong\u003e\u003cstrong\u003e类合同预计将在未来几年内为企业带来合计数十亿美元的收入\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"19f0\"\u003e与此同时，\u003cstrong\u003eVerizon 还在将其中央机房改造为 AI 边缘推理计算","tags":[],"cluster_size":1,"ts":"2026-07-25T03:08:21"},{"id":14057,"title":"再添荣誉！齐鲁文化大模型入选山东首批重点推广垂直领域大模型 - 齐鲁晚报","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE1nUDJIYnBPNlgzYlduQ0FyX01TT2ZTSDRMWGVncC11blNJVExkeElMRk5ZanR4SHBRVF9wQkVyeDV4UDFFYTQzYlk3TGF4aTljaWdsMGtqQQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiV0FVX3lxTE1nUDJIYnBPNlgzYlduQ0FyX01TT2ZTSDRMWGVncC11blNJVExkeElMRk5ZanR4SHBRVF9wQkVyeDV4UDFFYTQzYlk3TGF4aTljaWdsMGtqQQ?oc=5\" target=\"_blank\"\u003e再添荣誉！齐鲁文化大模型入选山东首批重点推广垂直领域大模型\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e齐鲁晚报\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T03:05:57"},{"id":14058,"title":"2025 年我国数字产业收入 39.6 万亿元，同比增长 8.8%","url":"https://www.ithome.com/0/981/458.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"958f\"\u003eIT之家 7 月 25 日消息，国家互联网信息办公室 24 日最新发布的《国家信息化发展报告》显示，2025 年，我国数字经济核心产业增加值占 GDP 的比重超过 10.5%，\u003cstrong\u003e数字产业收入 39.6 万亿元，同比增长 8.8%\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"c206\"\u003e我国居民数字消费规模达 25.3 万亿元，同比增长 8.7%。同时，我国网络基础设施提质升级。IT之家从数据中获悉，截至 2025 年底，我国 5G 基站总数达 483.8 万个，\u003cstrong\u003e三分之二地级市达到千兆城市标准\u003c/strong\u003e。IPv6 活跃用户数达 8.69 亿。\u003c/p\u003e\u003cp data-vmark=\"da2a\"\u003e2025 年，软件业运行态势良好，业务收入达 15.48 万亿元，同比增长 13.2%。电子信息制造相关行业生产快速增长，规模以上计算机、通信和其他电子设备制造业增加值同比增长 10.6%；新兴产业蓬勃发展，AI 手机、AI 电脑、AI 眼镜等人工智能终端产品加快推广应用，服务机器人产量达 1858.1 万套，同比增长 16.1%。\u003c/p\u003e\u003cp data-vmark=\"8ed2\"\u003e\u003cspan class=\"referenceTitle \"\u003e参考\u003c/span\u003e\u003c/p\u003e\u003cul class=\"custom_ref","tags":[],"cluster_size":1,"ts":"2026-07-25T03:05:45"},{"id":14059,"title":"OpenAI透露可穿戴设备与语音助手新规划 - DoNews","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE40Zmoxem10SU1McDlmSmZWVU9tRU1penkzTmJkRjZYY0F5S2xoT3ZTQmR0SUtPZm9YVDhTaWNqTENTVFVuS0RKcVAwTnYybWdCNkFXNHNBNHZTeXRrd2c?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE40Zmoxem10SU1McDlmSmZWVU9tRU1penkzTmJkRjZYY0F5S2xoT3ZTQmR0SUtPZm9YVDhTaWNqTENTVFVuS0RKcVAwTnYybWdCNkFXNHNBNHZTeXRrd2c?oc=5\" target=\"_blank\"\u003eOpenAI透露可穿戴设备与语音助手新规划\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eDoNews\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T02:25:03"},{"id":14060,"title":"OpenAI 将打造“贾维斯”式语音助手，未来有望登陆第三方智能眼镜","url":"https://www.ithome.com/0/981/445.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4777\"\u003eIT之家 7 月 25 日消息，据外媒 CNET 报道，当地时间周四（23 日），OpenAI 总裁格雷格 · 布罗克曼介绍了公司最新的 AI 规划和近期动向，同时透露了 OpenAI 对\u003cstrong\u003e可穿戴设备及硬件产品\u003c/strong\u003e的部分构想。未来硬件可能与 ChatGPT 近期升级的语音功能深度结合，而且\u003cstrong\u003e不会局限于 OpenAI 自有设备\u003c/strong\u003e，第三方智能眼镜和可穿戴产品最终也有望获得支持。\u003c/p\u003e\u003cp data-vmark=\"0b8a\"\u003e现场演示了近期升级的语音界面 ChatGPT Live。据IT之家了解，ChatGPT Live \u003cstrong\u003e能够更自然地同时完成说话、聆听和响应用户插话\u003c/strong\u003e。同时，OpenAI 引出了一个更远大的目标：打造类似《钢铁侠》中贾维斯的语音助手。\u003c/p\u003e\u003cp data-vmark=\"4e3c\"\u003e布罗克曼表示，OpenAI 正准备朝上述方向发展，Codex 已经能够让智能体操作整台电脑。“ChatGPT Live 目前与 Codex 应用绑定，但实际上没有必要绑定，继续如此也不太合理。Codex 应用本身已经可以完整操作电脑，而且它的能力还会变得非常非常强大。”\u003c/p\u003e\u003cp data-vmark=\"7c07\"\u003e人类长期依靠点击、键盘输入完成的大量操作，未","tags":[],"cluster_size":1,"ts":"2026-07-25T02:10:26"},{"id":14061,"title":"AI 探索破解水的百年谜团：为何水结冰会膨胀？","url":"https://www.ithome.com/0/981/443.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4673\"\u003eIT之家 7 月 25 日消息，日本大阪大学于 7 月 6 日发布博文，\u003cstrong\u003e其团队利用 AI 模型探索水的百年谜团，找到了观察水分子的最佳“透视镜”。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"6b85\"\u003e该研究系统性评估了 16 种不同的分子结构描述方法，\u003cstrong\u003e成功找出了最能精准捕捉水分子在不同温度、压力下微观变化的“透视镜”，为理解水结冰膨胀及过冷水异常行为提供了统一的科学框架。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"44e4\"\u003e博文指出水是地球表面最丰富的液体，但不同于其它液体，水在结冰时会膨胀。现有理论认为水的这些异常现象关联其微观结构，\u003cstrong\u003e会随着温度和压力发生变化，但此前缺少系统表征方案。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"76c2\"\u003e大阪大学副教授金康（Kang Kim）团队借助 AI 模型，严格对 16 种分子结构描述方法开展性能对比评估，成功破解了描述水分子局部次序的评估难题，理清了水中竞争液态状态的演变脉络。\u003c/p\u003e\u003cp data-vmark=\"7758\"\u003e论文报告指出为了让水结冰，分子需要有序地排列成像冰这样的结构晶格。分子需要附着在一个称为成核位（nucleation site）的基底上，才能演变成固态。水中杂质或容器内部的划痕都可以作为","tags":[],"cluster_size":1,"ts":"2026-07-25T02:08:15"},{"id":14062,"title":"Anthropic发布Opus 5，性能直逼Fable 5，价格却只有一半？ - 凤凰网科技","url":"https://news.google.com/rss/articles/CBMiTEFVX3lxTE5KU2xXNFR5UjRnRHBvbDdia0hkUjJiWHdJQkdYOGlPTnY2N0tERHRyb0pQaE45Y0tzNmNFekpQR002WDUxVHYzTlB0NVo?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTEFVX3lxTE5KU2xXNFR5UjRnRHBvbDdia0hkUjJiWHdJQkdYOGlPTnY2N0tERHRyb0pQaE45Y0tzNmNFekpQR002WDUxVHYzTlB0NVo?oc=5\" target=\"_blank\"\u003eAnthropic发布Opus 5，性能直逼Fable 5，价格却只有一半？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e凤凰网科技\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T02:06:58"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#db2777","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":13787,"title":"Open-Source AI Just Became a Boardroom Issue - Times Square Chronicles","url":"https://news.google.com/rss/articles/CBMidkFVX3lxTE5ZbmxwNWJXdVJQSG5ibkcyOF9UMDQtV0tTQXhhTXJJM1Jjem1RTmhjNjU0d2Z3SXFXNF9KeVJPX3BSQ0VEaTQtVjFiUjVzOGJzNmJVNGZwRTg2T1N3Y0ZDUU5maGZ3Wkhka3ZZdU00eGlnUk5OT2c?oc=5","source":"GNews · AI Research","sources":["GNews · AI Research"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMidkFVX3lxTE5ZbmxwNWJXdVJQSG5ibkcyOF9UMDQtV0tTQXhhTXJJM1Jjem1RTmhjNjU0d2Z3SXFXNF9KeVJPX3BSQ0VEaTQtVjFiUjVzOGJzNmJVNGZwRTg2T1N3Y0ZDUU5maGZ3Wkhka3ZZdU00eGlnUk5OT2c?oc=5\" target=\"_blank\"\u003eOpen-Source AI Just Became a Boardroom Issue\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTimes Square Chronicles\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:37"},{"id":13811,"title":"The Storyteller in the Model: Narrative Pattern Inheritance, Escalation Dynamics, and Alignment Governance in LLMs","url":"https://arxiv.org/abs/2607.20449","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20449v1 Announce Type: new \nAbstract: LLMs are trained predominantly on human-authored text, yet the structural and narrative conventions embedded in that text are rarely examined as a source of systematic behavioral influence, or as a governance risk in deployed systems. This paper considers whether the storytelling patterns inherent in published human writing, including archetypal roles such as protagonist, antagonist, and underdog, as well as tension-and-resolution narrative arcs, are absorbed during training and subsequently surface in LLM outputs, causing responses to drift tow","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13810,"title":"Domyn-Small: A European 10B Reasoning Language Model","url":"https://arxiv.org/abs/2607.20448","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20448v1 Announce Type: new \nAbstract: We introduce Domyn-Small, a 10-billion-parameter open-weight reasoning language model released under the MIT license. Domyn-Small is the product of an initial pre-training phase on 9 trillion tokens multilingual data, followed by a post-training pipeline for reasoning, instruction following, and context extension. For the latter, we performed a Continued Pre-Training (CPT) phase that doubles the native context window to 32K tokens, followed by SFT with a math-focused annealing run. Finally, the RL phase includes GRPO with verifiable rewards, DPO","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13809,"title":"thaulab@EEUCA 2026: Who Said What to Whom? A Targeting-Aware Neural-Symbolic Pipeline for Gaming Toxicity Detection","url":"https://arxiv.org/abs/2607.20447","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20447v1 Announce Type: new \nAbstract: This paper describes our system for the EEUCA 2026 Shared Task on toxicity classification in gaming chat. We implement a three-stage pipeline combining an ensemble of two compact transformers (DeBERTa-v3-base, 184M; XLM-RoBERTa-base, 278M) with a Linguistically-Informed Mediator (LIM) that resolves inter-model disagreements through corpus-backed lexical normalization, class-conditional unigram scoring, multilingual profanity detection, and agentive targeting analysis grounded in speech act theory. The LIM specifically targets the minority classe","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13808,"title":"Distinguishing Artificial from Authentic: Evaluating LLMs for Detecting LLM-Generated Content","url":"https://arxiv.org/abs/2607.20446","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20446v1 Announce Type: new \nAbstract: As large language models (LLMs) are increasingly used by students to generate natural language responses and program code, there is growing interest in whether LLMs themselves can be used to distinguish AI-generated work from human-authored submissions. In this paper, we investigate the extent to which LLMs can detect their own generated content across multiple educational task types, including programming exercises, reflective writing, and short-answer questions. Using authentic student responses and multiple variants of LLM-generated answers,","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13807,"title":"Confidently Deceptive: How Confidence Amplifies the Risk of LLM Deception","url":"https://arxiv.org/abs/2607.20444","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20444v1 Announce Type: new \nAbstract: Large language models (LLMs) can produce deceptive responses: outputs that mislead users in service of a contextually or experimentally induced goal. Yet it remains unclear how confidently models deceive and whether higher confidence makes deceptive responses more persuasive to end users. In this paper, we study these basic questions in various models and different deception datasets. We provide a comprehensive study measuring confidence through both verbalized self-reports and a range of logit-based estimators. We show that LLMs deliver decepti","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13806,"title":"GLAN-QnA-KR: A Seedless Taxonomy-Driven Korean Instruction Corpus","url":"https://arxiv.org/abs/2607.20443","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20443v1 Announce Type: new \nAbstract: We release GLAN-QnA-KR, a 303,581-row openly redistributable Korean instruction-QA corpus produced via the seedless taxonomy-driven GLAN synthesis pipeline with Microsoft's Phi-3.5-MoE-instruct as the producer model (generation: 2024-12; release: 2024-12; licence: OpenRAIL). The corpus spans a flat taxonomy of 1,084 English-labelled disciplines paired with Korean question/answer text, a 100-900 difficulty scale, and a median of 313 question characters and 1,098 answer characters per record. Two properties are atypical for synthetic instruction d","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13805,"title":"Naver-News-KO: A Korean News Summarization Dataset for Open-Source Fine-Tuning of Summarization Models","url":"https://arxiv.org/abs/2607.20442","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20442v1 Announce Type: new \nAbstract: We release Naver-News-KO, a Korean news summarization dataset of 27,400 (document, summary) pairs collected from Naver News over a ten-day window in July 2022 across two categories (Economy and IT/Science; 77/23 split), with train/validation/test partitions of 22,194 / 2,466 / 2,740 and a mean per-record document-to-summary character-compression ratio of 6.03x. The dataset has been publicly hosted on the Hugging Face Hub since January 2023 and, as of May 2026, receives approximately 33,000 downloads per month; community-maintained Korean summari","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13804,"title":"Belief Propagation in LLM World Models: Measuring Strategic Information Bias with Prediction Markets","url":"https://arxiv.org/abs/2607.20441","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20441v1 Announce Type: new \nAbstract: Every information ecosystem produces beliefs that shape strategic decisions. Both human analysts and AI systems inherit the blind spots of their information sources. We show that LLMs, combined with prediction markets, function as a calibrated instrument for measuring how far ecosystem-induced beliefs deviate from an external reference: LLMs extract the beliefs a text corpus implies, and prediction market price trajectories, anchored at resolution by realised outcomes, provide the calibration reference against which to quantify the deviation.","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13803,"title":"Answer-then-Edit: Reasoning Skeleton Editing for Anti-Distillation with Preserved Utility","url":"https://arxiv.org/abs/2607.20440","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20440v1 Announce Type: new \nAbstract: Proprietary large language models (LLMs) entail substantial intellectual and financial investment, making them valuable intellectual property (IP). However, even when deployed via black-box APIs, these models remain vulnerable to unauthorized knowledge distillation, which allows adversaries to cheaply extract and replicate model capabilities. To address this issue, anti-distillation (AD) has been proposed to generate defensive outputs that hinder distillation effectiveness, overcoming the limitation of watermarking-based approaches that rely on","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13802,"title":"AsymVerify at SemEval-2026 Task 6: Asymmetric Confidence-Gated Verification for Political Evasion Detection","url":"https://arxiv.org/abs/2607.20439","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20439v1 Announce Type: new \nAbstract: Political evasion is difficult to detect because evasive answers often appear cooperative while avoiding concrete commitment. We present AsymVerify, a confidence-gated verification system for SemEval-2026 Task 6, a three-way classification of Clear Reply, Ambivalent, and Clear Non-Reply responses. AsymVerify scored 0.85 Macro F1 on the evaluation split (D_eval, n=237), placing 2nd out of 41 teams on the official leaderboard. The system first classifies each question-answer pair, then selectively applies downgrade verification (CR/CNR -\u003e AMB) or","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13801,"title":"Preference Tuning as Spectral Update Reorganization","url":"https://arxiv.org/abs/2607.20438","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20438v1 Announce Type: new \nAbstract: Preference-based post-training is usually understood through endpoint behavior, yet the learned update that produces this behavior remains largely opaque. We study RLHF and related preference optimization through the spectral structure of their induced parameter updates. By decomposing effective LoRA updates and reloading their spectral components as plug-in modules, we turn preference-induced updates into objects that can be isolated, recomposed, and directly intervened on. Across model families, optimization algorithms, and supervision regimes","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13800,"title":"TopoGuard: Graph Theory Based Defenses Against Split-Knowledge Attacks on RAG","url":"https://arxiv.org/abs/2607.20437","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20437v1 Announce Type: new \nAbstract: Production Retrieval Augmented Generation (RAG) systems rely on aggregating multiple external documents to answer complex queries. However, the retrieved documents introduce a new threat surface that can be exploited to launch split-knowledge attacks. In this attack, the adversary injects documents that are individually benign but create false associations when combined and fed to language models. This paper shows that the new attack is structurally invisible to existing per-document filters, like LlamaGuard. To address this issue in RAG, this w","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13799,"title":"Routing Subspaces: Auditing Evaluation-to-Deployment Mismatch in Fine-Tuned Language Models","url":"https://arxiv.org/abs/2607.20436","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20436v1 Announce Type: new \nAbstract: Safety evaluations often assume that behavior observed during testing reflects behavior in ordinary use, but fine-tuning can break this assumption. A checkpoint can appear fixed under evaluation-style prompts while the same behavior persists under ordinary-use prompts. Output scores reveal this mismatch but do not locate it. We investigate whether the distinction is encoded in a stable internal site and introduce an approach that fits a paired activation contrast at a path-patching-informed mid-depth window, then modifies the resulting coordinat","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13798,"title":"Making Open-Source Text LLM Watermarks Durable Against Merging","url":"https://arxiv.org/abs/2607.20435","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20435v1 Announce Type: new \nAbstract: Open-source LLMs (OSMs)arereaching near state-of-the-art performance, prompting prior works to trace the text they generate by embedding text watermarking algorithms directly into their weights. Yet, OSMs are subject to post-training modifications, which has been shown to remove the watermark. Model merging in particular, a prominent method used for combining expert knowledge and preventing catastrophic forgetting, strongly removes such OSM watermarks. A key question is how to enable OSM watermarks that survive subsequent merging. In this work,","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13797,"title":"Break Through the Compression Bottleneck: From Theory to Practice","url":"https://arxiv.org/abs/2607.20434","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20434v1 Announce Type: new \nAbstract: As the parameter size of language models continues to grow, effective model compression is required to reduce their computational and memory overhead. Existing compression methods suffer from bottleneck issues: when the compression ratio is increased, performance degrades significantly. Low-rank decomposition and quantization are two prominent compression methods that have been proven to significantly reduce the computational and memory requirements of Large Language Models (LLMs) while maintaining model accuracy. Evidently, combining these two","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13796,"title":"Moir: Let the Model Direct Its Own Story for Robust Cross-Domain Knowledge Editing","url":"https://arxiv.org/abs/2607.20433","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20433v1 Announce Type: new \nAbstract: While language models remain frozen at their training state, the world evolves continuously. Knowledge editing has emerged as a key alternative to full retraining, but its deployment is bottlenecked by the erosion of core capabilities: mathematical and programmatic reasoning collapse while encyclopedic recall remains intact. We trace this asymmetric degradation to a distributional mismatch. Covariance-based editors preserve only the subspaces spanned by their reference corpus, but fail to capture the operative distribution shaped by post-trainin","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13795,"title":"Position: Natural Language Should Not Fully Replace Formal Languages","url":"https://arxiv.org/abs/2607.20432","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20432v1 Announce Type: new \nAbstract: Recent advances in large language models and their widespread adoption have prompted claims that natural language could entirely replace formal languages, such as programming languages for software design. In this position paper, we argue that this perspective overlooks fundamental linguistic properties of natural language, specifically that it is optimized for underspecification in open-ended contexts. We introduce a formal framework centered on *task specificity*, defining it as the information-theoretic reduction of uncertainty in an output s","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13794,"title":"Skill-Contracted Agents for Evidence-Aware Materials Literature Analysis","url":"https://arxiv.org/abs/2607.20431","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20431v1 Announce Type: new \nAbstract: Materials science literature analysis requires simultaneous attention to composition, processing, characterization, and property relationships, yet conventional retrieval-augmented generation pipelines struggle to reconcile heterogeneous tasks within a single retrieve-then-generate architecture. Here we present AlphaAgent, a skill-driven agent framework that decouples retrieval-based question answering from paper-level report generation through explicit skill contracts. A dedicated retrieval skill rewrites user requests into material-specific se","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13793,"title":"LLM-INSTRUCT at UZH Shared Task 2026: Constraint-Aware Retrieval and Selective Debate for Paragraph-Level Argument Mining","url":"https://arxiv.org/abs/2607.20430","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20430v1 Announce Type: new \nAbstract: We present LLM-INSTRUCT, the winning system for the UZH Shared Task at ArgMining 2026 on paragraph-level argument mining in UN and UNESCO resolutions. The task requires paragraph-type classification, prediction of a subset of 141 official tags, and directed relation prediction under a strict JSON schema setting using only open-weight models up to 8B parameters. We frame the task as constrained structured prediction. The system first narrows the candidate tag space with metadata-aware dense retrieval, then applies constrained decoding with per-di","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13792,"title":"More Is Not More: What Matters for Diversity in LLM Opinions?","url":"https://arxiv.org/abs/2607.20429","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20429v1 Announce Type: new \nAbstract: Large language models are increasingly used to simulate diverse human opinions in open-ended tasks such as synthetic surveys, focus group modeling, and public opinion prediction. However, LLM outputs exhibit systematic opinion homogenization. Practitioners have explored various interventions to increase diversity, but the landscape remains fragmented: different methods are evaluated in isolation with incomparable metrics, and in practice they are typically deployed and upgraded simultaneously, making it difficult to attribute gains to specific c","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13791,"title":"Human-in-the-Loop Large Language Model Framework for Identification of Cutaneous Immune-Related Adverse Events","url":"https://arxiv.org/abs/2607.20428","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20428v1 Announce Type: new \nAbstract: This study evaluated a retrieval-augmented, multi-agent large language model (LLM)-driven, human-in-the-loop framework for detecting cutaneous immune-related adverse events (cirAEs) from clinical notes. Compared with unassisted manual review, the LLM-assisted workflow improved accuracy (F1 = 0.88 vs 0.77), inter-rater agreement measured by Cohen's kappa (kappa = 0.82 vs 0.50), and reduced average review time by approximately half. This framework pilots how LLMs can be applied to identify immune-related toxicities across organ systems and, more b","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13790,"title":"Is MoE Routing a Huffman Code? Discovering the Frequency-Diversity Law in Chain-of-Thought","url":"https://arxiv.org/abs/2607.20427","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20427v1 Announce Type: new \nAbstract: Mixture-of-Experts architectures have revolutionized scaling, yet the underlying logic of their routing remains a black box. In this paper, we uncover a fundamental governing principle: MoE routing is not merely selection, but a manifestation of Huffman Coding. We introduce the Frequency-Diversity Law, revealing that state-of-the-art models, such as Phi-3.5-MoE and Gemma-4-27B-A4B, spontaneously act as information-theoretic engines. These models allocate sparse expert resources for common tokens while invoking high-diversity expert committees fo","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13789,"title":"Knowledge Injection Exists in MoE? Exploring Expert-Aware Contrast Decoding in MoE for Mitigating LLMs'Hallucinations","url":"https://arxiv.org/abs/2607.20426","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20426v1 Announce Type: new \nAbstract: Existing LLM hallucination mitigation methods, including prompt engineering and model optimization, either hardly alter models'internal knowledge or have poor cross-domain generalization. Contrastive decoding mitigates hallucinations by using layer-wise differences in LLMs. However, prior studies only explore transformer-based models (e.g., GPT), ignoring other effective frameworks like mixture-of-experts (MoE) models. Since MoE alters the traditional transformer architecture, we conduct empirical studies to investigate whether similar layer-wis","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13788,"title":"What is Good? Extracting and Testing Implicit Theories of Literary Quality from LLM Reasoning Traces","url":"https://arxiv.org/abs/2607.20425","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2607.20425v1 Announce Type: new \nAbstract: What makes writing \"good\" remains a persistent question in literary studies and computational linguistics. We present a two-study investigation of how reasoning-enabled LLMs evaluate literary quality.\n  In Study 1, we construct a benchmark of 30 real texts spanning six quality tiers, from canonical literature to anonymous forum posts, and extract the model's implicit theory of quality from its reasoning traces. Across five DeepSeek replications, the model achieves 79.3% mean tier-classification accuracy. The traces reveal a consistent stated the","tags":[],"cluster_size":1,"ts":"2026-07-25T04:00:00"},{"id":13812,"title":"Anthropic release Claude Opus 5, its 'safest model yet' - Mashable","url":"https://news.google.com/rss/articles/CBMiakFVX3lxTE9QMVFubElTTldzb1BrR2ZjNHlaalVXbFBiSVAxLUpDMms3b2dYalQzT05pRncySmhHRmtLSmtPeEl5Qk1aMU5mSjQ0MVN5eTFPUFdlcTFueS1DUTQxa25ReHE5N1J6akVsRFE?oc=5","source":"GNews · AI Research","sources":["GNews · AI Research"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiakFVX3lxTE9QMVFubElTTldzb1BrR2ZjNHlaalVXbFBiSVAxLUpDMms3b2dYalQzT05pRncySmhHRmtLSmt // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
