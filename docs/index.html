VzV1V2doNnVFMjBMZ2Z4TTQ?oc=5\" target=\"_blank\"\u003e中国移动：将推出全国统一的Token套餐资费- 快讯\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e亿邦动力网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-13T22:40:33"},{"id":19967,"title":"AI驱动半导体景气度高涨，两大晶圆厂第二季度收入均创新高","url":"https://wallstreetcn.com/livenews/3149345","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"8月13日晚，中芯国际、华虹宏力同步披露了第二季度业绩，两大晶圆厂销售收入、毛利率均实现同比、环比的增长，销售收入创出历史新高，充分反映出半导体产业的高景气度。两大晶圆厂对于第三季度的乐观指引，透露出半导体产业高景气度有望延续。AI依然是半导体产业成长最强劲的驱动力，并且需求已经从存储、逻辑扩展至功率、模拟等产品领域。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-13T22:33:58"}]},{"key":"ai-cn","name":"AI 前沿 (中文)","description":"国内 AI 媒体 (机器之心 / 36氪 / 量子位 / 极客公园 / 智东西 / 新智元) + AI 关键词大盘。","color":"#d97706","tags":["大模型","AI芯片","Agent","商业","融资","公司","监管","研究"],"articles":[{"id":20031,"title":"上海汽车芯片“小巨人”，要IPO了，拟募资34.89亿 - 36kr.com","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBJZF9WVl9NLThIZW0wZWZON1o0WUR2OEhvU1pKckhJeGhQcDdkM2VWQzg2czhLemM0c3A2SUlLVi12d3B6M0xXcFdKQ2JMWFo0?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBJZF9WVl9NLThIZW0wZWZON1o0WUR2OEhvU1pKckhJeGhQcDdkM2VWQzg2czhLemM0c3A2SUlLVi12d3B6M0xXcFdKQ2JMWFo0?oc=5\" target=\"_blank\"\u003e上海汽车芯片“小巨人”，要IPO了，拟募资34.89亿\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36kr.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:49:22"},{"id":20032,"title":"科学家观测到核子内部奇特结构，中国科大发挥主导作用","url":"https://www.ithome.com/0/989/533.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bbdc\"\u003eIT之家 8 月 14 日消息，据中国科学技术大学官方公众号，近日，中国科学技术大学与美国肯特州立大学、\u003cspan\u003e布鲁克海文国家实验室\u003c/span\u003e等单位在 STAR 国际实验组中发挥主导作用，通过高能原子核-原子核对撞实验中净重子数和净电荷数的精确测量发现核子内部存在一种奇特结构，\u003cstrong\u003e可能颠覆人们对核子内部结构的根本认识，\u003c/strong\u003e该结果于北京时间 2026 年 8 月 14 日凌晨在《科学》杂志上在线发表。\u003c/p\u003e\u003cp data-vmark=\"9027\"\u003e据介绍，核子是组成物质世界的基本粒子，\u003cstrong\u003e宇宙中可见物质世界 99% 以上的质量由核子携带\u003c/strong\u003e，理解核子内部结构对理解物质世界的基本组成和基本相互作用具有极其重要的意义。人们普遍认为核子由夸克（含反夸克）和胶子组成。夸克携带 +2/3 或-1/3 电子电荷和 1/3 重子数，反夸克携带的电荷和重子数与夸克相反，而胶子既不携带电荷也不携带重子数。中国科学技术大学重离子碰撞物理课题组唐泽波教授及其合作者通过精确的实验测量发现核子内部需要一种携带重子数但不携带电荷和色荷的基本结构，对上述用来描述核子内部结构的朴素夸克模型提出了重大挑战。\u003c/p\u003e\u003cp data-vmark=\"750f\"\u003eIT之家从官方介绍获悉，该项研究从两个方面得到了自洽的结果。","tags":[],"cluster_size":1,"ts":"2026-08-14T01:47:34"},{"id":20033,"title":"千方公路巡查养护智能体：助力一线养护工作提质增效 - 同花顺财经","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBxb1VXYjlDQk9EMnVtTUxrdDl6SWZQeWdfR3NqM3A5STROMU5hOEFoZE1vNk1rUDYtM0drYjBXaUV1ZjJ0U1RBTEdrbTFXS3p4a3dmeXNjZmY2YzlOMHhsYWlR?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBxb1VXYjlDQk9EMnVtTUxrdDl6SWZQeWdfR3NqM3A5STROMU5hOEFoZE1vNk1rUDYtM0drYjBXaUV1ZjJ0U1RBTEdrbTFXS3p4a3dmeXNjZmY2YzlOMHhsYWlR?oc=5\" target=\"_blank\"\u003e千方公路巡查养护智能体：助力一线养护工作提质增效\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e同花顺财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:47:15"},{"id":20034,"title":"超越SpaceX！Anthropic估值或突破2万亿美元 - 新浪财经","url":"https://news.google.com/rss/articles/CBMikgJBVV95cUxOLVkxVjh4VjEtckd3QVdfdkFlZ3BIS2dBVldCbVhRVWFLN1g3dXdQX2xHUTQ0cXBtY3Jkekk3Wkhnc0ZxdWphSmJqVWw2QlBVc05zMUVBcUpONE9GZkdjeDdIZ1dpc0x5SlFfRm9KbTN6RXlGZ1BFWXY0ZnZ1QWE0eE9HWlQtT0Z5R1c2WVduQ25MU19hUDV4TkJCRWR6eW10Yy1MX0NnSGFKSFlHMm00SVBXWVVXaWdLbDE5V0tRUUlVbWhCRWViY3pMbWdLTDhURzZTTTBiaEhISEN2WVZaQnp1T1V1NnNwQlJtc2xjTDBXdzVpOGs4eEVnemtETVJJTDZlNEV1d25JQWwxOVVzclZB?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMikgJBVV95cUxOLVkxVjh4VjEtckd3QVdfdkFlZ3BIS2dBVldCbVhRVWFLN1g3dXdQX2xHUTQ0cXBtY3Jkekk3Wkhnc0ZxdWphSmJqVWw2QlBVc05zMUVBcUpONE9GZkdjeDdIZ1dpc0x5SlFfRm9KbTN6RXlGZ1BFWXY0ZnZ1QWE0eE9HWlQtT0Z5R1c2WVduQ25MU19hUDV4TkJCRWR6eW10Yy1MX0NnSGFKSFlHMm00SVBXWVVXaWdLbDE5V0tRUUlVbWhCRWViY3pMbWdLTDhURzZTTTBiaEhISEN2WVZaQnp1T1V1NnNwQl 6-08-14T01:39:00"},{"id":20037,"title":"AI智能体概念盘初走强，彩讯股份等多股涨停 - 新浪财经","url":"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5UcEVsbGU1MHB1R3BUQUVjYmlfS2NXa29wbE9qRDFzZXh1N2dFUlNLZHBleE1wVjlnaTRLTy1GbWw2SHNlemgweDFXSQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5UcEVsbGU1MHB1R3BUQUVjYmlfS2NXa29wbE9qRDFzZXh1N2dFUlNLZHBleE1wVjlnaTRLTy1GbWw2SHNlemgweDFXSQ?oc=5\" target=\"_blank\"\u003eAI智能体概念盘初走强，彩讯股份等多股涨停\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:37:04"},{"id":20038,"title":"消息称腾讯将从 Meta 手中接下股份，成为 Manus 最大股东","url":"https://www.ithome.com/0/989/529.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"78e4\"\u003eIT之家 8 月 14 日消息，据《日经新闻》周四报道，腾讯控股将从 Facebook 母公司 Meta 手中收购 AI 开发商 Manus 的股份，\u003cstrong\u003e成为其最大股东\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"bf58\"\u003e2025 年 3 月，蝴蝶效应公司推出 Manus，曾在市场一夜爆火。然而，当年 6 月，Manus 企业总部迁至新加坡，大幅裁减国内团队，彻底停止中国境内服务与运营。作为一家依靠中国工程师和基础设施环境发展起来的 AI 公司，Manus 在获得美国投资后突然与中国元素进行“切割”，引发争议。\u003c/p\u003e\u003cp data-vmark=\"4621\"\u003e据IT之家今年 4 月报道，外商投资安全审查工作机制办公室（国家发展改革委）依法依规\u003ca href=\"https://www.ithome.com/0/943/996.htm\" target=\"_blank\"\u003e对外资收购 Manus 项目作出禁止投资决定\u003c/a\u003e，要求当事人撤销该收购交易。央视新闻对此解读称，\u003ca target=\"_blank\" href=\"https://www.ithome.com/0/944/519.htm\"\u003e禁止的是企业“洗澡式出海”的不合规做法\u003c/a\u003e。\u003c/p\u003e\u003cp data-vmark=\"b225\"\u003e8 月 11 日，\u003ca hre","tags":[],"cluster_size":1,"ts":"2026-08-14T01:36:14"},{"id":20039,"title":"Win11 新攻击曝光：不物理接触，利用内存缺陷绕过安全防护","url":"https://www.ithome.com/0/989/528.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"bab1\"\u003eIT之家 8 月 14 日消息，科技媒体 NeoWin 昨日（8 月 13 日）发布博文，报道称本周在巴尔的摩（Baltimore）举办的 2026 年 USENIX 安全研讨会上，\u003cstrong\u003e安全专家披露 Download More RAM 攻击，可以在不接触设备的情况下入侵 Windows 11 系统。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"d9ff\"\u003e该攻击由来自英国伯明翰大学与杜伦大学的安全研究团队发现，攻击者无需物理接触目标设备，利用软件触发的内存缺陷，绕过 Windows 11 安全防护。\u003c/p\u003e\u003cp data-vmark=\"2f97\"\u003e在技术原理方面，该问题出现在部分 DDR4 和 DDR5 DIMM（双列直插式内存模块）配置内存芯片上，由于缺少写保护，软件因此可以改写芯片内保存的信息，并让 Windows 误判系统内存容量为实际容量的 2 倍。\u003c/p\u003e\u003cp data-vmark=\"9ad1\"\u003e安全风险方面，错误报告内存容量表面来看风险有限，不过研究人员利用额外出现的内存地址，设置真实内存位置别名，从而借此读取或修改本应由 Windows 与处理器保护的内存区域。\u003c/p\u003e\u003cp data-vmark=\"74b0\"\u003e在影响方面，研究人员通过该技术绕过 Virtualization-based Security（","tags":[],"cluster_size":1,"ts":"2026-08-14T01:32:00"},{"id":20040,"title":"记忆能力达4+级！中兴通讯Co-Claw智能体首批通过中国信通院可信AI认证 - 飞象网","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE9NR1RGNkROSjJzYnlURmUxZjFPRVBpOXJGaEQ3bFBQZDZ5b19PWGFzSUk2WXlOS053dFJvTlBIaXd1c3VvS1dCdko4cV9DWjFqdGZUSHdvVUR0bnFQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXEFVX3lxTE9NR1RGNkROSjJzYnlURmUxZjFPRVBpOXJGaEQ3bFBQZDZ5b19PWGFzSUk2WXlOS053dFJvTlBIaXd1c3VvS1dCdko4cV9DWjFqdGZUSHdvVUR0bnFQ?oc=5\" target=\"_blank\"\u003e记忆能力达4+级！中兴通讯Co-Claw智能体首批通过中国信通院可信AI认证\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e飞象网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:29:37"},{"id":20041,"title":"库克卸任前为“美国制造”站台，陪同美国商务部长参观苹果 Mac Mini 新工厂","url":"https://www.ithome.com/0/989/527.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ec71\"\u003eIT之家 8 月 14 日消息，据美国 CNBC 报道，当地时间周四，\u003cstrong\u003e即将卸任的苹果 CEO 蒂姆 · 库克再次露面\u003c/strong\u003e，与包括美国商务部长霍华德 · 卢特尼克（Howard Lutnick）在内的美国政府官员一起，为一家位于得克萨斯州休斯顿的新制造工厂揭幕，该工厂将为企业提供免费培训和教育课程。\u003c/p\u003e\u003cp data-vmark=\"1f53\"\u003e苹果公司表示，该工厂还将于今年晚些时候\u003cstrong\u003e生产 Mac Mini 台式电脑\u003c/strong\u003e。此外，苹果的 AI 服务器也在该工厂的一部分进行组装。\u003c/p\u003e\u003cp data-vmark=\"d78c\"\u003e库克表示：“我们建起了一座工厂，开始生产，并交付了第一批先进的 AI 服务器，Mac Mini 的生产也将在今年晚些时候开始。”他还补充说，苹果公司已在该工厂投入了数亿美元。\u003c/p\u003e\u003cp data-vmark=\"2d89\"\u003e苹果公司还重点宣传了其在美国生产的产品，例如零部件、芯片和屏幕玻璃。库克周四表示，苹果去年从美国采购了超过 200 亿颗芯片，其中 1 亿颗来自台积电位于亚利桑那州的工厂。\u003c/p\u003e\u003cp data-vmark=\"26a3\"\u003e卢特尼克在剪彩仪式上表示：“我们需要苹果公司承诺在美国建厂，因为他们或许能够以独特的方式引领先进制造业落户美国。”\u003c/p\u003e\u003c","tags":[],"cluster_size":1,"ts":"2026-08-14T01:25:56"},{"id":20042,"title":"AI，正在重构美国人的购车模式 - 36kr.com","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE5tUzVaZS1xUG9IRWxUak95a0lnWHdDY2xGRVFQTjRGdnVuTTJWNFgzOUVUTjhKMWJfV0hFN3Vwc1dkN3lZZ0Q1MWY5R1ZJNXdZ?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE5tUzVaZS1xUG9IRWxUak95a0lnWHdDY2xGRVFQTjRGdnVuTTJWNFgzOUVUTjhKMWJfV0hFN3Vwc1dkN3lZZ0Q1MWY5R1ZJNXdZ?oc=5\" target=\"_blank\"\u003eAI，正在重构美国人的购车模式\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36kr.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:24:19"},{"id":20043,"title":"前瞻全球产业早报：DeepSeek Harness开发者预览版开放测试_产经 - 前瞻网","url":"https://news.google.com/rss/articles/CBMiakFVX3lxTE8zQzdZc2xkamN0MFFFbFl4blE1U0NYUkliLVhvUE05b1RBUHctb2t0cnZsY1JTdlo4MFctSDE2QUp0U3d5d18zRURkaUxiLTlUd21oVzQyZmVKU3J4R2pGLTB5Y3loNU9LUHc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiakFVX3lxTE8zQzdZc2xkamN0MFFFbFl4blE1U0NYUkliLVhvUE05b1RBUHctb2t0cnZsY1JTdlo4MFctSDE2QUp0U3d5d18zRURkaUxiLTlUd21oVzQyZmVKU3J4R2pGLTB5Y3loNU9LUHc?oc=5\" target=\"_blank\"\u003e前瞻全球产业早报：DeepSeek Harness开发者预览版开放测试_产经\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e前瞻网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-14T01:22:00"},{"id":20044,"title":"模型越做越小，面壁智能的“端侧”生意有多大？ - 36kr.com","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE53dVZmWVZUZ2k1U2QxYXpKWXdFR0ZzSzZQaEN2dXhtdTNXUWdQU210bFViUHJiNjJyOFYzdFozWHhTanlGZjlzSmFqMlRwc2c?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE53dVZmWVZUZ2k1U2QxYXpKWXdFR0ZzSzZQaEN2dXhtdTNXUWdQU210bFViUHJiNjJyOFY 03eChina's Westlake Robotics Raises $14.8M in Series A Funding to Develop Humanoid Robot Tech\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eAI Insider\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-13T12:39:30"},{"id":19811,"title":"Towards the Harness of Embodied Agents","url":"https://arxiv.org/abs/2608.11246","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11246v1 Announce Type: cross \nAbstract: The success of coding agents has established the harness as a paradigm: what an agent achieves depends not on the model alone, but on the infrastructure around it. We ask whether the same paradigm extends to embodied agents in the physical world. We present Thea, a harness in which an agentic loop orchestrates robot capabilities, each wrapped as a callable tool. It inherits the core components of coding agents, modified as the physical world requires. The world, however, withholds two abilities that software grants for free: reading the state","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19810,"title":"Synchronizing Beliefs with Second-Order Theory-of-Mind in Human-Autonomy Teams (Extended Version)","url":"https://arxiv.org/abs/2608.11229","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11229v1 Announce Type: cross \nAbstract: Comparative feedback, asking people which of two behaviors they prefer, has become a standard way to align robot and agent behavior with human intent when the reward itself cannot be specified directly. Preference-based reward learning typically casts the human teacher as a passive oracle answering learner-generated queries. We argue this forfeits the teacher's defining advantage: knowledge of the objective. A teacher who knows the target can construct training examples more efficiently than any learner-driven acquisition strategy, an advantag","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19809,"title":"World Tokens: Enhancing Embodied Policies with Training-Time World Modeling","url":"https://arxiv.org/abs/2608.09730","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.09730v1 Announce Type: cross \nAbstract: Vision-language-action (VLA) models are a widely adopted paradigm for embodied policies. They excel at efficient closed-loop control but do not explicitly model how physical scenes evolve as a task unfolds. Recently emerging world-action models (WAMs) leverage pretrained video world models to capture spatiotemporal evolution, yet retaining future generation or a large video backbone in the control loop substantially increases inference cost. We introduce World Tokens, an embodied policy architecture built around a World Adapter that bridges vi","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19808,"title":"Early Warning Signals for OpenVLA Failure under Visual Distribution Shift","url":"https://arxiv.org/abs/2606.29699","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.29699v2 Announce Type: cross \nAbstract: Visual shifts can cause a vision-language-action policy to fail after initially plausible behavior. We ask whether OpenVLA's internal activations contain signals associated with the steps before failure. We freeze the policy, record one MLP activation per LIBERO-10 step, and fit two linear monitors. Occlusion reduces task success from $57\\%$ to $17\\%$. Within failed matched-reset trajectories, a layer-16 logistic probe attains AUROC $0.972$ and AUPRC $0.352$, whereas action disagreement attains AUROC $0.496$. Without refitting, the occlusion-t","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19807,"title":"HandEdit: A Unified Benchmark for Egocentric Human-to-Robot Dexterous Hand Image Editing","url":"https://arxiv.org/abs/2608.12122","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.12122v1 Announce Type: new \nAbstract: Robotic manipulation with dexterous hands is a cornerstone of Embodied AI, yet its progress is stifled by the high cost of collecting embodiment-aware teleoperation data. While abundant egocentric videos of human hands offer a scalable alternative, the profound discrepancies in appearance, articulation, and camera viewpoints between human and robotic data raise significant challenges for co-training. Though existing general image-editing models demonstrate strong capabilities, they lack necessary embodiment-specific priors to fully bridge this g","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19806,"title":"Learning Loco-Manipulation From SMPC Demonstrations With Sparse Offline-to-Online RL","url":"https://arxiv.org/abs/2608.12063","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.12063v1 Announce Type: new \nAbstract: Integrating locomotion and manipulation is essential for robot autonomy, but scaling standard Reinforcement Learning (RL) to complex tasks is severely bottlenecked by the slow, manual process of dense reward shaping. To bypass this limitation, we leverage Sample-based Model Predictive Control (SMPC) entirely in simulation as an automated, rapidly tunable expert to generate massive offline datasets. Because this data solves the fundamental exploration problem, we can train an off-policy RL agent using purely sparse task rewards, drastically reduc","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19805,"title":"D3D-GEN: Robot-Aware Domain-Grounded Interactive 3D World Generation for Social Robotics","url":"https://arxiv.org/abs/2608.11876","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11876v1 Announce Type: new \nAbstract: Training and validation of Embodied AI for social navigation critically depends on realistic simulation environments, yet many current approaches fail to find a balance between realism and simulability. We propose D3D-GEN, a novel world generation system that combines a domain agent with a retrieval-augmented generation (RAG) pipeline grounded in that domain. Our system enables users to rapidly generate domain-grounded, fully interactive 3D worlds by automating both the collection of domain knowledge and the synthesis of realistic floorplans and","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19804,"title":"Policy-Induced Hand Priors in Humanoid Dual-Arm Manipulation: Diagnosing and Mitigating Initial-Pose Dependence","url":"https://arxiv.org/abs/2608.11769","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11769v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies are expected to operate robustly across variations in the robot's initial configuration, yet aggregate task success can conceal pose-specific failures and inappropriate hand selection. This work investigates initial-pose dependence in VLA-based humanoid dual-arm manipulation. We characterize the initial-condition-dependent early hand preference as a policy-induced hand prior and quantify it using HandPriorScore, residual hand bias, and target responsiveness. Evaluations across multiple policies and 17 initia","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19803,"title":"G0.5: One Autoregressive Stream for Robot Reasoning and Action","url":"https://arxiv.org/abs/2608.11739","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11739v1 Announce Type: new \nAbstract: The prevailing recipe for Vision-Language-Action (VLA) models couples a pretrained VLM with a separately trained flow-matching action expert. This makes the VLM a context encoder rather than a decision-maker. We introduce G0.5, a pretrained autoregressive VLA in which a single transformer decoder emits reasoning and action tokens under a single objective. Three components make this tractable at foundation-model scale: a learnable cross-embodiment action tokenizer that maps heterogeneous robot actions into a shared vocabulary; a native chain-of-t","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19802,"title":"StellaVLA: In-Context Structured Demonstration for Generalizable Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.11671","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11671v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models can follow instructions and manipulate objects, but their performance often collapses out of distribution (OOD), when the scene, viewpoint, or object differs from training. Adapting to each new situation typically requires collecting more data and fine-tuning. We present StellaVLA, a framework that instead adapts at test time by conditioning on a single retrieved demonstration. The key idea is to move beyond imitating what an expert did and instead convey why: an automated offline pipeline converts each raw tr","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19801,"title":"Keep the Future, Drop the Rollout: RIFT for World Action Models","url":"https://arxiv.org/abs/2608.11521","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11521v2 Announce Type: new \nAbstract: World action models (WAMs) condition robot actions on predicted futures, but iterative video rollout increases deployment latency. We ask whether action generation requires the evolving rollout trajectory or only its future representation. Across four WAMs on all 40 LIBERO tasks, paired closed-loop interventions show that masking or reassigning future-cache values changes execution and reduces success, indicating sensitivity to future values and their assigned positions. For Joint and Cosmos-2, however, replaying one fixed final-clean key/value","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19800,"title":"Locomotion Variability and User Experience in Smart Wheelchair Human-Robot Interaction","url":"https://arxiv.org/abs/2608.11417","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11417v1 Announce Type: new \nAbstract: Human movement is inherently variable, with variability structured according to task relevance: movements are typically more consistent at task-critical points and more flexible elsewhere. In human-robot interaction (HRI), however, model-based assistance strategies commonly assume deterministic human behavior and suppress such variability, potentially altering how interactions are experienced and lowering sense of agency. While movement variability is increasingly recognized as functionally meaningful, its deliberate preservation in assisted int","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19799,"title":"From Self-Normal-Positioning to Omni-Directional Tracking: Real-Time Surface Modeling Enabled Probe Tilt Control for Robotic Ultrasound Imaging","url":"https://arxiv.org/abs/2608.11409","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11409v1 Announce Type: new \nAbstract: Ultrasound (US) provides real-time, radiation-free imaging, but the image quality depends strongly on how the probe is oriented against the patient body. Robotic US can reduce operator workload and improve acquisition consistency; however, most existing systems focus on normal positioning, where the probe is maintained perpendicular to the local surface. This constraint is inadequate for examinations like echocardiography, where obtaining a diagnostic view requires a non-normal probe angle. Consequently, a clinically useful robotic system must s","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19798,"title":"Adaptation of Generalist Robot Policies with Minimal Data","url":"https://arxiv.org/abs/2608.11363","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.11363v1 Announce Type: new \nAbstract: A central goal in robot learning is to move beyond task-specific human data collection toward robots that improve through autonomous interaction. Yet fully autonomous learning remains difficult with current policies: sparse rewards and weak zero-shot exploration make it unlikely that a robot will discover successful behavior from scratch. We study minimal-data adaptation, a regime in which a pre-trained robot policy must learn a new task from as little as one demonstration followed by autonomous online interaction. This setting serves as the clo","tags":[],"cluster_size":1,"ts":"2026-08-13T04:00:00"},{"id":19330,"title":"Optimus量产倒计时撞上宇树IPO，8月机器人大会能否成为AI新锚点？ - Sohu","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNbGFla2l6eU5Ba2hqSHZfNzI5c1g1SExlY0t4ZnQtLXZIaDJQclFZcXhiamJVWlF1V3Y3M1VFellvb0pSRXA5dmVjS3NvRXI0NHQwVU50NWlPZmdyUHdyUmNRVzZhd3Z5WDl1N09YbnhMTV93aWROZ2EtTGxNNldHM3pSeDhSTE00?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxNbGFla2l6eU5Ba2hqSHZfNzI5c1g1SExlY0t4ZnQtLXZIaDJQclFZcXhiamJVWlF1V3Y3M1VFellvb0pSRXA5dmVjS3NvRXI0NHQwVU50NWlPZmdyUHdyUmNRVzZhd3Z5WDl1N09YbnhMTV93aWROZ2EtTGxNNldHM3pSeDhSTE00?oc=5\" target=\"_blank\"\u003eOptimus量产倒计时撞上宇树IPO，8月机器人大会能否成为AI新锚点？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eSohu\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-13T01:21:42"},{"id":19331,"title":"Northrop’s robot space mechanic is a new way to keep satellites at work longer","url":"https://techcrunch.com/2026/08/12/northrops-robot-space-mechanic-is-a-new-way-to-keep-satellites-at-work-longer/","source":"TechCrunch · Robotics","sources":["TechCrunch · Robotics"],"summary":"The Mission Robotic Vehicle is making the first attempt to attach a new thruster to an aging satellite.","tags":[],"cluster_size":1,"ts":"2026-08-12T20:53:41"},{"id":19812,"title":"AI主题切换，高盛唱多+Optimus量产双重催化！人形机器人占6成，560770爆发在即？ - 新浪财经","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxNa0dpWUM0c0JFQW92dHNuVGVodlFvS0owYm5CcWtkQ1Z2dk12eHBNazVRQzk2Z3RNeDc2OXhZMXVHX1FUdVE1ZzlCbkZNY0tTellYMTB0Z1NGMkstWkx5Wlc5UVJUXzdPSEVaSDljRHhhVGF1eGx2TzFrYzhZSUZZUW14dV driven perception-to-decision problem and present AECNav, a training-free pipeline built on three components: i) Evidence-gate","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"},{"id":19345,"title":"JEPA-WAM: Stage-Level Joint-Embedding Prediction for World-Action Models in Robot Manipulation","url":"https://arxiv.org/abs/2608.10780","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.10780v1 Announce Type: new \nAbstract: Generalist robot policies aim to map multimodal observations and linguistic task instructions to actions across diverse tasks. However, existing methods typically represent the future as a fixed, short video-action chunk. This short-term future captures local scene evolution for action execution, but it does not explicitly describe the stage-level future that specifies how a task should progress from its current stage to the next. We therefore distinguish two complementary futures for robot manipulation: a short-term physical future to capture l","tags":[],"cluster_size":1,"ts":"2026-08-12T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
