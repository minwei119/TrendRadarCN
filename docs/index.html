me.com/1/014/200.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"67a5\"\u003eIT之家 10 月 17 日消息，据路透社 16 日报道，英国竞争与市场管理局拟认定微软在商业软件市场具有“战略市场地位”，此举可能使监管机构\u003cstrong\u003e有权干预微软将 Excel、Teams 及 AI 助手 Copilot 等产品捆绑销售的做法\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"c639\" style=\"text-align: start;\"\u003e今年 5 月，英国竞争与市场管理局开始调查微软在商业软件市场的地位是否妨碍竞争。\u003c/p\u003e\u003cp data-vmark=\"c7e6\" style=\"text-align: start;\"\u003e据悉，微软的商业软件在英国每月\u003cstrong\u003e约有 2000 万用户\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"28eb\" style=\"text-align: start;\"\u003e监管机构当天指出，微软在 PC 操作系统以及办公、安全、服务器和数据库管理软件市场均占据强势地位，客户转用其他供应商的产品时面临诸多障碍，进一步巩固了微软的市场优势。\u003c/p\u003e\u003cp data-vmark=\"ed7d\" style=\"text-align: start;\"\u003e微软发言人不认同这一结论：“我们的所有产品，包括 Copilot，\u003cstrong\u003e都采用开放设计\u003c/strong\u003e，能够与其他服务互通，客","tags":[],"cluster_size":1,"ts":"2026-10-16T23:27:03"},{"id":34014,"title":"OpenAI再度挖角SpaceX AI领域核心销售负责人 - DoNews","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE5OeGMtelBabnR3am5ZRncwRTZuWkQ3WlJCU3pQaHBabVI5U21uNkdod25PTG4tNk9UNTRuUmR4QS1qNVJRRmZxcjJnaDRSSzNrRGRqMkxCQWUxUHlPS3c?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE5OeGMtelBabnR3am5ZRncwRTZuWkQ3WlJCU3pQaHBabVI5U21uNkdod25PTG4tNk9UNTRuUmR4QS1qNVJRRmZxcjJnaDRSSzNrRGRqMkxCQWUxUHlPS3c?oc=5\" target=\"_blank\"\u003eOpenAI再度挖角SpaceX AI领域核心销售负责人\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eDoNews\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-16T23:24:10"},{"id":34015,"title":"Anthropic人均创收达Meta、谷歌高速增长期2-4倍 - DoNews","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTFBSTjBZU2QzbUpuQlphLVhFZ3YwQ3RvWVpyRjJreTZaOHJKVS05RERVYWJhR1FOQ0pmMXVGRE5rWXR6VEI4NFlvTWtFYkg1MUo1OHpSX2x2RldwM0t3cXc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTFBSTjBZU2QzbUpuQlphLVhFZ3YwQ3RvWVpyR Lake AX\" 处理器，平台算力 700 TOPS","url":"https://www.ithome.com/1/014/194.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3182\"\u003eIT之家 10 月 17 日消息，据韩媒 THE ELEC 报道，Intel（英特尔）高级副总裁 조민성 昨日在韩国举行的“半导体驱动人形机器人”大会上表示，该企业计划 2027 年初面向物理 AI 领域推出 \"Nova Lake\" 处理器。\u003c/p\u003e\u003cp data-vmark=\"b4fb\"\u003e而在 \"Nova Lake\" 后，\u003cstrong\u003e英特尔还将在 2028 年为物理 AI 带来 \"Razor Lake AX\"\u003c/strong\u003e。其\u003cstrong\u003e平台总算力可到 700 TOPS\u003c/strong\u003e，显著优于 \"Panther Lake\" 的 180 TOPS。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"7baa\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/10/5032841a-17a1-4c88-b8e8-e02e7aeff83d.jpg?x-bce-process=image/format,f_auto\" w=\"720\" h=\"720\" data-weibo=\"0\" data-vmark=\"53f6\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"c2bf\"\u003e综合现有爆料，\"Razor L","tags":[],"cluster_size":1,"ts":"2026-10-16T23:08:44"},{"id":34022,"title":"Anthropic 向美国国会推介 AI 监管草案，仅允许出现严重风险时封锁模型","url":"https://www.ithome.com/1/014/193.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"0119\"\u003eIT之家 10 月 17 日消息，据 POLITICO 报道，三名知情人士透露，Anthropic 的代表已悄悄向美国国会山的议员推介了一份法案草案，旨在规范前沿人工智能的安全与防务标准。\u003c/p\u003e\u003cp data-vmark=\"378a\"\u003e据悉，目前美国国会正审慎评估如何对这一飞速发展的行业确立监管框架，而该草案的提出，标志着这家顶级 AI 实验室正在采取切实行动，试图左右针对自身技术的监管规则。\u003c/p\u003e\u003cp data-vmark=\"465b\"\u003e“该法案体现了 Anthropic 在《先进人工智能框架》中提出的核心方案，我们自 6 月起就一直在向联邦及各州立法者游说推介，”Anthropic 发言人表示，“我们坚信国会应当在这些务实合理的政策上采取立法行动。”\u003c/p\u003e\u003cp data-vmark=\"2d77\"\u003e草案大幅收紧了监管干预的门槛：仅在模型可能造成可预见、迫在眉睫的“\u003cstrong\u003e超过 10 亿美元\u003c/strong\u003e\u003cspan class=\"exch-money-value \"\u003e（IT之家注：现汇率约合 67.03 亿元人民币）\u003c/span\u003e\u003cstrong\u003e经济损失\u003c/strong\u003e”或“\u003cstrong\u003e导致 50 人以上死亡或重伤\u003c/strong\u003e”时，政府方可叫停该模型的发布或使用。\u003c/p\u003e\u003cp data-vmark=\"ed2f\"","tags":[],"cluster_size":1,"ts":"2026-10-16T23:05:10"},{"id":34023,"title":"马斯克要让 AI 帮企业“砍价”：成本效益有望提升 5% 以上","url":"https://www.ithome.com/ bd74.jpg\" w=\"862\" h=\"315\" data-weibo=\"0\" data-vmark=\"bbfa\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"262b\"\u003eIT之家注：这里的种子（seed），可以理解为“生成椭圆曲线参数时使用的一段起始数据”，生成规则像一台固定程序的机器，种子就是投入机器的原料。同样的原料，按照同样的规则处理，就能得到同样的结果。公开种子后，其他人可以复算，检查曲线参数是否确实按公布的步骤生成。\u003c/p\u003e\u003cp data-vmark=\"7dca\"\u003e谜题源于 2000 年纳入美国数字签名标准的一","tags":[],"cluster_size":1,"ts":"2026-10-16T22:53:05"},{"id":34026,"title":"微软发布 Win11 多预览通道新版更新：更新 XBOX 游戏界面，Windows Hello 自动调节亮度","url":"https://www.ithome.com/1/014/189.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"0000\"\u003eIT之家 10 月 17 日消息，微软昨天（10 月 16 日）发布博文，邀请 Windows Insider 多个预览频道成员，测试适用于 Windows 11 的多版本预览更新，各频道版本如下：\u003c/p\u003e\u003cul class=\" list-paddingleft-2\"\u003e\u003cli\u003e\u003cp data-vmark=\"0001\"\u003eBeta 通道：Build 26220.9739（26H2）、Build 28020.3262（26H1）\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data-vmark=\"0002\"\u003eExperimental 通道：Build 26340.9750（26H2）、Build 28120.3272（26H1）\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp data-vmark=\"0003\"\u003eRelease Preview 通道：Build 26200.9807 / 26300.9807（25H2/26H2）、Build 28000.3351（26H1）\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp data-vmark=\"0004\"\u003e本次更新同步推出了搭载全新 \u003cstrong\u003eNVIDIA RTX Spark\u003c/strong\u003e 芯片的 Windows 11 设备系列，并带来了两项重要新功能更新。\u003c/p\u003e\u003cp data-vmark=\"0005\"\u003eIT之家附 Windows","tags":[],"cluster_size":1,"ts":"2026-10-16T22:28:40"},{"id":34027,"title":"OpenAI又披露智能体“越线”：在训练中未经授权动用他人测试币 - 财联社","url":"https://news.google.com/rss/articles/CBMiSEFVX3lxTE9nRFVqcHpKVkx2a0RpdVJxdF85X0VFSld3eG81dzVYdHF0a2FGdjRWOXBiam5GUk9WOWhDNDZ1VFhVZ18tNGtTbg?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE9nRFVqcHpKVkx2a0RpdVJxdF85X0VFSld3eG81dzVYdHF0a2FGdjRWOXBiam5GUk9WOWhDNDZ1VFhVZ18tNGtTbg?oc=5\" target=\"_blank\"\u003eOpenAI又披露智能体“越线”：在训练中未经授权动用他人测试币\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f , they cannot clearly distinguish knowledge transfer from task memorization. Our key insight is the Core-Gen principle. Core tasks are related tasks that share a functional interaction and provide source knowledge, while a Gen task is a novel tar","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33850,"title":"When to Ask for Help: A Decision-Theoretic Account and Measurement Standard for Slow-Module Scheduling in Dual-System Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.21160","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21160v1 Announce Type: new \nAbstract: Dual-system vision-language-action (VLA) models pair a high-frequency fast policy with a slow, expensive module, and published trigger mechanisms for invoking it lack a shared objective, measured costs, and any standard separating schedule quality from module quality. We provide the missing account: invocation is formalized as a calibrated decision problem whose fixed-ratio, fixed-budget, and history-gated schedules are degenerate cases of one quantity, the Value of Intervention (VoI); a renewal baseline proves the optimal schedule periodic unde","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33849,"title":"KODA: Kinematics--Observation Data Alignment for Humanoid Learning from Human Egocentric Demonstration","url":"https://arxiv.org/abs/2610.21152","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21152v1 Announce Type: new \nAbstract: Training humanoid whole-body vision-language-action (VLA) policies requires costly robot demonstrations with aligned robot-view observations and controller-compatible whole-body state-action labels. Egocentric human demonstrations offer scalable supervision but have misaligned views and sparse motion cues. Existing approaches either pretrain policies that still require robot data for adaptation or generate controller-specific commands that limit reuse. Conversion also requires robot-view observations aligned with the generated whole-body motion.","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33848,"title":"Manifold Generative Annealing for Contact Constraint-aware Impedance Control with Reinforcement Learning Prior","url":"https://arxiv.org/abs/2610.21140","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21140v1 Announce Type: new \nAbstract: Contact-rich robotic tasks require coordinated motion and impedance under uncertain interaction dynamics and physical constraints. While recent methods on learned policies provide useful interaction strategies, they may fail when contact conditions differ from those encountered during training. Model-based generative methods show promising receding-horizon trajectories optimization results, but often lack structured behavioral guidance and refinement that jointly accounts for constraint geometry and actual contact responses. To this end, we prop","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33847,"title":"MoCaP: Mobile Code-as-Policies for Zero-Shot Mobile Manipulation from Passive Human Videos","url":"https://arxiv.org/abs/2610.20998","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20998v1 Announce Type: new \nAbstract: Passive human videos of everyday activity offer robots access to a massive amount of human experience without requiring a demonstration for each task. However, using this experience requires recovering knowledge from unstructured video recordings and adapting it to a different body (i.e., the robot). To overcome these challenges, we present mobile code-as-policy (MoCaP), an agentic framework that turns passive human video recordings into guidance for an end-to-end mobile manipulation policy. MoCaP extracts spatial memory and cues of how people p","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33846,"title":"When a robot can trust reversing wind to find an odour source","url":"https://arxiv.org/abs/2610.20970","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20970v1 Announce Type: new \nAbstract: A wind-derived heading can guide a robot towards an odour source even after the wind reverses, but its reliability depends on the plume's transport history. On a quadruped initially facing the source, holding the initial heading reached it in every reversing-wind trial, whereas comparison controllers never settled there. An exact geometric condition links heading correctness to net odour transport, and simulations separate sensing error from departures from nominal flow. Where the alternating wind directions are too close for reversal alone to p","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33845,"title":"SOMA: Stack-of-Objects Manipulation using a Quadruped Robot","url":"https://arxiv.org/abs/2610.20968","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20968v1 Announce Type: new \nAbstract: Executing heavy-duty physical manipulation in unpredictable environments remains a major challenge for quadrupedal robots lacking dedicated manipulators. This paper presents SOMA, a hierarchical reinforcement learning framework for whole-body non-prehensile manipulation of multi-object stacks using a quadruped robot. Unlike traditional methods restricted to two-dimensional planar pushing, SOMA integrates explicit robot base-height control, unlocking full three-dimensional pushing strategies. This capability enables the quadruped to manipulate co","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33844,"title":"Line-Augmented cuVSLAM: Robust Visual Odometry in Low-Texture Environments","url":"https://arxiv.org/abs/2610.20958","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20958v1 Announce Type: new \nAbstract: Autonomous mobile robots in warehouses and production facilities operate in precisely the environments that defeat point-feature visual odometry: featureless aisles, uniform walls, repetitive racking and specular floors. Such environments are, however, rich in straight-edge structure: rack uprights, door frames, wall junctions and cabinet outlines present high-contrast linear edges stable across wide viewpoint changes. A line-feature extension to cuVSLAM, a CUDA-accelerated visual-SLAM system, is presented that recovers this signal. Lines are pa","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33843,"title":"LEAP: Gradient Flow Augmented Lagrangian Trajectory Optimization for Contact Constrained Robots","url":"https://arxiv.org/abs/2610.20936","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20936v1 Announce Type: new \nAbstract: Generating dynamically feasible motions for legged and manipulating robots requires solving a large, nonlinear, non-convex optimal control problem (OCP) in which contact wrenches must satisfy friction-cone constraints throughout the motion, not only at isolated instants. Existing solvers are sensitive to the initial guess and scale poorly with the number of joints. This paper introduces LEAP, which transcribes the OCP with pseudospectral collocation and, instead of a Newton or SQP solve, integrates a primal--dual gradient flow of a Powell--Heste","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33842,"title":"Planning to Learn: Real-Time Robust Adaptive Control on the GPU with Guaranteed Future Learning","url":"https://arxiv.org/abs/2610.20925","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20925v1 Announce Type: new \nAbstract: Robust adaptive control is vital for keeping robots safe while actively reducing uncertainty in unfamiliar settings. However, traditional methods are often conservative since they fail to account for guaranteed future parameter learning during planning and struggle to scale to high-dimensional systems. In this work, we present A-SLS, a learning-aware robust adaptive model predictive control (RAMPC) framework based on system-level synthesis. A-SLS forecasts future parameter uncertainty and preserves correlations between process disturbances, para","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33841,"title":"EgoJEPA: Beyond Retargeting for Dexterous Manipulation from Egocentric Videos","url":"https://arxiv.org/abs/2610.20904","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20904v1 Announce Type: new \nAbstract: Egocentric human videos offer a scalable alternative to costly robot demonstra- tions, yet transferring their manipulation priors to robot control remains chal- lenging. The commonly adopted retargeting-based approaches convert human wrist and finger poses into embodiment-specific action commands through hand- crafted geometric mappings. However, such mappings require meticulous recal- ibration across different embodiments and risk propagating hand-tracking errors into downstream robot control pipelines. To this end, we propose EgoJEPA, a three-","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33840,"title":"TGrasp6D: Task-Informed Vision-Language Priors and Pose Refinement enable Zero-Shot Task-Oriented 6DoF Grasping","url":"https://arxiv.org/abs/2610.20901","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20901v1 Announce Type: new \nAbstract: Task-Oriented Grasping (TOG) has emerged as an important skill for purposeful robotic manipulation. Given the task of using a knife to \"slice bread,\" a robot must choose to grasp from the handle, whereas for \"hand[ing] the knife over,\" it is preferable for the handle to remain unobstructed for safe handoff. Current approaches for TOG either focus on 2D planar grasping, remain limited by their reliance on task-agnostic grasp generators, or are constrained by reliance on finite, manually-annotated, task-specific grasp datasets that cannot cover al","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33839,"title":"BubbleCBF: Constructive Safety for Second-Order Systems and Application to Autonomous Robot Navigation in Unknown Environments","url":"https://arxiv.org/abs/2610.20895","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20895v1 Announce Type: new \nAbstract: Satisfying safety constraints for systems with second-order dynamics is challenging because a position constraint may require infeasible deceleration. Higher-order control barrier functions (CBFs) provide an approach for expressing safety conditions for such systems but feasibility depends on the system dynamics and available control authority. We develop a constructive approach for designing feasible safety constraints for second-order control-affine systems. Starting from a signed distance function (SDF), we construct collision-free spheres, i","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33838,"title":"Optimally Trading Energy for Information through Speed Trajectory Optimization of Sustainably Powered Mobile Robots","url":"https://arxiv.org/abs/2610.20875","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20875v1 Announce Type: new \nAbstract: Sustainably powered mobile robots enable long-duration observational missions by harvesting energy from the environment. However, effective autonomy requires the robots to make decisions as to how to allocate this energy to maximize information quality over time. In this paper, we study a persistent (infinite-horizon) speed trajectory optimization problem that is posed as a periodic optimal control problem in which a robot repeatedly traverses a fixed closed path, coupling a super-linear propulsion cost with dynamic information gain and decay. U","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33837,"title":"A Phenomenology of Neural Geometry in Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.20840","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20840v1 Announce Type: new \nAbstract: Robotic manipulation is inherently geometric, but what shape does the world take inside the policy that performs it? Prior work on vision-language-action (VLA) policies establishes that task-relevant variables are linearly readable from activations, yet readability certifies only that a variable is present and says nothing about the shape its values trace, which may be curved and multi-dimensional. Using controlled sweeps, natural rollouts, linear probes, and activation interventions, we build a taxonomy of seven task-relevant concepts in VLA mo","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33836,"title":"Persistent Profile-Guided Reset-Free Recovery Improves Final Gait Selection after Irreversible Leg Damage","url":"https://arxiv.org/abs/2610.20838","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20838v1 Announce Type: new \nAbstract: Damage-recovery algorithms often rank gaits from short trials, yet a gait that performs well briefly may not remain effective during continued execution. In reset-free recovery, each trial also changes the physical state inherited by the next. We introduce persistent profile-guided reset-free recovery (PGRR), which predicts multiple outcomes over repeated gait execution and uses conservative uncertainty-aware estimates to guide short online probes without resetting the robot. Across 108 matched MuJoCo tasks spanning leg amputation, distal fractu","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33835,"title":"Feasibility Ceilings Before Learning: Sizing and Timing Bounds for Drone-Mesh Interception","url":"https://arxiv.org/abs/2610.20823","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20823v1 Announce Type: new \nAbstract: A mesh of interceptors defending a fixed site must spread over the predicted arrival point of an approaching object. This is a recurring task in multi-agent robotics: N agents, each covering a disc of radius r, spread over a probability density so that a point drawn from it falls within some agent's disc. We give closed forms for the quantities that bound performance before any policy is chosen, and validate each by Monte Carlo. The uncertainty of a point predicted by extrapolating a noisy linear track follows from least-squares variance propaga","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33834,"title":"Multi-Dimensional Featurizers Yield Fine-Grained Steering and Data Shaping in Robot Foundation Models","url":"https://arxiv.org/abs/2610.20767","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20767v1 Announce Type: new \nAbstract: Can better feature discovery improve control over robot behavior through internal interventions and training data? Recent work in vision and language models reveals multidimensional features, motivating block-sparse featurizers (BSFs), which represent each feature in a low-dimensional subspace. We investigate whether recovering this structure provides an interpretable interface for steering vision-language-action models and shaping the data from which they learn. We show that BSFs recover several multi-dimensional task-relevant features underlyi","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33833,"title":"Causal Analysis of Robot Foundation Models Enables Efficiency Gains","url":"https://arxiv.org/abs/2610.20750","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20750v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models are a promising approach to general purpose robot manipulation. While the internal computation of vision-language models, which compose the backbone of VLAs, has been studied extensively, less is known about how their perceptual and semantic representations are transformed into action in VLA models. We study this question mechanistically in three frontier VLA models ($\\pi_{0.5}$, MolmoAct2, and MolmoBot) by analyzing the // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
