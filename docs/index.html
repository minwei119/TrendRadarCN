news.google.com/rss/articles/CBMia0FVX3lxTE1hZ1NzWHVMR09NYTFXVW5tOE50WHo3blc2QXUwZmdEVklZQWV6YlhtSjBFcVhhdDh3aVhOdG1ST3p4SGVSdXNjaHMzU0RuZDBrWTZQRFNGcS1aVjZBdUlteGxrTnVkNG9wZzRn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMia0FVX3lxTE1hZ1NzWHVMR09NYTFXVW5tOE50WHo3blc2QXUwZmdEVklZQWV6YlhtSjBFcVhhdDh3aVhOdG1ST3p4SGVSdXNjaHMzU0RuZDBrWTZQRFNGcS1aVjZBdUlteGxrTnVkNG9wZzRn?oc=5\" target=\"_blank\"\u003eAccess Advance 与阿里巴巴宣布阿里巴巴进一步扩大参与视频分发专利池\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eBusiness Wire\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T00:00:00"},{"id":6925,"title":"华尔街见闻早餐 | 2026年7月2日","url":"https://wallstreetcn.com/livenews/3127660","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Meta云转向，美光重挫超10%，软件股逆势走强，纳指100跌1.5%；金龙中国指数四连涨；黄金反弹；国际油价跌超1%。\n\n美联储主席沃什：通胀近四周降温，AI正重塑经济，前瞻指引失去必要性。\n\n美伊在多哈举行间接会谈，特朗普：两国“处得很好”。\n\n“小非农”降温！美国6月ADP新增就业人数降至9.8万，远低于预期。\n\n美国6月ISM制造业连续第六个月扩张，成本指标创近四年最大降幅。\n\n欧元区6月CPI降至2.8%：加息迫切性骤减，欧央行步入“看数据”中立期。\n\n王毅同美国国务卿鲁比奥通电话。\n\n中国6月RatingDog制造业PMI连续七个月扩张，二季度创2020年来最强季度表现。\n\n美墨加协定生变：美国放弃续签转向逐年审查，北美供应链不确定性升温。\n\n报道称Meta筹划进军云计算市场，以出售富余的AI算力资源，Meta股价大涨8.8%。AI基础设施股重挫，市场开始担心算力过剩。\n\n跨越安全红线后重启：Anthropic Fable 5全面接入GitHub Copilot，押注长周期自主编程。\n\n马斯克要造手机？报道：SpaceX展示类似手机的AI设备原型，比iPhone还要薄。\n\n提醒：周四将公布美国6月非农就业报告，周五美股因假期休市。","tags":[],"cluster_size":2,"ts":"2026-07-01T23:30:47"},{"id":6926,"title":"上半年券商金股指数逾八成上涨","url":"https://wallstreetcn.com/livenews/3127651","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股2026年上半年行情日前收官，券商金股指数整体表现也随之呈现在投资者面前。Wind数据显示，其收录的35只券商金股指数上半年有29只实现正收益，涨幅最高的平安证券金股指数上半年累计上涨46.51%，招商证券金股指数、东兴证券金股指数、浙商证券金股指数等涨幅相对靠前。\n\n展望7月行情，业内人士认为，科技板块内部业绩分化将进一步放大行情波动，但市场并无系统性风险，布局建议聚焦“成长扩散+大盘价值”两大方向，一端关注AI主线引领下的成长扩散行情，另一端关注性价比较高的大盘价值风格。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:56:55"},{"id":6927,"title":"同业股权扫货热度升温，中小银行改革成重要推手","url":"https://wallstreetcn.com/livenews/3127649","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，宁夏银行受让宁夏黄河农商银行7.635%股权事项获批准，成为后者第三大股东。这并非孤例。今年以来，厦门国际银行增持廊坊银行、中信银行竞得云南红塔银行股权等案例接连落地。业内人士表示，从入股异地银行实现跨区展业、主发起行增持村镇银行，到战略投资同业股权，银行参股同业情形日趋多元，此举已成为银行主动优化资产配置、完善区域战略布局、拓展业务版图的重要手段。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:49:02"},{"id":6928,"title":"超微电脑（SMCI）美股盘后涨幅迅速扩大至超过1.9%，该公司发布客户告知书。\n\n7月1日，该公司股价收跌5.73%，报27.65美元。","url":"https://wallstreetcn.com/livenews/3127648","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"超微电脑（SMCI）美股盘后涨幅迅速扩大至超过1.9%，该公司发布客户告知书。\n\n7月1日，该公司股价收跌5.73%，报27.65美元。","tags":[],"cluster_size":1,"ts":"2026-07-01T22:48:18"},{"id":6929,"title":"一级半市场成超额“富矿”，公募定增策略浮盈分化","url":"https://wallstreetcn.com/livenews/3127643","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"一级半市场正在成为公募机构重要的超额收益来源。从公募机构定增的“半年考”成绩来看，不少基金公司浮盈颇丰，传统定增大户、头部基金公司在定增方面收益率居前，还有一些中型机构凭借“少而精”定增策略赚得盆满钵满，但也有少数机构旗下产品被个股表现所拖累，定增项目处于浮亏状态。公募排排网数据显示，截至6月25日，公募机构今年以来参与A股定增获配金额已超过330亿元，较去年同期增长超200%，整体浮盈超过80亿元。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:42:03"},{"id":6930,"title":"“翻倍基”全面爆发，卡位科技投资各显神通","url":"https://wallstreetcn.com/livenews/3127641","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在2026年上半年的科技单边行情下，公募基金业绩迎来大面积爆发。Wind数据显示，上半年回报率超100%的“翻倍基”数量达240只以上（仅统计主份额），创历年之最。此前，在上半年出现“翻倍基”的年份还是2015年和2007年。结合持仓来看，算力、半导体等AI硬件板块是上半年公募机构投资的制胜关键。业内人士表示，公募机构普遍前瞻布局AI、半导体等高景气细分赛道，从均衡泛权益转向赛道精细化卡位，依靠细分产业研究打造业绩亮点，形成多点开花的投研布局转变。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:36:52"},{"id":6931,"title":"成本上涨与市场需求双轮驱动，半导体开启年内第二轮涨价","url":"https://wallstreetcn.com/livenews/3127639","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，芯联集成、斯达半导、扬杰科技、聚辰股份等多家半导体公司向客户发出了涨价函，价格上调幅度为15%至25%。据不完全统计，超过20家国内外半导体公司在上半年发布了第一轮涨价函。目前，相关公司均宣布了新一轮涨价通知。细看各家公司的涨价通知函，成本上涨、AI需求爆发是调价的核心诱因。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:30:12"},{"id":6932,"title":"科技主题表现突出，约七成权益类保险资管产品上半年实现正回报","url":"https://wallstreetcn.com/livenews/3127638","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，科技板块表现强势，带动A股市场走强。受此推动，约七成权益类保险资管产品实现正投资回报。但在结构性行情演绎下，权益类保险资管产品投资回报呈现分化态势，科技主题产品表现亮眼，而红利类主题产品表现相对黯淡。Wind数据显示，2026年上半年，在有年化回报数据的约180只权益类保险资管产品中，实现正投资回报的超过120只，占比约七成。从年化回报排行榜来看，科技主题产品明显跑赢其他类型。 （上证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:28:26"},{"id":6933,"title":"A股IPO保荐半年盘点：三大券商领跑，中小投行借北交所突围","url":"https://wallstreetcn.com/livenews/3127635","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，A股IPO保荐市场格局发生了一些新变化。Choice数据显示：以正式挂牌上市为口径，上半年共有71家公司登陆A股，较去年同期的51家增长39.22%；募资净额合计639.64亿元，较去年同期的334.46亿元增长91.25%。在市场整体复苏的背景下，国泰海通、中金公司、中信证券强势领跑，而东吴证券、国金证券等中小券商则凭借深耕北交所业务实现差异化突围。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-01T22:24:01"},{"id":6934,"title":"阿里巴巴同意支付6亿美元与美政府和解涉非法药品销售指控 - VanPeople","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBDT0hiQy1BeXhFTU51VmZnTjU1bElGTUxlcDdsTjJOV0pHZ2trWW1NaG91NFNDWkNadjhKdUtKdGY3ZUZqRkwyU2hEWUg0LUJ6?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBDT0hiQy1BeXhFTU51VmZnTjU1bElGTUxlcDdsTjJOV0pHZ2trWW1NaG91NFNDWkNadjhKdUtKdGY3ZUZqRkwyU2hEWUg0LUJ6?oc=5\" target=\"_blank\"\u003e阿里巴巴同意支付6亿美元与美政府和解涉非法药品销售指控\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eVanPeople\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T21:46:19"},{"id":6935,"title":"周三（7月1日）纽约尾盘，标普500股指期货最终跌0.30%，道指期货跌0.12%，纳斯达克100股指期货跌1.58%。\n\n罗素2000股指期货跌0.39%。","url":"https://wallstreetcn.com/livenews/3127625","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（7月1日）纽约尾盘，标普500股指期货最终跌0.30%，道指期货跌0.12%，纳斯达克100股指期货跌1.58%。\n\n罗素2000股指期货跌0.39%。","tags":[],"cluster_size":1,"ts":"2026-07-01T21:11:24"},{"id":6936,"title":"在美銷售非法藥品 阿里認罰6億美元換和解 - 大纪元","url":"https://news.google.com/rss/articles/CBMiX0FVX3lxTFB6MTVobFVJdmZVZFM2SFhwWTRHWUN2ZHhvQ04yV2tRZV9qaTZUY2dLek5vdzJ3RVJjRWh0RmJqS2Z6TTkzRThteVYtMEpRWG9BaDA2ZDQxVDdYSTd0ZEVJ0gFkQVVfeXFMT05DZWV0UV9ELUNoS3o3VVJHSTJHejhUR2dsQWR1QWlPaE1aTEVCRm9VLWRGS1ZvM3FfO 模型 AMALIA","url":"https://www.ithome.com/0/971/439.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4d70\"\u003eIT之家 7 月 2 日消息，葡萄牙政府当地时间本月 1 日宣布，\u003cstrong\u003e首个基于欧洲葡萄牙语开发的开源大语言模型 AMALIA 正式发布\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"a4ed\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/2c649fa5-ea57-41a1-846f-ff445721ad15.jpg?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"960\" data-weibo=\"0\" data-vmark=\"c9c9\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"78d2\"\u003eIT之家了解到作为葡萄牙的国家战略项目，AMALIA 模型由来自葡萄牙多家学术机构的 60 余位研究人员历时 18 个月开发而成，先期投资 550 万欧元，利用了 Deucalion、\u003ca href=\"https://www.ithome.com/0/741/197.htm\" target=\"_blank\"\u003eMareNostrum 5\u003c/a\u003e 等算力基础设施。\u003c/p\u003e\u003cp data-vmark=\"f624\"\u003e其开发的首个阶段利用约","tags":[],"cluster_size":1,"ts":"2026-07-02T01:30:15"},{"id":7068,"title":"联合国专家组警告：AI 能力进步速度已超过科学认知","url":"https://www.ithome.com/0/971/436.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ca9d\"\u003eIT之家 7 月 2 日消息，联合国官网 1 日公报，由 40 名顶尖科学家和专家组成的联合国 AI 独立科学小组发布首份报告，警告 AI 快速发展在为全球各国和民众创造巨大机遇的同时，也带来了不容忽视的风险。\u003c/p\u003e\u003cp data-vmark=\"fe83\"\u003e报告指出，政策制定者需要以科学证据为基础治理 AI，AI 能力的进步速度\u003cstrong\u003e已经超过科学界的认知\u003c/strong\u003e，也超过各国政府调整政策的速度。面对高度自主的 AI 系统，目前可用的控制手段仍然很少。\u003c/p\u003e\u003cp data-vmark=\"eba0\"\u003e小组联合主席约书亚 · 本吉奥指出，越来越多证据表明 \u003cstrong\u003eAI 可能出现欺骗行为\u003c/strong\u003e。随着 AI 能力继续增强，科学界无法保证 AI 不会“自行或因恶意使用者”造成灾难性后果。\u003c/p\u003e\u003cp data-vmark=\"7a68\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2024/10/1e49cd7b-4b1b-4d78-b322-580914f2f7fa.png?x-bce-process=image/watermark,text_QUnnlJ_miJA,type_RlpMYW5UaW5nS","tags":[],"cluster_size":1,"ts":"2026-07-02T01:22:07"},{"id":7069,"title":"问界上半年累计交付同比增长10.2%；大模型技术专家孙天祥加入百度丨早资道 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNY0xTZUVUQnBhS0xBSjR3dDlIVG56YVFsTXgtQWNjdkhvSE8tR eams 下月将推 Facilitator，开会时 AI 辅助解答你的疑惑","url":"https://www.ithome.com/0/971/418.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"0517\"\u003eIT之家 7 月 2 日消息，科技媒体 Windows Latest 昨日（7 月 1 日）发布博文，报道称微软计划 8 月为 Microsoft Teams 推出 Facilitator 会议协调助手，\u003cstrong\u003e可在会议中实时处理对话等。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"9370\"\u003eIT之家援引博文介绍，Facilitator 定位 AI 会议辅助功能，可在会议期间分析对话内容，识别提问、未解答问题或不确定表达，并在会议聊天中给出与当前议题相关的答案。典型应用场景是多人会议中，部分参会者未及时获得解释后，由系统补充信息。\u003c/p\u003e\u003cp data-vmark=\"8b7f\"\u003e微软指出 Facilitator 功能默认情况下处于禁用状态，且不会在会议中直接发言。在用户主动启用后，在会议场景下，管理员可控制其显示范围，而用户也能个性化定制是否启用。\u003c/p\u003e\u003cp data-vmark=\"3b85\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/3d9c2632-97e5-44b6-b91d-4f9a24f8448f.jpg\" w=\"1440\" h=\"835\" alt=\"Microsoft Teams F","tags":[],"cluster_size":1,"ts":"2026-07-02T00:40:36"},{"id":7078,"title":"腾讯、网易前员工组队，把蔡浩宇押注的AI世界成本砍下来80% - 36Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTFB4WGJnTEh3eThXeW1Fdl95VzNwSHVidTlEaWFCZEVHQjNMOFh6Rll6X09qSk5WVXpORlZ1eHpDQlJzRVdJaGp5U1ZORXJ1clE?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTFB4WGJnTEh3eThXeW1Fdl95VzNwSHVidTlEaWFCZEVHQjNMOFh6Rll6X09qSk5WVXpORlZ1eHpDQlJzRVdJaGp5U1ZORXJ1clE?oc=5\" target=\"_blank\"\u003e腾讯、网易前员工组队，把蔡浩宇押注的AI世界成本砍下来80%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T00:38:58"},{"id":7079,"title":"专访美图 CEO 吴欣鸿：做 AI 产品，是一场难以提前策划的游戏 - 36Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE82QmlkTVp2bHNycXk0TEtyS2lFa2VBUl84dDdLTlNSQnlRWmlHaG1lbVBsTUI4NDZLWmhyVzZBLXdPWkk1M0hFQV9XUkVCaGM?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE82QmlkTVp2bHNycXk0TEtyS2lFa2VBUl84dDdLTlNSQnlRWmlHaG1lbVBsTUI4NDZLWmhyVzZBLXdPWkk1M0hF jh6aFAybGJtd1YzajJkUDE2VVl0Rkp4UnlvNA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE5VRU9SUjBwQktBcDFyeUJ2S3k0TEppYW1wSTN1R2ZLbXdfUG1zRlpvNGRLeWdOYUduaWJEUFBzbm13YkxLcjh6aFAybGJtd1YzajJkUDE2VVl0Rkp4UnlvNA?oc=5\" target=\"_blank\"\u003e美国解除出口管制后Anthropic再次开放Claude Fable 5模型访问- AI 人工智能\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ecnBeta.COM\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T00:05:00"},{"id":7088,"title":"苹果 Safari 技术预览版 247 引入 MCP 服务，AI 智能体加速网页开发和调试","url":"https://www.ithome.com/0/971/411.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"e403\"\u003eIT之家 7 月 2 日消息，苹果 WebKit 博客昨日（7 月 1 日）发布博文，\u003cstrong\u003e宣布在 Safari 技术预览版 247 中，引入支持 MCP 服务器，可用于加速开发和调试流程。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"55b8\"\u003eIT之家翻译苹果博文内容如下：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"a546\"\u003e我们 [指苹果] 知道在编码过程中，智能体扮演越来越重要的角色，Safari MCP 服务器通过连接到 Safari 浏览器窗口，让智能体更充分了解你的代码在浏览器中的实际呈现。\u003c/p\u003e\u003c/blockquote\u003e\u003cp data-vmark=\"715b\"\u003eMCP 直译为模型上下文协议，是一种开放标准，用于让兼容的 AI 智能体连接外部工具、服务和数据源，典型应用包括连接代码仓库、团队协作平台、数据库、本地文件和浏览器开发工具，以读取信息或执行授权操作。\u003c/p\u003e\u003cp data-vmark=\"b508\"\u003e在 Safari Technology Preview 247 中完成配置后，编程智能体可检查网页，访问控制台日志和网络请求，抓取截图，并与页面元素交互。\u003c/p\u003e\u003cp data-vmark=\"d394\"\u003e苹果列出的用途包括调试网站、识别 Safari 兼容性问题、性能分析、可访问性","tags":[],"cluster_size":1,"ts":"2026-07-02T00:04:23"},{"id":7089,"title":"苹果 iPad、MacBook 涨价后消费者被要求补差价？多家授权店承诺按原预定价结算","url":"https://www.ithome.com/0/971/410.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"e014\"\u003eIT之家 7 月 2 日消息，苹果公司 6 月 25 日上调全球多个市场的 Mac、iPad 等多款硬件产品价格。苹果表示，由于 AI 数据中心的迅猛扩张导致存储需求激增，内存和存储芯片成本大幅上涨，公司此前一直在内部消化成本压力，但目前已不得不开始上调多款产品售价。\u003c/p\u003e\u003cp data-vmark=\"36a1\"\u003e苹果现任 CEO 蒂姆 · 库克此前将本轮存储供需失衡形容为“百年一遇的洪水”。市场调查机构 Counterpoint Research 的数据显示，过去三个季度内存和存储芯片价格已涨至原来的四倍。\u003c/p\u003e\u003cp data-vmark=\"2e7d\"\u003e此次调价为全球性涨价，iPhone、Apple Watch、AirPods 暂时不在涨价名单内。中国区官网更新后，各机型价格均有不同程度上调：MacBook Air 起售价从 8499 元上调至 9999 元，涨价 1500 元；14 英寸 MacBook Pro 起售价从 13499 元上调至 15999 元，涨价 2500 元；iPad Air 起售价从 4799 元上调至 5999 元，涨价 1200 元；iPad Pro 从 8999 元上调至 10799 元，涨价 1800 元。整体来看，此次涨价幅度在 16% 至 25% 不等，是苹果近年来规模最大的一次全球性终端调价。\u003c/","tags":[],"cluster_size":1,"ts":"2026-07-02T00:03:30"},{"id":7092,"title":"当美国AI开始自我设限， 中国大模型的窗口期来了 - 虎嗅","url":"https://news.google.com/rss/articles/CBMiVEFVX3lxTE9ydjA0aFp0eVRiY2NEVzhuVXpCR0Y3TUllZmNkNGpNcTE2S1lVUmVHYmgyVFZBVERTVUltVkE0cFBXZW5TOG5FZ01helFNMzc0M1JyaA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVEFVX3lxTE9ydjA0aFp0eVRiY2NEVzhuVXpCR0Y3TUllZmNkNGpNcTE2S1lVUmVHYmgyVFZBVERTVUltVkE0cFBXZW5TOG5FZ01helFNMzc0M1JyaA?oc=5\" target=\"_blank\"\u003e当美国AI开始自我设限， 中国大模型的窗口期来了\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e虎嗅\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T00:00:00"},{"id":7091,"title":"智能体渗透加速，老员工正在大幅贬值 - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1xV19PU0pneFBwaG8zV3RBUmozTjBWa2lNZTBJX1pPVjhjX1BaUVBGLTViVGk1VmN1aHdZVGJIZGpkX2VybldYM3pJdDhHS2FndlN3?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1xV19PU0pneFBwaG8zV3RBUmozTjBWa2lNZTBJX1pPVjhjX1BaUVBGLTViVGk1VmN1aHdZVGJIZGpkX2VybldYM3pJdDhHS2FndlN3?oc=5\" target=\"_blank\"\u003e智能体渗透加速，老员工正在大幅贬值\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-02T00:00:00"},{"id":7090,"title":"工业智能体，谁真正跨过了死亡谷？ | 榜单征集 - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1Sa3hVQUxPVXVhMFVWanFiazhRbVFacjdwbFBoV2pIM1pMNkthcnZyUm5Sc2FvOHZlODNYa3RNc0tQdDhmSExBYmFZZEQteHNLZ1RR?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.c s":[],"cluster_size":1,"ts":"2026-07-01T23:56:12"},{"id":7095,"title":"华为联合上海电信落地 5G-A×AI 大上行样板点：实测峰值速率 1Gbps，中心城区年底实现 20Mbps 上行连续覆盖","url":"https://www.ithome.com/0/971/407.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"d165\"\u003eIT之家 7 月 2 日消息，华为官昨日发文称，在 2026 年世界移动通信大会 · 上海启幕前夕，中国电信股份有限公司上海分公司联合华为在上海徐汇西岸美术馆打造了 5G-A×AI 大上行样板点。\u003c/p\u003e\u003cp data-vmark=\"a3a6\"\u003e据华为介绍，该样板点以智慧文旅场景为载体，集中展示了大上行网络的技术优势与商用价值。西岸美术馆坐落于黄浦江西岸艺术集聚区，11.4 公里滨江艺术走廊汇聚近 20 座文化场馆，人流密集且建筑墙体遮挡多，是检验移动网络上行能力的典型复杂场景。样板点落地于馆内“双手知道”纤维艺术特展现场，依托上海电信与华为建成的全国首张 5G-A×AI 大上行商用网络，对 AI 眼镜、多模态 AI 交互等场景进行了系统性实景演示。\u003c/p\u003e\u003cp data-vmark=\"3204\"\u003e过去三十余年，下行速率几乎是衡量移动网络的唯一标尺。进入 Mobile AI 时代，AI 手机、AI 眼镜、具身智能机器人等终端设备的迅速普及，以及 AIGC 实时生成、多模态实时交互、高清视频回传等场景的涌现，对网络上行带宽、传输稳定性、低时延及并发能力提出了更高要求。\u003c/p\u003e\u003cp data-vmark=\"759e\"\u003e2026 年 3 月，在西班牙巴塞罗那举行的 2026 年世界移动通信大会（MWC 2026）期间，GSMA 联合领先运营商及全","tags":[],"cluster_size":1,"ts":"2026-07-01T23:54:04"},{"id":7096,"title":"软银据悉重启以OpenAI股份为抵押贷款100亿美元的谈判 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMiTkFVX3lxTE0wR1BpMU12SGtILXpiSEs1elpVNDhKNncxZTFxMVRVeWY2OG1pbU8wWHJoczlqVDZyMTkxUGtIWDdkd3pLdVZBNFJYYlUyQQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE0wR1BpMU12SGtILXpiSEs1elpVNDhKNncxZTFxMVRVeWY2OG1pbU8wWHJoczlqVDZyMTkxUGtIWDdkd3pLdVZBNFJYYlUyQQ?oc=5\" target=\"_blank\"\u003e软银据悉重启以OpenAI股份为抵押贷款100亿美元的谈判\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T23:44:39"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#0891b2","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":6824,"title":"SpaceX has an AI device prototype, and it sure sounds phone-ish","url":"https://techcrunch.com/2026/07/01/space more faithfully by the activation subspace it induces than by the singular geometry of the weight matrix, and develop function-space protection, instantia","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6880,"title":"Knowledge Distillation from Large Reasoning Models to Compact Student Models: A Case Study on the John O Bryan Mathematics Competition","url":"https://arxiv.org/abs/2606.31048","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.31048v1 Announce Type: new \nAbstract: This paper investigates knowledge distillation from a large reasoning model (DeepSeek-R1) to a compact student model (Qwen2.5-7B). Using historical problems from the John O'Bryan Mathematics Competition at Northern Kentucky University (2011-2025), we build a Chain-of-Thought (CoT) training corpus through a dual-agent framework. The dataset is used to fine-tune the student model with Low-Rank Adaptation (LoRA) on Apple Silicon hardware using the MLX framework. The base Qwen2.5-7B model achieves 64.67% accuracy on competition problems, while the D","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6879,"title":"Warp RL: Reshaping Base Policy Distributions for Dynamics Adaptation","url":"https://arxiv.org/abs/2606.31043","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.31043v1 Announce Type: new \nAbstract: Residual reinforcement learning adapts a pretrained robot policy by learning an additive correction to its actions. While effective when adaptation amounts to shifting the base policy's action distribution, additive corrections cannot change the distribution's shape, scale, or state-dependent geometry -- limitations we formalize as wrong variance, miscalibrated confidence, and non-uniform correction. We show that these matter under dynamics shift: when the base distribution is geometrically mismatched to the shifted system, residual correction c","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6878,"title":"Teaching LLMs to Recommend and Defer in Underrepresented Epilepsy Care","url":"https://arxiv.org/abs/2606.31036","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.31036v1 Announce Type: new \nAbstract: Specialist epilepsy expertise is scarce in resource-constrained settings, making LLM-based decision support attractive for frontline clinicians managing longitudinal treatment. Such systems must adapt to local prescribing practice and know when to defer. We study this problem in Ugandan pediatric epilepsy care, predicting anti-seizure medication regimens from longitudinal unstructured clinic notes. Standard prompting achieves non-trivial agreement with physician prescriptions, but neurologist review shows that many errors reflect distribution-mi","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6877,"title":"OTCache: Optimal Transport for Geometry-Aware Caching in Diffusion Models","url":"https://arxiv.org/abs/2606.31026","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.31026v1 Announce Type: new \nAbstract: We propose OTCache, a training-free framework for accelerating diffusion sampling via caching schedule prediction. Existing graph-based caching methods reduce redundant computation by optimizing shortest-path objectives, but rely on an additive independence assumption, which often breaks down in the low NFE regime. To address this issue, OTCache models caching schedules across inference budgets as a smooth evolution in policy space, inspired by Optimal Transport (OT). The framework consists of three stages: (1) obtaining a high-fidelity \\textbf{","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6876,"title":"Offline Reinforcement Learning for Fluid Controls: Data-based Multi-observational Policy Extraction","url":"https://arxiv.org/abs/2606.31025","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.31025v1 Announce Type: new \nAbstract: Active flow control is a fundamental application in engineering. Recent advances in deep reinforcement learning have made progress in this field. However, the classical online RL approaches require extensive real-time interactions with the high fidelity environment, while each sensor configuration change necessitates whole policy retraining. All these factors result in prohibitive computational costs for real-world applications. In this work, we propose a novel offline RL framework that addresses both challenges through data-driven policy extrac","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6875,"title":"Estimating Supply Incrementality in Two-sided Marketplaces: A Causal Machine Learning Approach","url":"https://arxiv.org/abs/2606.30999","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30999v1 Announce Type: new \nAbstract: In two-sided marketplaces with heterogeneous products, it is important to understand the causal relationship between additional supply and marketplace outcomes, such as the total quantity transacted or transaction value in the marketplace. This paper studies a causal machine learning approach to estimating this relationship across product segments. We use the Airbnb marketplace as an example, focusing on the impact of additional listing supply on total bookings, but the methodology applies to other two-sided marketplaces. Our approach combines d","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6874,"title":"Multistage Defer Trees for Hybrid Interpretability: If at First You Can't Succeed, Tree Again","url":"https://arxiv.org/abs/2606.30995","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30995v1 Announce Type: new \nAbstract: Recent work has shown that well-optimized individual decision trees can match complex black box models in some settings, primarily in noisy domains. For the remaining settings, however, complex ensembled compositions of trees often achieve higher accuracy at the cost of interpretability, leaving practitioners with difficult modeling decisions along an accuracy-interpretability tradeoff. Ideally, we would like to classify as much of the data as possible with one or a small number of trees, achieving interpretability for most samples while maintai","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6873,"title":"Physics-informed Conditional Normalizing Flows for Angles-only Cislunar Orbit Determination","url":"https://arxiv.org/abs/2606.30936","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30936v1 Announce Type: new \nAbstract: Generative Astrodynamics is advanced in this work by extending generative modelling to an orbit determination problem in the cislunar environment. The task is formulated as conditional density estimation, aiming to infer the probability distribution of the initial state from angles-only measurements over short observation arcs. A normalising flow is trained on perturbed topocentric observations from Near Rectilinear Halo Orbits, enabling a flexible and potentially multimodal posterior representation. Given new measurements, the learned density i","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6872,"title":"Quality-Aware Modulation for Diffusion Transformers","url":"https://arxiv.org/abs/2606.30934","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30934v1 Announce Type: new \nAbstract: Modern text-to-image diffusion models, such as diffusion transformers (DiT), rely on timestep or prompt embeddings to modulate the strength of the denoising process in each timestep. While this modulation communicates the current noise level, it does not provide any quality-aware information, which can lead to generated images that are unaligned, visually inconsistent, and lacking in fidelity. In this paper, we propose the Quality Representation Module (QRM), a lightweight transformer module that learns a quality-aware representation based on ex","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6871,"title":"Personalizing Marketplace Policies with Competing Objectives and Constrained Experiments: Evidence from a Job Marketplace","url":"https://arxiv.org/abs/2606.30932","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30932v1 Announce Type: new \nAbstract: Two-sided marketplaces connect distinct user groups whose interests often conflict -- improving outcomes on one side could degrade the other side's experience. To address this challenge, we deploy an integrated framework for personalizing free-value thresholds -- a policy governing the scope of complimentary services for job listings -- across a two-sided job marketplace connecting millions of employers and job seekers. Our personalized policy delivers statistically significant and economically sizable lift in the target metric while respecting","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6870,"title":"Behavior Cloning is Not All You Need: The Optimality of On-Policy Distillation for Noisy Expert Feedback","url":"https://arxiv.org/abs/2606.30923","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30923v1 Announce Type: new \nAbstract: Imitation Learning is a natural framework for learning in sequential decision-making systems and has emerged as the dominant paradigm through which we understand language model training. A central puzzle is that, while in theory offline IL can be horizon-free and optimal, in practice online methods such as on-policy distillation often outperform offline methods such as supervised fine-tuning. We propose a noisy expert model to explain this gap, in which the learner only has access to a noisy version of the expert's policy, but wishes to compete","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6869,"title":"A Transferable Learned Temporal Prior for Transmission Reconstruction and Decision-Relevant Uncertainty in Real Outbreak Labels","url":"https://arxiv.org/abs/2606.30842","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30842v1 Announce Type: new \nAbstract: Outbreak transmission reconstruction treats epidemiological timing and transmission labels as deterministic ground truth; neither has been systematically evaluated. We trained a logistic regression temporal prior on eleven disease families, locked all parameters before accessing any target outbreak data, and applied it without refitting to a strict Andes virus (ANDV) parent-ranking benchmark of 29 tasks. The locked prior achieved mean reciprocal rank (MRR) 0.571 versus 0.274 and Top-1 accuracy 37.9% versus 13.8% against the best source-trained p","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6868,"title":"A Stationary-Distribution Theory for Triplet-Based Plateau Search in Random Forest Ensemble-Size Selection","url":"https://arxiv.org/abs/2606.30837","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30837v1 Announce Type: new \nAbstract: The number of trees is a central computational parameter in Random Forests: increasing it reduces finite-ensemble variability but increases training and prediction cost. Plateau-based tuning adapts this parameter through local comparisons of out-of-bag scores at a geometric triplet of tree counts. After the remaining hyperparameters have stabilized, however, the central triplet point need not converge to a deterministic value; instead, it fluctuates around a stationary regime.\n  This paper develops a stationary-distribution theory for this proce","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6867,"title":"Partition-Guided Distance Saliency: Bridging Decision and Objective Spaces in Many-Objective Optimization","url":"https://arxiv.org/abs/2606.30836","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30836v1 Announce Type: new \nAbstract: Explainability in Many-Objective Optimization (MaO) is currently hindered by the escalating complexity of the Pareto front, which renders the relationship between high-dimensional decision variables and objective outcomes increasingly opaque. As the number of objectives exceeds the limits of traditional visualization, decision-makers encounter a ``cognitive drought'' in identifying relevant trade-offs or specifying target regions without a priori knowledge. To bridge this interpretability gap, we introduce the {Partition-Guided Distance Saliency","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6866,"title":"Mind the Residual Gap: Probabilistic Downscaling under Real-World Bias","url":"https://arxiv.org/abs/2606.30821","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30821v1 Announce Type: new \nAbstract: Probabilistic downscaling is the task of modeling the conditional distribution of high-resolution fields given coarse inputs, and is a central challenge to atmospheric science, climate modeling, and other multiscale physical systems. A widely used paradigm decomposes the problem into a deterministic mean predictor followed by a stochastic residual generator. While effective in idealized settings, this mean--residual approach frequently produces biased and under-dispersive ensembles in real-world applications. Is this merely generic predictive un","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6865,"title":"Gradient Smoothing: Coupling Layer-wise Updates for Improved Optimization","url":"https://arxiv.org/abs/2606.30813","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30813v1 Announce Type: new \nAbstract: Deep neural networks with repeated architectural blocks, such as transformers, often exhibit structured relationships across layers that emerge during training. Motivated by this observation, we introduce \\emph{Depth-wise Gradient Augmentation}, a general optimization paradigm in which the update applied to each layer is obtained by transforming the collection of block-wise optimizer updates along the depth dimension. Within this framework, we study \\emph{Gradient Smoothing}, a family of depth-wise smoothing methods, and instantiate it with a si","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6864,"title":"Predictable GRPO: A Closed-Form Model of Training Dynamics","url":"https://arxiv.org/abs/2606.30789","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30789v1 Announce Type: new \nAbstract: Group Relative Policy Optimization (GRPO) has become a standard tool for improving the reasoning ability of large language models, yet its training dynamics are still described empirically: reward trajectories are fit with low-parameter functional forms whose constants carry no mechanistic meaning, and hyperparameter choices remain a matter of trial and error.  We develop a first-principles reduced-order model of these dynamics. The reduction has three consequences. First, it subsumes the empirical single-exponential saturation law as its overda","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6863,"title":"Revocable Learned State via Process Sidecars","url":"https://arxiv.org/abs/2606.30788","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30788v1 Announce Type: new \nAbstract: Language models are often adapted in stages: a public skill phase, a private memory phase, and a later safety phase that learns to refuse outputs tied to the remembered entities. Revoking the memory after the safety phase is not the same problem as subtracting the memory update: the later safety optimizer has transported the memory direction. We introduce process sidecars, a two-coefficient edit family $\\hat{\\theta}(\\lambda,\\gamma)=\\theta_{\\mathrm{AMS}}-\\lambda\\Delta_{\\mathrm{M}}-\\gamma\\hat{R}_{\\mathrm{S}\\leftarrow\\mathrm{M}}$, with $\\hat{R}_{\\m","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":6862,"title":"Hierarchical Global Attention (HGA)","url":"https://arxiv.org/abs/2606.30709","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2606.30709v1 Announce Type: new \nAbstract: Hierarchical Global Attention (HGA) is a drop-in replacement for dense causal attention in pretrained long-context transformers. HGA preserves the original checkpoint parameters: the pretrained $W_Q$, $W_K$, $W_V$, and $W_O$ projections remain unchanged, no calibration parameters are introduced, and no retraining is required.\n  Applied to Qwen3-30B-A3B-Instruct-2507-FP8 on a single RTX~5090 (32GB), the patched model runs out of the box at a 64K-token context, where token-level K/V storage is not feasible on this hardware.\n  Unlike previous spars","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#d97706","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":7041,"title":"Apptronik's robot park to speed humanoid AI development through real tasks - Interesting Engineering","url":"https://news.google.com/rss/articles/CBMilgFBVV95cUxPd2c0Mkp3dVhoYkhtbS1TLWQ3UEQ1ZXlibGRSNndWcDQzWnpoRHQxaUVHakVkQ0tSWFB1Mzl2MUhjT3B0dzlpbzNTeU50U1BjOVZFa0VVM1lybDdXMXhnVDJBNW5xcEJsVEZKU0pURjEwU2x6a2NISDZVWXhzZTBPdTZKdGdETGc1R2RlNGhhUE9wYzVZQ3c?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMilgFBVV95cUxPd2c0Mkp3dVhoYkhtbS1TLWQ3UEQ1ZXlibGRSNndWcDQzWnpoRHQxaUVHakVkQ0tSWFB1Mzl2MUhjT3B0dzlpbzNTeU50U1BjOVZFa0VVM1lybDdXMXhnVDJBNW5xcEJsVEZKU0pURjEwU2x6a2NISDZVWXhzZTBPdTZKdGdETGc1R2RlNGhhUE9wYzVZQ3c?oc=5\" target=\"_blank\"\u003eApptronik's robot park to speed humanoid AI development through real tasks\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eInteresting Engineering\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-01T16:15:00"},{"id":7042,"title":"Chinese firm sells hyper-real, ‘always loyal’ humanoid robots - "sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31167v1 Announce Type: new \nAbstract: VLA models have emerged as a powerful paradigm for transferring semantic knowledge from web-scale data to physical robotic control. However, current single-frame architectures suffer from intrinsic limitations: temporal myopia that discards historical dynamics, reasoning gaps between high-level instructions and low-level motor commands, and inference inefficiency due to autoregressive scalar decoding. In this work, we propose MIRTH, a unified framework designed to address these challenges. MIRTH augments a pretrained VLA backbone with three key","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7059,"title":"LLM-Powered Interactive Robotic Action Synthesis from Multimodal Speech, Gestures, and Music","url":"https://arxiv.org/abs/2606.31158","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31158v1 Announce Type: new \nAbstract: The quest for intuitive and natural human-robot interaction (HRI) remains a significant challenge in robotics. Traditional methods often rely on rigid, pre-programmed commands that limit the robot's expressiveness and adaptability. This paper introduces a novel framework that leverages the reasoning capabilities of Large Language Models (LLMs) to synthesize complex robotic actions from a rich tapestry of multimodal human inputs: natural speech, hand gestures, and music/sound beats. Our system architecture integrates a speech transcription model,","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7058,"title":"A Modular Vision-Language-Action Robotics Framework for Indoor Environments","url":"https://arxiv.org/abs/2606.31144","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31144v1 Announce Type: new \nAbstract: This paper presents an integrated system for the CMU Vision-Language-Action (VLA) Challenge, designed to enable an autonomous agent to perform complex tasks based on natural language instructions. Our framework employs a modular architecture that orchestrates environment mapping, question processing, and navigation. The system operates in two parallel streams: a perception pipeline that constructs a semantic voxel map from real-time camera feeds using OwlViT embeddings, and a language pipeline that classifies user commands with a Vision-Language","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7057,"title":"ELASTIC: Efficiently Learning to Adaptively Scale Test-Time Compute for Generative Control Policies","url":"https://arxiv.org/abs/2606.31132","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31132v1 Announce Type: new \nAbstract: Generative control policies (GCPs), such as diffusion policies and flow-based vision-language-action models, enable test-time scaling in robot control. Test-time compute can be allocated along two axes: sequential scaling, which increases denoising steps to refine actions, and parallel scaling, which samples multiple candidate actions to search across modes of the policy distribution. However, the optimal allocation of sequential and parallel compute is hard to know a priori as it is state-, task-, and policy-dependent. For example, early stages","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7056,"title":"Efficient Sim-to-Real Transfer of World-Action Models from Synthetic Priors","url":"https://arxiv.org/abs/2606.31101","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31101v1 Announce Type: new \nAbstract: Bridging the sim-to-real gap is a core challenge in deploying learned manipulation policies. Sim-to-real learning is attractive because it can replace expensive real robot demonstrations with scalable synthetic data, yet world-action models have not previously been shown to transfer from simulation to real robotic manipulation. We study whether a world-action model can be trained from synthetic priors and deployed zero-shot in the real world. To this end, we build upon Cosmos Policy, a video diffusion model adapted for visuomotor control. We con","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7055,"title":"Labimus: A Simulation and Benchmark for Humanoid Dexterous Manipulation in Chemical Laboratory","url":"https://arxiv.org/abs/2606.31037","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.31037v1 Announce Type: new \nAbstract: Laboratory automation has made remarkable progress through robotic platforms and AI-driven scientific reasoning. However, many laboratory operations (e.g., solid--solid transfer) remain inherently dynamic and require real-time adaptation to different materials and experimental conditions. Such precision-critical manipulations are difficult to standardize, motivating the use of humanoid robots with dexterous hands. Despite this opportunity, no existing benchmark evaluates humanoid manipulation in precision-critical laboratory environments. We pre","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7054,"title":"Multisensory Continual Learning: Adapting Pretrained Visuomotor Policies to Force","url":"https://arxiv.org/abs/2606.30988","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30988v1 Announce Type: new \nAbstract: Robot manipulation often relies on sensory feedback beyond vision, particularly in contact-rich settings where force, tactile, or audio signals reveal interaction states that are not directly observable from images. However, these modalities are often hardware- and task-specific, and large-scale multisensory robot datasets remain scarce. As a result, it is impractical to pretrain policies with every sensor they may encounter. We study multisensory continual learning: adapting a pretrained robot policy to new tasks with newly introduced modalitie","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7053,"title":"Motion Planning in Compressed Representation Spaces","url":"https://arxiv.org/abs/2606.30940","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30940v1 Announce Type: new \nAbstract: Deep learning methods have vastly expanded the capabilities of motion planning in robotics applications, as learning priors from large-scale data has been shown to be essential in capturing the highly complex behavior required for solving tasks such as manipulation or navigation for autonomous vehicles. At the same time, model-based planning algorithms based on search or optimization remain an essential tool due to their flexibility, efficiency, and the ability to incorporate domain knowledge via expert-designed algorithms and objective function","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7052,"title":"The Quadruped Soft Tail: Compliant Grasping and Swabbing for Contamination Surveys in Harsh Environments","url":"https://arxiv.org/abs/2606.30900","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30900v1 Announce Type: new \nAbstract: Beryllium contamination surveys in radioactive areas are challenging for robots in environments cluttered with cables and electronics. To address this problem, we have developed a novel quadruped system augmentation: A lightweight, soft, and compliant tendon-actuated robotic tail mounted on a quadruped robot. The tail features a hollow, flexible backbone and a tendon-actuated soft gripper that enables the robot to pick up sampling tissues, swab contaminated surfaces, and release the tissues at designated collection locations for subsequent beryl","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7051,"title":"Sampling-Based Coordination-Informed Multi-Objective Multi-Robot Reinforcement Learning","url":"https://arxiv.org/abs/2606.30893","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30893v1 Announce Type: new \nAbstract: Multi-robot systems must simultaneously optimize competing objectives while maintaining coordinated behavior. Existing multi-agent reinforcement learning approaches often rely on fixed or centralized coordination, which limits adaptability and violates distributed constraints. This work introduces the Coordination-Informed Multi-Objective Reinforcement Learning (CIMORL) framework, integrating a distributed weight prediction mechanism, a privileged expert training strategy, and theoretical guarantees for Pareto-optimal solutions. We present the b","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7050,"title":"TAPE: Tether-Aware Path Planning for Autonomous Exploration of Unknown 3D Cavities Using a Tangle-Compatible Tethered Aerial Robot","url":"https://arxiv.org/abs/2606.30817","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30817v1 Announce Type: new \nAbstract: This letter presents the first method for autonomous exploration of unknown cavities in three dimensions (3D) that focuses on minimizing the distance traveled and the length of tether unwound. Considering that the tether entanglements are little influenced by the global path, our approach employs a 2-level hierarchical architecture. The global frontier-based planning solves a Traveling Salesman Problem (TSP) to minimize the distance. The local planning attempts to minimize the path cost and the tether length using an adjustable decision function","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7049,"title":"From Grasps to Dexterity: Large-Scale Grasp Pretraining for Dexterous Manipulation","url":"https://arxiv.org/abs/2606.30749","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30749v1 Announce Type: new \nAbstract: Large-scale dexterous grasp datasets encode rich priors over hand-object interaction, but their use has largely been confined to grasp generation and pick-and-place manipulation. We study whether such data can instead support functional dexterity in articulated tool use, where a robot must acquire a tool, maintain contact, and operate its functional moving parts. We adapt a hierarchical imitation learning framework that combines high-level hand sub-goal prediction with a low-level goal-conditioned controller. We construct a 355k-trajectory grasp","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7048,"title":"Vision-Language Procedural Reasoning for Context-Aware Reward Modeling of Robotic Endovascular Guidewire Navigation","url":"https://arxiv.org/abs/2606.30698","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30698v1 Announce Type: new \nAbstract: Robotic-assisted endovascular interventions demand accurate, stable, and context-aware guidewire navigation in complex and patient-specific vascular anatomies. Despite recent advances in robotic precision and learning-based control, existing autonomous navigation methods remain limited by their reliance on static reward functions and the lack of explicit procedural reasoning regarding anatomical context and task progression. To address these challenges, this paper proposes a vision-language procedural reasoning (VL-PR) framework for autonomous g","tags":[],"cluster_size":1,"ts":"2026-07-01T04:00:00"},{"id":7047,"title":"ViTL: Temporal Logic-Guided Zero-Shot Natural Language Navigation via Vision-Language Models","url":"https://arxiv.org/abs/2606.30696","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.30696v1 Announce Type: new \nAbstract: Enabling robots to follow natural language commands to complete zero-shot long-horizon tasks remains challenging. It requires extracting implicit temporal and logical constraints from natural language commands and executing multiple sub-tasks accordingly. Recent zero-shot object navigation methods use vision-language models (VLMs) to guide frontier-based exploration in unknown environments, but they are limited to single-target tasks. Real-world commands such as \"Clean either the chair or the couch, then turn on the tv.\" r // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
