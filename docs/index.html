urces":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，在动力电池稳步增长、储能电池爆发式扩容的双轮驱动下，全球锂电池材料需求大幅提升。在此背景下，电解液市场需求快速增长，A股电解液产业链相关公司的上半年经营业绩纷纷报喜。但行业高景气背后矛盾并存，成品产能持续扩张形成供给过剩，六氟磷酸锂、VC（碳酸亚乙烯酯）等核心原料供给趋紧，成本压力分化传导。机构认为，受原料端支撑，电解液后续仍存在涨价空间。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-24T23:56:58"},{"id":22871,"title":"800亿港元梭哈AI！阿里巴巴拿下近3倍超额认购 - 新浪财经","url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxPTUw5aERlbGJwWDJWUGpRWnZFbllwZ3ZtdUczYlFMLWxWZ0xJZklWVVI5MTBWTEZ2d1J0eVYyRFk4TEpweUtDbDE0eGQ1Zko0STN0bm9leUszTW5TVk5qOVU0ZG8tUGtDaUhzNmx3OEo4RmhrQVN2aFpvcUlocGdseW5xVWMzX1FNcGYwbWwtRGJySlNzb2tv?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMilwFBVV95cUxPTUw5aERlbGJwWDJWUGpRWnZFbllwZ3ZtdUczYlFMLWxWZ0xJZklWVVI5MTBWTEZ2d1J0eVYyRFk4TEpweUtDbDE0eGQ1Zko0STN0bm9leUszTW5TVk5qOVU0ZG8tUGtDaUhzNmx3OEo4RmhrQVN2aFpvcUlocGdseW5xVWMzX1FNcGYwbWwtRGJySlNzb2tv?oc=5\" target=\"_blank\"\u003e800亿港元梭哈AI！阿里巴巴拿下近3倍超额认购\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-24T23:55:00"},{"id":22872,"title":"A股近六成公司半年报净利增长，401家拟实施中期分红","url":"https://wallstreetcn.com/livenews/3154212","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月24日收盘，A股共有2183家上市公司披露2026年半年报，其中1308家上市公司2026年上半年归属于上市公司股东的净利润实现同比增长，占比约59.92%。401家上市公司拟实施中期分红，占比约为18.37%。从已披露2026年半年报的上市公司所属行业看，A股上市公司盈利呈现明显结构性分化。AI算力硬件、有色金属、能源化工等板块业绩兑现力度较强，不少上市公司二季度业绩较一季度有明显改善。地产链、部分内需消费行业仍面临压力。同时，中期分红热度提升，传统蓝筹与部分成长龙头纷纷推出中期分红方案。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-24T23:51:17"},{"id":22873,"title":"美团高管这一席话，讲透了市场对阿里巴巴配股800亿豪赌AI的恐慌 - 新浪财经","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTE9IVXpTUzF6Qm9ycXhqeC1YZXZHazVhZG1ydllOaHdLd0cwanRFZmxTYUNqWXlGVUdVd0ZoWHZWS0Y3b3Z0c1ZXc0FlbWFzUFdCOHlMb1Vrb2h4UGY1dF9PcGhoRXJTOGhhZl90N1g0dw?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMib0FVX3lxTE9IVXpTUzF6Qm9y "cluster_size":2,"ts":"2026-08-24T23:25:18"},{"id":22878,"title":"电商早报：阿里巴巴拟配售800亿港元新股投入AI建设；SHEIN启动IPO最多募资超138亿港元- 栏目 - 亿邦动力网","url":"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9idmhubC1KNWpIUG16OXVWM0lfWE90bUYtZVZzdTZjN3VNSUdkdE9DWU9QdGwwYTNfNGtNREszY1lqTC0tTW02QUlpaDJ1SmlDV1FncFZB?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9idmhubC1KNWpIUG16OXVWM0lfWE90bUYtZVZzdTZjN3VNSUdkdE9DWU9QdGwwYTNfNGtNREszY1lqTC0tTW02QUlpaDJ1SmlDV1FncFZB?oc=5\" target=\"_blank\"\u003e电商早报：阿里巴巴拟配售800亿港元新股投入AI建设；SHEIN启动IPO最多募资超138亿港元- 栏目\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e亿邦动力网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-24T22:56:53"},{"id":22879,"title":"保险资负新规落地，险企料增配高股息资产，布局分红险迎加速窗口","url":"https://wallstreetcn.com/livenews/3154201","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"日前，国家金融监督管理总局正式出台《保险公司资产负债管理办法》，聚焦资产负债联动偏弱、内部管理政策程序不清、监管指标标准缺失、监管约束手段不足等问题，进一步完善保险资产负债管理制度体系。","tags":[],"cluster_size":1,"ts":"2026-08-24T22:54:48"},{"id":22880,"title":"央行打出长短“组合拳”呵护流动性","url":"https://wallstreetcn.com/livenews/3154200","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月24日，中国人民银行发布的公告显示，人民银行当日开展3400亿元7天期逆回购操作，实现净投放3400亿元。同时，人民银行预告，将在8月27日至9月1日开展每日上限6000亿元的隔夜逆回购操作，并定于8月25日实施5000亿元1年期中期借贷便利（MLF）操作。专家表示，人民银行连续发布多项公开市场操作安排，综合运用7天期逆回购、隔夜逆回购、MLF等多种工具投放流动性，将精准有效匹配银行体系短期及中期流动性需求，保持流动性充裕。","tags":[],"cluster_size":1,"ts":"2026-08-24T22:47:21"},{"id":22881,"title":"A股半年报密集披露，长线资金调仓轨迹浮现","url":"https://wallstreetcn.com/livenews/3154198","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着A股上市公司2026年半年报披露进入高峰期，社保、保险、合格境外机构投资者（QFII）等长线资金的持仓动向逐渐浮出水面。已披露的上市公司半年报数据显示，半导体、电子设备等赛道获持续加码，长线资金用真金白银为中国经济转型升级投出“信任票”。分析人士认为，随着制度堵点逐步打通、考核机制向中长期转型，A股资金结构有望持续优化，“长钱长投”的良性生态渐行渐近。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-24T22:42:25"},{"id":22882,"title":"业绩比较基准“换锚”，银行理财机构直面“翻译”挑战","url":"https://wallstreetcn.com/livenews/3154193","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"《银行保险机构资产管理产品信息披露管理办法》将于9月1日起施行。银行理财机构正在密集调整存续产品业绩比较基准，备战信息披露“大考”。此次“换锚”并非简单修改说明书。新基准多挂钩债券指数、存款利率、权益指数等专业指标，组合权重各异，既要匹配投资策略，也要向投资者清晰传达收益来源与风险变化。然而，挑战在于“翻译”。业内人士坦言，“中债财富指数”等指标对普通客户乃至部分从业人员都存在“阅读门槛”。如何在合规前提下，将复杂公式转化为投资者易懂的语言，正成为银行理财机构在本轮信息披露“大考”中的核心考题。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-24T22:27:09"},{"id":22883,"title":"首批基金2026年中期报告出炉，看好有色、脑机接口等方向","url":"https://wallstreetcn.com/livenews/3154190","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"公募基金迎来2026年中期报告披露期。同泰基金旗下同泰慧盈混合、同泰大健康主题混合率先披露2026年中期报告，上半年投资路径随之浮出水面。展望后市，同泰基金基金经理相当乐观，他们看好贵金属、有色领域及脑机接口等前沿方向。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-24T22:17:40"},{"id":22884,"title":"港股美国预托证券普遍上升 阿里巴巴升逾3% - gbcode.rthk.hk","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxNMHh4MXhZZDRScTRrOXdPeV9JOElsalgxSWVHVzdKc0FaTFp6N0V2SG5ickwxUmlmcjBnbk5lbHdkcDZxOWFEcEMtLXhOal90RnF3NjQzeFlFT0J5Y3hiZ1ZGbVNWakRCSEF5LWY0YTA3MWc0dTBQZWNnSWVLWHowYUpUMldHdXNvRy03dG5yQWM0Ym00RzZWclVYVmhBanZTcnpB?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiowFBVV95cUxNMHh4MXhZZDRScTRrOXdPeV9JOElsalgxSWVHVzdKc0FaTFp6N0V2SG5ickwxUmlmcjBnbk5lbHdkcDZxOWFEcEMtLXhOal90RnF3NjQzeFlFT0J5Y3hiZ1ZGbVNWakRCSEF5LWY0YTA3MWc0dTBQZWNnSWVLWHowYUpUMldHdXNvRy03dG5yQWM0Ym00RzZWclVYVmhBanZTcnpB?oc=5\" target=\"_blank\"\u003e港股美国预托证券普遍上升 阿里巴巴升逾3%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003egbcode.rthk.hk\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-24T22:15:00"},{"id":22885,"title":"上证报头版文章：积极财政政策靠前发力稳增长，下半年“提挡加速”空间可期","url":"https://wallstreetcn.com/livenews/3154187","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，积极的财政政策坚持靠前发力、精准施策，为推动经济持续向新向优向好发展提供了有力保障。专家表示，下半年财政政策将“提挡加速”，后续仍有“持续用力”的政策空间。一方面，需合理加快支出进度，推动民生政策落地见效；另一方面，要加力扩大内需，在加快存量政策落地的同时，根据形势变化及时推出增量储备政策。","tags":[],"cluster_size":1,"ts":"2026-08-24T22:14:50"},{"id":22886,"title":"体外诊断公司深化AI 生物医学论文，发现生成式 AI 正迅速融入学术论文写作。\u003c/p\u003e\u003cp data-vmark=\"fbb7\"\u003e研究人员通过分析论文中的“AI 高频用词”（例“delves”“exacerbating”和“invaluable”等）并建立数学模型估算论文中的 AI 使用比例，\u003cstrong\u003e其中 2025 年约 77% 的英语生物医学论文出现了 AI 辅助写作或编辑的明显特征\u003c/strong\u003e，相比 2023 年的 19% 和 2024 年的 52% 大幅提升。\u003c/p\u003e\u003cp data-vmark=\"2157\"\u003e研究还发现，AI 辅助写作在论文不同部分的使用程度并不相同。2025 年，约 68% 的论文摘要、63% 的引言、58% 的结果部分以及 54% 的方法部分存在 AI 辅助写作迹象，而讨论部分的比例最高，达到约 78%。\u003c/p\u003e\u003cp data-vmark=\"fbe8\"\u003e从地区来看，韩国、中国等非英语母语地区的研究人员在 2025 年使用 AI 辅助写作的比例超过 80%，明显高于英国、美国等英语母语国家。研究人员认为，这与 AI 工具能够帮助非英语母语作者改善语法、措辞","tags":[],"cluster_size":1,"ts":"2026-08-24T23:14:40"},{"id":22984,"title":"Meta计划于未来数周推出“Hatch”AI智能体平台 - 新浪财经","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTE5LcC1wREEzcHcxQm9GTXJ0U2ZoaWgzZkhSS3RraGNaaGpXdU9GclRjTGFGZTJPWXRldFdzSExLY1A1RVotWVBkSE51azZtb3VaaGtQTFNvLWdOemFORG9jUUtoZHIyZFVKTEJEQTVqZw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMib0FVX3lxTE5LcC1wREEzcHcxQm9GTXJ0U2ZoaWgzZkhSS3RraGNaaGpXdU9GclRjTGFGZTJPWXRldFdzSExLY1A1RVotWVBkSE51azZtb3VaaGtQTFNvLWdOemFORG9jUUtoZHIyZFVKTEJEQTVqZw?oc=5\" target=\"_blank\"\u003eMeta计划于未来数周推出“Hatch”AI智能体平台\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-24T23:14:19"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#dc2626","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":22741,"title":"Samsung thinks Claude Code can help it boost chip design — but admits the AI still makes some worryingly big mistakes - TechRadar","url":"https://news.google.com/rss/articles/CBMi3gFBVV95cUxQa2RHY2xLSFluZWZRWUdyS2tJT19BMVJPQ3VCcTMxNUNMbUZqTGo5Wk9qbUlJQ2piTTNxZUZjRUxtLUdMdGhNTzlJMjc3SWJCeVRVNFRsUlJpNDdPZC1ZTE9FN0tLY2JROVZuU3Fac2tJWWFiSVpZNG5IREEtd0x ition and utilization, commonly referred to as Space Mining, represent critical pathways for enabling sustained human exploration and unlocking commercial opportunities in space. These resources mainly include helium-3, water, mineral resources on the Moon and Mars, and abundant mineral deposits on asteroids. Due to the harsh conditions of space, communication delays, and high launch costs, the development of autonomous robotic systems is critical to achieving efficient, cost-effective space mining. This paper provides a com","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22734,"title":"ViTacPhys: Physical Property-Aware Grasping from Human Visual-Tactile Demonstrations","url":"https://arxiv.org/abs/2608.21355","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21355v1 Announce Type: new \nAbstract: Recent vision-based action models have demonstrated strong capabilities in complex manipulation, but they rarely leverage explicit object physical properties to adapt their policies. We introduce ViTacPhys, a visual-tactile framework and data acquisition system that estimates object mass and friction-coefficient classes, together with continuous stiffness, from human manipulation demonstrations. Trained on data from 60 rigid and deformable objects, ViTacPhys combines temporal visual-tactile modeling, cross-attention multimodal fusion, and a sema","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22733,"title":"VT-MUSE: Multimodal Unified Sequential Visuotactile Representation Learning for Manipulation","url":"https://arxiv.org/abs/2608.21290","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21290v1 Announce Type: new \nAbstract: We propose VT-MUSE, a Multimodal Unified SEquential representation learning framework for visuotactilemanipulation. Existing approaches often encode visual and tactile observations independently before fusion, limiting their ability to capture fine-grained cross-modal dependencies. Moreover, most methods focus on observations at the current time step and overlook the temporal evolution of contact. VT-MUSE addresses both limitations through a two-stage representation learning framework. In Stage I, modality specific encoders are jointly adapted v","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22732,"title":"Beyond Imitation: Self-Improving Robot Policies via Off-Policy Q-Planning","url":"https://arxiv.org/abs/2608.21204","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21204v1 Announce Type: new \nAbstract: Behaviour Cloning (BC) has driven remarkable progress in robot manipulation, yet it is fundamentally limited by its inability to self-improve: a policy that fails cannot learn from that failure without additional human demonstrations. Reinforcement Learning fine-tuning offers a path to self-improvement but has proven difficult to scale to the multi-billion-parameter models underpinning modern robot policies. We propose Q-Planning, which equips a large visuomotor BC policy with a small off-policy Q-function. Because a Q-function estimates value r","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22731,"title":"SRL-MPC: Shape-Aware Reinforcement Learned Model Predictive Control","url":"https://arxiv.org/abs/2608.21175","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21175v1 Announce Type: new \nAbstract: Safe and efficient shape-aware navigation in heterogeneous crowds and robot fleets remains challenging. Traditional approaches often assume homogeneous robots, sparse workspaces, simplified geometry, offline computation, or handcrafted parameters to make the problem tractable, which limits their deployment in dense crowd scenarios. Toward this end, we propose Shape-Aware Reinforcement Learned Model Predictive Control (SRL-MPC), a method for safe, efficient, and adaptive navigation in crowds with heterogeneous shapes without geometry simplificati","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22730,"title":"Teaching is a Process: The TOSS Framework for Modeling Human Teaching Decisions in Human-Interactive Robot Learning","url":"https://arxiv.org/abs/2608.21083","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21083v1 Announce Type: new \nAbstract: Successful Human-Robot Teaching assumes alignment between robot processing needs and human teaching intent. To better understand this alignment, this work seeks to uncover the underlying logic that humans intuitively apply when teaching. Through an exploratory, bottom-up study with N=34, participants observing two distinct robot Reinforcement Learning (RL) scenarios, we analyze 204 intuitive teaching responses across early, middle, and late learning phases. Results reveal that teaching decisions consist of a nuanced, interconnected network of Tr","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22729,"title":"TaPeR: Probabilistic Recovery of Sparse Task Precedence Graphs from a Handful of Demonstrations","url":"https://arxiv.org/abs/2608.21035","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21035v1 Announce Type: new \nAbstract: Long-horizon manipulation tasks are often only partially ordered. For example, when assembling an electronic device, the battery and circuit board may be installed in either order, but both must be in place before the enclosure is closed. Recovering such dependencies enables robots to flexibly reorder subtasks while preserving task validity. Existing approaches typically infer task structure from human demonstrations using both temporal and symbolic supervision. However, symbolic predicates require explicit grounding, which is difficult to obtai","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22728,"title":"PhysCaP: Grounding Code-as-Policy Agent with Physics-Informed Exploration","url":"https://arxiv.org/abs/2608.21031","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.21031v1 Announce Type: new \nAbstract: We present PhysCaP, a Physics-Informed Code-as-Policy agent for active perception in robotic manipulation. While vision-language-action policies excel at imitating demonstrations, they rely on passive observation and fail to infer latent physical properties critical for manipulation. PhysCaP augments code-as-policy frameworks with a physics-informed exploration layer that enables explicit information-seeking through interaction. It introduces training-free physical property extraction modules that estimate object mass and stiffness from robot pr","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22727,"title":"Hybrid Roller-Jamming Gripper for Object Acquisition and Retention Under Pose Uncertainty","url":"https://arxiv.org/abs/2608.20962","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20962v1 Announce Type: new \nAbstract: In household manipulation, pose uncertainty often results in off-centre or partial initial contact, making reliable object acquisition difficult. Roller-based grippers can actively draw objects inward but often provide limited post-capture stability, whereas granular-jamming grippers require sufficient contact before jamming to achieve strong retention. This paper presents a hybrid roller-jamming gripper that integrates active object intake and post-capture retention within a single gripper. The proposed gripper uses inward roller rotation to in","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22726,"title":"Fast Coordinated Bimanual Motion Planning With Hard Constraints","url":"https://arxiv.org/abs/2608.20946","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20946v1 Announce Type: new \nAbstract: Bimanual manipulation enables complex tasks but introduces added complexity from the high number of degrees of freedom involved. When handling rigid objects, the relative transformation between the two end effectors must remain fixed throughout the motion, manifesting as a nonlinear equality constraint that confines the feasible configuration space to a measure-zero manifold and challenges conventional motion planners. We propose a fast bimanual motion planning pipeline that enforces this hard transformation constraint continuously along the ent","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22725,"title":"Demonstration-Guided Humanoid Stand-Up on an Emulated Deformable Surface","url":"https://arxiv.org/abs/2608.20852","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20852v1 Announce Type: new \nAbstract: This paper presents a reference-guided reinforcement learning framework to generate stand-up motion for a 29-DOF Unitree G1 humanoid on deformable soft ground, using a human demonstration recorded on hard ground. The terrain compliance is modelled using solref and solimp parameters from MuJoCo's rigid body soft-contact model. The rewards consists of (i) reference motion tracking through residual joint-position control and (ii) explicit recovery objectives such as pelvis height, torso uprightness, and the final posture. First, the policy is train","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22724,"title":"Natural Sit-to-Stand Motion Synthesis For Humanoids via Guided Assistance Curricula and Staged Rewards","url":"https://arxiv.org/abs/2608.20823","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20823v1 Announce Type: new \nAbstract: A humanoid has infinitely many ways to stand up from sitting while maintaining balance, making sit-to-stand (STS) a challenging control problem. We synthesise natural humanoid STS motion from scratch using reinforcement learning, without demonstrations or reference trajectories. A single Proximal Policy Optimisation policy learns smooth, human-like rising driven by three complementary components. (i) A coupled force/chair-height curriculum is used. A vertical pelvis-assist force aids early trajectory exploration and decays over training. Taller","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22723,"title":"Rethinking Demonstration Unlearning in Imitation Learning for Robotics","url":"https://arxiv.org/abs/2608.20784","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20784v1 Announce Type: new \nAbstract: Imitation learning for robotics depends on human demonstrations, some of which people may later ask to remove. Retraining without them is the natural reference, but its cost grows with policy and dataset scale, motivating cheaper operators that edit a trained policy. Metrics inherited from machine unlearning, such as forgetting loss or a single membership attack, do not establish what an edit removed from a policy acting in closed loop. We therefore introduce a retrain-calibrated audit that reads demonstration unlearning along two axes: behavior","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22722,"title":"Logic-VLA: A Temporal Logic Conditioned Vision-Language-Action Model","url":"https://arxiv.org/abs/2608.20556","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20556v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models can follow natural-language (NL) task instructions, but such instructions may not precisely specify safety-critical or spatiotemporal requirements on the resulting behavior. We introduce Logic-VLA, a formal-requirement-aware VLA that conditions on Signal Temporal Logic (STL) specifications supplied at inference time. Logic-VLA uses a syntax-graph-based STL encoder pre-trained to capture temporal logic semantics. Policy adaptation proceeds in two stages: STL-conditioned supervised fine-tuning on satisfying demo","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22721,"title":"Koala Gripper: Co-designing Robotic Grippers and Data-Capture Devices for Scaling Dexterous Manipulation Learning","url":"https://arxiv.org/abs/2608.20546","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20546v1 Announce Type: new \nAbstract: As the demand for larger manipulation datasets grows, handheld robotic gripper data collection and the associated gripper designs become more vital. Current data collection device designs trend towards matching the morphologies of existing robotic grippers, sacrificing ergonomics and manipulation performance. In this paper, we propose a co-design framework that guides the simultaneous development of both data collection and robotic execution devices by weaving both platform constraints into the design process. Through this workflow, we present t","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22720,"title":"Humanoid Musical Robots as Experimental Interfaces for Music-Evoked Emotion","url":"https://arxiv.org/abs/2608.20433","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.20433v1 Announce Type: new \nAbstract: Advances in technology have led to increasingly sophisticated musical humanoid robots. However, their use has largely been limited to performance and related research in human-robot interaction. In this position paper, we propose a novel perspective: musical humanoid robots as experimental interfaces for investigating music-evoked emotions. We argue that current research is constrained by paradigms relying on pre-recorded auditory stimuli, which fail to capture the multimodal, embodied, and interactive nature of real-world musical experience. Bu","tags":[],"cluster_size":1,"ts":"2026-08-24T04:00:00"},{"id":22548,"title":"特斯拉Optimus计划何时向公众销售？ - 新浪汽车","url":"https://news.google.com/rss/articles/CBMidEFVX3lxTE1fWFlZWGh1bGR6NlNUNTA2NExVQmtzcTVsZ2d5UlhHQ0dQSjRxRlpVVU1FdGY2TE9pVlhHeGlEd1pudUtoM0xnbFVBVHVIcEg4d0FPS0M1MjFFOFJwU0F3bGFLUDBvajhZb1o5bEdyNlh5MHA3?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/artic // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
