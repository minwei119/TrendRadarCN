份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行上市的申请资料。","tags":[],"cluster_size":1,"ts":"2026-06-15T23:56:56"},{"id":2445,"title":"云顶新耀：与DIMERIX订立在大中华区、韩国及东南亚开发及商业化DMX-200的协议","url":"https://wallstreetcn.com/livenews/3119912","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"云顶新耀在港交所公告，于2026年6月16日，本公司与DimerixLimited订立协议，据此，Dimerix不可撤销地向本公司授予一项独家许可，以在大中华区、韩国及若干东南亚国家开发及商业化DMX-200。DMX-200是一种趋化因子受体2(CCR2)的小分子抑制剂，目前正在进行针对局灶节段性肾小球硬化症的关键性临床3期研究ACTION3。DMX-200已获得美国食品药品监督管理局(FDA)及欧洲药品管理局(EMA)的孤儿药资格认定。根据该独家许可，本公司的付款义务包括：(i)首付款1000万美元；及(ii)潜在的开发及监管里程碑付款，最高可达3000万美元；(iii)潜在的销售里程碑付款，最高可达3亿美元；及(iv)基于未来年度净销售额的潜在分层特许权使用费，介乎10%至15%之间。","tags":[],"cluster_size":1,"ts":"2026-06-15T23:34:58"},{"id":2446,"title":"A股锁价定增市场化提速，多家公司将定价基准日“后移”","url":"https://wallstreetcn.com/livenews/3119903","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"步入6月，一股“定价基准日调整风”在A股定增市场刮起。初步统计，目前至少有35家上市公司先后公告称，将定向增发方案的定价基准日由“董事会决议公告日”改为“发行期首日”。中元股份、有研新材、青达环保、金煤科技、吉峰科技……甚至部分并购重组项目的配套募资环节也作出调整，如天汽模6月9日公告，将其发行股份购买资产配套募资的定价基准日同步调整为发行期首日。","tags":[],"cluster_size":1,"ts":"2026-06-15T22:39:56"},{"id":2447,"title":"在成长与安全之间寻找平衡点，公私募探讨下半年科技投资大方向","url":"https://wallstreetcn.com/livenews/3119899","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Choice数据显示，截至6月15日，近一个月机构调研最多的三个行业分别为光学光电子、通用设备和半导体，调研频次均超过800次。但从标的来看，接受机构调研频次最高的分别为杰瑞股份、大金重工和上海瀚讯，分别来自能源、风电和军工电子板块，足见机构平衡持仓组合的趋势。“现在同业基本上分为两类：一类坚守科技产业赛道；另一类认为不确定性较大，最好是空仓等回调。”一位受访基金经理说。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-15T22:28:14"},{"id":2448,"title":"龙大转债兑付压力受关注，业内人士称风险防范须前移至存续期","url":"https://wallstreetcn.com/livenews/3119896","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"可转债市场分层定价正在加速。近期，龙大转债兑付风险受到市场关注，其或成为继东时转债后，年内又一只出现实质兑付压力的A股可转债品种。多位业内人士认为，当前可转债风险更多体现为弱资质品种信用分化，而非系统性风险。市场后续须强化存续期信息披露和风险识别，完善风险处置机制，推动可转债市场更加清晰地分层定价。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-15T22:19:44"},{"id":2449,"title":"周一（6月15日）纽约尾盘，标普500股指期货最终涨1.64%，道指期货涨0.97%，纳斯达克100股指期货涨2.94%。\n\n罗素2000股指期货涨0.84%。","url":"https://wallstreetcn.c ":"\u003cp data-vmark=\"f1ef\"\u003eIT之家 6 月 16 日消息，Adobe 昨日（6 月 15 日）发布公告，\u003cstrong\u003e宣布升级 Creative Cloud 套件，涵盖 Lightroom、Premiere、After Effects 与 Photoshop，为用户创作流程整合更多 AI 能力。\u003c/strong\u003e\u003c/p\u003e\u003ch3 data-vmark=\"7cce\"\u003eLightroom\u003c/h3\u003e\u003cp data-vmark=\"d553\"\u003eLightroom 方面，新版加入辅助筛选工具，用户可按“睁眼”与“眼部清晰度”等条件快速过滤照片，此外照片转视频功能则可把静态照片转成带 AI 运动效果的补充镜头或短视频内容。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"f3c1\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/2edfccf5-5a74-45c4-be41-e09b6c470474.jpg?x-bce-process=image/format,f_auto\" w=\"1312\" h=\"738\" data-weibo=\"0\" data-vmark=\"5929\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"565a\"\u003eIT之家援","tags":[],"cluster_size":1,"ts":"2026-06-15T23:30:06"},{"id":2651,"title":"苹果或研发AI智能体系统,对标OpenClaw操作苹果设备 - 新浪财经","url":"https://news.google.com/rss/articles/CBMicEFVX3lxTFA4b3BweTJnZExIVTEtdGs2TXNVaHNlRlRWWTdXV3hLa0xNNk1wZVpMa29IRHhEdVUxcWw4THBGMnF5R0Mtb0R5cWpWWTBtVERtMDVrSENnVDFQNTZLZUlHY2puXzE5aUk2NnRUd2FuSzI?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMicEFVX3lxTFA4b3BweTJnZExIVTEtdGs2TXNVaHNlRlRWWTdXV3hLa0xNNk1wZVpMa29IRHhEdVUxcWw4THBGMnF5R0Mtb0R5cWpWWTBtVERtMDVrSENnVDFQNTZLZUlHY2puXzE5aUk2NnRUd2FuSzI?oc=5\" target=\"_blank\"\u003e苹果或研发AI智能体系统,对标OpenClaw操作苹果设备\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-15T23:21:10"},{"id":2652,"title":"AMD 收购 MEXT，为 AI 负载吃内存寻找降本新路径","url":"https://www.ithome.com/0/964/621.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"d95e\"\u003eIT之家 6 月 16 日消息，AMD 公司昨日（6 月 15 日）发布公告，\u003cstrong\u003e宣布收购内存优化技术公司 MEXT，目标是缓解数据中心日益突出的内存瓶颈。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"ae2c\"\u003eIT之家援引博文介绍，在 AI、数据分析、虚拟化和高性能计算负载持续膨胀后，现代数据中心普遍面临内存资源紧张的问题。对云服务商和企业客户来说，内存已成为影响性能、效率和部署速度的重要约束。\u003c/p\u003e\u003cp data-vmark=\"fe91\"\u003eMEXT 公司主要技术优势在于把闪存扩展为应用可用的“近内存层”，该公司通过内存分层方案，将不常访问的数据从 DRAM 转移到 NAND 闪存。由于闪存单位容量成本远低于 DRAM，这种架构能在不大幅增加主内存投入的前提下，扩大可用内存池规模。\u003c/p\u003e\u003cp data-vmark=\"109d\"\u003eMEXT 的预测性内存引擎会持续分析内存访问模式，并借助 AI 模型判断下一批可能被调用的数据页。系统会在应用真正发起请求前，先把相关数据从闪存迁回 DRAM，从而尽量维持主内存级别的访问体验。\u003c/p\u003e\u003cp data-vmark=\"7b40\"\u003e对云服务商和企业客户而言，这项技术可以提高现有服务器和集群的内存利用率，减少 DRAM 闲置，另一方面也能降低扩容时对高价 DRAM 的依赖，进而","tags":[],"cluster_size":1,"ts":"2026-06-15T23:18:47"},{"id":2653,"title":"项目负责人揭秘为何苹果 AI 版 Siri 姗姗来迟：推倒重来，彻底重构","url":"https://www.ithome.com/0/964/620.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"e00b\"\u003eIT之家 6 月 16 日消息，iOS 27 全新人工智能版 Siri 相比旧版 Siri 实现了跨越式升级，但其上线耗时远超预期。迈克 · 罗克韦尔道出了新 Siri 迟迟未能推出的背后原因。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"a139\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/9c782ee6-3e08-4a18-8b31-4440c6618c9f.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"720\" data-weibo=\"0\" data-vmark=\"8889\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"4774\"\u003eIT之家注意到，苹果全球开发者大会（WWDC）主题演讲结束后的上周，苹果面向媒体举办了一场聚焦 Siri 与苹果智能（Apple Intelligence）的技术分享会。迈克 · 罗克韦尔也出席了本次分享会，他从去年才开始接手 Siri 项目的整体管理工作。\u003c/p\u003e\u003cp data-vmark=\"ee03\"\u003e罗克韦尔补充了全新细节，解释这款人工智能 Siri 的正式推出为何比预期更晚，以下是他的原话：\u003c/","tags":[],"cluster_size":1,"ts":"2026-06-15T23:16:58"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#db2777","tags":["Models","Hardware","Agents","Funding","Company","Policy","Safety","Research"],"articles":[{"id":2501,"title":"Anthropic Is Still at Odds With the White House Over Claude Fable 5 - WIRED","url":"https://news.google.com/rss/articles/CBMinAFBVV95cUxQWG9ZWjBhNGVHb2xPbURHZ0NNa1hHV2ZDN2FXNUZEak54VnV2YWtrSHd1SWhmZUtEaUZuZ0NzaGgyNTQ4c3B2OE9UNTJkcGdSMEVjWGZGckU5ckFDbm9sQ1JTeUVyVzZ1MVNzSEJKbWxKWEU1QlBPMEpVVWY4b2dYV1VPVzN4aThoMWdHMXUtV29CNUZmVm5wWUpVRXY?oc=5","s erates model-based RL for train","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2356,"title":"GAIT: Legged Robot Proprioceptive State Estimation with Attention over Inertial-Leg Tokens","url":"https://arxiv.org/abs/2606.14160","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14160v1 Announce Type: new \nAbstract: In this paper, we propose a method that applies Inertial-Leg (IL) tokenization to an attention-based network for proprioceptive state estimation in legged robots. Unlike existing learning-based state estimators that concatenate all sensor measurements into a single flat vector, the proposed architecture represents inertial measurements and leg-wise measurements as individual tokens and uses an attention mechanism to learn the relative importance of each measurement.This design allows the network to reweight each measurement according to the curr","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2355,"title":"A Modular Dual-Arm Apple Harvesting Robot with Enhanced Field Performance","url":"https://arxiv.org/abs/2606.14089","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14089v1 Announce Type: new \nAbstract: Robotic apple harvesting offers a promising solution to labor shortages in commercial orchards, but low throughput and poor performance in orchard environments hinder its commercial adoption. This paper presents a modular dual-arm apple harvesting robot that uses a vertically stacked arms to enable simultaneous operation in the upper and lower zones of a single tree, simplifying platform positioning from multi-tree lateral repositioning to single-tree stops. Compared to our prior horizontal dual-arm system, the platform integrates 5 advances: (1","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2354,"title":"Self-Improving VLA Policies: Selected Diffusion Noise for Spurious-Robust Action Smoothing","url":"https://arxiv.org/abs/2606.14084","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14084v1 Announce Type: new \nAbstract: Diffusion-based Vision-Language-Action (VLA) policies enable strong generalization in robotic manipulation, but remain sensitive to spurious visual correlations and noisy action generation, leading to brittle behavior under perturbations. We introduce Selected Diffusion Noise (SDN), a simple, training-free test-time method that improves both robustness and success rate by leveraging the diffusion noise space as a controllable degree of freedom. SDN dynamically samples noise vectors that are maximally separated from a reference set to mitigate re","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2353,"title":"The N2D Haptic Glove: A Multi-Finger Glove for 2D Directional Force Feedback for Contact Rich Manipulation","url":"https://arxiv.org/abs/2606.14083","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14083v1 Announce Type: new \nAbstract: Humans rely on directional fingertip forces to probe and regulate contact during manipulation, yet most wearable haptic gloves render only vibration or single-axis force, leaving force direction ambiguous. Without directional cues, users must infer contact force from vision alone, often leading to over-pressing, inconsistent control, and reduced precision in robotic teleoperation. We present the N2D Haptic Glove, a multi-finger wearable device that renders planar flexion-extension fingertip forces using capstan-drive transmissions for high-trans","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2352,"title":"Development of a 3 in Sewer Pipe Inspection Robot with an Articulated Differential Mechanism using X-shaped Linkages","url":"https://arxiv.org/abs/2606.14070","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14070v1 Announce Type: new \nAbstract: This paper proposes, an improved version of the 3 in sewer pipe inspection robot equipped with an emergency evacuation mechanism. The low traction force and poor stepover capability, which were challenges of the first version, have been improved by simply connecting the propulsion units. The coupled propulsion units feature a differential mechanism capable of posture changes via a single wire, enabling adaptation to pipe diameter variations. To traverse obstacles like pipe joints, a control method was devised that detects obstacle contact throug","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2351,"title":"Semidefinite Relaxations for Collision-Free Motion Planning","url":"https://arxiv.org/abs/2606.14063","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.14063v1 Announce Type: new \nAbstract: We study semidefinite relaxations for collision-free motion planning. We focus on a point robot moving from start to goal through spherical obstacles in $\\mathbb{R}^n$, subject to path continuity constraints and squared derivative costs; a setting that is conceptually simple yet captures the hardness of collision-free motion planning. We formulate this problem exactly as a nonconvex problem over polynomial curves, and present a natural semidefinite relaxation. We contribute two key theoretical insights; to our knowledge this is the first theoret","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2350,"title":"An Attention-based Model for Robust Forecasting with Missing Modality","url":"https://arxiv.org/abs/2606.13970","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13970v1 Announce Type: new \nAbstract: Learning with missing modalities is a fundamental challenge in multimodal robot learning, as real-world robotic systems often operate in environments with incomplete sensor data. Attention-based models are appealing for processing multimodal data because they can handle multiple modalities with a single backbone network. However, most multimodal models assume that all modalities are available during both training and inference, limiting their applicability in robotic perception and decision-making. In this paper, we introduce a multimodal model","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2349,"title":"PhysVLA: Towards Physically-Grounded VLA for Embodied Robotic Manipulation","url":"https://arxiv.org/abs/2606.13886","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13886v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models excel at mapping visual inputs and natural language instructions directly to robotic control policies. However, because they are trained primarily to fit behavioural demonstration data, they do not explicitly enforce fundamental physical principles such as rigid-body dynamics or contact constraints. This exposes a critical physics gap: standard temporal smoothing applied on top of single-step or chunked VLAs trades trajectory quality for added failures that short-term memory cannot resolve. To bridge this gap,","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2348,"title":"AnyGoal: Vision-Language Guided Multi-Agent Exploration for Training-Free Lifelong Navigation","url":"https://arxiv.org/abs/2606.13878","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13878v1 Announce Type: new \nAbstract: End-to-end navigation policies trained on large simulation corpora degrade sharply when transferred to out-of-distribution scenes, categories, or goal modalities. Modular pipelines such as Modular GOAT are bottlenecked by closed-set object detection recall, while 3D snapshot-memory systems (e.g. 3D-Mem) accumulate dense, view-dependent representations that are heavy to maintain. We present AnyGoal, a training-free multi-robot architecture that places a Vision-Language Model (VLM) at the core of frontier-based exploration and coordinates agents t","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2347,"title":"ContactWorld: What Matters in Vision-Tactile World Models for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2606.13877","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13877v1 Announce Type: new \nAbstract: Contact-rich manipulation requires world models to reason over complex contact dynamics from multimodal sensory observations. However, it remains unclear which representation properties fundamentally support stable long-horizon planning in contact-rich settings. In this paper, we present ContactWorld, a benchmark and systematic empirical study of vision-tactile world models spanning 12 contact-rich manipulation tasks, including insertion, disassembly, screwing, and exploratory interaction. Across extensive experiments, we find that representatio","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2346,"title":"Output-Level Regularization Eliminates the Seed Lottery in Single-GPU VLA Fine-Tuning","url":"https://arxiv.org/abs/2606.13856","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13856v1 Announce Type: new \nAbstract: Fine-tuning a vision-language-action model (VLA-JEPA) on a single GPU should be simple: load a pretrained checkpoint, run training, deploy. There is a hidden danger. Run the same fine-tuning code thirteen times -- same data, same architecture, different random seed -- and twelve runs produce a robot succeeding 91--94% of the time, while one run silently degrades to 65.2%: a 29 pp gap with no error message, no warning, and no way to predict which seed will fail. We call this the seed lottery. We trace the cause to output collapse: the action pred","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2345,"title":"Multi-Agent Embodied Autonomous Driving: From V2X Information Exchange to Shared World Models","url":"https://arxiv.org/abs/2606.13840","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13840v1 Announce Type: new \nAbstract: Autonomous driving is shifting from isolated vehicle intelligence toward multi-agent embodied systems that share perception, infer intent, and coordinate action under uncertainty. This survey examines this transition through the lens of Shared World Models (SWMs): predictive cross-agent representations maintained across vehicles, infrastructure, and other traffic participants. We review more than 380 publications spanning vehicle-to-everything (V2X) communication, collaborative perception, inter-agent cognition, cooperative planning, end-to-end","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2344,"title":"FlowMo-WM: A World Model with Object Momentum and Hidden Ambient Drift","url":"https://arxiv.org/abs/2606.13817","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13817v1 Announce Type: new \nAbstract: World models in robot learning predict future states from visual observations and actions, enabling agents to reason about the consequences of their controls. However, many action-conditioned models are evaluated in settings where motion is dominated by immediate control, whereas aquatic surface vehicles and other real-world objects continue moving under inertia and are displaced by hidden ambient drift, such as water currents or wind. We propose FlowMo-WM, an end-to-end trainable visual world model that infers object-centric motion state and a","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2343,"title":"$\\mu_0$: A Scalable 3D Interaction-Trace World Model","url":"https://arxiv.org/abs/2606.13769","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13769v1 Announce Type: new \nAbstract: World models that capture how actions induce physical change enable scalable robot learning without reliance on embodiment-specific action labels. Pixel-space video models provide broad visual priors but expend model capacity on dense appearance reconstruction, while direct action models require embodiment-specific labels that hinder scalability. We present $\\mu_0$, a scalable world model based on 3D traces. Rather than predicting dense pixels or directly modeling actions, $\\mu_0$ forecasts smooth 3D trajectories for salient interaction points s","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2342,"title":"Occupancy-Grounded Room Segmentation for Hierarchical 3D Scene Graphs","url":"https://arxiv.org/abs/2606.13727","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.13727v1 Announce Type: new \nAbstract: Hierarchical 3D scene graphs (3DSGs) for indoor robots organize geometric and semantic information across spatial scales, with a room layer that connects object-level perception to room-scale reasoning. Existing systems construct this layer from different spatial substrates (\\eg{} place clusters, wall planes, or segmentation outputs), and as a result, room nodes are not evaluated on a common geometric criterion. We present an occupancy-grounded 3DSG pipeline in which room nodes are anchored to tracked free-space regions derived from occupancy de","tags":[],"cluster_size":1,"ts":"2026-06-15T04:00:00"},{"id":2133,"title":"Ubtech's hyper-realistic robots see nearly 4,000 pre-orders within 10 days - The Standard (HK)","url":"https://news.google.com/rss/articles/CBMiyAFBVV95cUxPYnVDRHVjUFdQWmU3dU5wekNxZC1Scy00WGhYa1JYZVRodXlseXRqYUhRVi1UQXZ1NmxRZ1JTLUtKc2prbWlkTExSR2x1ZUt6bXJaWGc3MGlEMDl4a2MyREMyTVBaSFEwQzVrY2hTa2RRNWhYMzBMcTVzQkh4d2tRRTQyM2VqVmpVWVpGNTJGZlJkYTJJOXFITWhqemx0eE4tQ3ozd2d1T3I1R3A2cTNUREZDakVXNm9BR2t2ekRydFMyNW52V1NVSQ?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiyAFBVV95cUxPYnVDRHVjUFdQWmU3dU5wekNxZC1Scy00WGhYa1JYZVRodXlseXRqYUhRVi1UQXZ1NmxRZ1JTLUtKc2prbWlkTExSR2x1ZUt6bXJaWGc3MGlEMDl4a2MyREMyTVBaSFEwQzVrY2hTa2RRNWhYMzBMcTVzQkh4d2tRRTQyM2VqVmpVWVpGNTJGZlJkYTJJOXFITWhqemx0eE4tQ3ozd2d1T3I1R3A2cTNUREZDakVXNm9BR2t2ekRydFMyNW52V1NVSQ?oc=5\" target=\"_blank\"\u003eUbtech's hyper-realistic robots see nearly 4,00 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
