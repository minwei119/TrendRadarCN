BFeEtKQUZyS1c3U3M2SlN5cWFlVTEydFFQOGRWSS1uZ3JZcmFyanBEcTZ5MWlIVWlVdjlwdzhzanJGQlVsbHVySElmUkoyX1kxdEFWZzBYWW1NYllWV1VSVzF5OU8zQ2lGbzVtdDVIcmY3ZFRKU1BseFM5c0NCYlA4Vk9PX0FlcmhDSnJqNWNjNGc?oc=5\" target=\"_blank\"\u003e腾讯控股(00700.HK)26Q2业绩前瞻：主业增长稳健 AI持续投入\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-13T23:47:00"},{"id":10223,"title":"纳斯达克100指数期货跌幅扩大至0.5%。","url":"https://wallstreetcn.com/livenews/3133139","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"纳斯达克100指数期货跌幅扩大至0.5%。","tags":[],"cluster_size":1,"ts":"2026-07-13T23:44:56"},{"id":10224,"title":"华尔街见闻早餐 | 2026年7月14日","url":"https://wallstreetcn.com/livenews/3133133","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股三大指数齐跌，半导体指数重挫5%，SK海力士美股大跌近9%；原油飙升10%，黄金重挫。\n\n特朗普称仍可能与伊朗达成协议，中东盟友应支付保护费。美军恢复对伊朗封锁，特朗普放话今晚明天“重击”、对海峡货运收两成费用。\n\n美共和党参议员、外交政策鹰派人物格雷厄姆因病猝死，特朗普提议其胞妹填补席位空缺。\n\n美联储理事沃勒称若核心通胀持续高企，美联储或需加息。美联储主席沃什周二将就半年度货币政策在众议院金融服务委员会作证。\n\n韩国监管层全面收紧单一股票杠杆ETF，“F4”高层会议将研究抑制波动措施。\n\n李强：推进新旧动能平稳接续转换，加快制造业数智化转型，促进人工智能等新技术规模化商业化应用。\n\n《扩大消费“十五五”规划》：深入推进“人工智能+消费”，到2030年社会消费品零售总额达60万亿元。\n\n台积电6月营收4426.8亿元台币，同比增长67.9％创纪录，上半年揽入逾2.4万亿新台币。报道：台积电已通知客户，成熟制程2027年1月起涨价、预计涨幅为个位数百分比。\n\n亨通光电预计上半年净利润同增87%-121%，AI驱动光通信需求爆发。\n\nAI算力需求爆发，沪电股份上半年净利最高预增78%，泰国工厂Q2单季扭亏。\n\n提醒：周二将公布中国6月进出口数据、美国6月CPI，华尔街五大银行周二将公布财报。","tags":[],"cluster_size":1,"ts":"2026-07-13T23:30:27"},{"id":10225,"title":"险资年内密集参设股权投资基金，布局AI、半导体等领域","url":"https://wallstreetcn.com/livenews/3133128","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月10日，中国人寿发布公告称，其拟与国寿产业投资管理有限公司订立合伙协议，成立天津晟和芯程股权投资基金合伙企业（有限合伙）。该合伙企业全体合伙人认缴出资总额为50亿元，合伙企业将重点投资于半导体行业公司。这是年内险资积极参设股权投资基金的一个缩影。据统计，今年以来，已有超10家保险机构参与设立多只股权投资基金，基金投资方向包括AI（人工智能）和半导体等新兴科技领域。受访专家认为，年内险资密集参设股权投资基金，主要受提升长期回报、政策引导、平滑报表波动等因素影响。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-07-13T23:11:16"},{"id":10226,"title":"全球AI龙头股共振下跌，机构称后续关注三个信号","url":"https://wallstreetcn.com/livenews/3133124","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，全球AI链股票共振下跌。分析人士认为，近期，全球AI板块共振调整是由于高拥挤度下产业叙事扰动。短期科技股超跌后或有修复，但在拥挤度压力充分消化前，板块可能仍处于高波动状态，中报业绩将逐步成为市场关注的投资主线。后续重点看三个信号：韩股和美股半导体板块能否企稳，A股科技龙头能否有效承接以及成交额能否维持当前水平。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-13T22:53:35"},{"id":10227,"title":"上市公司分红回购增持三箭齐发协同加力","url":"https://wallstreetcn.com/livenews/3133123","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，A股上市公司分红、回购、增持力度持续加码。截至7月13日，今年以来已有逾3400家上市公司实施分红。与此同时，回购增持动作密集，上市公司回馈投资者意识显著增强。市场人士认为，从年度分红到中期分红渐成常态，从激励型回购到注销式回购占比提升，从被动“护盘”到主动价值管理，A股上市公司正在以实际行动重塑市场预期。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-13T22:43:05"},{"id":10228,"title":"美国总统特朗普签署针对“特定固定污染源”的监管豁免公告。\n\n白宫发布关于监管豁免的总统公告。\n\n特朗普豁免特定污染源遵守“HON规则”（有害空气污染物国家排放标","url":"https://wallstreetcn.com/livenews/3133122","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美国总统特朗普签署针对“特定固定污染源”的监管豁免公告。\n\n白宫发布关于监管豁免的总统公告。\n\n特朗普豁免特定污染源遵守“HON规则”（有害空气污染物国家排放标准）。","tags":[],"cluster_size":1,"ts":"2026-07-13T22:41:34"},{"id":10229,"title":"A股已有650多家公司预告上半年业绩，近150家公司半年盈利超去年全年","url":"https://wallstreetcn.com/livenews/3133120","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至7月13日20时，A股已有657家上市公司披露上半年业绩预告。其中，319家公司预增，21家略增，83家扭亏为盈，预喜比例超过60%。引人注目的是，共有147家公司上半年归母净利润下限已超过2025年全年，如中国船舶、江波龙、天赐材料等行业龙头公司。","tags":[],"cluster_size":1,"ts":"2026-07-13T22:38:49"},{"id":10230,"title":"7月13日电信ETF鹏华基金份额增加75万份，重仓股中国移动、中国联通、中国电信_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE92SEd5TkpJaGRTVmtNeUl5dG9Wa1VCN1BaNnhQR21sZHRUWVlnY2xZUmtfd1EzSlJocXY3QUQ0My1vazVTRWNHN0RUQVdveXR0cTFBMWFhZXNXSGhYTDZ2V3Z3?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE92SEd5TkpJaGRTVmtNeUl5dG9Wa1VCN1BaNnhQR21sZHRUWVlnY2xZUmtfd1EzSlJocXY3QUQ0My1vazVTRWNHN0RUQVdveXR0cTFBMWFhZXNXSGhYTDZ2V3Z3?oc=5\" target=\"_blank\"\u003e7月13日电信ETF鹏华基金份额增加75万份，重仓股中国移动、中国联通、中国电信_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-13T22:36:34"},{"id":10231,"title":"高年化收益率吸睛，券商新客理财走红","url":"https://wallstreetcn.com/livenews/3133119","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"“约定年化收益率8.18%”“新客专享最高超过6%年化收益”……在银行存款利率破1%的时代，券商新客理财的高年化收益率格外抢眼。有人在社交平台分享“薅羊毛”经验，有人建群更新券商“福利”，还有人付费购买开户教程。而另一边，多家券商正以贴息产品争抢新客。记者采访发现，在券商新客理财走红的背后，普通投资者在为到期资金寻找落点，券商则借机争夺财富管理入口，一场围绕“钱袋子”去向的资产换仓正在展开。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-13T22:30:54"},{"id":10232,"title":"举牌减少，投资降速，险资入市节奏生变","url":"https://wallstreetcn.com/livenews/3133118","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年以来，险资在A股市场和港股市场的举牌次数都较去年明显减少；与此同时，保险资金运用余额中的股票资产增速也有所降低。据不完全统计：截至7月13日，在中国保险行业协会官网披露的信息中，今年仅有3家险企举牌上市公司6次，参与举牌的险企分别是平安人寿、太保寿险、富德财险；相较2025年同期的10余家险企举牌近20次，险资举牌步伐大幅放缓。","tags":[],"cluster_size":1,"ts":"2026-07-13T22:29:51"},{"id":10233,"title":"上半年10家券商20多名保代领罚单，“穿透式”监管向券商投行业务全链条纵深推进","url":"https://wallstreetcn.com/livenews/3133117","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年上半年，中介机构监管处分名单上已记入10家券商的名字，涉及保荐代表人（简称“保代”）20多名。处分类型从出具警示函、责令改正，到罚款乃至暂停业务资格皆有。与去年同期相比，监管的“穿透”正从IPO的“入口关”向投行业务全链条纵深推进。梳理相关案例可发现，被监管追责的案例多数并非“没核查”，而是“核查了，但流于形式”。业内人士认为，监管视线向“发行后”延伸，对保代和投行提出了从发行“把关人”升级为企业发展“全生命周期看门人”的要求。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-13T22:27:13"},{"id":10234,"title":"沪市公司近期将派发约2600亿“现金红包”","url":"https://wallstreetcn.com/livenews/3133114","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"统计数据显示，截至7月13日，沪市上市公司2025年年报现金分红已完成派发超过8900亿元，剩余约2600亿元分红资金将在近期密集落地。在待发放的分红中，头部企业尤为突出，超过50亿元的公司共有11家，构筑了坚实的分红主力阵营。其中，长江电力待发放金额高达193亿元，将于7月17日到账；浦发银行待发放金额近140亿元，将于7月16日实施。在蓝筹高分红“加持”下，沪市核心指数的股息率表现抢眼，高股息标的数量充足且分布广泛，形成了稳定的高股息阵营。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-13T22:17:41"},{"id":10235,"title":"画廊 The Studios 社区艺术教育中心 / Graham Baba Architects - 14 - ArchDaily","url":"https://news.google.com/rss/articles/CBMi_AFBVV95cUxPNzdlMmZ1NHJxTjBhNWdTME9YenZKWkg3Yk0xSVlGRkFWcTNXSUJIRU5Hc2kteFFWZGtHLU9WdFhC jRTa1R0MXljeHNOT2psYUFaaGNJSkV6dUZIT1k1NFlXbWxUYkl1LWRVUHNBV0tyVFJn?oc=5\" target=\"_blank\"\u003e阿里巴巴1QFY27：是我意料之中的样子！\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-13T09:31:42"}]},{"key":"ai-cn","name":"AI 前沿 (中文)","description":"国内 AI 媒体 (机器之心 / 36氪 / 量子位 / 极客公园 / 智东西 / 新智元) + AI 关键词大盘。","color":"#db2777","tags":["大模型","AI芯片","Agent","商业","融资","公司","监管","研究"],"articles":[{"id":10417,"title":"JEDEC 正式发布 SPHBM4 规范：适配标准有机基板，吞吐量持平 HBM4","url":"https://www.ithome.com/0/976/292.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"38f9\"\u003eIT之家 7 月 14 日消息，JEDEC 固态技术协会美国弗吉尼亚州当地时间 13 日正式发布了今年 6 月完成的 SPHBM4 规范。这一规范可大致认为是原版 HBM 适配标准有机基板的实现方式。\u003c/p\u003e\u003cp data-vmark=\"3fba\"\u003eSPHBM4 采用与 HBM4 相同的 DRAM 裸片但配备全新的接口基础裸片 (Base Die)，使其能够安装在成本更低的标准有机基板上，\u003cstrong\u003e无需昂贵的硅基板\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"3e9e\"\u003e相比拥有 2048 个数据引脚的 HBM4，SPHBM4 仅定义了 512 个数据引脚，不过其通过 4:1 的串行化\u003cstrong\u003e以更高的工作频率实现了相同的总数据吞吐量\u003c/strong\u003e。这意味着 \u003cstrong\u003eSPHBM4 拥有更宽的凸点间距\u003c/strong\u003e，符合当前有机基板的实际能力。\u003c/p\u003e\u003cp data-vmark=\"3623\"\u003eJEDEC 表示，SPHBM4 采用有机基板布线的优势在于可延长主芯片到内存的走线距离，从而\u003cstrong\u003e为单一 SoC 集成更多 DRAM 堆栈创造可能\u003c/strong\u003e，最终扩展高速片外缓存容量。\u003c/p\u003e\u003cp data-vmark=\"2817\" style=\"text-align: center;\"\u003e\u003cimg","tags":[],"cluster_size":1,"ts":"2026-07-14T01:30:43"},{"id":10418,"title":"AI芯片需求太旺！英特尔豪砸57亿美元扩建爱尔兰厂 - 集微网","url":"https://news.google.com/rss/articles/CBMiQ0FVX3lxTE1PS2JUUzdzX1M2T3BMUDdfYkNWTGwtcHNqQml4N2VULWlxUVdreDhHRWpJeDU5eDRGWmwzbV92UHMtakk?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiQ0FVX3lxTE1PS2JUUzdzX1M2T3BMUDdfYkNWTGwtcHNqQml4N2VULWlxUVdreDhHRWpJeDU5eDRGWmwzbV92UHMtakk?oc=5\" target=\"_blank\"\u003eAI芯片需求太旺！英特尔豪砸57亿美元扩建爱尔兰厂\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e集微网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T01:26:52"},{"id":10419,"title":"宝武财务公司AI 2.0进入实战深水区 - 新浪网","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTE1MTEdGNkFsZndpTVJmeURZdzU3N3paWWxqNFhsOTJXbXFaQnh1dW5RRzFSTU80U0ZualRMaVBEekJDc3RDZTVUb09vUmVLYTJxVDFLbXR0UG5RX1dwd1hIelpSMVFsODl3SUpqazFOeG5oMDhwa1N0b1dsY1RlcXM?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMif0FVX3lxTE1MTEdGNkFsZndpTVJmeURZdzU3N3paWWxqNFhsOTJXbXFaQnh1dW5RRzFSTU80U0ZualRMaVBEekJDc3RDZTVUb09vUmVLYTJxVDFLbXR0UG5RX1dwd1hIelpSMVFsODl3SUpqazFOeG5oMDhwa1N0b1dsY1RlcXM?oc=5\" target=\"_blank\"\u003e宝武财务公司AI 2.0进入实战深水区\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T01:25:18"},{"id":10420,"title":"微软 Win11 测试 PC Insights：目标替代任务管理器排查拖慢 PC 原因","url":"https://www.ithome.com/0/976/291.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"5743\"\u003eIT之家 7 月 14 日消息，科技媒体 Windows Latest 于 7 月 12 日发布博文，报道称微软公司正酝酿为 Copilot 测试 PC Insights 功能，通过读取 CPU、RAM、GPU 占用等信息，\u003cstrong\u003e聊天形式更直观告诉用户是什么拖慢电脑运行速度。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"3c7c\"\u003e在定位方面，PC Insights 在未来有望补充甚至替代 Windows \u0026nbsp;11 系统现有的任务管理器，用户未来遇到故障或者想要了解当前设备运行状态，\u003cstrong\u003e不需要打开任务管理器排查原因，只需要调用 PC Insights，通过聊天式对话，就能让 AI 辅助定位问题原因。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"5bef\"\u003eIT之家援引博文介绍，微软目前已邀请部分美国地区 Windows 11 用户测试 PC Insights，该功能通过读取 CPU、RAM、GPU 使用情况，以及可用存储空间和总存储容量等关键数据，分析设备性能与存储状态。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"9226\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/475","tags":[],"cluster_size":1,"ts":"2026-07-14T01:23:58"},{"id":10421,"title":"微软警告：AI 加快漏洞挖掘速度，不建议 Windows 安全更新延迟超过三天","url":"https://www.ithome.com/0/976/290.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4317\"\u003eIT之家 7 月 14 日消息，在例行的“星期二补丁”更新推送前夕，微软向 Windows 用户与 IT 管理员发出了一项前所未有的严正警告 —— 不建议将 Windows 安全更新的部署延迟超过三天。\u003c/p\u003e\u003cp data-vmark=\"3760\"\u003e这一政策调整的核心原因直指人工智能：AI 技术正在将漏洞从公开披露到被黑客利用的时间窗口，从此前的数周急剧压缩至短短数小时。\u003c/p\u003e\u003cp data-vmark=\"bb63\"\u003e微软 365 部门总监 Jeremy Chapman 在与 Windows 团队密切协作的更新部署指导中明确表示，过去消费者和企业组织习惯性地将安全补丁推迟数天再安装的做法“不应再继续”。\u003c/p\u003e\u003cp data-vmark=\"5446\"\u003e“如果你在安全更新发布后仍等待一两周才部署关键修复，那就相当于给使用 AI 的攻击者留下了充足的时间来发现并利用已知的安全漏洞，”“风险是真实存在的，自 2026 年 4 月以来，我们修复的漏洞总数一直在逐月上升。”\u003c/p\u003e\u003cp data-vmark=\"eddb\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/de731d79-46c9-4b10-8162-3d6408","tags":[],"cluster_size":1,"ts":"2026-07-14T01:23:33"},{"id":10422,"title":"AI好不好用，不只看智商，还看“性格” - 36Kr","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE40VU1Vd0d3bkw5R0t2S2F1ODVwUXo4bHVxSG56am81bTUwa1lHd1V4TTNRSzNMWlV3V3Y2WGJENWFvbHdHTFE1RHIwQy0tTTE0?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTE40VU1Vd0d3bkw5R0t2S2F1ODVwUXo4bHVxSG56am81bTUwa1lHd1V4TTNRSzNMWlV3V3Y2WGJENWFvbHdHTFE1RHIwQy0tTTE0?oc=5\" target=\"_blank\"\u003eAI好不好用，不只看智商，还看“性格”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T01:14:23"},{"id":10423,"title":"苹果起诉OpenAI窃取商业机密 - 品牌方舟","url":"https://news.google.com/rss/articles/CBMiTEFVX3lxTFAzVnpTUEp1VGZrLW5OaGRGdWN5SFBZdkxSS0JNTFdLSWt5NGVsUlFrVTgyNWdLbTd0RnFJMTBGN0xqRmZlN3pIanQ1aEE?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiTEFVX3lxTFAzVnpTUEp1VGZrLW5OaGRGdWN5SFBZdkxSS0JNTFdLSWt5NGVsUlFrVTgyNWdLbTd0RnFJMTBGN0xqRmZlN3pIanQ1aEE?oc=5\" target=\"_blank\"\u003e苹果起诉OpenAI窃取商业机密\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e品牌方舟\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T01:14:11"},{"id":10424,"title":"苹果起诉OpenAI称前员工利 猛涨\u003c/strong\u003e，随后不少投资者选择落袋为安。SK 海力士的美国存托凭证也未能幸免。上周五上市首日涨逾 12% 后，周一早盘下跌 7.9%，报 154.70 美元（IT之家注：现汇率约合 1050 元人民币）。\u003c/p\u003e\u003cp data-vmark=\"f71a\"\u003e三星电子股价也同步重挫，两大芯片股\u003cstrong\u003e拖累韩国综合股价指数 KOSPI 暴跌 9%\u003c/strong\u003e，市场一度触发熔断，暂停交易 20 分钟。\u003c/p\u003e\u003cp data-vmark=\"10c0\"\u003e美国存储芯片股同样全线走低。美光科技下跌 6.4%，闪迪下跌 8.4%，西部数据下跌 6.8%，费城半导体指数下跌 3.6%。\u003c/p\u003e\u003cp data-vmark=\"68fd\"\u003e恢复交易后，韩国股市继续下探。韩国总统李在明周一重申，政府将加快推进三星电子和 SK 海力士提出的晶圆厂建设计划，项目总投资额\u003cstrong\u003e高达数千亿美元\u003c/strong\u003e。\u003c/p\u003e\u003cp data-v","tags":[],"cluster_size":1,"ts":"2026-07-14T01:05:40"},{"id":10427,"title":"Anthropic在印度推出本地化定价 但月费比美国还贵 - 搜狐网","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOTXNkMENiUTFhU0FOUzhaQ0VuNy11SHI0OWt2ZDBxYmYyYmplWjQ1Tk1RaVZrTVNhcG5xZlhZamNkSFp5S3k2QnVyemhYZ0VWemRJVGZXSHc3T1JaNERwZHJ4VW4xLS1rNEhtZ01vRG8wR1QtMHdkWXNBRFBMUVF6X3d2eWdYcG5i?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOTXNkMENiUTFhU0FOUzhaQ0VuNy11SHI0OWt2ZDBxYmYyYmplWjQ1Tk1RaVZrTVNhcG5xZlhZamNkSFp5S3k2QnVyemhYZ0VWemRJVGZXSHc3T1JaNERwZHJ4VW4xLS1rNEhtZ01vRG8wR1QtMHdkWXNBRFBMUVF6X3d2eWdYcG5i?oc=5\" target=\"_blank\"\u003eAnthropic在印度推出本地化定价 但月费比美国还贵\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-14T01:03:00"},{"id":10428,"title":"全球首款！东方算芯3D AI芯片DF1000发布：突破制程依赖、破解存储墙 - 凤凰网","url":"https://news.google.com/rss/articles/CBMiSEFVX3lxTFAxRVpwQlRSVnNXRjFON1hOM2VLNkRnRWhZYzJ0cTlaSkNPWVJTQXlqSlF5RWp0MEMxX212RXg1ZHhLR21wZUN4RA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiSEFVX3lxTFAxRVpwQlRSVnNXRjFON1hOM2VLNkRnRWhZYzJ0cTlaSkNPWVJTQXlqSlF5RWp0MEMxX212RXg1ZHhLR21wZUN4RA?oc=5\" target=\"_blank\"\u003e全球首款！东方算芯3D AI芯片DF1000发布：突破制程依赖、破解存储墙\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e凤凰网\u00 \u003e初创企业和大型企业把敏感资料喂给模型后，模型提供商便能\u003cstrong\u003e逐渐摸清客户的业务\u003c/strong\u003e，还可能\u003cstrong\u003e利用积累下来的知识开拓同类业务，最终与客户直接竞争\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"28fb\"\u003e当地时间 12 日，纳德拉在博客中警告，企业使用 AI 时其实\u003cstrong\u003e付了两遍钱\u003c/strong\u003e：一遍是明码标价的 token 费用，另一遍则是\u003cstrong\u003e在毫无察觉的情况下交出有价值的数据\u003c/strong\u003e。“你实际上付了两次钱，一次用金钱支付，另一次则用更加宝贵的东西支付，也就是为了让 AI 真正发挥作用而必须披露的专有知识。\u003cstrong\u003e你越希望模型表现得更好，就越需要向模型提供更多知识\u003c/strong\u003e！”\u003c/p\u003e\u003cp data-vmark=\"5675\"\u003e企业为了让模型更懂自身需求，实际上正在\u003cstrong\u003e一点点把经营诀窍教给模型\u003c/strong\u003e。“模型会从‘使用痕迹’中学习，包括人们输入的提示词、智能体调用的工具，","tags":[],"cluster_size":1,"ts":"2026-07-14T00:23:30"},{"id":10441,"title":"大模型厂商阶跃星辰首发智能体手机，首批合作伙伴未见微信 - 手机网易网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1DUjh0Qm5DckJWMkxBelNlc3NlUHZEeExPY1JLRzZuSG0zQ3BxUU9ET2l5VndZdlhySDkzWXpKMktLSkxObHo5NEJxcC0zdk5jeFJfMlNvb0UtZmdDNXRNQlVn?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1DUjh0Qm5DckJWMkxBelNlc3NlUHZEeExPY1JLRzZuSG0zQ3BxUU9ET2l5VndZdlhySDkzWXpKMktLSkxObHo5NEJxcC0zdk5jeFJfMlNvb0UtZmdDNXRNQlVn?oc=5\" target=\"_blank\"\u003e大模型厂商阶跃星辰首发智能体手机，首批合作伙伴未见微信\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-07-14T00:19:06"},{"id":10443,"title":"X 平台官宣调整推荐算法：互关好友“存在感”更强，首页不再像“战场”","url":"https://www.ithome.com/0/976/269.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"f50f\"\u003eIT之家 7 月 14 日消息，X 产品负责人尼基塔 · 比尔宣布，平台现已调整推荐算法，\u003cstrong\u003e让互关的用户更容易看到彼此的帖文\u003c/strong\u003e。Meta 旗下 Threads 近来也在通过算法调整强化社区氛围，希望与 X 拉开差异。\u003c/p\u003e\u003cp data-vmark=\"c9e0\"\u003e比尔表示：“我们发现，算法\u003cstrong\u003e原先没有纳入互关关系\u003c/strong\u003e，导致朋友的回复不容易被看到，回复区也因此更像一个\u003cstrong\u003e充斥着陌生人的战场\u003c/strong\u003e。”\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"4984\"\u003e\u003cimg src=\"https://img.ithome.co "source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09587v1 Announce Type: new \nAbstract: Decentralized multi-robot coordination under partial observability remains challenging, especially in communication-free settings where agents must act solely from local sensor observations. Privileged policy distillation provides a promising approach by transferring knowledge from a globally informed oracle to sensor-constrained students. However, in multi-agent systems, the same local observation may correspond to multiple global configurations requiring qualitatively different cooperative actions, making the conditional action distribution in","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10408,"title":"Task-Adaptive Design of Modular Aerial Manipulators Under Airflow Exposure Constraints","url":"https://arxiv.org/abs/2607.09548","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09548v1 Announce Type: new \nAbstract: Aerial manipulation with multirotor platforms enables physical interaction in complex environments, but rotor-induced airflow remains a critical limitation for tasks involving airflow-sensitive targets or surroundings. This paper presents an optimization-based design framework for modular aerial manipulators that jointly considers task wrench feasibility, end-effector placement, and airflow exposure constraints. We first introduce a novel categorization of target-side airflow tolerance and formulate the corresponding exposure requirements as geo","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10407,"title":"DemoBridge: A Simulation-in-the-Loop Toolkit for Single-View Human Demonstration Retargeting","url":"https://arxiv.org/abs/2607.09519","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09519v1 Announce Type: new \nAbstract: We present DemoBridge, an toolkit that turns a single-view RGB stereo recording of a human hand demonstration into an executable, physics-validated robot-arm trajectory. Retargeting across the embodiment gap is hard. A robot arm reaches a target with a long, articulated body whose links carry far more collision volume than a hand. Solving inverse kinematics for the mapped end-effector pose often yields no collision-free solution, and a trajectory imposes this at every waypoint. A single view adds noise, leaving the demonstrated reference inaccur","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10406,"title":"One-Shot Multimodal Learning from Demonstration with Force-Constrained Elastic Maps","url":"https://arxiv.org/abs/2607.09515","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09515v1 Announce Type: new \nAbstract: Robotic manipulation tasks often require simultaneous reasoning over motion and contact forces, yet most Learning from Demonstration (LfD) methods model only spatial trajectories and neglect force interactions with the environment. This limitation reduces robustness and can lead to unsafe or inconsistent task reproduction in force-constrained settings. We propose a novel one-shot multimodal LfD framework for the segmentation, encoding, and reproduction of force-inclusive demonstrations. First, we introduce a multimodal probabilistic segmentation","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10405,"title":"PhysV2A: Reachability-Gated and Semantic-Mask-Constrained Feasibility Completion for Video-to-Robot Manipulation","url":"https://arxiv.org/abs/2607.09365","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09365v1 Announce Type: new \nAbstract: Video-based manipulation provides object-centric motion priors from human demonstrations, generated videos, or RGB-D observations, but such priors are typically embodiment-agnostic and cannot be directly executed by a specific robot. This paper presents \\textbf{PhysV2A}, a reachability-gated and semantic-mask-constrained feasibility-completion framework for converting video-derived 6D object motion into robot-executable manipulation trajectories. The key idea is to treat grasp feasibility as trajectory-conditioned rather than local: each RGB-D-g","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10404,"title":"Effects of Robotic Touch on Older Users During Walking Guidance by a Humanoid Robot","url":"https://arxiv.org/abs/2607.09323","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09323v1 Announce Type: new \nAbstract: The shortage of healthcare staff is a challenge in geriatric care. To address this, robots can be integrated into care settings to provide assistance and emotional support. A promising application is walking guidance, particularly benefiting older adults as navigation skills deteriorate with aging. As walking guidance involves direct contact, the aim of this study is to understand how older adults perceive and respond to different touch modes during guided walking. 24 older adults (68 - 88 yrs.) walked four times a ten-meter trajectory guided by","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10403,"title":"Differential Analysis of Multispectral Images for Terrain Identification","url":"https://arxiv.org/abs/2607.09319","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09319v1 Announce Type: new \nAbstract: Reliable terrain understanding is a prerequisite for autonomous robot navigation. Yet, the widespread RGB-based perception can fail under low illumination, shadows, and material ambiguities. In this work we propose DRIFT, a lightweight multispectral framework that combines raw spectral bands and illumination-tolerant band-ratio representations through a dual-stream residual architecture and a differential fusion branch. Band ratios attenuate multiplicative acquisition effects (illumination/sensor gains), while the differential fusion explicitly","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10402,"title":"Robot Trajectron V3: A Probabilistic Shared Control Framework for SE(3) Manipulation","url":"https://arxiv.org/abs/2607.09315","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09315v1 Announce Type: new \nAbstract: We aim to address the challenge of teleoperating robotic arms for high-degree-of-freedom (high-DoF) manipulation tasks, which is cognitively demanding and error-prone, particularly when relying on low-bandwidth interfaces. We propose Robot Trajectron V3 (RT-V3), a probabilistic shared control framework designed for $SE(3)$ grasping tasks. RT-V3 formulates shared control as Bayesian inference by learning a prior over user intent and combining it with real-time user commands to estimate the posterior intent distribution. The prior models user inte","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10401,"title":"Validating Virtual Reality for Studying Multimodal Human-Robot Interaction in Socially Aware Robot Navigation","url":"https://arxiv.org/abs/2607.09261","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09261v1 Announce Type: new \nAbstract: Virtual Reality (VR) offers a flexible and controllable platform for studying human-robot interaction. Prior work has explored VR for socially aware robot navigation. However, whether VR captures the multimodal interaction dynamics observed in real-world human-robot co-navigation remains insufficiently understood. In this work, we present a VR prototype and evaluate its suitability for studying multimodal human-robot interaction (HRI) in socially aware navigation. Specifically, we investigate whether VR preserves the multimodal interaction dynam","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10400,"title":"Implicit-Behavior Coordination from Unlabeled Sub-Task Demonstrations for Rearrangement Tasks","url":"https://arxiv.org/abs/2607.09234","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09234v1 Announce Type: new \nAbstract: Long-horizon robotic rearrangement tasks are often treated as skill sequencing problems, requiring predefined skills, skill labels, or boundaries, and task-specific switching logic. Although effective, such explicit skill abstractions can become difficult to scale as the number of behaviors and the task horizon increase. We instead formulate rearrangement as implicit-behavior coordination from unlabeled sub-task demonstrations, where skill-like behaviors are learned directly from mixed behavior data and coordinated through value-guided action se","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10399,"title":"Tactile and Vision Conditioned Contact-Centric Control for Whole-Arm Manipulation","url":"https://arxiv.org/abs/2607.09218","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09218v1 Announce Type: new \nAbstract: Whole-arm manipulation involves direct contact with the environment while the robot completes a task by distributing contact across multiple links as contacts form, slide, and break. This setting breaks common implicit assumptions in many learning-based manipulation pipelines: arm configuration tightly couples motion and contact forces, contact state is partially observed under occlusion, and purely learned rollouts can become physically inconsistent under distribution shift because many multi-link contact configurations are sparsely represented","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10398,"title":"Empirical Pedestrian Safety Assessment in a Mobile Robot Using a Predictive Social Force Model","url":"https://arxiv.org/abs/2607.09192","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09192v1 Announce Type: new \nAbstract: Mobile robots are going to share the sidewalks with pedestrians. They must ensure their objective safety and respect the walkers' subjective safety/comfort. Computationally efficient Social Force Models (SFM) present interpretable solutions for real-time robot navigation in dynamic crowds. Recent explorations of Projected Time-to-collision (PTTC) integration into SFM variants, for example, PTTC-based SFM (TSFM), improve safety metrics. But the effect of predictive variants is unclear. We introduce Predictive SFM (PSFM) and Predictive TSFM (PTSFM","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10397,"title":"GenVid2Robot: From Video Generation to Robot Manipulation via Rigid-Geometric Consistency","url":"https://arxiv.org/abs/2607.09191","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09191v1 Announce Type: new \nAbstract: Generated videos provide useful visual motion priors for robot manipulation, but their visual plausibility does not imply physical executability. A generated video usually lacks metric geometry, grasp grounding, robot kinematic feasibility, and execution-time feedback, which makes direct trajectory replay unreliable in real-world manipulation. This paper presents GenVid2Robot, a rigid-geometric consistency framework that converts generated video motion into executable real-robot manipulation trajectories. Given an initial RGB-D observation and a","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10396,"title":"TactiDex: A Real-World Tactile-Guided Benchmark for Human-Like Dexterous Manipulation","url":"https://arxiv.org/abs/2607.09190","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09190v1 Announce Type: new \nAbstract: Tactile feedback is fundamental to Hand-Object Interaction (HOI), governing contact formation, force regulation, and stable manipulation, making it essential for achieving true human-like dexterous manipulation. Yet, current human-to-robot dexterous transfer pipelines primarily rely on kinematic trajectories, resulting in motion imitation without physically grounded interaction. To address this, we introduce TactiDex, a real-world tactile-guided benchmark specifically designed to move dexterous manipulation beyond kinematic mimicry toward contac","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10395,"title":"Residual Physics-Informed Neural Networks for High-Fidelity BLDC Motor Modeling","url":"https://arxiv.org/abs/2607.09136","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09136v1 Announce Type: new \nAbstract: Accurate dynamics modeling of Brushless DC (BLDC) motors is fundamental to high-performance robotic joint control. This paper presents a Physics-Informed Neural Network (PINN) with a deep residual (ResNet) backbone that learns a continuous-time surrogate of the full six-state BLDC motor dynamics. Given simulation time, applied three-phase voltages, and excitation parameters as inputs, the network directly predicts all motor state variables -- rotor angle, angular velocity, three-phase currents, and winding temperature -- while simultaneously sat","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10394,"title":"Dec-MARVEL: Decentralized Multi-Agent Exploration without Communication under Budget Constraints","url":"https://arxiv.org/abs/2607.09060","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.09060v1 Announce Type: new \nAbstract: Multi-UAV exploration is often constrained by unreliable communication, limited field-of-view sensing (e.g., lightweight onboard camera), and finite travel budgets that require each robot to reserve enough budget to return to its base. We present Dec-MARVEL, a decentralized budget-aware exploration framework for communication-free teams with directional sensing. Rather than exchanging maps, goals, or messages, each robot coordinates through its incidental observations: any teammate trajectory within its field of view serves as a coordination sig","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10393,"title":"CLAP: Direct VLM-to-VLA Adaptation via Language-Action Grounding","url":"https://arxiv.org/abs/2607.08974","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08974v1 Announce Type: new \nAbstract: Vision-language-action models (VLAs) inherit semantic capabilities from pretrained VLMs, yet large-scale post-training on robot data and architectural modifications can reshape the backbone so extensively that it becomes difficult to isolate what the VLM contributes to control. Directly converting pretrained VLMs into VLAs with minimal architectural change offers a more transparent path to understanding how VLM capabilities transfer across model scales. The core obstacle is output-distribution mismatch: predicting actions as bare numeric token s","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10392,"title":"SplatCtrl: Perception-Action Coupling via Gaussian Scene Representations and Reactive Robot Control","url":"https://arxiv.org/abs/2607.08948","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08948v1 Announce Type: new \nAbstract: Robotic manipulators excel in structured environments but face substantial challenges in unstructured and dynamic settings. This paper presents SplatCtrl, a unified framework for real-time scene reconstruction and reactive robot motion generation to enable collision-free robotic arm control in previously unseen and continuously changing environments. Building on 3D Gaussian Splatting (3D-GS), we introduce a hybrid voxel-based filtering and dynamic Gaussian relocation strategy that supports efficient scene reconstruction from RGB-D streams while","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10391,"title":"FlowDAgger: Human-in-the-Loop Adaptation of Generative Robot Policies in Latent Space","url":"https://arxiv.org/abs/2607.08877","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08877v1 Announce Type: new \nAbstract: Pretrained generative robot policies based on flow matching and diffusion have achieved impressive results across a wide range of manipulation tasks. Yet real-world deployments routinely expose failure modes outside the pretraining distribution. Closing these gaps typically requires large-scale data collection or online reinforcement learning on physical hardware, which is impractical for rapid and safe adaptation. We present FlowDAgger, a sample- and compute-efficient method for adapting frozen generative robot policies from human interventions","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"},{"id":10390,"title":"AgenticFocus: Object-Preserving Mixed Reality Synthesis from Human FPV Video for Dexterous Humanoid Learning","url":"https://arxiv.org/abs/2607.08857","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.08857v1 Announce Type: new \nAbstract: Human egocentric video is a scalable supervision source for humanoid policy learning, but current pipelines struggle with hand-object occlusion, oversimplified motion, or specialized capture hardware. We introduce AgenticFocus, a Mixed Reality synthesis pipeline that converts ordinary first-person-view human videos into robot-trainable demonstrations by restoring occluded object geometry, reconstructing full-hand motion, and retargeting it to a humanoid embodiment through camera-relative alignment and layered compositing. The resulting dataset p","tags":[],"cluster_size":1,"ts":"2026-07-13T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
