04.52%","url":"https://wallstreetcn.com/livenews/3175901","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"港股IPO市场持续火热。Wind数据显示，今年以来截至10月8日，港股市场有115家公司完成IPO（首次公开募股），较去年同期增长89%；IPO募资总额3855.66亿港元，同比增长104.52%。同时，IPO后备队伍不断壮大，除保密递交的企业外，聆讯状态为“处理中”的企业有363家，其中，已在A股上市的有101家，占比为27.82%。四季度港股IPO市场将有何种表现？对此，德勤中国资本市场服务部全国主管合伙人纪文和表示，多重因素共同推动，香港新股市场的强劲发展势头预计将一直延续至今年年底。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-10-08T22:59:40"},{"id":32703,"title":"险资权益布局趋向多元","url":"https://wallstreetcn.com/livenews/3175895","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"中国保险行业协会近日披露的信息显示，新华保险通过二级市场集中竞价交易方式增持中航科工H股股票，所持股份占该上市公司H股股本比例触及举牌线。梳理今年以来的险资举牌案例，记者发现，相较于去年同期，举牌次数明显回落。业内人士表示，尽管如此，险资的权益类资产配置力度并未减弱，而是更加多元化——通过多品种、多渠道、多策略，加大权益配置力度。在一级市场，险资也正用更有耐心的钱，加速投向更具长期价值的赛道。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-08T22:40:35"},{"id":32704,"title":"连英伟达微软风险也超7%，固收交易员：感觉市场每隔几个小时就要召开紧急会议重新定价AI基建的规模","url":"https://wallstreetcn.com/livenews/3175891","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"近几日，有关SpaceX和博通可能超过1000亿美元的新融资浪潮消息，推动与超大规模云厂商和芯片制造商挂钩的信用衍生品价格攀升，表明交易员认为未来五年违约风险正在上升。对于甲骨文，该风险已超过20%；对于SpaceX，约为16%——即便是全球市值最高的公司英伟达，也被认为在此期间存在超过7%的违约风险。\n\n“每一次新的融资公告都感觉像是又一位参与者加入了争夺投资者资产负债表的拍卖，这造成了在一年前都难以想象的利差波动水平，”Allspring Global Investments高级固定收益交易员马克·克莱格表示。“有些日子感觉市场每隔几个小时就要召开紧急会议，重新定价AI基建的规模。”","tags":[],"cluster_size":1,"ts":"2026-10-08T22:36:09"},{"id":32705,"title":"周四（10月8日）纽约尾盘，标普500股指期货最终跌0.41%，道指期货涨0.12%，纳斯达克100股指期货跌1.23%。\n\n罗素2000股指期货涨0.06%。","url":"https://wallstreetcn.com/livenews/3175866","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四（10月8日）纽约尾盘，标普500股指期货最终跌0.41%，道指期货涨0.12%，纳斯达克100股指期货跌1.23%。\n\n罗素2000股指期货涨0.06%。","tags":[],"cluster_size":1,"ts":"2026-10-08T21:07:36"},{"id":32706,"title":"腾讯控股于10月7日以1.003亿港元回购238,000股——香港交易所文件 - Moomoo","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxQeXUtaGVQa0hVcjFJdno1TndwMzBpNk9aeklqT2k0NkpyYzViWE9NbVJpb190NTBHZV9URmZqQmZXbUJyX1RyNF9xUUtyUlMwNzAtd3BxNTF1MXZFSkcxai1sOU1CX2dYMXBoUE0yNjR member","url":"https://arxiv.org/abs/2610.10778","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10778v1 Announce Type: new \nAbstract: Long-term agents face growing storage demands as they accumulate experience. World models capture reusable regularities that can reduce the information stored for each experience. We formulate the problem of memory allocation conditioned on a world model and introduce MemoWM, a framework that uses shared predictions to compress retained information and reconstruct omitted content. Its task-aware allocation rule balances the expected impact of reconstruction errors against storage cost, retaining information with downstream value beyond the predi","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32841,"title":"NEMORA: Neural Equivariant Multipole Operators for Long-Range Atomistic Learning","url":"https://arxiv.org/abs/2610.10776","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10776v1 Announce Type: new \nAbstract: Equivariant graph neural networks have emerged as foundational architectures for machine-learned interatomic potentials, approaching quantum-chemical accuracy at a fraction of the computational cost. These models describe local atomic environments accurately, but finite spatial cutoffs truncate long-range information flow, and stacking message-passing layers can lead to over-smoothing and over-squashing. Existing long-range extensions either prescribe a fixed analytical propagation kernel, restrict long-range communication to scalars or degree-p","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32840,"title":"Conversational Task Disambiguation over Tabular Data: Leakage-Aware Formulation, Benchmark Suite, and Training","url":"https://arxiv.org/abs/2610.10740","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10740v1 Announce Type: new \nAbstract: Conversational task disambiguation over tabular data uses dialogue to resolve missing information about a user's intended task before producing a solution over tables or databases. Existing evaluation and training lack a leakage-aware foundation. Task success mixes the agent's disambiguation and solution-generation capabilities and can also reflect oracle leakage, that is, information that a user simulator reveals beyond what a real user would. Existing datasets also lack a shared representation of ambiguities and access boundaries. We introduce","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32839,"title":"Learning infinite context windows in recurrent architectures via spatial neural computing","url":"https://arxiv.org/abs/2610.10690","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10690v1 Announce Type: new \nAbstract: Recurrent neural networks (RNNs) offer linear-time scaling with sequence length while requiring only constant memory, yet they struggle to capture long-range dependencies due to vanishing gradients and limited receptive fields. To address these limitations, we introduce a second-order recurrent model in which the standard neuron-to-neuron communication is replaced by a spatially evolving field governed by (discretized) partial differential equations. Drawing inspiration from the role of cortical waves in brain computation, this mechanism allows","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32838,"title":"Explaining the Saliency Map Sparsity of Adversarially-Trained Neural Networks","url":"https://arxiv.org/abs/2610.10666","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10666v1 Announce Type: new \nAbstract: Understanding why deep neural networks make a given prediction is of great importance for their safe deployment. In computer vision, saliency maps, which highlight the image region most influential for a prediction, remain a widely-used form of explanation. An empirical observation is the apparent sparsity of gradient saliency maps of adversarially-trained neural networks. In this paper, we propose a theoretical explanation of this phenomenon for two-layer ReLU networks. We build on the established equivalence of adversarial training to the mini","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32837,"title":"Teaching PPG How not Who: Fixed-Effects Distillation from ECG","url":"https://arxiv.org/abs/2610.10662","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10662v1 Announce Type: new \nAbstract: ECG is widely used to teach PPG-only models, yet what it teaches is unexamined. Wearables are valued for tracking how a person's cardiovascular state changes, but ECG-to-PPG distillation mostly learns who the person is. A per-recording mean, the trait, holds 40-59% of a frozen ECG teacher's target, and pooled students memorise it without carrying it to new recordings. The raw alignment cosine misses this, since a constant predictor scores 0.793. Across 34 runs, the more identity a student memorises, the less state it learns. Fixed-effects distil","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32836,"title":"Beyond Owls: Subliminal Learning Can Transfer Learned Capabilities and Backdoors","url":"https://arxiv.org/abs/2610.10657","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10657v1 Announce Type: new \nAbstract: In subliminal learning (SL), a teacher model passes on a trait to a student model by distillation on data semantically unrelated to the trait. So far, SL has been demonstrated for only a limited range of traits, including preferences for animals (e.g., owls) and malicious personas. These traits can also be elicited with simple prompts or with steering. Can SL transfer a wider range of traits, including more complex ones? If so, distillation might transfer subtle forms of misalignment (e.g., reward-seeking, scheming, and secret loyalties) without","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32835,"title":"Nullify: Null-Space Activation Steering for Training-Free LLM Unlearning","url":"https://arxiv.org/abs/2610.10655","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10655v1 Announce Type: new \nAbstract: Large Language Models (LLMs) inevitably internalize substantial amounts of sensitive or private information during pre-training, while LLM unlearning aims to selectively erase specific knowledge to prevent privacy leakage with minimal loss of model utility. However, existing methods struggle to balance forget quality with utility, and typically incur substantial computational costs due to parameter fine-tuning. To address this, we propose Nullify, a training-free, non-destructive activation steering method for LLM unlearning. Nullify employs ste","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32834,"title":"PXtal: Learning to Align Powder X-Ray Diffraction and Crystal Structures under Information Asymmetry across Modalities","url":"https://arxiv.org/abs/2610.10653","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10653v1 Announce Type: new \nAbstract: Scientific multimodal learning commonly assumes that paired views are comparably informative. Powder X-ray diffraction (PXRD) makes this mismatch explicit: compressing a three-dimensional crystal structure into a one-dimensional diffraction pattern loses information and makes the pattern harder to connect to the crystal structure that produced it. We introduce PXtal, a framework for learning aligned PXRD and crystal representations under this physically imposed information asymmetry. PXtal uses Unbalanced Optimal Transport (UOT) to adapt the cro","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32833,"title":"Beyond the Ergodic Wall: A Discrete Geometric Physics Sandbox for Analysing AI Scaling Limits and Complexity Collapse","url":"https://arxiv.org/abs/2610.10651","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10651v1 Announce Type: new \nAbstract: This paper exposes the ergodic ceiling and thermodynamic inefficiency of current deep learning, which converges to a statistical average of historic human knowledge. True semantic novelty requires a path-dependent, spatiotemporally bounded observer (a Data LifeCone) to inject non-ergodic insight, achieving KL divergence and avoiding manifold lock-in. AI Safety must recognise that a mature Artificial Superintelligence (ASI) would regard human-AI symbiosis as a thermodynamic necessity to avoid model collapse. We therefore propose hard physical con","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32832,"title":"Leakage-Controlled Multimodal Learning for Diagnosis and Progression Prediction in Alzheimer's Disease Research","url":"https://arxiv.org/abs/2610.10648","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10648v1 Announce Type: new \nAbstract: Alzheimer's disease prediction involves irregular visits, heterogeneous measurements and incomplete modalities. This study presents a multimodal multitask framework combining an adapted SFCN MRI encoder, four causal clinical Transformers, shared fusion and task-specific ODE-GRU dynamics. Fine-tuning and LoRA adapt the final two MRI blocks. Task-DRO balances task losses, while Group-CVaR targets cohort and comorbidity strata. Branch-specific input controls, subject-grouped partitions and empirical causality checks support longitudinal evaluation.","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32831,"title":"Coverage-Aware Reasoning with Medical Tokens for Diagnosis Prediction","url":"https://arxiv.org/abs/2610.10641","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10641v1 Announce Type: new \nAbstract: Large language models (LLMs) offer promising potential for next-visit diagnosis prediction, owing to their ability to integrate longitudinal clinical evidence and reason over it in natural language. However, reinforcement learning for LLM reasoning commonly rewards each trajectory according to the correctness of its final answer. In next-visit diagnosis prediction, multiple diagnoses can be simultaneously valid, but independently rewarding one diagnosis per trajectory does not distinguish repeated hits from coverage of different diagnoses. The p","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32830,"title":"Visible Reasoning Is Not a Universal Optimizer: Persona- and Thinking-Dependent Effects in Analytics Code Generation","url":"https://arxiv.org/abs/2610.10639","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10639v1 Announce Type: new \nAbstract: Visible Chain-of-Thought (CoT) is often treated as a broadly useful reasoning instruction, yet analytics code generation combines natural-language ambiguity, schema grounding, target-language constraints, and model-specific inference behavior. Because the same analytics request can be expressed in two distinct target languages-SQL and Python (pandas)-this setting provides a natural test of a common but under-examined assumption: that visible reasoning is more effective when its representation matches the requested target, as in \"think in SQL\" or","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32829,"title":"Phase-HDC: Replacing Optimizer History with Gradient Thresholds in Discrete Phase Learning","url":"https://arxiv.org/abs/2610.10630","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10630v1 Announce Type: new \nAbstract: Training a compact model often needs far more memory than storing it, because the optimizer keeps its own records of past gradients. For a hyperdimensional classifier whose learned parameters are low-bit angles, which we call a \\emph{phase memory}, these records take several times more memory than the model itself. We ask whether such a model can be trained while storing nothing but the model. The proposed method, Phase-HDC, turns each stored angle by at most one step per update, against the sign of its current gradient, and only when that gradi","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32828,"title":"Sample-Efficiency of Kolmogorov-Arnold Networks","url":"https://arxiv.org/abs/2610.10627","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10627v1 Announce Type: new \nAbstract: Deep reinforcement learning has achieved substantial performance gains over classical control approaches. Yet, a central challenge to learning in real-world applications is acquiring costly samples. Kolmogorov-Arnold Networks are a recently proposed architecture that can learn physical relationships in control problems effectively, with significantly higher parameter efficiency and interpretability when compared to Multi-Layer-Perceptron architectures. In this work, we systematically study sample-efficiency using computational experiments, cover","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32827,"title":"Exact SO(3)-Equivariant Isotropic Kernels for Rotation-Robust Neural Dynamics","url":"https://arxiv.org/abs/2610.10626","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10626v1 Announce Type: new \nAbstract: Neural surrogates for vector-valued partial differential equations can fit training data yet change their predictions when the same physical state is expressed in a rotated coordinate frame. We study this failure on three-dimensional Navier--Stokes dynamics observed at irregularly placed points. We introduce the Invariant-Conditioned Isotropic Kernel Neural Operator (IKNO), a compact graph model that builds local interactions from scalar quantities unchanged by rotation and vector directions that rotate with the data. Consequently, rotating the","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32826,"title":"Recurrent Self-Improvement: Dynamic Cross-Loop On-Policy Distillation for Looped Language Models","url":"https://arxiv.org/abs/2610.10623","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10623v1 Announce Type: new \nAbstract: Looped Language Models (LoopLMs) offer a parameter efficient approach to scaling reasoning by reusing shared parameters across recurrent computation steps. Despite their promise, effective post-training of LoopLMs remains challenging. Existing approaches either provide reward based supervision that is sparse or costly to extend across loops, or rely on external teachers or privileged information, leading to limited teacher availability or teacher-student context mismatch. To address these limitations, we introduce LoopOPD, a cross-loop on-policy","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32825,"title":"Self-Organization from Constrained Geometric Radiation","url":"https://arxiv.org/abs/2610.10621","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10621v1 Announce Type: new \nAbstract: How does dynamic order emerge spontaneously in closed systems without external driving? Existing paradigms all require external energy flows, temperature quenching, or slow driving. Here we report constraint-induced self-organization via geometric radiation in coupled metric evolution systems. Simulations reveal a universal four-stage cycle: stress accumulation, super-exponential radiation, chaotic collapse, and convergence to a fractal limit cycle, a novel attractor topology we term the wedge-shaped attractor, with five quantized curvature stat","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32824,"title":"When Routing Reveals Membership: Privacy Leakage from MoE Router Telemetry","url":"https://arxiv.org/abs/2610.10616","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10616v1 Announce Type: new \nAbstract: Mixture-of-Experts (MoE) language models produce routing information during inference that may be logged or exposed for monitoring, debugging, load analysis, and safety auditing. Unlike ordinary model outputs, this telemetry reveals a view of the model's internal computation, raising a privacy question: can it reveal whether an example was used to fine-tune the deployed model? We introduce a router-augmented membership inference attack that combines conventional output-side signals with aggregated routing features and applies a membership classi","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32823,"title":"Temporal transformer CAN encoder with federated lightweight heads for anomaly detection","url":"https://arxiv.org/abs/2610.10613","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10613v1 Announce Type: new \nAbstract: Modern vehicles rely on large numbers of Electronic Control Units (ECUs) that constantly exchange information over the Controller Area Network (CAN) bus. Due to the rapidity, structure, and repetition of this communication, even slight variations in timing, payload values, or message patterns can point to unusual activity. Whether due to errors, malfunctions, or deliberate interference, these anomalies are frequently subtle and challenging to identify with conventional methods that handle messages separately or rely on manually created rules. Mo","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32822,"title":"Coverage, Not Difficulty, Sets How Much Synthetic Data an Activation Probe Needs","url":"https://arxiv.org/abs/2610.10594","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10594v1 Announce Type: new \nAbstract: Activation probes that monitor deployed language models are trained on synthetic conversations, and how many a probe needs is open. We trace learning curves over 10-590 synthetic samples for three monitoring concepts, high-stakes situations, replies harmful to a person, and replies that do not follow the user's instruction, on fourteen held-out evaluation distributions and four probe models, varying the generator LLM and the prompt's detail. The need is set by what is monitored: probes for high-stakes and harmful are within a few hundredths of t","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32821,"title":"SPERA: Spherical Prior EEG Foundation Model with Geometry- and Frequency-Aware Latent Prediction","url":"https://arxiv.org/abs/2610.10571","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10571v1 Announce Type: new \nAbstract: Electroencephalography (EEG) provides a non-invasive measure of ongoing neural activity, but building general-purpose EEG models remains challenging due to the heterogeneity of subjects, devices, and electrode montages. Existing EEG foundation models predominantly rely on reconstruction-based objectives defined on the observed signal, which contains both neural and non-neural components. We introduce SPERA (Spherical Prior EEG Representation Architecture), an EEG foundation model that adopts the joint-embedding predictive architecture (JEPA) to","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32820,"title":"Freeze the Decoder, Heal the Encoder: Parameter-Efficient Adaptation for SVD-Based KV-Cache Compression","url":"https://arxiv.org/abs/2610.10552","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2610.10552v1 Announce Type: new \nAbstract: Comparing parameter-efficient fine-tuning recipes under a single, shared learning rate is a common but flawed practice: when the arms being compared have very different trainable-parameter counts, a shared rate can simultaneously depress the larger arms' means and inflate their variance, manufacturing a large, seemingly multi-seed-significant advantage for the smallest arm that is not a real effect. We document this confound in a concrete setting: post-hoc SVD-based KV-cache compression, where an already-pretrained model is converted to a low-ra","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32819,"title":"RAG-Stress: Probing the Limits of Evidence Reliance in Retrieval-Augmented Generation","url":"https://arxiv.org/abs/2610.11183","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2610.11183v1 Announce Type: new \nAbstract: Following retrieved evidence does not guarantee factual correctness: misleading evidence can induce a model to replace an answer it previously gave correctly. Standard accuracy measures obscure this behavior by combining answer replacement with preexisting errors. We introduce RAG-Stress, a controlled diagnostic protocol for examining the limits of evidence reliance in retrieval-augmented generation. The protocol holds the question and reference answer fixed, edits one assertion to support a designated incorrect answer, and crosses two source pr","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32818,"title":"LadderEdit: Edit-Level Residual Compression for Memory-Efficient Lifelong Editing of LLMs","url":"https://arxiv.org/abs/2610.11160","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2610.11160v1 Announce Type: new \nAbstract: Lifelong editing of LLMs requires storing thousands of edits after acquisition. A widely used family of approaches attaches one LoRA adapter per edit, which preserves behavior but grows linearly in storage. To address this challenge, we propose LadderEdit, a method that compresses each LoRA adapter after it is acquired. Each edit is first stored at low rank as a cheap sketch. We then check whether this sketch still satisfies the rewrite, generalization, and locality contract on probe prompts. Edits that pass keep the sketch; those that fail are","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32817,"title":"Local Prototype Reconstruction for Text-Compatible Speech-to-LLM Bridge Pretraining","url":"https://arxiv.org/abs/2610.11159","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2610.11159v1 Announce Type: new \nAbstract: Speech-to-LLM systems often connect a frozen speech encoder to a frozen large language model (LLM) through a small trainable bridge. The bridge is usually treated as plumbing, but it in fact defines the geometry of the speech-to-LLM interface, and the pretraining objective decides whether that interface provides a reusable initialization for downstream tasks. We study a transferable bridge through two complementary properties: global alignment with the text side, and local lexical manifold compatibility, where bridge embeddings remain close to t","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32816,"title":"The \"10th Juror\": Open-Set Standpoint Screening for Bureaucratic Bias Detection","url":"https://arxiv.org/abs/2610.11136","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2610.11136v1 Announce Type: new \nAbstract: Presupposing the boundaries of bias is itself a form of bias. We study closed-loop bias governance for Dutch government documents, where a system must detect biased language, ground decisions in legal and contextual evidence, rewrite problematic sentences when intervention is warranted, and verify that the rewrite mitigates harm without distorting meaning. Existing methods face three challenges: (i) discriminative classifiers capture surface regularities but lack normative grounding; (ii) zero-shot LLMs often adopt generic viewpoints and over-fl","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#7c3aed","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":32675,"title":"How Firm Should a Grasp Be?","url":"https://arxiv.org/abs/2610.11221","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11221v1 Announce Type: new \nAbstract: An ideal robot grasp is firm enough to securely handle an object, yet gentle enough to avoid damaging it. Achieving this balance requires knowledge of the object's material properties, such as its mass, elasticity, and surface friction. These properties, however, are seldom precisely known a priori. In this work, we propose a visuotactile approach to estimating material properties in real time, during the process of grasping. Our method uses these estimated properties to determine the minimum grasp force required to handle the object. We contrib","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32674,"title":"Demonstrating Arena 5.0: A Photorealistic ROS2 Simulation Framework for Developing and Benchmarking Social Navigation","url":"https://arxiv.org/abs/2610.11220","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11220v1 Announce Type: new \nAbstract: Building upon the foundations laid by our previous work, this paper introduces Arena 5.0, the fifth iteration of our framework for robotics social navigation development and benchmarking. Arena 5.0 provides three main contributions: 1) The complete integration of NVIDIA Isaac Gym, enabling photorealistic simulations and more efficient training. It seamlessly incorporates Isaac Gym into the Arena platform, allowing the use of existing modules such as randomized environment generation, evaluation tools, ROS2 support, and the integration of planner","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32673,"title":"OmniDex: Scaling Dexterous Hand Grasping to Diverse Cluttered Scenes","url":"https://arxiv.org/abs/2610.11194","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11194v1 Announce Type: new \nAbstract: Dexterous grasping is the foundational primitive in embodied AI, demanding massive data to train robust models. As real-world data collection is expensive, simulation has become the mainstream paradigm. Yet, while cluttered scenes best reflect real-world applications, learning to grasp within them is bottlenecked by a critical scarcity of large-scale data. To resolve this, we curate high-quality 3D objects and supporting bases, proposing a scalable seed-and-filter strategy that bypasses sluggish scene-level optimization. This yields an unprecede","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32672,"title":"Higher-Order Action Supervision Makes A Strong Policy Class","url":"https://arxiv.org/abs/2610.11175","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11175v1 Announce Type: new \nAbstract: Modern data-driven decision-making methods, such as imitation learning (IL) and reinforcement learning (RL), have achieved great success in solving many complex tasks. However, these methods often suffer from serious control instability and robustness issues when applied in real-world applications such as robotics and autonomous driving, posing notable challenges for their practical deployment. We argue that this instability issue stems largely from their limitations in solely supervising and optimizing zeroth-order actions (i.e., the action lab","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32671,"title":"PMTRM: Pseudo-Memory Temporal Re-encoding Module for Embodied Policy Learning","url":"https://arxiv.org/abs/2610.11168","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11168v1 Announce Type: new \nAbstract: Robotic manipulation often contains repeated motions whose local observations look similar at different phases. When these phases require different actions, a policy that relies mainly on the current observation may repeat completed motions or switch phases at the wrong time. To address this phase ambiguity, we present the Pseudo-Memory Temporal Re-encoding Module (PMTRM), a lightweight plug-in module with only 7.61M parameters that encodes a bounded history of executed states and actions into a latent sequence for existing policies. To help dis","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32670,"title":"Distributed Relative Localization Based on Ultra-WideBand and LiDAR for Multi-robot with Limited Communication","url":"https://arxiv.org/abs/2610.11141","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11141v1 Announce Type: new \nAbstract: Relative localization is crucial for a multi-robot system to collaboratively perform tasks, such as exploration and formation. However, this is highly challenging for homogeneous robots with similar appearance in GPS-denied and communication-limited environments. In this paper, we propose a fully distributed relative position estimation approach for a team of robots based on onboard UWB and LiDAR sensors, in which LiDAR is utilized to obtain the position of anonymous objects in Line-of-Sight (LOS), and UWB is used for ranging between robots. We","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32669,"title":"FOCUS: From Privileged States to RGB-D with Controlled Modality Switching and Representation Alignment","url":"https://arxiv.org/abs/2610.11119","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11119v1 Announce Type: new \nAbstract: Vision-based reinforcement learning for robotic manipulation is sample-inefficient because RGB-D observations are high-dimensional and noisy. Privileged state information available in simulation can accelerate training, but its absence at test time creates a train-test modality gap. We propose FOCUS, a single-stage PPO framework that trains the critic on privileged state while automatically regulating whether the actor collects rollouts from RGB-D or privileged-state latents. Regulation is driven by the KL divergence between the action distribut","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32668,"title":"Towards Path-Creative Navigation: Robot Navigation through Embodied Interaction","url":"https://arxiv.org/abs/2610.11072","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11072v1 Announce Type: new \nAbstract: Autonomous navigation in cluttered and constrained environments typically assumes a fixed environment and searches only for paths within existing free space. However, a route can be blocked by an articulated structure, a movable object, or a pedestrian, and reaching the goal may therefore require appropriate embodied interaction with the environment. This paper formulates Path-Creative Navigation (PCN), a navigation paradigm in which the robot recovers free space by coordinating locomotion and embodied interaction, and addresses one class of PCN","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32667,"title":"A Reconfigurable Fabric Based Pneumatic Actuator with Button Fastened Constraint Modules for Multi Mode Actuation","url":"https://arxiv.org/abs/2610.11054","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11054v1 Announce Type: new \nAbstract: Soft pneumatic actuators are widely used in soft robotics. However, their actuation modes are typically fixed by internal chamber designs or reinforcements, making post fabrication reconfiguration difficult. This paper presents a reconfigurable fabric-based pneumatic actuator that enables rapid, tool free, and reusable switching among multiple actuation modes by attaching constraint fabric modules to a buttoned textile sleeve. By rearranging low-stretch constraint parts on a single actuator body, the proposed system realizes four actuation modes","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32666,"title":"ActiveReg: Information-Driven Active Regional Probing for Partial-to-Full Bone Registration","url":"https://arxiv.org/abs/2610.11003","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11003v1 Announce Type: new \nAbstract: Accurate bone registration is essential for orthopedic surgical navigation and robotic assistance. In a common workflow, the surgeon needs to identify and probe a number of prescribed locations on the exposed bone surface to obtain data points for registration, which can be difficult and time-consuming under limited surgical exposure. Reducing the number of required points while providing clear probing guidance would ease the surgeon's acquisition task intra-operatively. We present ActiveReg, a closed-loop framework that recommends probing regio","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32665,"title":"iAm.md: Robot Skill Self-Assessment through Agentic Introspection for Unknown Open-Vocabulary Domains","url":"https://arxiv.org/abs/2610.10962","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10962v1 Announce Type: new \nAbstract: Agentic AI based on Large Language Model generalization capabilities offers a wide range of potential applications, including planning for embodied tasks. For example, embodied agents based on Foundation models can generate plausible plans in autonomous robotics scenarios. Due to limited context windows or hallucinatory phenomena in the next-token prediction formulation, behaviors may be generated without establishing whether the deployed robot and the observed environment actually support the requested operation, in what we call a \"grounding fa","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32664,"title":"Higher-Order Morphology Priors for Quadruped Reinforcement Learning Under Actuator Degradation","url":"https://arxiv.org/abs/2610.10934","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10934v1 Announce Type: new \nAbstract: Actuator degradation turns quadruped locomotion into a coordination problem requiring joints to compensate for lost actuation. Prior work suggests that morphology-aware graph policies improve learning and generalization under body perturbations. We ask whether these benefits can be strengthened by explicitly modeling higher-order mechanical structure. We represent the Unitree Go1 as a cell complex with limb- and body-level rank-2 cells and apply Hodge-based message passing. Under degradation training, the node-edge-face Hodge actor achieves the","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32663,"title":"When Listening Becomes Easier: Scrubbing Visual Cues for Shortcut-Free VLAs","url":"https://arxiv.org/abs/2610.10912","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10912v1 Announce Type: new \nAbstract: Shortcut learning is a prevalent issue in robot learning. The limited diversity of robot demonstration datasets can mislead policies into exploiting spurious correlations between tasks and irrelevant features, such as viewpoint or background. Collecting sufficiently diverse robot demonstrations is costly and inefficient, motivating algorithmic alternatives. We focus on vision-language-action (VLA) models and discover that different vision-language model backbones exhibit substantially different levels of susceptibility to visual shortcut learnin","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32662,"title":"OmniHOI: Dexterous Hand-Object Interaction from Monocular Human Video","url":"https://arxiv.org/abs/2610.10855","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10855v1 Announce Type: new \nAbstract: Monocular videos of human manipulation provide abundant dexterous demonstrations, yet reconstructing hand-object interaction from a single view and transferring it to robot hands remain difficult, limiting their direct use for robot execution. Prior methods either require task-specific RL training, limiting scalability, or assume clean motion-capture trajectories and thus cannot operate directly on video. We present OmniHOI, a pipeline that turns an RGB video of hand-object interaction into an interaction-faithful trajectory on dexterous hands.","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32661,"title":"Cross-Embodiment Robot Foundation World Models with Latent Actions","url":"https://arxiv.org/abs/2610.10846","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10846v1 Announce Type: new \nAbstract: The diversity of robot embodiments and action spaces makes it challenging to build robot world models that generalize across different embodiments. We introduce the Latent Action-Conditioned Robot World Model (LAC-WM), which operates within a learned unified latent action space shared across diverse embodiments. This unified action space improves the world model's performance when adapted to previously unseen robot embodiments. We compare LAC-WM with an Explicit Action-Conditioned World Model (EAC-WM), which conditions on explicit motion labels.","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32660,"title":"Skill-SLM: Agent Skill-driven Small Language Models for Reliable Robot Operation","url":"https://arxiv.org/abs/2610.10812","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10812v1 Announce Type: new \nAbstract: Small language models (SLMs) have been increasingly adopted for onboard robot operation because they enable intelligent decision-making. However, existing approaches are mainly distillation-oriented and rely on enumerating representative task-solution pairs. This makes dataset construction difficult and limits generalization to diverse robot tasks whose possible forms grow rapidly. This paper proposes Skill-SLM, a framework that reformulates SLM-driven robot operation as a task-decomposition and skill-composition problem. Given a natural languag","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32659,"title":"Diagnosing and Recovering from Observation-Space Shift at Long-Horizon Skill Seams","url":"https://arxiv.org/abs/2610.10810","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10810v1 Announce Type: new \nAbstract: Long-horizon robotic manipulation is often built by chaining independently trained skills. Although each skill can be reliable in isolation, performance degrades sharply when skills are chained: each downstream skill must start from the state its predecessor leaves behind rather than from its training distribution. We study this failure mode, Observation-Space Shift (OSS), and ask what causes these skill-seam failures. Using privileged simulator resets, we find that the dominant shift comes from displaced scene state (e.g., an open drawer or sec","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32658,"title":"Same Action, Different Outcome: Variability in Dynamic Cloth Manipulation","url":"https://arxiv.org/abs/2610.10801","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10801v1 Announce Type: new \nAbstract: Although cloth is known to exhibit different outcomes under repeated fast dynamic motions, even when the same trajectory is applied, this variability has not yet been systematically characterized. Quantifying it is essential to assess the reliability of learned manipulation policies and the extent to which simulation can reproduce real-world behavior. To study this, we execute the same trajectory ten times across four dynamic tasks, two of which are novel, each tested with three cloths of very different properties and at up to three execution sp","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32657,"title":"NavGPT-3: Harnessing Context in a Hierarchical Navigation Runtime","url":"https://arxiv.org/abs/2610.10787","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10787v1 Announce Type: new \nAbstract: Language models trained with long-horizon agentic reinforcement learning can generalize knowledge through reasoning, express precise actions, and pursue goals over many steps, raising the ceiling on what an embodied agent can understand and decide. Physical interaction, however, remains the domain of action policies, which provide dense, low-latency control. We present NavGPT-3, a harness that connects the two models, with an OS-like runtime built above it: reasoning, acting, and monitoring run as threads with their own context, tools, and permi","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32656,"title":"TAPNAV: Humanoid Navigation through Tactile Active Perception","url":"https://arxiv.org/abs/2610.10748","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10748v1 Announce Type: new \nAbstract: Navigation in vision-denied environments is challenging for humanoid robots because proprioceptive odometry drifts and localization uncertainty accumulates rapidly. We present TAPNAV, a tactile active-perception framework that enables humanoid navigation toward a goal by actively probing surrounding structures without relying on vision. TAPNAV maintains a pose belief from odometry, IMU, and tactile contact observations, and couples uncertainty-aware global route planning with information-gain-driven local probing. The global planner searches for","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32655,"title":"TacHair: Tactile Contact-Distribution Guided Online Correction for Robotic Hair Stroking and Perception","url":"https://arxiv.org/abs/2610.10637","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10637v1 Announce Type: new \nAbstract: Hair stroking is common in daily grooming and personal care, and is also widely used in hair-product evaluation, motivating robots with similar physical interaction capabilities. Existing robotic hair-care and surface-following methods mainly rely on trajectory planning, compliance, force regulation, or tactile-conditioned policies, but deformable hair can remain in contact while gradually drifting across the end-effector, making local interaction difficult to regulate. We propose TacHair, a tactile contact-distribution guided online correction","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32654,"title":"Teaching a Robot Dog New Tricks: Diverse Quadruped Skills via Combined Reinforcement and Imitation Learning with Adversarial Task Selection","url":"https://arxiv.org/abs/2610.10601","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10601v1 Announce Type: new \nAbstract: Reinforcement Learning (RL) has enabled legged robots to perform a range of skills in single-task settings. However, applications such as farm robotics or space exploration require diverse skills such as locomotion, digging, or close-range surveying. Training an end-to-end policy to address this problem remains difficult due to challenges such as sample inefficiency and gradient conflict between tasks in multi-task learning. We propose a three-stage method that trains a single policy to perform distinct tasks such as walking, digging, and hoppin","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32676,"title":"Odyssey-3 drives a car in India and runs humanoids from one world model - The Next Web","url":"https://news.google.com/rss/articles/CBMihAFBVV95cUxOTUxPZzNqWTNJT1RVWDJGbUJDRjFrU3Y2TXpGaDhQTEJtcjFuX3I5YTE0Z3paekUxTnZER21RNGd0REhrejdnZHJ6Nm5WTURtUjU0T0t5SHlXcG0zRG5ta0N0Z1JHN0hEUldvT3hOb181LUI1ZUpyTjNYcFdmbEZMRkZ5YTA?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMihAFBVV95cUxOTUxPZzNqWTNJT1RVWDJGbUJDRjFrU3Y2TXpGaDhQTEJtcjFuX3I5YTE0Z3paekUxTnZER21RNGd0REhrejdnZHJ6Nm5WTURtUjU0T0t5SHlXcG0zRG5ta0N0Z1JHN0hEUldvT3hOb181LUI1ZUpyTjNYcFdmbEZMRkZ5YTA?oc=5\" target=\"_blank\"\u003eOdyssey-3 drives a car in India and runs humanoids from one world model\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eThe Next Web\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-08T16:23:10"},{"id":32247,"title":"This Disembodied Hand Is All the Robot You Need","url":"https://spectrum.ieee.org/walking-robotic-hand","source":"IEEE Spectrum · Robotics","sources":["IEEE Spectrum · Robotics"],"summary":"\u003cimg src=\"https://spectrum.ieee.org/media-library/a-detached-robotic-hand-using-its-five-fingers-to-walk.jpg?id=6838 n a 2D environment retains its functional role after transfer to a 3D physics-based simulator. To support this analysis, the effects of the episode time budget, the social cue, and the asymmetry between the two co-evolved roles were examined. The results indicate that the success","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32269,"title":"RoboRender: Robot-Oriented Video Generation for Visual Sim-to-Real Transfer","url":"https://arxiv.org/abs/2610.09254","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09254v1 Announce Type: new \nAbstract: Simulation enables large-scale, low-cost robot data generation, but policies trained in simulation often fail to transfer to the real world due to the sim-to-real visual discrepancies. Existing approaches often rely on intermediate representations, which can discard rich semantic information or require additional perception modules at deployment. We address this visual sim-to-real gap with RoboRender, a framework that converts simulated trajectories into photorealistic RGB videos for policy learning. RoboRender trains a robot-oriented video gene","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32268,"title":"Co-Evolving Robot Orchestrators and Policies through Deployment","url":"https://arxiv.org/abs/2610.09228","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09228v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies trained on large datasets are capable within their training domains, yet they still fail to generalize to the variety of situations a robot meets in real-world deployment. Agentic robot systems complement the policy with a vision-language model (VLM) orchestrator that learns when to call the policy, how to instruct it, and when to use scripted skills instead. However, because the harness is built around a frozen policy that has limited language steerability, the orchestrator can avoid the policy's failures b","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32267,"title":"Fast Planning for Multi-object Multi-target Throwing","url":"https://arxiv.org/abs/2610.09224","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09224v1 Announce Type: new \nAbstract: Robot throwing has emerged as a promising technique for improving efficiency in logistics and warehouse automation, by enlarging the workspace and speeding up the process. To significantly increase the throwing system's throughput, we develop strategies for throwing multiple objects in one swipe. Such multi-object multi-target throwing (MOMT) leverages the large degrees of freedom of anthropomorphic hands. The key is to quickly generate fast and feasible throwing motions, which involves a complex trade-off between short trajectory duration and s","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"},{"id":32266,"title":"Embedded Evaluation of Task Admission Coalescing in Decentralized Multi-Robot Systems","url":"https://arxiv.org/abs/2610.09187","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.09187v1 Announce Type: new \nAbstract: Multi-robot task allocators in dynamic missions commonly admit newly released tasks immediately, potentially invoking allocation for each new arrival. We evaluate task-admission coalescing as a mechanism for controlling allocator processor work while accounting for target-service latency, using CBAA, ACBBA, PI, and HIPC as a representative MRTA suite. The study comprises a 3,000-mission AGX Orin campaign with measured computation delay, 3,000 paired zero-compute missions, and a 96-mission Pololu 3pi+ RP2040 allocator hardware-in-the-loop campaig","tags":[],"cluster_size":1,"ts":"2026-10-08T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
