a-vmark=\"cc6c\"\u003e火山方舟已开启豆包音频生成模型 1.0 API 邀测，个人用户可以在火山方舟体验中","tags":[],"cluster_size":1,"ts":"2026-06-24T01:39:42"},{"id":5220,"title":"消息称台积电先进制程代工将全线涨价，包含 7nm 及以下所有先进制程","url":"https://www.ithome.com/0/967/746.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"0416\"\u003eIT之家 6 月 24 日消息，科技分析师 Tim Culpan（蒂姆 · 库尔潘）昨日透露，自今年初以来，台积电的高层就指示其业务开发和销售团队，要求他们设法提高报价。\u003c/p\u003e\u003cp data-vmark=\"2e5a\"\u003e管理层向团队表示，眼看存储芯片同行正享受着价格上涨的红利，这家晶圆代工厂也想从中分一杯羹。\u003c/p\u003e\u003cp data-vmark=\"1776\"\u003e库尔潘透露，台积电向客户表示，\u003cstrong\u003e所有先进节点都将面临涨价\u003c/strong\u003e，涨价范围不仅涵盖市场传言的 3nm 制程，\u003cstrong\u003e更扩及 7nm 及以下所有先进制程\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"e612\"\u003e据悉，整体涨幅约 5％至 10％，影响范围涵盖台积电约 75％的晶圆营收来源。\u003c/p\u003e\u003cp data-vmark=\"bdef\"\u003e库尔潘预估，\u003cstrong\u003e2026 年台积电全年营收预计将增长至少 30%\u003c/strong\u003e，突破 1600 亿美元（IT之家注：现汇率约合 1.09 万亿元人民币）大关。\u003c/p\u003e\u003cp data-vmark=\"b393\"\u003e随着下半年涨价措施的正式生效，预计将带来约 850 亿美元（现汇率约合 5780.34 亿元人民币）的营收，且预计至少 80% 的晶圆营收将来自先进节点。\u003c/p\u003e","tags":[],"cluster_size":1,"ts":"2026-06-24T01:32:17"},{"id":5221,"title":"拆解医疗AI落地“最后一公里”：医渡科技(02158)280个智能体已进入临床 - 新浪财经","url":"https://news.google.com/rss/articles/CBMipwFBVV95cUxONzktMFNqQmpISWZLRmx3WDJWNy1mOEdWWUd4N05YRHhBamZVTnhzbEUzek03VDl6bkxmYmpHTlJYVHBDRUpvRG5UMDhSSzlhMVRmOWFTYXpjWGxBVVZnVzdMQkRMVlpsemhZdF81elRPNlVWdHVZV09tTWdUV3lDQ094dHYxdWNjdURuT20ycE1GWEp2YmNZQVdOcUt2Y2hDVU1aSWVUSQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipwFBVV95cUxONzktMFNqQmpISWZLRmx3WDJWNy1mOEdWWUd4N05YRHhBamZVTnhzbEUzek03VDl6bkxmYmpHTlJYVHBDRUpvRG5UMDhSSzlhMVRmOWFTYXpjWGxBVVZnVzdMQkRMVlpsemhZdF81elRPNlVWdHVZV09tTWdUV3lDQ094dHYxdWNjdURuT20ycE1GWEp2YmNZQVdOcUt2Y2hDVU1aSWVUSQ?oc=5\" target=\"_blank\"\u003e拆解医疗AI落地“最后一公里”：医渡科技(02158)280个智能体已进入临床\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-2 luster_size":1,"ts":"2026-06-23T04:46:03"},{"id":5084,"title":"Membrane-based Acoustic Microrobots","url":"https://arxiv.org/abs/2606.21047","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.21047v1 Announce Type: new \nAbstract: Acoustic microrobots have emerged as a promising frontier for targeted drug delivery and minimally invasive medicine due to their high-power density and biocompatibility. Despite wide-ranging designs, conventional acoustic microrobots mostly rely on air microbubbles trapped within confined microcavities within the robot body, which suffer from limited operational longevity due to rapid gas dissolution and resultant shifts in resonance frequency. In this paper, we propose a robust, membrane-based acoustic microrobot that overcomes these limitatio","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5083,"title":"BayesFP: Posterior Estimation for Flow-Based Policies via Feynman-Kac Sampling","url":"https://arxiv.org/abs/2606.21014","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.21014v1 Announce Type: new \nAbstract: Robots must generate trajectories that remain faithful to learned expert behavior while satisfying safety constraints and task-specific objectives specified only at inference time. We formulate constrained trajectory generation for pretrained diffusion and flow-matching policies as Bayesian posterior sampling, with the learned demonstration distribution as a prior and an inference-time, cost-derived likelihood tilting it toward feasible, optimal trajectories. To sample from this posterior without any retraining of the base policy, we leverage th","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5082,"title":"R2HandoverSim: A Simulation Framework and Benchmark for Robot-to-Human Object Handovers","url":"https://arxiv.org/abs/2606.21011","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.21011v1 Announce Type: new \nAbstract: We present R2HandoverSim, a simulation benchmark for robot-to-human (R2H) object handovers. Although R2H handover methods have advanced rapidly, the lack of standardized evaluation protocols impedes objective comparison. Our benchmark enables reproducible evaluation by systematically comparing four baselines on their predicted shared grasp poses. We conduct a user study with 30 participants, analyze baseline performance, and show that simulation results correlate with real-world evaluation outcomes. Crucially, five complementary metrics (plannin","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5081,"title":"Inductive Generalization for Robotic Manipulation","url":"https://arxiv.org/abs/2606.20999","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20999v1 Announce Type: new \nAbstract: Understanding the generalization capabilities of visuomotor policies is essential in the development of capable robotic agents. Generalizable models learn structures that transfer across domains. However, in practice, visuomotor policies test performance by interpolation on known distributions using unstructured domain shifts (e.g. lighting, clutter, diverse objects). We argue that to measure generalization capabilities we must instead test the inductive capacity of policies on progressively harder, out-of-distribution task variants. We call thi","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5080,"title":"Duet: Dual-Robot Understanding via Efficient Teaching","url":"https://arxiv.org/abs/2606.20990","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20990v1 Announce Type: new \nAbstract: Dual-robot collaboration enables tasks that exceed the reach and payload of a single robot, such as collaboratively transporting objects across environments and executing coordinated handovers. Data acquisition is the primary bottleneck for training these systems. To this end, we introduce DUET, a dual-robot learning framework for mobile manipulation. For efficient data collection, we create a unified dual-embodiment synchronized VR-based teleoperation system for in-domain heterogeneous robot data collection. We further develop a complementary t","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5079,"title":"Heterogeneous Policy Networks for Composite Robot Team Communication and Coordination","url":"https://arxiv.org/abs/2606.20962","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20962v1 Announce Type: new \nAbstract: High-performing human-human teams learn intelligent and efficient communication and coordination strategies to maximize their joint utility. These teams implicitly understand the different roles of heterogeneous team members and adapt their communication protocols accordingly. Multi-Agent Reinforcement Learning (MARL) has attempted to develop computational methods for synthesizing such joint coordination-communication strategies, but emulating heterogeneous communication patterns across agents with different state, action, and observation spaces","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5078,"title":"Learning-Based Modeling of Soft Robots via Cosserat Rod Theory","url":"https://arxiv.org/abs/2606.20958","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20958v1 Announce Type: new \nAbstract: Modeling soft robot dynamics is challenging due to their continuum structure and typically nonlinear dynamics. Creating models based on first-order principles is typically time-demanding, and their expressiveness is limited, whereas data-driven models lack interpretability and physical consistency. This work aims to overcome these challenges by introducing a port-Hamiltonian Gaussian Process Regression framework for learning and simulating the dynamics of planar, rod-like soft robots. In detail, the proposed model integrates Cosserat rod theory","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5077,"title":"Vesta: A Generalist Embodied Reasoning Model","url":"https://arxiv.org/abs/2606.20905","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20905v1 Announce Type: new \nAbstract: Robots operating in open-world environments must seamlessly integrate localization, spatial reasoning, navigation, and long-horizon planning. While specialist models excel at individual tasks, deploying a multi-model stack is computationally expensive and prone to cascading errors. We present Vesta, a unified embodied generalist that consolidates these capabilities into a single foundation model. Our approach combines a diverse and massive curated corpus designed to induce spatial grounding and a simple multimodal memory harness that enables rea","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5076,"title":"Geometric Entropy: When Trajectory Diversity Helps and Hurts in Imitation Learning","url":"https://arxiv.org/abs/2606.20871","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20871v1 Announce Type: new \nAbstract: We study how trajectory-shape diversity in demonstrations affects imitation learning (IL) performance across models, tasks, and data scales. We introduce Geometric Entropy (H_G), a task-agnostic metric that quantifies the intrinsic diversity of transit trajectories after normalizing away extrinsic variation, such as goal pose and workspace scale, via target-frame alignment. Across multiple IL architectures and both simulated and real-robot contact-rich manipulation tasks, we observe a consistent inverted-U relationship between success and H_G: i","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5075,"title":"World Action Models: A Survey","url":"https://arxiv.org/abs/2606.20781","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20781v1 Announce Type: new \nAbstract: World Action Models (WAMs) are embodied predictive-action models that make a forecast of the future available to action. Recent WAMs repurpose large video generation models, and a parallel line relies on language or vision-language backbones without a video-generation core. This rapid expansion has blurred the boundary among broad world models, video generation models, action-grounded video world models, Vision-Language-Action policies, and WAMs. This survey gives the field a common account. It first clarifies these boundaries, then organizes ex","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5074,"title":"UNSEEN: Uncertainty-aware Navigation via Sparse Estimation in Unknown Environments","url":"https://arxiv.org/abs/2606.20755","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20755v1 Announce Type: new \nAbstract: Visual navigation in unknown environments remains a core challenge in mobile robotics, especially for resource-constrained platforms. Most existing approaches rely on loosely coupled modular pipelines and strong assumptions on perception quality or environmental structure, often resorting to multi-modal sensor suites that increase system complexity and deployment cost. Vision-only navigation offers a lightweight alternative, but its performance degrades severely under motion blur, low texture, and illumination changes, largely because they negle","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5073,"title":"Perturbation-Based Uncertainty for Failure Detection in Vision-Language-Action Models","url":"https://arxiv.org/abs/2606.20754","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20754v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have shown strong performance in robotic manipulation, but reliable uncertainty quantification remains challenging, particularly under distribution shift. Unlike autoregressive policies, many modern VLA models generate continuous actions through regression or flow-based generation, where explicit predictive probabilities are unavailable. Moreover, existing approaches often rely on stochastic action sampling or supervised failure labels, limiting their applicability across diverse pretrained VLA models. In this","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5072,"title":"Toward Machine Risk Perception: Integrating Trust Calibration and Precursor-Based Risk Estimation for Humanoid","url":"https://arxiv.org/abs/2606.20748","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20748v1 Announce Type: new \nAbstract: Humanoid robots are emerging as co-workers in smart manufacturing, yet their dynamic, human-like movements introduce safety risks that differ fundamentally from those of fixed or wheeled robots. Conventional safety paradigms based on reactive force or distance limits fail to capture the sequential, uncertain nature of humanoid failures. This study proposes a precursor-driven, trust-calibrated framework to enable proactive humanoid risk perception. Accident evolution is modeled through sequential precursor cues using a Logistic-Exponential (LE) f","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5071,"title":"Coupled Routing and Configuration Optimization for Multi-Viewpoint Robotic Inspection","url":"https://arxiv.org/abs/2606.20739","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20739v1 Announce Type: new \nAbstract: We present a unified framework that turns a set of 6-DoF inspection viewpoints into a time-optimal, collision-free route for a 9-DoF robotic system. Unlike modular pipelines that fix a single inverse-kinematics (IK) configuration per viewpoint, build an all-pairs travel-time map, and then route, our method jointly optimizes the visiting order and the per-viewpoint configuration in a single global search. The three-dimensional self-motion manifold of each viewpoint is parameterized in closed form so that the pose constraint holds by construction,","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5070,"title":"Real-World Deployment of Massively Parallel Sampling-Based MPC for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2606.20712","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20712v1 Announce Type: new \nAbstract: Sampling-based Model Predictive Control (SMPC) is a promising strategy for contact-rich robotic manipulation, combining gradient-free optimization with massively parallel GPU simulation. Yet, most prior work relies on simplified dynamics or remains confined to simulation. We present an MPC framework that leverages JAX for large-scale parallelization and efficient computation, coupled with the high-fidelity MuJoCo MJX simulator, and deploy it on a Franka Research 3 executing the Push-T manipulation task through a complete real-to-sim-to-real pipe","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5069,"title":"SafeDojo: Safe Reinforcement Learning for VLA via Interactive World Model","url":"https://arxiv.org/abs/2606.20698","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20698v1 Announce Type: new \nAbstract: Safe control is a prerequisite for real-world embodied intelligence, for which safe reinforcement learning has emerged as a promising paradigm. However, existing safe reinforcement learning methods either require costly real-world exploration or depend on hand-crafted safety functions. Neither scales to vision-language-action models deployed in open-world physical environments. We propose SafeDojo, the first model-based safe reinforcement learning framework for vision-language-action policies designed to learn safe actions through world model-ba","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5068,"title":"JPPD: Joint Prediction_Planning Diffusion with Differentiable Safety Guidance for Dynamic Obstacle Avoidance in Intelligent Transportation Systems","url":"https://arxiv.org/abs/2606.20686","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20686v1 Announce Type: new \nAbstract: Shared-space transportation operation requires low-speed autonomous platforms to navigate safely and efficiently among pedestrians, service robots, micromobility users, carts, and other road users. Most existing systems decompose this problem into trajectory prediction followed by motion planning, which creates one-way information flow: predicted participant futures influence the robot plan, but the selected robot plan cannot influence the predicted multi-agent evolution. This paper presents a joint prediction-planning diffusion framework that t","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"},{"id":5067,"title":"MemoryVAM: Integrating Memory into Video Action Model for Robot Manipulation","url":"https://arxiv.org/abs/2606.20679","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.20679v1 Announce Type: new \nAbstract: Video-world-model policies learn action-relevant representations by predicting future observations. However, they condition on only a short observation window, which renders long-horizon manipulation non-Markovian when the correct action depends on earlier events that are no longer visible. We present MemoryVAM, an episodic memory mechanism for video-world-model policies. We employ a Recap-Cue (RC) module, in which a Perceiver-based Recap Compressor maps per-frame CLIP embeddings into compact memory tokens, and a lightweight Cue Gate estimates t","tags":[],"cluster_size":1,"ts":"2026-06-23T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
