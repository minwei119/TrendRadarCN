es":["华尔街见闻 · 美股快讯"],"summary":"一、2026财年第四季度财务表现。\n\nApplied Digital第四财季总营收2.587亿美元（同比大幅增长407%），其中HPC托管业务贡献2.03亿美元（含1.524亿美元租户装修服务收入），加密货币数据中心托管业务贡献3730万美元，合并的ChronoScale业务贡献1880万美元。调整后EBITDA为4240万美元，净营业收入（NOI）达3990万美元，NOI利润率高达91%。普通股股东应占净亏损为1.116亿美元（主要受1.168亿美元股权激励费用影响），调整后净利润为1290万美元（折合每股0.04美元）。","tags":[],"cluster_size":1,"ts":"2026-07-28T00:02:07"},{"id":14703,"title":"Rambus二季度分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3140594","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、 整体业绩与财务展望。\n\nRambus最近一个季度总收入突破2亿美元（达到2.074亿美元，同比增长20%），非GAAP每股收益（EPS）达0.77美元（同比增长 24%），双双创历史新高并超出指引上限。这主要得益于产品收入（9920万美元，同比增长22%）及版税收入（8420万美元）的强劲增长。\n\n下一季度（Q3）业绩指引：\n\n预计第三季度总收入在2.1亿-2.16亿美元之间，其中产品收入预计为1.1亿-1.16亿美元（季环比增长14%）。非GAAP每股收益预计在0.75-0.82美元之间。\n\n会计披露标准变更：公司决定停止披露“许可账单”（licensing billings）这一营运指标。因目前ASC 606准则下的版税收入与许可账单之间的差额已微乎其微，未来业绩与指引将完全基于ASC 606收入准则。","tags":[],"cluster_size":1,"ts":"2026-07-27T23:55:39"},{"id":14704,"title":"铿腾电子二季度分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3140584","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、 财务业绩摘要：全面超预期，积压订单创新高。\n\n铿腾电子楷登电子（Cadence Design Systems）二季度营收达15.84亿美元（同比增24.2%），高于市场普遍预期与官方指引上限。\n\n盈利能力维持高位：GAAP 运营利润率 为28.4%，Non-GAAP运营利润率45.5%；Non-GAAP每股收益 (EPS) 达到2.11美元（上年同期为1.65美元），超市场预期的2.06美元。。\n\n储备订单/订单积压破纪录：截至二季度末，储备订单达到81亿美元的创纪录水平，未来12个月内预计履约的收入达42亿美元，显示出极高的业绩可见度。\n\n经常性收入占主导：经常性收入占总营收的78%，业务模式抗风险能力强。","tags":[],"cluster_size":1,"ts":"2026-07-27T23:55:03"},{"id":14705,"title":"华尔街见闻早餐 | 2026年7月28日","url":"https://wallstreetcn.com/livenews/3140563","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯","华尔街见闻 · 港股快讯"],"summary":"AI忧虑盖过油价下跌，标普500指数震荡收平，半导体指数一度跌超5%，SK海力士破发，闪迪一个月接近腰斩，中概股逆市收涨，布油盘中暴跌9%。\n\n特朗普暗示与伊朗可能达成协议，报道称伊朗与阿曼讨论重启霍尔木兹海峡航运，原油应声重挫。\n\n英伟达推进新一轮人工智能相关交易，潜在规模超过7500亿美元，市场\n\n对循环融资的忧虑重燃。\n\n中国商务部新闻发言人就美发布“强迫劳动”301调查最终措施答记者问。\n\n中国6月规模以上工业企业利润同比15.1%，上半年电子行业利润大幅增长96.9%。\n\n债市降费红包来了，中央国债登记结算有限责任公司宣布调降部分主营业务收费，包括全免国际债券（熊猫债）发行登记服务费等五项措施。\n\n长鑫科技市值直冲3万亿，高开471%，中一签赚2万，A股新股王诞生。长鑫科技市值超过英特尔，是茅台2倍多，阿里投了76亿、浮盈超1600亿。\n\n交易定价251.2亿元，“东方证券+上海证券”合并重组草案出炉。\n\nA股一日20家公司公告回购，工业富联3个月购20亿，银行资金首入回购池。\n\n横盘七月后飙涨20%逼近新高，苹果财报前期权惊现“看涨”信号。\n\n中际旭创香港上市发行价定为每股980港元。","tags":[],"cluster_size":2,"ts":"2026-07-27T23:25:09"},{"id":14706,"title":"月内超600家A股上市公司获机构调研，电子行业受青睐","url":"https://wallstreetcn.com/livenews/3140561","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股上市公司上半年业绩预告进入密集披露期，各家机构也加大了调研力度。同花顺iFinD数据显示，7月1日至7月27日，A股共有609家上市公司接受机构调研，其中187家已披露2026年上半年业绩预告，129家公司预计上半年净利润同比增长（按上限计算）。从接待机构数量来看，月内有16家上市公司接待超过100家机构调研，其中，成都新易盛通信技术股份有限公司、澜起科技股份有限公司、京东方科技集团股份有限公司等7家上市公司接待超过200家机构调研。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-07-27T23:15:46"},{"id":14707,"title":"AI时代不同阶段的投资机会？长鑫市值一度超越腾讯 - 新浪财经","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTE5sS3owQWRESXM0UkZFVkdENm9NYzAzaUlJSTJKdlJyOVMwMENVajVLanBLVTZENlNiMWtQSGFNcEtoc1ZaUzg0R0tuWUFXZVFmbjJtQm9HU0RIc2RzOXd2Z1dUakU5aVF5YmRLUG9vUnpGdGEtWU00Zg?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMieEFVX3lxTE5sS3owQWRESXM0UkZFVkdENm9NYzAzaUlJSTJKdlJyOVMwMENVajVLanBLVTZENlNiMWtQSGFNcEtoc1ZaUzg0R0tuWUFXZVFmbjJtQm9HU0RIc2RzOXd2Z1dUakU5aVF5YmRLUG9vUnpGdGEtWU00Zg?oc=5\" target=\"_blank\"\u003eAI时代不同阶段的投资机会？长鑫市值一度超越腾讯\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-27T22:48:57"},{"id":14708,"title":"上半年24家A股公司赴港上市，募资总额逾1200亿港元","url":"https://wallstreetcn.com/livenews/3140553","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月27日，中国上市公司协会发布的6月统计月报显示，上半年境内股票市场（以下简称“全市场”）共有24家A股公司赴港上市，募资总额超过1200亿港元，行业主要集中于新一代信息技术产业、生物产业。上半年末，境外主要市场中国概念上市公司1904家，其中，H股公司较年初增加51家。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-27T22:42:03"},{"id":14709,"title":"波动中调仓换股，海外基金经理上演多空“攻防战”","url":"https://wallstreetcn.com/livenews/3140551","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，面对全球科技股尤其是半导体板块的剧烈波动，海外基金经理正积极调仓：一方面，多家机构因半导体板块估值高企而减少相关持仓，甚至追加空头头寸；另一方面，资金并未真正离场，而是流入软件、金融、医疗、工业、公用事业等低估值板块，部分投资者更是将目光投向太空经济等前沿领域。尽管对短期板块走势的判断存在较大分歧，但多家机构认为，全球人工智能的长期投资逻辑并未动摇，此轮调整更多是拥挤交易后的估值修复与情绪出清，为新一轮布局打开了窗口。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-27T22:39:56"},{"id":14710,"title":"主动权益类基金二季度加仓券商板块，多重稳市信号支撑券商股修复行情","url":"https://wallstreetcn.com/livenews/3140542","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着公募基金2026年二季报完整披露，机构资金布局非银金融的路径清晰显现：主动权益类基金二季度加仓券商板块，34只券商标的获增持，头部投行、互联网券商成为资金核心落脚点。与此同时，近期多家券商密集推出股份回购、国资股东大额增持等利好。在产业资本与机构资金共振下，多重稳市信号落地，机构普遍看好券商板块的估值修复行情。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-27T22:29:03"},{"id":14711,"title":"突破4000美元“拉锯区”，金价筑底信号显现","url":"https://wallstreetcn.com/livenews/3140540","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"自6月以来，黄金持续磨底，近期在4000美元/盎司附近拉锯后迎来突破。受访专家认为，短期内美伊局势仍是金价的核心主线，当前正处于黄金筑底阶段，市场对利多信号变得敏感。同时，“加息交易”动能趋于极限，油价已从压制性变量变为多重变量之一。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-27T22:26:19"},{"id":14712,"title":"基本半导体港交所公告：本公司与承包商就建造碳化硅模块封装产线基地项目订立工程总承包合约。\n\n据此，承包商同意承接本公司碳化硅模块封装产线基地的工程，合约价格总价","url":"https://wallstreetcn.com/livenews/3140536","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"基本半导体港交所公告：本公司与承包商就建造碳化硅模块封装产线基地项目订立工程总承包合约。\n\n据此，承包商同意承接本公司碳化硅模块封装产线基地的工程，合约价格总价为人民币1.933亿元。","tags":[],"cluster_size":1,"ts":"2026-07-27T22:13:51"},{"id":14713,"title":"7月28日热门中概股普涨 阿里巴巴涨2.56%，拼多多涨2.65% - 新浪财经","url":"https://news.google.com/rss/articles/CBMi_wFBVV95cUxNcUdETVRxdTFBU3g0Wkt5Nmg1YTFMdmlrWnpDRzEyaElvbEQ5VVV2ZDByS2I2UmFkWHl2SDZOZ2w1TXF5X0owdHVDTXI2c0QzUkdfMGtHdmhuSkp3X2pmZ1FRUVZZLVNBSDJJODN2RkFJWFpoV1NiTXhSdVgtQVdIeHJLbHZPRUpwR1VsT1R2ZklDV3ZwU1VRWDgtanNLYzdFd2MwbXZ4enhlZkRWa05LMl9KZnVOeElQTzd5VzJWZ2lEYzh6b1BvU1JuN1d2bU83b1FOQ0dmZUhmVlRuOXowbUZ6bTMwNS15WjFCckJjSGpwcEVYVTlnSUx0OEdpaE0?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMi_wFBVV95cUxNcUdETVRxdTFBU3g0Wkt5Nmg1YTFMdmlrWnpDRzEyaElvbEQ5VVV2ZDByS2I2UmFkWHl2SDZOZ2w1TXF5X0owdHVDTXI2c0QzUkdfMGt "2026-07-27T05:07:37"},{"id":14793,"title":"ViTacWorld: Scaling Visuo-Tactile World Models for Contact-Rich Robot Manipulation","url":"https://arxiv.org/abs/2607.22530","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22530v1 Announce Type: new \nAbstract: Contact-rich robot manipulation requires physical interaction cues that are often invisible to cameras, making tactile sensing essential for robust control. However, scaling visuo-tactile robot learning remains difficult because real tactile interaction data are expensive to collect, hardware-dependent, and limited in task and scene diversity. We present ViTacWorld, an action-conditioned visuo-tactile world model for scalable contact-rich robot manipulation. ViTacWorld leverages public real tactile datasets and a constructed simulation environme","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14792,"title":"Plug, Play, and Comply: A Modular Framework for Online Variable Impedance with Arbitrarily Oriented Compliance Axes","url":"https://arxiv.org/abs/2607.22483","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22483v1 Announce Type: new \nAbstract: The paper proposes a robot-agnostic compliant-control framework that extends the ROS control ecosystem with standardized joint and Cartesian command interfaces. It addresses a key limitation of existing control software: no reusable infrastructure for implementing compliant-control algorithms across different manipulators while preserving a common interface to higher-level applications. A plugin-based architecture separates controller infrastructure from control-law implementation. Generic wrappers use existing hardware abstractions to interface","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14791,"title":"Robot Learning to Communicate through Projected Visual Abstractions","url":"https://arxiv.org/abs/2607.22434","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22434v1 Announce Type: new \nAbstract: Humans routinely communicate through abstractions of their bodies, including shadows, silhouettes, and reflections. Yet robots remain largely confined to expressing themselves through their physical morphology. Enabling robots to communicate through such projected visual abstractions requires reasoning not only about bodily motion but also about how that motion is transformed into an external representation perceived by an observer. Among these abstractions, shadows provide a particularly compelling example because they emerge directly from the","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14790,"title":"Conformal Constraint Tightening for Chance-Constrained Motion Planning with Unknown Dynamics","url":"https://arxiv.org/abs/2607.22409","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22409v1 Announce Type: new \nAbstract: Motion planning algorithms compute control sequences that drive autonomous robots to goal regions while avoiding unsafe states. Existing methods, from sampling-based planning to deep reinforcement learning, typically provide task-completion guarantees only with respect to a nominal model or simulator, which may be invalidated when the true dynamics are unknown or difficult to model accurately. This letter addresses this limitation for systems with unknown dynamics and an available approximate nominal model, contributing a planner-agnostic constr","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14789,"title":"Teachy Mini: Development and Preliminary Evaluation of a Knowledge-Based Generative Social Robot for Higher Education","url":"https://arxiv.org/abs/2607.22345","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22345v1 Announce Type: new \nAbstract: Generative social robots (GSRs) powered by large language models offer new possibilities for personalized tutoring in higher education, but also introduce risks related to misinformation, missing transparency, or reinforcing incorrect student responses. Prior work identified knowledge-based design (KBD) requirements that define the informational prerequisites for GSRs to manifest responsible and effective tutoring behavior in higher education. In this paper, we operationalized selected KBD requirements in the Reachy Mini robot platform through s","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14788,"title":"A Monolithic Hand with Asymmetric Origami Bending and Dual-chamber Actuators","url":"https://arxiv.org/abs/2607.22320","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22320v1 Announce Type: new \nAbstract: The passive adaptability inherent in soft robotic hands affords them advantages in applications that require safe and compliant interaction. However, existing soft robotic hands often struggle to simultaneously achieve adequate output performance and easy manufacturing due to their complicated structures. In this paper, we introduce the asymmetric origami bending (AOB) pattern for generating bending motion and the asymmetric dual-chamber (ADC) design for obtaining multifunction capability. The AOB single (AOB-S) chamber and AOB dual-chamber (AOB","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14787,"title":"Design and Human Evaluation of Tactile Withdrawal Reflexes for a Skin-Covered Robot Arm","url":"https://arxiv.org/abs/2607.22249","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22249v1 Announce Type: new \nAbstract: Nociception is a protective biological mechanism that links harmful stimulation to a reaction. This paper investigates artificial nociception for a robotic arm with whole-body tactile sensing. We present a complete pipeline that maps pressure changes from sensitive skin on a robot manipulator to bio-inspired withdrawal motions. The system first converts skin pressure into a scalar pain gain using a nonlinear continuous model. We compare three reflexes: (i) uniform reflex moves four robot joints by a fixed amount, whereby the withdrawal is approx","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14786,"title":"Offline Vision-Language Navigation with Geometric Goal Localization for Outdoor Environments","url":"https://arxiv.org/abs/2607.22226","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22226v1 Announce Type: new \nAbstract: Foundation-model-based vision-language navigation (VLN) has advanced autonomous robot navigation by enabling robots to interpret natural-language instructions, identify semantic goals, and follow user-specified behavioral rules. However, existing VLN systems rely heavily on cloud-hosted foundation models for language understanding and semantic grounding, limiting their applicability where network connectivity is unavailable and reliable metric goal localization is required. Although recent small language models (SLMs) enable fully onboard infere","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14785,"title":"Safe Learning Predictive Control for Ego-World Robotic Systems","url":"https://arxiv.org/abs/2607.22225","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22225v1 Announce Type: new \nAbstract: Safe autonomous navigation in shared environments requires the ability to anticipate and react to the latent behaviors of surrounding robots. In this paper, we propose SOWL-MPC, a safe learning-based predictive control strategy for a novel scenario, which we name ego-world robotic framework. In this setting, the control policy of the world robot is unknown and the ego exploits data to learn it and perform safe maneuvers. The proposed architecture combines an online learning mechanism based on Sparse Variational Gaussian Processes (SVGPs) with a","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14784,"title":"DB-VIO: Dual-Branch Visual Inertial Odometry with Enhanced Visual-Inertial Representation","url":"https://arxiv.org/abs/2607.22123","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22123v1 Announce Type: new \nAbstract: Visual inertial odometry (VIO) is essential for accurate 6-DoF motion estimation in mobile robotic systems. Recent learning-based VIO methods have shown promising progress, but they often rely on unified visual--inertial representations and a single temporal model for full-pose estimation, limiting their ability to capture the heterogeneous dynamics of rotation and translation. Moreover, monocular visual features often lack explicit geometric structure, while raw inertial encoding leaves the underlying rotational kinematics implicit, weakening t","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14783,"title":"One Hand Watches The Other: Dynamic Multi-Agent Cooperation for Sample-Efficient Bimanual Manipulation in Dynamic Environments","url":"https://arxiv.org/abs/2607.22119","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22119v1 Announce Type: new \nAbstract: Multi-stream robot manipulation policies achieve unparalleled sample efficiency and generalization by modeling actions relative to environmental reference frames. However, existing approaches typically assume these frames to be strictly exogenous. This causal assumption collapses in dynamic settings, such as when a single robot arm manipulates a moving object or when two arms coordinate, where each arm effectively becomes part of the dynamic environment of the other. We propose DynaMAC, a lightweight, policy-agnostic framework that resolves this","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14782,"title":"Impedance Control of Ship-Borne Manipulators via Optimization-based Task-Space Inverse Dynamics","url":"https://arxiv.org/abs/2607.22030","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22030v1 Announce Type: new \nAbstract: Ship-borne manipulators operating in maritime environments are subject to stochastic wave-induced base motions that introduce kinematic disturbances and dynamic coupling, degrading trajectory tracking accuracy and complicating safe, contact-rich manipulation. This paper proposes a torque-level optimization-based control framework that integrates high-precision trajectory tracking with task-space impedance for ship-borne manipulators. The controller is formulated using task-space inverse dynamics (TSID) and solved via quadratic programming to exp","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14781,"title":"Embodying Multi-Hand Manipulation Policies by Searching the Assignment and Null Spaces","url":"https://arxiv.org/abs/2607.22020","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22020v1 Announce Type: new \nAbstract: Learned manipulation policies increasingly predict motions for abstract \"hands\" and are attractive in practice because they rely on easily collected demonstrations and transfer across robot platforms. Executing these trajectories on multi-arm robots, however, is not trivial. Multi-hand policy outputs must be assigned to physical arms, each arm must realize a configuration-space motion that tracks its prescribed end-effector trajectory, and all arms must respect kinematic limits and avoid collisions. In the absence of algorithms that directly add","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14780,"title":"Mag4D-SLAM Dataset: A Repeated-Traversal Multi-Modal 4D Geomagnetic Dataset for Localization and Mapping","url":"https://arxiv.org/abs/2607.21986","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.21986v1 Announce Type: new \nAbstract: Geomagnetic sensing offers an infrastructure-free, absolute orientation reference that is robust to GNSS denial and visual degradation, yet no large-scale outdoor robotics dataset supports its systematic study in SLAM. Existing magnetic datasets are confined to small-scale indoor environments and lack the synchronized multi-modal sensing, repeated-traversal structure, and high-precision 6-DoF ground truth required for geomagnetic SLAM research. We present Mag4D-SLAM, the first large-scale outdoor geomagnetic SLAM dataset. It comprises 14 sequenc","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14779,"title":"ACME: A Multi-Cultural, Multi-Embodiment Social-Navigation Dataset","url":"https://arxiv.org/abs/2607.21964","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.21964v1 Announce Type: new \nAbstract: Understanding how robots and humans move in shared spaces is essential for designing effective social robot navigation policies and predicting human behavior. However, existing datasets often lack the diversity needed to capture differences in culture, geography, and human-robot interaction-factors that strongly shape appropriate social behavior. To address this gap, we introduce ACME: A Cross-cultural, Multi-Embodiment dataset for social navigation. A large-scale data collection effort across 8 sites in 5 countries, using 7 robot embodiments, A","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14778,"title":"Adaptive Undulatory Locomotion of Snake-like Robots in Dynamic Viscous Environments via Deep Reinforcement Learning","url":"https://arxiv.org/abs/2607.21960","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.21960v1 Announce Type: new \nAbstract: This paper demonstrates how deep reinforcement learning (DRL) enables adaptive locomotion of snake-like robots in dynamically changing viscous environments, overcoming the inherent performance limitations of classical predefined control methods. The lack of direct onboard sensors for fluid properties necessitates formulating this task as a partially observable Markov decision process. By employing an asymmetric actor-critic framework, a teacher policy trained using privileged information available only in the physics simulator distills its knowl","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14777,"title":"Action-Conditioned World Model for Goal Plane Probe Guidance in Robotic Ultrasound","url":"https://arxiv.org/abs/2607.21918","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.21918v1 Announce Type: new \nAbstract: We present an action-conditioned world model framework for goal plane probe guidance in robotic ultrasound, with a focus on neck ultrasound scanning. Autonomous ultrasound tasks often require large numbers of probe-motion trajectories for training, but collecting high-quality demonstrations is labor-intensive and explicit simulators are difficult to build because ultrasound appearance depends on contact, tissue deformation, and view-dependent acoustic artifacts. We address this problem with a two-stage model-based learning pipeline. First, a lat","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"},{"id":14776,"title":"StARS: Socially Appropriate Robot Actions via a Recommender System-Driven Approach","url":"https://arxiv.org/abs/2607.21802","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.21802v1 Announce Type: new \nAbstract: Social appropriateness in human-robot interaction (HRI) is not universal: different people can judge the same robot action differently in the same situation. To capture this inter-subject variability, we reformulate socially appropriate action generation as a preference modelling problem inspired by recommender systems, treating annotators as users, contexts/scenes as items, and appropriateness scores over a set of candidate robot actions as targets. We propose StARS, a novel model-agnostic framework that integrates collaborative filtering with","tags":[],"cluster_size":1,"ts":"2026-07-27T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
