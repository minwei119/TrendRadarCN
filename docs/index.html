至6月30日，2026年受理的上市新申请共373宗，加上2025年底结转的372宗未处理完毕申请，合计745宗处于处理流程之中，其中528宗处于处理中状态。Wind数据显示，截至7月28日，年内港股市场共完成100宗IPO，募资总额约2723.39亿港元。半导体、AI大模型、智能硬件等科技企业仍是上市核心主力，“A+H”上市热度持续攀升。分析人士认为，随着内地科技龙头加速赴港上市及互联互通机制持续深化，港股作为新经济企业上市首选地的地位将进一步巩固。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-28T23:01:29"},{"id":15050,"title":"港股迎来解禁高峰","url":"https://wallstreetcn.com/livenews/3141240","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"进入2026年下半年，港股市场迎来限售股解禁高峰期。多家机构测算，2026年港股全年解禁规模或接近2万亿港元，较2025年大幅增长，今年7月、9月和12月成为筹码集中释放的重要时点。不过，从历史经验及近期市场表现看，机构普遍认为，解禁不等同于减持，其影响更多集中于部分流通盘较小、解禁比例较高的个股，尚不足以对港股大盘构成系统性冲击。与此同时，南向资金在部分核心标的上仍展现出较强的定向承接力，多家上市公司的基石投资者、战略股东及管理层也主动延长锁定期或作出不减持承诺，凸显长期资金对优质港股资产的认可。（中证报）","tags":[],"cluster_size":1,"ts":"2026-07-28T22:59:54"},{"id":15051,"title":"SK海力士ADR美股盘后跌幅扩大至5.7%，该公司二季度运营利润逊色于分析师预期；韩国股市即将在北京时间08:00开盘。\n\n纳斯达克100指数股指期货在亚太盘初","url":"https://wallstreetcn.com/livenews/3141236","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"SK海力士ADR美股盘后跌幅扩大至5.7%，该公司二季度运营利润逊色于分析师预期；韩国股市即将在北京时间08:00开盘。\n\n纳斯达克100指数股指期货在亚太盘初下跌0.5%，AI顾虑和美国-伊朗紧张关系牵动投资者神经。","tags":[],"cluster_size":1,"ts":"2026-07-28T22:56:04"},{"id":15052,"title":"周二（7月28日），美股行业ETF多数收涨，全球航空业ETF涨2.87%，医疗业ETF涨2.38%，网络股指数ETF涨1.59%，能源业ETF跌1.35%，科技","url":"https://wallstreetcn.com/livenews/3141194","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周二（7月28日），美股行业ETF多数收涨，全球航空业ETF涨2.87%，医疗业ETF涨2.38%，网络股指数ETF涨1.59%，能源业ETF跌1.35%，科技行业ETF跌1.84%，全球科技股指数ETF跌2.08%，半导体ETF跌3.45%。\n\n标普500指数的11个板块中，保健板块涨2.33%，原材料、电信板块至少涨1.64%，信息技术/科技板块跌1.17%，能源板块跌1.4%。","tags":[],"cluster_size":1,"ts":"2026-07-28T20:29:25"},{"id":15053,"title":"中概指数收涨约1.1%，KWEB涨超1.1%，理想涨约4.7%，网易涨约2.9%，日月光半导体跌约7.2%","url":"https://wallstreetcn.com/livenews/3141180","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克金龙中国指数收涨1.08%，报6325.46点。\n\nETF中，中概互联网指数ETF（KWEB）收涨1.15%，中国科技指数ETF（CQQQ）收跌2.41%。\n\n德银嘉实沪深300指数ETF（ASHR）收跌2.39%，MSCI新兴市场ex中国ETF（EMXC）收跌2.46%，XtrackersHarvest中证50（ASHS）收跌2.62%。","tags":[],"cluster_size":1,"ts":" 在加速支付行业变革，重塑 Visa 的运营方式，公司为了抓住未来的机遇，并让 Visa 更好地引领这场变革，需要推动新一轮公司重组。\u003c/p\u003e\u003cp data-vmark=\"6dff\"\u003eVisa 发言人随后证实了该备忘录信息，在裁员方面，公司并未裁减客服代表或后台文员，主要缩减了负责设计、建造、测试和维护基础设施的工程团队。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"5585\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/7/10cab7d3-b3a6-4887-a4e4-85","tags":[],"cluster_size":1,"ts":"2026-07-28T23:59:30"},{"id":15259,"title":"AI 推动软件漏洞发现速度大幅加快，今年数量较去年预计翻番","url":"https://www.ithome.com/0/982/812.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"abc1\"\u003eIT之家 7 月 29 日消息，据彭博社 28 日报道，AI 正在显著加快软件漏洞的发现速度。按照目前趋势，2026 年在热门科技产品中发现的安全漏洞数量，预计比 2025 年翻一番。\u003c/p\u003e\u003cp data-vmark=\"f789\"\u003e今年 1 月至本周一，美国国家漏洞数据库\u003cstrong\u003e已收录 45207 个漏洞，接近去年全年的总量\u003c/strong\u003e，而 2025 年就已创下该数据库的历史纪录。\u003c/p\u003e\u003cp data-vmark=\"384e\"\u003e“安全漏洞”指可能被黑客利用的软件缺陷，攻击者可借此侵入计算机系统，从事犯罪或间谍活动。\u003c/p\u003e\u003cp data-vmark=\"a744\"\u003e多家科技巨头近期披露的数字都创下纪录。IT之家从数据中获悉，甲骨文在 7 月例行软件更新中修复了 1449 个安全漏洞，创下公司\u003cstrong\u003e成立 49 年来的新高\u003c/strong\u003e，去年同期只有 309 项。微软 7 月披露 642 个漏洞，\u003cstrong\u003e接近去年同期的五倍\u003c/strong\u003e。谷歌最近更新 Chrome 浏览器时发现并修复 433 个漏洞，而一年前的同类更新\u003cstrong\u003e只有 11 个\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"a0b8\"\u003eSentinelOne 杰出 AI 研究科学家加布里埃尔 · 伯纳代特-夏皮罗表示：“我","tags":[],"cluster_size":1,"ts":"2026-07-28T23:57:15"},{"id":15260,"title":"突发！全球千人联名逼AI刹车，OpenAI、Anthropic带头签 - 新浪财经","url":"https://news.google.com/rss/articles/CBMickFVX3lxTE9HRDlMSXFtRjE2LWpLRElLb1FmbUJQN1ljaHNrNkJLUnRCWHBSTlc5VXBuSnNKRlgtOEcxYk93VkdKVmx4Vk1vTUZ1TzcxazlqZU9rRWFScW5SVUhaWEdyMHQzMWJmUjhZakZLVTI4S3hlZw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMickFVX3lxTE9HRDlMSXFtRjE2LWpLRElLb1FmbUJQN1ljaHNrNkJLUnRCWHBSTlc5VXBuSnNKRlgtOEcxYk93VkdKVmx4Vk1vTUZ1TzcxazlqZU9rRWFScW5SVUhaWEdyMHQzMWJmUjhZakZLVTI4S3hlZw?oc=5\" target=\"_blank\"\u003e突发！全球千人联名逼AI刹车，OpenAI、Anthropic带头签\u0 toy. Across multiple trials, GPT-5.1 demonstrated emergent capabilities that suggest elements of spat","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15105,"title":"Memory for Attention: Language-Conditioned Re-Perception with a Vision--Language--Motion Map","url":"https://arxiv.org/abs/2607.23797","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23797v1 Announce Type: new \nAbstract: A robot carrying a persistent, behavior-annotated map faces two planning questions, and its memory answers only one well. The \\emph{spatial-navigation} question -- how to walk around a room -- we address first and report a negative: building on Vision--Language--Motion Maps (VLMM), a behavior-aware planner cost cuts a planning-time objective by $\\sim$35\\% over 28 AI2-THOR scenes, but under closed-loop execution the real benefit nearly vanishes ($\\sim$4\\%) and an on-demand vision--language model (VLM) does as well. The \\emph{resource-allocation}","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15104,"title":"A Few Words Go a Long Way: Language Guided Robot Policy Synthesis","url":"https://arxiv.org/abs/2607.23784","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23784v1 Announce Type: new \nAbstract: While vision-language-action models have demonstrated impressive zero-shot manipulation capabilities, they remain fundamentally black box policies that are difficult to interpret, adapt, or correct when they inevitably fail. In this work, we propose ARCHITECT, a framework that treats robot policy acquisition as an interactive program synthesis task. ARCHITECT leverages the reasoning capabilities of LLM coding agents to synthesize modular robot programs that utilize a suite of perception and control tools. Unlike end-to-end models where distribut","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15103,"title":"$N_0$-TWAM: Scaling Tactile-Native World-Action Model for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2607.23783","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23783v1 Announce Type: new \nAbstract: We present $N_0$-TWAM, a tactile-native world-action model for contact-rich manipulation that predicts both future vision and future contact. To our knowledge, it is the first tactile world-action model trained at large scale, and it shows strong capability on contact-rich tasks. We pre-train $N_0$-TWAM at large scale with visuo-tactile joint training over tactile-rich demonstrations spanning six embodiments and 450 tasks. We use NeoForce, a unified force-based tactile representation, to form a physically grounded contact signal that conditions","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15102,"title":"$N_0$-VTLA: Scaling Vision-Tactile-Language-Action Model with Latent Tactile Tokens","url":"https://arxiv.org/abs/2607.23782","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23782v1 Announce Type: new \nAbstract: We present $N_0$-VTLA, a vision-tactile-language-action (VTLA) foundation model capable of (1) fine-grained contact-rich manipulation with tactile perception and tactile-feedback control, and (2) offline policy improvement from stored deployment data. Building on current vision-based backbones, we propose a training recipe for tactile integration consisting of visuo-tactile pre-training, staged tactile-pathway integration, and advantage-conditioned offline policy improvement. During pre-training, the policy learns broad contact priors from NeoDa","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15101,"title":"LabRobFail: A Benchmark for Robotic Failure Analysis in Chemical Self-driving Laboratories","url":"https://arxiv.org/abs/2607.23704","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23704v1 Announce Type: new \nAbstract: The deployment of embodied agents in self-driving laboratories could accelerate scientific discovery, yet their reliability is constrained by the irreversible and safety-critical nature of chemical experiments. Progress is further hindered by scarce failure data and the lack of fine-grained evaluation protocols. To address these challenges, we introduce LabRobFail, a failure-centric framework for learning and evaluating robotic failure analysis in chemical laboratories. LabRobFail-Sim injects controllable failures at the control, physics, and se","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15100,"title":"Try Once, Then Optimal: De-Redundified Procedure Memory for Cross-Episode Exploration Amortization","url":"https://arxiv.org/abs/2607.23702","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23702v1 Announce Type: new \nAbstract: Manipulating objects with hidden internal state, such as a latched microwave, forces a robot to probe before it can act. Yet a robot that has solved an instance once re-runs the same probes whenever it encounters that instance again, because existing cross-episode memories target task success and organize reuse around states, not the object or the cost of re-exploring it. We present Instance-Oriented Memory (IOM), an object-centric framework that amortizes this exploration: from a single encounter that uncovers the hidden state, whether or not i","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15099,"title":"LEACL: LLM-Enhanced Automatic Curriculum Learning for Reinforcement Learning in Long-Horizon Manipulation Tasks","url":"https://arxiv.org/abs/2607.23515","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23515v1 Announce Type: new \nAbstract: Long-horizon manipulation tasks pose significant challenges for reinforcement learning due to sparse reward signals and long horizons. Automatic curriculum learning (ACL) has been proposed to tackle these challenges by progressively training agents on a sequence of tasks, from easier to more difficult. However, the success of ACL depends heavily on task-dependent specifications-such as well-defined task parameter spaces and difficulty measures-which are often manually crafted and difficult to generalize across diverse tasks. Recent advances in l","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15098,"title":"PRISM: Polynomial Representations for Interaction-Structured Motor Control","url":"https://arxiv.org/abs/2607.23473","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23473v1 Announce Type: new \nAbstract: Robot policies are typically MLPs mapping observations to actions. Yet robot observations are physical variables, and many action-relevant cues arise not from individual variables but from their interactions; power, inertial effects, contact, slip, and compliance depend on products among observable signals. We introduce PRISM, a policy representation that makes polynomial interactions among observable physical variables explicit, learnable, and compact. Rather than listing all polynomial terms, PRISM uses a factorized polynomial module to expose","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15097,"title":"Sling2Sim2Real: One-Shot Elastic System Identification for Non-Destructive Slingshot Policy Learning","url":"https://arxiv.org/abs/2607.23268","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23268v1 Announce Type: new \nAbstract: Elastic object manipulation (EOM) involves highdimensional, nonlinear, and elastic deformations. The diverse deformation properties of elastic objects substantially expand the relevant state space, requiring extensive exploration to learn accurate manipulation policies for tasks such as slingshot manipulation. While simulation enables large-scale and safe exploration compared to costly and potentially destructive real-world trials (e.g., repeated projectile launches), accurately calibrating elastic behavior between the real world and simulation","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15096,"title":"Low-Latency Turn-Taking via Context-Aware Preface Generation in a Real-World Dialogue Robot","url":"https://arxiv.org/abs/2607.23204","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23204v1 Announce Type: new \nAbstract: Large language model (LLM)-based dialogue systems suffer response delays because generation begins only after final speech recognition. While fixed fillers are a workaround, they become unnatural over time. We propose a two-stage incremental framework that decouples prefatory-response preparation from speech onset. Once user intent becomes predictable, an intent readiness detector triggers LLM-based generation of a short prefatory response. Concurrently, a voice activity projection (VAP) model determines when to deliver it. Through a field exper","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15095,"title":"The Curse of Precision: A Data Scaling Law for High-Precision Robotic Manipulation","url":"https://arxiv.org/abs/2607.23108","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.23108v1 Announce Type: new \nAbstract: While scaling laws for imitation learning have primarily focused on generalization in open-world settings, the relationship between data and precision in closed-world tasks like robotic assembly remains largely unexplored. This paper systematically investigates this relationship and introduces a novel scaling law. We find that to achieve a fixed success rate, the required number of demonstrations $N$ grows super-exponentially as the target precision $P$ approaches a limit $c$. This relationship is accurately captured by the model $\\log(N) \\propt","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15094,"title":"WCM: World-Cognition Model for Generalizable Human-Robot Interaction","url":"https://arxiv.org/abs/2607.22999","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22999v1 Announce Type: new \nAbstract: Language agents can now interact fluently with users in software, but robots still struggle to bring comparable interaction to physical tasks. Current robot-control paradigms, including vision-language-action policies and world-model-based planners, are mainly optimized for instruction execution, leaving users with little visibility into why an action is chosen and few mechanisms to redirect, correct, or teach the robot through interaction. To solve this problem, we present the World-Cognition Model (WCM), a human-centered embodied agent built o","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15093,"title":"Real2Sim2Real for Vision-Language-Action Manipulation: An AMD ROCm-Based Pipeline","url":"https://arxiv.org/abs/2607.22997","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22997v1 Announce Type: new \nAbstract: Physical AI -- the integration of large vision-language-action (VLA) models with embodied agents that act in the real world -- has emerged as the next major frontier for AI, echoed by industry leaders such as Jensen Huang (``the next big thing is Physical AI, AI with a body,'' GTC Paris, June 2025) and Dr. Lisa Su (`we're entering the world of Physical AI ... this is where AI enters the real world,' CES 2026). This paper presents an end-to-end, fully AMD-accelerated technology stack for embodied manipulation, spanning data-center training silico","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15092,"title":"Pose-Aware Modeling to Mitigate Pose-Related Artifacts in Tactile Gloves","url":"https://arxiv.org/abs/2607.22964","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22964v1 Announce Type: new \nAbstract: Tactile gloves digitize contact and force during hand-object interactions, enabling robotics applications in dexterous manipulation, teleoperation, and learning from demonstration. To preserve hand dexterity and capture the nuances of natural interactions, these gloves and the integrated tactile sensors are designed to be soft, flexible, and comfortable. However, such flexible sensors are sensitive not only to contact forces but also unavoidably to hand pose changes, resulting in pose-related artifacts (PRAs). PRAs are especially problematic in","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15091,"title":"A Replay-Constrained Simulation Framework for Personalization of Powered Knee--Ankle Prosthesis Controllers","url":"https://arxiv.org/abs/2607.22858","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.22858v1 Announce Type: new \nAbstract: Personalization of impedance controllers for powered prosthetic legs is critical to accommodating individual gait biomechanics but remains challenging. Existing methods rely on time-intensive human-in-the-loop exploration and/or constrain optimization to low-dimensional, single-joint parameter subspaces. Sim-to-real transfer has enabled high-dimensional locomotion control for legged robots, but in assistive device control the human partner remains un-modelable. We present a replay-constrained simulation framework: a MuJoCo-based simulator reprod","tags":[],"cluster_size":1,"ts":"2026-07-28T04:00:00"},{"id":15108,"title":"Xiao Zhi Weekly News | First batch of \"Henan-made\" humanoid robots rolls off the line; Mobileye founder shifts focus to robotics - Gasgoo","url":"https://news.google.com/rss/articles/CBMikwJBVV95cUxPcHlLV0c1WHJJY3hoUlhVRzNWODM5ZUtUM1RsQkhaVEZjM1VOYkMxLWRyTmNRZnBLU3VFNF8zQ2hxeW9MelpDbWdqNXhMeVZ4Tk5xUGlyVmlvc1VGaFpLSWtFcnhwTnlmQ19DREFqVHpNcnA5T3pYbDVHRlkzZXpvaW1CNDM3RXh2UGZNNGFOUURaVlMzWUlrZTdpWm9GcUhNU0trdnJJbENHV3JtREVXbVJLRmhydWF2SGRwakFHdEFHc0YwNWU1OXRTWEJQMGdETjZKb2ZwcUNOZTZJcUZxZUlTeU9VOGdNeGJkdVdRWkdQazFCZW4wR2RYblFlVlRyQzY3LWVXbUQ0RVdlTnFCTzhQMA?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMikwJBVV95cUxPcHlLV0c1WHJJY3hoUlhVRzNWODM5ZUtU // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
