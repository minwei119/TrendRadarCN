双双在前一周大跌后企稳。\n\n华为与高通达成多年期专利交叉授权，覆盖5G、计算、AI与网络等多领域，高通还将收购华为部分美国专利。\n\n美国9月ISM服务业PMI降至54.9，但价格指数冲上74.0创四年新高，服务业扩张放缓的同时成本压力回升。\n\n2026年诺贝尔生理学或医学奖揭晓，戴塞洛斯、黑格曼与纳格尔因光遗传学发现获奖，平分1200万瑞典克朗。\n\nMeta、微软设法减少员工对Claude依赖：Meta内部使用人数减半，微软预算砍掉三分之一。\n\nSpacex收涨7.6%，收创6月份以来新高，帮助马斯克“恢复”万亿美元富豪头衔。\n\n施耐德电气宣布226亿美元收购美国工业软件公司PTC，溢价逾42%创公司史上最大并购，自身股价收跌近10%。\n\n也门政府军宣布夺回曼德海峡周边战略要地，沙特主导的多国联军提供全面作战支持，胡塞武装否认失守。\n\n欧元兑美元跌至17个月低位，法国预算草案未能说服市场，西班牙宣布11月29日提前大选加剧抛压。\n\n联合G7释储后特朗普中选前再出手压油价：据称拟放宽免税“红色柴油”使用限制。\n\n沙特阿美将11月对亚洲原油售价下调至六年最低，较基准折让5美元，同时把对欧洲买家售价上调3美元；沙特阿美CEO警告：全球石油库存已“薄得可怕”，补库需两年，海湾出口回暖也压不住百","tags":[],"cluster_size":2,"ts":"2026-10-05T23:30:02"},{"id":31621,"title":"中概股瑞图生态收涨约26%，万国数据、世纪互联涨超6%，阿里涨约5%","url":"https://wallstreetcn.com/livenews/3174285","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"纳斯达克金龙中国指数收涨1.71%，报5613.68点，脱离上周五（美国非农日）收盘位5519.24点。\n\n中概股里，瑞图生态收涨25.81%，奥瑞金种业涨13.51%，长实数字涨11.42%，羚羊控股涨8.6%，富途控股涨7.37%，爱奥斯科技涨7.33%，万国数据涨6.24%，世纪互联涨6.14%，再鼎医药、阿里巴巴至少涨4.68%，禾赛、百度至少涨3.14%，拼多多涨3.34%，腾讯控股ADR涨3.26%，金山云、京东、B站、霸王茶姬、网易至少涨1.85%，美团ADR涨2.88%，携程涨1.84%，小鹏、新东方至少涨1.57%，比亚迪ADR涨1.5%，理想、蔚来、中通快递、百胜中国至少涨0.68%，晶科能源、贝壳、大全新能源、阿特斯太阳能至多涨0.55%，小米集团ADR涨0.2%，日月光半导体涨0.17%。\n\n碳博士控股则收跌5.21%，虎虎科技跌7.56%，鼎信控股跌12.4%。\n\nETF中，中概互联网指数ETF（KWEB）收涨2.93%，中国科技指数ETF（CQQQ）收涨2.46%。\n\nMSCI新兴市场ex中国ETF（EMXC）收涨1.44%，XtrackersHarvest中证50（ASHS）收涨0.66%，德银嘉实沪深300指数ETF（ASHR）收涨0.43%。","tags":[],"cluster_size":1,"ts":"2026-10-05T22:26:39"},{"id":31622,"title":"巴拿马型船闸将试行长期通航预约","url":"https://wallstreetcn.com/livenews/3174275","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"巴拿马运河管理局5日发布公告说，将通过“长期通航名额分配计划”提前分配2027年1月3日至4月3日期间的长期通航名额，并首次将这一机制从新巴拿马型船闸扩展至巴拿马型船闸试行。\n\n公告表示，巴拿马型船闸将分配日均3个名额用于试行计划，竞拍时间为11月24日，主要面向航次安排固定的企业，以及在预约系统中因排名较低难以获得常规名额的企业；新巴拿马型船闸将沿用现行“长期通航名额分配计划”，保留日均3个长期通航名额，竞拍时间为11月17日。（新华社）","tags":[],"cluster_size":1,"ts":"2026-10-05T21:10:47"},{"id":31623,"title":"周一（10月5日）纽约尾盘，标普500股指期货最终涨0.72%，道指期货涨0.25%，纳斯达克100股指期货涨0.91%。\n\n罗素2000股指期货涨0.63%。","url":"https://wallstreetcn.com/livenews/3174272","sourc Announce Type: new \nAbstract: Tactile sensing provides essential contact information for robotic manipulation, yet incorporating it into pretrained vision-language-action (VLA) models remains challenging. A common concern is that simply introducing touch during task-specific fine-tuning may fail to bridge the cross-modal gap, yielding limited gains or even reduced success. Consequently, existing methods often rely on large-scale tactile policy pretraining or separate visuotactile alignment, adding data requirements and training stages. We introduce SimpleTouch, a simple VLA","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31383,"title":"Proprioceptive Sketches as Long-Horizon Intent for Generative Action Policies","url":"https://arxiv.org/abs/2610.02759","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02759v1 Announce Type: new \nAbstract: Generative robot policies predict short action chunks but lack explicit long-horizon intent. Recent methods expose longer-horizon structure through language plans, subgoal images, or video forecasts, which are costly to generate and still need to be translated into robot motion. Predicting future robot motions avoids this translation, but a dense, time-indexed trajectory requires numerous parameters to cover the full remaining task, and over a short horizon it largely repeats the action chunk and adds little guidance for action generation. We pr","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31382,"title":"CSIR: Contextually and Socially Informed Robots for Efficient Person Goal Navigation","url":"https://arxiv.org/abs/2610.02750","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02750v1 Announce Type: new \nAbstract: We address the Person Goal Navigation (PersonNav) problem, enabling robots to search for people under realistic constraints on information accessibility and language uncertainty. This tackles the current solutions revolving around rigid person finding systems requiring exact knowledge of the individual for item-delivery in indoor settings. While the focus in literature is on learned methods using unavailable public or sparse data due to human privacy. We propose a planning framework that combines distance and semantic information about the recip","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31381,"title":"Around the World: Unified Learned Locomotion on a 270 g Continuous-Rotation Quadruped","url":"https://arxiv.org/abs/2610.02728","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02728v1 Announce Type: new \nAbstract: Closed-loop learned locomotion is established on commercial quadrupeds but remains uncommon at the sub-kilogram scale. Continuous-rotation legs give MiNI-Q, a 270 g quadruped, access to supporting configurations on either side of the body. We exploit this range with a single posture-conditioned reinforcement-learning policy that runs entirely onboard. A continuous joint-space reference on the torus $T^8$ and its gravity-conditioned transformation connect upright walking, inverted walking, and landing recovery without state machines or phase swit","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31380,"title":"RoboBridge: A Self-Evolving Embodied Agent Framework for Sim-to-Real Transfer","url":"https://arxiv.org/abs/2610.02717","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02717v1 Announce Type: new \nAbstract: A key challenge in bringing embodied intelligence into the real world is transferring capabilities from simulation to reality and enabling agents to continually adapt after deployment. End-to-end vision-language-action policies provide strong manipulation capabilities, but their transfer to physical environments typically relies on calibrating simulated visual and dynamical conditions, collecting additional target-domain demonstrations, and optimizing the policy through further training. Tool-using embodied agents offer flexible task orchestrati","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31379,"title":"RoboChemGym: A Protocol-Driven Generative Simulation Framework for Long-Horizon Chemical Manipulation","url":"https://arxiv.org/abs/2610.02708","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02708v1 Announce Type: new \nAbstract: Wet-lab experimentation serves as the gold standard for hypothesis verification in scientific discovery; yet it is inherently labor-intensive, costly, and safety-critical. Embodied agents hold the promise of automating these tedious workflows, but their development is hindered by the scarcity of real-world training data. While simulation offers a scalable alternative for producing demonstrations, current methods primarily target relatively short-horizon tasks with loosely structured interactions, failing to meet the strict procedural constraints","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31378,"title":"AdaTempo: Learning Shared Relative Tempo from Demonstrations for Faster Robot Manipulation","url":"https://arxiv.org/abs/2610.02706","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02706v1 Announce Type: new \nAbstract: Visuomotor policies trained via imitation learning often inherit the unnecessarily slow timing of teleoperated demonstrations. Yet uniform speedup is unreliable because different phases of a manipulation task tolerate acceleration differently. In this work, we introduce AdaTempo, a self-supervised method that accelerates visuomotor policies by exploiting shared relative-tempo structure in demonstrations. AdaTempo establishes phase correspondence, aggregates the aligned relative tempo into a consensus, and maps it to a continuous speedup profile","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31377,"title":"DeltaWorld: Physically Consistent Interactive World Simulators via Action-Conditioned Latent Increment Learning","url":"https://arxiv.org/abs/2610.02691","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02691v1 Announce Type: new \nAbstract: Interactive world simulators can provide scalable environments for robot planning, policy training, and evaluation by predicting action consequences while reducing reliance on repeated physical rollouts. To serve these applications, they must generate future image sequences that respond faithfully to robot actions and preserve the dynamics of robot-object interactions over long horizons. However, existing world models typically predict the entire next latent state and often fail to capture subtle changes induced by robot actions. Such omissions","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31376,"title":"A Passive AI System for Verifying Physical State on Automated Liquid Handlers","url":"https://arxiv.org/abs/2610.02668","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02668v1 Announce Type: new \nAbstract: Automated liquid handlers execute digital protocols, but operators must assemble the deck and confirm that the physical setup matches the intended experiment. We present the Labware Setup Checker, a passive vision system that verifies deck preparation on an Opentrons Flex without modifying its hardware or firmware. A consumer webcam mounted outside the robot supplies images to a browser application. The checker segments the deck into slots, corrects slot assignments using the known deck geometry, classifies the labware, and compares the observed","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31375,"title":"CriticHack: Evaluating Visual Rewards Under Robot Policy Optimization","url":"https://arxiv.org/abs/2610.02527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02527v1 Announce Type: new \nAbstract: Learned visual reward models are increasingly used to optimize robot policies, yet a reward model can score an execution that acts on the wrong object as highly as one that completes the task. We show that optimizing such a reward can amplify these wrong-object failures while reward and task success both rise, so the signals a practitioner would normally monitor look healthy. We fine-tune every denoiser parameter of a diffusion policy against Robometer on a drawer task. Starting from a supervised policy with no prior reward exposure, five traini","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31374,"title":"RUL-Aware RRT*: Degradation-Balanced Motion Planning for Robotic Manipulators","url":"https://arxiv.org/abs/2610.02469","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02469v1 Announce Type: new \nAbstract: Robotic manipulators operating over long durations often experience uneven joint degradation, which causes the weakest actuator to fail prematurely, leads to unplanned downtime, and results in significant operational losses. Traditional motion-planning algorithms do not account for joint health conditions and therefore tend to exacerbate this imbalance during extended operation. To address this challenge, this study introduces the RUL-aware RRT*, a motion-planning method that incorporates joint remaining useful life information into the planning","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31373,"title":"OpenRUA: Robot-Use Agents Are Zero-Shot Visuomotor Policies","url":"https://arxiv.org/abs/2610.02459","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02459v1 Announce Type: new \nAbstract: Coding agents are extending their reach into the physical world by writing and executing robot control programs. One might expect the agents to use the existing mature software stack that engineers have developed over decades to access sensors and control motion. Yet prior work primarily engineers complex custom harnesses to orchestrate agents for robot use, particularly by prescribing specialized workflows and providing bespoke interfaces. This raises the question: \"Is such additional harness engineering necessary?\" We introduce OpenRUA, a zero","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31372,"title":"Autonomous mobile robot operations logistics: a dataset of jobs, dispatch events and robot states","url":"https://arxiv.org/abs/2610.02428","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02428v1 Announce Type: new \nAbstract: Autonomous mobile robots (AMRs) increasingly perform material transport in production logistics, where their operation is governed by job generation, dispatching and robot control. We present MoRoOp, a dataset of AMR operations recorded in a laboratory kit preparation and supply scenario over nine eight-hour shifts. During each shift, an AMR executed stochastically generated kit supply, empty-box refill and charging jobs. The dataset links job specifications, the operations constituting each job, dispatch events documenting operation state trans","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31371,"title":"Keep the Effect, Drop the Actor: Programmable Effect-to-Execution World-Action Models","url":"https://arxiv.org/abs/2610.02398","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02398v1 Announce Type: new \nAbstract: A robot demonstration records two things in the same frames: what happened to the objects, and how one particular arm made it happen. We condition on the first. A demonstration is compiled into an effect program: the 3D keypoint trajectories of the objects that moved, two points marking where each was held, and the configuration the scene ends in, with the demonstrator removed. PEWAM, a 71.5M-parameter world-action model, generates effect, robot execution, action and terminal state as four streams with independent flow-matching times, so clampin","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31370,"title":"Rethinking World-Action Model for ing humanoid robots in unstructured environments. Modern humanoid control commonly separates reference specification from execution, with a planner, teleoperator, or motion generator providing a reference that a reinforcement-learning policy tracks through dynamically feasible whole-body control. Runtime safety filters, such as control barrier functions (CBFs), offer a promising approach for enforcing newly introduced constraints via interventions on the tracker's outputs. We show, however, that trea","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31367,"title":"NEEDLEWORK: Offline Rewriting of Robot Data with Verified Local Stitches","url":"https://arxiv.org/abs/2610.02339","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02339v1 Announce Type: new \nAbstract: Robot demonstrations may contain useful behavior even when individual episodes are inefficient or unsuccessful. Trajectory stitching offers a way to compose these behaviors into improved training data, but identifying useful connections and verifying their feasibility is difficult in high-dimensional robot data, where many prior methods rely on low-dimensional state representations. We introduce NEEDLE, an offline dataset-augmentation algorithm that addresses these challenges by adding short, verified action bridges between recorded observations","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31366,"title":"SoTa: Soft Tactile Skins for Dexterous Manipulation","url":"https://arxiv.org/abs/2610.02338","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02338v1 Announce Type: new \nAbstract: A growing body of work suggests that tactile sensing gives robot policies contact information that complements vision in dexterous manipulation. However, visuo-tactile robot data remains scarce: dexterous demonstrations require teleoperating robots, which limits dataset scale. Human demonstrations are far cheaper to collect and offer a path to scale this data, but only if human and robot hands carry tactile sensors with corresponding signals. This requires sensors that conform to different hand geometries, cover the full hand, and share a common","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31365,"title":"World-Calibrated Proposal-to-Action Flow for Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.02323","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02323v1 Announce Type: new \nAbstract: Flow-based Vision-Language-Action (VLA) policies generate action chunks by transporting samples from a task-agnostic isotropic Gaussian source. As this source is conditioned on neither recent execution nor predicted future evolution, (i) it discards the local continuity established by recently executed motion. (ii) Even when predictive world representations are introduced, they often only condition the transport dynamics rather than determine where generation starts, how far it may deviate, or along which action directions it may expand. Buildin","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31364,"title":"Awomo-SimDataEngine: Agentic Simulation-ReadyWorld Generation","url":"https://arxiv.org/abs/2610.02274","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.02274v1 Announce Type: new \nAbstract: Generating useful robot-training data requires more than visually plausiblescenes: objects must support interaction, placements must remain physicallyvalid, and tasks must admit repeatable execution. We present\\textbf{Awomo-SimDataEngine}, an agentic system that connects asset and scenegeneration to robot demonstration synthesis. Shared asset services providerigid and articulated objects, including structure-grounded part and jointgeneration with ISArt. Scene generation supports two complementary routes:Unravel reconstructs editable scenes from","tags":[],"cluster_size":1,"ts":"2026-10-05T04:00:00"},{"id":31825,"title":"视频|杨德龙：马斯克的特斯拉机 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
