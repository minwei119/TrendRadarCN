"source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着市场波动加剧，追求稳健收益的资金不断涌向配置型产品。数据显示，今年7月成立的FOF、二级债基数量达近百只，在新成立基金中占比近七成，多只产品首募规模超过20亿元。这种热度还在延续，8月这类配置型产品的待发行数量达到37只，部分基金公司正在批量上新。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-31T20:57:33"},{"id":16127,"title":"53.2万亿元，香港人民币清算量创纪录，离岸市场功能加速升级","url":"https://wallstreetcn.com/livenews/3143470","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"香港离岸人民币市场正在迎来新变化。数据显示，香港6月人民币清算量升至53.2万亿元，创历史纪录，在港结算规模首次超过港元和美元。此外，香港离岸人民币存款于5月底达到1.13万亿元历史高位，人民币债券发行量年内同比增长33%。多位受访专家认为，清算量、存款和债券发行同步增长，意味着香港离岸人民币市场功能正在从贸易结算进一步向融资、投资和资产配置延伸。人民币国际化也正从“使用场景扩大”，逐步走向“金融功能增强”。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-31T20:56:10"},{"id":16129,"title":"阿里巴巴期权聚焦：7月31日成交21.35万张，未平仓合约227.56万张 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxPeTN3U1ZtTDVsZjdtR3VwRmtwTE11WFQxSXpWdkROYWlZTTZ4N0gwVzc5RUJBQmhZZHdPM1pKazR6V1ZjNHhjaWZ1R012OUpOOHRSSGt6RXZIVnN0c1RCQUtxVWcwNno4YmRqU1BiZTcza1gwR2VzNmRYUzBnZ0RiNkRTeVpmbzBkRnhuU1VwQlZVRUIxbUVR?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMilwFBVV95cUxPeTN3U1ZtTDVsZjdtR3VwRmtwTE11WFQxSXpWdkROYWlZTTZ4N0gwVzc5RUJBQmhZZHdPM1pKazR6V1ZjNHhjaWZ1R012OUpOOHRSSGt6RXZIVnN0c1RCQUtxVWcwNno4YmRqU1BiZTcza1gwR2VzNmRYUzBnZ0RiNkRTeVpmbzBkRnhuU1VwQlZVRUIxbUVR?oc=5\" target=\"_blank\"\u003e阿里巴巴期权聚焦：7月31日成交21.35万张，未平仓合约227.56万张\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":4,"ts":"2026-07-31T20:30:00"},{"id":16130,"title":"阿里巴巴-W（09988.HK）：7月31日南向资金增持1161.08万股 - Sohu","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQa2Voekl0UWZFbEVXWWo4QzNldUwzSTQtRkpFYzRBMGVxWDBFVTZqRVBVVXFUZnBFSHk0V0Vjd0tFeTNqSDBuVUVSdDMwLXRZRE1DOURCb3hkbU9MZi1TZGxmM0RZWGt5bGFpZlRPemJZRzFncjBsaEplUkpWSGRhaUpoeWZHTG9aVU9Weg?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQa2Voekl0UWZ t Landing, as Motion Control Converges and PMF Becomes the Battleground\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ePandaily\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-31T07:57:57"},{"id":16297,"title":"马斯克第三代Optimus量产计划曝光，微美全息大展拳脚AI+机器人产业加速发展 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMiUkFVX3lxTE9qNkl2MHNHVmVfS0FlZC03NXFraVhCeGZxMmxBMVU0MTJxaVQ5U09fNERuc09FOElmUG03N2YxT1hHQkt4N3hIMGtfb0p4ZGxRdlE?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUkFVX3lxTE9qNkl2MHNHVmVfS0FlZC03NXFraVhCeGZxMmxBMVU0MTJxaVQ5U09fNERuc09FOElmUG03N2YxT1hHQkt4N3hIMGtfb0p4ZGxRdlE?oc=5\" target=\"_blank\"\u003e马斯克第三代Optimus量产计划曝光，微美全息大展拳脚AI+机器人产业加速发展\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-31T07:05:17"},{"id":16319,"title":"FA-RDP: A Frequency-Adaptive Reactive Diffusion Policy for Contact-Rich Manipulation","url":"https://arxiv.org/abs/2607.28596","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28596v1 Announce Type: new \nAbstract: In contact-rich manipulation, action multimodality and reactivity dominate different stages of a single episode. Before contact, multiple trajectories might be equally valid, making it important to preserve diverse action modes. After contact, geometric constraints and force limits narrow the solution space, while successful execution demands rapid responses to force feedback. However, standard diffusion policies use a fixed inference frequency and sampling steps throughout the episode, forcing a fundamental compromise: low-frequency, multi-step","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16318,"title":"X-NavDP: Generalizing Navigation Diffusion Policy to Novel Behavior and Embodiments with Group Q-score Reweighted Matching","url":"https://arxiv.org/abs/2607.28560","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28560v1 Announce Type: new \nAbstract: Pretraining navigation diffusion policies rely on large-scale expert demonstrations. These data are typically generated by a fully-informed oracle planner suited to a single nominal robot. This limits the policy's generalization to diverse embodiments and challenging scenarios (e.g., escaping dead ends or detouring long obstacles) that demand diverse local reactive behaviors with only onboard local observations. Post-training the policy with reinforcement learning (RL) offers a principled remedy. However, previous RL for diffusion approaches lea","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16317,"title":"TEA-AgriVLN: Traversability Estimation Alarm for Agricultural Vision-and-Language Navigation","url":"https://arxiv.org/abs/2607.28474","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28474v1 Announce Type: new \nAbstract: Vision-and-Language Navigation in Continuous Environments (VLN-CE) requires an agent to follow a natural language instruction, predicting a sequence of low-level actions to navigate a robot from a starting point to a target location. The A2A benchmark and the AgriVLN method pioneeringly extended VLN-CE from indoor scenes to agricultural scenes, while we observed a challenging distinction: In indoor scenes, whether a zone is traversable tends to be clear to classify, such as wood floors are traversable but concrete walls are not. In agricultural","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16316,"title":"One Future, Every Robot: Label-Efficient Collective-State Prediction with Decentralized JEPA","url":"https://arxiv.org/abs/2607.28443","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28443v1 Announce Type: new \nAbstract: Can every robot in a swarm predict the same future collective state from only local observations and bandwidth-limited messages? We formulate this as decentralized shared-state prediction and introduce Collective-State JEPA (CS-JEPA), a recurrent joint-embedding predictive architecture whose output at every robot represents one common future token field. At deployment, each robot uses a 16-frame local history and one 64-float recurrent message per directed edge; there is no global pooling, target encoder, episode clock, or recorded future action","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16315,"title":"FasTac: A Curved Multispectral Vision-Based Tactile Sensor for High-Speed High-Precision 3D Shape and Force Perception","url":"https://arxiv.org/abs/2607.28416","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28416v1 Announce Type: new \nAbstract: Curved tactile fingertips for dexterous manipulation must resolve fine contact geometry, distinguish normal and tangential loads, and capture transient signals. Existing curved vision-based tactile sensors struggle to combine accurate 3D reconstruction, three-axis force estimation, and high-speed processing in a compact form. This article presents FasTac, a curved vision-based tactile sensor integrating multispectral photometric stereo, dynamic-convolution force estimation, and hardware acceleration on a field-programmable gate array (FPGA). Sin","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16314,"title":"TacWAM: Anchor-Guided World Action Model with Mechanics-Aware Tactile Prediction","url":"https://arxiv.org/abs/2607.28391","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28391v1 Announce Type: new \nAbstract: World Action Models (WAMs) combine future-state prediction with robot action generation, but existing approaches largely rely on visual futures. Visual prediction captures scene structure and object motion, yet provides limited supervision for force, deformation, shear, and slip during contact-rich manipulation. This creates two design requirements: tactile futures should carry meaningful physical information, and they should not become privileged cues for action generation. We present TacWAM, a mechanics-aware tactile WAM that addresses this ch","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16313,"title":"SemAnCorr: Semantic Anchored Correspondence for Zero-Shot Manipulation Skill Transfer","url":"https://arxiv.org/abs/2607.28382","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28382v1 Announce Type: new \nAbstract: Transferring manipulation skills across object instances that share functionality but differ in geometry remains a fundamental challenge in robot learning. While recent correspondence methods leverage dense visual descriptors and 3D feature fields, nearest-neighbor feature matching often produces spatially incoherent correspondences that fail to recover the local geometric frames required for reliable skill transfer. We introduce SemAnCorr, a training-free framework that establishes dense correspondence by selecting semantically consistent ancho","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16312,"title":"When Robots Exchange Meaning: A Demo of Goal-Oriented Semantic Communications for Collaborative Robotics","url":"https://arxiv.org/abs/2607.28256","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28256v1 Announce Type: new \nAbstract: Collaborative robotics is a representative task-oriented 6G use-case, where communication quality should be reflected in mission execution, environment understanding, and closed-loop operation rather than packet delivery alone. This demo paper presents a robot-edge semantic communication (SemCom) testbed integrating robot-side visual compression, edge-side semantic mapping, and dashboard-based mission interaction. A mobile robot equipped with RGB-D sensing and LiDAR runs ROS 2, while a Jetson Orin edge node performs reconstruction, RTAB-Map mapp","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16311,"title":"UniCross: Unified Cross-Skill Dexterous Manipulation Synthesis","url":"https://arxiv.org/abs/2607.28198","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.28198v1 Announce Type: new \nAbstract: Many dexterous manipulation tasks require the object to remain securely held throughout the interaction. From the perspective of hand-object relational motion, such manipulation comprises four canonical skills: grasping, relocation, in-hand rotation, and in-hand translation. Human hands flexibly compose these skills to accomplish complex tasks. Existing approaches, however, model these skills separately with skill-specific action constraints, objectives, or even dedicated hand morphologies, which breaks the compatibility and continuity required","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16310,"title":"Learning Social Robot Navigation By Sensing Human Legs","url":"https://arxiv.org/abs/2607.27922","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27922v1 Announce Type: new \nAbstract: Robots navigating among pedestrians typically sense their surroundings with a 2D LiDAR mounted close to the ground. At that height, the sensor mostly sees moving legs rather than whole people, yet most learning-based navigation methods still treat pedestrians as simple shapes like circles. This paper addresses that gap with CALF (Convolutional Attention for Leg Features), an end-to-end neural architecture that combines convolutional layers, attention, and MLP to interpret leg motion directly from LiDAR scans and produce safe navigation commands.","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16309,"title":"Static In, Dynamic Out: Counterfactual Action Augmentation for Moving Object Manipulation","url":"https://arxiv.org/abs/2607.27890","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27890v1 Announce Type: new \nAbstract: Visuomotor policies have advanced on manipulation tasks where the target object stays static during execution, but real deployments break this assumption: parts drift on conveyors and fruits sway in the wind. We introduce Static In, Dynamic Out (SIDO), a counterfactual action augmentation that enables a policy trained only on static object demonstrations to adapt to unseen object motion at test time. Our key idea is to factorize moving object manipulation into two sub-problems: predicting where the object will be, and reaching that predicted pos","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16308,"title":"RoboBRIDGE: A Modular Framework for Bridging Policies to Robust Real-World Robotic Agents","url":"https://arxiv.org/abs/2607.27881","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27881v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have attracted growing interest as a scalable approach to robotic manipulation. While these models are effective action predictors, deploying them as robotic agents exposes critical gaps: no mechanism for failure recovery, inconsistent execution over long horizons, and limited robustness to shifts in observations, tasks, or embodiments. Existing solutions address these limitations individually through model retraining or environment-specific modules, yet what is needed is a general framework that systematicall","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16307,"title":"DexDirect: Direct Kinesthetic Arm Guidance for Efficient Dexterous Demonstration Collection","url":"https://arxiv.org/abs/2607.27784","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27784v1 Announce Type: new \nAbstract: Scalable collection of dexterous manipulation demonstrations remains a major bottleneck for robot learning. High-fidelity interfaces often require costly hardware and extensive setup, while low-setup, low cost alternatives tend to provide less precise control and impose greater cognitive workload on operators. We present DexDirect, a direct kinesthetic arm guidance for efficient dexterous demonstration collection. The operator drags a 6-DoF gravity-compensated robot arm directly by a handle, while a single webcam retargets operator's other hand","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16306,"title":"RedFlow: Redirect Failure into Action-Level Corrections for Flow-matching VLA Policy","url":"https://arxiv.org/abs/2607.27782","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27782v1 Announce Type: new \nAbstract: Flow-matching Vision-Language-Action (VLA) policies have shown strong potential for robotic manipulation but often suffer from compounding errors caused by distribution shifts during deployment. While offline reinforcement learning (RL) provides a practical way to improve deployed policies using rollout data, existing methods either ignore failure data or exploit it only at the trajectory level, resulting in low learning efficiency and persistent errors. We propose **RedFlow**, a fine-grained offline RL framework that redirects failure experienc","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16305,"title":"Write-Safe Flow Field Mapping under Ambiguous Onboard Sensing and Localization Drift","url":"https://arxiv.org/abs/2607.27713","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27713v1 Announce Type: new \nAbstract: Mobile robots can infer local flow structure from onboard sensing, but a locally plausible estimate is not always safe to write into a global map. Similar flow structures may produce ambiguous observations, while localization drift causes predicted patches to be written at incorrect locations. Repeated misregistered updates then accumulate into persistent ghost structures. We address this failure mode with a map-reference-aware conservative fusion framework. The model predicts a local velocity patch and a learned write-safety score that continuo","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16304,"title":"LabEvolver: Training-Free Experience Evolution for Safe and Grounded Wet-Lab Agents","url":"https://arxiv.org/abs/2607.27690","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27690v1 Announce Type: new \nAbstract: We introduce LabEvolver, a training-free framework that equips safe and grounded wet-lab agents with episodic memory from execution experience. LabEvolver couples a state-grounded inner trial loop for adaptive perception, online planning, and safety validation with an outer evolution loop that distills completed trajectories into reusable skill, strategy, and safety experience. On robotic solution-preparation tasks, LabEvolver demonstrates real-world feasibility, reducing pH-regulation completion time and safety-gate intercepts by 48.2% and 60.0","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16303,"title":"Arm2Air: Cross-Embodiment Skeleton Transfer for 3D Relay Formation","url":"https://arxiv.org/abs/2607.27627","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27627v1 Announce Type: new \nAbstract: Unmanned aerial vehicle (UAV) relay networks can restore connectivity after communication infrastructure is damaged. Urban relay placement is difficult because line-of-sight blockage, communication range, altitude, and three-dimensional obstacles must be considered jointly. Arm2Air transfers obstacle-avoidance skeletons from robot arms to UAV relay placement through cross-embodiment transfer. Source-domain robot-arm motions from a pretrained Neural MP model are converted into ordered skeletons that pretrain a transformer-based transfer platform,","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16302,"title":"Cross-Embodiment Transfer via Behavior-Aligned Representations","url":"https://arxiv.org/abs/2607.27549","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27549v1 Announce Type: new \nAbstract: Recent progress in large-scale imitation learning for robot manipulation has been driven by leveraging datasets across a wide range of robot embodiments. However, achieving significant cross-embodiment transfer is often still challenging. In this work, we study the role of using behavior-aligned representations (e.g., object bounding boxes, language motions, end-effector traces of robot motion) in vision-language-action (VLA) models to promote cross-embodiment transfer. We hypothesize that by possessing invariances across embodiments while being","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16301,"title":"Failure Detection for Surgical Robot Imitation Policies via Flow-Matching World Modeling","url":"https://arxiv.org/abs/2607.27511","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27511v1 Announce Type: new \nAbstract: Imitation learning has shown increasing promise for autonomous robotic surgery, yet safe deployment remains challenging due to the safety-critical nature of surgical tasks and the complexity and variability of surgical environments. Failure detection is therefore an essential safeguard, but its development remains difficult due to the challenges of scarce failure data, highly variable manipulation dynamics, and the need to balance missed detections against disruptive false alarms. To address these challenges, we introduce FoMo-FD (Flow-Matching","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16300,"title":"Corrigible Assistance in One Round: Pragmatic-Pedagogic Best Response","url":"https://arxiv.org/abs/2607.27508","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27508v1 Announce Type: new \nAbstract: Assistance games formalize human-robot collaboration under asymmetric information: the human knows the goal, while the robot must infer it from observation and interaction in order to assist effectively. In general, computing optimal assistance game strategies online is intractable, since exact solutions require planning in a POMDP. We identify a class of assistance games in which pragmatic-pedagogic reasoning resolves goal uncertainty in a single time step, rendering the full-horizon game exactly solvable by a tractable best-response procedure.","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"},{"id":16299,"title":"Simulation of Surgical Suturing Using Position-Based Dynamics and the Material Point Method for Robot Reinforcement Learning","url":"https://arxiv.org/abs/2607.27494","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.27494v1 Announce Type: new \nAbstract: Recent advances in robotics research have created a strong demand for high-performance simulators. Surgical robotics simulation faces unique challenges due to the need to model diverse objects, such as rigid instruments, soft tissue, and fluids. While many studies simulate sutures or soft tissue independently, only a few have considered the complete soft-tissue suturing scenario, including the contact between sutures and deformable tissue during suture insertion. Building on previous work, this paper presents a novel suturing simulation environm","tags":[],"cluster_size":1,"ts":"2026-07-31T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
