1400万份，重仓股腾讯控股、阿里巴巴-W、建设银行_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1XeXdXamhHMHJfRWxkcFZLVmRYSUlrNHBrX0VPRUFqMkRxeDlIbUplYXBtd1piWGg5Y21lajhValdTS2tzNk03N005QjFzSXNmT1VobVRCT01LZHYwcmtXRHlR?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1XeXdXamhHMHJfRWxkcFZLVmRYSUlrNHBrX0VPRUFqMkRxeDlIbUplYXBtd1piWGg5Y21lajhValdTS2tzNk03N005QjFzSXNmT1VobVRCT01LZHYwcmtXRHlR?oc=5\" target=\"_blank\"\u003e8月5日恒生50ETF景顺基金份额减少1400万份，重仓股腾讯控股、阿里巴巴-W、建设银行_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-06T00:04:24"},{"id":17540,"title":"多家期货公司终止居间人合作 行业获客进入专业价值比拼新阶段","url":"https://wallstreetcn.com/livenews/3145657","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月以来，一德期货、信达期货、中原期货、红塔期货、国联期货等期货公司纷纷发布公告：终止与全部居间人的居间业务合作，禁止任何机构或个人以公司居间人名义从事相关活动；原居间人介绍客户的日常服务，转为公司客户经理或官方客服人员直接对接处理。中国期货业协会最新数据显示，截至8月4日，期货公司的存续居间人数量仅剩36人，较高峰时期的4万余人大幅缩减，表明行业“去居间化”进程已近尾声。\n受访人士表示，这是期货行业发展从“规模导向”转向“质量导向”的必然结果。随着监管层对适当性管理、投资者保护的要求越来越高，以及期货经营机构推进高质量发展，行业获客渠道将迈入专业价值比拼的新阶段。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-05T23:33:06"},{"id":17541,"title":"华尔街见闻早餐 | 2026年8月6日","url":"https://wallstreetcn.com/livenews/3145656","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯","华尔街见闻 · 港股快讯"],"summary":"SpaceX暴跌13%拖累科技板块，标普500、纳指高位回调，道指再创新高；黄金飙涨4%，原油冲高回落。\n\n伊朗首次披露霍尔木兹新方案，称美国曾主动求谈、但仅履约不足以重开海峡。\n\n美国7月“小非农”不及预期，ADP就业仅增4.4万人，创年内最低，周五非农数据成关键。\n\n美国7月ISM服务业指数持续扩张，需求韧性犹存但滞胀风险升温。\n\n黑客袭击大型对冲基金，美国政府呼吁全美计算机系统加强防御，应对AI网络攻击风险。\n\n美财政部维持季度发债规模不变，40万亿美元债务压力逼近。\n\n美联储理事Cook称通胀若未见降温，已准备好加息；美联储今年票委卡什卡利呼吁现在加息。\n\n中国7月RatingDog服务业PMI降至50.4，连续43个月保持扩张，就业、出口新业务均连续三个月增长。\n\n中国商务部：加强无人机相关两用物项对美国出口管制，如美方执意出台新的对华限制性措施，中方将进一步反制。\n\nAI需求力挺闪迪上季营收超预期增近四倍，拟豪掷140亿回购，但本季指引逊色，股价盘后一度跌8%。电话会：客户订单锁定未来四年，最大客户签约后还在追加需求。\n\n西部数据盘后一度大跌10%，第四财季营收、利润超预期，业绩指引令市场失望。电话会：AI时代“数据会复合增长”，物理AI正引爆硬盘需求，长协订单排至2031年。\n\n周四美股史上最大解禁、10亿股筹码出笼，SpaceX迎来终极审判，股价收盘跌超13%。","tags":[],"cluster_size":3,"ts":"2026-08-05T23:25:19"},{"id":17542,"title":"稳健型基金占据发行“C位”，多元配置策略走俏","url":"https://wallstreetcn.com/livenews/3145646","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月新发基金中，FOF、二级债基等稳健配置型产品占比超过40%，较6月的28%和7月的36%明显提升，年内FOF规模增长亦超千亿元。由此可见，多资产配置策略因能通过低相关性分散风险、平滑波动，正在受到投资者的热捧。在资金持续涌入配置型产品的背景下，多家公募机构认为，A股风格剧烈调整或逐步进入收尾阶段，市场短期底部大概率获确认，债券、港股、原油、黄金等大类资产各自具备结构性配置机会，多资产配置正在震荡市中展现出独特的优势。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-05T22:52:21"},{"id":17543,"title":"当建仓期遭遇逆风，新基金开局即是难局","url":"https://wallstreetcn.com/livenews/3145645","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来，科技主线大幅回调，A股市场震荡加剧。多只5月以来成立的权益基金遭遇不利开局，部分主题产品成立不足两个月，基金净值已回撤超过40%，沦为“五毛基”；净值跌超20%的次新权益基金也不在少数。在业内人士看来，本轮市场变化提示行业应审慎把握产品申报、发行与成立后的建仓节奏。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-05T22:49:01"},{"id":17544,"title":"锂电企业下半年排产预期强劲","url":"https://wallstreetcn.com/livenews/3145640","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"储能需求爆发叠加动力电池市场“三驾马车”拉动，多家锂电上市公司上半年业绩跑出较高增速。记者获悉，8月锂电排产依旧火热，环比增幅为7%至8%。基于储能与动力需求最新支撑因素的分析，鑫椤资讯已将2026年全球锂电池总产量预测由3000吉瓦时上调至3200吉瓦时。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-05T22:34:55"},{"id":17545,"title":"8月5日恒生中国企业ETF易方达基金份额减少200万份，重仓股腾讯控股、建设银行、阿里巴巴-W - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9zeHk4bVZmcFQ1dVVhSUxyWVFweV80Mms3TlZEMzJnelIweVR2dVFrLVMwQUVqUnBTYzMxejY5N0xHR3hFQUNtUlQwUmQ3eE5pbnNiOTNiaVZZaS0yQjNOTVNn?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9zeHk4bVZmcFQ1dVVhSUxyWVFweV80Mms3TlZEMzJnelIweVR2dVFrLVMwQUVqUnBTYzMxejY5N0xHR3hFQUNtUlQwUmQ3eE5pbnNiOTNiaVZZaS0yQjNOTVNn?oc=5\" target=\"_blank\"\u003e8月5日恒生中国企业ETF易方达基金份额减少200万份，重仓股腾讯控股、建设银行、阿里巴巴-W\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T22:32:21"},{"id":17546,"title":"港股公司逾330份半年度业绩预告，预喜和扭亏数量占比超五成","url":"https://wallstreetcn.com/livenews/3145637","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"截至8月5日，已有332家港股上市公司预告上半年业绩。其中，178家企业净利润同比上升或扭亏为盈，占比超过五成。74家企业预计上半年净利润同比增长上限超过100%。港股公司上半年整体呈现“盈利修复、结构分化”特征，其中有色金属、证券期货、科技板块盈利增速较高。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-05T22:31:38"},{"id":17547,"title":"闪迪2026财年分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3145629","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、创纪录的财务业绩与业绩指引。\n\n1、第四季度业绩表现：\n\n营收达89.65亿美元（季环比增长51%，同比增长372%），超出指引上限。环比增长中，约三分之一来自出货量（Bits）增长，三分之二来自价格上涨。\n\n2、毛利率与每股收益（EPS）：Non-GAAP毛利率升至84.6%（上一季度为78.4%）；Non-GAAP EPS达39.25美元（指引区间为30–33美元）。\n\n3、现金流与资本回报：运营现金流为71.26亿美元；当季通过股票回购向股东回报45亿美元。\n\n4、2026全财年业绩：全年总营收达202.48亿美元（同比增长175%），出货量增长处于十几（mid-teens）的中段，符合预期。\n\n5、2027 财年第一季度指引：\n\n预计营收103亿-108亿美元，增长动力来自出货量增加和价格的适度上涨。\n\n预计非GAAP毛利率在83%-85%之间，非GAAP EPS为44-46美元。","tags":[],"cluster_size":2,"ts":"2026-08-05T22:16:12"},{"id":17549,"title":"贝佐斯年内首次减持亚马逊股票，套现3.5亿美元","url":"https://wallstreetcn.com/livenews/3145623","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"亚马逊股价周一创纪录新高之际，贝佐斯（Jeff Bezos）出售了价值近3.5亿美元的亚马逊股票，这是他今年首次出售该公司股份。\n\n周三盘后发布的Form 4申报文件中披露了这笔交易。这位亿万富豪两天前在另一份文件中表示，计划出售最多1500万股亚马逊股票，价值超过40亿美元，此次出售仅占该计划的一小部分。\n\n即使在此次出售后，贝佐斯仍以8.16%的持股比例遥遥领先，为亚马逊最大股东。","tags":[],"cluster_size":1,"ts":"2026-08-05T21:45:32"},{"id":17550,"title":"DaVita分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3145621","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、临床创新：中分子清除与扩展血液透析（Expanded HD）。\n\n1、MOTheR临床试验结果：研究显示，使用中截留透析器（medium cutoff dialyzer）进行扩展血液透析（Expanded HD），在全因死亡率和主要心血管事件的复合终点上不劣于（non-inferior）血液透析滤过（HDF）。\n\n2、运营与成本优势：扩展HD可以直接在公司现有的透析机上实施，无需进行重大资本支出即可快速推广。\n\n3、技术合作与供应：美国食品药品管理局（FDA）最近批准了Nepro的新款扩展HD透析器，DaVita已锁定该透析器的供应，其与现有设备完全兼容，并将于未来几个季度在网络内广泛推广。\n\n4、财务与量级影响：扩展HD对2026年财务影响已包含在指引中，2027年及以后的直接财务影响不大；只有当该技术带来的死亡率改善显现时（预计2028年开始），才会对治疗量和业绩产生实质性正向拉动。公司维持对2029年前治疗量增速回归至2%以上的预期。","tags":[],"cluster_size":1,"ts":"2026-08-05T21:35:33"},{"id":17551,"title":"周三 ogle.com/rss/articles/CBMiU0FVX3lxTE9uTEp5bklyOUFmSmpIaW1FTVJIUkJaMFFqVnZwOGg3bUREZk1DWjZYS0dNNnN6MEJWb3pVWDBacjNlWER5RWpkUjNGZ1daSFNINDVJ?oc=5\" target=\"_blank\"\u003e【汽车校友百校联盟】特斯拉机器人战略蓝图：以“物理智能”重构具身智能的工业逻辑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T15:29:00"},{"id":17397,"title":"Humanoid Robots Part 2: China's Playbook for Building Its Own Robot Supply Chain - TrendForce","url":"https://news.google.com/rss/articles/CBMid0FVX3lxTE1PTWxCS2E5OGo5ZzhjZ05EMl9VbTdNZDRMclBBVWNGMjIzMWNKMWN4MVRJTUhkWG5qazFpTTlfRzVLeUQ4elpJR1dNUkxnYm93Wk41ZlNjLTMtSVBheXJpalZ4ZkdnVWNveXVsRUJxMkUybkh6VUVz?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMid0FVX3lxTE1PTWxCS2E5OGo5ZzhjZ05EMl9VbTdNZDRMclBBVWNGMjIzMWNKMWN4MVRJTUhkWG5qazFpTTlfRzVLeUQ4elpJR1dNUkxnYm93Wk41ZlNjLTMtSVBheXJpalZ4ZkdnVWNveXVsRUJxMkUybkh6VUVz?oc=5\" target=\"_blank\"\u003eHumanoid Robots Part 2: China's Playbook for Building Its Own Robot Supply Chain\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTrendForce\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T06:01:00"},{"id":17416,"title":"GraspMeanFlow: SE(3)-Equivariant MeanFlow for Few-Step 6-DoF Grasp Generation","url":"https://arxiv.org/abs/2608.03295","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03295v1 Announce Type: new \nAbstract: Recent data-driven methods for synthesizing 6-DoF grasp poses use generative models to learn complex grasp pose distributions and generate diverse candidate poses. In particular, SE(3)-equivariant flow-based models generate grasp poses that transform consistently with object rotations and translations. However, these methods sample by iterative numerical integration, requiring tens of function evaluations per grasp and limiting their use in real-time manipulation. We propose GraspMeanFlow, an SE(3)-equivariant MeanFlow framework for few-step 6-D","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17415,"title":"Learning Context-Aware Motion Priors for Humanoid Control","url":"https://arxiv.org/abs/2608.03234","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03234v1 Announce Type: new \nAbstract: Motion priors provide powerful guidance for learning naturalistic humanoid behaviors. However, existing methods typically learn a general, task-agnostic prior from the entire reference dataset and apply it uniformly throughout policy training. As a result, the prior cannot distinguish which reference motions are relevant to the current task context, potentially providing irrelevant or conflicting guidance. We present Context-Aware Motion Priors (CMP), a framework that adapts a general motion prior to the current task context without manual skill","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17414,"title":"Structure-Aware Robust Fine-Tuning: Defending Vision-Language-Action Robots Against Physical Attention Hijacking","url":"https://arxiv.org/abs/2608.03231","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03231v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) policies promise general robotic manipulation, but their robustness against physical-world attacks remains fragile. In particular, we show that physically realizable adversarial patches can reliably induce failures by triggering a mechanism we call policy-critical action-to-vision attention hijacking, where action-conditioned attention is diverted from task-relevant regions to a localized patch. To demonstrate the threat, we propose Attention-Guided Semantic Disruption (AGSD), an Expectation-over-Transformation (EOT)","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17413,"title":"PFM-HR: Pose Flow Matching for Humanoid Robots","url":"https://arxiv.org/abs/2608.03227","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03227v1 Announce Type: new \nAbstract: Motion priors improve reinforcement learning for physics-based humanoid tracking, but temporal priors require ordered motion clips, while pose priors provide limited guidance for policy-induced pose transitions. We present Pose Flow Matching for Humanoid Robots (PFM-HR), a reusable flow matching prior trained directly on large scale unordered pose data. PFM-HR introduces the Pose Geometry Score (PGS), which quantifies how joint coordinate changes during rollouts align with the local geometry of pose variation captured by the prior. Using PGS to","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17412,"title":"Accelerating Human-Aware Robot Trajectory Generation via Diffusion and Consistency Distillation","url":"https://arxiv.org/abs/2608.03159","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03159v1 Announce Type: new \nAbstract: This research proposes a constrained motion planning framework for robot manipulators in human-robot interaction (HRI). For a non-redundant manipulator with a fully specified end-effector pose, additional requirements such as collision avoidance and self-collision avoidance are difficult to handle as simple null-space secondary tasks. This limitation makes it challenging to generate feasible joint-space trajectories in HRI environments where safety and kinematic constraints must be considered simultaneously. To address this limitation, collision","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17411,"title":"DigitCode: Symbolic Tokenization of Hand Motion by Anatomical Units","url":"https://arxiv.org/abs/2608.03127","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03127v1 Announce Type: new \nAbstract: Hand motion carries the finest-grained information in human activity, yet the representations behind hand generation, understanding, and robot learning are overwhelmingly continuous--joint angles or MANO parameters. These are accurate but unstructured: a finger cannot be indexed or edited as a symbol, and nothing marks a pose as anatomically valid. Discrete symbolic representations supply exactly this structure, and Hand Labanotation (HL) has shown they are feasible for the hand, writing motion as a T x 40 grid of one fixed direction symbol per","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17410,"title":"A Hierarchical Approach to Imitation Learning for Manipulation Tasks Requiring Time Varying Forces","url":"https://arxiv.org/abs/2608.03103","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03103v1 Announce Type: new \nAbstract: Diffusion policies have shown strong performance in learning complex, multi-modal behaviors for robotic manipulation. However, their application to contact-rich disassembly tasks remains limited by a key trade-off: the iterative denoising process introduces inference latencies that makes high frequency control difficult, which is essential for realizing dynamic interactions such as chiseling and prying. Recent action-chunking techniques mitigate latency but use an open-loop execution window, rendering the system blind to rapid force transients c","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17409,"title":"How Should Vision-Language-Action Models Use Proprioceptive State?","url":"https://arxiv.org/abs/2608.03052","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03052v1 Announce Type: new \nAbstract: Recent Vision-Language-Action (VLA) models almost universally take robot proprioceptive state as input, yet wire it in incompatible ways -- serialized into text prompts, projected into the vision-language prefix, or fed directly to the action expert -- and almost always as a single current frame. Three questions remain open: (1) whether, and on which tasks, current state actually improves closed-loop control; (2) how much state history helps, and whether its benefit reflects genuine temporal variation rather than added conditioning capacity; and","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17408,"title":"PACE: Adaptive Budget Allocation for Time-Efficient Embodied Planning","url":"https://arxiv.org/abs/2608.03034","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03034v1 Announce Type: new \nAbstract: Reasoning-enhanced large language models have achieved remarkable improvements in planning tasks, yet their deployment in embodied systems remains impractical due to prohibitive inference delays-often exceeding minutes per planning instance. The fundamental bottleneck stems from the serial nature of existing paradigms: models must complete all reasoning before any action execution, leaving execution time windows entirely unexploited. We introduce PACE (Planning with Adaptive Cognitive Effort), a framework that enables interleaved reasoning and e","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17407,"title":"Forbidden Region Dynamic Active Constraints in Robot-Assisted Minimally Invasive Surgery","url":"https://arxiv.org/abs/2608.03010","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03010v1 Announce Type: new \nAbstract: In robot-assisted surgery, Forbidden Region Active Constraints (FRAC) represent a control strategy that helps maintain task safety by generating anisotropic haptic guidance to surgeons. However, several challenges need to be overcome before FRAC can benefit teleoperative surgery in a clinical setting. These challenges include the ability to allow for dynamic tissue deformation, maintain energetic passivity, and speed of implementation, among others. In this study, we propose the pipeline design for an energy dissipative FRAC strategy, which acco","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17406,"title":"EmbodiedVAE: Disentangled Video VAE for Efficient and Controllable Embodied Manipulation","url":"https://arxiv.org/abs/2608.02990","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02990v1 Announce Type: new \nAbstract: Latent diffusion models (LDMs) have recently significantly advanced embodied learning in constructing powerful embodied manipulation world models. However, despite the remarkable performance, existing LDMs predominantly rely on Variational Autoencoders (VAEs) optimized for natural scenes while failing to account for the unique characteristics of embodied manipulation scenarios, yielding latent representations that are neither compact nor controllable, thereby hindering efficient training of LDMs and precise robotic control. To solve this problem","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17405,"title":"ValueFormer: A Causal Transformer Value Function with Stage-Aware Labels for Semi-Autonomous Vision-Language-Action Policies","url":"https://arxiv.org/abs/2608.02958","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02958v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) policies trained by behavior cloning fail silently: from the action stream alone, a collapsing rollout looks much like one making clean progress, because imitation supplies no notion of progress. Reinforcement learning would supply one, but it is impractical here, where real-robot experience is costly and deformable food resists simulation. The cheap alternative, a terminal success / failure bit, is learnable in principle yet far too sparse to say when a rollout went wrong. We argue that the per-frame label, not the","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17404,"title":"DeRP: An Algorithm for Self-Assembly of Power-Delivery Networks using Recursive Branching in Information-Limited Environments","url":"https://arxiv.org/abs/2608.02904","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02904v1 Announce Type: new \nAbstract: Delivering sustained power to distributed equipment in unstructured field environments using pre-planned wired networks or battery-based solutions presents significant infrastructure and logistics challenges. This paper presents Dendritic Recursive Pivoting (DeRP), a decentralized framework for multi-target network formation in robot swarms based solely on local communication and bearing-based sensing toward sinks. We envision a system in which robots, acting as a conduit, self-assemble a power network from a common source, forming branches at l","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17403,"title":"Contact-Driven Localization in a Freeform Robotic Self-Assembled Structure","url":"https://arxiv.org/abs/2608.02895","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02895v1 Announce Type: new \nAbstract: Accurate localization remains a key challenge in swarm robotics, particularly for self-reconfigurable systems that must identify relative positions to form diverse structures. Most existing approaches rely on external tracking infrastructure or high-cost sensors, which limit scalability and deployment in unstructured environments. In this paper, we propose a novel contact-driven localization method for modular robots that leverages only local communication through binary contact information (whether two robots are physically connected or not). T","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17402,"title":"Control Barrier Functions via Minkowski Operations for Safe Navigation among Polytopes","url":"https://arxiv.org/abs/2608.02886","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02886v1 Announce Type: new \nAbstract: Safely navigating polytopic environments while respecting the dynamics, control, and exact geometry of the underlying system is a challenge in robotics. Control barrier functions (CBFs) synthesize safe control policies by rendering the safe set forward invariant, but many existing CBF-based methods approximate polytopes using conservative smooth shapes, such as spheres or ellipsoids, to obtain explicit differentiable distance functions. In this article, we propose an exact Signed Distance Function (SDF) formulation for a {\\it polytopic} robot an","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17401,"title":"Staying on Spec: Real-Time Monitoring under Uncertainty with a Maritime Case Study","url":"https://arxiv.org/abs/2608.02811","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02811v1 Announce Type: new \nAbstract: Robotic systems must operate under uncertainty while satisfying complex task and safety specifications. Monitoring such specifications under uncertainty remains challenging, as existing formulations typically require extensive data or explicit uncertainty distributions. In this paper, we propose a real-time monitoring framework that reduces data requirements by leveraging data-driven reachable sets for specification evaluation. We instantiate the framework for maritime navigation, where complex specifications arise from traffic rules. We develop","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17400,"title":"Toward Certified Functional Safety for Industrial Humanoid Robots: The Fail-Passive Gap and a Feasibility Study","url":"https://arxiv.org/abs/2608.02809","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02809v1 Announce Type: new \nAbstract: Industrial humanoid robots are constrained less by locomotion or manipulation capability than by the immaturity of functional safety certification for legged platforms. The root difficulty is that the safe state of a legged robot is an actively-controlled state, which violates the fail-passive assumption underlying ISO~13849-1 / EN~60204-1: removing power from a walking biped causes an uncontrolled fall, so classical de-energization is itself a hazard. We term this the fail-passive gap and use a certified external safety chain (light curtain, em","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17399,"title":"Semantic Haptic Feedback Enhances Dexterous Robotic Teleoperation","url":"https://arxiv.org/abs/2608.02780","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02780v1 Announce Type: new \nAbstract: In robot teleoperation, haptic feedback can be used to help human operators accomplish dexterous manipulation tasks. However, existing haptic feedback methods try to replicate high-fidelity sensory haptics that are felt in real world interactions, which are constrained by the sensing and feedback hardware capability and may lead to higher workload.\n  To addresses these limitations, this work introduces semantic haptics for teleoperation, which uses abstract haptic patterns to convey critical information about robot states. We categorize robot st","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17398,"title":"Light-Loco-Parkour: Versatile Perceptive Whole-Body Locomotion via Multi-Skill Distillation","url":"https://arxiv.org/abs/2608.02653","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.02653v1 Announce Type: new \nAbstract: Existing humanoid whole-body control systems still fall short of the way humans move through cluttered terrain: they either track expressive whole-body references without terrain generalization, or react to terrain online while leaving the arms, torso, and knees largely unused. We present \\texttt{Light-Loco-Parkour} (LLP), an end-to-end perceptive whole-body locomotion system that closes this gap with a single deployable policy. Conditioned only on onboard depth and a velocity command, the policy decides when to walk, balance, climb, step down,","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"},{"id":17178,"title":"特斯拉财报电话会议数据：马斯克近半发言聚焦 AI 与机器人业务 - DoNews","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTFBXWlZBSFlDS0hFZGRmVTFfTVY1WWswRGVXTUZFM0lyc3RTcTNRU09MLUF0THJlVEh0S2ZRR2hUWENUQ3lhMzNIbjJ5O // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
