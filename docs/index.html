、光芯片环节同样高增，全产业链呈现“整体景气、全面开花”的强劲势头。","tags":[],"cluster_size":1,"ts":"2026-08-31T23:22:20"},{"id":24758,"title":"券商9月“金股”扎堆四大行业，机构看好核心资产配置价值","url":"https://wallstreetcn.com/livenews/3158086","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"从券商推荐的9月“金股”组合看，截至8月31日发稿时，已有近70只A股及港股标的获得券商青睐，其中宁德时代、药明康德关注度最高；从券商“金股”的行业分布情况看，电子、机械设备、医药生物、有色金属等行业受到青睐。展望9月行情，业内人士认为，在多方因素共同作用下，短期市场大概率维持区间震荡走势。风格上，大盘价值与小盘成长或共舞。具体配置上，当下看好黄金及中国核心资产配置价值，红利板块、景气度有望触底的行业等方向机遇也值得关注。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T23:04:59"},{"id":24759,"title":"数千产品集中“换锚”，理财行业迈入相对收益时代","url":"https://wallstreetcn.com/livenews/3158084","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月以来，已有数千只理财产品完成业绩比较基准切换，多数产品告别“1.45%-2.55%（年化）”这类直观的区间型业绩比较基准，转而采用挂钩中债综合指数、LPR等市场化指标的公式化业绩比较基准。本轮调整中，贵阳银行旗下“爽银财富—周周宝”成为市场少见的样本，该产品此前执行1.50%-2.60%的业绩比较基准。自9月1日起，该产品取消业绩比较基准。","tags":[],"cluster_size":1,"ts":"2026-08-31T22:57:06"},{"id":24760,"title":"理财新规今起施行，信披文件改版进行时","url":"https://wallstreetcn.com/livenews/3158082","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"9月1日，《银行保险机构资产管理产品信息披露管理办法》开始施行。国内理财行业迎来一轮全面规范整改浪潮。多家理财公司集中修订理财产品说明书等产品文件，核心围绕业绩比较基准优化、信息披露渠道和时间规范、产品要素完善三大维度迭代升级。理财行业正在将信息披露融入业务全过程，实现产品情况“看得清、厘得清、算得清”。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T22:48:09"},{"id":24761,"title":"基金持有人全貌出炉，股票型基金获个人投资者增持","url":"https://wallstreetcn.com/livenews/3158078","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"基金2026年中期报告披露完毕，持有人全貌也随之展现。天相投顾数据显示：2026年上半年，机构投资者增持混合型基金，减持股票型基金；个人投资者增持股票型基金，减持混合型基金。从公司层面看：易方达基金、广发基金和富国基金旗下基金最受机构投资者青睐；个人投资者持有基金份额前三的公司分别为易方达基金、华夏基金和天弘基金。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T22:38:40"},{"id":24762,"title":"锂电材料业绩全面爆发","url":"https://wallstreetcn.com/livenews/3158077","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"天齐锂业增长49倍，湖南裕能增长8.5倍，天赐材料增长9.7倍……从碳酸锂、磷酸铁锂、六氟磷酸锂到电解液，锂电材料龙头企业上半年业绩大幅反弹，相关公司经营现金流更是同步改善。“业绩高速增长，是下游需求结构切换、锂资源供需紧平衡，叠加2025年同期低基数共同作用的结果。”有熟悉锂电产业人士表示。今年上半年，储能电池需求大幅增长带动锂电材料价格快速攀升，供给端量价齐升的喜人局面让行业公司纷纷受益。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T22:36:50"},{"id":24763,"title":"美股三大指数全线收跌，贝壳跌6.17%，阿里巴巴跌4.10%，优步跌4.02% - sohu.com","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPeHFDUDZUZ3lvbUt6RG5mMnUza0lRUHFhMlJVTTdLU2ltSDRDRV9sQU5KRlRoZGEtRU1BVFFqRlA0Rld3a1AydmZFWUpfbUxSRVh4eEtOZ0xxdjRtNDNwVkdMS1NlZXVSZXpPRHlfNm54VFZSei1MUG9tZUF6WE1Ka0wxRG9wVTl5?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxPeHFDUDZUZ3lvbUt6RG5mMnUza0lRUHFhMlJVTTdLU2ltSDRDRV9sQU5KRlRoZGEtRU1BVFFqRlA0Rld3a1AydmZFWUpfbUxSRVh4eEtOZ0xxdjRtNDNwVkdMS1NlZXVSZXpPRHlfNm54VFZSei1MUG9tZUF6WE1Ka0wxRG9wVTl5?oc=5\" target=\"_blank\"\u003e美股三大指数全线收跌，贝壳跌6.17%，阿里巴巴跌4.10%，优步跌4.02%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003esohu.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-31T22:30:03"},{"id":24764,"title":"传统蓝筹领衔，成长力量崛起，A股公司中期分红规模逾7000亿元","url":"https://wallstreetcn.com/livenews/3158073","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月31日，A股市场共有867家公司推出2026年中期现金分红方案，拟派现总金额达7167.51亿元（含已实施完毕），延续高位运行态势。从行业分布来看，金融、能源、科技、医药等行业为中期分红的主力。据统计，共有80家公司推出派现金额逾10亿元的中期现金分红方案，其中超过百亿元的有15家，传统蓝筹公司依然占据主导地位。当前，AI产业链、动力电池产业链等硬科技领域的成长型企业也开始积极参与分红，部分企业推出上市以来首次中期现金分红方案。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T22:27:08"},{"id":24765,"title":"从“打折价融资”到“全球化定价”，A股公司赴港上市逻辑生变","url":"https://wallstreetcn.com/livenews/3158071","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Wind数据显示，今年已有33家A股公司赴港上市，累计募资2321.8亿港元。而去年全年共有19家A股公司实现赴港上市。今年以来，A股行业龙头H股发行端折价显著缩窄。多家A股公司以定价区间上限发行H股，如晶合集成、芯碁微装等。还有多家公司打破了长期以来H股相对A股大幅折价的惯例。香港股票分析师协会理事温杰表示，这主要是因为中国核心资产在港股被国际资金按全球同业重新定价。从“打折价融资”到“全球化定价”，A股公司赴港上市的定价逻辑正在发生变化。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-31T22:19:32"},{"id":24766,"title":"8月月末为美国回购市场的温和夏季画上句号","url":"https://wallstreetcn.com/livenews/3158068","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"8月隔夜回购协议的最后一个交易日，为一段资金面保持平稳的时期画上了句号，尽管自上月起美国国债短期票据的大量供给已经开始涌入市场。富国银行策略师表示，这一趋势可能延续至9月上半月，直到纳税截止日之前。\n\n在财政部于7月开始增加短期票据发行之前，由于供给不足、市场中大量现金流动以及交易商中介服务的可用性，融资成本一直偏低。","tags":[],"cluster_size":1,"ts":"2026-08-31T22:15:46"},{"id":24767,"title":"周一（8月31日）纽约尾盘，标普500股指期货最终跌0.26%，道指期货跌0.59%，纳斯达克100股指期货涨0.11%。\n\n罗素2000股指期货跌0.57%。","url":"https://wallstreetcn.com/livenews/3158051","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周一（8月31日）纽约尾盘，标普500股指期货最终跌0.26%，道指期货跌0.59%，纳斯达克100股指期货涨0.11%。\n\n罗素2000股指期货跌0.57%。","tags":[],"cluster_size":1,"ts":"2026-08-31T21:08:28"},{"id":24768,"title":"标普500指数的11个板块中，电信板块收跌1.63%，可选消费板块跌0.72%，信息技术/科技板块涨0.3%，能源板块涨2.1%。","url":"https://wallstreetcn.com/livenews/3158036","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"标普500指数的11个板块中，电信板块收跌1.63%，可选消费板块跌0.72%，信息技术/科技板块涨0.3%，能源板块涨2.1%。","tags":[],"cluster_size":1,"ts":"2026-08-31T20:09:57"},{"id":24769,"title":"8月份标普涨超2.6%，纳指科技指数涨约4.2%，半导体指数涨幅不足2%","url":"https://wallstreetcn.com/livenews/3158030","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"标普500指数收跌25.62点，跌幅0.33%，报7686.14点，8月份累计上涨2.62%。\n\n道琼斯工业平均指数收跌374.09点，跌幅0.70%，报53185.90点，8月份累涨1.34%。\n\n纳斯达克综合指数（纳指）收跌31.534点，跌幅0.12%，报26370.889点。\n\n纳斯达克100指数收涨23.546点，涨幅0.08%，报29456.973点，8月份累涨4.18%。","tags":[],"cluster_size":1,"ts":"2026-08-31T20:00:14"},{"id":24770,"title":"恒生指数主连夜盘收跌0.42%，报25346点。\n\n恒生科技指数主连夜盘收跌0.74%，报4590点。","url":"https://wallstreetcn.com/livenews/3158015","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"恒生指数主连夜盘收跌0.42%，报25346点。\n\n恒生科技指数主连夜盘收跌0.74%，报4590点。","tags":[],"cluster_size":1,"ts":"2026-08-31T19:13:10"},{"id":24771,"title":"博通表示，来自Google、英伟达和阿里巴巴云的AI模型已通过验证，可在VMware Cloud Foundation上运行。 - Moomoo","url":"https://news.google.com/rss/articles/CBMiswFBVV95cUxPVFR6RmNqb1p6UVRiN0VxNlhIUWZ6R2tzdGlYcWtxaWg4WWxJMEc3SkpNNEh4ejktd1Fxd0cyMklmZW5GWHRKT3dYUXBJMm9zRHctcGh3V19sQkFWa25uSE11TjE0ZFhyUlVCTXEzcEl2REFPVUFiejNwb3B2OXh0LWxzRmtpN3V4OUg2eWJ5YTRlT2dMR2ljMDRiRmhKNnBaU0dUOGxpSW5IeHZLeUdfbVFDRQ?oc=5","source":"GNews · 阿里巴巴","sourc el-based control computationally expensive. In","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24502,"title":"Linear Temporal Logic Translation via Human-Inspired Self-Constrained Reasoning for Robot Task Specification","url":"https://arxiv.org/abs/2608.28435","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28435v1 Announce Type: new \nAbstract: Many robotic tasks are temporally extended and demand precise specifications of subgoals, constraints, and their temporal ordering. Yet human operators typically communicate such tasks in natural language, which is inherently ambiguous, underspecified, and context dependent. Translating human instructions into formal task specifications, such as Linear Temporal Logic (LTL), is therefore essential for verifiable and safe robotic execution. Existing LLM-based translators attempt to bridge this gap through open-ended reasoning or post-hoc constrain","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24501,"title":"Cooperative Risk-Aware Exploration in Heterogeneous Multi-Robot Systems Using Algorithmic Altruism","url":"https://arxiv.org/abs/2608.28409","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28409v1 Announce Type: new \nAbstract: Multi-robot systems are well-positioned for exploration in hazardous environments, but effective deployment requires deciding not only where robots should gather information, but also how risk should be distributed across heterogeneous team members. This paper develops a game-theoretic framework for cooperative risk-aware exploration based on ecologically inspired altruistic behavior. Each robot selects a finite-horizon trajectory to maximize information gain while penalizing redundant exploration and expected hazard exposure. Heterogeneity is i","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24500,"title":"PanelShield: Verifiable Closed-Loop Safe Planning for Robotic Industrial Panel Operation","url":"https://arxiv.org/abs/2608.28305","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28305v1 Announce Type: new \nAbstract: Industrial panel operation is knowledge-intensive and safety-critical. Beyond control recognition and action generation, execution must satisfy constraints in operation manuals and safety regulations. While foundation-model-based planners show strong semantic capability, they typically lack computable, localizable, and reproducible mechanisms for violation detection and repair. To address this, we propose PanelShield, a verifiable closed-loop safety planning framework for manual-guided industrial panel operation. The framework generates paramete","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24499,"title":"MaCoPlanner: LLM-Assisted Manual-Compiled Task Planning with Proactive Safety Verification for Robotic Industrial Panel Operation","url":"https://arxiv.org/abs/2608.28300","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28300v1 Announce Type: new \nAbstract: Robotic industrial panel operation requires not only accurate control localization but also compliance with operating procedures, safety rules, and device-state constraints distributed across heterogeneous manuals. This study presents MaCoPlanner, a task-planning framework built on knowledge compiled from equipment manuals that converts equipment manuals into a typed intermediate representation, retrieves task- and state-relevant evidence, and uses it to support plan generation. Before actuation, candidate plans are symbolically rolled out and c","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24498,"title":"CoCoBench: A Cooperative Coordination Benchmark for Embodied Multi-Agent Task Planning","url":"https://arxiv.org/abs/2608.28266","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28266v1 Announce Type: new \nAbstract: Agent systems powered by multimodal large language models (MLLMs) have advanced rapidly in recent years, yet existing embodied-agent benchmarks still lack fine-grained diagnostics for multi-agent coordination. Most benchmarks either focus on single-agent task completion or summarize multi-agent behavior with overall task success rates, which can obscure coordination failures such as duplicated work, violations of ordering constraints, resource contention, and desynchronized handoffs. In this paper, we introduce CoCoBench, a construct-level bench","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24497,"title":"Training-free Suction Grasp Detection for Deformed Aseptic Cartons Using Vision-Language Models and Geometric Surface Scoring","url":"https://arxiv.org/abs/2608.28246","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28246v1 Announce Type: new \nAbstract: Robotic sorting of recyclable waste is challenging due to the deformable and geometrically inconsistent nature of target objects. We present a training-free suction grasping system for sorting deformed aseptic beverage cartons, decoupling target identification from grasp-point selection. An open-vocabulary vision-language model detects cartons from a text prompt, SAM2 refines each detection into an instance mask, and a geometric scoring method selects the suction point by combining surface flatness with normal alignment. Three geometric methods","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24496,"title":"Probabilistic Multi-Robot Gas Source Localization with Uncalibrated Sensors: A Distributed Estimation Approach","url":"https://arxiv.org/abs/2608.28214","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28214v1 Announce Type: new \nAbstract: Estimating environmental states with multi-robot systems becomes particularly challenging when robots are equipped with uncalibrated and therefore heterogeneous sensors, whose nonlinear and inconsistent responses prevent reliable information fusion. In this paper, we propose a distributed probabilistic framework for source localization tasks that enables calibration-free estimation in the presence of sensor heterogeneity. The key idea is that each robot independently estimates a local belief using a rank-based feature that captures the relative","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24495,"title":"PAMoR: Parameterized Affective Motion Generation in Real Time for Humanoid Robots","url":"https://arxiv.org/abs/2608.28213","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28213v1 Announce Type: new \nAbstract: People read a humanoid robot's motion in social settings not only for the action performed but for the affect conveyed. Motion carrying that affect has so far been generated for human avatars, where style is taken from a reference clip or an emotion word, neither of which can be quantitatively parameterized. We present PAMoR, which turns affect into a measured control parameter: a valence-arousal (V-A) coordinate computed natively on robot kinematics. It is obtained in closed form from postural expansion and movement energy, and these measuremen","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24494,"title":"From Small Talk to Rapport: Exploring Robot Self-Disclosure in Collaborative Tasks","url":"https://arxiv.org/abs/2608.28154","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28154v1 Announce Type: new \nAbstract: People naturally chat while collaborating and share personal information (i.e., self-disclose) to build rapport and maintain social connections. As robots are increasingly developed to work with people, the effective use of these social behaviors to enhance engagement and support teamwork becomes ever more important. While prior work has shown that robot-initiated small talk can benefit human-robot collaboration, less is known about how best to design such small talk. In this work, we explore how self-disclosure may be designed to support small","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24493,"title":"Contact-Guided Exploration for Non-Prehensile Locomanipulation with Multi-Critic RL","url":"https://arxiv.org/abs/2608.28140","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28140v1 Announce Type: new \nAbstract: Non-prehensile manipulation offers versatile skills for moving and rearranging heavy or bulky objects, particularly when combined with a mobile manipulation platform. However, both model-based and model-free approaches struggle with the complex hybrid dynamics and the sparsity of the contact in these tasks. To address these challenges, we propose a contact-guided exploration strategy implemented within a Multi-Critic Reinforcement Learning (RL) framework. A dedicated exploration critic is trained with a dense contact-seeking reward that guides t","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24492,"title":"DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA","url":"https://arxiv.org/abs/2608.28108","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28108v1 Announce Type: new \nAbstract: Vision-Language-Action models (VLAs) allow users to specify manipulation tasks in natural language, but distinguishing a target or placement goal among objects of the same category or similar appearance requires detailed expressions that VLAs may not use reliably. We propose DeicticVLA, which canonicalizes Language Instruction (LI), Vision-Language Instruction (VLI), and Visual Instruction (VI) into a text prompt and deictic masks through text-prompt completion and deictic gesture grounding, enabling a single pretrained VLA to handle all three i","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24491,"title":"Stay Seated: Learning Omnidirectional Humanoid Locomotion on a Passive Mobile Chair with Casters","url":"https://arxiv.org/abs/2608.28090","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28090v1 Announce Type: new \nAbstract: Humanoid robots with quasi-direct-drive actuators continuously generate joint torque while standing, whereas seated humans delegate weight support to chairs during desk work. As a first step toward seated loco-manipulation, we study omnidirectional seated locomotion on a passive mobile chair, requiring unfixed pelvis-seat contact and intermittent foot-floor propulsion of the robot-chair system. We extend a standard standing velocity-tracking environment with a passive-chair model, seated-state rewards, critic-only chair observations, and task-ta","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24490,"title":"Plan Along the Way: Event-Triggered Foundation-Model Planning for TAMP Execution in Partially Observable Manipulation","url":"https://arxiv.org/abs/2608.28075","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28075v1 Announce Type: new \nAbstract: Manipulation in partially observable environments requires planning under incomplete scene information. In such settings, an initially valid plan may execute successfully yet remain insufficient for task completion. Existing foundation-model-guided task and motion planning (TAMP) systems can generate useful long-horizon task decompositions, subgoals, or constraints, but they often assume having access to a fully specified scene state or invoke model-level replanning after a subgoal, refinement, or execution attempt fails. We present ROBUST TAMP,","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24489,"title":"Coordinated Motion Planning for Multi-Arm Systems via Iterative LQ Games","url":"https://arxiv.org/abs/2608.27726","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27726v1 Announce Type: new \nAbstract: Multi-agent motion planning for high-degree-of-freedom robotics manipulators in shared workspaces remains a fundamental yet challenging problem. Centralized planners often suffer from poor scalability, while decentralized approaches face robustness and safety concerns. Game-theoretic formulations offer a promising approach for modeling agent interactions, potentially overcoming these limitations. However, their application to articulated multi-arm systems remains limited. This paper presents an iterative Linear Quadratic (LQ) game framework for","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24488,"title":"One year in a forest: Analyzing the challenges of autonomous navigation in subarctic environments","url":"https://arxiv.org/abs/2608.27628","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27628v1 Announce Type: new \nAbstract: Subarctic regions have the potential to see increased deployment of autonomous robots in applications including forestry, mining, and environmental monitoring. In these conditions, an autonomous system's reliance on GNSS or cloud computing is precarious due to dense tree canopies and atmospheric attenuation, necessitating onboard sensing and data processing. However, established exteroceptive modalities, including cameras, lidars, and radars, are typically evaluated in structured urban settings or in environments that lack significant seasonal v","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24487,"title":"PHR-VLA: Planning Horizon Reasoning for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.27609","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27609v1 Announce Type: new \nAbstract: Vision-language-action models (VLAs) have shown strong promise for general-purpose robotic manipulation by mapping language instructions and vision observations directly to actions. However, most VLAs primarily condition action prediction on current observations and lack an explicit mechanism for reasoning over future task dynamics, which is particularly important for fine-grained, contact-rich manipulation. We present PHR-VLA, a framework that enables planning-horizon reasoning in VLAs through privileged latent representations of future dynamic","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24486,"title":"Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.27550","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27550v1 Announce Type: new \nAbstract: Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodi","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24485,"title":"Remote Human and Robot Interaction for Greenhouse Gardening Using Virtual Reality","url":"https://arxiv.org/abs/2608.27545","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27545v1 Announce Type: new \nAbstract: This study evaluates the effectiveness of remote human-robot interaction using virtual reality for leaf inspection and soil moisture assessment in a greenhouse environment. The robotic system comprised an unmanned ground vehicle and a robotic manipulator equipped with cameras, governed by kinematic models for navigation and manipulator control. Fourteen distinct plants were inspected across two experiments utilizing VR teleoperation, guided by a set of pre-specified research questions and hypotheses. In the leaf inspection experiments, cycle com","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24484,"title":"Beyond Relative Geometry: Metric-Aware Geometry Perception for Robotics","url":"https://arxiv.org/abs/2608.27497","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.27497v1 Announce Type: new \nAbstract: Recent embodied models increasingly leverage geometric representations to improve spatial reasoning and robotic manipulation. However, existing reconstruction methods only reconstruct relative geometry with arbitrary scales, causing predicted object dimensions and spatial distances to vary across scenes, viewpoints, and input configurations. This inconsistency prevents geometric perception from being directly aligned with robotic actions defined on the real-world scale. To address this limitation, we propose Metric-Aware Geometry Perception (MAG","tags":[],"cluster_size":1,"ts":"2026-08-31T04:00:00"},{"id":24797,"title":"Seeds | 玄创机器人完成数千万元A1轮融资 - gasgoo.com","url":"https://news.google.com/rss/articles/CBMiigJBVV95cUxNYmZHUktUazNuQXlVZVByZ25SeWtobHN1Z0szeERqbFVDVmZ3Y1FoUndqS3RzekpPNXM5M1E0OERDSElQckVyQ1BRR1I4VE4yaGRjRzFVXzI3UjU0aDFtWUV4eWJKU1BVYWlaaDllODdaQXlMOXlfYWdrWUUzVGd0Sm1PMmNnNHZKcFBLVzJYajJIeHUyS0JJQmRBenhIYUc4M3J1ZzV3a3hyODZmWkNWQlBXMGd2SGkyNEhQY0xfdXhsTmZ4V2hSRjVCOFRJMFBRNGNzRGFCU0toaXNmeVozSkRRRkpWUTlBNld1WWJNNks4X1RZV0h3dWtQemVJSTRQLUZFbVR5d2pjQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiigJBVV95cUxNYmZHUktUazNuQXlVZVByZ25SeWtobHN1Z0szeERqbFVDVmZ3Y1FoUndqS3RzekpPNXM5M1E0OERDSElQckVyQ1BRR1I4VE4yaGRjRzFVXzI3UjU0aDFtWUV4eWJKU1BVYWlaaDllODdaQXlMOXlfYWdrWUUzVGd0Sm1PMmNnNHZKcFBLVzJYajJIeHUyS0JJQmRBenhIYUc4M3J1ZzV3a3hyODZmWkNWQlBXMGd2SGkyNEhQY0xfdXhsTmZ4V2hSRjVCOFRJMFBRNGNzRGFCU0toaXNmeVozSkRRRkpWUTlBNld1WWJNNks4X1RZV0h3dWtQemVJSTRQLUZFbVR5d2pjQQ?oc=5\" target=\"_blank\"\u003eSeeds | 玄创机器人完成数千万元A1轮融资\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003egasgoo.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-31T03:30:28"},{"id":24504,"title":" // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
