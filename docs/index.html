cG1UOHdkTTZFc0JB?oc=5\" target=\"_blank\"\u003e9月2日恒生中国企业ETF平安基金份额减少300万份，重仓股腾讯控股、建设银行、阿里巴巴-W\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-03T00:14:58"},{"id":25503,"title":"公募放缓发行节奏，等待布局窗口","url":"https://wallstreetcn.com/livenews/3159512","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，受市场扰动因素增多、前期获利筹码集中兑现等因素影响，部分公募选择推迟新基金募集截止时间，拉长产品入市周期。当前，在市场主题热点轮动散乱、不确定性抬升的环境下，不少公募选择放缓发行节奏，目的很可能是希望等待新的合适的布局窗口。记者注意到，平安基金、南方基金、华泰保兴基金、创金合信基金等多家公募，近期陆续发布旗下新产品延长募集的公告。即便部分板块迎来阶段性上升行情，基金公司也并未急于推动产品快速成立、快速建仓。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-09-02T23:40:50"},{"id":25504,"title":"华尔街见闻早餐 | 2026年9月3日","url":"https://wallstreetcn.com/livenews/3159508","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"油价涨势暂歇缓解通胀担忧，美股终结三连跌，戴尔大涨16%；欧债收益率创数十年新高；日元兑美元盘中拉升1.2%。\n\n中国央行行长潘功胜：继续实施好适度宽松的货币政策，持续推进货币政策框架转型；中国没有必要，也无意通过汇率贬值获取贸易竞争优势。\n\n特朗普表示对伊朗的军事打击不会持续太久，提议霍尔木兹海峡改名“特朗普海峡”。\n\n美国8月“小非农”ADP私人部门新增就业3.8万人，创今年1月以来最低，低于市场预期。数据公布后市场对9月加息的押注小幅降温。\n\n美国纽约联储主席表示，随着关税影响逐渐消退，通胀趋势缓慢向下。\n\n日元盘中一度急涨1.2%触及158.22，市场高度戒备美日再度联手干预。\n\n地缘风险升温，荷兰央行将约120亿美元黄金储备从美国加转移至伦敦。\n\n中国称下半年将集中整治“内卷式”竞争乱象，深化“幽灵外卖”专项整治。\n\n博通上季营收增86%，AI芯片收入增两倍，本季指引“瑕疵”但AI收入料三年高增。\n\n月之暗面（Kimi）以保密形式向港交所递交A1文件，正式启动港股IPO流程。","tags":[],"cluster_size":2,"ts":"2026-09-02T23:20:18"},{"id":25505,"title":"多家券商科创投资收益加速释放","url":"https://wallstreetcn.com/livenews/3159501","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"科创投资正成为影响券商业绩的关键变量之一。随着越来越多优质科技企业登陆资本市场，券商正积极通过旗下另类子公司、私募子公司开展科创投资，深度布局科创领域。相关半年报数据显示，43家A股上市券商中，有36家券商的另类子公司、34家券商的私募子公司实现盈利。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-09-02T22:58:38"},{"id":25506,"title":"百亿级私募二季度末重仓股揭晓","url":"https://wallstreetcn.com/livenews/3159499","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着A股上市公司2026年半年报完成披露，百亿级证券私募的二季度持仓图谱完整浮出水面。据第三方机构私募排排网统计，截至二季度末，55家百亿级私募现身264家上市公司前十大流通股东名单，合计持股市值达913.51亿元（同一家上市公司被多家私募持仓时，在统计中会被重复计算；持股市值按照第二季度末的收盘价计算）。从调仓结构来看，百亿级私募新进个股多达134只，增持29只，减持仅25只。一端是科技制造方向的集中加仓，另一端是存量仓位的精细再平衡。（中证报）","tags":[],"cluster_size":1,"ts":"2026-09-02T22:50:01"},{"id":25507,"title":"上证报：新政效应持续释放，楼市“金九银十”成色可期","url":"https://wallstreetcn.com/livenews/3159495","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，住房城乡建设部、中国人民银行、金融监管总局、中国证监会等多个部门打出政策“组合拳”，推动加快构建房地产发展新模式。新政出台后，记者在北京、深圳、广州、武汉等地实探楼市。记者发现，在政策“组合拳”和此前各地出台的一系列楼市政策的加持下，不管是新房市场，还是二手房市场，都出现了一些可喜的信号，业界普遍看好楼市今年“金九银十”的成色。","tags":[],"cluster_size":1,"ts":"2026-09-02T22:38:21"},{"id":25508,"title":"北京二手房单周成交量等指标“回暖”","url":"https://wallstreetcn.com/livenews/3159489","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"一系列楼市新政落地后，北京二手房、新房市场活跃度均有所提升，单周成交量等指标“回暖”。近日，记者走访北京西城区、丰台区等地的多家地产中介门店了解到，自8月中下旬以来，地产中介门店的接待量、电话咨询量都有明显增加。北京市8月初发布新一轮楼市新政，非京籍家庭购买五环内商品住房的社保或个税缴纳年限由2年调减为1年，同时提升公积金贷款额度、扩大“带押过户”范围。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-02T22:15:55"},{"id":25509,"title":"博通预测未来两年AI芯片收入将大幅增长","url":"https://wallstreetcn.com/livenews/3159486","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"博通公司预测，未来两年其人工智能芯片销售额将大幅飙升，这重新点燃了市场对其能够挑战英伟达在该市场主导地位的信心。首席执行官陈福阳（Hock Tan）表示，AI芯片收入将在2027财年翻倍至约1150亿美元，并在下一财年飙升至2300亿美元。该公司还有望在2028财年实现每股收益超过30美元的业绩，超出华尔街预期。","tags":[],"cluster_size":1,"ts":"2026-09-02T21:50:04"},{"id":25510,"title":"博通股价盘后转涨。","url":"https://wallstreetcn.com/livenews/3159479","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"博通股价盘后转涨。","tags":[],"cluster_size":1,"ts":"2026-09-02T21:22:17"},{"id":25511,"title":"澳大利亚企业盈利四年来首次超预期","url":"https://wallstreetcn.com/livenews/3159478","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"据彭博汇编的数据，标普/澳交所200指数中近半数公司报告了超出预期的利润，盈利超预期的公司以1.5倍的比例超过不及预期的公司。强劲的业绩推动该国基准股指在8月初创下历史新高，随后涨幅有所收窄，最终以月涨1.1%收盘。MST Financial投资策略师哈桑·特夫菲克（Hasan Tevfik）表示：“我们对市场持乐观态度，这主要受前景预期驱动。”尽管利润增长尚未全面复苏，“但我们仍然预期盈利将偏向超预期而非不及预期。”","tags":[],"cluster_size":1,"ts":"2026-09-02T21:21:57"},{"id":25512,"title":"周三（9月2日）纽约尾盘，标普500股指期货最终涨0.39%，道指期货涨0.60%，纳斯达克100股指期货涨0.06%。\n\n罗素2000股指期货涨1.22%。","url":"https://wallstreetcn.com/livenews/3159472","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周三（9月2日）纽约尾盘，标普500股指期货最终涨0.39%，道指期货涨0.60%，纳斯达克100股指期货涨0.06%。\n\n罗素2000股指期货涨1.22%。","tags":[],"cluster_size":1,"ts":"2026-09-02T21:06:58"},{"id":25513,"title":"黄金ETF收盘反弹超1.5%，小盘股指ETF领跑美股大类资产类ETF","url":"https://wallstreetcn.com/livenews/3159460","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三（9月2日），黄金ETF收涨1.52%，罗素2000指数ETF涨1.18%，日元做多涨0.93%，新兴市场ETF涨0.57%，道指ETF、标普500 ETF、巴克莱美国可转债ETF、美国布伦特油价基金、美国国债20+年ETF至多涨0.54%。\n\n欧元做多收跌0.03%，做多美元指数跌0.14%，美国房地产ETF跌0.54%，大豆基金跌跌0.58%，农产品基金跌0.75%，恐慌指数VIX跌2.86%。","tags":[],"cluster_size":1,"ts":"2026-09-02T20:27:54"},{"id":25514,"title":"标普500指数的11个板块中，原材料板块收涨1.54%，电信板块涨1.16%，信息技术/科技板块涨0.33%，能源板块涨0.32%，房地产板块则跌0.79%。","url":"https://wallstreetcn.com/livenews/3159448","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"标普500指数的11个板块中，原材料板块收涨1.54%，电信板块涨1.16%，信息技术/科技板块涨0.33%，能源板块涨0.32%，房地产板块则跌0.79%。","tags":[],"cluster_size":1,"ts":"2026-09-02T20:04:51"},{"id":25515,"title":"中概指数、CQQQ至多收跌0.1%，蔚来跌超4.9%，阿里跌超0.9%，再鼎医药涨超4.6%","url":"https://wallstreetcn.com/livenews/3159444","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克金龙中国指数收跌0.05%，报6051.33点。\n\nETF中，中国科技指数ETF（CQQQ）收跌0.10%，中概互联网指数ETF（KWEB）收涨0.04%。\n\nXtrackersHarvest中证50（ASHS）收跌0.76%，德银嘉实沪深300指数ETF（ASHR）收跌0.64%，MSCI新兴市场ex中国ETF（EMXC）收涨0.66%。","tags":[],"cluster_size":1,"ts":"2026-09-02T20:00:13"},{"id":25516,"title":"纳指收涨超0.4%，半导体指数涨超0.4%，小盘股指涨超1.1%，银行指数涨约1.6%","url":"https://wallstreetcn.com/livenews/3159442","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"标普500指数收涨35.13点，涨幅0.46%，报7666.60点。\n\n道琼斯工业平均指数收涨295.07点，涨幅0.56%，报53061.95点。\n\n纳斯达克综合指数（纳指）收涨118.054点，涨幅0.45%，报26217.828点。\n\n纳斯达克100指数收涨66.109点涨幅0.23%，报29143.33点。","tags":[],"cluster_size":1,"ts":"2026-09-02T20:00:07"},{"id":25517,"title":"阿里巴巴-W（09988.HK）：9月2日南向资金增持25.28万股 - Sohu","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPemh6dG9yOGsxVkhTbkhLUDBUaGVkeGo3MURHSS13d "}]},{"key":"ai-cn","name":"AI 前沿 (中文)","description":"国内 AI 媒体 (机器之心 / 36氪 / 量子位 / 极客公园 / 智东西 / 新智元) + AI 关键词大盘。","color":"#d97706","tags":["大模型","AI芯片","Agent","商业","融资","公司","监管","研究"],"articles":[{"id":25540,"title":"Wayve 携手 Uber 推出英国首个有人值守 Robotaxi 服务","url":"https://www.ithome.com/0/997/758.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4d7a\"\u003eIT之家 9 月 3 日消息，英国具身智能技术企业 Wayve 当地时间今日宣布携手 Uber（优步）在伦敦推出\u003cstrong\u003e英国首个有人值守 Robotaxi 服务\u003c/strong\u003e。这也是 \u003cstrong\u003eWayve 的首次商业部署\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"231b\"\u003e\u003cstrong\u003e首批 15 辆配备安全员的福特 Mustang Mach-E 将在除机场外的伦敦地域提供服务\u003c/strong\u003e。其车内交互式屏幕支持 64 种语言。乘客无需支付小费。\u003c/p\u003e\u003cp data-vmark=\"d556\"\u003eWayve 首席执行官兼联合创始人 Alex Kendall 表示：\u003c/p\u003e\u003cblockquote\u003e\u003cp data-vmark=\"05a7\"\u003e我们很自豪能在这里 —— 我们的家乡伦敦，也是全球最复杂的驾驶环境之一 —— 首次向公众展示 Wayve AI Driver。自动驾驶技术将与这座城市完善的交通网络相辅相成，随着我们与 Uber 共同启动全球推广，我们非常期待伦敦市民能率先体验这项技术。\u003c/p\u003e\u003c/blockquote\u003e\u003cp data-vmark=\"fcca\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfi","tags":[],"cluster_size":1,"ts":"2026-09-03T01:39:04"},{"id":25541,"title":"AI 让“赛博蟑螂”学会自主避险，识别危险环境准确率达 93%","url":"https://www.ithome.com/0/997/756.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c18e\"\u003e9 月 3 日，据《日经亚洲》报道，研究人员正尝试将人工智能、传感器和通信设备安装在昆虫身上，利用昆虫体型小、感知灵敏和能耗低等特点，执行灾区搜救任务。一套最新系统可分析蟑螂的心跳、神经信号和身体动作，\u003cstrong\u003e识别周围环境并引导其逃离危险区域，最高识别准确率达到 93%\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"cd8f\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/1a429f77-780e-4e55-a1d7-8159f253bd5b.png\" w=\"1440\" h=\"812\" alt=\"一只昆虫搭载着由冈本圭介教授团队研发的昆虫协同电路。\" data-weibo=\"0\" data-vmark=\"5d68\"\u003e\u003c/p\u003e\u003cfigcaption\u003e▲ 一只昆虫搭载着由冈本圭介教授团队研发的昆虫协同电路\u003c/figcaption\u003e\u003cp data-vmark=\"9c0a\"\u003e传统的“赛博昆虫”通常由外部人员直接控制。昆虫身上安装电极、传感器和通信设备后，\u003cstrong\u003e操 ion techniques have been proposed, they often rely on fine-tuning or access to training datasets, which are frequently unavailable due to privacy and proprietary concerns. Moreover, although f","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25039,"title":"Systematic Lightweight Method for Robotics Based on Strain Energy Distribution Optimization","url":"https://arxiv.org/abs/2608.29146","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29146v1 Announce Type: new \nAbstract: Service robots work with people and are highly expected to be lightweight for safety, agility and energy conservation. As a complex mechanical system, a robot consists of a large number of components and has various working configurations and load environments. An effective method for achieving system-level optimal robot design is a crucial requirement, but it poses significant challenges. In this study, we introduce a novel approach to optimize the distribution of strain energy, which can significantly improve the effectiveness of systematic op","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25038,"title":"CGFM-Nav: Cognitive Graph-Field Memory for Semantic-Guided Lifelong Multimodal Embodied Navigation","url":"https://arxiv.org/abs/2608.29114","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29114v1 Announce Type: new \nAbstract: Vision-and-Language Navigation (VLN) requires agents to reason over accumulated observations while continuously exploring unseen regions. However, existing environment representations often struggle to jointly support explicit semantic memory and continuous exploration guidance. To address this challenge, we propose Cognitive Graph-Field Memory (CGFM), a persistent multimodal scene representation that couples explicit relational memory with continuous spatial intuition. CGFM organizes objects, spatial relations, and visual observations into a mu","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25037,"title":"From Multi-Modal Paths to Executable Trajectories: A Trajectory Planning Framework for 4WIS Robots","url":"https://arxiv.org/abs/2608.29108","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29108v1 Announce Type: new \nAbstract: Four-wheel independent steering (4WIS) mobile robots support multiple motion modes, offering high maneuverability in narrow and complex environments. However, existing planning methods often fail to fully exploit these capabilities, leading to suboptimal trajectory quality. To address this limitation, this paper proposes a multi-modal global trajectory planning framework that couples mode-augmented front-end search with mode-consistent segment-wise trajectory optimization. In the front-end stage, Hybrid A* is extended to a four-dimensional state","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25036,"title":"Agri-Sim: Agricultural Simulation Platform for Embodied Intelligence Evaluation in Greenhouse Robotics","url":"https://arxiv.org/abs/2608.29100","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29100v1 Announce Type: new \nAbstract: Agricultural-robot development requires simulation environments that can jointly support realistic scene construction, virtual sensing, autonomous navigation, motion planning, and manipulation-task execution. This paper presents Agri-Sim, a Unity and ROS2-based simulation platform for the closed-loop development and functional evaluation of agricultural robots. The platform contains a configurable tomato-greenhouse environment, a mobile dual-arm harvesting robot, virtual RGB-D, LiDAR, IMU, and joint sensors, and a bidirectional communication int","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25035,"title":"GHOST in the Robots: Real-Time Exocentric Dual-Robot VR Teleoperation from Onboard Cameras","url":"https://arxiv.org/abs/2608.29080","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29080v1 Announce Type: new \nAbstract: Teleoperating multiple robots simultaneously enables additional views and coordinated control. Yet, it poses fundamental challenges: the system must present sensor data cohesively and allow operators to manage multiple robot bases, arms, and cameras while maintaining low latency. Current multi-robot teleoperation systems require multiple operators, rely on autonomy, or restrict operators to high-level commands. We present GHOST: an open-source VR teleoperation system that enables single operator control of two mobile manipulators via direct lowl","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25034,"title":"DREAM: Deployment-Time Demonstration Generation via Real-to-Sim for Scalable Policy Adaptation","url":"https://arxiv.org/abs/2608.29078","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29078v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have made strong progress in language-conditioned robot manipulation, but improving their performance in a new workspace still often requires action-labeled data from that environment. Collecting such data by human teleoperation is costly, especially when each workspace, object arrangement, or task may require new demonstrations. We present DREAM, a framework that generates fine-tuning data for a pretrained VLA from a captured workspace and a language instruction, without requiring a task-specific human demons","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25033,"title":"Teaching Robot Policies to Humans Using Erroneous Examples","url":"https://arxiv.org/abs/2608.29023","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29023v1 Announce Type: new \nAbstract: Human-robot collaboration describes the process of humans and autonomous agents working together to accomplish common goals. This process is facilitated best when robot policies, or behaviors in different situations, are made transparent to humans. Demonstration-based explanations have been a focus of human-robot collaboration research, and the field has frequently drawn upon literature from education to improve how humans are taught robot policies. However, no single teaching method has been proven effective across domains, difficulties, learne","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25032,"title":"Hydra: A Navigation World Action Model with Discrete Latent Planning and Continuous Flow-Matching Execution","url":"https://arxiv.org/abs/2608.28995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28995v1 Announce Type: new \nAbstract: World models let robots imagine possible futures, but exploiting this capability for real-time control is bottlenecked by a representation misalignment: the generative model and the planner operate on decoupled manifolds, so the planner has no shared structure to search over and must instead decode every candidate back into high-dimensional pixel space to evaluate it. This decoding step is a major obstacle to real-time control on physical hardware. In this paper, we present Hydra, a discrete World Action Model that closes this gap by moving the","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25031,"title":"Brain-Language-Action (BLA) Models: Language-Conditioned EEG for Robotics Control","url":"https://arxiv.org/abs/2608.28967","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28967v1 Announce Type: new \nAbstract: Electroencephalography (EEG)-based robotic control is commonly formulated as a direct classification problem, in which electrical neural signals are mapped to a fixed set of discrete actions. However, the limited separability and high noise of EEG signals make it difficult to scale this approach to fine-grained robotic control spaces. We introduce Brain-Language-Action (BLA) models, a framework in which language conditions the interpretation of neural representations for robotic action generation. In a BLA, a small set of reliably distinguishabl","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25030,"title":"Generation of High-Level Concepts in 3D Scene Graphs via Autoregressive Diffusion","url":"https://arxiv.org/abs/2608.28733","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28733v1 Announce Type: new \nAbstract: Indoor 3D Scene Graphs (3DSGs) represent environments as multi-layer hierarchies that connect observed geometric primitives (e.g., planes) to higher-level metric-semantic concepts (e.g., rooms, floors, buildings), enabling incremental spatial reasoning for robotic perception and SLAM. However, classical high-level concept generation approaches rely on hand-crafted rules for specific concept classes, while learning-based methods require separate models for graph structure and spatial node features (e.g., centroids), which limits scalability to no","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25029,"title":"RoboPhys-3D: A Comprehensive Embodied World Model Evaluation via 3D Reconstruction","url":"https://arxiv.org/abs/2608.28718","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28718v1 Announce Type: new \nAbstract: Video world models increasingly serve as data engines, action planners, and simulators for embodied AI, but conventional embodied world model (EWM) benchmarks lack a unified 3D-grounded protocol for establishing whether generated rollouts preserve the underlying 3D scene state or translate into executable actions. We introduce RoboPhys-3D, a 3D-grounded EWM benchmark built on RoboTwin 2.0, covering 50 manipulation tasks across four regimes, with 5,000 episodes and 25,000 multi-view ground-truth videos. A defining feature of RoboPhys-3D is that g","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25028,"title":"RoboGesture: Real-Time Semantic-aligned Co-Speech Gestures Generation for Humanoid Interaction","url":"https://arxiv.org/abs/2608.28693","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28693v1 Announce Type: new \nAbstract: Enabling humanoid robots to respond to human speech with synchronized and semantically meaningful gestures is fundamental to natural human-robot interaction. However, this task faces three critical barriers: the scarcity of semantically rich datasets, the \"modality eclipse\" where models ignore audio cues in favor of kinematic inertia, and the sim-to-real gap regarding physical safety. We propose RoboGesture, a robot-centric framework that co-designs data, modeling, and control to power a complete interactive human-humanoid system in which the ro","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25027,"title":"Cognitively-Grounded On-Device Runtime Learning for Ground Robots in Unknown Physical Environments","url":"https://arxiv.org/abs/2608.28677","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28677v1 Announce Type: new \nAbstract: This paper presents \\ul{CogRun}, a framework that enables safety-critical ground robots to perform cognitively-grounded runtime learning entirely on edge-AI devices in unknown physical environments, without prior maps or perceptual knowledge. CogRun consists of three components: a Learning-Agent, a Rational-Agent, and a Coordinator. The Learning-Agent is novel in cognitive-neural learning architecture, which featurs dedicated replay buffers, cognition-driven experience sampling, and a safety-aware action blending of actor-critic reinforcement le","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25026,"title":"The Potential of Haptic Foundation Models","url":"https://arxiv.org/abs/2608.28664","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28664v1 Announce Type: new \nAbstract: Despite the success of foundation models in language and vision, their expansion into embodied AI is bottlenecked by a lack of generalized // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
