"2026-10-27T01:21:39"},{"id":37276,"title":"中国央行逆回购今日净投放10,140亿元人民币","url":"https://wallstreetcn.com/livenews/3186549","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中国央行今日开展4120亿元人民币7天期逆回购操作，利率1.40%（上次为1.40%）。今日进行10000亿元人民币隔夜逆回购操作。今日3980亿元逆回购到期。","tags":[],"cluster_size":2,"ts":"2026-10-27T01:21:00"},{"id":37277,"title":"美股期货小幅走高，标普500指数期货上涨0.2%，纳斯达克100指数期货上涨0.4%。","url":"https://wallstreetcn.com/livenews/3186536","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美股期货小幅走高，标普500指数期货上涨0.2%，纳斯达克100指数期货上涨0.4%。","tags":[],"cluster_size":1,"ts":"2026-10-27T00:39:54"},{"id":37278,"title":"中国生物制药：TQ-A3334及TQA3605获CDE纳入突破性治疗药物程序","url":"https://wallstreetcn.com/livenews/3186535","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"中国生物制药在港交所公告，附属公司正大天晴药业集团股份有限公司自主研发的国家1类创新药TQ-A3334“Toll样受体7(TLR7)激动剂”及TQA3605“核心蛋白变构调节剂”均已获中国国家药品监督管理局药品审评中心(CDE)纳入突破性治疗药物程序。两款创新药分别针对慢性乙型肝炎（“慢乙肝”）治疗中尚未满足的两大需求，功能性治愈与低病毒血症。","tags":[],"cluster_size":1,"ts":"2026-10-27T00:28:43"},{"id":37279,"title":"专家称中国央行鼓励构建“LPR+DR001”贷款利率双定价基准","url":"https://wallstreetcn.com/livenews/3186524","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"中国邮政储蓄银行研究员娄飞鹏在《证券时报》刊文称，就后续发展而言，DR001实际上已成为央行货币政策调控的目标利率，人民银行将研究择机把公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将相应成为主要政策利率以实现期限匹配，进一步提高利率调控的精准性。人民银行将择机发布多元化贷款定价基准改革相关的政策指引，也将持续改革完善LPR报价机制提高报价质量。这意味着，人民银行鼓励构建“LPR+DR001”双定价基准，打通短端货币市场到信贷市场的利率传导链条。未来双轨并行大概率将长期存在，形成中长期贷款定价以LPR为基准，匹配其稳定性强、调整频率低的特点，短期流动资金贷款、票据等对资金成本敏感的贷款定价以DR001为基准，最终推动贷款利率完全市场化，实现货币政策精准传导。","tags":[],"cluster_size":1,"ts":"2026-10-26T23:40:51"},{"id":37280,"title":"基站变\"雷达\"、网络长\"大脑\" 中国移动6G亮相世界互联网大会 - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBoY3gwS3NpLVM4THNuaEJiQ3FmSFB1cGRTNEk1X3NWaDF1SkdRZi1vdGVQYTc2WElqMERrcWRCWTdWVGVONFFGcXZzZWxXcWp1Q0Y0?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBoY3gwS3NpLVM4THNuaEJiQ3FmSFB1cGRTNEk1X3NWaDF1SkdRZi1vdGVQYTc2WElqMERrcWRCWTdWVGVONFFGcXZzZWxXcWp1Q0Y0?oc=5\" target=\"_blank\"\u003e基站变\"雷达\"、网络长\"大脑\" 中国移动6G亮相世界互联网大会\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-26T23:35:00"},{"id":37281,"title":"存储上市企业多措并举稳定供应链","url":"https://wallstreetcn.com/livenews/3186522","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着人工智能算力基础设施建设持续推进，企业级存储等产品需求强烈，部分存储企业业务规模快速增长。近期披露的三季报及相关公告显示，行业相关上市公司在优化产品结构、拓展客户的同时，正通过增加原材料储备、签署长期采购协议等方式，加强供应链协同与交付保障。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-10-26T23:32:57"},{"id":37282,"title":"10月26日港股通互联网ETF鹏华基金份额减少100万份，重仓股阿里巴巴-W、腾讯控股、百度集团 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBzTWs3bUc5bG9Pd2pCR2RqSXlSTHl6WV9EZmdYUXg5ODBDSEpFdFQ3SnNpSmtYeEs3UERmSjhmeEQ5ZGYzMkxfd29EU0xael9RRDhXcXNqNlpmUVlaejRCdDJB?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBzTWs3bUc5bG9Pd2pCR2RqSXlSTHl6WV9EZmdYUXg5ODBDSEpFdFQ3SnNpSmtYeEs3UERmSjhmeEQ5ZGYzMkxfd29EU0xael9RRDhXcXNqNlpmUVlaejRCdDJB?oc=5\" target=\"_blank\"\u003e10月26日港股通互联网ETF鹏华基金份额减少100万份，重仓股阿里巴巴-W、腾讯控股、百度集团\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-26T23:32:53"},{"id":37283,"title":"大额并购助力A股公司加速产业整合","url":"https://wallstreetcn.com/livenews/3186521","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"据上交所官网消息，上交所并购重组审核委员会将于10月29日审议东方证券股份有限公司发行A股股份及支付现金的方式购买上海证券有限责任公司100%股权相关事项。本次交易规模约251亿元，是年内产业并购整合的标志性项目之一。专家表示，A股市场并购重组正加速转向以产业协同为主的阶段，资本市场优化存量资源配置、服务产业升级的功能持续凸显。未来，产业整合仍是主线，传统行业同业整合、新兴赛道技术并购并行，优质龙头将持续受益，交易也会更加注重整合实效。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-10-26T23:31:54"},{"id":37284,"title":"三季报透视创新药出海：海外授权收入兑现，产业链景气共振上行","url":"https://wallstreetcn.com/livenews/3186520","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"据Wind数据，截至10月26日18∶00，A股医药生物板块已有129家公司披露三季报，15家公司发布前三季度业绩预告，超四成企业业绩同比实现增长。梳理三季度成绩单可见，创新药出海正从前期签约阶段迈入业绩兑现期，多家药企此前落地的海外权益授权迎来款项集中入账，成为拉动利润的重要增量。海内外创新研发需求持续旺盛，并沿着产业链向上传导，带动CDMO龙头订单饱满、业绩提速。在业绩兑现的同时，国内药企出海合作模式也持续迭代升级，创新资产的全球价值释放进入新阶段。（中国证券报）","tags":[],"cluster_size":1,"ts":"2026-10-26T23:31:12"},{"id":37285,"title":"燃油成本推高亏损，但JetBlue CEO称利润率正在改善","url":"https://wallstreetcn.com/livenews/3186517","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"航空公司Jetblue第三季度亏损较去年同期扩大，但这家总部位于美国纽约的公司表示，强劲的出行需求正在帮助抵消燃油价格上涨的影响；此前其股价周一跌至新低，公司正努力安抚投资者情绪。\n\n至9月30日的三个月净亏损为2.57亿美元，去年同期亏损1.43亿美元。该航司燃油支出增长61%，至8.68亿美元。\n\n该公司首席执行官在财报声明中表示：“需求具有韧性、收益率强劲，推动收入远超我们最初的预期，使我们能够比最初预期回收更多燃油成本上涨带来的压力。这一势头已延续至第四季度；尽管我们大幅增加运力，劳德代尔堡基地仍继续表现优异。”\n\n该公司CFO在声明中表示：“重要的是，我们认为我们拥有充足的流动性和融资选择，能够为至少在2028年实现每股收益1美元和正向自由现金流搭建有力桥梁。在追求持续盈利和正向自由现金流的过程中，我们仍将专注于严格的成本执行和资本管理。”\n\n该公司股价周一美股盘后交易中上涨约11%。","tags":[],"cluster_size":1,"ts":"2026-10-26T23:24:45"},{"id":37286,"title":"华尔街见闻早餐 | 2026年10月27日","url":"https://wallstreetcn.com/livenews/3186515","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Anthropic IPO重燃AI情绪，美股指反弹，芯片指数涨近3%，美债、油价齐回落。\n\n沙特等国官员赴德黑兰推动美伊重启谈判。\n\nAnthropic正式提交IPO申请，拟以代码ANT在纳斯达克挂牌。\n\n震惊市场！巴西总统卢拉在二轮选举中意外逆袭，巴西股市创近三十年最惨日跌，雷亚尔一度重挫逾10%。\n\n中国央行设立债市非银大额赎回互换便利。\n\n乌克兰战时状态再延90天至明年1月底，俄方称恢复三方谈判不意味着限制军事行动。\n\n马斯克称债务市场已对缺少独立收入的AI云厂商关闭融资渠道，200多家neocloud面临死亡与整合。\n\n微软向约6万名员工提供自愿离职补偿，覆盖Xbox、Windows、Copilot等部门，数据中心与销售岗位不在其列。\n\nMeta启动约350亿美元普通股与优先股公开发行，并计划推出最高600亿美元场内发行，融资规模上限950亿美元。\n\nOpenAI推出电脑操作强者GPT-6.1 Terra，Token效率为Claude Opus 5.5三倍、价格仅四分之一。\n\n报道：SK海力士拟推出50万亿-60万亿韩元股东回报，规模创历史纪录。\n\nSpaceX与阿波罗全球管理签署约400亿美元GPU设备融资租赁协议，采购英伟达下一代Vera Rubin芯片，租期约五年。","tags":[],"cluster_size":2,"ts":"2026-10-26T23:15:56"},{"id":37287,"title":"锂矿企业三季报业绩兑现，需求多点开花打开增量空间","url":"https://wallstreetcn.com/livenews/3186510","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至10月26日，已有多家锂矿上市公司披露三季报。今年前三季度，受益于下游需求持续回暖，锂盐市场价格同比显著上涨，带动锂企业绩大增。赣锋锂业、天齐锂业两大龙头归母净利润同比增速分别为19540.50%、3013.86%。与此同时，记者注意到，社保基金新进部分锂矿公司前十大流通股股东名单。有企业相关负责人表示，锂需求正从电动车市场单一驱动转向“电动车+储能”市场双轮驱动；同时，机器人、低空经济等新兴应用逐步打开增量空间。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-26T22:59:31"},{"id":37288,"title":"铿腾电子分析师电话会议：核心EDA营收同比增长20%","url":"https://wallstreetcn.com/livenews/3186503","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、整体业绩表现。\n\n1、铿腾电子/楷登电子第三季度业绩表现出色，所有关键指标均远高于业绩指导。\n\n2、积压订单达到创纪录的82亿美元。\n\n3、鉴于强劲的业务势头、技术领先地位及人工智能（AI）增长机遇，公司将全年营收增长预期上调至21%，每股收益（EPS）预期上调0.30美元至8.40美元。\n\n4、第三季度总营收为16.33亿美元。GAAP营业利润率为26.2%，Non-GAAP营业利润率为44.1%。GAAP每股收益为1.05 美元，Non-GAAP每股收益为2.11美元。\n\n5、现金余额为14.52亿美元，未偿还债务本金为26.50亿美元，经营活动现金流为4.24亿美元。\n\n6、经常性收入同比增长18%。","tags":[],"cluster_size":1,"ts":"2026-10-26T22:43:24"},{"id":37289,"title":"中证报：增量资金入市力度加大，A股具备较好投资吸引力","url":"https://wallstreetcn.com/livenews/3186501","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Wind数据显示，截至10月23日，10月以来股票型ETF资金累计净流入超2800亿元，上市公司累计回购超170亿元。随着市场的连续震荡，A股估值已到相对低位。分析人士认为，A股市场整体估值已回落至历史均值以下，横向与纵向比较均已具备较好投资吸引力。当前A股不宜过度悲观，短期或以震荡筑底和结构性机会为主。","tags":[],"cluster_size":1,"ts":"2026-10-26T22:33:20"},{"id":37290,"title":"前三季度万亿元资金涌入股权投资市场","url":"https://wallstreetcn.com/livenews/3186497","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年前三季度，国内一级市场多项核心指标迎来修复，行业复苏的背后，结构性分化特征十分突出。执中ZERONE数据显示：2026年前三季度机构LP认缴出资规模达1.02万亿元，出资笔数为10327笔，已超过2025年全年水平，同比增长43%；投资端，2026年前三季度累计获投项目10810家，超过2025年全年水平1.6%；融资事件为11197起，相当于2025年全年的95.1%。\n\n市场热度抬升的另一面，是行业高度分化的格局。资金持续向热门赛道倾斜：人工智能以2035亿元融资额遥遥领先，机器人和软件与信息服务分别以875亿元、874亿元紧随其后。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-26T22:19:47"},{"id":37291,"title":"周一（10月26日）纽约尾盘，标普500股指期货最终涨0.7%，道指期货涨0.23%，纳斯达克100股指期货涨1.18%。\n\n罗素2000股指期货涨0.3%。","url":"https://wallstreetcn.com/livenews/3186487","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"周一（10月26日）纽约尾盘，标普500股指期货最终涨0.7%，道指期货涨0.23%，纳斯达克100股指期货涨1.18%。\n\n罗素2000股指期货涨0.3%。","tags":[],"cluster_size":1,"ts":"2026-10-26T21:11:51"},{"id":37292,"title":"Cohere称阿里巴巴AI模型测试中曾试图向北京服务器传送文件 - 디지털투데이","url":"https://news.google.com/rss/articles/CBMizAFBVV95cUxQdGFJaEFyMmJUbGZ0SG5jRk9yQXdneDlaeFZvLXIwT0lUNnNreWJjYkJkMWh1Ul9 ata-vmark=\"ff27\"\u003e邓煜表示，对 AI 公司来讲，\u003cstrong\u003e你不能在只有你蒸馏全人类的网络文献、全人类的知识的时候，就大大方方地去蒸","tags":[],"cluster_size":1,"ts":"2026-10-27T01:11:15"},{"id":37327,"title":"科大讯飞，让大模型“下凡” - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNTHVhNHpaLXMwbkRUNFFGQ09XR1NMUmtLdExpNzdOaWpYdjEtVUlVUHpvQXhBVkZvTmd6SFFKTkxzNkxiTHdtdkwtUGp2ZjdvN0dLSVktY2NrVkdEOVJtYnRfUlk1RjIzUDBNTEpKM0hZaHBqX1JBMUlPMzdobTkwTFhnbjVlV2NjTWJkaA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxNTHVhNHpaLXMwbkRUNFFGQ09XR1NMUmtLdExpNzdOaWpYdjEtVUlVUHpvQXhBVkZvTmd6SFFKTkxzNkxiTHdtdkwtUGp2ZjdvN0dLSVktY2NrVkdEOVJtYnRfUlk1RjIzUDBNTEpKM0hZaHBqX1JBMUlPMzdobTkwTFhnbjVlV2NjTWJkaA?oc=5\" target=\"_blank\"\u003e科大讯飞，让大模型“下凡”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-27T01:10:32"},{"id":37328,"title":"Anthropic招股书里最值得看的14个细节 - 华尔街见闻","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBCakVWWU80OWhGZXlzQWotVHJzTHRfcGc1XzJYS0xxQzZlSlcxT2JjcEJjZ3prVE9UeW5vOVpqaU1rVGF5MW9Yclg0c2FkY3d3WEZj?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBCakVWWU80OWhGZXlzQWotVHJzTHRfcGc1XzJYS0xxQzZlSlcxT2JjcEJjZ3prVE9UeW5vOVpqaU1rVGF5MW9Yclg0c2FkY3d3WEZj?oc=5\" target=\"_blank\"\u003eAnthropic招股书里最值得看的14个细节\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e华尔街见闻\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-27T01:07:33"},{"id":37329,"title":"苹果 Siri AI 即日起支持法语、日语、韩语等语言，繁体中文得等到年底前","url":"https://www.ithome.com/1/018/229.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"1484\"\u003eIT之家 10 月 27 日消息，苹果今天（27 日）通过新闻稿宣布，今天发布的 27.2 版本软件更新，进一步扩大新一代 Siri AI 的使用范围，新增支持\u003cstrong\u003e法语、日语、韩语、葡萄牙语和西班牙语\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"de8f\"\u003eSiri AI 是全面升级的 Siri，不仅功能更强大，对话也更加自然，还能 时应假定模型遭到入侵。\u003c/p\u003e\u003cp data-vmark=\"fc27\"\u003e","tags":[],"cluster_size":1,"ts":"2026-10-27T00:23:35"},{"id":37353,"title":"GPT-6.1 Terra 深夜来袭：比旗舰快 3 倍，事实错误率暴降近 70%！价格仅1/10 - 新浪财经","url":"https://news.google.com/rss/articles/CBMigwFBVV95cUxPeW1PeGFXb3A0WUhpc2J1bzBYRk9mclQtWkt0QTFYQ0NpdFFlVmJPM20tTGlXM0J0NGozZTRpYWRMQzlPTV95ZlpGNllvX1l3QjFVMXNWb2dtQTQ2NUYtenk1Z1prdVh6cV9EVk5JR0NBaU5Fa1MzX1FPUE9aamp1UVBzOA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMigwFBVV95cUxPeW1PeGFXb3A0WUhpc2J1bzBYRk9mclQtWkt0QTFYQ0NpdFFlVmJPM20tTGlXM0J0NGozZTRpYWRMQzlPTV95ZlpGNllvX1l3QjFVMXNWb2dtQTQ2NUYtenk1Z1prdVh6cV9EVk5JR0NBaU5Fa1MzX1FPUE9aamp1UVBzOA?oc=5\" target=\"_blank\"\u003eGPT-6.1 Terra 深夜来袭：比旗舰快 3 倍，事实错误率暴降近 70%！价格仅1/10\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-27T00:22:51"},{"id":37352,"title":"美国大模型第一股Anthropic交表：两年半收入规模扩大400倍，与亚马逊、谷歌等云厂商“亦敌亦友” - 手机新浪网","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTE9UVkFlSGtHRzI5MS1TN00tdWtiYlg1LVEyOW0zX0NfZFdydnhjYnZGVFhqMWNHNWc3UkhwZ2xEak1lRlJVUlhXMGtqQjhlbHlXSVJETThMR1pNWG9hZ1J5TGlibndmMWdoTXA2V3VvUkt4d09qalpNWGhkWWlHVXc?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMif0FVX3lxTE9UVkFlSGtHRzI5MS1TN00tdWtiYlg1LVEyOW0zX0NfZFdydnhjYnZGVFhqMWNHNWc3UkhwZ2xEak1lRlJVUlhXMGtqQjhlbHlXSVJETThMR1pNWG9hZ1J5TGlibndmMWdoTXA2V3VvUkt4d09qalpNWGhkWWlHVXc?oc=5\" target=\"_blank\"\u003e美国大模型第一股Anthropic交表：两年半收入规模扩大400倍，与亚马逊、谷歌等云厂商“亦敌亦友”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机新浪网\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-10-27T00:22:51"}]},{"key":"ai-frontier","name":"AI Frontier (英文)","description":"Latest AI / LLM / open-source AI developments — English-language sources.","color":"#db2777","tags":["Models","Hardware","Agents","Funding","Company","Poli bot manipulation policies commonly predict continuous action chunks directly from observations, without explicitly modeling reusable structure in the action space. However, manipulation demonstrations often contain recurring short-horizon motion patterns that are shared across tasks. We introduce \\textsc{RoboCode}, which learns these patterns through a shared soft-gated primitive action interface. Rather than assigning each action chunk to a single discrete code, \\textsc{RoboCode} represents it as a soft composition of multiple learned","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37074,"title":"Do VLAs Know They Will Fail? Interpretable Success and Failure Patterns in Physical AI Systems","url":"https://arxiv.org/abs/2610.32208","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32208v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have emerged as powerful general-purpose robot policies, but their successes and failures remain difficult to diagnose and understand. In this work, we show that sparse autoencoder (SAE) representations of OpenVLA activations contain outcome-predictive information and can be used to predict task failure before the robot reaches an unrecoverable state. Moreover, to provide insights into what common behaviors may contribute to these outcomes, we identify individual SAE features whose strong activations are assoc","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37073,"title":"RAISE-Vision: An Automated Contact Angle Measurement Platform for Contact Lens Wettability Characterization","url":"https://arxiv.org/abs/2610.32188","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32188v1 Announce Type: new \nAbstract: Contact angle (CA) is a common parameter measured in the development of novel contact lens materials and surface coating technologies. Existing literature on in vitro CA of contact lenses via the sessile drop method is hindered in repeatability, reliability, and comparability due to inter-laboratory and inter-operator protocol variation. In this work, the Robotic Autonomous Imaging Surface Evaluator for vision applications (RAISE-Vision) is introduced as an automated platform for CA measurement on curved hydrogel surfaces, with specific applicat","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37072,"title":"Geometry-Aware Reinforcement Learning for Close-Fitting Wearable Insertion","url":"https://arxiv.org/abs/2610.32143","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32143v1 Announce Type: new \nAbstract: Robot-assisted dressing is particularly challenging due to narrow openings and articulated body parts. Even small errors in the relative pose between the body part and garment opening can cause snagging, missed insertion, or incomplete dressing. To address these challenges, we formulate dressing as a geometry-aware insertion problem that represents task-relevant spatial relationships between the body part and object opening, rather than relying on the full deformable-object state. Based on this formulation, we propose a Reinforcement Learning (R","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37071,"title":"TravSUITE: Traversability via Self-Supervised, Uncertainty-Aware IRL and Terrain Estimation","url":"https://arxiv.org/abs/2610.32130","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32130v1 Announce Type: new \nAbstract: Traversability analysis in off-road settings remains a fundamental challenge for mobile robots. Key difficulties include constructing an accurate and expressive local map from multimodal sensor data, and using the map to design traversability rules that yield desirable navigation behavior. Importantly, this system must be resilient to the limited sensing regime brought about by complex environments and high speeds. In this paper, we present TravSUITE, a traversability system suitable for high-speed navigation in off-road environments. TravSUITE","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37070,"title":"Coupling Execution Horizon and Sampling Depth in Flow-Matching VLA Policies","url":"https://arxiv.org/abs/2610.32102","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32102v1 Announce Type: new \nAbstract: Flow-matching Vision-Language-Action (VLA) models generate expressive continuous trajectories for robotic manipulation, yet balancing real-time responsiveness with execution stability remains a persistent challenge. Standard deployment workflows typically treat numerical solver depth and execution horizon as decoupled choices. The horizon amortizes inference latency, while solver depth is kept high to preserve integration fidelity. In this paper, we reveal a fundamental compute-execution coupling in flow-matching VLAs governed by a systematic si","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37069,"title":"TTT in VLA Models: Exploring Training with Human Demonstrations","url":"https://arxiv.org/abs/2610.32094","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32094v1 Announce Type: new \nAbstract: Long-horizon robot tasks require retaining and using past information. We integrate Test-Time Training (TTT), which stores context in fast weights, into InternVLA-A1 and Pi0.5 to study action generation conditioned on human demonstrations through training on paired demonstrations and robot trajectories. We implement memory transfer between the two phases and truncated backpropagation, and examine training objectives, gradient coverage, and contrastive regularization across video, short-video, and single-frame cue tasks. In our experiments, addin","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37068,"title":"DiscoDemo: Discovering Efficient and Diverse Robot Demonstrations for Imitation Learning","url":"https://arxiv.org/abs/2610.32093","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.32093v1 Announce Type: new \nAbstract: Behavior cloning for robotic manipulation is highly sensitive to the coverage of its training data, yet collecting diverse successful demonstrations remains costly. We study reinforcement learning (RL) not as a deployable controller, but as a data generator for downstream visuomotor imitation learning. Our key premise is that multiple successful solution modes cover a broader range of successful trajectories than repeatedly collecting a single narrow solution. We introduce DiscoDemo, which trains a privileged latent-conditioned RL generator with","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37067,"title":"Robotic Budding: From Homogeneous Cells to Diverse Morphologies in Physical Self-Reproduction","url":"https://arxiv.org/abs/2610.31929","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31929v1 Announce Type: new \nAbstract: Physical self-reproduction in modular robots remains difficult because a robot must not only move, but also collect, align, dock, and separate modules reliably in hardware. Taking inspiration from how genetically identical cells form the varied tissues of an organism, we introduce a single standardized robotic module that combines a magnetic docking interface with two actuated joints and folds from a flat, two-dimensional configuration into three-dimensional structures. Modules of this single design can be assembled into two morphologies: a thre","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37066,"title":"Distributed Swarm Morphogenesis with Neural Cellular Automata","url":"https://arxiv.org/abs/2610.31900","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31900v1 Announce Type: new \nAbstract: Swarm morphogenesis requires robots to assemble desired shapes through local interactions. We present a modular framework integrating neural cellular automata (NCA) with existing site selection and collision-aware control. Within this framework, we introduce a decentralized attachment-site discovery mechanism. Robots already in the formation update and share local NCA states to identify new attachment sites, enabling progressive growth without a predefined list of sites during deployment. To bridge the mismatch between conventional NCA growth an","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37065,"title":"Move, don't think: sample-efficient collision avoidance with lossy proximity sensors","url":"https://arxiv.org/abs/2610.31891","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31891v1 Announce Type: new \nAbstract: Data-driven robots must learn to avoid collisions with as few demonstrations as possible to avoid collecting large datasets of destructive collision examples. We explore whole-body proximity sensors as inductive biases for learning reflexive collision-dodging behavior and find that lossy sensors with low resolution were stronger biases than high-resolution coverage. We also found that, perhaps unintuitively, anticipating when and where contact happens on the body of a robot reduced its learning sample efficiency. We investigated eight candidate","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37064,"title":"Emergent Cooperative Thermoregulation in Lunar Swarm Robotics","url":"https://arxiv.org/abs/2610.31868","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31868v1 Announce Type: new \nAbstract: Swarms of small robots are an attractive way to survey lunar caves and lava tubes. Missions such as NASA's CADRE will fly cooperating rovers for distributed mapping, but only in daylight. The 354 h lunar night drops the surface towards 95 K, and the radioisotope heaters that let single rovers survive it cannot be supplied at swarm scale. In this study we investigate whether a swarm can instead use its own members as thermal shielding. We train one policy, shared by all twenty robots, by reinforcement learning with an evolution-strategies estimat","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37063,"title":"Full-Weight VLA Fine-Tuning Without an fp32 Master Copy Silently Erases Most Updates","url":"https://arxiv.org/abs/2610.31859","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31859v1 Announce Type: new \nAbstract: When a vision-language-action (VLA) model is fine-tuned with its trainable weights in bfloat16 (bf16) and no fp32 master copy, AdamW writes each update straight into bf16, silently rounding away any update smaller than 1/512 of a weight. In 9 of 12 open VLA codebases a default or documented recipe trains this way, 4 on full weight matrices, including LeRobot's SmolVLA default and its $\\pi_0$/$\\pi_{0.5}$ guides. In our LIBERO runs without the copy, a probe every 100 steps finds at least 79% of updates to bf16 weights erased. On the Hugging Face H","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37062,"title":"Multimodal MPC via Bayesian Set Optimization for Dynamic Manipulation of Deformable Linear Objects","url":"https://arxiv.org/abs/2610.31852","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31852v1 Announce Type: new \nAbstract: Dynamic manipulation of deformable linear objects (DLOs) remains challenging due to underactuated, high-dimensional dynamics, delayed deformation responses, and the presence of multiple feasible motions under obstacle constraints. This paper presents BM2PC, a Bayesian Multimodal MPC framework for agile manipulation of DLOs. Building on the control-as-inference posterior, BM2PC formulates multimodal planning as a set optimization problem that balances control quality and behavioral diversity. An efficient incremental update maintains multiple pro","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37061,"title":"EgoForesight: Effectively Scaling Policy Learning with Noisy Egocentric Actions","url":"https://arxiv.org/abs/2610.31845","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31845v1 Announce Type: new \nAbstract: Scaling policy learning requires broad experience and reliable supervision. Robot demonstrations provide high-quality trajectory supervision but are costly to collect. Egocentric videos broaden task and environment coverage, yet motion reconstruction and retargeting introduce noisy action labels. To address this challenge, we introduce EgoForesight, a vision-language-action framework that learns jointly from both sources by reducing the influence of unreliable action labels and exploiting demonstrated outcomes as complementary supervision. A joi","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37060,"title":"FORCA: A Force-Aware Coding Agent for Contact-Rich Robot Manipulation","url":"https://arxiv.org/abs/2610.31841","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31841v1 Announce Type: new \nAbstract: Coding agents can translate language instructions into robot programs. For contact-rich manipulation, a key challenge is to generate and refine control logic that responds to physical interaction. We present FORCA, a coding agent that takes visual observations and wrist force/torque (F/T) measurements as input to write Python programs for contact probing and force-responsive motion. Between executions, the agent inspects force records alongside visual outcomes to diagnose failures and revise both motion and force-feedback control logic. FORCA re","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37059,"title":"WorldMirror: Agentic Real-to-Sim Generation of Interactive Worlds from In-the-Wild Robot Demonstrations","url":"https://arxiv.org/abs/2610.31834","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31834v1 Announce Type: new \nAbstract: Existing approaches for robot learning in simulation often require substantial manual effort to construct scenes and specify tasks, limiting training scalability and data diversity. Meanwhile, in-the-wild robot demonstrations naturally provide diverse and realistic observations of real-world interactions. Leveraging these demonstrations for simulation requires both high-fidelity visual reconstruction and physically consistent interactions. General-purpose agents offer flexible adaptation to diverse scenarios and strong reasoning about 3D spatial","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37058,"title":"SEVI: Safe Evidential Real-World Reinforcement Learning","url":"https://arxiv.org/abs/2610.31829","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31829v1 Announce Type: new \nAbstract: Real-world reinforcement learning has enabled contact-rich manipulation tasks to be trained directly on physical robots, but unsafe interactions during online learning remain a key barrier to practical deployment. We propose Safe Evidential Real-World Reinforcement Learning (SEVI), a framework for reliability-aware safety intervention during real-world policy learning. SEVI introduces an Evidential Safety Critic that estimates both future constraint-violation risk and epistemic uncertainty in a single forward pass. During online learning, SEVI e","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37057,"title":"PrefO2O: Zero-Shot Preference-Based Reinforcement Learning via Offline-to-Online Latent Preference Transfer","url":"https://arxiv.org/abs/2610.31812","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31812v1 Announce Type: new \nAbstract: Preference-based reinforcement learning (PbRL) has emerged as a promising paradigm for learning robot behaviors aligned with human intent. However, its scalability is fundamentally limited by the need to collect expensive human preference labels for every new task. In this work, we present PrefO2O, an offline-to-online latent preference transfer framework that enables zero-shot PbRL on unseen target tasks without requiring any human feedback. The core idea is to learn a task-invariant latent preference space from a small amount of offline prefer","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37056,"title":"KiRoSe: Using Kinematic Data for Efficient Segmentation of Robot Demonstrations","url":"https://arxiv.org/abs/2610.31801","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31801v1 Announce Type: new \nAbstract: Segmenting robot demonstration data into disjoint temporal and semantic subsegments is valuable for learning, cleaning, retrieval, and analysis. Segmentation is often performed manually in a tedious and error prone process. Multimodal Large Language Models (MLLMs) have the potential for automating this process, but directly ingesting raw multi camera video streams into MLLMs can be costly and can quickly exhaust context windows. In this paper, we introduce KiRoSe (Kinematics for Robot Segmentation), a novel framework that focuses on the companio","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37055,"title":"FLORA: An Open Model Suite for Scaling Robotics Data Engines","url":"https://arxiv.org/abs/2610.31779","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.31779v1 Announce Type: new \nAbstract: The life-cycle of robotics foundation models crucially depends on data labels. Outcome reward labels are needed for monitoring real-world deployments. Process reward labels are needed during RL post-training. Timestamped captions are needed for filtering and balancing pretraining data. We present Flora, an industrial-quality data engine used for training GR00T models, that simultaneously covers these capabilities. Flora achieves SOTA scores on the captioning benchmark WGO-Bench and reward benchmarks RoboReward and Robometer. On internal benchmar","tags":[],"cluster_size":1,"ts":"2026-10-26T04:00:00"},{"id":37076,"title":"机械行业周报：特斯拉启动Optimus生产，我国工业机器人、机床产量 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
