\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9VcDcwdndYdzVLdDVpSjh5VmtnMlRsN3hzTmxPZ1lHZVZpTjZQZkgxMEZqZXhaVnVkNXFZRTN0SWdoWFFRY1ZkNXIyZThTMGJTYVdLaGlaMzZPR09pZkdPWGlB?oc=5\" target=\"_blank\"\u003e美国存储芯片深夜重挫，SK海力士大跌9%，闪迪、美光跌超8%，中概股普涨，阿里巴巴涨超4%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e手机网易网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-07-15T22:50:29"},{"id":10980,"title":"行业景气度得到验证，锂电产业链企业上半年业绩大面积预喜","url":"https://wallstreetcn.com/livenews/3134638","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"锂电企业2026年上半年业绩预告集中披露，行业上行周期逻辑得到进一步印证。Choice数据显示，截至7月15日收盘，已有35家锂电产业链上市公司发布上半年业绩预告，除3家业绩同比下滑，其余为预增、扭亏或减亏。各企业的“成绩单”显示，从上游锂矿、锂盐，到中游锂电材料，再到下游动力电池、储能赛道，产业链各环节景气度同步回暖。上游锂盐实现量价齐升，相关企业业绩大面积预增；中游隔膜、电解液与下游电池厂商盈利同步修复。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-15T22:46:47"},{"id":10981,"title":"0.5%成价格阶段性参考线，多家机构收紧票据低价转贴现","url":"https://wallstreetcn.com/livenews/3134637","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"票据市场近期出现新的价格信号。从业内获悉，7月以来，部分机构被要求避免开展价格低于0.5%的转贴现业务，国股银票（由国有大行和股份制银行开具的银行承兑汇票）转贴现利率随之向0.5%附近靠拢。受访人士认为，0.5%正在成为票据转贴现市场的阶段性参考线。对企业而言，这不是贴现利率全面上涨，而是此前一些过低的价格可能被拉回，贴现利率继续下探的空间受到约束。业内人士表示，此举主要是为了减少银行低价买票冲信贷规模的行为，引导票据业务回归真实融资需求。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-15T22:41:18"},{"id":10982,"title":"“发债补流”+“瘦身提效”，券商多措并举提升ROE","url":"https://wallstreetcn.com/livenews/3134635","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近年来，提升ROE（加权平均净资产收益率），成为券商发展的重要课题。2025年年报数据显示，证券行业资本使用效率显著增强，ROE呈现普遍提升态势。业内人士表示，证券行业发展正从“通道驱动”向“资本驱动”跃迁：有的券商通过“发债补流”提升资本使用效率；有的则通过“瘦身提效”优化资本结构。Wind数据显示，2025年A股上市券商平均ROE为6.76%，与成熟市场同业相比仍有一定的提升空间。随着优质资产收益不断提升，头部券商有望向国际一流投行迈进。（上证报）","tags":[],"cluster_size":1,"ts":"2026-07-15T22:39:25"},{"id":10983,"title":"执行基金信息披露新规，多只公募产品二季报首次披露长期业绩","url":"https://wallstreetcn.com/livenews/3134632","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年基金二季报是公募基金信息披露新规落地后的首批定期报告，成立期限满足新规要求的公募基金在二季报中首次披露过去7年、10年的长期业绩。业内人士表示，在信息披露、绩效考核等引导下，公募基金行业的长期价值 tle":"Directional Constraints for Efficient Exploration in Safe Reinforcement Learning","url":"https://arxiv.org/abs/2607.12784","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12784v1 Announce Type: new \nAbstract: Reinforcement Learning has revolutionized the landscape of robotic research, allowing robust learning of complex robotic skills in simulation. However, real-world deployment in open-ended environments requires strong safety guarantees to prevent dangerous or harmful behaviors. Safe Reinforcement Learning methods address this requirement by enforcing safety constraints. Nevertheless, learning under constraints often reduces learning speed and could lead to suboptimal task performance, as the agent must solve a more complex constrained optimizatio","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11092,"title":"Globalized Constrained Stein Variational Inference for Diverse Feasible Robot Motion Planning","url":"https://arxiv.org/abs/2607.12732","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12732v1 Announce Type: new \nAbstract: Robot motion planning is inherently multimodal, yet classical planners typically return only a single solution. Probabilistic formulations address this limitation by maintaining a distribution over motions, allowing the planner to reason over multiple low-cost alternatives. In robotics, however, motion samples must also satisfy strict constraints, including collision avoidance, joint limits, contact conditions, and dynamics consistency. These hard requirements make motion sampling substantially more challenging: within a limited planning budget,","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11091,"title":"Vision-Based Dribbling for Humanoid Soccer via Privileged Representation Learning","url":"https://arxiv.org/abs/2607.12702","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12702v1 Announce Type: new \nAbstract: Recent advances in humanoid robotics have highlighted the importance of deployable loco-manipulation skills. Dribbling a soccer ball while evading active opponents requires simultaneous balance, precise ball control, and awareness of a dynamic adversary under onboard sensing and real-time constraints. Existing approaches typically separate perception and motion, which can be effective in controlled settings but may fail under occlusions, fast ball movements, and complex opponent interactions, since perception is not directly optimized for contro","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11090,"title":"Jetson-PI: Towards Onboard Real-Time Robot Control via Foresight-Aligned Asynchronous Inference","url":"https://arxiv.org/abs/2607.12659","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12659v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have achieved impressive performance on diverse embodied tasks. However, deploying VLA models on low-power onboard devices, such as the Jetson Orin, remains challenging due to their high computational complexity, which leads to substantial inference latency and low control frequency. Asynchronous inference can partially mask this latency by parallelizing action execution and subsequent inference, but it introduces two critical issues: perception-execution misalignment and long reaction time. In this paper, we","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11089,"title":"Instance-Enriched Semantic Maps for Visual Language Navigation","url":"https://arxiv.org/abs/2607.12630","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12630v1 Announce Type: new \nAbstract: Visual Language Navigation (VLN) aims to enable an embodied agent to navigate complex environments by following natural language instructions. Recent approaches build semantic spatial maps and leverage Large Language Models (LLMs) for reasoning and decision making. Despite these advances, existing systems lack instance-level object detail and robustness to diverse user queries, limiting reliable navigation in complex indoor environments. To address these limitations, we propose Instance-Enriched Semantic Maps, a unified framework with three key","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11088,"title":"Streamlining stereo differentiable rendering for marker-free real-time tracking of surgical robots","url":"https://arxiv.org/abs/2607.12604","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12604v1 Announce Type: new \nAbstract: Purpose: Marker-based tracking of surgical robots is occlusion-prone in cluttered operating rooms. We evaluate stereo differentiable rendering for marker-free, real-time robot pose tracking, potentially improving safety, reducing setup time, and enabling multi-robot interaction. Methods: We extend the markerless pose estimation framework roboreg to online dynamic tracking via (i) sequential optimisation that propagates pose estimates across frames with motion-adaptive hyperparameter tuning, and (ii) CUDA stream parallelisation of segmentation an","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11087,"title":"TrustVLA: Mechanism-Guided Inference-Time Defense Against Vision-Language-Action Backdoors","url":"https://arxiv.org/abs/2607.12571","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12571v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models are deployed through pipelines that end users cannot audit, and a poisoned VLA can behave normally on clean observations while a small visual trigger redirects a long-horizon robot policy before any failure becomes observable. Existing vision or language defenses rarely explain what a triggered VLA representation looks like or how to recover behavior without retraining. We study this gap through two independently proposed VLA attacks from groups with distinct injection strategies, BadVLA and INFUSE; the latter","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11086,"title":"Infra-Swarm: Robust Vision-Based Multi-Robot Swarming via Near-Infrared Spectral Vision","url":"https://arxiv.org/abs/2607.12489","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12489v1 Announce Type: new \nAbstract: Distributed swarms typically rely on either active wireless communication or passive vision, and they are frequently hindered by bandwidth constraints or environmental sensitivity. This paper proposes Infra-Swarm, a robust vision-based swarm. Each robot is equipped with a near-infrared light source and four ordinary gray-scale cameras. The Infra-Swarm system directly measures the centimeter-level 3D position of neighbors based on the position (bearing) and intensity (strength) of optical flares in the captured images. By utilizing 940 nm narrow-","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11085,"title":"Deployable Human Preference Alignment in Robotics: Learning Representative Rewards from Diverse Human Preferences","url":"https://arxiv.org/abs/2607.12466","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12466v1 Announce Type: new \nAbstract: Aligning robot policies with human preferences is essential for deployment to diverse end users. In per-user alignment approach, preference feedback is often sparse, so learning becomes unstable and vulnerable to human preference noise, and a growing number of individualized policies makes validation difficult before deployment. A single shared policy approach to user alignment avoids this cost but fails to capture heterogeneous preferences and often neglects minority preferences. To address these challenges, we introduce Preference-based REward","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11084,"title":"Model-Based Diffusion Optimal Control for Multi-Robot Motion Planning","url":"https://arxiv.org/abs/2607.12423","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12423v1 Announce Type: new \nAbstract: Multi-Robot Motion Planning in continuous environments, where robots must generate dynamically feasible, collision-free trajectories, is challenging due to the combinatorial growth of the joint trajectory space and the difficulty of enforcing dynamic feasibility and hard safety constraints. Recent approaches recast trajectory planning as probabilistic inference, sampling from a posterior over trajectories using diffusion models whose score functions are learned from demonstration data. While showing promising performance, these approaches are li","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11083,"title":"StratMamba: Strategic and Reactive Stream Partitioning for Path-Efficient LiDAR-Based Obstacle Avoidance","url":"https://arxiv.org/abs/2607.12370","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12370v1 Announce Type: new \nAbstract: This paper proposes StratMamba, a dual-stream Mamba-based temporal modeling architecture, to more efficiently capture long-horizon temporal dependencies required for robot navigation in complex and obstacle-rich environments. StratMamba leverages a combination of fast-decay and slow-decay memory architectures, where the fast-decay component processes high-frequency LiDAR data for reactive obstacle avoidance, while the slow-decay component maintains longer-horizon goal information for strategic planning. We perform extensive evaluations of differ","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11082,"title":"VistaVLA: Geometry- and Semantic-Aware 3D Gaussian-Grounded VLA for Robotic Manipulation","url":"https://arxiv.org/abs/2607.12356","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12356v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have emerged as a powerful end-to-end paradigm for robotic manipulation by mapping language instructions and 2D visual inputs directly to actions. However, these models lack an explicit, scene-level 3D representation, limiting their ability to reason over spatial layouts and geometric constraints. While recent efforts incorporate explicit 3D cues, such as depth maps or point clouds, to improve geometric awareness, they primarily capture low-level structures and lack high-level semantic grounding in 3D space. I","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11081,"title":"Reducing Temporal Redundancy for Efficient Vision-Language-Action Inference","url":"https://arxiv.org/abs/2607.12287","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12287v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models exhibit strong generalization for robotic manipulation, yet their high inference latency limits real time deployment. We identify two primary sources of temporal redundancy in existing VLA pipelines: repeated visual encoding of highly similar consecutive frames and multi step iterative sampling in diffusion based policies. To address this, we propose a system level acceleration strategy that reduces computation in both perception and action generation. On the perception side, we incrementally update only token","tags":[],"cluster_size":1,"ts":"2026-07-15T04:00:00"},{"id":11080,"title":"Contract-Grounded Behavior Tree Synthesis via Coding Agents","url":"https://arxiv.org/abs/2607.12220","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2607.12220v1 Announce Type: new \nAbstract: Synthesizing deployable robot behavior trees (BTs) from natural language (NL) requires grounding to ensure every generated BT references only skills a robot can actually execute. Existing LLM-based BT synthesis approaches often place this grounding responsibility on the prompt author. This makes deployment brittle when the author does not know which skills the robot can execute, how those skills are parameterized, or how th // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
