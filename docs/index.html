计划建议发行票据\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTradingView\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-12T00:03:00"},{"id":33388,"title":"美股期货走高，标普500指数期货上涨0.2%，纳斯达克100指数期货上涨0.5%。","url":"https://wallstreetcn.com/livenews/3176785","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美股期货走高，标普500指数期货上涨0.2%，纳斯达克100指数期货上涨0.5%。","tags":[],"cluster_size":1,"ts":"2026-10-11T23:54:22"},{"id":33389,"title":"本周中国央行公开市场有3020亿元7天期和14天期逆回购到期（其中周一和周五分别有3000亿和20亿元到期），并有5000亿元6个月期买断式逆回购到期（周四到期","url":"https://wallstreetcn.com/livenews/3176784","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"本周中国央行公开市场有3020亿元7天期和14天期逆回购到期（其中周一和周五分别有3000亿和20亿元到期），并有5000亿元6个月期买断式逆回购到期（周四到期）。","tags":[],"cluster_size":1,"ts":"2026-10-11T23:47:38"},{"id":33390,"title":"华尔街见闻早餐 | 2026年10月12日","url":"https://wallstreetcn.com/livenews/3176779","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周五标普500指数反弹至史上次高，中概股大涨；欧洲股市创9月中旬以来最大单日涨幅；美元指数连涨四周、创21个月最长周涨。\n\n特朗普要求乌克兰不能打俄炼油厂，称俄乌进入“能源停火”、双方均同意。特朗普称与普京达成协议，俄罗斯将向全球市场释放数百万吨柴油。\n\n沙特与胡塞武装的冲突进一步升级，首都利雅得机场接连遇袭，造成12人死亡、300多人受伤。\n\n中欧贸易投资磋商在京举行并公布成果共识：就混动汽车贸易达成谅解，进一步强化出口管制对话，愿为稀土永磁体出口审批提供便利。\n\n中国商务部评美召集部分经济体发布应对所谓“结构性产能和生产过剩”问题联合声明：反对个别国家以所谓“产能过剩”为名，行贸易保护主义之实。\n\n中共中央、国务院发文提出发展新质生产力举措，支持科技企业上市融资、优化并购重组、民企可牵头重大技术攻关。\n\n中国证监会大修公募基金规定：权益类基金成立门槛拟降至5000万元，建立迷你基金强制退出机制，基金管理人等主体违法罚款上限抬升至10万元。\n\n中国证监会召开座谈会：发展壮大耐心资本，推动加大分红回购力度，优化发行上市制度。\n\n中国四部门征求意见稿强化汽车创新设计管理：禁止隐藏式车门把手，关键功能保留实体操纵件。\n\n微软首席执行官呼吁为先进人工智能建立“紧急制动”机制。Lumentum CEO：公司光学器件售罄至2029年，部分产品需求缺口达70%。\n\nSpaceX进军手机运营商","tags":[],"cluster_size":1,"ts":"2026-10-11T23:10:51"},{"id":33391,"title":"经济日报：基金发行重“量”更应重“质”","url":"https://wallstreetcn.com/livenews/3176778","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"万得数据显示，截至9月29日，年内新发基金数量达1344只，同比增长近22%；新发基金总规模8898.02亿元，同比下降超3%。一升一降的背离数据，恰恰折射出行业当下的发展困境：一边是基金公司加速上新、扩充产品线，创新产品持续落地，市场供给源源不断；另一边是投资者认购意愿降温，上百只指数基金发布延长募集期公告，行业发行内卷、募资乏力。","tags":[],"cluster_size":1,"ts":"2026-10-11T22:51:08"},{"id":33392,"title":"“A+H”上市公司数量持续增加","url":"https://wallstreetcn.com/livenews/3176777","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，港股上市公司力勤资源在深圳证券交易所主板正式挂牌上市，成为全面注册制实施以来深市主板首家“H回A”上市企业。除力勤资源外，近期，包括映恩生物在内的多家港股公司更新A股上市“进度条”。此外，Wind数据显示，今年以来已经有38家A股上市公司成功实现H股上市，“A+H”上市公司数量持续增加。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-11T22:41:12"},{"id":33393,"title":"10月以来逾80家A股上市公司获机构调研","url":"https://wallstreetcn.com/livenews/3176776","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Wind数据显示，截至10月11日记者发稿时，10月以来，82家A股上市公司获机构调研。从调研内容看，投资者对于核心产品的研发进展、原材料价格变动对毛利率影响、业务出口情况较为关注。从获机构调研数量看，艾力斯、航天南湖、菲利华、泰鸿万立、中国重汽等公司排名居前。从行业角度看，电气设备、汽车零部件、应用软件、化工、电子元件等行业上市公司获机构关注度高。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-11T22:40:02"},{"id":33394,"title":"防御配置需求升温，红利基金密集限购","url":"https://wallstreetcn.com/livenews/3176772","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，公募红利主题产品热度全面攀升。一方面，多只存量红利基金发布限购公告，也有新产品提前结束募集；另一方面，多款红利主题新品接连申报、启动发行，行业扩容节奏显著提速。部分机构认为，在当前较为震荡的市场环境中，盈利确定性强、现金流充沛的红利资产或成为资金相对稳健的选择，有望在成长与价值风格的再平衡中走强。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-11T22:30:46"},{"id":33395,"title":"机构建议聚焦A股业绩确定性标的","url":"https://wallstreetcn.com/livenews/3176770","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"国庆假期后，A股市场出现一定幅度调整。但在10月9日，A股上演“V”形反转，沪指3800点关口失而复得，多只宽基ETF迎来成交大幅放量行情。本周多家券商在策略展望报告中研判，经历连续调整后，当前市场悲观情绪已得到较充分消化，叠加国内政策持续托底，短期扰动不改A股内在韧性。后续随着三季报披露窗口开启，10月A股仍存在结构性修复机会，业绩兑现将成为市场定价的核心锚点。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-11T22:27:09"},{"id":33396,"title":"Alibaba Burned RMB 44.7 Billion of Free Cash Flow in the June Quarter. Here’s Management’s 33% Growth Math - TIKR.com","url":"https://news.google.com/rss/articles/CBMizAFBVV95cUxNaDJEbTcwMERqYWh3ejVmTjBFd1dyN1NtZzc5WHVCZUhEYmsyS2REa3FVa051dlRKWERoNU9Xc1d6QllMQ2NWRmZrdEg5Y2RrZ3NGcE9jMENNZkNyZ2dyU18tM2VtMEw0T1dGNlRXWUNsdmtWQVd0QkRVLWdjWXdvQ2wyWjJjVkg2U1VMY3Buak82bG1rQUJ4RDE1dzBkNldhWF8tbWtMQ014dEk5QWh1WVhob0RYNEJfS0lGX1JqWlFHZFVndEdrdXhRdWc?oc=5","source":"GNew ect, yet gentle enough to avoid damaging it. Achieving this balance requires knowledge of the object's material properties, such as its mass, elasticity, and surface friction. These properties, however, are seldom precisely known a priori. In this work, we propose a visuotactile approach to estimating material properties in real time, during the process of grasping. Our method uses these estimated properties to determine the minimum grasp force required to handle the object. We contrib","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32674,"title":"Demonstrating Arena 5.0: A Photorealistic ROS2 Simulation Framework for Developing and Benchmarking Social Navigation","url":"https://arxiv.org/abs/2610.11220","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11220v1 Announce Type: new \nAbstract: Building upon the foundations laid by our previous work, this paper introduces Arena 5.0, the fifth iteration of our framework for robotics social navigation development and benchmarking. Arena 5.0 provides three main contributions: 1) The complete integration of NVIDIA Isaac Gym, enabling photorealistic simulations and more efficient training. It seamlessly incorporates Isaac Gym into the Arena platform, allowing the use of existing modules such as randomized environment generation, evaluation tools, ROS2 support, and the integration of planner","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32673,"title":"OmniDex: Scaling Dexterous Hand Grasping to Diverse Cluttered Scenes","url":"https://arxiv.org/abs/2610.11194","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11194v1 Announce Type: new \nAbstract: Dexterous grasping is the foundational primitive in embodied AI, demanding massive data to train robust models. As real-world data collection is expensive, simulation has become the mainstream paradigm. Yet, while cluttered scenes best reflect real-world applications, learning to grasp within them is bottlenecked by a critical scarcity of large-scale data. To resolve this, we curate high-quality 3D objects and supporting bases, proposing a scalable seed-and-filter strategy that bypasses sluggish scene-level optimization. This yields an unprecede","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32672,"title":"Higher-Order Action Supervision Makes A Strong Policy Class","url":"https://arxiv.org/abs/2610.11175","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11175v1 Announce Type: new \nAbstract: Modern data-driven decision-making methods, such as imitation learning (IL) and reinforcement learning (RL), have achieved great success in solving many complex tasks. However, these methods often suffer from serious control instability and robustness issues when applied in real-world applications such as robotics and autonomous driving, posing notable challenges for their practical deployment. We argue that this instability issue stems largely from their limitations in solely supervising and optimizing zeroth-order actions (i.e., the action lab","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32671,"title":"PMTRM: Pseudo-Memory Temporal Re-encoding Module for Embodied Policy Learning","url":"https://arxiv.org/abs/2610.11168","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11168v1 Announce Type: new \nAbstract: Robotic manipulation often contains repeated motions whose local observations look similar at different phases. When these phases require different actions, a policy that relies mainly on the current observation may repeat completed motions or switch phases at the wrong time. To address this phase ambiguity, we present the Pseudo-Memory Temporal Re-encoding Module (PMTRM), a lightweight plug-in module with only 7.61M parameters that encodes a bounded history of executed states and actions into a latent sequence for existing policies. To help dis","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32670,"title":"Distributed Relative Localization Based on Ultra-WideBand and LiDAR for Multi-robot with Limited Communication","url":"https://arxiv.org/abs/2610.11141","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11141v1 Announce Type: new \nAbstract: Relative localization is crucial for a multi-robot system to collaboratively perform tasks, such as exploration and formation. However, this is highly challenging for homogeneous robots with similar appearance in GPS-denied and communication-limited environments. In this paper, we propose a fully distributed relative position estimation approach for a team of robots based on onboard UWB and LiDAR sensors, in which LiDAR is utilized to obtain the position of anonymous objects in Line-of-Sight (LOS), and UWB is used for ranging between robots. We","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32669,"title":"FOCUS: From Privileged States to RGB-D with Controlled Modality Switching and Representation Alignment","url":"https://arxiv.org/abs/2610.11119","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11119v1 Announce Type: new \nAbstract: Vision-based reinforcement learning for robotic manipulation is sample-inefficient because RGB-D observations are high-dimensional and noisy. Privileged state information available in simulation can accelerate training, but its absence at test time creates a train-test modality gap. We propose FOCUS, a single-stage PPO framework that trains the critic on privileged state while automatically regulating whether the actor collects rollouts from RGB-D or privileged-state latents. Regulation is driven by the KL divergence between the action distribut","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32668,"title":"Towards Path-Creative Navigation: Robot Navigation through Embodied Interaction","url":"https://arxiv.org/abs/2610.11072","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11072v1 Announce Type: new \nAbstract: Autonomous navigation in cluttered and constrained environments typically assumes a fixed environment and searches only for paths within existing free space. However, a route can be blocked by an articulated structure, a movable object, or a pedestrian, and reaching the goal may therefore require appropriate embodied interaction with the environment. This paper formulates Path-Creative Navigation (PCN), a navigation paradigm in which the robot recovers free space by coordinating locomotion and embodied interaction, and addresses one class of PCN","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32667,"title":"A Reconfigurable Fabric Based Pneumatic Actuator with Button Fastened Constraint Modules for Multi Mode Actuation","url":"https://arxiv.org/abs/2610.11054","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11054v1 Announce Type: new \nAbstract: Soft pneumatic actuators are widely used in soft robotics. However, their actuation modes are typically fixed by internal chamber designs or reinforcements, making post fabrication reconfiguration difficult. This paper presents a reconfigurable fabric-based pneumatic actuator that enables rapid, tool free, and reusable switching among multiple actuation modes by attaching constraint fabric modules to a buttoned textile sleeve. By rearranging low-stretch constraint parts on a single actuator body, the proposed system realizes four actuation modes","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32666,"title":"ActiveReg: Information-Driven Active Regional Probing for Partial-to-Full Bone Registration","url":"https://arxiv.org/abs/2610.11003","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.11003v1 Announce Type: new \nAbstract: Accurate bone registration is essential for orthopedic surgical navigation and robotic assistance. In a common workflow, the surgeon needs to identify and probe a number of prescribed locations on the exposed bone surface to obtain data points for registration, which can be difficult and time-consuming under limited surgical exposure. Reducing the number of required points while providing clear probing guidance would ease the surgeon's acquisition task intra-operatively. We present ActiveReg, a closed-loop framework that recommends probing regio","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32665,"title":"iAm.md: Robot Skill Self-Assessment through Agentic Introspection for Unknown Open-Vocabulary Domains","url":"https://arxiv.org/abs/2610.10962","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10962v1 Announce Type: new \nAbstract: Agentic AI based on Large Language Model generalization capabilities offers a wide range of potential applications, including planning for embodied tasks. For example, embodied agents based on Foundation models can generate plausible plans in autonomous robotics scenarios. Due to limited context windows or hallucinatory phenomena in the next-token prediction formulation, behaviors may be generated without establishing whether the deployed robot and the observed environment actually support the requested operation, in what we call a \"grounding fa","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32664,"title":"Higher-Order Morphology Priors for Quadruped Reinforcement Learning Under Actuator Degradation","url":"https://arxiv.org/abs/2610.10934","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10934v1 Announce Type: new \nAbstract: Actuator degradation turns quadruped locomotion into a coordination problem requiring joints to compensate for lost actuation. Prior work suggests that morphology-aware graph policies improve learning and generalization under body perturbations. We ask whether these benefits can be strengthened by explicitly modeling higher-order mechanical structure. We represent the Unitree Go1 as a cell complex with limb- and body-level rank-2 cells and apply Hodge-based message passing. Under degradation training, the node-edge-face Hodge actor achieves the","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32663,"title":"When Listening Becomes Easier: Scrubbing Visual Cues for Shortcut-Free VLAs","url":"https://arxiv.org/abs/2610.10912","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10912v1 Announce Type: new \nAbstract: Shortcut learning is a prevalent issue in robot learning. The limited diversity of robot demonstration datasets can mislead policies into exploiting spurious correlations between tasks and irrelevant features, such as viewpoint or background. Collecting sufficiently diverse robot demonstrations is costly and inefficient, motivating algorithmic alternatives. We focus on vision-language-action (VLA) models and discover that different vision-language model backbones exhibit substantially different levels of susceptibility to visual shortcut learnin","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32662,"title":"OmniHOI: Dexterous Hand-Object Interaction from Monocular Human Video","url":"https://arxiv.org/abs/2610.10855","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10855v1 Announce Type: new \nAbstract: Monocular videos of human manipulation provide abundant dexterous demonstrations, yet reconstructing hand-object interaction from a single view and transferring it to robot hands remain difficult, limiting their direct use for robot execution. Prior methods either require task-specific RL training, limiting scalability, or assume clean motion-capture trajectories and thus cannot operate directly on video. We present OmniHOI, a pipeline that turns an RGB video of hand-object interaction into an interaction-faithful trajectory on dexterous hands.","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32661,"title":"Cross-Embodiment Robot Foundation World Models with Latent Actions","url":"https://arxiv.org/abs/2610.10846","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10846v1 Announce Type: new \nAbstract: The diversity of robot embodiments and action spaces makes it challenging to build robot world models that generalize across different embodiments. We introduce the Latent Action-Conditioned Robot World Model (LAC-WM), which operates within a learned unified latent action space shared across diverse embodiments. This unified action space improves the world model's performance when adapted to previously unseen robot embodiments. We compare LAC-WM with an Explicit Action-Conditioned World Model (EAC-WM), which conditions on explicit motion labels.","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32660,"title":"Skill-SLM: Agent Skill-driven Small Language Models for Reliable Robot Operation","url":"https://arxiv.org/abs/2610.10812","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10812v1 Announce Type: new \nAbstract: Small language models (SLMs) have been increasingly adopted for onboard robot operation because they enable intelligent decision-making. However, existing approaches are mainly distillation-oriented and rely on enumerating representative task-solution pairs. This makes dataset construction difficult and limits generalization to diverse robot tasks whose possible forms grow rapidly. This paper proposes Skill-SLM, a framework that reformulates SLM-driven robot operation as a task-decomposition and skill-composition problem. Given a natural languag","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32659,"title":"Diagnosing and Recovering from Observation-Space Shift at Long-Horizon Skill Seams","url":"https://arxiv.org/abs/2610.10810","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10810v1 Announce Type: new \nAbstract: Long-horizon robotic manipulation is often built by chaining independently trained skills. Although each skill can be reliable in isolation, performance degrades sharply when skills are chained: each downstream skill must start from the state its predecessor leaves behind rather than from its training distribution. We study this failure mode, Observation-Space Shift (OSS), and ask what causes these skill-seam failures. Using privileged simulator resets, we find that the dominant shift comes from displaced scene state (e.g., an open drawer or sec","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32658,"title":"Same Action, Different Outcome: Variability in Dynamic Cloth Manipulation","url":"https://arxiv.org/abs/2610.10801","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10801v1 Announce Type: new \nAbstract: Although cloth is known to exhibit different outcomes under repeated fast dynamic motions, even when the same trajectory is applied, this variability has not yet been systematically characterized. Quantifying it is essential to assess the reliability of learned manipulation policies and the extent to which simulation can reproduce real-world behavior. To study this, we execute the same trajectory ten times across four dynamic tasks, two of which are novel, each tested with three cloths of very different properties and at up to three execution sp","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32657,"title":"NavGPT-3: Harnessing Context in a Hierarchical Navigation Runtime","url":"https://arxiv.org/abs/2610.10787","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10787v1 Announce Type: new \nAbstract: Language models trained with long-horizon agentic reinforcement learning can generalize knowledge through reasoning, express precise actions, and pursue goals over many steps, raising the ceiling on what an embodied agent can understand and decide. Physical interaction, however, remains the domain of action policies, which provide dense, low-latency control. We present NavGPT-3, a harness that connects the two models, with an OS-like runtime built above it: reasoning, acting, and monitoring run as threads with their own context, tools, and permi","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32656,"title":"TAPNAV: Humanoid Navigation through Tactile Active Perception","url":"https://arxiv.org/abs/2610.10748","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10748v1 Announce Type: new \nAbstract: Navigation in vision-denied environments is challenging for humanoid robots because proprioceptive odometry drifts and localization uncertainty accumulates rapidly. We present TAPNAV, a tactile active-perception framework that enables humanoid navigation toward a goal by actively probing surrounding structures without relying on vision. TAPNAV maintains a pose belief from odometry, IMU, and tactile contact observations, and couples uncertainty-aware global route planning with information-gain-driven local probing. The global planner searches for","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32655,"title":"TacHair: Tactile Contact-Distribution Guided Online Correction for Robotic Hair Stroking and Perception","url":"https://arxiv.org/abs/2610.10637","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10637v1 Announce Type: new \nAbstract: Hair stroking is common in daily grooming and personal care, and is also widely used in hair-product evaluation, motivating robots with similar physical interaction capabilities. Existing robotic hair-care and surface-following methods mainly rely on trajectory planning, compliance, force regulation, or tactile-conditioned policies, but deformable hair can remain in contact while gradually drifting across the end-effector, making local interaction difficult to regulate. We propose TacHair, a tactile contact-distribution guided online correction","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":32654,"title":"Teaching a Robot Dog New Tricks: Diverse Quadruped Skills via Combined Reinforcement and Imitation Learning with Adversarial Task Selection","url":"https://arxiv.org/abs/2610.10601","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.10601v1 Announce Type: new \nAbstract: Reinforcement Learning (RL) has enabled legged robots to perform a range of skills in single-task settings. However, applications such as farm robotics or space exploration require diverse skills such as locomotion, digging, or close-range surveying. Training an end-to-end policy to address this problem remains difficult due to challenges such as sample inefficiency and gradient conflict between tasks in multi-task learning. We propose a three-stage method that trains a single policy to perform distinct tasks such as walking, digging, and hoppin","tags":[],"cluster_size":1,"ts":"2026-10-09T04:00:00"},{"id":33076,"title":"Humanoid Robot Competition Shifts to \"Getting Work Done\" — Can Crowdsourced Data Platforms Crack the Deployment Challenge? - BigGo Finance","url":"https://news.google.com/rss/articles/CBMidkFVX3lxTE90ODk0bHNXb09mbURtUWFueTg4UW9KS0ZTZHV6bEZ5WmpHbXpURkl2aDZSLVdlUW5ubkhpUGUyMm1zUXk0dndFZVBGUnpiNjNMTEpHR2dFUUxWTkFDcVVSNEhSVXlpX2Y4U0w1Q2NjRm0tZDhMakE?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMidkFVX3lxTE90ODk0bHNXb09mbURtUWFueTg4UW9KS0ZTZHV6bEZ5WmpHbXpURkl2aDZSLVdlUW5ubkhpUGUyMm1zUXk0dndFZVBGUnpiNjNMTEpHR2dFUUxWTkFDcVVSNEhSVXlpX2Y4U0w1Q2NjRm0tZDhMakE?oc=5\" target=\"_blank\"\u003eHumanoid Robot Competition Shifts to \"Getting Work Done\" — Can Crowdsourced Data Platforms Crack the Deployment Challenge?\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eBigGo Finance\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-09T03:35:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
