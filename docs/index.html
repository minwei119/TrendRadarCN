venews/3151376","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"鸿海在台湾证券交易所公告称，子公司Foxconn Singapore Pte Ltd取得FuKang Technology股权，交易金额为3.584亿美元，用途为长期投资。FuKang Technology是鸿海在越南的子公司。另据公告，鸿海子公司Cloud Network Technology Singapore购买FII AMC MEXICO S. DE R.L. DE C.V.的股份，交易金额约2700万美元。","tags":[],"cluster_size":1,"ts":"2026-08-18T23:48:24"},{"id":20994,"title":"国产创新药迎三重业绩拐点，CXO龙头利润与订单同步创出历史新高","url":"https://wallstreetcn.com/livenews/3151374","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"创新药上市公司2026年半年报、业绩预告集中披露，行业正式迎来商业化单品放量、出海BD（商务拓展）兑现、上游CXO（医药研发生产外包）全链条高景气三重业绩拐点。既有泽布替尼、玛仕度肽等爆款产品实现规模化盈利，还有石药集团、恒瑞医药、信达生物接连落地百亿级出海BD大单，CXO龙头利润与订单同步创出历史新高。在业内专家看来，创新药上半年的业绩表现并非短期脉冲，而是从单一产品出海、单一管线授权迈向全产业链体系化的转折点；但对标强生、礼来等跨国药企，国内企业还存在着显著的差距，产业追赶仍需长期耕耘。","tags":[],"cluster_size":1,"ts":"2026-08-18T23:45:20"},{"id":20995,"title":"国海证券：维持腾讯控股“买入”评级 目标价627港元 - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMib0FVX3lxTFBuSmxqdkJqZjdENEJXU2g0Ykd1UktiRHRwaXY0eDhqRFhzaDdVX0xlcXdQdURkQ2NSb0JRSHpvQ3hjVnVqWWdhUk1rSGlPSVVSVEJqRWZTSmgweDA3NHFBcEpJUndnQW1FQWxTY2hSaw?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMib0FVX3lxTFBuSmxqdkJqZjdENEJXU2g0Ykd1UktiRHRwaXY0eDhqRFhzaDdVX0xlcXdQdURkQ2NSb0JRSHpvQ3hjVnVqWWdhUk1rSGlPSVVSVEJqRWZTSmgweDA3NHFBcEpJUndnQW1FQWxTY2hSaw?oc=5\" target=\"_blank\"\u003e国海证券：维持腾讯控股“买入”评级 目标价627港元\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-18T23:36:59"},{"id":20996,"title":"华尔街见闻早餐 | 2026年8月19日","url":"https://wallstreetcn.com/livenews/3151372","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"债市抛售担忧下三大美股指三连跌，纳指跌超1%，芯片股领跌，SK海力士和希捷跌超9%，AI和光通信股齐跌，CoreWeave和Coherent跌超10%。美债收益率冲高回落，30年期美债收益率再创2007年来新高后转降。美伊僵局助原油三连涨。\n\n特朗普声称目前和未来不会与伊朗会谈，秀地图标注霍尔木兹为“美国新领土”，伊朗斥其领土论妄想、称海峡将继续关闭至美方满足协议条件为止；阿联酋称监测到两枚从伊朗发射的导弹、阿已暂停与伊贸易往来。\n\n中国拓宽住房公积金提取和使用范围。\n\n百度Q2营收同比降4.2%至313亿元略逊预期，AI业务占比过半，GPU云强劲增长283%。绩后百度美股跌近13%。\n\n小米Q2收入同比降6.1%至1089亿元，净利润94.6亿超预期，存储涨价引发手机出货量下降26.5%。\n\n兆易创新上半年净利同比大增1091.5%，营收同比增179%。\n\nAI浪潮驱动，天孚通信上半年净利同比增33.92%，无源光器件业务增逾77%。\n\n年内A股“最贵新股”频准激光首秀飙涨595%，中一签最高爆赚55万，创A股历史纪录。\n\nOpenAI下一代模型GPT-6代号再泄露，或将周四见。\n\n提醒：宇树科技周三将登陆科创板。","tags":[],"cluster_size":3,"ts":"2026-08-18T23:10:56"},{"id":20997,"title":"国海证券：维持腾讯控股(00700.HK)“买入”评级 目标价627港元 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxPX2FHbDFHNU42RXVCTUZXN2tlN3lSM2d1aklHaGFrbW5Ld3g5X25rdVp0a1J3MU9IZHZxTlM4dm5oWFVrNkZRMWRxeVdlOVFYd3hsd3ZsdVpSVTJfQTZXV3dXNVU0QUN1bm9QZVpDQlZBdEFSNEpMSFBvSW82VThOM2lKQ045SUMzVG1fSA?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxPX2FHbDFHNU42RXVCTUZXN2tlN3lSM2d1aklHaGFrbW5Ld3g5X25rdVp0a1J3MU9IZHZxTlM4dm5oWFVrNkZRMWRxeVdlOVFYd3hsd3ZsdVpSVTJfQTZXV3dXNVU0QUN1bm9QZVpDQlZBdEFSNEpMSFBvSW82VThOM2lKQ045SUMzVG1fSA?oc=5\" target=\"_blank\"\u003e国海证券：维持腾讯控股(00700.HK)“买入”评级 目标价627港元\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-18T23:10:41"},{"id":20998,"title":"港股反弹节奏放缓，机构研判积极因素仍在积累","url":"https://wallstreetcn.com/livenews/3151371","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"经历一个多月的快速反弹后，近期港股市场行情有所调整，反弹节奏明显放缓。不过从南向资金流向看，8月18日南向资金再现百亿港元级别净流入态势，8月以来净流入规模已超270亿元，叠加日前恒生指数公司发文就恒生科技指数可能作出的修订方案征询市场意见，当前市场积极因素仍在持续积累。","tags":[],"cluster_size":1,"ts":"2026-08-18T23:07:05"},{"id":21000,"title":"部分上市银行上半年业绩向好，信贷投放量质齐升","url":"https://wallstreetcn.com/livenews/3151370","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月18日，南京银行发布2026年半年度报告，营业收入、归母净利润双双实现超8%的增长。继浦发银行、江苏银行、重庆银行、渝农商行等银行先后披露半年度业绩快报、释放上半年经营向好信号之后，平安银行率先交出半年报，拉开A股上市银行半年报披露的大幕。从目前披露的信息来看，多家银行经营表现回暖，信贷投放持续向制造业、绿色金融、普惠小微倾斜，叠加负债端成本精细化管理成效逐步显现，多重因素有望带动行业盈利水平修复。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T23:03:55"},{"id":21001,"title":"看好AI投资机遇，QFII资金“广撒网”","url":"https://wallstreetcn.com/livenews/3151369","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"今年二季度，QFII资金积极关注AI投资机遇。根据目前已披露的A股上市公司2026年半年报，QFII资金二季度新增持有国瓷材料、宏发股份、中材科技的市值均在10亿元以上，二季度国瓷材料、中材科技分别涨超230%、130%。同时，QFII资金也在持续挖掘中小市值个股的投资机会，外资机构二季度扎堆持有的美诺华、晓程科技等，7月以来均有明显的反弹。","tags":[],"cluster_size":1,"ts":"2026-08-18T22:53:11"},{"id":21002,"title":"公募REITs增持热潮涌动，产业方真金白银护盘","url":"https://wallstreetcn.com/livenews/3151368","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日，中信建投沈阳国际软件园REIT与创金合信首农REIT发布公告，宣布原始权益人或关联方启动基金份额增持计划。6月24日以来披露增持计划的公募REITs已达7只，涵盖4只产业园REITs和3只商业不动产REITs。产业方密集出手的背后，是公募REITs市场的持续调整。截至8月18日，中证REITs全收益指数报收931.36点，今年以来累计下跌7.77%，产业园REITs跌幅尤为明显，多只产品近60日跌幅超25%。","tags":[],"cluster_size":1,"ts":"2026-08-18T22:51:36"},{"id":21003,"title":"资金加速涌向硬科技赛道，A股并购重组聚焦“补链强链”","url":"https://wallstreetcn.com/livenews/3151365","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"骏成科技拟收购江苏新通达50%股权，天智航拟收购上海骨科62%股权，精测电子拟收购上海精测41.17%股权……近期，上市公司并购重组热度不减。截至8月18日记者发稿时，Wind数据显示，以首次披露日期为口径，今年以来A股市场超2500家上市公司披露并购重组进展。重组标的集中于半导体、人工智能、高端装备、生物医药、新能源等战略性新兴产业，精准契合新质生产力发展方向，促进了技术、资本、产业的深度融合。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T22:41:11"},{"id":21004,"title":"8月18日300现金流ETF华宝基金份额增加400万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9CcDRTQXhINTZsQVFXbmNGdTh6X01aQXlLb2tZRExsZDNDbWQ0dkpvemdXQkNtUHdLdjdUYU03ODdOdzRjMU8xTFhjV2dHdThUajhpTkgycFN3Zk9DRUR6ODFB?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9CcDRTQXhINTZsQVFXbmNGdTh6X01aQXlLb2tZRExsZDNDbWQ0dkpvemdXQkNtUHdLdjdUYU03ODdOdzRjMU8xTFhjV2dHdThUajhpTkgycFN3Zk9DRUR6ODFB?oc=5\" target=\"_blank\"\u003e8月18日300现金流ETF华宝基金份额增加400万份，重仓股中国移动、中国海油、中国电信_基金提醒_雷达\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e证券之星\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-18T22:38:40"},{"id":21005,"title":"从“拼渠道”到“拼能力”，头部险企跨界竞逐“卖基金”","url":"https://wallstreetcn.com/livenews/3151362","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"又有头部险企谋划进军基金代销市场。上海证券报记者近日获悉，太保寿险已向监管部门递交申请公募基金销售资格的相关资料，目前已进入受理通知环节。据统计，已有中国人寿、阳光人寿、平安人寿等头部险企获得基金代销资格，并开展相关业务。业内人士认为，险企跨界“卖基金”是一门大生意，拼的不是谁进场早，而是谁更能发挥自身优势、满足客户需求。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T22:31:56"},{"id":21006,"title":"“秘密递表” 释放制度红利，港交所向全球交易所“抢资产”","url":"https://wallstreetcn.com/livenews/3151361","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"截至8月17日，8月仅有13家企业在港交所披露申请版本上市文件，而7月1日至7月17日，却有23家企业在港交所披露申请版本上市文件。这并非赴港IPO降温了，而是港股上市机制改革落地后的连锁反应。7月24日，港交所修订后的《上市规则》生效。本轮改革最受市场关注的变化，是将秘密递表资格从特定类型企业扩展至所有新申请人。业内人士认为，港股IPO未来将呈现“公开递表少，实际储备多”的格局。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T22:30:58"},{"id":21007,"title":"央地打出消费“组合拳”，推动内需提质升级","url":"https://wallstreetcn.com/livenews/3151356","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"发放新一轮消费券、调整优化住房公积金政策、“三新”消费试点项目加速落地……近期央地接连部署，打出了一轮促消费政策的“组合拳”。多位受访专家表示，目前消费政策思路正从“大水漫灌”向“精准滴灌”转变，进一步向更多元化、细分化的特色消费场景延伸。展望下半年，多个促消费政策将陆续出台，消费有望边际回暖，未来政策仍有空间。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T22:20:42"},{"id":21008,"title":"多重因素推升成本，储能产业链“涨”声响起","url":"https://wallstreetcn.com/livenews/3151355","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"受原材料价格波动、电池消费税新政落地、市场需求景气等因素影响，近期多家储能产业链企业宣布涨价，电芯、PCS、储能系统等产品价格普遍上调，最高幅度达30%。采访获悉，成本压力沿产业链向下传导，各环节承压程度分化，集成环节压力凸显。多位专家认为，本轮储能产品涨价实质为成本修复与价值重估，有望推动行业转向高质量价值竞争。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-18T22:19:44"},{"id":21009,"title":"周二（8月18日）纽约尾盘，标普500股指期货最终跌0.69%，道指期货跌0.22%，纳斯达克100股指期货跌1.75%。\n\n罗素2000股指期货跌1.26%。","url":"https://wallstreetcn.com/livenews/3151340","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周二（8月18日）纽约尾盘，标普500股指期货最终跌0.69%，道指期货跌0.22%，纳斯达克100股指期货跌1.75%。\n\n罗素2000股指期货跌1.26%。","tags":[],"cluster_size":1,"ts":"2026-08-18T21:06:24"},{"id":21010,"title":"阿里巴巴期权聚焦：8月18日成交12.96万张，未平仓合约235.55万张 - Moomoo","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxQMHR5WWxFdTBhSDB0Y19SSWQzdzd0TDYwQ25SYUV4a0tuS2FQb2dJ RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15285v1 Announce Type: new \nAbstract: Parameter-efficient fine-tuning (PEFT) is a natural way to adapt pretrained vision-language-action (VLA) policies, but most adapter designs apply temporally static updates throughout a control rollout, overlooking the phase-dependent nature of continuous-action manipulation. Such policies traverse distinct regimes, including approach, contact transition, grasping, transport, and placement, each requiring different adaptation behaviors. We propose \\textbf{PhaseLoRA}, a lightweight LoRA parameterization that conditions adaptation at each action-ch","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20977,"title":"VTInstructor: Visual Trajectory Prompting for Navigation Instruction Generation in Continuous Environments","url":"https://arxiv.org/abs/2608.15284","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15284v1 Announce Type: new \nAbstract: Navigation instruction generation from ego-centric RGB video in continuous environments is an important yet challenging task for human-robot interaction and scalable dataset construction. Prior instruction generators assume discrete viewpoint graphs with panoramic observations, where trajectory structure is explicit; in continuous environments, however, the agent receives only a dense RGB stream, making trajectory cues difficult to recover. We propose VTInstructor, the first VLN instruction generation framework for continuous environments. Our k","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20976,"title":"Remember Smarter: Visual History Compressor and Hyperbolic Experience Space for Robotic Memory","url":"https://arxiv.org/abs/2608.15269","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15269v1 Announce Type: new \nAbstract: Long-horizon robot policies require compact access to recent observations and\n  reusable experience without expanding the vision-language-action (VLA)\n  context. We introduce Remember Smarter (RS), a plug-and-play module with\n  complementary visual-history and hyperbolic experience-memory branches. Its\n  visual branch compresses multi-view patch histories using bidirectional\n  spatial Mamba and causal temporal Mamba, then exposes the resulting memory to\n  action-facing hidden states through residual cross-attention while leaving the\n  VLM visual","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20975,"title":"StructRL: Structured Action-Space Exploration for Flow-Based VLAs","url":"https://arxiv.org/abs/2608.15139","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15139v1 Announce Type: new \nAbstract: Flow-based Vision-Language-Action (VLA) models are now widely used for continuous robotic manipulation, and online reinforcement learning (RL) is emerging as a key technique for adapting them to new tasks. Existing RL methods typically inject stochasticity inside the denoising chain, often through isotropic or temporally independent noise. However, effective robot exploration calls for structured noise: temporally smooth and scaled differently across action groups. We show that simply switching the in-chain noise to a structured form does not su","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20974,"title":"Max-Q Selective Imitation for Human-in-the-Loop Online Robot Learning","url":"https://arxiv.org/abs/2608.15088","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15088v1 Announce Type: new \nAbstract: Human-in-the-loop (HIL) online reinforcement learning for real robots must absorb human interventions quickly while continuing to improve beyond the human prior. We present a training method for this setting based on two components. First, an \\emph{MC Q-chunk} critic regresses chunk-level action values onto Monte Carlo returns from the replay buffer, performing sample-average (behavior) policy evaluation so that intervention trajectories are credited directly rather than diluted by current-policy TD backups. Second, \\emph{max-Q selective imitati","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20973,"title":"PACE: Phase-Progress-Aware Credit for Long-Horizon Embodied Manipulation","url":"https://arxiv.org/abs/2608.15026","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15026v1 Announce Type: new \nAbstract: Post-training of vision-language-action (VLA) models typically relies on expert demonstrations and policy interaction trajectories. However, in long-horizon manipulation, a single episode often spans hundreds of control steps and multiple phases, while success or failure is only revealed at episode termination. Policy improvement therefore requires step-level credit signals to distinguish behaviors that advance the task from those that stall or regress. We present PACE, a credit-assignment framework for post-training on long-horizon manipulation","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20972,"title":"ForceU-VLA: A Force-Aware Vision-Language-Action Model for Embodied Ultrasound Scanning","url":"https://arxiv.org/abs/2608.15009","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15009v1 Announce Type: new \nAbstract: Embodied intelligent ultrasound scanning enables the automation and standardization of the ultrasound examination process by integrating perception, decision-making, and execution capabilities. However, existing methods suffer from loosely coupled modeling between force and ultrasound modalities and lack awareness of scanning stages, which limits their ability to capture dynamic probe-tissue interactions. To address these issues, we propose ForceU-VLA, a force-aware Vision-Language-Action model for autonomous embodied ultrasound scanning, which","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20971,"title":"NPU Offloading of a Frozen Visual Encoder for Robot Policy Training","url":"https://arxiv.org/abs/2608.15002","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.15002v1 Announce Type: new \nAbstract: When a robot policy is trained for a new task or dataset, its visual encoder can be frozen and only its action generation module trained, reducing training cost. Freezing removes the encoder's backward pass, but its forward pass must still run at every training step because the input images change, so it keeps consuming GPU compute. We therefore ask whether moving this computation to a low power AI accelerator such as an NPU can reduce total energy despite the added data transfer and longer training time, and how it affects policy performance. W","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20970,"title":"GaussMemory: Task-Driven 3D Gaussian Scene Memory for Long-Horizon Robotic Manipulation","url":"https://arxiv.org/abs/2608.14986","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14986v1 Announce Type: new \nAbstract: Long-horizon robotic manipulation fundamentally relies on persistent spatial memory. However, existing 3D memory systems function merely as passive recorders: they store observations using fixed, hand-crafted rules, treating every scene element--whether a critical grasp target or an irrelevant background wall--with equal importance. In this paper, we propose a paradigm shift from passive storage to active, task-driven spatial memory. We argue that a robot's memory should not simply record what it sees, but actively learn how to remember--discove","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20969,"title":"SkillComposer: Learning Reusable Skills for Natural-Language Robot Programming","url":"https://arxiv.org/abs/2608.14944","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14944v1 Announce Type: new \nAbstract: Natural-language interfaces can lower the barrier to programming robots, but existing systems struggle when users request complex tasks. While large language models (LLMs) perform well with simple commands, they often struggle to generate code for multi-step tasks, decompose high-level instructions, or reuse prior solutions. We present SkillComposer, an interactive natural-language robot programming system for simulation environments that continually learns reusable program abstractions. SkillComposer uses a generate-test architecture in which a","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20968,"title":"From Continuous Design to Delay-Aware Discrete Synthesis: Guaranteed High-Bandwidth Joint Control for PMSM Drives","url":"https://arxiv.org/abs/2608.14937","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14937v1 Announce Type: new \nAbstract: The increasing dynamic demands of modern robotic joints require current controllers to achieve high bandwidth over wide operating ranges of speed, acceleration, and torque, where communication, computation, and discrete-time effects can no longer be neglected. Conventional PMSM current controllers are typically designed in continuous time and subsequently discretized, leaving the sampling frequency and the impact of implementation delays largely to heuristic selection and iterative validation. This paper introduces a task-aware, delay-extended d","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20967,"title":"Real-time Estimator of Actuator Control and Health (REACH) on an Eel-Inspired Soft Robot","url":"https://arxiv.org/abs/2608.14865","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14865v1 Announce Type: new \nAbstract: An actuator health estimation algorithm for a soft swimming robot that can perform anguilliform swimming is developed. Due to harsh operational environments of underwater robots, and the common degradation of soft robot materials and actuators, accurate estimation of actuator functionality is necessary for robots to perform their missions as well as return to base in the event of actuator degradation and failure. Termed REACH (Real-time Estimator of Actuator Control and Health), the architecture employs a soft robot model, sigma point filter, an","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"},{"id":20966,"title":"Modeling and Control of an Eel-Inspired Soft Robot for Design Optimization","url":"https://arxiv.org/abs/2608.14860","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.14860v1 Announce Type: new \nAbstract: Anguilliform locomotion is a highly efficient swimming mode; the advent of new materials for soft robots enables the development of an eel-inspired soft robot. This paper presents a simulation model of an eel-inspired soft robot designed for anguilliform swimming. This model can aid in design optimization and the development of model-based estimation, reasoning, and control systems. A Finite Element Method (FEM) model of an elastic rod is used to capture the soft materials of the robotic fish, which makes it particularly amenable to variation ov","tags":[],"cluster_size":1,"ts":"2026-08-18T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
