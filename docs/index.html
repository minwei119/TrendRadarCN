vily on the downstream model. We address this gap through a large scale evaluation of one JEP","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31074,"title":"When Keywords Drop but Classifiers Hold: Soft Refusals under KV Cache Compression","url":"https://arxiv.org/abs/2609.31678","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31678v1 Announce Type: new \nAbstract: KV cache compression is widely used for long context LLM inference under memory constraints, while deployed systems typically score refusals after generation with keyword filters or learned classifiers. Such monitors are intended to indicate whether a model declined a harmful request under the serving regime actually used. However, it remains unclear whether matched compression that preserves task accuracy also preserves agreement between lightweight lexical monitors and stronger refusal classifiers. We study this with a paired protocol on n=200","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31073,"title":"Active Causal Discovery Benchmark: Evaluating LLM Agents Under Budgeted Interventions","url":"https://arxiv.org/abs/2609.31675","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31675v1 Announce Type: new \nAbstract: We introduce the Active Causal Discovery Benchmark (ACDB), an SCM-grounded environment for evaluating whether LLM agents recover causal graph structure from observations and budget-constrained hard interventions. ACDB pairs a linear-Gaussian world generator with a fixed observe-intervene-submit API and a three-layer scoring contract that separates skeleton recovery, DAG recovery, and intervention efficiency. On the current six-level ladder, PC with a greedy active orientation heuristic is the strongest non-oracle method (directed F1 42.7%, SHD 4","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31072,"title":"NanoForecast v0.5: Competitive Time Series Forecasting Through Training Pipeline Optimization","url":"https://arxiv.org/abs/2609.31669","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31669v1 Announce Type: new \nAbstract: We present NanoForecast v0.5, a 6.5M-parameter forecaster that competes with models 31x its size (TimesFM, 200M parameters) after training pipeline fixes and no architecture change. Retraining the v0.3 architecture with corrected loss-scope handling, tensor shape alignment, and wider augmentation coverage cuts overall Mean Absolute Scaled Error by 43.8% under one fixed protocol (MASE 3.030 to 1.704) on the same data and compute budget. NanoForecast v0.5 beats TimesFM on all three ETT datasets (MASE 0.676/1.110/0.287 vs. 0.705/1.360/0.545) and on","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31071,"title":"Beyond the Graph: An Adaptive Meta-Learner Fuses Explainability, Weather, and Dynamics for Robust Bus ETA Prediction","url":"https://arxiv.org/abs/2609.31667","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31667v1 Announce Type: new \nAbstract: Accurate bus Estimated Time of Arrival (ETA) prediction is vital for urban mobility, passenger satisfaction, and transit efficiency, yet existing models falter against nonlinear spatiotemporal dynamics, data sparsity, and factors such as weather. This paper proposes HYB(nm), an adaptive hybrid ensemble framework that dynamically fuses five complementary models - a historical baseline (MST-AV), periodical temporal pattern analysis (GDRN-DFT), Koopman Neural Operators for nonlinear dynamics (KOOP-NET), weather-integrated feature-engineered neural","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31070,"title":"Cross-Material Support Transfer for Core-Loss Prediction Under Waveform Covariate Shift","url":"https://arxiv.org/abs/2609.31659","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31659v1 Announce Type: new \nAbstract: Power magnetic materials are characterized on the sinusoidal and triangular waveforms that excitation hardware conveniently produces, whereas deployed converters expose cores to trapezoidal, PWM-shaped flux trajectories, so loss models must predict exactly where their training data are thinnest. The final test of the MagNet Challenge embeds a deliberately extreme instance of this characterization-deployment mismatch: for material D, trapezoids form 16.4% of the test set but only 1.4% of the training set. The 95th-percentile relative error, herea","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31069,"title":"From Phase Transition to Systemic Failure: A Decoupled Analytics Framework for GNN Robustness","url":"https://arxiv.org/abs/2609.31656","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31656v1 Announce Type: new \nAbstract: Data quality is a major bottleneck for the reliable deployment of graph neural networks (GNNs) in real-world graph mining tasks. Among various sources of degradation, label noise and feature distribution shift (hereafter referred to as distribution shift) are two common yet fundamentally different challenges. To study their effects under controlled conditions, this paper constructs a synthetic homophilic graph regression benchmark in which the two factors can be manipulated separately. A total of 41 configurations and 410 runs are conducted to e","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31068,"title":"Energy Vision--Language--Action: A Controlled Multimodal Benchmark for Intent-Conditioned Residential Energy Management","url":"https://arxiv.org/abs/2609.31648","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31648v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models are studied mainly in robotics, where visual observations and language instructions are mapped to physical actions. This paper introduces Energy Vision-Language-Action (EVLA), a controlled multimodal benchmark for intent-conditioned residential energy management. EVLA frames battery scheduling as a multimodal trajectory-prediction problem in which an RGB energy-field representation, a numerical operating state, and a natural-language objective are mapped to a 16-step battery-action trajectory generated by a fi","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31067,"title":"STAR: Adaptive Spatial-Temporal Normalization for Unified Microservice Incident Management","url":"https://arxiv.org/abs/2609.31645","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31645v1 Announce Type: new \nAbstract: Automated incident management in large-scale microservice systems relies on learning robust representations from multimodal observability data, including metrics, logs, and traces. Although recent self-supervised frameworks enable unified modeling for anomaly detection (AD), failure triage (FT), and root cause localization (RCL), they often struggle with non-stationary temporal dynamics and heterogeneous service dependency structures. In this paper, we propose STAR, a Spatial-Temporal Adaptive Representation learning framework that explicitly ad","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31066,"title":"MaD-RL: Matching Distributions for Calibrating LLMs with Reinforcement Learning","url":"https://arxiv.org/abs/2609.31644","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31644v1 Announce Type: new \nAbstract: Reinforcement learning (RL) is widely used in language-model post-training to maximize rewards assigned to individual model outputs, such as scores from binary verifiers or reward models trained on human feedback. However, applications such as synthetic-data generation, fairness-related constraint satisfaction, and policy exploration require controlling the distribution of outputs across model generations rather than only maximizing expected reward. We propose a general RL-based framework for \\textit{Distribution Matching} allowing matching the","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31065,"title":"Information Design Against Gaming and Learning Adversaries","url":"https://arxiv.org/abs/2609.31643","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31643v1 Announce Type: new \nAbstract: A principal who deploys a binary classifier with an abstention option must decide which queries the mechanism abstains on. The right choice depends on the adversary. A gaming adversary already knows the classifier and tries to manipulate features across the boundary, so the principal does best by abstaining on queries close to that boundary. The same boundary-localizing rule is the worst possible choice against a learning adversary who does not know the classifier: each abstention now tells the adversary that the boundary is nearby, which is eno","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31064,"title":"Measure Learning at Steady State: A BIRD-SQL Formula 1 Case Study","url":"https://arxiv.org/abs/2609.31640","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31640v1 Announce Type: new \nAbstract: Continual Learning Bench scores learning as short-horizon gain versus a reset baseline and finds naive full-context ICL strongest among the memories it tested. We treat ICL as one learning system and score it on a longer shared-world schedule. Steady-state learning is the gap versus baseline on a pre-set late window (last 40 of 174 BIRD-SQL formula-1 questions). We split the score into exploration efficiency (SQL probes), task reward (hits), and delivery cost (API dollars and context size). On gpt-5.6-luna, late probes fall from 4.6-5.6 to 0.95","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31063,"title":"When Does Domain Adaptation Help on Physical Vibration Sensors? A Held-Out-Bearing Study of Neural-Operator and Convolutional Models","url":"https://arxiv.org/abs/2609.31639","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31639v1 Announce Type: new \nAbstract: Diagnosing rolling-element bearing faults from vibration is a canonical physical-sensing task and a widely used benchmark for domain adaptation under operating-condition shift. Accuracies above 99 percent are commonly reported, but under evaluation splits that place the same physical bearing in both training and test. We revisit the task under a held-out-bearing protocol, assigning every bearing unit entirely to either the training or the test set, and find that source-only transfer is far weaker than such numbers suggest: on a change of shaft s","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31062,"title":"Energy-aware frugal Bayesian optimization","url":"https://arxiv.org/abs/2609.31638","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31638v1 Announce Type: new \nAbstract: Modern design optimization frameworks aim first and foremost for models with the most accurate predictions without balancing computational overhead. It remains a reason why scaled architecture and multidisciplinary design optimization problems are difficult to address, even with sample-efficient Bayesian optimizers. In this paper, a metric quantifying the computational energy footprint is introduced within a Bayesian optimization framework to guide the parameter setting of a model towards configurations that balance both performance and frugalit","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31061,"title":"FIDAL: Diversity-Aware Federated Active Learning Under Real-World Distribution Shifts","url":"https://arxiv.org/abs/2609.31637","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31637v1 Announce Type: new \nAbstract: Federated learning enables collaborative model training across institutions without centralizing data, yet high annotation costs, domain shifts, and class imbalance remain major obstacles, especially when irrelevant out-of-distribution (OOD) samples dilute the labeled data. Existing active learning methods target uncertainty or diversity within in-distribution (ID) data and overlook unknown samples in federated clinical settings. We propose FIDAL, an open-set federated active learning framework that combines calibrated global-local evidential un","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31060,"title":"Grounding Vision-Language Models in Driving Semantics: A Multi-Dataset Predicate Framework for Explainable Reasoning","url":"https://arxiv.org/abs/2609.31636","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31636v1 Announce Type: new \nAbstract: Vision-language models are increasingly used for driving-scene understanding, yet the semantic relations expressed in their outputs are often difficult to verify against the underlying traffic situation. This paper introduces a deterministic multi-dataset predicate framework that derives driving-scene semantics from measurable geometric, kinematic, temporal, map, and traffic-control evidence. Dataset-specific interfaces are used only to recover the required scene information, while predicate definitions remain unchanged across nuPlan and nuScene","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31059,"title":"What Next-Event Accuracy Cannot See: Closed-Loop Evaluation of Emergency Department Trajectory Simulators","url":"https://arxiv.org/abs/2609.31635","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31635v1 Announce Type: new \nAbstract: Clinical trajectory models are usually evaluated by next-event accuracy on observed histories. Simulation is different: models must condition on their own generated events, allowing errors to compound. Although this problem is well known in sequence modelling, it has not been systematically quantified for clinical trajectory simulators. We developed EDSim-Bench to evaluate this failure mode using 425,028 MIMIC-IV-ED stays, with external replication on MC-MED, and release the evaluation protocol and scoring code. Starting from held-out visit pref","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31058,"title":"Enhancing generalization in endwall film cooling prediction: Incorporating the superposition principle into transformer-based neural operators","url":"https://arxiv.org/abs/2609.31633","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31633v1 Announce Type: new \nAbstract: In this study, a physics-enhanced neural operator framework is proposed to enhance the generalization prediction ability of the cooling layout of a turbine endwall with variable number of film holes. Specifically, inspired by the film cooling superposition principle, we propose a film cooling prediction model, namely superposition-based deep neural operator (SDNO), that divides the endwall temperature field prediction into two stages. In the first stage, the cooling layout of a turbine endwall is divided into several sub-parts with randomly assi","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31057,"title":"EEGAgentBench: Benchmarking LLM Agents on Short- and Long-Horizon EEG Analysis","url":"https://arxiv.org/abs/2609.31632","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31632v1 Announce Type: new \nAbstract: Electroencephalography (EEG) analysis is evolving from short-segment classification toward long-horizon interpretation that demands iterative evidence accumulation, multi-step reasoning, and coordinated use of specialized signal-processing tools. Although large language models (LLMs) have recently shown promise as autonomous agents for EEG analysis, existing EEG agentic evaluations remain fragmented, covering limited tasks over narrow temporal horizons with inconsistent protocols, and providing no comprehensive assessment of agents' reasoning, t","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31056,"title":"OMP-MoE: Efficient Expert Pruning for Mixture-of-Experts LLMs via Orthogonal Matching Pursuit","url":"https://arxiv.org/abs/2609.31631","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31631v2 Announce Type: new \nAbstract: Mixture-of-Experts (MoE) models enable efficient scaling of large language models but face critical deployment challenges due to massive memory requirements. Existing pruning methods either incur prohibitive search costs or neglect the dynamic interdependencies between experts. To address these challenges, we present OMP-MoE, a novel training-free compression framework for reducing expert redundancy in MoE-based LLMs. Based on observations of expert contribution patterns, we reformulate the pruning problem as a sparse signal reconstruction task","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31055,"title":"Replay in the Silent Degrees of Freedom: Continual Learning Without an Offline Phase","url":"https://arxiv.org/abs/2609.31630","source":"arxiv · cs.LG","sources":["arxiv · cs.LG"],"summary":"arXiv:2609.31630v1 Announce Type: new \nAbstract: Replay-based continual learning almost always consolidates in a dedicated offline phase or by interleaving replayed samples with the input stream, whereas brains also consolidate during wakefulness through local sleep, brief use-dependent off-periods of individual circuits. We ask whether a network trained by local, biologically constrained rules can consolidate with no offline phase at all. An isolation rule confines replay updates to hidden synapses invisible to the current input under k-winner-take-all dynamics, with optimiser state advanced","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31054,"title":"ScopeIF: Improving Scope-Aware Precise Instruction-Following in Large Language Models via Graded Reward Modeling","url":"https://arxiv.org/abs/2609.32189","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.32189v1 Announce Type: new \nAbstract: Precise instruction-following is a fundamental ability of large language models (LLMs), requiring their outputs to strictly satisfy objective constraints in input instructions. In complex application scenarios, these constraints often possess diverse scopes that govern specific response segments rather than the entire output. However, existing optimization methods often neglect constraint scope during data construction and rely on binary per-constraint rewards, yielding limited data diversity and sparse supervision for complex constraints. To th","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31053,"title":"Typed Decision Models: An Early Evidence Audit and Evaluation Checklist","url":"https://arxiv.org/abs/2609.32160","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.32160v1 Announce Type: new \nAbstract: Typed decision models (TDMs) return probability distributions over caller-defined options without generating text. TypeSafe released Jev, a commercial typed decision model, on 15 September 2026, and a small body of evaluation and replication work appeared within days. We review 28 papers posted between 19 and 24 September and relate their findings to earlier work on label-probability classification, constrained decoding, reranking, calibration, and model cascades. In this early literature, the typed readout itself has not shown an independent ac","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31052,"title":"Using LMs to Model the Effects of Context and Coreference during Sentence Comprehension","url":"https://arxiv.org/abs/2609.32119","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.32119v1 Announce Type: new \nAbstract: Language models (LMs) are often used as a tool to model human language processing. Recent studies suggest that severely restricting LMs' context window improves their fit to human psycholinguistic data by simulating human working memory constraints. However, it is possible that this strict memory-decay approach overlooks humans' reliance on long-range structural representations, such as discourse structre. In this work, we systematically vary the context window size of GPT-2 across four large-scale naturalistic English reading-time datasets and","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31051,"title":"mu-bench: A Multilingual Utterance Transcription Benchmark","url":"https://arxiv.org/abs/2609.32082","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.32082v1 Announce Type: new \nAbstract: Voice agents depend on accurate automatic speech recognition (ASR) to act on what callers say, yet ASR is evaluated on read, English-centric speech with word error rate (WER), which penalizes surface rather than semantic differences. We introduce mu-bench, a dataset of 4,270 caller utterances from 250 phone calls to an AI banking agent in English, Spanish, Turkish, Vietnamese, and Mandarin, centered on form-field inputs such as names, email addresses, and confirmation codes. We release Utterance Error Rate (UER), an LLM judge of whether a transc","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31050,"title":"Quantization Thresholds Replicate, Failure Modes Do Not: A Three-Model Study of Agentic Tool Use in Polish from 8-bit to 2-bit","url":"https://arxiv.org/abs/2609.32042","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.32042v1 Announce Type: new \nAbstract: We ask how GGUF quantization affects agentic tool use in Polish and whether the effects generalize across models. We introduce PolAgentBench, a deterministic benchmark with Polish prompts and English tool schemas: a 67-task main suite (15 adversarial probes, 52 hard-tier tasks) and a 46-task arithmetic isolation ladder. Three models span two axes of variation: Bielik-11B-v3.0 and its pruned, distilled child Bielik-Minitron-7B-v3.0 isolate model compression, and Llama-PLLuM-8B adds a change of pretraining family. Each is measured at six precision","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31049,"title":"Before the Rollout Ends: Early Terminal Reward Prediction for Long-horizon Coding Agents","url":"https://arxiv.org/abs/2609.31995","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.31995v1 Announce Type: new \nAbstract: Long-horizon coding agents receive verifiable rewards only after completing expensive sequences of tool calls. This increases inference cost, amplifies early wrong hypotheses, and can lead to sparse terminal reward and unstable training. We introduce Contextual Early Reward (CER), which predicts terminal reward through behavioral evidence in a trajectory prefix. CER synthesizes adaptive rubrics specific to the current task and stage through experiences summarized from related historical tasks. In test-time scaling on SWE-bench Verified, CER impr","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31048,"title":"Communication between Frozen Large Language Models via Prompt Optimization in a Referential Game","url":"https://arxiv.org/abs/2609.31989","source":"arxiv · cs.CL","sources":["arxiv · cs.CL"],"summary":"arXiv:2609.31989v1 Announce Type: new \nAbstract: We study communication between two frozen large language models from different providers, with different tokenizers, accessed through their API endpoints. The two play a referential game: one sees an object and describes it in a short fixed-length message over a small alphabet; the other must pick that object out of a candidate set. Neither model's weights are updated. Each agent's prompt is rewritten by an isolated prompt optimizer whose reflection model reads that agent's scored interactions. In the positional setting, optimized prompts carry","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"}]},{"key":"robotics","name":"机器人 (具身智能)","description":"人形机器人 / 具身大模型 (VLA) / 行业融资 / 学术论文 — 国内外混合源","color":"#db2777","tags":["人形机器人","具身大模型","公司","融资","应用","学术","政策"],"articles":[{"id":31011,"title":"Planning Oriented 3D Scene Completion via Coupled TUDF Occupancy Representation Learning from Partial Observations","url":"https://arxiv.org/abs/2609.36543","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36543v1 Announce Type: new \nAbstract: Partial observability remains a fundamental challenge in robotic navigation, where limited sensor coverage and occlusions leave large portions of the environment unobserved. Existing scene completion methods primarily focus on improving incomplete mapping or reconstructing partially observed 3D structures, but rarely investigate how scene completion can be designed to benefit downstream tasks such as path planning. In this work, we propose a path-planning-oriented 3D scene completion framework that moves beyond pure occupancy modeling toward a c","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31010,"title":"Reactive Real-Time Flow Policies via Asynchronous Distribution Alignment","url":"https://arxiv.org/abs/2609.36540","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36540v1 Announce Type: new \nAbstract: Generalist robot policies such as vision-language-action models (VLAs) have achieved remarkable generalization, but their inference delays can conflict with the demands of real-time control. Asynchronous execution avoids pauses between action chunks by predicting the next sequence of actions while the robot carries out the previous one. In this paper, we study whether asynchronous execution produces the same action distribution as the original VLA. We find that, for non-Markovian demonstrations, asynchronous execution can produce a fundamentally","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31009,"title":"Asymmetric Scout-Worker Reconnaissance for Route Validation in Unknown Environments","url":"https://arxiv.org/abs/2609.36537","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36537v1 Announce Type: new \nAbstract: This paper studies asymmetric scout-worker reconnaissance in unknown environments, where a small, agile autonomous scout explores routes for a larger worker robot that must visit an ordered sequence of goal locations. Because the scout has a smaller footprint and greater mobility, a scout-traversable route may be infeasible for the worker; worker feasibility must therefore be inferred from scout observations. This setting is not explicitly addressed by existing exploration and replanning methods, which typically assume a single traversability mo","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31008,"title":"Trajectory-Level Mode Guidance for Controllable Diffusion-Based Multi-Robot Motion Planning","url":"https://arxiv.org/abs/2609.36530","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36530v1 Announce Type: new \nAbstract: Motion planning often admits multiple feasible solutions, making multimodal generation valuable, particularly for flexible multi-robot coordination. Diffusion models naturally learn such trajectory distributions, yet incorporating coarse and partial trajectory priors without restricting generation remains challenging. Such priors indicate a desirable region of the solution space rather than a single solution, motivating conditioned generation that preserves multimodality. In this paper, we guide trajectory generation in the clean trajectory spac","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31007,"title":"LIBERO-MAX: Do Robot Policies Adapt When the World Changes?","url":"https://arxiv.org/abs/2609.36518","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36518v1 Announce Type: new \nAbstract: Robots must often continue a task after a target moves, the viewpoint shifts, or an obstacle appears, even though their earlier observations and committed actions reflect the previous scene. Many simulation robustness benchmarks fix external conditions at reset, leaving this temporal challenge underexamined. We introduce LIBERO-MAX, a benchmark of 8,000 paired cases spanning eight types of changes to geometry, observations, appearance, clutter, and paths. Each pair compares task execution with and without a mid-task event, holding the task, init","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31006,"title":"Closed-Form Cartesian Forward Kinetostatics for Spatial Multi-Segment Tendon-Driven Continuum Robots","url":"https://arxiv.org/abs/2609.36495","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36495v1 Announce Type: new \nAbstract: Forward kinetostatics of spatial tendon-driven continuum robots typically requires a nonlinear equilibrium solve for each actuation input. This paper develops a force-to-Cartesian-configuration model with a closed-form solution in quadratures for spatial multi-segment robots under tendon actuation. The Cartesian backbone centerline and accumulated material twist serve as generalized coordinates, from which the strain measures and tendon geometry are derived. Variational equilibrium yields explicit axial and bending relations and establishes zero","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31005,"title":"Staircase Policy: Streaming Inference for World-Action Models with Large Action Chunks","url":"https://arxiv.org/abs/2609.36471","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36471v1 Announce Type: new \nAbstract: World-Action Models (WAMs) improve robotic manipulation by conditioning action generation on predicted future observations, but future prediction adds further inference overhead to already expensive iterative action generation. Action chunking can amortize this cost over multiple actions, yet performance degrades over long execution horizons because later actions remain conditioned on stale observations. We introduce STAIRCASE POLICY, a streaming inference and training framework that turns a flow-matching VLA into a JEPA-style WAM and partitions","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31004,"title":"FineART: Fine-grained Annotated Robotic Trajectory Dataset and Vision-Language-Action Model for Bimanual Manipulation","url":"https://arxiv.org/abs/2609.36416","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36416v1 Announce Type: new \nAbstract: Robots operating in real-world environments must execute complex, multi-step bimanual tasks over long horizons rather than single, isolated actions. Current manipulation datasets struggle to support this capability: although single-arm datasets reach hundreds of thousands of trajectories, they typically provide only one high-level instruction per episode while the rare bimanual effort that does label subtasks annotates only a fraction of its hours. We present FineART, a densely annotated bimanual manipulation dataset of 40,543 episodes, 1,718 ho","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31003,"title":"One from Infinity: Actualizing Futures from Pretrained World Models into Robot Actions","url":"https://arxiv.org/abs/2609.36413","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36413v1 Announce Type: new \nAbstract: A pretrained video world model admits many plausible futures for a scene, but a robot must realize the exact task-conditioned one. To turn world models into executable robot policies, existing methods fine-tune the heavy world model backbone using large-scale robot data and computational resources. Challenging this status quo, we argue that the expensive part has already been paid in the world model pretraining since the representation space of a video world model lays out the diverse potential futures. In this case, what remains is to select th","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31002,"title":"DORA: Divergence-Oriented Data-Relay Algorithm for Partially Connected Robot Teams","url":"https://arxiv.org/abs/2609.36395","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36395v1 Announce Type: new \nAbstract: Teams of unmanned aerial vehicles (UAVs) deployed for search and monitoring missions frequently operate as partially connected networks, forcing each robot to trade off exploring the environment against relaying information to teammates. This tradeoff is especially acute when robots are semantically heterogeneous: an observation that appears uninformative to the robot that made it may be critical to a teammate with complementary detection capabilities. In this work, we formalize this setting as the heterogeneous mission-aware coverage (HMAC) pro","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31001,"title":"Design and Validation of an Antagonistic Tendon-Driven Dexterous Robotic Hand with Bidirectional Operation","url":"https://arxiv.org/abs/2609.36241","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36241v1 Announce Type: new \nAbstract: Dexterous robotic hands typically reproduce human hand morphology but inherit its one-sided grasping workspace, requiring wrist or arm reorientation to grasp from the opposite side. Existing reversible hands generally rely on non-anthropomorphic, soft, or task-specific finger arrangements, whereas conventional five-digit anthropomorphic hands remain designed primarily for palmar-side grasping. This paper presents an anthropomorphic, human-scale (200 mm length), lightweight (220 g), 3D-printed, 17-DoF robotic hand built on a bidirectional antagon","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31000,"title":"Test-Time Adaptation of Manipulation Policies Under Actuator Degradation","url":"https://arxiv.org/abs/2609.36182","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36182v1 Announce Type: new \nAbstract: Robot manipulation policies are usually trained under the assumption that a commanded action produces the same motion as it did during training even after hours of operation. Real hardware violates this assumption as the motors gradually heat up, current saturates near contact, voltage sags under load, thus the same policy action can produce a weaker, delayed, or noisier motion. These conditions are already measured by onboard telemetry, such as joint temperature, motor current, and supply voltage, yet this signal is typically used only for logg","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30999,"title":"SkillWeaver: Agentic Exploration over Neural Interaction Skills for Scalable Robot Data Generation","url":"https://arxiv.org/abs/2609.36171","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36171v1 Announce Type: new \nAbstract: Large-scale demonstrations have driven unprecedented progress in robot learning, yet collecting robot data through teleoperation is expensive and difficult to scale to diverse environments and long-horizon tasks. Simulation offers a scalable alternative, but existing data-generation pipelines often rely on open-loop controllers, scripted skill sequences, or task-specific programs. We introduce SkillWeaver, an agentic framework that autonomously generates robot experience by exploring over Neural Interaction Skills (NIS): reusable, parameterized,","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30998,"title":"KPI: A Promptable Kernel for Physical Interaction on Humanoids","url":"https://arxiv.org/abs/2609.36151","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36151v1 Announce Type: new \nAbstract: Humanoids now walk, balance and reach with remarkable generality: one whole-body tracking policy follows references from a human, or from an end-to-end policy. That generality travels in the trajectory, and a trajectory alone carries limited information about the interaction it should produce: at contact, the executing controller determines how the robot behaves. Single-task policies usually reach hard interactions by optimising trajectory and controller together in simulation; general stacks usually assume a preset or hand-chosen controller. We","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30997,"title":"Scouting the Dynamics Gap: Test-Time Policy Adaptation via Action-Outcome Feedback","url":"https://arxiv.org/abs/2609.36107","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36107v1 Announce Type: new \nAbstract: While pretrained robotic policies exhibit impressive capabilities in controlled environments, unobserved physical properties and dynamics require these policies to rapidly adapt during deployment. Existing test-time adaptation methods typically rely on sparse scalar rewards, failing to exploit the rich geometric and dynamic feedback from the environment during physical interaction. To address this challenge, we propose SCOUT, a dynamics-aware meta-learning framework that enables manipulation policies to rapidly adapt by continuously revising the","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30996,"title":"MagNav: A Dual-Core Magnetic Track Guidance Framework for Lighting-Invariant Navigation in Two-Wheeled Robots","url":"https://arxiv.org/abs/2609.36091","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36091v1 Announce Type: new \nAbstract: Two-Wheeled Inverted Pendulum (TWIP) robots are useful for studying how to control systems that are naturally unstable and have fewer actuators than degrees of freedom. Adding autonomous line-following to these robots is challenging because steering and balancing are closely linked. Most existing systems use infrared sensors, which can be affected by changes in lighting, such as sunlight or shadows, making them reliable only indoors. This paper presents a self-balancing robot that can follow a line using a magnetic track guidance system. By usin","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30995,"title":"SAKI: Skill Assembly and Kinematic Imitation from Human Videos for Long-Horizon Mobile Manipulation","url":"https://arxiv.org/abs/2609.36031","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36031v1 Announce Type: new \nAbstract: Learning from human videos offers a promising route to acquiring diverse manipulation skills. Extending this capability beyond tabletop settings to long-horizon mobile manipulation requires adapting and composing demonstrated interactions across changing scenes and robot configurations. We present Skill Assembly and Kinematic Imitation (SAKI), a framework connecting human-video skill acquisition, cross-demonstration assembly and closed-loop whole-body execution. SAKI prepares reusable object-centric skills that preserve task-critical interaction","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30994,"title":"In-Context Learning for Robots: Methods and Applications","url":"https://arxiv.org/abs/2609.36012","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.36012v1 Announce Type: new \nAbstract: General-purpose robots must infer what a new task requires and translate that understanding into appropriate physical action. In-context learning (ICL) for robots supports this process by using demonstrations and interaction to direct existing competence with neural parameters held fixed during deployment. We organize this literature review around the interfaces connecting contextual evidence to execution, distinguishing four families: context-conditioned policies, geometric demonstration transfer, world-model-based control, and skill- and agent","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":30993,"title":"Passive-Dynamic-Walking-Inspired Dynamics Guidance for Energy-Efficient Humanoid Locomotion","url":"https://arxiv.org/abs/2609.35935","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.35935v1 Announce Type: new \nAbstract: Learning energy-efficient humanoid locomotion requires discovering mechanically economical gait coordination, not merely reducing actuator effort. Reinforcement learning promotes efficiency through effort-related reward penalties, which guide the step-to-step mechanics of walking only indirectly. This article proposes a framework inspired by passive dynamic walking (PDW) that temporarily creates slope-equivalent conditions favorable to economical gait discovery and removes all PDW-specific guidance before nominal-dynamics optimization. During ea","tags":[],"cluster_size":1,"ts":"2026-09-30T04:00:00"},{"id":31012,"title":"【国际动态】特斯拉 Optimus 量产再进一步：得州机器人超级工厂主体接近完工 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQWDhXLXJFeGJnUTR4QnNiUGY5ak4wVVNaT2IyUlZFZm9weGF6VGRLVWtCMkNPdC1EbDBnNDNuOVg1QmN0bmNxVndidDdNOWVvVGxId2x2UEVmSjZCZ3daejFpTTE2U1hKNGVSYnctV1BRY1BwWDNEYnFBNENvUWV4bEVZTVQ3NDFCVmh4LQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQWDhXLXJFeGJnUTR4QnNiUGY5ak4wVVNaT2IyUlZFZm9weGF6VGRLVWtCMkNPdC1EbDBnNDNuOVg1QmN0bmNxVndidDdNOWVvVGxId2x2UEVmSjZCZ3daejFpTTE2U1hKNGVSYnctV1BRY1BwWDNEYnFBNENvUWV4bEVZTVQ3NDFCVmh4LQ?oc=5\" target=\"_blank\"\u003e【国际动态】特斯拉 Optimus 量产再进一步：得州机器人超级工厂主体接近完工\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-29T23:10:57"},{"id":31013,"title":"特斯拉机器人产量提升10倍 - 手机新浪网","url":"https://news.google.com/rss/articles/CBMifkFVX3lxTE5MS0U2QzdpUGxPRm5YZzQwcEkxM3J4bXBGcmVFMG55MTYzTUUxdVF1OW1FMzRUWGlaM3NUbW5SZ3pjaUhrcFZhRDFFODE0dFduNDg0RHhQTGlGWTVWMXBJWW4tVXZ6bUNjYTRlYTdOdUg2M05LQlJDYlo5WnFJQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMifkFVX3lxTE5MS0U2QzdpUGxPRm5YZzQwcEkxM3J4bXBGcmVFMG55MTYzTUUxdVF1OW1FMzRUWGlaM3NUbW5SZ3pjaUhrcFZhRDFFODE0dFduNDg0RHhQTGlGWTVWMXBJWW4tVXZ6bUNjYTRlY // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
