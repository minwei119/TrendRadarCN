allstreetcn.com/livenews/3158881","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、核心财务业绩与指引。\n\n1、打破历史纪录的2026财年第四季度（Q4 FY26）：\n\nRPO（履约义务）：Palo Alto Networks首次突破200亿美元大关，达到212亿美元（同比增长34%）。\n\nNGS ARR（下一代安全年度可重复订阅收入）：达到91亿美元（同比增长63%）；仅在第四财季单季就增加了近10亿美元 的净新增NGS ARR。\n\n单季营收达到34.1亿美元（同比增长34%）；全财年营收达到115亿美元。\n\n利润与现金流：全财年Non-GAAP运营利润率升至29.2%（同比提升40个基点）；全财年调整后自由现金流（FCF）达44.1亿美元（自由现金流利润率38.4%）。\n\n2、2027财年第一季度（Q1 FY27）指引：\n\n预计NGS ARR为95.4亿-95.6亿美元（同比增长63%）。\n\n预计营收为33亿-33.1亿美元（同比增长33%-34%）。\n\n预计Non-GAAP EPS为0.96-0.98美元。\n\n3、2027全财年指引：\n\n预计营收达到141亿-142亿美元（同比增长23%-24%）。\n\n预计NGS ARR达到110.75亿-111.75亿美元（同比增长22%-23%）。\n\n预计Non-GAAP EPS为4.16-4.19美元；运营利润率预计为29.5%。\n\n目标回顾：公司仍坚定保持在实现2030财年200亿美元NGS ARR的轨道上。","tags":[],"cluster_size":1,"ts":"2026-09-01T23:45:41"},{"id":25052,"title":"华尔街见闻早餐 | 2026年9月2日","url":"https://wallstreetcn.com/livenews/3158840","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美伊冲突升级，美油盘中涨近6%，一个月来首次涨破90美元，全球主权债息指标创2008年来新高；美股三大指数三连阴，纳指跌1%，芯片指数回落超2%，新CEO上任首日苹果反弹近3%，大幅上调全年指引的戴尔盘后一度涨超10%；日元失守160，回落至美干预汇市以来低位。\n\n中国国家主席出席上合组织成员国元首理事会会议，并发表重要讲话《共同倡导平等有序的世界多极化 实现更加公正合理的全球治理》。\n\n上海合作组织二十五周年比什凯克宣言发布，重申谴责对伊朗领土发动军事打击的立场，主张以政治和外交手段解决冲突。\n\n中国8月RatingDog制造业PMI升至两个月高位51.5，出口新订单增速六个月最快，出厂价格年内首现下滑。\n\n中国两部门：9月1日起外籍个人股息红利不再免征个税。国内三部门发布《汽车行业境外竞争行为与合规建设指引》：规范境外定价秩序，强化车联网数据合规。\n\n美军称开始打击伊朗境内革命卫队目标，特朗普威胁若伊报复将遭更猛烈打击，伊军方称开始反击、击落一美无人机。\n\n两艘油轮驶离霍尔木兹海峡遭袭；美国被曝考虑对伊朗“定期打击”护航；贝森特称该海峡两年内或被“绕过”，将成“一文不值水域”；伊议长：绝不允许美推动海峡南线通航。\n\n贝森特会见日央行行长释放强烈信号：美方支持日元走强，强调避免汇率过度波动。\n\n美国8月ISM制造业指数小幅回落，不及预期，但仍维持在近四年高位。美国7月JOLTS职","tags":[],"cluster_size":1,"ts":"2026-09-01T23:25:21"},{"id":25053,"title":"Credo分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3158849","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、 核心财务业绩与指引。\n\n1、Credo Technology第一财季业绩创新高：营收达到创纪录的4.79亿美元，季环比增长10%，同比增长115%（连续七个季度实现三位数同比增长）。\n\n利润率与净利润：Non-GAAP毛利率达68%，Non-GAAP净利润超过2.36亿美元（同比增长140%），Non-GAAP营业利润率达48.2%。\n\n现金与资产：期末现金及现金等价物为7.643亿美元（因完成收购Dust Photonics进行了现金支出）。\n\n客户集中度：本季度有4家客户各占总营收的10%以上（分别占比33%、28%、13%和10%），公司正持续扩大hyperscaler（超大规模云服务商）和neocloud（新云）客户群以实现多元化。\n\n2、第二季度指引：预期营收介于5.25亿-5.35亿美元。\n\nNon-GAAP毛利率预计为67%-69%。\n\n2027全财年强劲展望：预期全财年总营收实现\u003e85%的同比增长。\n\n全年光互连（Optical）业务营收将超过6亿美元。\n\n全年Non-GAAP净利率保持在50%左右。","tags":[],"cluster_size":1,"ts":"2026-09-01T23:06:39"},{"id":25054,"title":"外部因素扰动港股反弹进程，机构建议围绕基本面布局","url":"https://wallstreetcn.com/livenews/3158837","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"在美联储主席释放鹰派信号、长端美债收益率高企等因素扰动下，港股市场在8月承压，未能延续7月强劲反弹的态势，9月1日延续调整态势。不过从南向资金流向看，8月南向资金再度净流入逾百亿港元，市场并未出现明显悲观情绪。","tags":[],"cluster_size":1,"ts":"2026-09-01T23:00:03"},{"id":25055,"title":"大型IPO项目落地，港股优质资产供给持续扩容","url":"https://wallstreetcn.com/livenews/3158836","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"9月首个交易日，港股市场迎来大型IPO项目落地。跨境电商巨头希音-W正式在港交所主板挂牌上市，募资规模约132亿港元。同日，百度集团正式完成由香港联交所的第二上市地位向香港联交所及纳斯达克双重主要上市的转换。分析人士认为，大型IPO项目接连登陆与双重主要上市机制持续深化，标志着港股市场优质资产供给渠道进一步拓宽。随着头部科技企业、行业龙头及中概股回归项目陆续推进，港股市场正迎来一波高质量的上市资源扩容。优质资产供给增加，将进一步提升港股对全球资金的吸引力，并为市场流动性改善和估值修复提供支撑。（中证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:59:09"},{"id":25056,"title":"券商分仓佣金上半年近乎翻倍，卖方研究加速向价值创造转型","url":"https://wallstreetcn.com/livenews/3158828","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"券商分仓佣金上半年成绩单出炉，行业迎来久违的高增长。Choice数据显示，上半年券商获得公募基金分仓佣金收入合计约87.24亿元，相较2025年同期的44.74亿元接近翻倍。在收入排名前50的券商中，49家实现同比正增长，22家收入实现翻倍。业内人士认为，规模快速扩张背后，交易活跃度抬升与基金产品扩容构成核心驱动力。在费率改革持续推进的大背景下，卖方研究业务模式正从“通道收费”转向“价值创造”，各家券商也在“内外兼修”中形成自己的打法。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:41:28"},{"id":25057,"title":"派发2500多亿元“红包”，A股上市银行中期分红阵营扩大","url":"https://wallstreetcn.com/livenews/3158824","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着2026年上市银行半年报季收官，“中期分红”成为最受市场关注的关键词。截至8月底，各类型银行相继披露中期分红计划，合计拟派发现金红利超过2500亿元，参与中期分红的A股银行数量已从去年的24家扩大至31家。从结构特征看，国有大行分红总量最大；股份制银行平均分红比例相对较高，分红力度较为突出；城商行整体分红比例略低，呈现一定的梯度差异。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:29:58"},{"id":25058,"title":"不爱“绿鞋”爱“入通”，港股IPO涌现新潮流","url":"https://wallstreetcn.com/livenews/3158821","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"初步统计发现，今年以来，滨化股份、普源精电、沃尔核材、国恩科技、兆威机电、美格智能、广合科技、国民技术等多家公司在发行H时，选择不设绿鞋机制，并实现首日纳入港股通。相比之下，去年仅有吉宏股份一家公司选择了该机制。这一现象的背后，是A股公司赴港上市对南向资金越来越重视。随着南向资金占港股总交易量比重显著上升，南向资金对港股的边际定价权明显增强。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:26:12"},{"id":25059,"title":"并购重组市场活跃度稳步提升，交易逻辑转向产业价值整合","url":"https://wallstreetcn.com/livenews/3158818","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股并购重组市场活跃度稳步提升。权威数据显示，今年前7个月，A股市场披露资产重组方案1425单，其中重大资产重组78单。在业内人士看来，此轮并购重组市场回暖，在交易数量提升的同时，交易逻辑逐步转向产业价值整合，交易质量导向显著增强，推动资本市场与产业升级形成正向循环。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:18:58"},{"id":25060,"title":"个人持有ETF比例半年跃升至43%","url":"https://wallstreetcn.com/livenews/3158816","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"随着2026年基金中期报告披露完毕，ETF持有人结构浮出水面。从总体来看，过去半年来，个人投资者持有ETF的比例大幅提升。数据显示，截至6月底，个人投资者持有ETF份额从2025年底的1.08万亿份增至1.25万亿份，个人投资者的持有比例从33.07%增至43.01%。从股票型ETF持有人结构变化来看，截至6月底，个人投资者持有股票型ETF份额从2025年底的7143.51亿份增至8106.93亿份，个人投资者持有比例从32.59%增至43.61%。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-01T22:17:28"},{"id":25061,"title":"9月2日热门中概股多数下跌，阿里巴巴跌1%，贝壳涨超3% - finance.sina.com.cn","url":"https://news.google.com/rss/articles/CBMiekFVX3lxTE5Od3ZiOGpBVnhxSXpqRl9KNU85OUV2SE1RRmd6cldQTGtQWnFRd0tnNExOSmk0OXljRWhfV095TGdSdl9sX1RmeVBtQ1dnR3A1OUJPTHFUTGxTS3J1V3VaUUkwaFlCU0ZWVW1fdDVOUmcySHFsd3Z1THRR?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiekFVX3lxTE5Od3ZiOGpBVnhxSXpqRl9KNU85OUV2SE1RRmd6cldQTGtQWnFRd0tnNExOSmk0OXljRWhfV095TGdSdl9sX1RmeVBtQ1dnR3A1OUJPTHFUTGxTS3J1V3VaUUkwaFlCU0ZWVW1fdDVOUmcySHFsd3Z1THRR?oc=5\" target=\"_blank\"\u003e9月2日热门中概股多数下跌，阿里巴巴跌1%，贝壳涨超3%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003efinance.sina.com.cn\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-09-01T21:11:00"},{"id":25062,"title":"周二（9月1日）纽约尾盘，标普500股指期货最终跌0.63%，道指期货跌0.75%，纳斯达克100股指期货跌1.26%。\ ze":1,"ts":"2026-09-02T00:24:02"},{"id":25230,"title":"Meta 发布首个实时音频感知 AI 模型，支持 20 余人分轨转写","url":"https://www.ithome.com/0/997/218.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"7c59\"\u003eIT之家 9 月 2 日消息，科技媒体 9to5Mac 昨日（9 月 1 日）发布博文，报道称 Meta 公司推出 Muse Voice Transcribe，\u003cstrong\u003e这是其首个实时音频感知模型。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"6ddb\"\u003e开发者可通过 Meta Model API 调用该能力，定价为每 1000 分钟音频 3 美元\u003cspan class=\"exch-money-value \"\u003e（现汇率约合 20.2 元人民币）\u003c/span\u003e，等同每小时 0.18 美元\u003cspan class=\"exch-money-value \"\u003e（现汇率约合 1.2 元人民币）\u003c/span\u003e。\u003c/p\u003e\u003cp data-vmark=\"9c92\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/d4d2161a-3d95-4415-80a2-e6862f384d0f.png\" w=\"898\" h=\"1383\" data-mpos=\"2,0\" data-weibo=\"0\"  data-snap-from=\"%7B%22from%22%3A%22x%22%2C%22url%22%3A%22https%3A%2F%2","tags":[],"cluster_size":1,"ts":"2026-09-02T00:23:26"},{"id":25231,"title":"奥尔特曼不喜欢智能眼镜：和戴着摄像机的人讲话很不舒服，Meta 扎克伯克不用担心 OpenAI 来抢生意","url":"https://www.ithome.com/0/997/217.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"372f\"\u003eIT之家 9 月 2 日消息，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）当地时间周二在接受 Alex Heath 的《Sources Podcast》采访时明确表示，他不喜欢智能眼镜。\u003c/p\u003e\u003cp data-vmark=\"5765\"\u003e奥尔特曼直言“觉得跟戴着摄像机和灯光装置的人交谈非常不舒服”。这一表态无疑是在告诉马克 · 扎克伯格暂时无需担心 OpenAI 去抢 Meta 智能眼镜的生意。\u003c/p\u003e\u003cp data-vmark=\"89fc\"\u003e事实上，奥尔特曼对智能眼镜的态度早有端倪。去年在参加艾伦公司太阳谷峰会期间，当记者在场边询问他当时所戴太阳镜是否为智能眼镜时，他很快澄清：“绝对不是，我不喜欢智能眼镜。”\u003c/p\u003e\u003cp data-vmark=\"0cc6\"\u003eMeta 是智能眼镜领域的主要参与者之一，虽然公司未单独披露眼镜收入，但在财报中多次表示 AI 眼镜销量增长正在抵消 Quest 头显销量放缓的影响。今年 7 月，Meta 报告显示其 Reality Labs 部门（含消费硬件销售）在 2026 年第二季度实现营收 4.31 亿美元\u003cspan class=\"exch-money-value \"\u003e（IT之家注：现汇率约合 29.04 亿元人民币）\u003c/span\u003e，同比增长 6100 万美元。\u003c/p\u003e\u003cp data-vma","tags":[],"cluster_size":1,"ts":"2026-09-02T00:22:15"},{"id":25232,"title":"OpenAI：即将推出Astra模型 但将限制网安功能 - Sohu","url":"https://news.google.c "https://arxiv.org/abs/2608.29242","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29242v1 Announce Type: new \nAbstract: Collecting contact-rich robot experiences at scale remains a major bottleneck for generalizable manipulation. Beyond data quantity, robot learning also requires diverse experiences across embodiments, viewpoints, and scenes. Human egocentric videos provide abundant physical interactions, but each video captures only a narrow slice of experience under a single body, camera trajectory, and environment. We propose AnyWorld, a cross-embodiment world modeling framework that expands a single human interaction into diverse robot-native rollouts without","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25040,"title":"AdaVLA: Adaptive Step Flow Matching for Training-free Acceleration of Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.29208","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29208v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models, built upon Vision-Language Models (VLMs), have significantly enhanced robotic capabilities by leveraging internet-scale knowledge and multimodal reasoning. However, the intensive computational overhead of VLAs constrains on-device deployment, hindering real-time responses to environmental changes. While various acceleration techniques have been proposed, they often rely on fine-tuning or access to training datasets, which are frequently unavailable due to privacy and proprietary concerns. Moreover, although f","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25039,"title":"Systematic Lightweight Method for Robotics Based on Strain Energy Distribution Optimization","url":"https://arxiv.org/abs/2608.29146","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29146v1 Announce Type: new \nAbstract: Service robots work with people and are highly expected to be lightweight for safety, agility and energy conservation. As a complex mechanical system, a robot consists of a large number of components and has various working configurations and load environments. An effective method for achieving system-level optimal robot design is a crucial requirement, but it poses significant challenges. In this study, we introduce a novel approach to optimize the distribution of strain energy, which can significantly improve the effectiveness of systematic op","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25038,"title":"CGFM-Nav: Cognitive Graph-Field Memory for Semantic-Guided Lifelong Multimodal Embodied Navigation","url":"https://arxiv.org/abs/2608.29114","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29114v1 Announce Type: new \nAbstract: Vision-and-Language Navigation (VLN) requires agents to reason over accumulated observations while continuously exploring unseen regions. However, existing environment representations often struggle to jointly support explicit semantic memory and continuous exploration guidance. To address this challenge, we propose Cognitive Graph-Field Memory (CGFM), a persistent multimodal scene representation that couples explicit relational memory with continuous spatial intuition. CGFM organizes objects, spatial relations, and visual observations into a mu","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25037,"title":"From Multi-Modal Paths to Executable Trajectories: A Trajectory Planning Framework for 4WIS Robots","url":"https://arxiv.org/abs/2608.29108","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29108v1 Announce Type: new \nAbstract: Four-wheel independent steering (4WIS) mobile robots support multiple motion modes, offering high maneuverability in narrow and complex environments. However, existing planning methods often fail to fully exploit these capabilities, leading to suboptimal trajectory quality. To address this limitation, this paper proposes a multi-modal global trajectory planning framework that couples mode-augmented front-end search with mode-consistent segment-wise trajectory optimization. In the front-end stage, Hybrid A* is extended to a four-dimensional state","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25036,"title":"Agri-Sim: Agricultural Simulation Platform for Embodied Intelligence Evaluation in Greenhouse Robotics","url":"https://arxiv.org/abs/2608.29100","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29100v1 Announce Type: new \nAbstract: Agricultural-robot development requires simulation environments that can jointly support realistic scene construction, virtual sensing, autonomous navigation, motion planning, and manipulation-task execution. This paper presents Agri-Sim, a Unity and ROS2-based simulation platform for the closed-loop development and functional evaluation of agricultural robots. The platform contains a configurable tomato-greenhouse environment, a mobile dual-arm harvesting robot, virtual RGB-D, LiDAR, IMU, and joint sensors, and a bidirectional communication int","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25035,"title":"GHOST in the Robots: Real-Time Exocentric Dual-Robot VR Teleoperation from Onboard Cameras","url":"https://arxiv.org/abs/2608.29080","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29080v1 Announce Type: new \nAbstract: Teleoperating multiple robots simultaneously enables additional views and coordinated control. Yet, it poses fundamental challenges: the system must present sensor data cohesively and allow operators to manage multiple robot bases, arms, and cameras while maintaining low latency. Current multi-robot teleoperation systems require multiple operators, rely on autonomy, or restrict operators to high-level commands. We present GHOST: an open-source VR teleoperation system that enables single operator control of two mobile manipulators via direct lowl","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25034,"title":"DREAM: Deployment-Time Demonstration Generation via Real-to-Sim for Scalable Policy Adaptation","url":"https://arxiv.org/abs/2608.29078","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29078v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models have made strong progress in language-conditioned robot manipulation, but improving their performance in a new workspace still often requires action-labeled data from that environment. Collecting such data by human teleoperation is costly, especially when each workspace, object arrangement, or task may require new demonstrations. We present DREAM, a framework that generates fine-tuning data for a pretrained VLA from a captured workspace and a language instruction, without requiring a task-specific human demons","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25033,"title":"Teaching Robot Policies to Humans Using Erroneous Examples","url":"https://arxiv.org/abs/2608.29023","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.29023v1 Announce Type: new \nAbstract: Human-robot collaboration describes the process of humans and autonomous agents working together to accomplish common goals. This process is facilitated best when robot policies, or behaviors in different situations, are made transparent to humans. Demonstration-based explanations have been a focus of human-robot collaboration research, and the field has frequently drawn upon literature from education to improve how humans are taught robot policies. However, no single teaching method has been proven effective across domains, difficulties, learne","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25032,"title":"Hydra: A Navigation World Action Model with Discrete Latent Planning and Continuous Flow-Matching Execution","url":"https://arxiv.org/abs/2608.28995","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28995v1 Announce Type: new \nAbstract: World models let robots imagine possible futures, but exploiting this capability for real-time control is bottlenecked by a representation misalignment: the generative model and the planner operate on decoupled manifolds, so the planner has no shared structure to search over and must instead decode every candidate back into high-dimensional pixel space to evaluate it. This decoding step is a major obstacle to real-time control on physical hardware. In this paper, we present Hydra, a discrete World Action Model that closes this gap by moving the","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25031,"title":"Brain-Language-Action (BLA) Models: Language-Conditioned EEG for Robotics Control","url":"https://arxiv.org/abs/2608.28967","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28967v1 Announce Type: new \nAbstract: Electroencephalography (EEG)-based robotic control is commonly formulated as a direct classification problem, in which electrical neural signals are mapped to a fixed set of discrete actions. However, the limited separability and high noise of EEG signals make it difficult to scale this approach to fine-grained robotic control spaces. We introduce Brain-Language-Action (BLA) models, a framework in which language conditions the interpretation of neural representations for robotic action generation. In a BLA, a small set of reliably distinguishabl","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25030,"title":"Generation of High-Level Concepts in 3D Scene Graphs via Autoregressive Diffusion","url":"https://arxiv.org/abs/2608.28733","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28733v1 Announce Type: new \nAbstract: Indoor 3D Scene Graphs (3DSGs) represent environments as multi-layer hierarchies that connect observed geometric primitives (e.g., planes) to higher-level metric-semantic concepts (e.g., rooms, floors, buildings), enabling incremental spatial reasoning for robotic perception and SLAM. However, classical high-level concept generation approaches rely on hand-crafted rules for specific concept classes, while learning-based methods require separate models for graph structure and spatial node features (e.g., centroids), which limits scalability to no","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25029,"title":"RoboPhys-3D: A Comprehensive Embodied World Model Evaluation via 3D Reconstruction","url":"https://arxiv.org/abs/2608.28718","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28718v1 Announce Type: new \nAbstract: Video world models increasingly serve as data engines, action planners, and simulators for embodied AI, but conventional embodied world model (EWM) benchmarks lack a unified 3D-grounded protocol for establishing whether generated rollouts preserve the underlying 3D scene state or translate into executable actions. We introduce RoboPhys-3D, a 3D-grounded EWM benchmark built on RoboTwin 2.0, covering 50 manipulation tasks across four regimes, with 5,000 episodes and 25,000 multi-view ground-truth videos. A defining feature of RoboPhys-3D is that g","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25028,"title":"RoboGesture: Real-Time Semantic-aligned Co-Speech Gestures Generation for Humanoid Interaction","url":"https://arxiv.org/abs/2608.28693","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28693v1 Announce Type: new \nAbstract: Enabling humanoid robots to respond to human speech with synchronized and semantically meaningful gestures is fundamental to natural human-robot interaction. However, this task faces three critical barriers: the scarcity of semantically rich datasets, the \"modality eclipse\" where models ignore audio cues in favor of kinematic inertia, and the sim-to-real gap regarding physical safety. We propose RoboGesture, a robot-centric framework that co-designs data, modeling, and control to power a complete interactive human-humanoid system in which the ro","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25027,"title":"Cognitively-Grounded On-Device Runtime Learning for Ground Robots in Unknown Physical Environments","url":"https://arxiv.org/abs/2608.28677","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28677v1 Announce Type: new \nAbstract: This paper presents \\ul{CogRun}, a framework that enables safety-critical ground robots to perform cognitively-grounded runtime learning entirely on edge-AI devices in unknown physical environments, without prior maps or perceptual knowledge. CogRun consists of three components: a Learning-Agent, a Rational-Agent, and a Coordinator. The Learning-Agent is novel in cognitive-neural learning architecture, which featurs dedicated replay buffers, cognition-driven experience sampling, and a safety-aware action blending of actor-critic reinforcement le","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25026,"title":"The Potential of Haptic Foundation Models","url":"https://arxiv.org/abs/2608.28664","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.28664v1 Announce Type: new \nAbstract: Despite the success of foundation models in language and vision, their expansion into embodied AI is bottlenecked by a lack of generalized touch sensing. This limitation is especially relevant to consumer electronics, where smartphones, wearables, VR controllers, home robots, and health monitoring devices require safe and adaptive physical interaction. Constrained by hardware heterogeneity and the necessity of active physical data collection, current haptic models remain rigidly task-specific. To overcome these limitations, this article explores","tags":[],"cluster_size":1,"ts":"2026-09-01T04:00:00"},{"id":25025,"title":"RedLight-VLA: Models for traffic-rule grounding and behavioral emphasis in driving policies","url":"https://arxiv.or // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
