- 观点网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBoVlJTMEJhcWczV0tqejRoV3JzWG1aZFBKS0UtR0w4TU1aenN4SHlMaEZBYkVQeU1QVk5IZkhENEdZTjRHNnhWbDFUZUFKeFRweGNjTWR6SzlDcGZ5a1BHZEhn?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBoVlJTMEJhcWczV0tqejRoV3JzWG1aZFBKS0UtR0w4TU1aenN4SHlMaEZBYkVQeU1QVk5IZkhENEdZTjRHNnhWbDFUZUFKeFRweGNjTWR6SzlDcGZ5a1BHZEhn?oc=5\" target=\"_blank\"\u003e阿里巴巴Qwen-Image-3.0上线 文生图0.18元/张起\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e观点网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T00:29:05"},{"id":17061,"title":"分红回购持续推进，券商多管齐下增强投资者信心","url":"https://wallstreetcn.com/livenews/3145005","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月以来，南向资金延续净流入态势，港股市场资金面持续改善。今年以来，除5月出现阶段性净流出外，南向资金整体保持较强配置力度，6月、7月净买入额分别达到271.11亿港元、628.69亿港元，资金回流趋势明显。与此同时，港股主要指数近期持续修复，自6月26日以来，截至8月4日，恒生指数、恒生科技指数分别累计上涨12.03%、10.89%，市场风险偏好逐步回升。","tags":[],"cluster_size":1,"ts":"2026-08-04T23:07:16"},{"id":17062,"title":"调研力度加大，私募选择“两条腿走路”","url":"https://wallstreetcn.com/livenews/3144998","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"经历了上半年科技主线的持续大幅上涨后，A股市场在7月迎来显著的结构性调整。当市场情绪趋于冷静之际，私募机构的调研活动却较为活跃。第三方机构数据显示，7月共有690家私募机构参与到上市公司调研中，覆盖近30个申万一级行业的294家公司，合计调研次数达1578次，较6月增长4.78%。尤为引人关注的是，即便科技板块是7月调整幅度较深的方向，私募机构的调研重心依然牢牢锁定在电子、通信、计算机等科技细分领域，调研次数排名前十的标的中有9只为科技类个股。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-04T22:56:30"},{"id":17063,"title":"“果链”备货旺季启幕，富士康等代工厂招工忙","url":"https://wallstreetcn.com/livenews/3144997","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"进入8月，消费电子市场迎来新品发布季，以苹果新一代产品为核心驱动，整个“果链”上下游加快了“招兵买马”的节奏，为产能爬坡做足准备。记者采访了解到，与往年相比，今年的产业旺季不仅体现在一线工人的规模化招募，富士康等龙头代工厂在工程师岗位上也在不断扩充。此外，资本市场与供应链上下游，正密切关注苹果首款折叠屏手机的进展，蓝思科技、精研科技等产业龙头企业已密集进入研发攻关、产能扩建与量产交付的关键阶段。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-04T22:54:45"},{"id":17064,"title":"7月以来多款分红险新品上市，险企产品竞争从“拼数字”转向“拼投资”","url":"https://wallstreetcn.com/livenews/3144996","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"根据相关政策安排，自7月1日起，分红险演示利率上限从3.9%下调至3.5%。据统计，7月以来，8家保险公司推出了12款分红险新产品。分析人士表示，新产品最大的变化是产品演示利率统一压降至3.5%。这意味着，保险公司产品竞争逻辑变了：从比谁“演示高”转向比谁“兑现实”，即从“拼数字”转向“拼投资”。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-04T22:53:36"},{"id":17065,"title":"A股110份半年报“交卷”，多个赛道持续高景气","url":"https://wallstreetcn.com/livenews/3144994","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股上市公司半年报披露即将进入高峰期。据统计，截至8月4日20时，已有110家公司披露了半年报。其中，68家公司上半年净利润实现同比增长，14家实现扭亏为盈。行业需求的稳步回暖和主营业务的稳健增长，成为驱动上市公司业绩向好的主要因素。梳理已披露的半年报发现，化工、医药、电力、有色等行业经营态势持续向好。宁德时代、药明康德等行业龙头公司已率先发布半年报，上半年业绩均实现强劲增长。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-04T22:45:04"},{"id":17066,"title":"8月公募调查出炉：A股港股获力挺，投资布局趋向均衡","url":"https://wallstreetcn.com/livenews/3144985","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"近期，上海证券报联合天天基金进行了8月基金经理调查，南方基金、博时基金、浦银安盛基金、金鹰基金等多家知名基金公司参与其中。调查结果显示，中国权益类资产依然受到基金经理青睐。但在经历了科技成长板块的显著调整后，基金经理在投资布局上会更趋于均衡。","tags":[],"cluster_size":1,"ts":"2026-08-04T22:14:54"},{"id":17067,"title":"周三亚太盘初，纳指期货跌超0.2%，道指期货涨超0.2%。","url":"https://wallstreetcn.com/livenews/3144983","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周三亚太盘初，纳指期货跌超0.2%，道指期货涨超0.2%。","tags":[],"cluster_size":1,"ts":"2026-08-04T22:03:37"},{"id":17068,"title":"周二（8月4日）纽约尾盘，标普500股指期货最终涨1.93%，道指期货涨1.98%，纳斯达克100股指期货涨3.18%。\n\n罗素2000股指期货涨1.96%。","url":"https://wallstreetcn.com/livenews/3144964","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周二（8月4日）纽约尾盘，标普500股指期货最终涨1.93%，道指期货涨1.98%，纳斯达克100股指期货涨3.18%。\n\n罗素2000股指期货涨1.96%。","tags":[],"cluster_size":1,"ts":"2026-08-04T21:09:12"},{"id":17069,"title":"SpaceX在业绩报告发布前收涨9.4%。","url":"https://wallstreetcn.com/livenews/3144934","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"SpaceX在业绩报告发布前收涨9.4%。","tags":[],"cluster_size":1,"ts":"2026-08-04T20:00:56"},{"id":17070,"title":"中概指数收跌超0.3%，新东方跌4.7%，CQQQ涨约3%，阿里涨超1.3%，金山云涨超9.9%","url":"https://wallstreetcn.com/livenews/3144933","source":" 003e大\u003c/strong\u003e\u003cstrong\u003e容量高速 SRAM 缓存非常适合推理解码等人工智能工作负载\u003c/strong\u003e。Neo Semiconductor 称其\u003cstrong\u003e可将片上 SRAM 容量提升到 GB 级别\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"12ea\" style=\"text","tags":[],"cluster_size":1,"ts":"2026-08-05T01:06:27"},{"id":17321,"title":"AMD 高管：公司相较英伟达的一个关键优势是更加开放","url":"https://www.ithome.com/0/985/782.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"862e\"\u003eIT之家 8 月 5 日消息，AMD 表示，在与英伟达（Nvidia）的 AI 芯片竞争中，公司拥有一个重要优势：更加开放。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"3181\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/89d13d91-010c-4df3-900c-70eb9b675283.jpg?x-bce-process=image/format,f_auto\" w=\"1200\" h=\"675\" data-weibo=\"0\" data-mpos=\"2,0\"  data-vmark=\"0451\"\u003e\u003c/p\u003e\u003cp data-vmark=\"f83a\"\u003eAMD 长期以来一直通过开源 ROCm 软件来推广这一战略。ROCm 用于为人工智能芯片进行编程，由于采用开源模式，任何人都可以免费使用、下载或修改。在周二举行的财报电话会议上，AMD CEO 苏姿丰表示，ROCm 正处于一个“转折点”，过去一年中，该项目获得的开源社区贡献数量增长了 10 倍。\u003c/p\u003e\u003cp data-vmark=\"db55\"\u003e在财报公布前的 7 月，AMD 两名高管接受了 Business Insider 采访，讨论了公司为何认为开放部分核心软件和硬件产品能","tags":[],"cluster_size":1,"ts":"2026-08-05T01:06:17"},{"id":17322,"title":"养猪也要用芯片，这玩意终于造出来了 - 36 Kr","url":"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9QbjluMjBvTWFHN201OGZtTFM3N3FqMFFZNnBOWEMzenFhNmRuT0VyVWNwQU5tQ3hQRk05ellIY2pmOU0wenVmakVIWk0yRjQ?oc=5","source":"GNews · 国内AI媒体","sources":["GNews · 国内AI媒体"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9QbjluMjBvTWFHN201OGZtTFM3N3FqMFFZNnBOWEMzenFhNmRuT0VyVWNwQU5tQ3hQRk05ellIY2pmOU0wenVmakVIWk0yRjQ?oc=5\" target=\"_blank\"\u003e养猪也要用芯片，这玩意终于造出来了\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e36 Kr\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T01:05:05"},{"id":17323,"title":"消息称小米第二代 AI 眼镜延迟到 Q4 或明年发布，相关负责人否认","url":"https://www.ithome.com/0/985/781.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ac07\"\u003eIT之 news.google.com/rss/articles/CBMiVkFVX3lxTE0tYkhwaFFLWm5WbFo5bUFaemY4N1hLaHZWM3F6Z3luUU53Z0hua0NqMW5lbWlOdlhUVEN6YkRkWHhWSWR5YUdUcFRXWldoREtYcFZoSXVR?oc=5\" target=\"_blank\"\u003e一个月9款旗舰，大模型进入「月抛」时代？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e投资界\u003c/font\u003e","tags":[],"cluster_size":2,"ts":"2026-08-04T23:47:00"},{"id":17344,"title":"马斯克预告下周将推 Grok 4.6 模型，改进 AI 监督微调和强化学习","url":"https://www.ithome.com/0/985/750.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"4032\"\u003eIT之家 8 月 5 日消息，在今天（8 月 5 日）召开的 SpaceX 公司 2026 年第 2 季度（截至 6 月 30 日）财报电话会议上，\u003cstrong\u003e马斯克预告将于下周发布 Grok 4.6 模型。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"924c\"\u003e在财报会议上，马斯克表示 Grok 系列 AI 模型进展神速，计划下周发布的 Grok 4.6 模型总参数量拥有 1.5 万亿，重点改进监督微调（SFT）和强化学习（RL）。\u003c/p\u003e\u003cp data-vmark=\"9d16\"\u003eIT之家注：SFT 是指一种在大模型预训练之后，利用高质量的标注数据调整模型参数，使其能够精准适应特定任务和人类交互习惯的技术。\u003c/p\u003e\u003cp data-vmark=\"ef4d\"\u003e\u003cspan class=\"iNqyIf\"\u003e预训练就像让大模型读完图书馆里的所有书籍（掌握通用语言和常识），而 SFT 就像老师拿着“标准答案”手把手教它做题，让它学会按规矩和格式回答问题。\u003c/span\u003e\u003c/p\u003e\u003cp data-vmark=\"6f06\"\u003e马斯克还预告会在未来 3~4 周发布 Grok 4.7 模型，拥有 2.1 万亿个参数，各方面都更胜一筹。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"2e92\"\u003e\u003cimg s","tags":[],"cluster_size":1,"ts":"2026-08-04T23:34:47"},{"id":17345,"title":"Anthropic 与初创公司 Volta 签订 100 亿美元算力采购协议，后者成立仅半年","url":"https://www.ithome.com/0/985/747.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"c857\"\u003eIT之家 8 月 5 日消息，人工智能公司 Anthropic 已与云计算初创企业 Volta Infra Holdings 签署了一项价值 100 亿美元\u003cspan class=\"exch-money-value\"\u003e（IT之家注：现汇率约合 676.59 亿元人民币）\u003c/span\u003e的算力采购协议，锁定未来六年的计算资源。据彭博社报道，Volta 成立仅数月，这笔交易将持续六年。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"a7b9\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/3/c9d125a1-f857-4d71-800d-d2f99b63bd49.jpg?x-bce-process=image/format,f_auto\" w=\"400\" h=\"265\" data-weibo=\"0\" data-vmark=\"7e32\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"4a6f\"\u003e此次提供的算力来自挪威蒂达尔（Tydal）的一座数据中心。该数据中心由比特币矿企 Bitdeer Technologies 运营，采用水力发电供能，并部署了英伟达最新的 Vera Rubin AI 芯片。Volta 表示","tags":[],"cluster_size":1,"ts":"2026-08-04T23:25:20"},{"id":17346,"title":"特斯拉财报电话会议数据：马斯克近半发言聚焦 AI 与机器人业务","url":"https://www.ithome.com/0/985/744.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"dbd2\"\u003eIT之家 8 月 5 日消息，尽管特斯拉上个季度交付了近 50 万辆汽车，约 70% 的收入仍来自汽车销售，但埃隆 · 马斯克正试图让外界相信，特斯拉已经不再是一家传统汽车公司，而是一家人工智能和机器人公司，即便这些 AI 技术中的一部分仍运行在汽车之中。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"c2be\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2025/7/5a808936-e658-4e06-8879-94df764bfee3.png?x-bce-process=image/format,f_auto\" w=\"1440\" h=\"788\" data-weibo=\"0\" data-vmark=\"5df2\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"10a7\"\u003e过去几年，马斯克不断强调，特斯拉真正的未来在于人工智能和机器人业务，例如 Optimus 人形机器人和完全自动驾驶 Robotaxi，而传统汽车制造商所关注的日常业务正逐渐退居次要位置。\u003c/p\u003e\u003cp data-vmark=\"4eeb\"\u003e为了展示这一战略转变，TechCrunch 与纽约金融研究公司 Hudson Labs 合作，\u003cstrong","tags":[],"cluster_size":1,"ts":"2026-08-04T23:20:24"},{"id":17347,"title":"OpenAI称苹果的商业秘密诉讼“草率”且“异常个人化” - 华尔街日报中文网","url":"https://news.google.com/rss/articles/CBMipAFBVV95cUxPcTJmckhDemI2cGtHdUdENU1BZXpsajdQWElkcUJtZTIwUFd0alZ0c3NNVFJYTGNsc3MwSkNEenNmVExNalowcU9YODVnSERKTEdXTEY2eFo0ak1qZ0xXNUFTckdMQWZZMlFzRG8td3BMa09Qb0dMSXptTE02bGNLZXZXTW1qcEZqTW9yUXBaYlkyWUwxUU90N3N2azZhc2QyU0RZWQ?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMipAFBVV95cUxPcTJmckhDemI2cGtHdUdENU1BZXpsajdQWElkcUJtZTIwUFd0alZ0c3NNVFJYTGNsc3MwSkNEenNmVExNalowcU9YODVnSERKTEdXTEY2eFo0ak1qZ0xXNUFTckdMQWZZMlFzRG8td3BMa09Qb0dMSXptTE02bGNLZXZXTW1qcEZqTW9yUXBaYlkyWUwxUU90N3N2azZhc2QyU0RZWQ?oc=5\" target=\"_blank\"\u003eOpenAI称苹果的商业秘密诉讼“草率”且“异常个人化”\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e华尔街日报中文网\u003c/font\u003e","tags":[] It has broad applications in autonomous driving, service robotics, warehouse logistics, human-robot collaboration, crowd navigation, and multi-robot systems. This survey reviews representative works published primarily between 2015 and 2025, with a particular focus on how recent learning-based advances e","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17199,"title":"From Failures to Supervision: DynamicEnvPlan for Robust Long-Horizon Embodied Planning","url":"https://arxiv.org/abs/2608.00613","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00613v1 Announce Type: new \nAbstract: Physical-world interaction is inherently dynamic, as environments can evolve during execution, requiring agents to adapt their plans under non-stationary conditions. We study this challenge through long-horizon embodied planning under environment deviations and execution uncertainty. Existing embodied-task benchmarks can expose such failures, but these failures are usually treated as evaluation outcomes instead of learnable signals for training agents to recover. In this work, we introduce DynamicEnvPlan, a closed-loop framework for high-level p","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17198,"title":"Latency-Tolerant Cloud-Edge Collaborative Vision-Language-Action Models via Emergent Representational Specialization","url":"https://arxiv.org/abs/2608.00569","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00569v1 Announce Type: new \nAbstract: Deploying billion-parameter Vision-Language-Action (VLA) policies on mobile robots creates a systems conflict: semantic reasoning benefits from cloud GPUs, whereas closed-loop control must respond locally despite network delay and jitter. Existing hierarchical and asynchronous policies improve throughput, but their slow-path representations can still arrive stale or require explicit scheduling and delay cues. We introduce CloudEdgeVLA, a cloud-edge policy that treats temporal misalignment as a representation-learning problem. A cloud VLA encodes","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17197,"title":"DexMani: Human-Derived Manipulability Guidance for Dexterous Rotation","url":"https://arxiv.org/abs/2608.00554","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00554v1 Announce Type: new \nAbstract: Dexterous object rotation is a sequential contact problem: each support, release, and re-contact decision must both produce the desired object motion, and prepare the hand configuration for continued rotation. Existing reinforcement learning methods discover such movement patterns through trial and error on specific robotic hand embodiments, without explicitly accounting for how each contact transition affects the hand's ability to sustain object rotation in subsequent steps. We introduce DexMani, a framework that transfers human demonstrations","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17196,"title":"Disentangling Visuo-Tactile Foresight: Oracle-Guided Interface Discovery for World Action Models","url":"https://arxiv.org/abs/2608.00547","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00547v1 Announce Type: new \nAbstract: Contact-rich manipulation remains challenging because successful control depends on physical interaction cues that are often weakly observable from vision alone. Recent tactile world action models jointly model future visual observations and tactile signals to guide action generation, but how such futures should be structured for effective use by the action expert remains underexplored. Directly studying this question with learned world action models is difficult because end-to-end behavior entangles physically invalid visual futures, unreliable","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17195,"title":"SSTG-Nav: Metric-Grounded Spatial-Semantic Topological Graphs for Reusable Object Navigation","url":"https://arxiv.org/abs/2608.00527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00527v1 Announce Type: new \nAbstract: Service robots operating for months in the same homes, offices, and facilities should become more reliable with experience instead of searching familiar space from scratch for every request. Yet ObjectNav is predominantly formulated as one-shot exploration, leaving a central deployment challenge unresolved: recognizing an object does not identify a reachable place to stop, and one confident map error can terminate the task. We introduce SSTG-Nav, a reusable metric-semantic memory that turns a one-time survey into actionable object goals, consoli","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17194,"title":"First Deployable Dynamic-CoM: A Unified Policy and Method-Agnostic Benchmark for Humanoid Single-Leg Balance","url":"https://arxiv.org/abs/2608.00500","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00500v1 Announce Type: new \nAbstract: Unified humanoid policies handle agile whole-body motion, yet stumble on a simple demand: staying balanced on one leg. On our single-leg-balance benchmark, eight released state-of-the-art general policies hold a clean single-leg stance on 0 of 90 test motions; they stay up only by stepping or hopping, recovering from imbalance rather than preventing it. Prevention needs the capture point (xCoM), the center of mass (CoM) extrapolated by its velocity, which has never driven a hardware policy because it requires a base linear velocity no on-board s","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17193,"title":"From Digital to Physical Reservoir Computing: Co-Optimizing Soft Robotic Reservoirs via Dynamics Matching","url":"https://arxiv.org/abs/2608.00484","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00484v1 Announce Type: new \nAbstract: Soft robotic substrates are promising for Physical Reservoir Computing (PRC) because their compliant nonlinear dynamics can provide temporal memory, high-dimensional state transformations, and efficient inference. However, physical reservoirs are often adopted as-is rather than pretrained or co-optimized, potentially limiting soft robotic PRC performance relative to digital reservoirs. We investigate whether a physical reservoir can instead be pretrained against high-performing digital reference dynamics. Our formulation jointly optimizes physic","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17192,"title":"Learning to Predict Contact Force Distributions from Vision Leveraging Object Geometry Priors","url":"https://arxiv.org/abs/2608.00464","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00464v1 Announce Type: new \nAbstract: Based on vision and prior experience, humans can make rough physical predictions and adjust their manipulation strategies. This paper aims to endow robots with a similar ability. To collect paired data of vision and forces, we use a rigid-body simulator commonly adopted in robotics. However, unlike simulators that output noisy point forces, humans are able to make consistent predictions even in unfamiliar situations. Based on this observation, we hypothesize that predicting smooth force distributions rather than raw point forces can improve both","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17191,"title":"Embodied Passive Aeroacoustic Perception Enables Relative Sensing and Pursuit Between Aerial Robots","url":"https://arxiv.org/abs/2608.00401","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00401v1 Announce Type: new \nAbstract: Aerial robots generate structured aeroacoustic fields during flight, yet these signals have been underexplored as a source of onboard relative perception, particularly under the strong ego-acoustic interference generated during simultaneous flight in various outdoor conditions. We introduce embodied passive aeroacoustic perception, a sensing paradigm in which an aerial robot infers actionable relative-state information from the naturally generated sound of flight while operating within its own evolving aeroacoustic field. We present SonicFly, a","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17190,"title":"The Gate, Not the Cache: Gate Provenance Bounds the Closed-Loop Reliability of Training-Free VLA Token Skipping","url":"https://arxiv.org/abs/2608.00391","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00391v1 Announce Type: new \nAbstract: Token skipping is a widely used training-free way to accelerate vision--language--action (VLA) models by bypassing computation for most visual tokens at each control step according to a gate. When the next gate is harvested from the previous accelerated forward, however, the tokens skipped at one step are also the ones least visible to the next gate, and the damage can compound across control steps until the task fails. We study the two mechanisms this class is built on, reuse and deletion, crossing each against where its gate signal comes from","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17189,"title":"A Robotic System for Automated Manufacturing of Dielectric Elastomer Actuators","url":"https://arxiv.org/abs/2608.00369","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00369v1 Announce Type: new \nAbstract: This letter presents an automated robotic manufacturing system for soft capacitors which operate as actuators and sensors. Emphasis is placed on the two processes that most directly govern device quality, dielectric layer formation by spin coating and carbon nanotube (CNT) electrode application by stamping. Twenty multilayer DEAs, each comprising 12 dielectric layers with a mean thickness of 55.37 +- 2.04 um and 11 alternating CNT electrodes, were fabricated reducing total process time by 14.2% and removing the operator from 56.1% of it.","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17188,"title":"Action Chunk Scheduling for Batched Robot Policy Serving","url":"https://arxiv.org/abs/2608.00337","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00337v1 Announce Type: new \nAbstract: Deploying robot foundation models at scale is the next step towards realizing the potential of general-purpose robots. However, Vision-Language-Action (VLA) and other foundation models are computationally demanding, and on-device compute is constrained by power and space. In this paper, we introduce the problem of serving a robot policy to multiple robots from a remote GPU and formulate it as a scheduling problem. We build Armory, a serving system validated on fleets of both simulated and real robots. Our experiments show that naive scheduling h","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17187,"title":"Belief-Space Perception Routing under Coupled Sensor Faults and Compute Contention","url":"https://arxiv.org/abs/2608.00322","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00322v1 Announce Type: new \nAbstract: A robot that has to see and react on a fixed clock runs into two problems at once. Its cameras degrade in rain, mud, fog, and darkness. And the single onboard processor it runs on is shared with planning and control, so the compute left over for perception moves around from second to second. Most systems model the two separately. We present a perception router that tracks probabilistic estimates of sensor-fault state and compute- contention state, couples them with a noisy-OR term, and uses the coupled estimate to pick one of four detector confi","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17186,"title":"Towards General Language-Conditioned Latent Safety Filters","url":"https://arxiv.org/abs/2608.00315","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00315v1 Announce Type: new \nAbstract: Robot policies are becoming increasingly general, with vision-language-action (VLA) models enabling a single policy to execute diverse tasks specified in natural language. Safe deployment, however, requires adapting not only to new tasks but also to varying safety requirements across users, environments, and applications. Existing safety filters remain largely constraint-specific and thus must be redesigned or relearned when safety requirements change. In this paper, we investigate language-conditioned safety filtering, in which a Hamilton-Jacob","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17185,"title":"Hybrid Attention Estimation Pipeline for Adaptive HRI Using an Expressive Robotic Head","url":"https://arxiv.org/abs/2608.00284","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00284v1 Announce Type: new \nAbstract: This paper presents an applied case study on hybrid visual attention estimation for human-robot interaction using an expressive robotic head based on the InMoov ecosystem. The proposed pipeline combines a fast geometric perception layer with an independent semantic perception layer based on a vision-language model. The geometric layer provides high-frequency face and head-pose information for temporal regulation, while the semantic layer receives only raw egocentric camera frames and produces contextual attention labels related to attention towa","tags":[],"cluster_size":1,"ts":"2026-08-04T04:00:00"},{"id":17184,"title":"Compliant Sphere Lattice Contact: Distributed Contact Modeling for Sphere-Based Robot Representations","url":"https://arxiv.org/abs/2608.00263","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.00263v1 Announce Type: new \nAbstract: Contact planning in robotics requires models that are both computationally efficient and physically accurate. Sphere-based robot representations satisfy the first requirement by enabling fast collision checking and differentiable geometry, but s // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
