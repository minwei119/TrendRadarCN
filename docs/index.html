重仓图谱得以清晰展现。私募排排网数据显示，共55家百亿私募出现在264家上市公司前十大流通股东名单中，合计持股市值达913.51亿元。行业配置上，食品饮料持股市值居首，电子、计算机分列二三位，呈“守红利、攻科技”的哑铃型配置格局。展望后市，多家私募机构认为，半年报披露后市场正从“情绪驱动”转向“业绩验证”，下半年投资重心应聚焦业绩确定性与产业趋势清晰的细分方向。（经济参考报）","tags":[],"cluster_size":1,"ts":"2026-09-06T23:26:29"},{"id":26422,"title":"7月以来已有823家A股公司发布回购相关公告","url":"https://wallstreetcn.com/livenews/3160999","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年下半年以来，A股市场回购热度持续走高。东方财富Choice数据显示，7月1日至9月6日，A股已有823家公司发布回购相关公告。本轮密集回购中，龙头企业带头大手笔回购，回购用途持续多元化。此外，大额回购频现的同时，注销式回购数量快速攀升，成为上市公司市值管理与股东回报的重要手段。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:58:20"},{"id":26423,"title":"年内港股IPO募资超3500亿港元","url":"https://wallstreetcn.com/livenews/3160997","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至9月6日，今年以来港股市场共有105家企业完成IPO（首次公开募股），同比增长77.97%；IPO募资规模为3558.48亿港元，同比增长156.22%。进一步看，年内港股IPO项目主要呈现三大特点：“A+H”股占主导、IPO项目“含科量”持续提升、基石投资者正深度参与IPO项目。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:54:15"},{"id":26424,"title":"856家A股公司拟中期分红超7166亿元","url":"https://wallstreetcn.com/livenews/3160996","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上交所提供的数据显示，目前A股已有856家上市公司披露了2026年中期分红计划（包含一季报、半年报分红），拟分红规模约7166.7亿元。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:53:13"},{"id":26425,"title":"新备案私募证券基金连续3个月超1200只","url":"https://wallstreetcn.com/livenews/3160992","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"私募排排网数据显示，8月新备案私募证券投资基金超过1200只，虽较7月年内高点有所回落，但仍保持较高水平，且已经连续3个月维持1200只以上的新备案数量。截至8月31日，年内累计备案私募证券投资基金超过10000只，同比增长近40%。从策略结构来看，股票策略仍占据主导地位，年内备案数量占比接近七成。在业内人士看来，低利率环境下资金重新配置的中长期需求，以及股票策略的亮眼业绩表现，成为资金入场的重要基础。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:45:20"},{"id":26426,"title":"A股再现主动退市，多元化退市格局持续完善","url":"https://wallstreetcn.com/livenews/3160991","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"2026年，A股主动退市已现三起案例。从年初德邦股份成为年内首家主动退市公司，到瓦轴B因控股股东发起全面要约收购而私有化退市，再到8月底“彩电第一股”*ST康佳A拟以股东会决议方式主动撤回A股和B股上市，主动退市成为这些上市公司“不约而同”的选择。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:44:00"},{"id":26427,"title":"A股缩量整理或临近尾声，机构看好9月中下旬行情","url":"https://wallstreetcn.com/livenews/3160990","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周，A股市场延续震荡整理格局。中东地缘政治扰动再起、10年期美债收益率上扬，对科技板块形成压制，风格再平衡仍是市场的主要特征。券商策略展望报告认为，总体而言，海外市场系统性风险可控，但美债收益率波动与加息预期的反复博弈，或对全球股市风险偏好形成扰动，成为短期波动的主要原因。但是，随着半年报验证A股企业盈利持续向好、科技板块拥挤度逐步消化，市场底部支撑正不断增强，A股市场进一步下行空间有限。展望后市，9月中下旬或成为反弹的重要时间窗口。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:37:14"},{"id":26428,"title":"“出海”成2026年服贸会关键词","url":"https://wallstreetcn.com/livenews/3160988","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"9月9日至13日，2026年中国国际服务贸易交易会将在北京首钢园举办。本届服贸会吸引约90个国家（地区）和国际组织以国家（地区）或总部名义设展办会，1800余家企业线下参展，其中456家为世界500强和行业龙头企业。与往届相比，本届服贸会首次设立出海服务推介路演区，平台作用更加凸显。专家表示，“出海”成为本届服贸会核心关键词，中国企业出海从产品输出进阶为服务护航，人工智能相关服务出海进程明显加快，服贸会正搭建起全球服务贸易合作的新通道，连通全球贸易新未来。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:32:17"},{"id":26429,"title":"8家中央金融企业迎3600亿元增资，用于补充核心一级资本 增强金融供给能力","url":"https://wallstreetcn.com/livenews/3160986","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8家中央金融企业9月6日相继发布公告，披露拟通过定向增发及直接注资等方式实施资本补充。计划增资的包括国有大行、国有商业保险公司、政策性金融机构三类机构，财政部通过发行特别国债出资3000亿元，中国烟草总公司及相关子公司出资600亿元，8家中央金融企业合计增资3600亿元。受访人士认为，此次财政主导对8家中央金融企业增资，属于“未雨绸缪”的前瞻性安排，契合宏观政策“多渠道补充资本、增强金融供给能力”导向，有助于进一步增强稳健经营能力、抵御风险能力和服务实体经济能力。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:30:02"},{"id":26430,"title":"多项增量金融政策落地，助力扩内需稳经济","url":"https://wallstreetcn.com/livenews/3160985","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"贴息贷款提额扩面，新型政策性金融工具“开闸”，房地产信贷制度全面优化……近期，着眼于扩消费、促投资、稳楼市的多项增量金融政策取得实质性进展。业内专家表示，这些政策正形成稳定宏观经济运行的“组合拳”，有望托底消费、投资、房地产等关键领域，持续夯实内需基础。各项新政策将逐步落地见效。（上证报）","tags":[],"cluster_size":1,"ts":"2026-09-06T22:28:01"},{"id":26431,"title":"阿里巴巴前高管，在美国失踪逾半月后确认身亡 - 新浪网","url":"https://news.google.com/rss/articles/CBMif0FVX3lxTE1XN1JxY3VmbVJpd2hLZENjQzhvMTVUbkhId3JmY2hVbFR4RFNUTU1CdHllMWJ6cXdTRERzZXc2YTJINnIzWXpZTzNLdEF5WGhqWjlMRllvNFcwcEpDMUJJVVJ1dHZwVTU4M0t1eC0xRzlUMXhWNU4yeXJRSHNRcUE?oc=5","s ","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02542v1 Announce Type: new \nAbstract: Foothold-constrained terrain is characterized by sparse, discontinuous, or geometrically restricted feasible foot contacts, as encountered on stepping stones, across gaps, and on narrow stair treads. On such terrain, a single misstep often leaves little room to recover, so policies that base foot-placement decisions primarily on the immediately visible terrain are prone to failure. We ask whether a learned predictive summary of near-future observations and rewards can provide the anticipatory information required in such settings. We present Wor","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25692,"title":"MS-MEM: Multi-Skill Manipulation-Enhanced Mapping via Uncertainty- and Disturbance-Aware Action Selection","url":"https://arxiv.org/abs/2609.02493","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02493v1 Announce Type: new \nAbstract: Accurate scene understanding in confined, cluttered spaces such as shelves is essential for service robots, as many everyday tasks require them to locate and retrieve objects reliably. Yet, it remains challenging due to severe occlusions, restricted accessibility, and the need to avoid excessive scene changes. In this paper, we propose Multi-Skill Manipulation-Enhanced Mapping (MS-MEM), an evidential framework for uncertainty-aware mapping that integrates active viewpoint selection, object pushing, and grasping. MS-MEM combines scene-level metri","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25691,"title":"An Adaptive Control Architecture for Slope and Terrain Compensation in Autonomous Navigation in Mediterranean Greenhouses","url":"https://arxiv.org/abs/2609.02487","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02487v1 Announce Type: new \nAbstract: The ability to move stably over terrain with varying slopes and textures is essential for mobile agricultural robots operating in complex and dynamic environments such as greenhouses, where small terrain irregularities can lead to significant navigation errors. This article presents a novel terrain-adaptation strategy based on the carried payload, ensuring accurate and robust trajectory tracking. The proposed approach is based on: (i) the experimental characterization of the most common types of greenhouse soil, concrete, compacted sand, and gra","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"},{"id":25690,"title":"A Physics-Consistent Benchmark for Contact-Rich Human-Robot Interaction in Assistive Care","url":"https://arxiv.org/abs/2609.02402","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.02402v1 Announce Type: new \nAbstract: Conventional task-level evaluation asks whether a robot policy completes a specified action, but can miss failures that emerge only during physical human contact. This limitation is critical in contact-rich assistive tasks, where meaningful evaluation requires a physically responsive human, interaction-quality assessment beyond task success, and a leak-free observer-scorer protocol. We introduce a physics-consistent benchmark for contact-rich human-robot interaction, instantiated in robot-assisted bathing. The benchmark combines a deformable, pa","tags":[],"cluster_size":1,"ts":"2026-09-03T04:00:00"}]}]};

const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
