出炉：5年期和1年期利率均维持不变","url":"https://wallstreetcn.com/livenews/3167746","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"央行公告，9月1年期贷款市场报价利率（LPR）为3.0%，5年期以上LPR为3.5%。","tags":[],"cluster_size":1,"ts":"2026-09-20T01:00:30"},{"id":28622,"title":"纳斯达克100指数季度再平衡落定，SpaceX权重将升至2.82%","url":"https://wallstreetcn.com/livenews/3167738","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"据彭博获得的数据，纳斯达克100指数季度再平衡即将于下周一（9月21日）生效，届时SpaceX在该指数中的权重将升至2.82%，较目前约1.28%的权重大幅提高。\n\n这一最终权重是根据上周五收盘价计算得出，与指数编制机构此前公布、并由彭博报道的暂定权重一致。\n\n此次权重上调预计将开始缩小一个不同寻常的差距。按市值计算，SpaceX以超过2万亿美元位列纳斯达克100指数第七大公司，但按当前指数权重计算，甚至未进入前20名。","tags":[],"cluster_size":1,"ts":"2026-09-19T16:01:56"},{"id":28623,"title":"公司股权激励的目标是今年要比去年增长50%？胜宏科技回应","url":"https://wallstreetcn.com/livenews/3167706","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"针对投资者提问“公司股权激励的目标是今年要比去年增长50%，可以实现吗？”胜宏科技表示，公司股权激励的业绩考核目标是管理层综合考虑了行业发展状况、市场竞争情况、公司未来的发展规划以及客户订单能见度等因素设定，既体现了公司对未来成长的信心，也兼顾了目标的挑战性与可实现性。管理层及核心团队对完成本次激励计划设定的考核目标有坚定信心，并将通过进一步优化产品结构、提升产品良率与交付能力、多元化客户结构等措施，全力以赴推动公司经营质量和业绩持续提升。","tags":[],"cluster_size":1,"ts":"2026-09-19T12:28:10"},{"id":28624,"title":"《广西金融业发展“十五五”规划》印发：鼓励上市公司并购重组和再融资，支持上市公司发展新质生产力","url":"https://wallstreetcn.com/livenews/3167698","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"广西壮族自治区人民政府办公厅印发《广西金融业发展“十五五”规划》，其中指出，健全跨部门联动的优质企业发现、遴选与培育机制。聚焦自治区重点产业与新兴产业发展，培育一批优质上市（挂牌）后备企业。发挥好广西资本市场服务基地功能。加大宣传培训力度，引导企业树立正确上市（挂牌）观念，合理规划上市（挂牌）路径。健全落实常态化服务上市公司工作机制。鼓励上市公司并购重组和再融资，支持上市公司发展新质生产力。督促和引导上市公司更加积极开展现金分红。","tags":[],"cluster_size":1,"ts":"2026-09-19T11:51:03"},{"id":28625,"title":"下周43股面临解禁，4只解禁股上半年业绩扭亏","url":"https://wallstreetcn.com/livenews/3167678","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"下周将有43只股票解禁，按照最新收盘价计算，合计解禁市值151.28亿元。从解禁比例来看，下周面临解禁的个股中首药控股-U的解禁比例达56.96%，居首；友升股份、聚仁新材、星徽股份解禁比例均超20%。下周解禁股中，通达海、首药控股-U、正裕工业、ST通葡、爱克股份、海泰科、锦好医疗的上半年业绩亏损。汇川技术的上半年净利润规模居首，公司上半年归母净利润28.1亿元。宏源药业、海南高速、大为股份、星徽股份上半年净利润实现扭亏。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-09-19T10:14:2 45.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"9e56\"\u003eIT之家 9 月 20 日消息，荣耀官方今天宣布，\u003cstrong\u003e荣耀 Magic9 系列手机搭载第三代自研射频增强芯片 C3\u003c/strong\u003e。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"3df5\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/c4d9d1ae-a137-4d01-a0f5-7f40e738b3c9.jpg?x-bce-process=image/format,f_auto\" w=\"690\" h=\"1227\" data-weibo=\"0\" data-mpos=\"0,2\"  data-vmark=\"d703\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"8ff0\"\u003e据介绍，该系列手机拥有七芯射频 AI 调度架构，\u003cstrong\u003e支持 356 个频段组合智能切换\u003c/strong\u003e，深度优化 38 类场景，号称将为用户带来“全域畅联”体验。\u003c/p\u003e\u003cp data-vmark=\"7462\"\u003eIT之家了解到，荣耀 Magic9 系列手机将具备行业独家双 3D 生物识别，\u003cstrong\u003e涵盖 3D 超声波指纹识别与 3D 人脸识别\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"","tags":[],"cluster_size":1,"ts":"2026-09-20T01:42:29"},{"id":28607,"title":"OPPO Find X10 系列手机哈苏超清原相机官宣首发 LUMO 调色盘：独家肤色保护、18 款风格效果","url":"https://www.ithome.com/1/004/615.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"6d08\"\u003eIT之家 9 月 20 日消息，OPPO 官方今日宣布，Find X10 系列手机的哈苏超清原相机\u003cstrong\u003e将首发 LUMO 调色盘\u003c/strong\u003e。据介绍，其支持独家肤色保护和 18 款风格效果。\u003c/p\u003e\u003cp data-vmark=\"bf15\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/7bc51f13-3713-4065-bbf3-ab549adfc2a0.png\" w=\"937\" h=\"720\" data-weibo=\"0\" data-marks=\"1931fd9d012eb6d15078743899d4a13ebc21caf48ad4693d10a0db35418454d85877b37299a9086b316c947ad1d5dcbf\" data-snap-from=\"%7B%22from%22%3A%22weibo%22%2C%22url%22%3A%22https%3A%2F%2Fm.weibo.cn%2Fdetail%2F5345147773780700%22%2C%22qualityMode%22%3A%22original%22%2C%22qualityValue%22%3A%22orig","tags":[],"cluster_size":1,"ts":"2026-09-20T01:13:16"},{"id":28608,"title":"一小时一个价？“电子工业大米”MLCC 价格最高涨十倍，行情剧烈波动","url":"https://www.ithome.com/1/004/613.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"d748\"\u003eIT之家 9 月 20 日消息，据央视财经报道，MLCC（多层陶瓷电容器）被业内誉为“电子工业大米”。小到手机家电，大到 AI 服务器、新能源汽车，几乎所有电子产品都离不开。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"7545\"\u003e\u003ca href=\"https://weibo.com/2258727970/RiSQj5tfd\" class=\"ithome_super_player\" target=\"_blank\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/23311114-9485-42e0-b7cd-129d77ea43a3.jpg\"\u003e\u003c/a\u003e\u003c/p\u003e\u003cp data-vmark=\"b7cb\"\u003e据报道，近期电子元器件市场出现极端分化行情：AI 拉动高容量型号缺货疯涨，部分现货暴涨数倍；普通消费级产品冲高回落，一冷一热的背后，是 AI 算力浪潮的搅动。\u003c/p\u003e\u003cp data-vmark=\"94a2\"\u003eMLCC 涨价潮最先由海外巨头点燃。日本村田、\u003ca href=\"https://www.ithome.com/0/983/445.htm\" target=\"_blank\"\u003e太阳诱电、韩国三星电机\u003c/a\u003e相继发布涨价函，AI 服务器","tags":[],"cluster_size":1,"ts":"2026-09-20T01:09:17"},{"id":28609,"title":"特朗普计划组建一支“人工智能部队”，称 AI 未来可能占到美国国内生产总值的 25%","url":"https://www.ithome.com/1/004/608.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"9d99\"\u003eIT之家 9 月 20 日消息，据央视新闻报道，美国总统唐纳德 · 特朗普当地时间 9 月 19 日在社交媒体发文称，\u003cstrong\u003e他将组建一支“人工智能部队”\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"27e8\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/3ee232e8-47da-412d-b327-dd3c6d0ad75a.png\" w=\"1037\" h=\"936\" data-weibo=\"0\" data-vmark=\"ac7c\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"8c97\"\u003e特朗普说，为组建“人工智能部队”，他将在不久后任命一名人工智能事务“总管”。他称，\u003cstrong\u003e人工智能代表着下一场工业革命或互联网浪潮\u003c/strong\u003e，其规模和影响力将更大，\u003cstrong\u003e甚至可能占到美国国内生产总值的 25%\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"f174\"\u003e特朗普还在帖文中抨击激进的民主党人“企图摧毁人工智能”，称“我们绝不会以任何方式阻碍或扼杀这个令人瞩目的产业发展。相反，我们要珍视它、扶持它，并守护它的成长”。特朗普称，\u003cstron","tags":[],"cluster_size":1,"ts":"2026-09-20T01:08:29"},{"id":28610,"title":"日企 TENKO 推出 10.51\" 笔电 Note Pro AI，搭载 Ultra 5 处理器 125U","url":"https://www.ithome.com/1/004/605.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"fb4a\"\u003eIT之家 9 月 20 日消息，日本企业 TENKO（天空）近日推出了 UMPC 笔记本电脑 TENKO Note Pro AI。其基于英特尔酷睿 Ultra 5 处理器 125U，\u003cstrong\u003e配备 10.51\" 屏幕\u003c/strong\u003e，支持 360° 翻转。\u003c/p\u003e\u003cp data-vmark=\"f840\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/a4006b74-014b-49f2-8a48-d24cf12b54a9.jpg\" w=\"1440\" h=\"720\" data-weibo=\"0\"  data-vmark=\"cf7c\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"cc74\"\u003eTENKO Note Pro 配备 16GB LPDDR5 内存、512GB SSD 存储；屏幕分辨率为 1920×1280，\u003cstrong\u003e支持十点触控\u003c/strong\u003e、\u003cstrong\u003e4096 级压感数字笔\u003c/strong\u003e；键盘键距 17.8mm，配备玻璃触控板；提供 2 个 USB-C 5Gbps 接口；支持 Wi-Fi 6、蓝牙 5.2。\u003c/p\u003e\u003cp data-vmark=\"b2b9\"\u003e","tags":[],"cluster_size":1,"ts":"2026-09-20T01:05:27"},{"id":28611,"title":"马斯克又放豪言：AI 将使明年美国 GDP 增速翻番，最高达 4%","url":"https://www.ithome.com/1/004/602.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"32ed\"\u003eIT之家 9 月 20 日消息，特斯拉首席执行官埃隆 · 马斯克昨天在 X 平台发文：“我猜测，AI 将使美国明年的 GDP 增速大致翻倍，从 2% 增加至 4% 左右，也许更高。”\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"b09d\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/b12bbaf9-1848-412d-a759-e0a3de52ff40.png?x-bce-process=image/format,f_auto\" w=\"898\" h=\"469\" data-snap-from=\"%7B%22from%22%3A%22x%22%2C%22url%22%3A%22https%3A%2F%2Fx.com%2Felonmusk%2Fstatus%2F2101011740574052697%22%2C%22qualityMode%22%3A%22auto%22%2C%22link%22%3A%22https%3A%2F%2Fx.com%2Felonmusk%2Fstatus%2F2101011740574052697%22%2C%22qualityValue%22%3A%22original%22%7D\" data-we","tags":[],"cluster_size":1,"ts":"2026-09-20T00:51:56"},{"id":28612,"title":"马斯克的 Terafab 芯片厂，还未投产就陷入商标纠纷","url":"https://www.ithome.com/1/004/597.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"faa5\"\u003eIT之家 9 月 20 日消息，据外媒 PCMag 本周（9 月 16 日）报道，马斯克旗下 Terafab 还未投产就陷入商标纠纷。美国伊利诺伊州纳米技术公司 Tera-print 认为，这家芯片厂侵犯了公司桌面光刻系统商标“Tera-Fab”。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"c2b8\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/87b1f38b-d021-449d-b9ce-15e3f3a4ef9b.jpg?x-bce-process=image/format,f_auto\" w=\"596\" h=\"335\" data-weibo=\"0\" data-vmark=\"5ea8\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"8e11\"\u003eIT之家从原报道获悉，特斯拉于 5 月 18 日提交 Terafab 商标申请。5 月 23 日，Tera-print 向特斯拉发出停止侵权函。双方 6 月至 8 月间进行 6 次谈判，最终似乎没有取得进展。\u003c/p\u003e\u003cp data-vmark=\"cf7a\"\u003e9 月 15 日，特斯拉、SpaceX 和 SpaceXAI 选择向美国得克萨斯州西区联邦法院提","tags":[],"cluster_size":1,"ts":"2026-09-20T00:28:48"},{"id":28613,"title":"用户抱怨 Meta 旗下 AI 助手 Muse 未经授权读取 Mac 通知内容，官方予以否认","url":"https://www.ithome.com/1/004/594.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3155\"\u003eIT之家 9 月 20 日消息，外媒 The Verge 援引《Inc.》杂志特约编辑 Jason Aten 贴文，认为 Meta 旗下 AI 助手 Muse 存在权限漏洞，会擅自调用自己 macOS 设备上通知窗口弹窗中的内容进行知识补充。\u003c/p\u003e\u003cp data-vmark=\"381c\"\u003eJason Aten 表示，自己并未授权 Muse 访问 Mac 上的信息 App，但 Muse 却能够回答与其消息内容有关的问题，其在追问 AI 后，AI 声称自己是通过通知预览获取相关信息。\u003c/p\u003e\u003cp data-vmark=\"837d\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/fba54344-9e0c-48f8-983c-d4fcb03b0ebb.png\" w=\"1244\" h=\"1224\" data-weibo=\"0\" data-vmark=\"7009\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"60a3\"\u003e对此，Meta Superintelligence Labs 高管 David Singleton 随后在该帖下方回应，试图解释 Muse 所需的权限以及相关工作方式。\u003c/p\u003e\u003cp","tags":[],"cluster_size":1,"ts":"2026-09-20T00:17:54"},{"id":28614,"title":"游戏《漫威金刚狼》厕所标识贴图异常引发玩家争议，官方否认使用生成式 AI","url":"https://www.ithome.com/1/004/581.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"7b76\"\u003eIT之家 9 月 20 日消息，据外媒 Insider Gaming 报道，近期有玩家发现《漫威金刚狼》中一处厕所标识存在异常，其中男性图案一侧看起来像有两个人形重叠，因此有玩家怀疑该素材由生成式 AI 制作。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"3062\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/b02fccc9-99ac-4a82-9a2e-5ea5f9eb6719.png?x-bce-process=image/format,f_auto\" w=\"1070\" h=\"952\" data-weibo=\"0\" data-vmark=\"a966\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"ac2f\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/db0b2dda-f7f4-4fa9-85b0-010af976725c.png?x-bce-process=image/format,f_auto\" w=\"1334\" h=\"1050\" data-weibo=\"1\" da","tags":[],"cluster_size":1,"ts":"2026-09-19T23:17:38"},{"id":28615,"title":"小米折叠屏手机历史最高：消息称 Xiaomi 18 Fold 开售 7 天销量近 8 万台","url":"https://www.ithome.com/1/004/580.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"db11\"\u003eIT之家 9 月 20 日消息，据长期关注国内手机市场份额的数码博主 @RD观测 爆料，小米 18 Fold 开售 7 天的销量接近 8 万台，\u003cstrong\u003e是小米历史首销 7 天销量最高的折叠屏手机\u003c/strong\u003e，也是今年折叠品类销量截至目前开售 7 天仅次于华为的机型。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"ec25\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/75e71a6e-3aee-4fc0-897b-868f7b4deb0f.png?x-bce-process=image/format,f_auto\" w=\"937\" h=\"267\" data-weibo=\"0\" data-marks=\"1931fd9d012eb6d18064335d89b72a6d47d446fc6f522d3444d708ab58972ae5280e1c2db5364a753586cbc35e22dc26\" data-snap-from=\"%7B%22from%22%3A%22weibo%22%2C%22url%22%3A%22https%3A%2F%2Fm.weibo.cn%2Fdetail%2F5344885714714951","tags":[],"cluster_size":1,"ts":"2026-09-19T23:10:51"},{"id":28616,"title":"分析师：苹果“拆分 iPhone 18 发布节奏”策略已奏效，部分用户转购 Pro 机型","url":"https://www.ithome.com/1/004/579.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ad9f\"\u003eIT之家 9 月 20 日消息，苹果今年改变了传统的 iPhone 秋季发布节奏，仅推出 iPhone 18 Pro 系列机型及首款折叠屏手机 iPhone Duo。而标准版 iPhone 18、定位更低的 iPhone 18e 以及 iPhone Air 2 预计将推迟至明年春季发布。\u003c/p\u003e\u003cp data-vmark=\"472d\"\u003e对此，分析公司 Deepwater Asset Management 管理合伙人兼联合创始人、前 Piper Jaffray（现 Piper Sandler）分析师 Gene Munster 发文，认为苹果拆分 iPhone 18 系列发布节奏的策略正在发挥作用。\u003c/p\u003e\u003cp data-vmark=\"6f09\"\u003e具体来看，在 iPhone 18 Pro 系列上市首日，\u003cstrong\u003e相应产品预购预计送达时间比去年同期延长了约 15%\u003c/strong\u003e。因此 Gene Munster 认为，部分原本可能购买基础版 iPhone 的消费者，正在增加预算转而购买价格更高的 iPhone 18 Pro 或 iPhone 18 Pro Max。\u003c/p\u003e\u003cp style=\"text-align: center;\" data-vmark=\"4747\"\u003e\u003cimg src=\"https://img.ithome.com/new","tags":[],"cluster_size":1,"ts":"2026-09-19T23:09:46"},{"id":28617,"title":"苹果 M6 芯片 GPU 跑分曝光，相比 M5 提升约 20%","url":"https://www.ithome.com/1/004/576.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"ab1f\"\u003eIT之家 9 月 20 日消息，苹果 M6 芯片近日出现在 Geekbench 跑分数据库中，其 12 核 CPU 分别录得 4071 分、22783 分的单核 / 多核成绩，已经能够在多核方面追平 M3 Max。\u003c/p\u003e\u003cp data-vmark=\"942b\"\u003e如今，苹果 M6 的 GPU 跑分成绩已经出现在 Geekbench 平台。在 Metal 基准测试中，\u003cstrong\u003e该芯片的 12 核 GPU 录得 92000 分成绩\u003c/strong\u003e。作为对比，M5（IT之家注：MacBook Air,15\"）的 10 核 GPU 跑分约为 76530 分，M6 芯片的性能提升约 20.2%。\u003c/p\u003e\u003cp data-vmark=\"d75c\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/24951d05-875d-4d2e-999c-c6c4d8e24486.jpg\" w=\"1278\" h=\"1027\" data-weibo=\"0\" data-mpos=\"2,2\" data-marks=\"1931fd9d012eb6d17f969d4c9501470d6abea05df6d80b5fc4a138733deab8db8f5","tags":[],"cluster_size":1,"ts":"2026-09-19T22:51:53"},{"id":28618,"title":"迪士尼首次任命首席技术官：挖来原 Character.AI 首席执行官阿南德，强化 AI 布局","url":"https://www.ithome.com/1/004/570.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"3292\" style=\"text-align: left;\"\u003eIT之家 9 月 19 日消息，据美国 CNBC 报道，当地时间 18 日，迪士尼宣布，原 \u003cspan class=\"link-text-start-with-http\"\u003eCharacter.AI\u003c/span\u003e CEO 卡兰迪普 · 阿南德将于 10 月 2 日出任\u003cstrong\u003e高级执行副总裁兼公司首位首席技术官（CTO）\u003c/strong\u003e，直接向 CEO 乔什 · 达马罗汇报。\u003c/p\u003e\u003cp data-vmark=\"6559\" style=\"text-align: left;\"\u003e达马罗接掌迪士尼只有数月，此后一直强调利用技术推动公司各项业务发展。按照迪士尼的安排，阿南德将\u003cstrong\u003e统管企业技术、基础设施、数据和 AI 平台，以及产品与工程业务\u003c/strong\u003e，同时协调不同技术团队，进一步推动整个迪士尼的技术开发和交付方式现代化。\u003c/p\u003e\u003cp data-vmark=\"9c3e\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/9/32b50f73-0824-4a62-9a20-fcf144976538.png\" w=\"1440\" h=\"959\" id=\"1789831","tags":[],"cluster_size":1,"ts":"2026-09-19T15:31:54"},{"id":28619,"title":"美联邦航空管理局斥资 8.75 亿美元打造 AI 空  for signaling from the brain. It is thought that the emergent nature of asynchronous wingbeats provides both adaptive and responsive capabilities for flight control. To date, most flying robots use synchronous actuation. In this paper we develop the first flight","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27763,"title":"FASA: Feedback-Aware Sampling Adaptation for Efficient Diffusion-Based VLA Models","url":"https://arxiv.org/abs/2609.19475","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19475v1 Announce Type: new \nAbstract: Diffusion-based Vision-Language-Action (VLA) models achieve strong performance in embodied tasks, but their iterative sampling imposes heavy computational and memory-access cost, blocking real-time deployment on edge platforms. Existing acceleration methods either require expensive training (e.g., distillation, flow matching) or degrade perception via statically scheduled pruning and caching, ignoring the dynamic workload variance of robotic interactions. This paper presents FASA (Feedback-Aware Sampling Adaptation), a training-free runtime fram","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27762,"title":"Pose-aware Legged Robot Semantic Exploration with Omnidirectional Perception in Confined Unknown Environments","url":"https://arxiv.org/abs/2609.19460","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19460v1 Announce Type: new \nAbstract: Semantic exploration in confined environments requires both environment mapping and detailed observation of target objects. For ground robots, limited sensor vertical fields of view and restricted standoff distances can leave upper object surfaces unobserved from planar viewpoints. Body tilting can improve coverage, but additional observations and posture transitions increase mission time. To address this trade-off, we present POSE, a pose-aware semantic exploration system that exploits a legged robot's intrinsic body pitch and roll with omnidir","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27761,"title":"GLAMDRING: Gait Learning And Morphology co-Design via Reinforcement LearnING of CPGs","url":"https://arxiv.org/abs/2609.19452","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19452v1 Announce Type: new \nAbstract: Robots are moving out of the structured factory floor and into unstructured environments such as disaster sites, planetary surfaces, and agricultural fields, for which the right robot often does not yet exist. We present GLAMDRING, a framework that synthesizes the optimal robot for a locomotion task and, jointly, learns the controller that drives it. For the given specifications of forward-velocity bounds, a per-actuator power budget, an actuator library, and a payload requirement, GLAMDRING returns a matched quadruped morphology (link geometry","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27760,"title":"Winning a Won Game: Strict Reach-Avoid-Stay Control Barrier Functions for High-Dimensional Black-Box Systems","url":"https://arxiv.org/abs/2609.19449","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19449v1 Announce Type: new \nAbstract: Robots must complete their tasks and maintain the achieved outcomes while avoiding safety failures at all times. Strict reach-avoid-stay (sRAS) formalizes this requirement: safely reaching a target and remaining there indefinitely after first entry. We propose an sRAS Q-control barrier function (CBF) safety filter for high-dimensional black-box systems under bounded uncertainty. Our construction combines a stay value encoding safe permanent residence in a target subset with a reach-avoid value encoding safe reachability of this subset while avoi","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27759,"title":"From Wizard-of-Oz Human-Robot Dialogue Collection to a Taxonomy of Robot Response Decisions: A Retrospective Analysis of Assistive Pilot Interactions","url":"https://arxiv.org/abs/2609.19447","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19447v1 Announce Type: new \nAbstract: Robots that follow natural-language instructions in everyday indoor environments must act on incomplete human utterances. Instructions often omit essential information, such as the identity of an out-of-view object, an intended destination, or the user's goal. Existing datasets contain little real-world situated dialogue and provide few practice-grounded criteria for deciding when a robot should act, confirm, clarify, or refuse. We retrospectively analyze a pilot Wizard-of-Oz study in which five participants performed everyday indoor tasks, incl","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27758,"title":"From Rollout to Reset: A Graph-Based Harness for Autonomous Long-Horizon Manipulation Evaluation","url":"https://arxiv.org/abs/2609.19413","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19413v1 Announce Type: new \nAbstract: Robot manipulation policies are improving quickly, and real-robot evaluation remains the standard evidence for that progress. It still relies on a human to reset the scene between rollouts, which consumes operator time and leaves the initial state distribution unspecified, so results reproduce poorly. A recent system, AutoEval, automates both reset and scoring, but only for single-step tasks, because a long-horizon rollout can terminate in combinatorially many configurations that no single learned reset policy covers. We present HALTER, a Harnes","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27757,"title":"Enhancing the Perception of Safety and Comfort during Physical Human-Robot Handshake Interactions by Integrating Flexible Elements into a Robotic Arm","url":"https://arxiv.org/abs/2609.19375","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19375v1 Announce Type: new \nAbstract: Safety and comfort in human-robot physical in-teractions are essential aspects in the development of social technologies, where natural gestures, such as handshakes, represent a challenge due to their direct physical contact. The implementation of series elastic actuators (SEA) to absorb impacts is proposed as a design strategy that favors safer interactions. This paper presents an experimental study aimed at evaluating how the incorporation of SEAs in robotic arms influences perceived safety and the interaction experience dur-ing handshaking. T","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27756,"title":"Design and Experimental Validation of a 3D Printed Torsional Series Elastic Actuator for Safe Human Robot Interaction","url":"https://arxiv.org/abs/2609.19367","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19367v1 Announce Type: new \nAbstract: Ensuring intrinsic safety in physical human robot interaction (pHRI) is a critical requirement for social and service robots. While Series Elastic Actuators (SEAs) offer hardware based compliance, traditional metallic designs often require complex, multi part assemblies. This paper presents the design, finite element analysis (FEA), and experimental validation of a low stiffness, torsional spring for SEAs, manufactured via 3D printed thermoplastic polyurethane (TPU). The compliant element exhibits a highly linear torque deformation response (Ks","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27755,"title":"Kinematics-Grounded Agentic AI for Robotic Additive Manufacturing Process Planning","url":"https://arxiv.org/abs/2609.19347","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19347v1 Announce Type: new \nAbstract: Robotic additive manufacturing (AM) extends material-extrusion printing beyond gantry kinematics but makes process planning robot-dependent. A slicer-generated plan that appears favorable in part coordinates can become infeasible or robotically unfavorable on a manipulator because slicer-process decisions and part orientation determine the generated path, while part orientation and workspace placement affect its kinematic realization. Existing AM tools, large language model (LLM)-based decision-support methods, and digital-shadow systems do not","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27754,"title":"ViLoMan: Learning Visual-Proprioceptive Whole-Body Loco-Manipulation Skills for Humanoid Robots","url":"https://arxiv.org/abs/2609.19340","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19340v1 Announce Type: new \nAbstract: Humanoid loco-manipulation requires adaptive whole-body coordination to seamlessly integrate locomotion and physical interaction. Despite recent advances, learning autonomous loco-manipulation remains challenging due to the scarcity of diverse, physically executable robot-object interaction data and the difficulty of learning unified whole-body control directly from onboard observations. We present ViLoMan, a scalable framework for autonomous humanoid loco-manipulation. ViLoMan first transforms partial kinematic demonstrations of human-object in","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27753,"title":"SemSafe-3DGS: Semantic Risk-Aware Active Navigation in Uncertain 3D Gaussian Splatting Maps","url":"https://arxiv.org/abs/2609.19330","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19330v1 Announce Type: new \nAbstract: Autonomous robots operating in partially observed environments must navigate safely while acquiring observations that improve future planning. Existing safety formulations generally reason primarily about geometry. Consequently, geometrically similar scene elements may induce comparable control responses despite having different semantic consequences. We present a semantic risk aware safe-active perception framework for navigation in attributed 3D Gaussian maps. Semantic attributes modulate an Average Value-at-Risk collision clearance model thro","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27752,"title":"A Morphing Aerial Robot With Thruster-Integrated Flexible Continuum Links for Shape Adaptive Aerial Manipulation","url":"https://arxiv.org/abs/2609.19328","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19328v1 Announce Type: new \nAbstract: In recent years, aerial manipulation has attracted increasing attention as a key to expand the application of aerial robots. In this work, we focus on two major research directions for achieving versatile aerial manipulation: (i) acquiring high environmental adaptability using soft manipulators, and (ii) expanding the feasible wrench space by distributing thrusters along the manipulator. However, no aerial robot has simultaneously satisfied these two requirements. Therefore, in this paper, we propose a morphing rotor-distributed aerial robot wit","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27751,"title":"GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM Task Planning","url":"https://arxiv.org/abs/2609.19315","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19315v1 Announce Type: new \nAbstract: Large language models (LLMs) provide a flexible interface for long-horizon robot planning, but generated plans often fail to respect embodiment constraints, recover from planning errors, or reason effectively under partial observability. We present GAVEL, a framework for verifying and repairing long-horizon LLM planning built around an explicit graph world model. The graph represents relevant object-relations, action pre-conditions and effects, and probabilistic beliefs over unobserved object locations. This model can predict the consequences of","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"},{"id":27750,"title":"OHRID-Retail: An Open Multimodal Dataset of Human Activity in Retail Environments","url":"https://arxiv.org/abs/2609.19302","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2609.19302v1 Announce Type: new \nAbstract: Open datasets describing human behavior in environments shared with mobile robots remain limited, particularly for retail activities that combine locomotion, reaching, object handling, and robot guided movement. This paper introduces OHRID Retail, an open, human centered multimodal dataset collected from 16 healthy adults performing a simulated shelf picking task under three within participant conditions: no robot, low speed robot guidance, and high speed robot guidance. Each participant completed two trials per condition. Whole body kinematics","tags":[],"cluster_size":1,"ts":"2026-09-18T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
