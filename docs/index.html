比增长25%，年化运行率达到0.5万亿美元。\n\n2、搜索业务强劲增长：人工智能（AI）投资推动了整体查询量的大幅增长，同比增速创过去五年来最快水平。\n\n3、Gemini 4前沿模型发布与内部生产力提升：\n\n两周前发布的Argon模型在第一周的开发者使用增速达到Gemini 3的3.5倍；在谷歌内部，代码出货量增加35%，错误减少30%。\n\n正式宣布发布最强前沿模型Carbon，具备顶尖的网络安全与长跨度能力，并在Artificial Analysis智能指数中排名第一。\n\n4、代理型体验（Agentic Experiences）： Gemini应用用户量突破10亿。正在从企业端（Gemini agent for Enterprise）逐步向消费端（搜索、Gemini应用、Chrome、Android、Workspace）扩展代理能力。\n\n5、消费者平台与长期下注：\n\nYouTube Music和Premium订阅用户数突破1.5亿。\n\nWaymo完全自动驾驶里程突破3亿英里，服务范围扩展至美国15个主要城市，并计划拓展至海外（加拿大、德国、新加坡、西班牙）。","tags":[],"cluster_size":1,"ts":"2026-10-28T23:59:02"},{"id":37415,"title":"港股IPO融资额创16年来新高，基石投资者占比超八成","url":"https://wallstreetcn.com/livenews/3189474","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯","华尔街见闻 · 港股快讯"],"summary":"10月28日，东山精密H股在港交所上市（募资总额98.76亿港元），这是今年第118家在港股上市的公司。据Wind数据统计，截至10月28日，港股IPO融资额达到4013.92亿港元，同比增长83.59%。这一融资额已创下2011年以来新高，距离2010年全年4144亿港元的历史峰值仅差约130亿港元。\n年内港股IPO市场呈现鲜明特点：融资额向少数大项目集中，前十大IPO募资额占整体募资额比例达45%，中小盘新股并不“好发”；上半年打新盈利确定性较强，但自第三季度开始，新股首日破发率阶段性走高；港股IPO融资高速扩张下，基石投资者挑选IPO标的更为审慎。（上证报）","tags":[],"cluster_size":2,"ts":"2026-10-28T23:39:00"},{"id":37416,"title":"锂电业营收整体上行，利润修复梯次拉开","url":"https://wallstreetcn.com/livenews/3189473","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"根据同花顺iFind数据初步统计，截至10月27日，按申万行业分类，锂电池板块已有19家A股公司披露2026年三季报，合计实现营收6203.71亿元，实现归母净利润750.50亿元。进一步梳理发现，行业营收整体上行，利润修复沿“铜箔—结构件—部分电池企业”的链条梯次扩散，但内部分化显著：行业龙头宁德时代利润增速低于营收增速，铜箔企业凭借产能利用率回升实现倍数级增长，尾部企业仍徘徊于盈亏线附近。产能利用率水平与产品结构的调整能力，正成为决定企业利润弹性的核心变量。（经济参考报）","tags":[],"cluster_size":1,"ts":"2026-10-28T23:37:48"},{"id":37417,"title":"华尔街见闻早餐 | 2026年10月29日","url":"https://wallstreetcn.com/livenews/3189471","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美联储维持联邦基金利率目标区间在3.75%至4.00%不变，库克与哈马克两名票委主张加息25个基点；美股指三连涨，甲骨文大涨11%，盘后绩后谷歌大跌10%；WTI原油12月合约涨2.88%。\n\n加拿大央行加息25个基点至2.5%，为三年多来首次，称需降低高能源价格向其他商品和服务扩散的风险，并提示可能还需进一步加息。\n\n微软上季Azure收入超预期增48%，资本支出未“失控”，电话会上预计第二财季资本支出预计超500亿美元，预计第二财季总收入960亿-971亿美元，盘后大涨。\n\n谷歌大跌，Q3业绩不及预期，自由现金流大幅下降，资本开支不及预期，AI投入回报质疑加剧。\n\nSK海力士三季度营业利润同比增七倍至83.33万亿韩元，宣布约100万亿韩元股东回报，称存储芯片供应短缺将持续至2030年。\n\n甲骨文宣布2028财年下半年自由现金流转正、2029财年超300亿美元，2030财年前额外融资上限锁定200亿美元，股价收涨10.58%。\n\n报道称迈威尔科技洽谈收购数据中心光模块厂商Lumentum，预计最快下周宣布，迈威尔科技盘后一度重挫12%。\n\n伊朗拒绝卡塔尔转交的美国停战草案，称核问题上不会让步；美国已通知多个海湾国家为中期选举后的军事行动做准备。\n\n以色列大选计票现反转：内塔尼亚胡反超，但组阁仍无定局，阿拉伯政党成关键变量。","tags":[],"cluster_size":1,"ts":"2026-10-28T23:26:44"},{"id":37418,"title":"BE半导体实业分析师电话会议要点总结","url":"https://wallstreetcn.com/livenews/3189487","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"一、2026年第三季度财务及业绩表现。\n\n1、营收与订单：2026年第三季度，BE半导体实业公司（BESI）实现营收2.834亿欧元，季环比增长13.4%，同比增长113.6%。第三季度订单额达到3.426亿欧元，季环比增长17%，同比增长96.1%。过去12个月的累计订单增至12亿欧元。\n\n2、利润与利润率：第三季度净利润1.072亿欧元，季环比增长20.4%，同比大幅增长323.7%。净利润率达到37.8%，较2025年同期翻倍。基准营业费用占营收比例从去年同期的32%降至16.4%，凸显了业务模式的运营杠杆。\n\n3、年初至今表现：前三季度营收达7.181亿欧元（同比增长69%），订单额达9.052亿欧元（同比超过翻倍），净利润达2.478亿欧元（同比增长179.1%，净利润率达34.5%）。\n\n4、流动性与股东回报：截至9月30日，净现金增至2.466亿欧元（同比增加2.544亿欧元）。该公司将从10月27日开始的年度周期内，将股票回购计划规模增加至1.0亿欧元。","tags":[],"cluster_size":1,"ts":"2026-10-28T23:17:48"},{"id":37419,"title":"纳斯达克100股指期货跌超1%，标普500股指期货跌0.36%，罗素2000股指期货涨0.36%，道指期货涨0.1%。","url":"https://wallstreetcn.com/livenews/3189456","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克100股指期货跌超1%，标普500股指期货跌0.36%，罗素2000股指期货涨0.36%，道指期货涨0.1%。","tags":[],"cluster_size":1,"ts":"2026-10-28T22:55:27"},{"id":37420,"title":"多家券商国际评级获上调，经营实力与跨境服务受关注","url":"https://wallstreetcn.com/livenews/3189451","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"今年以来，多家券商及境外业务平台的国际评级获上调，涉及ESG评级和信用评级，其经营实力、风险管理及跨境服务能力受到关注。同时，相关券商业绩实现增长，海外股权融资、人民币债券等项目持续落地。分析人士认为，评级调整反映了机构对券商经营质量、行业环境和外部支持的综合判断。信用评级提升为境外客户和合作机构提供了更多参考，券商仍需推动业务拓展与资本、风控能力相匹配，在提升跨境服务能力的同时，增强海外业务盈利的稳定性。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-28T22:48:14"},{"id":37422,"title":"10月28日港股通互联网ETF南方基金份额减少1050万份，重仓股阿里巴巴-W、腾讯控股、百度集团 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1GSzgyLWJnZ1lSYS1nZlAyaGladlh4cjhsRm1TYVhHc1NRR2hwaXlMaDJjenpmTVp0aVBvbUFXMjdvS0VTSWZmUWhDZ0hzdldOSHNOTVhnMThMWm1NdjVMUDlR?oc=5","source":" NalpRRERoRW5uOEFmaU1DaEdnSmg4VE9tVzVTN1NjQVVmcWxQVnQ?oc=5\" target=\"_blank\"\u003e特斯拉Optimus招数据岗确认：机器人想变聪明，全靠“夜班”硬肝\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e凤凰网科技\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-28T08:17:00"},{"id":37574,"title":"马斯克称机器人DRAM需求将超所有计算设备 Optimus保底出货1万—2万台 - 观点网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1WOWtoeHZtRm4zbGh0azZ1MXNPTzJ1RFJEcEVDVjNDNTJ0Q1JvdVRpSFNsbXpmN3VVWVNSLVUyWXJMYnBSTDdsZlBMbFFQUzlhNHJDOVp0RWdBLUlfcno1ODN3?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1WOWtoeHZtRm4zbGh0azZ1MXNPTzJ1RFJEcEVDVjNDNTJ0Q1JvdVRpSFNsbXpmN3VVWVNSLVUyWXJMYnBSTDdsZlBMbFFQUzlhNHJDOVp0RWdBLUlfcno1ODN3?oc=5\" target=\"_blank\"\u003e马斯克称机器人DRAM需求将超所有计算设备 Optimus保底出货1万—2万台\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e观点网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-28T05:47:09"},{"id":37591,"title":"From Biological Curves to Soft Modular Robots: Learning-Based Inverse Design with Uncertainty-Guided Refinement","url":"https://arxiv.org/abs/2610.36681","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36681v1 Announce Type: new \nAbstract: Animals exhibit diverse shape-changing behaviors, from the undulatory swimming of eels to the arching movements of inchworms. Reproducing these biological shapes with modular soft robots offers a promising approach to developing versatile bioinspired robotic systems. However, translating a desired shape into a feasible robotic configuration remains challenging. Existing cable-driven modular soft robots rely on computationally expensive physics-based modeling and combinatorial search for inverse design, making it difficult to efficiently reproduc","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37590,"title":"Mimetic Embodiment Transfer of Human-Humanoid Interaction from In-the-Wild Videos","url":"https://arxiv.org/abs/2610.36615","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36615v1 Announce Type: new \nAbstract: Enabling a humanoid to interact naturally with human partners requires preserving not only individual motions but also the spatial, semantic, and contact relationships underlying the interaction (i.e., hugging, dancing, hand-shaking, etc.). Furthermore, a practical solution should generalize across various humanoid embodiments with distinct morphologies and kinematic constraints. To tackle this challenge, we propose HumiTransfer, a mimetic embodiment transfer framework that converts in-the-wild human-human interaction videos into physically plau","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37589,"title":"Camera-to-Quadruped Robot Pose Estimation from Sequential Images","url":"https://arxiv.org/abs/2610.36599","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36599v1 Announce Type: new \nAbstract: Quadruped robots are increasingly deployed in hazardous environments such as disaster response and facility inspection, where external-camera monitoring is essential for safe operation. This setting is challenging because quadrupeds are articulated systems with time-varying leg joints, leg symmetry, and frequent self-occlusions, which make keypoint correspondence ambiguous. Moreover, no public benchmark exists, making quantitative comparison difficult. To address these challenges, we propose QuadPose, which estimates the full-body 18-DoF pose (6","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37588,"title":"OpenJaws: An Open Hardware UMI Framework with Stereo Localization for Generalist Manipulation","url":"https://arxiv.org/abs/2610.36598","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36598v1 Announce Type: new \nAbstract: Handheld data-collection interfaces such as the Universal Manipulation Interface (UMI) allow manipulation demonstrations to be gathered in the wild without a robot in the loop, but the quality of the resulting action labels is bounded by the accuracy of vision-based localization. Existing systems recover end-effector pose from monocular visual-inertial odometry, which is subject to scale ambiguity and drift, or delegate tracking to closed-source modules and external infrastructure that reintroduce cost and setup burden. We present OpenJaws, a fu","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37587,"title":"REACH: An RL-based Hierarchical Humanoid Crawling Framework for Adaptable Confined Space Traversal","url":"https://arxiv.org/abs/2610.36546","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36546v1 Announce Type: new \nAbstract: Humanoid locomotion in confined spaces requires continuous height adaptation across multiple locomotion modes, yet most existing approaches remain limited to height-adjustable bipedal walking. We present REACH, an RL-based hierarchical framework that enables a Unitree G1 humanoid to traverse height-constrained environments through variable-height bipedal walking and crawling. The learned policies regulate body height over complementary command ranges of 1.27--0.50m in bipedal locomotion and 0.50--0.20m in crawling, extending traversal beyond the","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37586,"title":"CARD: Contact-Anchored Retargeting for Dexterous Manipulation","url":"https://arxiv.org/abs/2610.36539","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36539v1 Announce Type: new \nAbstract: Humans are dexterous, but traditional data collection paradigms such as teleoperation, kinesthetic teaching, and wearable exoskeletons force humans to act through the robot embodiment, bottlenecking their dexterity. Retargeting can avoid this. However, existing methods purely translate kinematics and ignore the real-world contact dynamics essential for task success. We present CARD: Contact-Anchored Retargeting for Dexterous Manipulation, a simulator and object-free framework that retargets human demonstrations to robot actions by explicitly pre","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37585,"title":"A Trainable CPG Framework for Quadruped Locomotion","url":"https://arxiv.org/abs/2610.36537","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36537v1 Announce Type: new \nAbstract: We present CPG-ENN, a trainable quadruped locomotion framework that combines explicit neural coordination with learned motion realization. A symmetry-based eight-neuron central pattern generator (CPG) supplies gait rhythms, while a pretrained, leg-shared execution neural network (ENN) maps rhythmic signals and trajectory parameters to joint-angle references without online inverse kinematics. A single feedback policy modulates six physically interpretable trajectory variables. The controller tracks planar velocity and yaw-rate commands across wal","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37584,"title":"RoboAuto: Autonomous Robot Program Search through Multi-Level Physical Understanding","url":"https://arxiv.org/abs/2610.36533","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36533v1 Announce Type: new \nAbstract: Recently, LLM-based autonomous agents have shown strong capabilities in iteratively generating, evaluating, and refining executable solutions. In robotic manipulation, Code-as-Policy lets these agents search over modular and editable robot programs. However, effective program search requires physical understanding: agents must understand how objects can be manipulated, how scene geometry constrains actions, and why interactions succeed or fail. Existing methods rely mainly on execution feedback for program refinement, often leaving these physica","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37583,"title":"GRAFT: Geometry-Aware Residual Adaptation for Foundation Trackers","url":"https://arxiv.org/abs/2610.36507","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36507v1 Announce Type: new \nAbstract: Humanoid behavior foundation models (BFMs) provide reusable whole-body motion priors: given a kinematic reference, they generate coordinated joint commands for motion replay, teleoperation, and VLA control. However, trained primarily on flat-ground motion, BFMs lack an explicit mechanism to adapt foot placement, swing clearance, and contact timing to local terrain. Many terrain-aware BFM approaches address this limitation by retraining or fine-tuning the tracker together with perception, incurring substantial data and computation costs while cou","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37582,"title":"Whole-Body Humanoid Control via Stochastic Motion Tokenization","url":"https://arxiv.org/abs/2610.36452","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36452v1 Announce Type: new \nAbstract: While velocity-commanded RL policies are effective for controlling quadrupeds, they are a limited interface for humanoids that need to perform complex whole-body motions. Furthermore, RL tracking policies for whole-body motions typically have limited information about the desired future motion, preventing them from performing controlled deviations to achieve long-term task success; such information is particularly relevant when a controller must prepare for transitions between behaviors. We address these challenges using concise motion represent","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37581,"title":"HIDRA: Hierarchical Dual-Routing Attention for Replay-Free Lifelong Imitation Learning","url":"https://arxiv.org/abs/2610.36374","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36374v1 Announce Type: new \nAbstract: Robotic agents operating in real-world environments must adapt continuously from a stream of multimodal demonstrations, often under constraints that preclude storing or revisiting past data. In this replay-free, single-pass lifelong imitation learning setting, sequential updates can progressively distort the representation space, making expert-based approaches particularly sensitive to routing interference, causing expert selection to degrade over time. We propose HIDRA, a structured routing framework that mitigates this issue through a hierarch","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37580,"title":"ASPEN: Adaptive Semantic Reasoning via Command Persistence Prediction for Efficient Navigation VLAs","url":"https://arxiv.org/abs/2610.36285","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36285v1 Announce Type: new \nAbstract: Navigation vision-language-action (VLA) policies repeatedly invoke costly semantic reasoning even when the next command remains unchanged. Command reuse can reduce computation but risks missing instruction-dependent turns or stops. We introduce ASPEN, an event-triggered scheduler based on command persistence prediction: estimating whether the frozen base policy would reissue its previous command. A lightweight multimodal predictor combines temporal observations, language instructions, execution history, and cached VLA confidence. At eligible com","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37579,"title":"Learning Multi-Phase Robot Loco-Manipulation via Phase-Conditioned Policy Optimization","url":"https://arxiv.org/abs/2610.36270","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36270v1 Announce Type: new \nAbstract: Complex whole-body loco-manipulation requires executing diverse maneuvers, such as crouching, grasping, and locomotion, within a single long-horizon task. While performing simple pick-and-place behaviors is well-established, scaling to complex, long-horizon tasks remains difficult. Currently, this challenge is addressed by relying on human motion data and correspondingly humanoid platforms, which limits platform independence and introduces substantial data processing overhead. Instead, we extend proximal policy optimization (PPO) to train a sing","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37578,"title":"cuArms: GPU-Accelerated Conflict-Based Planning for Multi-Arm Manipulation","url":"https://arxiv.org/abs/2610.36250","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36250v1 Announce Type: new \nAbstract: Multi-arm manipulation has the potential to dramatically improve the throughput, efficiency, and dexterity of many manipulation tasks. Recent work coordinates multiple robot arms in a shared workcell by allocating and scheduling tasks for greater parallelism, jointly planning multi-arm motions, or directly learning multi-arm policies. So far, these approaches are either too slow, rely on domain-specific assumptions, or scale poorly with the number of robots and task horizon. Thus, we introduce cuArms, a conflict-based planner co-designed with GP","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37577,"title":"Program-Level Adversarial Co-Adaptive Self-Play for Robotic Security","url":"https://arxiv.org/abs/2610.36143","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36143v1 Announce Type: new \nAbstract: Coding agents can adapt robotic software by revising executable programs, but successful responses to an evolving opponent may not remain effective. We present a framework for program-level adversarial co-adaptive self-play in which coding agents generate attacks and defenses from tested opponent code and mission feedback, without model fine-tuning. Environment-specific interfaces support external programs for autonomous driving and SDK-level defenses for humanoid locomotion. Two eight-generation case studies reveal concrete software responses:","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37576,"title":"Rollback: Experience Backtracking in World Models for Policy Improvement","url":"https://arxiv.org/abs/2610.36068","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36068v1 Announce Type: new \nAbstract: Action-conditioned world models offer a scalable alternative to costly real-world interaction for improving robot policies. However, existing world-model-based methods largely treat world models as forward-only surrogates of the physical environment, leaving untapped a capability no physical environment affords: rewinding to past decision points to explore counterfactual futures. We introduce Rollback, a policy improvement paradigm that turns world models from passive simulators into counterfactual engines: it rolls back to critical decision poi","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37575,"title":"E0.5: From Reconstructive to Future-Predictive 3D Foundations for Robotic World-Action Modeling","url":"https://arxiv.org/abs/2610.36011","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.36011v1 Announce Type: new \nAbstract: World-action models (WAMs) offer a promising framework for embodied intelligence, yet mainstream approaches remain centered on video foundation models or vision-language models. Even when geometric features extracted by 3D models such as VGGT are incorporated, they are typically passed into a video model or VLM that serves as the primary backbone, leaving 3D geometry as an auxiliary input or prediction target rather than the native foundation for world modeling. We present E0.5, a geometry-native world-action model built directly on 3D foundatio","tags":[],"cluster_size":1,"ts":"2026-10-28T04:00:00"},{"id":37592,"title":"【图】终极目标是无线充电 特斯拉计划用人形机器人为Robotaxi充电 - 汽车之家","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE95SG9hMlY2dEN2S0F3cmdJY0J3VW5FN21VUnR5eC1LTkZQSVh1ck9Bc3MtUGhTMU1BazRRMXRjbEdHd3l2VUlidkI2RkQ2cnRXblY4S1Z4R1VtSVJFRzJIVDRR?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器 // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
