增强。市场人士认为，更多上市公司及股东有望持续加大分红、回购与增持力度，在提升市值管理能力与意愿的同时，形成股东权益、上市公司市值与股东结构优化的正向循环。（中证报）","tags":[],"cluster_size":1,"ts":"2026-10-18T23:27:11"},{"id":34482,"title":"华尔街见闻早餐 | 2026年10月19日","url":"https://wallstreetcn.com/livenews/3180712","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"AI交易忧虑压垮美股，上周五纳指跌超2%、CoreWeave暴跌12%，芯片指数八连跌，布油涨破110美元关口。\n\n法意葡等欧洲多国周六爆发示威，法国55万人参与、2000多人被捕，利摩日百年历史市政厅建筑被烧毁，劳力士、LV等奢侈品门店遭洗劫，马克龙：绝不容忍暴力。\n\n特朗普周五签署行政令豁免对俄多项制裁；泽连斯基周六称，美“星链”限速“有意为之，仅针对乌克兰”、已掌握证据；乌美最快本周举行新一轮会谈，不拘地点和形式，双边、三方乃至五方会谈均愿参加。\n\n美国众议院两党议员提议案，拟撤销已发放俄罗斯柴油相关许可并实施俄能源业制裁。\n\n中国国常会部署深化拓展”人工智能+“行动，要求以落地应用牵引技术创新，会议同时原则通过价格法修正草案、明确治理低价无序竞争。\n\n中国商务部、科技部拟对人工智能、生物医药、光伏三个领域40项技术实施出口管制，其中禁止出口14项、限制出口26项，并同步实施出口前登记管理。\n\n中国央行就银行间债券市场债券发行管理规则公开征求意见，禁止发行人认购或变相认购自己发行的债券，同时禁止低价承销与虚假投标。\n\n长鑫科技前三季度净利润超1300亿元、日赚4.8亿元，同比大幅扭亏，拟最高20亿回购股票。\n\n苹果首款折叠屏手机iPhone Duo开启预购，首发现货秒空，下单发货已排到明年，苹果称需求“非同寻常”。\n\n提醒：周一将公布中国三季度GDP等重磅经济数据；2026金","tags":[],"cluster_size":1,"ts":"2026-10-18T23:10:28"},{"id":34483,"title":"美股期货亚市盘初走高，标普500指数期货上涨0.3%，纳斯达克100指数期货上涨0.6%。","url":"https://wallstreetcn.com/livenews/3180708","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美股期货亚市盘初走高，标普500指数期货上涨0.3%，纳斯达克100指数期货上涨0.6%。","tags":[],"cluster_size":1,"ts":"2026-10-18T22:44:19"},{"id":34484,"title":"资金避险需求升温，债基扎堆限购","url":"https://wallstreetcn.com/livenews/3180706","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"权益市场震荡，资金避险需求升温，股债“跷跷板”效应再度显现。近期，场内债券型ETF迎来资金流入盛况，而博时基金、华宝基金、天弘基金等多家基金公司纷纷收紧旗下场外债基的大额申购额度。业内人士认为，四季度债市整体具备支撑因素，但行情节奏的把握仍是关键。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-18T22:40:02"},{"id":34485,"title":"首批基金2026年三季报披露，基金经理看好权益资产长期表现","url":"https://wallstreetcn.com/livenews/3180705","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"公募基金2026年三季报披露大幕正式拉开。近日，金信基金、南方基金、东财基金等基金公司率先披露旗下部分基金三季报。整体来看，在三季度的震荡行情中，多只基金调整了持仓结构，部分次新基金则快速建仓。在季报中，多位基金经理对权益资产持乐观态度，看好企业盈利质量向好与产业长期发展空间广阔的公司。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-18T22:38:50"},{"id":34486,"title":"机构：A股估值性价比进一步改善，建议均衡配置应对市场波动","url":"https://wallstreetcn.com/livenews/3180704","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周，A股延续9月下旬以来的调整态势，沪指一度下探至3700点关口下方。不过，10月15日、16日两个交易日，在宽基ETF大幅放量的带动下，A股主要指数企稳。部分券商策略展望报告认为，本轮市场调整是海外宏观扰动与内部结构压力共同作用、叠加传导的结果。而调整至当前位置，市场前期筹码压力得到集中释放，ETF资金放量净流入形成重要支撑，A股市场阶段底部区域已逐步清晰。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-18T22:37:44"},{"id":34487,"title":"多家A股公司发布回购增持计划","url":"https://wallstreetcn.com/livenews/3180700","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"上周末，A股多家上市公司集中披露回购、增持相关公告。据记者不完全统计，自10月16日晚间至18日晚间，共有超过30家沪市主板公司发布相关公告。其中：至少有6家公司推出股份回购预案，1家公司发布股东增持计划，这些公司主要集中在半导体、电子材料等科技赛道；另有一批上市公司披露股份回购或股东增持的实施进展情况。宣布回购新计划的公司中，包括海光信息、生益科技、中科曙光、澜起科技等多家市值超千亿的科技公司。（上证报）","tags":[],"cluster_size":1,"ts":"2026-10-18T22:21:10"},{"id":34488,"title":"AI与涨价双轮驱动，逾130家A股公司三季报预喜","url":"https://wallstreetcn.com/livenews/3180699","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"Wind数据显示，截至10月18日18时，已有159家A股公司发布三季度业绩预告，其中132家公司预喜，包括98家预增、13家扭亏、21家略增，整体预喜占比达83.02%。恒力石化、联讯仪器、复旦微电、翰宇药业等61家公司预计归母净利润同比增幅超过100%，其中7家预增幅度逾10倍。","tags":[],"cluster_size":1,"ts":"2026-10-18T22:20:02"},{"id":34489,"title":"上证报头版文章：先行指标释放暖意，经济运行有望延续向好态势","url":"https://wallstreetcn.com/livenews/3180698","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"国家统计局将于10月19日发布前三季度经济运行数据。机构普遍预测，在工业生产和服务业保持韧性、出口强劲及低基数影响下，三季度经济运行有望延续向好态势。","tags":[],"cluster_size":1,"ts":"2026-10-18T22:18:53"},{"id":34490,"title":"中国移动香港建成全港首个U6GHz网络|香港特别行政区|中国香港|5GA|频谱|频段 - 新浪财经","url":"https://news.google.com/rss/articles/CBMiggRBVV95cUxNOGlzd0NZUl9uaXVOeW1sSXByOFNkSTNfR19vTEw5Ni0wSDc3NDVKWURoSnJNYjZsMXQ4d3FOQTA5UHNlZHlGYVJIQ3FFa0lDRjN0c1hMRjV6ZzRzcG9lT1FsY01uWW52TU5kRm53Nm1DMFRWUjRHeW1wd2JpRlByZktxMl9sV2VqNmxpNGhQdnVRRFhJVXh3dUZ0RWdDM0RVTEd3V2N4MDB5MEhvTDZkMDlaclRoY1FqTlV4dmhMZmN1UTl4anExdDIxa0g1OXE4UlV0RkhuTUdBdVhuMVZuN1p4R1FLTk9WS1FyZndYUmV3UzlCbWFlVGdoVnVOZ2lsbHplRjBDMnd0bEVvY2o2RFJsaVBvbjhpM0FrcXZhb3g2SlBOVGEyOVNRLUdmUVhhb0Q5RVpaLUNETkt4bF9MdHhIU2w4TzlfWFd2UEpPR ered by a general foundation model,\u0026#160;is about to have [\u0026#8230;]","tags":[],"cluster_size":1,"ts":"2026-10-16T16:30:00"},{"id":33829,"title":"An Nvidia insider-turned-VC on why robotics hasn’t hit its ChatGPT moment, yet","url":"https://techcrunch.com/video/a-nvidia-insider-turned-vc-on-why-robotics-hasnt-hit-its-chatgpt-moment-yet/","source":"TechCrunch · Robotics","sources":["TechCrunch · Robotics"],"summary":"Amulya Vishwanath, who spent seven years leading product marketing for NVIDIA’s robotics platforms, says robotics is currently in its “Lego era,” with the basic building blocks like actuators, robotic hands, software, and safety standards still being\u0026#160;rebuilt.\u0026#160; This view runs counter to those who believe that robotics, powered by a general foundation model,\u0026#160;is about to have [\u0026#8230;]","tags":[],"cluster_size":1,"ts":"2026-10-16T16:30:00"},{"id":34121,"title":"新剑传动机器人 今日宜休扩团队 - 凤凰网财经","url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBCN2RReV9ud19MWUV6MzFJTWNfUXBjX3AyZ0VCcjZPVW1yaVBhdkxjQnVGTWNDZTNmeXVlWnhZRzNHRVI5U0c2UU5wOS1QRTVJ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiUEFVX3lxTFBCN2RReV9ud19MWUV6MzFJTWNfUXBjX3AyZ0VCcjZPVW1yaVBhdkxjQnVGTWNDZTNmeXVlWnhZRzNHRVI5U0c2UU5wOS1QRTVJ?oc=5\" target=\"_blank\"\u003e新剑传动机器人 今日宜休扩团队\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e凤凰网财经\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-16T15:07:22"},{"id":33831,"title":"RoboParty launches open-source RP1 humanoid robot - Engineering.com","url":"https://news.google.com/rss/articles/CBMihAFBVV95cUxORVQ4d1ppbVE4VEc1cmhlc1h3eXhnbVUycW8yaVFOQk1QOGJGY2JZVkNFcjluWmdLY0FhLWhMMjRBUUdIVU9tY3lxbEdGS3Fsd09zZWNrQ2ZreHdpM0NfUXZBMmVGelk4MlVvZnhKWDFDUGZXaDFXbU5FLVB1TmZUa2tZaFk?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMihAFBVV95cUxORVQ4d1ppbVE4VEc1cmhlc1h3eXhnbVUycW8yaVFOQk1QOGJGY2JZVkNFcjluWmdLY0FhLWhMMjRBUUdIVU9tY3lxbEdGS3Fsd09zZWNrQ2ZreHdpM0NfUXZBMmVGelk4MlVvZnhKWDFDUGZXaDFXbU5FLVB1TmZUa2tZaFk?oc=5\" target=\"_blank\"\u003eRoboParty launches open-source RP1 humanoid robot\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eEngineering.com\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-16T11:25:25"},{"id":33832,"title":"特斯拉Optimus V3量产催化，机器人ETF易方达涨2.72% - 搜狐","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQNzl1aWdiRDZQZTBORVU2VVdZeElVbnpGd0ZLS3VxQUVBT2xQVXBtRWZqQVhvcmdGdzFsRXNkUlVMaU5KUHN3VHNOT1YzY0oyZGpMTU5UNk56VzQ4NVBYU3Q3bUNDVEVhdTdFVFBIcWFYcnZZY0RmdWR3SVZ1bGp4U2ZhX0dudkFiRENlYQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQNzl1aWdiRDZQZTBORVU2VVdZeElVbnpGd0ZLS3VxQUVBT2xQVXBtRWZqQVhvcmdGdzFsRXNkUlVMaU5KUHN3VHNOT1YzY0oyZGpMTU5UNk56VzQ4NVBYU3Q3bUNDVEVhdTdFVFBIcWFYcnZZY0RmdWR3SVZ1bGp4U2ZhX0dudkFiRENlYQ?oc=5\" target=\"_blank\"\u003e特斯拉Optimus V3量产催化，机器人ETF易方达涨2.72%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-16T04:40:00"},{"id":33851,"title":"Evo-DexBench: Benchmarking Generalization across Related Tasks for Dexterous Manipulation","url":"https://arxiv.org/abs/2610.21180","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21180v1 Announce Type: new \nAbstract: General-purpose dexterous manipulation requires policies to transfer knowledge from related tasks to new tasks with only a few target demonstrations. Existing benchmarks often provide too many target demonstrations. They also leave the differences between source and target tasks uncontrolled. As a result, they cannot clearly distinguish knowledge transfer from task memorization. Our key insight is the Core-Gen principle. Core tasks are related tasks that share a functional interaction and provide source knowledge, while a Gen task is a novel tar","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33850,"title":"When to Ask for Help: A Decision-Theoretic Account and Measurement Standard for Slow-Module Scheduling in Dual-System Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.21160","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21160v1 Announce Type: new \nAbstract: Dual-system vision-language-action (VLA) models pair a high-frequency fast policy with a slow, expensive module, and published trigger mechanisms for invoking it lack a shared objective, measured costs, and any standard separating schedule quality from module quality. We provide the missing account: invocation is formalized as a calibrated decision problem whose fixed-ratio, fixed-budget, and history-gated schedules are degenerate cases of one quantity, the Value of Intervention (VoI); a renewal baseline proves the optimal schedule periodic unde","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33849,"title":"KODA: Kinematics--Observation Data Alignment for Humanoid Learning from Human Egocentric Demonstration","url":"https://arxiv.org/abs/2610.21152","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21152v1 Announce Type: new \nAbstract: Training humanoid whole-body vision-language-action (VLA) policies requires costly robot demonstrations with aligned robot-view observations and controller-compatible whole-body state-action labels. Egocentric human demonstrations offer scalable supervision but have misaligned views and sparse motion cues. Existing approaches either pretrain policies that still require robot data for adaptation or generate controller-specific commands that limit reuse. Conversion also requires robot-view observations aligned with the generated whole-body motion.","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33848,"title":"Manifold Generative Annealing for Contact Constraint-aware Impedance Control with Reinforcement Learning Prior","url":"https://arxiv.org/abs/2610.21140","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.21140v1 Announce Type: new \nAbstract: Contact-rich robotic tasks require coordinated motion and impedance under uncertain interaction dynamics and physical constraints. While recent methods on learned policies provide useful interaction strategies, they may fail when contact conditions differ from those encountered during training. Model-based generative methods show promising receding-horizon trajectories optimization results, but often lack structured behavioral guidance and refinement that jointly accounts for constraint geometry and actual contact responses. To this end, we prop","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33847,"title":"MoCaP: Mobile Code-as-Policies for Zero-Shot Mobile Manipulation from Passive Human Videos","url":"https://arxiv.org/abs/2610.20998","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20998v1 Announce Type: new \nAbstract: Passive human videos of everyday activity offer robots access to a massive amount of human experience without requiring a demonstration for each task. However, using this experience requires recovering knowledge from unstructured video recordings and adapting it to a different body (i.e., the robot). To overcome these challenges, we present mobile code-as-policy (MoCaP), an agentic framework that turns passive human video recordings into guidance for an end-to-end mobile manipulation policy. MoCaP extracts spatial memory and cues of how people p","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33846,"title":"When a robot can trust reversing wind to find an odour source","url":"https://arxiv.org/abs/2610.20970","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20970v1 Announce Type: new \nAbstract: A wind-derived heading can guide a robot towards an odour source even after the wind reverses, but its reliability depends on the plume's transport history. On a quadruped initially facing the source, holding the initial heading reached it in every reversing-wind trial, whereas comparison controllers never settled there. An exact geometric condition links heading correctness to net odour transport, and simulations separate sensing error from departures from nominal flow. Where the alternating wind directions are too close for reversal alone to p","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33845,"title":"SOMA: Stack-of-Objects Manipulation using a Quadruped Robot","url":"https://arxiv.org/abs/2610.20968","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20968v1 Announce Type: new \nAbstract: Executing heavy-duty physical manipulation in unpredictable environments remains a major challenge for quadrupedal robots lacking dedicated manipulators. This paper presents SOMA, a hierarchical reinforcement learning framework for whole-body non-prehensile manipulation of multi-object stacks using a quadruped robot. Unlike traditional methods restricted to two-dimensional planar pushing, SOMA integrates explicit robot base-height control, unlocking full three-dimensional pushing strategies. This capability enables the quadruped to manipulate co","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33844,"title":"Line-Augmented cuVSLAM: Robust Visual Odometry in Low-Texture Environments","url":"https://arxiv.org/abs/2610.20958","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20958v1 Announce Type: new \nAbstract: Autonomous mobile robots in warehouses and production facilities operate in precisely the environments that defeat point-feature visual odometry: featureless aisles, uniform walls, repetitive racking and specular floors. Such environments are, however, rich in straight-edge structure: rack uprights, door frames, wall junctions and cabinet outlines present high-contrast linear edges stable across wide viewpoint changes. A line-feature extension to cuVSLAM, a CUDA-accelerated visual-SLAM system, is presented that recovers this signal. Lines are pa","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33843,"title":"LEAP: Gradient Flow Augmented Lagrangian Trajectory Optimization for Contact Constrained Robots","url":"https://arxiv.org/abs/2610.20936","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20936v1 Announce Type: new \nAbstract: Generating dynamically feasible motions for legged and manipulating robots requires solving a large, nonlinear, non-convex optimal control problem (OCP) in which contact wrenches must satisfy friction-cone constraints throughout the motion, not only at isolated instants. Existing solvers are sensitive to the initial guess and scale poorly with the number of joints. This paper introduces LEAP, which transcribes the OCP with pseudospectral collocation and, instead of a Newton or SQP solve, integrates a primal--dual gradient flow of a Powell--Heste","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33842,"title":"Planning to Learn: Real-Time Robust Adaptive Control on the GPU with Guaranteed Future Learning","url":"https://arxiv.org/abs/2610.20925","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20925v1 Announce Type: new \nAbstract: Robust adaptive control is vital for keeping robots safe while actively reducing uncertainty in unfamiliar settings. However, traditional methods are often conservative since they fail to account for guaranteed future parameter learning during planning and struggle to scale to high-dimensional systems. In this work, we present A-SLS, a learning-aware robust adaptive model predictive control (RAMPC) framework based on system-level synthesis. A-SLS forecasts future parameter uncertainty and preserves correlations between process disturbances, para","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33841,"title":"EgoJEPA: Beyond Retargeting for Dexterous Manipulation from Egocentric Videos","url":"https://arxiv.org/abs/2610.20904","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20904v1 Announce Type: new \nAbstract: Egocentric human videos offer a scalable alternative to costly robot demonstra- tions, yet transferring their manipulation priors to robot control remains chal- lenging. The commonly adopted retargeting-based approaches convert human wrist and finger poses into embodiment-specific action commands through hand- crafted geometric mappings. However, such mappings require meticulous recal- ibration across different embodiments and risk propagating hand-tracking errors into downstream robot control pipelines. To this end, we propose EgoJEPA, a three-","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33840,"title":"TGrasp6D: Task-Informed Vision-Language Priors and Pose Refinement enable Zero-Shot Task-Oriented 6DoF Grasping","url":"https://arxiv.org/abs/2610.20901","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20901v1 Announce Type: new \nAbstract: Task-Oriented Grasping (TOG) has emerged as an important skill for purposeful robotic manipulation. Given the task of using a knife to \"slice bread,\" a robot must choose to grasp from the handle, whereas for \"hand[ing] the knife over,\" it is preferable for the handle to remain unobstructed for safe handoff. Current approaches for TOG either focus on 2D planar grasping, remain limited by their reliance on task-agnostic grasp generators, or are constrained by reliance on finite, manually-annotated, task-specific grasp datasets that cannot cover al","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33839,"title":"BubbleCBF: Constructive Safety for Second-Order Systems and Application to Autonomous Robot Navigation in Unknown Environments","url":"https://arxiv.org/abs/2610.20895","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20895v1 Announce Type: new \nAbstract: Satisfying safety constraints for systems with second-order dynamics is challenging because a position constraint may require infeasible deceleration. Higher-order control barrier functions (CBFs) provide an approach for expressing safety conditions for such systems but feasibility depends on the system dynamics and available control authority. We develop a constructive approach for designing feasible safety constraints for second-order control-affine systems. Starting from a signed distance function (SDF), we construct collision-free spheres, i","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33838,"title":"Optimally Trading Energy for Information through Speed Trajectory Optimization of Sustainably Powered Mobile Robots","url":"https://arxiv.org/abs/2610.20875","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20875v1 Announce Type: new \nAbstract: Sustainably powered mobile robots enable long-duration observational missions by harvesting energy from the environment. However, effective autonomy requires the robots to make decisions as to how to allocate this energy to maximize information quality over time. In this paper, we study a persistent (infinite-horizon) speed trajectory optimization problem that is posed as a periodic optimal control problem in which a robot repeatedly traverses a fixed closed path, coupling a super-linear propulsion cost with dynamic information gain and decay. U","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33837,"title":"A Phenomenology of Neural Geometry in Vision-Language-Action Models","url":"https://arxiv.org/abs/2610.20840","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20840v1 Announce Type: new \nAbstract: Robotic manipulation is inherently geometric, but what shape does the world take inside the policy that performs it? Prior work on vision-language-action (VLA) policies establishes that task-relevant variables are linearly readable from activations, yet readability certifies only that a variable is present and says nothing about the shape its values trace, which may be curved and multi-dimensional. Using controlled sweeps, natural rollouts, linear probes, and activation interventions, we build a taxonomy of seven task-relevant concepts in VLA mo","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"},{"id":33836,"title":"Persistent Profile-Guided Reset-Free Recovery Improves Final Gait Selection after Irreversible Leg Damage","url":"https://arxiv.org/abs/2610.20838","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.20838v1 Announce Type: new \nAbstract: Damage-recovery algorithms often rank gaits from short trials, yet a gait that performs well briefly may not remain effective during continued execution. In reset-free recovery, each trial also changes the physical state inherited by the next. We introduce persistent profile-guided reset-free recovery (PGRR), which predicts multiple outcomes over repeated gait execution and uses conservative uncertainty-aware estimates to guide short online probes without resetting the robot. Across 108 matched MuJoCo tasks spanning leg amputation, distal fractu","tags":[],"cluster_size":1,"ts":"2026-10-16T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
