:"地方中小银行纷纷推出大额存单，主打中短期产品","url":"https://wallstreetcn.com/livenews/3146311","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，国有大行及多家股份制银行重启5年期大额存单，地方中小银行也同步密集上新大额存单。对比来看，中小银行的大额存单利率具备明显优势，但产品最长仅设置3年期，整体仍以中短期产品为主。梳理中国货币网数据发现，7月份以来，新疆银行、保定银行、金台农商银行、嘉祥农商银行、徐州农商银行、玉树农商银行、泰顺温银村镇银行等超十家地方银行陆续发布大额存单发行公告，部分银行更是年内首次发行该类产品。7月份新公告发行大额存单的银行数量、产品数量，均显著高于6月份。（证券日报）","tags":[],"cluster_size":1,"ts":"2026-08-06T23:23:19"},{"id":17733,"title":"华尔街见闻早餐 | 2026年8月7日","url":"https://wallstreetcn.com/livenews/3146310","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"布油盘中涨超5%；道指止步五连涨，标普500、纳指两连跌，存储芯片股闪迪和西部数据财报后分别跌近7%和逾10%，SpaceX解禁日不跌反涨超6%。\n\n伊朗与阿曼协议拟禁止美以等敌对方船只霍尔木兹通行，伊媒称伊方在海峡附近打击敌方目标；美官员称拒绝航线有任何阻碍。\n\n报道：若未来几周通胀数据强劲，美联储主席沃什将准备9月加息。\n\n报道称特朗普多次致电沃什询问看法，美联储独立性再受关注。\n\n特朗普宣布对多晶硅及其衍生产品加征关税并规定最低进口价。特朗普签署行政令限制使用出生公民权、将严厉打击“生育旅游”。\n\n韩国杠杆ETF监管风暴：金融委员长、总统府政策室长相继遭刑事举报。\n\n宇树科技IPO定价150.8元，DeepSeek、腾讯等获战略配售。\n\n报道：字节讨论训超5万亿参数模型，争取领先位置。\n\nDeepSeek官宣API涨价且“幅度较大”。\n\nAlphabet启动250亿美元发债，获超四倍认购，热度超越亚马逊和SpaceX。\n\n报道：OpenAI智能音箱定价逾300美元，iPhone设计之父操刀设计“甜甜圈”外形。\n\n提醒：周五将公布中国7月进出口和外汇储备数据。","tags":[],"cluster_size":3,"ts":"2026-08-06T23:10:57"},{"id":17734,"title":"腾讯控股(00700.HK)涨超1%，再度升破600港元关口。 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPN2c5cDA2OW9SWHJwaEZaTktfSUhtVm9mWHNGbGtYOW9hU2I5cG9QNE4wQ01BZ1JScS1xSEZZN1ZLTzRxNlJoa0JwNXpZeFpvenNZa0tCelQtOTdmODA4cU94b2FKZjVUOHhid2JQOTJFUVRPaUhrVHA3Z1o4ZW0xZ29BRlJhTmUzdXdqY0ZrRHdwb28yRTd6WUpfQ3Q5dS1VN0Vj?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiowFBVV95cUxPN2c5cDA2OW9SWHJwaEZaTktfSUhtVm9mWHNGbGtYOW9hU2I5cG9QNE4wQ01BZ1JScS1xSEZZN1ZLTzRxNlJoa0JwNXpZeFpvenNZa0tCelQtOTdmODA4cU94b2FKZjVUOHhid2JQOTJFUVRPaUhrVHA3Z1o4ZW0xZ29BRlJhTmUzdXdqY0ZrRHdwb28yRTd6WUpfQ3Q5dS1VN0Vj?oc=5\" target=\"_blank\"\u003e腾讯控股(00700.HK)涨超1%，再度升破600港元关口。\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e富途牛牛\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-06T23:01:11"},{"id":17735,"title":"市场风格剧烈切换，基金换仓迎“大考”","url":"https://wallstreetcn.com/livenews/3146306","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月以来，A股市场迎来剧烈风格切换，此前持续领涨的AI、半导体等科技成长板块出现大幅调整，而前期表现低迷的传统价值板块普遍迎来反弹。在此背景下，多只重仓AI、半导体方向的基金出现较大幅度的回撤。值得关注的是，这批遭遇重挫的基金中，部分产品在二季度刚刚完成大规模换仓，从消费、资源等传统板块切换至科技赛道。其中，既有基金经理交接导致风格变化的情形，也有基金经理在分化行情下主动选择了“追逐趋势”。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-06T22:57:25"},{"id":17736,"title":"扎堆进入股东榜，公募机构紧盯业绩兑现度","url":"https://wallstreetcn.com/livenews/3146305","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月6日，全市场已有超百家A股上市公司披露2026年半年报。数据显示，泽璟制药、仕佳光子、鼎通科技、科大智能等上市公司的前十大股东中，公募基金产品占据半数及以上席位。有基金人士分析，大幅买入直至成为上市公司前十大股东，往往是基金经理特别看好这一投资机会的表现。是什么因素使得各家公募机构旗下产品不约而同地进场？结合半年报业绩来看，这些公司普遍呈现出净利润高增长或进入盈利拐点的特点。这恰恰与近年来公募行业看重的成长投资风格审美不谋而合。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-06T22:56:06"},{"id":17737,"title":"机构研判中报窗口开启业绩驱动新周期","url":"https://wallstreetcn.com/livenews/3146304","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"日前多方调研获悉，多家一线机构已形成明确共识：A股本轮调整本质是交易拥挤度的释放与估值阶段性收缩，AI产业长期成长逻辑并未发生实质性逆转，政策底信号显现之下，市场底仍需筹码、情绪与增量资金多重条件共振确认，而这一过程往往需事后回望方能定论。机构人士认为，随着中报业绩进入集中披露窗口，行情正逐步由预期驱动转向业绩兑现驱动，科技与涨价方向景气占优，但板块内部分化将加剧——具备真实业绩与技术壁垒的龙头有望在估值修复中率先受益，而单纯依赖概念与涨价弹性的标的将面临定价重估。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-06T22:48:45"},{"id":17738,"title":"电解液添加剂VC价格一年涨了4倍，供不应求状况短期不变","url":"https://wallstreetcn.com/livenews/3146300","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近期，锂电池电解液添加剂碳酸亚乙烯酯（VC）价格持续上涨。据百川盈孚数据，截至8月6日，国内电解液添加剂VC均价为23万元/吨，6月以来涨幅超过60%，同比上涨400%。多位业内人士表示，VC供不应求的情况短期不会改变。目前国内VC行业名义总产能超过19万吨/年，但业内可稳定供货的有效产能仅约11万吨/年。去年行业企业开工率整体偏低，叠加头部企业集中开展设备检修，行业库存快速下行。对于价格走势，业内人士认为，年内VC价格会持续高位。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-06T22:43:43"},{"id":17739,"title":"两度被拒的Replimune抗癌药终获美国FDA批准","url":"https://wallstreetcn.com/livenews/3146297","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"美国监管机构批准了Replimune Group Inc.的黑色素瘤药物，用于曾接受免疫治疗但治疗失败的患者——这对该药企而言是一次重大胜利，此前其两次获批申请均被该机构驳回。\n\n该药物获得的是加速批准，尚未在对照试验中被证实能延长患者生存期。公司正在进行一项400名患者的验证性试验，旨在证明其确实能延长生存期。\n\n该公司表示，一个典型疗程的药物费用为45万美元。FDA称，该药物的副作用包括疲劳、发热、感染和寒战。\n\nReplimune首席执行官Sushil Patel博士表示：”这是Replimune的变革性时刻，标志着多年来为将Tudriqev带给急需新治疗选择的患者所进行的开创性研究。”\n\nFDA宣布后Replimune股价大幅上涨，周四收盘涨幅达8.7%。该股今年以来已累计上涨32%。","tags":[],"cluster_size":1,"ts":"2026-08-06T22:36:58"},{"id":17740,"title":"周四（8月6日）纽约尾盘，标普500股指期货最终跌0.24%，道指期货跌0.94%，纳斯达克100股指期货跌0.37%。\n\n罗素2000股指期货跌0.67%。","url":"https://wallstreetcn.com/livenews/3146271","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周四（8月6日）纽约尾盘，标普500股指期货最终跌0.24%，道指期货跌0.94%，纳斯达克100股指期货跌0.37%。\n\n罗素2000股指期货跌0.67%。","tags":[],"cluster_size":1,"ts":"2026-08-06T21:09:06"},{"id":17741,"title":"标普500指数的11个板块中，工业、房地产板块收跌0.83%，电信板块跌0.73%，信息技术/科技板块涨0.09%，保健板块涨0.14%，能源板块涨1.59%。","url":"https://wallstreetcn.com/livenews/3146260","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"标普500指数的11个板块中，工业、房地产板块收跌0.83%，电信板块跌0.73%，信息技术/科技板块涨0.09%，保健板块涨0.14%，能源板块涨1.59%。","tags":[],"cluster_size":1,"ts":"2026-08-06T20:31:12"},{"id":17742,"title":"中概指数、CQQQ收涨约0.3%，再鼎医药涨超13.6%，晶科能源涨超2.5%，金山云、世纪互联跌约3%","url":"https://wallstreetcn.com/livenews/3146245","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"纳斯达克金龙中国指数收涨0.27%，报6570.30点，整体低开高走。\n\nETF中，中国科技指数ETF（CQQQ）收涨0.31%，中概互联网指数ETF（KWEB）收跌0.56%。\n\n德银嘉实沪深300指数ETF（ASHR）收涨0.55%，XtrackersHarvest中证50（ASHS）收涨0.34%，MSCI新兴市场ex中国ETF（EMXC）收跌1.21%。","tags":[],"cluster_size":1,"ts":"2026-08-06T20:00:29"},{"id":17743,"title":"中国移动（00941.HK）：8月6日南向资金减持305.25万股 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxOWVhsZ01kSmZwUkNEaFBBNlAwQVJrTFBIS0R5M0tKQmZIOGozdEtxbklPMHdvR2Z6Sm5Ecm5CcE1PY3ZadV9YT19oM2d0cmtWajJXNC14WGRtR2dYM1piRU8wWWV6WFFmT3VsRWtLdHNPNjNWeWluT1RiYlY0MFQ1T1J3UHM0NlE1cEJVRg?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxOWVhsZ01kSmZwUkNEaFBBNlAwQVJrTFBIS0R5M0tKQmZIOGozdEtxbklPMHdvR2Z6Sm5Ecm5CcE1PY3Za 米 18 标准版。\u003c/p\u003e\u003cp data-vmark=\"70e1\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/8/efc9407c-39e3-4c46-a236-e2c7fdb99792.png\" w=\"750\" h=\"223\" data-vmark=\"617e\" data-mpos=\"2,0\" data-weibo=\"0\"  data-snap-from=\"%7B%22from%22%3A%22weibo%22%2C%22url%22%3A%22https%3A%2F%2Fm.weibo.cn%2Fdetail%2F5328923366786087%22%7D\" class=\"no-alt-img\"\u003e\u003c/p\u003e\u003cp data-vmark=\"a935\"\u003e作为对比，去年发布的\u003cspan class=\"hot-topic\" data-topic-logo=\"//pimg.ithome.com/products/2025/09/26/5a0e7","tags":[],"cluster_size":1,"ts":"2026-08-07T00:40:12"},{"id":17994,"title":"因 Facebook、Instagram 损害青少年权益，Meta 被判支付 5.67 亿美元","url":"https://www.ithome.com/0/986/795.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"f4fb\"\u003eIT之家 8 月 7 日消息，据路透社报道，当地时间 8 月 6 日，美国新墨西哥州圣菲地区法院认定 Meta 应对损害儿童心理健康负责，\u003cstrong\u003e责令该公司支付 5.67 亿美元\u003c/strong\u003e\u003cspan class=\"exch-money-value \"\u003e（IT之家注：现汇率约合 38.35 亿元人民币）\u003c/span\u003e，并改变其平台在该州面向青少年用户的功能机制。\u003c/p\u003e\u003cp data-vmark=\"f7e1\"\u003e法官布莱恩 · 比德沙伊德（Bryan Biedscheid）下达了一项为期五年、总额 5.67 亿美元的裁定，\u003cstrong\u003e强制要求 Meta 实施一系列青少年安全措施\u003c/strong\u003e，其中 4.2 亿美元\u003cspan class=\"exch-money-value \"\u003e（现汇率约合 28.41 亿元人民币）\u003c/span\u003e将用于青少年治疗服务。\u003c/p\u003e\u003cp data-vmark=\"8c48\"\u003e这些措施包括：\u003cstrong\u003e对青少年每月使用 Facebook 和 Instagram 的时长进行限制\u003c/strong\u003e、约束应用通知推送、严加限制成年人联系未成年人、为 AI 聊天机器人设置安全防护，以及强化对儿童性虐待举报的审核机制。\u003c/p\u003e\u003cp data-vmark=\"e3f8\"\u003e\u003cstrong\u003eMeta 表示将对该裁决","tags":[],"cluster_size":1,"ts":"2026-08-07T00:39:12"},{"id":17995,"title":"曝OpenAI最快下周推出Astra AI 全新预训练模型即将亮相 - 中华网","url":"https://news.google.com/rss/articles/CBMicEFVX3lxTE1VZzloMEFrdy11V1VXTVB2U2VWY3VpUnZEYUVUektpTV9JQlQybW9QT3B6dkpNQjgzT2UySUt0b3RoVC1SSWRWXzdsTUVDN1ZVX0F3aUNHaE52RF95QkZ5UWpFSklLU3c5YWJreURMQk0?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.c ates may contain past observations, but they do not provide an explicit interface for deciding which world facts support the currently active goal. We introduce Mimir, a neuro-symbolic memory that separates world memory from task memory and dynamically grounds them before each action. World memory maintains object locations, object states, and perceptual evidence, while task","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17977,"title":"RORA: Realistic Object Reconstruction with Articulation","url":"https://arxiv.org/abs/2608.04842","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04842v1 Announce Type: new \nAbstract: Replicating real-world environments into simulation by realistic visual representation like NeRF and 3D Gaussian Splatting (3DGS) has emerged as an effective strategy to reduce the sim-to-real gap in robot learning. However, implementing object articulation during the real-to-sim process is still a challenging task. Existing motion tracking or learning based articulation methods shows low success rates on complex kinematic structures having multiple joints. Furthermore, those methods require scan of dynamic motion of objects, which makes reconst","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17976,"title":"From Transparent Labware Segmentation to Collision Avoidance: A Real-Time Edge-Aware Perception Pipeline","url":"https://arxiv.org/abs/2608.04769","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04769v1 Announce Type: new \nAbstract: This paper presents an edge-aware instance segmentation framework that enables real-time robotic collision avoidance with transparent laboratory glassware using purely visual perception. Transparent vessels defy conventional segmentation due to refraction, specular reflection, and the absence of stable interior texture, yet their boundary contours remain comparatively reliable visual cues. Exploiting this observation, we augment a one-stage real-time instance segmentation backbone with a lightweight edge-detection branch, edge-guided attention f","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17975,"title":"Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.04765","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04765v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models provide a unified paradigm for connecting visual perception, language understanding, and robotic control. However, existing VLA models still face major challenges in long-horizon tasks: sparse expert demonstrations constrain cross-task compositional generalization; the non-Markovian nature of long-horizon tasks makes it difficult for policies conditioned only on current observations to maintain temporal consistency; limited closed-loop error correction allows execution errors to accumulate; and end-to-end acti","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17974,"title":"Enabling Urgency-aware Robot Swarm Intralogistics using Smart IoT Tags","url":"https://arxiv.org/abs/2608.04721","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04721v1 Announce Type: new \nAbstract: Warehouse items differ in how urgently they must be moved: perishable goods, pharmaceutical shipments, and just-in-time production materials must be delivered sooner than the rest of the stock. Decentralised robot swarms suit warehouses that cannot justify fixed automation infrastructure, but current swarm controllers treat all items alike or rely on an external scheduler to set priorities, so urgent items wait as long as ordinary ones. This paper presents a swarm logistics system in which each warehouse carrier holds an ultra-low-power Internet","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17973,"title":"Suppression Sticks, Locality Is Fragile: A Closed-Loop Target-and-Control Audit of Task-Vector Negation in VLA Policies","url":"https://arxiv.org/abs/2608.04692","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04692v1 Announce Type: new \nAbstract: Task-vector arithmetic offers a closed-form way to modify a model, yet its behavioral locality remains unclear in closed-loop robot control. We present a target-and-control audit of per-skill task-vector subtraction from multitask vision-language-action (VLA) policies. Across all ten LIBERO-Goal skills, subtraction produces three qualitatively different regimes: target-control separation for five skills, resistance for three, and global collapse for two. On held-out initial states, the five suppressible targets remain at 0% success; however, mea","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17972,"title":"Mind-VLA: Instruction-Aware Spatial Representation Alignment for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.04633","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04633v1 Announce Type: new \nAbstract: Recent Vision-Language-Action (VLA) methods improve generalization by aligning their representations with 3D scene geometry. However, these methods are fundamentally instruction-agnostic: the representations align the entire scene uniformly, neglecting the 3D geometry of the specific target object designated by the language instruction. This causes failures on fine-grained manipulation and target occlusion tasks, where success depends on accurate 3D understanding of the target object rather than the entire scene. To address this, we present Mind","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17971,"title":"Static Timing Orchestration for Tree-Structured Robot Control Firmware","url":"https://arxiv.org/abs/2608.04600","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04600v1 Announce Type: new \nAbstract: As robotic systems become increasingly complex, generating control firmware from structural description files has emerged as a promising paradigm for reducing development complexity and improving maintainability. Existing robot description formats naturally represent robotic systems as hierarchical tree structures, where devices are recursively composed into functional subsystems and eventually into the complete robot. However, such tree-structured organization also introduces structured data dependencies that affect perception-to-decision laten","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17970,"title":"Retrieve in Time, Correct in Frequency","url":"https://arxiv.org/abs/2608.04527","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04527v1 Announce Type: new \nAbstract: Frozen vision-language-action (VLA) policies generate temporally extended action chunks, but long-horizon manipulation remains vulnerable to accumulated execution error and visual aliasing across task stages. Successful rollouts provide useful corrective evidence, yet current frame retrieval can return progress-misaligned actions,while direct replay or time-domain fusion can overwrite the reactive structure of the policy proposal. We introduce Retrieve in Time, Correct in Frequency (RTCF), a training-free test-time correction framework that impr","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17969,"title":"GUARD: Grounding Uncertainty and Ablation-Based Risk Detection for Diffusion-Based VLAs","url":"https://arxiv.org/abs/2608.04510","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04510v1 Announce Type: new \nAbstract: Diffusion-based vision-language-action (VLA) policies can generate plausible actions even when their predictions are weakly grounded in the visual and language evidence defining the task. We introduce GUARD, a test-time failure detection method that measures this grounding without modifying the pretrained policy. GUARD estimates the influence of token-indexed entries in the final vision-language model key-value (KV) cache, constructs counterfactual caches by ablating salient KV entries, and compares their denoising responses with the original co","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17968,"title":"SSC: A Verifiable Structured Representation for Bimanual Manipulation Labelling","url":"https://arxiv.org/abs/2608.04425","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04425v1 Announce Type: new \nAbstract: Subtask labels decompose a long-horizon manipulation demonstration into shorter semantic segments for policy training and evaluation. Natural language descriptions are easy to read, but their linguistic variability makes automatic verification difficult. Rigid template formats, such as BEHAVIOR-1K's skill_annotation, are linguistically over-segmented, hindering both readability and annotation consistency. We propose the Structured Subtask Chain (SSC), a state-transition representation that bridges these extremes. A demonstration is a sequence of","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17967,"title":"SCOPE: Field-of-View-Aware Path Planning in Unknown 3D Environments via Safety-Volume Certification","url":"https://arxiv.org/abs/2608.04420","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04420v1 Announce Type: new \nAbstract: Safe navigation with a body-mounted limited-field-of-view sensor requires the complete robot-inflated volume of an intended motion to be observed and verified free before execution. We formulate this requirement as online safety-volume certification in an unknown voxel map and construct a certified graph whose vertices correspond exactly to positions with fully known-free safety volumes. Based on this representation, we propose SCOPE (Safety Certification through Observation Planning and Execution), a planning framework that decouples optimistic","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17966,"title":"Approximate Multi-Objective Search Under Rulebooks","url":"https://arxiv.org/abs/2608.04398","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04398v1 Announce Type: new \nAbstract: Robotic planning often involves multiple objectives with complex priority relationships, such as safety, efficiency, and regulatory compliance. Rulebooks formalize these relationships, allowing partial ordering of objectives that generalizes both Pareto and lexicographic dominance. Computing the full set of rulebook-optimal solutions, however, is computationally expensive. To address this challenge, we introduce the concept of epsilon-rule-dominance, a principled notion of approximate dominance under rulebooks, and propose RA*pex, a best-first s","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17965,"title":"Structured LLM Reasoning for Zero-Shot Human--Robot Coordination Under Hidden Goals","url":"https://arxiv.org/abs/2608.04309","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04309v1 Announce Type: new \nAbstract: We present a structured large-language-model (LLM) architecture for zero-shot human--robot coordination in a cooperative construction task with private goal views. Guided by a Dec-POMDP formulation, the architecture decomposes decision-making into (i) action-conditioned Theory-of-Mind (ToM) inference, (ii) hierarchical planning, (iii) conversation interpretation, (iv) action verification, and (v) feedback-based replanning. We compare the proposed method with an ablation without ToM inference and a multi-agent reinforcement-learning policy traine","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17964,"title":"SAFECAST: Robust Failure Detection for VLA Policies with Contrast-Set Training and Calibration","url":"https://arxiv.org/abs/2608.04246","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04246v1 Announce Type: new \nAbstract: Vision-language-action policies often fail under deployment-time distribution shifts such as clutter, distractor objects, lighting changes, novel objects, altered initial states, and reworded instructions. Hidden-state-based risk probes combined with functional conformal prediction can detect rollout failures, but their reliability depends on calibration data matching deployment conditions. We introduce SAFECAST, which leverages contrast set perturbations to improve hidden-state probe training and calibration for deployment time shift. SAFECAST","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17963,"title":"Feasibility of Embedded Photoplethysmography Sensing in Short-Duration Tactile Interactions With Pocket-Sized Robots Using IMU- and Confidence-Based Filtering","url":"https://arxiv.org/abs/2608.04242","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04242v1 Announce Type: new \nAbstract: Ubiquitous companion robots offer a promising avenue for immediate anxiety relief in children, yet their effectiveness relies on the ability to monitor physiological states continuously and unobtrusively. Current solutions often depend on external wearables, which impose usability barriers and limit the robot's autonomy. This paper investigates the integration of an embedded photoplethysmography (PPG) sensor directly into a pocket-sized companion robot, AffectaPocket, to enable self-contained heart rate monitoring during tactile interaction. We","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17962,"title":"SiMDex: Mining Similar Egocentric Videos for Cross-Embodiment Dexterous Manipulation","url":"https://arxiv.org/abs/2608.04196","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04196v1 Announce Type: new \nAbstract: Recent years have witnessed an explosive trend of scaling ego-centric human videos for robot manipulation, yet it remains unclear which data actually benefits dexterous manipulation. We present SiMDex, a similarity-based data mining framework that casts human data selection for VLA post-training in dexterous manipulation as a recommendation problem. For each robot demonstration, SiMDex employs a three-layer recall-ranking-re-ranking pipeline to extract task-relevant subsets from a pool of ~32M egocentric human samples, operating in a morphology-","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17961,"title":"Interpretable Fuzzy Inference for UAV Target Tracking Using Bounding-Box Geometry","url":"https://arxiv.org/abs/2608.04121","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04121v1 Announce Type: new \nAbstract: Vision-based guidance of unmanned aerial vehicles (UAVs) toward unmanned ground vehicles (UGVs) supports cooperative aerial--ground robotics, but reliable continuous yaw estimation from onboard vision remains challenging because of sensing uncertainty, limited computation, and the need for interpretable control. Existing deep-learning and geometric-reconstruction approaches often require large datasets, external localization, or complex modeling assumptions, reducing transparency and deployment suitability on resource-constrained platforms. We p","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17960,"title":"Kitchen Robotic Manipulation utilizing Foundation Models","url":"https://arxiv.org/abs/2608.04042","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.04042v1 Announce Type: new \nAbstract: Deploying robots in everyday human environments requires perception systems that are both robust and adaptable to diverse, dynamic conditions. In this work, we present a modular perception pipeline for household manipulation tasks, with a focus on dishware handling in kitchen environments. The pipeline integrates open-vocabulary object detection, multi-view segmentation, instance-aware 3D reconstruction, and a 2D-3D feature fusion strategy for 6D pose estimation and grasp planning. Its modular design enables systematic substitution of multiple v","tags":[],"cluster_size":1,"ts":"2026-08-06T04:00:00"},{"id":17396,"title":"【汽车校友百校联盟】特斯拉机器人战略蓝图：以“物理智能”重构具身智能的工业逻辑 - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE9uTEp5bklyOUFmSmpIaW1FTVJIUkJaMFFqVnZwOGg3bUREZk1DWjZYS0dNNnN6MEJWb3pVWDBacjNlWER5RWpkUjNGZ1daSFNINDVJ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE9uTEp5bklyOUFmSmpIaW1FTVJIUkJaMFFqVnZwOGg3bUREZk1DWjZYS0dNNnN6MEJWb3pVWDBacjNlWER5RWpkUjNGZ1daSFNINDVJ?oc=5\" target=\"_blank\"\u003e【汽车校友百校联盟】特斯拉机器人战略蓝图：以“物理智能”重构具身智能的工业逻辑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T15:29:00"},{"id":17397,"title":"Humanoid Robots Part 2: China's Playbook for Building Its Own Robot Supply Chain - TrendForce","url":"https://news.google.com/rss/articles/CBMid0FVX3lxTE1PTWxCS2E5OGo5ZzhjZ05EMl9VbTdNZDRMclBBVWNGMjIzMWNKMWN4MVRJTUhkWG5qazFpTTlfRzVLeUQ4elpJR1dNUkxnYm93Wk41ZlNjLTMtSVBheXJpalZ4ZkdnVWNveXVsRUJxMkUybkh6VUVz?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMid0FVX3lxTE1PTWxCS2E5OGo5ZzhjZ05EMl9VbTdNZDRMclBBVWNGMjIzMWNKMWN4MVRJTUhkWG5qazFpTTlfRzVLeUQ4elpJR1dNUkxnYm93Wk41ZlNjLTMtSVBheXJpalZ4ZkdnVWNveXVsRUJxMkUybkh6VUVz?oc=5\" target=\"_blank\"\u003eHumanoid Robots Part 2: China's Playbook for Building Its Own Robot Supply Chain\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eTrendForce\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-05T06:01:00"},{"id":17416,"title":"GraspMeanFlow: SE(3)-Equivariant MeanFlow for Few-Step 6-DoF Grasp Generation","url":"https://arxiv.org/abs/2608.03295","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.03295v1 Announce Type: new \nAbstract: Recent data-driven methods for synthesizing 6-DoF grasp poses use generative models to learn complex grasp pose distributions and generate diverse candidate poses. In particular, SE(3)-equivariant flow-based models generate grasp poses that transform consistently with object rotations and translations. However, these methods sample by iterative numerical integration, requiring tens of function evaluations per grasp and limiting their use in real-time manipulation. We propose GraspMeanFlow, an SE(3)-equivariant MeanFlow framework for few-step 6-D","tags":[],"cluster_size":1,"ts":"2026-08-05T04:00:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
