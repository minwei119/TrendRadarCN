olor=\"#6f6f6f\"\u003e조선일보\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-10-06T13:45:01"},{"id":32042,"title":"WasserMan: Benchmark for Underwater Manipulation Policy Learning","url":"https://arxiv.org/abs/2610.04536","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04536v1 Announce Type: new \nAbstract: Underwater manipulation couples visual decisions, contact forces and a thruster-controlled floating base. We introduce WasserMan, to our knowledge the first multi-task simulation benchmark for visuomotor learning of floating-base underwater contact manipulation. It provides ten expert-solvable tasks, two vehicle-arm platforms, a bimanual configuration and underwater dynamics. Nine tasks have learned-policy evaluations. We compare ACT, diffusion policies (DP) and behavioral cloning on six tasks, with three training runs and equal sampled-window b","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32041,"title":"Reachability-Guided Sequential Quadratic Programming-Guarded Model Predictive Path Integral for Safe Nonlinear Predictive Control","url":"https://arxiv.org/abs/2610.04406","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04406v1 Announce Type: new \nAbstract: Safe robot control often requires combining long-horizon performance optimization with hard state and input constraints, but existing approaches tend to address this tradeoff partially. Sampling-based model predictive control (MPC) methods such as model predictive path integral (MPPI) are effective in handling nonlinear and nonconvex environments, yet their finite-sample rollouts and unconstrained weighted-average update can return an unsafe control. Deterministic nonlinear MPC can explicitly incorporate constraints, but its real-time safety and","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32040,"title":"AgenticTactileVLA: Contact-Guided Execution-Time Supervision for Generalizable Dexterous Manipulation without VLA Retraining","url":"https://arxiv.org/abs/2610.04391","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04391v1 Announce Type: new \nAbstract: Vision-language-action policies may predict a transferable manipulation strategy yet fail to realize it reliably on the encountered object: objects compatible with the same grasp differ in geometry and compliance, and visual feedback degrades under closure occlusion. AgenticTactileVLA is presented as an execution-time supervisor that shifts part of object-specific adaptation from prediction to physical interaction. A fixed VLA provides the approach and hand targets; the supervisor decides whether to remain transparent, refine finger flexion, ret","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32039,"title":"Frame-Level Temporal Alignment for Human-to-Robot Visual Adaptation","url":"https://arxiv.org/abs/2610.04372","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04372v1 Announce Type: new \nAbstract: Transferring visual representations pretrained on human videos to robot manipulation requires learning reliable correspondences between human and robot demonstrations. However, paired demonstrations can differ in execution rate and in the proportion of non-key frames that do not directly reflect task progress. Frames at the same relative timestamp may therefore represent different task stages, which can cause correspondence learning to fail. To address these issues, we propose Frame-Level Temporal Alignment (FLTA), a framework that uses two temp","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32038,"title":"TacOT: Learning Contact-Rich Dexterous Manipulation from Human Demonstrations via Tactile-Guided Optimal Transport","url":"https://arxiv.org/abs/2610.04363","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04363v1 Announce Type: new \nAbstract: Learning contact-rich dexterous manipulation from human demonstrations provides a scalable source of interaction data, yet transferring such skills to robots remains challenging due to unreliable human--robot correspondence. Existing human-to-robot transfer methods typically rely on visual appearance or motion similarity, which may associate similar motions with different contact states and force patterns. Tactile dynamics provide interaction-aware cues to distinguish manipulation processes with similar motions but different contact states. We i","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32037,"title":"Asynchronous Tracking, Optical Communication and 3D Motion Capture using Event-based Sensors","url":"https://arxiv.org/abs/2610.04342","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04342v1 Announce Type: new \nAbstract: Inter-robot communication is a key enabling technology in cooperative robotics applications. While wireless communication is ubiquitous, simple, and effective, it has inherent limitations: the receiving robot cannot easily localise the source of an incoming signal, clock synchronisation is challenging, and signals are broadcast to all nearby devices rather than targeted recipients. Optical communication provides a complementary channel that is inherently directional and spatially localised, directly addressing these limitations. Event cameras ar","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32036,"title":"Real-Time Conformal-Seeded Hybrid Inverse Kinematics for Offset Redundant Manipulators","url":"https://arxiv.org/abs/2610.04266","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04266v1 Announce Type: new \nAbstract: This paper presents a conformal-seeded hybrid strategy for solving inverse kinematics of offset, redundant 7-DoF robot arms of the humanoid class. Analytical inverse kinematics (AIK) provides closed-form solutions with very low computational cost. However, for offset kinematic structures, the exact closed-form solution is generally unavailable, and practical AIK must rely on an approximate or simplified kinematic model. In contrast, numerical inverse kinematics (NIK) can achieve high-precision solutions on the full kinematic model. However, its","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32035,"title":"Grounded in Time: A Multi-Source Dataset and Benchmark for Temporal Grounding in Robotic Manipulation","url":"https://arxiv.org/abs/2610.04255","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04255v1 Announce Type: new \nAbstract: Robotic manipulation often requires inferring task-relevant states from past interactions when the current observation alone is insufficient to determine the appropriate action. Despite progress in benchmarking memory-augmented vision-language-action (VLA) models, application-oriented tasks requiring history-dependent semantic inference remain underrepresented. We introduce GiT (Grounded in Time), a dataset and benchmark for grounding manipulation decisions in past events across biolaboratory, household, and industrial scenarios. It includes rea","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32034,"title":"ROOT: Discovering Rewards for User-Specified Embodied Behaviors","url":"https://arxiv.org/abs/2610.04250","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04250v1 Announce Type: new \nAbstract: Reinforcement learning for embodied control remains constrained by the difficulty of reward specification. Although recent large language model (LLM)-based methods can synthesize reward functions from natural-language descriptions, they often fail to capture subtle behavioral properties that humans care about, such as natural gait, posture, and movement style. This limitation arises because many desired behaviors are easier to recognize visually than to encode in a reward function. We introduce Reward Optimization via Observable Trees (ROOT), a","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32033,"title":"Attention-Based Surface Representation Learning for Robot State Prediction and Open-Ended Surface Classification","url":"https://arxiv.org/abs/2610.04240","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04240v1 Announce Type: new \nAbstract: For ground robots operating in outdoor environments, understanding the properties of the underlying terrain is essential for ensuring reliable operation. In most perception-based studies, this problem is formulated as categorical classification with a fixed number of classes defined during training. We propose an approach that enables new surface classes to be added as trainable vectors, which can subsequently be used to address higher-level tasks. By employing a learning paradigm based on predicting the robot's next state in time and using atte","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32032,"title":"Humanoid Rickshaw Pulling: Whole-Body Locomotion under Coupled Wheeled Loads","url":"https://arxiv.org/abs/2610.04238","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04238v1 Announce Type: new \nAbstract: Humanoid robots could transport payloads substantially heavier than themselves by pulling passive wheeled vehicles instead of carrying the load. This capability, however, creates a coupled locomotion problem: the robot must maintain persistent upper-body contact while adapting to unknown, configuration-dependent forces arising from the payload, vehicle, and terrain. We present a whole-body control framework for humanoid rickshaw pulling that tracks commanded vehicle motion while preserving balance and stable grasps under uncertain load dynamics.","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32031,"title":"Continual Humanoid Motion Learning","url":"https://arxiv.org/abs/2610.04231","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04231v1 Announce Type: new \nAbstract: Humanoid whole-body controllers can now track a diverse set of dynamic motions, but they are typically trained offline and then frozen, so teaching such a controller a new skill tends to erode the skills it already mastered. We study continual learning for humanoid whole-body motion, where a single controller must acquire skills from a sequential task stream without revisiting past data. We introduce Similarity-guided LoRA-PNN, a progressive neural network (PNN) policy that prevents catastrophic forgetting by construction while reusing knowledge","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32030,"title":"Bi-manual Stabilization of the Cervical Spine for Safe Physical Human-Robot Interaction in Rolling Maneuvers","url":"https://arxiv.org/abs/2610.04220","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04220v1 Announce Type: new \nAbstract: The neck, specifically the cervical spine, is a highly fragile and mobile part of the body with a high risk of catastrophic injury. Whether someone is injured on a battlefield, in a natural disaster, or in an athletic event, great care is always taken with the cervical spine when transporting, rolling, or moving the patient. In this work, we present an algorithm and adaptations for bi-manual robots to stabilize the cervical spine during rolling maneuvers. We investigate techniques to maximize grip strength within safety bounds and present a cont","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32029,"title":"Terrain-Dependent Intra-Cycle Leg Timing for Effective Locomotion on Granular Slopes","url":"https://arxiv.org/abs/2610.04144","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04144v1 Announce Type: new \nAbstract: Locomotion on granular slopes such as sand dunes remains a fundamental challenge for legged robots due to reduced shear strength and gravity-induced anisotropic yielding of granular media. Using a hexapedal robot on a tiltable granular bed, we systematically measure locomotion speed together with slope-dependent normal and shear granular resistive forces. While normal penetration resistance remains nearly unchanged with inclination, shear resistance decreases substantially as slope angle increases. Guided by these measurements, we develop a simp","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32028,"title":"Reward-DAgger: Robot-Gated Interactive Imitation Learning with General-Purpose Progress-Based Reward Models","url":"https://arxiv.org/abs/2610.04054","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04054v1 Announce Type: new \nAbstract: Recent advances in robot learning have enabled generalist control policies capable of completing a wide range of tasks. However, their performance degrades when deployed in unseen environments, making it critical to detect failures and teach recovery behaviors. Existing runtime monitoring methods often require task- and policy-specific training or hyperparameter tuning, limiting cross-task deployment and introducing additional overhead during iterative policy updates. We present Reward-DAgger, a robot-gated interactive imitation learning framewo","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32027,"title":"A Biomimetic Gaze Control to Restore Head-Neck Movements","url":"https://arxiv.org/abs/2610.04022","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04022v1 Announce Type: new \nAbstract: Powered neck exoskeletons are developed to restore head-neck motions for those with neck muscle weakness. Current methods using hand-held input devices to control these robotic systems are unintuitive or non-viable for these populations. Alternatively, the eyes coordinate with the head to accomplish many daily tasks. Therefore, movements of the eyes can be a useful signal to control the neck exoskeletons without needing to use the hands. However, previous control models lack biobehavioral basis as well as means to personalize the control behavio","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32026,"title":"SUAVE: Unified Video-Action Models via Masked Diffusion","url":"https://arxiv.org/abs/2610.04009","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.04009v1 Announce Type: new \nAbstract: Vision-language-action models (VLAs) inherit strong semantic grounding from pretrained vision-language backbones but are typically optimized for predicting actions rather than future observations. They can see and act, but they do not imagine the future before acting. World action models (WAMs) built on video diffusion backbones can imagine but treat language as frozen conditioning on a continuous latent space. Unified models bring these modalities into one architecture, but they either decode autoregressively, one token at a time, or keep video","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32025,"title":"REDIRECT: A 1% Fix for Bad Robot Habits","url":"https://arxiv.org/abs/2610.03997","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.03997v1 Announce Type: new \nAbstract: Robots can acquire bad habits from a few defective moments in otherwise useful teleoperation. In mixed-quality robot data, normal and problematic demonstrations share most task behavior and differ only at a local action continuation. Full retraining is costly, while fine-tuning on clean data alone offers limited recovery under a small update budget. We ask whether the local difference can instead be fixed with only 1% of the full-training sample-backward budget. Using only episode-level retained/problematic labels, REDIRECT localizes the branch,","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32024,"title":"Sparse Calibration-Based Personalization of Kernel-Based Gait Phase and Speed Estimation Using Wearable IMUs","url":"https://arxiv.org/abs/2610.03931","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.03931v1 Announce Type: new \nAbstract: This paper presents sparse calibration-based personalization for kernel-based gait phase and walking speed co-estimation from wearable inertial measurement units (IMUs). A 28-speed reference library was constructed from bilateral thigh and shank trajectories in a 20-subject locomotion dataset. Rather than directly applying population-average kernels, the method combines a user-specific baseline estimated from three calibration speeds with a principal-component (PC) model of baseline-centered kinematic deviations. Offline validation showed that p","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32023,"title":"MOSAIC-SV: Real-Time Adaptive Identification of Vessel Dynamics for the Control and Deployment of Aquatic Robots","url":"https://arxiv.org/abs/2610.03898","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.03898v1 Announce Type: new \nAbstract: Model-based control of an aquatic robotic platform depends on a hydrodynamic model that is costly to identify and specific to the hull, payload, and conditions it was measured in. Here, we present MOSAIC-SV, a deployable real-time adaptive dynamics identification and control system that identifies a control-sufficient dynamics model from a spec-sheet engineering prior, without dedicated identification trials, and re-estimates it at every control step of a closed-loop mission while the controller plans on it. A physically admissible unscented Kal","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32022,"title":"GOTT: Object-centric Dexterous Manipulation with a Reusable Cross-Embodiment Primitive","url":"https://arxiv.org/abs/2610.03861","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.03861v1 Announce Type: new \nAbstract: Foundation models and large-scale human data provide rich sources of manipulation intent, but translating this intent into multi-fingered robot behavior remains difficult. Dexterous hands still lack a reusable low-level primitive that reliably establishes contact across tasks and embodiments. We propose GOTT, a reach-acquire-move framework built around a single cross-embodiment contact-acquisition primitive. Given a robot-agnostic object trajectory and a reach specification, GOTT first brings the hand near a task-relevant contact region. The sha","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32021,"title":"TACET: Context-Appropriate Acoustic-Social Navigation for Quadrupeds","url":"https://arxiv.org/abs/2610.03828","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2610.03828v1 Announce Type: new \nAbstract: Quadruped robots entering hospitals, care homes, and quiet offices must be context-appropriate not only in where they move but in how loudly they move: a legged robot's locomotion noise, dominated by foot-ground impacts, is itself a social variable. Prior social navigation respects human space but treats the robot as acoustically uniform, while quiet-locomotion methods reduce noise to an operator-specified, context-blind level. We present TACET, a context-appropriate acoustic-social navigation method that infers social context from the robot's e","tags":[],"cluster_size":1,"ts":"2026-10-06T04:00:00"},{"id":32043,"title":"Chinese-made humanoid robot appears at parliament audit; Bae says physical AI core is software - 디지털투데이","url":"https://news.google.com/rss/articles/CBMizwFBVV95cUxOSVJwalFHUWxMcXBLRExuUFdWUURBWGd3V29BMXprTzBJSXFGOHg0d0VpcDB0TTNCOG0zNktCY2s1dGEyb1hYNWJjT0pOdW1VcXdrcm5SQW1BUllMSFdZWEVTRVNLZHJJMkxHc2pBbm1RQUVQR1c1b3AzSkl0RE9lSjVUbTl0NXBWMDlGTEtaVDF6YlFuaENoR1ViRGhUYS1MRHlEa0lGYmVUZFo3alhlcXFGTXo2R1o0NWpLM1ZmaUpXOGtlb2hCcWJnbkdZOUU?oc=5","source":"GNews · 英文机器人","sources":["GNews · 英文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMizwFBVV95cUxOSVJwalFHUWxMcXBLRExuUFdWUURBWGd3V29BMXprTzBJSXFGOHg0d0VpcDB0TTNCOG0zNktCY2s1dGEyb1hYNWJjT0pOdW1VcXdrcm5SQW1BUllMSFdZWEVTRVNLZHJJMkxHc // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
