ps://news.google.com/rss/articles/CBMiXkFVX3lxTE5ma2JQc0lDbnhGMXZoREVhVzRhQTBiY1JOemZDVUZNbW5GdGw1UVZmenlZSmdRam1kSFdWSDZ5QnNHUVFVZXNGaDQ4Vk0wb3ItU0xJbzBmRjF1M2VpdVE?oc=5\" target=\"_blank\"\u003e阿里巴巴千问App上线付费套餐与AI视频额度服务\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eDoNews\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-11T00:17:03"},{"id":18691,"title":"多家中小银行上调存款利率，业内人士称与五年期大额存单重启无直接关联","url":"https://wallstreetcn.com/livenews/3147742","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月以来，湖北、广东等地多家中小银行纷纷上调存款利率，引发市场关注。进入8月，多地城商行、农商行及村镇银行发布公告，表示对挂牌存款利率或特色存款产品利率进行上调。总体来看，各家银行的上调幅度在10—33个基点（BP）不等。在宏观市场利率整体下行、银行业持续压降负债成本的背景下，中小银行针对存款利率“反其道而行之”的做法，实属不多见。业内人士认为，此举具有明显的阶段性揽储特征，不具备普适性，且与近期部分国有大行集体重启五年期大额存单并无直接关联。（证券时报）","tags":[],"cluster_size":1,"ts":"2026-08-10T23:27:58"},{"id":18692,"title":"华尔街见闻早餐 | 2026年8月11日","url":"https://wallstreetcn.com/livenews/3147736","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"科技股拖累美股，标普500、道指从纪录高位回落，英伟达收跌近3%，光通信股Coherent跌超10%；中概逆市续涨，阿里涨3%；原油盘中涨超5%、欧洲天然气涨超10%；日元一度回落1%，离岸人民币暂别三年高位。\n\n特朗普要求伊朗赔偿、将其纳入未来所有谈判要求，称美军已“100%控制”霍尔木兹海峡；伊朗密集换将、最高领袖任命6名高级军事指挥官。\n\n美国战略油储自1983年来首次跌破3亿桶。\n\n特朗普否认与沃什频繁通话：自从沃什接任以来，只谈过一次。\n\n报道：日本央行释放9月加息信号促使美国加入汇市干预。\n\n韩国宣布设立规模达5万亿韩元的新基金，重点投资半导体材料、零部件和设备领域。\n\n中国央行：保持人民币汇率在合理均衡水平上基本稳定，高质量建设债券市场“科技板”。\n\n宇树科技科创板申购火爆，中签率仅0.018%，首日盈利或逾20万元。\n\n豆包自8月10日起推荐酒店收取佣金，综合扣费12%。\n\n江波龙上半年净利润同比增715.29倍，拟最高8亿元回购股份。\n\nMLCC供应告急引发抢货潮，国巨：越来越多AI客户抢签长协锁定产能。\n\n报道称英伟达寻求联手华尔街六巨头，筹5000亿美元押注AI基础设施，CDS创两周最大涨幅。\n\nOpenAI推出GPT-5.6-Cyber：向网络安全防御人员开放“限制更少”的模型。\n\nAnthropic将推出新模型Sonnet 5.5、据称对标DeepSeek","tags":[],"cluster_size":2,"ts":"2026-08-10T23:10:28"},{"id":18693,"title":"锂价止跌企稳，碳酸锂紧平衡格局仍稳固","url":"https://wallstreetcn.com/livenews/3147735","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月走出一轮“预期驱动回调”行情后，碳酸锂价格近日出现企稳迹象。8月10日，碳酸锂期货主力合约LC2609报收146360元/吨，6个交易日以来累计上涨6.24%。“这几天算是稳住了。”有熟悉碳酸锂期货人士评价。此前的7月，受远期供给过剩的悲观预期影响，碳酸锂期货价格下跌近20%。期货市场上的涨涨跌跌，并没有影响到产业端的火热。“碳酸锂生产、销售正常。”四川某锂盐企业负责人称，下游拿货热情不减，公司已没有多少库存。该企业的状态基本代表了行业整体——7月以来，天华新能、九岭锂业等陆续进入检修，锂电下游8月排产却超预期增长。券商分析称，碳酸锂去库存节奏加快，供需格局整体维持偏紧态势。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T23:10:20"},{"id":18694,"title":"中报窗口期机构密集调研，创新药步入业绩与国际化兑现期","url":"https://wallstreetcn.com/livenews/3147727","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"截至8月10日，17家上市药企披露半年报，逾百家药企发布半年度业绩预告。7月1日至8月10日，百济神州、泽璟制药等74家药企接待机构调研，7家企业吸引超50家机构走访，百济神州接待调研机构数量超200家。业内人士认为，创新药板块正从估值驱动，转向业绩与全球化兑现共同驱动，已达成商务拓展（BD）合作的产品逐步进入海外关键临床、注册上市和商业化分成兑现阶段，而今年ESMO年会（2026年欧洲肿瘤内科学会年会）重要数据、重磅BD合作与技术突破，将持续成为板块重要利好催化。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T22:51:18"},{"id":18695,"title":"明星新股密集上市，多家银行上线“打新理财”专区","url":"https://wallstreetcn.com/livenews/3147726","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"8月10日，宇树科技开启网上、网下申购，发行价格为150.80元/股，发行数量4044.6434万股。根据宇树科技此前披露的发行公告，光大理财、民生理财、南银理财、宁银理财、招银理财、中邮理财旗下相关产品均进入初步询价阶段的有效报价名单。就在不久前，长鑫科技上市第一周股价大幅上涨，赚钱效应引发市场关注。记者调研发现，多家银行正借势这一波打新行情，向投资者推介“打新策略”理财产品，招商银行、浦发银行等手机银行App已上线“打新理财”专区。（中证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T22:46:59"},{"id":18696,"title":"在手订单饱满，多赛道释放高景气信号","url":"https://wallstreetcn.com/livenews/3147723","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"A股公司2026年半年报披露进入高峰期，“在手订单”成为透视行业景气度的核心指标。纵观已披露的订单信息，三条主线清晰可见：船舶、电缆、激光设备等高端制造大额订单饱满，为后续业绩增长筑牢基础；创新药、光模块等行业依托技术升级与海外市场开拓，迎来全球化红利释放期；半导体设备、算力服务等赛道，则将技术迭代优势持续转化为实实在在的订单增量。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T22:37:01"},{"id":18697,"title":"综合多重因素，赴港投保性价比被重新评估","url":"https://wallstreetcn.com/livenews/3147722","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日调研获悉，受“香港保单收益征税”消息影响，一些消费者正重新评估赴港投保性价比。已有多位香港保险营销员接到客户咨询，他们明显感受到市场正在降温。此外，随着人民币汇率不断升值，赴港投保的预期收益有所降低。在业内人士看来，受税收、汇率等因素影响，短期内消费者赴港投保将会降温，尤其是投资型保险产品受影响更大。对于消费者而言，未来赴港投保应综合考虑产品、汇率、合规、服务等多方面因素。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T22:35:17"},{"id":18698,"title":"金融产品网络营销新规9月底起实施，保险业提前摸排整治账号端乱象","url":"https://wallstreetcn.com/livenews/3147720","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"金融产品网络营销最严监管规定——《金融产品网络营销管理办法》将于9月30日起实施。记者从相关渠道获悉，针对办法对保险机构网络营销划定的“硬杠杠”，监管部门正在主动摸排整治账号端乱象、厘清市场生态，为新规落地铺路。受访人士表示，随着监管部门整治深入和办法落地实施，“机构担责+人证合一+可回溯”将是保险网络营销的最终走向。从长期看，这有利于降低消费者的信任成本，激活真实保险需求，推动保险机构业务质量、续保率等长期指标提升。（上证报）","tags":[],"cluster_size":1,"ts":"2026-08-10T22:31:02"},{"id":18699,"title":"港股美国预托证券个别发展 阿里巴巴升逾2% - 香港電台","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPVmxJY0U3bnlQM1U4SmRpcnFHNWZBd3J0T2c0S19oRWliQ2oxVjlaTU1vWGxrYmpPOGRwLTctcGYyTUVqRWtVa3pOb3prODRoNVRlb0FrVlB5alRhMlN2TjdtU2ZDWFozQVpmLWpPRWpjQlM1bjR5TFlPaUJKMVNnd2w4b2NZdGtheV8tQkxvVnpNelRyVkNNb1IxQmNPWnNMbEJj?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiowFBVV95cUxPVmxJY0U3bnlQM1U4SmRpcnFHNWZBd3J0T2c0S19oRWliQ2oxVjlaTU1vWGxrYmpPOGRwLTctcGYyTUVqRWtVa3pOb3prODRoNVRlb0FrVlB5alRhMlN2TjdtU2ZDWFozQVpmLWpPRWpjQlM1bjR5TFlPaUJKMVNnd2w4b2NZdGtheV8tQkxvVnpNelRyVkNNb1IxQmNPWnNMbEJj?oc=5\" target=\"_blank\"\u003e港股美国预托证券个别发展 阿里巴巴升逾2%\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e香港電台\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-10T21:52:00"},{"id":18700,"title":"周一（8月10日）纽约尾盘，标普500股指期货最终跌0.05%，道指期货跌0.15%，纳斯达克100股指期货跌0.25%。\n\n罗素2000股指期货跌0.49%。","url":"https://wallstreetcn.com/livenews/3147703","source":"华尔街见闻 · 港股快讯","sources":["华尔街见闻 · 港股快讯"],"summary":"周一（8月10日）纽约尾盘，标普500股指期货最终跌0.05%，道指期货跌0.15%，纳斯达克100股指期货跌0.25%。\n\n罗素2000股指期货跌0.49%。","tags":[],"cluster_size":1,"ts":"2026-08-10T21:13:36"},{"id":18701,"title":"8月11日热门中概股多数上涨，阿里巴巴涨3%，慧荣科技跌9.96% - 新浪财经","url":"https://news.google.com/rss/articles/CBMiigFBVV95cUxQR3gtYWM5cHR6ajBBNVlUVUxFZHM4dmxHdjJlSThrVTJrWndrV3NfVVFUa2JfMUZzaFVWeEhPcl9HNkFWUXdrM1EtcFVEZkFjQjQzOTFqVnA2eGQtdTBzNTJaU2xIZXhId2Qtd3pIS1dFWGtwMUpVNmFQMnp3bVVXY1FreGpzQzlsY0E?oc=5","source":"GNews · 阿里巴巴","sources":["GNews · 阿里巴巴"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiigFBVV95cUxQR3gtYWM5cHR6ajBBNVlUVUxFZHM4dmxHdjJlSThrVTJrWndrV3 sistent with the observed state. We present AutoIntervene, an online framework that selectively transfers control between an action-chunking policy and an operator during deployment. AutoIntervene evaluates prop","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18879,"title":"C2Dex: Contact-Consistent Reconstruction and Retargeting for Dexterous Manipulation from Monocular Video","url":"https://arxiv.org/abs/2608.07045","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07045v1 Announce Type: new \nAbstract: High-quality demonstrations for dexterous robot manipulation are costly and difficult to collect, whereas monocular human videos provide a scalable source of diverse manipulation behaviors. However, transferring such demonstrations to dexterous robots remains challenging: monocular hand-object interaction (HOI) reconstruction often produces temporally unstable contacts and physically implausible interactions, while conventional retargeting methods struggle to preserve task-relevant contacts and local interaction geometry across different hand em","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18878,"title":"A Haptic Robot Finger Designed for Guqin Instrument Playing","url":"https://arxiv.org/abs/2608.07002","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.07002v1 Announce Type: new \nAbstract: With the rapid advancement of humanoid robotics and embodied intelligence technologies, numerous musical instrument-playing robots have emerged in recent years, such as pianos, chime bells, and taiko drums. These robots primarily employ open-loop positional control, rendering them incapable of operating instruments requiring dexterous hands and precise tactile perception, such as a violin, guitar, and guqin. This paper describes the design and validation of a high-precision tactile-sensing finger. By mimicking the shape of the fingertip and fing","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18877,"title":"Cross-View Action Consistency for Camera-Robust Vision-Language-Action Policies","url":"https://arxiv.org/abs/2608.06965","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06965v1 Announce Type: new \nAbstract: Vision-language-action (VLA) policies fine-tuned from a fixed scene camera can fail when the camera is moved, even when the task, objects, language, and robot state are unchanged. We study scene-camera viewpoint robustness using only a scene RGB image, language, and proprioception, without camera labels, extrinsics, depth, or point-cloud inputs. The wrist stream is masked throughout to prevent an unperturbed visual shortcut from confounding attribution to scene-camera variation. For flow-based VLAs, we propose to regularize the action-flow veloc","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18876,"title":"Spatiotemporal Agility: Time-Constrained Reinforcement Learning for Vision-Guided Dynamic Quadrupedal Interception","url":"https://arxiv.org/abs/2608.06907","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06907v1 Announce Type: new \nAbstract: Legged robots require robust agility to perceive and interact with complex and dynamic environments within a constrained time. However, most existing quadruped locomotion works rely on velocity-tracking policy, which struggle to reach precise targets within strict temporal constraints. Moreover, integrating real-time perception with agile locomotion for highly dynamic targets remains challenging due to sensor latency and processing delays. To concretely study and benchmark such agility in dynamic settings, we introduce a challenging ball-catchin","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18875,"title":"How Should I Pick a Foundation Model for My Robot? In Favor of a Community Evaluation Framework for Social Robots","url":"https://arxiv.org/abs/2608.06898","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06898v1 Announce Type: new \nAbstract: Researchers who seek to build social robot applications on foundation models are faced with a difficult question: how should we pick a model? Public leaderboards offer little guidance: the demands of real-time, embodied social interaction lie largely outside their focus. And direct evaluation is impractical at scale: each embodied study requires scarce participant, robot, and experimenter time. In this paper, we identify five evaluation dimensions for foundation models in social robots: (i) conversational competence, (ii) user safety, (iii) embo","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18874,"title":"Unordered Landmark Visual Navigation","url":"https://arxiv.org/abs/2608.06833","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06833v1 Announce Type: new \nAbstract: Image-goal navigation is a fundamental capability for embodied AI, yet its practical deployment is strained by strong prior assumptions. Existing methods predominantly rely on temporally ordered video streams or auxiliary sensors (e.g., depth, LiDAR) to maintain spatial consistency. These sequential and multimodal dependencies severely restrict scalability, especially when deploying robots using crowd-sourced or pre-recorded unordered image collections. When temporal priors are removed, current methods struggle with severe perceptual aliasing, n","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18873,"title":"When Coordination Becomes a Threat: Communication Attacks in LLM-Controlled Multi-Robot Systems","url":"https://arxiv.org/abs/2608.06830","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06830v1 Announce Type: new \nAbstract: Large Language Models (LLMs) are increasingly used as high-level planners in embodied multi-robot systems, enabling robots to interpret natural language instructions and coordinate executable actions. Yet, this growing reliance on LLM planners also raises security concerns. Prior work has focused mainly on individual robots, while communication risks in multi-robot collaboration remain insufficiently understood. Existing multi-robot studies are further limited to preliminary analysis under the Decentralized Multi-agent System (DMAS) architecture","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18872,"title":"R2S-EGO: Dual-Proxy Refinement for Sparse-Capture Real-to-Sim","url":"https://arxiv.org/abs/2608.06827","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06827v1 Announce Type: new \nAbstract: Real-to-sim (R2S) depends on scene representations that render observations along robot ego trajectories, yet dense multi-view capture limits per-environment real-image capture-count efficiency, and sparse human capture can\n  leave behavior-scoped robot views under-supported. Camera-controlled synthesis can fill missing views, but its use in R2S requires behavior-admissible queries and capture-anchored structural conditioning. We present R2S-EGO,\n  which couples a simulator-derived robot proxy that represents the behavior-scoped executable query","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18871,"title":"Is Forward Prediction Enough? Physical State Grounding for JEPA World Models","url":"https://arxiv.org/abs/2608.06799","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06799v1 Announce Type: new \nAbstract: Learning structured and control-relevant latent representations remains a key challenge for world models. Recent JEPA-based world models learn action-conditioned predictive latent dynamics from observation sequences. However, their forward-prediction objectives do not explicitly enforce reliable identifiability of robot-centric physical state from individual latents or state changes from latent pairs, which can limit downstream planning and policy performance. We propose PSG-JEPA, a physically grounded JEPA world model that shapes its latent spa","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18870,"title":"AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models","url":"https://arxiv.org/abs/2608.06729","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06729v1 Announce Type: new \nAbstract: While Vision-Language-Action (VLA) models have advanced embodied AI, their fundamentally reactive paradigm severely limits performance in partially observable and long-horizon tasks. When restricted to a single wrist-mounted camera, they inevitably suffer from perception forgetting as objects exit the field of view, and temporal task-progress forgetting} during multi-step execution. To overcome these bottlenecks, we propose AtlasVLA, a novel framework that transitions from direct reactive manipulation to proactive reasoning through a persistent","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18869,"title":"Hoverflie: An empirical investigation of rotor shrouds to transform micro air vehicles into multi-modal hovercraft","url":"https://arxiv.org/abs/2608.06707","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06707v1 Announce Type: new \nAbstract: Small rotorcraft intended for use indoors or around the built environment have extremely limited flight duration. This paper presents the design and experimental characterization of a custom shroud system that transforms a Crazyflie 2.1 micro air vehicle into a multi-modal robot capable of operating as a high-efficiency hovercraft or a free-flying drone. A custom experimental platform was developed for precise control of hover height and rotor duty cycle, and automated data logging of lift forces. Parametric testing of duct, intake, and nozzle g","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18868,"title":"CrossTracer: Cross-Embodiment Navigation via VLA Model Reasoning and Trace Residuals Adapting","url":"https://arxiv.org/abs/2608.06688","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06688v1 Announce Type: new \nAbstract: Vision-language-action (VLA) models provide strong semantic priors for robot navigation, but they often ignore embodiment-specific mobility constraints. A path that is semantically plausible for one robot may be physically infeasible for another. We propose CrossTracer, a hierarchical framework for cross-embodiment navigation through adaptive trace residuals. CrossTracer represents navigation plans as normalized image-plane waypoints, forming a unified pixel-space interface between semantic reasoning and physical grounding. First, Vision-Languag","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18867,"title":"SoRoMoX: Fast, Differentiable, and Parallelizable Soft Robot Models","url":"https://arxiv.org/abs/2608.06650","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06650v1 Announce Type: new \nAbstract: Reduced-order models based on Cosserat-rod theory are now well established, and modeling theory is no longer the primary bottleneck in soft-robot control. Their implementations, however, do not support the differentiable, GPU-parallel, and control-oriented workflows that underpin advanced rigid-robotics applications. Here, we fill this gap with SoRoMoX (Soft Robot Models in JAX), a fully numerical, JIT-compilable Python/JAX framework. SoRoMoX implements articulated, Piecewise Constant Strain, and Variable Strain models through a unified, control","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18866,"title":"SyncSBC: Decentralized Swarm Behavior Prediction for Synchronized Autonomous Control","url":"https://arxiv.org/abs/2608.06587","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06587v1 Announce Type: new \nAbstract: Robot swarms utilize many independent limited-sensing agents to produce complex emergent behaviors without requiring centralized control. However, little research explores how agents can infer swarm-level behavior from purely local perception, a capability critical for detecting faults and behavior changes. In this paper, we introduce Synchronized Swarm Behavior Classification (SyncSBC), which combines improvements in machine learning and distributed consensus to classify collective swarm behavior and synchronize swarm decision-making in an enti","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18865,"title":"A Disturbance in the Force: Force Actuation on the RAVEN II Surgical Robot with Parallel Motor-Cable Units","url":"https://arxiv.org/abs/2608.06488","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06488v1 Announce Type: new \nAbstract: Difficulty in haptic feedback for surgical robots has been a long-term problem for decades. In recent years, learning-based force estimation from robot states suggests desirable accuracy without the necessity of extra sensors. However, challenges remain in obtaining representative training data in which the robot moves in the workspace under various external forces. In this work, a parallel motor-cable system is developed. With six motor-cable units installed around the robot workspace, cables with controllable tension connected to the robot end","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18864,"title":"Fast and Accurate: An Adaptive VLA Inference Framework through Environment-aware Model Selection","url":"https://arxiv.org/abs/2608.06434","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2608.06434v1 Announce Type: new \nAbstract: Embodied intelligence demands both long-horizon reasoning and real-time closed-loop responsiveness. Recent dual-system Vision-Language-Action (VLA) architectures combine fast reactive control with slow deliberative reasoning to balance inference speed and task success rate. However, existing dual-process VLAs tightly couple the fast module to intermediate representations of the slow module, necessitating end-to-end joint training and limiting modularity, extensibility and flexible system switching. In this paper, we propose Environment-aware Mod","tags":[],"cluster_size":1,"ts":"2026-08-10T04:00:00"},{"id":18881,"title":"特斯拉Optimus人形机器人距离商业化还有多远？ - 新浪网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTFAtUlV6NDk5UDBiNjJpN0k2aWFzVklzSnA1QWNTcm1OM0lvb0pXNTg5SFJtakM3bDZLSV8zQ1BWbzFZeU5MXzEtVG42TGRoWjlvMm5ZdWZtNWpucGxEWV9QMHpn?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFAtUlV6NDk5UDBiNjJpN0k2aWFzVklzSnA1QWNTcm1OM0lvb0pXNTg5SFJtakM3bDZLSV8zQ1BWbzFZeU5MXzEtVG42TGRoWjlvMm5ZdWZtNWpucGxEWV9QMHpn?oc=5\" target=\"_blank\"\u003e特斯拉Optimus人形机器人距离商业化还有多远？\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-10T03:03:00"},{"id":18882,"title":"雷军分享小米机器人最新视频 - 新浪网","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1sYkRDWWR2WGRJU3NMUDRnN2hQSDMyRVhHMTZkQWo3aVFubkhHUXNWelNHcmdNNEtNNVRmV1Y2ZUo3Z3p5LUZLdHBmOFZnWHJHTWlUWnJIVWVsOWh1WFh0QWxB?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1sYkRDWWR2WGRJU3NMUDRnN2hQSDMyRVhHMTZkQWo3aVFubkhHUXNWelNHcmdNNEtNNVRmV1Y2ZUo3Z3p5LUZLdHBmOFZnWHJHTWlUWnJIVWVsOWh1WFh0QWxB?oc=5\" target=\"_blank\"\u003e雷军分享小米机器人最新视频\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e新浪网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-08-10T02:53:00"}]}]};

// Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
