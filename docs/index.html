ummary":"纳指收涨超2%，道指创新高，谷歌被纳入道指首日涨近5%，SpaceX涨逾7%，芯片指数涨近4%；日元兑美元创近四十年新低、逼近162，原油反弹，美油一度涨近3%。\n\n美伊据称同意停止互袭，特朗普称美伊将周二在卡塔尔多哈会谈，伊朗否认、称未来几天没有与美谈判计划，双方尚未进入最终协议谈判阶段，强调船只须按“伊朗线路”通过霍尔木兹海峡。\n\n美最高法院裁定库克暂时留任美联储理事，特朗普称将确保其不影响重大货币政策决定。美最高法重大裁决：扩大总统对联邦独立机构罢免权，但美联储除外。\n\n白宫经济顾问非农提前剧透？哈塞特：本周就业报告将再次强劲，当前加息的理由并不充分。\n\n美国将修改美联储青睐通胀指标PCE价格指数统计方法，华尔街：旨在“降低”核心通胀，存在操纵风险。\n\n韩国宣布国内史上最大规模产业投资计划，五年内DRAM产能翻倍，三星、SK海力士将合计投逾4800万亿韩元、各新建两座芯片厂，投资兼顾HBM、数据中心到人形机器人。\n\n中国央行首次开展3000亿元隔夜逆回购操作，应对半年末跨季流动性压力。\n\n中国国常会：加力推进人工智能创新突破，加快关键技术攻关和超大规模智算集群建设。\n\n中国外交部回应将部分日本实体列入出口管制管控名单：此举旨在坚决遏制日本新型军国主义妄动，不影响中日正常经贸往来。\n\nDeepSeek V4定档7月中旬，将推出峰谷API定价、价格为平时两倍。\n\n报道：iPhon","tags":[],"cluster_size":2,"ts":"2026-06-29T23:15:08"},{"id":6065,"title":"压缩画饼式销售空间，分红险演示利率上限将调整","url":"https://wallstreetcn.com/livenews/3126350","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"7月1日起，全市场在售分红险演示利率上限将由3.9%下调至3.5%。各家保险公司高于3.5%演示利率的产品需要在6月30日前完成变更备案，或报送停售。由于这一利率上限下调关口将至，带有“即将降息”“不容错过”“倒计时”“绝版”“最后上车机会”等字眼的保险营销文案活跃在朋友圈和社交平台。对消费者来说，此次调整会否如保险营销文案所说，需要欲购从速、赶紧上车？演示利率上限的下调，是否意味着消费者实际收益的缩水？记者调研发现，此次调整，并不影响分红险的合同约定利率，所以未必会影响消费者的实际收益，更多是压缩了画饼式销售的空间。（中证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T23:12:11"},{"id":6066,"title":"首次隔夜逆回购操作落地，央行呵护短期流动性","url":"https://wallstreetcn.com/livenews/3126340","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"6月29日人民银行开展了3000亿元隔夜逆回购操作。专家表示，隔夜逆回购加强了对短端流动性的精细化管理，也体现了人民银行呵护季末流动性的政策意图。此次操作未披露隔夜逆回购利率。东方金诚首席宏观分析师王青认为，当前隔夜逆回购主要是对7天期逆回购的补充，操作模式有待逐步成熟。未来隔夜逆回购有望常态化操作，利率水平会适时公布。在中信证券首席经济学家明明看来，这意味着，7天期逆回购政策利率定位依然明确。虽然当下隔夜逆回购工具作为短端流动性管理工具创新被投入使用，但7天期逆回购利率作为主要政策利率的定位仍是关键基准。（中证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T22:37:08"},{"id":6067,"title":"6月29日港股通互联网ETF华夏基金份额减少2400万份，重仓股腾讯控股、阿里巴巴-W、小米集团 - 证券之星","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE5HUTlKbmdIY0R6bmdkUy1aZGxpbEZxTHgxTVBadktjU0d5SHBXcWlZVzZBempRWlVHUGc2bi1lcG1Sb3F4TjNkczlEM1IwaVhiYjdkUi01dThyYkhmNjNSVmpR?oc=5","source":"GNews · 腾讯控股","sources":["GNews · 腾讯控股"],"summary":"\u003ca href=\"https://news.google. 月3日终止上市并摘牌；退市创兴（原“*ST创兴”）股票将于7月6日终止上市暨摘牌。3家公司均因2025年年报财务指标“不达标”而触及终止上市情形。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T22:27:22"},{"id":6076,"title":"热点概念炒作频频引发股价异动，A股公司密集提示风险厘清业务边界","url":"https://wallstreetcn.com/livenews/3126335","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"6月17日以来，A股已有50多家公司针对AI服务器、光模块、人形机器人、可控核聚变等热点概念炒作发布股价异动公告或风险提示公告，主动回应市场关切、厘清业务边界和提示投资风险。专家表示，投资者须警惕相关公司的“三无”信号，即无核心技术迭代、无规模化订单、无现金流支撑，方能规避概念炒作陷阱。从中长期看，产业估值将逐渐从“叙事驱动”转向“业绩验证”逻辑，真正具备技术壁垒与订单转化能力的企业将获得估值溢价。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T22:21:56"},{"id":6077,"title":"中国移动设立Token办公室 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQNDh2RkZfNmRkVUdiZlhDcTVnbGEyazdhZkVJSjFiYmJieVJ4b1M0TTZzU05ySUFDeHZiSXpNbURmSnlsUThfbS14RkJ5cnJVeFNiY3dJTEpvZ2tyMkVxeTloYTdfdW90dEQwRXoxVUlUN2prcWdSOVFlWHdnVXlPV2xjNzd2RHZ6MFBhdQ?oc=5","source":"GNews · 中国移动","sources":["GNews · 中国移动"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQNDh2RkZfNmRkVUdiZlhDcTVnbGEyazdhZkVJSjFiYmJieVJ4b1M0TTZzU05ySUFDeHZiSXpNbURmSnlsUThfbS14RkJ5cnJVeFNiY3dJTEpvZ2tyMkVxeTloYTdfdW90dEQwRXoxVUlUN2prcWdSOVFlWHdnVXlPV2xjNzd2RHZ6MFBhdQ?oc=5\" target=\"_blank\"\u003e中国移动设立Token办公室\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T22:18:18"},{"id":6078,"title":"分红险演示利率上限调降在即，营销端现“倒计时”式炒作","url":"https://wallstreetcn.com/livenews/3126331","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"近日调研获悉，随着分红险演示利率上限调降临近，在保险营销圈，以分红险“利率下调”为噱头的炒作式营销开始上演，营销员试图通过“倒计时”等话术吸引消费者投保。有业内人士认为，相较以往保险产品预定利率调整，这一轮演示利率调整对产品实际收益率影响并不大，保险营销员制造“利率下降”的焦虑，意在诱导消费者尽快购买产品。消费者应对此保持谨慎，避免冲动投保。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T22:15:13"},{"id":6079,"title":"相关主题ETF上周“吸金”超过250亿元，A股半导体板块高景气下波动加大","url":"https://wallstreetcn.com/livenews/3126330","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"据Choice测算，上周，半导体相关主题ETF合计资金净流入258.87亿元。具体来看，科创芯片ETF嘉实净流入37.81亿元，半导体设备ETF国泰净流入29.18亿元，科创半导体ETF华夏净流入28.52亿元。此外，芯片ETF华夏、半导体设备ETF易方达、半导体设备ETF广发、科创芯片ETF汇添富等净流入均超过16亿元。百亿级半导体主题ETF批量涌现。截至6月26日，有7只半导体主题ETF规模超过百亿元。而在2025年底仅有3只。不过，由于短期涨幅较大，部分基金经理认为，半导体板块后续波动会加大。（上证报）","tags":[],"cluster_size":1,"ts":"2026-06-29T22:10:58"},{"id":6080,"title":"周二亚太盘初，美国股指期货走低，纳斯达克100指数跌0.2%。","url":"https://wallstreetcn.com/livenews/3126329","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"周二亚太盘初，美国股指期货走低，纳斯达克100指数跌0.2%。","tags":[],"cluster_size":1,"ts":"2026-06-29T22:03:03"},{"id":6081,"title":"Rocket Lab拟收购铱星，挑战SpaceX与亚马逊","url":"https://wallstreetcn.com/livenews/3126326","source":"华尔街见闻 · 美股快讯","sources":["华尔街见闻 · 美股快讯"],"summary":"Rocket Lab收涨15.93%，在纳斯达克100指数成分股中仅次于Astera Labs（后者收涨16.39%），报98.01美元。\n\nRocket Lab Corp.同意按每股54美元的价格，通过现金加股票的交易方式收购铱星通讯公司（Iridium Communications Inc.）。该交易对铱星的估值约为80亿美元，并将把Rocket Lab的发射能力和卫星制造业务与铱星的低地球轨道网络及宝贵的无线电频率资源相结合。此举旨在打造一家能够自主设计、制造、发射和运营星座系统的公司，为全球数百万用户提供关键的通信能力。","tags":[],"cluster_size":1,"ts":"2026-06-29T21:44:54"},{"id":6082,"title":"美股大类资产类ETF周一多数收涨，纳指100 ETF涨2.49%，标普500 ETF、巴克莱美国可转债ETF、美国布伦特油价基金至多涨1.65%，道指ETF涨0","url":"https://wallstreetcn.com/livenews/3126325","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"美股大类资产类ETF周一多数收涨，纳指100 ETF涨2.49%，标普500 ETF、巴克莱美国可转债ETF、美国布伦特油价基金至多涨1.65%，道指ETF涨0.76%，新兴市场ETF、欧元做多、美国国债20+年ETF至多涨0.36%。\n\n日元做多、罗素2000指数ETF、做多美元指数则至多收跌0.53%，农产品基金跌1.08%，大豆基金跌1.14%，黄金ETF跌1.35%。","tags":[],"cluster_size":1,"ts":"2026-06-29T21:39:28"},{"id":6083,"title":"Praxis Precision Medicines股价盘后下挫，美国FDA将癫痫药物审评期延长3个月","url":"https://wallstreetcn.com/livenews/3126323","source":"华尔街见闻 · A股快讯","sources":["华尔街见闻 · A股快讯"],"summary":"生物科技公司Praxis Precision Medicines宣布，美国食品药品监督管理局（FDA）将其治疗SCN2A和SCN8A发育性和癫痫性脑病的新药relutrigine的审评期延长了三个月。受此消息影响，该公司盘后股价下跌5.9%。\n\nFDA设定的更新后PDUFA（处方药使用者付费法案）目标行动日期为2026年12月27日，此前的PDUFA日期为9月27日。\n\n此次延期是在Praxis提交了针对现有临床数据的额外敏感性分析之后发生的。FDA将该提交材料认定为重大修正案，从而允许额外的审评时间。FDA并未要求开展新的临床研究，也未提出任何安全性或生产方面的担忧。","tags":[],"cluster_size":1,"ts":"2026-06-29T21:19:37"},{"id":6084,"title":"周一（6月29日）纽约尾盘，标 设备- AI 人工智能\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003ecnBeta.COM\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-30T01:24:00"},{"id":6364,"title":"严禁滥用算法定价实施差别对待、不得实施先涨价后打折，北京启动专项行动","url":"https://www.ithome.com/0/970/279.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"5522\"\u003eIT之家 6 月 30 日消息，北京市场监管今日官宣，为加快建设全国统一大市场，破除地方保护和市场分割，\u003cstrong\u003e日前北京市全面启动破除妨碍统一市场和公平竞争卡点堵点专项行动\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"c4a1\"\u003e此次行动重点围绕增量政策严审与存量措施抽查、平台治理与要素疏通、反垄断与反不正当竞争执法有序推进，为各类经营主体营造更加公平、透明、可预期的营商环境。\u003c/p\u003e\u003ch2 data-vmark=\"dd00\"\u003e严把审查关口破除政策卡点\u003c/h2\u003e\u003cp data-vmark=\"7559\"\u003e构建全国统一大市场，制度是根基。本次专项行动坚持\u003cstrong\u003e“破立并举、标本兼治”\u003c/strong\u003e，从源头上为公平竞争筑牢防线。凡涉及经营者经济活动的新增政策文件，正式出台前必须完成公平竞争审查，从源头杜绝地方保护、指定交易等问题。对已出台的政策措施，加大公平竞争审查抽查力度，推动妨碍统一市场和公平竞争的政策措施修订或废止，切实打通制约市场循环的卡点堵点。\u003c/p\u003e\u003cp data-vmark=\"425f\"\u003e建立由市场监管、发改、司法、财政等 27 个部门组成的\u003cstrong\u003e联席会议制度\u003c/strong\u003e，推动公平竞争政策和产业政策协同互促。对涉及市场准入、要素获取、招标投标、政府采购等重点领域严格把关，防止构筑隐性壁","tags":[],"cluster_size":1,"ts":"2026-06-30T01:16:42"},{"id":6365,"title":"OpenAI 首款硬件：Codex 联名键盘 7 月登场，助力 AI 开发","url":"https://www.ithome.com/0/970/272.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"5a68\"\u003eIT之家 6 月 30 日消息，OpenAI 开发者官方账号今天（6 月 30 日）在 X 平台发布推文，预告将和 Work Louder 公司合作，\u003cstrong\u003e于 7 月 15 日上线 Codex 品牌的专用输入设备。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"bf3b\"\u003eOpenAI 目前正携手前苹果设计官乔纳森 · 埃维（Jony Ive）打造消费级 AI 硬件，代号为 Gumdrop，预估为笔形设备或可穿戴音频设备，最快 2026 年年底推出，而本次打造的 Codex 联名键盘将成为 OpenAI 首款硬件。\u003c/p\u003e\u003cp data-vmark=\"92c2\" style=\"text-align: center;\"\u003e\u003ca class=\"ithome_super_player\" contenteditable=\"false\" target=\"_blank\" href=\"https://weibo.com/tv/show/1034:5315428784734267?mid=5315428910108248\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/d84abcba-8423-4ffd-87e5-a905c7aa2cb5.jpg?x-bce-process","tags":[],"cluster_size":1,"ts":"2026-06-30T00:59:30"},{"id":6366,"title":"苹果：AI 加速网络攻击工具开发，因此将提前向用户发布 iOS 更新","url":"https://www.ithome.com/0/970/270.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"2cdd\"\u003eIT之家 6 月 30 日消息，据路透社 30 日（今天）凌晨报道，为应对 AI 加速网络攻击工具开发所带来的安全风险，苹果宣布，部分过去要等到新版 iOS 发布时才会推送的更新，将改为\u003cstrong\u003e提前向用户开放\u003c/strong\u003e。\u003c/p\u003e\u003cp data-vmark=\"2b72\"\u003e苹果解释称，AI 已经能够\u003cstrong\u003e显著加快恶意攻击工具的开发速度\u003c/strong\u003e，因此必须缩短\u003cstrong\u003e安全更新公开后到达用户设备\u003c/strong\u003e所需的时间。\u003c/p\u003e\u003cp data-vmark=\"7a0a\"\u003e据IT之家了解，长期以来，苹果的做法是\u003cstrong\u003e把安全补丁集中放进较大规模系统更新中\u003c/strong\u003e。苹果此次承认，AI 正在压缩攻击者利用已知漏洞的时间，安全修复也需要更快送达用户。\u003c/p\u003e\u003cp data-vmark=\"a1e5\"\u003e过去，除非安全专家发现有人利用未知漏洞发动攻击，否则苹果通常会\u003cstrong\u003e等到 iOS 版本升级时一并发布安全更新\u003c/strong\u003e，例如从目前的 iOS 26.5 升级到计划推出的 iOS 26.6。正式发布前，开发者和测试人员会先行试用新版本，并修复其中的问题。\u003c/p\u003e\u003cp data-vmark=\"2da2\" style=\"text-align: center;\"\u003e\u003cimg src=\"http","tags":[],"cluster_size":1,"ts":"2026-06-30T00:51:48"},{"id":6367,"title":"OpenAI 万亿市值IPO或于今年秋季启动 若市场崩盘则推迟至2027年 - Sina finance","url":"https://news.google.com/rss/articles/CBMijwFBVV95cUxNMkh1QnhXbkhaX3pNVHVDVDNXRWJmNkJpaUhjNXB0eWVyeGhvU2xFb0daZ1hVRTNJMW1OZVJTMzRJdmMyR0tPeWZ2YXlBMUhGdlBodFBJV0Jsbm93bXFKTVlIMlI0TlN1UmUyZmJESDdGX0xyZ2pNMW1mNEpzTzFjWU0tYTBqSTB1b2JNWkxiYw?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijwFBVV95cUxNMkh1QnhXbkhaX3pNVHVDVDNXRWJmNkJpaUhjNXB0eWVyeGhvU2xFb0daZ1hVRTNJMW1OZVJTMzRJdmMyR0tPeWZ2YXlBMUhGdlBodFBJV0Jsbm93bXFKTVlIMlI0TlN1UmUyZmJESDdGX0xyZ2pNMW1mNEpzTzFjWU0tYTBqSTB1b2JNWkxiYw?oc=5\" target=\"_blank\"\u003eOpenAI 万亿市值IPO或于今年秋季启动 若市场崩盘则推迟至2027年\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003eSina finance\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-30T00:51:00"},{"id":6368,"title":"联想预热 YOGA Pro 15 锐龙笔记本电脑，预计搭载 \"Strix Halo\"","url":"https://www.itho e":1,"ts":"2026-06-29T23:33:33"},{"id":6386,"title":"IT早报 0630：苹果 2027 年产品线曝光；韩国拟投 800 万亿韩元建半导体集群；DeepSeek V4 定档 7 月中旬；首部快递过度包装强制国标下月实施...","url":"https://www.ithome.com/0/970/250.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"218c\"\u003e“IT早报”时间，大家好，现在是 2026 年 6 月 30 日星期二，今天的重要科技资讯有：\u003c/p\u003e\u003ch2 data-vmark=\"124c\"\u003e1、苹果 2027 年产品线曝光，消息称 iPhone 19 Pro 系列、Ultra 2 阔折叠已开模测试\u003c/h2\u003e\u003cp data-vmark=\"6199\"\u003e博主 @数码闲聊站 6 月 29 日发文曝光了苹果 2027 年产品线。博主表示，iPhone 19 Pro 系列已开模测试、iPhone Ultra 2 阔折叠已开模测试。\u0026gt;\u0026gt; \u003ca href=\"https://www.ithome.com/0/969/886.htm\" target=\"_blank\"\u003e查看详情\u003c/a\u003e\u003c/p\u003e\u003ch2 data-vmark=\"0e65\"\u003e2、韩国拟投 800 万亿韩元推进半导体集群建设，三星、SK 海力士各规划两座晶圆厂\u003c/h2\u003e\u003cp data-vmark=\"4926\"\u003e韩国宣布未来将投资约 800 万亿韩元（约合 3.52 万亿元人民币）在西南地区建设四座半导体晶圆厂，三星和 SK 海力士各负责两座。同时计划未来 15 年投入 30 万亿韩元研发下一代存储技术，以应对 AI 带来的芯片需求爆炸性增长。\u0026gt;\u0026gt; \u003ca href=\"https://www.ithome.com/0/969/","tags":[],"cluster_size":1,"ts":"2026-06-29T23:28:35"},{"id":6387,"title":"港股早报 | DeepSeek V4正式版将上线并引入高峰定价 名创优品拟20亿港元大手笔回购 - 财联社","url":"https://news.google.com/rss/articles/CBMiSEFVX3lxTFBZdkpYM2RIZnl0aFhKYzVJNVdwMy1qV2djaG9UWEJUOWs5ZmdlVHVCTUd5Ql9NQVF3bDRsWnlzNG92cmI4dml3Yg?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiSEFVX3lxTFBZdkpYM2RIZnl0aFhKYzVJNVdwMy1qV2djaG9UWEJUOWs5ZmdlVHVCTUd5Ql9NQVF3bDRsWnlzNG92cmI4dml3Yg?oc=5\" target=\"_blank\"\u003e港股早报 | DeepSeek V4正式版将上线并引入高峰定价 名创优品拟20亿港元大手笔回购\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e财联社\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T23:23:00"},{"id":6388,"title":"郭明錤：苹果寻求采购长鑫存储内存原因，是内存供需缺口持续扩大至明年","url":"https://www.ithome.com/0/970/246.htm","source":"IT之家","sources":["IT之家"],"summary":"\u003cp data-vmark=\"6f24\"\u003eIT之家 6 月 30 日消息，天风国际证券分析师郭明錤昨日（6 月 29 日）在 X 平台发布推文，指出苹果公司游说美国政府，\u003ca href=\"https://www.ithome.com/0/969/651.htm\" target=\"_blank\"\u003e寻求采购长鑫存储内存芯片\u003c/a\u003e，\u003cstrong\u003e其真正原因在于内存供需缺口将持续扩大至 2027 年。\u003c/strong\u003e\u003c/p\u003e\u003cp data-vmark=\"2fec\"\u003e郭明錤预估在 2026 年分配给消费电子的内存容量中，预计有 15~20% 将在 2027 年转向数据中心，且这一比例可能进一步增长。\u003c/p\u003e\u003cp data-vmark=\"e9a2\"\u003e由于内存（LPDDR）供应紧张，苹果在 2026 年下半年至 2027 年第一季度 A20 芯片的实际提前拉货量可能比原目标低 10–20%（尽管其中部分可能反映苹果自身的超额预订）。IT之家附上相关截图如下：\u003c/p\u003e\u003cp data-vmark=\"1df1\" style=\"text-align: center;\"\u003e\u003cimg src=\"https://img.ithome.com/newsuploadfiles/2026/6/788fc4eb-cac3-40df-8ae9-b02e17fa6873.png\" w=\"798\" h=\"1184\" d","tags":[],"cluster_size":1,"ts":"2026-06-29T23:00:11"},{"id":6389,"title":"格瑞AI仿生学智慧环境调控智能体， 让“数字健康”覆盖居家、用药、食品多场景 - 搜狐网","url":"https://news.google.com/rss/articles/CBMihAJBVV95cUxNcTRpYWRIMk5qMG9BS1h4b1ZvdWNuR3NnQ181SXpPQ2pKaTUtZTBsdzMzRDIyQWxCZklnLTJWU0c1cXBKLXE4eV9TcGZkeWVDNWNNeTREUXg1MXdBREpxNDVVR2FRY25FOXNtX1d1VGt3bUpyN1hhMHVadlBVY3V1bUZMelRpMnpnNkItSzFDNnZLc3lpR2NBa3NhdW5IRGJDajFad0lTdjlhUWg5clJycGk1VEY2Y1lGdnNodTZhVHFmQTkzRDNvdmNxUHh0cUF4Uk1hUGFNemR3UHFYM2Q0bG83bThudGxvaFptX0ZWQTQ5VVVhbkgwR0ZKOXN4cXN5VDVHNA?oc=5","source":"GNews · AI关键词","sources":["GNews · AI关键词"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMihAJBVV95cUxNcTRpYWRIMk5qMG9BS1h4b1ZvdWNuR3NnQ181SXpPQ2pKaTUtZTBsdzMzRDIyQWxCZklnLTJWU0c1cXBKLXE4eV9TcGZkeWVDNWNNeTREUXg1MXdBREpxNDVVR2FRY25FOXNtX1d1VGt3bUpyN1hhMHVadlBVY3V1bUZMelRpMnpnNkItSzFDNnZLc3lpR2NBa3NhdW5IRGJDajFad0lTdjlhUWg5clJycGk1VEY2Y1lGdnNodTZhVHFmQTkzRDNvdmNxUHh0cUF4Uk1hUGFNemR3UHFYM2Q0bG83bThudGxvaFptX0ZWQTQ5VVVhbkgwR0ZKOXN4cXN5VDVHNA?oc=5\" target=\"_blank\"\u003e格瑞AI仿生学智慧环境调控智能体， 让“数字健康”覆盖居家、用药、食品多场景\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e搜狐网\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T22:57:16"},{"id":6390,"title":"Anthropic商业化加速：Claude全面上线微软Azure平台，英伟达Blackwell提供底层算力 - 富途牛牛","url":"https://news.google.com/rss/articles/CBMixAFBVV95cUxQWEk0czROY19FMktpd1ZsRk1tZGJ0bjFMZzFHeVVVbHQtMF9udnlkYl rate manipulation skills by decomposing dexterous skills into multiple simpler/analyzable components. Each s","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6232,"title":"PA-BiCoop: A Primary-Auxiliary Cooperative Framework for General Bimanual Manipulation","url":"https://arxiv.org/abs/2606.28192","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28192v1 Announce Type: new \nAbstract: Bimanual manipulation is essential for advanced robotic systems because it offers higher efficiency and flexibility compared to single-arm configurations. However, existing approaches either lack inter-arm interaction or ignore the need for a dynamic division of labor, treating the arms as functionally equivalent. To address these limitations, this paper draws inspiration from human bimanual manipulation where one arm handles core operations and the other provides auxiliary support, and proposes PA-BiCoop, a new single-model bimanual cooperation","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6231,"title":"Translation as a Bridging Action: Transferring Manipulation Skills from Humans to Robots","url":"https://arxiv.org/abs/2606.28133","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.28133v1 Announce Type: new \nAbstract: We study whether we can learn novel manipulation skills from human actions to a bi-manual robot with parallel grippers. Human action data is cheap, abundant, and diverse, making it one of the most promising resources for scaling up robot learning. Yet transferring skills from humans to robots remains hard: most prior work treats humans as just another bi-manual 6DoF embodiment, where hand-pose estimates are noisy and the contact patterns of human fingers differ fundamentally from those of a parallel gripper. We argue that learning rotation-inclu","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6230,"title":"Building a Scalable, Reproducible, Evaluatable, and Closed-Loop Simulation Environment Foundation for Embodied Intelligence Cloud-Native Simulation Infrastructure for Embodied Intelligence Training, Evaluation, and Data Collection","url":"https://arxiv.org/abs/2606.27962","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27962v1 Announce Type: new \nAbstract: This paper presents a cloud-native simulation infrastructure framework for embodied intelligence that supports large-scale training, standardized evaluation, and simulation-based data collection. The framework unifies simulation environment generation, task execution, trajectory collection, model evaluation, data management, and cloud services into a scalable and reproducible platform.\n  To address the high cost, limited scalability, and poor reproducibility of real-world robotic data collection, the framework adopts cloud-native technologies in","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6229,"title":"When Multi-Robot Systems Meet Agentic AI:Towards Embodied Collective Intelligence","url":"https://arxiv.org/abs/2606.27929","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27929v1 Announce Type: new \nAbstract: Embodied AI is increasingly becoming agentic, shifting robots from perception--control pipelines towards closed-loop systems that can retrieve context, deliberate during execution, monitor feedback, and refine future behavior. In parallel, robotics research has also moved from single-robot autonomy towards multi-robot systems, driven by the need for wider sensing, distributed action, heterogeneous capabilities, and fault tolerance. As AI agents move from single-agent use towards multi-agent collaboration, robotics faces a parallel challenge: rob","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6228,"title":"Swarm sign language: motion-based communication between drones","url":"https://arxiv.org/abs/2606.27883","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27883v1 Announce Type: new \nAbstract: In stealth-constrained swarm robotics, visual communication provides a critical alternative to active radio transmissions, which might be jammed. This research investigates motion-based communication for non-active information exchange, utilizing modular, dynamically feasible planar trajectories as visual cues. On the receiver drone end, a pose estimator tracks the transmitting drone's pose, feeding it into our custom 3DTrajDecoder. The decoder is designed to classify and segment the spatiotemporal sequence while simultaneously regressing its si","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6227,"title":"S$^2$-VLA: State-Space Guided Vision-Language-Action Models for Long-Horizon Manipulation","url":"https://arxiv.org/abs/2606.27872","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27872v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have demonstrated strong capabilities in robotic manipulation, but their performance degrades significantly in long-horizon tasks due to cumulative error propagation. This limitation largely arises from static feature fusion mechanisms that rely on fixed weights to combine visual, language, and action representations, preventing the model from adapting to different phases of task execution. To address this limitation, we propose S$^2$-VLA, a framework that introduces a State-Space Guided Adaptive Attention (SS","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6226,"title":"LocalNav: Distilling Frontier VLMs and Embodied RL for On-Device Object Goal Navigation","url":"https://arxiv.org/abs/2606.27871","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27871v1 Announce Type: new \nAbstract: Vision Language Models (VLMs) have emerged in the robotic domain as a powerful tool that enables environmental perception with language context, serving as a catalyst for open-vocabulary tasks like ObjectNav. Yet, their computational footprint typically confines them to cloud execution, hindering low-latency inference with local deployment on resource-constrained robots. To address this challenge, we present a distillation strategy that transfers complex spatial-semantic reasoning from large frontier models into a lightweight, 4B-parameter local","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6225,"title":"PPO-EAL: Exact Augmented Lagrangian Proximal Policy Optimization for Safe Robotic Control","url":"https://arxiv.org/abs/2606.27861","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27861v1 Announce Type: new \nAbstract: Reinforcement learning (RL) has emerged as a promising solution to accomplish complex robotic control tasks; however, most of the current work ignores the safety requirements. Safe RL seeks to maximize task performance while satisfying explicit physical constraints, but current algorithms struggle to learn the policy efficiently with precise constraint satisfaction. This work proposes PPO-EAL, a novel first-order constrained policy optimization framework that integrates exact augmented Lagrangian optimization into proximal policy optimization fo","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6224,"title":"Booster Lab: A Data-Centric Pipeline for Learning Deployable Humanoid Locomotion Policies","url":"https://arxiv.org/abs/2606.27813","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27813v1 Announce Type: new \nAbstract: Humanoid robot motion learning requires not only task-oriented control policies but also physically feasible and natural behaviors that can be transferred to real robots. However, robot-feasible motion data are often scarce: raw human demonstrations may be incompatible with the robot morphology, open-source clips vary in quality, and simulation-collected robot trajectories still require feasibility checking. To address these challenges, we propose a data-centric training and deployment pipeline that integrates motion data curation, real-to-sim m","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6223,"title":"SpikeVLA: Vision-Language-Action Models with Spiking Neural Networks","url":"https://arxiv.org/abs/2606.27807","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27807v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models have become a dominant paradigm for embodied intelligence. However, most existing approaches are built on large-scale transformers, resulting in substantial inference latency and energy consumption that limit their practical deployment in low-power, real-time scenarios. We propose SpikeVLA, a spiking VLA architecture for embodied navigation with energy-efficient inference, consisting of three key components. (i) A spiking vision encoder, Spike-V, that replaces dense continuous layers with event-driven spiking","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6222,"title":"Drop-Then-Recovery: How Redundant Are Vision-Language-Action Models?","url":"https://arxiv.org/abs/2606.27755","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27755v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models enable instruction-driven robotic manipulation, but they inherit oversized language backbones from pretrained VLMs whose capacity far exceeds what is needed for short robotic instructions. This raises a basic question: how much of a VLA model is actually necessary for closed-loop control? In this work, we study architectural redundancy in VLA models by using transformer block removal as a controlled intervention. We introduce \\textbf{Drop-Then-Recovery (DTR)}, an analysis protocol that removes selected blocks","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6221,"title":"DIM-WAM: World-Action Modeling with Diverse Historical Event Memory","url":"https://arxiv.org/abs/2606.27677","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27677v1 Announce Type: new \nAbstract: World-action models have shown promising robot-manipulation performance by jointly predicting future visual states and actions. However, existing methods mainly rely on short-term history and short-horizon future prediction, which is insufficient for long-horizon tasks whose correct execution depends on earlier observations and task progress. Such temporally dependent tasks require effective use of complementary temporal information, including recent local context, cross-stage historical events, immediate future dynamics, and global task progres","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6220,"title":"CWI: Composite Humanoid Whole-Body Imitation System for Loco-manipulation","url":"https://arxiv.org/abs/2606.27676","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27676v1 Announce Type: new \nAbstract: Achieving everyday tasks with humanoid robots requires coordinating stable locomotion with versatile manipulation. However, existing whole-body controllers still face significant challenges. Methods trained solely via command sampling, without motion-capture (MoCap) data, often struggle with sparse rewards and require carefully tuned curricula to converge. This is especially problematic for upper-body control, where the resulting motions deviate from human-like statistics and degrade whole-body coordination. Conversely, approaches that imitate f","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6219,"title":"Direct Action-Head Injection of A Grounded 3D Point Unlocks Spatial and Task Generalization","url":"https://arxiv.org/abs/2606.27663","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27663v1 Announce Type: new \nAbstract: Vision-Language-Action (VLA) models leverage large-scale vision-language pretraining for flexible robot manipulation, yet at test time they remain brittle along two axes: spatial generalization, when object positions differ from those seen during training, and task generalization, when a familiar scene is paired with a different language instruction than the one seen in training. A growing family of methods addresses this brittleness by endowing a policy with the spatial and task-aware information such as 2D pixel-coordinate for object localizat","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6218,"title":"P-ARC: Exploiting Subproblem Independence for Parallel Multi-Robot Motion Planning","url":"https://arxiv.org/abs/2606.27625","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27625v1 Announce Type: new \nAbstract: This paper presents Parallel ARC (P-ARC), a parallel variant of the Adaptive Robot Coordination (ARC) approach to multi-robot motion planning (MRMP). P-ARC proposes a parallel variant for each of the three main stages in ARC: initial individual solutions, conflict detection, and conflict resolution, exploiting the independence created by ARC's decomposition of the MRMP problem. Additionally, we employ an OR-parallel multi-start strategy to both ARC and P-ARC, creating a hybrid parallel strategy OR-P-ARC. We evaluate the impact of the different p","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6217,"title":"Physics-Guided Robotic Radiation Source Localization along Arbitrary Measurement Paths in Unstructured Environments","url":"https://arxiv.org/abs/2606.27624","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27624v1 Announce Type: new \nAbstract: Using robots to estimate the location of the radiation source is an effective way to improve efficiency and safety. Existing methods focus on planning the robot's path to achieve precise estimation, typically approaching the source. However, approaching the source increases the risk of radiation damage to a robot. In addition, a path-planning algorithm designed solely for radiation source localization (RSL) limits the flexibility of missions that deploy robots into radioactive environments. This study presents an automation framework for robotic","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6216,"title":"Learning to Throw: Agile and Accurate Cable-Suspended Payload Delivery with a Quadrotor","url":"https://arxiv.org/abs/2606.27603","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27603v1 Announce Type: new \nAbstract: Quadrotors offer the agility needed to rapidly transport suspended payloads during time-critical applications, including search-and-rescue and medical delivery. While suspended-payload transport and traversal for these missions are well studied, the highly dynamic targeted release of the payload remains comparatively underexplored. State-of-the-art approaches typically rely on model-based trajectory optimization and tracking; however, these methods often yield sub-optimal performance due to conservative feasibility constraints, tracking errors,","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6215,"title":"SceneBot: Contact-Prompted General Humanoid Whole Body Tracking with Scene-Interaction","url":"https://arxiv.org/abs/2606.27581","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27581v1 Announce Type: new \nAbstract: Current humanoid reinforcement-learning policies excel at free-space motions but struggle with contact-rich tasks, as pure kinematic tracking cannot resolve the physical ambiguities of interacting with objects and uneven terrain. To address this, we introduce SceneBot, a unified motion-tracking framework capable of handling freespace locomotion, terrain traversal, and whole-body manipulation. SceneBot conditions a single policy on both reference motions and per-link contact labels, explicitly defining expected environmental interactions. To over","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6214,"title":"Spacecraft Fiducial Marker for Autonomous Rendezvous, Proximity Operations, and Docking","url":"https://arxiv.org/abs/2606.27566","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27566v1 Announce Type: new \nAbstract: Robotic operations in space are challenging due to the harsh environment and the high cost of failure. Fiducial markers provide visual references that aid autonomous rendezvous, proximity operations, and docking for space robots. However, existing fiducial markers are mostly single-scale and largely designed for terrestrial robotics. Such markers leave the camera's field of view at close range, precisely during the proximity and docking phases where reliable tracking is most critical. This paper presents AstraTag, a fiducial marker designed for","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6213,"title":"AO-ARC: Almost-Surely Asymptotically Optimal Multi-Robot Motion Planning with ARC","url":"https://arxiv.org/abs/2606.27495","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27495v1 Announce Type: new \nAbstract: We present AO-ARC, an anytime multi-robot motion planning (MRMP) method that achieves initial solution times on par with state-of-the-art MRMP feasibility solvers while converging faster and more reliably than existing anytime MRMP methods as the number of robots increases. AO-ARC adapts the AO-x meta-algorithm for converting feasibility solvers into anytime algorithms by iteratively calling the original ARC method on bounded MRMP instances under a makespan cost metric. This exploits the adaptive (de)coupling of ARC while maintaining the consist","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6212,"title":"Support-Constrained RL Enables Real-World Policy Improvement without Real-World Experience","url":"https://arxiv.org/abs/2606.27475","source":"arxiv · cs.RO","sources":["arxiv · cs.RO"],"summary":"arXiv:2606.27475v1 Announce Type: new \nAbstract: Robots trained on real world data tend to be imprecise, slow, and brittle to perturbations. Improving these policies with reinforcement learning (RL) is an appealing alternative, but this process often requires expensive training in the real world. Performing policy improvement in simulation instead provides a far cheaper alternative, but unconstrained RL in simulation can exploit contact and dynamics mismatches, resulting in unsafe behaviors that do not transfer to hardware. Common forms of regularization can furthermore limit improvement by ov","tags":[],"cluster_size":1,"ts":"2026-06-29T04:00:00"},{"id":6235,"title":"【原创】从特斯拉Optimus量产看人形机器人核心关节国产化机遇 | 2026EVH第二届具身智能机器人产业大会PPT - 电子工程专辑","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE5SLW1EdmVUVGh0TW5JNzRWZkxxSk05b3NCQm5HMUNyeXFabEJZSlhWVzM0NW5CUTg2TGFMeEMxUkFRQU03ZGNTQ3B2Sjh0Rkk2bExV?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE5SLW1EdmVUVGh0TW5JNzRWZkxxSk05b3NCQm5HMUNyeXFabEJZSlhWVzM0NW5CUTg2TGFMeEMxUkFRQU03ZGNTQ3B2Sjh0Rkk2bExV?oc=5\" target=\"_blank\"\u003e【原创】从特斯拉Optimus量产看人形机器人核心关节国产化机遇 | 2026EVH第二届具身智能机器人产业大会PPT\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont color=\"#6f6f6f\"\u003e电子工程专辑\u003c/font\u003e","tags":[],"cluster_size":1,"ts":"2026-06-29T03:20:00"},{"id":6236,"title":"绑定特斯拉Optimus核心供应链，新剑传动创业板IPO获受理 - 搜狐网","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxNdlRMamJnLW5nUmhBblJ0eW4xNkVQMjFEWTN4RGZTN3pEMDRWczBJTWRFMk8yQmtaaTh1X3AtWHVLcXVWSGdLMjNPNV9sQUFYc2lDZDRha1oya0lkRUNrX29taEtHb0p4bk1hVDM3MlJnUEZjNUxUV2pQRFBtNlIzamRaV0gxa3FIekdCQQ?oc=5","source":"GNews · 中文机器人","sources":["GNews · 中文机器人"],"summary":"\u003ca href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxNdlRMamJnLW5nUmhBblJ0eW4xNkVQMjFEWTN4RGZTN3pEMDRWczBJTWRFMk8yQmtaaTh1X3AtWHVLcXVWSGdLMjNPNV9sQUFYc2lDZDRha1oya0lkRUNrX29taEtHb0p4bk1hVDM3MlJnUEZjNUxUV2pQRFBtNlIzamRaV0gxa3FIekdCQQ?oc=5\" target=\"_blank\"\u003e绑定特斯拉Optimus核心供应链，新剑传动创业板IPO获受理\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003cfont colo // Tag color palette — 和实时仪表盘 (app/static/index.html) 那套保持一致,
// 这样用户切来切去不会觉得标签颜色对不上号。
const TAG_PALETTE = [
  ["bg-emerald-50",  "text-emerald-700",  "border-emerald-200"],
  ["bg-sky-50",      "text-sky-700",      "border-sky-200"],
  ["bg-amber-50",    "text-amber-700",    "border-amber-200"],
  ["bg-fuchsia-50",  "text-fuchsia-700",  "border-fuchsia-200"],
  ["bg-violet-50",   "text-violet-700",   "border-violet-200"],
  ["bg-rose-50",     "text-rose-700",     "border-rose-200"],
  ["bg-cyan-50",     "text-cyan-700",     "border-cyan-200"],
  ["bg-lime-50",     "text-lime-700",     "border-lime-200"],
];
function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return TAG_PALETTE[Math.abs(h) % TAG_PALETTE.length].join(" ");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  const diffSec = (Date.now() - d.getTime()) / 1000;
  if (diffSec < 60) return `${Math.max(1, Math.round(diffSec))} 秒前`;
  if (diffSec < 3600) return `${Math.round(diffSec / 60)} 分钟前`;
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)} 小时前`;
  if (diffSec < 86400 * 7) return `${Math.round(diffSec / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

// ----- State (in URL hash) -----
// 用 hash 而不是 query string, 因为 GitHub Pages 重新发布时浏览器会
// 重新请求页面; hash 不参与请求, 不会让用户掉到 "?board=xxx" 上加载失败。
//
// state = { board: "all" | <key>, tags: Set<string>, q: string }
const state = { board: "all", tags: new Set(), q: "" };

function parseHash() {
  const raw = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(raw);
  state.board = params.get("board") || "all";
  state.tags = new Set((params.get("tags") || "")
    .split(",").map(s => s.trim()).filter(Boolean));
  state.q = params.get("q") || "";
}

function syncHash() {
  const params = new URLSearchParams();
  if (state.board && state.board !== "all") params.set("board", state.board);
  if (state.tags.size) params.set("tags", Array.from(state.tags).join(","));
  if (state.q) params.set("q", state.q);
  const next = params.toString();
  // 用 replaceState 避免每次切换都污染 history 栈 (移动端体验更顺)
  if (next) {
    history.replaceState(null, "", "#" + next);
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}

// ----- Pure helpers -----
function activeBoardKeys() {
  if (state.board === "all") return DATA.boards.map(b => b.key);
  return [state.board];
}

// 返回 [{board, article}, ...] (扁平化, 方便统一搜索/过滤)
function visibleArticles({ ignoreTags = false } = {}) {
  const keys = new Set(activeBoardKeys());
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) {
      // tag filter (OR; ignore for tag-count recompute)
      if (!ignoreTags && state.tags.size) {
        const at = a.tags || [];
        let hit = false;
        for (const t of at) { if (state.tags.has(t)) { hit = true; break; } }
        if (!hit) continue;
      }
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ board: b, article: a });
    }
  }
  // 按时间倒序 (跨板块混合时也要保证最新在前)
  out.sort((x, y) => (y.article.ts || "").localeCompare(x.article.ts || ""));
  return out;
}

// ----- Renderers -----
function renderBoardTabs() {
  const wrap = document.getElementById("board-tabs");
  const items = [{ key: "all", name: "全部", color: "#475569",
                    count: DATA.boards.reduce((s, b) => s + b.articles.length, 0) }];
  for (const b of DATA.boards) {
    items.push({ key: b.key, name: b.name, color: b.color, count: b.articles.length });
  }
  wrap.innerHTML = items.map(it => {
    const active = (it.key === state.board);
    const cls = active
      ? "bg-slate-900 text-white border-slate-900"
      : "bg-white text-slate-700 border-slate-200 hover:border-slate-400";
    const dot = active
      ? ""
      : `<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle"
              style="background:${it.color}"></span>`;
    return `<button data-key="${it.key}"
       class="board-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-full border ${cls}">
       ${dot}${escapeHtml(it.name)}
       <span class="ml-1 opacity-70">${it.count}</span>
    </button>`;
  }).join("");
  wrap.querySelectorAll(".board-tab").forEach(el => {
    el.addEventListener("click", () => {
      if (state.board === el.dataset.key) return;
      state.board = el.dataset.key;
      state.tags.clear();  // 切板时清空 tag (每个板有自己的 tag vocab)
      syncHash(); renderAll();
    });
  });
}

function tagsForActiveBoard() {
  // 把当前可见板块下文章上**实际出现过**的 tag 全部收集; 这样 chip 显示的
  // 都是真的有内容的标签, 不会出现 "点了却 0 结果" 的死标签。
  const keys = new Set(activeBoardKeys());
  const set = new Set();
  // 单个板时, 也把 board 配置里的 tag vocab 加进来 (即使本次没文章命中);
  // 防御没文章时 chip bar 完全空白看着奇怪。
  if (state.board !== "all") {
    const b = DATA.boards.find(x => x.key === state.board);
    if (b) for (const t of (b.tags || [])) set.add(t);
  }
  for (const b of DATA.boards) {
    if (!keys.has(b.key)) continue;
    for (const a of b.articles) for (const t of (a.tags || [])) set.add(t);
  }
  return Array.from(set).sort();
}

function renderTagBar() {
  const bar = document.getElementById("tag-bar");
  const tags = tagsForActiveBoard();
  if (!tags.length) { bar.innerHTML = ""; return; }

  // 标签计数: 复用 visibleArticles({ignoreTags: true}) 的结果 (仍然受
  // board / 搜索影响) 来重新算每个 tag 的命中数; 这样切板 / 改关键词时
  // 数字会跟着变, 跟谷歌图片 / 邮箱标签筛选体验一致。
  const pool = visibleArticles({ ignoreTags: true });
  const counts = new Map();
  for (const { article } of pool) {
    for (const t of (article.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const totalAll = pool.length;

  const allCls = state.tags.size === 0
    ? "bg-slate-900 text-white border-slate-900"
    : "bg-white text-slate-600 border-slate-200 hover:border-slate-400";
  const chips = [`<button data-tag="" class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${allCls}">全部 <span class="opacity-70">(${totalAll})</span></button>`];

  for (const t of tags) {
    const active = state.tags.has(t);
    const base = tagClass(t);
    const cls = active
      ? `${base} ring-2 ring-offset-1 ring-slate-900`
      : `${base} hover:brightness-95`;
    const n = counts.get(t) || 0;
    chips.push(`<button data-tag="${escapeHtml(t)}"
      class="tag-chip px-2 py-0.5 rounded-full text-[11px] border ${cls}">
      ${escapeHtml(t)} <span class="opacity-70">(${n})</span>
    </button>`);
  }
  bar.innerHTML = chips.join("");
  bar.querySelectorAll(".tag-chip").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (!t) { state.tags.clear(); }
      else if (state.tags.has(t)) { state.tags.delete(t); }
      else { state.tags.add(t); }
      syncHash(); renderAll();
    });
  });
}

function renderArticles() {
  const list = document.getElementById("article-list");
  const empty = document.getElementById("empty-state");
  const meta = document.getElementById("active-meta");

  const rows = visibleArticles();
  if (!rows.length) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    meta.textContent = "";
    return;
  }
  empty.classList.add("hidden");

  const boardName = state.board === "all"
    ? "全部板块"
    : (DATA.boards.find(b => b.key === state.board) || {name: state.board}).name;
  const tagPart = state.tags.size
    ? ` · 标签 ${Array.from(state.tags).map(escapeHtml).join(" / ")}`
    : "";
  const qPart = state.q ? ` · 搜索 “${escapeHtml(state.q)}”` : "";
  meta.textContent = `${boardName} · ${rows.length} 条${tagPart}${qPart}`;

  list.innerHTML = rows.map(({ board, article: a }) => {
    const url = a.url ? escapeHtml(a.url) : "";
    const isLink = !!a.url;

    // badges 排在标题前: 多源徽章 + 板块色点 + tag chips。tag chip 与
    // 主 tag bar 复用 tagClass(), 颜色一致。
    const badges = [];
    if (a.cluster_size > 1) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-medium">📰 ${a.cluster_size} 源</span>`);
    }
    if (state.board === "all") {
      badges.push(`<span class="inline-flex items-center gap-1 text-[10px] text-slate-500">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${board.color}"></span>
        ${escapeHtml(board.name)}
      </span>`);
    }
    for (const t of (a.tags || [])) {
      badges.push(`<span class="inline-flex items-center px-1.5 py-0.5 rounded-full border text-[10px] ${tagClass(t)}">${escapeHtml(t)}</span>`);
    }

    const summary = a.summary
      ? `<div class="mt-1 text-[13px] text-slate-600 line-clamp-3">${escapeHtml(a.summary)}</div>`
      : "";

    // source line: cluster_size > 1 时显示 "N sources: A · B · C"
    let srcText = "";
    if (a.cluster_size > 1 && (a.sources || []).length > 1) {
      srcText = `${a.cluster_size} sources: ${a.sources.map(escapeHtml).join(" · ")}`;
    } else if (a.source) {
      srcText = escapeHtml(a.source);
    } else if ((a.sources || []).length) {
      srcText = escapeHtml(a.sources[0]);
    }

    const when = fmtTime(a.ts);
    const footMeta = [srcText, when].filter(Boolean).join(" · ");

    // 整卡片可点 (链接覆盖整张卡), 用 ``<a>`` 包 inner 区, 但 inner 区里的
    // <span> 都不抢点击; 这样点 tag 才不至于跳走。
    const inner = `
      <div class="flex flex-wrap items-center gap-1.5">${badges.join("")}</div>
      <h2 class="mt-1.5 text-[15px] font-medium leading-snug text-slate-900 line-clamp-3">${escapeHtml(a.title)}</h2>
      ${summary}
      <div class="mt-2 text-[11px] text-slate-500">${footMeta || "&nbsp;"}</div>
    `;
    if (isLink) {
      return `<a href="${url}" target="_blank" rel="noopener"
        class="block bg-white border border-slate-200 rounded-lg p-3
               hover:border-slate-300 hover:shadow-sm transition active:scale-[0.997]">${inner}</a>`;
    }
    return `<div class="bg-white border border-slate-200 rounded-lg p-3">${inner}</div>`;
  }).join("");
}

function renderAll() {
  document.getElementById("meta-generated").textContent = DATA.generated_at_display;
  document.getElementById("footer-generated").textContent = DATA.generated_at_display;
  document.getElementById("meta-total").textContent = DATA.total;
  renderBoardTabs();
  renderTagBar();
  renderArticles();
}

// ----- Wire up -----
window.addEventListener("hashchange", () => {
  parseHash();
  const searchEl = document.getElementById("search");
  if (searchEl.value !== state.q) searchEl.value = state.q;
  renderAll();
});

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value || "";
  syncHash(); renderAll();
});

// init
parseHash();
document.getElementById("search").value = state.q;
renderAll();
</script>
</body>
</html>
